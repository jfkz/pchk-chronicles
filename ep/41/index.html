<script>window.EPD = {"anim": false, "key": "41", "label": "41", "title": "Гонка за желанием", "date": "2025-08-31", "minutes": 146, "duration": 8745.0, "video_id": "6USQ969nMPI", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Гоночная трасса через Понию: Розовый пляж, таверна Кабарга у Вёрджинвальда, хрустальный мост с мыса Бакштак, оазис Шиш Кебаб", "short_html": "Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> устраивает гонку через всю <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a>, и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с командой рвётся к желанию на адском <a class=\"ref\" href=\"/a/demonovoz/\">Демоновозе<\/a>.", "summary_html": "Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a>, освобождённый когда-то крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, празднует день свободы гонкой на выживание через всю <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a> до оазиса <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a>; победитель получит одно желание. Падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, не сумевший остановить демоническое нашествие, собирает «команду разнообразия» и решает загадать желание, которое спасёт мир. Получив от перекупщика развалюху, команда внушением меняется машинами с демонами и мчится на адском «<a class=\"ref\" href=\"/a/demonovoz/\">Демоновозе<\/a>», топка которого работает на душах: по пути герои сжигают пленных алхимиков, убивают демонов и тайно вырезают гномов из команды «Дымка». Благодаря срезке, подсказанной благодарным тавернщиком из <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>, и критическому броску на последнем повороте Демоновоз первым проходит хрустальный мост и финиширует в Шиш Кебабе. Сфинктерион желает, чтобы джин открыл портал из земного мира в небесный — чтобы демоническая армия ушла туда и оставила людей в покое; джин щёлкает пальцами — «сделано».<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Омоложение Мелиссы было раньше гонки — выпуски переставлены\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Омоложение Мелиссы было раньше гонки — выпуски переставлены<\/b> Хронологически <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> искупалась в ванне немного раньше, чем <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> загадал желание: выпуск о Мелиссе снимали первым, а при показе выпуски 41 и 42 поменяли местами. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=8026\" target=\"_blank\" rel=\"noopener\">2:13:46 ↗<\/a> · <a href=\"#qa41-42-41\">к записи<\/a><\/span><\/span>", "outcome_html": "Команда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> выиграла гонку ценой множества сожжённых и убитых соперников. Джин открыл портал с земли на небеса, чтобы демоническая армия ушла туда.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Победа «на тоненького»: монеты не влияли на скорость\">8<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Победа «на тоненького»: монеты не влияли на скорость<\/b> Мастер был готов к поражению героев: тогда желание исполнилось бы другим, а с героями ничего бы не случилось. Монетами можно было перебрасывать только прохождение поворотов, но не кубики скорости, а машина у героев была не самой быстрой, так что выиграли они с минимальным запасом. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 ↗<\/a> · <a href=\"#qa41-42-34\">к записи<\/a><\/span><\/span>", "world_html": ["Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> открыл портал из земного мира в небесный — путь для демонической армии с земли", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> снова популярен в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a>, хотя внешне стал похож на демона", "Возможное пробуждение небесных богов (вопрос эпилога)"], "scenes": [{"t": "0:05:14", "sec": 314, "html": "Пролог (голосом эльфа <a class=\"ref\" href=\"/c/los-uskomanos/\">Лозуса Каманоса<\/a>): желание <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> — смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — исполнил <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>; <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад и вернулся демонической цитаделью; Сфинктерион присягнул Тёмному Властелину и дважды не смог добыть божественный сосуд для духа мщения; демоны лавиной обрушились на <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a>.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Баланс сил: артефакты против числа, Гиммилут сам за себя\">9<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Баланс сил: артефакты против числа, Гиммилут сам за себя<\/b> У божественной стороны больше найденных артефактов, у демонов — численность. Самая интересная фигура — дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>: он пока ни за кого, только за себя, и после золотой маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспехов стал почти непобедимым. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 ↗<\/a> · <a href=\"#qa41-42-35\">к записи<\/a><\/span><\/span>"}, {"t": "0:07:56", "sec": 476, "html": "Завязка: джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> тысячи лет сидел в бутылке, служил тёмному эльфу <a class=\"ref\" href=\"/c/halif-timuras/\">Теймуразу<\/a> (тот загадал лишь два желания из трёх), освобождён <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, теперь правит созданным им оазисом <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> как султан. В этом году вместо бинго он устраивает гонку с востока на запад <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>; приз — желание.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гонку придумали под рекламодателя\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гонку придумали под рекламодателя<\/b> Гоночный выпуск появился из-за интеграции «Авито Автотеки», но концепцию авторы придумали сами. Желание джинна задумали как рифму к выпуску, где крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, с которой всё началось: ограничений на то, чтобы загадать ещё одно желание, не было. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5840\" target=\"_blank\" rel=\"noopener\">1:37:20 ↗<\/a> · <a href=\"#qa41-42-29\">к записи<\/a><\/span><\/span>"}, {"t": "0:09:14", "sec": 554, "html": "–[0:15:14] Представление: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет повторить «подвиг крысы» и одним желанием спасти мир; Лозус служит ему по присяге и оправдывает союз с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>; Коктобеус погиб, разыскивая Лозуса, и его останки Лозус везёт хоронить в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>; <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> мечтает снова «помяться на груди Ирэн Твёрдой»; <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> хочет доказать гномам Змея Хрустального, что тифлинг может быть инженером, и загадать «универсальный гаечный ключ».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Будущая команда Сфинктериона: подходит Лос Ускаманос\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Будущая команда Сфинктериона: подходит Лос Ускаманос<\/b> Авторы спросили <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, готов ли он играть <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с новой идеологией или тот станет NPC. BRB готов. Обсуждали, кто войдёт в его команду. Беса Мишу отвергли (ему нужны земные наслаждения), а <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> подходит: он верен Сфинктериону, симпатизировал жрецам, и его судьба после падения неизвестна. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что сыграет за «тёмную» сторону, если ему пропишут мотивацию. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=4540\" target=\"_blank\" rel=\"noopener\">1:15:40 ↗<\/a> · <a href=\"#qa24-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Скрытая мотивация Лос Ускаманоса — оживить друга\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Скрытая мотивация Лос Ускаманоса — оживить друга<\/b> У <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в этот раз скрытой мотивации не было. Скрытая мотивация была у <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a> (<a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a>): он хотел попросить джинна сделать призрака Коктобеуса снова телесным. В финале Ускаманос попытался загадать желание, но его пресекли, и желание загадал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с согласия пилота Которного. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa41-42-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Кости принца Коктобеуса забыли убрать из карточки\">18<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Кости принца Коктобеуса забыли убрать из карточки<\/b> В карточке <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a> к выпуску 46 по ошибке остались кости <a class=\"ref\" href=\"/c/princ-koktobius/\">принца Коктобеуса<\/a> из выпуска 41. По версии авторов, эльф, как и обещал, отнёс кости и похоронил их у великого эльфийского древа по древним традициям. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4519\" target=\"_blank\" rel=\"noopener\">1:15:19 ↗<\/a> · <a href=\"#qa46-28\">к записи<\/a><\/span><\/span>"}, {"t": "0:16:03", "sec": 963, "html": "Правила: колёса обязательны, летать и телепортироваться нельзя; этап 1 — выживание от Розового пляжа до таверны Кабарга у <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> до полуночи; этап 2 — скорость до <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаба<\/a>; в зонах отдыха драки запрещены, три предупреждения — дисквалификация. Порядок следят наёмницы в шёлке с кривыми клинками."}, {"t": "0:18:18", "sec": 1098, "html": "Соперники: дварфы Кунисских гор на колеснице «Бяра» (упряжка из шести бешеных баранов). Коктобеус вселяется в дварфа Клока и провоцирует драку; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убегает прятаться за охранниц — ему выносят первое предупреждение, трибуны смеются. Клок-Коктобеус «переходит» в команду Сфинктериона, бросив клан, жену и детей.<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Носитель помнит всё, что делал вселившийся призрак\">13<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Носитель помнит всё, что делал вселившийся призрак<\/b> Авторы уточнили правило: тот, в кого вселился призрак, всё видит, слышит и запоминает, но не управляет телом — поэтому Клок и упрекнул Коктобеуса, что тот продал его семью. Это расходится с выпуском 15, где солдат после выхода из него <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> сказал, что ничего не помнит; верная версия — носитель помнит. Коктобеус к тому же может вселяться скрытно и жить в носителе как паразит, не беря тело под контроль. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7698\" target=\"_blank\" rel=\"noopener\">2:08:18 ↗<\/a> · <a href=\"#qa41-42-39\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему призрака Коктобеуса никто не боялся\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему призрака Коктобеуса никто не боялся<\/b> Мир магический, а на гонку собрались очень разные существа — грибниты, эльфы, дварфы, демоны, — поэтому реакция была терпимой. В выпуске 15 <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> боялись ещё и потому, что он был невидим (его видели только те, в кого он неудачно вселялся), а Коктобеус видим. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7921\" target=\"_blank\" rel=\"noopener\">2:12:01 ↗<\/a> · <a href=\"#qa41-42-40\">к записи<\/a><\/span><\/span>"}, {"t": "0:30:52", "sec": 1852, "html": "Разведка: паровой монстр гномов «Дымок» (таран, турели с кипящим маслом, незащищённая труба), «<a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a>» демонов (адская печь на душах, огнемёт, шипастый шар, гарпуны, жвалы), лодка высших эльфов «Сюрприз» на солнечном парусе. Журналистка напоминает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> многие считают «бывшим президентом <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>»."}, {"t": "0:35:20", "sec": 2120, "html": "Приятель-тифлинг Перекупус выдаёт за две монеты ржавую разбитую повозку; Коктобеус в теле Клока запугивает его и отбирает монету.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Изначальный план — захватить машину соперников абордажем\">10<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Изначальный план — захватить машину соперников абордажем<\/b> «Рыцарь дорог» был отремонтированной машиной гнома Пиф-Пафа, которую Перекупус продал за две монеты. По расчёту авторов, герои должны были прокачать развалюху, а на первом этапе захватить абордажем машину получше (так же действовали алхимики с гарпунами); ждали, что заберут машину гномов, а не <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> сразу на старте. Менять машину можно было на любом участке трассы; победителем считался тот, кто ведёт машину через финиш, — так, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, пересёкший черту один на эльфийской лодке, загадал бы свой универсальный ключ. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 ↗<\/a> · <a href=\"#qa41-42-36\">к записи<\/a><\/span><\/span>"}, {"t": "0:42:52", "sec": 2572, "html": "<a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> выпрашивает у гнома «Дымка» кочергу для рулевой рейки. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> на свалке почти загрызен стаей собак; подоспевший Лозус третьим ударом случайно протыкает ему сонную артерию; Которный стабилизирует инженера. Машину («Рыцарь дорог») обшивают бронёй."}, {"t": "0:57:12", "sec": 3432, "html": "Лозус и Коктобеус под покровом теней крадут у алхимиков-мотоциклистов бадью «китового жира» (ускоритель)."}, {"t": "1:01:20", "sec": 3680, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> массовым внушением заставляет пятерых демонов поменяться машинами до конца гонки; демоны идут «забирать» лодку эльфов и получают предупреждение за драку. Команда стартует на <a class=\"ref\" href=\"/a/demonovoz/\">Демоновозе<\/a>, взяв «Рыцаря дорог» на буксир. Другие участники: «Гнев <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>» (повозка жрецов-лебедь со святой энергией — опасна для адской машины), «Чёрный Груздь» грибнитов.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Изначальный план — захватить машину соперников абордажем\">10<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Изначальный план — захватить машину соперников абордажем<\/b> «Рыцарь дорог» был отремонтированной машиной гнома Пиф-Пафа, которую Перекупус продал за две монеты. По расчёту авторов, герои должны были прокачать развалюху, а на первом этапе захватить абордажем машину получше (так же действовали алхимики с гарпунами); ждали, что заберут машину гномов, а не <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> сразу на старте. Менять машину можно было на любом участке трассы; победителем считался тот, кто ведёт машину через финиш, — так, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, пересёкший черту один на эльфийской лодке, загадал бы свой универсальный ключ. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 ↗<\/a> · <a href=\"#qa41-42-36\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Гнев Гелиоса» ездит на искренних молитвах\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Гнев Гелиоса» ездит на искренних молитвах<\/b> Захватив повозку жрецов, герои не смогли бы нормально на ней ехать: она работает на молитвах, а вынужденная молитва пленного жреца не настоящая. Пришлось бы самим молиться <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a> и убедить его помочь выиграть гонку. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6981\" target=\"_blank\" rel=\"noopener\">1:56:21 ↗<\/a> · <a href=\"#qa41-42-37\">к записи<\/a><\/span><\/span>"}, {"t": "1:11:07", "sec": 4267, "html": "Этап 1: атака двух мотоциклов алхимиков; «Рыцаря дорог» теряют, резким торможением и шипастым шаром уничтожают один мотоцикл; гарпуном нанизывают двух алхимиков про запас как «топливо»."}, {"t": "1:17:35", "sec": 4655, "html": "Демоны на угнанном мотоцикле и «Рыцаре дорог» догоняют и запрыгивают на <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a>. Ретро-заявка <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a>: катапульта в «Рыцаре дорог» выбрасывает демона. Коктобеус критически промахивается, и Клок изгоняет его из тела и нападает. <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> убивает демона керамбитом, но падает под колесо (22 урона) — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> вытаскивает его «кошкой»; Лозус двумя стрелами в глаза добивает демона на гарпуне. Клока связывают вместе с алхимиками, Лозус сбривает ему бороду («Я выйду из ада и буду мстить» — чеховское ружьё).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Откуда у Лос Ускаманоса ненависть к дварфам\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Откуда у Лос Ускаманоса ненависть к дварфам<\/b> <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a> в голосовом ответе сказал, что <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> не садист, а считает, что добро должно быть с кулаками и побеждать любой ценой. У него, в отличие от других эльфов, есть борода, и в детстве дварфы над ним из-за неё смеялись. Кроме того, из эльфийской академии его на несколько месяцев отправляли по обмену в дварфийский колледж, откуда остались неприятные воспоминания. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> он предан безоговорочно, а мирных, по его словам, не убивал. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7171\" target=\"_blank\" rel=\"noopener\">1:59:31 ↗<\/a> · <a href=\"#qa41-42-38\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Носитель помнит всё, что делал вселившийся призрак\">13<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Носитель помнит всё, что делал вселившийся призрак<\/b> Авторы уточнили правило: тот, в кого вселился призрак, всё видит, слышит и запоминает, но не управляет телом — поэтому Клок и упрекнул Коктобеуса, что тот продал его семью. Это расходится с выпуском 15, где солдат после выхода из него <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> сказал, что ничего не помнит; верная версия — носитель помнит. Коктобеус к тому же может вселяться скрытно и жить в носителе как паразит, не беря тело под контроль. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7698\" target=\"_blank\" rel=\"noopener\">2:08:18 ↗<\/a> · <a href=\"#qa41-42-39\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ускаманос не боится мести Клока\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ускаманос не боится мести Клока<\/b> <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не ждёт встречи с дварфом, которого сжёг в топке <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоза<\/a> в выпуске 41 и который клялся мстить из ада: он уверен, что тот, как и все, просто много болтает. Авторы пообещали выстрелить «чеховским ружьём», когда зрители об этом забудут. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 ↗<\/a> · <a href=\"#qa46-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:34:13", "sec": 5653, "html": "Таверна Кабарга: доехали «Бяра», «Сюрприз» (первым), «Гнев <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>», «Дымок»; грибниты погибли, «Рыцарь дорог» разбит, алхимики не доехали. Гномы «Дымка» грабят тавернщика и грозят убить его сына из-за «китового жира»."}, {"t": "1:37:30", "sec": 5850, "html": "Тавернщик узнаёт «президента <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>» (голосовал за него, но «ты похож на демона»). Внушение: двое гномов бегут крушить машины соперников; остальных под предлогом «китового жира» уводят на задний двор. Лозус, адский меч Лёвенхартов Сфинктериона, телекинез Коктобеуса, стреломёт и огненный снаряд <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> убивают всех гномов, трупы прячут; где-то взрывается машина. Охрана дисквалифицирует гномов, тавернщик показывает срезку, его сын дарит три кочана капусты (против баранов «Бяры»)."}, {"t": "1:54:15", "sec": 6855, "html": "Этап 2 (40 клеток, передачи D4/D6/D8, форсаж за душу в топке). Хрустальный мост джина — на мысе Бакштак. Трибуны скандируют «<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>!»."}, {"t": "1:57:37", "sec": 7057, "html": "Первого алхимика отправляют в топку; <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> срезает поворот. Китовый жир выливают на «Гнев <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>» и поджигают огнемётом (38 урона), огненный снаряд прожигает парус «Сюрприза», капуста сбивает «Бяру» с пути."}, {"t": "2:07:38", "sec": 7658, "html": "Некротическая молния щита <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> косит эльфов, Лозус убивает их пилота. Жрецы «Гнева <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>» молниями бога наносят <a class=\"ref\" href=\"/a/demonovoz/\">Демоновозу<\/a> двойной святой урон (50). В топку отправляют второго алхимика; <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> уходит в «демонический дрифт»."}, {"t": "2:15:10", "sec": 8110, "html": "У «Сюрприза» заклинивает руль и дымом глушит солнечный парус, у «Гнева <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>» тоже заклинивает руль. На хрустальном мосту некротический луч и шипастый шар добивают «Гнев Гелиоса»; Лозус унижает Клока загадкой про безбородого дварфа, и того отправляют в топку.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Откуда у Лос Ускаманоса ненависть к дварфам\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Откуда у Лос Ускаманоса ненависть к дварфам<\/b> <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a> в голосовом ответе сказал, что <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> не садист, а считает, что добро должно быть с кулаками и побеждать любой ценой. У него, в отличие от других эльфов, есть борода, и в детстве дварфы над ним из-за неё смеялись. Кроме того, из эльфийской академии его на несколько месяцев отправляли по обмену в дварфийский колледж, откуда остались неприятные воспоминания. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> он предан безоговорочно, а мирных, по его словам, не убивал. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7171\" target=\"_blank\" rel=\"noopener\">1:59:31 ↗<\/a> · <a href=\"#qa41-42-38\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ускаманос не боится мести Клока\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ускаманос не боится мести Клока<\/b> <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не ждёт встречи с дварфом, которого сжёг в топке <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоза<\/a> в выпуске 41 и который клялся мстить из ада: он уверен, что тот, как и все, просто много болтает. Авторы пообещали выстрелить «чеховским ружьём», когда зрители об этом забудут. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 ↗<\/a> · <a href=\"#qa46-26\">к записи<\/a><\/span><\/span>"}, {"t": "2:20:14", "sec": 8414, "html": "Последний поворот: провал, переброс за монету — критическая удача. Мост рушится за спиной, несколько машин падают в море; <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> финиширует в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Победа «на тоненького»: монеты не влияли на скорость\">8<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Победа «на тоненького»: монеты не влияли на скорость<\/b> Мастер был готов к поражению героев: тогда желание исполнилось бы другим, а с героями ничего бы не случилось. Монетами можно было перебрасывать только прохождение поворотов, но не кубики скорости, а машина у героев была не самой быстрой, так что выиграли они с минимальным запасом. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 ↗<\/a> · <a href=\"#qa41-42-34\">к записи<\/a><\/span><\/span>"}, {"t": "2:22:10", "sec": 8530, "html": "Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> поздравляет. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> загадывает: открыть портал из земного мира в небесный, чтобы демоническая армия ушла туда и оставила людей в покое. Джин щёлкает пальцами — «Сделано». Эпилог: где открылся портал и как демоны войдут в него — и не разбудит ли это небесных богов?<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гонку придумали под рекламодателя\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гонку придумали под рекламодателя<\/b> Гоночный выпуск появился из-за интеграции «Авито Автотеки», но концепцию авторы придумали сами. Желание джинна задумали как рифму к выпуску, где крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, с которой всё началось: ограничений на то, чтобы загадать ещё одно желание, не было. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5840\" target=\"_blank\" rel=\"noopener\">1:37:20 ↗<\/a> · <a href=\"#qa41-42-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Почему Сфинктерион не стал менять прошлое\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Почему Сфинктерион не стал менять прошлое<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что хотел нейтральное желание, которое меняет мир в настоящем, а не время, и вообще не думал о том, что можно изменить прошлое. Авторы сказали, что такое желание джинн не исполнил бы напрямую: скорее, сыграли бы миссию с возвращением в прошлое — например, чтобы помешать <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a> разлучить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5968\" target=\"_blank\" rel=\"noopener\">1:39:28 ↗<\/a> · <a href=\"#qa41-42-30\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Природа и пределы силы джинна Джиги\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Природа и пределы силы джинна Джиги<\/b> <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> — аномалия природного, вселенского происхождения, не связанная ни с богами, ни с адом. Он не всемогущ: исполняет только чужие желания, не может прямо повлиять на волю существа (только подтолкнуть), не может стереть небесный мир и не воскрешает, хотя может вернуть в прошлое; его можно убить. Глобальные желания он исполняет косвенно — например, даёт оружие, а применить его решают за столом, как со смертью <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 ↗<\/a> · <a href=\"#qa41-42-31\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как джинн исполнил бы зрительские варианты желаний\">6<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как джинн исполнил бы зрительские варианты желаний<\/b> Авторы разобрали варианты зрителей: «отправить Тёмного Властелина на небеса» — он попал бы туда бесплотным, бесполезным духом; «остановить войну ада и рая» — победой одной стороны или разделом мира, где везде плохо; «отменить смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» — например, в виде призрака; «уничтожить всех богов и демонов» — тогда мир, который боги упорядочивают и которым правят (даже ветер — проявление их воли), начал бы пожирать первородный хаос с краёв. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6232\" target=\"_blank\" rel=\"noopener\">1:43:52 ↗<\/a> · <a href=\"#qa41-42-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Скрытая мотивация Лос Ускаманоса — оживить друга\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Скрытая мотивация Лос Ускаманоса — оживить друга<\/b> У <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в этот раз скрытой мотивации не было. Скрытая мотивация была у <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a> (<a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a>): он хотел попросить джинна сделать призрака Коктобеуса снова телесным. В финале Ускаманос попытался загадать желание, но его пресекли, и желание загадал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с согласия пилота Которного. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa41-42-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сфинктерион не мог пожелать у джинна свиток за Багряным морем\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сфинктерион не мог пожелать у джинна свиток за Багряным морем<\/b> В «Гонке за желанием» <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не мог попросить у джинна свиток Апокалипсиса из-за Багряного моря: он ничего о нём не знал. О свитке знает только крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, а Сфинктерион даже не знает, где она. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6279\" target=\"_blank\" rel=\"noopener\">1:44:39 ↗<\/a> · <a href=\"#qa49-31\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:07:56", "sec": 476}, {"t": "0:23:15", "sec": 1395}, {"t": "0:48:03", "sec": 2883}, {"t": "1:02:44", "sec": 3764}, {"t": "1:15:44", "sec": 4544}, {"t": "1:21:50", "sec": 4910}, {"t": "1:37:30", "sec": 5850}, {"t": "2:01:48", "sec": 7308}, {"t": "2:21:04", "sec": 8464}, {"t": "2:23:44", "sec": 8624}], "coins": {"ep": "41", "events": [{"t": "0:38:33", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "переговоры с тифлингом о выкупе обратно проданной машины за золотые монеты", "result": null, "sec": 2313, "who_url": null, "reason_html": "переговоры с тифлингом о выкупе обратно проданной машины за золотые монеты"}, {"t": "0:41:29", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "перекупус, будучи запуганным, возвращает одну золотую монету по итогам переговоров", "result": null, "sec": 2489, "who_url": null, "reason_html": "перекупус, будучи запуганным, возвращает одну золотую монету по итогам переговоров"}, {"t": "1:43:11", "kind": "spend", "who": "Который", "actor": "Pimp", "to": null, "reason": "переброс промаха по первой атаке рапирой при нападении на таверну", "result": "после переброса — попадание (15+5)", "sec": 6191, "who_url": null, "reason_html": "переброс промаха по первой атаке рапирой при нападении на таверну"}, {"t": "2:09:52", "kind": "earn", "who": "Который", "actor": "Pimp", "to": null, "reason": "за грамотное вождение — удачный манёвр на демоническом гоночном транспорте", "result": null, "sec": 7792, "who_url": null, "reason_html": "за грамотное вождение — удачный манёвр на демоническом гоночном транспорте"}, {"t": "2:13:57", "kind": "spend", "who": "Который", "actor": "Pimp", "to": null, "reason": "переброс проверки Ловкости на резком повороте (демонический дрифт) во время гонки", "result": "успешный дрифт после переброса", "sec": 8037, "who_url": null, "reason_html": "переброс проверки Ловкости на резком повороте (демонический дрифт) во время гонки"}, {"t": "2:20:03", "kind": "earn", "who": "Который", "actor": "Pimp", "to": null, "reason": "за жестокую, но артистичную игру в загадки с пленным дварфом перед расправой", "result": null, "sec": 8403, "who_url": null, "reason_html": "за жестокую, но артистичную игру в загадки с пленным дварфом перед расправой"}, {"t": "2:20:56", "kind": "spend", "who": "Который", "actor": "Pimp", "to": null, "reason": "переброс финальной проверки Ловкости на последнем повороте гонки", "result": "критическая удача — победа в гонке", "sec": 8456, "who_url": null, "reason_html": "переброс финальной проверки Ловкости на последнем повороте гонки"}], "totals": [{"who": "Который", "actor": "Pimp", "earned": 2, "spent": 3, "img": null, "who_url": null, "actor_url": "/p/pimp/"}], "notes": "Часть монет — внутриигровые деньги (выкуп машины у тифлинга, оплата перекупуса), отмечены как loot и не входят в totals. В конце выпуска остаток монет добрали дополнительным броском кубика (+5 = 50 000 руб на благотворительность)."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, падший рыцарь (вассал Тёмного Властелина)", "role": "", "fate": "выжил, выиграл гонку и загадал желание", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Будущая команда Сфинктериона: подходит Лос Ускаманос\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Будущая команда Сфинктериона: подходит Лос Ускаманос<\/b> Авторы спросили <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, готов ли он играть <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с новой идеологией или тот станет NPC. BRB готов. Обсуждали, кто войдёт в его команду. Беса Мишу отвергли (ему нужны земные наслаждения), а <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> подходит: он верен Сфинктериону, симпатизировал жрецам, и его судьба после падения неизвестна. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что сыграет за «тёмную» сторону, если ему пропишут мотивацию. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=4540\" target=\"_blank\" rel=\"noopener\">1:15:40 ↗<\/a> · <a href=\"#qa24-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Почему Сфинктерион не стал менять прошлое\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Почему Сфинктерион не стал менять прошлое<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что хотел нейтральное желание, которое меняет мир в настоящем, а не время, и вообще не думал о том, что можно изменить прошлое. Авторы сказали, что такое желание джинн не исполнил бы напрямую: скорее, сыграли бы миссию с возвращением в прошлое — например, чтобы помешать <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a> разлучить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5968\" target=\"_blank\" rel=\"noopener\">1:39:28 ↗<\/a> · <a href=\"#qa41-42-30\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сфинктерион не мог пожелать у джинна свиток за Багряным морем\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сфинктерион не мог пожелать у джинна свиток за Багряным морем<\/b> В «Гонке за желанием» <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не мог попросить у джинна свиток Апокалипсиса из-за Багряного моря: он ничего о нём не знал. О свитке знает только крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, а Сфинктерион даже не знает, где она. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6279\" target=\"_blank\" rel=\"noopener\">1:44:39 ↗<\/a> · <a href=\"#qa49-31\">к записи<\/a><\/span><\/span>"}, {"name": "Ускаманос", "actor": "Евгений Чебатков", "actor_url": "/p/evgeniy-chebatkov/", "race": "лесной эльф, лучник-фехтовальщик", "role": "", "fate": "выжил", "id": "Лос Ускаманос", "url": "/c/los-uskomanos/", "img": "img/chars/uskamanos.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Будущая команда Сфинктериона: подходит Лос Ускаманос\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Будущая команда Сфинктериона: подходит Лос Ускаманос<\/b> Авторы спросили <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, готов ли он играть <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с новой идеологией или тот станет NPC. BRB готов. Обсуждали, кто войдёт в его команду. Беса Мишу отвергли (ему нужны земные наслаждения), а <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> подходит: он верен Сфинктериону, симпатизировал жрецам, и его судьба после падения неизвестна. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что сыграет за «тёмную» сторону, если ему пропишут мотивацию. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=4540\" target=\"_blank\" rel=\"noopener\">1:15:40 ↗<\/a> · <a href=\"#qa24-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Судьба Вульф Ва, Лос Ускаманоса и Которного — позже\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Судьба Вульф Ва, Лос Ускаманоса и Которного — позже<\/b> О судьбе героев выпуска 21 (<a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a>, Которного) пообещали рассказать, когда до них дойдёт очередь. Паль и <a class=\"ref\" href=\"/p/ilya-kuruch/\">Куруч<\/a>, по словам авторов, ещё появятся. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=5072\" target=\"_blank\" rel=\"noopener\">1:24:32 ↗<\/a> · <a href=\"#qa24-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Скрытая мотивация Лос Ускаманоса — оживить друга\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Скрытая мотивация Лос Ускаманоса — оживить друга<\/b> У <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в этот раз скрытой мотивации не было. Скрытая мотивация была у <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a> (<a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a>): он хотел попросить джинна сделать призрака Коктобеуса снова телесным. В финале Ускаманос попытался загадать желание, но его пресекли, и желание загадал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с согласия пилота Которного. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa41-42-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Откуда у Лос Ускаманоса ненависть к дварфам\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Откуда у Лос Ускаманоса ненависть к дварфам<\/b> <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a> в голосовом ответе сказал, что <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> не садист, а считает, что добро должно быть с кулаками и побеждать любой ценой. У него, в отличие от других эльфов, есть борода, и в детстве дварфы над ним из-за неё смеялись. Кроме того, из эльфийской академии его на несколько месяцев отправляли по обмену в дварфийский колледж, откуда остались неприятные воспоминания. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> он предан безоговорочно, а мирных, по его словам, не убивал. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7171\" target=\"_blank\" rel=\"noopener\">1:59:31 ↗<\/a> · <a href=\"#qa41-42-38\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ускаманос не боится мести Клока\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ускаманос не боится мести Клока<\/b> <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не ждёт встречи с дварфом, которого сжёг в топке <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоза<\/a> в выпуске 41 и который клялся мстить из ада: он уверен, что тот, как и все, просто много болтает. Авторы пообещали выстрелить «чеховским ружьём», когда зрители об этом забудут. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 ↗<\/a> · <a href=\"#qa46-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Кости принца Коктобеуса забыли убрать из карточки\">18<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Кости принца Коктобеуса забыли убрать из карточки<\/b> В карточке <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a> к выпуску 46 по ошибке остались кости <a class=\"ref\" href=\"/c/princ-koktobius/\">принца Коктобеуса<\/a> из выпуска 41. По версии авторов, эльф, как и обещал, отнёс кости и похоронил их у великого эльфийского древа по древним традициям. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4519\" target=\"_blank\" rel=\"noopener\">1:15:19 ↗<\/a> · <a href=\"#qa46-28\">к записи<\/a><\/span><\/span>"}, {"name": "принц Коктобеус", "actor": "V $ X V PRiNCE", "actor_url": "/p/v-x-v-prince/", "race": "призрак лесного эльфа", "role": "", "fate": "остался духом", "id": "принц Коктобеус", "url": "/c/princ-koktobius/", "img": "img/chars/princ-koktobeus.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Носитель помнит всё, что делал вселившийся призрак\">13<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Носитель помнит всё, что делал вселившийся призрак<\/b> Авторы уточнили правило: тот, в кого вселился призрак, всё видит, слышит и запоминает, но не управляет телом — поэтому Клок и упрекнул Коктобеуса, что тот продал его семью. Это расходится с выпуском 15, где солдат после выхода из него <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> сказал, что ничего не помнит; верная версия — носитель помнит. Коктобеус к тому же может вселяться скрытно и жить в носителе как паразит, не беря тело под контроль. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7698\" target=\"_blank\" rel=\"noopener\">2:08:18 ↗<\/a> · <a href=\"#qa41-42-39\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему призрака Коктобеуса никто не боялся\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему призрака Коктобеуса никто не боялся<\/b> Мир магический, а на гонку собрались очень разные существа — грибниты, эльфы, дварфы, демоны, — поэтому реакция была терпимой. В выпуске 15 <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> боялись ещё и потому, что он был невидим (его видели только те, в кого он неудачно вселялся), а Коктобеус видим. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7921\" target=\"_blank\" rel=\"noopener\">2:12:01 ↗<\/a> · <a href=\"#qa41-42-40\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Кости принца Коктобеуса забыли убрать из карточки\">18<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Кости принца Коктобеуса забыли убрать из карточки<\/b> В карточке <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a> к выпуску 46 по ошибке остались кости <a class=\"ref\" href=\"/c/princ-koktobius/\">принца Коктобеуса<\/a> из выпуска 41. По версии авторов, эльф, как и обещал, отнёс кости и похоронил их у великого эльфийского древа по древним традициям. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4519\" target=\"_blank\" rel=\"noopener\">1:15:19 ↗<\/a> · <a href=\"#qa46-28\">к записи<\/a><\/span><\/span>"}, {"name": "Которный", "actor": "Pimp (Young P&H)", "actor_url": "/p/pimp/", "race": "человекоподобный кот, плут-убийца, пилот", "role": "", "fate": "выжил (ранен)", "id": "Которный", "url": "/c/kotornyy/", "img": "img/chars/kotornyj.webp", "other": [{"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Судьба Вульф Ва, Лос Ускаманоса и Которного — позже\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Судьба Вульф Ва, Лос Ускаманоса и Которного — позже<\/b> О судьбе героев выпуска 21 (<a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a>, Которного) пообещали рассказать, когда до них дойдёт очередь. Паль и <a class=\"ref\" href=\"/p/ilya-kuruch/\">Куруч<\/a>, по словам авторов, ещё появятся. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=5072\" target=\"_blank\" rel=\"noopener\">1:24:32 ↗<\/a> · <a href=\"#qa24-32\">к записи<\/a><\/span><\/span>"}, {"name": "Коленвалус Рихтованус", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "тифлинг, механик", "role": "", "fate": "выжил (едва не погиб)", "id": "Коленвалус", "url": "/c/kolenvalus/", "img": "img/chars/kolenvalus.webp", "other": [{"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Скрытая мотивация Лос Ускаманоса — оживить друга\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Скрытая мотивация Лос Ускаманоса — оживить друга<\/b> У <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в этот раз скрытой мотивации не было. Скрытая мотивация была у <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a> (<a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a>): он хотел попросить джинна сделать призрака Коктобеуса снова телесным. В финале Ускаманос попытался загадать желание, но его пресекли, и желание загадал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с согласия пилота Которного. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa41-42-33\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Джин Джига", "actor": "", "actor_url": null, "race": "", "role": "джинн, султан оазиса Шиш Кебаб, устроитель гонки", "fate": "выжил, исполнил желание", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Природа и пределы силы джинна Джиги\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Природа и пределы силы джинна Джиги<\/b> <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> — аномалия природного, вселенского происхождения, не связанная ни с богами, ни с адом. Он не всемогущ: исполняет только чужие желания, не может прямо повлиять на волю существа (только подтолкнуть), не может стереть небесный мир и не воскрешает, хотя может вернуть в прошлое; его можно убить. Глобальные желания он исполняет косвенно — например, даёт оружие, а применить его решают за столом, как со смертью <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 ↗<\/a> · <a href=\"#qa41-42-31\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как джинн исполнил бы зрительские варианты желаний\">6<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как джинн исполнил бы зрительские варианты желаний<\/b> Авторы разобрали варианты зрителей: «отправить Тёмного Властелина на небеса» — он попал бы туда бесплотным, бесполезным духом; «остановить войну ада и рая» — победой одной стороны или разделом мира, где везде плохо; «отменить смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» — например, в виде призрака; «уничтожить всех богов и демонов» — тогда мир, который боги упорядочивают и которым правят (даже ветер — проявление их воли), начал бы пожирать первородный хаос с краёв. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6232\" target=\"_blank\" rel=\"noopener\">1:43:52 ↗<\/a> · <a href=\"#qa41-42-32\">к записи<\/a><\/span><\/span>"}, {"name": "Клок", "actor": "", "actor_url": null, "race": "", "role": "дварф из команды «Бяры», тело для вселения Коктобеуса", "fate": "погиб (сожжён в топке Демоновоза)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Носитель помнит всё, что делал вселившийся призрак\">13<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Носитель помнит всё, что делал вселившийся призрак<\/b> Авторы уточнили правило: тот, в кого вселился призрак, всё видит, слышит и запоминает, но не управляет телом — поэтому Клок и упрекнул Коктобеуса, что тот продал его семью. Это расходится с выпуском 15, где солдат после выхода из него <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> сказал, что ничего не помнит; верная версия — носитель помнит. Коктобеус к тому же может вселяться скрытно и жить в носителе как паразит, не беря тело под контроль. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7698\" target=\"_blank\" rel=\"noopener\">2:08:18 ↗<\/a> · <a href=\"#qa41-42-39\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ускаманос не боится мести Клока\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ускаманос не боится мести Клока<\/b> <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не ждёт встречи с дварфом, которого сжёг в топке <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоза<\/a> в выпуске 41 и который клялся мстить из ада: он уверен, что тот, как и все, просто много болтает. Авторы пообещали выстрелить «чеховским ружьём», когда зрители об этом забудут. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 ↗<\/a> · <a href=\"#qa46-26\">к записи<\/a><\/span><\/span>"}, {"name": "Алхимики", "actor": "", "actor_url": null, "race": "", "role": "гонщики на мотоциклах", "fate": "двое погибли в топке, один бежал", "id": null, "url": null, "img": null, "other": []}, {"name": "Перекупус", "actor": "", "actor_url": null, "race": "", "role": "тифлинг-перекупщик", "fate": "выжил, бежал", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Изначальный план — захватить машину соперников абордажем\">10<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Изначальный план — захватить машину соперников абордажем<\/b> «Рыцарь дорог» был отремонтированной машиной гнома Пиф-Пафа, которую Перекупус продал за две монеты. По расчёту авторов, герои должны были прокачать развалюху, а на первом этапе захватить абордажем машину получше (так же действовали алхимики с гарпунами); ждали, что заберут машину гномов, а не <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> сразу на старте. Менять машину можно было на любом участке трассы; победителем считался тот, кто ведёт машину через финиш, — так, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, пересёкший черту один на эльфийской лодке, загадал бы свой универсальный ключ. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 ↗<\/a> · <a href=\"#qa41-42-36\">к записи<\/a><\/span><\/span>"}, {"name": "Тавернщик таверны Кабарга и его сын", "actor": "", "actor_url": null, "race": "", "role": "жители Вёрджинвальда, избиратели Сфинктериона", "fate": "выжили", "id": null, "url": null, "img": null, "other": []}, {"name": "Гномы «Дымка»", "actor": "", "actor_url": null, "race": "", "role": "команда-фаворит из Змея Хрустального", "fate": "пятеро погибли, команда дисквалифицирована", "id": null, "url": null, "img": null, "other": []}, {"name": "Демоны экипажа Демоновоза", "actor": "", "actor_url": null, "race": "", "role": "соперники", "fate": "несколько погибли", "id": null, "url": null, "img": null, "other": []}, {"name": "Жрецы «Гнева Гелиоса»", "actor": "", "actor_url": null, "race": "", "role": "соперники", "fate": "часть погибла", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Гнев Гелиоса» ездит на искренних молитвах\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Гнев Гелиоса» ездит на искренних молитвах<\/b> Захватив повозку жрецов, герои не смогли бы нормально на ней ехать: она работает на молитвах, а вынужденная молитва пленного жреца не настоящая. Пришлось бы самим молиться <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a> и убедить его помочь выиграть гонку. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6981\" target=\"_blank\" rel=\"noopener\">1:56:21 ↗<\/a> · <a href=\"#qa41-42-37\">к записи<\/a><\/span><\/span>"}, {"name": "Высшие эльфы «Сюрприза»", "actor": "", "actor_url": null, "race": "", "role": "соперники", "fate": "часть погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Грибниты «Чёрного Груздя»", "actor": "", "actor_url": null, "race": "", "role": "соперники", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "<a class=\"ref\" href=\"/place/shish-kebab/\">Оазис Шиш Кебаб<\/a> и <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — президент <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> освободила джинна", "dir": "out", "color": "#C8423B"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "note_html": "Желание смерти <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и гибель Властона от руки <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "Первая неудача с божественным сосудом", "dir": "out", "color": "#C8423B"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "Божественный сосуд уничтожен, мирный план провалился", "dir": "out", "color": "#DD7A2F"}, {"key": "39", "label": "39", "title": "Кунисская пленница", "note_html": "Дварфы Кунисских гор и боевые бараны", "dir": "out", "color": "#B8901C"}, {"key": "42", "label": "42", "title": "Чудная Долина", "note_html": "Упомянута гонка джина <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джиги<\/a> за желание", "dir": "back", "color": "#7C5CD6"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "note_html": "Гонка за желанием: победа отряда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, желание открыть портал на небеса", "dir": "back", "color": "#C8423B"}, {"key": "51", "label": "51", "title": "Точка невозврата", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — падший рыцарь, присягнувший Тёмному властелину (в его облик рядится сатир)", "dir": "back", "color": "#7C5CD6"}, {"key": "52", "label": "52", "title": "Накопитель Любви", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — падший рыцарь Тёмного властелина", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Если уж маленькая крыса сумела изменить ход истории мира, то я, суровый и честный воин, обязан совершить то же самое» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>.", "«Для меня все живые существа в первую очередь топливо» — <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a>.", "«Ты не тот <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, за которого я голосовал» — тавернщик.", "«Ты отлично послужил науке при жизни… это будет лишь тепло и свет» — Лозус алхимику перед топкой.", "«Хочу, чтобы ты открыл портал из мира земного в мир небесный, чтобы демоническая армия поднялась туда и оставила людей в покое» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>."], "places_html": "<ul>\n<li>Места: Розовый пляж (старт); таверна Кабарга близ <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>; мыс Бакштак и хрустальный мост через <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a>; оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a>; <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>; <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a>; <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a>.<\/li>\n<li>Фракции и команды: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> и демоны; наёмницы-охранницы джина; дварфы («Бяра»), гномы Змея Хрустального («Дымок»), высшие эльфы («Сюрприз»), жрецы <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> («Гнев Гелиоса»), грибниты («Чёрный Груздь»), алхимики-мотоциклисты.<\/li>\n<li>Артефакты и техника: <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> (адская печь на душах, огнемёт, шипастый шар, гарпуны); «Рыцарь дорог»; щит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> (тёмная энергия, некротическая молния и луч); адский меч Лёвенхартов; «китовый жир»; фолиант механика «Автотека»; кочаны капусты.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>19<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>19<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>5<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>5<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>2<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>5<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>2<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa24-28\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Будущая команда Сфинктериона: подходит Лос Ускаманос<\/b><\/div><p>Авторы спросили <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, готов ли он играть <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с новой идеологией или тот станет NPC. BRB готов. Обсуждали, кто войдёт в его команду. Беса Мишу отвергли (ему нужны земные наслаждения), а <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> подходит: он верен Сфинктериону, симпатизировал жрецам, и его судьба после падения неизвестна. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что сыграет за «тёмную» сторону, если ему пропишут мотивацию.<\/p><blockquote>«Лос Ускаманос, персонаж Чебаткова, он подойдёт в эту команду, потому что он верен Сфинктериону»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-28\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4540\" target=\"_blank\" rel=\"noopener\">1:15:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa24-32\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Судьба Вульф Ва, Лос Ускаманоса и Которного — позже<\/b><\/div><p>О судьбе героев выпуска 21 (<a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a>, Которного) пообещали рассказать, когда до них дойдёт очередь. Паль и <a class=\"ref\" href=\"/p/ilya-kuruch/\">Куруч<\/a>, по словам авторов, ещё появятся.<\/p><blockquote>«Когда дойдёт до них время, тогда и расскажем»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-32\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5072\" target=\"_blank\" rel=\"noopener\">1:24:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-29\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гонку придумали под рекламодателя<\/b><\/div><p>Гоночный выпуск появился из-за интеграции «Авито Автотеки», но концепцию авторы придумали сами. Желание джинна задумали как рифму к выпуску, где крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, с которой всё началось: ограничений на то, чтобы загадать ещё одно желание, не было.<\/p><blockquote>«Мы ещё придумали… рифму какую-то с выпуском, где крыса Лариса загадала желание… смерть Властона»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-29\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5840\" target=\"_blank\" rel=\"noopener\">1:37:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa41-42-30\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Почему Сфинктерион не стал менять прошлое<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что хотел нейтральное желание, которое меняет мир в настоящем, а не время, и вообще не думал о том, что можно изменить прошлое. Авторы сказали, что такое желание джинн не исполнил бы напрямую: скорее, сыграли бы миссию с возвращением в прошлое — например, чтобы помешать <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a> разлучить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>.<\/p><blockquote>«Скорее всего, мы бы сыграли какую-нибудь миссию, как вы бы вернулись в прошлое и попытались бы остановить»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa41-42/#qa41-42-30\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5968\" target=\"_blank\" rel=\"noopener\">1:39:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-31\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Природа и пределы силы джинна Джиги<\/b><\/div><p><a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> — аномалия природного, вселенского происхождения, не связанная ни с богами, ни с адом. Он не всемогущ: исполняет только чужие желания, не может прямо повлиять на волю существа (только подтолкнуть), не может стереть небесный мир и не воскрешает, хотя может вернуть в прошлое; его можно убить. Глобальные желания он исполняет косвенно — например, даёт оружие, а применить его решают за столом, как со смертью <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<\/p><blockquote>«Джин не всемогущий… он некая аномалия, не связанная ни с раем, ни с адом, ни с богами, но у него… природное вселенское происхождение.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-31\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa41-42-32\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Как джинн исполнил бы зрительские варианты желаний<\/b><\/div><p>Авторы разобрали варианты зрителей: «отправить Тёмного Властелина на небеса» — он попал бы туда бесплотным, бесполезным духом; «остановить войну ада и рая» — победой одной стороны или разделом мира, где везде плохо; «отменить смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» — например, в виде призрака; «уничтожить всех богов и демонов» — тогда мир, который боги упорядочивают и которым правят (даже ветер — проявление их воли), начал бы пожирать первородный хаос с краёв.<\/p><blockquote>«Была идея, что вокруг вашего мира хаос первородный, и он начнёт медленно пожирать его со всех краёв, и это будет постапокалипсис.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-32\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6232\" target=\"_blank\" rel=\"noopener\">1:43:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-33\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Скрытая мотивация Лос Ускаманоса — оживить друга<\/b><\/div><p>У <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в этот раз скрытой мотивации не было. Скрытая мотивация была у <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманоса<\/a> (<a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a>): он хотел попросить джинна сделать призрака Коктобеуса снова телесным. В финале Ускаманос попытался загадать желание, но его пресекли, и желание загадал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с согласия пилота Которного.<\/p><blockquote>«Он хотел заказать у джина, чтобы его друга сделали, ну, типа, телесным. — Оживили, да.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-33\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-34\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Победа «на тоненького»: монеты не влияли на скорость<\/b><\/div><p>Мастер был готов к поражению героев: тогда желание исполнилось бы другим, а с героями ничего бы не случилось. Монетами можно было перебрасывать только прохождение поворотов, но не кубики скорости, а машина у героев была не самой быстрой, так что выиграли они с минимальным запасом.<\/p><blockquote>«Ты не используешь монет для переброса кубика скорости.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-34\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-35\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Баланс сил: артефакты против числа, Гиммилут сам за себя<\/b><\/div><p>У божественной стороны больше найденных артефактов, у демонов — численность. Самая интересная фигура — дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>: он пока ни за кого, только за себя, и после золотой маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспехов стал почти непобедимым.<\/p><blockquote>«Гиммилут пока что ни за кого, только за себя.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-35\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa41-42-36\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Изначальный план — захватить машину соперников абордажем<\/b><\/div><p>«Рыцарь дорог» был отремонтированной машиной гнома Пиф-Пафа, которую Перекупус продал за две монеты. По расчёту авторов, герои должны были прокачать развалюху, а на первом этапе захватить абордажем машину получше (так же действовали алхимики с гарпунами); ждали, что заберут машину гномов, а не <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> сразу на старте. Менять машину можно было на любом участке трассы; победителем считался тот, кто ведёт машину через финиш, — так, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, пересёкший черту один на эльфийской лодке, загадал бы свой универсальный ключ.<\/p><blockquote>«Изначально у нас был расчёт на то, что вы получаете дерьмовую машину… и забираете себе абордажем какую-то машину получше.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-36\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-37\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>«Гнев Гелиоса» ездит на искренних молитвах<\/b><\/div><p>Захватив повозку жрецов, герои не смогли бы нормально на ней ехать: она работает на молитвах, а вынужденная молитва пленного жреца не настоящая. Пришлось бы самим молиться <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a> и убедить его помочь выиграть гонку.<\/p><blockquote>«Если бы мы заставили бы молитвы под дулом пистолета… это была бы не настоящая молитва.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-37\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6981\" target=\"_blank\" rel=\"noopener\">1:56:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-38\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Откуда у Лос Ускаманоса ненависть к дварфам<\/b><\/div><p><a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a> в голосовом ответе сказал, что <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> не садист, а считает, что добро должно быть с кулаками и побеждать любой ценой. У него, в отличие от других эльфов, есть борода, и в детстве дварфы над ним из-за неё смеялись. Кроме того, из эльфийской академии его на несколько месяцев отправляли по обмену в дварфийский колледж, откуда остались неприятные воспоминания. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> он предан безоговорочно, а мирных, по его словам, не убивал.<\/p><blockquote>«У Лос Ускаманоса борода имеется. Это его всегда выделяло… дварфы насмехались над ним из-за бороды.»<\/blockquote><p class=\"note\">Чебатков · <a href=\"/pod/qa41-42/#qa41-42-38\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7171\" target=\"_blank\" rel=\"noopener\">1:59:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa41-42-39\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Носитель помнит всё, что делал вселившийся призрак<\/b><\/div><p>Авторы уточнили правило: тот, в кого вселился призрак, всё видит, слышит и запоминает, но не управляет телом — поэтому Клок и упрекнул Коктобеуса, что тот продал его семью. Это расходится с выпуском 15, где солдат после выхода из него <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> сказал, что ничего не помнит; верная версия — носитель помнит. Коктобеус к тому же может вселяться скрытно и жить в носителе как паразит, не беря тело под контроль.<\/p><blockquote>«Правильно работает, что жертва твоя, тело, носитель, он всё видит, запоминает, чувствует.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-39\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7698\" target=\"_blank\" rel=\"noopener\">2:08:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-40\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему призрака Коктобеуса никто не боялся<\/b><\/div><p>Мир магический, а на гонку собрались очень разные существа — грибниты, эльфы, дварфы, демоны, — поэтому реакция была терпимой. В выпуске 15 <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> боялись ещё и потому, что он был невидим (его видели только те, в кого он неудачно вселялся), а Коктобеус видим.<\/p><blockquote
