>«В 15-м выпуске, где боялись Эдварда, Эдвард был невидимый… а Асхат видимый.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-40\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=7921\" target=\"_blank\" rel=\"noopener\">2:12:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-41\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Омоложение Мелиссы было раньше гонки — выпуски переставлены<\/b><\/div><p>Хронологически <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> искупалась в ванне немного раньше, чем <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> загадал желание: выпуск о Мелиссе снимали первым, а при показе выпуски 41 и 42 поменяли местами.<\/p><blockquote>«Снимали мы сначала Мелиссу… мы просто выпуски переставили, да, мы местами выпуски поменяли.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-41\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=8026\" target=\"_blank\" rel=\"noopener\">2:13:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-42\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему в гонке не было вампиров и других команд и не было предательства<\/b><\/div><p>Добавить в гонку героев других ветвей (вампиров, крыс) не дают ограничения формата: персонажей играют конкретные живые люди, это было бы возможно только в мультсериале или комиксе. Предательство в ветви <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> намеренно не стали делать: оно уже стало обыденностью, а напряжение у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> и так было.<\/p><blockquote>«Но не сделали мы предательство, да, опять же, потому что это какая-то обыденность»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-42\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=8089\" target=\"_blank\" rel=\"noopener\">2:14:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-26\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ускаманос не боится мести Клока<\/b><\/div><p><a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не ждёт встречи с дварфом, которого сжёг в топке <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоза<\/a> в выпуске 41 и который клялся мстить из ада: он уверен, что тот, как и все, просто много болтает. Авторы пообещали выстрелить «чеховским ружьём», когда зрители об этом забудут.<\/p><blockquote>«Лос Ускаманос уверен, что этот дварф, как и все другие, просто много болтает.»<\/blockquote><p class=\"note\">Чебатков · <a href=\"/pod/qa46/#qa46-26\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa46-28\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Кости принца Коктобеуса забыли убрать из карточки<\/b><\/div><p>В карточке <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a> к выпуску 46 по ошибке остались кости <a class=\"ref\" href=\"/c/princ-koktobius/\">принца Коктобеуса<\/a> из выпуска 41. По версии авторов, эльф, как и обещал, отнёс кости и похоронил их у великого эльфийского древа по древним традициям.<\/p><blockquote>«Мы забыли у него убрать вот эти вот кости принца Коктобеуса, с которыми он ходил в гонке за желанием.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-28\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4519\" target=\"_blank\" rel=\"noopener\">1:15:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сфинктерион не мог пожелать у джинна свиток за Багряным морем<\/b><\/div><p>В «Гонке за желанием» <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не мог попросить у джинна свиток Апокалипсиса из-за Багряного моря: он ничего о нём не знал. О свитке знает только крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, а Сфинктерион даже не знает, где она.<\/p><blockquote>«У него не было информации про свиток... только крыса про это знает»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-31\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6279\" target=\"_blank\" rel=\"noopener\">1:44:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><\/section>", "chars": {"Лос Ускаманос": {"name": "Лос Ускаманос", "img": "img/chars/uskamanos.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A3%D1%81%D0%BA%D0%B0%D0%BC%D0%B0%D0%BD%D0%BE%D1%81", "summary": "Ускама́нос (полное имя — Лос Ускаманос, имя в сане жреца бога Солнца — Джей-Зи) — лесн
