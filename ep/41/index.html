<script>window.EPD = {"key": "41", "label": "41", "title": "Гонка за желанием", "date": "2025-08-31", "minutes": 146, "duration": 8745.0, "video_id": "6USQ969nMPI", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Гоночная трасса через Понию: Розовый пляж, таверна Кабарга у Вирджинвальда, хрустальный мост с мыса Бакштак, оазис Шиш-Кебаб", "short_html": "Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> устраивает гонку через всю Понию до оазиса Шиш-Кебаб, и победитель получит одно желание. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, не сумевший остановить демоническое нашествие, собирает пёструю команду; внушением они меняются машинами с демонами и едут на адском Демоновозе, чья топка работает на душах. По пути герои сжигают пленных алхимиков, убивают демонов и тайно вырезают гномов, а благодаря срезке от тавернщика и критическому броску первыми финишируют в Шиш-Кебабе. Сфинктерион загадывает портал из земного мира в небесный, чтобы демоны ушли с земли.", "summary_html": "Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a>, освобождённый когда-то крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, празднует день свободы гонкой на выживание через всю Понию до оазиса Шиш-Кебаб; победитель получит одно желание. Падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, не сумевший остановить демоническое нашествие, собирает «команду разнообразия» и решает загадать желание, которое спасёт мир. Получив от перекупщика развалюху, команда внушением меняется машинами с демонами и мчится на адском «Демоновозе», топка которого работает на душах: по пути герои сжигают пленных алхимиков, убивают демонов и тайно вырезают гномов из команды «Дымка». Благодаря срезке, подсказанной благодарным тавернщиком из Вирджинвальда, и критическому броску на последнем повороте Демоновоз первым проходит хрустальный мост и финиширует в Шиш-Кебабе. Сфинктерион желает, чтобы джин открыл портал из земного мира в небесный — чтобы демоническая армия ушла туда и оставила людей в покое; джин щёлкает пальцами — «сделано».", "outcome_html": "Команда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> выиграла гонку ценой множества сожжённых и убитых соперников. Джин открыл портал с земли на небеса, чтобы демоническая армия ушла туда.", "world_html": ["Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> открыл портал из земного мира в небесный — путь для демонической армии с земли", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> снова популярен в Вирджинвальде, хотя внешне стал похож на демона", "Возможное пробуждение небесных богов (вопрос эпилога)"], "scenes": [{"t": "0:04:37", "sec": 277, "html": "Пролог (голосом эльфа <a class=\"ref\" href=\"/c/los-uskomanos/\">Лозуса Каманоса<\/a>): желание <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> — смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — исполнил <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>; Геленбург провалился в ад и вернулся демонической цитаделью; Сфинктерион присягнул Тёмному Властелину и дважды не смог добыть божественный сосуд для духа мщения; демоны лавиной обрушились на Понию."}, {"t": "0:07:51", "sec": 471, "html": "Завязка: джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> тысячи лет сидел в бутылке, служил тёмному эльфу <a class=\"ref\" href=\"/c/halif-timuras/\">Тимурасу<\/a> (тот загадал лишь два желания из трёх), освобождён <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, теперь правит созданным им оазисом Шиш-Кебаб как султан. В этом году вместо бинго он устраивает гонку с востока на запад Понии; приз — желание."}, {"t": "0:08:53", "sec": 533, "html": "–[0:15:14] Представление: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет повторить «подвиг крысы» и одним желанием спасти мир; Лозус служит ему по присяге и оправдывает союз с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>; Коктобиус погиб, разыскивая Лозуса, и его останки Лозус везёт хоронить в <a class=\"ref\" href=\"/c/korol-nurik/\">Нурикфел<\/a>; <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> мечтает снова «помяться на груди Ирэн Твёрдой»; <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> хочет доказать гномам Змея Хрустального, что тифлинг может быть инженером, и загадать «универсальный гаечный ключ»."}, {"t": "0:15:14", "sec": 914, "html": "Правила: колёса обязательны, летать и телепортироваться нельзя; этап 1 — выживание от Розового пляжа до таверны Кабарга у Вирджинвальда до полуночи; этап 2 — скорость до Шиш-Кебаба; в зонах отдыха драки запрещены, три предупреждения — дисквалификация. Порядок следят наёмницы в шёлке с кривыми клинками."}, {"t": "0:18:24", "sec": 1104, "html": "Соперники: дварфы Кунисских гор на колеснице «Бяра» (упряжка из шести бешеных баранов). Коктобиус вселяется в дварфа Клока и провоцирует драку; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убегает прятаться за охранниц — ему выносят первое предупреждение, трибуны смеются. Клок-Коктобиус «переходит» в команду Сфинктериона, бросив клан, жену и детей."}, {"t": "0:31:04", "sec": 1864, "html": "Разведка: паровой монстр гномов «Дымок» (таран, турели с кипящим маслом, незащищённая труба), «Демоновоз» демонов (адская печь на душах, огнемёт, шипастый шар, гарпуны, жвалы), лодка высших эльфов «Сюрприз» на солнечном парусе. Журналистка напоминает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> многие считают «бывшим президентом Вирджинвальда»."}, {"t": "0:35:17", "sec": 2117, "html": "Приятель-тифлинг Перекупос выдаёт за две монеты ржавую разбитую повозку; Коктобиус в теле Клока запугивает его и отбирает монету."}, {"t": "0:42:38", "sec": 2558, "html": "<a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> выпрашивает у гнома «Дымка» кочергу для рулевой рейки. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> на свалке почти загрызен стаей собак; подоспевший Лозус третьим ударом случайно протыкает ему сонную артерию; Которный стабилизирует инженера. Машину («Рыцарь дорог») обшивают бронёй."}, {"t": "0:57:23", "sec": 3443, "html": "Лозус и Коктобиус под покровом теней крадут у алхимиков-мотоциклистов бадью «китового жира» (ускоритель)."}, {"t": "1:01:36", "sec": 3696, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> массовым внушением заставляет пятерых демонов поменяться машинами до конца гонки; демоны идут «забирать» лодку эльфов и получают предупреждение за драку. Команда стартует на Демоновозе, взяв «Рыцаря дорог» на буксир. Другие участники: «Гнев <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>» (повозка жрецов-лебедь со святой энергией — опасна для адской машины), «Чёрный Груздь» грибнитов."}, {"t": "1:11:07", "sec": 4267, "html": "Этап 1: атака двух мотоциклов алхимиков; «Рыцаря дорог» теряют, резким торможением и шипастым шаром уничтожают один мотоцикл; гарпуном нанизывают двух алхимиков про запас как «топливо»."}, {"t": "1:17:26", "sec": 4646, "html": "Демоны на угнанном мотоцикле и «Рыцаре дорог» догоняют и запрыгивают на Демоновоз. Ретро-заявка <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a>: катапульта в «Рыцаре дорог» выбрасывает демона. Коктобиус критически промахивается, и Клок изгоняет его из тела и нападает. <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> убивает демона керамбитом, но падает под колесо (22 урона) — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> вытаскивает его «кошкой»; Лозус двумя стрелами в глаза добивает демона на гарпуне. Клока связывают вместе с алхимиками, Лозус сбривает ему бороду («Я выйду из ада и буду мстить» — чеховское ружьё)."}, {"t": "1:33:21", "sec": 5601, "html": "Таверна Кабарга: доехали «Бяра», «Сюрприз» (первым), «Гнев <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>», «Дымок»; грибниты погибли, «Рыцарь дорог» разбит, алхимики не доехали. Гномы «Дымка» грабят тавернщика и грозят убить его сына из-за «китового жира»."}, {"t": "1:37:34", "sec": 5854, "html": "Тавернщик узнаёт «президента <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>» (голосовал за него, но «ты похож на демона»). Внушение: двое гномов бегут крушить машины соперников; остальных под предлогом «китового жира» уводят на задний двор. Лозус, адский меч Лёвенхартов Сфинктериона, телекинез Коктобиуса, стреломёт и огненный снаряд <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> убивают всех гномов, трупы прячут; где-то взрывается машина. Охрана дисквалифицирует гномов, тавернщик показывает срезку, его сын дарит три кочана капусты (против баранов «Бяры»)."}, {"t": "1:54:25", "sec": 6865, "html": "Этап 2 (40 клеток, передачи D4/D6/D8, форсаж за душу в топке). Хрустальный мост джина — на мысе Бакштак. Трибуны скандируют «<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>!»."}, {"t": "1:57:34", "sec": 7054, "html": "Первого алхимика отправляют в топку; Демоновоз срезает поворот. Китовый жир выливают на «Гнев <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>» и поджигают огнемётом (38 урона), огненный снаряд прожигает парус «Сюрприза», капуста сбивает «Бяру» с пути."}, {"t": "2:07:04", "sec": 7624, "html": "Некротическая молния щита <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> косит эльфов, Лозус убивает их пилота. Жрецы «Гнева <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>» молниями бога наносят Демоновозу двойной святой урон (50). В топку отправляют второго алхимика; <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> уходит в «демонический дрифт»."}, {"t": "2:15:27", "sec": 8127, "html": "У «Сюрприза» заклинивает руль и дымом глушит солнечный парус, у «Гнева <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>» тоже заклинивает руль. На хрустальном мосту некротический луч и шипастый шар добивают «Гнев Гелиуса»; Лозус унижает Клока загадкой про безбородого дварфа, и того отправляют в топку."}, {"t": "2:19:45", "sec": 8385, "html": "Последний поворот: провал, переброс за монету — критическая удача. Мост рушится за спиной, несколько машин падают в море; Демоновоз финиширует в Шиш-Кебабе."}, {"t": "2:21:56", "sec": 8516, "html": "Джин <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джига<\/a> поздравляет. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> загадывает: открыть портал из земного мира в небесный, чтобы демоническая армия ушла туда и оставила людей в покое. Джин щёлкает пальцами — «Сделано». Эпилог: где открылся портал и как демоны войдут в него — и не разбудит ли это небесных богов?"}], "key_events": [{"t": "0:07:51", "sec": 471}, {"t": "0:21:31", "sec": 1291}, {"t": "0:47:56", "sec": 2876}, {"t": "1:02:42", "sec": 3762}, {"t": "1:15:21", "sec": 4521}, {"t": "1:21:36", "sec": 4896}, {"t": "1:37:34", "sec": 5854}, {"t": "2:01:49", "sec": 7309}, {"t": "2:20:51", "sec": 8451}, {"t": "2:22:59", "sec": 8579}], "coins": {"ep": "41", "events": [{"t": "0:38:24", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "переговоры с тифлингом о выкупе обратно проданной машины за золотые монеты", "result": null, "sec": 2304, "who_url": null, "reason_html": "переговоры с тифлингом о выкупе обратно проданной машины за золотые монеты"}, {"t": "0:41:34", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "перекупус, будучи запуганным, возвращает одну золотую монету по итогам переговоров", "result": null, "sec": 2494, "who_url": null, "reason_html": "перекупус, будучи запуганным, возвращает одну золотую монету по итогам переговоров"}, {"t": "1:42:48", "kind": "spend", "who": "Который", "actor": "Pimp", "to": null, "reason": "переброс промаха по первой атаке рапирой при нападении на таверну", "result": "после переброса — попадание (15+5)", "sec": 6168, "who_url": null, "reason_html": "переброс промаха по первой атаке рапирой при нападении на таверну"}, {"t": "2:09:11", "kind": "earn", "who": "Который", "actor": "Pimp", "to": null, "reason": "за грамотное вождение — удачный манёвр на демоническом гоночном транспорте", "result": null, "sec": 7751, "who_url": null, "reason_html": "за грамотное вождение — удачный манёвр на демоническом гоночном транспорте"}, {"t": "2:13:21", "kind": "spend", "who": "Который", "actor": "Pimp", "to": null, "reason": "переброс проверки Ловкости на резком повороте (демонический дрифт) во время гонки", "result": "успешный дрифт после переброса", "sec": 8001, "who_url": null, "reason_html": "переброс проверки Ловкости на резком повороте (демонический дрифт) во время гонки"}, {"t": "2:19:45", "kind": "earn", "who": "Который", "actor": "Pimp", "to": null, "reason": "за жестокую, но артистичную игру в загадки с пленным дварфом перед расправой", "result": null, "sec": 8385, "who_url": null, "reason_html": "за жестокую, но артистичную игру в загадки с пленным дварфом перед расправой"}, {"t": "2:20:51", "kind": "spend", "who": "Который", "actor": "Pimp", "to": null, "reason": "переброс финальной проверки Ловкости на последнем повороте гонки", "result": "критическая удача — победа в гонке", "sec": 8451, "who_url": null, "reason_html": "переброс финальной проверки Ловкости на последнем повороте гонки"}], "totals": [{"who": "Который", "actor": "Pimp", "earned": 2, "spent": 3, "img": null, "who_url": null, "actor_url": "/p/pimp/"}], "notes": "Часть монет — внутриигровые деньги (выкуп машины у тифлинга, оплата перекупуса), отмечены как loot и не входят в totals. В конце выпуска остаток монет добрали дополнительным броском кубика (+5 = 50 000 руб на благотворительность)."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, падший рыцарь (вассал Тёмного Властелина)", "role": "", "fate": "выжил, выиграл гонку и загадал желание", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "По
