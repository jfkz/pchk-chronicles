\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как можно было победить катамаран «Щит Нерека»\">9<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как можно было победить катамаран «Щит Нерека»<\/b> Катамаран был почти непобедим, но задумка предполагала три «артефакта», которые давали шанс в финальном бою: отбить у пиратов лучше вооружённый корабль, забрать у Дерека морозный перстень (катамаран уязвим к холоду и не может ходить во льдах) и добыть <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>, превращающий судно в подводную лодку. Взорвав пиратский корабль и придя в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерек<\/a> на невооружённом краболове, отряд закрыл себе эту ветку. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1038\" target=\"_blank\" rel=\"noopener\">0:17:18 ↗<\/a> · <a href=\"#qa50-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Зачем Дайхарду дали скрытую мотивацию\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Зачем Дайхарду дали скрытую мотивацию<\/b> Приключения обычно заканчиваются финальной схваткой, и скрытая мотивация Дайхарда должна была её спровоцировать, а заодно показать жестокость глиафов к рабам. Авторы ждали, что <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> весь выпуск будет копить артефакты, команду или план для боя с капитаном. Прообразом жестокого фаларийского капитана Тургура назван персонаж Тома Беренджера из фильма «Взвод». <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1544\" target=\"_blank\" rel=\"noopener\">0:25:44 ↗<\/a> · <a href=\"#qa50-7\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> — бывший советник <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Рекламная сценка-флешбэк с <a class=\"ref\" href=\"/c/yanus/\">Дододисом<\/a> (Янусом), маской и <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "<a class=\"ref\" href=\"/place/malestiya/\">Руины Малестии<\/a>, мумия императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a>, свитки Апокалипсиса и бессмертие <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>", "dir": "out", "color": "#DD7A2F"}, {"key": "39", "label": "39", "title": "Кунисская пленница", "note_html": "Каблучанус уладил требования независимости кунисских дварфов", "dir": "out", "color": "#B8901C"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> присягнула <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> на королевской охоте", "dir": "out", "color": "#DD7A2F"}], "quotes_html": ["<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>: «Хотели меня разбить враги? Пососите мой хвост. Я вас ещё всех переживу».", "Каблучанус: «Я сэр Каблучанус, и я слушаю только свою жену».", "Анаконда Шиша: «Мой секрет: я отложила яички ему в стол».", "Каблучанус-Дерек: «Ты рассказываешь, что ты двухметровый красивый… а я с клешнями».", "Мастер: «Это подземелье Чикен Карри нас схватило ровно на 50 выпусках»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/gnilaya-gavan/\">Гнилая Гавань<\/a>; <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a>; Поющий риф и подводная пещера сирен; затонувший корабль «Мориэлла»; <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a>, порт Нерек; упомянуты руины <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> и южные рудники Фаларии.<\/li>\n<li>Фракции: <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a> (глиафы; рабы-«Зеро»; «закон о капле»); береговая охрана Нерека; пираты Джона Солёной Бороды; работорговцы Люсьена и Дерека; сирены Поющего рифа; бандиты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (упоминание).<\/li>\n<li>Артефакты: свитки Апокалипсиса (цель); <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>; протез удачи; пистоль с одной пулей; бухгалтерия Люсьена; яйцо/детёныш анаконды; морозное кольцо Дерека; фаларийское клеймо Дайхарда; корабли «Мул» (уничтожен), пиратский корабль (взорван), краболов «Клешня» (захвачен).<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>42<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>42<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>8<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>14<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>2<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>6<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>11<\/small><\/button><\/div><article class=\"pnote t-clarification\" id=\"qa47-36\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Поний V — интриган, а не «добрый пушистый» король<\/b><\/div><p>Отвечая на упрёки в излишней доброте шоу, мастер подчеркнул, что <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> ведёт свою политическую игру: он не удержался бы на престоле, если бы не умел вертеть людьми — например, крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, которой он дал задание после её присяги.<\/p><blockquote>«Он тоже ведёт свою политическую игру. Он интриган. Он бы не продержался на престоле, если бы не умел вертеть и крутить крысой Ларисой.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-36\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6806\" target=\"_blank\" rel=\"noopener\">1:53:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa48-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Составы ближайших выпусков и «двойной» съёмочный день Талалы и Сфинктериона<\/b><\/div><p>Авторы раскрыли составы: в 49-м — <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, Турал и <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Никита Шевчук<\/a>, в 50-м — Сабина, <a class=\"ref\" href=\"/p/dima-koval/\">Дима Коваль<\/a> и <a class=\"ref\" href=\"/p/ruslan-usachev/\">Руслан Усачев<\/a>. Затем снимали выпуск с <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a>, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатиром<\/a> и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболевым<\/a> и экспериментальный второй мотор с Дашей <a class=\"ref\" href=\"/p/blohina/\">Блохиной<\/a>, Славой <a class=\"ref\" href=\"/p/chepurchenko/\">Чепурченко<\/a> и <a class=\"ref\" href=\"/c/gogen/\">Гогеном<\/a>. Бреганов отметил, что ветки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> снимаются в один день, и события одного выпуска могут сильно повлиять на другой.<\/p><blockquote>«Как в один день и Талала, и Сфинктерион… События одного выпуска сильно пересекаются с событиями другого выпуска и могут очень сильно повлиять на то, что произойдёт в следующем моторе.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa48/#qa48-19\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3717\" target=\"_blank\" rel=\"noopener\">1:01:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-6\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Бессмертие Ларисы может снять тот, кто его дал<\/b><\/div><p>На вопрос, можно ли лишить крысу <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> бессмертия, ответили, что в теории да — это может сделать тот, кто его дал. Мумия императора <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> — нежить: не жива, но и не мертва, то есть по-прежнему существует.<\/p><blockquote>«А бессмертие может сняться вообще? — Ну, по идее, да.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-6\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=1155\" target=\"_blank\" rel=\"noopener\">0:19:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сфинктерион не мог пожелать у джинна свиток за Багряным морем<\/b><\/div><p>В «Гонке за желанием» <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не мог попросить у джинна свиток Апокалипсиса из-за Багряного моря: он ничего о нём не знал. О свитке знает только крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, а Сфинктерион даже не знает, где она.<\/p><blockquote>«У него не было информации про свиток... только крыса про это знает»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-31\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6279\" target=\"_blank\" rel=\"noopener\">1:44:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Катамаран показали на карте не ради того, чтобы свернуть игру<\/b><\/div><p>Зрители решили, что мастер нарочно «спалил» патрульный катамаран в конце, чтобы игроки испугались и выпуск закончился быстрее. Бреганов объяснил: у корабля несколько палуб, их надо было выравнивать по отдельности, поэтому он вынес модель и показал её издалека, чтобы игроки оценили масштаб; испуг был их собственной реакцией.<\/p><blockquote>«Да нет, на самом деле корабль я не палил. Я просто его поставил, выставил.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-1\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=847\" target=\"_blank\" rel=\"noopener\">0:14:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa50-2\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Эскизы кораблей не показали игрокам<\/b><\/div><p>Авторы признали упущение: для всех кораблей выпуска («Мул», пиратский «Мерзкий Близнец», краболов «Клешня» и катамаран «Щит <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a>») художнику Никите отправляли эскизы палуб и вид сбоку, но на съёмке их не показали. Приключение строилось на выборе судна и его слабых местах, и по виду сбоку игроки могли бы догадаться об уязвимости пиратского корабля.<\/p><blockquote>«мул, Мерзкий Близнец, Клешня и, соответственно, Щит Нерека, все эти корабли, я Никите, нашему художнику, я отправлял... эскизы»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-2\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=910\" target=\"_blank\" rel=\"noopener\">0:15:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-3\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Пиратский корабль назывался «Мерзкий Близнец»<\/b><\/div><p>В подкасте впервые прозвучало название корабля Джона Солёной Бороды — «Мерзкий Близнец»; в выпуске он был просто «пиратским кораблём».<\/p><blockquote>«мул, Мерзкий Близнец, Клешня и, соответственно, Щит Нерека»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-3\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=910\" target=\"_blank\" rel=\"noopener\">0:15:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Модуль перспективы для карты нашли уже после съёмки<\/b><\/div><p>Бреганов рассказал, что лишь после выпуска узнал о модуле для их программы, который строит перспективу: можно было показать колышущееся море и корабли, которые растут или уменьшаются с расстоянием. Изображения моря к тому же пришлось сильно пережимать.<\/p><blockquote>«только после выпуска увидел специальный модуль для нашей программы, который позволяет делать перспективу»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-4\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=974\" target=\"_blank\" rel=\"noopener\">0:16:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa50-5\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Как можно было победить катамаран «Щит Нерека»<\/b><\/div><p>Катамаран был почти непобедим, но задумка предполагала три «артефакта», которые давали шанс в финальном бою: отбить у пиратов лучше вооружённый корабль, забрать у Дерека морозный перстень (катамаран уязвим к холоду и не может ходить во льдах) и добыть <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>, превращающий судно в подводную лодку. Взорвав пиратский корабль и придя в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерек<\/a> на невооружённом краболове, отряд закрыл себе эту ветку.<\/p><blockquote>«это отобрать у пиратов судно... второе - это завладеть ледяным перстнем... И третье - это вот этот... амулет глубины»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-5\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1038\" target=\"_blank\" rel=\"noopener\">0:17:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-6\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Внимание к катамарану привлёк сам Дайхард<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> сказал, что нарочно обратил внимание отряда на катамаран: иначе все просто уплыли бы. К тому моменту съёмка шла уже очень долго и игроки устали; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> предложила Дайхарду отложить месть и обещала помочь потом.<\/p><blockquote>«я поэтому там и привлекал внимание этого корабля, потому что понятно было, что если просто спросить мнения всех остальных, то все уплывут»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-6\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1293\" target=\"_blank\" rel=\"noopener\">0:21:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-7\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Зачем Дайхарду дали скрытую мотивацию<\/b><\/div><p>Приключения обычно заканчиваются финальной схваткой, и скрытая мотивация Дайхарда должна была её спровоцировать, а заодно показать жестокость глиафов к рабам. Авторы ждали, что <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> весь выпуск будет копить артефакты, команду или план для боя с капитаном. Прообразом жестокого фаларийского капитана Тургура назван персонаж Тома Беренджера из фильма «Взвод».<\/p><blockquote>«для этого и была нужна вот эта... скрытая мотивация, которая одновременно заявляет жестоких... лиафов... И она даёт вот эту финальную сцену боя»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-7\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1544\" target=\"_blank\" rel=\"noopener\">0:25:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-8\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Морозное кольцо Дерека не взяли, потому что у Дайхарда кончились силы духов<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> хотел успеть забрать морозное кольцо Дерека, но у него, по его воспоминаниям, закончились призывы духов, а остальные уже торопились плыть дальше. <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> он сознательно не применял, опасаясь проклятия.<\/p><blockquote>«я хотел как-то быстро выхватить это кольцо, не получилось»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-8\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1610\" target=\"_blank\" rel=\"noopener\">0:26:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa50-9\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Амулет глубин задумывали как финальный ход<\/b><\/div><p>Авторы рассчитывали, что <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> станет хорошей концовкой: отряд выберет капитана, уйдёт под воду и т. п. В итоге амулетом так никто и не воспользовался.<\/p><blockquote>«Честно говоря, ожидалось, что амулет глубин станет хорошей концовкой, что вы выберете капитана»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-9\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1673\" target=\"_blank\" rel=\"noopener\">0:27:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Дайхард плыл с отрядом Ларисы<\/b><\/div><p>Дайхард искал сильную команду, чтобы отомстить Тургуру: в одиночку, без друзей и артефактов, он бы с ним не справился. Поэтому и платил за проезд, а не добирался сам (например, на дельфине).<\/p><blockquote>«Потому что если бы я просто туда приплыл и начал разбираться, я был бы один без команды друзей и мощных артефактов.»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-10\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1736\" target=\"_blank\" rel=\"noopener\">0:28:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-11\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезанная сцена: Дайхард уговаривал спасти рабов<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> рассказал, что в монтаж не попал момент, где Дайхард, сам бывший раб, уговаривал отряд спасти пленников на пиратском корабле. Его компас указывал не на цель <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, а на его собственную цель; тогда направление совпадало, но он хотел намекнуть, что у него свои планы.<\/p><blockquote>«Хотя он показывает не туда, куда нужно крысе, а куда нужно мне.»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-11\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1801\" target=\"_blank\" rel=\"noopener\">0:30:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-12\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Референсы духов для иллюстраторов<\/b><\/div><p>Составляя референсы для иллюстраторов, одного из духов Дайхарда рисовали «под» Геннадия Ветрова (дух ветра), другого — под Водонаеву (дух воды); с духом моря возникла заминка.<\/p><blockquote>«вызываю духа ветра. Я такой: &quot;О, это будет Геннадий Ветров&quot;. Ну, типа, вызываю духа воды, о, это будет Водонаева»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-12\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2433\" target=\"_blank\" rel=\"noopener\">0:40:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa50-13\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Способность призывать духов оказалась слишком сильной<\/b><\/div><p>Авторы признали, что «немного не подумали»: призывы духов восстанавливались каждые сутки, а путешествие длилось две недели, так что Дайхард мог пользоваться духами почти без ограничений. Правильнее было бы требовать ритуал, как у гоблина-шамана в одном из прошлых выпусков. <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> считает, что для шоу это всё же лучше.<\/p><blockquote>«И мы, кстати, немного не подумали, мы дали Руслану возможность... пользоваться духами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-13\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2433\" target=\"_blank\" rel=\"noopener\">0:40:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-14\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сирены не были опасны для вежливых гостей<\/b><\/div><p>Бреганов пояснил, что сирены Поющего рифа опасны лишь для тех, кто на них нападёт или не расскажет историю: тогда они просто съедят, как хищные рыбы. Тех, кто расскажет историю и проявит хорошие манеры, они бы не тронули. Обмен ноги на протез удачи был честным.<\/p><blockquote>«Они были опасны только, если вы на них нападёте, разумеется, и не расскажете истории.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-14\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2816\" target=\"_blank\" rel=\"noopener\">0:46:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa50-15\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Дайхард будет переделывать свой протез<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> остался недоволен видом протеза удачи и объявил, что до следующего появления Дайхард будет его кастомизировать.<\/p><blockquote>«если кому-то интересно, чем мой персонаж будет заниматься между следующим появлением, он будет кастомизировать себе»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-15\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2880\" target=\"_blank\" rel=\"noopener\">0:48:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Анаконда Шиша — просто страж каюты капитана<\/b><\/div><p>По задумке из каюты капитана можно было узнать, что Люсьен везёт пассажиров не в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, а передаёт краболову, который отвезёт их в рабство (их спрячут в бочках и клетках из-под крабов). Анаконда на кровати капитана была лишь препятствием на пути к этой информации, «охранником»; на её месте мог быть кто угодно.<\/p><blockquote>«Сущности, это просто препятствие перед выяснением информации. Грубо говоря, охранник»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-16\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3577\" target=\"_blank\" rel=\"noopener\">0:59:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa50-17\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Задуманный поворот: пираты честнее капитана<\/b><\/div><p>Сценарий предполагал, что отряд отобьётся от пиратов, которыми его пугал Люсьен, и лишь потом узнает, что капитан сам продаёт пассажиров в рабство: пираты оказывались честнее его.<\/p><blockquote>«он вас обманул, а те пираты были более честными»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-17\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3642\" target=\"_blank\" rel=\"noopener\">1:00:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-18\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Лариса не могла колдовать внутри анаконды<\/b><\/div><p>Мастер договорился с игроками, что в желудке анаконды руки и лапы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> скованы: она в состоянии «опутана», а без вербальных и соматических компонентов «Рой саранчи» не сотворить. Сначала надо освободиться (сложность 26), атаки изнутри совершаются с помехой. На рисунках художника поза была другой.<\/p><blockquote>«А мы договорились, что там у неё руки и ноги заняты.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-18\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3707\" target=\"_blank\" rel=\"noopener\">1:01:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Секрет анаконды придумали на ходу<\/b><\/div><p>Весь эпизод с «секретиком» анаконды — импровизация: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> спросил, есть ли у неё секрет, и Бреганов сочинил, что она отложила яйца в стол капитана. Мастер разогнался до того, что это дети капитана, но эту линию почти полностью вырезали, остались только намёки.<\/p><blockquote>«Уже дошёл до того, что это дети капитана эти яички. Не было такого.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-19\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3897\" target=\"_blank\" rel=\"noopener\">1:04:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Лариса не пробралась на корабль тайком<\/b><\/div><p><a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> могла бы проникнуть на любое судно как обычная крыса, но, во-первых, это было условие короля: она плывёт по его заданию вместе с его людьми. Во-вторых, фаларийские порты пускают только суда под фаларийским флагом. Авторы добавили, что Лариса давно говорит по-человечески (в выпуске 15 — благодаря щиту, теперь постоянно на зелье) и уже не мыслит себя простой крысой.<\/p><blockquote>«Это было, во-первых, условие короля, что ты идёшь... по заданию короля туда, и с тобой плывут его люди.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-20\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4024\" target=\"_blank\" rel=\"noopener\">1:07:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Схема Люсьена и детский крестовый поход<\/b><\/div><p>Люсьен брал деньги с желающих попасть в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> и продавал их в рабство; никто из его пассажиров не возвращался. Авторы сослались на детский крестовый поход, участников которого судовладельцы вместо Святой земли продали на рабовладельческих рынках Африки. Схема держалась на слухах о «надёжном» капитане Люсьене. Миссию можно было начать и с поиска корабля в Гнилой Гавани, но не хватило бы хронометража.<\/p><blockquote>«дошли пешком до Марселя... договорились, что с судовладельцами, что их переправят... всех потом на рабовладельческие рынки»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-21\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4153\" target=\"_blank\" rel=\"noopener\">1:09:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-22\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему первая локация всегда затянута<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> объяснил жалобы на долгую первую часть: в первые часы игры закладываются мемы и связи, на которых держится всё шоу, поэтому из начала при монтаже приходится оставлять много, а дальше уже можно резать.<\/p><blockquote>«в первые там часы того, где мы находимся в первой локации, закладываются все... мемы, на которых дальнейшее шоу держится»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-22\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4346\" target=\"_blank\" rel=\"noopener\">1:12:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Крыса Аркадий жив<\/b><\/div><p>На вопрос о судьбе Аркадия из роя <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, взорвавшегося вместе с порохом на пиратском корабле, мастер шутливо ответил, что Аркадий жив; звучали версии, что крысы уцелели на обломках. Похоже на шутку.<\/p><blockquote>«Что с Аркадием? — Он жив.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-23\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4408\" target=\"_blank\" rel=\"noopener\">1:13:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa50-24\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Выбор Ларисы будут делать всё тяжелее<\/b><\/div><p>Авторы сказали, что в следующих приключениях будут нарочно усложнять моральный выбор <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что Лариса верна прежде всего приказу короля и действует «во имя добра», даже если за ней остаются трупы.<\/p><blockquote>«мы, скорее всего, будем усложнять делать твой выбор ещё тяжелее»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-24\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4790\" target=\"_blank\" rel=\"noopener\">1:19:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa50-25\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Если бы отряд попал в рабство, выпуск бы просто закончился<\/b><\/div><p>Рынок рабов или каменоломню на юге отыгрывать бы не стали: если бы герои смирились с пленом, им бы объявили, что они не справились, и выпуск закончился. Потом либо сыграли бы другую миссию, либо вовсе забыли бы о крысе, чтобы не затягивать её историю.<\/p><blockquote>«Рынок бы мы не играли. Если бы герои оказались уже в ловушке... мы бы просто закончили»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-25\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4853\" target=\"_blank\" rel=\"noopener\">1:20:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-26\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Французский акцент Люсьена забыли случайно<\/b><\/div><p>Бреганов придумал Люсьена с французским акцентом, но в суматохе морского боя забыл о нём. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> это заметил, и мастер вышел из положения: акцент — показной, «для клиентов». Случайная ошибка тут же стала каноном.<\/p><blockquote>«Мой акцент для клиентов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-26\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4853\" target=\"_blank\" rel=\"noopener\">1:20:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-27\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Клип к 50-му выпуску сделан нейросетями<\/b><\/div><p>Трёхминутный клип в начале выпуска сгенерировал нейросетями режиссёр Дима Пепеляев: на это ушли несколько дней и тысячи кредитов. Задуманный гэг, где <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> отрезает кусок торта зажмурившемуся Лёше, сделать не удалось: нейросеть не умела изображать испуг. Что выпуск юбилейный, вспомнили только на съёмке.<\/p><blockquote>«Это Дима Пепеляев, наш наш режиссёр... потратил несколько дней и ночей и тысяч кредитов»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-27\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5231\" target=\"_blank\" rel=\"noopener\">1:27:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-28\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Что будет с Дайхардом-ревенантом после мести<\/b><\/div><p>Ревенант — скорее надстройка над расой (как вампир): выполнив миссию мести, он умирает окончательно. Но цель может смениться: если выяснится, что настоящий виновник — тот, кто отдал приказ, ревенант разворачивается к новой цели; новую цель можно согласовать с духами. <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> отметил, что компас Дайхарда как раз указывает на цель.<\/p><blockquote>«И вот если он выполняет свою миссию, то тогда он умирает. Всё, он заканчивает свою жизнь.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-28\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5610\" target=\"_blank\" rel=\"noopener\">1:33:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-29\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Название «Мул» — в честь контрабандистов<\/b><\/div><p>Корабль Люсьена назван «Мулом», как называют курьеров, перевозящих людей и грузы через границу; это не аббревиатура. Долгое (около 20 минут) зачитывание названия при монтаже вырезали.<\/p><blockquote>«это аббревиатура была мул. — Нет... просто в честь мула»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-29\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5675\" target=\"_blank\" rel=\"noopener\">1:34:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-30\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему по пиратам стрелял один матрос<\/b><\/div><p>Команда «Мула» почти не сражалась, потому что мастер ждал, что герои возьмут командование на себя, раз капитан заперся в каюте. Единственный стрелявший «озабоченный матрос» был сигналом к этому, но игроки его не поняли.<\/p><blockquote>«Он просто сказал, что он, потому что мастер игры ждал от тебя и твоей команды как-то инициативы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-30\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5738\" target=\"_blank\" rel=\"noopener\">1:35:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-31\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Команда Люсьена не знала о работорговле<\/b><\/div><p>Матросы «Мула» не знали, что пассажиров продают: их задача была довезти людей до Поющего рифа, а там пассажиров пересаживали на краболов якобы до <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a>. Люсьена уже много раз грабили пираты, его прежние команды уводили в рабство, а самого отпускали, чтобы он возил новых людей, — по сути, он работал и на пиратов. В Гнилой Гавани за золотую монету наймётся кто угодно.<\/p><blockquote>«Люсьена уже кучу раз грабили. Его команду уже и до этого уже забирали в рабство. Его отпускали, чтобы он возил... новых»<\/blockquote><p class=\"note\"><a href=\"/pod/qa50/#qa50-31\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5802\" target=\"_blank\" rel=\"noopener\">1:36:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Школа кошек с верёвками и предательство Тигрила<\/b><\/div><p>По лору кошек с верёвками всю жизнь учат быть верным штучным инвентарём благородных и богатых хозяев; у каждой кошки своя неразрывная верёвка, и кошка учится ей соответствовать. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> предал своего хозяина <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и ушёл к <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a>, чем нанёс школе огромный репутационный удар: теперь для каждой такой кошки убить ренегата — дело чести. Поэтому на него и напал пиратский кот; слабость, которой воспользовался Тигрил, была прописана в его карточке.<\/p><blockquote>«для каждой теперь... кошки... с верёвкой просто честь уничтожить, короче, его, убить этого ренегата»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-32\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5993\" target=\"_blank\" rel=\"noopener\">1:39:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a>, <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-33\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>37<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Взрыв корабля с людьми — не сознательный тёмный поворот<\/b><\/div><p>На вопрос, был ли взрыв корабля с невинными осознанным тёмным поворотом, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что всё делалось «во имя добра». Главной чертой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> он назвал верность: договоров у неё всё больше, но она соблюдает каждый, включая приказ короля.<\/p><blockquote>«Её главноя черта верность.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa50/#qa50-33\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6183\" target=\"_blank\" rel=\"noopener\">1:43:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa50-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>38<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Зачем выпуск-«филлер»<\/b><\/div><p>Авторы ответили на упрёки в филлере: чтобы отправить <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> на другой континент, пришлось разработать <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> с её правилами (рост глиафов, «капля крови», статусы). Если бы её привезли сразу в Нерек, лор пришлось бы зачитывать полчаса, и игра превратилась бы в аудиокнигу. Путешествие нужно, чтобы игроки действовали и узнавали о мире порциями. Подготовили и механику морских боёв, но она толком не сработала.<\/p><blockquote>«филерные эпизоды нужны для того, чтобы вы продолжали... чтобы делали что-то, чтобы вы занимались и узнавали эту информацию порционно»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa50/#qa50-34\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6309\" target=\"_blank\" rel=\"noopener\">1:45:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa50-35\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>39<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b><\/div><p>На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду.<\/p><blockquote>«Зачем ты согласился отдать сирене ногу? — Потому что я уже мёртвый. Мне вообще не больно было.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/p><p class=\"note\">Усачев · <a href=\"/pod/qa50/#qa50-35\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa50-36\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>40<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Тигрил отказался от клятвы мести Тургуру<\/b><\/div><p>В записанном сообщении <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> отверг клятву, потому что <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> снова поспешно пообещала помощь, не посоветовавшись с отрядом; это уже не первый её контракт. Разочаровавшись в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионе<\/a> и предав «кошачью честь», Тигрил допускает, что уйдёт и от Ларисы: коты — вольные хищники, и служить ей беспрекословно он не станет.<\/p><blockquote>«служить беспрекословно крысе я не буду»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa50/#qa50-36\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6691\" target=\"_blank\" rel=\"noopener\">1:51:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-37\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>41<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Порода Тигрила<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> описал <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> как обычного рыжего кота, скорее рыжего с белым; на диване сошлись, что он дворняга.<\/p><blockquote>«А Тигрил благородный кот, рыжий обычный.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa50/#qa50-37\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6817\" target=\"_blank\" rel=\"noopener\">1:53:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa50-38\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>42<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Откуда прозвище Джона Солёной Бороды<\/b><\/div><p>Бреганов, которого в выпуске перебили, объяснил прозвище: морская вода оседает в бороде белым налётом, похожим на седину. Ведущие пошутили, что Джон, возможно, просто сед и, молодясь, выдаёт седину за соль.<\/p><blockquote>«Вода задерживается обязательно в бороде. Там возникает белый налёт, который похож на седину.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa50/#qa50-38\">Подкаст по #50<\/a> · <a href=\"https://youtu.be/g-5LXn0KKXE?t=7194\" target=\"_blank\" rel=\"noopener\">1:59:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><\/section>", "chars": {"Сэр Каблучанус": {"name": "Сэр Каблучанус", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Дима Коваль"], "kind": "pc", "dead": false, "race": "человек, рыцарь-дипломат", "portraits": [], "url": "/c/ser-kabluchanus/", "eps": [{"key": "50", "label": "50", "title": "Крыса корабельная"}]}, "Гуля": {"name": "Гуля", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/gulya/", "eps": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}, "Бубстелла": {"name": "Бубстелла", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Сабина Хайрова"], "kind": "pc", "dead": false, " т Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}, "Дайхард «Камбэк»": {"name": "Дайхард «Камбэк»", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Руслан Усачев"], "kind": "pc", "dead": false, "race": "возрождённый гном-шаман", "portraits": [], "url": "/c/dayhart-kambek/", "eps": [{"key": "50", "label": "50", "title": "Крыса корабельная"}]}, "Тигрил": {"name": "Сержант Тигрил", "img": "img/chars/serzhant-tigril.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D0%B5%D1%80%D0%B6%D0%B0%D0%BD%D1%82_%D0%A2%D0%B8%D0%B3%D1%80%D0%B8%D0%BB", "summary": "Сержант Тигрил - чистокровный горный кот из элитного отряда кошек с верёвками. Соратник крысы Ларисы.", "infobox": {"Пол": "мужской", "Раса": "кот", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": false, "race": "кот", "portraits": [], "url": "/c/serzhant-tigril/", "eps": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}}, "footer": "Портреты и данные инфобоксов — с <a href=\"https://pck.fandom.com/ru/\" target=\"_blank\" rel=\"noopener\">вики «Подземелья Чикен Карри» на Fandom<\/a> (CC BY-SA). Фанатский проект, не связан с авторами шоу. Автор — <a href=\"https://t.me/yetanothermike\" target=\"_blank\" rel=\"noopener\">@yetanothermike<\/a> в Telegram.", "comments": {"data-comments-app-website": "8Vm1YAFo", "data-limit": "10", "data-color": "FFC500", "data-dark": "1", "data-outlined": "1", "data-colorful": "1"}, "prev": {"key": "49", "label": "49", "title": "Раненый дракон"}, "next": {"key": "51", "label": "51", "title": "Точка невозврата"}, "prevBranch": {"key": "44", "label": "44", "title": "Королевская охота"}, "nextBranch": null};</script>
