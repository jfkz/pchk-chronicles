<script>window.EPD = {"anim": false, "key": "50", "label": "50", "title": "Крыса корабельная", "date": "2026-06-27", "minutes": 138, "duration": 8274.0, "video_id": "Ebygf7iyngY", "branch": "Отряд крысы Ларисы", "branch_color": "#DD7A2F", "place": "Багряное море: путь из Гнилой Гавани через Поющий риф в порт Нерек (Великая Фалария)", "short_html": "По приказу <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> с отрядом плывёт в закрытую для чужаков Великую <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> за вторым свитком Апокалипсиса. Капитан-контрабандист Люсьен оказывается работорговцем; его корабль захватывают пираты, но отряд сбегает, а крысиный рой взрывает пиратский корабль вместе со всеми, кто был на борту. У Поющего рифа герои убивают сирен, добывают <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> и захватывают фаларийский краболов работорговца Дерека. Каблучанус в облике Дерека обманывает капитана Тургура, отряд клянётся морским духам отомстить Тургуру за Дайхарта и прибывает в порт Нерек.", "summary_html": "Юбилейный 50-й выпуск. По приказу короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> отправляется за <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a> в Великую <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, чтобы добыть второй свиток Апокалипсиса. Нелегальный перевозчик из Гнилой Гавани, капитан Люсьен, оказывается работорговцем; его корабль «Мул» захватывают пираты Джона Солёной Бороды, но отряд сбегает на шлюпке, а крысиный рой Ларисы взрывает пиратский корабль вместе со всеми, кто на нём был. У Поющего рифа герои убивают двух сирен, добывают <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> (Каблучанус меняет ногу на протез удачи), захватывают фаларийский корабль-краболов работорговца Дерека и под видом Дерека уходят от патрульного катамарана капитана Тургура, давшего клятву перед морскими духами отомстить ему. Отряд прибывает в фаларийский порт Нерек.", "outcome_html": "Отряд целым добрался до фаларийского порта <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерек<\/a>, получив <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>; Каблучанус потерял ногу, а пираты, Люсьен и экипаж «Мула» погибли при взрыве.", "world_html": ["Впервые показана <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a>: глиафы, рабы-«Зеро», закон о капле, закрытые границы", "Фаларийские свитки Апокалипсиса — цель миссии <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> по приказу <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>", "Схема работорговли через Поющий риф (Люсьен, Дерек) раскрыта", "<a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> у отряда", "Клятва морским духам убить капитана Тургура"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Бусти-заставка от лица крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>; песня к 50-му выпуску «Полсотни»."}, {"t": "0:03:15", "sec": 195, "html": "Пролог: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в руинах <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> разбудила мумию императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a>; тот рассказал о трёх свитках Апокалипсиса (один уничтожил Малестию, два других у правителей <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> и <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a>) и за некую услугу даровал ей бессмертие. Лариса пыталась отнять свиток у <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> на охоте, но присягнула ему; король отправил её за фаларийским свитком."}, {"t": "0:05:58", "sec": 358, "html": "Завязка: <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a> за Багряным морем основана глиафами — серокожими людьми ростом около 2,5 м, считающими себя потомками богов; статус определяется «каплей» глиафской крови, остальные — рабы-«Зеро». Из-за потока беженцев от демонического нашествия Фалария закрыла порты для чужих судов. Отряд за 5 золотых с каждого нанимает в Гнилой Гавани контрабандиста; цель — порт Нерек."}, {"t": "0:07:48", "sec": 468, "html": "Представление героев: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (бессмертная, хочет свитком сокрушить <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>); <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> (выпускник «школы кошек с верёвками», его унижает служба крысе, в море страдает паническими атаками); Каблучанус (бастард графини и пастуха, пьяным обвенчался с дварфийкой и благодаря этому уговорил кунисских дварфов отказаться от независимости, за что получил титул «сэр»); <a class=\"ref\" href=\"/c/bupstella/\">Бупстелла<\/a> (уродливую дварфиху отдали в школу магии, где она «исправила» себя заклинаниями и вышла за гвардейца ради титула); Дайхарт (гном, влюблённый в море; утонул, плывя к <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a>, и был возвращён к жизни духами — отсюда прозвище «Камбэк»)."}, {"t": "0:14:52", "sec": 892, "html": "Рекламная сценка-флешбэк: эльф (<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>) проклинает «дьявольскую маску» Януса и мечтает спокойно жить с <a class=\"ref\" href=\"/c/kristina/\">Кристиночкой<\/a>; стражники упоминают «бандитов Януса»."}, {"t": "0:19:10", "sec": 1150, "html": "Неделя пути на корабле «Мул»; капитан Люсьен с фальшивым французским акцентом объявляет пересадку у Поющего рифа на фаларийский краболов «Клешня». Дайхарт обыскивает бедный трюм, <a class=\"ref\" href=\"/c/bupstella/\">Бупстелла<\/a> отвлекает матросов (в том числе матроса Жила с обожжённым лицом)."}, {"t": "0:25:33", "sec": 1533, "html": "«Пираты!» Люсьен запирается в каюте с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> и предлагает пить ром под кроватью; команду шлёт в бой. Дайхарт призывает духа ветра, <a class=\"ref\" href=\"/c/bupstella/\">Бупстелла<\/a> магией чинит паруса, но залп пиратов сносит мачты."}, {"t": "0:35:10", "sec": 2110, "html": "Подзорная труба: пиратов 14, на абордаж готовятся капитан и четверо. Каблучанус сталкивает Жила за борт, герои стреляют из пушек; <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> разносит носовую пушку пиратов."}, {"t": "0:43:25", "sec": 2605, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> говорит с анакондой Люсьена Шишей: её секрет — она отложила яйца в столе капитана; затем анаконда глотает Ларису."}, {"t": "0:46:22", "sec": 2782, "html": "Второй залп пиратов почти топит «Мул» (осталось 30 прочности); отряд вывешивает белый флаг. Капитан Джон Солёная Борода с котом Сэром Веслоухим Кискисом берёт команду в рабство, хочет забрать <a class=\"ref\" href=\"/c/bupstella/\">Бупстеллу<\/a> в свою каюту. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> вызывает кота-пирата на бой за корабль и топит его, бросив клубок ниток в воду; самого Тигрила капитан швыряет за борт."}, {"t": "0:57:28", "sec": 3448, "html": "Каблучанус тратит монету на способность «дипломат»: в команде пиратов оказывается его однокашник по кадетской академии по кличке Гнида; Джон предлагает Каблучанусу вступить в команду."}, {"t": "1:01:47", "sec": 3707, "html": "Дайхарт телепортируется в каюту, отряд запирается там; <a class=\"ref\" href=\"/c/bupstella/\">Бупстелла<\/a> руками выдавливает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> из анаконды, та прогрызает её изнутри. Люсьен пытается разбить яйца анаконды и спрятать книгу — это его бухгалтерия: он копит на дом за 1000 золотых, продавая 400–500 нелегалов в рабство. Одно яйцо спасено."}, {"t": "1:11:52", "sec": 4312, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> призывает рой крыс; крысы соглашаются умереть и прячутся в бочках пороха, которые перегружают на пиратский корабль. Каблучанус забирает сундук Люсьена."}, {"t": "1:15:25", "sec": 4525, "html": "Отряд спускается в шлюпку, дух воды беззвучно опускает её и приводит <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> под водой (с пузырьком валерьянки на морде). Дайхарт делает из шлюпки ледяную «подводную лодку»."}, {"t": "1:22:54", "sec": 4974, "html": "Отряд голосует не спасать пленников: пиратский корабль взрывается вместе с пиратами, Люсьеном и экипажем «Мула». В сундуке — заряженный пистоль и 2 золотые. Яйцо анаконды согревают между грудей <a class=\"ref\" href=\"/c/bupstella/\">Бупстеллы<\/a>. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> проводит «летучку»: «мы команда»."}, {"t": "1:27:45", "sec": 5265, "html": "Через неделю плавания без пресной воды — Поющий риф. Пение сирен зачаровывает <a class=\"ref\" href=\"/c/bupstella/\">Бупстеллу<\/a>, Каблучануса и <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>; те уплывают в подводную пещеру."}, {"t": "1:31:05", "sec": 5465, "html": "Три сирены (Буля, Гуля/Гульмира и ещё одна) просят историю; Каблучанус рассказывает свою жизнь, сирена достаёт у него «из-за уха» монету и лезет под доспех. Сирены хотят съесть его ногу в обмен на «протез удачи»; по воле жены отряд атакует."}, {"t": "1:42:38", "sec": 6158, "html": "Бой: магические стрелы <a class=\"ref\" href=\"/c/bupstella/\">Бупстеллы<\/a>, рой саранчи <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, Каблучанус способностью «палач» обезглавливает двух сирен. Выжившая Гуля выкупает жизнь секретом об <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулете глубин<\/a> на затонувшем корабле."}, {"t": "1:47:53", "sec": 6473, "html": "Дайхарт перехватывает Гулю; Каблучанус всё же отдаёт ей ногу за протез удачи. Дух акулы уводит рифовую акулу; в рубке затонувшей «Мариэллы» Дайхарт забирает у скелета капитана амулет и бутылку с запиской («<a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> сводит меня с ума… я решил затопить судно»)."}, {"t": "1:53:03", "sec": 6783, "html": "<a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> находит у рифа краболов «Клешня» под бело-синими фаларийскими флагами; рифовый дух объясняет схему: краб-капитан Дерек прячет нелегалов в бочки и везёт не в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, а на южные рудники. <a class=\"ref\" href=\"/c/bupstella/\">Бупстелла<\/a> превращает Каблучануса в копию Дерека; Тигрил якорным канатом сметает матросов в воду и берёт последнего в заложники."}, {"t": "1:59:37", "sec": 7177, "html": "Изучение <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулета глубин<\/a> (с поцелуем протеза удачи): корабль капитана-владельца может на час уйти под воду до 200 м с безопасной средой; хозяина амулет со временем сводит с ума, вне моря он получает психический урон. Настоящий Дерек с морозным кольцом замораживает воду перед кораблём — <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> парализует его, он тонет; <a class=\"ref\" href=\"/c/bupstella/\">Бупстелла<\/a> растапливает лёд огненными ладонями."}, {"t": "2:05:02", "sec": 7502, "html": "В водах <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a> патрульный катамаран; Дайхарт признаётся: его не утопил шторм — его поработил капитан береговой охраны «Щита Нерека» Тургур (фаларийское клеймо на шее), а потом перерезал ему горло; духи оживили его ради мести. Отряд клянётся перед морскими духами убить Тургура (но не сейчас)."}, {"t": "2:10:33", "sec": 7833, "html": "<a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> надевает признанный капитан отряда. Каблучанус в облике Дерека убеждает Тургура не обыскивать корабль, жалуясь на «закон о капле» и Люсьена; Тургур уходит. У <a class=\"ref\" href=\"/c/bupstella/\">Бупстеллы<\/a> вылупляется детёныш анаконды."}, {"t": "2:15:52", "sec": 8152, "html": "Корабль прибывает в порт Нерек. 13 монет = 130 000 руб. на благотворительность. Эпилог: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> открыла новую локацию мира — <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>; впереди поиск свитка."}], "key_events": [{"t": "0:25:33", "sec": 1533}, {"t": "0:45:12", "sec": 2712}, {"t": "0:55:55", "sec": 3355}, {"t": "1:09:00", "sec": 4140}, {"t": "1:23:45", "sec": 5025}, {"t": "1:44:45", "sec": 6285}, {"t": "1:51:12", "sec": 6672}, {"t": "1:57:28", "sec": 7048}, {"t": "2:09:15", "sec": 7755}, {"t": "2:12:02", "sec": 7922}, {"t": "2:15:52", "sec": 8152}], "coins": {"ep": "50", "events": [{"t": "0:56:36", "kind": "earn", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "за находчивость — бросил клубок ниток в воду, чтобы отвлечь и утопить капитана-кота", "result": null, "sec": 3396, "who_url": "/c/serzhant-tigril/", "reason_html": "за находчивость — бросил клубок ниток в воду, чтобы отвлечь и утопить капитана-кота"}, {"t": "0:57:20", "kind": "spend", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "потратил монету на скилл «дипломат», чтобы получить союзника среди экипажа (оказался однокурсник по кадетской академии)", "result": null, "sec": 3440, "who_url": "/c/ser-kabluchanus/", "reason_html": "потратил монету на скилл «дипломат», чтобы получить союзника среди экипажа (оказался однокурсник по кадетской академии)"}, {"t": "1:11:11", "kind": "earn", "who": "Дайхарт «Камбэк»", "actor": "Руслан Усачев", "to": null, "reason": "за находчивый план — самому взорваться вместе с порохом (благодаря регенерации), чтобы уничтожить корабль работорговцев", "result": null, "sec": 4271, "who_url": "/c/dayhart-kambek/", "reason_html": "за находчивый план — самому взорваться вместе с порохом (благодаря регенерации), чтобы уничтожить корабль работорговцев"}, {"t": "1:16:06", "kind": "earn", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "за остроумную реплику о командном духе перед побегом с тонущего корабля", "result": null, "sec": 4566, "who_url": "/c/ser-kabluchanus/", "reason_html": "за остроумную реплику о командном духе перед побегом с тонущего корабля"}, {"t": "1:26:04", "kind": "loot", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "нашёл в открытом сундуке пистоль с одной пулей и две золотые монеты — это внутриигровые деньги (лут), а не игровая монета-награда", "result": null, "sec": 5164, "who_url": "/c/ser-kabluchanus/", "reason_html": "нашёл в открытом сундуке пистоль с одной пулей и две золотые монеты — это внутриигровые деньги (лут), а не игровая монета-награда"}, {"t": "1:36:13", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "за отыгрыш сцены с сиреной, которая фокусом «достала» монету у неё из-за уха", "result": null, "sec": 5773, "who_url": "/c/krysa-larisa/", "reason_html": "за отыгрыш сцены с сиреной, которая фокусом «достала» монету у неё из-за уха"}, {"t": "1:46:28", "kind": "earn", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "за отыгрыш переговоров с третьей сиреной, которая в ответ бросила в него монетой, умоляя не убивать её", "result": null, "sec": 6388, "who_url": "/c/ser-kabluchanus/", "reason_html": "за отыгрыш переговоров с третьей сиреной, которая в ответ бросила в него монетой, умоляя не убивать её"}, {"t": "2:14:20", "kind": "spend", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "потратил монету на бонус к проверке убеждения краба-короля Дрека, выдавая себя за краба", "result": "неудача — краб-король раскусил обман и с презрением прогнал Тигрила из своих вод", "sec": 8060, "who_url": "/c/serzhant-tigril/", "reason_html": "потратил монету на бонус к проверке убеждения краба-короля Дрека, выдавая себя за краба"}, {"t": "2:16:22", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальный подсчёт оставшихся на столе монет (13 штук = 130 000 руб.), которые традиционно уходят в благотворительный фонд", "result": null, "sec": 8182, "who_url": null, "reason_html": "финальный подсчёт оставшихся на столе монет (13 штук = 130 000 руб.), которые традиционно уходят в благотворительный фонд"}], "totals": [{"who": "Сэр Каблучанус", "actor": "Дима Коваль", "earned": 2, "spent": 1, "img": null, "who_url": "/c/ser-kabluchanus/", "actor_url": "/p/dima-koval/"}, {"who": "Сержант Тигрил", "actor": "BRB", "earned": 1, "spent": 1, "img": "img/chars/serzhant-tigril.webp", "who_url": "/c/serzhant-tigril/", "actor_url": "/p/brb/"}, {"who": "Дайхарт «Камбэк»", "actor": "Руслан Усачев", "earned": 1, "spent": 0, "img": null, "who_url": "/c/dayhart-kambek/", "actor_url": "/p/ruslan-usachev/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Кроме игровых монет за шутки и находчивость, в выпуске был эпизод внутриигрового лута (пистоль и две золотые монеты в сундуке) — он отмечен как kind: loot и не входит в totals; в финале, как обычно, оставшиеся на столе монеты (13 шт.) конвертируются в 130 000 руб. на благотворительность."}, "cast": [{"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, бессмертная убийца", "role": "", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, {"name": "Сержант Тигрил", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "кот с верёвкой, боец", "role": "", "fate": "выжил", "id": "Тигрил", "url": "/c/serzhant-tigril/", "img": "img/chars/serzhant-tigril.webp", "other": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, {"name": "Сэр Каблучанус", "actor": "Дима Коваль", "actor_url": "/p/dima-koval/", "race": "человек, рыцарь-дипломат", "role": "", "fate": "выжил, потерял ногу", "id": "Сэр Каблучанус", "url": "/c/ser-kabluchanus/", "img": null, "other": []}, {"name": "Бупстелла", "actor": "Сабина Хайрова", "actor_url": "/p/sabina-hayrova/", "race": "дварфиха, волшебница", "role": "", "fate": "выжила", "id": "Бупстелла", "url": "/c/bupstella/", "img": null, "other": []}, {"name": "Дайхарт «Камбэк»", "actor": "Руслан Усачев", "actor_url": "/p/ruslan-usachev/", "race": "возрождённый гном-шаман", "role": "", "fate": "выжил", "id": "Дайхарт «Камбэк»", "url": "/c/dayhart-kambek/", "img": null, "other": []}], "npcs": [{"name": "Капитан Люсьен", "actor": "", "actor_url": null, "race": "", "role": "контрабандист-работорговец, капитан «Мула»", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Шиша", "actor": "", "actor_url": null, "race": "", "role": "анаконда Люсьена", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}, {"name": "Джон Солёная Борода", "actor": "", "actor_url": null, "race": "", "role": "капитан пиратов", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Сэр Веслоухий Кискис", "actor": "", "actor_url": null, "race": "", "role": "кот пиратского капитана", "fate": "вероятно погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Гнида", "actor": "", "actor_url": null, "race": "", "role": "пират, однокашник Каблучануса", "fate" я пленница", "note_html": "Каблучанус уладил требования независимости кунисских дварфов", "dir": "out", "color": "#B8901C"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> присягнула <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> на королевской охоте", "dir": "out", "color": "#DD7A2F"}], "quotes_html": ["<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>: «Хотели меня разбить враги? Пососите мой хвост. Я вас ещё всех переживу».", "Каблучанус: «Я сэр Каблучанус, и я слушаю только свою жену».", "Анаконда Шиша: «Мой секрет: я отложила яички ему в стол».", "Каблучанус-Дерек: «Ты рассказываешь, что ты двухметровый красивый… а я с клешнями».", "Мастер: «Это подземелье Чикен Карри нас схватило ровно на 50 выпусках»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/gnilaya-gavan/\">Гнилая Гавань<\/a>; <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a>; Поющий риф и подводная пещера сирен; затонувший корабль «Мариэлла»; <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a>, порт Нерек; упомянуты руины <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> и южные рудники Фаларии.<\/li>\n<li>Фракции: <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a> (глиафы; рабы-«Зеро»; «закон о капле»); береговая охрана Нерека; пираты Джона Солёной Бороды; работорговцы Люсьена и Дерека; сирены Поющего рифа; бандиты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (упоминание).<\/li>\n<li>Артефакты: свитки Апокалипсиса (цель); <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>; протез удачи; пистоль с одной пулей; бухгалтерия Люсьена; яйцо/детёныш анаконды; морозное кольцо Дерека; фаларийское клеймо Дайхарта; корабли «Мул» (уничтожен), пиратский корабль (взорван), краболов «Клешня» (захвачен).<\/li>\n<\/ul>", "chars": {"Тигрил": {"name": "Сержант Тигрил", "img": "img/chars/serzhant-tigril.webp", "wiki_url": "ht
