<script>window.EPD = {"anim": false, "key": "50", "label": "50", "title": "Крыса корабельная", "date": "2026-06-27", "minutes": 138, "duration": 8274.0, "video_id": "Ebygf7iyngY", "branch": "Отряд крысы Ларисы", "branch_color": "#DD7A2F", "place": "Багряное море: путь из Гнилой Гавани через Поющий риф в порт Нерек (Великая Фалария)", "short_html": "По приказу короля крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> с отрядом плывёт в закрытую Великую <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> за вторым свитком Апокалипсиса.", "summary_html": "Юбилейный 50-й выпуск. По приказу короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> отправляется за <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a> в Великую <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, чтобы добыть второй свиток Апокалипсиса. Нелегальный перевозчик из Гнилой Гавани, капитан Люсьен, оказывается работорговцем; его корабль «Мул» захватывают пираты Джона Солёной Бороды, но отряд сбегает на шлюпке, а крысиный рой Ларисы взрывает пиратский корабль вместе со всеми, кто на нём был. У Поющего рифа герои убивают двух сирен, добывают <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> (Каблучанус меняет ногу на протез удачи), захватывают фаларийский корабль-краболов работорговца Дерека и под видом Дерека уходят от патрульного катамарана капитана Тургура, давшего клятву перед морскими духами отомстить ему. Отряд прибывает в фаларийский порт Нерек.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Зачем выпуск-«филлер»\">38<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Зачем выпуск-«филлер»<\/b> Авторы ответили на упрёки в филлере: чтобы отправить <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> на другой континент, пришлось разработать <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> с её правилами (рост глиафов, «капля крови», статусы). Если бы её привезли сразу в Нерек, лор пришлось бы зачитывать полчаса, и игра превратилась бы в аудиокнигу. Путешествие нужно, чтобы игроки действовали и узнавали о мире порциями. Подготовили и механику морских боёв, но она толком не сработала. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6309\" target=\"_blank\" rel=\"noopener\">1:45:09 ↗<\/a> · <a href=\"#qa50-34\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дайхард, а не Каблучанус, отдал ногу сирене\">39<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b> На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/span> <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 ↗<\/a> · <a href=\"#qa50-35\">к записи<\/a><\/span><\/span>", "outcome_html": "Отряд целым добрался до фаларийского порта <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерек<\/a>, получив <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>; Каблучанус потерял ногу, а пираты, Люсьен и экипаж «Мула» погибли при взрыве.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дайхард, а не Каблучанус, отдал ногу сирене\">39<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b> На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/span> <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 ↗<\/a> · <a href=\"#qa50-35\">к записи<\/a><\/span><\/span>", "world_html": ["Впервые показана <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a>: глиафы, рабы-«Зеро», закон о капле, закрытые границы", "Фаларийские свитки Апокалипсиса — цель миссии <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> по приказу <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Поний V — интриган, а не «добрый пушистый» король\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Поний V — интриган, а не «добрый пушистый» король<\/b> Отвечая на упрёки в излишней доброте шоу, мастер подчеркнул, что <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> ведёт свою политическую игру: он не удержался бы на престоле, если бы не умел вертеть людьми — например, крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, которой он дал задание после её присяги. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6806\" target=\"_blank\" rel=\"noopener\">1:53:26 ↗<\/a> · <a href=\"#qa47-36\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сфинктерион не мог пожелать у джинна свиток за Багряным морем\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сфинктерион не мог пожелать у джинна свиток за Багряным морем<\/b> В «Гонке за желанием» <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не мог попросить у джинна свиток Апокалипсиса из-за Багряного моря: он ничего о нём не знал. О свитке знает только крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, а Сфинктерион даже не знает, где она. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6279\" target=\"_blank\" rel=\"noopener\">1:44:39 ↗<\/a> · <a href=\"#qa49-31\">к записи<\/a><\/span><\/span>", "Схема работорговли через Поющий риф (Люсьен, Дерек) раскрыта<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Схема Люсьена и детский крестовый поход\">25<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Схема Люсьена и детский крестовый поход<\/b> Люсьен брал деньги с желающих попасть в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> и продавал их в рабство; никто из его пассажиров не возвращался. Авторы сослались на детский крестовый поход, участников которого судовладельцы вместо Святой земли продали на рабовладельческих рынках Африки. Схема держалась на слухах о «надёжном» капитане Люсьене. Миссию можно было начать и с поиска корабля в Гнилой Гавани, но не хватило бы хронометража. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4153\" target=\"_blank\" rel=\"noopener\">1:09:13 ↗<\/a> · <a href=\"#qa50-21\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> у отряда<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Амулет глубин задумывали как финальный ход\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Амулет глубин задумывали как финальный ход<\/b> Авторы рассчитывали, что <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> станет хорошей концовкой: отряд выберет капитана, уйдёт под воду и т. п. В итоге амулетом так никто и не воспользовался. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1673\" target=\"_blank\" rel=\"noopener\">0:27:53 ↗<\/a> · <a href=\"#qa50-9\">к записи<\/a><\/span><\/span>", "Клятва морским духам убить капитана Тургура<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Тигрил отказался от клятвы мести Тургуру\">40<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Тигрил отказался от клятвы мести Тургуру<\/b> В записанном сообщении <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> отверг клятву, потому что <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> снова поспешно пообещала помощь, не посоветовавшись с отрядом; это уже не первый её контракт. Разочаровавшись в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионе<\/a> и предав «кошачью честь», Тигрил допускает, что уйдёт и от Ларисы: коты — вольные хищники, и служить ей беспрекословно он не станет. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6691\" target=\"_blank\" rel=\"noopener\">1:51:31 ↗<\/a> · <a href=\"#qa50-36\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Бусти-заставка от лица крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>; песня к 50-му выпуску «Полсотни».<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Клип к 50-му выпуску сделан нейросетями\">31<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Клип к 50-му выпуску сделан нейросетями<\/b> Трёхминутный клип в начале выпуска сгенерировал нейросетями режиссёр Дима Пепеляев: на это ушли несколько дней и тысячи кредитов. Задуманный гэг, где <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> отрезает кусок торта зажмурившемуся Лёше, сделать не удалось: нейросеть не умела изображать испуг. Что выпуск юбилейный, вспомнили только на съёмке. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5231\" target=\"_blank\" rel=\"noopener\">1:27:11 ↗<\/a> · <a href=\"#qa50-27\">к записи<\/a><\/span><\/span>"}, {"t": "0:03:15", "sec": 195, "html": "Пролог: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в руинах <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> разбудила мумию императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a>; тот рассказал о трёх свитках Апокалипсиса (один уничтожил Малестию, два других у правителей <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> и <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a>) и за некую услугу даровал ей бессмертие. Лариса пыталась отнять свиток у <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> на охоте, но присягнула ему; король отправил её за фаларийским свитком.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Поний V — интриган, а не «добрый пушистый» король\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Поний V — интриган, а не «добрый пушистый» король<\/b> Отвечая на упрёки в излишней доброте шоу, мастер подчеркнул, что <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> ведёт свою политическую игру: он не удержался бы на престоле, если бы не умел вертеть людьми — например, крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, которой он дал задание после её присяги. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6806\" target=\"_blank\" rel=\"noopener\">1:53:26 ↗<\/a> · <a href=\"#qa47-36\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Бессмертие Ларисы может снять тот, кто его дал\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Бессмертие Ларисы может снять тот, кто его дал<\/b> На вопрос, можно ли лишить крысу <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> бессмертия, ответили, что в теории да — это может сделать тот, кто его дал. Мумия императора <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> — нежить: не жива, но и не мертва, то есть по-прежнему существует. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=1155\" target=\"_blank\" rel=\"noopener\">0:19:15 ↗<\/a> · <a href=\"#qa49-6\">к записи<\/a><\/span><\/span>"}, {"t": "0:05:58", "sec": 358, "html": "Завязка: <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a> за Багряным морем основана глиафами — серокожими людьми ростом около 2,5 м, считающими себя потомками богов; статус определяется «каплей» глиафской крови, остальные — рабы-«Зеро». Из-за потока беженцев от демонического нашествия Фалария закрыла порты для чужих судов. Отряд за 5 золотых с каждого нанимает в Гнилой Гавани контрабандиста; цель — порт Нерек.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Лариса не пробралась на корабль тайком\">24<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Лариса не пробралась на корабль тайком<\/b> <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> могла бы проникнуть на любое судно как обычная крыса, но, во-первых, это было условие короля: она плывёт по его заданию вместе с его людьми. Во-вторых, фаларийские порты пускают только суда под фаларийским флагом. Авторы добавили, что Лариса давно говорит по-человечески (в выпуске 15 — благодаря щиту, теперь постоянно на зелье) и уже не мыслит себя простой крысой. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4024\" target=\"_blank\" rel=\"noopener\">1:07:04 ↗<\/a> · <a href=\"#qa50-20\">к записи<\/a><\/span><\/span>"}, {"t": "0:07:48", "sec": 468, "html": "Представление героев: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (бессмертная, хочет свитком сокрушить <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>); <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> (выпускник «школы кошек с верёвками», его унижает служба крысе, в море страдает паническими атаками); Каблучанус (бастард графини и пастуха, пьяным обвенчался с дварфийкой и благодаря этому уговорил кунисских дварфов отказаться от независимости, за что получил титул «сэр»); <a class=\"ref\" href=\"/c/bupstella/\">Бубстелла<\/a> (уродливую дварфиху отдали в школу магии, где она «исправила» себя заклинаниями и вышла за гвардейца ради титула); Дайхард (гном, влюблённый в море; утонул, плывя к <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a>, и был возвращён к жизни духами — отсюда прозвище «Камбэк»).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дайхард плыл с отрядом Ларисы\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дайхард плыл с отрядом Ларисы<\/b> Дайхард искал сильную команду, чтобы отомстить Тургуру: в одиночку, без друзей и артефактов, он бы с ним не справился. Поэтому и платил за проезд, а не добирался сам (например, на дельфине). <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1736\" target=\"_blank\" rel=\"noopener\">0:28:56 ↗<\/a> · <a href=\"#qa50-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:14:52", "sec": 892, "html": "Рекламная сценка-флешбэк: эльф (<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>) проклинает «дьявольскую маску» Януса и мечтает спокойно жить с <a class=\"ref\" href=\"/c/kristina/\">Кристиночкой<\/a>; стражники упоминают «бандитов Януса»."}, {"t": "0:19:10", "sec": 1150, "html": "Неделя пути на корабле «Мул»; капитан Люсьен с фальшивым французским акцентом объявляет пересадку у Поющего рифа на фаларийский краболов «Клешня». Дайхард обыскивает бедный трюм, <a class=\"ref\" href=\"/c/bupstella/\">Бубстелла<\/a> отвлекает матросов (в том числе матроса Жила с обожжённым лицом).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Французский акцент Люсьена забыли случайно\">30<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Французский акцент Люсьена забыли случайно<\/b> Бреганов придумал Люсьена с французским акцентом, но в суматохе морского боя забыл о нём. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> это заметил, и мастер вышел из положения: акцент — показной, «для клиентов». Случайная ошибка тут же стала каноном. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4853\" target=\"_blank\" rel=\"noopener\">1:20:53 ↗<\/a> · <a href=\"#qa50-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Название «Мул» — в честь контрабандистов\">33<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Название «Мул» — в честь контрабандистов<\/b> Корабль Люсьена назван «Мулом», как называют курьеров, перевозящих людей и грузы через границу; это не аббревиатура. Долгое (около 20 минут) зачитывание названия при монтаже вырезали. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5675\" target=\"_blank\" rel=\"noopener\">1:34:35 ↗<\/a> · <a href=\"#qa50-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Команда Люсьена не знала о работорговле\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Команда Люсьена не знала о работорговле<\/b> Матросы «Мула» не знали, что пассажиров продают: их задача была довезти людей до Поющего рифа, а там пассажиров пересаживали на краболов якобы до <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a>. Люсьена уже много раз грабили пираты, его прежние команды уводили в рабство, а самого отпускали, чтобы он возил новых людей, — по сути, он работал и на пиратов. В Гнилой Гавани за золотую монету наймётся кто угодно. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5802\" target=\"_blank\" rel=\"noopener\">1:36:42 ↗<\/a> · <a href=\"#qa50-31\">к записи<\/a><\/span><\/span>"}, {"t": "0:25:33", "sec": 1533, "html": "«Пираты!» Люсьен запирается в каюте с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> и предлагает пить ром под кроватью; команду шлёт в бой. Дайхард призывает духа ветра, <a class=\"ref\" href=\"/c/bupstella/\">Бубстелла<\/a> магией чинит паруса, но залп пиратов сносит мачты.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Пиратский корабль назывался «Мерзкий Близнец»\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Пиратский корабль назывался «Мерзкий Близнец»<\/b> В подкасте впервые прозвучало название корабля Джона Солёной Бороды — «Мерзкий Близнец»; в выпуске он был просто «пиратским кораблём». <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=910\" target=\"_blank\" rel=\"noopener\">0:15:10 ↗<\/a> · <a href=\"#qa50-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Референсы духов для иллюстраторов\">16<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Референсы духов для иллюстраторов<\/b> Составляя референсы для иллюстраторов, одного из духов Дайхарда рисовали «под» Геннадия Ветрова (дух ветра), другого — под Водонаеву (дух воды); с духом моря возникла заминка. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2433\" target=\"_blank\" rel=\"noopener\">0:40:33 ↗<\/a> · <a href=\"#qa50-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему по пиратам стрелял один матрос\">34<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему по пиратам стрелял один матрос<\/b> Команда «Мула» почти не сражалась, потому что мастер ждал, что герои возьмут командование на себя, раз капитан заперся в каюте. Единственный стрелявший «озабоченный матрос» был сигналом к этому, но игроки его не поняли. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5738\" target=\"_blank\" rel=\"noopener\">1:35:38 ↗<\/a> · <a href=\"#qa50-30\">к записи<\/a><\/span><\/span>"}, {"t": "0:35:10", "sec": 2110, "html": "Подзорная труба: пиратов 14, на абордаж готовятся капитан и четверо. Каблучанус сталкивает Жила за борт, герои стреляют из пушек; <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> разносит носовую пушку пиратов.<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Эскизы кораблей не показали игрокам\">6<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Эскизы кораблей не показали игрокам<\/b> Авторы признали упущение: для всех кораблей выпуска («Мул», пиратский «Мерзкий Близнец», краболов «Клешня» и катамаран «Щит <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a>») художнику Никите отправляли эскизы палуб и вид сбоку, но на съёмке их не показали. Приключение строилось на выборе судна и его слабых местах, и по виду сбоку игроки могли бы догадаться об уязвимости пиратского корабля. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=910\" target=\"_blank\" rel=\"noopener\">0:15:10 ↗<\/a> · <a href=\"#qa50-2\">к записи<\/a><\/span><\/span>"}, {"t": "0:43:25", "sec": 2605, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> говорит с анакондой Люсьена Шишей: её секрет — она отложила яйца в столе капитана; затем анаконда глотает Ларису.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Анаконда Шиша — просто страж каюты капитана\">20<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Анаконда Шиша — просто страж каюты капитана<\/b> По задумке из каюты капитана можно было узнать, что Люсьен везёт пассажиров не в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, а передаёт краболову, который отвезёт их в рабство (их спрячут в бочках и клетках из-под крабов). Анаконда на кровати капитана была лишь препятствием на пути к этой информации, «охранником»; на её месте мог быть кто угодно. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3577\" target=\"_blank\" rel=\"noopener\">0:59:37 ↗<\/a> · <a href=\"#qa50-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Секрет анаконды придумали на ходу\">23<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Секрет анаконды придумали на ходу<\/b> Весь эпизод с «секретиком» анаконды — импровизация: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> спросил, есть ли у неё секрет, и Бреганов сочинил, что она отложила яйца в стол капитана. Мастер разогнался до того, что это дети капитана, но эту линию почти полностью вырезали, остались только намёки. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3897\" target=\"_blank\" rel=\"noopener\">1:04:57 ↗<\/a> · <a href=\"#qa50-19\">к записи<\/a><\/span><\/span>"}, {"t": "0:46:22", "sec": 2782, "html": "Второй залп пиратов почти топит «Мул» (осталось 30 прочности); отряд вывешивает белый флаг. Капитан Джон Солёная Борода с котом Сэром Веслоухим Кискисом берёт команду в рабство, хочет забрать <a class=\"ref\" href=\"/c/bupstella/\">Бубстеллу<\/a> в свою каюту. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> вызывает кота-пирата на бой за корабль и топит его, бросив клубок ниток в воду; самого Тигрила капитан швыряет за борт.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Если бы отряд попал в рабство, выпуск бы просто закончился\">29<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Если бы отряд попал в рабство, выпуск бы просто закончился<\/b> Рынок рабов или каменоломню на юге отыгрывать бы не стали: если бы герои смирились с пленом, им бы объявили, что они не справились, и выпуск закончился. Потом либо сыграли бы другую миссию, либо вовсе забыли бы о крысе, чтобы не затягивать её историю. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4853\" target=\"_blank\" rel=\"noopener\">1:20:53 ↗<\/a> · <a href=\"#qa50-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Школа кошек с верёвками и предательство Тигрила\">36<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Школа кошек с верёвками и предательство Тигрила<\/b> По лору кошек с верёвками всю жизнь учат быть верным штучным инвентарём благородных и богатых хозяев; у каждой кошки своя неразрывная верёвка, и кошка учится ей соответствовать. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> предал своего хозяина <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и ушёл к <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a>, чем нанёс школе огромный репутационный удар: теперь для каждой такой кошки убить ренегата — дело чести. Поэтому на него и напал пиратский кот; слабость, которой воспользовался Тигрил, была прописана в его карточке. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5993\" target=\"_blank\" rel=\"noopener\">1:39:53 ↗<\/a> · <a href=\"#qa50-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Откуда прозвище Джона Солёной Бороды\">42<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Откуда прозвище Джона Солёной Бороды<\/b> Бреганов, которого в выпуске перебили, объяснил прозвище: морская вода оседает в бороде белым налётом, похожим на седину. Ведущие пошутили, что Джон, возможно, просто сед и, молодясь, выдаёт седину за соль. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=7194\" target=\"_blank\" rel=\"noopener\">1:59:54 ↗<\/a> · <a href=\"#qa50-38\">к записи<\/a><\/span><\/span>"}, {"t": "0:57:28", "sec": 3448, "html": "Каблучанус тратит монету на способность «дипломат»: в команде пиратов оказывается его однокашник по кадетской академии по кличке Гнида; Джон предлагает Каблучанусу вступить в команду."}, {"t": "1:01:47", "sec": 3707, "html": "Дайхард телепортируется в каюту, отряд запирается там; <a class=\"ref\" href=\"/c/bupstella/\">Бубстелла<\/a> руками выдавливает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> из анаконды, та прогрызает её изнутри. Люсьен пытается разбить яйца анаконды и спрятать книгу — это его бухгалтерия: он копит на дом за 1000 золотых, продавая 400–500 нелегалов в рабство. Одно яйцо спасено.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Задуманный поворот: пираты честнее капитана\">21<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Задуманный поворот: пираты честнее капитана<\/b> Сценарий предполагал, что отряд отобьётся от пиратов, которыми его пугал Люсьен, и лишь потом узнает, что капитан сам продаёт пассажиров в рабство: пираты оказывались честнее его. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3642\" target=\"_blank\" rel=\"noopener\">1:00:42 ↗<\/a> · <a href=\"#qa50-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Лариса не могла колдовать внутри анаконды\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Лариса не могла колдовать внутри анаконды<\/b> Мастер договорился с игроками, что в желудке анаконды руки и лапы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> скованы: она в состоянии «опутана», а без вербальных и соматических компонентов «Рой саранчи» не сотворить. Сначала надо освободиться (сложность 26), атаки изнутри совершаются с помехой. На рисунках художника поза была другой. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3707\" target=\"_blank\" rel=\"noopener\">1:01:47 ↗<\/a> · <a href=\"#qa50-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Схема Люсьена и детский крестовый поход\">25<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Схема Люсьена и детский крестовый поход<\/b> Люсьен брал деньги с желающих попасть в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> и продавал их в рабство; никто из его пассажиров не возвращался. Авторы сослались на детский крестовый поход, участников которого судовладельцы вместо Святой земли продали на рабовладельческих рынках Африки. Схема держалась на слухах о «надёжном» капитане Люсьене. Миссию можно было начать и с поиска корабля в Гнилой Гавани, но не хватило бы хронометража. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4153\" target=\"_blank\" rel=\"noopener\">1:09:13 ↗<\/a> · <a href=\"#qa50-21\">к записи<\/a><\/span><\/span>"}, {"t": "1:11:52", "sec": 4312, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> призывает рой крыс; крысы соглашаются умереть и прячутся в бочках пороха, которые перегружают на пиратский корабль. Каблучанус забирает сундук Люсьена."}, {"t": "1:15:25", "sec": 4525, "html": "Отряд спускается в шлюпку, дух воды беззвучно опускает её и приводит <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> под водой (с пузырьком валерьянки на морде). Дайхард делает из шлюпки ледяную «подводную лодку».<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Референсы духов для иллюстраторов\">16<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Референсы духов для иллюстраторов<\/b> Составляя референсы для иллюстраторов, одного из духов Дайхарда рисовали «под» Геннадия Ветрова (дух ветра), другого — под Водонаеву (дух воды); с духом моря возникла заминка. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2433\" target=\"_blank\" rel=\"noopener\">0:40:33 ↗<\/a> · <a href=\"#qa50-12\">к записи<\/a><\/span><\/span>"}, {"t": "1:22:54", "sec": 4974, "html": "Отряд голосует не спасать пленников: пиратский корабль взрывается вместе с пиратами, Люсьеном и экипажем «Мула». В сундуке — заряженный пистоль и 2 золотые. Яйцо анаконды согревают между грудей <a class=\"ref\" href=\"/c/bupstella/\">Бубстеллы<\/a>. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> проводит «летучку»: «мы команда».<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Вырезанная сцена: Дайхард уговаривал спасти рабов\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Вырезанная сцена: Дайхард уговаривал спасти рабов<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> рассказал, что в монтаж не попал момент, где Дайхард, сам бывший раб, уговаривал отряд спасти пленников на пиратском корабле. Его компас указывал не на цель <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, а на его собственную цель; тогда направление совпадало, но он хотел намекнуть, что у него свои планы. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1801\" target=\"_blank\" rel=\"noopener\">0:30:01 ↗<\/a> · <a href=\"#qa50-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Крыса Аркадий жив\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Крыса Аркадий жив<\/b> На вопрос о судьбе Аркадия из роя <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, взорвавшегося вместе с порохом на пиратском корабле, мастер шутливо ответил, что Аркадий жив; звучали версии, что крысы уцелели на обломках. Похоже на шутку. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4408\" target=\"_blank\" rel=\"noopener\">1:13:28 ↗<\/a> · <a href=\"#qa50-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Взрыв корабля с людьми — не сознательный тёмный поворот\">37<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Взрыв корабля с людьми — не сознательный тёмный поворот<\/b> На вопрос, был ли взрыв корабля с невинными осознанным тёмным поворотом, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что всё делалось «во имя добра». Главной чертой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> он назвал верность: договоров у неё всё больше, но она соблюдает каждый, включая приказ короля. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6183\" target=\"_blank\" rel=\"noopener\">1:43:03 ↗<\/a> · <a href=\"#qa50-33\">к записи<\/a><\/span><\/span>"}, {"t": "1:27:45", "sec": 5265, "html": "Через неделю плавания без пресной воды — Поющий риф. Пение сирен зачаровывает <a class=\"ref\" href=\"/c/bupstella/\">Бубстеллу<\/a>, Каблучануса и <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>; те уплывают в подводную пещеру."}, {"t": "1:31:05", "sec": 5465, "html": "Три сирены (Буля, Гуля/Гульмира и ещё одна) просят историю; Каблучанус рассказывает свою жизнь, сирена достаёт у него «из-за уха» монету и лезет под доспех. Сирены хотят съесть его ногу в обмен на «протез удачи»; по воле жены отряд атакует.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сирены не были опасны для вежливых гостей\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сирены не были опасны для вежливых гостей<\/b> Бреганов пояснил, что сирены Поющего рифа опасны лишь для тех, кто на них нападёт или не расскажет историю: тогда они просто съедят, как хищные рыбы. Тех, кто расскажет историю и проявит хорошие манеры, они бы не тронули. Обмен ноги на протез удачи был честным. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2816\" target=\"_blank\" rel=\"noopener\">0:46:56 ↗<\/a> · <a href=\"#qa50-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дайхард, а не Каблучанус, отдал ногу сирене\">39<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b> На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/span> <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 ↗<\/a> · <a href=\"#qa50-35\">к записи<\/a><\/span><\/span>"}, {"t": "1:42:38", "sec": 6158, "html": "Бой: магические стрелы <a class=\"ref\" href=\"/c/bupstella/\">Бубстеллы<\/a>, рой саранчи <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, Каблучанус способностью «палач» обезглавливает двух сирен. Выжившая Гуля выкупает жизнь секретом об <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулете глубин<\/a> на затонувшем корабле."}, {"t": "1:47:53", "sec": 6473, "html": "Дайхард перехватывает Гулю; Каблучанус всё же отдаёт ей ногу за протез удачи. Дух акулы уводит рифовую акулу; в рубке затонувшей «Мориэллы» Дайхард забирает у скелета капитана амулет и бутылку с запиской («<a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> сводит меня с ума… я решил затопить судно»).<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дайхард, а не Каблучанус, отдал ногу сирене\">39<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b> На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/span> <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 ↗<\/a> · <a href=\"#qa50-35\">к записи<\/a><\/span><\/span>"}, {"t": "1:53:03", "sec": 6783, "html": "<a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> находит у рифа краболов «Клешня» под бело-синими фаларийскими флагами; рифовый дух объясняет схему: краб-капитан Дерек прячет нелегалов в бочки и везёт не в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, а на южные рудники. <a class=\"ref\" href=\"/c/bupstella/\">Бубстелла<\/a> превращает Каблучануса в копию Дерека; Тигрил якорным канатом сметает матросов в воду и берёт последнего в заложники."}, {"t": "1:59:37", "sec": 7177, "html": "Изучение <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулета глубин<\/a> (с поцелуем протеза удачи): корабль капитана-владельца может на час уйти под воду до 200 м с безопасной средой; хозяина амулет со временем сводит с ума, вне моря он получает психический урон. Настоящий Дерек с морозным кольцом замораживает воду перед кораблём — <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> парализует его, он тонет; <a class=\"ref\" href=\"/c/bupstella/\">Бубстелла<\/a> растапливает лёд огненными ладонями.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как можно было победить катамаран «Щит Нерека»\">9<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как можно было победить катамаран «Щит Нерека»<\/b> Катамаран был почти непобедим, но задумка предполагала три «артефакта», которые давали шанс в финальном бою: отбить у пиратов лучше вооружённый корабль, забрать у Дерека морозный перстень (катамаран уязвим к холоду и не может ходить во льдах) и добыть <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>, превращающий судно в подводную лодку. Взорвав пиратский корабль и придя в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерек<\/a> на невооружённом краболове, отряд закрыл себе эту ветку. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1038\" target=\"_blank\" rel=\"noopener\">0:17:18 ↗<\/a> · <a href=\"#qa50-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Морозное кольцо Дерека не взяли, потому что у Дайхарда кончились силы духов\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Морозное кольцо Дерека не взяли, потому что у Дайхарда кончились силы духов<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> хотел успеть забрать морозное кольцо Дерека, но у него, по его воспоминаниям, закончились призывы духов, а остальные уже торопились плыть дальше. <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> он сознательно не применял, опасаясь проклятия. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1610\" target=\"_blank\" rel=\"noopener\">0:26:50 ↗<\/a> · <a href=\"#qa50-8\">к записи<\/a><\/span><\/span>"}, {"t": "2:05:02", "sec": 7502, "html": "В водах <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a> патрульный катамаран; Дайхард признаётся: его не утопил шторм — его поработил капитан береговой охраны «Щита Нерека» Тургур (фаларийское клеймо на шее), а потом перерезал ему горло; духи оживили его ради мести. Отряд клянётся перед морскими духами убить Тургура (но не сейчас).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Катамаран показали на карте не ради того, чтобы свернуть игру\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Катамаран показали на карте не ради того, чтобы свернуть игру<\/b> Зрители решили, что мастер нарочно «спалил» патрульный катамаран в конце, чтобы игроки испугались и выпуск закончился быстрее. Бреганов объяснил: у корабля несколько палуб, их надо было выравнивать по отдельности, поэтому он вынес модель и показал её издалека, чтобы игроки оценили масштаб; испуг был их собственной реакцией. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=847\" target=\"_blank\" rel=\"noopener\">0:14:07 ↗<\/a> · <a href=\"#qa50-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Внимание к катамарану привлёк сам Дайхард\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Внимание к катамарану привлёк сам Дайхард<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> сказал, что нарочно обратил внимание отряда на катамаран: иначе все просто уплыли бы. К тому моменту съёмка шла уже очень долго и игроки устали; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> предложила Дайхарду отложить месть и обещала помочь потом. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1293\" target=\"_blank\" rel=\"noopener\">0:21:33 ↗<\/a> · <a href=\"#qa50-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Зачем Дайхарду дали скрытую мотивацию\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Зачем Дайхарду дали скрытую мотивацию<\/b> Приключения обычно заканчиваются финальной схваткой, и скрытая мотивация Дайхарда должна была её спровоцировать, а заодно показать жестокость глиафов к рабам. Авторы ждали, что <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> весь выпуск будет копить артефакты, команду или план для боя с капитаном. Прообразом жестокого фаларийского капитана Тургура назван персонаж Тома Беренджера из фильма «Взвод». <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1544\" target=\"_blank\" rel=\"noopener\">0:25:44 ↗<\/a> · <a href=\"#qa50-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Тигрил отказался от клятвы мести Тургуру\">40<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Тигрил отказался от клятвы мести Тургуру<\/b> В записанном сообщении <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> отверг клятву, потому что <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> снова поспешно пообещала помощь, не посоветовавшись с отрядом; это уже не первый её контракт. Разочаровавшись в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионе<\/a> и предав «кошачью честь», Тигрил допускает, что уйдёт и от Ларисы: коты — вольные хищники, и служить ей беспрекословно он не станет. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6691\" target=\"_blank\" rel=\"noopener\">1:51:31 ↗<\/a> · <a href=\"#qa50-36\">к записи<\/a><\/span><\/span>"}, {"t": "2:10:33", "sec": 7833, "html": "<a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> надевает признанный капитан отряда. Каблучанус в облике Дерека убеждает Тургура не обыскивать корабль, жалуясь на «закон о капле» и Люсьена; Тургур уходит. У <a class=\"ref\" href=\"/c/bupstella/\">Бубстеллы<\/a> вылупляется детёныш анаконды.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как можно было победить катамаран «Щит Нерека»\">9<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как можно было победить катамаран «Щит Нерека»<\/b> Катамаран был почти непобедим, но задумка предполагала три «артефакта», которые давали шанс в финальном бою: отбить у пиратов лучше вооружённый корабль, забрать у Дерека морозный перстень (катамаран уязвим к холоду и не может ходить во льдах) и добыть <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a>, превращающий судно в подводную лодку. Взорвав пиратский корабль и придя в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерек<\/a> на невооружённом краболове, отряд закрыл себе эту ветку. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1038\" target=\"_blank\" rel=\"noopener\">0:17:18 ↗<\/a> · <a href=\"#qa50-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Амулет глубин задумывали как финальный ход\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Амулет глубин задумывали как финальный ход<\/b> Авторы рассчитывали, что <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> станет хорошей концовкой: отряд выберет капитана, уйдёт под воду и т. п. В итоге амулетом так никто и не воспользовался. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1673\" target=\"_blank\" rel=\"noopener\">0:27:53 ↗<\/a> · <a href=\"#qa50-9\">к записи<\/a><\/span><\/span>"}, {"t": "2:15:52", "sec": 8152, "html": "Корабль прибывает в порт Нерек. 13 монет = 130 000 руб. на благотворительность. Эпилог: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> открыла новую локацию мира — <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>; впереди поиск свитка."}], "key_events": [{"t": "0:25:33", "sec": 1533}, {"t": "0:45:12", "sec": 2712}, {"t": "0:55:55", "sec": 3355}, {"t": "1:09:00", "sec": 4140}, {"t": "1:23:45", "sec": 5025}, {"t": "1:44:45", "sec": 6285}, {"t": "1:51:12", "sec": 6672}, {"t": "1:57:28", "sec": 7048}, {"t": "2:09:15", "sec": 7755}, {"t": "2:12:02", "sec": 7922}, {"t": "2:15:52", "sec": 8152}], "coins": {"ep": "50", "events": [{"t": "0:56:36", "kind": "earn", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "за находчивость — бросил клубок ниток в воду, чтобы отвлечь и утопить капитана-кота", "result": null, "sec": 3396, "who_url": "/c/serzhant-tigril/", "reason_html": "за находчивость — бросил клубок ниток в воду, чтобы отвлечь и утопить капитана-кота"}, {"t": "0:57:20", "kind": "spend", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "потратил монету на скилл «дипломат», чтобы получить союзника среди экипажа (оказался однокурсник по кадетской академии)", "result": null, "sec": 3440, "who_url": "/c/ser-kabluchanus/", "reason_html": "потратил монету на скилл «дипломат», чтобы получить союзника среди экипажа (оказался однокурсник по кадетской академии)"}, {"t": "1:11:11", "kind": "earn", "who": "Дайхард «Камбэк»", "actor": "Руслан Усачев", "to": null, "reason": "за находчивый план — самому взорваться вместе с порохом (благодаря регенерации), чтобы уничтожить корабль работорговцев", "result": null, "sec": 4271, "who_url": "/c/dayhart-kambek/", "reason_html": "за находчивый план — самому взорваться вместе с порохом (благодаря регенерации), чтобы уничтожить корабль работорговцев"}, {"t": "1:16:06", "kind": "earn", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "за остроумную реплику о командном духе перед побегом с тонущего корабля", "result": null, "sec": 4566, "who_url": "/c/ser-kabluchanus/", "reason_html": "за остроумную реплику о командном духе перед побегом с тонущего корабля"}, {"t": "1:26:04", "kind": "loot", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "нашёл в открытом сундуке пистоль с одной пулей и две золотые монеты — это внутриигровые деньги (лут), а не игровая монета-награда", "result": null, "sec": 5164, "who_url": "/c/ser-kabluchanus/", "reason_html": "нашёл в открытом сундуке пистоль с одной пулей и две золотые монеты — это внутриигровые деньги (лут), а не игровая монета-награда"}, {"t": "1:36:13", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "за отыгрыш сцены с сиреной, которая фокусом «достала» монету у неё из-за уха", "result": null, "sec": 5773, "who_url": "/c/krysa-larisa/", "reason_html": "за отыгрыш сцены с сиреной, которая фокусом «достала» монету у неё из-за уха"}, {"t": "1:46:28", "kind": "earn", "who": "Сэр Каблучанус", "actor": "Дима Коваль", "to": null, "reason": "за отыгрыш переговоров с третьей сиреной, которая в ответ бросила в него монетой, умоляя не убивать её", "result": null, "sec": 6388, "who_url": "/c/ser-kabluchanus/", "reason_html": "за отыгрыш переговоров с третьей сиреной, которая в ответ бросила в него монетой, умоляя не убивать её"}, {"t": "2:14:20", "kind": "spend", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "потратил монету на бонус к проверке убеждения краба-короля Дрека, выдавая себя за краба", "result": "неудача — краб-король раскусил обман и с презрением прогнал Тигрила из своих вод", "sec": 8060, "who_url": "/c/serzhant-tigril/", "reason_html": "потратил монету на бонус к проверке убеждения краба-короля Дрека, выдавая себя за краба"}, {"t": "2:16:22", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальный подсчёт оставшихся на столе монет (13 штук = 130 000 руб.), которые традиционно уходят в благотворительный фонд", "result": null, "sec": 8182, "who_url": null, "reason_html": "финальный подсчёт оставшихся на столе монет (13 штук = 130 000 руб.), которые традиционно уходят в благотворительный фонд"}], "totals": [{"who": "Сэр Каблучанус", "actor": "Дима Коваль", "earned": 2, "spent": 1, "img": null, "who_url": "/c/ser-kabluchanus/", "actor_url": "/p/dima-koval/"}, {"who": "Сержант Тигрил", "actor": "BRB", "earned": 1, "spent": 1, "img": "img/chars/serzhant-tigril.webp", "who_url": "/c/serzhant-tigril/", "actor_url": "/p/brb/"}, {"who": "Дайхард «Камбэк»", "actor": "Руслан Усачев", "earned": 1, "spent": 0, "img": null, "who_url": "/c/dayhart-kambek/", "actor_url": "/p/ruslan-usachev/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Кроме игровых монет за шутки и находчивость, в выпуске был эпизод внутриигрового лута (пистоль и две золотые монеты в сундуке) — он отмечен как kind: loot и не входит в totals; в финале, как обычно, оставшиеся на столе монеты (13 шт.) конвертируются в 130 000 руб. на благотворительность."}, "cast": [{"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, бессмертная убийца", "role": "", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Бессмертие Ларисы может снять тот, кто его дал\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Бессмертие Ларисы может снять тот, кто его дал<\/b> На вопрос, можно ли лишить крысу <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> бессмертия, ответили, что в теории да — это может сделать тот, кто его дал. Мумия императора <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> — нежить: не жива, но и не мертва, то есть по-прежнему существует. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=1155\" target=\"_blank\" rel=\"noopener\">0:19:15 ↗<\/a> · <a href=\"#qa49-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Лариса не могла колдовать внутри анаконды\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Лариса не могла колдовать внутри анаконды<\/b> Мастер договорился с игроками, что в желудке анаконды руки и лапы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> скованы: она в состоянии «опутана», а без вербальных и соматических компонентов «Рой саранчи» не сотворить. Сначала надо освободиться (сложность 26), атаки изнутри совершаются с помехой. На рисунках художника поза была другой. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3707\" target=\"_blank\" rel=\"noopener\">1:01:47 ↗<\/a> · <a href=\"#qa50-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Лариса не пробралась на корабль тайком\">24<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Лариса не пробралась на корабль тайком<\/b> <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> могла бы проникнуть на любое судно как обычная крыса, но, во-первых, это было условие короля: она плывёт по его заданию вместе с его людьми. Во-вторых, фаларийские порты пускают только суда под фаларийским флагом. Авторы добавили, что Лариса давно говорит по-человечески (в выпуске 15 — благодаря щиту, теперь постоянно на зелье) и уже не мыслит себя простой крысой. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4024\" target=\"_blank\" rel=\"noopener\">1:07:04 ↗<\/a> · <a href=\"#qa50-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Выбор Ларисы будут делать всё тяжелее\">28<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Выбор Ларисы будут делать всё тяжелее<\/b> Авторы сказали, что в следующих приключениях будут нарочно усложнять моральный выбор <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что Лариса верна прежде всего приказу короля и действует «во имя добра», даже если за ней остаются трупы. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4790\" target=\"_blank\" rel=\"noopener\">1:19:50 ↗<\/a> · <a href=\"#qa50-24\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Взрыв корабля с людьми — не сознательный тёмный поворот\">37<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Взрыв корабля с людьми — не сознательный тёмный поворот<\/b> На вопрос, был ли взрыв корабля с невинными осознанным тёмным поворотом, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что всё делалось «во имя добра». Главной чертой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> он назвал верность: договоров у неё всё больше, но она соблюдает каждый, включая приказ короля. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6183\" target=\"_blank\" rel=\"noopener\">1:43:03 ↗<\/a> · <a href=\"#qa50-33\">к записи<\/a><\/span><\/span>"}, {"name": "Сержант Тигрил", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "кот с верёвкой, боец", "role": "", "fate": "выжил", "id": "Тигрил", "url": "/c/serzhant-tigril/", "img": "img/chars/serzhant-tigril.webp", "other": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Школа кошек с верёвками и предательство Тигрила\">36<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Школа кошек с верёвками и предательство Тигрила<\/b> По лору кошек с верёвками всю жизнь учат быть верным штучным инвентарём благородных и богатых хозяев; у каждой кошки своя неразрывная верёвка, и кошка учится ей соответствовать. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> предал своего хозяина <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и ушёл к <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a>, чем нанёс школе огромный репутационный удар: теперь для каждой такой кошки убить ренегата — дело чести. Поэтому на него и напал пиратский кот; слабость, которой воспользовался Тигрил, была прописана в его карточке. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5993\" target=\"_blank\" rel=\"noopener\">1:39:53 ↗<\/a> · <a href=\"#qa50-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Тигрил отказался от клятвы мести Тургуру\">40<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Тигрил отказался от клятвы мести Тургуру<\/b> В записанном сообщении <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> отверг клятву, потому что <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> снова поспешно пообещала помощь, не посоветовавшись с отрядом; это уже не первый её контракт. Разочаровавшись в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионе<\/a> и предав «кошачью честь», Тигрил допускает, что уйдёт и от Ларисы: коты — вольные хищники, и служить ей беспрекословно он не станет. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6691\" target=\"_blank\" rel=\"noopener\">1:51:31 ↗<\/a> · <a href=\"#qa50-36\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Порода Тигрила\">41<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Порода Тигрила<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> описал <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> как обычного рыжего кота, скорее рыжего с белым; на диване сошлись, что он дворняга. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6817\" target=\"_blank\" rel=\"noopener\">1:53:37 ↗<\/a> · <a href=\"#qa50-37\">к записи<\/a><\/span><\/span>"}, {"name": "Сэр Каблучанус", "actor": "Дима Коваль", "actor_url": "/p/dima-koval/", "race": "человек, рыцарь-дипломат", "role": "", "fate": "выжил, потерял ногу", "id": "Сэр Каблучанус", "url": "/c/ser-kabluchanus/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дайхард, а не Каблучанус, отдал ногу сирене\">39<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b> На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/span> <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 ↗<\/a> · <a href=\"#qa50-35\">к записи<\/a><\/span><\/span>"}, {"name": "Бубстелла", "actor": "Сабина Хайрова", "actor_url": "/p/sabina-hayrova/", "race": "дварфиха, волшебница", "role": "", "fate": "выжила", "id": "Бубстелла", "url": "/c/bupstella/", "img": null, "other": []}, {"name": "Дайхард «Камбэк»", "actor": "Руслан Усачев", "actor_url": "/p/ruslan-usachev/", "race": "возрождённый гном-шаман", "role": "", "fate": "выжил", "id": "Дайхард «Камбэк»", "url": "/c/dayhart-kambek/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Внимание к катамарану привлёк сам Дайхард\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Внимание к катамарану привлёк сам Дайхард<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> сказал, что нарочно обратил внимание отряда на катамаран: иначе все просто уплыли бы. К тому моменту съёмка шла уже очень долго и игроки устали; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> предложила Дайхарду отложить месть и обещала помочь потом. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1293\" target=\"_blank\" rel=\"noopener\">0:21:33 ↗<\/a> · <a href=\"#qa50-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Зачем Дайхарду дали скрытую мотивацию\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Зачем Дайхарду дали скрытую мотивацию<\/b> Приключения обычно заканчиваются финальной схваткой, и скрытая мотивация Дайхарда должна была её спровоцировать, а заодно показать жестокость глиафов к рабам. Авторы ждали, что <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> весь выпуск будет копить артефакты, команду или план для боя с капитаном. Прообразом жестокого фаларийского капитана Тургура назван персонаж Тома Беренджера из фильма «Взвод». <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1544\" target=\"_blank\" rel=\"noopener\">0:25:44 ↗<\/a> · <a href=\"#qa50-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Морозное кольцо Дерека не взяли, потому что у Дайхарда кончились силы духов\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Морозное кольцо Дерека не взяли, потому что у Дайхарда кончились силы духов<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> хотел успеть забрать морозное кольцо Дерека, но у него, по его воспоминаниям, закончились призывы духов, а остальные уже торопились плыть дальше. <a class=\"ref\" href=\"/a/amulet-glubin/\">Амулет глубин<\/a> он сознательно не применял, опасаясь проклятия. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1610\" target=\"_blank\" rel=\"noopener\">0:26:50 ↗<\/a> · <a href=\"#qa50-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дайхард плыл с отрядом Ларисы\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дайхард плыл с отрядом Ларисы<\/b> Дайхард искал сильную команду, чтобы отомстить Тургуру: в одиночку, без друзей и артефактов, он бы с ним не справился. Поэтому и платил за проезд, а не добирался сам (например, на дельфине). <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1736\" target=\"_blank\" rel=\"noopener\">0:28:56 ↗<\/a> · <a href=\"#qa50-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Вырезанная сцена: Дайхард уговаривал спасти рабов\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Вырезанная сцена: Дайхард уговаривал спасти рабов<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> рассказал, что в монтаж не попал момент, где Дайхард, сам бывший раб, уговаривал отряд спасти пленников на пиратском корабле. Его компас указывал не на цель <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, а на его собственную цель; тогда направление совпадало, но он хотел намекнуть, что у него свои планы. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=1801\" target=\"_blank\" rel=\"noopener\">0:30:01 ↗<\/a> · <a href=\"#qa50-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Способность призывать духов оказалась слишком сильной\">17<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Способность призывать духов оказалась слишком сильной<\/b> Авторы признали, что «немного не подумали»: призывы духов восстанавливались каждые сутки, а путешествие длилось две недели, так что Дайхард мог пользоваться духами почти без ограничений. Правильнее было бы требовать ритуал, как у гоблина-шамана в одном из прошлых выпусков. <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> считает, что для шоу это всё же лучше. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2433\" target=\"_blank\" rel=\"noopener\">0:40:33 ↗<\/a> · <a href=\"#qa50-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Дайхард будет переделывать свой протез\">19<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Дайхард будет переделывать свой протез<\/b> <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> остался недоволен видом протеза удачи и объявил, что до следующего появления Дайхард будет его кастомизировать. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2880\" target=\"_blank\" rel=\"noopener\">0:48:00 ↗<\/a> · <a href=\"#qa50-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Что будет с Дайхардом-ревенантом после мести\">32<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Что будет с Дайхардом-ревенантом после мести<\/b> Ревенант — скорее надстройка над расой (как вампир): выполнив миссию мести, он умирает окончательно. Но цель может смениться: если выяснится, что настоящий виновник — тот, кто отдал приказ, ревенант разворачивается к новой цели; новую цель можно согласовать с духами. <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> отметил, что компас Дайхарда как раз указывает на цель. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5610\" target=\"_blank\" rel=\"noopener\">1:33:30 ↗<\/a> · <a href=\"#qa50-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дайхард, а не Каблучанус, отдал ногу сирене\">39<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дайхард, а не Каблучанус, отдал ногу сирене<\/b> На вопрос, зачем он согласился отдать сирене ногу, ответил <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>: Дайхард уже мёртв, боли не чувствовал, а Усачеву нравилось собирать артефакты. Он сразу поверил, что сирены честно выдают протезы. Протез удачи достался Дайхарду. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep50.md ногу на протез удачи меняет Каблучанус (пункты 17 и 19, «Персонажи и NPC», «Итог»). На самом деле ногу отдал <a class=\"ref\" href=\"/c/dayhart-kambek/\">Дайхард «Камбэк»<\/a> (<a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a>): это подтверждают подкаст и транскрипт выпуска («Да, я меняюсь меняю ногу на протез» — Руслан).<\/span> <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=6566\" target=\"_blank\" rel=\"noopener\">1:49:26 ↗<\/a> · <a href=\"#qa50-35\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Капитан Люсьен", "actor": "", "actor_url": null, "race": "", "role": "контрабандист-работорговец, капитан «Мула»", "fate": "погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Задуманный поворот: пираты честнее капитана\">21<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Задуманный поворот: пираты честнее капитана<\/b> Сценарий предполагал, что отряд отобьётся от пиратов, которыми его пугал Люсьен, и лишь потом узнает, что капитан сам продаёт пассажиров в рабство: пираты оказывались честнее его. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3642\" target=\"_blank\" rel=\"noopener\">1:00:42 ↗<\/a> · <a href=\"#qa50-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Схема Люсьена и детский крестовый поход\">25<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Схема Люсьена и детский крестовый поход<\/b> Люсьен брал деньги с желающих попасть в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> и продавал их в рабство; никто из его пассажиров не возвращался. Авторы сослались на детский крестовый поход, участников которого судовладельцы вместо Святой земли продали на рабовладельческих рынках Африки. Схема держалась на слухах о «надёжном» капитане Люсьене. Миссию можно было начать и с поиска корабля в Гнилой Гавани, но не хватило бы хронометража. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4153\" target=\"_blank\" rel=\"noopener\">1:09:13 ↗<\/a> · <a href=\"#qa50-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Французский акцент Люсьена забыли случайно\">30<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Французский акцент Люсьена забыли случайно<\/b> Бреганов придумал Люсьена с французским акцентом, но в суматохе морского боя забыл о нём. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> это заметил, и мастер вышел из положения: акцент — показной, «для клиентов». Случайная ошибка тут же стала каноном. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=4853\" target=\"_blank\" rel=\"noopener\">1:20:53 ↗<\/a> · <a href=\"#qa50-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Команда Люсьена не знала о работорговле\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Команда Люсьена не знала о работорговле<\/b> Матросы «Мула» не знали, что пассажиров продают: их задача была довезти людей до Поющего рифа, а там пассажиров пересаживали на краболов якобы до <a class=\"ref\" href=\"/place/velikaya-falariya/\">Нерека<\/a>. Люсьена уже много раз грабили пираты, его прежние команды уводили в рабство, а самого отпускали, чтобы он возил новых людей, — по сути, он работал и на пиратов. В Гнилой Гавани за золотую монету наймётся кто угодно. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5802\" target=\"_blank\" rel=\"noopener\">1:36:42 ↗<\/a> · <a href=\"#qa50-31\">к записи<\/a><\/span><\/span>"}, {"name": "Шиша", "actor": "", "actor_url": null, "race": "", "role": "анаконда Люсьена", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Анаконда Шиша — просто страж каюты капитана\">20<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Анаконда Шиша — просто страж каюты капитана<\/b> По задумке из каюты капитана можно было узнать, что Люсьен везёт пассажиров не в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>, а передаёт краболову, который отвезёт их в рабство (их спрячут в бочках и клетках из-под крабов). Анаконда на кровати капитана была лишь препятствием на пути к этой информации, «охранником»; на её месте мог быть кто угодно. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3577\" target=\"_blank\" rel=\"noopener\">0:59:37 ↗<\/a> · <a href=\"#qa50-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Секрет анаконды придумали на ходу\">23<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Секрет анаконды придумали на ходу<\/b> Весь эпизод с «секретиком» анаконды — импровизация: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> спросил, есть ли у неё секрет, и Бреганов сочинил, что она отложила яйца в стол капитана. Мастер разогнался до того, что это дети капитана, но эту линию почти полностью вырезали, остались только намёки. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=3897\" target=\"_blank\" rel=\"noopener\">1:04:57 ↗<\/a> · <a href=\"#qa50-19\">к записи<\/a><\/span><\/span>"}, {"name": "Джон Солёная Борода", "actor": "", "actor_url": null, "race": "", "role": "капитан пиратов", "fate": "погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Пиратский корабль назывался «Мерзкий Близнец»\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Пиратский корабль назывался «Мерзкий Близнец»<\/b> В подкасте впервые прозвучало название корабля Джона Солёной Бороды — «Мерзкий Близнец»; в выпуске он был просто «пиратским кораблём». <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=910\" target=\"_blank\" rel=\"noopener\">0:15:10 ↗<\/a> · <a href=\"#qa50-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Откуда прозвище Джона Солёной Бороды\">42<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Откуда прозвище Джона Солёной Бороды<\/b> Бреганов, которого в выпуске перебили, объяснил прозвище: морская вода оседает в бороде белым налётом, похожим на седину. Ведущие пошутили, что Джон, возможно, просто сед и, молодясь, выдаёт седину за соль. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=7194\" target=\"_blank\" rel=\"noopener\">1:59:54 ↗<\/a> · <a href=\"#qa50-38\">к записи<\/a><\/span><\/span>"}, {"name": "Сэр Веслоухий Кискис", "actor": "", "actor_url": null, "race": "", "role": "кот пиратского капитана", "fate": "вероятно погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Школа кошек с верёвками и предательство Тигрила\">36<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Школа кошек с верёвками и предательство Тигрила<\/b> По лору кошек с верёвками всю жизнь учат быть верным штучным инвентарём благородных и богатых хозяев; у каждой кошки своя неразрывная верёвка, и кошка учится ей соответствовать. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> предал своего хозяина <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и ушёл к <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a>, чем нанёс школе огромный репутационный удар: теперь для каждой такой кошки убить ренегата — дело чести. Поэтому на него и напал пиратский кот; слабость, которой воспользовался Тигрил, была прописана в его карточке. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=5993\" target=\"_blank\" rel=\"noopener\">1:39:53 ↗<\/a> · <a href=\"#qa50-32\">к записи<\/a><\/span><\/span>"}, {"name": "Гнида", "actor": "", "actor_url": null, "race": "", "role": "пират, однокашник Каблучануса", "fate": "вероятно погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Жил", "actor": "", "actor_url": null, "race": "", "role": "матрос «Мула» с обожжённым лицом", "fate": "неизвестно", "id": "Жил", "url": "/c/zhil/", "img": null, "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}]}, {"name": "Гуля", "actor": "", "actor_url": null, "race": "", "role": "сирена Поющего рифа", "fate": "выжила", "id": "Гуля", "url": "/c/gulya/", "img": null, "other": [{"key": "22", "label": "22", "title": "Отряд Солнца"}]}, {"name": "Две сирены", "actor": "", "actor_url": null, "race": "", "role": "сирены Поющего рифа", "fate": "погибли", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сирены не были опасны для вежливых гостей\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сирены не были опасны для вежливых гостей<\/b> Бреганов пояснил, что сирены Поющего рифа опасны лишь для тех, кто на них нападёт или не расскажет историю: тогда они просто съедят, как хищные рыбы. Тех, кто расскажет историю и проявит хорошие манеры, они бы не тронули. Обмен ноги на протез удачи был честным. <span class=\"note\">Подкаст по #50 · <a href=\"https://youtu.be/g-5LXn0KKXE?t=2816\" target=\"_blank\" rel=\"noopener\">0:46:56 ↗<\/a> · <a href=\"#qa50-14\">к записи<\/a><\/span><\/span>"}, {"name": "Дерек", "actor": "", "actor_url": null, "race": "", "role": "краб-капитан краболова «Клешня», работорговец", "fate": "утонул парализованным", "id": null, "url": null, "img": null, "other": []}, {"name": "Тургур", "actor": "", "actor_url": null, "race": "", "role": "глиаф, капитан береговой охраны Нерека", "fate": "выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=
