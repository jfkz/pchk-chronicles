<script>window.EPD = {"anim": false, "key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "date": "2021-11-17", "minutes": 78, "duration": 4682.0, "video_id": "H4xmF7lF0Ng", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Горная таверна «Кайф» на перевале Фортуны, по пути в Кальтенбург", "short_html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> везёт пленного <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>, но метель запирает их в горной таверне «Кайф» с подозрительными хозяевами.", "summary_html": "Продолжение выпуска 5: охотник за головами гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> везёт пленного <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> на суд к лорду <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> и из-за метели останавливается в горной таверне «Кайф» на перевале Фортуны. Там же оказываются нанятый Рогозием проводник-громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, отец Эрика — организатор боёв карликов <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a> — и обесчещенная <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>, ищущая монстра перевала. Таверна оказывается логовом семьи каннибалов-культистов: корчмарь Али и его сыновья опаивают постояльцев и разделывают их, а мать семейства — гигантская паучиха; Юлиан — один из её сыновей и заманивал путников. В финальной схватке гибнут Рогозий, Илдэ и Канделакис, а Эрик, спрятавшийся в туше лошади, соглашается вступить в «семью».", "outcome_html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> и <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> погибли; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> выжил и вступил в семью каннибалов-культистов вместе с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> и <a class=\"ref\" href=\"/c/sofiya/\">Софией<\/a>.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Мастер не подыгрывает: Юджин оказался слишком лёгким, а в «Кайфе» все погибли честно\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Мастер не подыгрывает: Юджин оказался слишком лёгким, а в «Кайфе» все погибли честно<\/b> Мастер не подстраивает бои в пользу игроков. Финальный босс выпуска <a href=\"/ep/17/\" title=\"Демонизация\">17<\/a>, у которого было около 35–40 хитов, оказался слишком простым: солдаты погибли при взрыве, весь урон пришёлся на него, и игрокам повезло с бросками. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> все герои погибли в честном бою. <a class=\"ref\" href=\"/c/zhanuariya/\">Паучиху<\/a> можно было одолеть командной игрой: выманивать и убивать членов семьи по одному, баланс это позволял. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=5820\" target=\"_blank\" rel=\"noopener\">1:37:00 ↗<\/a> · <a href=\"#qa17-21\">к записи<\/a><\/span><\/span>", "world_html": ["<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> освободился от охотника за головами и примкнул к семье каннибалов из таверны «Кайф»", "Погибли гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> и отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a>", "Раскрыта тайна исчезновений на перевале Фортуны"], "scenes": [{"t": "0:00:04", "sec": 4, "html": "Рекап: после убийства <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> схвачены, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> бежал на север к брату <a class=\"ref\" href=\"/c/savl/\">Савлу<\/a>, но по дороге в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбург<\/a> его перехватил <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>."}, {"t": "0:03:34", "sec": 214, "html": "Метель; в единственную на десятки километров горную таверну «Кайф» на перевале Фортуны входит <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> с <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a> на поводке. Представления: Эрик («впервые в жизни совершил хороший поступок»), Рогозий (награда от <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, нанял проводника), <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (громила со шрамом «от горного тролля»).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Начало выпуска было заскриптовано\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Начало выпуска было заскриптовано<\/b> Сцену знакомства с героями заранее заскриптовали, как в «<a class=\"ref\" href=\"/place/taverna-kayf/\">Таверне «Кайф<\/a>»»: это была ловушка с единственным выходом — сбежать, а не сражаться с бесконечными демонами. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> дали бриф не вызывать <a class=\"ref\" href=\"/c/gogen/\">Гогена<\/a>, пока не выйдет <a class=\"ref\" href=\"/p/slava-kopeykin/\">Слава Копейкин<\/a>. Гостей вводили прямо по ходу приключения, чтобы удивить зрителей на съёмке. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=1639\" target=\"_blank\" rel=\"noopener\">0:27:19 ↗<\/a> · <a href=\"#qa31-12\">к записи<\/a><\/span><\/span>"}, {"t": "0:06:32", "sec": 392, "html": "Появляется полурослик в дорогой шубе — организатор боёв карликов «<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a>», ехал в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбург<\/a> договариваться с мэром. Затем — дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>: обесчещенная соратником (<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>, вып. 1), изгнанная своим народом, сбрила бороду и ищет монстра перевала, чтобы совершить подвиг во имя Морадина.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Бои полуросликов — направление для развития вселенной\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Бои полуросликов — направление для развития вселенной<\/b> Авторы любят возвращать находки ранних выпусков как рефрены в новых обстоятельствах. Бои полуросликов (выпуск <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a>) они назвали популярным в мире видом досуга и направлением, которое стоит развивать. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=6401\" target=\"_blank\" rel=\"noopener\">1:46:41 ↗<\/a> · <a href=\"#qa17-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Начало выпуска было заскриптовано\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Начало выпуска было заскриптовано<\/b> Сцену знакомства с героями заранее заскриптовали, как в «<a class=\"ref\" href=\"/place/taverna-kayf/\">Таверне «Кайф<\/a>»»: это была ловушка с единственным выходом — сбежать, а не сражаться с бесконечными демонами. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> дали бриф не вызывать <a class=\"ref\" href=\"/c/gogen/\">Гогена<\/a>, пока не выйдет <a class=\"ref\" href=\"/p/slava-kopeykin/\">Слава Копейкин<\/a>. Гостей вводили прямо по ходу приключения, чтобы удивить зрителей на съёмке. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=1639\" target=\"_blank\" rel=\"noopener\">0:27:19 ↗<\/a> · <a href=\"#qa31-12\">к записи<\/a><\/span><\/span>"}, {"t": "0:09:52", "sec": 592, "html": "Вставка-реклама: цитадель белых магов, маг-некромант общается с семьёй через «секретный тариф ордена»."}, {"t": "0:13:39", "sec": 819, "html": "В зале <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> узнаёт <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>; Эрик мочится на кепку <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакиса<\/a>, Илдэ бьёт Эрика. Эрик пытается скрыться под столом."}, {"t": "0:16:12", "sec": 972, "html": "<a class=\"ref\" href=\"/c/ali/\">Корчмарь Али<\/a> подаёт еду. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (про себя) — сын корчмаря, приводит путников, которые пропадают; мать проклята, все её дети с изъяном. <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> тайно признаётся: его фамилия Пэнисов, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> — его сын.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Знали ли игроки сюжет заранее: Канделакис и письмо Цисгендия\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Знали ли игроки сюжет заранее: Канделакис и письмо Цисгендия<\/b> Сюжет игрокам заранее не рассказывают. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> узнал в <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакисе<\/a> отца, потому что это было прописано в персонаже. Враждебность <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к <a class=\"ref\" href=\"/c/cisgender/\">Игристому<\/a> (Поперечному) в выпуске <a href=\"/ep/14/\" title=\"Янус доставка\">14<\/a> была чистым наитием. Письмо гвардии в инвентаре Игристого заметил <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> (<a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>), рассудив, что просто так такое в карточку не вписывают. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=6149\" target=\"_blank\" rel=\"noopener\">1:42:29 ↗<\/a> · <a href=\"#qa17-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Женуария и Али провели ритуал, чтобы иметь детей\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Женуария и Али провели ритуал, чтобы иметь детей<\/b> Авторы напомнили легенду, написанную для <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> к выпуску <a href=\"/ep/13/\" title=\"Проклятые роды\">13<\/a>: они с <a class=\"ref\" href=\"/c/ali/\">Али<\/a> не могли иметь детей и провели ритуал; дети начали рождаться, но все проклятыми, а сама Женуария стала паучихой. Каннибализм Али, по их словам, начался из-за неё: она-паучиха ела людей, и он был вынужден последовать за ней. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1631\" target=\"_blank\" rel=\"noopener\">0:27:11 ↗<\/a> · <a href=\"#qa22-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Скрытые мотивации у постоянных игроков; BRB получил её впервые\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Скрытые мотивации у постоянных игроков; BRB получил её впервые<\/b> У всех постоянных игроков уже были скрытые мотивации: у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> за <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, у Данилы Поперечного (Игристое/<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>). <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкину<\/a> её не давали, потому что «у него в голове всегда скрытая мотивация». В выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">24<\/a> скрытую мотивацию впервые дали <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, и только ему: как опытный игрок, он получил задание обыграть остальных. Изначально идея была немного другой. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=322\" target=\"_blank\" rel=\"noopener\">0:05:22 ↗<\/a> · <a href=\"#qa24-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span>"}, {"t": "0:18:00", "sec": 1080, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> из-под стола кусает <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> за пах, тот бьёт его по голове. Незнакомец дважды бьёт Эрика ножом в спину («это за мою жену!»); <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> убивает его ударом кулака, Эрик объедает мертвецу лицо."}, {"t": "0:21:17", "sec": 1277, "html": "Дочь корчмаря <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> лечит <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> фиолетовыми ягодами; рассказывает о постояльцах и о других охотниках за головами, ищущих полурослика. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> заметил, что ей страшно, но она боится говорить."}, {"t": "0:23:48", "sec": 1428, "html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, заняв 5 серебряных у <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакиса<\/a>, снимает комнату и поднимается к <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>: в её комнате — горы платьев разных размеров и манекен с гигантским платьем. София не решается рассказать правду; при появлении отца Рогозий прячется в шкафу, находит монету."}, {"t": "0:29:07", "sec": 1747, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> натравливает других охотников (полуорк, гоблин и др.), обещая золото, украденное у <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>. Драка: <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> кастетами дерётся с полуорком и гоблином, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> подвешивает гоблина на мясной крюк, <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> булавой разносит череп одному из охотников. Эрик пытается вырваться, но поводок опутывает его ноги (крит. провал)."}, {"t": "0:37:17", "sec": 2237, "html": "<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> запугивает и допрашивает гоблина: охотники выслеживали <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>; на перевале постоянно пропадают люди. Корчмарь сваливает всё на волков."}, {"t": "0:41:25", "sec": 2485, "html": "Вставка-реклама про охотника на монстров. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> наверху с помощью приспособлений слышит сквозь метель предсмертные крики лошадей из конюшни."}, {"t": "0:44:38", "sec": 2678, "html": "Сыновья корчмаря выходят с тесаками; <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> держит корчмаря за горло, требуя правды. Все идут к конюшне. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> ловкостью рук крадёт у <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> отмычку."}, {"t": "0:47:40", "sec": 2860, "html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> находит у конюшни следы человеческих ботинок, ведущие в таверну; все лошади зарезаны человеком с очень острым клинком. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> отмычкой снимает ошейник, вырывается из хватки <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и бежит в таверну."}, {"t": "0:52:50", "sec": 3170, "html": "<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> настигает <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, вскакивает на стол и показывает татуировку «Пэнисов» на своём пенисе — все понимают, что это отец и сын; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> рыдает от умиления.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Знали ли игроки сюжет заранее: Канделакис и письмо Цисгендия\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Знали ли игроки сюжет заранее: Канделакис и письмо Цисгендия<\/b> Сюжет игрокам заранее не рассказывают. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> узнал в <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакисе<\/a> отца, потому что это было прописано в персонаже. Враждебность <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к <a class=\"ref\" href=\"/c/cisgender/\">Игристому<\/a> (Поперечному) в выпуске <a href=\"/ep/14/\" title=\"Янус доставка\">14<\/a> была чистым наитием. Письмо гвардии в инвентаре Игристого заметил <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> (<a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>), рассудив, что просто так такое в карточку не вписывают. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=6149\" target=\"_blank\" rel=\"noopener\">1:42:29 ↗<\/a> · <a href=\"#qa17-23\">к записи<\/a><\/span><\/span>"}, {"t": "0:54:37", "sec": 3277, "html": "Все, кто ел еду, засыпают — пища была отравлена. Герои просыпаются в клетке подвала среди груды людей; <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> нет. Голый сын корчмаря в кожаном фартуке разделывает трупы."}, {"t": "0:56:29", "sec": 3389, "html": "У <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> в кармане — свёрток от <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>: ягоды, ключ и записка «Надеюсь на твою помощь, Рогозий». <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> открывает клетку, Рогозий из аркебузы ранит мясника, Илдэ добивает его булавой."}, {"t": "1:02:22", "sec": 3742, "html": "В главном зале — пентаграмма, гигантская паучиха, корчмарь, двое сыновей и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>. Юлиан раскрывается: его мать — паучиха, шрам — от рождения."}, {"t": "1:04:16", "sec": 3856, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> предлагает семье сделку против спутников, провалив убеждение, выпрыгивает в окно и прячется внутри туши лошади в конюшне."}, {"t": "1:05:40", "sec": 3940, "html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Паучиха<\/a> хватает <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> жвалами. Корчмарь признаётся, что суп был из людей. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> стреляет в люстру — та падает на паучиху, начинается пожар; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> двумя ударами валит Рогозия (0 ХП, спасброски от смерти)."}, {"t": "1:08:38", "sec": 4118, "html": "<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> обманом даёт одному из сыновей выпить парализующий яд из перстня («молоко моей матери»). <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> цепью от люстры душит паучиху (крит), та отпускает её; корчмарь бьёт Илдэ моргенштерном, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> добивает её кулаком."}, {"t": "1:12:24", "sec": 4344, "html": "<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> бежит, завязывает дверь своей шубой, но <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> догоняет его и двумя ударами сносит ему голову. Мастер: «побеждает тьма» — <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> и Канделакис мертвы.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Мастер не подыгрывает: Юджин оказался слишком лёгким, а в «Кайфе» все погибли честно\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Мастер не подыгрывает: Юджин оказался слишком лёгким, а в «Кайфе» все погибли честно<\/b> Мастер не подстраивает бои в пользу игроков. Финальный босс выпуска <a href=\"/ep/17/\" title=\"Демонизация\">17<\/a>, у которого было около 35–40 хитов, оказался слишком простым: солдаты погибли при взрыве, весь урон пришёлся на него, и игрокам повезло с бросками. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> все герои погибли в честном бою. <a class=\"ref\" href=\"/c/zhanuariya/\">Паучиху<\/a> можно было одолеть командной игрой: выманивать и убивать членов семьи по одному, баланс это позволял. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=5820\" target=\"_blank\" rel=\"noopener\">1:37:00 ↗<\/a> · <a href=\"#qa17-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Женуария съела сына Мелиссы — Канделакиса\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Женуария съела сына Мелиссы — Канделакиса<\/b> Авторы отметили находку зрителей: сын <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a> (его играл <a class=\"ref\" href=\"/p/vladimir-markoni/\">Владимир Маркони<\/a>) в выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> был съеден той же <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарией<\/a>, когда она в облике паучихи ещё была людоедкой. Мелисса об этом не знает, но когда-нибудь может узнать. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4221\" target=\"_blank\" rel=\"noopener\">1:10:21 ↗<\/a> · <a href=\"#qa41-42-16\">к записи<\/a><\/span><\/span>"}, {"t": "1:14:17", "sec": 4457, "html": "Корчмарь находит <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> в туше лошади и предлагает остаться в семье каннибалов («будем кормить людей, строить семью»). Эрик, чтобы выжить, соглашается; к нему выходит <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>. Итог: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>-победитель, 130 000 руб. — в фонд «Детские сердца»."}], "key_events": [{"t": "0:03:34", "sec": 214}, {"t": "0:18:00", "sec": 1080}, {"t": "0:29:07", "sec": 1747}, {"t": "0:47:40", "sec": 2860}, {"t": "0:52:50", "sec": 3170}, {"t": "0:54:37", "sec": 3277}, {"t": "0:56:29", "sec": 3389}, {"t": "1:02:22", "sec": 3742}, {"t": "1:04:16", "sec": 3856}, {"t": "1:12:24", "sec": 4344}, {"t": "1:14:17", "sec": 4457}], "coins": {"ep": "07", "events": [{"t": "0:23:52", "kind": "loot", "who": "Канделакис Пэнисов", "actor": "Маркони", "to": null, "reason": "заплатил трактирщику пять серебряных монет, чтобы снять комнату и подняться к Софии — обычные внутриигровые деньги, не монеты-мехиника шоу", "result": null, "sec": 1432, "who_url": "/c/kandelakis-penisov/", "reason_html": "заплатил трактирщику пять серебряных монет, чтобы снять комнату и подняться к <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> — обычные внутриигровые деньги, не монеты-мехиника шоу"}, {"t": "0:28:57", "kind": "earn", "who": "Канделакис Пэнисов", "actor": "Маркони", "to": null, "reason": "спрятавшись в шкафу от отца Софии, нашёл золотую монету", "result": null, "sec": 1737, "who_url": "/c/kandelakis-penisov/", "reason_html": "спрятавшись в шкафу от отца <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>, нашёл золотую монету"}, {"t": "0:36:07", "kind": "spend", "who": "Канделакис Пэнисов", "actor": "Маркони", "to": null, "reason": "потратил монету на переброс проверки силы, пытаясь вырваться из захвата гоблина/орка на ошейнике", "result": "переброс тоже неудачный (критический провал)", "sec": 2167, "who_url": "/c/kandelakis-penisov/", "reason_html": "потратил монету на переброс проверки силы, пытаясь вырваться из захвата гоблина/орка на ошейнике"}, {"t": "1:16:49", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "итоговый подсчёт ведущего — по итогам выпуска (включая бросок d6) у команды набралось три золотые монеты", "result": null, "sec": 4609, "who_url": null, "reason_html": "итоговый подсчёт ведущего — по итогам выпуска (включая бросок d6) у команды набралось три золотые монеты"}], "totals": [{"who": "Эрик Пэнисов", "actor": "Никита Кукушкин", "earned": 0, "spent": 0, "img": "img/chars/erik-penisov.webp", "who_url": "/c/erik-penisov/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Рогозий", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/rogozij.webp", "who_url": "/c/ragozin/", "actor_url": "/p/brb/"}, {"who": "Юлиан", "actor": "Александр Гудков", "earned": 0, "spent": 0, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Канделакис Пэнисов", "actor": "Владимир Маркони", "earned": 1, "spent": 1, "img": "img/chars/kandelakis.webp", "who_url": "/c/kandelakis-penisov/", "actor_url": "/p/vladimir-markoni/"}, {"who": "Илдэ «Огненная Кузня»", "actor": "Екатерина Варнава", "earned": 0, "spent": 0, "img": "img/chars/ilde.webp", "who_url": "/c/eldi/", "actor_url": "/p/ekaterina-varnava/"}, {"who": "неизвестно (итоговый бонус)", "actor": null, "earned": 2, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Это отдельная сюжетная линия — история охотника за головами Рогозия и его пленника, где почти все монетные события сосредоточены вокруг Канделакиса Пэнисова. Есть чёткое разграничение валют: пять серебряных монет за комнату — обычная внутриигровая плата (loot), а золотые монеты — благотворительная механика шоу. Итоговые три монеты (30 000 руб.) не расписаны ведущим по персонажам, поэтому остаток (2) отнесён к «неизвестно»."}, "cast": [{"name": "Эрик Пэнисов", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "полурослик, плут", "role": "", "fate": "выжил, вступил в семью каннибалов", "id": "Эрик", "url": "/c/erik-penisov/", "img": "img/chars/erik-penisov.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "35", "label": "35", "title": "Второй Шанс"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span>"}, {"name": "Рогозий", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "гном, охотник за головами", "role": "", "fate": "погиб", "id": "Рагозин", "url": "/c/ragozin/", "img": "img/chars/rogozij.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Рогозия и Пэлиаса не будут пересоздавать\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Рогозия и Пэлиаса не будут пересоздавать<\/b> Авторы заявили, что гнома-инженера у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> больше не будет (возможно, такого персонажа получит другой игрок), а погибшего <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> не будут создавать заново, потому что повтор получится вторичным. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2280\" target=\"_blank\" rel=\"noopener\">0:38:00 ↗<\/a> · <a href=\"#qa18-7\">к записи<\/a><\/span><\/span>"}, {"name": "Юлиан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "человек, громила-проводник (сын паучихи)", "role": "", "fate": "выжил", "id": "Юлиан", "url": "/c/yulian/", "img": "img/chars/yulian.webp", "other": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Скрытые мотивации у постоянных игроков; BRB получил её впервые\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Скрытые мотивации у постоянных игроков; BRB получил её впервые<\/b> У всех постоянных игроков уже были скрытые мотивации: у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> за <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, у Данилы Поперечного (Игристое/<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>). <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкину<\/a> её не давали, потому что «у него в голове всегда скрытая мотивация». В выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">24<\/a> скрытую мотивацию впервые дали <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, и только ему: как опытный игрок, он получил задание обыграть остальных. Изначально идея была немного другой. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=322\" target=\"_blank\" rel=\"noopener\">0:05:22 ↗<\/a> · <a href=\"#qa24-4\">к записи<\/a><\/span><\/span>"}, {"name": "Канделакис Пэнисов", "actor": "Владимир Маркони", "actor_url": "/p/vladimir-markoni/", "race": "полурослик, организатор боёв карликов (отец Эрика)", "role": "", "fate": "погиб", "id": "Канделакис", "url": "/c/kandelakis-penisov/", "img": "img/chars/kandelakis.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Бои полуросликов — направление для развития вселенной\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Бои полуросликов — направление для развития вселенной<\/b> Авторы любят возвращать находки ранних выпусков как рефрены в новых обстоятельствах. Бои полуросликов (выпуск <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a>) они назвали популярным в мире видом досуга и направлением, которое стоит развивать. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=6401\" target=\"_blank\" rel=\"noopener\">1:46:41 ↗<\/a> · <a href=\"#qa17-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Женуария съела сына Мелиссы — Канделакиса\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Женуария съела сына Мелиссы — Канделакиса<\/b> Авторы отметили находку зрителей: сын <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a> (его играл <a class=\"ref\" href=\"/p/vladimir-markoni/\">Владимир Маркони<\/a>) в выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> был съеден той же <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарией<\/a>, когда она в облике паучихи ещё была людоедкой. Мелисса об этом не знает, но когда-нибудь может узнать. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4221\" target=\"_blank\" rel=\"noopener\">1:10:21 ↗<\/a> · <a href=\"#qa41-42-16\">к записи<\/a><\/span><\/span>"}, {"name": "Илдэ «Огненная Кузня»", "actor": "Екатерина Варнава", "actor_url": "/p/ekaterina-varnava/", "race": "дварфийка, воительница-жрица Морадина", "role": "", "fate": "погибла", "id": "Элди", "url": "/c/eldi/", "img": "img/chars/ilde.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Илдэ вернуть нельзя: её съела паучиха, часть её искры — в Женуарии\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Илдэ вернуть нельзя: её съела паучиха, часть её искры — в Женуарии<\/b> На вопрос о возвращении <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> авторы ответили, что она убита и съедена: по истории её съела мать-паучиха (<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a>), и часть искры Илдэ осталась в ней. Обеих героинь играла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a>. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=2788\" target=\"_blank\" rel=\"noopener\">0:46:28 ↗<\/a> · <a href=\"#qa22-4\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Корчмарь Али", "actor": "", "actor_url": null, "race": "", "role": "хозяин таверны, глава семьи каннибалов", "fate": "выжил", "id": "Али", "url": "/c/ali/", "img": "img/chars/ali.webp", "other": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Женуария и Али провели ритуал, чтобы иметь детей\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Женуария и Али провели ритуал, чтобы иметь детей<\/b> Авторы напомнили легенду, написанную для <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> к выпуску <a href=\"/ep/13/\" title=\"Проклятые роды\">13<\/a>: они с <a class=\"ref\" href=\"/c/ali/\">Али<\/a> не могли иметь детей и провели ритуал; дети начали рождаться, но все проклятыми, а сама Женуария стала паучихой. Каннибализм Али, по их словам, начался из-за неё: она-паучиха ела людей, и он был вынужден последовать за ней. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1631\" target=\"_blank\" rel=\"noopener\">0:27:11 ↗<\/a> · <a href=\"#qa22-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Али звучит иначе, потому что изменился в аду\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Али звучит иначе, потому что изменился в аду<\/b> Мастер подтвердил, что голос <a class=\"ref\" href=\"/c/ali/\">Али<\/a> изменён намеренно: в выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> он был размеренным, медленным, «немного криминальным», а теперь он исчадие <a class=\"ref\" href=\"/place/ad/\">ада<\/a> и должен был сильно измениться. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6143\" target=\"_blank\" rel=\"noopener\">1:42:23 ↗<\/a> · <a href=\"#qa22-19\">к записи<\/a><\/span><\/span>"}, {"name": "Паучиха", "actor": "", "actor_url": null, "race": "", "role": "проклятая мать семейства, гигантский паук", "fate": "ранена, неизвестно", "id": "Жануария", "url": "/c/zhanuariya/", "img": "img/chars/zhenuariya.webp", "other": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "42", "label": "42", "title": "Чудная Долина"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Женуария и Али провели ритуал, чтобы иметь детей\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Женуария и Али провели ритуал, чтобы иметь детей<\/b> Авторы напомнили легенду, написанную для <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> к выпуску <a href=\"/ep/13/\" title=\"Проклятые роды\">13<\/a>: они с <a class=\"ref\" href=\"/c/ali/\">Али<\/a> не могли иметь детей и провели ритуал; дети начали рождаться, но все проклятыми, а сама Женуария стала паучихой. Каннибализм Али, по их словам, начался из-за неё: она-паучиха ела людей, и он был вынужден последовать за ней. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1631\" target=\"_blank\" rel=\"noopener\">0:27:11 ↗<\/a> · <a href=\"#qa22-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Илдэ вернуть нельзя: её съела паучиха, часть её искры — в Женуарии\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Илдэ вернуть нельзя: её съела паучиха, часть её искры — в Женуарии<\/b> На вопрос о возвращении <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> авторы ответили, что она убита и съедена: по истории её съела мать-паучиха (<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a>), и часть искры Илдэ осталась в ней. Обеих героинь играла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a>. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=2788\" target=\"_blank\" rel=\"noopener\">0:46:28 ↗<\/a> · <a href=\"#qa22-4\">к записи<\/a><\/span><\/span>"}, {"name": "София", "actor": "", "actor_url": null, "race": "", "role": "дочь корчмаря, швея, тайно просила о помощи", "fate": "выжила", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Сыновья корчмаря", "actor": "", "actor_url": null, "race": "", "role": "мясники-каннибалы", "fate": "один убит, один парализован", "id": null, "url": null, "img": null, "other": []}, {"name": "Незнакомец с ножом", "actor": "", "actor_url": null, "race": "", "role": "мститель «за жену»", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Охотники за головами", "actor": "", "actor_url": null, "race": "", "role": "конкуренты Рогозия", "fate": "полуорк убит, гоблин выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Савл", "actor": "", "actor_url": null, "race": "", "role": "брат-близнец Эрика (упоминается)", "fate": "неизвестно", "id": "Савл", "url": "/c/savl/", "img": "img/chars/savl-penisov.webp", "other": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}]}, {"name": "Лорд Властон", "actor": "", "actor_url": null, "race": "", "role": "назначил награду за Эрика (упоминается)", "fate": "выжил", "id": "Властон", "url": "/c/lord-vlaston/", "img": "img/chars/lord-vlaston.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "06", "label": "6", "title": "Адский поезд"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}]}], "links": [{"key": "01", "label": "1", "title": "Башня колдуна", "note_html": "Убийство <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>; <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>, обесчещенная <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "03", "label": "3", "title": "Пещера кобольдов", "note_html": "Первое появление гнома <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a>", "dir": "out", "color": "#7D8A84"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона", "note_html": "Мать <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> — эльфийка <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>; здесь появляется отец", "dir": "out", "color": "#7C5CD6"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "Засада <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> на <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> — прямое продолжение", "dir": "out", "color": "#C8423B"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "<a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбург<\/a>; ветвь <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> — <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> его брат-близнец", "dir": "back", "color": "#7C5CD6"}, {"key": "13", "label": "13", "title": "Проклятые роды", "note_html": "Задел: дальнейшая судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> в семье, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "14", "label": "14", "title": "Янус доставка", "note_html": "Разгром таверны «Кайф» — причина переезда", "dir": "back", "color": "#2F84C8"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "Семья каннибалов из таверны «Кайф»", "dir": "back", "color": "#2F84C8"}, {"key": "22", "label": "22", "title": "Отряд Солнца", "note_html": "Семья каннибалов, гибель Али в таверне «Кайф», проклятие <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a>", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Впервые в жизни я совершил хороший поступок — убил жестокого садиста-колдуна». — <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "«Людям нравится зрелище, а мне нравится, что люди за него платят». — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a>", "«Моя мать проклята, и все, кто рождается от мамы, — с изъяном». — <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>", "«Суп, который ты ел, — ты думаешь, откуда у нас все эти продукты?» — корчмарь Али", "«Вновь мерзкий полурослик <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> выжил и присоединился к семье безумных культистов». — рассказчик"], "places_html": "<ul>\n<li><b>Горная таверна «Кайф»<\/b> на перевале Фортуны (на пути к <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбургу<\/a>): зал, второй этаж с комнатой <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>, подвал-бойня с клеткой, конюшня.<\/li>\n<li><b><a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбург<\/a><\/b> — куда шли <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> (к брату <a class=\"ref\" href=\"/c/savl/\">Савлу<\/a>) и <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> (к мэру).<\/li>\n<li>Фракции: семья каннибалов-культистов корчмаря Али; охотники за головами; культ Морадина (<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>).<\/li>\n<li>Артефакты/предметы: поводок и ошейник <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>; аркебуза <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a>; булава <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>; кастеты <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакиса<\/a>; перстень с парализующим ядом; фиолетовые лечебные ягоды; белая пентаграмма в зале; «золото <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>» (упоминается как приманка).<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>12<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>12<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>5<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>3<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>2<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>2<\/small><\/button><\/div><article class=\"pnote t-clarification\" id=\"qa17-21\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мастер не подыгрывает: Юджин оказался слишком лёгким, а в «Кайфе» все погибли честно<\/b><\/div><p>Мастер не подстраивает бои в пользу игроков. Финальный босс выпуска <a href=\"/ep/17/\" title=\"Демонизация\">17<\/a>, у которого было около 35–40 хитов, оказался слишком простым: солдаты погибли при взрыве, весь урон пришёлся на него, и игрокам повезло с бросками. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> все герои погибли в честном бою. <a class=\"ref\" href=\"/c/zhanuariya/\">Паучиху<\/a> можно было одолеть командной игрой: выманивать и убивать членов семьи по одному, баланс это позволял.<\/p><blockquote>«финальный босс в семнадцатом выпуске оказался типа слишком простым… в таверне вы все сдохли, потому что вы не работали в команде»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-21\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=5820\" target=\"_blank\" rel=\"noopener\">1:37:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-23\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Знали ли игроки сюжет заранее: Канделакис и письмо Цисгендия<\/b><\/div><p>Сюжет игрокам заранее не рассказывают. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> узнал в <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакисе<\/a> отца, потому что это было прописано в персонаже. Враждебность <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к <a class=\"ref\" href=\"/c/cisgender/\">Игристому<\/a> (Поперечному) в выпуске <a href=\"/ep/14/\" title=\"Янус доставка\">14<\/a> была чистым наитием. Письмо гвардии в инвентаре Игристого заметил <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> (<a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>), рассудив, что просто так такое в карточку не вписывают.<\/p><blockquote>«зачем это прописывать в инвентаре, типа ну просто так это не прописывается»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa17/#qa17-23\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6149\" target=\"_blank\" rel=\"noopener\">1:42:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa17-25\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Бои полуросликов — направление для развития вселенной<\/b><\/div><p>Авторы любят возвращать находки ранних выпусков как рефрены в новых обстоятельствах. Бои полуросликов (выпуск <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a>) они назвали популярным в мире видом досуга и направлением, которое стоит развивать.<\/p><blockquote>«бои полуросликов — это прикольное направление, которое можно развивать в этой вселенной»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-25\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6401\" target=\"_blank\" rel=\"noopener\">1:46:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-7\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Рогозия и Пэлиаса не будут пересоздавать<\/b><\/div><p>Авторы заявили, что гнома-инженера у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> больше не будет (возможно, такого персонажа получит другой игрок), а погибшего <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> не будут создавать заново, потому что повтор получится вторичным.<\/p><blockquote>«не будет больше гнома-инженера у Босса, будет у другого человека»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-7\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2280\" target=\"_blank\" rel=\"noopener\">0:38:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa22-1\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Женуария и Али провели ритуал, чтобы иметь детей<\/b><\/div><p>Авторы напомнили легенду, написанную для <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> к выпуску <a href=\"/ep/13/\" title=\"Проклятые роды\">13<\/a>: они с <a class=\"ref\" href=\"/c/ali/\">Али<\/a> не могли иметь детей и провели ритуал; дети начали рождаться, но все проклятыми, а сама Женуария стала паучихой. Каннибализм Али, по их словам, начался из-за неё: она-паучиха ела людей, и он был вынужден последовать за ней.<\/p><blockquote>«мы писали тебе легенду… о том, что вы с Али не могли иметь детей, провели вот этот ритуал… смогла иметь детей, но все они рождались проклятые»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-1\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1631\" target=\"_blank\" rel=\"noopener\">0:27:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa22-4\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Илдэ вернуть нельзя: её съела паучиха, часть её искры — в Женуарии<\/b><\/div><p>На вопрос о возвращении <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> авторы ответили, что она убита и съедена: по истории её съела мать-паучиха (<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a>), и часть искры Илдэ осталась в ней. Обеих героинь играла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a>.<\/p><blockquote>«её нельзя вернуть, она убита, съедена… по истории как раз мать, которая вот эта паучиха, она её и съела, и часть её искры в ней»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-4\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=2788\" target=\"_blank\" rel=\"noopener\">0:46:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa22-19\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Али звучит иначе, потому что изменился в аду<\/b><\/div><p>Мастер подтвердил, что голос <a class=\"ref\" href=\"/c/ali/\">Али<\/a> изменён намеренно: в выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> он был размеренным, медленным, «немного криминальным», а теперь он исчадие <a class=\"ref\" href=\"/place/ad/\">ада<\/a> и должен был сильно измениться.<\/p><blockquote>«тут он по-другому говорил по той причине, что он реально исчадие ада теперь, он должен был сильно измениться»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa22/#qa22-19\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6143\" target=\"_blank\" rel=\"noopener\">1:42:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa22-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Жанне, Динь-Диню и Володимиру некуда возвращаться: их тела исчезли<\/b><\/div><p>В отличие от <a class=\"ref\" href=\"/c/ali/\">Али<\/a>, у которого тело осталось на земле, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> попали в <a class=\"ref\" href=\"/place/ad/\">ад<\/a> телами на поезде; когда поезд въехал на территорию ада, их тела исчезли и туда добрались только души — поэтому вернуть их не во что.<\/p><blockquote>«их тела исчезли, потому что они телами попали в этот поезд… у Али в отличие от них было тело на земле»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-21\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6369\" target=\"_blank\" rel=\"noopener\">1:46:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Скрытые мотивации у постоянных игроков; BRB получил её впервые<\/b><\/div><p>У всех постоянных игроков уже были скрытые мотивации: у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> за <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, у Данилы Поперечного (Игристое/<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>). <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкину<\/a> её не давали, потому что «у него в голове всегда скрытая мотивация». В выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">24<\/a> скрытую мотивацию впервые дали <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, и только ему: как опытный игрок, он получил задание обыграть остальных. Изначально идея была немного другой.<\/p><blockquote>«в этот раз мы решили впервые дать скрытую мотивацию Big Russian Boss&#x27;у. Дали ему только одному»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-4\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=322\" target=\"_blank\" rel=\"noopener\">0:05:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b><\/div><p>Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений».<\/p><blockquote>«Тем ребёнком был Канделакис, которому дали… отвратительную фамилию Пэнисов. Мы это придумали: вот эту связь того, что Кукушкин придумал в первом выпуске, мы сейчас связали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-32\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa31-12\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Начало выпуска было заскриптовано<\/b><\/div><p>Сцену знакомства с героями заранее заскриптовали, как в «<a class=\"ref\" href=\"/place/taverna-kayf/\">Таверне «Кайф<\/a>»»: это была ловушка с единственным выходом — сбежать, а не сражаться с бесконечными демонами. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> дали бриф не вызывать <a class=\"ref\" href=\"/c/gogen/\">Гогена<\/a>, пока не выйдет <a class=\"ref\" href=\"/p/slava-kopeykin/\">Слава Копейкин<\/a>. Гостей вводили прямо по ходу приключения, чтобы удивить зрителей на съёмке.<\/p><blockquote>«не вызывай гогена пока не выйдет Слава, вот такой бриф у него был на начало»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-12\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=1639\" target=\"_blank\" rel=\"noopener\">0:27:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-16\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Женуария съела сына Мелиссы — Канделакиса<\/b><\/div><p>Авторы отметили находку зрителей: сын <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a> (его играл <a class=\"ref\" href=\"/p/vladimir-markoni/\">Владимир Маркони<\/a>) в выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> был съеден той же <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарией<\/a>, когда она в облике паучихи ещё была людоедкой. Мелисса об этом не знает, но когда-нибудь может узнать.<\/p><blockquote>«Сын Канделакис, которого играл Вова Маркони, был в седьмом приключении съеден как раз-таки этой же самой Женуарией… будучи в образе паучихи»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-16\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4221\" target=\"_blank\" rel=\"noopener\">1:10:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><\/section>", "chars": {"Али": {"name": "Али", "img": "img/chars/ali.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%90%D0%BB%D0%B8", "summary": "Али - корчмарь и владелец таверны \"Кайф\", глава семейства Лектор. Впервые появился в седьмом выпуске ПЧК.", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Неигровой"}, "actors": [], "kind": "npc", "dead": false, "race": "Человек", "portraits": [], "url": "/c/ali/", "eps": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}]}, "Эрик": {"name": "Эрик Пэнисов", "img": "img/chars/erik-penisov.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%AD%D1%80%D0%B8%D0%BA_%D0%9F%D1%8D%D0%BD%D0%B8%D1%81%D0%BE%D0%B2", "summary": "Э́рик Пэ́нисов — полурослик, плут, один из главных героев вселенной игры «Подземелья Чикен Карри».", "infobox": {"Пол": "Мужской", "Раса": "Полурослик", "Тип": "Игровой", "Игрок": "Никита Кукушкин"}, "actors"
