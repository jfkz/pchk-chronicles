<script>window.EPD = {"anim": false, "key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "date": "2021-11-17", "minutes": 78, "duration": 4682.0, "video_id": "H4xmF7lF0Ng", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Горная таверна «Кайф» на перевале Фортуны, по пути в Кальтенбрун", "short_html": "Гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> везёт пленного <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> и из-за метели останавливается в горной таверне «Кайф», где собираются громила-проводник <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, отец Эрика <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пенисов<\/a> и изгнанная дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>. Таверна оказывается логовом семьи каннибалов: корчмарь Али опаивает постояльцев, сыновья разделывают их, а мать — гигантская паучиха; Юлиан — её сын. В финальной схватке гибнут Рогозий, Илдэ и Канделакис. Эрик, спрятавшийся в туше лошади, соглашается вступить в семью.", "summary_html": "Продолжение выпуска 5: охотник за головами гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> везёт пленного <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> на суд к лорду <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> и из-за метели останавливается в горной таверне «Кайф» на перевале Фортуны. Там же оказываются нанятый Рогозием проводник-громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, отец Эрика — организатор боёв карликов <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пенисов<\/a> — и обесчещенная <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>, ищущая монстра перевала. Таверна оказывается логовом семьи каннибалов-культистов: корчмарь Али и его сыновья опаивают постояльцев и разделывают их, а мать семейства — гигантская паучиха; Юлиан — один из её сыновей и заманивал путников. В финальной схватке гибнут Рогозий, Илдэ и Канделакис, а Эрик, спрятавшийся в туше лошади, соглашается вступить в «семью».", "outcome_html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> и <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> погибли; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> выжил и вступил в семью каннибалов-культистов вместе с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> и <a class=\"ref\" href=\"/c/sofiya/\">Софией<\/a>.", "world_html": ["<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> освободился от охотника за головами и примкнул к семье каннибалов из таверны «Кайф»", "Погибли гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> и отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a>", "Раскрыта тайна исчезновений на перевале Фортуны"], "scenes": [{"t": "0:00:04", "sec": 4, "html": "Рекап: после убийства <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> схвачены, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> бежал на север к брату <a class=\"ref\" href=\"/c/savl/\">Савлу<\/a>, но по дороге в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбрун<\/a> его перехватил <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>."}, {"t": "0:03:34", "sec": 214, "html": "Метель; в единственную на десятки километров горную таверну «Кайф» на перевале Фортуны входит <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> с <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a> на поводке. Представления: Эрик («впервые в жизни совершил хороший поступок»), Рогозий (награда от <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, нанял проводника), <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (громила со шрамом «от горного тролля»)."}, {"t": "0:06:32", "sec": 392, "html": "Появляется полурослик в дорогой шубе — организатор боёв карликов «<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a>», ехал в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбрун<\/a> договариваться с мэром. Затем — дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>: обесчещенная соратником (<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>, вып. 1), изгнанная своим народом, сбрила бороду и ищет монстра перевала, чтобы совершить подвиг во имя Морадина."}, {"t": "0:09:52", "sec": 592, "html": "Вставка-реклама: цитадель белых магов, маг-некромант общается с семьёй через «секретный тариф ордена»."}, {"t": "0:13:39", "sec": 819, "html": "В зале <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> узнаёт <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>; Эрик мочится на кепку <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакиса<\/a>, Илдэ бьёт Эрика. Эрик пытается скрыться под столом."}, {"t": "0:16:12", "sec": 972, "html": "<a class=\"ref\" href=\"/c/ali/\">Корчмарь Али<\/a> подаёт еду. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (про себя) — сын корчмаря, приводит путников, которые пропадают; мать проклята, все её дети с изъяном. <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> тайно признаётся: его фамилия Пенисов, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> — его сын."}, {"t": "0:18:00", "sec": 1080, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> из-под стола кусает <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> за пах, тот бьёт его по голове. Незнакомец дважды бьёт Эрика ножом в спину («это за мою жену!»); <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> убивает его ударом кулака, Эрик объедает мертвецу лицо."}, {"t": "0:21:17", "sec": 1277, "html": "Дочь корчмаря <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> лечит <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> фиолетовыми ягодами; рассказывает о постояльцах и о других охотниках за головами, ищущих полурослика. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> заметил, что ей страшно, но она боится говорить."}, {"t": "0:23:48", "sec": 1428, "html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, заняв 5 серебряных у <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакиса<\/a>, снимает комнату и поднимается к <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>: в её комнате — горы платьев разных размеров и манекен с гигантским платьем. София не решается рассказать правду; при появлении отца Рогозий прячется в шкафу, находит монету."}, {"t": "0:29:07", "sec": 1747, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> натравливает других охотников (полуорк, гоблин и др.), обещая золото, украденное у <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>. Драка: <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> кастетами дерётся с полуорком и гоблином, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> подвешивает гоблина на мясной крюк, <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> булавой разносит череп одному из охотников. Эрик пытается вырваться, но поводок опутывает его ноги (крит. провал)."}, {"t": "0:37:17", "sec": 2237, "html": "<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> запугивает и допрашивает гоблина: охотники выслеживали <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>; на перевале постоянно пропадают люди. Корчмарь сваливает всё на волков."}, {"t": "0:41:25", "sec": 2485, "html": "Вставка-реклама про охотника на монстров. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> наверху с помощью приспособлений слышит сквозь метель предсмертные крики лошадей из конюшни."}, {"t": "0:44:38", "sec": 2678, "html": "Сыновья корчмаря выходят с тесаками; <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> держит корчмаря за горло, требуя правды. Все идут к конюшне. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> ловкостью рук крадёт у <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> отмычку."}, {"t": "0:47:40", "sec": 2860, "html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> находит у конюшни следы человеческих ботинок, ведущие в таверну; все лошади зарезаны человеком с очень острым клинком. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> отмычкой снимает ошейник, вырывается из хватки <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и бежит в таверну."}, {"t": "0:52:50", "sec": 3170, "html": "<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> настигает <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, вскакивает на стол и показывает татуировку «Пенисов» на своём пенисе — все понимают, что это отец и сын; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> рыдает от умиления."}, {"t": "0:54:37", "sec": 3277, "html": "Все, кто ел еду, засыпают — пища была отравлена. Герои просыпаются в клетке подвала среди груды людей; <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> нет. Голый сын корчмаря в кожаном фартуке разделывает трупы."}, {"t": "0:56:29", "sec": 3389, "html": "У <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> в кармане — свёрток от <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>: ягоды, ключ и записка «Надеюсь на твою помощь, Рогозий». <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> открывает клетку, Рогозий из аркебузы ранит мясника, Илдэ добивает его булавой."}, {"t": "1:02:22", "sec": 3742, "html": "В главном зале — пентаграмма, гигантская паучиха, корчмарь, двое сыновей и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>. Юлиан раскрывается: его мать — паучиха, шрам — от рождения."}, {"t": "1:04:16", "sec": 3856, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> предлагает семье сделку против спутников, провалив убеждение, выпрыгивает в окно и прячется внутри туши лошади в конюшне."}, {"t": "1:05:40", "sec": 3940, "html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Паучиха<\/a> хватает <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> жвалами. Корчмарь признаётся, что суп был из людей. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> стреляет в люстру — та падает на паучиху, начинается пожар; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> двумя ударами валит Рогозия (0 ХП, спасброски от смерти)."}, {"t": "1:08:38", "sec": 4118, "html": "<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> обманом даёт одному из сыновей выпить парализующий яд из перстня («молоко моей матери»). <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> цепью от люстры душит паучиху (крит), та отпускает её; корчмарь бьёт Илдэ моргенштерном, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> добивает её кулаком."}, {"t": "1:12:24", "sec": 4344, "html": "<a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a> бежит, завязывает дверь своей шубой, но <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> догоняет его и двумя ударами сносит ему голову. Мастер: «побеждает тьма» — <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> и Канделакис мертвы."}, {"t": "1:14:17", "sec": 4457, "html": "Корчмарь находит <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> в туше лошади и предлагает остаться в семье каннибалов («будем кормить людей, строить семью»). Эрик, чтобы выжить, соглашается; к нему выходит <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>. Итог: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>-победитель, 130 000 руб. — в фонд «Детские сердца»."}], "key_events": [{"t": "0:03:34", "sec": 214}, {"t": "0:18:00", "sec": 1080}, {"t": "0:29:07", "sec": 1747}, {"t": "0:47:40", "sec": 2860}, {"t": "0:52:50", "sec": 3170}, {"t": "0:54:37", "sec": 3277}, {"t": "0:56:29", "sec": 3389}, {"t": "1:02:22", "sec": 3742}, {"t": "1:04:16", "sec": 3856}, {"t": "1:12:24", "sec": 4344}, {"t": "1:14:17", "sec": 4457}], "coins": {"ep": "07", "events": [{"t": "0:23:52", "kind": "loot", "who": "Канделакис Пенисов", "actor": "Маркони", "to": null, "reason": "заплатил трактирщику пять серебряных монет, чтобы снять комнату и подняться к Софии — обычные внутриигровые деньги, не монеты-мехиника шоу", "result": null, "sec": 1432, "who_url": "/c/kandelakis-penisov/", "reason_html": "заплатил трактирщику пять серебряных монет, чтобы снять комнату и подняться к <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> — обычные внутриигровые деньги, не монеты-мехиника шоу"}, {"t": "0:28:57", "kind": "earn", "who": "Канделакис Пенисов", "actor": "Маркони", "to": null, "reason": "спрятавшись в шкафу от отца Софии, нашёл золотую монету", "result": null, "sec": 1737, "who_url": "/c/kandelakis-penisov/", "reason_html": "спрятавшись в шкафу от отца <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>, нашёл золотую монету"}, {"t": "0:36:07", "kind": "spend", "who": "Канделакис Пенисов", "actor": "Маркони", "to": null, "reason": "потратил монету на переброс проверки силы, пытаясь вырваться из захвата гоблина/орка на ошейнике", "result": "переброс тоже неудачный (критический провал)", "sec": 2167, "who_url": "/c/kandelakis-penisov/", "reason_html": "потратил монету на переброс проверки силы, пытаясь вырваться из захвата гоблина/орка на ошейнике"}, {"t": "1:16:49", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "итоговый подсчёт ведущего — по итогам выпуска (включая бросок d6) у команды набралось три золотые монеты", "result": null, "sec": 4609, "who_url": null, "reason_html": "итоговый подсчёт ведущего — по итогам выпуска (включая бросок d6) у команды набралось три золотые монеты"}], "totals": [{"who": "Эрик Пенисов", "actor": "Кукушкин", "earned": 0, "spent": 0, "img": "img/chars/erik-penisov.webp", "who_url": "/c/erik-penisov/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Рогозий", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/rogozij.webp", "who_url": "/c/ragozin/", "actor_url": "/p/brb/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 0, "spent": 0, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Канделакис Пенисов", "actor": "Маркони", "earned": 1, "spent": 1, "img": "img/chars/kandelakis.webp", "who_url": "/c/kandelakis-penisov/", "actor_url": null}, {"who": "Илдэ «Огненная Кузня»", "actor": "Варнава", "earned": 0, "spent": 0, "img": "img/chars/ilde.webp", "who_url": "/c/eldi/", "actor_url": null}, {"who": "неизвестно (итоговый бонус)", "actor": null, "earned": 2, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Это отдельная сюжетная линия — история охотника за головами Рогозия и его пленника, где почти все монетные события сосредоточены вокруг Канделакиса Пенисова. Есть чёткое разграничение валют: пять серебряных монет за комнату — обычная внутриигровая плата (loot), а золотые монеты — благотворительная механика шоу. Итоговые три монеты (30 000 руб.) не расписаны ведущим по персонажам, поэтому остаток (2) отнесён к «неизвестно»."}, "cast": [{"name": "Эрик Пенисов", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "полурослик, плут", "role": "", "fate": "выжил, вступил в семью каннибалов", "id": "Эрик", "url": "/c/erik-penisov/", "img": "img/chars/erik-penisov.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "35", "label": "35", "title": "Второй Шанс"}]}, {"name": "Рогозий", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "гном, охотник за головами", "role": "", "fate": "погиб", "id": "Рагозин", "url": "/c/ragozin/", "img": "img/chars/rogozij.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}]}, {"name": "Юлиан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "человек, громила-проводник (сын паучихи)", ам Юмора", "note_html": "<a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбрунн<\/a>; ветвь <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> — <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> его брат-близнец", "dir": "back", "color": "#7C5CD6"}, {"key": "13", "label": "13", "title": "Проклятые роды", "note_html": "Задел: дальнейшая судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> в семье, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "14", "label": "14", "title": "Янус доставка", "note_html": "Разгром таверны «Кайф» — причина переезда", "dir": "back", "color": "#2F84C8"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "Семья каннибалов из таверны «Кайф»", "dir": "back", "color": "#2F84C8"}, {"key": "22", "label": "22", "title": "Отряд Солнца", "note_html": "Семья каннибалов, гибель Али в таверне «Кайф», проклятие <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a>", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Впервые в жизни я совершил хороший поступок — убил жестокого садиста-колдуна». — <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "«Людям нравится зрелище, а мне нравится, что люди за него платят». — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис<\/a>", "«Моя мать проклята, и все, кто рождается от мамы, — с изъяном». — <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>", "«Суп, который ты ел, — ты думаешь, откуда у нас все эти продукты?» — корчмарь Али", "«Вновь мерзкий полурослик <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> выжил и присоединился к семье безумных культистов». — рассказчик"], "places_html": "<ul>\n<li><b>Горная таверна «Кайф»<\/b> на перевале Фортуны (на пути к <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбруну<\/a>): зал, второй этаж с комнатой <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>, подвал-бойня с клеткой, конюшня.<\/li>\n<li><b><a class=\"ref\" href=\"/pl
