<script>window.EPD = {"anim": false, "key": "27", "label": "27", "title": "Достучаться до небес", "date": "2024-05-29", "minutes": 112, "duration": 6720.0, "video_id": "hpByQd_jpqU", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Небесный мир: Небесная канцелярия и райский сад", "short_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> с изгнанными небожителями пробиваются в Небесную канцелярию просить помощи против демонов.", "summary_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> прошли через портал с острова Соблазна в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>. С двумя опальными небожителями и мелким богом камня они идут в Небесную канцелярию просить верховного бога помочь против демонов. Оказывается, бог Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> отошёл от дел, а небом правит его дочь <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>: она превратила рай в бездушную корпорацию с «индексом любви», рейтингами праведников и «концепциями страданий» для землян. Герои с боем и хитростью пробиваются через отдел кадров и задания для новичков. У бога гномов <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a> они получают магическую скрижаль и узнают главную тайну: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, сын Гелиуса, изгнанный в ад за связь с полурослицей, а её ребёнок получил фамилию Пенисов. Гелиус передаёт героям свой меч, колокольчик бога Солнца и грифона. Спасая отряд от дезинтеграции Венерой, Пахом телепортирует всех к порталу и рассыпается пеплом.", "outcome_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> погиб, спасая отряд. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>, <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a>, Стелла и <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> ушли на Землю с оружием <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>, скрижалью и грифоном.", "world_html": ["Гибель медиума <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> — конец его ветви", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, изгнанный сын <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>", "Род Пенисовых происходит от божественного семени <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>", "<a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> отошёл от дел, небом правит <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>; небеса не вступят в войну с демонами", "У героев на Земле меч <a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиуса<\/a>, колокольчик бога Солнца, скрижаль для вызова <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> и грифон", "Боги устраивают бедствия на Земле ради молитв (саранча на <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>)"], "scenes": [{"t": "0:01:05–0:03:13", "sec": null, "html": "Пересказ всей истории <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>. Он владел каретной мастерской в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> и был медиумом. Во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> разбил амфору-«пустышку» (#4), в адском поезде предал друзей и сбежал с кристаллом (#6). Взорвал демонический алтарь <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a>, где кристалл врос ему в ладонь (#10), украл большой кристалл Адского вокзала (#17) и открыл портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> через богиню (#25)."}, {"t": "0:06:21", "sec": 381, "html": "Задача: <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесная канцелярия<\/a> (здание в форме сердца) — встретиться с верховным богом и найти способ бороться с демонами."}, {"t": "0:06:21–0:12:45", "sec": null, "html": "Представления. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> надеется на бога Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>; кристалл в руке его убивает, и следующая телепортация может стать последней. <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a> уволен из Департамента любви за «нетрадиционные пары» («ворону и эльфийку», «гномиху, писаря и козу»). <a class=\"ref\" href=\"/c/stella-artua/\">Стеллу Артуа<\/a> за самовольный уход с поста охраны канцелярии отправили в отпуск на дальнее облако. <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректусу<\/a> поклоняются семь орков и гоблин, и нашествие демонов для него — шанс продвинуться в пантеоне."}, {"t": "0:13:50–0:21:13", "sec": null, "html": "На ресепшене висит «индекс любви» на максимуме. Администратор Адель (праведница, убитая в 17 лет) под «зоной правды» Стеллы признаётся: <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> на пенсии, верховная богиня теперь <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, она на Совете богов. Бывшая коллега Стеллы, валькирия, стыдит её. Отряд выдаёт себя за «божественных сопровождающих» двух праведников — <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>."}, {"t": "0:22:16–0:25:24", "sec": null, "html": "Турникет чистой энергии ранит <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> из-за тёмного кристалла. Валькирия-охранница находит источник тьмы и предлагает отрубить руку, но Пахом очаровывает её. От неё он узнаёт: <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> потерял множество храмов Солнца на Земле, потому что «его главный адепт присягнул дьяволу», утратил авторитет и отошёл от дел. В Совет богов входят Морадин, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, Зевс, <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a> и другие."}, {"t": "0:27:30–0:33:46", "sec": null, "html": "В отделе кадров три слепые мойры, Крис, Милиция и Стана, ищут «праведников» в картотеке судьбы. Стелла находит карточку <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> Пенисова: «умер в выгребной (в субтитрах — «грибной») яме, пытаясь спасти сотни людей». Отряд подделывает пять бланков: все якобы погибли, спасая котят из деревенского унитаза."}, {"t": "0:34:50–0:46:24", "sec": null, "html": "Мойры раскрывают обман. Крис изгоняет <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> в межмирье, Милиция опутывает отряд паутиной, Стана бьёт огненными стрелами. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> усыпляет Крис песней, и Пахом возвращается. <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> режет паутину руками-скальпелями и крадёт у спящей Крис клубок судьбы. Стелла «карой Фемиды» размазывает Милицию по стене."}, {"t": "0:46:24–0:49:34", "sec": null, "html": "Стана под угрозой ставит печати на поддельные бланки и после «пяти причин праведности» (песню <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> подхватывает <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a>) даёт испытательный срок. Нужно выполнить два задания из трёх со средней оценкой не ниже 4,7 «сердечка», и тогда будет собеседование с <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a>."}, {"t": "0:50:37–0:57:59", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> чинит печатный станок в пиар-отделе и находит зажёванный лист: «план получения килосвета на III квартал». Нашествие саранчи на поля <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> за «2 килосвета» поднимет страдания на 1% и молитвы на 10% («называть не саранчой, а приглашением больших кузнечиков»). В мусорке лежит листовка <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> с номером «7735, добавочный…». Спор «лебедь или бобёр как символ любви» приносит пятёрку."}, {"t": "0:59:01–1:08:28", "sec": null, "html": "В райском саду праведник Шон мечтает умереть навсегда. На небесах отменили привилегии, праведники стали слугами с рейтингом, а за низкий рейтинг реинкарнируют в слизня или камень. Обиженный <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> убивает его с разбега, и Шон рассыпается искрами."}, {"t": "1:07:24–1:17:58", "sec": null, "html": "Бутыль для кулера держит гигантский клещ. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> «продаёт» ему руки <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректуса<\/a>, превращённые в чупа-чупсы, клещ присасывается и пьёт божественную энергию. Стелла убивает его мечом «божественной кары»."}, {"t": "1:18:02–1:21:14", "sec": null, "html": "В отделе реинкарнации отряд танцует и поёт ради пятёрки. Лист заданий загорается: допуск к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a> получен."}, {"t": "1:21:14–1:26:25", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> отделяется от группы и идёт к грифону. Это конь <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>, он тоскует по былым пирам и жаждет битвы. Телепатическая переписка с грифоном: вызвать Гелиуса можно по старому номеру 7735 с добавочным, а добавочный может знать <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a>. Пахом скрытой заявкой просит грифона отвлечь остальных катанием."}, {"t": "1:28:31–1:33:53", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> приносит эль спивающемуся богу гномов <a class=\"ref\" href=\"/c/dondon/\">Дондону<\/a> из «департамента расовых меньшинств» и убеждает его помочь. Дондон рассказывает: храмы <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> забрали при помощи «стеклянных колб, которые оскверняют» (связь с #24), а беды Гелиуса начались, когда он сам отправил в ад собственного сына. Добавочный номер — 01. Стелла «поиском предмета» находит у Дондона магическую скрижаль."}, {"t": "1:33:53–1:36:02", "sec": null, "html": "Главное откровение. Скрижаль принадлежала сыну <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a>. Гелиус запретил богам связи со смертными, а Брэндон возлёг с полурослицей. Его тело испепелили, а дух навечно заточили в аду. Ребёнку полурослицы дали «позорную бедняцкую фамилию» Пенисов, матери стёрли память. На Земле ходят легенды об избранном, рождённом от божественного семени."}, {"t": "1:36:02–1:43:25", "sec": null, "html": "Видеозвонок <a class=\"ref\" href=\"/c/gelius/\">Гелиусу<\/a>, при нём полуголые нимфы. Он сомневается в своих методах и доверяет «эффективной» <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>, своей дочери. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> убеждает его (<a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> тратит на бросок значение 19 из клубка судьбы). Гелиус не пойдёт против Венеры, но поможет людям: «<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>» — это Брэндон, он не может попасть на небо без божественной оболочки, а сражаться с ним нужно на Земле. Венера на войну с демонами не пойдёт: небо защищено божественным барьером. Гелиус передаёт героям двуручный меч <a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиуса<\/a>, колокольчик бога Солнца и грифона, но пропажу быстро заметят."}, {"t": "1:43:25–1:47:37", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с мечом, колокольчиком и грифоном летит к порталу. Остальные решают идти к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a> и звонят ей."}, {"t": "1:47:37–1:49:43", "sec": null, "html": "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> с валькириями выходит навстречу: за кражу реликвий и знание тайн богов всех ждёт дезинтеграция. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> телекинезом притягивает отряд и произносит «<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, отнеси меня в портал». Все оказываются у портала, а Пахом тлеет, как сигарета, и рассыпается пеплом («Вы меня заебали»). Остальные уходят через портал на Землю, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> последней."}, {"t": "1:50:38", "sec": 6638, "html": "Монеты — 60 000 ₽ на благотворительность. Эпилог: «<a class=\"ref\" href=\"/c/medium-pahom/\">Медиум Пахом<\/a> родился на земле, сбежал из ада и погиб на небесах. Искупив своё предательство, он добыл мощное оружие, которое поможет жителям земного мира одолеть демонов»."}], "key_events": [{"t": "0:17:00", "sec": 1020}, {"t": "0:25:42", "sec": 1542}, {"t": "0:30:57", "sec": 1857}, {"t": "0:33:45", "sec": 2025}, {"t": "0:52:53", "sec": 3173}, {"t": "1:21:56", "sec": 4916}, {"t": "1:34:30", "sec": 5670}, {"t": "1:36:22", "sec": 5782}, {"t": "1:43:50", "sec": 6230}, {"t": "1:48:24", "sec": 6504}], "coins": {"ep": "27", "events": [{"t": "0:56:55", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Придумал в пиар-отделе небесной канцелярии убедительный (и смешной) маркетинговый аргумент в споре «лебедь против бобра».", "result": null, "sec": 3415, "who_url": "/c/medium-pahom/", "reason_html": "Придумал в пиар-отделе небесной канцелярии убедительный (и смешной) маркетинговый аргумент в споре «лебедь против бобра»."}, {"t": "1:03:05", "kind": "earn", "who": "Санта Тиндерман", "actor": "Дэни Барнс", "to": null, "reason": "За яркий и смешной пересказ (рекап) похождений группы в отделе кадров небесной канцелярии.", "result": null, "sec": 3785, "who_url": "/c/santa-tinderman/", "reason_html": "За яркий и смешной пересказ (рекап) похождений группы в отделе кадров небесной канцелярии."}, {"t": "1:03:55", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Монета за каламбур про праведника, который «твидник», у райского озера Love.", "result": null, "sec": 3835, "who_url": null, "reason_html": "Монета за каламбур про праведника, который «твидник», у райского озера Love."}, {"t": "1:20:17", "kind": "earn", "who": "Полуэректус", "actor": "Владимир Маркони", "to": null, "reason": "Отыграл собственное перевоплощение в камень в отделе реинкарнации (после шуточного танца перед ангелами).", "result": null, "sec": 4817, "who_url": "/c/poluerektus/", "reason_html": "Отыграл собственное перевоплощение в камень в отделе реинкарнации (после шуточного танца перед ангелами)."}, {"t": "1:25:25", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Обрёл союзника — уговорил грифона помочь группе добраться до гнома Дондона.", "result": null, "sec": 5125, "who_url": "/c/medium-pahom/", "reason_html": "Обрёл союзника — уговорил грифона помочь группе добраться до гнома <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>."}], "totals": [{"who": "Пахом", "actor": "BRB", "earned": 2, "spent": 0, "img": "img/chars/pahom.webp", "who_url": "/c/medium-pahom/", "actor_url": "/p/brb/"}, {"who": "Санта Тиндерман", "actor": "Дэни Барнс", "earned": 1, "spent": 0, "img": null, "who_url": "/c/santa-tinderman/", "actor_url": "/p/deni-barns/"}, {"who": "Полуэректус", "actor": "Владимир Маркони", "earned": 1, "spent": 0, "img": null, "who_url": "/c/poluerektus/", "actor_url": "/p/vladimir-markoni/"}], "notes": "Выпуск — комедийный «финал» в декорациях небесной канцелярии; монеты выдавались только за удачные шутки и отыгрыш, никто ни разу не потратил монету на переброс. В конце — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие."}, "cast": [{"name": "Пахом", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, медиум", "role": "", "fate": "погиб — рассыпался пеплом после последней телепортации", "id": "Пахом", "url": "/c/medium-pahom/", "img": "img/chars/pahom.webp", "other": [{"key": "04", "label": "4", "title": "Дворец лорда Властона"}, {"key": "06", "label": "6", "title": "Адский поезд"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "25", "label": "25", "title": "Остров Соблазна"}]}, {"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, бард", "role": "", "fate": "выжила, ушла на Землю", "id": "Талала", "url": "/c/gnomka-talala/" ", "actor": "", "actor_url": null, "race": "", "role": "сын Гелиуса, изгнанный в ад, — Тёмный Властелин; предок рода Пенисовых", "fate": "дух заточён в аду", "id": "Брэндон", "url": "/c/brendon-tyomnyy-vlastelin/", "img": "img/chars/tyomnyj-vlastelin.webp", "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Дондон", "actor": "", "actor_url": null, "race": "", "role": "бог гномов, департамент расовых меньшинств", "fate": "жив, отдал скрижаль", "id": "Дондон", "url": "/c/dondon/", "img": null, "other": [{"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Грифон", "actor": "", "actor_url": null, "race": "", "role": "конь Гелиуса", "fate": "отдан героям", "id": "Андрей", "url": "/c/grifon-andrey/", "img": "img/chars/andrej.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Мойра Крис", "actor": "", "actor_url": null, "race": "", "role": "старшая слепая богиня судьбы, отдел кадров", "fate": "усыплена, лишилась клубка судьбы", "id": null, "url": null, "img": null, "other": []}, {"name": "Мойра Милиция", "actor": "", "actor_url": null, "race": "", "role": "средняя богиня судьбы", "fate": "тяжело ранена (возможно, погибла)", "id": null, "url": null, "img": null, "other": []}, {"name": "Мойра Стана", "actor": "", "actor_url": null, "race": "", "role": "младшая богиня судьбы", "fate": "жива, выдала допуск", "id": null, "url": null, "img": null, "other": []}, {"name": "Адель", "actor": "", "actor_url": null, "race": "", "role": "праведница-администратор ресепшена", "fate": "жива", "id": "Адель", "url": "/c/adel/", "img": null, "other": []}, {"name": "Шон", "actor": "", "actor_url": null, "race": "", "role": "разочарованный праведник", "fate": "погиб окончательно (убит Полуэректусом)", "id": "Шон", "url": "/c/shon/", "img": null, "other": []}, {"name": "Гигантский клещ", "actor": "", "actor_url": null, "race": "", "role": "держал бутыль для кулера", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Савл Пенисов", "actor": "", "actor_url": null, "race": "", "role": "праведник из картотеки", "fate": "погиб ранее — утонул в выгребной яме Храма Юмора, спасая сотни людей (#10); попал в рай как праведник", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "04", "label": "4", "title": "Дворец лорда Властона", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> разбил амфору во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "06", "label": "6", "title": "Адский поезд", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> предал друзей в адском поезде", "dir": "out", "color": "#7C5CD6"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> в <a class=\"ref\" href=\"/place/hram-yumora/\">Храме Юмора<\/a>; там же погиб <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> Пенисов, теперь праведник на небесах", "dir": "out", "color": "#7C5CD6"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл Адского вокзала", "dir": "out", "color": "#7C5CD6"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "Легенда об избранном от божественного семени; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>, присягнувший дьяволу; осквернение храмов Солнца колбами; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "25", "label": "25", "title": "Остров Соблазна", "note_html": "Портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> открыт на острове Соблазна", "dir": "out", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Гибель <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> на небесах, дары <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "38", "label": "38", "title": "Возлюбленная", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> попадает на небеса и получает дары бога Солнца", "dir": "back", "color": "#7C5CD6"}, {"key": "42", "label": "42", "title": "Чудная Долина", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> в небесном мире", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Я боевой ангел, а не какая-то вахтёрша» — <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a>.", "«Рекомендуем называть это не нашествием саранчи, а приглашением больших кузнечиков» — пиар-отдел небес.", "«Ему дали позорную бедняцкую фамилию… Пенисов?» — «Ой, откуда ты знаешь?»", "«Ты всегда разговариваешь с Александром Бригановым. Это я тебе говорю как <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>».", "«<a class=\"ref\" href=\"/c/medium-pahom/\">Медиум Пахом<\/a> родился на земле, сбежал из ада и погиб на небесах»."], "places_html": "<ul>\n<li>Места: Небесный мир — <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесная канцелярия<\/a> (ресепшн, отдел к
