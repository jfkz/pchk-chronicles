<script>window.EPD = {"anim": false, "key": "27", "label": "27", "title": "Достучаться до небес", "date": "2024-05-29", "minutes": 112, "duration": 6720.0, "video_id": "hpByQd_jpqU", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Небесный мир: Небесная канцелярия и райский сад", "short_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> с изгнанными небожителями пробиваются в Небесную канцелярию просить помощи против демонов.", "summary_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> прошли через портал с острова Соблазна в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>. С двумя опальными небожителями и мелким богом камня они идут в Небесную канцелярию просить верховного бога помочь против демонов. Оказывается, бог Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> отошёл от дел, а небом правит его дочь <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>: она превратила рай в бездушную корпорацию с «индексом любви», рейтингами праведников и «концепциями страданий» для землян. Герои с боем и хитростью пробиваются через отдел кадров и задания для новичков. У бога гномов Дон-Дона они получают магическую скрижаль и узнают главную тайну: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, сын Гелиоса, изгнанный в ад за связь с полурослицей, а её ребёнок получил фамилию Пэнисов. Гелиос передаёт героям свой меч, колокольчик бога Солнца и грифона. Спасая отряд от дезинтеграции Венерой, Пахом телепортирует всех к порталу и рассыпается пеплом.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Небесная канцелярия как «рельсы»: бухгалтерию и опенспейс можно было посетить\">12<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Небесная канцелярия как «рельсы»: бухгалтерию и опенспейс можно было посетить<\/b> Авторы объяснили: рай сделали корпорацией, чтобы новый сеттинг был понятнее. Мастер вёл игроков по отделам, как по рельсам, потому что так было проще подать много информации. С рельсов можно было сойти: пойти к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>, на Совет богов, в бухгалтерию или опенспейс. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> не ограничен канцелярией, в нём почти бесконечно много «скал» и отделов. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2778\" target=\"_blank\" rel=\"noopener\">0:46:18 ↗<\/a> · <a href=\"#qa27-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Иерархия богов устроена как корпорация\">29<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Иерархия богов устроена как корпорация<\/b> Ранги богов авторы описали как корпорацию. Генеральный директор — верховный бог, сейчас это <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Совет богов — совет директоров. Дальше идут главы отделов, а клерки — праведники. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6764\" target=\"_blank\" rel=\"noopener\">1:52:44 ↗<\/a> · <a href=\"#qa27-30\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Пахом и Талала могли пробыть на небесах месяцы\">38<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Пахом и Талала могли пробыть на небесах месяцы<\/b> Демоны успели захватить <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров соблазна<\/a> потому, что никто не говорил, будто <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> провели на небесах несколько часов: на знакомство с <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесными<\/a> департаментами могли уйти месяц или два. Время в небесном мире течёт иначе, но точную формулу авторы не назвали. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=701\" target=\"_blank\" rel=\"noopener\">0:11:41 ↗<\/a> · <a href=\"#qa31-5\">к записи<\/a><\/span><\/span>", "outcome_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> погиб, спасая отряд. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>, <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a>, Стелла и <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> ушли на Землю с оружием <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, скрижалью и грифоном.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю\">35<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> не выпустил спутников <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> из <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a> через портал: разрешения у них не было. Разрешение на переход из всех небесных существ было только у грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a>, посланного богом Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep27.md: в итоге и в списке персонажей сказано, что <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a>, <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a> и <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> «ушли на Землю» через портал. По словам авторов, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> их не пропустил: на Землю вышли только <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> и грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>.<\/span> <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=566\" target=\"_blank\" rel=\"noopener\">0:09:26 ↗<\/a> · <a href=\"#qa31-2\">к записи<\/a><\/span><\/span>", "world_html": ["Гибель медиума <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> — конец его ветви", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, изгнанный сын <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>", "Род Пэнисовых происходит от божественного семени <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> отошёл от дел, небом правит <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>; небеса не вступят в войну с демонами<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Боги не должны решать сюжет за героев\">14<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Боги не должны решать сюжет за героев<\/b> Авторы сказали, что сознательно не хотят, чтобы в глобальном сюжете ПЧК боги приходили и всё решали за героев. Богов не стоит считать безусловно добрыми. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3056\" target=\"_blank\" rel=\"noopener\">0:50:56 ↗<\/a> · <a href=\"#qa27-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Иерархия богов устроена как корпорация\">29<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Иерархия богов устроена как корпорация<\/b> Ранги богов авторы описали как корпорацию. Генеральный директор — верховный бог, сейчас это <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Совет богов — совет директоров. Дальше идут главы отделов, а клерки — праведники. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6764\" target=\"_blank\" rel=\"noopener\">1:52:44 ↗<\/a> · <a href=\"#qa27-30\">к записи<\/a><\/span><\/span>", "У героев на Земле меч <a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>, колокольчик бога Солнца, скрижаль для вызова <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> и грифон", "Боги устраивают бедствия на Земле ради молитв (саранча на <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>)<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Тезисы доклада Венеры: «людям следует страдать, но не вымирать»\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Тезисы доклада Венеры: «людям следует страдать, но не вымирать»<\/b> Авторы зачитали заготовленные тезисы доклада <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, который герои могли услышать. Чем больше люди страдают, тем больше молятся, а сытые забывают богов. Нужен баланс: людям следует «ощущать лёгкий дискомфорт», но не вымирать. Допустимы контролируемые кары вроде саранчи, их в документах называют «приглашением больших кузнечиков». Праведники перед реинкарнацией не должны ничего помнить. Храмы в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> потеряны, но индекс страха высок и молитв больше. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3319\" target=\"_blank\" rel=\"noopener\">0:55:19 ↗<\/a> · <a href=\"#qa27-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Проклятия «добрых» богов множат страдания ради молитв\">41<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Проклятия «добрых» богов множат страдания ради молитв<\/b> От проклятий светлых богов сильнее страдают невиновные, потому что богам выгодны страдания: чем их больше, тем больше молитв. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1677\" target=\"_blank\" rel=\"noopener\">0:27:57 ↗<\/a> · <a href=\"#qa38-10\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "0:01:05–0:03:13", "sec": null, "html": "Пересказ всей истории <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>. Он владел каретной мастерской в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> и был медиумом. Во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> разбил амфору-«пустышку» (#4), в адском поезде предал друзей и сбежал с кристаллом (#6). Взорвал демонический алтарь <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a>, где кристалл врос ему в ладонь (#10), украл большой кристалл Адского вокзала (#17) и открыл портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> через богиню (#25)."}, {"t": "0:06:21", "sec": 381, "html": "Задача: <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесная канцелярия<\/a> (здание в форме сердца) — встретиться с верховным богом и найти способ бороться с демонами.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Небесная канцелярия как «рельсы»: бухгалтерию и опенспейс можно было посетить\">12<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Небесная канцелярия как «рельсы»: бухгалтерию и опенспейс можно было посетить<\/b> Авторы объяснили: рай сделали корпорацией, чтобы новый сеттинг был понятнее. Мастер вёл игроков по отделам, как по рельсам, потому что так было проще подать много информации. С рельсов можно было сойти: пойти к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>, на Совет богов, в бухгалтерию или опенспейс. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> не ограничен канцелярией, в нём почти бесконечно много «скал» и отделов. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2778\" target=\"_blank\" rel=\"noopener\">0:46:18 ↗<\/a> · <a href=\"#qa27-11\">к записи<\/a><\/span><\/span>"}, {"t": "0:06:21–0:12:45", "sec": null, "html": "Представления. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> надеется на бога Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; кристалл в руке его убивает, и следующая телепортация может стать последней. <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a> уволен из Департамента любви за «нетрадиционные пары» («ворону и эльфийку», «гномиху, писаря и козу»). <a class=\"ref\" href=\"/c/stella-artua/\">Стеллу Артуа<\/a> за самовольный уход с поста охраны канцелярии отправили в отпуск на дальнее облако. <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректусу<\/a> поклоняются семь орков и гоблин, и нашествие демонов для него — шанс продвинуться в пантеоне.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Купидона уволили за хулиганство: он хотел выделяться\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Купидона уволили за хулиганство: он хотел выделяться<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a> по задумке сводил нетрадиционные пары из хулиганства: он хотел быть «нестандартным» и стрелял в кого хотел, за что его и наказали увольнением. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1011\" target=\"_blank\" rel=\"noopener\">0:16:51 ↗<\/a> · <a href=\"#qa27-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему кристалл врос в руку Пахома и почему убивал его\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему кристалл врос в руку Пахома и почему убивал его<\/b> <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь, когда <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> совершил злой поступок: телепортировался из адского поезда, предав друзей. Тёмный <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристалл<\/a> «почувствовал своего» и вступил с ним в симбиоз. В аду кристалл был силён и смог перенести Пахома в другой мир. На Земле и на небесах он ослаб, а раз Пахом остался добрым, кристалл высасывал из него силы. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4648\" target=\"_blank\" rel=\"noopener\">1:17:28 ↗<\/a> · <a href=\"#qa27-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Розовый камень Полуэректуса — отсылка к Синь-камню\">28<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Розовый камень Полуэректуса — отсылка к Синь-камню<\/b> Авторы сказали, что прообраз розового камня бога <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректуса<\/a> — Синь-камень на Плещеевом озере, языческое место загадывания желаний. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6764\" target=\"_blank\" rel=\"noopener\">1:52:44 ↗<\/a> · <a href=\"#qa27-29\">к записи<\/a><\/span><\/span>"}, {"t": "0:13:50–0:21:13", "sec": null, "html": "На ресепшене висит «индекс любви» на максимуме. Администратор Адель (праведница, убитая в 17 лет) под «зоной правды» Стеллы признаётся: <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> на пенсии, верховная богиня теперь <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, она на Совете богов. Бывшая коллега Стеллы, валькирия, стыдит её. Отряд выдаёт себя за «божественных сопровождающих» двух праведников — <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>."}, {"t": "0:22:16–0:25:24", "sec": null, "html": "Турникет чистой энергии ранит <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> из-за тёмного кристалла. Валькирия-охранница находит источник тьмы и предлагает отрубить руку, но Пахом очаровывает её. От неё он узнаёт: <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> потерял множество храмов Солнца на Земле, потому что «его главный адепт присягнул дьяволу», утратил авторитет и отошёл от дел. В Совет богов входят Морадин, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, Зевс, <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> и другие.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Валькирия у турникета предлагала спасти Пахома, отрубив руку\">6<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Валькирия у турникета предлагала спасти Пахома, отрубив руку<\/b> Авторы зачитали реплику валькирии-охранницы: она предлагала отсечь <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> руку с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллом<\/a>, остановить кровь и исцелить его. Это была прямая подсказка, как выжить. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> отказался, потому что везде искал подвох и считал кристалл способом сбежать в критический момент. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1739\" target=\"_blank\" rel=\"noopener\">0:28:59 ↗<\/a> · <a href=\"#qa27-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Две ветки сцены с отрубанием руки: подруга вылечила бы, враг унёс бы руку Венере\">8<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Две ветки сцены с отрубанием руки: подруга вылечила бы, враг унёс бы руку Венере<\/b> Авторы описали сценарий. Если бы валькирия была <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> врагом, она силой отрубила бы руку и отнесла её на анализ в кабинет <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> с артефактами, и мог начаться бой. Раз она стала подругой (Пахом её очаровал), она отрубила бы руку, оставила бы её Пахому с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллом<\/a> и полностью вылечила бы его. Эту головоломку не прошли. В подкасте эту валькирию назвали Адель, хотя в выпуске Адель — администратор ресепшена. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2012\" target=\"_blank\" rel=\"noopener\">0:33:32 ↗<\/a> · <a href=\"#qa27-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: «Главный адепт Гелиоса, присягнувший дьяволу» — лорд Властон, а не Сфинктерион\">10<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>«Главный адепт Гелиоса, присягнувший дьяволу» — лорд Властон, а не Сфинктерион<\/b> На вопрос, кто этот адепт, авторы ответили: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Там культ Солнца был популярной, а одно время и государственной религией, и жрецы под влиянием Властона отвернулись от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>. Из-за этого предательства Гелиос потерял множество храмов и впал в «божественную депрессию». <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep27.md (раздел «Персонажи и NPC», «Упоминаются», и раздел связей про <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>) главный адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, присягнувший дьяволу, назван <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>. По словам авторов, это лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>.<\/span> <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2443\" target=\"_blank\" rel=\"noopener\">0:40:43 ↗<\/a> · <a href=\"#qa27-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Морадин в первом выпуске, возможно, был ошибкой\">22<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Морадин в первом выпуске, возможно, был ошибкой<\/b> Авторы сказали, что Морадин — чисто днд-шный бог и упоминать его в первом выпуске (<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> — жрица Морадина), возможно, было ошибкой: тогда они ещё не разобрались, как устроить пантеон. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4583\" target=\"_blank\" rel=\"noopener\">1:16:23 ↗<\/a> · <a href=\"#qa27-21\">к записи<\/a><\/span><\/span>"}, {"t": "0:27:30–0:33:46", "sec": null, "html": "В отделе кадров три слепые мойры, Крис, Милиция и Стана, ищут «праведников» в картотеке судьбы. Стелла находит карточку <a class=\"ref\" href=\"/c/savl/\">Савла Пэнисова<\/a>: «умер в выгребной (в субтитрах — «грибной») яме, пытаясь спасти сотни людей». Отряд подделывает пять бланков: все якобы погибли, спасая котят из деревенского унитаза.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Персонажи из прошлых выпусков намеренно не влияют на сюжет\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Персонажи из прошлых выпусков намеренно не влияют на сюжет<\/b> Авторы объяснили, что карточка <a class=\"ref\" href=\"/c/savl/\">Савла Пэнисова<\/a> в картотеке была пасхалкой для зрителей. Персонажи, которые связаны с лором и прошлыми выпусками (Савл, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и др.), специально не появлялись в раю, чтобы не влиять на сюжет отдельного приключения. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1500\" target=\"_blank\" rel=\"noopener\">0:25:00 ↗<\/a> · <a href=\"#qa27-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Савла можно было найти в райском туалете\">18<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Савла можно было найти в райском туалете<\/b> Авторы признались, что хотели сделать <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> союзником или проводником в раю: он «мигрирующий персонаж». Встретить его можно было в туалете на юго-востоке карты. Туалет для праведников объяснили так: в раю они должны получать удовольствие. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3705\" target=\"_blank\" rel=\"noopener\">1:01:45 ↗<\/a> · <a href=\"#qa27-17\">к записи<\/a><\/span><\/span>"}, {"t": "0:34:50–0:46:24", "sec": null, "html": "Мойры раскрывают обман. Крис изгоняет <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> в межмирье, Милиция опутывает отряд паутиной, Стана бьёт огненными стрелами. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> усыпляет Крис песней, и Пахом возвращается. <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> режет паутину руками-скальпелями и крадёт у спящей Крис клубок судьбы. Стелла «карой Фемиды» размазывает Милицию по стене.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Мойры не преследовали героев по решению мастера\">4<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Мойры не преследовали героев по решению мастера<\/b> На вопрос, почему мойры не подняли тревогу после боя, ответили так: мастер сам решает, насколько враждебны NPC, а бесконечным боем с мастерскими персонажами игроков душить нельзя. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1563\" target=\"_blank\" rel=\"noopener\">0:26:03 ↗<\/a> · <a href=\"#qa27-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Все три мойры живы\">19<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Все три мойры живы<\/b> Авторы уточнили: когда игроки сказали «одну убили», мастер ответил «всё так» в смысле, что герои применили насилие вместо мирного пути. Мойры плетут судьбы, с ними ничего не сделаешь, и все трое живы, в том числе Милиция. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4233\" target=\"_blank\" rel=\"noopener\">1:10:33 ↗<\/a> · <a href=\"#qa27-18\">к записи<\/a><\/span><\/span>"}, {"t": "0:46:24–0:49:34", "sec": null, "html": "Стана под угрозой ставит печати на поддельные бланки и после «пяти причин праведности» (песню <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> подхватывает <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a>) даёт испытательный срок. Нужно выполнить два задания из трёх со средней оценкой не ниже 4,7 «сердечка», и тогда будет собеседование с <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a>."}, {"t": "0:50:37–0:57:59", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> чинит печатный станок в пиар-отделе и находит зажёванный лист: «план получения килосвета на III квартал». Нашествие саранчи на поля <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> за «2 килосвета» поднимет страдания на 1% и молитвы на 10% («называть не саранчой, а приглашением больших кузнечиков»). В мусорке лежит листовка <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> с номером «7735, добавочный…». Спор «лебедь или бобёр как символ любви» приносит пятёрку.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Гелиос не знал о «концепции страданий» пиар-отдела\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Гелиос не знал о «концепции страданий» пиар-отдела<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> не знал о плане пиар-отдела. Отделы, пиар и перестройка неба по образцу корпорации появились уже при <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>. При Гелиосе были пиры с нимфами, а праведники получали все привилегии небесного мира. Лист из принтера мог бы помочь убедить Гелиоса. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2271\" target=\"_blank\" rel=\"noopener\">0:37:51 ↗<\/a> · <a href=\"#qa27-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Тезисы доклада Венеры: «людям следует страдать, но не вымирать»\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Тезисы доклада Венеры: «людям следует страдать, но не вымирать»<\/b> Авторы зачитали заготовленные тезисы доклада <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, который герои могли услышать. Чем больше люди страдают, тем больше молятся, а сытые забывают богов. Нужен баланс: людям следует «ощущать лёгкий дискомфорт», но не вымирать. Допустимы контролируемые кары вроде саранчи, их в документах называют «приглашением больших кузнечиков». Праведники перед реинкарнацией не должны ничего помнить. Храмы в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> потеряны, но индекс страха высок и молитв больше. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3319\" target=\"_blank\" rel=\"noopener\">0:55:19 ↗<\/a> · <a href=\"#qa27-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Проклятия «добрых» богов множат страдания ради молитв\">41<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Проклятия «добрых» богов множат страдания ради молитв<\/b> От проклятий светлых богов сильнее страдают невиновные, потому что богам выгодны страдания: чем их больше, тем больше молитв. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1677\" target=\"_blank\" rel=\"noopener\">0:27:57 ↗<\/a> · <a href=\"#qa38-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:59:01–1:08:28", "sec": null, "html": "В райском саду праведник Шон мечтает умереть навсегда. На небесах отменили привилегии, праведники стали слугами с рейтингом, а за низкий рейтинг реинкарнируют в слизня или камень. Обиженный <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> убивает его с разбега, и Шон рассыпается искрами.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реинкарнация праведников: высокий балл даёт новую жизнь человеком со стёртой памятью\">13<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реинкарнация праведников: высокий балл даёт новую жизнь человеком со стёртой памятью<\/b> По новым правилам праведник проводит какое-то время в небесном мире. Если он набирает хороший балл, его могут реинкарнировать человеком, но память полностью стирают. По законам неба никто не может вернуться на Землю, зная тайны богов. Поэтому авторы назвали <a class=\"ref\" href=\"/c/venera/\">Венеру<\/a> не злой, а «законной» и нейтральной. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2928\" target=\"_blank\" rel=\"noopener\">0:48:48 ↗<\/a> · <a href=\"#qa27-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реинкарнации: у души не больше 12 жизней, Буцефалос — прошлая жизнь Лёши\">34<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реинкарнации: у души не больше 12 жизней, Буцефалос — прошлая жизнь Лёши<\/b> Душа вечна, но проходит не больше двенадцати реинкарнаций; при каждой ей стирают память (как в вып. 27). Божественным считается тело: полубожественное тело <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a> умеет вспоминать прошлые жизни и чуть расщеплять душу. Под давлением экстремальных событий оно «защитилось», вызвав из памяти самое сильное своё воплощение — кентавра <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a>. Таких воплощений в Лёше может быть не больше двенадцати; по сути он «мультиклассовый» персонаж. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2589\" target=\"_blank\" rel=\"noopener\">0:43:09 ↗<\/a> · <a href=\"#qa29-7\">к записи<\/a><\/span><\/span>"}, {"t": "1:07:24–1:17:58", "sec": null, "html": "Бутыль для кулера держит гигантский клещ. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> «продаёт» ему руки <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректуса<\/a>, превращённые в чупа-чупсы, клещ присасывается и пьёт божественную энергию. Стелла убивает его мечом «божественной кары»."}, {"t": "1:18:02–1:21:14", "sec": null, "html": "В отделе реинкарнации отряд танцует и поёт ради пятёрки. Лист заданий загорается: допуск к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a> получен."}, {"t": "1:21:14–1:26:25", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> отделяется от группы и идёт к грифону. Это конь <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, он тоскует по былым пирам и жаждет битвы. Телепатическая переписка с грифоном: вызвать Гелиоса можно по старому номеру 7735 с добавочным, а добавочный может знать <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a>. Пахом скрытой заявкой просит грифона отвлечь остальных катанием.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Характер и мотивация грифона Андрея\">43<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Характер и мотивация грифона Андрея<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признал, что мотивация <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> у него самая непроработанная. Грифон считает себя божественным созданием, хотя на деле он зверь (божественен единорог). Он помогал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> в небесной канцелярии и спустился с ней на землю по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> как скакун воина света. Сначала служба ему не нравилась, но, видя, что у Талалы, пусть и криво, всё получается, он к ней привязался. По мнению BRB, Андрей должен смотреть на земных свысока и нести «сексистские» порядки Гелиоса, которому служил. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3171\" target=\"_blank\" rel=\"noopener\">0:52:51 ↗<\/a> · <a href=\"#qa41-42-10\">к записи<\/a><\/span><\/span>"}, {"t": "1:28:31–1:33:53", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> приносит эль спивающемуся богу гномов Дон-Дону из «департамента расовых меньшинств» и убеждает его помочь. <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> рассказывает: храмы <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> забрали при помощи «стеклянных колб, которые оскверняют» (связь с #24), а беды Гелиоса начались, когда он сам отправил в ад собственного сына. Добавочный номер — 01. Стелла «поиском предмета» находит у Дон-Дона магическую скрижаль.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь\">1<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь<\/b> Демоны входят в святые места светлого божества, только осквернив их, поэтому и осквернили храм Солнца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. В <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> демона не пустит тот же барьер. Если осквернить храм и поместить туда кристалл, тот уже не перенесёт в Небесный мир: не будет божественной эссенции. Переноситься туда могут только боги и носители божественной крови, остальным нужны особые обстоятельства. Об этом обещаны будущие приключения. <span class=\"note\">Подкаст по #25 · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4309\" target=\"_blank\" rel=\"noopener\">1:11:49 ↗<\/a> · <a href=\"#qa25-27\">к записи<\/a><\/span><\/span>"}, {"t": "1:33:53–1:36:02", "sec": null, "html": "Главное откровение. Скрижаль принадлежала сыну <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a>. Гелиос запретил богам связи со смертными, а Брэндон возлёг с полурослицей. Его тело испепелили, а дух навечно заточили в аду. Ребёнку полурослицы дали «позорную бедняцкую фамилию» Пэнисов, матери стёрли память. На Земле ходят легенды об избранном, рождённом от божественного семени.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему полубоги под запретом и откуда «последний полубог»\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему полубоги под запретом и откуда «последний полубог»<\/b> Раньше связи богов со смертными были разрешены, но боги злоупотребляли ими: спускались на землю в образе животных и оплодотворяли женщин. Полубогов с доступом в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> стало так много, что это угрожало его безопасности и расходовало энергию. Поэтому <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> ввёл запрет, а полубог из пиар-отдела назвался последним. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 ↗<\/a> · <a href=\"#qa27-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: В скрижали Брэндона — история его любви и связь с елью Вёрджинвальда\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>В скрижали Брэндона — история его любви и связь с елью Вёрджинвальда<\/b> Авторы сказали, что в магической скрижали <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> есть фотографии, как развивалась история его любви к полурослице. Они намекнули на связь <a class=\"ref\" href=\"/a/magicheskaya-skrizhal-brendona/\">Брэндона<\/a> со священной елью <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> из выпуска <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">15<\/a>, свет которой уничтожает тёмные силы. Матери ребёнка стёрли память, а ребёнка забрали. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6932\" target=\"_blank\" rel=\"noopener\">1:55:32 ↗<\/a> · <a href=\"#qa27-31\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Гелиос наказал сына так жестоко\">40<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Гелиос наказал сына так жестоко<\/b> У богов действовал закон, запрещающий связи с земными существами, чтобы не рождались полубоги. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> его нарушил, и <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> был обязан показательно наказать собственного сына, чтобы не потерять авторитет перед другими богами. У Гелиоса есть и другие дети — как минимум известна одна дочь. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1614\" target=\"_blank\" rel=\"noopener\">0:26:54 ↗<\/a> · <a href=\"#qa38-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон строил замок Вёрджинвальда и привёз райскую ель\">42<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон строил замок Вёрджинвальда и привёз райскую ель<\/b> На фотографиях скрижали, которые в выпуске №<a href=\"/ep/27/\" title=\"Достучаться до небес\">27<\/a> рассматривали за кадром, видно, как <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> возводил укрепления в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a>: он был одним из строителей замка Вёрджинвальда и привёз туда райскую ель, уничтожившую демона в №15 (о райских елях говорилось в №37). Он защищал простых людей и служил им. Имя «<a class=\"ref\" href=\"/a/magicheskaya-skrizhal-brendona/\">Брэндон<\/a>» — отсылка к «Беверли-Хиллз»: мажор, сын Верховного бога. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=5171\" target=\"_blank\" rel=\"noopener\">1:26:11 ↗<\/a> · <a href=\"#qa38-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него\">45<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него<\/b> Запрет на любовь и потомство богов от земных существ введён не менее 50 лет назад: тогда <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сошёлся с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, и это последнее известное нарушение. Все полубоги родились до запрета; последним «разрешённым» полубогом был сотрудник пиар-отдела из <a href=\"/ep/27/\" title=\"Достучаться до небес\">27-го<\/a> выпуска по имени Вильхем. Значит, <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидии<\/a> больше 50 лет, возможно 70–100: полубоги живут долго и сохраняют молодость. Авторы допустили, что существует ещё неизвестный полубог, рождённый уже при запрете. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1651\" target=\"_blank\" rel=\"noopener\">0:27:31 ↗<\/a> · <a href=\"#qa51-52-7\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:02–1:43:25", "sec": null, "html": "Видеозвонок <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a>, при нём полуголые нимфы. Он сомневается в своих методах и доверяет «эффективной» <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>, своей дочери. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> убеждает его (<a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> тратит на бросок значение 19 из клубка судьбы). Гелиос не пойдёт против Венеры, но поможет людям: «<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>» — это Брэндон, он не может попасть на небо без божественной оболочки, а сражаться с ним нужно на Земле. Венера на войну с демонами не пойдёт: небо защищено божественным барьером. Гелиос передаёт героям двуручный меч <a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>, колокольчик бога Солнца и грифона, но пропажу быстро заметят.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь\">1<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь<\/b> Демоны входят в святые места светлого божества, только осквернив их, поэтому и осквернили храм Солнца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. В <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> демона не пустит тот же барьер. Если осквернить храм и поместить туда кристалл, тот уже не перенесёт в Небесный мир: не будет божественной эссенции. Переноситься туда могут только боги и носители божественной крови, остальным нужны особые обстоятельства. Об этом обещаны будущие приключения. <span class=\"note\">Подкаст по #25 · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4309\" target=\"_blank\" rel=\"noopener\">1:11:49 ↗<\/a> · <a href=\"#qa25-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Гелиос не знал о «концепции страданий» пиар-отдела\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Гелиос не знал о «концепции страданий» пиар-отдела<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> не знал о плане пиар-отдела. Отделы, пиар и перестройка неба по образцу корпорации появились уже при <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>. При Гелиосе были пиры с нимфами, а праведники получали все привилегии небесного мира. Лист из принтера мог бы помочь убедить Гелиоса. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2271\" target=\"_blank\" rel=\"noopener\">0:37:51 ↗<\/a> · <a href=\"#qa27-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Гелиоса можно было уговорить пойти с героями, но не по телефону\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Гелиоса можно было уговорить пойти с героями, но не по телефону<\/b> Авторы сказали, что настроить <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> против <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> было можно, если бы герои сделали что-то изобретательное. Но для этого надо было идти к нему лично, а не говорить по видеосвязи. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2520\" target=\"_blank\" rel=\"noopener\">0:42:00 ↗<\/a> · <a href=\"#qa27-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реликвии хранились у Накопителя Любви, кража включила сигнализацию\">16<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реликвии хранились у Накопителя Любви, кража включила сигнализацию<\/b> Меч, <a class=\"ref\" href=\"/a/kolokolchik-boga-solnca/\">колокольчик<\/a> и другие артефакты хранились в помещении с <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопителем Любви<\/a>, до которого герои не дошли. Выдать их могли только <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> или <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Когда артефакт забрали, у Венеры сработала сигнализация, и она пришла наказывать «воришек» за кражу и незаконное проникновение. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3256\" target=\"_blank\" rel=\"noopener\">0:54:16 ↗<\/a> · <a href=\"#qa27-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Схема перемещений между мирами\">39<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Схема перемещений между мирами<\/b> Селезнёв показал схему миров, нарисованную Катей Гандрабурой. Демоны ходят между <a class=\"ref\" href=\"/place/ad/\">адом<\/a> и Землёй, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесные<\/a> существа — между небом и Землёй. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, переставший быть божеством, может попасть в ад, но путь наверх ему закрыт. Только люди с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллами<\/a> телепортации, как <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, могут попасть и в ад, и на небо. Как созданы очень прочные границы между мирами, пока не раскрывают. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=3825\" target=\"_blank\" rel=\"noopener\">1:03:45 ↗<\/a> · <a href=\"#qa31-23\">к записи<\/a><\/span><\/span>"}, {"t": "1:43:25–1:47:37", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с мечом, колокольчиком и грифоном летит к порталу. Остальные решают идти к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a> и звонят ей."}, {"t": "1:47:37–1:49:43", "sec": null, "html": "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> с валькириями выходит навстречу: за кражу реликвий и знание тайн богов всех ждёт дезинтеграция. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> телекинезом притягивает отряд и произносит «<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, отнеси меня в портал». Все оказываются у портала, а Пахом тлеет, как сигарета, и рассыпается пеплом («Вы меня заебали»). Остальные уходят через портал на Землю, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> последней.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: BRB знал, что Пахома переживёт только одно применение кристалла\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>BRB знал, что Пахома переживёт только одно применение кристалла<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что перед игрой ему несколько раз сказали: сил у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> хватит на одно применение <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристалла<\/a>, после которого он почти наверняка умрёт. Поэтому он решил закончить жизнь персонажа с пользой. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1709\" target=\"_blank\" rel=\"noopener\">0:28:29 ↗<\/a> · <a href=\"#qa27-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Шансы Пахома выжить: остаться на небе или переубедить Венеру\">15<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Шансы Пахома выжить: остаться на небе или переубедить Венеру<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> мог не погибнуть: например, остаться где-то в небесном мире. Против дезинтеграции <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> был спасбросок сложности около 20. Венера всё равно наказала бы героев, разговор мог продолжиться разве что после верных слов и критического успеха убеждения. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3183\" target=\"_blank\" rel=\"noopener\">0:53:03 ↗<\/a> · <a href=\"#qa27-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реликвии хранились у Накопителя Любви, кража включила сигнализацию\">16<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реликвии хранились у Накопителя Любви, кража включила сигнализацию<\/b> Меч, <a class=\"ref\" href=\"/a/kolokolchik-boga-solnca/\">колокольчик<\/a> и другие артефакты хранились в помещении с <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопителем Любви<\/a>, до которого герои не дошли. Выдать их могли только <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> или <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Когда артефакт забрали, у Венеры сработала сигнализация, и она пришла наказывать «воришек» за кражу и незаконное проникновение. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3256\" target=\"_blank\" rel=\"noopener\">0:54:16 ↗<\/a> · <a href=\"#qa27-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю\">35<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> не выпустил спутников <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> из <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a> через портал: разрешения у них не было. Разрешение на переход из всех небесных существ было только у грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a>, посланного богом Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep27.md: в итоге и в списке персонажей сказано, что <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a>, <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a> и <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> «ушли на Землю» через портал. По словам авторов, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> их не пропустил: на Землю вышли только <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> и грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>.<\/span> <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=566\" target=\"_blank\" rel=\"noopener\">0:09:26 ↗<\/a> · <a href=\"#qa31-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Низшие небожители ходят на Землю только с разрешения небесной канцелярии\">36<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Низшие небожители ходят на Землю только с разрешения небесной канцелярии<\/b> <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесные<\/a> существа низшего происхождения могут перейти в <a class=\"ref\" href=\"/place/zemnoy-mir/\">земной мир<\/a> только с разрешения канцелярии: небо устроено как корпорация. У <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> для этого был <a class=\"ref\" href=\"/a/angelskiy-pasport-angelina/\">ангельский<\/a> паспорт, <a class=\"ref\" href=\"/c/grifon-andrey/\">грифон<\/a> пришёл по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, а валькирии полетели за героями по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=631\" target=\"_blank\" rel=\"noopener\">0:10:31 ↗<\/a> · <a href=\"#qa31-3\">к записи<\/a><\/span><\/span>"}, {"t": "1:50:38", "sec": 6638, "html": "Монеты — 60 000 ₽ на благотворительность. Эпилог: «<a class=\"ref\" href=\"/c/medium-pahom/\">Медиум Пахом<\/a> родился на земле, сбежал из ада и погиб на небесах. Искупив своё предательство, он добыл мощное оружие, которое поможет жителям земного мира одолеть демонов».<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Монеты раздавали щедро не из-за запланированного боя\">25<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Монеты раздавали щедро не из-за запланированного боя<\/b> На вопрос, не давал ли мастер монеты легко перед запланированным сложным боем с <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a>, ответили: это монеты вдохновения, их не жалко за удачные ходы и шутки. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6213\" target=\"_blank\" rel=\"noopener\">1:43:33 ↗<\/a> · <a href=\"#qa27-25\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:17:00", "sec": 1020}, {"t": "0:25:42", "sec": 1542}, {"t": "0:30:57", "sec": 1857}, {"t": "0:33:45", "sec": 2025}, {"t": "0:52:53", "sec": 3173}, {"t": "1:21:56", "sec": 4916}, {"t": "1:34:30", "sec": 5670}, {"t": "1:36:22", "sec": 5782}, {"t": "1:43:50", "sec": 6230}, {"t": "1:48:24", "sec": 6504}], "coins": {"ep": "27", "events": [{"t": "0:56:55", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Придумал в пиар-отделе небесной канцелярии убедительный (и смешной) маркетинговый аргумент в споре «лебедь против бобра».", "result": null, "sec": 3415, "who_url": "/c/medium-pahom/", "reason_html": "Придумал в пиар-отделе небесной канцелярии убедительный (и смешной) маркетинговый аргумент в споре «лебедь против бобра»."}, {"t": "1:03:05", "kind": "earn", "who": "Санта Тиндерман", "actor": "Дэни Барнс", "to": null, "reason": "За ярки ак игровое событие."}, "cast": [{"name": "Пахом", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, медиум", "role": "", "fate": "погиб — рассыпался пеплом после последней телепортации", "id": "Пахом", "url": "/c/medium-pahom/", "img": "img/chars/pahom.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "06", "label": "6", "title": "Адский поезд"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "25", "label": "25", "title": "Остров соблазна"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: BRB знал, что Пахома переживёт только одно применение кристалла\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>BRB знал, что Пахома переживёт только одно применение кристалла<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что перед игрой ему несколько раз сказали: сил у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> хватит на одно применение <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристалла<\/a>, после которого он почти наверняка умрёт. Поэтому он решил закончить жизнь персонажа с пользой. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1709\" target=\"_blank\" rel=\"noopener\">0:28:29 ↗<\/a> · <a href=\"#qa27-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Валькирия у турникета предлагала спасти Пахома, отрубив руку\">6<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Валькирия у турникета предлагала спасти Пахома, отрубив руку<\/b> Авторы зачитали реплику валькирии-охранницы: она предлагала отсечь <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> руку с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллом<\/a>, остановить кровь и исцелить его. Это была прямая подсказка, как выжить. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> отказался, потому что везде искал подвох и считал кристалл способом сбежать в критический момент. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1739\" target=\"_blank\" rel=\"noopener\">0:28:59 ↗<\/a> · <a href=\"#qa27-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Шансы Пахома выжить: остаться на небе или переубедить Венеру\">15<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Шансы Пахома выжить: остаться на небе или переубедить Венеру<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> мог не погибнуть: например, остаться где-то в небесном мире. Против дезинтеграции <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> был спасбросок сложности около 20. Венера всё равно наказала бы героев, разговор мог продолжиться разве что после верных слов и критического успеха убеждения. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3183\" target=\"_blank\" rel=\"noopener\">0:53:03 ↗<\/a> · <a href=\"#qa27-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему кристалл врос в руку Пахома и почему убивал его\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему кристалл врос в руку Пахома и почему убивал его<\/b> <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь, когда <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> совершил злой поступок: телепортировался из адского поезда, предав друзей. Тёмный <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристалл<\/a> «почувствовал своего» и вступил с ним в симбиоз. В аду кристалл был алькирия-паладин с наложением рук. <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> как малый бог силы не умел лечить, он только дарует силу. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1948\" target=\"_blank\" rel=\"noopener\">0:32:28 ↗<\/a> · <a href=\"#qa27-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Розовый камень Полуэректуса — отсылка к Синь-камню\">28<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Розовый камень Полуэректуса — отсылка к Синь-камню<\/b> Авторы сказали, что прообраз розового камня бога <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректуса<\/a> — Синь-камень на Плещеевом озере, языческое место загадывания желаний. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6764\" target=\"_blank\" rel=\"noopener\">1:52:44 ↗<\/a> · <a href=\"#qa27-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю\">35<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> не выпустил спутников <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> из <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a> через портал: разрешения у них не было. Разрешение на переход из всех небесных существ было только у грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a>, посланного богом Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep27.md: в итоге и в списке персонажей сказано, что <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a>, <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a> и <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> «ушли на Землю» через портал. По словам авторов, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> их не пропустил: на Землю вышли только <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> и грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>.<\/span> <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=566\" target=\"_blank\" rel=\"noopener\">0:09:26 ↗<\/a> · <a href=\"#qa31-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Полуэректус на Земле существует только как розовый камень\">37<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Полуэректус на Земле существует только как розовый камень<\/b> Бог розового камня не может появиться на Земле в своём телесном облике, только как сам розовый камень. Этот камень лежит на берегу озера в Варварском лесу, и ему поклоняются семь орков и один гоблин. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=631\" target=\"_blank\" rel=\"noopener\">0:10:31 ↗<\/a> · <a href=\"#qa31-4\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Гелиос", "actor": "", "actor_url": null, "race": "", "role": "бог Солнца, бывший верховный бог, отец Брэндона и Венеры", "fate": "на пенсии; передал героям оружие и грифона", "id": "Гелиус", "url": "/c/gelius/", "img": null, "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "51", "label": "51", "title": "Точка невозврата"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Гелиос не знал о «концепции страданий» пиар-отдела\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Гелиос не знал о «концепции страданий» пиар-отдела<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> не знал о плане пиар-отдела. Отделы, пиар и перестройка неба по образцу корпорации появились уже при <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>. При Гелиосе были пиры с нимфами, а праведники получали все привилегии небесного мира. Лист из принтера мог бы помочь убедить Гелиоса. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2271\" target=\"_blank\" rel=\"noopener\">0:37:51 ↗<\/a> · <a href=\"#qa27-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: «Главный адепт Гелиоса, присягнувший дьяволу» — лорд Властон, а не Сфинктерион\">10<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>«Главный адепт Гелиоса, присягнувший дьяволу» — лорд Властон, а не Сфинктерион<\/b> На вопрос, кто этот адепт, авторы ответили: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Там культ Солнца был популярной, а одно время и государственной религией, и жрецы под влиянием Властона отвернулись от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>. Из-за этого предательства Гелиос потерял множество храмов и впал в «божественную депрессию». <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep27.md (раздел «Персонажи и NPC», «Упоминаются», и раздел связей про <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>) главный адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, присягнувший дьяволу, назван <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>. По словам авторов, это лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>.<\/span> <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2443\" target=\"_blank\" rel=\"noopener\">0:40:43 ↗<\/a> · <a href=\"#qa27-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Гелиоса можно было уговорить пойти с героями, но не по телефону\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Гелиоса можно было уговорить пойти с героями, но не по телефону<\/b> Авторы сказали, что настроить <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> против <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> было можно, если бы герои сделали что-то изобретательное. Но для этого надо было идти к нему лично, а не говорить по видеосвязи. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2520\" target=\"_blank\" rel=\"noopener\">0:42:00 ↗<\/a> · <a href=\"#qa27-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Гелиос наказал сына так жестоко\">40<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Гелиос наказал сына так жестоко<\/b> У богов действовал закон, запрещающий связи с земными существами, чтобы не рождались полубоги. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> его нарушил, и <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> был обязан показательно наказать собственного сына, чтобы не потерять авторитет перед другими богами. У Гелиоса есть и другие дети — как минимум известна одна дочь. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1614\" target=\"_blank\" rel=\"noopener\">0:26:54 ↗<\/a> · <a href=\"#qa38-9\">к записи<\/a><\/span><\/span>"}, {"name": "Венера", "actor": "", "actor_url": null, "race": "", "role": "верховная богиня, дочь Гелиоса", "fate": "жива, враждебна героям", "id": "Венера", "url": "/c/venera/", "img": "img/chars/venera.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реинкарнация праведников: высокий балл даёт новую жизнь человеком со стёртой памятью\">13<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реинкарнация праведников: высокий балл даёт новую жизнь человеком со стёртой памятью<\/b> По новым правилам праведник проводит какое-то время в небесном мире. Если он набирает хороший балл, его могут реинкарнировать человеком, но память полностью стирают. По законам неба никто не может вернуться на Землю, зная тайны богов. Поэтому авторы назвали <a class=\"ref\" href=\"/c/venera/\">Венеру<\/a> не злой, а «законной» и нейтральной. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2928\" target=\"_blank\" rel=\"noopener\">0:48:48 ↗<\/a> · <a href=\"#qa27-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реликвии хранились у Накопителя Любви, кража включила сигнализацию\">16<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реликвии хранились у Накопителя Любви, кража включила сигнализацию<\/b> Меч, <a class=\"ref\" href=\"/a/kolokolchik-boga-solnca/\">колокольчик<\/a> и другие артефакты хранились в помещении с <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопителем Любви<\/a>, до которого герои не дошли. Выдать их могли только <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> или <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Когда артефакт забрали, у Венеры сработала сигнализация, и она пришла наказывать «воришек» за кражу и незаконное проникновение. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3256\" target=\"_blank\" rel=\"noopener\">0:54:16 ↗<\/a> · <a href=\"#qa27-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Тезисы доклада Венеры: «людям следует страдать, но не вымирать»\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Тезисы доклада Венеры: «людям следует страдать, но не вымирать»<\/b> Авторы зачитали заготовленные тезисы доклада <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, который герои могли услышать. Чем больше люди страдают, тем больше молятся, а сытые забывают богов. Нужен баланс: людям следует «ощущать лёгкий дискомфорт», но не вымирать. Допустимы контролируемые кары вроде саранчи, их в документах называют «приглашением больших кузнечиков». Праведники перед реинкарнацией не должны ничего помнить. Храмы в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> потеряны, но индекс страха высок и молитв больше. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3319\" target=\"_blank\" rel=\"noopener\">0:55:19 ↗<\/a> · <a href=\"#qa27-16\">к записи<\/a><\/span><\/span>"}, {"name": "Брэндон", "actor": "", "actor_url": null, "race": "", "role": "сын Гелиоса, изгнанный в ад, — Тёмный Властелин; предок рода Пэнисовых", "fate": "дух заточён в аду", "id": "Брэндон", "url": "/c/brendon-tyomnyy-vlastelin/", "img": "img/chars/tyomnyj-vlastelin.webp", "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "51", "label": "51", "title": "Точка невозврата"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: В скрижали Брэндона — история его любви и связь с елью Вёрджинвальда\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>В скрижали Брэндона — история его любви и связь с елью Вёрджинвальда<\/b> Авторы сказали, что в магической скрижали <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> есть фотографии, как развивалась история его любви к полурослице. Они намекнули на связь <a class=\"ref\" href=\"/a/magicheskaya-skrizhal-brendona/\">Брэндона<\/a> со священной елью <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> из выпуска <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">15<\/a>, свет которой уничтожает тёмные силы. Матери ребёнка стёрли память, а ребёнка забрали. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6932\" target=\"_blank\" rel=\"noopener\">1:55:32 ↗<\/a> · <a href=\"#qa27-31\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Схема перемещений между мирами\">39<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Схема перемещений между мирами<\/b> Селезнёв показал схему миров, нарисованную Катей Гандрабурой. Демоны ходят между <a class=\"ref\" href=\"/place/ad/\">адом<\/a> и Землёй, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесные<\/a> существа — между небом и Землёй. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, переставший быть божеством, может попасть в ад, но путь наверх ему закрыт. Только люди с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллами<\/a> телепортации, как <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, могут попасть и в ад, и на небо. Как созданы очень прочные границы между мирами, пока не раскрывают. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=3825\" target=\"_blank\" rel=\"noopener\">1:03:45 ↗<\/a> · <a href=\"#qa31-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон строил замок Вёрджинвальда и привёз райскую ель\">42<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон строил замок Вёрджинвальда и привёз райскую ель<\/b> На фотографиях скрижали, которые в выпуске №<a href=\"/ep/27/\" title=\"Достучаться до небес\">27<\/a> рассматривали за кадром, видно, как <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> возводил укрепления в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a>: он был одним из строителей замка Вёрджинвальда и привёз туда райскую ель, уничтожившую демона в №15 (о райских елях говорилось в №37). Он защищал простых людей и служил им. Имя «<a class=\"ref\" href=\"/a/magicheskaya-skrizhal-brendona/\">Брэндон<\/a>» — отсылка к «Беверли-Хиллз»: мажор, сын Верховного бога. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=5171\" target=\"_blank\" rel=\"noopener\">1:26:11 ↗<\/a> · <a href=\"#qa38-21\">к записи<\/a><\/span><\/span>"}, {"name": "Дон-Дон", "actor": "", "actor_url": null, "race": "", "role": "бог гномов, департамент расовых меньшинств", "fate": "жив, отдал скрижаль", "id": "Дон-Дон", "url": "/c/dondon/", "img": null, "other": [{"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дон-Дон — гном-изобретатель, дослужившийся до бога\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дон-Дон — гном-изобретатель, дослужившийся до бога<\/b> Авторы объяснили, что имена богов брали из разных мифологий, чтобы их суть была понятна сразу (Зевс, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>). <a class=\"ref\" href=\"/c/dondon/\">Дон-Дона<\/a> они придумали сами: это гном из <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змия<\/a> Хрустального, который совершил столько легендарных изобретений, что достиг ранга богов, и несёт людям науку. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4473\" target=\"_blank\" rel=\"noopener\">1:14:33 ↗<\/a> · <a href=\"#qa27-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Автоматонов Дон-Дон создал, ещё когда был смертным изобретателем\">33<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Автоматонов Дон-Дон создал, ещё когда был смертным изобретателем<\/b> <a class=\"ref\" href=\"/a/umnye-avtomatony-dondona/\">Умные<\/a> автоматоны — разработка гнома Дон-Дона, но не божественное создание. Их сделали, когда <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> был ещё талантливым изобретателем, а не богом, которым он стал позже (отсылка к выпуску <a href=\"/ep/27/\" title=\"Достучаться до небес\">27<\/a>). <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=6862\" target=\"_blank\" rel=\"noopener\">1:54:22 ↗<\/a> · <a href=\"#qa28-26\">к записи<\/a><\/span><\/span>"}, {"name": "Грифон", "actor": "", "actor_url": null, "race": "", "role": "конь Гелиоса", "fate": "отдан героям", "id": "Андрей", "url": "/c/grifon-andrey/", "img": "img/chars/andrej.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Низшие небожители ходят на Землю только с разрешения небесной канцелярии\">36<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Низшие небожители ходят на Землю только с разрешения небесной канцелярии<\/b> <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесные<\/a> существа низшего происхождения могут перейти в <a class=\"ref\" href=\"/place/zemnoy-mir/\">земной мир<\/a> только с разрешения канцелярии: небо устроено как корпорация. У <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> для этого был <a class=\"ref\" href=\"/a/angelskiy-pasport-angelina/\">ангельский<\/a> паспорт, <a class=\"ref\" href=\"/c/grifon-andrey/\">грифон<\/a> пришёл по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, а валькирии полетели за героями по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=631\" target=\"_blank\" rel=\"noopener\">0:10:31 ↗<\/a> · <a href=\"#qa31-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"f
