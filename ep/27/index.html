n t-addition\" aria-expanded=\"false\" title=\"Дополнение: Характер и мотивация грифона Андрея\">43<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Характер и мотивация грифона Андрея<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признал, что мотивация <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> у него самая непроработанная. Грифон считает себя божественным созданием, хотя на деле он зверь (божественен единорог). Он помогал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> в небесной канцелярии и спустился с ней на землю по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> как скакун воина света. Сначала служба ему не нравилась, но, видя, что у Талалы, пусть и криво, всё получается, он к ней привязался. По мнению BRB, Андрей должен смотреть на земных свысока и нести «сексистские» порядки Гелиоса, которому служил. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3171\" target=\"_blank\" rel=\"noopener\">0:52:51 ↗<\/a> · <a href=\"#qa41-42-10\">к записи<\/a><\/span><\/span>"}, {"name": "Мойра Крис", "actor": "", "actor_url": null, "race": "", "role": "старшая слепая богиня судьбы, отдел кадров", "fate": "усыплена, лишилась клубка судьбы", "id": null, "url": null, "img": null, "other": []}, {"name": "Мойра Милиция", "actor": "", "actor_url": null, "race": "", "role": "средняя богиня судьбы", "fate": "тяжело ранена (возможно, погибла)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Все три мойры живы\">19<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Все три мойры живы<\/b> Авторы уточнили: когда игроки сказали «одну убили», мастер ответил «всё так» в смысле, что герои применили насилие вместо мирного пути. Мойры плетут судьбы, с ними ничего не сделаешь, и все трое живы, в том числе Милиция. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4233\" target=\"_blank\" rel=\"noopener\">1:10:33 ↗<\/a> · <a href=\"#qa27-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Имена мойр Милиция и Стана — от черногорских принцесс\">20<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Имена мойр Милиция и Стана — от черногорских принцесс<\/b> Селезнёв, который придумал имена мойр, объяснил: Милиция и Стана — черногорские принцессы, жёны великих князей Романовых, которые познакомили императрицу Александру Фёдоровну с Распутиным и так повлияли на судьбу страны. Происхождение имени Крис он не пояснил. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4367\" target=\"_blank\" rel=\"noopener\">1:12:47 ↗<\/a> · <a href=\"#qa27-19\">к записи<\/a><\/span><\/span>"}, {"name": "Мойра Стана", "actor": "", "actor_url": null, "race": "", "role": "младшая богиня судьбы", "fate": "жива, выдала допуск", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Имена мойр Милиция и Стана — от черногорских принцесс\">20<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Имена мойр Милиция и Стана — от черногорских принцесс<\/b> Селезнёв, который придумал имена мойр, объяснил: Милиция и Стана — черногорские принцессы, жёны великих князей Романовых, которые познакомили императрицу Александру Фёдоровну с Распутиным и так повлияли на судьбу страны. Происхождение имени Крис он не пояснил. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4367\" target=\"_blank\" rel=\"noopener\">1:12:47 ↗<\/a> · <a href=\"#qa27-19\">к записи<\/a><\/span><\/span>"}, {"name": "Адель", "actor": "", "actor_url": null, "race": "", "role": "праведница-администратор ресепшена", "fate": "жива", "id": "Адель", "url": "/c/adel/", "img": null, "other": []}, {"name": "Шон", "actor": "", "actor_url": null, "race": "", "role": "разочарованный праведник", "fate": "погиб окончательно (убит Полуэректусом)", "id": "Шон", "url": "/c/shon/", "img": null, "other": []}, {"name": "Гигантский клещ", "actor": "", "actor_url": null, "race": "", "role": "держал бутыль для кулера", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Савл Пэнисов", "actor": "", "actor_url": null, "race": "", "role": "праведник из картотеки", "fate": "погиб ранее — утонул в выгребной яме Храма Юмора, спасая сотни людей (#10); попал в рай как праведник", "id": "Савл", "url": "/c/savl/", "img": "img/chars/savl-penisov.webp", "other": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "14", "label": "14", "title": "Янус доставка"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Персонажи из прошлых выпусков намеренно не влияют на сюжет\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Персонажи из прошлых выпусков намеренно не влияют на сюжет<\/b> Авторы объяснили, что карточка <a class=\"ref\" href=\"/c/savl/\">Савла Пэнисова<\/a> в картотеке была пасхалкой для зрителей. Персонажи, которые связаны с лором и прошлыми выпусками (Савл, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и др.), специально не появлялись в раю, чтобы не влиять на сюжет отдельного приключения. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1500\" target=\"_blank\" rel=\"noopener\">0:25:00 ↗<\/a> · <a href=\"#qa27-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Савла можно было найти в райском туалете\">18<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Савла можно было найти в райском туалете<\/b> Авторы признались, что хотели сделать <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> союзником или проводником в раю: он «мигрирующий персонаж». Встретить его можно было в туалете на юго-востоке карты. Туалет для праведников объяснили так: в раю они должны получать удовольствие. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3705\" target=\"_blank\" rel=\"noopener\">1:01:45 ↗<\/a> · <a href=\"#qa27-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> разбил амфору во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "06", "label": "6", "title": "Адский поезд", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> предал друзей в адском поезде", "dir": "out", "color": "#7C5CD6"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> в <a class=\"ref\" href=\"/place/hram-yumora/\">Храме Юмора<\/a>; там же погиб <a class=\"ref\" href=\"/c/savl/\">Савл Пэнисов<\/a>, теперь праведник на небесах", "dir": "out", "color": "#7C5CD6"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл Адского вокзала", "dir": "out", "color": "#7C5CD6"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "Легенда об избранном от божественного семени; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, присягнувший дьяволу; осквернение храмов Солнца колбами; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "25", "label": "25", "title": "Остров соблазна", "note_html": "Портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> открыт на острове Соблазна", "dir": "out", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Гибель <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> на небесах, дары <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "38", "label": "38", "title": "Возлюбленная", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> попадает на небеса и получает дары бога Солнца", "dir": "back", "color": "#7C5CD6"}, {"key": "42", "label": "42", "title": "Чудная Долина", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> в небесном мире", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Я боевой ангел, а не какая-то вахтёрша» — <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a>.", "«Рекомендуем называть это не нашествием саранчи, а приглашением больших кузнечиков» — пиар-отдел небес.", "«Ему дали позорную бедняцкую фамилию… Пэнисов?» — «Ой, откуда ты знаешь?»", "«Ты всегда разговариваешь с Александром Бригановым. Это я тебе говорю как <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>».", "«<a class=\"ref\" href=\"/c/medium-pahom/\">Медиум Пахом<\/a> родился на земле, сбежал из ада и погиб на небесах»."], "places_html": "<ul>\n<li>Места: Небесный мир — <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесная канцелярия<\/a> (ресепшн, отдел кадров, пиар-отдел, отдел реинкарнации, департамент расовых меньшинств, департамент любви); райский сад с озером; портал, ведущий на остров Соблазна.<\/li>\n<li>Фракции: пантеон Небесного мира и Совет богов (<a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, Морадин, Зевс, <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a>); валькирии; мойры; праведники; демоны <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> — Тёмного Властелина.<\/li>\n<li>Артефакты: <b>меч <a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a><\/b> (двуручный, у отряда); <b>колокольчик бога Солнца<\/b> (ангельский колокольчик); <b>магическая скрижаль <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a><\/b> (контакты: 01 — <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, 02 — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, 03 — неизвестно); <b>клубок судьбы<\/b> (предсказание броска; у <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректуса<\/a>); тёмный кристалл телепортации в руке <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> (исчез вместе с ним); «индекс любви»; картотека судьбы; план пиар-отдела о саранче на <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>; листовка <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; поддельные бланки праведников.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>47<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>47<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>18<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>9<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>3<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>5<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>11<\/small><\/button><\/div><article class=\"pnote t-addition\" id=\"qa25-27\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь<\/b><\/div><p>Демоны входят в святые места светлого божества, только осквернив их, поэтому и осквернили храм Солнца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. В <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> демона не пустит тот же барьер. Если осквернить храм и поместить туда кристалл, тот уже не перенесёт в Небесный мир: не будет божественной эссенции. Переноситься туда могут только боги и носители божественной крови, остальным нужны особые обстоятельства. Об этом обещаны будущие приключения.<\/p><blockquote>«только боги могут переноситься в Небесный мир. Если у тебя есть божественная кровь, то тогда ты можешь переноситься»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-27\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4309\" target=\"_blank\" rel=\"noopener\">1:11:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Купидона уволили за хулиганство: он хотел выделяться<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a> по задумке сводил нетрадиционные пары из хулиганства: он хотел быть «нестандартным» и стрелял в кого хотел, за что его и наказали увольнением.<\/p><blockquote>«Задумывалось так, что он просто хулиганил, он такой нестандартный, он хотел выделяться, его за это и наказали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-1\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1011\" target=\"_blank\" rel=\"noopener\">0:16:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-2\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Персонажи из прошлых выпусков намеренно не влияют на сюжет<\/b><\/div><p>Авторы объяснили, что карточка <a class=\"ref\" href=\"/c/savl/\">Савла Пэнисова<\/a> в картотеке была пасхалкой для зрителей. Персонажи, которые связаны с лором и прошлыми выпусками (Савл, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и др.), специально не появлялись в раю, чтобы не влиять на сюжет отдельного приключения.<\/p><blockquote>«Такие персонажи, которые относятся к лору, к прошлым выпускам, они не должны влиять на сюжет конкретного приключения, поэтому мы такие вещи стараемся исключать.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-2\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1500\" target=\"_blank\" rel=\"noopener\">0:25:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Мойры не преследовали героев по решению мастера<\/b><\/div><p>На вопрос, почему мойры не подняли тревогу после боя, ответили так: мастер сам решает, насколько враждебны NPC, а бесконечным боем с мастерскими персонажами игроков душить нельзя.<\/p><blockquote>«Мастер сам решает, насколько враждебными персонажи должны быть к игрокам. Нельзя душить игроков бесконечным боем с мастерскими персонажами.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-3\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1563\" target=\"_blank\" rel=\"noopener\">0:26:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>BRB знал, что Пахома переживёт только одно применение кристалла<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что перед игрой ему несколько раз сказали: сил у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> хватит на одно применение <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристалла<\/a>, после которого он почти наверняка умрёт. Поэтому он решил закончить жизнь персонажа с пользой.<\/p><blockquote>«До игры мне несколько раз сказали, что у тебя жизненных сил на одно применение кристалла: если один раз применишь, ты с вероятностью примерно 100% умрёшь.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa27/#qa27-4\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1709\" target=\"_blank\" rel=\"noopener\">0:28:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa27-5\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Валькирия у турникета предлагала спасти Пахома, отрубив руку<\/b><\/div><p>Авторы зачитали реплику валькирии-охранницы: она предлагала отсечь <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> руку с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллом<\/a>, остановить кровь и исцелить его. Это была прямая подсказка, как выжить. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> отказался, потому что везде искал подвох и считал кристалл способом сбежать в критический момент.<\/p><blockquote>«Давай я просто отсеку тебе руку, остановлю кровотечение, затем… ты даже не заметишь.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-5\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1739\" target=\"_blank\" rel=\"noopener\">0:28:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-6\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Исцелить Пахома могла валькирия Стелла Артуа, но не Полуэректус<\/b><\/div><p><a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> говорили, что исцелить его может только божественное существо. Из отряда это могла сделать <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a>: она боевая валькирия-паладин с наложением рук. <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> как малый бог силы не умел лечить, он только дарует силу.<\/p><blockquote>«Камень не мог тебя исцелить, потому что у него не было таких способностей. Камень — это бог силы, малый бог, он дарует силу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-6\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=1948\" target=\"_blank\" rel=\"noopener\">0:32:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa27-7\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Две ветки сцены с отрубанием руки: подруга вылечила бы, враг унёс бы руку Венере<\/b><\/div><p>Авторы описали сценарий. Если бы валькирия была <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> врагом, она силой отрубила бы руку и отнесла её на анализ в кабинет <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> с артефактами, и мог начаться бой. Раз она стала подругой (Пахом её очаровал), она отрубила бы руку, оставила бы её Пахому с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллом<\/a> и полностью вылечила бы его. Эту головоломку не прошли. В подкасте эту валькирию назвали Адель, хотя в выпуске Адель — администратор ресепшена.<\/p><blockquote>«Если она тебе друг, она отрубит руку, оставит тебе эту руку с кристаллом и залечит тебя полностью. Она была тебе другом, но ты не согласился.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-7\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2012\" target=\"_blank\" rel=\"noopener\">0:33:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-8\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Гелиос не знал о «концепции страданий» пиар-отдела<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> не знал о плане пиар-отдела. Отделы, пиар и перестройка неба по образцу корпорации появились уже при <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>. При Гелиосе были пиры с нимфами, а праведники получали все привилегии небесного мира. Лист из принтера мог бы помочь убедить Гелиоса.<\/p><blockquote>«Нет, он не знал, потому что это как бы новое правило этого мира — появление пиар-отдела, вообще наличие различных отделов, перестройка божественного мира на лад корпорации.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-8\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2271\" target=\"_blank\" rel=\"noopener\">0:37:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa27-9\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>«Главный адепт Гелиоса, присягнувший дьяволу» — лорд Властон, а не Сфинктерион<\/b><\/div><p>На вопрос, кто этот адепт, авторы ответили: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Там культ Солнца был популярной, а одно время и государственной религией, и жрецы под влиянием Властона отвернулись от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>. Из-за этого предательства Гелиос потерял множество храмов и впал в «божественную депрессию».<\/p><blockquote>«О ком же речь? О Сфинктерионе? — Нет, речь шла о Властоне. Лорд Геленбурга, в котором была распространена… храм Солнца — популярная религия на юге королевства.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep27.md (раздел «Персонажи и NPC», «Упоминаются», и раздел связей про <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>) главный адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, присягнувший дьяволу, назван <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>. По словам авторов, это лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>.<\/p><p class=\"note\"><a href=\"/pod/qa27/#qa27-9\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2443\" target=\"_blank\" rel=\"noopener\">0:40:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Гелиоса можно было уговорить пойти с героями, но не по телефону<\/b><\/div><p>Авторы сказали, что настроить <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> против <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> было можно, если бы герои сделали что-то изобретательное. Но для этого надо было идти к нему лично, а не говорить по видеосвязи.<\/p><blockquote>«Нет ничего невозможного. Гелиоса можно было вытащить, но вряд ли по телефону, надо было просто зайти за стенку.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-10\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2520\" target=\"_blank\" rel=\"noopener\">0:42:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-11\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Небесная канцелярия как «рельсы»: бухгалтерию и опенспейс можно было посетить<\/b><\/div><p>Авторы объяснили: рай сделали корпорацией, чтобы новый сеттинг был понятнее. Мастер вёл игроков по отделам, как по рельсам, потому что так было проще подать много информации. С рельсов можно было сойти: пойти к <a class=\"ref\" href=\"/c/venera/\">Венере<\/a>, на Совет богов, в бухгалтерию или опенспейс. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> не ограничен канцелярией, в нём почти бесконечно много «скал» и отделов.<\/p><blockquote>«С них можно сойти, пойти погулять, зайти к Венере, сойти на совет богов — вам как бы никто не запрещал.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-11\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2778\" target=\"_blank\" rel=\"noopener\">0:46:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-12\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Реинкарнация праведников: высокий балл даёт новую жизнь человеком со стёртой памятью<\/b><\/div><p>По новым правилам праведник проводит какое-то время в небесном мире. Если он набирает хороший балл, его могут реинкарнировать человеком, но память полностью стирают. По законам неба никто не может вернуться на Землю, зная тайны богов. Поэтому авторы назвали <a class=\"ref\" href=\"/c/venera/\">Венеру<\/a> не злой, а «законной» и нейтральной.<\/p><blockquote>«Никто не может вернуться на Землю по правилам небесного мира. То есть Венера не злая, она законная.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-12\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2928\" target=\"_blank\" rel=\"noopener\">0:48:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-13\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Боги не должны решать сюжет за героев<\/b><\/div><p>Авторы сказали, что сознательно не хотят, чтобы в глобальном сюжете ПЧК боги приходили и всё решали за героев. Богов не стоит считать безусловно добрыми.<\/p><blockquote>«Мы не хотели, чтобы глобально в сюжете подземелий боги были: вот пришли и всё за вас решат.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-13\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3056\" target=\"_blank\" rel=\"noopener\">0:50:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa27-14\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Шансы Пахома выжить: остаться на небе или переубедить Венеру<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> мог не погибнуть: например, остаться где-то в небесном мире. Против дезинтеграции <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> был спасбросок сложности около 20. Венера всё равно наказала бы героев, разговор мог продолжиться разве что после верных слов и критического успеха убеждения.<\/p><blockquote>«Если вы только какие-то слова нашли и выбросили бы критическую удачу на убеждение, тогда бы, может быть, какой-то диалог продолжился.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-14\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3183\" target=\"_blank\" rel=\"noopener\">0:53:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-15\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Реликвии хранились у Накопителя Любви, кража включила сигнализацию<\/b><\/div><p>Меч, <a class=\"ref\" href=\"/a/kolokolchik-boga-solnca/\">колокольчик<\/a> и другие артефакты хранились в помещении с <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопителем Любви<\/a>, до которого герои не дошли. Выдать их могли только <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> или <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Когда артефакт забрали, у Венеры сработала сигнализация, и она пришла наказывать «воришек» за кражу и незаконное проникновение.<\/p><blockquote>«Вот эти артефакты все хранились в помещении с накопителем любви. Их мог дать вам либо Гелиос, либо она.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-15\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3256\" target=\"_blank\" rel=\"noopener\">0:54:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-16\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Тезисы доклада Венеры: «людям следует страдать, но не вымирать»<\/b><\/div><p>Авторы зачитали заготовленные тезисы доклада <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, который герои могли услышать. Чем больше люди страдают, тем больше молятся, а сытые забывают богов. Нужен баланс: людям следует «ощущать лёгкий дискомфорт», но не вымирать. Допустимы контролируемые кары вроде саранчи, их в документах называют «приглашением больших кузнечиков». Праведники перед реинкарнацией не должны ничего помнить. Храмы в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> потеряны, но индекс страха высок и молитв больше.<\/p><blockquote>«Людям следует страдать, но мы говорим «ощущать лёгкий дискомфорт». Но мы не должны позволять им вымирать. Умное использование ресурсов — вот вектор нашей работы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-16\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3319\" target=\"_blank\" rel=\"noopener\">0:55:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa27-17\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Савла можно было найти в райском туалете<\/b><\/div><p>Авторы признались, что хотели сделать <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> союзником или проводником в раю: он «мигрирующий персонаж». Встретить его можно было в туалете на юго-востоке карты. Туалет для праведников объяснили так: в раю они должны получать удовольствие.<\/p><blockquote>«Савл мог бы быть их союзником где-то там, каким-то проводником… Одно из мест, где можно было встретить Савла, — там был на карте на юго-востоке туалет.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-17\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=3705\" target=\"_blank\" rel=\"noopener\">1:01:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa27-18\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Все три мойры живы<\/b><\/div><p>Авторы уточнили: когда игроки сказали «одну убили», мастер ответил «всё так» в смысле, что герои применили насилие вместо мирного пути. Мойры плетут судьбы, с ними ничего не сделаешь, и все трое живы, в том числе Милиция.<\/p><blockquote>«Мы одну убили, не мойры… Они все живы. С мойрами ничего не сделаешь, они действительно плетут судьбу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-18\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4233\" target=\"_blank\" rel=\"noopener\">1:10:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Имена мойр Милиция и Стана — от черногорских принцесс<\/b><\/div><p>Селезнёв, который придумал имена мойр, объяснил: Милиция и Стана — черногорские принцессы, жёны великих князей Романовых, которые познакомили императрицу Александру Фёдоровну с Распутиным и так повлияли на судьбу страны. Происхождение имени Крис он не пояснил.<\/p><blockquote>«Милиция и Стана — это черногорские принцессы, жёны великих князей Романовых… они познакомили её с Григорием Распутиным.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa27/#qa27-19\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4367\" target=\"_blank\" rel=\"noopener\">1:12:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дон-Дон — гном-изобретатель, дослужившийся до бога<\/b><\/div><p>Авторы объяснили, что имена богов брали из разных мифологий, чтобы их суть была понятна сразу (Зевс, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>). <a class=\"ref\" href=\"/c/dondon/\">Дон-Дона<\/a> они придумали сами: это гном из <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змия<\/a> Хрустального, который совершил столько легендарных изобретений, что достиг ранга богов, и несёт людям науку.<\/p><blockquote>«Дон-Дон — это выдуманный нами бог-изобретатель. Он был гномом, но сделал столько изобретений легендарных, которые в Змии Хрустальном… что он достиг ранга богов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-20\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4473\" target=\"_blank\" rel=\"noopener\">1:14:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa27-21\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Морадин в первом выпуске, возможно, был ошибкой<\/b><\/div><p>Авторы сказали, что Морадин — чисто днд-шный бог и упоминать его в первом выпуске (<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> — жрица Морадина), возможно, было ошибкой: тогда они ещё не разобрались, как устроить пантеон.<\/p><blockquote>«Морадин — это чисто днд-шный бог, мы, возможно, совершили ошибку в первом выпуске, упомянув Морадина. Мы тогда особенно ещё не разбирались.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-21\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4583\" target=\"_blank\" rel=\"noopener\">1:16:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему кристалл врос в руку Пахома и почему убивал его<\/b><\/div><p><a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь, когда <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> совершил злой поступок: телепортировался из адского поезда, предав друзей. Тёмный <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристалл<\/a> «почувствовал своего» и вступил с ним в симбиоз. В аду кристалл был силён и смог перенести Пахома в другой мир. На Земле и на небесах он ослаб, а раз Пахом остался добрым, кристалл высасывал из него силы.<\/p><blockquote>«Мы так решили, что кристалл почувствовал своего и вступил с тобой в симбиоз… Поскольку ты оставался добрым существом, он из тебя высасывал энергию.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-22\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4648\" target=\"_blank\" rel=\"noopener\">1:17:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-24\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гудков играл выпуск 27 трезвым из-за его важности<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> рассказал, что заранее считал выпуск очень важным, «решающим судьбу десяти выпусков», и поэтому не пил за столом.<\/p><blockquote>«Я говорю ребятам, что я даже пить не буду, поскольку это… как можно пить там, в небесах.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa27/#qa27-24\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=5402\" target=\"_blank\" rel=\"noopener\">1:30:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-25\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Монеты раздавали щедро не из-за запланированного боя<\/b><\/div><p>На вопрос, не давал ли мастер монеты легко перед запланированным сложным боем с <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a>, ответили: это монеты вдохновения, их не жалко за удачные ходы и шутки.<\/p><blockquote>«Это монеты вдохновения, их никогда не жалко за прикольные какие-то ходы, шутки.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-25\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6213\" target=\"_blank\" rel=\"noopener\">1:43:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-26\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуски 26 и 27 сняли в один день<\/b><\/div><p>Авторы рассказали, что гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (выпуск <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a>) и <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> (выпуск <a href=\"/ep/27/\" title=\"Достучаться до небес\">27<\/a>) снимали в один день, «на одном моторе».<\/p><blockquote>«В двадцать шестом погиб Вампирбек, в двадцать седьмом погиб Пахом, и это было всё на одном моторе, в один день.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-26\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6450\" target=\"_blank\" rel=\"noopener\">1:47:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему полубоги под запретом и откуда «последний полубог»<\/b><\/div><p>Раньше связи богов со смертными были разрешены, но боги злоупотребляли ими: спускались на землю в образе животных и оплодотворяли женщин. Полубогов с доступом в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> стало так много, что это угрожало его безопасности и расходовало энергию. Поэтому <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> ввёл запрет, а полубог из пиар-отдела назвался последним.<\/p><blockquote>«Когда-то они были разрешены, но полубогов стало слишком много… такое количество полубогов, которые имеют доступ в небесный мир, — это уже угрожает безопасности небесного мира.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-28\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-29\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Розовый камень Полуэректуса — отсылка к Синь-камню<\/b><\/div><p>Авторы сказали, что прообраз розового камня бога <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректуса<\/a> — Синь-камень на Плещеевом озере, языческое место загадывания желаний.<\/p><blockquote>«Мы взяли Синь-камень, который находится на Плещеевом озере. Языческое место.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-29\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6764\" target=\"_blank\" rel=\"noopener\">1:52:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-30\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Иерархия богов устроена как корпорация<\/b><\/div><p>Ранги богов авторы описали как корпорацию. Генеральный директор — верховный бог, сейчас это <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Совет богов — совет директоров. Дальше идут главы отделов, а клерки — праведники.<\/p><blockquote>«Генеральный директор — это верховный бог, у нас Венера, а клерки — это праведники, персонал. Совет богов — это совет директоров.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-30\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6764\" target=\"_blank\" rel=\"noopener\">1:52:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-31\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>В скрижали Брэндона — история его любви и связь с елью Вёрджинвальда<\/b><\/div><p>Авторы сказали, что в магической скрижали <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> есть фотографии, как развивалась история его любви к полурослице. Они намекнули на связь <a class=\"ref\" href=\"/a/magicheskaya-skrizhal-brendona/\">Брэндона<\/a> со священной елью <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> из выпуска <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">15<\/a>, свет которой уничтожает тёмные силы. Матери ребёнка стёрли память, а ребёнка забрали.<\/p><blockquote>«Если они посмотрят скрижаль Брэндона, они увидят там некие фотографии того, как развивалась история любви… это отсылка есть на пятнадцатый выпуск, откуда эта ель вообще появилась.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-31\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6932\" target=\"_blank\" rel=\"noopener\">1:55:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b><\/div><p>Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений».<\/p><blockquote>«Тем ребёнком был Канделакис, которому дали… отвратительную фамилию Пэнисов. Мы это придумали: вот эту связь того, что Кукушкин придумал в первом выпуске, мы сейчас связали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-32\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск 28 сняли за один мотор и заранее протестировали<\/b><\/div><p>Авторы рассказали, что приключение 28 было полностью готово: сценарий, карты, Бреганов выспался и всё прочитал. В отличие от 26 и 27, которые не успели проверить, его заранее прогнали на тестовой игре в офисной переговорке. Сняли его за один мотор и уже потом разделили на две части.<\/p><blockquote>«Двадцать восьмое приключение тестировалось вот здесь, в комнате, которая находится за этим телевизором… мы её называем переговорка.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-1\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=145\" target=\"_blank\" rel=\"noopener\">0:02:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-26\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Автоматонов Дон-Дон создал, ещё когда был смертным изобретателем<\/b><\/div><p><a class=\"ref\" href=\"/a/umnye-avtomatony-dondona/\">Умные<\/a> автоматоны — разработка гнома Дон-Дона, но не божественное создание. Их сделали, когда <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> был ещё талантливым изобретателем, а не богом, которым он стал позже (отсылка к выпуску <a href=\"/ep/27/\" title=\"Достучаться до небес\">27<\/a>).<\/p><blockquote>«Это не божественное создание… в тот момент Дон-Дон ещё не был богом, он был просто очень талантливым изобретателем, который дослужился до бога.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-26\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6862\" target=\"_blank\" rel=\"noopener\">1:54:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-7\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Реинкарнации: у души не больше 12 жизней, Буцефалос — прошлая жизнь Лёши<\/b><\/div><p>Душа вечна, но проходит не больше двенадцати реинкарнаций; при каждой ей стирают память (как в вып. 27). Божественным считается тело: полубожественное тело <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a> умеет вспоминать прошлые жизни и чуть расщеплять душу. Под давлением экстремальных событий оно «защитилось», вызвав из памяти самое сильное своё воплощение — кентавра <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a>. Таких воплощений в Лёше может быть не больше двенадцати; по сути он «мультиклассовый» персонаж.<\/p><blockquote>«Буцефалос, этот кентавр — это одна из реинкарнаций Лёшиной души.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-7\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2589\" target=\"_blank\" rel=\"noopener\">0:43:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa31-2\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Купидон, Стелла Артуа и Полуэректус не прошли через портал на Землю<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> не выпустил спутников <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> из <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a> через портал: разрешения у них не было. Разрешение на переход из всех небесных существ было только у грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a>, посланного богом Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>.<\/p><blockquote>«Небесный мир им не позволил пройти этот портал и оказаться в земном мире, разрешения у них не было»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep27.md: в итоге и в списке персонажей сказано, что <a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a>, <a class=\"ref\" href=\"/c/stella-artua/\">Стелла Артуа<\/a> и <a class=\"ref\" href=\"/c/poluerektus/\">Полуэректус<\/a> «ушли на Землю» через портал. По словам авторов, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесный мир<\/a> их не пропустил: на Землю вышли только <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> и грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>.<\/p><p class=\"note\"><a href=\"/pod/qa31/#qa31-2\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=566\" target=\"_blank\" rel=\"noopener\">0:09:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa31-3\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Низшие небожители ходят на Землю только с разрешения небесной канцелярии<\/b><\/div><p><a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесные<\/a> существа низшего происхождения могут перейти в <a class=\"ref\" href=\"/place/zemnoy-mir/\">земной мир<\/a> только с разрешения канцелярии: небо устроено как корпорация. У <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> для этого был <a class=\"ref\" href=\"/a/angelskiy-pasport-angelina/\">ангельский<\/a> паспорт, <a class=\"ref\" href=\"/c/grifon-andrey/\">грифон<\/a> пришёл по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, а валькирии полетели за героями по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>.<\/p><blockquote>«они должны получить некое разрешение в канцелярии, как у Гогена был паспорт ангела»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-3\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=631\" target=\"_blank\" rel=\"noopener\">0:10:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa31-4\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>37<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Полуэректус на Земле существует только как розовый камень<\/b><\/div><p>Бог розового камня не может появиться на Земле в своём телесном облике, только как сам розовый камень. Этот камень лежит на берегу озера в Варварском лесу, и ему поклоняются семь орков и один гоблин.<\/p><blockquote>«он может оказаться на земле только в облике непосредственно камня, розового камня, который лежит на берегу»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-4\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=631\" target=\"_blank\" rel=\"noopener\">0:10:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>38<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Пахом и Талала могли пробыть на небесах месяцы<\/b><\/div><p>Демоны успели захватить <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров соблазна<\/a> потому, что никто не говорил, будто <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> провели на небесах несколько часов: на знакомство с <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесными<\/a> департаментами могли уйти месяц или два. Время в небесном мире течёт иначе, но точную формулу авторы не назвали.<\/p><blockquote>«Они могли там и месяц быть, и два месяца, то есть мы об этом не говорим просто»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-5\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=701\" target=\"_blank\" rel=\"noopener\">0:11:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa31-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>39<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Схема перемещений между мирами<\/b><\/div><p>Селезнёв показал схему миров, нарисованную Катей Гандрабурой. Демоны ходят между <a class=\"ref\" href=\"/place/ad/\">адом<\/a> и Землёй, <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесные<\/a> существа — между небом и Землёй. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, переставший быть божеством, может попасть в ад, но путь наверх ему закрыт. Только люди с <a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">кристаллами<\/a> телепортации, как <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, могут попасть и в ад, и на небо. Как созданы очень прочные границы между мирами, пока не раскрывают.<\/p><blockquote>«люди, которых здесь олицетворяет Пахом, с помощью кристаллов телепортации могут перемещаться как в адский мир, так и в небесный»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa31/#qa31-23\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=3825\" target=\"_blank\" rel=\"noopener\">1:03:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa38-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>40<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Гелиос наказал сына так жестоко<\/b><\/div><p>У богов действовал закон, запрещающий связи с земными существами, чтобы не рождались полубоги. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> его нарушил, и <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> был обязан показательно наказать собственного сына, чтобы не потерять авторитет перед другими богами. У Гелиоса есть и другие дети — как минимум известна одна дочь.<\/p><blockquote>«он обязан был наказать своего собственного сына, наказать жестоко, чтобы другим было неповадно»<\/blockquote><p class=\"note\"><a href=\"/pod/qa38/#qa38-9\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1614\" target=\"_blank\" rel=\"noopener\">0:26:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa38-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>41<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Проклятия «добрых» богов множат страдания ради молитв<\/b><\/div><p>От проклятий светлых богов сильнее страдают невиновные, потому что богам выгодны страдания: чем их больше, тем больше молитв.<\/p><blockquote>«больше страданий, тем больше молитв»<\/blockquote><p class=\"note\"><a href=\"/pod/qa38/#qa38-10\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1677\" target=\"_blank\" rel=\"noopener\">0:27:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa38-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>42<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндон строил замок Вёрджинвальда и привёз райскую ель<\/b><\/div><p>На фотографиях скрижали, которые в выпуске №<a href=\"/ep/27/\" title=\"Достучаться до небес\">27<\/a> рассматривали за кадром, видно, как <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> возводил укрепления в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a>: он был одним из строителей замка Вёрджинвальда и привёз туда райскую ель, уничтожившую демона в №15 (о райских елях говорилось в №37). Он защищал простых людей и служил им. Имя «<a class=\"ref\" href=\"/a/magicheskaya-skrizhal-brendona/\">Брэндон<\/a>» — отсылка к «Беверли-Хиллз»: мажор, сын Верховного бога.<\/p><blockquote>«он был одним из тех, кто строил замок Вёрджинвальда, кто привёз туда райскую ель, которая уничтожила демонов в пятнадцатом выпуске»<\/blockquote><p class=\"note\"><a href=\"/pod/qa38/#qa38-21\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=5171\" target=\"_blank\" rel=\"noopener\">1:26:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a>, <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-10\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>43<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Характер и мотивация грифона Андрея<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признал, что мотивация <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> у него самая непроработанная. Грифон считает себя божественным созданием, хотя на деле он зверь (божественен единорог). Он помогал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> в небесной канцелярии и спустился с ней на землю по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> как скакун воина света. Сначала служба ему не нравилась, но, видя, что у Талалы, пусть и криво, всё получается, он к ней привязался. По мнению BRB, Андрей должен смотреть на земных свысока и нести «сексистские» порядки Гелиоса, которому служил.<\/p><blockquote>«Грифон считает себя божеством, божественным созданием. Хотя на самом деле он просто, ну, зверь.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa41-42/#qa41-42-10\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3171\" target=\"_blank\" rel=\"noopener\">0:52:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-16\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>44<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вокзал построен по «Божественной комедии» Данте и Родену<\/b><\/div><p>При разработке <a class=\"ref\" href=\"/place/ad/\">ада<\/a> авторы вдохновлялись «Божественной комедией»: круги ада, выставка пыток показывала, что ждёт глубже. Статую на площади вокзала взяли с «Врат ада» Родена, которые венчает «Мыслитель». Работа над адом шла веселее, чем над «небесной канцелярией» из выпуска о небесах.<\/p><blockquote>«Вдохновились конкретно «Божественной комедией», потому что эти круги ада показали пытки.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-16\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4136\" target=\"_blank\" rel=\"noopener\">1:08:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-7\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>45<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него<\/b><\/div><p>Запрет на любовь и потомство богов от земных существ введён не менее 50 лет назад: тогда <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сошёлся с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, и это последнее известное нарушение. Все полубоги родились до запрета; последним «разрешённым» полубогом был сотрудник пиар-отдела из <a href=\"/ep/27/\" title=\"Достучаться до небес\">27-го<\/a> выпуска по имени Вильхем. Значит, <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидии<\/a> больше 50 лет, возможно 70–100: полубоги живут долго и сохраняют молодость. Авторы допустили, что существует ещё неизвестный полубог, рождённый уже при запрете.<\/p><blockquote>«Это последний известный факт нарушения. После этого нарушений не было. Все полубоги, рождённые от этих смешанных браков, они были до.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-7\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1651\" target=\"_blank\" rel=\"noopener\">0:27:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>46<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Купидоны и ангелы: иерархия как у демонов (не продумано)<\/b><\/div><p>На вопрос, вырастают ли <a class=\"ref\" href=\"/c/kupidon/\">купидоны<\/a> в ангелов, авторы признали, что этого не продумывали. Допустили, что небесные существа, как и демоны, растут, поднимаются в иерархии и меняют облик. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> и <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> в шутку настаивали, что купидоны — взрослые «карлики»: одному из них 800 лет.<\/p><blockquote>«Да, мы это не продумывали, но… вполне можно, потому что как и демонические сущности, демоны тоже растут.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-20\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3074\" target=\"_blank\" rel=\"noopener\">0:51:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-22\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>47<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Мраморная беседка Венеры — её личный реинкарнатор: героев превратили бы в камни<\/b><\/div><p>Ажурная беседка у виллы — личный портал реинкарнации <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, вроде того, что был в <a href=\"/ep/27/\" title=\"Достучаться до небес\">27-м<\/a> выпуске. Поймав героев, Венера изобразила бы доброту и пообещала отпустить их на Землю без стирания памяти. На деле она отправила бы их в беседку, и они переродились бы цветком в <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисских горах<\/a>, сосной в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> или галькой на пляже <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряного моря<\/a>, сохранив память.<\/p><blockquote>«Я отправлю вас на Землю, чтобы вы могли начать новую жизнь. Даже тебя, Ангелин.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-22\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3330\" target=\"_blank\" rel=\"noopener\">0:55:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><\/section>", "chars": {"Шон": {"name": "Шон", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": true, "race": "", "portraits": [], "url": "/c/shon/", "eps": [{"key": "27", "label": "27", "title": "Достучаться до небес"}]}, "Стелла Артуа": {"name": "Стелла Артуа", "img": null, "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D1%82%D0%B5%D0%BB%D0%BB%D0%B0_%D0%90%D1%80%D1%82%D1%83%D0%B0", "summary": "Стелла Артуа – небесная валькирия.", "infobox": {"Пол": "Женский", "Раса": "Небожитель", "Тип": "Игровой", "Игрок": "Евгения Искандарова"}, "actors": ["Евгения Искандарова"], "kind": "pc", "dead": false, "race": "Небожитель", "portraits": [], "url": "/c/stella-ar
