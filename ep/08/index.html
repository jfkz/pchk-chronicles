<script>window.EPD = {"anim": false, "key": "08", "label": "8", "title": "Покушение на короля", "date": "2021-12-31", "minutes": 78, "duration": 4671.0, "video_id": "crGNVtAMH7c", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Столица Кёнигпон в канун Нового года: бордель «Барсук», Дворцовая площадь, магазин «Зигзаг», мост через канал", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, ставшие рядовыми стражи <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>, должны предотвратить покушение на короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>.", "summary_html": "Новогодний выпуск. После побега из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> поступили в городскую стражу столицы <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>; вместе с дварфом-монахом <a class=\"ref\" href=\"/c/cisgender/\">Цисгендием<\/a> и рядовым-крысолюдом <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> они получают задание предотвратить покушение на короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, который в канун Нового года едет зажигать ель на Дворцовой площади. Через контрабандистку <a class=\"ref\" href=\"/c/diana/\">Диану<\/a> из борделя «Барсук» и лавку «Мир хлопка» они выходят на заговор людей-ксенофобов («Белый бутон расцвёл»), уничтожают склад пороха под обувной лавкой «Зигзаг», но не успевают остановить пушку на лодке «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка». Карету короля взрывают на мосту, однако Цисгендий вытаскивает раненого короля и прыгает с ним в канал, Пэлиас его лечит — король спасён, никто из героев не погиб.", "outcome_html": "Покушение на короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> сорвано, все герои выжили; заговорщики разбежались и остались на свободе.", "world_html": ["<a class=\"ref\" href=\"/c/korol-poni-v/\">Король Поний V<\/a> пережил покушение на мосту в канун Нового года", "Раскрыт заговор людей-ксенофобов против короля и «грязных рас», проникший в городскую стражу", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> и <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> заслужили благодарность короля"], "scenes": [{"t": "0:00:09", "sec": 9, "html": "Рекап: год назад в северном <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурге<\/a> (<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>) ударом ноги раскроил кому-то череп; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> бежали из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>; в канун Нового года судьба свела их с Цисгендием в столице."}, {"t": "0:04:30", "sec": 270, "html": "Рекламная сценка из преисподней (бесы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> и <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, реклама фильма)."}, {"t": "0:08:48", "sec": 528, "html": "<a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> — столица <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> на островах в дельте реки; зима, каналы не замерзают. На Дворцовой площади ель, которую должен зажечь молодой король <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, едущий из загородной резиденции."}, {"t": "0:09:30", "sec": 570, "html": "Герои: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не может вернуться в оккупированный <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> и служит в страже, чтобы заслужить уважение короля; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> с ним; <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> — дварф-монах из <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>; <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> — ликантроп, умеющий превращаться в крысу, застрявший в звании рядового и мечтающий стать офицером."}, {"t": "0:14:11", "sec": 851, "html": "Капитан стражи Мухомор: заговорщики хотят убить короля по дороге; контрабандистка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> что-то знает — найти её в борделе «Барсук»."}, {"t": "0:15:16", "sec": 916, "html": "Фейс-контроль не пускает «стриптизёров-копов», их отправляют к чёрному ходу. <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, освежившись конфетами, соблазняет повара-мясника поцелуем — тот пускает их."}, {"t": "0:21:36", "sec": 1296, "html": "Кухня: повар выгоняет героев («<a class=\"ref\" href=\"/c/diana/\">Диана<\/a> — лесбиянка, мужиков бы не вызвала»). В зале <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, притворяясь бардом, выходит к Диане — 200-летней эльфийке-фехтовальщице с клинком «Острая лесби»."}, {"t": "0:25:48", "sec": 1548, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в VIP-комнате пытается развести пьяную компанию, ловит брошенную бутылку и показывает значок — напуганные посетители откупаются монетой («не надо повторения тех событий»)."}, {"t": "0:28:41", "sec": 1721, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> («Я Наташа») пытаются допросить <a class=\"ref\" href=\"/c/diana/\">Диану<\/a>, она угрожает мечом. <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> в облике крысы заползает ей в штаны; Диана роняет сумку, Цисгендий её уносит. Альбо доводит Диану до обморока (крит), затем превращается в человека прямо в её штанах — «мент родился» — и выходит с помощью значка."}, {"t": "0:33:40", "sec": 2020, "html": "В сумке — две монеты и тетрадь контрабандиста: 10 бочек пороха проданы господину <a class=\"ref\" href=\"/c/neyt/\">Нейту<\/a> из лавки «Мир хлопка» на Дворцовой площади."}, {"t": "0:33:40", "sec": 2020, "html": "Рекламная вставка: эльф-торговец Додис предлагает артефакт с Windows 11; «сгинешь, как <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a>… Кукушкин жив, он вернётся в будущих сериях»."}, {"t": "0:39:41", "sec": 2381, "html": "Дворцовая площадь, «самое безопасное место в столице»: вышка блокирует магию, дворец охраняют королевские гвардейцы. <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, превратившись в полукрысу у всех на глазах, по приказу офицера стражи брошен в клетку.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ликантропия в мире ПЧК\">1<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ликантропия в мире ПЧК<\/b> Оборотнем становятся не по наследству, а от укуса. Выжив после укуса оборотня, человек примерно с 50-процентной вероятностью заражается; обращение занимает около двух недель. Дальше три пути: не контролировать себя и превращаться в зверя в полнолуние или при стрессе; научиться контролировать превращение; стать гибридом с промежуточной формой (полукрыса-получеловек), как <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4223\" target=\"_blank\" rel=\"noopener\">1:10:23 ↗<\/a> · <a href=\"#qa16-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему мастер сразу сказал Сфинктериону про вышку\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему мастер сразу сказал Сфинктериону про вышку<\/b> Мастер не дал броска на знание о вышке 5G, потому что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уже дважды сталкивался с такими вышками — в выпусках 5 и 8 — и знает, как они работают. Подсказка при этом прозвучала из зала. <span class=\"note\">Подкаст по #30 · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3016\" target=\"_blank\" rel=\"noopener\">0:50:16 ↗<\/a> · <a href=\"#qa30-11\">к записи<\/a><\/span><\/span>"}, {"t": "0:44:01", "sec": 2641, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> давит на <a class=\"ref\" href=\"/c/neyt/\">Нейта<\/a>; вмешивается тот же офицер — оказывается, он из заговорщиков. Сфинктерион выдаёт себя за «мозг операции»; офицер-ксенофоб говорит пароль «Белый бутон расцвёл» и уходит."}, {"t": "0:47:25", "sec": 2845, "html": "<a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a> подтверждает: на площади ничего нет, порох «на точках на пути», цель ликвидируют «на подъезде»; отдаёт копию плана и манифест. Землекопа, требующего платы, стража уводит в клетку к <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>."}, {"t": "0:50:05", "sec": 3005, "html": "Манифест: король <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> слаб, «существа грязных рас наводнили столицу», смерть <a class=\"ref\" href=\"/place/poniya/\">Поний<\/a> V. В клетке пьяный землекоп рассказывает <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, что закопал все 10 бочек под магазином «Зигзаг» на проспекте Покушений; украв монету, развязывает Альбо — тот убивает его из ручного арбалета, а затем крысой сбегает, пока стражник проверяет труп.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Отец Диффузория — землекоп из «Покушения на короля»\">6<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Отец Диффузория — землекоп из «Покушения на короля»<\/b> Отец <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> — тот самый землекоп из выпуска 8, который рыл яму под лавкой «Зигзаг», требовал платы и был брошен в клетку городской стражи, где <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> застрелил его из арбалета. Никакой казни на площади не было: Диффузорий героизирует отца, ему просто так рассказали. Это рифма: в выпуске 8 героям нужно было предотвратить покушение на короля, а здесь на него покушались они сами. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep44.md: <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> «мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп» — это версия самого персонажа; на деле его отец — землекоп из #08, застреленный <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> в клетке городской стражи, а не казнённый по приговору.<\/span> <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=7001\" target=\"_blank\" rel=\"noopener\">1:56:41 ↗<\/a> · <a href=\"#qa43-44-31\">к записи<\/a><\/span><\/span>"}, {"t": "0:55:02", "sec": 3302, "html": "Лавка «Зигзаг» (берцы и ортопедические стельки, «только для людей»). По плану два места: пушка у моста и порох под магазином (9 бочек, десятая — для пушки). <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мечом убивает деда-лавочника, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> не даёт ему дёрнуть верёвку-детонатор."}, {"t": "1:01:38", "sec": 3698, "html": "В пороховой пещере под люком — обезьяна с колокольчиком-детонатором; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> говорит с ней, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> убивает её дубиной. Верёвку перерезают, люк заваливают берцами и трупом деда."}, {"t": "1:05:21", "sec": 3921, "html": "Горбатый мост, королевская карета въезжает под фанфары. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бросает <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> на жёлтую грузовую лодку «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка» с пушкой под тентом; Альбо ранит рулевого, гребцы ранят Альбо, рулевой поджигает фитиль."}, {"t": "1:07:48", "sec": 4068, "html": "Выстрел: бомба попадает в карету, мост в синем дыму, гвардейцы и лошади мертвы. <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> (крит интеллекта) чувствует всё сквозь дым, хватает раненого короля и прыгает с ним в зимний канал."}, {"t": "1:10:55", "sec": 4255, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> кричит «король у меня!» и отвлекает заговорщиков — их бомбы наносят ему 17 урона, он прыгает в воду. <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> прыгает за <a class=\"ref\" href=\"/c/cisgender/\">Цисгендием<\/a> и исцеляет короля."}, {"t": "1:13:16", "sec": 4396, "html": "<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> бегом по стенам набережной уносит короля в парк; <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> мёрзнет в воде и прячется под мостом."}, {"t": "1:16:03", "sec": 4563, "html": "Заговорщики разбегаются; гвардейцы сопровождают героев и короля во дворец, король благодарит. Никто из героев не погиб; 10 монет (100 000 руб.) — игроки в шутку «делят на четверых»."}], "key_events": [{"t": "0:14:11", "sec": 851}, {"t": "0:28:41", "sec": 1721}, {"t": "0:33:40", "sec": 2020}, {"t": "0:44:01", "sec": 2641}, {"t": "0:51:30", "sec": 3090}, {"t": "0:58:02", "sec": 3482}, {"t": "1:05:50", "sec": 3950}, {"t": "1:07:48", "sec": 4068}, {"t": "1:09:55", "sec": 4195}, {"t": "1:16:03", "sec": 4563}], "coins": {"ep": "08", "events": [{"t": "0:27:58", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "напуганные пьяницы в баре, приняв персонажа за полицейского, откупились золотой монетой из кошелька", "result": null, "sec": 1678, "who_url": null, "reason_html": "напуганные пьяницы в баре, приняв персонажа за полицейского, откупились золотой монетой из кошелька"}, {"t": "0:33:48", "kind": "earn", "who": "Пэлиас", "actor": "Гудков", "to": null, "reason": "проверил сумку Дианы, пока она была в туалете, нашёл две золотые монеты и тетрадь контрабандиста", "result": null, "sec": 2028, "who_url": "/c/pelias/", "reason_html": "проверил сумку <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a>, пока она была в туалете, нашёл две золотые монеты и тетрадь контрабандиста"}, {"t": "0:52:40", "kind": "spend", "who": "Пэлиас", "actor": "Гудков", "to": null, "reason": "у персонажа при обыске пленник-алкаш вытащил из кармана золотую монету в качестве платы за то, чтобы его развязали", "result": null, "sec": 3160, "who_url": "/c/pelias/", "reason_html": "у персонажа при обыске пленник-алкаш вытащил из кармана золотую монету в качестве платы за то, чтобы его развязали"}, {"t": "0:54:54", "kind": "loot", "who": "Пэлиас", "actor": "Гудков", "to": null, "reason": "выстрелил пленнику в глаз и забрал у мёртвого тела ранее отданную монету обратно", "result": null, "sec": 3294, "who_url": "/c/pelias/", "reason_html": "выстрелил пленнику в глаз и забрал у мёртвого тела ранее отданную монету обратно"}, {"t": "0:57:15", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "персонаж-монах получил монету за сообразительность — разгадал по рисунку план заговорщиков (пушка и порох)", "result": null, "sec": 3435, "who_url": null, "reason_html": "персонаж-монах получил монету за сообразительность — разгадал по рисунку план заговорщиков (пушка и порох)"}, {"t": "1:16:30", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "финальный бонус: к четырём уже имевшимся монетам бросок d6 (выпало 6) добавил ещё шесть", "result": "итого десять монет — 100 000 руб., деньги решили разделить поровну на четверых, а не в фонд", "sec": 4590, "who_url": null, "reason_html": "финальный бонус: к четырём уже имевшимся монетам бросок d6 (выпало 6) добавил ещё шесть"}], "totals": [{"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Пэлиас", "actor": "Александр Гудков", "earned": 2, "spent": 1, "img": "img/chars/pelias.webp", "who_url": "/c/pelias/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Цисгендий", "actor": "Даня Поперечный", "earned": 0, "spent": 0, "img": "img/chars/cisgendij.webp", "who_url": "/c/cisgender/", "actor_url": "/p/danila-poperechnyy/"}, {"who": "Альбо", "actor": "Эльдар Джарахов", "earned": 0, "spent": 0, "img": "img/chars/al-bo.webp", "who_url": "/c/albu/", "actor_url": "/p/eldar-dzharahov/"}, {"who": "команда/неизвестно (общие награды)", "actor": null, "earned": 8, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Необычный выпуск: в конце команда решила НЕ отдавать заработанные 100 000 руб. в благотворительность, а поделить между собой («никому не отдавать»). Есть забавный эпизод с монетой, которая сначала перешла к пленнику как плата за освобождение, а затем была отобрана обратно после того, как персонаж его застрелил (спенд и лут в сумме дают ноль). Итоговые 4 монеты до бонуса точно сходятся с суммой отдельных находок (1+2+1)."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, воин (рядовой городской стражи)", "role": "", "fate": "выжил, тяжело ранен", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Пэлиас", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "лесной эльф, следопыт (рядовой стражи)", "role": "", "fate": "выжил", "id": "Пелиас", "url": "/c/pelias/", "img": "img/chars/pelias.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}]}, {"name": "Цисгендий", "actor": "Данила Поперечный", "actor_url": "/p/danila-poperechnyy/", "race": "дварф, монах", "role": "", "fate": "выжил, спас короля", "id": "Цисгендер", "url": "/c/cisgender/", "img": "img/chars/cisgendij.webp", "other": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}, {"key": "14", "label": "14", "title": "Янус доставка"}]}, {"name": "Альбо", "actor": "Эльдар Джарахов", "actor_url": "/p/eldar-dzharahov/", "race": "человек-ликантроп (оборотень-крыса), арбалетчик (рядовой стражи)", "role": "", "fate": "выжил", "id": "Альбо", "url": "/c/albu/", "img": "img/chars/al-bo.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ликантропия в мире ПЧК\">1<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ликантропия в мире ПЧК<\/b> Оборотнем становятся не по наследству, а от укуса. Выжив после укуса оборотня, человек примерно с 50-процентной вероятностью заражается; обращение занимает около двух недель. Дальше три пути: не контролировать себя и превращаться в зверя в полнолуние или при стрессе; научиться контролировать превращение; стать гибридом с промежуточной формой (полукрыса-получеловек), как <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4223\" target=\"_blank\" rel=\"noopener\">1:10:23 ↗<\/a> · <a href=\"#qa16-20\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Король Поний V", "actor": "", "actor_url": null, "race": "", "role": "молодой король Понии, цель покушения", "fate": "ранен, спасён", "id": "Пони V", "url": "/c/korol-poni-v/", "img": "img/chars/ponij-v.webp", "other": [{"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, {"name": "Капитан Мухомор", "actor": "", "actor_url": null, "race": "", "role": "глава городской стражи", "fate": "выжил", "id": "Капитан Мухомор", "url": "/c/kapitan-muhomor/", "img": "img/chars/kapitan-muhomor.webp", "other": [{"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}]}, {"name": "Диана", "actor": "", "actor_url": null, "race": "", "role": "контрабандистка, 200-летняя эльфийка-фехтовальщица", "fate": "выжила", "id": "Диана", "url": "/c/diana/", "img": "img/chars/diana.webp", "other": [{"key": "14", "label": "14", "title": "Янус доставка"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Диана в «Барсуке» — пасхалка художниц к 8-му выпуску\">2<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Диана в «Барсуке» — пасхалка художниц к 8-му выпуску<\/b> Эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> из 8-го выпуска на иллюстрации бара «Барсук» — пасхалка от художниц: она «постоянно сидит в «Барсуке»» и, судя по всему, отошла от истории с крысой в штанах. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2307\" target=\"_blank\" rel=\"noopener\">0:38:27 ↗<\/a> · <a href=\"#qa20-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кто был на собрании преступной верхушки\">4<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кто был на собрании преступной верхушки<\/b> Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12). <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 ↗<\/a> · <a href=\"#qa29-21\">к записи<\/a><\/span><\/span>"}, {"name": "Нейт", "actor": "", "actor_url": null, "race": "", "role": "торговец «Мир хлопка», заговорщик", "fate": "выжил", "id": "Нейт", "url": "/c/neyt/", "img": "img/chars/nejt.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Нейт был стукачом стражи, Янус высосал его душу\">3<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Нейт был стукачом стражи, Янус высосал его душу<\/b> Господин <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a>, торговец пижамами из «Мира хлопка» и участник заговора против короля (вып. 8), сидел в тюрьме. Его выпустили в обмен на сотрудничество со стражей, и на собрание он пришёл с записывающим камнем. <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> его вычислил и в несыгранной катсцене высосал из него душу душесосом. Нейт погиб до взрыва, а не при нём. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a> в списке «вероятно, погибли при взрыве» — по словам авторов, его ещё до взрыва казнил <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>: высосал душу душесосом, разоблачив как осведомителя стражи.<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4399\" target=\"_blank\" rel=\"noopener\">1:13:19 ↗<\/a> · <a href=\"#qa29-18\">к записи<\/a><\/span><\/span>"}, {"name": "Офицер городской стражи", "actor": "", "actor_url": null, "race": "", "role": "заговорщик-ксенофоб", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Землекоп", "actor": "", "actor_url": null, "race": "", "role": "закопал порох", "fate": "погиб (убит Альбо)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Отец Диффузория — землекоп из «Покушения на короля»\">6<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Отец Диффузория — землекоп из «Покушения на короля»<\/b> Отец <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> — тот самый землекоп из выпуска 8, который рыл яму под лавкой «Зигзаг», требовал платы и был брошен в клетку городской стражи, где <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> застрелил его из арбалета. Никакой казни на площади не было: Диффузорий героизирует отца, ему просто так рассказали. Это рифма: в выпуске 8 героям нужно было предотвратить покушение на короля, а здесь на него покушались они сами. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep44.md: <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> «мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп» — это версия самого персонажа; на деле его отец — землекоп из #08, застреленный <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> в клетке городской стражи, а не казнённый по приговору.<\/span> <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=7001\" target=\"_blank\" rel=\"noopener\">1:56:41 ↗<\/a> · <a href=\"#qa43-44-31\">к записи<\/a><\/span><\/span>"}, {"name": "Дед-лавочник «Зигзага»", "actor": "", "actor_url": null, "race": "", "role": "заговорщик, хранитель пороха", "fate": "погиб (убит Сфинктерионом)", "id": null, "url": null, "img": null, "other": []}, {"name": "Обезьяна", "actor": "", "actor_url": null, "race": "", "role": "сторож-детонатор пороха", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Экипаж лодки «Янус доставка»", "actor": "", "actor_url": null, "race": "", "role": "стрелки из пушки", "fate": "рулевой ранен; неизвестно", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "02", "label": "2", "title": "Новогоднее приключение", "note_html": "Отсылка к событию в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурге<\/a> «год назад» (родина <a class=\"ref\" href=\"/c/cisgender/\">Цисгендия<\/a>) — предположительно", "dir": "out", "color": "#7D8A84"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "Побег <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a> — продолжение", "dir": "out", "color": "#C8423B"}, {"key": "09", "label": "9", "title": "Человек в железной маске", "note_html": "Предыдущие события ветви <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; побег из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>, откуда же Урс", "dir": "back", "color": "#C8423B"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "<a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> позже — оборотень, офицер стражи в вампирской ветви", "dir": "out", "color": "#B03A7A"}, {"key": "13", "label": "13", "title": "Проклятые роды", "note_html": "<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> позже появляется как королевский гвардеец-монах в ветви <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "14", "label": "14", "title": "Янус доставка", "note_html": "<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> в столичной страже; лодка «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка» и контрабандистка-эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a>", "dir": "back", "color": "#2F84C8"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "Плен <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> на корабле «Чёрный змей»", "dir": "back", "color": "#C8423B"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "note_html": "Солдаты <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> ненавидят другие расы", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Белый бутон расцвёл». — пароль заговорщиков", "«Смерть <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> Пятому! Нам нужен более эффективный менеджер». — манифест", "«Я Наташа». — <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>", "«Мент родился». — <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, вылезая из штанов <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a>", "«Никто не погиб. С Новым годом!»"], "places_html": "<ul>\n<li><b><a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a><\/b> — столица <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>: Дворцовая площадь с елью и магоблокирующей вышкой, бордель «Барсук», лавка «Мир хлопка», обувной магазин «Зигзаг» на проспекте Покушений с пороховой пещерой, горбатый мост через канал, парк.<\/li>\n<li><b><a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбург<\/a><\/b> — родина <a class=\"ref\" href=\"/c/cisgender/\">Цисгендия<\/a>. <b><a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a><\/b> — оккупирован <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> (упоминается).<\/li>\n<li>Фракции: городская стража <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>; королевские гвардейцы; заговорщики-ксенофобы («Белый бутон расцвёл», человеческое превосходство над «грязными расами»); контрабандисты («<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка»).<\/li>\n<li>Предметы: тетрадь контрабандиста; план покушения и манифест; 10 бочек пороха; пушка на лодке; клинок <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a> «Острая лесби»; серебряные значки стражи.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>6<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>6<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>3<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>2<\/small><\/button><\/div><article class=\"pnote t-addition\" id=\"qa16-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ликантропия в мире ПЧК<\/b><\/div><p>Оборотнем становятся не по наследству, а от укуса. Выжив после укуса оборотня, человек примерно с 50-процентной вероятностью заражается; обращение занимает около двух недель. Дальше три пути: не контролировать себя и превращаться в зверя в полнолуние или при стрессе; научиться контролировать превращение; стать гибридом с промежуточной формой (полукрыса-получеловек), как <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>.<\/p><blockquote>«у нас оборотень должен укусить обычного человека… есть вероятность примерно 50 процентов, что ты заразишься»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-20\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4223\" target=\"_blank\" rel=\"noopener\">1:10:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-22\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Диана в «Барсуке» — пасхалка художниц к 8-му выпуску<\/b><\/div><p>Эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> из 8-го выпуска на иллюстрации бара «Барсук» — пасхалка от художниц: она «постоянно сидит в «Барсуке»» и, судя по всему, отошла от истории с крысой в штанах.<\/p><blockquote>«это пасхалка от художниц… она постоянно сидит в «Барсуке»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-22\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2307\" target=\"_blank\" rel=\"noopener\">0:38:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa29-18\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Нейт был стукачом стражи, Янус высосал его душу<\/b><\/div><p>Господин <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a>, торговец пижамами из «Мира хлопка» и участник заговора против короля (вып. 8), сидел в тюрьме. Его выпустили в обмен на сотрудничество со стражей, и на собрание он пришёл с записывающим камнем. <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> его вычислил и в несыгранной катсцене высосал из него душу душесосом. Нейт погиб до взрыва, а не при нём.<\/p><blockquote>«Нейта выпустили, потому что он договорился сотрудничать с городской стражей. У него был на теле записывающий камень.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a> в списке «вероятно, погибли при взрыве» — по словам авторов, его ещё до взрыва казнил <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>: высосал душу душесосом, разоблачив как осведомителя стражи.<\/p><p class=\"note\"><a href=\"/pod/qa29/#qa29-18\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4399\" target=\"_blank\" rel=\"noopener\">1:13:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кто был на собрании преступной верхушки<\/b><\/div><p>Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12).<\/p><blockquote>«Это были те же люди, что в списке на заселение? — Нет, там ещё часть людей была дополнительно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-21\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-11\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему мастер сразу сказал Сфинктериону про вышку<\/b><\/div><p>Мастер не дал броска на знание о вышке 5G, потому что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уже дважды сталкивался с такими вышками — в выпусках 5 и 8 — и знает, как они работают. Подсказка при этом прозвучала из зала.<\/p><blockquote>«Сфинктерион два раза с этой вышкой встречался... И в восьмом выпуске, и в пятом выпуске.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-11\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3016\" target=\"_blank\" rel=\"noopener\">0:50:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa43-44-31\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Отец Диффузория — землекоп из «Покушения на короля»<\/b><\/div><p>Отец <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> — тот самый землекоп из выпуска 8, который рыл яму под лавкой «Зигзаг», требовал платы и был брошен в клетку городской стражи, где <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> застрелил его из арбалета. Никакой казни на площади не было: Диффузорий героизирует отца, ему просто так рассказали. Это рифма: в выпуске 8 героям нужно было предотвратить покушение на короля, а здесь на него покушались они сами.<\/p><blockquote>«Диффузорий говорит, что моего отца, честного работягу, просто казнили на главной площади. Так это ему сказали, и всё.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep44.md: <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> «мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп» — это версия самого персонажа; на деле его отец — землекоп из #08, застреленный <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> в клетке городской стражи, а не казнённый по приговору.<\/p><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-31\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=7001\" target=\"_blank\" rel=\"noopener\">1:56:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><\/section>", "chars": {"Диана": {"name": "Диана", "img": "img/chars/diana.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%B8%D0%B0%D0%BD%D0%B0", "summary": "Диана - двухсотлетняя эльфийка контрабандист. Появляется в восьмом выпуске ПЧК.", "infobox": {"Пол": "Женский", "Раса": "Эльф", "Тип": "Неигровой"}, "actors": [], "kind": "npc", "dead": true, "race": "Эльф", "portraits": [], "url": "/c/diana/", "eps": [{"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "14", "label": "14", "title": "Янус доставка"}]}, "Пелиас": {"name": "Пэлиас", "img": "img/chars/pelias.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9F%D1%8D%D0%BB%D0%B8%D0%B0%D1%81", "summary": "Пэ́лиас – лесной эльф, радикальный эколог и веган из земель Вёрджинвальда.
