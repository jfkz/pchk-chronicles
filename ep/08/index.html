<script>window.EPD = {"key": "08", "label": "8", "title": "Покушение на Короля", "date": "2021-12-31", "minutes": 78, "duration": 4671.0, "video_id": "crGNVtAMH7c", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Столица Кёнигпон в канун Нового года: бордель «Барсук», Дворцовая площадь, магазин «Зигзаг», мост через канал", "short_html": "Новогодний выпуск: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a>, бежавшие из Фогельнеста, служат рядовыми в городской страже Кёнигпона и вместе с дварфом-монахом <a class=\"ref\" href=\"/c/cisgender/\">Цисгендером<\/a> и оборотнем-крысой <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> должны предотвратить покушение на короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a>. Через контрабандистку <a class=\"ref\" href=\"/c/diana/\">Диану<\/a> и торговца <a class=\"ref\" href=\"/c/neyt/\">Нейта<\/a> они выходят на заговор людей-ксенофобов и обезвреживают склад пороха под магазином «Зигзаг». Пушку на лодке «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка» остановить не удаётся, и карету короля взрывают на мосту. Цисгендер вытаскивает раненого короля в канал, Пелиас исцеляет его — король спасён, все герои живы.", "summary_html": "Новогодний выпуск. После побега из Фогельнеста <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a> поступили в городскую стражу столицы Кёнигпон; вместе с дварфом-монахом <a class=\"ref\" href=\"/c/cisgender/\">Цисгендером<\/a> и рядовым-крысолюдом <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> они получают задание предотвратить покушение на короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a>, который в канун Нового года едет зажигать ель на Дворцовой площади. Через контрабандистку <a class=\"ref\" href=\"/c/diana/\">Диану<\/a> из борделя «Барсук» и лавку «Мир хлопка» они выходят на заговор людей-ксенофобов («Белый бутон расцвёл»), уничтожают склад пороха под обувной лавкой «Зигзаг», но не успевают остановить пушку на лодке «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка». Карету короля взрывают на мосту, однако Цисгендер вытаскивает раненого короля и прыгает с ним в канал, Пелиас его лечит — король спасён, никто из героев не погиб.", "outcome_html": "Покушение на короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a> сорвано, все герои выжили; заговорщики разбежались и остались на свободе.", "world_html": ["<a class=\"ref\" href=\"/c/korol-poni-v/\">Король Пони V<\/a> пережил покушение на мосту в канун Нового года", "Раскрыт заговор людей-ксенофобов против короля и «грязных рас», проникший в городскую стражу", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a>, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> и <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> заслужили благодарность короля"], "scenes": [{"t": "0:00:09", "sec": 9, "html": "Рекап: год назад в северном Кальтенбруне (<a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a>) ударом ноги раскроил кому-то череп; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a> бежали из Фогельнеста; в канун Нового года судьба свела их с Цисгендером в столице."}, {"t": "0:04:28", "sec": 268, "html": "Рекламная сценка из преисподней (бесы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучино<\/a> и <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, реклама фильма)."}, {"t": "0:08:48", "sec": 528, "html": "Кёнигпон — столица Понии на островах в дельте реки; зима, каналы не замерзают. На Дворцовой площади ель, которую должен зажечь молодой король <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a>, едущий из загородной резиденции."}, {"t": "0:09:52", "sec": 592, "html": "Герои: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не может вернуться в оккупированный <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> Вирджинвальд и служит в страже, чтобы заслужить уважение короля; <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a> с ним; <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> — дварф-монах из Кальтенбруна; <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> — ликантроп, умеющий превращаться в крысу, застрявший в звании рядового и мечтающий стать офицером."}, {"t": "0:14:11", "sec": 851, "html": "Капитан стражи Мухомор: заговорщики хотят убить короля по дороге; контрабандистка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> что-то знает — найти её в борделе «Барсук»."}, {"t": "0:15:16", "sec": 916, "html": "Фейс-контроль не пускает «стриптизёров-копов», их отправляют к чёрному ходу. <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, освежившись конфетами, соблазняет повара-мясника поцелуем — тот пускает их."}, {"t": "0:20:36", "sec": 1236, "html": "Кухня: повар выгоняет героев («<a class=\"ref\" href=\"/c/diana/\">Диана<\/a> — лесбиянка, мужиков бы не вызвала»). В зале <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a>, притворяясь бардом, выходит к Диане — 200-летней эльфийке-фехтовальщице с клинком «Острая лесби»."}, {"t": "0:25:58", "sec": 1558, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в VIP-комнате пытается развести пьяную компанию, ловит брошенную бутылку и показывает значок — напуганные посетители откупаются монетой («не надо повторения тех событий»)."}, {"t": "0:28:04", "sec": 1684, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> («Я Наташа») пытаются допросить <a class=\"ref\" href=\"/c/diana/\">Диану<\/a>, она угрожает мечом. <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> в облике крысы заползает ей в штаны; Диана роняет сумку, Цисгендер её уносит. Альбу доводит Диану до обморока (крит), затем превращается в человека прямо в её штанах — «мент родился» — и выходит с помощью значка."}, {"t": "0:36:36", "sec": 2196, "html": "В сумке — две монеты и тетрадь контрабандиста: 10 бочек пороха проданы господину <a class=\"ref\" href=\"/c/neyt/\">Нейту<\/a> из лавки «Мир хлопка» на Дворцовой площади."}, {"t": "0:36:36", "sec": 2196, "html": "Рекламная вставка: эльф-торговец Додис предлагает артефакт с Windows 11; «сгинешь, как <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a>… Кукушкин жив, он вернётся в будущих сериях»."}, {"t": "0:39:52", "sec": 2392, "html": "Дворцовая площадь, «самое безопасное место в столице»: вышка блокирует магию, дворец охраняют королевские гвардейцы. <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, превратившись в полукрысу у всех на глазах, по приказу офицера стражи брошен в клетку."}, {"t": "0:44:12", "sec": 2652, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> давит на <a class=\"ref\" href=\"/c/neyt/\">Нейта<\/a>; вмешивается тот же офицер — оказывается, он из заговорщиков. Сфинктерион выдаёт себя за «мозг операции»; офицер-ксенофоб говорит пароль «Белый бутон расцвёл» и уходит."}, {"t": "0:47:22", "sec": 2842, "html": "<a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a> подтверждает: на площади ничего нет, порох «на точках на пути», цель ликвидируют «на подъезде»; отдаёт копию плана и манифест. Землекопа, требующего платы, стража уводит в клетку к <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>."}, {"t": "0:50:37", "sec": 3037, "html": "Манифест: король <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a> слаб, «существа грязных рас наводнили столицу», смерть Пони V. В клетке пьяный землекоп рассказывает <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, что закопал все 10 бочек под магазином «Зигзаг» на проспекте Покушений; украв монету, развязывает Альбу — тот убивает его из ручного арбалета, а затем крысой сбегает, пока стражник проверяет труп."}, {"t": "0:54:53", "sec": 3293, "html": "Лавка «Зигзаг» (берцы и ортопедические стельки, «только для людей»). По плану два места: пушка у моста и порох под магазином (9 бочек, десятая — для пушки). <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мечом убивает деда-лавочника, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> не даёт ему дёрнуть верёвку-детонатор."}, {"t": "1:01:21", "sec": 3681, "html": "В пороховой пещере под люком — обезьяна с колокольчиком-детонатором; <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a> говорит с ней, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> убивает её дубиной. Верёвку перерезают, люк заваливают берцами и трупом деда."}, {"t": "1:04:34", "sec": 3874, "html": "Горбатый мост, королевская карета въезжает под фанфары. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бросает <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> на жёлтую грузовую лодку «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка» с пушкой под тентом; Альбу ранит рулевого, гребцы ранят Альбу, рулевой поджигает фитиль."}, {"t": "1:07:48", "sec": 4068, "html": "Выстрел: бомба попадает в карету, мост в синем дыму, гвардейцы и лошади мертвы. <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> (крит интеллекта) чувствует всё сквозь дым, хватает раненого короля и прыгает с ним в зимний канал."}, {"t": "1:11:01", "sec": 4261, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> кричит «король у меня!» и отвлекает заговорщиков — их бомбы наносят ему 17 урона, он прыгает в воду. <a class=\"ref\" href=\"/c/pelias/\">Пелиас<\/a> прыгает за <a class=\"ref\" href=\"/c/cisgender/\">Цисгендером<\/a> и исцеляет короля."}, {"t": "1:13:09", "sec": 4389, "html": "<a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a> бегом по стенам набережной уносит короля в парк; <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> мёрзнет в воде и прячется под мостом."}, {"t": "1:15:17", "sec": 4517, "html": "Заговорщики разбегаются; гвардейцы сопровождают героев и короля во дворец, король благодарит. Никто из героев не погиб; 10 монет (100 000 руб.) — игроки в шутку «делят на четверых»."}], "key_events": [{"t": "0:14:11", "sec": 851}, {"t": "0:28:04", "sec": 1684}, {"t": "0:36:36", "sec": 2196}, {"t": "0:44:12", "sec": 2652}, {"t": "0:52:46", "sec": 3166}, {"t": "0:58:06", "sec": 3486}, {"t": "1:05:38", "sec": 3938}, {"t": "1:07:48", "sec": 4068}, {"t": "1:09:55", "sec": 4195}, {"t": "1:15:17", "sec": 4517}], "coins": {"ep": "08", "events": [{"t": "0:28:02", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "напуганные пьяницы в баре, приняв персонажа за полицейского, откупились золотой монетой из кошелька", "result": null, "sec": 1682, "who_url": null, "reason_html": "напуганные пьяницы в баре, приняв персонажа за полицейского, откупились золотой монетой из кошелька"}, {"t": "0:33:26", "kind": "earn", "who": "Пелиас", "actor": "Гудков", "to": null, "reason": "проверил сумку Дианы, пока она была в туалете, нашёл две золотые монеты и тетрадь контрабандиста", "result": null, "sec": 2006, "who_url": "/c/pelias/", "reason_html": "проверил сумку <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a>, пока она была в туалете, нашёл две золотые монеты и тетрадь контрабандиста"}, {"t": "0:52:46", "kind": "spend", "who": "Пелиас", "actor": "Гудков", "to": null, "reason": "у персонажа при обыске пленник-алкаш вытащил из кармана золотую монету в качестве платы за то, чтобы его развязали", "result": null, "sec": 3166, "who_url": "/c/pelias/", "reason_html": "у персонажа при обыске пленник-алкаш вытащил из кармана золотую монету в качестве платы за то, чтобы его развязали"}, {"t": "0:54:54", "kind": "loot", "who": "Пелиас", "actor": "Гудков", "to": null, "reason": "выстрелил пленнику в глаз и забрал у мёртвого тела ранее отданную монету обратно", "result": null, "sec": 3294, "who_url": "/c/pelias/", "reason_html": "выстрелил пленнику в глаз и забрал у мёртвого тела ранее отданную монету обратно"}, {"t": "0:57:02", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "персонаж-монах получил монету за сообразительность — разгадал по рисунку план заговорщиков (пушка и порох)", "result": null, "sec": 3422, "who_url": null, "reason_html": "персонаж-монах получил монету за сообразительность — разгадал по рисунку план заговорщиков (пушка и порох)"}, {"t": "1:16:25", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "финальный бонус: к четырём уже имевшимся монетам бросок d6 (выпало 6) добавил ещё шесть", "result": "итого десять монет — 100 000 руб., деньги решили разделить поровну на четверых, а не в фонд", "sec": 4585, "who_url": null, "reason_html": "финальный бонус: к четырём уже имевшимся монетам бросок d6 (выпало 6) добавил ещё шесть"}], "totals": [{"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Пелиас", "actor": "Гудков", "earned": 2, "spent": 1, "img": "img/chars/pelias.webp", "who_url": "/c/pelias/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Цисгендер", "actor": "Поперечный", "earned": 0, "spent": 0, "img": "img/chars/cisgendij.webp", "who_url": "/c/cisgender/", "actor_url": "/p/danila-poperechnyy/"}, {"who": "Альбу", "actor": "Джарахов", "earned": 0, "spent": 0, "img": "img/chars/al-bo.webp", "who_url": "/c/albu/", "actor_url": null}, {"who": "команда/неизвестно (общие награды)", "actor": null, "earned": 8, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Необычный выпуск: в конце команда решила НЕ отдавать заработанные 100 000 руб. в благотворительность, а поделить между собой («никому не отдавать»). Есть забавный эпизод с монетой, которая сначала перешла к пленнику как плата за освобождение, а затем была отобрана обратно после того, как персонаж его застрелил (спенд и лут в сумме дают ноль). Итоговые 4 монеты до бонуса точно сходятся с суммой отдельных находок (1+2+1)."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, воин (рядовой городской стражи)", "role": "", "fate": "выжил, тяжело ранен", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", ащение в Верджинвальд", "note_html": "Плен <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> на корабле «Чёрный змей»", "dir": "back", "color": "#C8423B"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "note_html": "Солдаты Геленбурга ненавидят другие расы", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Белый бутон расцвёл». — пароль заговорщиков", "«Смерть Пони Пятому! Нам нужен более эффективный менеджер». — манифест", "«Я Наташа». — <a class=\"ref\" href=\"/c/cisgender/\">Цисгендер<\/a>", "«Мент родился». — <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, вылезая из штанов <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a>", "«Никто не погиб. С Новым годом!»"], "places_html": "<ul>\n<li><b>Кёнигпон<\/b> — столица Понии: Дворцовая площадь с елью и магоблокирующей вышкой, бордель «Барсук», лавка «Мир хлопка», обувной магазин «Зигзаг» на проспекте Покушений с пороховой пещерой, горбатый мост через канал, парк.<\/li>\n<li><b>Кальтенбрун<\/b> — родина <a class=\"ref\" href=\"/c/cisgender/\">Цисгендера<\/a>. <b>Вирджинвальд<\/b> — оккупирован <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> (упоминается).<\/li>\n<li>Фракции: городская стража Кёнигпона; королевские гвардейцы; заговорщики-ксенофобы («Белый бутон расцвёл», человеческое превосходство над «грязными расами»); контрабандисты («<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставка»).<\/li>\n<li>Предметы: тетрадь контрабандиста; план покушения и манифест; 10 бочек пороха; пушка на лодке; клинок <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a> «Острая лесби»; серебряные значки стражи.<\/li>\n<\/ul>", "chars": {"Диана": {"name": "Диана", "img": "img/chars/diana.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%B8%D0%B0%D0%BD%D0%B0", "summary": "Диана - двухсотлетняя эльфийка контрабандист. Появляется в восьмом выпуске ПЧК.", "infobox": {"Пол": "Женский", "Раса": "Эльф", "Тип": "Неигровой"}, "actors": [], "kind": "npc", "dead": true, "race": "Эльф", "portraits": [],
