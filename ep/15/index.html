<script>window.EPD = {"anim": false, "key": "15", "label": "15", "title": "Возвращение в Верджинвальд", "date": "2023-01-28", "minutes": 94, "duration": 5622.0, "video_id": "_gltEGto2U4", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Замок Вирджинвальд (усыпальница Лёвенхартов, конюшня, башня баронессы, верхний двор)", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> возвращается в оккупированный <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>, чтобы сорвать свадьбу наместника <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с проклятой баронессой.", "summary_html": "Новогодний выпуск. После гибели барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> в Шиш-Кебабе <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с Щитом Тёмного Властелина, телом отца и его привязанным к щиту призраком, крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> (заговорившей благодаря щиту), братом-кентавром <a class=\"ref\" href=\"/c/princ-konskiy/\">Конским<\/a> и полуорком <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a> тайно проникает в оккупированный замок <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>. Там молодой наместник <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> Крохар фон Делиз готовится к свадьбе с проклятой и спившейся матерью Сфинктериона баронессой <a class=\"ref\" href=\"/c/izabella/\">Изабеллой<\/a>. Герои через фамильную усыпальницу и конюшню проникают в замок, устраивают хаос с лошадьми, крысы выносят баронессу, а поцелуй Эдварда (в теле пиратского капитана, взорвавшего «Чёрного змея») снимает с неё проклятие. Партизаны штурмуют замок; наместник оказывается демоном и развеивает призрак Эдварда, но крысы зажигают священную новогоднюю ель, и её свет уничтожает демона. Сфинктериона коронуют, Чрездевиц женится на эльфийке Гале, Эдварда хоронят, а Сфинктерион объявляет демократию и «честные выборы», на которых становится президентом.", "outcome_html": "<a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a> освобождён от <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, наместник-демон уничтожен, <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> похоронен. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> правит Вирджинвальдом как «избранный» президент.", "world_html": ["<a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a> освобождён от оккупации <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "Наместник <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> был демоном — подтверждение союза Властона с демонами", "<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард<\/a> окончательно упокоен в родовой усыпальнице", "В <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальде<\/a> введена «демократия», <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — президент", "<a class=\"ref\" href=\"/c/izabella/\">Баронесса Изабелла<\/a> освобождена от проклятия"], "scenes": [{"t": "0:01:17", "sec": 77, "html": "Предыстория: <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a> захвачен <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>, барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> был в плену на пиратском корабле «Чёрный змей»; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> освободил его, корабль взорвался; затем они выкрали в Шиш-Кебабе у халифа <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>; в походе погибли Эдвард и эльф <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> (тело Пэлиаса осталось в пустыне, его оплакивала крыса)."}, {"t": "0:04:54", "sec": 294, "html": "Вводная: канун Нового года, в замке свадьба нового наместника Крохара фон Делиза и баронессы <a class=\"ref\" href=\"/c/izabella/\">Изабеллы<\/a> (весть о гибели <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> при взрыве корабля в Гнилой Гавани сделала её вдовой). Представление: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> (последний мужчина рода, везёт тело отца), призрак Эдварда (щит питает его; если тело не похоронить в родовой усыпальнице за пару дней, он станет злым призраком), <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (добралась из Шиш-Кебаба до друзей <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>, щит даёт ей человеческую речь), <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> (внебрачный сын Эдварда и королевы кентавров, у него горн для вызова партизан), <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> (лидер партизан, бард)."}, {"t": "0:10:07", "sec": 607, "html": "Лодка по тёплой подземной реке через секретный грот под северной стеной. Призрак <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> проходит сквозь валун и вселяется в солдата <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. В усыпальнице Лёвенхартов двое солдат и жрец Властона пытаются вскрыть саркофаг прадеда Дениса Лёвенхарта."}, {"t": "0:14:46", "sec": 886, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в теле солдата не может отойти от щита дальше чем на 20 м; изображает, что ему надо по нужде, и садится в озеро. <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> ударом копыт скатывает валун — Эдвард-солдат чудом уворачивается (двойная «критическая удача»)."}, {"t": "0:17:17", "sec": 1037, "html": "Бой: <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> швыряет <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> на шею жрецу, та перекусывает ему вену; солдат случайно добивает жреца своим мечом. <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> стреляет из лука, Конский насаживает солдата на копьё, последний убит из ручного арбалета. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> допрашивает очнувшегося солдата (они просто грабили золото с покойников) и убивает его."}, {"t": "0:24:41", "sec": 1481, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> берёт у жреца амулет, который обжигает его, — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> надевает этот святой амулет. Две золотые монеты с глаз Дениса. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> чует запах конского навоза; за водопадом тайный проход. Тело Эдварда оставляют в усыпальнице."}, {"t": "0:28:13", "sec": 1693, "html": "Рекламная вставка: «эксклюзивное интервью» с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> (бежала через пустыню, работала юнгой, сделала татуировку, слухи о романе с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>)."}, {"t": "0:31:41", "sec": 1901, "html": "Люк в конюшню: призрак пугает лошадь Звёздочку и получает копытом. <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> в резиновой маске лошади вылезает, принимает «модельную позу» — очарованный конюх <a class=\"ref\" href=\"/c/teodor/\">Теодор<\/a>. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> вселяется в Теодора."}, {"t": "0:38:46", "sec": 2326, "html": "Спор о плане, «децентрализованное голосование»; зал поддерживает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>. Пишут баронессе записку «от главврача <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>» о вакцинации от «лошадиной оспы» в конюшне; Лариса несёт её в сворачивающейся трубочке."}, {"t": "0:43:18", "sec": 2598, "html": "Путь <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>: нижний двор с фонтаном-львом «Сильная струя — сильная страна» (цитата <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>), дом прислуги, тронный зал с гостями (критическая скрытность), башня баронессы. <a class=\"ref\" href=\"/c/izabella/\">Изабелла<\/a> пьяна, служанки одевают её в свадебное платье. Лариса пишет хвостом вином «Сын жив тут, в конюшне», но баронесса считает, что сын погиб на «Чёрном змее»; служанка ранит Ларису кинжалом. Лариса призывает рой из семи крыс."}, {"t": "0:53:48", "sec": 3228, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>-<a class=\"ref\" href=\"/c/teodor/\">Теодор<\/a> выпускает лошадей; <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> одним зарядом Щита дарует лошади речь и приказом заставляет её бегать по главному залу с криком «<a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> — петух!». Табун громит зал."}, {"t": "0:57:30", "sec": 3450, "html": "В доме прислуги <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> встречает свою возлюбленную эльфийку Галу (у него её портрет); она обижена, что он исчез на полтора года. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уговаривает её, обещая им свадьбу."}, {"t": "1:00:15", "sec": 3615, "html": "Врывается пиратский капитан, обгаженный лошадью, и оглушает <a class=\"ref\" href=\"/c/teodor/\">Теодора<\/a>. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> со второй попытки (монета и песня <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a>) вселяется в капитана — это тот самый пират, что стрелял по ним и взорвал «Чёрного змея». Герои переодеваются в одежду прислуги; <a class=\"ref\" href=\"/c/gala/\">Гала<\/a> просит Чрездевица зажечь главную ёлку, которую наместник запретил зажигать."}, {"t": "1:04:55", "sec": 3895, "html": "Под прикрытием хаоса герои поднимаются в каминный зал. Крысы, забравшись под юбку, выносят хохочущую баронессу вниз."}, {"t": "1:07:48", "sec": 4068, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> проводит «экзорцизм» (давит на живот, её тошнит вином), а <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в теле капитана целует её. Баронесса возмущена: «Я никогда бы не позволила, кроме Эдварда» — проклятие снято."}, {"t": "1:10:33", "sec": 4233, "html": "<a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> трубит в горн с балкона: партизаны взрывают главные ворота, в толпе переодетые повстанцы нападают на солдат. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> объясняет матери, что её целовала душа мужа, и отсекает капитану голову. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> пытается вселиться в сына, но святой амулет его обжигает; Сфинктерион отзывает дух щитом и отдаёт отцу последнее задание — вселиться в наместника и прыгнуть с башни."}, {"t": "1:15:58", "sec": 4558, "html": "Верхний двор: наместник голыми руками вырывает сердца партизанам. <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> «песней паралича» обездвиживает его, но когда <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> пытается вселиться, наместник хватает призрак за руку и развеивает его искрами."}, {"t": "1:18:20", "sec": 4700, "html": "Наместник требует выдать баронессу; кто-то из героев узнаёт в нём того, кого считали мёртвым. Насмешка <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a> не действует; наместник когтями валит Чрездевица (0 ХП)."}, {"t": "1:21:06", "sec": 4866, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет зажечь ёлку некротической молнией, но вспоминает, что её зажигают рычагом в часовне. <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> бросает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> к часовне и получает 11 урона; Сфинктерион некротической молнией щита испепеляет трёх жрецов <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> у рычага."}, {"t": "1:24:28", "sec": 5068, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> не может сдвинуть ржавый рычаг (потрачены последние монеты), но рой из восьми крыс его проворачивает. Ель вспыхивает священным светом — волна прожигает наместника-демона насквозь, он рассыпается в прах; над замком фейерверки."}, {"t": "1:27:26", "sec": 5246, "html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a> стабилизируют; солдаты <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> сдаются. Баронесса коронует <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> «королём <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>». Чрездевиц делает предложение Гале — она соглашается."}, {"t": "1:31:43", "sec": 5503, "html": "Похороны <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> в родовой усыпальнице. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> объявляет отмену монархии, демократию и «честные выборы», на которых фальсифицирует голоса и избирает себя президентом."}], "key_events": [{"t": "0:11:00", "sec": 660}, {"t": "0:17:17", "sec": 1037}, {"t": "0:38:46", "sec": 2326}, {"t": "0:55:10", "sec": 3310}, {"t": "1:02:55", "sec": 3775}, {"t": "1:09:05", "sec": 4145}, {"t": "1:10:33", "sec": 4233}, {"t": "1:18:20", "sec": 4700}, {"t": "1:27:26", "sec": 5246}, {"t": "1:32:40", "sec": 5560}], "coins": {"ep": "15", "events": [{"t": "0:27:04", "kind": "earn", "who": "Лариса", "actor": "Гудков", "to": null, "reason": "пролезла в узкую щель и забрала две золотые монеты со скелета/из саркофага", "result": null, "sec": 1624, "who_url": "/c/krysa-larisa/", "reason_html": "пролезла в узкую щель и забрала две золотые монеты со скелета/из саркофага"}, {"t": "0:27:10", "kind": "earn", "who": "Чрездевиц", "actor": "SQWOZBAB", "to": null, "reason": "обнаружил тайный проход за водопадом", "result": null, "sec": 1630, "who_url": "/c/cherezdevic/", "reason_html": "обнаружил тайный проход за водопадом"}, {"t": "0:50:49", "kind": "earn", "who": "Лариса", "actor": "Гудков", "to": null, "reason": "получила монету за находчивое сообщение — обмакнула хвост в вино и написала «сын жив в конюшне», чтобы достучаться до пьяной матери", "result": null, "sec": 3049, "who_url": "/c/krysa-larisa/", "reason_html": "получила монету за находчивое сообщение — обмакнула хвост в вино и написала «сын жив в конюшне», чтобы достучаться до пьяной матери"}, {"t": "1:01:52", "kind": "spend", "who": "Барон Эдвард Лёвенхарт", "actor": "Кукушкин", "to": null, "reason": "потратил монету на переброс проверки вселения духа в тело пиратского капитана (первый бросок дал только 7)", "result": "с учётом вдохновения барда переброс удался — Эдвард вселился в капитана", "sec": 3712, "who_url": "/c/baron-edvard/", "reason_html": "потратил монету на переброс проверки вселения духа в тело пиратского капитана (первый бросок дал только 7)"}, {"t": "1:14:35", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "нашёл находчивое решение — использовал кулон, управляющий духом отца, вместо почти невозможного броска", "result": null, "sec": 4475, "who_url": "/c/sfinkterion/", "reason_html": "нашёл находчивое решение — использовал кулон, управляющий духом отца, вместо почти невозможного броска"}, {"t": "1:17:32", "kind": "spend", "who": "Чрездевиц", "actor": "SQWOZBAB", "to": null, "reason": "потратил монету на переброс проверки харизмы — песня паралича против наместника", "result": "переброс всё равно не дотянул (14 против мудрости 20), заклинание сработало лишь частично — наместник замер, но не полностью", "sec": 4652, "who_url": "/c/cherezdevic/", "reason_html": "потратил монету на переброс проверки харизмы — песня паралича против наместника"}, {"t": "1:22:07", "kind": "spend", "who": "Конский", "actor": "Мезенцев", "to": null, "reason": "потратил монету на переброс проверки силы после критической неудачи — пытался закинуть крысу Ларису пинком к часовне", "result": "переброс дал 16 в сумме — удалось, Лариса долетела до наместника", "sec": 4927, "who_url": "/c/princ-konskiy/", "reason_html": "потратил монету на переброс проверки силы после критической неудачи — пытался закинуть крысу <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> пинком к часовне"}, {"t": "1:24:42", "kind": "spend", "who": "Лариса", "actor": "Гудков", "to": null, "reason": "потратила последнюю монету партии на переброс проверки силы, чтобы сдвинуть рычаг и зажечь ёлку разрядом из щита", "result": "переброс дал 9 в сумме — рычаг удалось сдвинуть", "sec": 5082, "who_url": "/c/krysa-larisa/", "reason_html": "потратила последнюю монету партии на переброс проверки силы, чтобы сдвинуть рычаг и зажечь ёлку разрядом из щита"}, {"t": "1:30:54", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "по традиции получили бонусные монеты за прохождение приключения (новичок за столом бросил d6)", "result": "выпало 2 — итого 2 золотые монеты (20 000 руб.)", "sec": 5454, "who_url": null, "reason_html": "по традиции получили бонусные монеты за прохождение приключения (новичок за столом бросил d6)"}], "totals": [{"who": "Лариса", "actor": "Гудков", "earned": 3, "spent": 1, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Чрездевиц", "actor": "SQWOZBAB", "earned": 1, "spent": 1, "img": "img/chars/chrezdevic.webp", "who_url": "/c/cherezdevic/", "actor_url": "/p/sqwozbab/"}, {"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Барон Эдвард Лёвенхарт", "actor": "Кукушкин", "earned": 0, "spent": 1, "img": "img/chars/edvard-lyovenhart.webp", "who_url": "/c/baron-edvard/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Конский", "actor": "Мезенцев", "earned": 0, "spent": 1, "img": "img/chars/konskij.webp", "who_url": "/c/princ-konskiy/", "actor_url": "/p/evgeniy-mezencev/"}], "notes": "Мастер отмечает как \"традицию\", что партия ни разу не закончила игру с монетами на руках — все найденные и заработанные монеты уходят на переброски по ходу сюжета. Барон Эдвард в этом выпуске — призрак, вселяющийся в тела NPC."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, воин", "role": "", "fate": "выжил, стал королём, затем «президентом» Вирджинвальда", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "По
