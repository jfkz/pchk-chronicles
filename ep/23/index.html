<script>window.EPD = {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "date": "2024-01-04", "minutes": 107, "duration": 6419.0, "video_id": "OH7j8SbgBJI", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Столица (остров Принцессы Ирины, западный мост, пригород) и поместье «Гнездо кукушки» к северу от города", "short_html": "Объявленный вне закона клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> вместе с оборотнями едет в поместье «Гнездо кукушки», чтобы пробудить <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> — жену и врага убитого ими графа Влада. Через ночной город отряд прорывается хаотично: зачарованный комендант, протараненный кораблём мост, драка со стражей и лаз контрабандистов. В поместье, ставшем монастырём Святой Бьянки, герои вскрывают саркофаг и кровью пленника пробуждают Бьянку. Она сжигает прилетевшего члена Высшего совета Флориана со стражей и становится союзницей клана.", "summary_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> объявлен Высшим советом вампиров вне закона за убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. Дан Балан находит в старых свитках историю <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки Сосунеску<\/a> — жены и врага Влада, заточённой им в саркофаг в поместье «Гнездо кукушки», — и вместе с оборотнями едет её освободить, везя в подарок двух связанных бандитов. Через ночной город отряд прорывается хаотично: чары на коменданте моста, прыжок через протаранённый кораблём мост, скандальная драка со стражей, подземный лаз контрабандистов. В поместье, превращённом фанатиками в монастырь Святой Бьянки, герои вскрывают саркофаг и кровью бандита пробуждают Бьянку. Когда налетает член Высшего совета Флориан с охраной, Бьянка сжигает их огненной стеной и становится союзницей клана.", "outcome_html": "Все герои живы, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> пробуждена и на стороне клана, член совета Флориан уничтожен.", "world_html": ["<a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> пробуждена и выступила против Высшего совета вампиров", "Погиб член Высшего совета Флориан", "Высший совет вампиров ждёт прихода Тёмного Властелина в земной мир и планирует править городом", "Поместье Влада стало монастырём Святой <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки<\/a>; монахи погибли"], "scenes": [{"t": "0:00:02", "sec": 2, "html": "Пролог-легенда: Влад одолел свою суженую <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a>, но не смог её убить из-за вампирского закона и заточил в склепе. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сомневается, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>: «Враг наших врагов станет другом»."}, {"t": "0:02:14", "sec": 134, "html": "Напоминание: клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> уничтожил Бесогона, затем вампира, хотевшего высосать сирот, затем членов Высшего совета; клан вне закона."}, {"t": "0:06:28", "sec": 388, "html": "Завязка: Высший совет приговорил клан к смерти за убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a>, бывший член совета с иными взглядами, заточена мужем в саркофаг в заброшенном поместье «Гнездо кукушки» на утёсе к северу от города; клан объединился с оборотнями, чтобы освободить её."}, {"t": "0:07:33", "sec": 453, "html": "Представление: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (старик, прочёл вампирские хроники); <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — рикша, участвовал в убийстве Влада, клан пьёт только кровь злодеев; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — гибрид вампира и оборотня, жил в Мёртвых топях с болотной возлюбленной Ниной и её детьми, вернулся по зову клана; <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> — оборотень-конюх, превращается в пони, носит волшебную свистульку; <a class=\"ref\" href=\"/c/zhenya/\">Вадженя<\/a> — волчица из древнего рода оборотней, бывшая певица группы «Вер-вульвы», теперь частный детектив и наставница женщин. Оборотней прислали старейшины."}, {"t": "0:16:18", "sec": 978, "html": "Отряд едет на рикше по проспекту острова Принцессы Ирины с гробами и двумя связанными «дарами» — разбойником и убийцей: чтобы пробудить <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a>, её нужно напоить свежей кровью. Пути: по суше через Вирджинвальдские ворота или по воде через Рыбачьи острова (текущая вода разъедает вампиров как кислота). Выбирают сушу, <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> в облике пони тянет повозку."}, {"t": "0:20:52", "sec": 1252, "html": "У башни западного моста стража: ворота закрыты до утра, комендант Седрик не разрешит. Герои выдают себя за артистов, едущих на «Евровидение», <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> поёт. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> за очко крови гипнотизирует Седрика, пони шепчет ему «Опусти мост» — тот опускает только свою половину."}, {"t": "0:29:29", "sec": 1769, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> летучими мышами перелетают на другую сторону; Дан Балан запутывается в цепях механизма. Легендой про «кредиты» герои отвлекают стражников и опускают вторую половину моста; в этот момент мост таранит корабль."}, {"t": "0:34:54", "sec": 2094, "html": "<a class=\"ref\" href=\"/c/zhenya/\">Вадженя<\/a> верхом на пони, с советом «разозлись», разгоняет повозку, и та перелетает через обломки моста по кораблю; Кукан Яку в полёте ранит арбалетный болт в ягодицу."}, {"t": "0:39:10", "sec": 2350, "html": "В ночном пригороде <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, задержанный стражниками за ложь про кредиты, соблазняет их твёрком, мочится на них (промах), даёт заковать и подвесить себя на фонарь, уговаривает стражников снять штаны и зовёт на помощь."}, {"t": "0:47:46", "sec": 2866, "html": "Бой в подворотне: челюсть-компаньон Кукан Яки «<a class=\"ref\" href=\"/c/prikuslav/\">Прикуслав<\/a>» кусает стражника за пах, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> рвёт другому грудь когтями, <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> «зловонным словесным облаком» травит всех (стражник умирает в луже рвоты), <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> промахивается укусом. Последний стражник убегает со спущенными штанами — Бек летучей мышью догоняет и выпивает его."}, {"t": "1:01:42", "sec": 3702, "html": "За боем подглядывал человек в тёмном капюшоне — <a class=\"ref\" href=\"/c/sniker/\">Сникер<\/a>, продавец подземного лаза для контрабандистов под городской стеной (2 золотых). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> внушением заставляет его показать направление; <a class=\"ref\" href=\"/c/zhenya/\">Вадженя<\/a> в облике волчицы выпивает его и по запаху (после переброса за монету) выводит отряд к амбару с люком."}, {"t": "1:10:19", "sec": 4219, "html": "Отряд разбирает повозку, протаскивает её, гробы и пленников через тоннель за стену и собирает заново (<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> когда-то собирал телеги на конвейере). Дорога мимо полей к поместью."}, {"t": "1:17:49", "sec": 4669, "html": "У поместья <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> ловит в колосьях избитого риэлтора: тот купил поместье <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> за 10 золотых на торгах за долги, но там поселились монахи-фанатики — «монастырь Святой <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки<\/a>». Риэлтора берут с собой как «владельца»."}, {"t": "1:22:02", "sec": 4922, "html": "Поместье перестроено в храм. У шлагбаума отряд выдаёт себя за «службу по ловле еретиков», ведущую еретика-риэлтора на наказание, — монах пропускает."}, {"t": "1:25:19", "sec": 5119, "html": "Вампиры влетают через витражи в храм: колонны, шкаф с плётками и шкаф со швабрами, мраморный саркофаг с женским ликом и нелепая статуя ангела. Монахи застают их у саркофага; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> неудачно превращается в «<a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a>» (крит-провал — глиняный урод с головой лошади), <a class=\"ref\" href=\"/c/zhenya/\">Вадженя<\/a> безуспешно соблазняет монахов постерами."}, {"t": "1:30:45", "sec": 5445, "html": "<a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> бьёт риэлтора головой о саркофаг — крышка сдвигается наполовину; монахи избивают Кукан Яку. Рой челюстей Кукан Яки сдвигает крышку — пронзительный писк из саркофага убивает монахов и оглушает вампиров и <a class=\"ref\" href=\"/c/zhenya/\">Вадженю<\/a> (<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> без сознания, его отпаивают кровью)."}, {"t": "1:35:10", "sec": 5710, "html": "В саркофаге иссохшая вампирша; крови риэлтора мало, нужна свежая живая. Умирающих бандитов подтаскивают к ней; Бек пьёт одного через рану от вил, второго <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> жадно высасывает и обрастает плотью."}, {"t": "1:38:24", "sec": 5904, "html": "<a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> восстаёт: мерзкий муж обрёк её на пытку вечным запахом крови; узнав, что Влад убит, требует ответа, кто «забрал её жертву». <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> предлагает ей стать их королевой."}, {"t": "1:39:27", "sec": 5967, "html": "Сквозь окна влетает стая мышей: член Высшего совета Флориан с тремя вампирами-стражами с серебряными копьями. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> читает <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянке<\/a> «Были танцы» — критический успех: она «подумает» о том, чтобы стать королевой. Флориан объявляет, что в земной мир скоро явится <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, вампиры будут править городом, люди станут рабами и пищей, а клану Балан нет места."}, {"t": "1:43:51", "sec": 6231, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> предлагает <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянке<\/a> свергнуть совет и самим стать советом. Бьянка даёт ему выбор — простить вампиров или убить; он выбирает «сдохли». Бьянка огненной стеной сжигает Флориана и стражу дотла."}, {"t": "1:44:57", "sec": 6297, "html": "Победа: 3 золотые монеты (30 000 руб.) на благотворительность. Эпилог: у героев сильная союзница; смогут ли они одолеть вампирский совет — впереди."}], "key_events": [{"t": "0:06:28", "sec": 388}, {"t": "0:26:17", "sec": 1577}, {"t": "0:37:03", "sec": 2223}, {"t": "0:47:46", "sec": 2866}, {"t": "1:06:01", "sec": 3961}, {"t": "1:19:55", "sec": 4795}, {"t": "1:34:06", "sec": 5646}, {"t": "1:38:24", "sec": 5904}, {"t": "1:41:39", "sec": 6099}, {"t": "1:44:57", "sec": 6297}], "coins": {"ep": "23", "events": [{"t": "0:19:29", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "мастер наградил команду монетой за идею измазать коня грязью, чтобы на въезде в город сойти за бедняков", "result": null, "sec": 1169, "who_url": null, "reason_html": "мастер наградил команду монетой за идею измазать коня грязью, чтобы на въезде в город сойти за бедняков"}, {"t": "0:24:07", "kind": "earn", "who": "Павел Толя", "actor": "Илья Соболев", "to": null, "reason": "удачная шутка о домогательствах охранника к коню (в честь него назвали страну — пони)", "result": null, "sec": 1447, "who_url": "/c/pavel-tolya/", "reason_html": "удачная шутка о домогательствах охранника к коню (в честь него назвали страну — пони)"}, {"t": "1:02:46", "kind": "other", "who": null, "actor": null, "to": null, "reason": "монета выдана не игроку партии, а человеку на сцене/зрителю (Саня) за шутку про сальмонеллу", "result": null, "sec": 3766, "who_url": null, "reason_html": "монета выдана не игроку партии, а человеку на сцене/зрителю (Саня) за шутку про сальмонеллу"}, {"t": "1:08:08", "kind": "spend", "who": "Вадженя", "actor": "Ольга Парфенюк", "to": null, "reason": "потратила монету на переброс проверки (Мудрость/Выживание) — искала запах контрабандиста в оборотнической форме", "result": "успех — нашла едва уловимый запах и взяла след", "sec": 4088, "who_url": "/c/zhenya/", "reason_html": "потратила монету на переброс проверки (Мудрость/Выживание) — искала запах контрабандиста в оборотнической форме"}, {"t": "1:20:56", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "риэлтор рассказывает, что выкупил заброшенное поместье Влада Сосунеско за 10 золотых монет — внутриигровые деньги персонажа, не игровая механика", "result": null, "sec": 4856, "who_url": null, "reason_html": "риэлтор рассказывает, что выкупил заброшенное поместье <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеско<\/a> за 10 золотых монет — внутриигровые деньги персонажа, не игровая механика"}, {"t": "1:24:12", "kind": "earn", "who": "Кукан Яка", "actor": "Денис Кукояка", "to": null, "reason": "успешный обман монаха проверкой Харизмы (выдали себя за ловцов еретиков, привели «пойманного» риэлтора)", "result": "монах поднял шлагбаум и пропустил отряд", "sec": 5052, "who_url": "/c/kukanyaka/", "reason_html": "успешный обман монаха проверкой Харизмы (выдали себя за ловцов еретиков, привели «пойманного» риэлтора)"}, {"t": "1:31:51", "kind": "spend", "who": "Кукан Яка", "actor": "Денис Кукояка", "to": null, "reason": "потратил монету на переброс проверки Силы, чтобы толкнуть риэлтора головой на крышку саркофага", "result": "успех — крышка саркофага сдвинулась", "sec": 5511, "who_url": "/c/kukanyaka/", "reason_html": "потратил монету на переброс проверки Силы, чтобы толкнуть риэлтора головой на крышку саркофага"}, {"t": "1:40:32", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "потратил монету на дополнительный (красный) кубик к проверке Убеждения Бьянки перед атакой вампирского сов
