<script>window.EPD = {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров", "date": "2024-06-29", "minutes": 93, "duration": 5583.0, "video_id": "xPJ5DFEw1L0", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Лагерь мигрантов у гномьего города Змей Хрустальный и дорога в город", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> узнаёт о плане высшего вампирского совета «Чёрное небо» — взорвать вулкан Нергал и закрыть пеплом солнце над Понией на месяц; взрыватели должен передать гном-вампир <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> в Змее Хрустальном. Герои убивают гномью стражу в лагере мигрантов, добывают паспорта и колпаки и присоединяются к заговору полуорка <a class=\"ref\" href=\"/c/kristof/\">Кристофа<\/a> и изобретателя <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a>, у которого есть инструкция к двум умным автоматонам. Антон выбалтывает всё наёмному убийце Пиф-Пафу, тот отменяет операцию, и начинается погоня на паровых повозках. В финале Антон переворачивает машину Пиф-Пафа.", "summary_html": "После гибели Вампир Бека на кровяной фабрике (26) клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> узнаёт о плане высшего вампирского совета «Чёрное небо»: взорвать вулкан Нергал, чтобы пепел на месяц закрыл солнце над восточной и центральной Понией. Взрывчатка у вампиров есть, а взрыватели должен передать в гномьем городе Змей Хрустальный член совета, гном-вампир <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>. Герои пробираются в лагерь мигрантов у города, убивают гномью стражу, добывают колпаки и паспорта и вступают в заговор местных (полуорк <a class=\"ref\" href=\"/c/kristof/\">Кристоф<\/a>, изобретатель <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a>) против Домогайтиса. Но Антон, стоя «на шухере», выбалтывает всё таинственному наёмному убийце гному Пиф-Пафу, тот срывает операцию, и часть заканчивается бешеной погоней на паровых повозках по дороге в город, в которой Антон переворачивает машину Пиф-Пафа.", "outcome_html": "Все герои живы; заговор против Домогайтиса сорван Пиф-Пафом, но клан с паспортами и инструкцией едет в город и перевернул машину убийцы.", "world_html": ["Высший вампирский совет готовит подрыв вулкана Нергал (план «Чёрное небо»)", "<a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> держит мигрантов у Змея Хрустального в рабстве", "В мире существуют починенные умные автоматоны гнома <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>"], "scenes": [{"t": "0:00:30", "sec": 30, "html": "«Ранее»: клан Балан освободил <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a>, вместе они проникли на фабрику крови; в битве со старшими упырями погиб <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a>. Высшие вампиры хотят разбудить древний вулкан и устроить «длинную кровавую ночь»."}, {"t": "0:03:15", "sec": 195, "html": "Завязка: план «Чёрное небо» — подрыв вулкана Нергал; не хватает гномьих взрывателей, их передаст гном-вампир <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> из высшего совета. Задача — найти его и сорвать поставку."}, {"t": "0:03:50", "sec": 230, "html": "Представление персонажей: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> носит прах Вампир Бека в сломанной солевой одноразке внука и надеется его воскресить; Антон взял с собой сына <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикгана<\/a> «сближаться»; Супербигдикган — агрессивный подросток-дампир с серебряной катаной (подарок деда) и эротическими карточками матери <a class=\"ref\" href=\"/c/miramistina/\">Мирамистины<\/a>; <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> — актёр, которого обратила <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a>; он подозревает, что Супербигдикган зачат из его семени (Мирамистина брала его у «банка семени»)."}, {"t": "0:08:40", "sec": 520, "html": "Гробы спрятаны в заброшенной хижине за городом; герои перелетают восточную заставу Змея Хрустального и попадают в лагерь мигрантов и неграждан, который контролирует Домогайтис."}, {"t": "0:09:45", "sec": 585, "html": "Гномья стража с электродубинками и сторожевой таксой избивает полуорка, подозревая в заговоре. <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> неудачно пытается изменить голос, герои «водят хоровод» с песенкой про гномика и нападают; Антон проваливает укус и получает 10 урона от электрошока."}, {"t": "0:15:59", "sec": 959, "html": "Бой: <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> в «подростковой истерике» рубит катаной, <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> не глядя метает два кинжала, рой челюстей <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (Откуслав, Отсослав, Тошнислав, Иригари, <a class=\"ref\" href=\"/c/prikuslav/\">Прикуслав<\/a>) нелетально валит одного гнома, Антон досуха выпивает второго."}, {"t": "0:23:23", "sec": 1403, "html": "Допрос выжившего стражника: Домогайтис сегодня в городе по «очень важным делам»; в город вечером пускают только с паспортом и колпаком. У гномов забирают паспорта (Боньк-Боньк, Дзвеньк-Дзвеньк). <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> просит стражника «потереться щекой» — тот в упор стреляет ему в подбородок из гномьего шокового пистолета (11 урона); пистолет Вампирап забирает."}, {"t": "0:28:42", "sec": 1722, "html": "Трупы закапывают, убедив очнувшегося полуорка, что «нашли их так». <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> распознаёт, что полуорк — заговорщик против Домогайтиса."}, {"t": "0:33:55", "sec": 2035, "html": "Палатка полуорка <a class=\"ref\" href=\"/c/kristof/\">Кристофа<\/a> и его жены <a class=\"ref\" href=\"/c/agniya/\">Агнии<\/a>: под скатертью четыре гномьих колпака, паспорта и набор для подделки документов (Агния подделывает паспорта). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> врёт, что Домогайтис домогался его дочери; Кристоф рассказывает, что Домогайтис этой ночью увёз в город его сестру."}, {"t": "0:45:31", "sec": 2731, "html": "Восьмиугольная палатка изобретателя <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> (беглец из Геленбурга; гномы не дают ему работать, Домогайтис обещал работу, а сделал мигрантов рабами). С ним полуэльф и полурослик в броне. План принадлежит Вилли и гному Пиф-Пафу."}, {"t": "0:50:52", "sec": 3052, "html": "Инструкция к двум «умным автоматонам» (кованым рыцарям) гнома <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>: оживают от телесных жидкостей/биоматериала владельца и принимают его черты; есть «любовная» версия и боевая (огненное дыхание, ракеты), есть режим самоуничтожения. <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> починил их по заказу Пиф-Пафа; автоматоны ждут в гномьих банях. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> загорается идеей залить в автоматона прах Вампир Бека."}, {"t": "0:54:00", "sec": 3240, "html": "Антон, стоявший у входа, замечает крадущегося гнома в капюшоне — знаменитого наёмного убийцу Пиф-Пафа. Пытаясь «непринуждённо» заговорить, он предлагает ему 80 золотых за убийство <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> и выдаёт, что знает про автоматонов."}, {"t": "0:59:19", "sec": 3559, "html": "<a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> наводит пистолет: про автоматонов знает только тот, кто говорил с <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a>. Антон признаётся, что хочет помочь убить Домогайтиса; Пиф-Паф сначала решает, что его прислал член совета Адриану Вурдоласку, но Антон называет «друзей» — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> и клан Балан. Узнав, что Антон из клана Балана, Пиф-Паф исчезает в снопе искр (артефакт телепортации)."}, {"t": "1:05:34", "sec": 3934, "html": "<a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> заглядывает в палатку: «Мужики, отмена. У нас на хвосте клан Балан. Бани отменяются». <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> накрывает палатку магической тьмой, герои уходят с колпаками, паспортами и инструкцией."}, {"t": "1:06:39", "sec": 3999, "html": "Погоня: <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> прыгает в самоходную паровую повозку и таранит шлагбаум; герои выкидывают гнома из другой повозки (<a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> за рулём, Антон летучей мышью на крыше, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> вылетает на повороте и едет на паутине посоха, как на водных лыжах, — повозка оказывается в коконе паутины)."}, {"t": "1:14:03", "sec": 4443, "html": "<a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> подрывает дорогу и сбрасывает на героев воз с брёвнами; Антон с крыши «навигатором» ведёт слепую повозку, <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> на критическом успехе уворачивается от шести брёвен."}, {"t": "1:17:19", "sec": 4639, "html": "У храма семейных ценностей зазывала предлагает «срочный тест на отцовство»; герои на ходу сдают ему «биоматериал» (карточки, плевок), а <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> произносит «Отец не тот, кто родил, а кто воспитал»."}, {"t": "1:20:34", "sec": 4834, "html": "Антон перебирается в машину Пиф-Пафа; <a class=\"ref\" href=\"/c/vampirap/\">Вампирап<\/a> бьёт себя током собственным шоковым пистолетом; <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> двумя критическими провалами попадает из рогатки в отца, затем — камнем в «мочевой пузырь» Пиф-Пафа; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> роняет на дорогу сумку с роем челюстей (они обещают найти его в бане)."}, {"t": "1:30:04", "sec": 5404, "html": "Антон использует «опыт крови» (память выпитого когда-то Доминика Торетто), бьёт по тормозам и выкручивает руль: машина Пиф-Пафа переворачивается, паровой котёл взрывается, Антон и <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> оказываются на мостовой. Конец первой части; тизер второй — бани «Гномский пар», Домогайтис, автоматон в режиме самоуничтожения."}], "key_events": [{"t": "0:03:15", "sec": 195}, {"t": "0:09:45", "sec": 585}, {"t": "0:25:31", "sec": 1531}, {"t": "0:33:55", "sec": 2035}, {"t": "0:50:52", "sec": 3052}, {"t": "0:56:07", "sec": 3367}, {"t": "1:05:34", "sec": 3934}, {"t": "1:06:39", "sec": 3999}, {"t": "1:17:19", "sec": 4639}, {"t": "1:27:54", "sec": 5274}, {"t": "1:30:04", "sec": 5404}], "coins": {"ep": "28a", "events": [{"t": "0:31:51", "kind": "earn", "who": "Супербигдикган", "actor": "Позов", "to": null, "reason": "Проверкой проницательности раскусил, что орк-охранник врёт и является заговорщиком.", "result": null, "sec": 1911, "who_url": "/c/luka-superbigdikgan/", "reason_html": "Проверкой проницательности раскусил, что орк-охранник врёт и является заговорщиком."}, {"t": "0:39:10", "kind": "earn", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "Успешно обманул (с преимуществом) орка, выясняя историю вражды с грязнисом Домогайтисом.", "result": null, "sec": 2350, "who_url": "/c/dan-balan/", "reason_html": "Успешно обманул (с преимуществом) орка, выясняя историю вражды с грязнисом Домогайтисом."}, {"t": "0:52:59", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Придумал шутку — использовать соляную одноразку с прахом погибшего Вампербека как «топливо»/подношение для активации автоматона.", "result": null, "sec": 3179, "who_url": "/c/anton/", "reason_html": "Придумал шутку — использовать соляную одноразку с прахом погибшего Вампербека как «топливо»/подношение для активации автоматона."}, {"t": "1:03:30", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Потратил две монеты подряд на перебросы проверки внимания, пытаясь догнать гнома-наёмника Пивпафа после того, как случайно выдал ему план отряда.", "result": "Не преуспел — Пивпаф телепортировался и скрылся.", "sec": 3810, "who_url": "/c/anton/", "reason_html": "Потратил две монеты подряд на перебросы проверки внимания, пытаясь догнать гнома-наёмника Пивпафа после того, как случайно выдал ему план отряда."}, {"t": "1:10:52", "kind": "earn", "who": "Вампирap", "actor": "Попов", "to": null, "reason": "Спел за рулём во время погони шуточную песню («покойнички, покойнички») — мастер дал монету за динамичность сцены.", "result": null, "sec": 4252, "who_url": null, "reason_html": "Спел за рулём во время погони шуточную песню («покойнички, покойнички») — мастер дал монету за динамичность сцены."}, {"t": "1:18:26", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Получил сразу две монеты за шутку («отец не тот, кто родил, а кто воспитал») и плевок в лицо зазывале теста на отцовство прямо на ходу.", "result": null, "sec": 4706, "who_url": "/c/anton/", "reason_html": "Получил сразу две монеты за шутку («отец не тот, кто родил, а кто воспитал») и плевок в лицо зазывале теста на отцовство прямо на ходу."}, {"t": "1:27:54", "kind": "spend", "who": "Супербигдикган", "actor": "Позов", "to": null, "reason": "Потратил монеты на переброс атаки из рогатки после того, как в предыдущей попытке случайно попал в собственного отца.", "result": "Всё равно не хватило урона, потерял сумку с зубными протезами.", "sec": 5274, "who_url": "/c/luka-superbigdikgan/", "reason_html": "Потратил монеты на переброс атаки из рогатки после того, как в предыдущей попытке случайно попал в собственного отца."}], "totals": [{"who": "Супербигдикган", "actor": "Позов", "earned": 1, "spent": 2, "img": "img/chars/luka.webp", "who_url": "/c/luka-superbigdikgan/", "actor_url": "/p/dmitriy-pozov/"}, {"who": "Дан Балан", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/dan-balan.webp", "who_url": "/c/dan-balan/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Антон", "actor": "Шастун", "earned": 3, "spent": 2, "img": "img/chars/anton.webp", "who_url": "/c/anton/", "actor_url": "/p/anton-shastun/"}, {"who": "Вампирap", "actor": "Попов", "earned": 1, "spent": 0, "img": null, "who_url": null, "actor_url": "/p/arseniy-popov/"}], "notes": "Первая
