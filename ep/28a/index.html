<script>window.EPD = {"anim": false, "key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров", "date": "2024-06-29", "minutes": 93, "duration": 5583.0, "video_id": "xPJ5DFEw1L0", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Лагерь мигрантов у гномьего города Змей Хрустальный и дорога в город", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> внедряется в заговор, чтобы сорвать план «Чёрное небо» — взрыв вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>.", "summary_html": "После гибели <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> на кровяной фабрике (26) клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> узнаёт о плане высшего вампирского совета «Чёрное небо»: взорвать вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>, чтобы пепел на месяц закрыл солнце над восточной и центральной <a class=\"ref\" href=\"/place/poniya/\">Понией<\/a>. Взрывчатка у вампиров есть, а взрыватели должен передать в гномьем городе <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a> член совета, гном-вампир <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>. Герои пробираются в лагерь мигрантов у города, убивают гномью стражу, добывают колпаки и паспорта и вступают в заговор местных (полуорк <a class=\"ref\" href=\"/c/kristof/\">Кристоф<\/a>, изобретатель <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a>) против Домогайтиса. Но Антон, стоя «на шухере», выбалтывает всё таинственному наёмному убийце гному Пиф-Пафу, тот срывает операцию, и часть заканчивается бешеной погоней на паровых повозках по дороге в город, в которой Антон переворачивает машину Пиф-Пафа.", "outcome_html": "Все герои живы; заговор против Домогайтиса сорван Пиф-Пафом, но клан с паспортами и инструкцией едет в город и перевернул машину убийцы.", "world_html": ["Высший вампирский совет готовит подрыв вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> (план «Чёрное небо»)", "<a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> держит мигрантов у Змея Хрустального в рабстве", "В мире существуют починенные умные автоматоны гнома Дон-Дона"], "scenes": [{"t": "0:00:42", "sec": 42, "html": "«Ранее»: клан Балан освободил <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a>, вместе они проникли на фабрику крови; в битве со старшими упырями погиб <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>. Высшие вампиры хотят разбудить древний вулкан и устроить «длинную кровавую ночь»."}, {"t": "0:03:12", "sec": 192, "html": "Завязка: план «Чёрное небо» — подрыв вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>; не хватает гномьих взрывателей, их передаст гном-вампир <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> из высшего совета. Задача — найти его и сорвать поставку."}, {"t": "0:03:53", "sec": 233, "html": "Представление персонажей: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> носит прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> в сломанной солевой одноразке внука и надеется его воскресить; Антон взял с собой сына <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a> «сближаться»; СуперБигДикГан — агрессивный подросток-дампир с серебряной катаной (подарок деда) и эротическими карточками матери <a class=\"ref\" href=\"/c/miramistina/\">Мирамистины<\/a>; <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> — актёр, которого обратила <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a>; он подозревает, что СуперБигДикГан зачат из его семени (Мирамистина брала его у «банка семени»)."}, {"t": "0:08:57", "sec": 537, "html": "Гробы спрятаны в заброшенной хижине за городом; герои перелетают восточную заставу Змея Хрустального и попадают в лагерь мигрантов и неграждан, который контролирует Домогайтис."}, {"t": "0:09:40", "sec": 580, "html": "Гномья стража с электродубинками и сторожевой таксой избивает полуорка, подозревая в заговоре. <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> неудачно пытается изменить голос, герои «водят хоровод» с песенкой про гномика и нападают; Антон проваливает укус и получает 10 урона от электрошока."}, {"t": "0:15:33", "sec": 933, "html": "Бой: <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> в «подростковой истерике» рубит катаной, <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> не глядя метает два кинжала, рой челюстей <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (Откуслав, Отсослав, Тошнислав, Иригари, <a class=\"ref\" href=\"/c/prikuslav/\">Прикуслав<\/a>) нелетально валит одного гнома, Антон досуха выпивает второго."}, {"t": "0:23:19", "sec": 1399, "html": "Допрос выжившего стражника: Домогайтис сегодня в городе по «очень важным делам»; в город вечером пускают только с паспортом и колпаком. У гномов забирают паспорта (Боньк-Боньк, Дзвеньк-Дзвеньк). <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> просит стражника «потереться щекой» — тот в упор стреляет ему в подбородок из гномьего шокового пистолета (11 урона); пистолет Вампидап забирает."}, {"t": "0:28:32", "sec": 1712, "html": "Трупы закапывают, убедив очнувшегося полуорка, что «нашли их так». <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> распознаёт, что полуорк — заговорщик против Домогайтиса."}, {"t": "0:33:50", "sec": 2030, "html": "Палатка полуорка <a class=\"ref\" href=\"/c/kristof/\">Кристофа<\/a> и его жены <a class=\"ref\" href=\"/c/agniya/\">Агнии<\/a>: под скатертью четыре гномьих колпака, паспорта и набор для подделки документов (Агния подделывает паспорта). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> врёт, что Домогайтис домогался его дочери; Кристоф рассказывает, что Домогайтис этой ночью увёз в город его сестру."}, {"t": "0:44:55", "sec": 2695, "html": "Восьмиугольная палатка изобретателя <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> (беглец из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>; гномы не дают ему работать, Домогайтис обещал работу, а сделал мигрантов рабами). С ним полуэльф и полурослик в броне. План принадлежит Вилли и гному Пиф-Пафу."}, {"t": "0:50:36", "sec": 3036, "html": "Инструкция к двум «умным автоматонам» (кованым рыцарям) гнома Дон-Дона: оживают от телесных жидкостей/биоматериала владельца и принимают его черты; есть «любовная» версия и боевая (огненное дыхание, ракеты), есть режим самоуничтожения. <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> починил их по заказу Пиф-Пафа; автоматоны ждут в гномьих банях. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> загорается идеей залить в автоматона прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>."}, {"t": "0:54:00", "sec": 3240, "html": "Антон, стоявший у входа, замечает крадущегося гнома в капюшоне — знаменитого наёмного убийцу Пиф-Пафа. Пытаясь «непринуждённо» заговорить, он предлагает ему 80 золотых за убийство <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> и выдаёт, что знает про автоматонов."}, {"t": "0:58:16", "sec": 3496, "html": "<a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> наводит пистолет: про автоматонов знает только тот, кто говорил с <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a>. Антон признаётся, что хочет помочь убить Домогайтиса; Пиф-Паф сначала решает, что его прислал член совета Адриан Вурдаласку, но Антон называет «друзей» — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> и клан Балан. Узнав, что Антон из клана Балана, Пиф-Паф исчезает в снопе искр (артефакт телепортации)."}, {"t": "1:05:39", "sec": 3939, "html": "<a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> заглядывает в палатку: «Мужики, отмена. У нас на хвосте клан Балан. Бани отменяются». <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> накрывает палатку магической тьмой, герои уходят с колпаками, паспортами и инструкцией."}, {"t": "1:07:14", "sec": 4034, "html": "Погоня: <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> прыгает в самоходную паровую повозку и таранит шлагбаум; герои выкидывают гнома из другой повозки (<a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> за рулём, Антон летучей мышью на крыше, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> вылетает на повороте и едет на паутине посоха, как на водных лыжах, — повозка оказывается в коконе паутины)."}, {"t": "1:14:04", "sec": 4444, "html": "<a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> подрывает дорогу и сбрасывает на героев воз с брёвнами; Антон с крыши «навигатором» ведёт слепую повозку, <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> на критическом успехе уворачивается от шести брёвен."}, {"t": "1:17:15", "sec": 4635, "html": "У храма семейных ценностей зазывала предлагает «срочный тест на отцовство»; герои на ходу сдают ему «биоматериал» (карточки, плевок), а <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> произносит «Отец не тот, кто родил, а кто воспитал»."}, {"t": "1:20:11", "sec": 4811, "html": "Антон перебирается в машину Пиф-Пафа; <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> бьёт себя током собственным шоковым пистолетом; <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> двумя критическими провалами попадает из рогатки в отца, затем — камнем в «мочевой пузырь» Пиф-Пафа; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> роняет на дорогу сумку с роем челюстей (они обещают найти его в бане)."}, {"t": "1:29:46", "sec": 5386, "html": "Антон использует «опыт крови» (память выпитого когда-то Доминика Торетто), бьёт по тормозам и выкручивает руль: машина Пиф-Пафа переворачивается, паровой котёл взрывается, Антон и <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> оказываются на мостовой. Конец первой части; тизер второй — бани «Гномский пар», Домогайтис, автоматон в режиме самоуничтожения."}], "key_events": [{"t": "0:03:12", "sec": 192}, {"t": "0:09:40", "sec": 580}, {"t": "0:26:10", "sec": 1570}, {"t": "0:33:50", "sec": 2030}, {"t": "0:50:36", "sec": 3036}, {"t": "0:56:03", "sec": 3363}, {"t": "1:05:39", "sec": 3939}, {"t": "1:07:14", "sec": 4034}, {"t": "1:17:15", "sec": 4635}, {"t": "1:27:36", "sec": 5256}, {"t": "1:29:46", "sec": 5386}], "coins": {"ep": "28a", "events": [{"t": "0:32:34", "kind": "earn", "who": "СуперБигДикГан", "actor": "Позов", "to": null, "reason": "Проверкой проницательности раскусил, что орк-охранник врёт и является заговорщиком.", "result": null, "sec": 1954, "who_url": "/c/luka-superbigdikgan/", "reason_html": "Проверкой проницательности раскусил, что орк-охранник врёт и является заговорщиком."}, {"t": "0:39:49", "kind": "earn", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "Успешно обманул (с преимуществом) орка, выясняя историю вражды с грязнисом Домогайтисом.", "result": null, "sec": 2389, "who_url": "/c/dan-balan/", "reason_html": "Успешно обманул (с преимуществом) орка, выясняя историю вражды с грязнисом Домогайтисом."}, {"t": "0:53:10", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Придумал шутку — использовать соляную одноразку с прахом погибшего Вампербека как «топливо»/подношение для активации автоматона.", "result": null, "sec": 3190, "who_url": "/c/anton/", "reason_html": "Придумал шутку — использовать соляную одноразку с прахом погибшего Вампербека как «топливо»/подношение для активации автоматона."}, {"t": "1:03:24", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Потратил две монеты подряд на перебросы проверки внимания, пытаясь догнать гнома-наёмника Пивпафа после того, как случайно выдал ему план отряда.", "result": "Не преуспел — Пивпаф телепортировался и скрылся.", "sec": 3804, "who_url": "/c/anton/", "reason_html": "Потратил две монеты подряд на перебросы проверки внимания, пытаясь догнать гнома-наёмника Пивпафа после того, как случайно выдал ему план отряда."}, {"t": "1:10:44", "kind": "earn", "who": "Вампирap", "actor": "Попов", "to": null, "reason": "Спел за рулём во время погони шуточную песню («покойнички, покойнички») — мастер дал монету за динамичность сцены.", "result": null, "sec": 4244, "who_url": null, "reason_html": "Спел за рулём во время погони шуточную песню («покойнички, покойнички») — мастер дал монету за динамичность сцены."}, {"t": "1:18:20", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Получил сразу две монеты за шутку («отец не тот, кто родил, а кто воспитал») и плевок в лицо зазывале теста на отцовство прямо на ходу.", "result": null, "sec": 4700, "who_url": "/c/anton/", "reason_html": "Получил сразу две монеты за шутку («отец не тот, кто родил, а кто воспитал») и плевок в лицо зазывале теста на отцовство прямо на ходу."}, {"t": "1:28:59", "kind": "spend", "who": "СуперБигДикГан", "actor": "Позов", "to": null, "reason": "Потратил монеты на переброс атаки из рогатки после того, как в предыдущей попытке случайно попал в собственного отца.", "result": "Всё равно не хватило урона, потерял сумку с зубными протезами.", "sec": 5339, "who_url": "/c/luka-superbigdikgan/", "reason_html": "Потратил монеты на переброс атаки из рогатки после того, как в предыдущей попытке случайно попал в собственного отца."}], "totals": [{"who": "СуперБигДикГан", "actor": "Позов", "earned": 1, "spent": 2, "img": "img/chars/luka.webp", "who_url": "/c/luka-superbigdikgan/", "actor_url": "/p/dmitriy-pozov/"}, {"who": "Дан Балан", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/dan-balan.webp", "who_url": "/c/dan-balan/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Антон", "actor": "Шастун", "earned": 3, "spent": 2, "img": "img/chars/anton.webp", "who_url": "/c/anton/", "actor_url": "/p/anton-shastun/"}, {"who": "Вампирap", "actor": "Попов", "earned": 1, "spent": 0, "img": null, "who_url": null, "actor_url": "/p/arseniy-popov/"}], "notes": "Первая часть двухсерийного выпуска, обрывается на клиффхэнгере — традиционного благотворительного броска d6 в конце нет (он в части 2). Несколько раз мастер прямо отказывал в монете при критическом провале, который нельзя переб : "Бьянка Сосунеску", "actor": "", "actor_url": null, "race": "", "role": "союзница клана, обратила Вампидапа (упомянута)", "fate": "неизвестно", "id": "Бьянка", "url": "/c/byanka-sosunesku/", "img": "img/chars/b-yanka-sosunesku.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}]}, {"name": "Вампирбек", "actor": "", "actor_url": null, "race": "", "role": "погибший сын Дан Балана, прах в одноразке", "fate": "погиб (ранее)", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}], "links": [{"key": "20", "label": "20", "title": "Вампирское возмездие", "note_html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a>, Антон, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "note_html": "освобождение <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки Сосунеску<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика", "note_html": "гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> на кровяной фабрике", "dir": "out", "color": "#B03A7A"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "note_html": "продолжение: бани «Гномский пар»", "dir": "out", "color": "#B03A7A"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "33", "label": "33", "title": "Зверь Фест", "note_html": "Срыв плана «Чёрное небо», воскрешение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> в теле рыцаря", "dir": "back", "color": "#B03A7A"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Война с Высшим советом, живые челюсти Дана", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["«Гномик, гномик, ты хорош, дам тебе я медный грош» — хоровод перед нападением.", "«Мужики, отмена. У нас на хвосте клан Балан. Бани отменяются» — <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a>.", "«Отец не тот, кто родил, а кто воспитал» — <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>.", "«Откуслав, Отсослав, Тошнислав, Иригари, быстро откусили ногу Пиф-Пафу!»"], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a> (высокотехнологичный гномий город в горной долине), восточная застава, лагерь мигрантов, палатки <a class=\"ref\" href=\"/c/kristof/\">Кристофа<\/a> и <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a>, гномьи бани «Гномский пар» (упомянуты), храм семейных ценностей, вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>.<\/li>\n<li>Фракции: клан Балан; высший вампирский совет; заговорщики лагеря; гномья стража.<\/li>\n<li>Артефакты: два умных автоматона (кованые рыцари) гнома Дон-Дона; гномий шоковый пистолет; колпаки и паспорта; серебряная катана; посох паутины; усиленная рогатка; рой челюстей; солевая одноразка с прахом <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>; телепортирующий артефакт Пиф-Пафа; взрыватели для вулкана (цель).<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>17<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>17<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>5<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>3<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>5<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa26-6\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Следующий вампирский выпуск — 28, без BRB<\/b><\/div><p>Авторы подтвердили, что следующий выпуск вампирской ветки — 28-й. Его играли <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>, <a class=\"ref\" href=\"/p/anton-shastun/\">Антон Шастун<\/a>, <a class=\"ref\" href=\"/p/arseniy-popov/\">Арсений Попов<\/a> и <a class=\"ref\" href=\"/p/dmitriy-pozov/\">Дмитрий Позов<\/a>, без <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, потому что <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> мёртв.<\/p><blockquote>«следующий выпуск вампирской ветки — это двадцать восьмой»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-6\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2123\" target=\"_blank\" rel=\"noopener\">0:35:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-10\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Моторы растянулись до 6–9 часов; 28-й сняли за один мотор<\/b><\/div><p>Выпуск 26 сняли в первом моторе съёмочного пула, и это был один из самых долгих моторов. С 26-го по 30-й выпуски игры шли не меньше шести, а то и девяти часов. Выпуск 28, наоборот, сняли за один мотор.<\/p><blockquote>«начиная с двадцать шестого, двадцать седьмого, двадцать восьмого, двадцать девятого и тридцатого... меньше шести нет уже»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-10\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2774\" target=\"_blank\" rel=\"noopener\">0:46:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa27-27\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Выпуск 28 разделят на две части; к большой ветке готовят финальную битву<\/b><\/div><p>Авторы анонсировали, что выпуск 28 с уже знакомыми персонажами разделят на две части и что кто-то в нём, возможно, умрёт. Большая сюжетная ветка, по их словам, движется к концу, скорее всего к финальной битве, и дальнейшие планы есть.<\/p><blockquote>«Ждите двадцать восьмой выпуск… мы разделим двадцать восьмой выпуск на две части… Скорее всего, будет какая-то финальная битва.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-27\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6506\" target=\"_blank\" rel=\"noopener\">1:48:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск 28 сняли за один мотор и заранее протестировали<\/b><\/div><p>Авторы рассказали, что приключение 28 было полностью готово: сценарий, карты, Бреганов выспался и всё прочитал. В отличие от 26 и 27, которые не успели проверить, его заранее прогнали на тестовой игре в офисной переговорке. Сняли его за один мотор и уже потом разделили на две части.<\/p><blockquote>«Двадцать восьмое приключение тестировалось вот здесь, в комнате, которая находится за этим телевизором… мы её называем переговорка.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-1\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=145\" target=\"_blank\" rel=\"noopener\">0:02:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гудков не знал, вернётся ли BRB, но всё делал, чтобы его посадить за стол<\/b><\/div><p>Авторы рассказали: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> догадывался, что <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> могут воскресить, раз <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал его прах, но не знал, произойдёт ли это в этом выпуске и как. Импровизаторы не знали ничего. Гудков сказал, что все его действия в игре были направлены на то, чтобы <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сел за стол пятым игроком.<\/p><blockquote>«Все мои действия, всё было направлено для того, чтобы его туда посадить, так что я не играл без него.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa28/#qa28-2\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=239\" target=\"_blank\" rel=\"noopener\">0:03:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-3\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Список уязвимостей вампиров<\/b><\/div><p>Авторы перечислили уязвимости вампиров ПЧК: серебро (чем оно чище, тем сильнее действует), текущая вода, огонь, солнечный свет, святая вода и божественная энергия, ведь вампиры — нежить. Серебряный меч ранил бы и самого <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, если бы не оплётка на рукояти.<\/p><blockquote>«Прежде всего серебро, текущая вода, огонь, солнце, солнечные лучи, святая вода, божественная энергия, поскольку вампиры — это нежить.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-3\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=877\" target=\"_blank\" rel=\"noopener\">0:14:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск поделили из-за иллюстраций, а не из-за звёзд<\/b><\/div><p>Авторы объяснили, что 28, как и «Судьбу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (21a/21b), снимали как одно приключение. На монтаже материала оказалось больше 2,5 часа. Художницы рисуют около 150 иллюстраций за 3–4 недели, а на полную версию понадобилось бы около 250. Поэтому выпустили первую часть, а остальные иллюстрации дорисовали ко второй; бюджет на художников был как на два выпуска.<\/p><blockquote>«Это производственная необходимость и экономика шоу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-9\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1991\" target=\"_blank\" rel=\"noopener\">0:33:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa28-11\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Имя персонажа Попова пишется «Вампидап»<\/b><\/div><p>Авторы рассказали, что при подготовке карточки сомневались в написании и спросили самого <a class=\"ref\" href=\"/p/arseniy-popov/\">Попова<\/a>. Он ответил, что персонажа зовут <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a>, и это фонетическая шутка.<\/p><blockquote>«Отправь Арсению, спроси, кто он… И Арсений прислал: он Вампидап.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-11\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4258\" target=\"_blank\" rel=\"noopener\">1:10:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-17\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Адриан Вурдаласку заказал Грязниса Домогайтиса<\/b><\/div><p>Домогайтис голосовал против плана «Чёрное небо» и не хотел превращать людей в скот. Ему нравилось жить в Змии Хрустальном и устраивать арт-вечеринки. Высший вампирский совет почти у власти и в конфронтации с кланом Балан, несогласных он не терпит. Поэтому, когда Домогайтис передал взрыватели, Адриан Вурдаласку нанял Пиф-Пафа и выписал ему чек на 100 золотых. Внутри совета нет единства.<\/p><blockquote>«Заявив о своей позиции в высшем вампирском совете, он подписал себе смертный приговор.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-17\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5218\" target=\"_blank\" rel=\"noopener\">1:26:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-19\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Настоящий план Пиф-Пафа: бойня в банях и снайпер на крыше<\/b><\/div><p><a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> распустил среди мигрантов слухи, демонизирующие Домогайтиса, и завербовал отряд (<a class=\"ref\" href=\"/c/kristof/\">Кристоф<\/a>, изобретатель <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> и др.), чтобы отправить его в бани. Сам он собирался лечь на крышу с гномьей снайперской винтовкой. Он хотел взорвать котельную, чтобы перекрыть чёрный ход. Затем ожил бы боевой автоматон и, как Терминатор, зачистил бы бани, а выбегающих Пиф-Паф добил бы с крыши. Так всё выглядело бы как бунт мигрантов, и свидетелей бы не осталось. Клан Балан он предал бы при любых договорённостях.<\/p><blockquote>«Он оживает, он зачищает бани, а Пиф-Паф сам просто расслабленный лежит на крыше, и кто выбегает, того он пристреливает.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-19\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5473\" target=\"_blank\" rel=\"noopener\">1:31:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-20\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»<\/b><\/div><p><a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> был спокоен, потому что мог телепортироваться в любой момент. Но его выстрел промахнулся, а Антону удался бросок на переворот машины, который зал встретил овацией. Мастер в кадре бросил за Пиф-Пафа, и тот не вырвался (бросок вырезали). Иначе следующим ходом он бы телепортировался и ушёл крюком на крышу. Его телепорт — не дальний, а аналог заклинания «Туманный шаг» (около 30 футов), как у <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> в выпуске 16.<\/p><blockquote>«Это не такой телепорт… это телепорт, равный заклинанию «Туманный шаг», как было у Адольфа в шестнадцатом выпуске.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-20\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5884\" target=\"_blank\" rel=\"noopener\">1:38:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-23\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Погоня, три препятствия и задуманное двойное отцовство<\/b><\/div><p>Погоня была необязательной: героев мог преследовать <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a>, если узнавал о клане Балан, или городская стража. Для погони заготовили три препятствия: крутой поворот, брёвна и храм семейных ценностей с тестом на отцовство, а также полицейский автомобиль и дирижабль стражи. Двойное отцовство («50 на 50») было задумано изначально и не зависело от выборов игроков. Ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> соединила живое из мёртвого биоматериала двух вампиров одной команды.<\/p><blockquote>«Изначально мы решили, что 50 на 50… ведьма Мирамистина сумела соединить, вычленить что-то живое из мёртвого биоматериала двух вампиров.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-23\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6458\" target=\"_blank\" rel=\"noopener\">1:47:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-24\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дьяблери: вампир, выпивший вампира, получает его силы и риск<\/b><\/div><p>Бреганов объяснил дьяблери: вампир, выпивший другого вампира, забирает его жизненную энергию, особенности и способности. Сообщество вампиров это запрещает: выпитый может попытаться вернуть контроль над телом, и борьба двух сущностей в одном теле может идти годами незаметно для выпившего. Последствия непредсказуемы.<\/p><blockquote>«Вампир может вернуть себе контроль над телом, и борьба между двумя сущностями в одном вампире может происходить годами.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa28/#qa28-24\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Технологии ПЧК: Змий Хрустальный — стимпанк-город гномов<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змий Хрустальный<\/a> с самого начала был на карте как технологичный город изобретателей: техника — сильная сторона гномов ростом около 90 см. Мир ПЧК намеренно эклектичен. <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> — классическое средневековое фэнтези. Столица <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> (<a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>) — переход от Возрождения к классицизму. Змий Хрустальный — стимпанк, <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> — восточноевропейский хоррор, <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> — магия и «магический небоскрёб».<\/p><blockquote>«Змий Хрустальный у нас получился стимпанком, Мёртвые топи — это восточноевропейский хоррор, Шиш Кебаб — магия, магический небоскрёб.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-25\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6723\" target=\"_blank\" rel=\"noopener\">1:52:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-26\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Автоматонов Дон-Дон создал, ещё когда был смертным изобретателем<\/b><\/div><p>Умные автоматоны — разработка гнома Дон-Дона, но не божественное создание. Их сделали, когда <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> был ещё талантливым изобретателем, а не богом, которым он стал позже (отсылка к выпуску 27).<\/p><blockquote>«Это не божественное создание… в тот момент Дон-Дон ещё не был богом, он был просто очень талантливым изобретателем, который дослужился до бога.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-26\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6862\" target=\"_blank\" rel=\"noopener\">1:54:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-15\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>История душесоса «Дайсол» (вырезана из выпуска)<\/b><\/div><p>Из сценария зачитали историю, которую мастер прочитал на съёмке, но её вырезали. <a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос «Дайсол<\/a>» разработали гномы-изобретатели в городе <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змий Хрустальный<\/a> для военных целей: из фей высасывали души, чтобы делать волшебное оружие и доспехи (так создаются артефакты вроде Щита Чёрного Властелина и маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>). Потом его продавали гражданским для ловли призраков, но это вызвало всплеск преступности; душесосы запретили и уничтожали, уцелели единицы, если не один. Механика основана на заклинании Magic Jar.<\/p><blockquote>«Дайсол разработан гномами-изобретателями в городе Змий Хрустальный. Изначально он использовался в военных целях.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-15\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4100\" target=\"_blank\" rel=\"noopener\">1:08:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa33-32\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Самоуничтожение автоматона взято из Baldur&#x27;s Gate 3<\/b><\/div><p>Отвечая на упрёки в заимствованиях из Baldur's Gate 3, авторы признали, что механику кованого рыцаря-автоматона с самоуничтожением взяли оттуда (стальные стражи Горташа). Карга с красными колпаками — общий элемент D&amp;D-сеттинга, а не копия.<\/p><blockquote>«механика автоматона с самоуничтожением, вот она точно взята из Baldur&#x27;s Gate, где этот кованые рыцари»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-32\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=6227\" target=\"_blank\" rel=\"noopener\">1:43:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a><\/p><\/article><\/section>", "chars": {"Вампир Бек": {"name": "Вампирбек", "img": "img/chars/vampirbek.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%B0%D0%BC%D0%BF%D0%B8%D1%80%D0%B1%D0%B5%D0%BA", "summary": "Вампирбе́к — вампир из клана Балан, рикша из города Кёнигпон.", "infobox": {"Пол": "Мужской", "Раса": "Вампир", "Тип": "Игровой", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": true, "race": "Вампир", "portraits": [{"ep": "26", "thumb": "img/portraits/72dec7af01bdef1f.webp"}, {"ep": "23", "thumb": "img/portraits/04e2921226758e2a.webp"}, {"ep": "20", "thumb": "img/portraits/3a8ea11b15ebd411.webp"}, {"ep": "16", "thumb": "img/portraits/4f4a19de35cefce6.webp"}, {"ep": "12", "thumb": "img/portraits/a5133131b4fc25c5.webp"}], "url": "/c/vampir-bek/", "eps": [{"key": "12", "label": "12", "title": "Бесагон - истреби
