<script>window.EPD = {"anim": false, "key": "10", "label": "10", "title": "Храм Юмора", "date": "2022-06-29", "minutes": 99, "duration": 5943.0, "video_id": "GP6q6UskN34", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Храм Юмора на юге Понии, недалеко от Геленбурга", "short_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> попадает в <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a>, где <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> устраивает смертельную «игру Шутов».", "party_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, гномка-бард <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>, слепой <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> и пара дварфов-бойцов в игре Шутов.", "summary_html": "После предательства в адском поезде <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с помощью кристалла телепортируется в <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a> — арену, где проходит «игра Шутов», которую спонсирует лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>, а проигравших сбрасывают на шипы. Туда же проникают гномка <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> (ищет брата Динь-Диня), полурослик <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> и дварфы из деревни <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a>, у которых похитили сына-шута. Савл громко призывает зрителей бежать, его хватают и бросают в клетку к пленным шутам, где он в итоге тонет в выгребной яме. Остальные через сделку с раскаявшимся владельцем храма Алексом Баттером-старшим получают пять бомб, спускаются к алтарю в подвале, где из крови шутов рождается лорд ада, минируют опорные колонны и телепортируются. Храм Юмора рушится вместе с алтарём и сотнями зрителей.", "outcome_html": "<a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a> и демонический алтарь уничтожены, погибли сотни людей. <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> погиб, <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с отрядом и спасённым Бульби телепортировались к дворцу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.", "world_html": ["<a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a> уничтожен, игра Шутов прекращена (первая волна демонизации по общему лору)", "Раскрыто: из алтаря под храмом появлялись демоны, <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> собирает из них армию, но они ему не подчиняются", "Семья Баттеров погибла", "<a class=\"ref\" href=\"/c/savl/\">Савл<\/a>, брат <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, погиб"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Предыстория: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> и <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> уничтожили амфору во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, попали в адский поезд; Пахом завладел кристаллом и один ушёл в портал, бросив друзей."}, {"t": "0:04:17", "sec": 257, "html": "Завязка: на юге <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> недалеко от <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> десятилетиями проходит «игра Шутов» в <a class=\"ref\" href=\"/place/hram-yumora/\">Храме Юмора<\/a>. Баттер-старший якобы заключил договор с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>; по стране похищают шутов и бардов и свозят в храм. Задача — освободить шутов и уничтожить храм."}, {"t": "0:08:44", "sec": 524, "html": "Флешбек: месяц назад у <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбрунна<\/a> друид <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> провожает <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> на юг (реклама доставки)."}, {"t": "0:12:03", "sec": 723, "html": "Герои среди зрителей. [0:13:04] Во вспышке на арене появляется <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> в костюме проводника адского поезда с кристаллом, вросшим в руку. Его приняли за участника команды полуросликов; номер проваливается, Баттер-старший показывает палец вниз, все падают в люк на шипы — Пахом в полёте телепортируется прочь."}, {"t": "0:16:22", "sec": 982, "html": "<a class=\"ref\" href=\"/c/savl/\">Савл<\/a> встаёт и кричит зрителям, что «мы с друзьями разрушим здание». Охрана скручивает его; <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> выдаёт себя за администратора шутовской команды и отказывается от Савла. Савла уносят."}, {"t": "0:21:31", "sec": 1291, "html": "В холле охранник ведёт <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> к штабу фестиваля; появляется <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, знакомится с отрядом и сообщает <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a>, что <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> погиб, спасая ему жизнь, и завещал найти сестру (Бульбух получает монету за правильную мотивацию)."}, {"t": "0:24:47", "sec": 1487, "html": "В буфете <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> крадёт мерч-статуэтку «Игрун в золотом» (крит), девиз «Мы в игре». Пьяный бывший шут <a class=\"ref\" href=\"/c/pisario/\">Писари<\/a> (рыжий, кудрявый) рассказывает, что вербует шутов по стране за обещанное место в жюри, и что в подвал можно попасть через реквизиторскую."}, {"t": "0:28:41", "sec": 1721, "html": "<a class=\"ref\" href=\"/c/savl/\">Савла<\/a> бросают в клетку в полутёмном помещении с сотнями пленных шутов; соседи — команда «Пельмешки из Гавани» (выступают 42-ми). Савл уговаривает их выступить вместе."}, {"t": "0:34:19", "sec": 2059, "html": "Штаб фестиваля: отряд регистрируется как команда «Эффект тапочки», «от <a class=\"ref\" href=\"/c/pisario/\">Писари<\/a>» — без взноса, с направлением к жюри. <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> крадёт кассу (второй крит)."}, {"t": "0:38:15", "sec": 2295, "html": "В туалете (дыры в полу) из выгребной ямы зовёт на помощь шут, сбежавший из клеток. Его вытаскивают верёвкой, он рассказывает о клетках (~300 шутов). Охрана сталкивает его обратно; <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> иллюзией заставляет охранника упасть в яму, <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> топором сбрасывает второго — оба охранника и шут тонут."}, {"t": "0:46:23", "sec": 2783, "html": "<a class=\"ref\" href=\"/c/savl/\">Савл<\/a> в клетке убивает стрелой охранника, забирает ключи, призывает шутов к бунту (харизма 0, провал). Долгий спор за столом о монете и благотворительности (<a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> обещает доплатить 30 000+). Савла расстреливают из арбалетов, он бросает ключи в соседнюю клетку, но шуты боятся их трогать; Савл без сознания."}, {"t": "0:57:44", "sec": 3464, "html": "Ложа жюри: 15-летняя внучка Баттера-старшего <a class=\"ref\" href=\"/c/anzhelika/\">Анжелика<\/a> в отключке от перепоя. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> вызывает у неё рвоту, очаровывает её и получает ключ от кабинета Баттера-старшего."}, {"t": "1:00:04", "sec": 3604, "html": "Кабинет: письмо на столе, огромная золотая статуя «Игруна», портрет <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Статуя-страж требует пароль (<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> получает 3 психического урона); пароль — «Мы в игре». В сейфе за портретом — монета и пять бомб с часовым механизмом."}, {"t": "1:03:27", "sec": 3807, "html": "Входит Баттер-старший. Он признаётся: когда-то <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> спонсировал игру, затем загнал его в долг, который он «возвращает кровью»; из алтаря под храмом появляются демоны, Властон сошёл с ума и создаёт из них армию, но они ему не подчиняются. Бомбы он спрятал, чтобы подорвать несущие колонны подвала. Отдаёт ключ от подвала <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a>."}, {"t": "1:07:56", "sec": 4076, "html": "<a class=\"ref\" href=\"/c/savl/\">Савла<\/a> откачивают шуты (1 хит). Он сочиняет абсурдные шутки «про яму» и уговаривает соседа проситься в туалет — план не срабатывает."}, {"t": "1:12:38", "sec": 4358, "html": "Реквизиторская: люк в подвал за ящиком. При открытии появляется <a class=\"ref\" href=\"/c/batter-mladshiy/\">Баттер-младший<\/a> (ведущий) с двумя арбалетами и стреляет в отца: «Теперь эта игра будет моей». Иллюзия <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> отвлекает стражу, <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> стреляет из кристальной винтовки, <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> топорами отрубает Баттеру-младшему руку — тот погибает. Охрану прогоняют запугиванием."}, {"t": "1:19:56", "sec": 4796, "html": "Подвал: алтарь-пентаграмма с шипами, на которых умирают шуты, их кровь питает алтарь. Два мелких демона узнают <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> («все знают о твоём предательстве»): готовится приход «главного Сатаны», они украшают колонны. <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> находит на шипах сына Бульби — ещё живого."}, {"t": "1:22:30", "sec": 4950, "html": "Из алтаря поднимается шипастый лорд ада. Бомбы пытаются всучить демонам как «украшения»; детективные очки <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a> подсказывают: лорд ада способен уничтожить армию, но если заденет колонны — здание рухнет."}, {"t": "1:25:45", "sec": 5145, "html": "<a class=\"ref\" href=\"/c/savl/\">Савлу<\/a> снова дают шанс (голосование): он просится в туалет и ныряет в выгребную яму, чтобы выбраться, — критическая неудача, Савл тонет в нечистотах."}, {"t": "1:33:16", "sec": 5596, "html": "Отряд ставит бомбы с таймерами на 20/15/10 секунд, <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a> хватает сына. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> проваливает ловкость, после двух перебросов монетами — критический успех: демон промахивается на пару сантиметров, и кристалл переносит всех на холм с видом на дворец <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>."}, {"t": "1:36:26", "sec": 5786, "html": "<a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a> взрывается и обрушивается, алтарь уничтожен; погибают сотни людей. 20 000 руб. заработано монетами, игроки и <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> докладывают из своих — на благотворительность."}], "key_events": [{"t": "0:13:16", "sec": 796}, {"t": "0:16:22", "sec": 982}, {"t": "0:23:18", "sec": 1398}, {"t": "0:41:36", "sec": 2496}, {"t": "0:48:53", "sec": 2933}, {"t": "1:02:15", "sec": 3735}, {"t": "1:03:27", "sec": 3807}, {"t": "1:13:58", "sec": 4438}, {"t": "1:19:56", "sec": 4796}, {"t": "1:27:46", "sec": 5266}, {"t": "1:36:26", "sec": 5786}], "coins": {"ep": "10", "events": [{"t": "0:23:44", "kind": "earn", "who": "Бульбух Бульбаши", "actor": "Тамби Масаев", "to": null, "reason": "получил монету за трогательную предысторию о гибели брата, объясняющую мотивацию уничтожить здание", "result": null, "sec": 1424, "who_url": "/c/bulbu-bulbashi/", "reason_html": "получил монету за трогательную предысторию о гибели брата, объясняющую мотивацию уничтожить здание"}, {"t": "0:33:30", "kind": "earn", "who": "Бульбух Бульбаши", "actor": "Тамби Масаев", "to": null, "reason": "получил монету за точную догадку медиума о тёмном источнике силы, питающем здание", "result": null, "sec": 2010, "who_url": "/c/bulbu-bulbashi/", "reason_html": "получил монету за точную догадку медиума о тёмном источнике силы, питающем здание"}, {"t": "0:49:40", "kind": "earn", "who": "Савл", "actor": "Кукушкин", "to": null, "reason": "получил монету от мастера за пламенную речь, призывающую шутов к бунту", "result": null, "sec": 2980, "who_url": "/c/savl/", "reason_html": "получил монету от мастера за пламенную речь, призывающую шутов к бунту"}, {"t": "0:51:43", "kind": "spend", "who": "Савл", "actor": "Кукушкин", "to": null, "reason": "потратил монету на переброс проверки харизмы/выживания во время бунта", "result": "переброс дал 12, не хватило двух очков, чтобы выжить/преуспеть", "sec": 3103, "who_url": "/c/savl/", "reason_html": "потратил монету на переброс проверки харизмы/выживания во время бунта"}, {"t": "0:53:57", "kind": "other", "who": "Савл", "actor": "Кукушкин", "to": null, "reason": "партия обсуждала, дать ли Савлу ещё одну монету (со спорами о дополнительных личных взносах на благотворительность), но большинством голосов решила монету не давать", "result": "Савл получил ещё урон арбалетными болтами и потерял сознание", "sec": 3237, "who_url": "/c/savl/", "reason_html": "партия обсуждала, дать ли <a class=\"ref\" href=\"/c/savl/\">Савлу<\/a> ещё одну монету (со спорами о дополнительных личных взносах на благотворительность), но большинством голосов решила монету не давать"}, {"t": "1:03:06", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "взломал сейф (проверка силы) и нашёл в нём золотую монету вместе с пятью бомбами с часовым механизмом", "result": null, "sec": 3786, "who_url": "/c/medium-pahom/", "reason_html": "взломал сейф (проверка силы) и нашёл в нём золотую монету вместе с пятью бомбами с часовым механизмом"}, {"t": "1:23:16", "kind": "spend", "who": "Пахом", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки убеждения — попытки выдать бомбы демонам за украшения", "result": "нужно было набрать 14-15+, переброс не помог, попытка провалилась", "sec": 4996, "who_url": "/c/medium-pahom/", "reason_html": "потратил монету на переброс проверки убеждения — попытки выдать бомбы демонам за украшения"}, {"t": "1:30:20", "kind": "spend", "who": "Шафран Десперадос", "actor": "Эмир Кашоков", "to": "Савл", "reason": "потратил монету, чтобы избавить Савла от необходимости проходить весь долгий путь по зданию и головоломки, и сразу воссоединить его с группой", "result": null, "sec": 5420, "who_url": "/c/shafran-desperado/", "reason_html": "потратил монету, чтобы избавить <a class=\"ref\"
