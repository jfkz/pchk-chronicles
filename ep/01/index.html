<script>window.EPD = {"anim": false, "key": "01", "label": "1", "title": "Башня Колдуна", "date": "2020-10-15", "minutes": 54, "duration": 3230.0, "video_id": "bvSC_9hWp0E", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Башня колдуна Филиппа на скалистом холме в сосновом лесу (земли отца Сфинктериона)", "short_html": "Пилот шоу. Четверо героев с разными мотивами идут к башне колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>, похитившего девственницу для обряда омоложения кровью. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> ранит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, нападает на сатира-привратника и погибает от сапога Сфинктериона. Остальные договариваются с сатиром, уничтожают зомби-старух, а <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> свитком воскрешает Эрика. В финальном бою Эрик с третьей попытки убивает Филиппа за украденные «порнокарточки».", "summary_html": "Пилотный выпуск шоу. Четверо героев, у каждого свой мотив, приходят к кривой башне злого колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>: он похитил деревенскую девственницу, чтобы выпить её кровь в обряде омоложения. Отряд почти сразу разваливается: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> стреляет в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, потом нападает на сатира-привратника, и Сфинктерион его добивает. Остальные уговаривают сатира открыть дверь, побеждают трёх зомби-старух на цепях, а <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> свитком воскрешает Эрика. В финальном бою Эрик с третьего переброса убивает Филиппа кинжалом и булавой («потому что ты украл мои порнокарточки»). Девушка сбегает, герои зарабатывают 4 монеты, то есть 40 000 руб. для фонда «Дети-бабочки».", "outcome_html": "<a class=\"ref\" href=\"/c/koldun-filipp/\">Колдун Филипп<\/a> убит, похищенная девушка спасена и сбежала. Все четыре героя живы (<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> — после воскрешения).", "world_html": ["Гибель колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>, друга лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (по лору это повод для оккупации <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>)"], "scenes": [{"t": "0:00:03", "sec": 3, "html": "Вступление и правила: D20, мастер за кадром. Каждая золотая монета — 10 000 руб. на благотворительность, но монету можно потратить на переброс кубика."}, {"t": "0:03:32", "sec": 212, "html": "Завязка: таинственный злой колдун-музыкант <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> похитил из мирной деревни самую красивую девственницу. На закате он хочет перелить себе её кровь, чтобы омолодиться."}, {"t": "0:04:06", "sec": 246, "html": "Представление героев. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — наследник земель, доказывает отцу, что достоин наследства. <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> — жрица Морадина и воинствующая феминистка с булавой. <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> — эльф-эколог, мстит колдуну за зелья, которые тот сливает в лес. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> — бывший парень Сфинктериона с родинкой в виде лица монарха; колдун усыпил его и украл свитки с эротическими снимками."}, {"t": "0:07:44", "sec": 464, "html": "Кривая 20-метровая башня на скале среди сосен, на балконе сидит ворон. По пути <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> стреляет из ручного арбалета <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> в ногу, «чтобы тот остался и не погиб» (5 урона). Сфинктерион объявляет себя лидером, Эрик в слезах раздевается догола."}, {"t": "0:11:41", "sec": 701, "html": "У входа сидит сатир с панфлейтой, говорит, что <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> гостей не ждёт. Голый <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> кидает в него фекалии, промахивается и начинает его душить. Начинается бой."}, {"t": "0:13:56", "sec": 836, "html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> харизмой успокаивает сатира. <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> древком отшвыривает <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> (критическая удача), сатир топчет Эрика копытами, а <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сапогом ломает ему шею. Эрик погибает."}, {"t": "0:19:25", "sec": 1165, "html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> врёт сатиру, что полурослик был не с ними. Благодарный сатир открывает дверь мелодией панфлейты. Труп <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> убирают в рюкзак."}, {"t": "0:21:13", "sec": 1273, "html": "Круглый зал: три зомби-старухи на цепях и сундук. <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> тихо открывает сундук: там 10-метровая верёвка, два мешочка с белым порошком, синие мокасины (+1 к харизме) и первая золотая монета."}, {"t": "0:24:40", "sec": 1480, "html": "<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> бросает труп <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к старухам, и те просыпаются. Бой: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> промахивается, Илдэ раскалывает старухе череп, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> добивает её стрелой. Цепь рвётся, Пэлиас пронзает двоих одной стрелой, Илдэ разбивает голову последней. В сумках находят вторую монету, челюсть и песок."}, {"t": "0:33:00", "sec": 1980, "html": "<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> свитком воскрешения оживляет <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Эрик целует её, начинается скоротечный роман, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ревнует."}, {"t": "0:36:55", "sec": 2215, "html": "Сверху, из люка, слышна мольба девушки. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> прыгает к люку с кинжалами, тратит монету на переброс, не попадает и «исчезает» в люке. За ним поднимается <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>."}, {"t": "0:39:40", "sec": 2380, "html": "Кабинет колдуна: камин, книги, балкон. <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> читает книгу «Магическое омоложение», девушка лежит на столе. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> кидает в неё голую <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>, и начинается бой."}, {"t": "0:40:54", "sec": 2454, "html": "<a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> предлагает себя вместо жертвы. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> стреляет двадцатью болтами и попадает в стол. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> «лишает девственности» обеих девушек, чтобы сорвать обряд. <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> бросает колдуну в лицо мешочки с порошком, и <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> теряет ход."}, {"t": "0:44:55", "sec": 2695, "html": "<a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> опутывает всех магической паутиной. <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> священным пламенем поджигает её, обжигая союзников: <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> вырывается невредимым, остальные получают урон (у одного из героев остаётся 1 хит)."}, {"t": "0:50:02", "sec": 3002, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> бьёт колдуна кинжалом и булавой. Промах, переброс монетой, снова промах. Третья попытка на другом кубике даёт 20, и <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> гибнет со словами «Но почему?» — «Потому что ты украл мои порнокарточки»."}, {"t": "0:52:41", "sec": 3161, "html": "Девушка в панике сбегает, ворон каркает. В сундуке колдуна лежат призы (машинки для катышков). Итог: 4 монеты = 40 000 руб. в фонд «Дети-бабочки»."}], "key_events": [{"t": "0:03:32", "sec": 212}, {"t": "0:08:40", "sec": 520}, {"t": "0:11:41", "sec": 701}, {"t": "0:19:25", "sec": 1165}, {"t": "0:24:40", "sec": 1480}, {"t": "0:33:00", "sec": 1980}, {"t": "0:39:40", "sec": 2380}, {"t": "0:44:55", "sec": 2695}, {"t": "0:51:45", "sec": 3105}, {"t": "
