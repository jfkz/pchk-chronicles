<script>window.EPD = {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "date": "2023-09-30", "minutes": 85, "duration": 5074.0, "video_id": "YlnYBd17SWs", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Геленбург, сад-лагерь и канализация дворца лорда Властона", "short_html": "После желания <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> джинну лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> смертельно заболел, и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с мирным договором от <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> и новым отрядом тайно проникает в сад дворца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. Отряд вырезает стражу и офицеров, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> едва не погибает, а Сфинктерион испепеляет врагов некротической молнией Щита Тёмного Властелина. Эльф в украденной форме ведёт «блаженную» дварфиху во дворец как жертву для жреца Гуди, а Лариса в канализации добывает из чёрного желатинового куба шкатулку, которая начинает пить её кровь.", "summary_html": "После того как крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала джинну смерть лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, тот тяжело заболел и поддерживается в живых тёмными жрецами <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил от короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> мирный договор и с новым отрядом (эльф от короля <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>, дварфиха из <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a>, кот-табакси из партизан) тайно проникает в сад дворца Властона, превращённый в лагерь солдат с походным борделем. Отряд вырезает охрану и офицеров, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> чуть не убивают, Сфинктерион испепеляет офицеров некротической молнией щита и узнаёт про «говняную трубу». Эльф в украденной форме под видом солдата ведёт «блаженную» дварфиху к Властону как жертву для жреца Гуди, а Лариса в канализации достаёт из чёрного желатинового куба таинственную шкатулку, которая начинает пить её кровь. Продолжение — в части 2 (ep21b).", "outcome_html": "Отряд разделился: эльф и <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> под конвоем идут во дворец, <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в канализации со шкатулкой, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> в саду. <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> ещё жив.", "world_html": ["<a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> смертельно болен из-за желания, загаданного джинну", "<a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> подготовил мирный договор <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>", "Сад дворца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> превращён в военный лагерь; солдаты забирают крестьян «во имя жизни Властона»", "Найдена таинственная кровососущая шкатулка, заразившая желатиновый куб"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Пролог: в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфеле<\/a> героев оправдали в убийстве <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>, король эльфов стал союзником; освобождённый джинн дал <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a> желание — она загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Газета «Вечерний <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>»: Властон заболел. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с Ларисой отправляются на юг."}, {"t": "0:03:10", "sec": 190, "html": "Завязка мастера: отряд тайно прибыл в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> ко дворцу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>; лорд при смерти, его держат тёмные жрецы; если его вылечат, он снова пойдёт на <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>. Задача — проникнуть во дворец и решить судьбу лорда."}, {"t": "0:04:18", "sec": 258, "html": "Представление героев: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил аудиенцию у <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> и мирный договор с королевской печатью; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (говорит по-человечески, пока Сфинктерион носит <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>) отказалась воскрешать <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> ради мира; эльф <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> — отличник Академии эльфов, отправленный королём <a class=\"ref\" href=\"/c/korol-nurik/\">Нуриком<\/a>, «чтобы не раздражал сородичей»; дварфиха <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> — посланница старосты деревни <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a> <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a>, влюблена в эльфа; табакси <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> — бродяга-вор, вступивший в партизанский отряд <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>."}, {"t": "0:10:41", "sec": 641, "html": "Сад дворца в запустении: лагерь войск <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, солдаты стирают в фонтанах, рубят деревья, в саду походный бордель, клетка с пленными крестьянами. С запада несёт нечистотами."}, {"t": "0:12:47", "sec": 767, "html": "Текст мирного договора <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>: вечный мир, отказ от территориальных претензий, прекращение «сношений с дьявольскими силами», компенсации женщинам, родившим от солдат; гарант — <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, нарушителя объявят вне закона, удел отойдёт короне."}, {"t": "0:14:50", "sec": 890, "html": "Атака на двух стражников у главного входа: эльф подкрадывается, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> мечет топор, эльф стреляет; неудачный обман («мы семейная пара»), стражник критом бьёт Вульф Ва (15 урона). <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> перелезает забор и стреляет из арбалета, <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> проламывает стражнику «родничок» коротким мечом. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> допрашивает раненого (около сотни людей в замке, ловушки есть, тайные ходы есть) и отрубает ему голову."}, {"t": "0:28:27", "sec": 1707, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> спрашивает эльфа, не «крыса» ли он (намёк на возможное предательство). <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> «зализывает раны» <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> (+6 здоровья). Трупы прячут в кустах."}, {"t": "0:30:36", "sec": 1836, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> разведывает бордель, крадёт у занятого солдата форму (китель, штаны, фуражку). Мастер даёт монету за то, что игроки вспомнили: в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> ненавидят другие расы (отсылка к вып. 8). Эльф надевает форму, прячет уши под фуражку; вещи несёт <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>."}, {"t": "0:36:54", "sec": 2214, "html": "У борделя эльфа встречают куртизанки; одна замечает уши — он бесшумно убивает её стилетом из ботинка («теневой клинок»), вторую отправляет за водой, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> ранит её топором в спину. На крик «<a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a>» выбегают три офицера, эльф проваливает обман (даже после переброса за монету) — «Это шпион!»."}, {"t": "0:43:12", "sec": 2592, "html": "Бой с офицерами: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> круговым ударом ранит двоих; рой крыс <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> промахивается (переброс за монету не помог); <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> уходит к клетке с пленниками; <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, получив пинок от Сфинктериона для заряда топора, промахивается «дрожью земли»; эльф ранит офицера и прячется за Вульф Ва. Офицеры наносят Вульф Ва 21 урона — она при смерти."}, {"t": "0:54:39", "sec": 3279, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бьёт некротической молнией Щита Тёмного Властелина: два офицера обращены в пыль, их жизненная сила уходит в щит. Третьего запугивает — тот указывает путь во дворец: западная «говняная труба»."}, {"t": "0:57:47", "sec": 3467, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> милует раненого офицера и куртизанку, велит им пожениться и жить счастливо; эльф угрожает, что однажды придёт за ними. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> вслух оправдывает «справедливость независимо от земель»."}, {"t": "0:59:51", "sec": 3591, "html": "Эльф с брезгливостью откармливает бессознательную <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> борщом, держа ей челюсть ногой; она приходит в себя (11 здоровья) и клянётся быть с ним «до гроба»."}, {"t": "1:04:08", "sec": 3848, "html": "<a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> у клетки: солдаты забирают крестьян «во имя жизни <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (видимо, для ритуалов жрецов) и уводят во дворец. Его отвлекающий комок шерсти не срабатывает; он возвращается с докладом."}, {"t": "1:07:14", "sec": 4034, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> ныряет в фонтан и находит золотую монету."}, {"t": "1:08:18", "sec": 4098, "html": "План: <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, намазавшись маслом, пролезает в клетку, чтобы её увели как пленницу; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> идёт через трубу. Вульф Ва критически застревает в прутьях, но обманом («не получилось выбраться») убеждает солдата, и тот запихивает её обратно."}, {"t": "1:11:25", "sec": 4285, "html": "Эльф в форме рапортует офицеру: велено доставить к лорду <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> «самую невинную пленницу, желательно дворфийского происхождения» — критический успех. Офицер решает, что дварфиха «блаженная» (предсказала своё избрание), освобождает её; её поведут к верховному жрецу <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> Гуди. Эльф забирает топор <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, для достоверности бьёт её по лицу; офицер сопровождает их во дворец."}, {"t": "1:16:40", "sec": 4600, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в канализации: развилка на комнаты 5 и 6; в комнате — обожжённые солдаты и чёрный желатиновый куб. Лариса добивает раненого солдата укусом."}, {"t": "1:19:51", "sec": 4791, "html": "Куб говорит: внутри него странная шкатулка, которая заразила его — был зелёным, стал чёрным; просит её достать. Рой крыс <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> гибнет внутри куба, но критическим успехом Лариса хватает шкатулку и пробивается сквозь кислоту невредимой."}, {"t": "1:22:59", "sec": 4979, "html": "Шкатулка жадно впитывает кровь <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>. Клиффхэнгер: что за шкатулка, раскроют ли эльфа и <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> во дворце, доберётся ли <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> до <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — во второй части."}], "key_events": [{"t": "0:03:10", "sec": 190}, {"t": "0:12:47", "sec": 767}, {"t": "0:14:50", "sec": 890}, {"t": "0:30:36", "sec": 1836}, {"t": "0:41:07", "sec": 2467}, {"t": "0:53:37", "sec": 3217}, {"t": "0:54:39", "sec": 3279}, {"t": "0:57:47", "sec": 3467}, {"t": "1:11:25", "sec": 4285}, {"t": "1:19:51", "sec": 4791}], "coins": {"ep": "21a", "events": [{"t": "0:32:41", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "красочно и с юмором рассказала партии, что подслушала и увидела в борделе (эльфы-расисты)", "result": null, "sec": 1961, "who_url": "/c/krysa-larisa/", "reason_html": "красочно и с юмором рассказала партии, что подслушала и увидела в борделе (эльфы-расисты)"}, {"t": "0:32:41", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "вспомнил важную лор-деталь из 8 выпуска — что эльфы ненавидят все расы, кроме одной", "result": null, "sec": 1961, "who_url": "/c/sfinkterion/", "reason_html": "вспомнил важную лор-деталь из 8 выпуска — что эльфы ненавидят все расы, кроме одной"}, {"t": "0:35:50", "kind": "earn", "who": "Вульф Ва", "actor": "Расул Чабдаров", "to": null, "reason": "яркий отыгрыш персонажа — дворфийка-матриархша поступилась своими принципами ради любви к Лос Ускаманосу", "result": null, "sec": 2150, "who_url": "/c/vulfa/", "reason_html": "яркий отыгрыш персонажа — дворфийка-матриархша поступилась своими принципами ради любви к <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманосу<\/a>"}, {"t": "0:42:09", "kind": "spend", "who": "Лос Ускаманос", "actor": "Евгений Чеботков", "to": null, "reason": "потратил монету на переброс проверки харизмы, чтобы притвориться солдатом перед офицерами", "result": "переброс не спас — офицеры раскусили обман, один закричал \"это шпион\", начался бой", "sec": 2529, "who_url": "/c/los-uskomanos/", "reason_html": "потратил монету на переброс проверки харизмы, чтобы притвориться солдатом перед офицерами"}, {"t": "0:46:19", "kind": "spend", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "потратила монету на переброс атаки роя призванных крыс на офицера", "result": "переброс не помог, офицер отбился, урон крысами не нанесён", "sec": 2779, "who_url": "/c/krysa-larisa/", "reason_html": "потратила монету на переброс атаки роя призванных крыс на офицера"}, {"t": "1:07:14", "kind": "earn", "who":
