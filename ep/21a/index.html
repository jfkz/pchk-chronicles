<script>window.EPD = {"anim": false, "key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "date": "2023-09-30", "minutes": 85, "duration": 5074.0, "video_id": "YlnYBd17SWs", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Геленбург, сад-лагерь и канализация дворца лорда Властона", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с мирным договором и новым отрядом тайно проникает во дворец умирающего <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>.", "summary_html": "После того как крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала джинну смерть лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, тот тяжело заболел и поддерживается в живых тёмными жрецами <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил от короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> мирный договор и с новым отрядом (эльф от короля <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>, дварфиха из <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a>, кот-табакси из партизан) тайно проникает в сад дворца Властона, превращённый в лагерь солдат с походным борделем. Отряд вырезает охрану и офицеров, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> чуть не убивают, Сфинктерион испепеляет офицеров некротической молнией щита и узнаёт про «говняную трубу». Эльф в украденной форме под видом солдата ведёт «блаженную» дварфиху к Властону как жертву для жреца Гуди, а Лариса в канализации достаёт из чёрного желатинового куба таинственную шкатулку, которая начинает пить её кровь. Продолжение — в части 2 (ep21b).", "outcome_html": "Отряд разделился: эльф и <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> под конвоем идут во дворец, <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в канализации со шкатулкой, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> в саду. <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> ещё жив.", "world_html": ["<a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> смертельно болен из-за желания, загаданного джинну", "<a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> подготовил мирный договор <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>", "Сад дворца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> превращён в военный лагерь; солдаты забирают крестьян «во имя жизни Властона»", "Найдена таинственная кровососущая шкатулка, заразившая желатиновый куб"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Пролог: в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфеле<\/a> героев оправдали в убийстве <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>, король эльфов стал союзником; освобождённый джинн дал <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a> желание — она загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Газета «Вечерний <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>»: Властон заболел. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с Ларисой отправляются на юг."}, {"t": "0:03:30", "sec": 210, "html": "Завязка мастера: отряд тайно прибыл в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> ко дворцу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>; лорд при смерти, его держат тёмные жрецы; если его вылечат, он снова пойдёт на <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>. Задача — проникнуть во дворец и решить судьбу лорда."}, {"t": "0:04:24", "sec": 264, "html": "Представление героев: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил аудиенцию у <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> и мирный договор с королевской печатью; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (говорит по-человечески, пока Сфинктерион носит <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>) отказалась воскрешать <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> ради мира; эльф <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> — отличник Академии эльфов, отправленный королём <a class=\"ref\" href=\"/c/korol-nurik/\">Нуриком<\/a>, «чтобы не раздражал сородичей»; дварфиха <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> — посланница старосты деревни <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a> <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a>, влюблена в эльфа; табакси <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> — бродяга-вор, вступивший в партизанский отряд <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>."}, {"t": "0:11:06", "sec": 666, "html": "Сад дворца в запустении: лагерь войск <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, солдаты стирают в фонтанах, рубят деревья, в саду походный бордель, клетка с пленными крестьянами. С запада несёт нечистотами."}, {"t": "0:12:47", "sec": 767, "html": "Текст мирного договора <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>: вечный мир, отказ от территориальных претензий, прекращение «сношений с дьявольскими силами», компенсации женщинам, родившим от солдат; гарант — <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, нарушителя объявят вне закона, удел отойдёт короне."}, {"t": "0:14:58", "sec": 898, "html": "Атака на двух стражников у главного входа: эльф подкрадывается, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> мечет топор, эльф стреляет; неудачный обман («мы семейная пара»), стражник критом бьёт Вульф Ва (15 урона). <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> перелезает забор и стреляет из арбалета, <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> проламывает стражнику «родничок» коротким мечом. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> допрашивает раненого (около сотни людей в замке, ловушки есть, тайные ходы есть) и отрубает ему голову."}, {"t": "0:28:27", "sec": 1707, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> спрашивает эльфа, не «крыса» ли он (намёк на возможное предательство). <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> «зализывает раны» <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> (+6 здоровья). Трупы прячут в кустах."}, {"t": "0:30:45", "sec": 1845, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> разведывает бордель, крадёт у занятого солдата форму (китель, штаны, фуражку). Мастер даёт монету за то, что игроки вспомнили: в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> ненавидят другие расы (отсылка к вып. 8). Эльф надевает форму, прячет уши под фуражку; вещи несёт <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>."}, {"t": "0:36:54", "sec": 2214, "html": "У борделя эльфа встречают куртизанки; одна замечает уши — он бесшумно убивает её стилетом из ботинка («теневой клинок»), вторую отправляет за водой, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> ранит её топором в спину. На крик «<a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a>» выбегают три офицера, эльф проваливает обман (даже после переброса за монету) — «Это шпион!»."}, {"t": "0:43:38", "sec": 2618, "html": "Бой с офицерами: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> круговым ударом ранит двоих; рой крыс <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> промахивается (переброс за монету не помог); <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> уходит к клетке с пленниками; <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, получив пинок от Сфинктериона для заряда топора, промахивается «дрожью земли»; эльф ранит офицера и прячется за Вульф Ва. Офицеры наносят Вульф Ва 21 урона — она при смерти."}, {"t": "0:54:38", "sec": 3278, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бьёт некротической молнией Щита Чёрного Властелина: два офицера обращены в пыль, их жизненная сила уходит в щит. Третьего запугивает — тот указывает путь во дворец: западная «говняная труба»."}, {"t": "0:57:30", "sec": 3450, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> милует раненого офицера и куртизанку, велит им пожениться и жить счастливо; эльф угрожает, что однажды придёт за ними. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> вслух оправдывает «справедливость независимо от земель»."}, {"t": "1:00:05", "sec": 3605, "html": "Эльф с брезгливостью откармливает бессознательную <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> борщом, держа ей челюсть ногой; она приходит в себя (11 здоровья) и клянётся быть с ним «до гроба»."}, {"t": "1:04:10", "sec": 3850, "html": "<a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> у клетки: солдаты забирают крестьян «во имя жизни <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (видимо, для ритуалов жрецов) и уводят во дворец. Его отвлекающий комок шерсти не срабатывает; он возвращается с докладом."}, {"t": "1:07:42", "sec": 4062, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> ныряет в фонтан и находит золотую монету."}, {"t": "1:08:22", "sec": 4102, "html": "План: <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, намазавшись маслом, пролезает в клетку, чтобы её увели как пленницу; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> идёт через трубу. Вульф Ва критически застревает в прутьях, но обманом («не получилось выбраться») убеждает солдата, и тот запихивает её обратно."}, {"t": "1:11:55", "sec": 4315, "html": "Эльф в форме рапортует офицеру: велено доставить к лорду <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> «самую невинную пленницу, желательно дворфийского происхождения» — критический успех. Офицер решает, что дварфиха «блаженная» (предсказала своё избрание), освобождает её; её поведут к верховному жрецу <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> Гуди. Эльф забирает топор <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, для достоверности бьёт её по лицу; офицер сопровождает их во дворец."}, {"t": "1:17:02", "sec": 4622, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в канализации: развилка на комнаты 5 и 6; в комнате — обожжённые солдаты и чёрный желатиновый куб. Лариса добивает раненого солдата укусом."}, {"t": "1:19:51", "sec": 4791, "html": "Куб говорит: внутри него странная шкатулка, которая заразила его — был зелёным, стал чёрным; просит её достать. Рой крыс <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> гибнет внутри куба, но критическим успехом Лариса хватает шкатулку и пробивается сквозь кислоту невредимой."}, {"t": "1:23:56", "sec": 5036, "html": "Шкатулка жадно впитывает кровь <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>. Клиффхэнгер: что за шкатулка, раскроют ли эльфа и <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> во дворце, доберётся ли <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> до <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — во второй части."}], "key_events": [{"t": "0:03:30", "sec": 210}, {"t": "0:12:47", "sec": 767}, {"t": "0:14:58", "sec": 898}, {"t": "0:30:45", "sec": 1845}, {"t": "0:41:38", "sec": 2498}, {"t": "0:53:55", "sec": 3235}, {"t": "0:54:38", "sec": 3278}, {"t": "0:57:30", "sec": 3450}, {"t": "1:11:55", "sec": 4315}, {"t": "1:19:51", "sec": 4791}], "coins": {"ep": "21a", "events": [{"t": "0:32:50", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "красочно и с юмором рассказала партии, что подслушала и увидела в борделе (эльфы-расисты)", "result": null, "sec": 1970, "who_url": "/c/krysa-larisa/", "reason_html": "красочно и с юмором рассказала партии, что подслушала и увидела в борделе (эльфы-расисты)"}, {"t": "0:33:02", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "вспомнил важную лор-деталь из 8 выпуска — что эльфы ненавидят все расы, кроме одной", "result": null, "sec": 1982, "who_url": "/c/sfinkterion/", "reason_html": "вспомнил важную лор-деталь из 8 выпуска — что эльфы ненавидят все расы, кроме одной"}, {"t": "0:36:18", "kind": "earn", "who": "Вульф Ва", "actor": "Расул Чабдаров", "to": null, "reason": "яркий отыгрыш персонажа — дворфийка-матриархша поступилась своими принципами ради любви к Лос Ускаманосу", "result": null, "sec": 2178, "who_url": "/c/vulfa/", "reason_html": "яркий отыгрыш персонажа — дворфийка-матриархша поступилась своими принципами ради любви к <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманосу<\/a>"}, {"t": "0:42:16", "kind": "spend", "who": "Лос Ускаманос", "actor": "Евгений Чеботков", "to": null, "reason": "потратил монету на переброс проверки харизмы, чтобы притвориться солдатом перед офицерами", "result": "переброс не спас — офицеры раскусили обман, один закричал \"это шпион\", начался бой", "sec": 2536, "who_url": "/c/los-uskomanos/", "reason_html": "потратил монету на переброс проверки харизмы, чтобы притвориться солдатом перед офицерами"}, {"t": "0:46:20", "kind": "spend", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "потратила монету на переброс атаки роя призванных крыс на офицера", "result": "переброс не помог, офицер отбился, урон крысами не нанесён", "sec": 2780, "who_url": "/c/krysa-larisa/", "reason_html": "потратила монету на переброс атаки роя призванных крыс на офицера"}, {"t": "1:07:41", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "отличный бросок внимательности (17) при поиске монет в фонтане, находчивая идея понырять", "result": null, "sec": 4061, "who_url": "/c/krysa-larisa/", "reason_html": "отличный бросок внимательности (17) при поиске монет в фонтане, находчивая идея понырять"}, {"t": "1:07:52", "kind": "loot", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "в фонтане среди кучи мелких неценных монет (медяков) найдена одна золотая монета — внутриигровое сокровище, не игровая механика", "result": null, "sec": 4072, "who_url": "/c/krysa-larisa/", "reason_html": "в фонтане среди кучи мелких неценных монет (медяков) найдена одна золотая монета — внутриигровое сокровище, не игровая механика"}, {"t": "1:10:09", "kind": "other", "who": "Вульф Ва", "actor": "Расул Чабдаров", "to": null, "reason": "партия попыталась потратить монету на переброс проверки скрытности (застряла в клетке), но мастер отказал — критические провалы не перебрасываются", "result": "монета не потрачена, персонаж осталась застрявшей в клетке", "sec": 4209, "who_url": "/c/vulfa/", "reason_html": "партия попыталась потратить монету на переброс проверки скрытности (застряла в клетке), но мастер отказал — критические провалы не перебрасываются"}, {"t": "1:21:42", "kind": "spend", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "потратила монету на переброс проверки выносливости стаи призванных крыс внутри желатинового куба", "result": "переброс тоже неудачный (выпала единица), все крысы погибли", "sec": 4902, "who_url": "/c/krysa-larisa/", "reason_html": "потратила монету на переброс проверки выносливости стаи призванных крыс внутри желатинового куба"}], "totals": [{"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 2, "spent": 2, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Лос Ускаманос", "actor": "Евгений Чеботков", "earned": 0, "spent": 1, "img": "img/chars/uskamanos.webp", "who_url": "/c/los-uskomanos/", "actor_url": "/p/evgeniy-chebatkov/"}, {"who": "Вульф Ва", "actor": "Расул Чабдаров", "earned": 1, "spent": 0, "img": "img/chars/vul-f-va.webp", "who_url": "/c/vulfa/", "actor_url": "/p/rasul-chabdarov/"}, {"who": "Которный", "actor": "Пимп", "earned": 0, "spent": 0, "img": "img/chars/kotornyj.webp", "who еского <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>, союз с эльфами, джинн исполнил желание <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> — смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "Продолжение", "dir": "out", "color": "#C8423B"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убил <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад", "dir": "back", "color": "#C8423B"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Желание смерти <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и гибель Властона от руки <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Прекращение сношений с дьявольскими силами и отказ от любых сношений с указанными силами навечно» — мирный договор.", "«Стрелял кот!» — <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, пытаясь обмануть стражу.", "«Бери её в жёны, делайте детей и живите счастливо. Идите отсюда!» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> помилованным.", "«Мышка, мне нужна помощь. Внутри меня находится странная шкатулка» — чёрный желатиновый куб."], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>, дворец лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, сад-лагерь с походным борделем, клетка с пленными крестьянами, западная канализационная («говняная») труба, комнаты 5 и 6.<\/li>\n<li><a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> (королевство лесных эльфов), <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> (газета «Вечерний Кёнигпон»), <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>, деревня дварфов <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a>.<\/li>\n<li>Фракции: войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, тёмные жрецы <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, партизаны <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>, лесные эльфы <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфела<\/a>, горные дварфы.<\/li>\n<li>Артефакты: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> (некротическая молния, поглощает жизненную силу убитых), меч Лёвенхартов, мирный договор с печатью <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, дварфийский топор силы огня и камня, таинственная шкатулка (пьёт кровь), масло для смазывания, борщ.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>18<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>18<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>2<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>7<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>4<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa18-2\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Пимп приглашён на съёмки нового пула выпусков<\/b><\/div><p>Авторы объявили, что пригласили рэпера Young P&amp;H (Пимпа) на съёмки следующего пула выпусков «Подземелий».<\/p><blockquote>«мы пригласили Пимпа на съёмки, «Подземелья» будем снимать, новые выпуски, новый пул, и там будет Пимп»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-2\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=693\" target=\"_blank\" rel=\"noopener\">0:11:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa19-22\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Две пасхалки к персонажу Чебаткова; Нурик пришлёт его в 21-м<\/b><\/div><p>В 19-м выпуске были две пасхалки к персонажу <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгения Чебаткова<\/a>; выпуск с ним уже снят — король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> направит его в отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в 21-м выпуске.<\/p><blockquote>«король Нурик выпишет персонажа Чеботкова в отряд Сфинктериона в 21 выпуске»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-22\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4105\" target=\"_blank\" rel=\"noopener\">1:08:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa19-26\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Смерть Властона не произойдёт за кадром<\/b><\/div><p>Авторы сказали, что сценарии пишут не наперёд, а по следствиям сыгранного, и последствия желания покажут в 21-м выпуске: убийство <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> «за кадром» они себе драматически позволить не могут.<\/p><blockquote>«мы авторски и драматически не можем позволить себе убийство Властона за кадром»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-26\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4365\" target=\"_blank\" rel=\"noopener\">1:12:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-1\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>21-й выпуск разделён на две части и подводит черту<\/b><\/div><p>Авторы сообщили, что история 21-го выпуска подводит сюжетную черту под предыдущими событиями, поэтому его разделили на две части с перерывом в 2–3 недели; в кино его, скорее всего, показывать не будут.<\/p><blockquote>«история, которая происходит в двадцать первом выпуске, она в некотором смысле подводит сюжетную черту под предыдущими событиями»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-1\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=147\" target=\"_blank\" rel=\"noopener\">0:02:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa21-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск 21 разделили на две части из-за объёма<\/b><\/div><p>После первого отбора на монтаже материала осталось примерно на 3 часа 40 минут. Резать шутки авторы не захотели, а трёхчасовой выпуск с сотнями иллюстраций и озвучкой не успели бы сделать за месяц. Поэтому выпуск разделили: в первой части фигуры расставляются (сад, бои), во второй ими играют (дворец, разговоры).<\/p><blockquote>«в первой половине расставляются фигуры, во второй половине уже этими фигурами играются»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-1\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=97\" target=\"_blank\" rel=\"noopener\">0:01:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-2\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Тайная мотивация Ларисы — добиться смерти Властона<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> рассказал, что в задании для <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> было прописано: даже если <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не захочет убивать <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, она должна настоять и сделать так, чтобы его убили. Крыса мстительна и мстит за <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>. Играть ничего не пришлось: за столом все и так кричали «убей».<\/p><blockquote>«в задании для Крысы было: даже если Сфинктерион не захочет убивать Властона, я должен настоять и сделать так, чтобы его убили»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa21/#qa21-2\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=358\" target=\"_blank\" rel=\"noopener\">0:05:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-4\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Во дворце противостояли две фракции — солдаты и жрецы<\/b><\/div><p>Авторы объяснили структуру приключения. Во дворце враждовали фракция солдат (генерал Твёрдый) и фракция жрецов (Гуди), и обе считали дни <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> сочтёнными. Военные хотели захватить власть после его смерти, но побаивались Гуди. Жрецы, некроманты, служившие прежде богу Солнца, а теперь дьявольским силам, тоже хотели власти и поэтому продлевали Властону жизнь. Какую фракцию выберут герои, авторы заранее не знали.<\/p><blockquote>«существуют две фракции, противоборствующие друг с другом: это фракция солдат и фракция жрецов»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-4\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=618\" target=\"_blank\" rel=\"noopener\">0:10:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa21-20\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>У Вульф Ва был компас, чующий исчадий и небожителей<\/b><\/div><p>Авторы рассказали, что положили в инвентарь <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> компас, указывающий на исчадий ада или небожителей, по аналогии с паладинским чутьём. С его помощью можно было распознать беса в вороне.<\/p><blockquote>«у Вульф Ва мы положили в инвентарь такой компас, который указывает либо на исчадий, либо на небожителей»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-20\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=2177\" target=\"_blank\" rel=\"noopener\">0:36:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa21-25\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Шкатулку в кислотный куб бросила Ирэна Твёрдая<\/b><\/div><p>Шкатулка всегда была у <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Ирэна, ухаживая за больным, нашла её и решила, что эта дьявольская вещь высасывает из него силы. Уничтожить шкатулку она не смогла и бросила её в кислотный куб, который переваривал все отходы дворца. Куб её не переварил, из-за этого засорилась «говняная труба» и встала кухня. Солдаты полезли разбираться: одного обварило, второго загрызла <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>.<\/p><blockquote>«попыталась её уничтожить, никаким образом у неё не получалось это сделать, и она кинула эту шкатулку в единственное место, которое уничтожало всё»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-25\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=2765\" target=\"_blank\" rel=\"noopener\">0:46:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa21-26\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><span class=\"tag\">возможно, шутка<\/span><b>«Кружка удачи» Гудкова<\/b><\/div><p>Крит, с которым <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку из куба, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> выбросил, кинув кубик из кружки, из которой пил. По словам авторов, на двух следующих съёмках всё, что кидали из этой кружки, выпадало больше пятнадцати.<\/p><blockquote>«после двадцать первого выпуска мы сняли ещё два, и всё, что кидали в эту кружку, всё выпадало больше пятнадцати»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-26\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=2875\" target=\"_blank\" rel=\"noopener\">0:47:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-37\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Ассистентка дала монету Вульф Ва из женской солидарности<\/b><\/div><p>Монету в руки <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, по шутливому объяснению, дали как дань матриархату кунисских дварфов: это была женская солидарность.<\/p><blockquote>«это женская солидарность и признание по половому признаку»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-37\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=5346\" target=\"_blank\" rel=\"noopener\">1:29:06 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-40\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Комната 5 рядом с кубом — туалет<\/b><\/div><p>Неисследованная комната 5 рядом с кислотным кубом в канализации была туалетом.<\/p><blockquote>«комната номер пять — это туалет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-40\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=5710\" target=\"_blank\" rel=\"noopener\">1:35:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-45\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Минусовая харизма Ускаманоса — намеренный «синдром отличника»<\/b><\/div><p>Эльфу дали отрицательную харизму, чтобы подчеркнуть, что его заумность отталкивает окружающих, а уродливой дварфихе дали плюс. При этом <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Чебаткову<\/a> позволяли добиваться успеха в социальных ситуациях без бросков: например, мастер разрешил не бросать, если он воспроизведёт инфернальную мантру.<\/p><blockquote>«дали ему минусовую харизму, чтобы подчеркнуть, что вся его заумность, обученность, талант отталкивает людей»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-45\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=6092\" target=\"_blank\" rel=\"noopener\">1:41:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-46\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Старосты Грюнберга: выборная должность при матриархате<\/b><\/div><p>В выпуске 10 старостой <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a> назван <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран Десперадос<\/a>, а в 21-м <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> отправила староста <a class=\"ref\" href=\"/c/bulbu-bulbashi/\">Бульбух<\/a>. Авторы предположили, что при матриархате староста — выборная должность с коротким сроком (возможно, год), и мужчины тоже могут её занимать.<\/p><blockquote>«это скорее всего выборная должность и, очевидно, не такой уж длинный у неё срок»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-46\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=6225\" target=\"_blank\" rel=\"noopener\">1:43:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa21-47\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Интерьеры дворца Властона украсили арты зрителей<\/b><\/div><p>Чтобы украсить дворец и сократить время на фоны, по идее художницы Кати провели конкурс артов среди зрителей. Часть работ художницы использовали в интерьерах дворца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<\/p><blockquote>«мы думали, каким образом украсить дворец, но при этом сократить время рисования фонов, и Катя предложила супер идею — сделать конкурс»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-47\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=6293\" target=\"_blank\" rel=\"noopener\">1:44:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск поделили из-за иллюстраций, а не из-за звёзд<\/b><\/div><p>Авторы объяснили, что 28, как и «Судьбу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (21a/21b), снимали как одно приключение. На монтаже материала оказалось больше 2,5 часа. Художницы рисуют около 150 иллюстраций за 3–4 недели, а на полную версию понадобилось бы около 250. Поэтому выпустили первую часть, а остальные иллюстрации дорисовали ко второй; бюджет на художников был как на два выпуска.<\/p><blockquote>«Это производственная необходимость и экономика шоу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-9\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1991\" target=\"_blank\" rel=\"noopener\">0:33:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-22\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Нурик не помогает Сфинктериону<\/b><\/div><p>По союзу с эльфами из вып. 19 они должны были помогать <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальду<\/a> против <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Помощь не понадобилась, потому что крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала джинну смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> всё же дал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> своего лучшего бойца — Лоса <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>. На вопрос, почему в нынешнем договоре есть бумага с текстом, а тогда её не было, ответили шуткой про «ретроспективную заявку».<\/p><blockquote>«Нурик дал тебе, Сфинктериону, лучшего своего бойца... Лоса Ускаманоса»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-22\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa51-52-45\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Кисель не обязан Брэндону жизнью — он благодарен за освобождение<\/b><\/div><p>Формулировка «куб задолжал жизнь» неточна. Кисель — тот самый куб из мусорной комнаты (4-й выпуск, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> — «Блины»), из которого в 21-м выпуске <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку с контрактом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Когда <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> вернулся из ада, Тёмный властелин устроил во дворце место для зеркала Асмодея и выпустил Киселя из мусорной комнаты. Он единственный проявил к кубу участие, не смог лишь показать ему солнце, поэтому Кисель ему благодарен.<\/p><blockquote>«Смысл в формулировке. Он не задолжал жизнь Брэндону.»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> В summaries/ep51.md (п. 12 и список NPC) Кисель назван «обязанным хозяину жизнью»; по словам авторов, он не обязан жизнью, а благодарен Тёмному властелину за то, что тот выпустил его из мусорной комнаты и проявил к нему заботу.<\/p><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-45\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7138\" target=\"_blank\" rel=\"noopener\">1:58:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><\/section>", "chars": {"Пони V": {"name": "Король Поний V", "img": "img/chars/ponij-v.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9F%D0%BE%D0%BD%D0%B8%D0%B9_V", "summary": "По́ний V — молодой король Понии, пришедший к власти после смерти своего отца.", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Неигровой", "Н
