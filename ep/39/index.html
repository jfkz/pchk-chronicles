<script>window.EPD = {"anim": false, "key": "39", "label": "39", "title": "Кунисская пленница", "date": "2025-06-21", "minutes": 121, "duration": 7274.0, "video_id": "s0rqhh7IbX8", "branch": "Янус и дракон Гимелут", "branch_color": "#B8901C", "place": "Кунисские горы: родовое село Каразоновка клана Каразон и Пещера Каменных Слёз", "short_html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракон Гимелут<\/a>, получивший маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> после гибели Эльфдодиса, требует у кунисских дварфов невесту, и совет <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a> посылает отряд похитить Нераду Каразон. Под присмотром «чародея Дракости» (самого Гимелута) и драконорождённого <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> отряд убивает сына главы клана, взрывает арсенал и крадёт Нераду из семейного склепа. В Пещере Каменных Слёз старейшина <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> раскрывает, что навёл на свадьбу речных гномов; драконобойки почти убивают Гимелута, но его пламя испепеляет Шафрана. <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> спасает дракона, и тот улетает с ним и Мираторгом.", "summary_html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракон Гимелут<\/a>, завладевший золотой маской <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> после гибели Эльфдодиса (вып. 32), требует у дварфов Кунисских гор невесту. Совет старейшин <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a> посылает отряд дварфов похитить красавицу Нераду Каразон из родового села клана Каразон; за ними «присматривает» чародей Дракостя — сам Гимелут в человеческом облике — и его «свидетель на свадьбе», драконорождённый <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>. Отряд устраивает в Каразоновке кровавый хаос (убивают сына главы клана, взрывают арсенал, поджигают поле), крадёт Нераду из семейного склепа и сплавляется по реке к Пещере Каменных Слёз. На «свадьбе» выясняется, что старейшина <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> тайно навёл на пещеру речных гномов — давних врагов дракона; гномы с драконобойками почти убивают Гимелута, огненное дыхание дракона испепеляет Шафрана, но <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> зачем-то лечит дракона, и тот улетает, унося Дудуша и Мираторга.", "outcome_html": "Засада речных гномов едва не убила <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a>; <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> погиб, Нерада спасена. Раненый дракон бежал с <a class=\"ref\" href=\"/c/dudush/\">Дудушем<\/a> и <a class=\"ref\" href=\"/c/miratorg/\">Мираторгом<\/a> и обещает отомстить.", "world_html": ["Союз кунисских дварфов с драконом <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелутом<\/a> сорван", "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> с золотой маской <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> стал новой враждебной силой в королевстве", "Речные гномы показали, что драконобойками можно ранить дракона", "Клан Каразон потерял сына главы и арсенал"], "scenes": [{"t": "0:01:33", "sec": 93, "html": "Пролог мастера: Эльфдодис с золотой маской <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> стал главарём преступного мира, пытался спасти сестру <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>, погиб в жерле вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> в бою с драконом <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелутом<\/a>; маска досталась дракону."}, {"t": "0:04:08", "sec": 248, "html": "Завязка: 500 лет назад <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> уничтожил гномский город Гусь Пещерный под вулканом и сделал его логовом. Теперь он проснулся, сжёг заставу кунисских дварфов и потребовал в жёны самую красивую и знатную девушку. Совет выбрал Нераду Каразон, но её отец Пырей Каразон отказался («Своих детей несите дракону!») и укрылся в родовом селе."}, {"t": "0:05:25", "sec": 325, "html": "–[0:17:00] Представление героев. <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> угрожает, что при провале деревню сожгут; затем раскрывается, что он и есть Гимелут."}, {"t": "0:13:18", "sec": 798, "html": "Каразоновка: отряд у реки. <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> пытается разговорить овцу (способность говорить с животными), пастух — безбородый дварф с дудочкой — подозревает неладное. Ярус выпускает в реку живых рыб «на будущее»."}, {"t": "0:20:07", "sec": 1207, "html": "Пастух спускает алабая Сыра. <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> внушением отправляет пастуха «привести Нераду, если найдёт». <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> из винтовки с глушителем убивает собаку; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> потрошит её, и <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> надевает шкуру как костюм."}, {"t": "0:29:28", "sec": 1768, "html": "Освобождённая овца ведёт к тайному ходу главы клана на западе. Герб клана (щит-сердце с секирами и головой барана): надпись «только истинный Каразон небритой бороды пройдёт» — <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> суёт в скважину свою сплетённую из волос старейшин бороду, и проход открывается. Овцу, отказавшуюся идти вперёд, поджигают, она убегает."}, {"t": "0:36:19", "sec": 2179, "html": "Люк наверх оказывается мангалом; <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> обжигается и попадает на толстого рыжего дварфа — Календула Каразона, сына главы клана. Тот распознаёт костюм собаки и бьёт Дудуша молотом."}, {"t": "0:39:48", "sec": 2388, "html": "–[0:47:36] Бой: огненный вихрь <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a>, сеть, метательные топоры, удочка <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a>, крит из арбалета <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>; Дракостя добивает Календула магическими стрелами — тот умирает на коленях, поддерживаемый доспехом."}, {"t": "0:48:33", "sec": 2913, "html": "Появляется гоблин-слуга (его семью вырезал клан Каразон) и соглашается помочь. <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> лечат борщом и зельем, найденным у убитого (ещё зелья храбрости и ускорения)."}, {"t": "0:52:58", "sec": 3178, "html": "Гоблин приносит записку «от мамы»: рагу отнести вечером «красавице и братьям» в схрон. Отряд дожаривает свинину, выдаёт её за рагу; гоблин несёт его матери, белка <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> (по имени <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>) следит."}, {"t": "0:59:12", "sec": 3552, "html": "<a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> удушающей леской вырубает стражника, подглядывавшего в женскую спальню; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> погружает его в «искусственную кому», подвесив леской на дереве. Белка: мать с рагу ушла на восток за мост."}, {"t": "1:08:20", "sec": 4100, "html": "<a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> и <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> надевают снятые со стражников дварфийские доспехи. Гоблин сообщает: пастух очнулся и поднял тревогу — «отряд дварфов и чародей в красном, вроде с драконом»."}, {"t": "1:12:42", "sec": 4362, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> с плеч <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> огненным шаром взрывает арсенал; вся деревня бросается тушить. Ретро-заявка Мираторга про рыб: форель атакует, но помешать не может. Дракостя громовым шагом телепортирует отряд, лестница становится мостом через реку."}, {"t": "1:17:50", "sec": 4670, "html": "Дозорные замечают <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> («Дракон!»); «стражники» <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> и <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> якобы скручивают его, затем дымовая шашка, <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> поджигает фермерское поле."}, {"t": "1:19:33", "sec": 4773, "html": "Родовое кладбище: по запаху рагу <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> находит склеп Базилика Каразона. Внутри Нерада, мать и братья, в т.ч. Тимьян Каразон. Убеждение «дракон напал, отец велел увести» проваливается; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> создаёт иллюзию Пырея — и в склеп на баране въезжает настоящий Пырей Каразон."}, {"t": "1:27:38", "sec": 5258, "html": "Дымовая шашка, Нераду ловят сетью; <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> сбивает боевого барана Пырея ударом по сухожилию. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> выпускает последних рыб — косяк несёт отряд вниз по течению. Арбалетный болт прошивает <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостю<\/a> и Мираторга; <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> топорами режет шипастую сеть на выходе из деревни, погоня на баранах отстаёт."}, {"t": "1:34:02", "sec": 5642, "html": "Пещера Каменных Слёз: сталактиты, клетка с белыми голубями. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> и <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> устраивают «церемонию», Нерада обещает, что брат убьёт дракона. Дракостя превращается в Гимелута."}, {"t": "1:37:22", "sec": 5842, "html": "Засада: <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> признаётся, что как старейшина сообщил речным гномам (давним врагам <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a>) место передачи невесты. Выбегают три отряда гномов и два расчёта с драконобойками (клич «За Гусь Пещерный!»). <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> встаёт на сторону гномов, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> формально тоже («убьём всех, кто за дракона»)."}, {"t": "1:41:07", "sec": 6067, "html": "–[1:49:54] Бой: <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> с молотом «Олег» в дварфийской ярости, драконобойки наносят 150 урона, топор Яруса, скрытный выстрел <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> из арбалета. Хвост дракона не может свалить <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a>."}, {"t": "1:50:52", "sec": 6652, "html": "Огненное дыхание <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a> (69 урона): <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a>, прицеливавшийся для критического выстрела, сгорает в пепел (остаётся расплавленная винтовка); <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> и <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> при смерти, сгорает и один из гномов-стрелков."}, {"t": "1:56:20", "sec": 6980, "html": "Суицидальная атака гномов (94 урона) добирается до сердца дракона — <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> без сознания. <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> проходит проверку медицины и спасает дракона (1 хит)."}, {"t": "1:59:07", "sec": 7147, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> хватает <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> и <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> и улетает из пещеры, обещая месть. <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> остаётся с гномами и Нерадой («Можно я её в жёны возьму?» — «Бери»). Эпилог: в королевстве появилась новая сила — дракон, которого не получится игнорировать."}], "key_events": [{"t": "0:04:08", "sec": 248}, {"t": "0:20:07", "sec": 1207}, {"t": "0:33:27", "sec": 2007}, {"t": "0:39:48", "sec": 2388}, {"t": "1:12:42", "sec": 4362}, {"t": "1:21:28", "sec": 4888}, {"t": "1:27:38", "sec": 5258}, {"t": "1:37:22", "sec": 5842}, {"t": "1:50:52", "sec": 6652}, {"t": "1:56:20", "sec": 6980}, {"t": "1:59:07", "sec": 7147}], "coins": {"ep": "39", "events": [{"t": "0:33:27", "kind": "earn", "who": "Дудуш", "actor": "Турал Натурал", "to": null, "reason": "находчиво сунул бороду в замочную скважину вместо утерянных отмычек и открыл потайную дверь", "result": null, "sec": 2007, "who_url": "/c/dudush/", "reason_html": "находчиво сунул бороду в замочную скважину вместо утерянных отмычек и открыл потайную дверь"}, {"t": "0:36:03", "kind": "earn", "who": "Ярус", "actor": "Илья Макаров (Макар)", "to": null, "reason": "пожалел подпалённую овцу и отпустил её вместо погони, хороший отыгрыш заботы о персонаже", "result": null, "sec": 2163, "who_url": "/c/yarus/", "reason_html": "пожалел подпалённую овцу и отпустил её вместо погони, хороший отыгрыш заботы о персонаже"}, {"t": "1:15:24", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "за находчивую ретроспективную заявку про агрессивную форель, которая мешает охранникам тушить пожар", "result": "проверка сложности прошла на критической удаче", "sec": 4524, "who_url": "/c/miratorg/", "reason_html": "за находчивую ретроспективную заявку про агрессивную форель, которая мешает охранникам тушить пожар"}, {"t": "1:23:45", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили монету на переброс проверки Харизмы/Убеждения, чтобы страж поверил, что перед ним «мать»", "result": "из фрагмента следует, что даже после переброса результата не хватило", "sec": 5025, "who_url": null, "reason_html": "потратили монету на переброс проверки Харизмы/Убеждения, чтобы страж поверил, что перед ним «мать»"}], "totals": [{"who": "Дудуш", "actor": "Турал Натурал", "earned": 1, "spent": 0, "img": "img/chars/dudush.webp", "who_url": "/c/dudush/", "actor_url": "/p/tural-natural/"}, {"who": "Ярус", "actor": "Илья Макаров (Макар)", "earned": 1, "spent": 0, "img": "img/chars/yarus.webp", "who_url": "/c/yarus/", "actor_url": "/p/ilya-makarov/"}, {"who": "Мираторг", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/miratorg.webp", "who_url": "/c/miratorg/", "actor_url": "/p/brb/"}], "notes": "Один случай (переброс проверки «я твоя мать») из фрагмента непонятно чей — получатель не указан. Подсчёта итоговых монет на конец выпуска в доступном фрагменте нет."}, "cast": [{"name": "Дракостя / дракон Гимелут", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "дракон в облике человека, дворянин-чародей драконьей крови", "role": "", "fate": "выжил (тяжело ранен, бежал)", "id": "Гимелут", "url": "/c/drakon-gimelut/ itle": "Груз Кристиночки", "note_html": "Упомянута сестра Эльфдодиса <a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> и <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран Десперадо<\/a>, <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a> и дракон", "dir": "back", "color": "#3E9A5E"}, {"key": "49", "label": "49", "title": "Раненый дракон", "note_html": "Задел: месть раненого дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "50", "label": "50", "title": "Крыса корабельная", "note_html": "Каблучанус уладил требования независимости кунисских дварфов", "dir": "back", "color": "#DD7A2F"}], "quotes_html": ["«Своих детей несите дракону, трусы!» — Пырей Каразон.", "«Только истинный Каразон небритой бороды пройдёт» — надпись на гербе.", "«Лучше барана нет друга, не так ли?» — <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>.", "«Горные дварфы — свободный народ, и мы не ляжем под дракона» — <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a>.", "«Мы вернёмся… в следующий раз я уничтожу вас» — <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a>, улетая."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a>; дварфийский городок <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a>; родовое село Каразоновка (арсенал, склепы родового кладбища, склеп Базилика Каразона); Пещера Каменных Слёз; вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> и гномский город Гусь Пещерный (логово <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a>).<\/li>\n<li>Фракции: Совет двенадцати старейшин <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a>; клан Каразон; клан Десперадо; речные гномы.<\/li>\n<li>Артефакты: золотая маска <a class=\"ref\" href=\"/c/yanus/\">Януса
