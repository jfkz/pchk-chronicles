али, что лучше дать вот такое, чтобы вы до последнего были заинтересованы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-28\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=6475\" target=\"_blank\" rel=\"noopener\">1:47:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-21\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сильные персонажи Гудкова достались ему случайно<\/b><\/div><p>На вопрос о «перевесе» сильных героев у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> (бессмертная крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, дракон, высший вампир, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> с мечом) авторы ответили, что это случайность: меч мог оказаться у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> или у <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a>, а золотая маска Януса — остаться у <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> или перейти к <a class=\"ref\" href=\"/c/miratorg/\">Мираторгу<\/a>.<\/p><blockquote>«Вообще меч мог быть и у Пахома, скорее всего. — Меч мог быть и у Кристины. — Маска… могла остаться у Дододиса. — Она могла перейти и Мираторгу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-21\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3918\" target=\"_blank\" rel=\"noopener\">1:05:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-35\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Баланс сил: артефакты против числа, Гиммилут сам за себя<\/b><\/div><p>У божественной стороны больше найденных артефактов, у демонов — численность. Самая интересная фигура — дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>: он пока ни за кого, только за себя, и после золотой маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспехов стал почти непобедимым.<\/p><blockquote>«Гиммилут пока что ни за кого, только за себя.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-35\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-3\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Свадьба Яруса — его мечта ещё из выпуска 39<\/b><\/div><p>О бонусах свадьбы мастер сказал игрокам только в середине игры, и сыграть её решили не сразу. Зрители заметили, что ещё в выпуске 39 <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> называл своей мечтой жениться на «нормальной бабе»: <a class=\"ref\" href=\"/p/ilya-makarov/\">Макаров<\/a> помнил это и вёл персонажа к свадьбе с самого начала.<\/p><blockquote>«Его мечта — это найти женщину и жениться на нормальной бабе. Это его мечта из прошлого выпуска.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-3\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=1992\" target=\"_blank\" rel=\"noopener\">0:33:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-10\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Шафрана спасать не планировали — он был шуткой для зрителей<\/b><\/div><p>Авторы не ожидали, что игроки станут освобождать <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a>: его поместили в клетку ради шутки. После выпуска 39 было много вопросов, зачем он застрелил собаку. Отсюда версия, что он погиб праведником, но единственный грех — убийство невинной пастушьей собаки — перевесил всё остальное.<\/p><blockquote>«Мы не думали, что вы его будете освобождать. Он там был ради шутки реально.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-10\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3135\" target=\"_blank\" rel=\"noopener\">0:52:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-27\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Ярус против дракона: месть Гиммилуту откладывается<\/b><\/div><p>На вопрос, позовёт ли <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> новых друзей против дракона, <a class=\"ref\" href=\"/p/ilya-makarov/\">Илья Макаров<\/a> ответил, что противник серьёзный: нужно хорошо подготовиться и иметь козыри в рукаве. Теперь Ярус переживает и за семью, поэтому пока он продолжает свой путь.<\/p><blockquote>«Серьёзный, на самом деле, противник. И тяжеловато втягивать друзей в такую передрягу.»<\/blockquote><p class=\"note\">Илья Макаров · <a href=\"/pod/qa47/#qa47-27\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5600\" target=\"_blank\" rel=\"noopener\">1:33:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-29\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Из ада вывели только душу Шафрана — её статус не решён<\/b><\/div><p><a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> погиб в выпуске 39, поэтому отряд вынес из ада только его душу, к тому же изуродованную пытками и «перелепкой» лица. Авторы признали, что после свадьбы о нём забыли и теперь нужно решить по лору, кем он вышел: призраком, как барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, или неупокоенным духом-рейфом, жаждущим мести <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилуту<\/a>. Тело ему могли бы дать некромант или чумная крыса из инвентаря.<\/p><blockquote>«Нам очень нужно понять теперь, как он вышел, в каком качестве. … Если он вышел, то это будет неупокоенный призрак, который будет желать только мести.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep47.md («Итог») пишет, что «все пятеро героев и спасённый <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> выжили», а в разделе персонажей — что Шафран «спасён из ада». На деле Шафран мёртв с выпуска 39: из ада вынесли только его (изуродованную) душу, и в каком виде она существует, авторы ещё не решили.<\/p><p class=\"note\"><a href=\"/pod/qa47/#qa47-29\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5854\" target=\"_blank\" rel=\"noopener\">1:37:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-32\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Гиммилут стал слишком сильным — авторы думают, как его ослабить<\/b><\/div><p>Самый высокий уровень в ПЧК у дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> — около 15, у него 250 ХП в человеческом облике, маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспех. Он считает себя богом на земле, потому что герои не убили его в выпуске 32. Авторы признались, что им сложно им играть и они думают, как дракона ослабить: например, украсть у него маску.<\/p><blockquote>«Мы сейчас думаем, как этого дракона, блин, ослабить. Им невозможно играть. Он может всё.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-32\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6233\" target=\"_blank\" rel=\"noopener\">1:43:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>37<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Шмыгель — тот самый безымянный гоблин из «Кунисской пленницы»<\/b><\/div><p><a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> вырос из безымянного гоблина-слуги из вып. 39, которого тогда отыгрывал мастер. Зрители его запомнили, рисовали арты и много о нём писали, поэтому авторы сделали его персонажем игрока.<\/p><blockquote>«вот этот гоблин, у которого тогда не было ещё никакого имени, сильно запомнился зрителям»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-3\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=530\" target=\"_blank\" rel=\"noopener\">0:08:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-13\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>38<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему Гиммилут хочет власти над миром: версия о матери Драксении<\/b><\/div><p>Автор вступления к выпуску поделился своей логикой. О власти драконов над миром, возможно, мечтала мать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> Драксения. Драконы — «живые боги земного мира»: демоны и небесные боги кормятся земным миром, а власть драконов могла бы прекратить это раздирание и объединить мир, как империя.<\/p><blockquote>«его мать мечтала о власти драконов над миром, потому что они, в сущности, живые боги земного мира»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-13\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=4187\" target=\"_blank\" rel=\"noopener\">1:09:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-30\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>39<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Здоровье Дракости: 30 ХП в вып. 39 были обманкой<\/b><\/div><p>В вып. 39 30 ХП <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a> были отвлекающим манёвром для дварфов, чтобы его не раскрыли, — на деле у дракона было 250–300. В вып. 49 его 30–35 ХП были настоящими: осколок у сердца снизил максимум здоровья и не давал превращаться.<\/p><blockquote>«у Дракости было 30 здоровья, но это был чисто отвлекающий манёвр... На самом деле было у него там 250-300»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa49/#qa49-30\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6216\" target=\"_blank\" rel=\"noopener\">1:43:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><\/section>", "chars": {"Мираторг": {"name": "Мираторг", "img": "img/chars/miratorg.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9C%D0%B8%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B3", "summary": "Мираторг – драконорожденный, столичный рыбак, друг и коллега эльфа Дододиса. Основное оружие – Огненное дыхание, Бамбуковая удочка", "infobox": {"Пол": "Мужской", "Раса": "Драконорожденный", "Тип": "Игровой", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": false, "race": "Драконорожденный", "portraits": [], "url": "/c/miratorg/", "eps": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}, {"key": "49", "label": "49", "title": "Раненый дракон"}]}, "Шафран": {"name": "Шафран Десперадо", "img": "img/chars/shafran.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A8%D0%B0%D1%84%D1%80%D0%B0%D0%BD", "summary": "Шафра́н Деспера́до — дварф, бывший староста деревни Грюнберг в Кунисских горах и самый молодой из старейшин этого города. Носил с собой футляр для контрабаса с разобранной винтовкой.", "infobox": {"Пол": "Мужской", "Раса": "Дварф", "Тип": "Игровой", "Игрок": "Эмир Кашоков", "На вики": "Шафран"}, "actors": ["Эмир Кашоков"], "kind": "pc", "dead": false, "race": "Дварф", "portraits": [{"ep": "39", "thumb": "img/portraits/e477eb6323034f49.webp"}, {"ep": "10", "thumb": "img/portraits/047c487160d93300.webp"}], "url": "/c/shafran-desperado/", "eps": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}]}, "Сыр": {"name": "Сыр", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": true, "race": "", "portraits": [], "url": "/c/syr/", "eps": [{"key": "39", "label": "39", "title": "Кунисская пленница"}]}, "Ярус": {"name": "Ярус", "img": "img/chars/yarus.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%AF%D1%80%D1%83%D1%81", "summary": "Ярус – горный дварф, ловчий горных баранов. Он родом из кунисского города Грюнберга.", "infobox": {"Пол": "мужской", "Раса": "горный дварф", "Тип": "игровой", "Игрок": "Илья Макаров"}, "actors": ["Илья Макаров"], "kind": "pc", "dead": false, "race": "горный дварф", "portraits": [{"ep": "39", "thumb": "img/portraits/959bcc6ffc91d3fc.webp"}], "url": "/c/yarus/", "eps": [{"key": "39", "label": "39", "title": "Кунисская пленница"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}]}, "Гимелут": {"name": "Дракон Гиммилут", "img": "img/chars/drakostya.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D1%80%D0%B0%D0%BA%D0%BE%D1%81%D1%82%D1%8F", "summary": "Дракостя (полное имя – Драконстантин Русов-Ящеров) – дворянин и чародей драконей крови. Человеческое обличие дракона Гиммилута.", "infobox": {"Пол": "мужской", "Раса": "человек", "Тип": "игровой", "Игрок": "Александр Гудков", "На вики": "Дракостя"}, "actors": ["Александр Гудков"], "kind": "pc", "dead": false, "race": "человек", "portraits": [{"ep": "39", "thumb": "img/portraits/f4cc53f1d17139cb.webp"}], "url": "/c/drakon-gimelut/", "eps": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}, {"key": "49", "label": "49", "title": "Раненый дракон"}]}, "Дудуш": {"name": "Дудуш", "img": "img/chars/dudush.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D1%83%D0%B4%D1%83%D1%88", "summary": "Дудуш – полудварф полугном, родом из Грюнберга. Из-за своего гномского наследия, борода у Дудуша не растет и он носит ее на резинке.", "infobox": {"Пол": "мужской", "Раса": "полудварф, полугном", "Тип": "игровой", "Игрок": "Турал Натурал"}, "actors": ["Турал Натурал"], "kind": "pc", "dead": false, "race": "полудварф, полугном", "portraits": [{"ep": "39", "thumb": "img/portraits/bff4fd7e23440ff3.webp"}], "url": "/c/dudush/", "eps": [{"key": "39", "label": "39", "title": "Кунисская пленница"}, {"key": "49", "label": "49", "title": "Раненый дракон"}]}
