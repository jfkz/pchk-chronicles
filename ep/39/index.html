<script>window.EPD = {"anim": false, "key": "39", "label": "39", "title": "Кунисская пленница", "date": "2025-06-21", "minutes": 121, "duration": 7274.0, "video_id": "s0rqhh7IbX8", "branch": "Янус и дракон Гиммилут", "branch_color": "#B8901C", "place": "Кунисские горы: родовое село Коразоновка клана Коразон и Пещера Каменных Слёз", "short_html": "Совет <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a> посылает отряд похитить дварфийку Нераду в невесты дракону <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилуту<\/a>.", "summary_html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракон Гиммилут<\/a>, завладевший золотой маской <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> после гибели Эльфдодиса (вып. 32), требует у дварфов Кунисских гор невесту. Совет старейшин <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a> посылает отряд дварфов похитить красавицу Нераду Коразон из родового села клана Коразон; за ними «присматривает» чародей Дракостя — сам Гиммилут в человеческом облике — и его «свидетель на свадьбе», драконорождённый <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>. Отряд устраивает в Коразоновке кровавый хаос (убивают сына главы клана, взрывают арсенал, поджигают поле), крадёт Нераду из семейного склепа и сплавляется по реке к Пещере Каменных Слёз. На «свадьбе» выясняется, что старейшина <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> тайно навёл на пещеру речных гномов — давних врагов дракона; гномы с драконобойками почти убивают Гиммилута, огненное дыхание дракона испепеляет Шафрана, но <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> зачем-то лечит дракона, и тот улетает, унося Дудуша и Мираторга.", "outcome_html": "Засада речных гномов едва не убила <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>; <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> погиб, Нерада спасена. Раненый дракон бежал с <a class=\"ref\" href=\"/c/dudush/\">Дудушем<\/a> и <a class=\"ref\" href=\"/c/miratorg/\">Мираторгом<\/a> и обещает отомстить.", "world_html": ["Союз кунисских дварфов с драконом <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилутом<\/a> сорван", "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> с золотой маской <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> стал новой враждебной силой в королевстве<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Гиммилута на новые свершения толкнула маска Януса\">26<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Гиммилута на новые свершения толкнула маска Януса<\/b> Дракон ни к демонам, ни к небесам не примкнёт: он сам по себе, «новая сила». По скрытой легенде, после захвата Гуся Пещерного он 500 лет жил пассивно, копя сокровища, и лишь маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, интеллектуально общающаяся и более разумная, чем он, внушила ему, что он бог на земле и пора выходить из пещеры. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=5267\" target=\"_blank\" rel=\"noopener\">1:27:47 ↗<\/a> · <a href=\"#qa39-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Баланс сил: артефакты против числа, Гиммилут сам за себя\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Баланс сил: артефакты против числа, Гиммилут сам за себя<\/b> У божественной стороны больше найденных артефактов, у демонов — численность. Самая интересная фигура — дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>: он пока ни за кого, только за себя, и после золотой маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспехов стал почти непобедимым. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6731\" target=\"_blank\" rel=\"noopener\">1:52:11 ↗<\/a> · <a href=\"#qa41-42-35\">к записи<\/a><\/span><\/span>", "Речные гномы показали, что драконобойками можно ранить дракона<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Малая драконобойка с газовым баллоном\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Малая драконобойка с газовым баллоном<\/b> Большой драконобойке из №32 нужна была паровая система Гуся Пещерного. Гном, которого герои №32 забрали с заставы высших эльфов, как раз испытывал её с газовым баллоном, когда его арестовали; так она не работала. Поэтому изобрели малую драконобойку: урон меньше, зато работает от переносного газового баллона. Речные гномы сотни лет работают над тем, как убивать драконов, поэтому в засаду пришли именно они, а не дварфы. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3993\" target=\"_blank\" rel=\"noopener\">1:06:33 ↗<\/a> · <a href=\"#qa39-16\">к записи<\/a><\/span><\/span>", "Клан Коразон потерял сына главы и арсенал"], "scenes": [{"t": "0:01:33", "sec": 93, "html": "Пролог мастера: Эльфдодис с золотой маской <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> стал главарём преступного мира, пытался спасти сестру <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>, погиб в жерле вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> в бою с драконом <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилутом<\/a>; маска досталась дракону."}, {"t": "0:04:08", "sec": 248, "html": "Завязка: 500 лет назад <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> уничтожил гномский город Гусь Пещерный под вулканом и сделал его логовом. Теперь он проснулся, сжёг заставу кунисских дварфов и потребовал в жёны самую красивую и знатную девушку. Совет выбрал Нераду Коразон, но её отец Пырей Коразон отказался («Своих детей несите дракону!») и укрылся в родовом селе.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дракон захватил Гусь Пещерный 500 лет назад, до рождения Помпея\">1<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дракон захватил Гусь Пещерный 500 лет назад, до рождения Помпея<\/b> Дракон изгнал гномов из Гусь Пещерного 500 лет назад. Сам <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> этого не застал: он родился уже речным гномом в бедности. Впечатление, что Помпея изгнали лично, возникло из-за оговорки Яна <a class=\"ref\" href=\"/p/yan-toples/\">Топлеса<\/a> при чтении легенды. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep38.md: «речной гном <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> из Гуся Пещерного (изгнан драконом Гимелудом)» — дракон по канону <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>, и изгнал он предков Помпея 500 лет назад; сам Помпей родился уже речным гномом.<\/span> <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=5403\" target=\"_blank\" rel=\"noopener\">1:30:03 ↗<\/a> · <a href=\"#qa38-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему дварфов не пустили в Коразоновку\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему дварфов не пустили в Коразоновку<\/b> Совет старейшин, в который входил <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a>, решил не ссориться с драконом и отдать ему Нераду Коразон. Её отец отказался и заперся в родовом селе, ожидая гостей, поэтому ворота были закрыты. Отряд мог бы попробовать обман: сказать, что не согласен с советом и пришёл поддержать клан. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3928\" target=\"_blank\" rel=\"noopener\">1:05:28 ↗<\/a> · <a href=\"#qa39-15\">к записи<\/a><\/span><\/span>"}, {"t": "0:05:25", "sec": 325, "html": "–[0:17:00] Представление героев. Дракостя угрожает, что при провале деревню сожгут; затем раскрывается, что он и есть <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Если бы Дракостю разоблачили раньше\">11<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Если бы Дракостю разоблачили раньше<\/b> Если бы дварфы раскрыли <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостю<\/a> до пещеры, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сразу превратился бы в дракона. Убивать его в человеческом облике <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> не стал, потому что не знал, что чародей — это и есть дракон: это держали в секрете как поворот. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3107\" target=\"_blank\" rel=\"noopener\">0:51:47 ↗<\/a> · <a href=\"#qa39-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Раскрытие Дракости перенесли в начало монтажа\">20<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Раскрытие Дракости перенесли в начало монтажа<\/b> Скрытая легенда <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> за столом раскрылась только в конце, но в монтаже её поставили сразу после его представления: образ дракона и так был очевиден зрителям. Зритель вместо шока следит, как дракон притворяется. Четвёртый поворот (убийство дракона <a class=\"ref\" href=\"/c/dudush/\">Дудушем<\/a>) вырезали. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4312\" target=\"_blank\" rel=\"noopener\">1:11:52 ↗<\/a> · <a href=\"#qa39-19\">к записи<\/a><\/span><\/span>"}, {"t": "0:13:18", "sec": 798, "html": "Коразоновка: отряд у реки. <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> пытается разговорить овцу (способность говорить с животными), пастух — безбородый дварф с дудочкой — подозревает неладное. Ярус выпускает в реку живых рыб «на будущее».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранные места Коразоновки: кузня, мельница, зиндан\">14<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранные места Коразоновки: кузня, мельница, зиндан<\/b> Отряд пропустил часть деревни. В кузне жил кузнец, который болтал под пиво с огненным элементалем в печи. На водяной мельнице жили дварфы Петрушка и Бамбук со спутанными бородами (рубить бороду нельзя): помощь им открыла бы подсказки про кладбище. Были ещё барашня, овчарня и даже подробно описанный женский туалет. Травяные имена дварфов пошли от имени <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a>, которое придумал Эмир. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3615\" target=\"_blank\" rel=\"noopener\">1:00:15 ↗<\/a> · <a href=\"#qa39-13\">к записи<\/a><\/span><\/span>"}, {"t": "0:20:07", "sec": 1207, "html": "Пастух спускает алабая Сыра. <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> внушением отправляет пастуха «привести Нераду, если найдёт». <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> из винтовки с глушителем убивает собаку; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> потрошит её, и <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> надевает шкуру как костюм.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Шафрана спасать не планировали — он был шуткой для зрителей\">33<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Шафрана спасать не планировали — он был шуткой для зрителей<\/b> Авторы не ожидали, что игроки станут освобождать <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a>: его поместили в клетку ради шутки. После выпуска 39 было много вопросов, зачем он застрелил собаку. Отсюда версия, что он погиб праведником, но единственный грех — убийство невинной пастушьей собаки — перевесил всё остальное. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3135\" target=\"_blank\" rel=\"noopener\">0:52:15 ↗<\/a> · <a href=\"#qa47-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:29:28", "sec": 1768, "html": "Освобождённая овца ведёт к тайному ходу главы клана на западе. Герб клана (щит-сердце с секирами и головой барана): надпись «только истинный Коразон небритой бороды пройдёт» — <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> суёт в скважину свою сплетённую из волос старейшин бороду, и проход открывается. Овцу, отказавшуюся идти вперёд, поджигают, она убегает."}, {"t": "0:36:19", "sec": 2179, "html": "Люк наверх оказывается мангалом; <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> обжигается и попадает на толстого рыжего дварфа — Календула Коразона, сына главы клана. Тот распознаёт костюм собаки и бьёт Дудуша молотом.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: В зиндане сидел Полынька Коразон\">15<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>В зиндане сидел Полынька Коразон<\/b> Под мангалом был замаскирован тайный ход, а рядом — яма для наказаний (зиндан) с клеткой. В ней сидел Полынька Коразон, наказанный за то, что предлагал отдать невесту дракону. Освобождённый, он рассказал бы, что Нераду прячут на кладбище. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3741\" target=\"_blank\" rel=\"noopener\">1:02:21 ↗<\/a> · <a href=\"#qa39-14\">к записи<\/a><\/span><\/span>"}, {"t": "0:39:48", "sec": 2388, "html": "–[0:47:36] Бой: огненный вихрь <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a>, сеть, метательные топоры, удочка <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a>, крит из арбалета <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>; Дракостя добивает Календула магическими стрелами — тот умирает на коленях, поддерживаемый доспехом."}, {"t": "0:48:33", "sec": 2913, "html": "Появляется гоблин-слуга (его семью вырезал клан Коразон) и соглашается помочь. <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> лечат борщом и зельем, найденным у убитого (ещё зелья храбрости и ускорения)."}, {"t": "0:52:58", "sec": 3178, "html": "Гоблин приносит записку «от мамы»: рагу отнести вечером «красавице и братьям» в схрон. Отряд дожаривает свинину, выдаёт её за рагу; гоблин несёт его матери, белка <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> (по имени <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>) следит.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Разница способностей Яруса и Дудуша говорить с животными\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Разница способностей Яруса и Дудуша говорить с животными<\/b> У <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> был двусторонний разговор с животными: он понимал их и говорил на их языке. У <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> была врождённая гномья способность говорить с совсем мелкими зверями: они понимали его, а он их нет. Поэтому белка не могла ему ничего рассказать, но могла указать направление или выполнить поручение. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=2037\" target=\"_blank\" rel=\"noopener\">0:33:57 ↗<\/a> · <a href=\"#qa39-6\">к записи<\/a><\/span><\/span>"}, {"t": "0:59:12", "sec": 3552, "html": "<a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> удушающей леской вырубает стражника, подглядывавшего в женскую спальню; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> погружает его в «искусственную кому», подвесив леской на дереве. Белка: мать с рагу ушла на восток за мост."}, {"t": "1:08:20", "sec": 4100, "html": "<a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> и <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> надевают снятые со стражников дварфийские доспехи. Гоблин сообщает: пастух очнулся и поднял тревогу — «отряд дварфов и чародей в красном, вроде с драконом»."}, {"t": "1:12:42", "sec": 4362, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> с плеч <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> огненным шаром взрывает арсенал; вся деревня бросается тушить. Ретро-заявка Мираторга про рыб: форель атакует, но помешать не может. Дракостя громовым шагом телепортирует отряд, лестница становится мостом через реку.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Лестница у арсенала появилась на эскизе карты\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Лестница у арсенала появилась на эскизе карты<\/b> Мастер рисует эскиз карты для художника; рисуя арсенал на скале, он задумался, как дварфы таскают снаряды, и добавил деревянную приставную лестницу. Её можно откинуть при нападении, как у кавказских башен. Игроки использовали её неожиданным образом. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=2538\" target=\"_blank\" rel=\"noopener\">0:42:18 ↗<\/a> · <a href=\"#qa39-8\">к записи<\/a><\/span><\/span>"}, {"t": "1:17:50", "sec": 4670, "html": "Дозорные замечают <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> («Дракон!»); «стражники» <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> и <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> якобы скручивают его, затем дымовая шашка, <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> поджигает фермерское поле."}, {"t": "1:19:33", "sec": 4773, "html": "Родовое кладбище: по запаху рагу <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> находит склеп Базилика Коразона. Внутри Нерада, мать и братья, в т.ч. Тимьян Коразон. Убеждение «дракон напал, отец велел увести» проваливается; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> создаёт иллюзию Пырея — и в склеп на баране въезжает настоящий Пырей Коразон.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Клички баранов и собак Коразоновки\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Клички баранов и собак Коразоновки<\/b> В подготовке к выпуску у ездовых баранов Коразонов были клички Бусь, Рогалик, Бяра, Шуша и Буцефал (последний — баран главы клана Пырея Коразона), у других собак — Читос и Тяпа. В несыгранной овчарне было ещё несколько алабаев. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=319\" target=\"_blank\" rel=\"noopener\">0:05:19 ↗<\/a> · <a href=\"#qa39-2\">к записи<\/a><\/span><\/span>"}, {"t": "1:27:38", "sec": 5258, "html": "Дымовая шашка, Нераду ловят сетью; <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> сбивает боевого барана Пырея ударом по сухожилию. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> выпускает последних рыб — косяк несёт отряд вниз по течению. Арбалетный болт прошивает <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостю<\/a> и Мираторга; <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> топорами режет шипастую сеть на выходе из деревни, погоня на баранах отстаёт.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как к Ярусу вернулись метательные топоры\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как к Ярусу вернулись метательные топоры<\/b> <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> бросил метательные топоры в сеть при сплаве по реке, а позже снова бил ими в бою: топоры по ретро-заявке вернули рыбы, а сами топоры особой конструкции (смещённый центр тяжести, всплывающие рукояти), и их подобрали ниже по течению. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 ↗<\/a> · <a href=\"#qa39-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:34:02", "sec": 5642, "html": "Пещера Каменных Слёз: сталактиты, клетка с белыми голубями. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> и Дракостя устраивают «церемонию», Нерада обещает, что брат убьёт дракона. Дракостя превращается в <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>."}, {"t": "1:37:22", "sec": 5842, "html": "Засада: <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> признаётся, что как старейшина сообщил речным гномам (давним врагам <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>) место передачи невесты. Выбегают три отряда гномов и два расчёта с драконобойками (клич «За Гусь Пещерный!»). <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> встаёт на сторону гномов, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> формально тоже («убьём всех, кто за дракона»).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Скрытая мотивация Шафрана: засада и захват пушки\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Скрытая мотивация Шафрана: засада и захват пушки<\/b> Перед игрой авторы отвели <a class=\"ref\" href=\"/p/emir-kashokov/\">Эмира Кашокова<\/a> в сторону и выдали <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрану<\/a> скрытую задачу: довести похищение до конца и привести невесту в пещеру, чтобы <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> призвал дракона, а там устроить засаду с речными гномами. Второе задание — захватить пушку из старой башни с приставной лестницей: Шафран умел быстро разбирать и собирать оружие, мог вынести её по частям и собрать в пещере, и пушка нанесла бы дракону большой урон. Эмир по просьбе авторов никому из партии не рассказал. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=2652\" target=\"_blank\" rel=\"noopener\">0:44:12 ↗<\/a> · <a href=\"#qa39-9\">к записи<\/a><\/span><\/span>"}, {"t": "1:41:07", "sec": 6067, "html": "–[1:49:54] Бой: <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> с молотом «Олег» в дварфийской ярости, драконобойки наносят 150 урона, топор Яруса, скрытный выстрел <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> из арбалета. Хвост дракона не может свалить <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a>.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Бой в пещере задуман как зеркало выпуска №32\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Бой в пещере задуман как зеркало выпуска №32<\/b> После №32, где зрители спорили, можно ли вообще победить дракона, авторы перевернули ситуацию: дракон стал персонажем игрока, а против него встали игроки и NPC. Бой снова шёл в пещере, где дракон теряет преимущество в манёвре, а сталактиты («каменные слёзы») можно обрушить на него. У гномов были две драконобойки слабее, чем в №32, но кубики у них полетели очень удачно. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=1151\" target=\"_blank\" rel=\"noopener\">0:19:11 ↗<\/a> · <a href=\"#qa39-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему критический удар хвостом не убил Яруса\">25<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему критический удар хвостом не убил Яруса<\/b> Удар хвостом — контролирующее действие (сбить с ног), а не смертельное: даже с критом урон определяют кубики, а <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> выкинул много на защитной способности и потерял лишь 5 хитов. Убийственные удары у дракона — огненное дыхание (с перезарядкой) и атака крыльями по площади. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=5078\" target=\"_blank\" rel=\"noopener\">1:24:38 ↗<\/a> · <a href=\"#qa39-24\">к записи<\/a><\/span><\/span>"}, {"t": "1:50:52", "sec": 6652, "html": "Огненное дыхание <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> (69 урона): <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a>, прицеливавшийся для критического выстрела, сгорает в пепел (остаётся расплавленная винтовка); <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> и <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> при смерти, сгорает и один из гномов-стрелков.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Шафран умер сразу, без спасбросков\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Шафран умер сразу, без спасбросков<\/b> Персонаж с нулём хитов обычно лишь без сознания, и его можно спасти. Но огненное дыхание дракона нанесло <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрану<\/a> столько урона, что остаток ушёл за отрицательный максимум его здоровья (около 30 хитов), а это мгновенная смерть. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3425\" target=\"_blank\" rel=\"noopener\">0:57:05 ↗<\/a> · <a href=\"#qa39-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ужасающее присутствие и легендарные действия дракона не применялись\">21<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ужасающее присутствие и легендарные действия дракона не применялись<\/b> Ужасающее присутствие дракона не срабатывает автоматически: его надо заявить. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> его не применил, выбрав дыхание по троим героям вместо толп гномов, и не тратил легендарные действия (в том числе взмах крыльями, чтобы улететь раньше), считая себя неуязвимым. Если бы он применил присутствие сразу, ходить смог бы только <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4437\" target=\"_blank\" rel=\"noopener\">1:13:57 ↗<\/a> · <a href=\"#qa39-20\">к записи<\/a><\/span><\/span>"}, {"t": "1:56:20", "sec": 6980, "html": "Суицидальная атака гномов (94 урона) добирается до сердца дракона — <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> без сознания. <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> проходит проверку медицины и спасает дракона (1 хит).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: У Дудуша не было скрытой легенды\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>У Дудуша не было скрытой легенды<\/b> Спасение дракона не было тайным заданием: скрытой легенды у <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> не было. <a class=\"ref\" href=\"/p/tural-natural/\">Турал Натурал<\/a> просто захотел финальный твист. По его словам, мотивация персонажа — «пускай драконы живут». <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=961\" target=\"_blank\" rel=\"noopener\">0:16:01 ↗<\/a> · <a href=\"#qa39-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Маску Януса получил бы тот, кто добил дракона\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Маску Януса получил бы тот, кто добил дракона<\/b> Если бы <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> не вылечили, маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> досталась бы тому, кто нанёс последний удар, — кому-то из речных гномов или <a class=\"ref\" href=\"/c/dudush/\">Дудушу<\/a>. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4055\" target=\"_blank\" rel=\"noopener\">1:07:35 ↗<\/a> · <a href=\"#qa39-17\">к записи<\/a><\/span><\/span>"}, {"t": "1:59:07", "sec": 7147, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> хватает <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> и <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> и улетает из пещеры, обещая месть. <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> остаётся с гномами и Нерадой («Можно я её в жёны возьму?» — «Бери»). Эпилог: в королевстве появилась новая сила — дракон, которого не получится игнорировать.<button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: Вырезанная концовка: Дудуш добил дракона и получил зов маски Януса\">4<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>Вырезанная концовка: Дудуш добил дракона и получил зов маски Януса<\/b> На съёмках после побега из пещеры <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> в полёте неожиданной скрытной атакой добил вылеченного им <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, и мастер описал шёпот: «Ну, здравствуй, друг. Я так давно тебя ждал» — маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> переходила к Дудушу. Авторы вырезали эту концовку и оставили ту, где дракон улетает живым: к убийству игрока подтолкнул мастер (напомнил, что дракон вернётся мстить его деревне), а не бросок кубика или собственная инициатива игрока. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=634\" target=\"_blank\" rel=\"noopener\">0:10:34 ↗<\/a> · <a href=\"#qa39-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему дракон забрал Мираторга, но не невесту\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему дракон забрал Мираторга, но не невесту<\/b> <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> унёс <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> как драконорождённого «родственника». Невесту он бросил: оставшись с одним хитом, «перехотел». <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4694\" target=\"_blank\" rel=\"noopener\">1:18:14 ↗<\/a> · <a href=\"#qa39-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Свадьба Яруса — его мечта ещё из выпуска 39\">32<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Свадьба Яруса — его мечта ещё из выпуска 39<\/b> О бонусах свадьбы мастер сказал игрокам только в середине игры, и сыграть её решили не сразу. Зрители заметили, что ещё в выпуске 39 <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> называл своей мечтой жениться на «нормальной бабе»: <a class=\"ref\" href=\"/p/ilya-makarov/\">Макаров<\/a> помнил это и вёл персонажа к свадьбе с самого начала. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=1992\" target=\"_blank\" rel=\"noopener\">0:33:12 ↗<\/a> · <a href=\"#qa47-3\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:04:08", "sec": 248}, {"t": "0:20:07", "sec": 1207}, {"t": "0:33:27", "sec": 2007}, {"t": "0:39:48", "sec": 2388}, {"t": "1:12:42", "sec": 4362}, {"t": "1:21:28", "sec": 4888}, {"t": "1:27:38", "sec": 5258}, {"t": "1:37:22", "sec": 5842}, {"t": "1:50:52", "sec": 6652}, {"t": "1:56:20", "sec": 6980}, {"t": "1:59:07", "sec": 7147}], "coins": {"ep": "39", "events": [{"t": "0:33:27", "kind": "earn", "who": "Дудуш", "actor": "Турал Натурал", "to": null, "reason": "находчиво сунул бороду в замочную скважину вместо утерянных отмычек и открыл потайную дверь", "result": null, "sec": 2007, "who_url": "/c/dudush/", "reason_html": "находчиво сунул бороду в замочную скважину вместо утерянных отмычек и открыл потайную дверь"}, {"t": "0:36:03", "kind": "earn", "who": "Ярус", "actor": "Илья Макаров (Макар)", "to": null, "reason": "пожалел подпалённую овцу и отпустил её вместо погони, хороший отыгрыш заботы о персонаже", "result": null, "sec": 2163, "who_url": "/c/yarus/", "reason_html": "пожалел подпалённую овцу и отпустил её вместо погони, хороший отыгрыш заботы о персонаже"}, {"t": "1:15:24", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "за находчивую ретроспективную заявку про агрессивную форель, которая мешает охранникам тушить пожар", "result": "проверка сложности прошла на критической удаче", "sec": 4524, "who_url": "/c/miratorg/", "reason_html": "за находчивую ретроспективную заявку про агрессивную форель, которая мешает охранникам тушить пожар"}, {"t": "1:23:45", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили монету на переброс проверки Харизмы/Убеждения, чтобы страж поверил, что перед ним «мать»", "result": "из фрагмента следует, что даже после переброса результата не хватило", "sec": 5025, "who_url": null, "reason_html": "потратили монету на переброс проверки Харизмы/Убеждения, чтобы страж поверил, что перед ним «мать»"}], "totals": [{"who": "Дудуш", "actor": "Турал Натурал", "earned": 1, "spent": 0, "img": "img/chars/dudush.webp", "who_url": "/c/dudush/", "actor_url": "/p/tural-natural/"}, {"who": "Ярус", "actor": "Илья Макаров (Макар)", "earned": 1, "spent": 0, "img": "img/chars/yarus.webp", "who_url": "/c/yarus/", "actor_url": "/p/ilya-makarov/"}, {"who": "Мираторг", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/miratorg.webp", "who_url": "/c/miratorg/", "actor_url": "/p/brb/"}], "notes": "Один случай (переброс проверки «я твоя мать») из фрагмента непонятно чей — получатель не указан. Подсчёта итоговых монет на конец выпуска в доступном фрагменте нет."}, "cast": [{"name": "Дракостя / дракон Гиммилут", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "дракон в облике человека, дворянин-чародей драконьей крови", "role": "", "fate": "выжил (тяжело ранен, бежал)", "id": "Гимелут", "url": "/c/drakon-gimelut/", "img": "img/chars/drakostya.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "49", "label": "49", "title": "Раненый дракон"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: 30 хитов Дракости были для вида\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>30 хитов Дракости были для вида<\/b> Чародею <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a> дали 30 хитов только для маскировки карточки. Если бы их сбили до нуля, он не потерял бы сознание и не принял бы истинный облик, как друид, а остался бы в человеческом облике. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4184\" target=\"_blank\" rel=\"noopener\">1:09:44 ↗<\/a> · <a href=\"#qa39-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дракон мог надеть маску и золотой доспех\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дракон мог надеть маску и золотой доспех<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> не стал использовать маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и золотой доспех: был уверен в своей силе, а их способностей слишком много. Доспех поднял бы класс брони с 19 до 21. Магические предметы после часа настройки подстраиваются под размер владельца, так что дракон мог бы носить их и в истинном облике. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4504\" target=\"_blank\" rel=\"noopener\">1:15:04 ↗<\/a> · <a href=\"#qa39-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Зачем Гиммилут сам пошёл с дварфами и зачем ему невесты\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Зачем Гиммилут сам пошёл с дварфами и зачем ему невесты<\/b> В скрытой легенде не было прописано, зачем дракон сам отправился с отрядом. Авторы предложили две версии: ему скучно (как миллиардеру-авантюристу) и он проверял лояльность дварфов, которые должны были сами добыть невесту. Невест он берёт, чтобы через брак с дочерьми знатных юридически узаконить власть над их землями. Начал он с дварфов как с ближайших и самых простых соседей; тёмные и высшие эльфы для него сложнее. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=4886\" target=\"_blank\" rel=\"noopener\">1:21:26 ↗<\/a> · <a href=\"#qa39-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Гиммилут стал слишком сильным — авторы думают, как его ослабить\">36<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Гиммилут стал слишком сильным — авторы думают, как его ослабить<\/b> Самый высокий уровень в ПЧК у дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> — около 15, у него 250 ХП в человеческом облике, маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспех. Он считает себя богом на земле, потому что герои не убили его в выпуске 32. Авторы признались, что им сложно им играть и они думают, как дракона ослабить: например, украсть у него маску. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6233\" target=\"_blank\" rel=\"noopener\">1:43:53 ↗<\/a> · <a href=\"#qa47-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему Гиммилут хочет власти над миром: версия о матери Драксении\">38<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему Гиммилут хочет власти над миром: версия о матери Драксении<\/b> Автор вступления к выпуску поделился своей логикой. О власти драконов над миром, возможно, мечтала мать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> Драксения. Драконы — «живые боги земного мира»: демоны и небесные боги кормятся земным миром, а власть драконов могла бы прекратить это раздирание и объединить мир, как империя. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4187\" target=\"_blank\" rel=\"noopener\">1:09:47 ↗<\/a> · <a href=\"#qa49-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Здоровье Дракости: 30 ХП в вып. 39 были обманкой\">39<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Здоровье Дракости: 30 ХП в вып. 39 были обманкой<\/b> В вып. 39 30 ХП <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a> были отвлекающим манёвром для дварфов, чтобы его не раскрыли, — на деле у дракона было 250–300. В вып. 49 его 30–35 ХП были настоящими: осколок у сердца снизил максимум здоровья и не давал превращаться. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6216\" target=\"_blank\" rel=\"noopener\">1:43:36 ↗<\/a> · <a href=\"#qa49-30\">к записи<\/a><\/span><\/span>"}, {"name": "Мираторг", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "драконорождённый, рыбак", "role": "", "fate": "при смерти, унесён драконом", "id": "Мираторг", "url": "/c/miratorg/", "img": "img/chars/miratorg.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "49", "label": "49", "title": "Раненый дракон"}]}, {"name": "Шафран Десперадо", "actor": "Эмир Кашоков", "actor_url": "/p/emir-kashokov/", "race": "горный дварф, стрелок-снайпер, старейшина Грюнберга", "role": "", "fate": "погиб (сожжён дыханием дракона)", "id": "Шафран", "url": "/c/shafran-desperado/", "img": "img/chars/shafran.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Из ада вывели только душу Шафрана — её статус не решён\">35<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Из ада вывели только душу Шафрана — её статус не решён<\/b> <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> погиб в выпуске 39, поэтому отряд вынес из ада только его душу, к тому же изуродованную пытками и «перелепкой» лица. Авторы признали, что после свадьбы о нём забыли и теперь нужно решить по лору, кем он вышел: призраком, как барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, или неупокоенным духом-рейфом, жаждущим мести <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилуту<\/a>. Тело ему могли бы дать некромант или чумная крыса из инвентаря. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep47.md («Итог») пишет, что «все пятеро героев и спасённый <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> выжили», а в разделе персонажей — что Шафран «спасён из ада». На деле Шафран мёртв с выпуска 39: из ада вынесли только его (изуродованную) душу, и в каком виде она существует, авторы ещё не решили.<\/span> <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5854\" target=\"_blank\" rel=\"noopener\">1:37:34 ↗<\/a> · <a href=\"#qa47-29\">к записи<\/a><\/span><\/span>"}, {"name": "Ярус", "actor": "Илья Макаров", "actor_url": "/p/ilya-makarov/", "race": "горный дварф, воин, ловчий баранов", "role": "", "fate": "при смерти, остался с гномами (вероятно выжил)", "id": "Ярус", "url": "/c/yarus/", "img": "img/chars/yarus.webp", "other": [{"key": "47", "label": "47", "title": "Вокзал грешных душ"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Ярус как будущий охотник на драконов\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Ярус как будущий охотник на драконов<\/b> Дальнейшая судьба героев авторам пока неясна, но выживший <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>, «чистый драконоборец», теперь имеет мотивацию мстить дракону за <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a>; если бы выжил и Шафран, могла бы сложиться команда охотников на драконов. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=3552\" target=\"_blank\" rel=\"noopener\">0:59:12 ↗<\/a> · <a href=\"#qa39-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Ярус против дракона: месть Гиммилуту откладывается\">34<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Ярус против дракона: месть Гиммилуту откладывается<\/b> На вопрос, позовёт ли <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> новых друзей против дракона, <a class=\"ref\" href=\"/p/ilya-makarov/\">Илья Макаров<\/a> ответил, что противник серьёзный: нужно хорошо подготовиться и иметь козыри в рукаве. Теперь Ярус переживает и за семью, поэтому пока он продолжает свой путь. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5600\" target=\"_blank\" rel=\"noopener\">1:33:20 ↗<\/a> · <a href=\"#qa47-27\">к записи<\/a><\/span><\/span>"}, {"name": "Дудуш", "actor": "Турал Натурал", "actor_url": "/p/tural-natural/", "race": "горный дварф (наполовину гном), плут", "role": "", "fate": "выжил, улетел с драконом", "id": "Дудуш", "url": "/c/dudush/", "img": "img/chars/dudush.webp", "other": [{"key": "49", "label": "49", "title": "Раненый дракон"}]}], "npcs": [{"name": "Нерада Коразон", "actor": "", "actor_url": null, "race": "", "role": "невеста дракона, «Мисс Грюнберг»", "fate": "выжила, осталась у речных гномов", "id": null, "url": null, "img": null, "other": []}, {"name": "Пырей Коразон", "actor": "", "actor_url": null, "race": "", "role": "глава клана Коразон, отец Нерады", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Календул Коразон", "actor": "", "actor_url": null, "race": "", "role": "сын главы клана", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Тимьян Коразон", "actor": "", "actor_url": null, "race": "", "role": "брат Нерады, охранял её", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Гоблин-слуга", "actor": "", "actor_url": null, "race": "", "role": "слуга Коразонов, помог отряду", "fate": "выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Шмыгель — тот самый безымянный гоблин из «Кунисской пленницы»\">37<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Шмыгель — тот самый безымянный гоблин из «Кунисской пленницы»<\/b> <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> вырос из безымянного гоблина-слуги из вып. 39, которого тогда отыгрывал мастер. Зрители его запомнили, рисовали арты и много о нём писали, поэтому авторы сделали его персонажем игрока. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=530\" target=\"_blank\" rel=\"noopener\">0:08:50 ↗<\/a> · <a href=\"#qa49-3\">к записи<\/a><\/span><\/span>"}, {"name": "Пастух", "actor": "", "actor_url": null, "race": "", "role": "безбородый дварф с дудочкой, поднял тревогу", "fate": "выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Безбородый пастух был «крючком» для Дудуша\">8<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Безбородый пастух был «крючком» для Дудуша<\/b> Безбородого пастуха задумали как зацепку для <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>: на общей беде, отсутствии бороды, тот мог с ним сблизиться. Дудуш с фальшивой бородой мог пройти и тайным ходом, куда безбородому дварфу хода нет. <span class=\"note\">Подкаст по #39 · <a href=\"https://youtu.be/qxRg1urCUIw?t=2223\" target=\"_blank\" rel=\"noopener\">0:37:03 ↗<\/a> · <a href=\"#qa39-7\">к записи<\/a><\/span><\/span>"}, {"name": "Сыр", "actor": "", "actor_url": null, "race": "", "role": "алабай пастуха", "fate": "погиб", "id": "Сыр", "url": "/c/syr/", "img": null, "other": []}, {"name": "Белка Ярус", "actor": "", "actor_url": null, "race": "", "role": "ручная белка Дудуша", "fate": "выжила", "id": null, "url": null, "img": null, "other": []}, {"name": "Речные гномы", "actor": "", "actor_url": null, "race": "", "role": "давние враги Гиммилута", "fate": "победили дракона, есть потери", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "14", "label": "14", "title": "Янус доставка", "note_html": "<a class=\"ref\" href=\"/a/zolotaya-maska-yanusa/\">Золотая маска Януса<\/a> — артефакт контрабандиста <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Гибель Эльфдодиса в вулкане <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>; маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> перешла к <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилуту<\/a>; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> оттуда же", "dir": "out", "color": "#B8901C"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Дварфы Кунисских гор и боевые бараны", "dir": "back", "color": "#C8423B"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "Упомянута сестра Эльфдодиса <a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> и <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран Десперадо<\/a>, <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a> и дракон", "dir": "back", "color": "#3E9A5E"}, {"key": "49", "label": "49", "title": "Раненый дракон", "note_html": "Задел: месть раненого дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "50", "label": "50", "title": "Крыса корабельная", "note_html": "Каблучанус уладил требования независимости кунисских дварфов", "dir": "back", "color": "#DD7A2F"}], "quotes_html": ["«Своих детей несите дракону, трусы!» — Пырей Коразон.", "«Только истинный Коразон небритой бороды пройдёт» — надпись на гербе.", "«Лучше барана нет друга, не так ли?» — <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>.", "«Горные дварфы — свободный народ, и мы не ляжем под дракона» — <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a>.", "«Мы вернёмся… в следующий раз я уничтожу вас» — <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>, улетая."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a>; дварфийский городок <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a>; родовое село Коразоновка (арсенал, склепы родового кладбища, склеп Базилика Коразона); Пещера Каменных Слёз; вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> и гномский город Гусь Пещерный (логово <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>).<\/li>\n<li>Фракции: Совет двенадцати старейшин <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберга<\/a>; клан Коразон; клан Десперадо; речные гномы.<\/li>\n<li>Артефакты: золотая маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (у <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>); драконобойки гномов (паровые метатели заострённых прутьев); снайперская винтовка <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a> (расплавлена); молот <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> «Олег»; зелья храбрости, лечения, «турбодварфа».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>39<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>39<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>7<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>15<\/small><\/button><button class=\"chip ptf t-retcon\" data-t=\"retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>7<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>8<\/small><\/button><\/div><article class=\"pnote t-correction\" id=\"qa38-23\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Дракон захватил Гусь Пещерный 500 лет назад, до рождения Помпея<\/b><\/div><p>Дракон изгнал гномов из Гусь Пещерного 500 лет назад. Сам <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> этого не застал: он родился уже речным гномом в бедности. Впечатление, что Помпея изгнали лично, возникло из-за оговорки Яна <a class=\"ref\" href=\"/p/yan-toples/\">Топлеса<\/a> при чтении легенды.<\/p><blockquote>«Его предки жили в Гусь Пещерном, но 500 лет назад дракон их оттуда выгнал. Ян не застал этого.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep38.md: «речной гном <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> из Гуся Пещерного (изгнан драконом Гимелудом)» — дракон по канону <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>, и изгнал он предков Помпея 500 лет назад; сам Помпей родился уже речным гномом.<\/p><p class=\"note\"><a href=\"/pod/qa38/#qa38-23\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=5403\" target=\"_blank\" rel=\"noopener\">1:30:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa39-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Алабая Сыра назвали в честь погибшей реальной собаки<\/b><\/div><p>Имя Сыр взяли из списка популярных собачьих кличек из чата собаководов, который прислала жена одного из авторов. Уже во время монтажа выяснилось, что настоящий пёс Сыр умер от укуса клеща.<\/p><blockquote>«Так что эта собака была названа в честь погибшей собаки.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-1\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=255\" target=\"_blank\" rel=\"noopener\">0:04:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa39-2\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Клички баранов и собак Коразоновки<\/b><\/div><p>В подготовке к выпуску у ездовых баранов Коразонов были клички Бусь, Рогалик, Бяра, Шуша и Буцефал (последний — баран главы клана Пырея Коразона), у других собак — Читос и Тяпа. В несыгранной овчарне было ещё несколько алабаев.<\/p><blockquote>«Бусь, Рогалик, Бяра, Шуша и Буцефал. Буцефал — это был баран этого главного.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-2\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=319\" target=\"_blank\" rel=\"noopener\">0:05:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-retcon\" id=\"qa39-3\" data-type=\"retcon\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон<\/span><b>Вырезанная концовка: Дудуш добил дракона и получил зов маски Януса<\/b><\/div><p>На съёмках после побега из пещеры <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> в полёте неожиданной скрытной атакой добил вылеченного им <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, и мастер описал шёпот: «Ну, здравствуй, друг. Я так давно тебя ждал» — маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> переходила к Дудушу. Авторы вырезали эту концовку и оставили ту, где дракон улетает живым: к убийству игрока подтолкнул мастер (напомнил, что дракон вернётся мстить его деревне), а не бросок кубика или собственная инициатива игрока.<\/p><blockquote>«Ты слышишь странный шёпот… «Ну, здравствуй, друг. Я так давно тебя ждал».»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-3\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=634\" target=\"_blank\" rel=\"noopener\">0:10:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-4\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>У Дудуша не было скрытой легенды<\/b><\/div><p>Спасение дракона не было тайным заданием: скрытой легенды у <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> не было. <a class=\"ref\" href=\"/p/tural-natural/\">Турал Натурал<\/a> просто захотел финальный твист. По его словам, мотивация персонажа — «пускай драконы живут».<\/p><blockquote>«Скрытой легенды не было. Вот Турал захотел сделать финальный плот-твист.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-4\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=961\" target=\"_blank\" rel=\"noopener\">0:16:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa39-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Бой в пещере задуман как зеркало выпуска №32<\/b><\/div><p>После №32, где зрители спорили, можно ли вообще победить дракона, авторы перевернули ситуацию: дракон стал персонажем игрока, а против него встали игроки и NPC. Бой снова шёл в пещере, где дракон теряет преимущество в манёвре, а сталактиты («каменные слёзы») можно обрушить на него. У гномов были две драконобойки слабее, чем в №32, но кубики у них полетели очень удачно.<\/p><blockquote>«Мы дали дракона, он стал не NPC, а игровым персонажем, а против него были игровые персонажи и NPC.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-5\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=1151\" target=\"_blank\" rel=\"noopener\">0:19:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-6\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Разница способностей Яруса и Дудуша говорить с животными<\/b><\/div><p>У <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> был двусторонний разговор с животными: он понимал их и говорил на их языке. У <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> была врождённая гномья способность говорить с совсем мелкими зверями: они понимали его, а он их нет. Поэтому белка не могла ему ничего рассказать, но могла указать направление или выполнить поручение.<\/p><blockquote>«У Яруса была такая возможность передавать информацию в две стороны… а у тебя было только говорить.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-6\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=2037\" target=\"_blank\" rel=\"noopener\">0:33:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Безбородый пастух был «крючком» для Дудуша<\/b><\/div><p>Безбородого пастуха задумали как зацепку для <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>: на общей беде, отсутствии бороды, тот мог с ним сблизиться. Дудуш с фальшивой бородой мог пройти и тайным ходом, куда безбородому дварфу хода нет.<\/p><blockquote>«Крючок именно, да, для взаимоотношений Дудуша.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-7\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=2223\" target=\"_blank\" rel=\"noopener\">0:37:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa39-8\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Лестница у арсенала появилась на эскизе карты<\/b><\/div><p>Мастер рисует эскиз карты для художника; рисуя арсенал на скале, он задумался, как дварфы таскают снаряды, и добавил деревянную приставную лестницу. Её можно откинуть при нападении, как у кавказских башен. Игроки использовали её неожиданным образом.<\/p><blockquote>«я обычно рисую эскиз карты и отправляю её нашему художнику… думаю, наверное, у них есть лестница приставная.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-8\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=2538\" target=\"_blank\" rel=\"noopener\">0:42:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa39-9\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Скрытая мотивация Шафрана: засада и захват пушки<\/b><\/div><p>Перед игрой авторы отвели <a class=\"ref\" href=\"/p/emir-kashokov/\">Эмира Кашокова<\/a> в сторону и выдали <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрану<\/a> скрытую задачу: довести похищение до конца и привести невесту в пещеру, чтобы <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a> призвал дракона, а там устроить засаду с речными гномами. Второе задание — захватить пушку из старой башни с приставной лестницей: Шафран умел быстро разбирать и собирать оружие, мог вынести её по частям и собрать в пещере, и пушка нанесла бы дракону большой урон. Эмир по просьбе авторов никому из партии не рассказал.<\/p><blockquote>«И у него ещё, у Эмира, была задача захватить пушку. А пушка находилась в старой башне, к которой лестница вела.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-9\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=2652\" target=\"_blank\" rel=\"noopener\">0:44:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa39-10\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Если бы Дракостю разоблачили раньше<\/b><\/div><p>Если бы дварфы раскрыли <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостю<\/a> до пещеры, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сразу превратился бы в дракона. Убивать его в человеческом облике <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> не стал, потому что не знал, что чародей — это и есть дракон: это держали в секрете как поворот.<\/p><blockquote>«А что бы ты делал, если бы тебя раскрыли до? — Сразу бы стал драконом.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa39/#qa39-10\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3107\" target=\"_blank\" rel=\"noopener\">0:51:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-11\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Шафран умер сразу, без спасбросков<\/b><\/div><p>Персонаж с нулём хитов обычно лишь без сознания, и его можно спасти. Но огненное дыхание дракона нанесло <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрану<\/a> столько урона, что остаток ушёл за отрицательный максимум его здоровья (около 30 хитов), а это мгновенная смерть.<\/p><blockquote>«тебе было нанесено столько урона драконом, что твой показатель здоровья стал ниже минус… Это считается мгновенная смерть.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-11\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3425\" target=\"_blank\" rel=\"noopener\">0:57:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa39-12\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Ярус как будущий охотник на драконов<\/b><\/div><p>Дальнейшая судьба героев авторам пока неясна, но выживший <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>, «чистый драконоборец», теперь имеет мотивацию мстить дракону за <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a>; если бы выжил и Шафран, могла бы сложиться команда охотников на драконов.<\/p><blockquote>«если бы выжил Шафран, у вас прекрасная команда… которая мстит дракону и охотится на драконов»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-12\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3552\" target=\"_blank\" rel=\"noopener\">0:59:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa39-13\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранные места Коразоновки: кузня, мельница, зиндан<\/b><\/div><p>Отряд пропустил часть деревни. В кузне жил кузнец, который болтал под пиво с огненным элементалем в печи. На водяной мельнице жили дварфы Петрушка и Бамбук со спутанными бородами (рубить бороду нельзя): помощь им открыла бы подсказки про кладбище. Были ещё барашня, овчарня и даже подробно описанный женский туалет. Травяные имена дварфов пошли от имени <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a>, которое придумал Эмир.<\/p><blockquote>«А на водяной мельнице, там была целая история для вас подготовленная… Там был Петрушка и Бамбук. Так звали дварфов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-13\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3615\" target=\"_blank\" rel=\"noopener\">1:00:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa39-14\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>В зиндане сидел Полынька Коразон<\/b><\/div><p>Под мангалом был замаскирован тайный ход, а рядом — яма для наказаний (зиндан) с клеткой. В ней сидел Полынька Коразон, наказанный за то, что предлагал отдать невесту дракону. Освобождённый, он рассказал бы, что Нераду прячут на кладбище.<\/p><blockquote>«в яме для наказаний сидел Полынька Коразон… Если бы вы его освободили, он бы вам сказал, где прячут невесту.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-14\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3741\" target=\"_blank\" rel=\"noopener\">1:02:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-15\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему дварфов не пустили в Коразоновку<\/b><\/div><p>Совет старейшин, в который входил <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a>, решил не ссориться с драконом и отдать ему Нераду Коразон. Её отец отказался и заперся в родовом селе, ожидая гостей, поэтому ворота были закрыты. Отряд мог бы попробовать обман: сказать, что не согласен с советом и пришёл поддержать клан.<\/p><blockquote>«Было принято решение с драконом не ссориться и выдать ему невесту.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-15\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3928\" target=\"_blank\" rel=\"noopener\">1:05:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa39-16\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Малая драконобойка с газовым баллоном<\/b><\/div><p>Большой драконобойке из №32 нужна была паровая система Гуся Пещерного. Гном, которого герои №32 забрали с заставы высших эльфов, как раз испытывал её с газовым баллоном, когда его арестовали; так она не работала. Поэтому изобрели малую драконобойку: урон меньше, зато работает от переносного газового баллона. Речные гномы сотни лет работают над тем, как убивать драконов, поэтому в засаду пришли именно они, а не дварфы.<\/p><blockquote>«была изобретена маленькая драконобойка, которая наносит меньше урона, но она работает с переносным газовым баллоном»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-16\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=3993\" target=\"_blank\" rel=\"noopener\">1:06:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-17\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Маску Януса получил бы тот, кто добил дракона<\/b><\/div><p>Если бы <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> не вылечили, маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> досталась бы тому, кто нанёс последний удар, — кому-то из речных гномов или <a class=\"ref\" href=\"/c/dudush/\">Дудушу<\/a>.<\/p><blockquote>«тот, кто последний клинок воткнул, тот бы и стал»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-17\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4055\" target=\"_blank\" rel=\"noopener\">1:07:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-18\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>30 хитов Дракости были для вида<\/b><\/div><p>Чародею <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a> дали 30 хитов только для маскировки карточки. Если бы их сбили до нуля, он не потерял бы сознание и не принял бы истинный облик, как друид, а остался бы в человеческом облике.<\/p><blockquote>«То есть мы ему для вида дали 30 здоровья. Ну, если карточку бы кто-то подглядывал»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-18\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4184\" target=\"_blank\" rel=\"noopener\">1:09:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa39-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Раскрытие Дракости перенесли в начало монтажа<\/b><\/div><p>Скрытая легенда <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> за столом раскрылась только в конце, но в монтаже её поставили сразу после его представления: образ дракона и так был очевиден зрителям. Зритель вместо шока следит, как дракон притворяется. Четвёртый поворот (убийство дракона <a class=\"ref\" href=\"/c/dudush/\">Дудушем<\/a>) вырезали.<\/p><blockquote>«А почему бы не поставить его скрытую легенду в самом начале, сразу же после его представления?»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-19\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4312\" target=\"_blank\" rel=\"noopener\">1:11:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ужасающее присутствие и легендарные действия дракона не применялись<\/b><\/div><p>Ужасающее присутствие дракона не срабатывает автоматически: его надо заявить. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> его не применил, выбрав дыхание по троим героям вместо толп гномов, и не тратил легендарные действия (в том числе взмах крыльями, чтобы улететь раньше), считая себя неуязвимым. Если бы он применил присутствие сразу, ходить смог бы только <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a>.<\/p><blockquote>«если ты применил ужасающее присутствие сразу, то они бы в принципе не могли ходов совершать все, кроме Яруса»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-20\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4437\" target=\"_blank\" rel=\"noopener\">1:13:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-21\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Дракон мог надеть маску и золотой доспех<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> не стал использовать маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и золотой доспех: был уверен в своей силе, а их способностей слишком много. Доспех поднял бы класс брони с 19 до 21. Магические предметы после часа настройки подстраиваются под размер владельца, так что дракон мог бы носить их и в истинном облике.<\/p><blockquote>«все магические предметы… если ты тратишь время… 1 час, они принимают твои размеры и вид так, чтобы ты мог их все надеть»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-21\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4504\" target=\"_blank\" rel=\"noopener\">1:15:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему дракон забрал Мираторга, но не невесту<\/b><\/div><p><a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> унёс <a class=\"ref\" href=\"/c/miratorg/\">Мираторга<\/a> как драконорождённого «родственника». Невесту он бросил: оставшись с одним хитом, «перехотел».<\/p><blockquote>«Потому что он ещё драконорождённый.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa39/#qa39-22\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4694\" target=\"_blank\" rel=\"noopener\">1:18:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa39-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Зачем Гиммилут сам пошёл с дварфами и зачем ему невесты<\/b><\/div><p>В скрытой легенде не было прописано, зачем дракон сам отправился с отрядом. Авторы предложили две версии: ему скучно (как миллиардеру-авантюристу) и он проверял лояльность дварфов, которые должны были сами добыть невесту. Невест он берёт, чтобы через брак с дочерьми знатных юридически узаконить власть над их землями. Начал он с дварфов как с ближайших и самых простых соседей; тёмные и высшие эльфы для него сложнее.<\/p><blockquote>«Если он забирает невест, чтобы легитимизироваться на тех землях, откуда он её забирает, то, соответственно, он хочет стать на этих землях главным.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-23\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=4886\" target=\"_blank\" rel=\"noopener\">1:21:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-24\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему критический удар хвостом не убил Яруса<\/b><\/div><p>Удар хвостом — контролирующее действие (сбить с ног), а не смертельное: даже с критом урон определяют кубики, а <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> выкинул много на защитной способности и потерял лишь 5 хитов. Убийственные удары у дракона — огненное дыхание (с перезарядкой) и атака крыльями по площади.<\/p><blockquote>«А хвост — это больше контролирующая способность, позволяющая сбить с ног»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-24\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=5078\" target=\"_blank\" rel=\"noopener\">1:24:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa39-25\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Гиммилута на новые свершения толкнула маска Януса<\/b><\/div><p>Дракон ни к демонам, ни к небесам не примкнёт: он сам по себе, «новая сила». По скрытой легенде, после захвата Гуся Пещерного он 500 лет жил пассивно, копя сокровища, и лишь маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, интеллектуально общающаяся и более разумная, чем он, внушила ему, что он бог на земле и пора выходить из пещеры.<\/p><blockquote>«только когда ему всё-таки попалась эта маска Януса, она его сподвигла… что он в сущности Бог на земле»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-25\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=5267\" target=\"_blank\" rel=\"noopener\">1:27:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa39-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как к Ярусу вернулись метательные топоры<\/b><\/div><p><a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> бросил метательные топоры в сеть при сплаве по реке, а позже снова бил ими в бою: топоры по ретро-заявке вернули рыбы, а сами топоры особой конструкции (смещённый центр тяжести, всплывающие рукояти), и их подобрали ниже по течению.<\/p><blockquote>«Ретроспективные заявки, ребята. Рыбы вернули обратно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-26\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa39-27\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Красного дракона упростили относительно D&amp;D<\/b><\/div><p>Монстров берут из бестиария D&amp;D и упрощают: взрослому красному дракону снизили класс брони с 21 до 19 и убрали способность превращать проваленный спасбросок в успешный, чтобы игроки чаще попадали. Враги-«боссы» в шоу не пьют зелья лечения, чтобы не затягивать бой.<\/p><blockquote>«у взрослого красного дракона двадцать первая броня. Мы ему делаем девятнадцатую»<\/blockquote><p class=\"note\"><a href=\"/pod/qa39/#qa39-27\">Подкаст по #39<\/a> · <a href=\"https://youtu.be/qxRg1urCUIw?t=6160\" target=\"_blank\" rel=\"noopener\">1:42:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa39-28\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Зачем гостям дали скрытые мотивации<\/b><\/div><p>Скрытые задачи (<a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрану<\/a> и <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилуту<\/a>) дали в том числе для того, чтобы новые игроки не начали хулиганить и, например, убивать персонажа <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> в самом начале, а были вовлечены до последнего.<\/p><blockquote>«И чтобы этого не сделать, мы подум
