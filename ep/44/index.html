<script>window.EPD = {"key": "44", "label": "44", "title": "Королевская охота", "date": "2025-12-07", "minutes": 105, "duration": 6319.0, "video_id": "IYGLafo-mPw", "branch": "Отряд крысы Ларисы", "branch_color": "#DD7A2F", "place": "Королевский лес Блавальд близ столицы: охотничья усадьба, Галечный пляж, озеро Клякса", "short_html": "Отряд бессмертной крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> проникает на Большую королевскую охоту в лесу Блавальд, чтобы заставить <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a> применить против демонов свиток апокалипсиса. Герои устраивают хаос в охотничьей усадьбе, похищают слугу-тифлинга, переодеваются дворянином фон Тыквером и его слугой и подменяют помёт в ритуальном колесе. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> смешит короля шутками и добывает аудиенцию, где король объясняет, что свиток сдерживает Великую Фаларию за Багряным морем. Лариса усмиряет требование мумии-императора, присягает Пони V, становится рыцарем королевского стола и получает задание добыть фаларийский свиток «Левиафан».", "summary_html": "Отряд крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, ставшей бессмертной после сделки с мумией императора Малестии, пробирается на ежегодную Большую королевскую охоту в Блавальдском лесу, чтобы заставить короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a> применить против демонов фамильный свиток апокалипсиса. Золотарь <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> взрывает выгребную яму в охотничьей усадьбе и топит в ней дворецкого, кот <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> очаровывает охрану, а Лариса с <a class=\"ref\" href=\"/c/lyucius/\">Люциусом<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Вороном Бароном<\/a> похищают слугу-тифлинга и выведывают распорядок охоты. Переодевшись дворянином фон Тыквером и его слугой, герои подменяют помёт в «колесе помёта», а <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> так смешит короля шутками, что получает аудиенцию. Наедине король объясняет Ларисе, что свиток сдерживает Великую Фаларию за Багряным морем, владеющую вторым свитком. Лариса усмиряет требование мумии немедленно забрать свиток, присягает Пони V, посвящена в рыцари королевского стола и получает задание добыть фаларийский свиток «Левиафан».", "outcome_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> вместо свержения короля присягнула ему и стала рыцарем королевского стола. Отряд отправляется за Багряное море за свитком «Левиафан».", "world_html": ["Раскрыта тайна: династия Пониев хранит один из трёх свитков апокалипсиса, второй у Великой Фаларии, третий уничтожил Малестию", "Король не применяет свиток против демонов, чтобы сдерживать Фаларию", "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> — рыцарь королевского стола на службе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a>", "Королевская охота сокращена до одного дня из-за войны с демонами"], "scenes": [{"t": "0:01:04", "sec": 64, "html": "Предыстория: падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выдвинул ультиматум — отдать божественное дитя для Тёмного Властелина. Король отдал младенца, но <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> перехватила его и в суматохе погубила; началось демоническое нашествие. В руинах Малестии Лариса заключила сделку с мумией императора: бессмертие в обмен на будущую услугу."}, {"t": "0:03:12", "sec": 192, "html": "Завязка: <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a> раз в год ездит на Большую королевскую охоту (традиция деда, мясо раздают беднякам); в этом году — в лесу Блавальд рядом со столицей. Задача: встретиться с королём и убедить применить могущественное оружие против демонов, а при отказе — отобрать."}, {"t": "0:05:22", "sec": 322, "html": "Представление: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> узнала из книги, что династия Пониев владеет свитком апокалипсиса, подобным уничтожившему Малестию; <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> бросил хозяина <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и объявлен ренегатом своей школой; <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> прочёл хроники Малестии (три свитка: один уничтожил Малестию, второй за Багряным морем, третий у предка Пони); <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> жаждет славы; <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп, использованный заговорщиками для покушения на короля (семейная фирма «Амкал» разорена)."}, {"t": "0:12:48", "sec": 768, "html": "Ночью герои у охотничьей усадьбы Блавальд. <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a>, представившись вызванным золотарём, изображает чужим голосом «тут полилось!» и проходит внутрь."}, {"t": "0:18:03", "sec": 1083, "html": "<a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> замечает охранник в чёрном плаще с нашивкой белой летучей мыши (тайная канцелярия), но кот очаровывает его, тот снимает с него верёвку и уносит кормить на кухню."}, {"t": "0:21:10", "sec": 1270, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пробирается в сторожку, где инквизитор с медальоном-детектором нечисти и агент в широкополой шляпе допрашивают слугу-тифлинга. Медальон дрожит на Ларису; она извергает изо рта рой саранчи, раня обоих, и убеждает тифлинга бежать с ней через окно."}, {"t": "0:26:26", "sec": 1586, "html": "Тифлинг рассказывает <a class=\"ref\" href=\"/c/lyucius/\">Люциусу<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворону Барону<\/a>: охоту сократили до одного дня, король не приедет в усадьбу, а сразу явится на Галечный пляж к завтраку и «колесу помёта». <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> выкручивает ему соски; герои угоняют лошадей, обезвредив охранников конюшни парализующими дротиками Люциуса."}, {"t": "0:31:37", "sec": 1897, "html": "Дворецкий ведёт <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> в чистый туалет; тот взрывает выгребную яму бомбой из нечистот, забрызгивая всё. Его запирают отмывать туалет; затем он выбивает дверью дворецкого, обшаривает его (верёвка <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a>, монета, расписание охоты) и сбрасывает в выгребную яму. В королевской спальне находит книгу «Особенности королевской охоты» (правила колеса помёта: король вслепую выбирает чашу с помётом дичи, на которую и охотится)."}, {"t": "0:52:41", "sec": 3161, "html": "Охранник находит в камине записку <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> и понимает, что отряд выдал себя. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a>, приставив когти к горлу, выдаёт себя за агента «более тайной канцелярии», устроившего «проверку», и уходит через каминную трубу. Лагерь поднят по тревоге; Тигрил скрытно угоняет коня и подхватывает <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> на верёвку."}, {"t": "1:00:00", "sec": 3600, "html": "Отряд воссоединяется у урочища Стоящий Великан и отнимает одежду, приглашение, охотничий горн, записку с сигналами и тыквенный пирог у заблудившегося дворянина <a class=\"ref\" href=\"/c/leon-fon-tykver/\">Леона фон Тыквера<\/a> и его слуги Ионы; их связывают в лесу. <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> становится «фон Тыквером», <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> — слугой в капюшоне с сеткой от комаров. Диффузорий варит зелье увеличения (отдаёт <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрилу<\/a>)."}, {"t": "1:06:21", "sec": 3981, "html": "Галечный пляж у водопада Нижний Шептун: палатки, королевская гвардия. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> вызывает крыс, те коллективно испражняются (критическая удача); <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> по описанию из книги лепит помёт кабана, оленя, волка, медведя и косули. Пока «фон Тыквер» отвлекает ловчего <a class=\"ref\" href=\"/c/lyudvig/\">Людвига<\/a> тыквенным пирогом, Ворон Барон подменяет помёт в его палатке."}, {"t": "1:16:55", "sec": 4615, "html": "Прибывает король. Его шут Джорах проваливает шутку; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> (слуга «фон Тыквера») смешит короля каламбурами («где живут маленькие пчёлы? — в Минесоте») и просит в награду аудиенцию. Колесо помёта выбирает кабана; три отряда псарей уходят в лес, король со жрецом едет на соколиную охоту к озеру Клякса. Крысы-приманки разбегаются, а карканье <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> сбивает собак со следа."}, {"t": "1:26:19", "sec": 5179, "html": "Подозрительный «вельможа» (агент тайной канцелярии со шрамом) пытается заглянуть под сетку слуги; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> парализует его «ужасающим взглядом», <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> привязывает его к дереву и подрезает сухожилия. Позже <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> находит его и забирает его коня. <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> варит зелье неуязвимости."}, {"t": "1:33:44", "sec": 5624, "html": "Аудиенция на берегу озера Клякса. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> под видом «фокуса тет-а-тет» достаёт <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>, <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> отвлекает двух гвардейцев игрой с бликами на латных перчатках."}, {"t": "1:36:52", "sec": 5812, "html": "Король узнаёт <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> («и сколько на этот раз людей погибло?»). Объясняет: удар свитком погубит и людей в захваченных землях, а главное — второй свиток у Великой Фаларии за Багряным морем; предок Пони выкрал один из трёх свитков, третьим уничтожена Малестия. Применив свиток против Чёрного Геленбурга, Пония останется беззащитной перед Фаларией."}, {"t": "1:40:03", "sec": 6003, "html": "В голове <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> звучит голос мумии-императора: услуга — забрать свиток. Лариса с «зарядом на успех» <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> выигрывает проверку убеждения (сложность 20): император соглашается ждать ещё."}, {"t": "1:42:11", "sec": 6131, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> предлагает королю службу, клянётся в верности <a class=\"ref\" href=\"/c/korol-poni-v/\">Пони V<\/a> на колене, посвящена в рыцари королевского стола (просит того же для <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a>). Первое задание — доставить свиток «Левиафан» из Великой Фаларии."}], "key_events": [{"t": "0:01:04", "sec": 64}, {"t": "0:21:10", "sec": 1270}, {"t": "0:33:41", "sec": 2021}, {"t": "0:53:43", "sec": 3223}, {"t": "1:00:00", "sec": 3600}, {"t": "1:13:44", "sec": 4424}, {"t": "1:18:59", "sec": 4739}, {"t": "1:36:52", "sec": 5812}, {"t": "1:40:03", "sec": 6003}, {"t": "1:42:11", "sec": 6131}], "coins": {"ep": "44", "events": [{"t": "0:13:51", "kind": "other", "who": null, "actor": null, "to": null, "reason": "монета за шутку про озеро, названное в форме мыши", "result": null, "sec": 831, "who_url": null, "reason_html": "монета за шутку про озеро, названное в форме мыши"}, {"t": "0:45:17", "kind": "loot", "who": "Диффузорий", "actor": "Эль Классико", "to": null, "reason": "обыскал карманы избитого дворецкого — нашёл верёвку, монету и записку с расписанием королевской охоты", "result": null, "sec": 2717, "who_url": "/c/diffuzoriy/", "reason_html": "обыскал карманы избитого дворецкого — нашёл верёвку, монету и записку с расписанием королевской охоты"}, {"t": "0:46:21", "kind": "earn", "who": "Диффузорий", "actor": "Эль Классико", "to": null, "reason": "эффектно и с чёрным юмором сбросил дворецкого в выгребную яму", "result": null, "sec": 2781, "who_url": "/c/diffuzoriy/", "reason_html": "эффектно и с чёрным юмором сбросил дворецкого в выгребную яму"}, {"t": "0:57:55", "kind": "spend", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "переброс проверки Скрытности, чтобы незаметно спуститься с крыши конюшни на украденного коня", "result": "13+17 — хватило, чтобы никто не заметил", "sec": 3475, "who_url": "/c/serzhant-tigril/", "reason_html": "переброс проверки Скрытности, чтобы незаметно спуститься с крыши конюшни на украденного коня"}, {"t": "1:13:44", "kind": "spend", "who": "Ворон Барон", "actor": "Филипп Воронин", "to": null, "reason": "переброс проверки Скрытности при проникновении в палатку Людвига, чтобы подложить ловушки-помёт", "result": null, "sec": 4424, "who_url": "/c/voron-baron/", "reason_html": "переброс проверки Скрытности при проникновении в палатку <a class=\"ref\" href=\"/c/lyudvig/\">Людвига<\/a>, чтобы подложить ловушки-помёт"}, {"t": "1:19:59", "kind": "earn", "who": "Ворон Барон", "actor": "Филипп Воронин", "to": null, "reason": "рассмешил короля шуткой про пчёл в Миннесоте — критическая удача на Исполнение/Харизму", "result": null, "sec": 4799, "who_url": "/c/voron-baron/", "reason_html": "рассмешил короля шуткой про пчёл в Миннесоте — критическая удача на Исполнение/Харизму"}, {"t": "1:21:07", "kind": "earn", "who": "Ворон Барон", "actor": "Филипп Воронин", "to": null, "reason": "ещё одна успешная шутка перед королём под прикрытием слуги барона фон Тыквера", "result": null, "sec": 4867, "who_url": "/c/voron-baron/", "reason_html": "ещё одна успешная шутка перед королём под прикрытием слуги барона фон Тыквера"}], "totals": [{"who": "Диффузорий", "actor": "Эль Классико", "earned": 1, "spent": 0, "img": null, "who_url": "/c/diffuzoriy/", "actor_url": "/p/el-klassiko/"}, {"who": "Сержант Тигрил", "actor": "BRB", "earned": 0, "spent": 1, "img": "img/chars/serzhant-tigril.webp", "who_url": "/c/serzhant-tigril/", "actor_url": "/p/brb/"}, {"who": "Ворон Барон", "actor": "Филипп Воронин", "earned": 2, "spent": 1, "img": "img/chars/voron-baron.webp", "who_url": "/c/voron-baron/", "actor_url": "/p/filipp-voronin/"}], "notes": "Монета, найденная на дворецком, — внутриигровые деньги, от
