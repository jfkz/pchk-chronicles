<script>window.EPD = {"anim": false, "key": "44", "label": "44", "title": "Королевская охота", "date": "2025-12-07", "minutes": 105, "duration": 6319.0, "video_id": "IYGLafo-mPw", "branch": "Отряд крысы Ларисы", "branch_color": "#DD7A2F", "place": "Королевский лес Блавальд близ столицы: охотничья усадьба, Галечный пляж, озеро Клякса", "short_html": "Отряд <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> проникает на королевскую охоту, чтобы убедить <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> применить против демонов свиток апокалипсиса.", "summary_html": "Отряд крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, ставшей бессмертной после сделки с мумией императора <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a>, пробирается на ежегодную Большую королевскую охоту в Блавальдском лесу, чтобы заставить короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> применить против демонов фамильный свиток апокалипсиса. Золотарь <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> взрывает выгребную яму в охотничьей усадьбе и топит в ней дворецкого, кот <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> очаровывает охрану, а Лариса с <a class=\"ref\" href=\"/c/lyucius/\">Люциусом<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Вороном Бароном<\/a> похищают слугу-тифлинга и выведывают распорядок охоты. Переодевшись дворянином фон Тыквером и его слугой, герои подменяют помёт в «колесе помёта», а <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> так смешит короля шутками, что получает аудиенцию. Наедине король объясняет Ларисе, что свиток сдерживает Великую <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a> за Багряным морем, владеющую вторым свитком. Лариса усмиряет требование мумии немедленно забрать свиток, присягает <a class=\"ref\" href=\"/place/poniya/\">Поний<\/a> V, посвящена в рыцари королевского стола и получает задание добыть фаларийский свиток «Левиафан».", "outcome_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> вместо свержения короля присягнула ему и стала рыцарем королевского стола. Отряд отправляется за <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a> за свитком «Левиафан».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Убийство короля могло закрыть ветку\">5<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Убийство короля могло закрыть ветку<\/b> Если бы отряд убил <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> и забрал свиток, им можно было бы ударить по Чёрному <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургу<\/a>, и история ветки закончилась бы ещё через выпуск-другой. Авторы отметили, что в этом выпуске могли погибнуть и император, и сама крыса. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=6297\" target=\"_blank\" rel=\"noopener\">1:44:57 ↗<\/a> · <a href=\"#qa43-44-25\">к записи<\/a><\/span><\/span>", "world_html": ["Раскрыта тайна: династия <a class=\"ref\" href=\"/place/poniya/\">Пониев<\/a> хранит один из трёх свитков апокалипсиса, второй у Великой <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a>, третий уничтожил <a class=\"ref\" href=\"/place/malestiya/\">Малестию<\/a>", "Король не применяет свиток против демонов, чтобы сдерживать <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>", "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> — рыцарь королевского стола на службе <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>", "Королевская охота сокращена до одного дня из-за войны с демонами<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Задумка: неделя свободы в огромном лесу\">4<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Задумка: неделя свободы в огромном лесу<\/b> Первоначально хотели дать героям неделю в огромном лесу Блавальд с точками интереса, как в «настоящем D&amp;D». Королевская охота в реальности длилась месяцами, поэтому сокращение до одного дня объяснили государственными делами короля во время нашествия. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=5131\" target=\"_blank\" rel=\"noopener\">1:25:31 ↗<\/a> · <a href=\"#qa43-44-24\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "0:01:14", "sec": 74, "html": "Предыстория: падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выдвинул ультиматум — отдать божественное дитя для Тёмного Властелина. Король отдал младенца, но <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> перехватила его и в суматохе погубила; началось демоническое нашествие. В руинах <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> Лариса заключила сделку с мумией императора: бессмертие в обмен на будущую услугу.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сделка с мумией — параллель присяге Сфинктериона\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сделка с мумией — параллель присяге Сфинктериона<\/b> Авторы назвали сделку <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> в <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> парафразом закадровой присяги <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> Тёмному Властелину: магический договор дал ей силу нежити. Королю же она присягнула, потому что сочла его доводы разумными. <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, по их словам, молод, мало интересовался политикой, распустил армию и под сильным влиянием советников, но всё же вступил в борьбу с нашествием. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=8294\" target=\"_blank\" rel=\"noopener\">2:18:14 ↗<\/a> · <a href=\"#qa43-44-37\">к записи<\/a><\/span><\/span>"}, {"t": "0:03:41", "sec": 221, "html": "Завязка: <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> раз в год ездит на Большую королевскую охоту (традиция деда, мясо раздают беднякам); в этом году — в лесу Блавальд рядом со столицей. Задача: встретиться с королём и убедить применить могущественное оружие против демонов, а при отказе — отобрать."}, {"t": "0:05:22", "sec": 322, "html": "Представление: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> узнала из книги, что династия <a class=\"ref\" href=\"/place/poniya/\">Пониев<\/a> владеет свитком апокалипсиса, подобным уничтожившему <a class=\"ref\" href=\"/place/malestiya/\">Малестию<\/a>; <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> бросил хозяина <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и объявлен ренегатом своей школой; <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> прочёл хроники Малестии (три свитка: один уничтожил Малестию, второй за Багряным морем, третий у предка Пони); <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> жаждет славы; <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп, использованный заговорщиками для покушения на короля (семейная фирма «Амкал» разорена).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Откуда золотарь Диффузорий и «Амкал»\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Откуда золотарь Диффузорий и «Амкал»<\/b> Шатохин предложил Герману (<a class=\"ref\" href=\"/p/el-klassiko/\">Эль Классико<\/a>) роль золотаря по мотивам прегена «Дейп Капрофил» из «ПЧК онлайн», а семейная фирма «Амкал» — отсылка к футбольному клубу Германа, названному «в честь кала». <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 ↗<\/a> · <a href=\"#qa43-44-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Отец Диффузория — землекоп из «Покушения на короля»\">10<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Отец Диффузория — землекоп из «Покушения на короля»<\/b> Отец <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> — тот самый землекоп из выпуска 8, который рыл яму под лавкой «Зигзаг», требовал платы и был брошен в клетку городской стражи, где <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> застрелил его из арбалета. Никакой казни на площади не было: Диффузорий героизирует отца, ему просто так рассказали. Это рифма: в выпуске 8 героям нужно было предотвратить покушение на короля, а здесь на него покушались они сами. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep44.md: <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> «мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп» — это версия самого персонажа; на деле его отец — землекоп из #08, застреленный <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> в клетке городской стражи, а не казнённый по приговору.<\/span> <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=7001\" target=\"_blank\" rel=\"noopener\">1:56:41 ↗<\/a> · <a href=\"#qa43-44-31\">к записи<\/a><\/span><\/span>"}, {"t": "0:13:09", "sec": 789, "html": "Ночью герои у охотничьей усадьбы Блавальд. <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a>, представившись вызванным золотарём, изображает чужим голосом «тут полилось!» и проходит внутрь."}, {"t": "0:18:52", "sec": 1132, "html": "<a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> замечает охранник в чёрном плаще с нашивкой белой летучей мыши (тайная канцелярия), но кот очаровывает его, тот снимает с него верёвку и уносит кормить на кухню.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Лор «кошек с верёвками»\">8<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Лор «кошек с верёвками»<\/b> «Кошки с верёвками» появились из-за художницы, которая нарисовала живую кошку там, где <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> забрасывал альпинистскую кошку. Отсюда вырос лор: школа готовит особых котов, их верёвка сплетена секретным способом и не рвётся, у них есть свой кодекс («Это моя верёвка…»). Такой кот считается инвентарём и всегда при хозяине, поэтому охранник принял бесхозного <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> за обычного кота: элитных котов мало кто видел. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=6870\" target=\"_blank\" rel=\"noopener\">1:54:30 ↗<\/a> · <a href=\"#qa43-44-29\">к записи<\/a><\/span><\/span>"}, {"t": "0:21:10", "sec": 1270, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пробирается в сторожку, где инквизитор с медальоном-детектором нечисти и агент в широкополой шляпе допрашивают слугу-тифлинга. Медальон дрожит на Ларису; она извергает изо рта рой саранчи, раня обоих, и убеждает тифлинга бежать с ней через окно."}, {"t": "0:26:44", "sec": 1604, "html": "Тифлинг рассказывает <a class=\"ref\" href=\"/c/lyucius/\">Люциусу<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворону Барону<\/a>: охоту сократили до одного дня, король не приедет в усадьбу, а сразу явится на Галечный пляж к завтраку и «колесу помёта». <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> выкручивает ему соски; герои угоняют лошадей, обезвредив охранников конюшни парализующими дротиками Люциуса."}, {"t": "0:31:37", "sec": 1897, "html": "Дворецкий ведёт <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> в чистый туалет; тот взрывает выгребную яму бомбой из нечистот, забрызгивая всё. Его запирают отмывать туалет; затем он выбивает дверью дворецкого, обшаривает его (верёвка <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a>, монета, расписание охоты) и сбрасывает в выгребную яму. В королевской спальне находит книгу «Особенности королевской охоты» (правила колеса помёта: король вслепую выбирает чашу с помётом дичи, на которую и охотится)."}, {"t": "0:53:28", "sec": 3208, "html": "Охранник находит в камине записку <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> и понимает, что отряд выдал себя. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a>, приставив когти к горлу, выдаёт себя за агента «более тайной канцелярии», устроившего «проверку», и уходит через каминную трубу. Лагерь поднят по тревоге; Тигрил скрытно угоняет коня и подхватывает <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> на верёвку."}, {"t": "1:00:00", "sec": 3600, "html": "Отряд воссоединяется у урочища Стоящий Великан и отнимает одежду, приглашение, охотничий горн, записку с сигналами и тыквенный пирог у заблудившегося дворянина <a class=\"ref\" href=\"/c/leon-fon-tykver/\">Леона фон Тыквера<\/a> и его слуги Ионы; их связывают в лесу. <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> становится «фон Тыквером», <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> — слугой в капюшоне с сеткой от комаров. Диффузорий варит зелье увеличения (отдаёт <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрилу<\/a>)."}, {"t": "1:06:21", "sec": 3981, "html": "Галечный пляж у водопада Нижний Шептун: палатки, королевская гвардия. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> вызывает крыс, те коллективно испражняются (критическая удача); <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> по описанию из книги лепит помёт кабана, оленя, волка, медведя и косули. Пока «фон Тыквер» отвлекает ловчего <a class=\"ref\" href=\"/c/lyudvig/\">Людвига<\/a> тыквенным пирогом, Ворон Барон подменяет помёт в его палатке."}, {"t": "1:17:03", "sec": 4623, "html": "Прибывает король. Его шут Джорах проваливает шутку; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> (слуга «фон Тыквера») смешит короля каламбурами («где живут маленькие пчёлы? — в Минесоте») и просит в награду аудиенцию. Колесо помёта выбирает кабана; три отряда псарей уходят в лес, король со жрецом едет на соколиную охоту к озеру Клякса. Крысы-приманки разбегаются, а карканье <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> сбивает собак со следа.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Возможные босс-файты «Королевской охоты»\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Возможные босс-файты «Королевской охоты»<\/b> Босс-файт был предусмотрен, но не случился: драка могла быть с гвардейцами, тайной службой, королём или с огромным королевским вепрем «Князем <a class=\"ref\" href=\"/c/kaban/\">Кабаном<\/a>», которого затравливают собаками. Изначально предполагалось, что героям придётся участвовать в охоте на него. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=4892\" target=\"_blank\" rel=\"noopener\">1:21:32 ↗<\/a> · <a href=\"#qa43-44-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»\">19<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»<\/b> Жреца в белом, сжёгшего отряд, авторы назвали Рюхом Благочестивым (позже в подкасте — Рюхом Милосердным). Герои уже встречали его в выпуске 44: он сопровождал короля на соколиной охоте. Бой с ним и инквизиторами, часть которых тоже жрецы, изначально был трудным. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep48.md упоминает его только как «Верховный жрец (в белом)», а в ep44.md он «Верховный жрец — сокольничий на охоте». Это один персонаж; в подкасте его назвали Рюхом (Благочестивым/Милосердным).<\/span> <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2321\" target=\"_blank\" rel=\"noopener\">0:38:41 ↗<\/a> · <a href=\"#qa48-8\">к записи<\/a><\/span><\/span>"}, {"t": "1:26:19", "sec": 5179, "html": "Подозрительный «вельможа» (агент тайной канцелярии со шрамом) пытается заглянуть под сетку слуги; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> парализует его «ужасающим взглядом», <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> привязывает его к дереву и подрезает сухожилия. Позже <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> находит его и забирает его коня. <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> варит зелье неуязвимости.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Подсказка про агента в гражданском\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Подсказка про агента в гражданском<\/b> В сторожке лежала одежда агента тайной канцелярии: один из агентов внедрился в королевскую свиту в дворянском платье. Это был всадник, который потом пытался заглянуть под сетку «слуги». <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=7293\" target=\"_blank\" rel=\"noopener\">2:01:33 ↗<\/a> · <a href=\"#qa43-44-33\">к записи<\/a><\/span><\/span>"}, {"t": "1:33:52", "sec": 5632, "html": "Аудиенция на берегу озера Клякса. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> под видом «фокуса тет-а-тет» достаёт <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>, <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> отвлекает двух гвардейцев игрой с бликами на латных перчатках.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Заготовленное покушение на короля у озера\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Заготовленное покушение на короля у озера<\/b> У авторов было готово запасное событие: покушение на короля у озера, где герои могли бы его спасти и тем самым получить аудиенцию. <a class=\"ref\" href=\"/p/filipp-voronin/\">Фил Воронин<\/a> и зрители угадали этот поворот. Его не запустили, потому что план Б с каламбурами уже сработал. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=5018\" target=\"_blank\" rel=\"noopener\">1:23:38 ↗<\/a> · <a href=\"#qa43-44-23\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:52", "sec": 5812, "html": "Король узнаёт <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> («и сколько на этот раз людей погибло?»). Объясняет: удар свитком погубит и людей в захваченных землях, а главное — второй свиток у Великой <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a> за Багряным морем; предок <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> выкрал один из трёх свитков, третьим уничтожена <a class=\"ref\" href=\"/place/malestiya/\">Малестия<\/a>. Применив свиток против Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, Пония останется беззащитной перед Фаларией."}, {"t": "1:40:03", "sec": 6003, "html": "В голове <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> звучит голос мумии-императора: услуга — забрать свиток. Лариса с «зарядом на успех» <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> выигрывает проверку убеждения (сложность 20): император соглашается ждать ещё.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лариса убеждала императора, а не спасалась от него\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лариса убеждала императора, а не спасалась от него<\/b> Бросок в финале был не спасброском против мумии, а убеждением: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> уговорила императора подождать, пообещав принести второй свиток. При провале император потребовал бы свиток сразу. Зачем мумии свиток, авторы раскрывать отказались — это покажут в игре. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=6681\" target=\"_blank\" rel=\"noopener\">1:51:21 ↗<\/a> · <a href=\"#qa43-44-27\">к записи<\/a><\/span><\/span>"}, {"t": "1:42:26", "sec": 6146, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> предлагает королю службу, клянётся в верности <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> на колене, посвящена в рыцари королевского стола (просит того же для <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a>). Первое задание — доставить свиток «Левиафан» из Великой <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a>.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Тигрил присягнул королю\">6<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Тигрил присягнул королю<\/b> По предыстории <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> хотел служить добру и ушёл от <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, когда тот переметнулся к тьме. Вместе с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> он продолжает оставаться в оппозиции бывшему хозяину; Лариса при присяге попросила о том же статусе для своих друзей. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=6522\" target=\"_blank\" rel=\"noopener\">1:48:42 ↗<\/a> · <a href=\"#qa43-44-26\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:01:14", "sec": 74}, {"t": "0:21:10", "sec": 1270}, {"t": "0:34:05", "sec": 2045}, {"t": "0:54:22", "sec": 3262}, {"t": "1:00:00", "sec": 3600}, {"t": "1:14:25", "sec": 4465}, {"t": "1:19:05", "sec": 4745}, {"t": "1:36:52", "sec": 5812}, {"t": "1:40:03", "sec": 6003}, {"t": "1:42:26", "sec": 6146}], "coins": {"ep": "44", "events": [{"t": "0:14:37", "kind": "other", "who": null, "actor": null, "to": null, "reason": "монета за шутку про озеро, названное в форме мыши", "result": null, "sec": 877, "who_url": null, "reason_html": "монета за шутку про озеро, названное в форме мыши"}, {"t": "0:45:46", "kind": "loot", "who": "Диффузорий", "actor": "Эль Классико", "to": null, "reason": "обыскал карманы избитого дворецкого — нашёл верёвку, монету и записку с расписанием королевской охоты", "result": null, "sec": 2746, "who_url": "/c/diffuzoriy/", "reason_html": "обыскал карманы избитого дворецкого — нашёл верёвку, монету и записку с расписанием королевской охоты"}, {"t": "0:47:00", "kind": "earn", "who": "Диффузорий", "actor": "Эль Классико", "to": null, "reason": "эффектно и с чёрным юмором сбросил дворецкого в выгребную яму", "result": null, "sec": 2820, "who_url": "/c/diffuzoriy/", "reason_html": "эффектно и с чёрным юмором сбросил дворецкого в выгребную яму"}, {"t": "0:58:07", "kind": "spend", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "переброс проверки Скрытности, чтобы незаметно спуститься с крыши конюшни на украденного коня", "result": "13+17 — хватило, чтобы никто не заметил", "sec": 3487, "who_url": "/c/serzhant-tigril/", "reason_html": "переброс проверки Скрытности, чтобы незаметно спуститься с крыши конюшни на украденного коня"}, {"t": "1:14:12", "kind": "spend", "who": "Ворон Барон", "actor": "Филипп Воронин", "to": null, "reason": "переброс проверки Скрытности при проникновении в палатку Людвига, чтобы подложить ловушки-помёт", "result": null, "sec": 4452, "who_url": "/c/voron-baron/", "reason_html": "переброс проверки Скрытности при проникновении в палатку <a class=\"ref\" href=\"/c/lyudvig/\">Людвига<\/a>, чтобы подложить ловушки-помёт"}, {"t": "1:21:07", "kind": "earn", "who": "Ворон Барон", "actor": "Филипп Воронин", "to": null, "reason": "ещё одна успешная шутка перед королём под прикрытием слуги барона фон Тыквера", "result": null, "sec": 4867, "who_url": "/c/voron-baron/", "reason_html": "ещё одна успешная шутка перед королём под прикрытием слуги барона фон Тыквера"}, {"t": "1:21:18", "kind": "earn", "who": "Ворон Барон", "actor": "Филипп Воронин", "to": null, "reason": "рассмешил короля шуткой про пчёл в Миннесоте — критическая удача на Исполнение/Харизму", "result": null, "sec": 4878, "who_url": "/ "race": "", "role": "охотник на нечисть с медальоном", "fate": "ранен", "id": null, "url": null, "img": null, "other": []}, {"name": "Агент тайной канцелярии в шляпе", "actor": "", "actor_url": null, "race": "", "role": "следователь", "fate": "ранен", "id": null, "url": null, "img": null, "other": []}, {"name": "Дворецкий усадьбы", "actor": "", "actor_url": null, "race": "", "role": "королевский дворецкий", "fate": "сброшен в выгребную яму", "id": null, "url": null, "img": null, "other": []}, {"name": "Леон фон Тыквер", "actor": "", "actor_url": null, "race": "", "role": "дворянин, приглашённый на охоту", "fate": "ограблен, привязан в лесу", "id": "Леон фон Тыквер", "url": "/c/leon-fon-tykver/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему никто не узнал «фон Тыквера»\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему никто не узнал «фон Тыквера»<\/b> <a class=\"ref\" href=\"/c/leon-fon-tykver/\">Леон фон Тыквер<\/a> — очень мелкий и бедный дворянин, которого впервые позвали на королевское мероприятие: у него даже не было лошади, и ехал он с куском тыквенного пирога. Его никто не знал в лицо, поэтому подмена прошла. <span class=\"note\">Подкаст по #43 и #44 · <a href=\"https://youtu.be/trPN7O0uNR0?t=8058\" target=\"_blank\" rel=\"noopener\">2:14:18 ↗<\/a> · <a href=\"#qa43-44-36\">к записи<\/a><\/span><\/span>"}, {"name": "Иона", "actor": "", "actor_url": null, "race": "", "role": "слуга фон Тыквера", "fate": "ограблен, привязан в лесу", "id": null, "url": null, "img": null, "other": []}, {"name": "Людвиг", "actor": "", "actor_url": null, "race": "", "role": "королевский ловчий", "fate": "выжил, помёт подменён", "id": "Людвиг", "url": "/c/lyudvig/", "img": null, "other": []}, {"name": "Джорах", "actor": "", "actor_url": null, "race": "", "role": "королевский шут", "fate": "выжил, опозорен", "id": null, "url": null, "img": null, "other": []}, {"name": "Агент тайной канцелярии со шрамом", "actor": "", "actor_url": null, "race": "", "role": "шпион под видом вельможи", "fate": "парализован, привязан к дереву с подрезанными сухожилиями", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "Ультиматум <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Три свитка апокалипсиса из Великой <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a> (Кали, Немезида, Левиафан)", "dir": "out", "color": "#B8901C"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "Погибшее божественное дитя — не <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>: живы ещё два потомка Тёмного Властелина, Лёша и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "<a class=\"ref\" href=\"/place/malestiya/\">Руины Малестии<\/a>: сделка <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с мумией императора, <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a>", "dir": "out", "color": "#DD7A2F"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Тайная канцелярия", "dir": "back", "color": "#B03A7A"}, {"key": "50", "label": "50", "title": "Крыса корабельная", "note_html": "Задел: путешествие за <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a> в <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларию<\/a>", "dir": "out", "color": "#DD7A2F"}], "quotes_html": ["«Это моя верёвка. Таких верёвок много, но эта моя».", "«Я слуга барона фон Тыквера. Из меня шутки выпадают, как из порванного мешочка».", "«<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a>… И сколько на этот раз людей погибло?» — «Нисколько. Ноль».", "«Ну что, крысы, посрём на благо страны».", "«Постучишь три раза, когда закончишь»."], "places_html": "<ul>\n<li>Лес Блавальд: охотничья усадьба Блавальд, урочище Стоящий Великан, Галечный пляж у водопада Нижний Шептун, озеро Клякса, озеро Мышь; столица; руины <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a>; <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; <a class=\"ref\" href=\"/place/velikaya-falariya/\">Великая Фалария<\/a> за Багряным морем.<\/li>\n<li>Фракции: королевская гвардия, тайная канцелярия (белая летучая мышь), королевские инквизиторы, демоническая армия, школа «кошек с верёвками» в Кунисских горах, рыцари королевского стола.<\/li>\n<li>Артефакты: свиток апокалипсиса <a class=\"ref\" href=\"/place/poniya/\">Пониев<\/a>; свиток «Левиафан» <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a> (всего три свитка — Кали, Немезида, Левиафан, упомянуты в #32); медальон инквизитора; книга «Особенности королевской охоты»; колесо помёта; зуб мантикоры (амулет удачи <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>); зелья увеличения и неуязвимости; парализующие дротики; карта Блавальда.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>20<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>20<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>4<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>7<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>4<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa43-44-21\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Откуда золотарь Диффузорий и «Амкал»<\/b><\/div><p>Шатохин предложил Герману (<a class=\"ref\" href=\"/p/el-klassiko/\">Эль Классико<\/a>) роль золотаря по мотивам прегена «Дейп Капрофил» из «ПЧК онлайн», а семейная фирма «Амкал» — отсылка к футбольному клубу Германа, названному «в честь кала».<\/p><blockquote>«Я говорю: «Вот такого персонажа тебе хотим дать, золотаря». Он говорит: «Я не против, для меня это весело».»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-21\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-22\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Возможные босс-файты «Королевской охоты»<\/b><\/div><p>Босс-файт был предусмотрен, но не случился: драка могла быть с гвардейцами, тайной службой, королём или с огромным королевским вепрем «Князем <a class=\"ref\" href=\"/c/kaban/\">Кабаном<\/a>», которого затравливают собаками. Изначально предполагалось, что героям придётся участвовать в охоте на него.<\/p><blockquote>«Предусмотрен ли был босс-файт? Он был предусмотрен... мы его называли Князь Кабан.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-22\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=4892\" target=\"_blank\" rel=\"noopener\">1:21:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-23\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Заготовленное покушение на короля у озера<\/b><\/div><p>У авторов было готово запасное событие: покушение на короля у озера, где герои могли бы его спасти и тем самым получить аудиенцию. <a class=\"ref\" href=\"/p/filipp-voronin/\">Фил Воронин<\/a> и зрители угадали этот поворот. Его не запустили, потому что план Б с каламбурами уже сработал.<\/p><blockquote>«Возможный поворот с покушением на короля, которое бы произошло на озере.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-23\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=5018\" target=\"_blank\" rel=\"noopener\">1:23:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-24\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Задумка: неделя свободы в огромном лесу<\/b><\/div><p>Первоначально хотели дать героям неделю в огромном лесу Блавальд с точками интереса, как в «настоящем D&amp;D». Королевская охота в реальности длилась месяцами, поэтому сокращение до одного дня объяснили государственными делами короля во время нашествия.<\/p><blockquote>«Вообще самая первая задумка — чтобы у вас неделя... пространство этого леса, оно просто огромное.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-24\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=5131\" target=\"_blank\" rel=\"noopener\">1:25:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-25\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Убийство короля могло закрыть ветку<\/b><\/div><p>Если бы отряд убил <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> и забрал свиток, им можно было бы ударить по Чёрному <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургу<\/a>, и история ветки закончилась бы ещё через выпуск-другой. Авторы отметили, что в этом выпуске могли погибнуть и император, и сама крыса.<\/p><blockquote>«Ну, убили бы, забрали свиток, жахнули бы по Чёрному Геленбургу и всё. И по сути закончена история.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-25\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=6297\" target=\"_blank\" rel=\"noopener\">1:44:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Тигрил присягнул королю<\/b><\/div><p>По предыстории <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> хотел служить добру и ушёл от <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, когда тот переметнулся к тьме. Вместе с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> он продолжает оставаться в оппозиции бывшему хозяину; Лариса при присяге попросила о том же статусе для своих друзей.<\/p><blockquote>«Он стал автоматически оппозицией Сфинктериону, и, присягнув, двигаясь с крысой, он продолжает оставаться этой оппозицией.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-26\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=6522\" target=\"_blank\" rel=\"noopener\">1:48:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-27\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Лариса убеждала императора, а не спасалась от него<\/b><\/div><p>Бросок в финале был не спасброском против мумии, а убеждением: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> уговорила императора подождать, пообещав принести второй свиток. При провале император потребовал бы свиток сразу. Зачем мумии свиток, авторы раскрывать отказались — это покажут в игре.<\/p><blockquote>«Он убеждал императора дать ему ещё потерпеть, что я второй свиток принесу. Если бы провалил, то император сказал бы: «Нет, давай сейчас».»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-27\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=6681\" target=\"_blank\" rel=\"noopener\">1:51:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa43-44-29\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Лор «кошек с верёвками»<\/b><\/div><p>«Кошки с верёвками» появились из-за художницы, которая нарисовала живую кошку там, где <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> забрасывал альпинистскую кошку. Отсюда вырос лор: школа готовит особых котов, их верёвка сплетена секретным способом и не рвётся, у них есть свой кодекс («Это моя верёвка…»). Такой кот считается инвентарём и всегда при хозяине, поэтому охранник принял бесхозного <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> за обычного кота: элитных котов мало кто видел.<\/p><blockquote>«Одна из художниц нарисовала живую кошку. И мы решили так оставить. И у этих кошек с верёвками появился целый лор.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-29\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=6870\" target=\"_blank\" rel=\"noopener\">1:54:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-30\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Кунисские горы названы с согласия гостей «Храма Юмора»<\/b><\/div><p>Название Кунисских гор, где обитают горные дварфы, авторы согласовали с гостями выпуска 10, игравшими дварфов.<\/p><blockquote>«Вы не против, если мы назовём горы Кунисские, в которых вы обитаете?»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-30\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=6935\" target=\"_blank\" rel=\"noopener\">1:55:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a>, <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa43-44-31\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Отец Диффузория — землекоп из «Покушения на короля»<\/b><\/div><p>Отец <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузория<\/a> — тот самый землекоп из выпуска 8, который рыл яму под лавкой «Зигзаг», требовал платы и был брошен в клетку городской стражи, где <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> застрелил его из арбалета. Никакой казни на площади не было: Диффузорий героизирует отца, ему просто так рассказали. Это рифма: в выпуске 8 героям нужно было предотвратить покушение на короля, а здесь на него покушались они сами.<\/p><blockquote>«Диффузорий говорит, что моего отца, честного работягу, просто казнили на главной площади. Так это ему сказали, и всё.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep44.md: <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> «мстит королю за казнь отца-золотаря, невинно осуждённого за подкоп» — это версия самого персонажа; на деле его отец — землекоп из #08, застреленный <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> в клетке городской стражи, а не казнённый по приговору.<\/p><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-31\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=7001\" target=\"_blank\" rel=\"noopener\">1:56:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-32\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><span class=\"tag\">возможно, шутка<\/span><b>Шут Джорах срисован с реального человека<\/b><\/div><p>Королевский шут Джорах нарисован практически как фоторобот реального знакомого авторов (Дорохова), который хотел прийти на шоу. Официально авторы оставили это пасхалкой: «это может быть кто угодно».<\/p><blockquote>«Ну просто это уже персонаж, он его фоторобот буквально.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-32\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=7092\" target=\"_blank\" rel=\"noopener\">1:58:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-33\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Подсказка про агента в гражданском<\/b><\/div><p>В сторожке лежала одежда агента тайной канцелярии: один из агентов внедрился в королевскую свиту в дворянском платье. Это был всадник, который потом пытался заглянуть под сетку «слуги».<\/p><blockquote>«Один из тайных полицейских отправился в гражданской одежде, в дворянской. И он внедрился туда, в королевскую свиту.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-33\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=7293\" target=\"_blank\" rel=\"noopener\">2:01:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-34\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Ненайденные руины старого храма с книгой о лоре<\/b><\/div><p>На большой карте Блавальда были руины старого храма с заранее напечатанной книгой, где содержатся важные материалы о лоре мира. Герои туда не пошли; авторы сказали, что книга не в единственном экземпляре и найдётся где-то ещё. Похожим образом книга о трёх свитках Апокалипсиса впервые попалась героям в выпуске 32 и сыграла только в 44-м.<\/p><blockquote>«Были руины старого храма, в которых можно было найти книжку... В ней содержатся очень важные материалы касательно лора всего нашего мира.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-34\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=7355\" target=\"_blank\" rel=\"noopener\">2:02:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-35\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Золотарь присягнул, чтобы быть ближе к королю<\/b><\/div><p>Герман объяснил, что <a class=\"ref\" href=\"/c/diffuzoriy/\">Диффузорий<\/a> не забыл о мести за отца: он присягнул королю, чтобы держать врага ближе, отправиться вместе с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> и дождаться возможности подобраться к королю.<\/p><blockquote>«Надо держать своих врагов ближе, чем друзей... будет ожидать возможности подобраться поближе к королю.»<\/blockquote><p class=\"note\">Герман (Эль Классико) · <a href=\"/pod/qa43-44/#qa43-44-35\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=7995\" target=\"_blank\" rel=\"noopener\">2:13:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-36\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему никто не узнал «фон Тыквера»<\/b><\/div><p><a class=\"ref\" href=\"/c/leon-fon-tykver/\">Леон фон Тыквер<\/a> — очень мелкий и бедный дворянин, которого впервые позвали на королевское мероприятие: у него даже не было лошади, и ехал он с куском тыквенного пирога. Его никто не знал в лицо, поэтому подмена прошла.<\/p><blockquote>«Леон фон Тыквер — это дворянин прямо очень мелкий и далёкий, которого вообще никогда не звали на королевские мероприятия.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-36\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=8058\" target=\"_blank\" rel=\"noopener\">2:14:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-37\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сделка с мумией — параллель присяге Сфинктериона<\/b><\/div><p>Авторы назвали сделку <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> в <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> парафразом закадровой присяги <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> Тёмному Властелину: магический договор дал ей силу нежити. Королю же она присягнула, потому что сочла его доводы разумными. <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, по их словам, молод, мало интересовался политикой, распустил армию и под сильным влиянием советников, но всё же вступил в борьбу с нашествием.<\/p><blockquote>«Это же был тоже некий парафраз сфинктерионовскому решению присягнуть Тёмному Властелину, которое у нас осталось за кадром.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-37\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=8294\" target=\"_blank\" rel=\"noopener\">2:18:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa43-44-38\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Мумия императора — лич, Лариса — её колдун<\/b><\/div><p>Мумия императора <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> — лич; чтобы его убить, нужно уничтожить филактерий, спрятанный где-то там, где обитает мумия, видимо под камнем. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> теперь колдун с личем в покровителях: у неё регенерация и некротические способности, но её можно уничтожить божественными заклинаниями и светом, тогда она не регенерирует.<\/p><blockquote>«Мумия — это лич. Чтобы убить лича, надо уничтожить его филактерий.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-38\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=8388\" target=\"_blank\" rel=\"noopener\">2:19:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-36\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Поний V — интриган, а не «добрый пушистый» король<\/b><\/div><p>Отвечая на упрёки в излишней доброте шоу, мастер подчеркнул, что <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> ведёт свою политическую игру: он не удержался бы на престоле, если бы не умел вертеть людьми — например, крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, которой он дал задание после её присяги.<\/p><blockquote>«Он тоже ведёт свою политическую игру. Он интриган. Он бы не продержался на престоле, если бы не умел вертеть и крутить крысой Ларисой.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-36\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6806\" target=\"_blank\" rel=\"noopener\">1:53:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-8\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»<\/b><\/div><p>Жреца в белом, сжёгшего отряд, авторы назвали Рюхом Благочестивым (позже в подкасте — Рюхом Милосердным). Герои уже встречали его в выпуске 44: он сопровождал короля на соколиной охоте. Бой с ним и инквизиторами, часть которых тоже жрецы, изначально был трудным.<\/p><blockquote>«Верховный жрец, которого зовут Рюх Благочестивый. Как игроки, вы его встречали в другом приключении, «Королевская охота», номер 44.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep48.md упоминает его только как «Верховный жрец (в белом)», а в ep44.md он «Верховный жрец — сокольничий на охоте». Это один персонаж; в подкасте его назвали Рюхом (Благочестивым/Милосердным).<\/p><p class=\"note\"><a href=\"/pod/qa48/#qa48-8\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2321\" target=\"_blank\" rel=\"noopener\">0:38:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-6\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Бессмертие Ларисы может снять тот, кто его дал<\/b><\/div><p>На вопрос, можно ли лишить крысу <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> бессмертия, ответили, что в теории да — это может сделать тот, кто его дал. Мумия императора <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> — нежить: не жива, но и не мертва, то есть по-прежнему существует.<\/p><blockquote>«А бессмертие может сняться вообще? — Ну, по идее, да.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-6\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=1155\" target=\"_blank\" rel=\"noopener\">0:19:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a><\/p><\/article><\/section>", "chars": {"Людвиг": {"name": "Людвиг", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "a
