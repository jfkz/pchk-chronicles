\"_blank\" rel=\"noopener\">1:17:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-15\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Артём был заточен под лагерь: мог приручить медведосова<\/b><\/div><p>Персонажа <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчука<\/a> (<a class=\"ref\" href=\"/c/artyom/\">Артём<\/a>) прописывали под сцену в лагере. У него была способность к дрессировке и харизма у огня, обращённая ко всем, так что медведосова можно было приручить, а не убивать.<\/p><blockquote>«у Шевчука была способность дрессировки. По идее Шевчук был прямо натаскан, прописан под этот лагерь»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-15\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=4753\" target=\"_blank\" rel=\"noopener\">1:19:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Женевьева собиралась убить Дракостю во время «операции» ради маски<\/b><\/div><p>Женевьева, прорицательница и волшебница, сразу почуяла истинный облик <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a>. Задачей мастера в сцене было заманить его в кибитку, усыпить и убить во время «операции». По уже заявленному правилу, чтобы стать новым хозяином маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, нужно убить прежнего. При удачных переговорах можно было договориться с цыганами о союзе и закончить приключение там же.<\/p><blockquote>«Её задачей было усыпить Дракостю и убить его во время операции... чтобы стать новым обладателем маски, нужно убить предыдущего обладателя маски»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-16\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=4880\" target=\"_blank\" rel=\"noopener\">1:21:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-17\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Пункт о катании на Нурике прошёл за счёт броска убеждения<\/b><\/div><p>Пункт договора, по которому <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> катается на <a class=\"ref\" href=\"/c/korol-nurik/\">Нурике<\/a>, вписали, потому что прошёл бросок убеждения. Без броска такое дать было нельзя, а по правилам NPC при прошедшем броске нехотя соглашается.<\/p><blockquote>«нельзя не дать тебе бросок. Ты пробросил бросок убеждения... чтобы король Нурик согласился вписать это»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-17\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5004\" target=\"_blank\" rel=\"noopener\">1:23:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-18\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Договор делает врагов дракона врагами эльфов; цели Нурика<\/b><\/div><p>По договору стороны признают врагов друг друга своими врагами, то есть кого назовёт врагом одна сторона, тот становится врагом и другой. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> не любит дварфов и ненавидит речных гномов, которые после изгнания драконом с вулкана поселились в его лесу. Его цель — уничтожить гномов и насолить дварфам.<\/p><blockquote>«Он не любит дварфов, и он ненавидит этих речных гномов, которые у него живут в лесу, которых изгнал дракон с вулкана»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-18\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5069\" target=\"_blank\" rel=\"noopener\">1:24:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-19\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Политическое устройство Понии и мотив Нурика<\/b><\/div><p>Земли вокруг столицы — автономные княжества и королевства (в том числе королевство лесных эльфов и республика на севере), присоединённые к <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> союзами или силой и подчинённые королю. <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисскими<\/a> дварфами правит совет старейшин. Королевство <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>, живущего тысячи лет, покорил Поний IV, отец <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>. Нурик, вероятно, хочет независимости: налоги на войну с демонами, эльфов в королевской армии почти нет (там в основном люди <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>), а высшие эльфы и вовсе независимы. Союз с драконом даёт Нурику мощный рычаг, тем более что у короля есть свиток <a class=\"ref\" href=\"/a/svitki-apokalipsisa/\">Апокалипсиса<\/a>.<\/p><blockquote>«король лесных эльфов... был покорён отцом Поний V, Понием IV. Вполне возможно, его этот протекторат не устраивает»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-19\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5132\" target=\"_blank\" rel=\"noopener\">1:25:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Наём убийц не спасает от кары древа<\/b><\/div><p>Если <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> или <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> решат избавиться от партнёра чужими руками, Великое древо всё равно докажет их вину: достаточно знать о покушении и чувствовать хоть каплю вины.<\/p><blockquote>«если ты знаешь и будет хоть минимальная у тебя капля чувства вины внутри, значит, ты виновен»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-20\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5259\" target=\"_blank\" rel=\"noopener\">1:27:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa49-21\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Белку Дудуша можно сделать огнедышащей навсегда<\/b><\/div><p>На вопрос, может ли дракон наделить белку огненным дыханием навсегда, ответили, что можно. По правилам D&amp;D заклинание, которое год каждый день накладывают ритуалом, действует постоянно.<\/p><blockquote>«Если ты одно и то же заклинание применяешь каждый день... в течение года, то оно возымеет постоянный эффект»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-21\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-23\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мираторг действительно перехватил часть проклятия<\/b><\/div><p>Подтвердили, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> смог перехватить проклятие цыганки, — по крайней мере его часть, если представить проклятие газовым облаком. Если с огромным желанием прыгаешь под проклятие, то его и получаешь.<\/p><blockquote>«если ты с огромным желанием прыгаешь и говоришь: «Я хочу это проклятие вместо тебя или вместе с тобой», то, конечно, получай»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-23\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5386\" target=\"_blank\" rel=\"noopener\">1:29:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa49-24\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Цыганское проклятие ещё сработает<\/b><\/div><p>Отдельного выпуска о проклятии Женевьевы пока не планируют, но авторы о нём помнят: оно должно как-то сработать в будущем, за такие «крючочки» они цепляются. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам после съёмок был впечатлён проклятием.<\/p><blockquote>«нету такой идеи, нет такой задачи, но об этом мы, разумеется, помним и оно должно как-то в будущем сработать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-24\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5452\" target=\"_blank\" rel=\"noopener\">1:30:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-25\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Бо́льшая часть золота осталась в заваленной пещере<\/b><\/div><p>Бо́льшая часть богатств <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> хранилась в пещере, которую он заранее завалил, а на телеге была лишь часть. Горные дварфы, если соберут рабочую силу и технику, могут докопаться до клада. Возможно, часть они уже нашли.<\/p><blockquote>«пещера, где хранилась большая часть его богатств... ему удалось её предварительно завалить... вполне возможно, что они чего-то уже там нашли»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-25\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5452\" target=\"_blank\" rel=\"noopener\">1:30:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-26\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Спокойное начало и цель погони — уничтожить телегу с золотом<\/b><\/div><p>Начать спокойно, а не сразу с погони, решили, чтобы незнакомые друг с другом игроки успели освоиться, а <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчук<\/a> разобрался с телегой. Погоня задумывалась как испытание с возможным смертельным исходом. Цель мастера и дварфов — уничтожить телегу с золотом (35–40 ХП). Игроки могли в любой момент взять из неё монеты или мешок, но этого не сделали.<\/p><blockquote>«задача была мастера и дварфов этих уничтожить вашу телегу, у которой было там 35-40 ХП»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-26\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5579\" target=\"_blank\" rel=\"noopener\">1:32:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-27\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Монеты дракона на переброс — только через бросок мудрости<\/b><\/div><p>По механике выпуска золото дракона было нельзя просто потратить на перебросы. Нужно было уговорить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, и тот должен был выбросить 20 на мудрость, чтобы дать хоть одну монету. Каждый такой переброс психически ранил бы дракона, вплоть до смерти.<\/p><blockquote>«дракон должен был там пробросить двадцатку по мудрости, чтобы хоть одну монету вы могли использовать на переброс... и это бы его ранило психически»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-27\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5709\" target=\"_blank\" rel=\"noopener\">1:35:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Цыгане в мире ПЧК — уникальный народ, ходящий между мирами<\/b><\/div><p>Отдельной фэнтези-расы для цыган авторы не придумывали: это единственный «реальный» народ в мире, и он уникален. Как вистани из D&amp;D, цыгане умеют проникать в дыры между пространствами и переходить между мирами, вплоть до демипланов.<\/p><blockquote>«только именно цыгане, потому что только они обладают вот этой уникальной способностью... они умеют перемещаться между мирами»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa49/#qa49-28\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5836\" target=\"_blank\" rel=\"noopener\">1:37:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-29\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Имена Женевьевы и Луваша — в духе вистани из «Проклятия Страда»<\/b><\/div><p>Имена цыган мастер стилизовал под имена вистани из модуля «Проклятие Страда» — слегка карикатурные, перекрученные русско-цыганские.<\/p><blockquote>«имена цыган ты взял как раз из этого приключения... там имена они все такие аллюзия на немножко перековерканные русские»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa49/#qa49-29\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5898\" target=\"_blank\" rel=\"noopener\">1:38:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-30\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Здоровье Дракости: 30 ХП в вып. 39 были обманкой<\/b><\/div><p>В вып. 39 30 ХП <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a> были отвлекающим манёвром для дварфов, чтобы его не раскрыли, — на деле у дракона было 250–300. В вып. 49 его 30–35 ХП были настоящими: осколок у сердца снизил максимум здоровья и не давал превращаться.<\/p><blockquote>«у Дракости было 30 здоровья, но это был чисто отвлекающий манёвр... На самом деле было у него там 250-300»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa49/#qa49-30\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6216\" target=\"_blank\" rel=\"noopener\">1:43:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-33\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему цыгане встретили отряд враждебно<\/b><\/div><p>Цыгане уже опоили купцов, чтобы тихо обобрать их кибитки, а отряд пришёл как конкуренты: назвался бродячими артистами и начал развлекать тех же купцов. Поэтому цыгане сразу напряглись.<\/p><blockquote>«Вы вошли как некие конкуренты... И тут появляется группа, которая начинает заниматься примерно тем же»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-33\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6466\" target=\"_blank\" rel=\"noopener\">1:47:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Как в ПЧК определяют очерёдность в бою<\/b><\/div><p>Объяснили, как в шоу работает инициатива. В первом раунде первым ходит тот, кто активнее заявляется, мастер записывает порядок на бумажке, и следующие раунды идут по нему. Инициативу кидают, только когда важно, кто начнёт — герои или враг. Бои условны, потому что за выпуск нужно пройти несколько локаций.<\/p><blockquote>«первый раунд самый важный... кто хочет больше сходить, тому мы и даём ход. А второй раунд уже идёт по той же инициативе»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-34\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6592\" target=\"_blank\" rel=\"noopener\">1:49:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-35\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Шевчук не освоил способности Артёма<\/b><\/div><p>В видеообращении <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Никита Шевчук<\/a> признался, что для него это была первая игра: правила он не усвоил и способностями персонажа толком не воспользовался. Участники добавили, что у <a class=\"ref\" href=\"/c/artyom/\">Артёма<\/a> было много заклинаний и Шевчук в них закопался.<\/p><blockquote>«Правила я не усвоил, поэтому не смог как следует воспользоваться умениями своего персонажа»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-35\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=6720\" target=\"_blank\" rel=\"noopener\">1:52:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa49-36\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Монтажный ляп с удочкой Мираторга<\/b><\/div><p>Шатохин признал монтажный ляп. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> оставил удочку, натянутую над обрывом, а позже снова ею воспользовался. За столом об этом спорили: <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> заявлял, что задним числом забрал удочку, а Бреганов возражал. Спор вырезали, и на экране осталось, будто удочка просто снова у Мираторга.<\/p><blockquote>«Я беру удочку... А Бреганов говорит: «Да нет, ты эту удочку оставил там». — Ретроспективная заявка. Я её забрал оттуда.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa49/#qa49-36\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=7291\" target=\"_blank\" rel=\"noopener\">2:01:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><\/section>", "chars": {"Шмыгель": {"name": "Шмыгель", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Frame Tamer"], "kind": "pc", "dead": false, "race": "гоблин, повар", "portraits": [], "url": "/c/shmygel/", "eps": [{"key": "49", "label": "49", "title": "Раненый дракон"}]}, "Нурик": {"name": "Король Нурик", "img": "img/chars/nurik-lunolikij.webp", "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/korol-nurik/", "eps": [{"key": "19", "label": "19", "title": "Час эльфийского с
