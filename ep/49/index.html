<script>window.EPD = {"anim": false, "key": "49", "label": "49", "title": "Раненый дракон", "date": "2026-05-24", "minutes": 116, "duration": 6982.0, "video_id": "A0uPFbi5E20", "branch": "Янус и дракон Гиммилут", "branch_color": "#B8901C", "place": "Путь от вулкана Нергал через реку Азелия до Нурикфела, столицы лесных эльфов", "short_html": "Свита раненого дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> бежит от дварфов к эльфийскому королю <a class=\"ref\" href=\"/c/korol-nurik/\">Нурику<\/a>, обещавшему его вылечить.", "summary_html": "Красный дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>, раненный залпом драконобоек кунисских дварфов и речных гномов (вып. 39), не может принять истинный облик: осколок гномьего болта сидит у самого сердца. Король лесных эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a> обещает вылечить его в обмен на уничтожение речных гномов. Спасаясь от сотен дварфов, осадивших логово у вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>, свита дракона уходит от погони по серпантину, переправляется через реку Азелия, обманом и резнёй отбирает лошадей у табора цыган (и получает проклятие цыганки-колдуньи Женевьевы), а у речных гномов покупает проезд драконьим плащом Гиммилута. Гномы обрушивают мост, отрезая дварфов. В <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфеле<\/a> Гиммилут подписывает с Нуриком смертельно обязывающий договор о стратегическом союзе перед Великим древом и ложится на операцию.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Зачем нужен выпуск: вывести дракона из логова в большую политику\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Зачем нужен выпуск: вывести дракона из логова в большую политику<\/b> Мастер объяснил, что выпуск понадобился, чтобы вытащить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> из усыпальницы с золотом: иначе дракон так и сидел бы над сокровищами. Задача была сделать его фигурой на доске политической интриги и борьбы сил. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=340\" target=\"_blank\" rel=\"noopener\">0:05:40 ↗<\/a> · <a href=\"#qa49-1\">к записи<\/a><\/span><\/span>", "outcome_html": "Все герои выжили; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> стал союзником лесных эльфов по смертельно обязывающему договору и лёг на операцию, но проклят цыганкой.", "world_html": ["Союз лесных эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> и красного дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> — «третья сила» в войне за земной мир<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Стремление Гиммилута стать «третьей силой» сыграет в следующих выпусках\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Стремление Гиммилута стать «третьей силой» сыграет в следующих выпусках<\/b> Селезнёв сказал, что следующие выпуски уже сняты и желание <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> стать третьей силой и поработить мир там действительно получило развитие. Такой сильный герой, по его словам, сильно повлияет на расклад сил в мире. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=402\" target=\"_blank\" rel=\"noopener\">0:06:42 ↗<\/a> · <a href=\"#qa49-2\">к записи<\/a><\/span><\/span>", "Мост через Азелию у лагеря речных гномов разрушен", "Золото <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> брошено у <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>, драконий плащ у речных гномов<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Драконий плащ ни на что не влияет\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Драконий плащ ни на что не влияет<\/b> Отвечая, вернул ли гуль плащ <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a>, сказали, что на механику плащ не влияет — «это просто скин». Вернул ли его гуль, предложили решить <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4630\" target=\"_blank\" rel=\"noopener\">1:17:10 ↗<\/a> · <a href=\"#qa49-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Бо́льшая часть золота осталась в заваленной пещере\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Бо́льшая часть золота осталась в заваленной пещере<\/b> Бо́льшая часть богатств <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> хранилась в пещере, которую он заранее завалил, а на телеге была лишь часть. Горные дварфы, если соберут рабочую силу и технику, могут докопаться до клада. Возможно, часть они уже нашли. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5452\" target=\"_blank\" rel=\"noopener\">1:30:52 ↗<\/a> · <a href=\"#qa49-25\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> проклят цыганкой Женевьевой<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Мираторг действительно перехватил часть проклятия\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Мираторг действительно перехватил часть проклятия<\/b> Подтвердили, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> смог перехватить проклятие цыганки, — по крайней мере его часть, если представить проклятие газовым облаком. Если с огромным желанием прыгаешь под проклятие, то его и получаешь. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5386\" target=\"_blank\" rel=\"noopener\">1:29:46 ↗<\/a> · <a href=\"#qa49-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Цыганское проклятие ещё сработает\">23<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Цыганское проклятие ещё сработает<\/b> Отдельного выпуска о проклятии Женевьевы пока не планируют, но авторы о нём помнят: оно должно как-то сработать в будущем, за такие «крючочки» они цепляются. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам после съёмок был впечатлён проклятием. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5452\" target=\"_blank\" rel=\"noopener\">1:30:52 ↗<\/a> · <a href=\"#qa49-24\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Бусти-заставка от лица <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>."}, {"t": "0:01:45", "sec": 105, "html": "Пролог: 500 лет назад <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> захватил гномий город Гусь Пещерный и сделал его логовом; уцелевшие гномы бежали на юг, к реке Азелия, и живут грабежом. Попавшая к дракону маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> пробудила в нём жажду власти над миром; в человеческом облике с драконорождённым и тремя кунисскими дварфами он отправился за невестой, но дварфы с речными гномами устроили ему засаду; полукровка <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> предал сородичей и спас дракона.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему Гиммилут хочет власти над миром: версия о матери Драксении\">13<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему Гиммилут хочет власти над миром: версия о матери Драксении<\/b> Автор вступления к выпуску поделился своей логикой. О власти драконов над миром, возможно, мечтала мать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> Драксения. Драконы — «живые боги земного мира»: демоны и небесные боги кормятся земным миром, а власть драконов могла бы прекратить это раздирание и объединить мир, как империя. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4187\" target=\"_blank\" rel=\"noopener\">1:09:47 ↗<\/a> · <a href=\"#qa49-13\">к записи<\/a><\/span><\/span>"}, {"t": "0:03:31", "sec": 211, "html": "Сценка в телеге с рекламой; цель — <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>."}, {"t": "0:08:04", "sec": 484, "html": "Завязка мастера: исцелить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> может только эльфийская медицина; король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a> зовёт его в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>: «мы избавим вас от ваших проблем, а вы — нас от наших».<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Зачем нужен выпуск: вывести дракона из логова в большую политику\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Зачем нужен выпуск: вывести дракона из логова в большую политику<\/b> Мастер объяснил, что выпуск понадобился, чтобы вытащить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> из усыпальницы с золотом: иначе дракон так и сидел бы над сокровищами. Задача была сделать его фигурой на доске политической интриги и борьбы сил. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=340\" target=\"_blank\" rel=\"noopener\">0:05:40 ↗<\/a> · <a href=\"#qa49-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Политическое устройство Понии и мотив Нурика\">19<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Политическое устройство Понии и мотив Нурика<\/b> Земли вокруг столицы — автономные княжества и королевства (в том числе королевство лесных эльфов и республика на севере), присоединённые к <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> союзами или силой и подчинённые королю. <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисскими<\/a> дварфами правит совет старейшин. Королевство <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>, живущего тысячи лет, покорил Поний IV, отец <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>. Нурик, вероятно, хочет независимости: налоги на войну с демонами, эльфов в королевской армии почти нет (там в основном люди <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>), а высшие эльфы и вовсе независимы. Союз с драконом даёт Нурику мощный рычаг, тем более что у короля есть свиток <a class=\"ref\" href=\"/a/svitki-apokalipsisa/\">Апокалипсиса<\/a>. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5132\" target=\"_blank\" rel=\"noopener\">1:25:32 ↗<\/a> · <a href=\"#qa49-19\">к записи<\/a><\/span><\/span>"}, {"t": "0:09:51", "sec": 591, "html": "Представление героев: <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> (в человеческом облике зовёт себя Дракостя, выдаёт себя за богатого дворянина; нельзя превращаться — болт убьёт; обещал <a class=\"ref\" href=\"/c/korol-nurik/\">Нурику<\/a> уничтожить речных гномов, незаконно занявших его владения); <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> (драконорождённый, считает дракона роднёй и «такой же жертвой»: сам однажды ради женщины потерял лодку, женщину и лучшего друга — отсылка к вып. 32/43); <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> (всю жизнь добивался признания дварфов, в решающий момент пощадил дракона, хочет основать свой клан; дракон обещал сделать его наместником Кунисских гор; имя значит «милостивый»); <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> (сын шляпника из деревни <a class=\"ref\" href=\"/place/solevuha/\">Солевуха<\/a>, ушёл в драконий культ ради силы и стал жрецом); <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> (гоблин из дварфийской деревни Коразоновка, раб в доме Коразона, чьих сородичей-гоблинов убили дварфы; сбежал во время налёта Гиммилута и предупредил его о дварфийском войске).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Шмыгель и гоблин Биктор — из одного истреблённого клана\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Шмыгель и гоблин Биктор — из одного истреблённого клана<\/b> В предыстории <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> (и на его арте) спрятана отсылка к гоблину <a class=\"ref\" href=\"/c/biktor/\">Биктору<\/a>, воспитаннику <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, которого играл <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>. Оба гоблина — из одного клана, уничтоженного дварфами. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=717\" target=\"_blank\" rel=\"noopener\">0:11:57 ↗<\/a> · <a href=\"#qa49-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Здоровье Дракости: 30 ХП в вып. 39 были обманкой\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Здоровье Дракости: 30 ХП в вып. 39 были обманкой<\/b> В вып. 39 30 ХП <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a> были отвлекающим манёвром для дварфов, чтобы его не раскрыли, — на деле у дракона было 250–300. В вып. 49 его 30–35 ХП были настоящими: осколок у сердца снизил максимум здоровья и не давал превращаться. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6216\" target=\"_blank\" rel=\"noopener\">1:43:36 ↗<\/a> · <a href=\"#qa49-30\">к записи<\/a><\/span><\/span>"}, {"t": "0:19:35", "sec": 1175, "html": "Сотни дварфов подходят к <a class=\"ref\" href=\"/place/nergal/\">Нергалу<\/a>; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> магией обрушивает проходы в пещеру, свита грузит на телегу мешки золота и уходит через чёрный ход вниз по серпантину.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Спокойное начало и цель погони — уничтожить телегу с золотом\">25<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Спокойное начало и цель погони — уничтожить телегу с золотом<\/b> Начать спокойно, а не сразу с погони, решили, чтобы незнакомые друг с другом игроки успели освоиться, а <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчук<\/a> разобрался с телегой. Погоня задумывалась как испытание с возможным смертельным исходом. Цель мастера и дварфов — уничтожить телегу с золотом (35–40 ХП). Игроки могли в любой момент взять из неё монеты или мешок, но этого не сделали. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5579\" target=\"_blank\" rel=\"noopener\">1:32:59 ↗<\/a> · <a href=\"#qa49-26\">к записи<\/a><\/span><\/span>"}, {"t": "0:22:05", "sec": 1325, "html": "<a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> падает под колесо; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> вылавливает его удочкой. Дварфы сталкивают валун — <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> уводит телегу.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Откуда у дварфов взялся валун\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Откуда у дварфов взялся валун<\/b> Мастер пояснил, что валун всё время лежал на месте. Пробегавшие мимо дварфы оценили обстановку и подрубили под ним топорами опору, чтобы он скатился. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=1218\" target=\"_blank\" rel=\"noopener\">0:20:18 ↗<\/a> · <a href=\"#qa49-7\">к записи<\/a><\/span><\/span>"}, {"t": "0:24:40", "sec": 1480, "html": "Погоня дварфов на горных баранах: речь <a class=\"ref\" href=\"/c/artyom/\">Артёма<\/a> «голосом культа», угли из мангала <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a>, ссора <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> с <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилутом<\/a> («Надо было тебя добить») и «примирение» с помощью пальца в конский зад; огненные снаряды и огненный шар Гиммилута поджигают дварфов; Дудуш стреляет в предводителя дварфов, тот клянётся ему смертью как предателю.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Арт «братского поцелуя» Шмыгеля и Дудуша прошёл пять правок\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Арт «братского поцелуя» Шмыгеля и Дудуша прошёл пять правок<\/b> <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> «уравновесил» конфликт с <a class=\"ref\" href=\"/c/dudush/\">Дудушем<\/a>, приложив палец от губ Дудуша к своим. Иллюстрацию с поцелуем переделывали около пяти раз, в том числе по референсу поцелуя Брежнева и Хонеккера. В итоге показали момент уже после поцелуя. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=2733\" target=\"_blank\" rel=\"noopener\">0:45:33 ↗<\/a> · <a href=\"#qa49-9\">к записи<\/a><\/span><\/span>"}, {"t": "0:42:21", "sec": 2541, "html": "Дварфы разбивают телегу молотами. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> натягивает леску удочки над обрывом «канатной дорогой», отряд съезжает к реке; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> последним, выпустив ещё один огненный шар. Золото остаётся на телеге/на горе.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Бо́льшая часть золота осталась в заваленной пещере\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Бо́льшая часть золота осталась в заваленной пещере<\/b> Бо́льшая часть богатств <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> хранилась в пещере, которую он заранее завалил, а на телеге была лишь часть. Горные дварфы, если соберут рабочую силу и технику, могут докопаться до клада. Возможно, часть они уже нашли. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5452\" target=\"_blank\" rel=\"noopener\">1:30:52 ↗<\/a> · <a href=\"#qa49-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Спокойное начало и цель погони — уничтожить телегу с золотом\">25<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Спокойное начало и цель погони — уничтожить телегу с золотом<\/b> Начать спокойно, а не сразу с погони, решили, чтобы незнакомые друг с другом игроки успели освоиться, а <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчук<\/a> разобрался с телегой. Погоня задумывалась как испытание с возможным смертельным исходом. Цель мастера и дварфов — уничтожить телегу с золотом (35–40 ХП). Игроки могли в любой момент взять из неё монеты или мешок, но этого не сделали. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5579\" target=\"_blank\" rel=\"noopener\">1:32:59 ↗<\/a> · <a href=\"#qa49-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Монтажный ляп с удочкой Мираторга\">33<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Монтажный ляп с удочкой Мираторга<\/b> Шатохин признал монтажный ляп. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> оставил удочку, натянутую над обрывом, а позже снова ею воспользовался. За столом об этом спорили: <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> заявлял, что задним числом забрал удочку, а Бреганов возражал. Спор вырезали, и на экране осталось, будто удочка просто снова у Мираторга. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=7291\" target=\"_blank\" rel=\"noopener\">2:01:31 ↗<\/a> · <a href=\"#qa49-36\">к записи<\/a><\/span><\/span>"}, {"t": "0:47:52", "sec": 2872, "html": "<a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> сталкивает в реку дварфа-рыбака и забирает лодку; отряд переправляется. Двое дварфов тонут, старый дварф ведёт остальных к мосту у лагеря речных гномов.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дварф-рыбак был глухим; Мираторг не заметил удочку\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дварф-рыбак был глухим; Мираторг не заметил удочку<\/b> Дварф-рыбак, на которого напал <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>, был глухим. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признался, что сначала не заметил у него удочку и напал на всякий случай, потому что важнее всего была миссия. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=3623\" target=\"_blank\" rel=\"noopener\">1:00:23 ↗<\/a> · <a href=\"#qa49-11\">к записи<\/a><\/span><\/span>"}, {"t": "0:52:05", "sec": 3125, "html": "Лодка течёт; по дыму отряд выходит к лагерю цыган и купцов. Цыган Луваш приглашает к костру; <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> распознаёт в вине купцов «зелье веселья» — цыгане обирают одурманенных торговцев.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Цыгане в мире ПЧК — уникальный народ, ходящий между мирами\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Цыгане в мире ПЧК — уникальный народ, ходящий между мирами<\/b> Отдельной фэнтези-расы для цыган авторы не придумывали: это единственный «реальный» народ в мире, и он уникален. Как вистани из D&amp;D, цыгане умеют проникать в дыры между пространствами и переходить между мирами, вплоть до демипланов. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5836\" target=\"_blank\" rel=\"noopener\">1:37:16 ↗<\/a> · <a href=\"#qa49-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему цыгане встретили отряд враждебно\">30<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему цыгане встретили отряд враждебно<\/b> Цыгане уже опоили купцов, чтобы тихо обобрать их кибитки, а отряд пришёл как конкуренты: назвался бродячими артистами и начал развлекать тех же купцов. Поэтому цыгане сразу напряглись. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6466\" target=\"_blank\" rel=\"noopener\">1:47:46 ↗<\/a> · <a href=\"#qa49-33\">к записи<\/a><\/span><\/span>"}, {"t": "0:58:25", "sec": 3505, "html": "Цыганка мадам Женевьева уводит Дракостю: она узнаёт в нём <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, чувствует осколок и предлагает «цыганской медициной» извлечь его в кибитке; она же незаметно крадёт и возвращает маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>. Маска, надетая на лицо, оживает и ругает Гиммилута за брошенное золото.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Женевьева собиралась убить Дракостю во время «операции» ради маски\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Женевьева собиралась убить Дракостю во время «операции» ради маски<\/b> Женевьева, прорицательница и волшебница, сразу почуяла истинный облик <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a>. Задачей мастера в сцене было заманить его в кибитку, усыпить и убить во время «операции». По уже заявленному правилу, чтобы стать новым хозяином маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, нужно убить прежнего. При удачных переговорах можно было договориться с цыганами о союзе и закончить приключение там же. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4880\" target=\"_blank\" rel=\"noopener\">1:21:20 ↗<\/a> · <a href=\"#qa49-16\">к записи<\/a><\/span><\/span>"}, {"t": "0:59:50", "sec": 3590, "html": "<a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> «голосом культа» просит у купцов пять лошадей; Луваш угрожает медведосовом. <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> пускает огненный салют, <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> показывает «танцующую белку»; <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> не может «исчезнуть».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Белку Дудуша можно сделать огнедышащей навсегда\">21<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Белку Дудуша можно сделать огнедышащей навсегда<\/b> На вопрос, может ли дракон наделить белку огненным дыханием навсегда, ответили, что можно. По правилам D&amp;D заклинание, которое год каждый день накладывают ритуалом, действует постоянно. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 ↗<\/a> · <a href=\"#qa49-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему цыгане встретили отряд враждебно\">30<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему цыгане встретили отряд враждебно<\/b> Цыгане уже опоили купцов, чтобы тихо обобрать их кибитки, а отряд пришёл как конкуренты: назвался бродячими артистами и начал развлекать тех же купцов. Поэтому цыгане сразу напряглись. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6466\" target=\"_blank\" rel=\"noopener\">1:47:46 ↗<\/a> · <a href=\"#qa49-33\">к записи<\/a><\/span><\/span>"}, {"t": "1:09:42", "sec": 4182, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> призывает двух гулей; отряд угоняет лошадей. Полурослик Брабус (выдававший себя за 10-летнего мальчика) прыгает на лошадь <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>; медведосов с цыганом преграждает путь и ранит Дудуша."}, {"t": "1:16:04", "sec": 4564, "html": "Бой: <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a>, съев «бодрящий шашлычок», выкалывает медведосову глаза вилками; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> сбрасывает и убивает цыгана-наездника; гули и <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> добивают медведосова (шалбан по носу).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Что мог готовить Шмыгель: рецепты и их эффекты\">8<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Что мог готовить Шмыгель: рецепты и их эффекты<\/b> Продуктов в инвентаре у <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> хватало на два приготовления. Рецепты: дварфийский борщ, бодрящий шашлычок с хреном (как заклинание ускорения), мясной кисель (возвращает волшебнику два заряда магии), куриное рагу (10 минут преимущества на атаки ближнего боя и +d4 урона). Авторы ждали, что он будет жарить и трупы. По классу он был обычным плутом со скрытой атакой. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=2356\" target=\"_blank\" rel=\"noopener\">0:39:16 ↗<\/a> · <a href=\"#qa49-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Артём был заточен под лагерь: мог приручить медведосова\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Артём был заточен под лагерь: мог приручить медведосова<\/b> Персонажа <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчука<\/a> (<a class=\"ref\" href=\"/c/artyom/\">Артём<\/a>) прописывали под сцену в лагере. У него была способность к дрессировке и харизма у огня, обращённая ко всем, так что медведосова можно было приручить, а не убивать. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4753\" target=\"_blank\" rel=\"noopener\">1:19:13 ↗<\/a> · <a href=\"#qa49-15\">к записи<\/a><\/span><\/span>"}, {"t": "1:24:08", "sec": 5048, "html": "Женевьева растворяет табор в тумане и проклинает <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> за пролитую цыганскую кровь; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> пытается «поймать» проклятие на себя. <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> забирает душу цыгана в «клетку душ». Одурманенные купцы дают Гиммилуту 2 золотые монеты «на операцию» и говорят, что речные гномы ненавидят драконов.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Мираторг взял на себя проклятие\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Мираторг взял на себя проклятие<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> перехватил проклятие Женевьевы ради своей миссии: довезти раненого дракона на лечение и немного ему услужить. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=3938\" target=\"_blank\" rel=\"noopener\">1:05:38 ↗<\/a> · <a href=\"#qa49-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Мираторг действительно перехватил часть проклятия\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Мираторг действительно перехватил часть проклятия<\/b> Подтвердили, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> смог перехватить проклятие цыганки, — по крайней мере его часть, если представить проклятие газовым облаком. Если с огромным желанием прыгаешь под проклятие, то его и получаешь. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5386\" target=\"_blank\" rel=\"noopener\">1:29:46 ↗<\/a> · <a href=\"#qa49-23\">к записи<\/a><\/span><\/span>"}, {"t": "1:27:15", "sec": 5235, "html": "Отряд переодевается купцами; <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> ставит алтарь с символом дракона — комплименты дракону лечат свиту."}, {"t": "1:33:50", "sec": 5630, "html": "У подвесного моста через Азелию <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> задевает ловушку (бревно с шипами), с вышек речные гномы бьют из рогаток и требуют 20 монет."}, {"t": "1:39:05", "sec": 5945, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>, вымазанный в грязи, продаёт гномам свой плащ из драконьей кожи как «плащ Гиммилута, украденный у цыган»; гномы верят, что цыгане с драконом, а дварфы на подходе «тоже за дракона», и сами перерезают мост — дварфы отрезаны."}, {"t": "1:46:30", "sec": 6390, "html": "Гуль, посланный отобрать плащ, убит выстрелом. <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> лечится душой из клетки.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Драконий плащ ни на что не влияет\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Драконий плащ ни на что не влияет<\/b> Отвечая, вернул ли гуль плащ <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a>, сказали, что на механику плащ не влияет — «это просто скин». Вернул ли его гуль, предложили решить <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4630\" target=\"_blank\" rel=\"noopener\">1:17:10 ↗<\/a> · <a href=\"#qa49-14\">к записи<\/a><\/span><\/span>"}, {"t": "1:48:15", "sec": 6495, "html": "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>: дворец внутри Великого древа. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> требует гарантий: <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">Чаша познания смерти<\/a> показала ему, что его может убить дракон."}, {"t": "1:49:08", "sec": 6548, "html": "Договор о стратегическом партнёрстве перед Великим древом: бессрочный союз, «твой враг — мой враг», <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> катает <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> по его просьбе, по дополнениям — Нурик катает Гиммилута (в облике Дракости), а <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> катается на Нурике. Нарушитель умрёт по воле древа. Договор подписан.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Пункт о катании на Нурике прошёл за счёт броска убеждения\">17<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Пункт о катании на Нурике прошёл за счёт броска убеждения<\/b> Пункт договора, по которому <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> катается на <a class=\"ref\" href=\"/c/korol-nurik/\">Нурике<\/a>, вписали, потому что прошёл бросок убеждения. Без броска такое дать было нельзя, а по правилам NPC при прошедшем броске нехотя соглашается. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5004\" target=\"_blank\" rel=\"noopener\">1:23:24 ↗<\/a> · <a href=\"#qa49-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Договор делает врагов дракона врагами эльфов; цели Нурика\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Договор делает врагов дракона врагами эльфов; цели Нурика<\/b> По договору стороны признают врагов друг друга своими врагами, то есть кого назовёт врагом одна сторона, тот становится врагом и другой. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> не любит дварфов и ненавидит речных гномов, которые после изгнания драконом с вулкана поселились в его лесу. Его цель — уничтожить гномов и насолить дварфам. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5069\" target=\"_blank\" rel=\"noopener\">1:24:29 ↗<\/a> · <a href=\"#qa49-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Наём убийц не спасает от кары древа\">20<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Наём убийц не спасает от кары древа<\/b> Если <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a> или <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> решат избавиться от партнёра чужими руками, Великое древо всё равно докажет их вину: достаточно знать о покушении и чувствовать хоть каплю вины. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5259\" target=\"_blank\" rel=\"noopener\">1:27:39 ↗<\/a> · <a href=\"#qa49-20\">к записи<\/a><\/span><\/span>"}, {"t": "1:54:20", "sec": 6860, "html": "Эльфийские целители начинают операцию. 11 монет = 110 000 руб. на благотворительность. Эпилог: дракон скоро будет здоров; в битве за земной мир появляется «третья сила»; вопросы — какую игру ведёт <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> и насколько страшно цыганское проклятие.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Стремление Гиммилута стать «третьей силой» сыграет в следующих выпусках\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Стремление Гиммилута стать «третьей силой» сыграет в следующих выпусках<\/b> Селезнёв сказал, что следующие выпуски уже сняты и желание <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> стать третьей силой и поработить мир там действительно получило развитие. Такой сильный герой, по его словам, сильно повлияет на расклад сил в мире. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=402\" target=\"_blank\" rel=\"noopener\">0:06:42 ↗<\/a> · <a href=\"#qa49-2\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:19:35", "sec": 1175}, {"t": "0:24:40", "sec": 1480}, {"t": "0:42:21", "sec": 2541}, {"t": "0:47:52", "sec": 2872}, {"t": "0:58:25", "sec": 3505}, {"t": "1:16:04", "sec": 4564}, {"t": "1:24:08", "sec": 5048}, {"t": "1:39:05", "sec": 5945}, {"t": "1:49:08", "sec": 6548}, {"t": "1:54:20", "sec": 6860}], "coins": {"ep": "49", "events": [{"t": "0:23:20", "kind": "earn", "who": "Шмыгель", "actor": "Frame Tamer", "to": null, "reason": "шутка про то, что все тянут его в телегу, «а не в макс», сразу после того как Артём спас его удочкой (спиннингом)", "result": null, "sec": 1400, "who_url": "/c/shmygel/", "reason_html": "шутка про то, что все тянут его в телегу, «а не в макс», сразу после того как <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> спас его удочкой (спиннингом)"}, {"t": "0:35:34", "kind": "earn", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "эффектные броски кубиков урона от огненного шара (числа подряд, затем все нечётные) — реплики «это монета»/«ещё монету» без явного «дайте», получатель определён по контексту (кастующий), не стопроцентно уверенно", "result": null, "sec": 2134, "who_url": "/c/drakon-gimelut/", "reason_html": "эффектные броски кубиков урона от огненного шара (числа подряд, затем все нечётные) — реплики «это монета»/«ещё монету» без явного «дайте», получатель определён по контексту (кастующий), не стопроцентно уверенно"}, {"t": "0:41:11", "kind": "spend", "who": "Шмыгель", "actor": "Frame Tamer", "to": null, "reason": "потратил монету на переброс проверки акробатики после промаха по барану-наезднику", "result": "успех — попал специями в глаза наезднику, обезвредил его на один ход", "sec": 2471, "who_url": "/c/shmygel/", "reason_html": "потратил монету на переброс проверки акробатики после промаха по барану-наезднику"}, {"t": "0:58:15", "kind": "loot", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "цыганка-гадалка пытается продать Дракосте монетку-подвеску «биткоин» — внутриигровой сувенир, не игровая монета мастера", "result": null, "sec": 3495, "who_url": "/c/drakon-gimelut/", "reason_html": "цыганка-гадалка пытается продать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a> монетку-подвеску «биткоин» — внутриигровой сувенир, не игровая монета мастера"}, {"t": "1:17:49", "kind": "earn", "who": "Шмыгель", "actor": "Frame Tamer", "to": null, "reason": "за внимательность — вспомнил про бонус урона от маленького размера при атаке двумя вилками (скрытая атака по медведосову/цыгану)", "result": null, "sec": 4669, "who_url": "/c/shmygel/", "reason_html": "за внимательность — вспомнил про бонус урона от маленького размера при атаке двумя вилками (скрытая атака по медведосову/цыгану)"}, {"t": "1:26:01", "kind": "earn", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "за шутку: очарованный купец даёт «денег на операцию, чтобы стать нормальным» в ответ на просьбу дать мелочи на дорогу — выдано две золотые монеты", "result": null, "sec": 5161, "who_url": "/c/drakon-gimelut/", "reason_html": "за шутку: очарованный купец даёт «денег на операцию, чтобы стать нормальным» в ответ на просьбу дать мелочи на дорогу — выдано две золотые монеты"}, {"t": "1:35:26", "kind": "spend", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "потратил монету на переброс проверки внимательности при езде на лошади первым в колонне (бросок с помехой)", "result": "не помогло — бревно с шипами сбивает с лошади, 11 урона", "sec": 5726, "who_url": "/c/drakon-gimelut/", "reason_html": "потратил монету на переброс проверки внимательности при езде на лошади первым в колонне (бросок с помехой)"}, {"t": "1:41:57", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "торг о цене плаща из драконьей кожи и прочего товара с речными гномами (20-100 игровых монет) — внутриигровые деньги, не мастерская монета", "result": null, "sec": 6117, "who_url": null, "reason_html": "торг о цене плаща из драконьей кожи и прочего товара с речными гномами (20-100 игровых монет) — внутриигровые деньги, не мастерская монета"}, {"t": "1:43:44", "kind": "spend", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "потратил монету на переброс проверки убеждения (харизма, с преимуществом), чтобы гномы пропустили караван", "result": "критический успех — гномы пропускают группу", "sec": 6224, "who_url": "/c/drakon-gimelut/", "reason_html": "потратил монету на переброс проверки убеждения (харизма, с преимуществом), чтобы гномы пропустили караван"}, {"t": "1:54:57", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальный подсчёт монет за выпуск для благотворительности (каждая монета = 10 000 руб.); итоговое число определяют дополнительным броском кубиков Гудков и Шевчук", "result": "11 монет", "sec": 6897, "who_url": null, "reason_html": "финальный подсчёт монет за выпуск для благотворительности (каждая монета = 10 000 руб.); итоговое число определяют дополнительным броском кубиков <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> и <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчук<\/a>"}], "totals": [{"who": "Шмыгель", "actor": "Frame Tamer", "earned": 2, "spent": 1, "img": null, "who_url": "/c/shmygel/", "actor_url": "/p/frame-tamer/"}, {"who": "Дракостя", "actor": "Гудков", "earned": 3, "spent": 2, "img": "img/chars/drakostya.webp", "who_url": "/c/drakon-gimelut/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Большая часть монет в этом выпуске уходит Шмыгелю (Frame Tamer) и Дракосте (Гудков); Артём, Мираторг и Дудуш явных индивидуальных монет не получали и не тратили. В конце выпуска ведущие объявляют итоговую благотворительную сумму — 11 золотых монет за весь эпизод (10 000 руб. за монету), что не полностью сходится с суммой явных «дайте/заберите»-реплик в расшифровке. Отдельно встречаются внутриигровые деньги (loot): монетка-сувенир у гадалки и торг о цене товаров/плаща с гномами — они не относятся к мастерской игровой механике монет."}, "cast": [{"name": "Гиммилут", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "красный дракон в человеческом облике", "role": "", "fate": "выжил, лёг на операцию, проклят", "id": "Гимелут", "url": "/c/drakon-gimelut/", "img": "img/chars/drakostya.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Гиммилут стал слишком сильным — авторы думают, как его ослабить\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Гиммилут стал слишком сильным — авторы думают, как его ослабить<\/b> Самый высокий уровень в ПЧК у дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> — около 15, у него 250 ХП в человеческом облике, маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспех. Он считает себя богом на земле, потому что герои не убили его в выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">32<\/a>. Авторы признались, что им сложно им играть и они думают, как дракона ослабить: например, украсть у него маску. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6233\" target=\"_blank\" rel=\"noopener\">1:43:53 ↗<\/a> · <a href=\"#qa47-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему Гиммилут хочет власти над миром: версия о матери Драксении\">13<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему Гиммилут хочет власти над миром: версия о матери Драксении<\/b> Автор вступления к выпуску поделился своей логикой. О власти драконов над миром, возможно, мечтала мать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> Драксения. Драконы — «живые боги земного мира»: демоны и небесные боги кормятся земным миром, а власть драконов могла бы прекратить это раздирание и объединить мир, как империя. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4187\" target=\"_blank\" rel=\"noopener\">1:09:47 ↗<\/a> · <a href=\"#qa49-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Монеты дракона на переброс — только через бросок мудрости\">26<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Монеты дракона на переброс — только через бросок мудрости<\/b> По механике выпуска золото дракона было нельзя просто потратить на перебросы. Нужно было уговорить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, и тот должен был выбросить 20 на мудрость, чтобы дать хоть одну монету. Каждый такой переброс психически ранил бы дракона, вплоть до смерти. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5709\" target=\"_blank\" rel=\"noopener\">1:35:09 ↗<\/a> · <a href=\"#qa49-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Здоровье Дракости: 30 ХП в вып. 39 были обманкой\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Здоровье Дракости: 30 ХП в вып. 39 были обманкой<\/b> В вып. 39 30 ХП <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a> были отвлекающим манёвром для дварфов, чтобы его не раскрыли, — на деле у дракона было 250–300. В вып. 49 его 30–35 ХП были настоящими: осколок у сердца снизил максимум здоровья и не давал превращаться. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6216\" target=\"_blank\" rel=\"noopener\">1:43:36 ↗<\/a> · <a href=\"#qa49-30\">к записи<\/a><\/span><\/span>"}, {"name": "Мираторг", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "драконорождённый, боец ближнего боя", "role": "", "fate": "выжил", "id": "Мираторг", "url": "/c/miratorg/", "img": "img/chars/miratorg.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дварф-рыбак был глухим; Мираторг не заметил удочку\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дварф-рыбак был глухим; Мираторг не заметил удочку<\/b> Дварф-рыбак, на которого напал <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>, был глухим. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признался, что сначала не заметил у него удочку и напал на всякий случай, потому что важнее всего была миссия. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=3623\" target=\"_blank\" rel=\"noopener\">1:00:23 ↗<\/a> · <a href=\"#qa49-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Мираторг взял на себя проклятие\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Мираторг взял на себя проклятие<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> перехватил проклятие Женевьевы ради своей миссии: довезти раненого дракона на лечение и немного ему услужить. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=3938\" target=\"_blank\" rel=\"noopener\">1:05:38 ↗<\/a> · <a href=\"#qa49-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Мираторг действительно перехватил часть проклятия\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Мираторг действительно перехватил часть проклятия<\/b> Подтвердили, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> смог перехватить проклятие цыганки, — по крайней мере его часть, если представить проклятие газовым облаком. Если с огромным желанием прыгаешь под проклятие, то его и получаешь. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5386\" target=\"_blank\" rel=\"noopener\">1:29:46 ↗<\/a> · <a href=\"#qa49-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Монтажный ляп с удочкой Мираторга\">33<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Монтажный ляп с удочкой Мираторга<\/b> Шатохин признал монтажный ляп. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> оставил удочку, натянутую над обрывом, а позже снова ею воспользовался. За столом об этом спорили: <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> заявлял, что задним числом забрал удочку, а Бреганов возражал. Спор вырезали, и на экране осталось, будто удочка просто снова у Мираторга. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=7291\" target=\"_blank\" rel=\"noopener\">2:01:31 ↗<\/a> · <a href=\"#qa49-36\">к записи<\/a><\/span><\/span>"}, {"name": "Дудуш", "actor": "Турал Натурал", "actor_url": "/p/tural-natural/", "race": "полукровка дварфа и гномки, плут", "role": "", "fate": "выжил, ранен", "id": "Дудуш", "url": "/c/dudush/", "img": "img/chars/dudush.webp", "other": [{"key": "39", "label": "39", "title": "Кунисская пленница"}]}, {"name": "Артём", "actor": "Никита Шевчук", "actor_url": "/p/nikita-shevchuk/", "race": "человек, жрец драконьего культа", "role": "", "fate": "выжил", "id": "Артём", "url": "/c/artyom/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Артём был заточен под лагерь: мог приручить медведосова\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Артём был заточен под лагерь: мог приручить медведосова<\/b> Персонажа <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчука<\/a> (<a class=\"ref\" href=\"/c/artyom/\">Артём<\/a>) прописывали под сцену в лагере. У него была способность к дрессировке и харизма у огня, обращённая ко всем, так что медведосова можно было приручить, а не убивать. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4753\" target=\"_blank\" rel=\"noopener\">1:19:13 ↗<\/a> · <a href=\"#qa49-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Шевчук не освоил способности Артёма\">32<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Шевчук не освоил способности Артёма<\/b> В видеообращении <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Никита Шевчук<\/a> признался, что для него это была первая игра: правила он не усвоил и способностями персонажа толком не воспользовался. Участники добавили, что у <a class=\"ref\" href=\"/c/artyom/\">Артёма<\/a> было много заклинаний и Шевчук в них закопался. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=6720\" target=\"_blank\" rel=\"noopener\">1:52:00 ↗<\/a> · <a href=\"#qa49-35\">к записи<\/a><\/span><\/span>"}, {"name": "Шмыгель", "actor": "Frame Tamer", "actor_url": "/p/frame-tamer/", "race": "гоблин, повар", "role": "", "fate": "выжил", "id": "Шмыгель", "url": "/c/shmygel/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Шмыгель — тот самый безымянный гоблин из «Кунисской пленницы»\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Шмыгель — тот самый безымянный гоблин из «Кунисской пленницы»<\/b> <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> вырос из безымянного гоблина-слуги из вып. 39, которого тогда отыгрывал мастер. Зрители его запомнили, рисовали арты и много о нём писали, поэтому авторы сделали его персонажем игрока. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=530\" target=\"_blank\" rel=\"noopener\">0:08:50 ↗<\/a> · <a href=\"#qa49-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Шмыгель и гоблин Биктор — из одного истреблённого клана\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Шмыгель и гоблин Биктор — из одного истреблённого клана<\/b> В предыстории <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> (и на его арте) спрятана отсылка к гоблину <a class=\"ref\" href=\"/c/biktor/\">Биктору<\/a>, воспитаннику <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, которого играл <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>. Оба гоблина — из одного клана, уничтоженного дварфами. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=717\" target=\"_blank\" rel=\"noopener\">0:11:57 ↗<\/a> · <a href=\"#qa49-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Что мог готовить Шмыгель: рецепты и их эффекты\">8<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Что мог готовить Шмыгель: рецепты и их эффекты<\/b> Продуктов в инвентаре у <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> хватало на два приготовления. Рецепты: дварфийский борщ, бодрящий шашлычок с хреном (как заклинание ускорения), мясной кисель (возвращает волшебнику два заряда магии), куриное рагу (10 минут преимущества на атаки ближнего боя и +d4 урона). Авторы ждали, что он будет жарить и трупы. По классу он был обычным плутом со скрытой атакой. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=2356\" target=\"_blank\" rel=\"noopener\">0:39:16 ↗<\/a> · <a href=\"#qa49-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Шмыгель — мальчик\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Шмыгель — мальчик<\/b> На вопрос о поле <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> ответили, что он, судя по всему, мальчик. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=2925\" target=\"_blank\" rel=\"noopener\">0:48:45 ↗<\/a> · <a href=\"#qa49-10\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Маска Януса", "actor": "", "actor_url": null, "race": "", "role": "говорящий артефакт, пробудивший в драконе жажду власти", "fate": "у Гиммилута", "id": null, "url": null, "img": null, "other": []}, {"name": "Нурик Луноликий", "actor": "", "actor_url": null, "race": "", "role": "король лесных эльфов", "fate": "выжил, союзник дракона", "id": "Нурик", "url": "/c/korol-nurik/", "img": "img/chars/nurik-lunolikij.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Договор делает врагов дракона врагами эльфов; цели Нурика\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Договор делает врагов дракона врагами эльфов; цели Нурика<\/b> По договору стороны признают врагов друг друга своими врагами, то есть кого назовёт врагом одна сторона, тот становится врагом и другой. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> не любит дварфов и ненавидит речных гномов, которые после изгнания драконом с вулкана поселились в его лесу. Его цель — уничтожить гномов и насолить дварфам. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5069\" target=\"_blank\" rel=\"noopener\">1:24:29 ↗<\/a> · <a href=\"#qa49-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Политическое устройство Понии и мотив Нурика\">19<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Политическое устройство Понии и мотив Нурика<\/b> Земли вокруг столицы — автономные княжества и королевства (в том числе королевство лесных эльфов и республика на севере), присоединённые к <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> союзами или силой и подчинённые королю. <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисскими<\/a> дварфами правит совет старейшин. Королевство <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>, живущего тысячи лет, покорил Поний IV, отец <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>. Нурик, вероятно, хочет независимости: налоги на войну с демонами, эльфов в королевской армии почти нет (там в основном люди <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>), а высшие эльфы и вовсе независимы. Союз с драконом даёт Нурику мощный рычаг, тем более что у короля есть свиток <a class=\"ref\" href=\"/a/svitki-apokalipsisa/\">Апокалипсиса<\/a>. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5132\" target=\"_blank\" rel=\"noopener\">1:25:32 ↗<\/a> · <a href=\"#qa49-19\">к записи<\/a><\/span><\/span>"}, {"name": "Мадам Женевьева", "actor": "", "actor_url": null, "race": "", "role": "цыганка-колдунья", "fate": "исчезла, прокляв Гиммилута", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Женевьева собиралась убить Дракостю во время «операции» ради маски\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Женевьева собиралась убить Дракостю во время «операции» ради маски<\/b> Женевьева, прорицательница и волшебница, сразу почуяла истинный облик <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a>. Задачей мастера в сцене было заманить его в кибитку, усыпить и убить во время «операции». По уже заявленному правилу, чтобы стать новым хозяином маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, нужно убить прежнего. При удачных переговорах можно было договориться с цыганами о союзе и закончить приключение там же. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=4880\" target=\"_blank\" rel=\"noopener\">1:21:20 ↗<\/a> · <a href=\"#qa49-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Цыганское проклятие ещё сработает\">23<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Цыганское проклятие ещё сработает<\/b> Отдельного выпуска о проклятии Женевьевы пока не планируют, но авторы о нём помнят: оно должно как-то сработать в будущем, за такие «крючочки» они цепляются. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам после съёмок был впечатлён проклятием. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5452\" target=\"_blank\" rel=\"noopener\">1:30:52 ↗<\/a> · <a href=\"#qa49-24\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Имена Женевьевы и Луваша — в духе вистани из «Проклятия Страда»\">28<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Имена Женевьевы и Луваша — в духе вистани из «Проклятия Страда»<\/b> Имена цыган мастер стилизовал под имена вистани из модуля «Проклятие Страда» — слегка карикатурные, перекрученные русско-цыганские. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5898\" target=\"_blank\" rel=\"noopener\">1:38:18 ↗<\/a> · <a href=\"#qa49-29\">к записи<\/a><\/span><\/span>"}, {"name": "Луваш", "actor": "", "actor_url": null, "race": "", "role": "цыган с гитарой, глава табора", "fate": "исчез", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Имена Женевьевы и Луваша — в духе вистани из «Проклятия Страда»\">28<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Имена Женевьевы и Луваша — в духе вистани из «Проклятия Страда»<\/b> Имена цыган мастер стилизовал под имена вистани из модуля «Проклятие Страда» — слегка карикатурные, перекрученные русско-цыганские. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5898\" target=\"_blank\" rel=\"noopener\">1:38:18 ↗<\/a> · <a href=\"#qa49-29\">к записи<\/a><\/span><\/span>"}, {"name": "Брабус", "actor": "", "actor_url": null, "race": "", "role": "старый полурослик под видом мальчика", "fate": "ранен, исчез", "id": null, "url": null, "img": null, "other": []}, {"name": "Медведосов", "actor": "", "actor_url": null, "race": "", "role": "боевой зверь табора", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Цыган-наездник медведосова", "actor": "", "actor_url": null, "race": "", "role": "член табора", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Предводитель кунисских дварфов", "actor": "", "actor_url": null, "race": "", "role": "командир погони", "fate": "выжил, отрезан у моста", "id": null, "url": null, "img": null, "other": []}, {"name": "Речные гномы-дозорные", "actor": "", "actor_url": null, "race": "", "role": "стража переправы", "fate": "выжили, получили драконий плащ", "id": null, "url": null, "img": null, "other": []}, {"name": "Коразон", "actor": "", "actor_url": null, "race": "", "role": "дварф, бывший хозяин Шмыгеля", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "Король эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a>, <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Гибель <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> (Януса) у <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>, маска Януса перешла к дракону; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> перешёл на сторону дракона", "dir": "out", "color": "#B8901C"}, {"key": "39", "label": "39", "title": "Кунисская пленница", "note_html": "Засада на дракона в Кунисских горах и предательство <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> вспоминает бой с драконом в Кунисских горах", "dir": "out", "color": "#3E9A5E"}], "quotes_html": ["<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилут<\/a>: «Я разве просил многого? Я просто хотел быть властителем мира».", "<a class=\"ref\" href=\"/a/zolotaya-maska-yanusa/\">Маска Януса<\/a>: «Ты идиот. Ты как мог оставить всё золото на горе?»", "<a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a>: «Если бы стоял выбор между моей матерью, сестрой и вами, я бы выбрал вас».", "Речной гном: «Кожа дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> — какой подарок! Пропустить этих чмошников».", "Женевьева: «Ты не с тем народом решил шутки шутить»."], "places_html": "<ul>\n<li>Места: вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> и гномий город Гусь Пещерный (логово <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>); <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a>; деревня Коразоновка; деревня <a class=\"ref\" href=\"/place/solevuha/\">Солевуха<\/a>; серпантин и руины Старой Пристани; река Азелия, подвесной мост и лагерь речных гномов; поляна табора; <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> и Великое древо.<\/li>\n<li>Фракции: свита/культ <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>; кунисские (горные) дварфы; речные гномы; табор цыган Луваша; лесные эльфы <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>.<\/li>\n<li>Артефакты: маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; гномий болт/осколок в груди дракона; драконобойки; плащ из драконьей кожи <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> (отдан гномам); клетка душ <a class=\"ref\" href=\"/c/artyom/\">Артёма<\/a> (с душой цыгана); договор о стратегическом партнёрстве перед Великим древом; <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">Чаша познания смерти<\/a>; золотое кольцо клана Коразон; мешки золота (брошены).<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>33<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>33<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>7<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>13<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>4<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>8<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa47-32\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Гиммилут стал слишком сильным — авторы думают, как его ослабить<\/b><\/div><p>Самый высокий уровень в ПЧК у дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> — около 15, у него 250 ХП в человеческом облике, маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и доспех. Он считает себя богом на земле, потому что герои не убили его в выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">32<\/a>. Авторы признались, что им сложно им играть и они думают, как дракона ослабить: например, украсть у него маску.<\/p><blockquote>«Мы сейчас думаем, как этого дракона, блин, ослабить. Им невозможно играть. Он может всё.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-32\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6233\" target=\"_blank\" rel=\"noopener\">1:43:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa48-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Составы ближайших выпусков и «двойной» съёмочный день Талалы и Сфинктериона<\/b><\/div><p>Авторы раскрыли составы: в 49-м — <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, Турал и <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Никита Шевчук<\/a>, в 50-м — Сабина, <a class=\"ref\" href=\"/p/dima-koval/\">Дима Коваль<\/a> и <a class=\"ref\" href=\"/p/ruslan-usachev/\">Руслан Усачев<\/a>. Затем снимали выпуск с <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a>, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатиром<\/a> и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболевым<\/a> и экспериментальный второй мотор с Дашей <a class=\"ref\" href=\"/p/blohina/\">Блохиной<\/a>, Славой <a class=\"ref\" href=\"/p/chepurchenko/\">Чепурченко<\/a> и <a class=\"ref\" href=\"/c/gogen/\">Гогеном<\/a>. Бреганов отметил, что ветки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> снимаются в один день, и события одного выпуска могут сильно повлиять на другой.<\/p><blockquote>«Как в один день и Талала, и Сфинктерион… События одного выпуска сильно пересекаются с событиями другого выпуска и могут очень сильно повлиять на то, что произойдёт в следующем моторе.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa48/#qa48-19\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3717\" target=\"_blank\" rel=\"noopener\">1:01:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем нужен выпуск: вывести дракона из логова в большую политику<\/b><\/div><p>Мастер объяснил, что выпуск понадобился, чтобы вытащить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> из усыпальницы с золотом: иначе дракон так и сидел бы над сокровищами. Задача была сделать его фигурой на доске политической интриги и борьбы сил.<\/p><blockquote>«Нам нужно было сделать таким образом, чтобы Гиммилут стал... какой-то фигурой на шахматной доске политической интриги и борьбы»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa49/#qa49-1\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=340\" target=\"_blank\" rel=\"noopener\">0:05:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa49-2\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Стремление Гиммилута стать «третьей силой» сыграет в следующих выпусках<\/b><\/div><p>Селезнёв сказал, что следующие выпуски уже сняты и желание <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> стать третьей силой и поработить мир там действительно получило развитие. Такой сильный герой, по его словам, сильно повлияет на расклад сил в мире.<\/p><blockquote>«не так уж и бессмысленно звучит мысль и мотивация Гиммилута насчёт того, чтобы стать третьей силой... потому что там реально такое случилось»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa49/#qa49-2\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=402\" target=\"_blank\" rel=\"noopener\">0:06:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Шмыгель — тот самый безымянный гоблин из «Кунисской пленницы»<\/b><\/div><p><a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> вырос из безымянного гоблина-слуги из вып. 39, которого тогда отыгрывал мастер. Зрители его запомнили, рисовали арты и много о нём писали, поэтому авторы сделали его персонажем игрока.<\/p><blockquote>«вот этот гоблин, у которого тогда не было ещё никакого имени, сильно запомнился зрителям»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-3\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=530\" target=\"_blank\" rel=\"noopener\">0:08:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-4\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Шмыгель и гоблин Биктор — из одного истреблённого клана<\/b><\/div><p>В предыстории <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> (и на его арте) спрятана отсылка к гоблину <a class=\"ref\" href=\"/c/biktor/\">Биктору<\/a>, воспитаннику <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, которого играл <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>. Оба гоблина — из одного клана, уничтоженного дварфами.<\/p><blockquote>«Шмыгель, они из одного вот этого гоблинского клана, который был уничтожен дварфами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-4\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=717\" target=\"_blank\" rel=\"noopener\">0:11:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Откуда у дварфов взялся валун<\/b><\/div><p>Мастер пояснил, что валун всё время лежал на месте. Пробегавшие мимо дварфы оценили обстановку и подрубили под ним топорами опору, чтобы он скатился.<\/p><blockquote>«Предполагаю, что он был на месте всё это время. Они пробегали мимо, увидели его... чуть-чуть топорами подрубили под ним пространство»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa49/#qa49-7\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=1218\" target=\"_blank\" rel=\"noopener\">0:20:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-8\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Что мог готовить Шмыгель: рецепты и их эффекты<\/b><\/div><p>Продуктов в инвентаре у <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> хватало на два приготовления. Рецепты: дварфийский борщ, бодрящий шашлычок с хреном (как заклинание ускорения), мясной кисель (возвращает волшебнику два заряда магии), куриное рагу (10 минут преимущества на атаки ближнего боя и +d4 урона). Авторы ждали, что он будет жарить и трупы. По классу он был обычным плутом со скрытой атакой.<\/p><blockquote>«Мясной кисель восстанавливает волшебнику два заряда магии... куриное рагу, съевший получает на 10 минут преимущество на атаки ближнего боя»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-8\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=2356\" target=\"_blank\" rel=\"noopener\">0:39:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-9\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Арт «братского поцелуя» Шмыгеля и Дудуша прошёл пять правок<\/b><\/div><p><a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> «уравновесил» конфликт с <a class=\"ref\" href=\"/c/dudush/\">Дудушем<\/a>, приложив палец от губ Дудуша к своим. Иллюстрацию с поцелуем переделывали около пяти раз, в том числе по референсу поцелуя Брежнева и Хонеккера. В итоге показали момент уже после поцелуя.<\/p><blockquote>«он прошёл, наверное, стадии пять корректировки... в итоге мы нашли компромисс в том, чтобы показать фазу уже после произошедшего события»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-9\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=2733\" target=\"_blank\" rel=\"noopener\">0:45:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Шмыгель — мальчик<\/b><\/div><p>На вопрос о поле <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a> ответили, что он, судя по всему, мальчик.<\/p><blockquote>«Шмыгель — мальчик, судя по всему»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-10\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=2925\" target=\"_blank\" rel=\"noopener\">0:48:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-11\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Дварф-рыбак был глухим; Мираторг не заметил удочку<\/b><\/div><p>Дварф-рыбак, на которого напал <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>, был глухим. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признался, что сначала не заметил у него удочку и напал на всякий случай, потому что важнее всего была миссия.<\/p><blockquote>«Я потом только увидел, что у него была удочка... поэтому решил на всякий случай его уебать. Мною двигала важность миссии.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa49/#qa49-11\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=3623\" target=\"_blank\" rel=\"noopener\">1:00:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Мираторг взял на себя проклятие<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> перехватил проклятие Женевьевы ради своей миссии: довезти раненого дракона на лечение и немного ему услужить.<\/p><blockquote>«у нас была миссия довести на лечение дракона раненого. Я её выполнял»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa49/#qa49-12\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=3938\" target=\"_blank\" rel=\"noopener\">1:05:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa49-13\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему Гиммилут хочет власти над миром: версия о матери Драксении<\/b><\/div><p>Автор вступления к выпуску поделился своей логикой. О власти драконов над миром, возможно, мечтала мать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a> Драксения. Драконы — «живые боги земного мира»: демоны и небесные боги кормятся земным миром, а власть драконов могла бы прекратить это раздирание и объединить мир, как империя.<\/p><blockquote>«его мать мечтала о власти драконов над миром, потому что они, в сущности, живые боги земного мира»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-13\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=4187\" target=\"_blank\" rel=\"noopener\">1:09:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-14\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Драконий плащ ни на что не влияет<\/b><\/div><p>Отвечая, вернул ли гуль плащ <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a>, сказали, что на механику плащ не влияет — «это просто скин». Вернул ли его гуль, предложили решить <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>.<\/p><blockquote>«Плащ Дракости не влияет ни на что. Просто это скин.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-14\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=4630\" target=
