<script>window.EPD = {"anim": false, "key": "49", "label": "49", "title": "Раненый дракон", "date": "2026-05-24", "minutes": 116, "duration": 6982.0, "video_id": "A0uPFbi5E20", "branch": "Янус и дракон Гимелут", "branch_color": "#B8901C", "place": "Путь от вулкана Нергал через реку Азелия до Нурикфела, столицы лесных эльфов", "short_html": "Раненый в засаде кунисских дварфов и речных гномов красный дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> не может принять истинный облик из-за осколка болта у сердца, и король лесных эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> обещает вылечить его в обмен на уничтожение речных гномов. Свита дракона бежит из логова у <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a> от сотен дварфов, уходит от погони по серпантину и через реку Азелию. Потом она отбивает лошадей у цыганского табора, получив проклятие колдуньи Женевьевы, и покупает проезд у речных гномов драконьим плащом, а гномы сами рушат мост перед дварфами. В <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфеле<\/a> Гимелут заключает с Нуриком смертельно обязывающий союз перед Великим древом и ложится на операцию.", "summary_html": "Красный дракон <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a>, раненный залпом драконобоек кунисских дварфов и речных гномов (вып. 39), не может принять истинный облик: осколок гномьего болта сидит у самого сердца. Король лесных эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a> обещает вылечить его в обмен на уничтожение речных гномов. Спасаясь от сотен дварфов, осадивших логово у вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>, свита дракона уходит от погони по серпантину, переправляется через реку Азелия, обманом и резнёй отбирает лошадей у табора цыган (и получает проклятие цыганки-колдуньи Женевьевы), а у речных гномов покупает проезд драконьим плащом Гимелута. Гномы обрушивают мост, отрезая дварфов. В <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфеле<\/a> Гимелут подписывает с Нуриком смертельно обязывающий договор о стратегическом союзе перед Великим древом и ложится на операцию.", "outcome_html": "Все герои выжили; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> стал союзником лесных эльфов по смертельно обязывающему договору и лёг на операцию, но проклят цыганкой.", "world_html": ["Союз лесных эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> и красного дракона <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a> — «третья сила» в войне за земной мир", "Мост через Азелию у лагеря речных гномов разрушен", "Золото <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a> брошено у <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>, драконий плащ у речных гномов", "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> проклят цыганкой Женевьевой"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Бусти-заставка от лица <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a>."}, {"t": "0:01:45", "sec": 105, "html": "Пролог: 500 лет назад <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> захватил гномий город Гусь Пещерный и сделал его логовом; уцелевшие гномы бежали на юг, к реке Азелия, и живут грабежом. Попавшая к дракону маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> пробудила в нём жажду власти над миром; в человеческом облике с драконорождённым и тремя кунисскими дварфами он отправился за невестой, но дварфы с речными гномами устроили ему засаду; полукровка <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> предал сородичей и спас дракона."}, {"t": "0:03:31", "sec": 211, "html": "Сценка в телеге с рекламой; цель — <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>."}, {"t": "0:08:04", "sec": 484, "html": "Завязка мастера: исцелить <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a> может только эльфийская медицина; король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a> зовёт его в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>: «мы избавим вас от ваших проблем, а вы — нас от наших»."}, {"t": "0:09:51", "sec": 591, "html": "Представление героев: Гимелут (в человеческом облике зовёт себя <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостя<\/a>, выдаёт себя за богатого дворянина; нельзя превращаться — болт убьёт; обещал <a class=\"ref\" href=\"/c/korol-nurik/\">Нурику<\/a> уничтожить речных гномов, незаконно занявших его владения); <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> (драконорождённый, считает дракона роднёй и «такой же жертвой»: сам однажды ради женщины потерял лодку, женщину и лучшего друга — отсылка к вып. 32/43); <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> (всю жизнь добивался признания дварфов, в решающий момент пощадил дракона, хочет основать свой клан; дракон обещал сделать его наместником Кунисских гор; имя значит «милостивый»); <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> (сын шляпника из деревни <a class=\"ref\" href=\"/place/solevuha/\">Солевуха<\/a>, ушёл в драконий культ ради силы и стал жрецом); <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> (гоблин из дварфийской деревни Каразоновка, раб в доме Каразона, чьих сородичей-гоблинов убили дварфы; сбежал во время налёта Гимелута и предупредил его о дварфийском войске)."}, {"t": "0:19:35", "sec": 1175, "html": "Сотни дварфов подходят к <a class=\"ref\" href=\"/place/nergal/\">Нергалу<\/a>; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> магией обрушивает проходы в пещеру, свита грузит на телегу мешки золота и уходит через чёрный ход вниз по серпантину."}, {"t": "0:22:05", "sec": 1325, "html": "<a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> падает под колесо; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> вылавливает его удочкой. Дварфы сталкивают валун — <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> уводит телегу."}, {"t": "0:24:40", "sec": 1480, "html": "Погоня дварфов на горных баранах: речь <a class=\"ref\" href=\"/c/artyom/\">Артёма<\/a> «голосом культа», угли из мангала <a class=\"ref\" href=\"/c/shmygel/\">Шмыгеля<\/a>, ссора <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a> с <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелутом<\/a> («Надо было тебя добить») и «примирение» с помощью пальца в конский зад; огненные снаряды и огненный шар Гимелута поджигают дварфов; Дудуш стреляет в предводителя дварфов, тот клянётся ему смертью как предателю."}, {"t": "0:42:21", "sec": 2541, "html": "Дварфы разбивают телегу молотами. <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> натягивает леску удочки над обрывом «канатной дорогой», отряд съезжает к реке; <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> последним, выпустив ещё один огненный шар. Золото остаётся на телеге/на горе."}, {"t": "0:47:52", "sec": 2872, "html": "<a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> сталкивает в реку дварфа-рыбака и забирает лодку; отряд переправляется. Двое дварфов тонут, старый дварф ведёт остальных к мосту у лагеря речных гномов."}, {"t": "0:52:05", "sec": 3125, "html": "Лодка течёт; по дыму отряд выходит к лагерю цыган и купцов. Цыган Луваш приглашает к костру; <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> распознаёт в вине купцов «зелье веселья» — цыгане обирают одурманенных торговцев."}, {"t": "0:58:25", "sec": 3505, "html": "Цыганка мадам Женевьева уводит <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракостю<\/a>: она узнаёт в нём Гимелута, чувствует осколок и предлагает «цыганской медициной» извлечь его в кибитке; она же незаметно крадёт и возвращает маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>. Маска, надетая на лицо, оживает и ругает Гимелута за брошенное золото."}, {"t": "0:59:50", "sec": 3590, "html": "<a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> «голосом культа» просит у купцов пять лошадей; Луваш угрожает медведосовом. <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> пускает огненный салют, <a class=\"ref\" href=\"/c/dudush/\">Дудуш<\/a> показывает «танцующую белку»; <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> не может «исчезнуть»."}, {"t": "1:09:42", "sec": 4182, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> призывает двух гулей; отряд угоняет лошадей. Полурослик Брабус (выдававший себя за 10-летнего мальчика) прыгает на лошадь <a class=\"ref\" href=\"/c/dudush/\">Дудуша<\/a>; медведосов с цыганом преграждает путь и ранит Дудуша."}, {"t": "1:16:04", "sec": 4564, "html": "Бой: <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a>, съев «бодрящий шашлычок», выкалывает медведосову глаза вилками; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> сбрасывает и убивает цыгана-наездника; гули и <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> добивают медведосова (шалбан по носу)."}, {"t": "1:24:08", "sec": 5048, "html": "Женевьева растворяет табор в тумане и проклинает <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелута<\/a> за пролитую цыганскую кровь; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> пытается «поймать» проклятие на себя. <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> забирает душу цыгана в «клетку душ». Одурманенные купцы дают Гимелуту 2 золотые монеты «на операцию» и говорят, что речные гномы ненавидят драконов."}, {"t": "1:27:15", "sec": 5235, "html": "Отряд переодевается купцами; <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> ставит алтарь с символом дракона — комплименты дракону лечат свиту."}, {"t": "1:33:50", "sec": 5630, "html": "У подвесного моста через Азелию <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a> задевает ловушку (бревно с шипами), с вышек речные гномы бьют из рогаток и требуют 20 монет."}, {"t": "1:39:05", "sec": 5945, "html": "<a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелут<\/a>, вымазанный в грязи, продаёт гномам свой плащ из драконьей кожи как «плащ Гимелута, украденный у цыган»; гномы верят, что цыгане с драконом, а дварфы на подходе «тоже за дракона», и сами перерезают мост — дварфы отрезаны."}, {"t": "1:46:30", "sec": 6390, "html": "Гуль, посланный отобрать плащ, убит выстрелом. <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> лечится душой из клетки."}, {"t": "1:48:15", "sec": 6495, "html": "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>: дворец внутри Великого древа. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> требует гарантий: <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">Чаша познания смерти<\/a> показала ему, что его может убить дракон."}, {"t": "1:49:08", "sec": 6548, "html": "Договор о стратегическом партнёрстве перед Великим древом: бессрочный союз, «твой враг — мой враг», Гимелут катает <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> по его просьбе, по дополнениям — Нурик катает Гимелута (в облике <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракости<\/a>), а <a class=\"ref\" href=\"/c/shmygel/\">Шмыгель<\/a> катается на Нурике. Нарушитель умрёт по воле древа. Договор подписан."}, {"t": "1:54:20", "sec": 6860, "html": "Эльфийские целители начинают операцию. 11 монет = 110 000 руб. на благотворительность. Эпилог: дракон скоро будет здоров; в битве за земной мир появляется «третья сила»; вопросы — какую игру ведёт <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> и насколько страшно цыганское проклятие."}], "key_events": [{"t": "0:19:35", "sec": 1175}, {"t": "0:24:40", "sec": 1480}, {"t": "0:42:21", "sec": 2541}, {"t": "0:47:52", "sec": 2872}, {"t": "0:58:25", "sec": 3505}, {"t": "1:16:04", "sec": 4564}, {"t": "1:24:08", "sec": 5048}, {"t": "1:39:05", "sec": 5945}, {"t": "1:49:08", "sec": 6548}, {"t": "1:54:20", "sec": 6860}], "coins": {"ep": "49", "events": [{"t": "0:23:20", "kind": "earn", "who": "Шмыгель", "actor": "Frame Tamer", "to": null, "reason": "шутка про то, что все тянут его в телегу, «а не в макс», сразу после того как Артём спас его удочкой (спиннингом)", "result": null, "sec": 1400, "who_url": "/c/shmygel/", "reason_html": "шутка про то, что все тянут его в телегу, «а не в макс», сразу после того как <a class=\"ref\" href=\"/c/artyom/\">Артём<\/a> спас его удочкой (спиннингом)"}, {"t": "0:35:34", "kind": "earn", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "эффектные броски кубиков урона от огненного шара (числа подряд, затем все нечётные) — реплики «это монета»/«ещё монету» без явного «дайте», получатель определён по контексту (кастующий), не стопроцентно уверенно", "result": null, "sec": 2134, "who_url": "/c/drakon-gimelut/", "reason_html": "эффектные броски кубиков урона от огненного шара (числа подряд, затем все нечётные) — реплики «это монета»/«ещё монету» без явного «дайте», получатель определён по контексту (кастующий), не стопроцентно уверенно"}, {"t": "0:41:11", "kind": "spend", "who": "Шмыгель", "actor": "Frame Tamer", "to": null, "reason": "потратил монету на переброс проверки акробатики после промаха по барану-наезднику", "result": "успех — попал специями в глаза наезднику, обезвредил его на один ход", "sec": 2471, "who_url": "/c/shmygel/", "reason_html": "потратил монету на переброс проверки акробатики после промаха по барану-наезднику"}, {"t": "0:58:15", "kind": "loot", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "цыганка-гадалка пытается продать Дракосте монетку-подвеску «биткоин» — внутриигровой сувенир, не игровая монета мастера", "result": null, "sec": 3495, "who_url": "/c/drakon-gimelut/", "reason_html": "цыганка-гадалка пытается продать <a class=\"ref\" href=\"/c/drakon-gimelut/\">Дракосте<\/a> монетку-подвеску «биткоин» — внутриигровой сувенир, не игровая монета мастера"}, {"t": "1:17:49", "kind": "earn", "who": "Шмыгель", "actor": "Frame Tamer", "to": null, "reason": "за внимательность — вспомнил про бонус урона от маленького размера при атаке двумя вилками (скрытая атака по медведосову/цыгану)", "result": null, "sec": 4669, "who_url": "/c/shmygel/", "reason_html": "за внимательность — вспомнил про бонус урона от маленького размера при атаке двумя вилками (скрытая атака по медведосову/цыгану)"}, {"t": "1:26:01", "kind": "earn", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "за шутку: очарованный купец даёт «денег на операцию, чтобы стать нормальным» в ответ на просьбу дать мелочи на дорогу — выдано две золотые монеты", "result": null, "sec": 5161, "who_url": "/c/drakon-gimelut/", "reason_html": "за шутку: очарованный купец даёт «денег на операцию, чтобы стать нормальным» в ответ на просьбу дать мелочи на дорогу — выдано две золотые монеты"}, {"t": "1:35:26", "kind": "spend", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "потратил монету на переброс проверки внимательности при езде на лошади первым в колонне (бросок с помехой)", "result": "не помогло — бревно с шипами сбивает с лошади, 11 урона", "sec": 5726, "who_url": "/c/drakon-gimelut/", "reason_html": "потратил монету на переброс проверки внимательности при езде на лошади первым в колонне (бросок с помехой)"}, {"t": "1:41:57", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "торг о цене плаща из драконьей кожи и прочего товара с речными гномами (20-100 игровых монет) — внутриигровые деньги, не мастерская монета", "result": null, "sec": 6117, "who_url": null, "reason_html": "торг о цене плаща из драконьей кожи и прочего товара с речными гномами (20-100 игровых монет) — внутриигровые деньги, не мастерская монета"}, {"t": "1:43:44", "kind": "spend", "who": "Дракостя", "actor": "Гудков", "to": null, "reason": "потратил монету на переброс проверки убеждения (харизма, с преимуществом), чтобы гномы пропустили караван", "result": "критический успех — гномы пропускают группу", "sec": 6224, "who_url": "/c/drakon-gimelut/", "reason_html": "потратил монету на переброс проверки убеждения (харизма, с преимуществом), чтобы гномы пропустили караван"}, {"t": "1:54:57", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальный подсчёт монет за выпуск для благотворительности (каждая монета = 10 000 руб.); итоговое число определяют дополнительным броском кубиков Гудков и Шевчук", "result": "11 монет", "sec": 6897, "who_url": null, "reason_html": "финальный подсчёт монет за выпуск для благотворительности (каждая монета = 10 000 руб.); итоговое число определяют дополнительным броском кубиков <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> и <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Шевчук<\/a>"}], "totals": [{"who": "Шмыгель", "actor": "Frame Tamer", "earned": 2, "spent": 1, "img": null, "who_url": "/c/shmygel/", "actor_url": "/p/frame-tamer/"}, {"who": "Дракостя", "actor": "Гудков", "earned": 3, "spent": 2, "img": "img/chars/drakostya.webp", "who_url": "/c/drakon-gimelut/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Большая часть монет в этом выпуске уходит Шмыгелю (Frame Tamer) и Дракосте (Гудков); Артём, Мираторг и Дудуш явных индивидуальных монет не получали и не тратили. В конце выпуска ведущие объявляют итоговую благотворительную сумму — 11 золотых монет за весь эпизод (10 000 руб. за монету), что не полностью сходится с суммой явных «дайте/заберите»-реплик в расшифровке. Отдельно встречаются внутриигровые деньги (loot): монетка-сувенир у гадалки и торг о цене товаров/плаща с гномами — они не относятся к мастерской игровой механике монет."}, "cast": [{"name": "Гимелут", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "красный дракон в человеческом облике", "role": "", "fate": "выжил, лёг на операцию, проклят", "id": "Гимелут", "url": "/c/drakon-gimelut/", "img": "img/chars/drakostya.webp", "other": [{"key": "39", "label": "39", "title": "Кунисская пленница"}]}, {"name": "Мираторг", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "драконорождённый, боец ближнего боя", "role": "", "fate": "выжил", "id": "Мираторг", "url": "/c/miratorg/", "img": "img/chars/miratorg.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}]}, {"name": "Дудуш", "actor": "Турал Натурал", "actor_url": "/p/tural-natural/", "race": "полукровка дварфа и гномки, плут", "role": "", "fate": "выжил, ранен", "id": "Дудуш", "url": "/c/dudush/", "img": "img/chars/dudush.webp", "other": [{"key": "39", "label": "39", "title": "Кунисская пленница"}]}, {"name": "Артём", "actor": "Никита Шевчук", "actor_url": "/p/nikita-shevchuk/", "race": "человек, жрец драконьего культа", "role": "", "fate": "выжил", "id": "Артём", "url": "/c/artyom/", "img": null, "other": []}, {"name": "Шмыгель", "actor": "Frame Tamer", "actor_url": "/p/frame-tamer/", "race": "гоблин, повар", "role": "", "fate": "выжил", "id": "Шмыгель", "url": "/c/shmygel/", "img": null, "other": []}], "npcs": [{"name": "Маска Януса", "actor": "", "actor_url": null, "race": "", "role": "говорящий артефакт, пробудивший в драконе жажду власти", "fate": "у Гимелута", "id": null, "url": null, "img": null, "other": []}, {"name": "Нурик Луноликий", "actor": "", "actor_url": null, "race": "", "role": "король лесных эльфов", "fate": "выжил, союзник дракона", "id": "Нурик", "url": "/c/korol-nurik/", "img": "img/chars/nurik-lunolikij.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}]}, {"name": "Мадам Женевьева", "actor": "", "actor_url": null, "race": "", "role": "цыганка-колдунья", "fate": "исчезла, прокляв Гимелута", "id": null, "url": null, "img": null, "other": []}, {"name": "Луваш", "actor": "", "actor_url": null, "race": "", "role": "цыган с гитарой, глава табора", "fate": "исчез", "id": null, "url": null, "img": null, "other": []}, {"name": "Брабус", "actor": "", "actor_url": null, "race": "", "role": "старый полурослик под видом мальчика", "fate": "ранен, исчез", "id": null, "url": null, "img": null, "other": []}, {"name": "Медведосов", "actor": "", "actor_url": null, "race": "", "role": "боевой зверь табора", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Цыган-наездник медведосова", "actor": "", "actor_url": null, "race": "", "role": "член табора", "fate": "погиб", "id": null, "url": null, "img": n
