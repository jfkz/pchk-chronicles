<script>window.EPD = {"anim": false, "key": "42", "label": "42", "title": "Чудная Долина", "date": "2025-09-28", "minutes": 125, "duration": 7523.0, "video_id": "svnG2c_HvK8", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Чудная Долина — бывшее место пиров богов: лагерь искателей, озеро Аземпик, хижина Бывалого, роща золотой ванны", "short_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> ведёт отряд в Чудную Долину за золотой ванной, которая вернёт молодость <a class=\"ref\" href=\"/c/melissa/\">Мелиссе<\/a>.", "summary_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> узнала, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — это падший бог Брэндон, сын <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, и хочет остановить нашествие демонов, воссоединив его с возлюбленной, полурослицей <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>. Мелиссу она уже расколдовала из злобной карги, но та стала старухой, и отряд идёт в Чудную Долину — бывшее место пиров богов, полное аномалий, — искать золотую ванну, которая возвращает молодость. По дороге герои раздобывают деньги и ответы на загадки тролля, освобождают искателя Бывалого, место которого занял злой двойник из проклятого озера, и находят ванну <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. Но в ванну может войти только тот, у кого нет тёмных мыслей, а измученная Мелисса признаётся, что желает гибели миру и мучений Гелиосу. После покаянных речей и подарков Мелисса входит в ванну и выходит оттуда молодой — план Талалы продвинулся.", "outcome_html": "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> омоложена и, по-видимому, избавлена от тёмных мыслей; отряд цел. Скрижаль, связь с <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>, утоплена в ванне.", "world_html": ["Раскрыто: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, сын <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — бабушка <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, значит Эрик и <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — потомки бога", "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> омоложена, план «спасти мир любовью» продвинулся", "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> и небеса узнали о расколдовании <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и против плана <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>", "Скрижаль <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> утоплена в золотой ванне"], "scenes": [{"t": "0:01:08", "sec": 68, "html": "Пролог: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> побывала в небесном мире и узнала, что богам выгодны невзгоды смертных (больше молитв). Она получила меч бога солнца и скрижаль Брэндона — сына <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, падшего бога, ставшего <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>; нашла его возлюбленную <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a> в деревне <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a> и сняла с неё проклятие."}, {"t": "0:03:01", "sec": 181, "html": "Сценка: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> узнаёт о гонке джина <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джиги<\/a> (связь с вып. 41), но летать на грифоне по правилам нельзя."}, {"t": "0:09:36", "sec": 576, "html": "Предыстория: полвека назад Брэндон отрёкся от небес ради полурослицы <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>, они ждали ребёнка; <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> испепелил сына и заточил его дух в аду, Мелиссе стёр память и превратил её в кровожадную каргу. Жажда мести сделала Брэндона <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>."}, {"t": "0:10:41", "sec": 641, "html": "Голосовое сообщение на скрижали от <a class=\"ref\" href=\"/c/santa-tinderman/\">Санты Тиндермана<\/a> (помогал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> на небесах, наказан — теперь уборщик): <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> получила уведомление о расколдовании <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>; ей невыгодно, чтобы Талала остановила Тёмного Властелина, — надо торопиться."}, {"t": "0:12:07", "sec": 727, "html": "–[0:19:04] Задача: найти в Чудной Долине золотую ванну и омолодить <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>. Представление героев; <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> рассказывает, что муж её дочери <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> — полурослик <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> — потомок бога: Мелисса его бабушка, а дед — <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>."}, {"t": "0:19:10", "sec": 1150, "html": "Лагерь искателей у входа в долину. Торговец Киса утверждает, что ванна — миф, дорогу к ней знал только пропавший искатель Бывалый. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> меняет перо на артефакт и крадёт ещё два: бесконечную сумку с сумками, жезл чихания, свистульку-дельфина."}, {"t": "0:23:46", "sec": 1426, "html": "Золотой компас («коснись и познаешь свой путь») — шутка Гермеса: у <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> руки и ноги меняются местами. Выясняется, что в долине нельзя ругаться (каждое ругательство вызывает аномалию: колокольный звон, красный туман, раскрывающий старые раны) и летать."}, {"t": "0:29:54", "sec": 1794, "html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> вырывает зуб у приставшего к ней искателя по прозвищу Задира; <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> убеждает шерифа, что фея «несовершеннолетняя», и Задиру сажают в выгребную яму."}, {"t": "0:36:00", "sec": 2160, "html": "Доска объявлений: мешок мака с макового поля (Задира платит золотой), ответы на вопросы тролля у ручья (у Кисы), экспедиция за ожерельем на озеро Аземпик, история про ванну у «Странного Марка»."}, {"t": "0:38:24", "sec": 2304, "html": "Мелкое желание <a class=\"ref\" href=\"/c/milfeya/\">Милфеи<\/a> с нескольких попыток создаёт три мешка мака. Меч <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> опознаёт компас как артефакт Гермеса; Талала снимает проклятие с <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> мечом. Мелисса обижена: её используют как вещь."}, {"t": "0:47:37", "sec": 2857, "html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> флиртует с шерифом: Бывалый живёт в хижине за озером Аземпик, мост стережёт тролль; шериф подсказывает ответ «груша» и зовёт на ужин с судаком. Невидимый слуга <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> приносит из палатки Задиры волынку невидимости. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, отказавшись от кражи у шерифа, получает монету."}, {"t": "0:52:53", "sec": 3173, "html": "Задира, напуганный <a class=\"ref\" href=\"/c/milfeya/\">Милфеей<\/a> и прижатый шерифом, платит за три мешка мака три золотых. Киса продаёт ответы («ракушка, груша, четыре») и обещает 5 золотых за ожерелье."}, {"t": "1:05:22", "sec": 3922, "html": "Тролль Гродя у моста: ответы верны. Герои «сдают» троллю Кису и Марка, продававших его ответы, и находят пять зубов в его объедках (ещё монета)."}, {"t": "1:13:00", "sec": 4380, "html": "Озеро Аземпик: рог <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутериона<\/a> призывает выдру; ожерелье лежит на дне, трогать божественные вещи нельзя. <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> в отчаянии бросается в озеро; Бульбутерион спасает её и лжёт, что любит. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> взмахом крыльев раздвигает озеро до самой хижины; <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> несёт Мелиссу с сумкой на голове (чтобы не смотрела в воду)."}, {"t": "1:23:02", "sec": 4982, "html": "<a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> видит на дне призрак толстого рыжего мужчины, шепчущего «спаси»; хватает ожерелье — и оно приковывает его ко дну."}, {"t": "1:24:30", "sec": 5070, "html": "Хижина: «Бывалый» — идеальный рыжий красавец — обещает рассказать о ванне за голову единорога с макового поля. Рука у него холодная, как озеро. Невидимая <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> проникает в дом, соблазнением проверяет его и обнаруживает зло."}, {"t": "1:36:30", "sec": 5790, "html": "Существо ранит <a class=\"ref\" href=\"/c/milfeya/\">Милфею<\/a>; <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> застревает в двери, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> через окно бьёт лучом меча, <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a>-паучиха опутывает его паутиной. Касание меча снимает проклятие — двойник превращается в поток воды и утекает в озеро; из озера выходит настоящий Бывалый, толстый и рыжий: когда-то, засмотревшись в озеро на свою идеальную копию, он был утянут в воду."}, {"t": "1:47:02", "sec": 6422, "html": "<a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> свистком призывает дельфина, тот берёт проклятие ожерелья на себя, и русал отсылает его, а свисток закапывает, как обещал."}, {"t": "1:49:53", "sec": 6593, "html": "Бывалый ведёт в рощу к иллюзорной скале — пройти могут лишь божественные существа. Герои мажутся прахом <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и проходят к мраморному алькову с золотой ванной <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> со святой водой. Но войти в неё может лишь существо без тёмных мыслей."}, {"t": "1:53:35", "sec": 6815, "html": "Монолог <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>: боги убили её ребёнка и возлюбленного, превратили её в каргу, пожиравшую нерождённых детей, и герои обращались с ней так же, как с вещью. Она бесконечно любит <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и считает его правым: мир должен быть уничтожен, а <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> — долго мучиться."}, {"t": "1:55:14", "sec": 6914, "html": "Покаяние: <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> дарит перо, <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> — кокосовое масло, <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> — жемчужину дружбы (передаётся изо рта в рот), <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> — свою таксу по кличке Собака, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — скрижаль (чтобы <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> могла дозвониться до <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>) и остатки праха <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>."}, {"t": "2:01:33", "sec": 7293, "html": "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> спрашивает: «Правда ли, что от моей жизни зависит судьба всей земли?» — входит в ванну с таксой и топит скрижаль. Проверка с песней <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> проходит."}, {"t": "2:03:35", "sec": 7415, "html": "Из-за завесы выходит молодая красивая девушка с собакой — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> омоложена. Эпилог: удастся ли <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> её план и какая судьба ждёт Мелиссу?"}], "key_events": [{"t": "0:10:41", "sec": 641}, {"t": "0:18:17", "sec": 1097}, {"t": "0:23:46", "sec": 1426}, {"t": "1:05:22", "sec": 3922}, {"t": "1:15:17", "sec": 4517}, {"t": "1:36:30", "sec": 5790}, {"t": "1:49:53", "sec": 6593}, {"t": "1:53:35", "sec": 6815}, {"t": "2:01:33", "sec": 7293}, {"t": "2:03:35", "sec": 7415}], "coins": {"ep": "42", "events": [{"t": "0:51:36", "kind": "earn", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "хороший отыгрыш — напомнил, что кража (обыск шерифа слугой) портит отношения с божественным мечом", "result": null, "sec": 3096, "who_url": "/c/grifon-andrey/", "reason_html": "хороший отыгрыш — напомнил, что кража (обыск шерифа слугой) портит отношения с божественным мечом"}, {"t": "0:58:02", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "задира расплатился тремя золотыми монетами за три мешка мака по итогам переговоров", "result": null, "sec": 3482, "who_url": null, "reason_html": "задира расплатился тремя золотыми монетами за три мешка мака по итогам переговоров"}, {"t": "1:01:09", "kind": "loot", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "купил у торговки Кисы шпаргалку с ответами на загадки тролля, сторговавшись до одной монеты", "result": null, "sec": 3669, "who_url": "/c/grifon-andrey/", "reason_html": "купил у торговки Кисы шпаргалку с ответами на загадки тролля, сторговавшись до одной монеты"}, {"t": "1:12:20", "kind": "earn", "who": "Милфея", "actor": "Александра Бортич", "to": null, "reason": "нашла пять зубов тролля и превратила их в золотую монету — её фирменная способность", "result": null, "sec": 4340, "who_url": "/c/milfeya/", "reason_html": "нашла пять зубов тролля и превратила их в золотую монету — её фирменная способность"}, {"t": "1:22:47", "kind": "spend", "who": "Бульбутерион", "actor": "Слава Копейкин", "to": null, "reason": "переброс проверки Внимательности с преимуществом, чтобы разглядеть ожерелье на дне озера", "result": "успех (19) — заметил призрачный силуэт и светящееся ожерелье", "sec": 4967, "who_url": "/c/bulbatarion/", "reason_html": "переброс проверки Внимательности с преимуществом, чтобы разглядеть ожерелье на дне озера"}, {"t": "1:23:49", "kind": "spend", "who": "Бульбутерион", "actor": "Слава Копейкин", "to": null, "reason": "переброс проверки Мудрости при попытке схватить ожерелье рукой", "result": "критическая неудача — ожерелье обмотало запястье и приковало ко дну", "sec": 5029, "who_url": "/c/bulbatarion/", "reason_html": "переброс проверки Мудрости при попытке схватить ожерелье рукой"}, {"t": "1:26:32", "kind": "other", "who": null, "actor": null, "to": null, "reason": "монета за шутливую отсылку к мему («Аманда, Линда и Роуз») во время розыгрыша сестёр милосердия", "result": null, "sec": 5192, "who_url": null, "reason_html": "монета за шутливую отсылку к мему («Аманда, Линда и Роуз») во время розыгрыша сестёр милосердия"}, {"t": "1:37:47", "kind": "spend", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "переброс критического провала мультиатаки когтями и клювом по гигантской паучихе", "result": "даже после переброса персонаж застрял в дверном проёме", "sec": 5867, "who_url": "/c/grifon-andrey/", "reason_html": "переброс критического провала мультиатаки когтями и клювом по гигантской паучихе"}, {"t": "1:44:44", "kind": "earn", "who": "Милфея", "actor": "Александра Бортич", "to": null, "reason": "догадалась, что спасённый «бывалый» в озере на самом деле иллюзия/водная тварь", "result": null, "sec": 6284, "who_url": "/c/milfeya/", "reason_html": "догадалась, что спасённый «бывалый» в озере на самом деле иллюзия/водная тварь"}], "totals": [{"who": "Грифон Андрей", "actor": "BRB", "earned": 1, "spent": 1, "img": "img/chars/andrej.webp", "who_url": "/c/grifon-andrey/", "actor_url": "/p/brb/"}, {"who": "Милфея", "actor": "Александра Бортич", "earned": 2, "spent": 0, "img": "img/chars/milfeya.webp", "who_url": "/c/milfeya/", "actor_url": "/p/aleksandra-bortich/"}, {"who": "Бульбутерион", "actor": "Слава Копейкин", "earned": 0, "spent": 2, "img": "img/chars/bul-buterion.webp", "who_url": "/c/bulbatarion/", "actor_url": "/p/slava-kopeykin/"}], "notes": "Несколько монет — внутриигровые деньги (оплата мака, покупка ответов у Кисы), отмечены как loot и не входят в totals. Одна монета выдана за мем-шутку без ясного получателя-персонажа (kind other). Финальный подсчёт монет на конец выпуска (130 000 руб) — общий бросок, не привязан к конкретному персонажу."}, "cast": [{"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, воин света", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {" l, "race": "", "role": "полурослица, возлюбленная Брэндона, бабушка Эрика Пэнисова", "fate": "омоложена в золотой ванне", "id": "Мелисса", "url": "/c/melissa/", "img": null, "other": [{"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Бывалый", "actor": "", "actor_url": null, "race": "", "role": "искатель, знавший путь к ванне", "fate": "освобождён из озера, выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Двойник Бывалого", "actor": "", "actor_url": null, "race": "", "role": "злое существо из озера Аземпик", "fate": "проклятие снято, ушёл водой в озеро", "id": null, "url": null, "img": null, "other": []}, {"name": "Санта Тиндерман", "actor": "", "actor_url": null, "race": "", "role": "помощник Талалы на небесах, разжалован в уборщики", "fate": "неизвестно", "id": "Санта Тиндерман", "url": "/c/santa-tinderman/", "img": null, "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}]}, {"name": "Венера", "actor": "", "actor_url": null, "race": "", "role": "богиня, против плана Талалы", "fate": "неизвестно", "id": "Венера", "url": "/c/venera/", "img": "img/chars/venera.webp", "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Киса", "actor": "", "actor_url": null, "race": "", "role": "торговец артефактами и ответами тролля", "fate": "сбежал", "id": null, "url": null, "img": null, "other": []}, {"name": "Странный Марк", "actor": "", "actor_url": null, "race": "", "role": "торговец историями, подельник Кисы", "fate": "сбежал", "id": null, "url": null, "img": null, "other": []}, {"name": "Задира", "actor": "", "actor_url": null, "race": "", "role": "искатель, скупщик мака", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Шериф", "actor": "", "actor_url": null, "race": "", "role": "шериф лагеря искателей", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Тролль Гродя", "actor": "", "actor_url": null, "race": "", "role": "стражник моста", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Дельфин", "actor": "", "actor_url": null, "race": "", "role": "вызываемый свистулькой", "fate": "взял на себя проклятие ожерелья", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "13", "label": "13", "title": "Проклятые роды", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> и <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> — теперь известно, что Эрик потомок бога", "dir": "out", "color": "#2F84C8"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "Младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — правнук <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "22", "label": "22", "title": "Отряд Солнца", "note_html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> в небесном мире", "dir": "out", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> и <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a>, остров Соблазна", "dir": "out", "color": "#7C5CD6"}, {"key": "38", "label": "38", "title": "Возлюбленная", "note_html": "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> найдена в Лысой Пади и расколдована", "dir": "out", "color": "#7C5CD6"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Упомянута гонка джина <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джиги<\/a> за желание", "dir": "out", "color": "#C8423B"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши", "note_html": "<a class=\"ref\" href=\"/place/chudnaya-dolina/\">Чудная Долина<\/a>, где <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> видел богов; дар Лёши видеть будущее и прошлые жизни", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Богам выгодны невзгоды смертных, ведь это увеличивает количество молитв» — пролог.", "«Со старухами мутят только алчные до денег или извращенцы. Или Прохор» — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>.", "«Вы постоянно относились ко мне как к вещи. И боги делали то же самое» — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a>.", "«Я люблю его бесконечно, потому что он абсолютно прав. Он должен уничтожить весь этот мир» — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> о <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоне<\/a>.", "«Это ведь правда, что от моей жизни зависит судьба всей земли?» — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> перед ванной."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/chudnaya-dolina/\">Чудная Долина<\/a> (бывшее место пиров богов; аномалии, нельзя ругаться и летать); лагерь искателей; маковое поле (мак пугает съевшего; пасётся единорог); озеро Аземпик (проклятое — затягивает смотрящего); мост тролля; хижина Бывалого; роща с иллюзорной завесой и альковом золотой ванны. Упомянуты: <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a>, остров Соблазна, <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>, небесный мир.<\/li>\n<li>Фракции: небесные боги (<a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, Гермес, <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a>); искатели Чудной Долины; женская школа духовных практик «Космическая воронка».<\/li>\n<li>Артефакты: разумный меч Кары <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> (снятие проклятий, луч света); скрижаль <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> (утоплена <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> в ванне); прах Брэндона; золотая ванна <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>; компас Гермеса; бесконечная сумка с сумками; жезл чихания; свистулька-дельфин (закопана на дне озера); волынка невидимости; ожерелье Ван Клиф на дне озера (проклятое); жемчужина дружбы.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>29<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>29<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>5<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>15<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>2<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa41-42-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Первый блок выпуска 42 снимали три часа<\/b><\/div><p>Первая сцена в лагере искателей, где больше всего галдежа, в выпуске длится около часа, а на съёмке шла примерно три часа.<\/p><blockquote>«Он длится примерно в выпуске где-то примерно час. В реальности, в моторе, он длился примерно 3 часа.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-1\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=359\" target=\"_blank\" rel=\"noopener\">0:05:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Нападки на мастера чистили в монтаже; ругань Усачева вырезали<\/b><\/div><p>Авторы рассказали, что в первом выпуске с <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a> многое вычистили, зная, как зрители относятся к нападкам на мастера; поэтому мастер и сидит в рубке, вдали от стола. В выпуске 42 ничего не вырезали — атмосфера была дружеской. А в выпуске с <a class=\"ref\" href=\"/p/ruslan-usachev/\">Русланом Усачевым<\/a> тот всерьёз посылал Бреганова, и это пришлось вырезать.<\/p><blockquote>«Это не выпуск с Русланом Усачевым, где он посылал Бреганова, и это всё пришлось вырезать в итоге из выпуска.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-2\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=781\" target=\"_blank\" rel=\"noopener\">0:13:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-3\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Запрет входить в ванну с тёмными мыслями был задуман заранее<\/b><\/div><p>На вопрос <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a>, не придумал ли мастер в конце правило, что в золотую ванну нельзя войти с тёмными мыслями, чтобы пристыдить игроков, Бреганов ответил, что оно было изначально.<\/p><blockquote>«Эта механика, что нельзя в ванну с тёмными мыслями, это ты в конце придумал, чтобы нас пристыдить, или оно изначально было? — Изначально.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa41-42/#qa41-42-3\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=1341\" target=\"_blank\" rel=\"noopener\">0:22:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-4\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Драму Мелиссы усилили в монтаже<\/b><\/div><p>Авторы объяснили, что игроки не знали, насколько трагична история <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>. Уже в монтаже её решили усилить: в начало добавили песню о её горе, чтобы зритель заранее сочувствовал. В итоге выпуск сложился как история героев, которые плохо обращаются с бабушкой, а в конце искупают вину.<\/p><blockquote>«Я думаю, а усилить бы… сделать сразу для зрителя затравку, что у неё драма в жизни… А вы даже не знаете об этом.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-4\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=1688\" target=\"_blank\" rel=\"noopener\">0:28:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Финальное убеждение Мелиссы: сложность 20, шанс около 70%<\/b><\/div><p>Зрители сочли финальный бросок слишком лёгким. Мастер ответил, что сложность 20 высокая, но <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> бросала с преимуществом (коллективное убеждение), с харизмой +5 и вдохновением; по подсчёту на калькуляторе шанс успеха был около 70%, а с монетами — около 90%. Эти ресурсы игроки заработали своими действиями за столом.<\/p><blockquote>«Мы даже вроде бы как посчитали отдельно калькулятором. Процент успеха был 70.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-5\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=1814\" target=\"_blank\" rel=\"noopener\">0:30:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa41-42-7\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранные части Чудной Долины<\/b><\/div><p>Герои не дошли до макового поля и не поговорили с единорогом. Озеро удалось пересечь по дну благодаря критическому успеху грифона, раздвинувшего воду; в обход их ждали бы аномалии и звери.<\/p><blockquote>«Если бы вы пошли в обход, там должны были аномалии, аномалии, аномалии… Животные там.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-7\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=2187\" target=\"_blank\" rel=\"noopener\">0:36:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa41-42-8\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Ошибка художника: Милфея рвёт нижний зуб щипцами для верхних<\/b><\/div><p>Авторы отметили смешную претензию зрителей к художникам: на иллюстрации <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> вырывает нижний зуб щипцами, предназначенными для верхних зубов.<\/p><blockquote>«Милфея дерёт нижний зуб щипцами для верхних зубов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-8\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=2338\" target=\"_blank\" rel=\"noopener\">0:38:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-9\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Талала вспыльчива<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> объяснил вспыльчивость и грубость <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> тем, что на неё, назначенную богом воином света, возложили огромную ответственность, с которой она не справляется. При этом гномы в ПЧК вообще с «червоточинкой», а не светлые паладины.<\/p><blockquote>«Это высокая ответственность, на неё возложили огромную ответственность, и она с этим справиться не может.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa41-42/#qa41-42-9\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=2888\" target=\"_blank\" rel=\"noopener\">0:48:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-10\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Характер и мотивация грифона Андрея<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признал, что мотивация <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> у него самая непроработанная. Грифон считает себя божественным созданием, хотя на деле он зверь (божественен единорог). Он помогал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> в небесной канцелярии и спустился с ней на землю по приказу <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> как скакун воина света. Сначала служба ему не нравилась, но, видя, что у Талалы, пусть и криво, всё получается, он к ней привязался. По мнению BRB, Андрей должен смотреть на земных свысока и нести «сексистские» порядки Гелиоса, которому служил.<\/p><blockquote>«Грифон считает себя божеством, божественным созданием. Хотя на самом деле он просто, ну, зверь.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa41-42/#qa41-42-10\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3171\" target=\"_blank\" rel=\"noopener\">0:52:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем двойнику Бывалого был нужен рог единорога<\/b><\/div><p>Двойник Бывалого — существо из озера вроде доппельгангера — привязан к долине. Единорог умеет телепортироваться, и с его рогом двойник смог бы покинуть это место и навсегда жить жизнью Бывалого. Убедить героев убить единорога было бы трудно; если бы они это сделали, всё кончилось бы плохо и ванны им было бы не видать.<\/p><blockquote>«Единорог обладает способностью телепортации. И за счёт этого рога… он монстр, привязан к этому месту.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-11\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3421\" target=\"_blank\" rel=\"noopener\">0:57:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa41-42-12\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Если бы все посмотрели в озеро<\/b><\/div><p>Мастер не зря много раз спрашивал, кто смотрит в озеро. Если бы в него посмотрели все герои, из воды вылезли бы их «лучшие версии» и случилась бы битва пять на пять; например, двойник мог бы захватить грифона и сражаться против отряда с его характеристиками. Так и случилось с Бывалым: его лучшая версия заковала его в озере и стала жить вместо него.<\/p><blockquote>«Все эти версии вылезли бы из озера, и у вас бы была битва 5 на 5.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-12\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3550\" target=\"_blank\" rel=\"noopener\">0:59:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-13\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Омолодить Мелиссу посоветовал Купидон<\/b><\/div><p>На упрёк в эйджизме авторы ответили, что идея омоложения исходила от <a class=\"ref\" href=\"/c/kupidon/\">Купидона<\/a> (<a class=\"ref\" href=\"/c/santa-tinderman/\">Санта Тиндерман<\/a>): увидев на скрижали уведомление о расколдовании <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>, он прислал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> голосовое сообщение. Мысль, что любят только молодых, — мировоззрение самого Купидона, а не авторов: так, по его мнению, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> скорее узнает возлюбленную. Без омоложения и очищения ванна бы Мелиссу не приняла: её душа была заражена местью.<\/p><blockquote>«Кто вообще сказал Талале о том, что её нужно омолодить? Это был персонаж Купидон, который записал голосовое сообщение»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-13\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=3817\" target=\"_blank\" rel=\"noopener\">1:03:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa41-42-14\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Если привести Брэндону неомоложенную Мелиссу<\/b><\/div><p>Авторы и игроки обсуждали, что было бы, если бы старую <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a> привели к Брэндону. Например, если бы герои убили единорога и лишились ванны, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> или грифон могли бы сказать ей, что она понравится и такой. А услышав, как над ней издевались, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> мог бы только укрепиться во мнении, что силы света неправы.<\/p><blockquote>«Ебать, как издевались над моей любимой… Ещё больше поймёт, что силы света не правы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-14\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4004\" target=\"_blank\" rel=\"noopener\">1:06:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-15\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как Мелисса родила сына<\/b><\/div><p>Строчка песни «но наше чадо я не чувствую внутри» описывает состояние <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>, запертой в облике карги: 50 лет она прокручивала прошлое и не знала, что стало с ребёнком. Проклятие мечом <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> превращало её в каргу постепенно, и она успела родить, но этого не помнит; домовёнок Кузя сберёг ребёнка и отдал его цыганам. Песню спела Марина Полна Любви, а Мелиссу сыграла Аня Жерницкая.<\/p><blockquote>«Она потихонечку превращалась в неё. Она сумела родить. Вот. Но это она этого даже не помнит.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-15\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4004\" target=\"_blank\" rel=\"noopener\">1:06:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-16\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Женуария съела сына Мелиссы — Канделакиса<\/b><\/div><p>Авторы отметили находку зрителей: сын <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a> (его играл <a class=\"ref\" href=\"/p/vladimir-markoni/\">Владимир Маркони<\/a>) в выпуске 7 был съеден той же <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарией<\/a>, когда она в облике паучихи ещё была людоедкой. Мелисса об этом не знает, но когда-нибудь может узнать.<\/p><blockquote>«Сын Канделакис, которого играл Вова Маркони, был в седьмом приключении съеден как раз-таки этой же самой Женуарией… будучи в образе паучихи»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-16\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4221\" target=\"_blank\" rel=\"noopener\">1:10:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-17\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ванна омолодила только тело Мелиссы<\/b><\/div><p>Омоложение коснулось лишь тела: воспоминания и опыт <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>, включая то, как она в облике карги похищала и ела детей, остались, и она, скорее всего, чувствует себя старой женщиной.<\/p><blockquote>«Я думаю, что она чувствует себя старой женщиной.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-17\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4283\" target=\"_blank\" rel=\"noopener\">1:11:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa41-42-18\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Штрафы-аномалии за мат потерялись по ходу игры<\/b><\/div><p>Аномалии за ругательства сработали три раза, а потом пропали. Мастер признал, что их, вероятно, пропускали: игроки матерились и в игре, и вне её, отслеживать это было трудно, а останавливать игру на каждом мате не хотелось.<\/p><blockquote>«Возможно, мы где-то пропустили, потому что за кадром также находятся живые люди»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-18\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4283\" target=\"_blank\" rel=\"noopener\">1:11:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-19\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как работает озеро Аземпик и почему в него бросилась Мелисса<\/b><\/div><p>Кто бы ни посмотрел в озеро Аземпик, видит двойника, который нападает, затаскивает его в воду и живёт его жизнью снаружи. <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> же в озеро не смотрела: она сама хотела покончить с собой и сделала бы это где угодно, например бросилась бы с горы, — озеро подвернулось случайно. Авторы признали это возможным сюжетным упущением.<\/p><blockquote>«Это не озеро её затянуло, она сделала это самовольно. Здесь, возможно, наше какое-то сюжетное упущение»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-19\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4411\" target=\"_blank\" rel=\"noopener\">1:13:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-20\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ожерелье Ван Клиф — артефакт прорицания и ловушка<\/b><\/div><p>Ожерелье Ван Клиф на дне озера — один из немногих ценных артефактов долины, предмет школы прорицания, помогающий предсказывать будущее. Одновременно это ловушка: оно обвивает руку и держит в озере; освободиться можно спасброском мудрости сложности 18, но <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> выбросил единицу. Ожерелье не связано с зеркальной ловушкой самого озера.<\/p><blockquote>«Это артефакт там прорицания, школы прорицания… Но это одновременно и ловушка.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-20\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4532\" target=\"_blank\" rel=\"noopener\">1:15:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-21\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Чудная Долина и происхождение богов<\/b><\/div><p>Боги долго пировали и отдыхали в долине, иногда приглашая избранных смертных. По лору ПЧК сами боги когда-то были людьми на земле, которые «прокачались» и набрали могущество. Окружённое горами плато усыпано артефактами и постоянными магическими эффектами, смешавшимися между собой (где-то время течёт медленнее, где-то быстрее) — отсылка к «Пикнику на обочине» и «Сталкеру». Большинство артефактов — божественная «шелуха», но за пределами долины они дорожают.<\/p><blockquote>«Боги же они всё равно все пошли с земли… Это люди, которые были на земле. И потом они поднялись за счёт того, что, грубо говоря, прокачивались»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-21\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4594\" target=\"_blank\" rel=\"noopener\">1:16:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-22\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Райские ели растут в Чудной Долине<\/b><\/div><p>Райские ели, упоминавшиеся в выпуске 15 и в «Добровольцах» (вып. 37) как оружие божественного света против демонов, добывают в Чудной Долине; за ними туда спускаются, спрос на них большой, и тот, кто владеет этим ресурсом, может склонить чашу весов в войне. Ели должны были стоять на фоне по пути к ванне, но общий план вырезали. Новогодние ёлки — это другое. Авторы допустили, что тема долины не раскрыта и в неё можно вернуться, в том числе в ПЧК Онлайн.<\/p><blockquote>«Так вот, как раз эти райские ели добываются в этой Чудной Долине… и спрос на них сейчас очень большой.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-22\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4795\" target=\"_blank\" rel=\"noopener\">1:19:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-23\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как Бывалый нашёл ванну<\/b><\/div><p>Бывалый подсмотрел за иллюзорную завесу, когда туда входила купаться <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>; возможно, она сама хотела, чтобы её видели (как в мифе об Актеоне). Найти ванну без Бывалого было можно, но сильно сложнее — например, расследованием; единорог знал дорогу, но по доброй воле не сказал бы.<\/p><blockquote>«Можно ли было найти ванну без Бывалого? Думаю, да… но это было бы сложнее сильно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-23\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4922\" target=\"_blank\" rel=\"noopener\">1:22:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-24\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Женуария не искупалась в ванне<\/b><\/div><p><a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a> рассказала, что изначально целью похода <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> было искупаться в ванне, но из-за истории с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> она о ней забыла, а потом возвращаться было неудобно — вместо неё в ванну пошла собака. Остальные добавили, что ванна, скорее всего, расплавила бы её из-за грязных помыслов.<\/p><blockquote>«Вообще изначально цель её похода была искупаться в этой ванне… Вот вместо меня пошла собака туда.»<\/blockquote><p class=\"note\">Варнава · <a href=\"/pod/qa41-42/#qa41-42-24\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5037\" target=\"_blank\" rel=\"noopener\">1:23:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Женуария и Мелисса — родня, но соперницы<\/b><\/div><p>По словам <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнавы<\/a>, <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> хоть и одна семья, но не близки: между ними есть соперничество и недоверие, отсюда грубость Женуарии. Поэтому она и не упомянула в извинениях, что <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — их общий потомок, хотя это есть в её карточке.<\/p><blockquote>«Женуария и Мелисса, они вроде как общаются, но они на самом деле не сильно близкие… у них есть даже какой-то некий момент конкуренции.»<\/blockquote><p class=\"note\">Варнава · <a href=\"/pod/qa41-42/#qa41-42-25\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5100\" target=\"_blank\" rel=\"noopener\">1:25:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-26\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Женуария отдала собаку<\/b><\/div><p><a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> отдала таксу по кличке Собака как самое ценное, что у неё есть: одинокая, она пожертвовала лучшим другом, чтобы искупить вину перед <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> и уговорить её не уничтожать человечество.<\/p><blockquote>«Я отдаю самого ценного, самого главного друга своего для того, чтобы уговорить Мелиссу не убивать всё человечество»<\/blockquote><p class=\"note\">Варнава · <a href=\"/pod/qa41-42/#qa41-42-26\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5205\" target=\"_blank\" rel=\"noopener\">1:26:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-27\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Может ли меч Гелиоса снять проклятие Женуарии<\/b><\/div><p>Участники сочли, что меч, вероятно, может снять проклятие паучихи, но <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> об этом не подумала. К тому же <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> научилась контролировать превращение, как оборотни, которые обращаются по желанию, и неизвестно, хочет ли она избавиться от этой силы.<\/p><blockquote>«Она научилась контролировать… Есть оборотни, которые научились это контролировать и могут превращаться в любое время»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-27\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5259\" target=\"_blank\" rel=\"noopener\">1:27:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-28\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезанная сцена с крабом Крэбсом<\/b><\/div><p>Селезнёв вырезал из выпуска 42 сцену, где <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> уговаривает своего напарника, краба Крэбса, вместе с таксой <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> сходить на озеро Аземпик, — она не двигала сюжет; в подкасте её показали. Ранее так же вырезали жабу <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачева<\/a>, а в выпуске 43 под угрозой вырезки попугай.<\/p><blockquote>«Вадик это вырезал. Он сказал: «А нахрена? Это никак не двигает сюжет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-28\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5450\" target=\"_blank\" rel=\"noopener\">1:30:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa41-42-41\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Омоложение Мелиссы было раньше гонки — выпуски переставлены<\/b><\/div><p>Хронологически <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> искупалась в ванне немного раньше, чем <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> загадал желание: выпуск о Мелиссе снимали первым, а при показе выпуски 41 и 42 поменяли местами.<\/p><blockquote>«Снимали мы сначала Мелиссу… мы просто выпуски переставили, да, мы местами выпуски поменяли.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-41\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=8026\" target=\"_blank\" rel=\"noopener\">2:13:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-34\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Единороги — земные светлые существа; ангелов в ад затягивают контрактом<\/b><\/div><p>Единороги в лоре ПЧК — земные существа, родом из Чудной Долины (хотя родиться могут где угодно). Они всегда светлые, сопровождают светлых богов и не являются лошадьми. По гипотезе мастера, ангела в ад затягивают как <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>: долго истязают, пока он от изнеможения не подпишет контракт и не станет адским существом. Отдать энергию поезду для него — избавление от пыток. Обратное невозможно: небесные существа не могут насильно сделать демона светлым.<\/p><blockquote>«Долго мучаем, истязаем… он сказал: «Да, я заключаю контракт» от изнеможения. И в итоге: теперь ты адское существо, мы тебя утягиваем вниз.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-34\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6361\" target=\"_blank\" rel=\"noope
