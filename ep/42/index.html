<script>window.EPD = {"key": "42", "label": "42", "title": "Чудная Долина", "date": "2025-09-28", "minutes": 125, "duration": 7523.0, "video_id": "svnG2c_HvK8", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Чудная долина — бывшее место пиров богов: лагерь искателей, озеро Аземпик, хижина Бывалого, роща золотой ванны", "short_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> хочет остановить Тёмного Властелина — падшего бога <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> — любовью, воссоединив его с полурослицей <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, которую она уже расколдовала, но которая теперь стала старухой. Отряд идёт в Чудную долину за золотой ванной, возвращающей молодость: добывает деньги и ответы на загадки тролля, освобождает искателя Бывалого от злого двойника из проклятого озера и находит ванну <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. Войти в неё может лишь тот, у кого нет тёмных мыслей, а Мелисса желает гибели миру и мучений <a class=\"ref\" href=\"/c/gelius/\">Гелиусу<\/a>. После покаяний и подарков она входит в ванну и выходит молодой.", "summary_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> узнала, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — это падший бог Брэндон, сын <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>, и хочет остановить нашествие демонов, воссоединив его с возлюбленной, полурослицей <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>. Мелиссу она уже расколдовала из злобной карги, но та стала старухой, и отряд идёт в Чудную долину — бывшее место пиров богов, полное аномалий, — искать золотую ванну, которая возвращает молодость. По дороге герои раздобывают деньги и ответы на загадки тролля, освобождают искателя Бывалого, место которого занял злой двойник из проклятого озера, и находят ванну <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. Но в ванну может войти только тот, у кого нет тёмных мыслей, а измученная Мелисса признаётся, что желает гибели миру и мучений Гелиусу. После покаянных речей и подарков Мелисса входит в ванну и выходит оттуда молодой — план Талалы продвинулся.", "outcome_html": "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> омоложена и, по-видимому, избавлена от тёмных мыслей; отряд цел. Скрижаль, связь с <a class=\"ref\" href=\"/c/gelius/\">Гелиусом<\/a>, утоплена в ванне.", "world_html": ["Раскрыто: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, сын <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>; <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — бабушка <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, значит Эрик и <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — потомки бога", "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> омоложена, план «спасти мир любовью» продвинулся", "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> и небеса узнали о расколдовании <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и против плана <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>", "Скрижаль <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> утоплена в золотой ванне"], "scenes": [{"t": "0:01:08", "sec": 68, "html": "Пролог: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> побывала в небесном мире и узнала, что богам выгодны невзгоды смертных (больше молитв). Она получила меч бога солнца и скрижаль Брэндона — сына <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>, падшего бога, ставшего <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>; нашла его возлюбленную <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a> в деревне <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a> и сняла с неё проклятие."}, {"t": "0:03:01", "sec": 181, "html": "Сценка: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> узнаёт о гонке джина <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джиги<\/a> (связь с вып. 41), но летать на грифоне по правилам нельзя."}, {"t": "0:09:36", "sec": 576, "html": "Предыстория: полвека назад Брэндон отрёкся от небес ради полурослицы <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>, они ждали ребёнка; <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> испепелил сына и заточил его дух в аду, Мелиссе стёр память и превратил её в кровожадную каргу. Жажда мести сделала Брэндона <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>."}, {"t": "0:10:41", "sec": 641, "html": "Голосовое сообщение на скрижали от Санты Тиндермена (помогал <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> на небесах, наказан — теперь уборщик): <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> получила уведомление о расколдовании <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>; ей невыгодно, чтобы Талала остановила Тёмного Властелина, — надо торопиться."}, {"t": "0:12:07", "sec": 727, "html": "–[0:19:04] Задача: найти в Чудной долине золотую ванну и омолодить <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>. Представление героев; <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> рассказывает, что муж её дочери <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> — полурослик <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> — потомок бога: Мелисса его бабушка, а дед — <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>."}, {"t": "0:19:10", "sec": 1150, "html": "Лагерь искателей у входа в долину. Торговец Киса утверждает, что ванна — миф, дорогу к ней знал только пропавший искатель Бывалый. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> меняет перо на артефакт и крадёт ещё два: бесконечную сумку с сумками, жезл чихания, свистульку-дельфина."}, {"t": "0:23:46", "sec": 1426, "html": "Золотой компас («коснись и познаешь свой путь») — шутка Гермеса: у <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> руки и ноги меняются местами. Выясняется, что в долине нельзя ругаться (каждое ругательство вызывает аномалию: колокольный звон, красный туман, раскрывающий старые раны) и летать."}, {"t": "0:29:54", "sec": 1794, "html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> вырывает зуб у приставшего к ней искателя по прозвищу Задира; <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> убеждает шерифа, что фея «несовершеннолетняя», и Задиру сажают в выгребную яму."}, {"t": "0:36:00", "sec": 2160, "html": "Доска объявлений: мешок мака с макового поля (Задира платит золотой), ответы на вопросы тролля у ручья (у Кисы), экспедиция за ожерельем на озеро Аземпик, история про ванну у «Странного Марка»."}, {"t": "0:38:24", "sec": 2304, "html": "Мелкое желание <a class=\"ref\" href=\"/c/milfeya/\">Милфеи<\/a> с нескольких попыток создаёт три мешка мака. Меч <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> опознаёт компас как артефакт Гермеса; Талала снимает проклятие с <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> мечом. Мелисса обижена: её используют как вещь."}, {"t": "0:47:37", "sec": 2857, "html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> флиртует с шерифом: Бывалый живёт в хижине за озером Аземпик, мост стережёт тролль; шериф подсказывает ответ «груша» и зовёт на ужин с судаком. Невидимый слуга <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> приносит из палатки Задиры волынку невидимости. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, отказавшись от кражи у шерифа, получает монету."}, {"t": "0:52:53", "sec": 3173, "html": "Задира, напуганный <a class=\"ref\" href=\"/c/milfeya/\">Милфеей<\/a> и прижатый шерифом, платит за три мешка мака три золотых. Киса продаёт ответы («ракушка, груша, четыре») и обещает 5 золотых за ожерелье."}, {"t": "1:05:22", "sec": 3922, "html": "Тролль Гродя у моста: ответы верны. Герои «сдают» троллю Кису и Марка, продававших его ответы, и находят пять зубов в его объедках (ещё монета)."}, {"t": "1:13:00", "sec": 4380, "html": "Озеро Аземпик: рог <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутериона<\/a> призывает выдру; ожерелье лежит на дне, трогать божественные вещи нельзя. <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> в отчаянии бросается в озеро; Бульбутерион спасает её и лжёт, что любит. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> взмахом крыльев раздвигает озеро до самой хижины; <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> несёт Мелиссу с сумкой на голове (чтобы не смотрела в воду)."}, {"t": "1:23:02", "sec": 4982, "html": "<a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> видит на дне призрак толстого рыжего мужчины, шепчущего «спаси»; хватает ожерелье — и оно приковывает его ко дну."}, {"t": "1:24:30", "sec": 5070, "html": "Хижина: «Бывалый» — идеальный рыжий красавец — обещает рассказать о ванне за голову единорога с макового поля. Рука у него холодная, как озеро. Невидимая <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> проникает в дом, соблазнением проверяет его и обнаруживает зло."}, {"t": "1:36:30", "sec": 5790, "html": "Существо ранит <a class=\"ref\" href=\"/c/milfeya/\">Милфею<\/a>; <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> застревает в двери, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> через окно бьёт лучом меча, <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a>-паучиха опутывает его паутиной. Касание меча снимает проклятие — двойник превращается в поток воды и утекает в озеро; из озера выходит настоящий Бывалый, толстый и рыжий: когда-то, засмотревшись в озеро на свою идеальную копию, он был утянут в воду."}, {"t": "1:47:02", "sec": 6422, "html": "<a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> свистком призывает дельфина, тот берёт проклятие ожерелья на себя, и русал отсылает его, а свисток закапывает, как обещал."}, {"t": "1:49:53", "sec": 6593, "html": "Бывалый ведёт в рощу к иллюзорной скале — пройти могут лишь божественные существа. Герои мажутся прахом <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и проходят к мраморному алькову с золотой ванной <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> со святой водой. Но войти в неё может лишь существо без тёмных мыслей."}, {"t": "1:53:35", "sec": 6815, "html": "Монолог <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>: боги убили её ребёнка и возлюбленного, превратили её в каргу, пожиравшую нерождённых детей, и герои обращались с ней так же, как с вещью. Она бесконечно любит <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и считает его правым: мир должен быть уничтожен, а <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> — долго мучиться."}, {"t": "1:55:14", "sec": 6914, "html": "Покаяние: <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> дарит перо, <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> — кокосовое масло, <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> — жемчужину дружбы (передаётся изо рта в рот), <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> — свою таксу по кличке Собака, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — скрижаль (чтобы <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> могла дозвониться до <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>) и остатки праха <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>."}, {"t": "2:01:33", "sec": 7293, "html": "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> спрашивает: «Правда ли, что от моей жизни зависит судьба всей земли?» — входит в ванну с таксой и топит скрижаль. Проверка с песней <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> проходит."}, {"t": "2:03:35", "sec": 7415, "html": "Из-за завесы выходит молодая красивая девушка с собакой — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> омоложена. Эпилог: удастся ли <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> её план и какая судьба ждёт Мелиссу?"}], "key_events": [{"t": "0:10:41", "sec": 641}, {"t": "0:18:17", "sec": 1097}, {"t": "0:23:46", "sec": 1426}, {"t": "1:05:22", "sec": 3922}, {"t": "1:15:17", "sec": 4517}, {"t": "1:36:30", "sec": 5790}, {"t": "1:49:53", "sec": 6593}, {"t": "1:53:35", "sec": 6815}, {"t": "2:01:33", "sec": 7293}, {"t": "2:03:35", "sec": 7415}], "coins": {"ep": "42", "events": [{"t": "0:51:36", "kind": "earn", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "хороший отыгрыш — напомнил, что кража (обыск шерифа слугой) портит отношения с божественным мечом", "result": null, "sec": 3096, "who_url": "/c/grifon-andrey/", "reason_html": "хороший отыгрыш — напомнил, что кража (обыск шерифа слугой) портит отношения с божественным мечом"}, {"t": "0:58:02", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "задира расплатился тремя золотыми монетами за три мешка мака по итогам переговоров", "result": null, "sec": 3482, "who_url": null, "reason_html": "задира расплатился тремя золотыми монетами за три мешка мака по итогам переговоров"}, {"t": "1:01:09", "kind": "loot", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "купил у торговки Кисы шпаргалку с ответами на загадки тролля, сторговавшись до одной монеты", "result": null, "sec": 3669, "who_url": "/c/grifon-andrey/", "reason_html": "купил у торговки Кисы шпаргалку с ответами на загадки тролля, сторговавшись до одной монеты"}, {"t": "1:12:20", "kind": "earn", "who": "Милфея", "actor": "Александра Бортич", "to": null, "reason": "нашла пять зубов тролля и превратила их в золотую монету — её фирменная способность", "result": null, "sec": 4340, "who_url": "/c/milfeya/", "reason_html": "нашла пять зубов тролля и превратила их в золотую монету — её фирменная способность"}, {"t": "1:22:47", "kind": "spend", "who": "Бульбутерион", "actor": "Слава Копейкин", "to": null, "reason": "переброс проверки Внимательности с преимуществом, чтобы разглядеть ожерелье на дне озера", "result": "успех (19) — заметил призрачный силуэт и светящееся ожерелье", "sec": 4967, "who_url": "/c/bulbatarion/", "reason_html": "переброс проверки Внимательности с преимуществом, чтобы разглядеть ожерелье на дне озера"}, {"t": "1:23:49", "kind": "spend", "who": "Бульбутерион", "actor": "Слава Копейкин", "to": null, "reason": "переброс проверки Мудрости при попытке схватить ожерелье рукой", "result": "критическая неудача — ожерелье обмотало запястье и приковало ко дну", "sec": 5029, "who_url": "/c/bulbatarion/", "reason_html": "переброс проверки Мудрости при попытке схватить ожерелье рукой"}, {"t": "1:26:32", "kind": "other", "who": null, "actor": null, "to": null, "reason": "монета за шутливую отсылку к мему («Аманда, Линда и Роуз») во время розыгрыша сестёр милосердия", "result": null, "sec": 5192, "who_url": null, "reason_html": "монета за шутливую отсылку к мему («Аманда, Линда и Роуз») во время розыгрыша сестёр милосердия"}, {"t": "1:37:47", "kind": "spend", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "переброс критического провала мультиатаки когтями и клювом по гигантской паучихе", "result": "даже после переброса персонаж застрял в дверном проёме", "sec": 5867, "who_url": "/c/grifon-andrey/", "reason_html": "переброс критического провала мультиатаки когтями и клювом по гигантской паучихе"}, {"t": "1:44:44", "kind": "earn", "who": "Милфея", "actor": "Александра Бортич", "to": null, "reason": "догадалась, что спасённый «бывалый» в озере на самом деле иллюзия/водная тварь", "result": null, "sec": 6284, "who_url": "/c/milfeya/", "reason_html": "догадалась, что спасённый «бывалый» в озере на самом деле иллюзия/водная тварь"}], "totals": [{"who": "Грифон Андрей", "actor": "BRB", "earned": 1, "spent": 1, "img": "img/chars/andrej.webp", "who_url": "/c/grifon-andrey/", "actor_url": "/p/brb/"}, {"who": "Милфея", "actor": "Александра Бортич", "earned": 2, "spent": 0, "img": "img/chars/milfeya.webp", "who_url": "/c/milfeya/", "actor_url": "/p/aleksandra-bortich/"}, {"who": "Бульбутерион", "actor": "Слава Копейкин", "earned": 0, "spent": 2, "img": "img/chars/bul-buterion.webp", "who_url": "/c/bulbatarion/", "actor_url": "/p/slava-kopeykin/"}], "notes": "Несколько монет — внутриигровые деньги (оплата мака, покупка ответов у Кисы), отмечены как loot и не входят в totals. Одна монета выдана за мем-шутку без ясного получателя-персонажа (kind other). Финальный подсчёт монет на конец выпуска (130 000 руб) — общий бросок, не привязан к конкретному персонажу."}, "cast": [{"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, воин света", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "25", "label": "25", "title": "Остров Соблазна"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Грифон Андрей", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "говорящий грифон", "role": "", "fate": "выжил", "id": "Андрей", "url": "/c/grifon-andrey/", "img": "img/chars/andrej.webp", "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Милфея", "actor": "Александра Бортич", "actor_url": "/p/aleksandra-bortich/", "race": "фея-проказница", "role": "", "fate": "выжила (ранена)", "id": "Милфея", "url": "/c/milfeya/", "img": "img/chars/milfeya.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Бульбутерион", "actor": "Слава Копейкин", "actor_url": "/p/slava-kopeykin/", "race": "русал", "role": "", "fate": "выжил", "id": "Бульбутерион", "url": "/c/bulbatarion/", "img": "img/chars/bul-buterion.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}]}, {"name": "Женуария", "actor": "Екатерина Варнава", "actor_url": "/p/ekaterina-varnava/", "race": "человек, проклятая женщина-паучиха", "role": "", "fate": "выжила", "id": "Жануария", "url": "/c/zhanuariya/", "img": "img/chars/zhenuariya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}]}], "npcs": [{"name": "Мелисса", "actor": "", "actor_url": null, "race": "", "role": "полурослица, возлюбленная Брэндона, бабушка Эрика Пенисова", "fate": "омоложена в золотой ванне", "id": "Мелисса", "url": "/c/melissa/", "img": null, "other": [{"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Бывалый", "actor": "", "actor_url": null, "race": "", "role": "искатель, знавший путь к ванне", "fate": "освобождён из озера, выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Двойник Бывалого", "actor": "", "actor_url": null, "race": "", "role": "злое существо из озера Аземпик", "fate": "проклятие снято, ушёл водой в озеро", "id": null, "url": null, "img": null, "other": []}, {"name": "Санта Тиндермен", "actor": "", "actor_url": null, "race": "", "role": "помощник Талалы на небесах, разжалован в уборщики", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}, {"name": "Венера", "actor": "", "actor_url": null, "race": "", "role": "богиня, против плана Талалы", "fate": "неизвестно", "id": "Венера", "url": "/c/venera/", "img": "img/chars/venera.webp", "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Киса", "actor": "", "actor_url": null, "race": "", "role": "торговец артефактами и отве  остров Соблазна", "dir": "out", "color": "#7C5CD6"}, {"key": "38", "label": "38", "title": "Возлюбленная", "note_html": "<a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> найдена в Лысой Пади и расколдована", "dir": "out", "color": "#7C5CD6"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Упомянута гонка джина <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джиги<\/a> за желание", "dir": "out", "color": "#C8423B"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши", "note_html": "<a class=\"ref\" href=\"/place/chudnaya-dolina/\">Чудная долина<\/a>, где <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> видел богов; дар Лёши видеть будущее и прошлые жизни", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Богам выгодны невзгоды смертных, ведь это увеличивает количество молитв» — пролог.", "«Со старухами мутят только алчные до денег или извращенцы. Или Прохор» — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>.", "«Вы постоянно относились ко мне как к вещи. И боги делали то же самое» — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a>.", "«Я люблю его бесконечно, потому что он абсолютно прав. Он должен уничтожить весь этот мир» — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> о <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоне<\/a>.", "«Это ведь правда, что от моей жизни зависит судьба всей земли?» — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> перед ванной."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/chudnaya-dolina/\">Чудная долина<\/a> (бывшее место пиров богов; аномалии, нельзя ругаться и летать); лагерь искателей; маковое поле (мак пугает съевшего; пасётся единорог); озеро Аземпик (проклятое — затягивает смотрящего); мост тролля; хижина Бывалого; роща с иллюзорной завесой и альковом золотой ванны. Упомянуты: <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a>, остров Соблазна, <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>, небесный мир.<\/li>\n<li>Фракции: небесные боги (<a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a>, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, Гермес, <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a>); искатели Чудной долины; женская школа духовных практик «Космическая воронка».<\/li>\n<li>Артефакты: разумный меч Кары <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> (снятие проклятий, луч света); скрижаль <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> (утоплена <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> в ванне); прах Брэндона; золотая ванна <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>; компас Гермеса; бесконечная сумка с сумками; жезл чихания; свистулька-дельфин (закопана на дне озера); волынка невидимости; ожерелье Ван Клиф на дне озера (проклятое); жемчужина дружбы.<\/li>\n<\/ul>", "chars": {"Милфея": {"name": "Милфея", "img": "img/chars/milfeya.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9C%D0%B8%D0%BB%D1%84%D0%B5%D1%8F", "summary": "", "infobox": {"Пол": "Женский", "Раса": "Фея", "Тип": "Игровой", "Игрок": "Александра Бортич"}, "actors": ["Александра Бортич"], "kind": "pc", "dead": false, "race": "Фея", "portraits": [{"ep": "31", "thumb": "img/portraits/ad79a351818ea7f2.webp"}], "url": "/c/milfeya/", "eps": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, "Талала": {"name": "Гномка Талала", "img": "img/chars/talala.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A2%D0%B0%D0%BB%D0%B0%D0%BB%D0%B0", "summary": "Талала́ — гномиха-бард из Кальтенбурга, сестра Динь-Диня.", "infobox": {"Пол": "Женский", "Раса": "Гном", "Тип": "Игровой", "Игрок": "Александр Гудков", "На вики": "Талала"}, "actors": ["Александр Гудков"], "kind": "pc", "dead": false, "race": "Гном", "portraits": [{"ep": "38", "thumb": "img/portraits/edeb725bd4ae6541.webp"}, {"ep": "25", "thumb": "img/portraits/37ae2ca903e7656b.w
