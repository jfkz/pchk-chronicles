<script>window.EPD = {"anim": false, "key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "date": "2023-03-08", "minutes": 104, "duration": 6238.0, "video_id": "iJIxr6EtT68", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Мёртвые топи: деревня Цветущая Лоза, поместье графа, винодельня", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> едет в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> на день перерождения графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Сосунеску<\/a>, чтобы заставить замолчать разбудивших его подростков.", "summary_html": "Продолжение вампирской ветви (вып. 12). <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> приглашает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> и Вампира Бека на свой «день перерождения» в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a>; с ними едут гибрид <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и энергетический вампир <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>. Днём подростки-сироты пробрались в поместье графа и тыкали его палкой в гробу, поэтому вампиры должны найти их и заставить молчать, пока селяне не сожгли поместье. Поиски в деревне <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a> оборачиваются сожжённой таверной, убийствами и расколом группы. У винодельни вампиры находят подростков и болотное чудовище Нину. Кукан Яка влюбляется в чудовище и уходит с ним, а <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и Адольф, раскаявшись, спасают сирот и сжигают графа. Селяне сжигают поместье.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Рабочее название — «Сиротки из Мёртвых топей»\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Рабочее название — «Сиротки из Мёртвых топей»<\/b> Во внутренних документах выпуск <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> назывался «Сиротки из <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвых топей<\/a>». Финальную песню про сироток Сироткин написал по пересказу сюжета, не видев выпуск. Название сменили на «Вампиры Мёртвых топей» ради узнаваемости: вампиры уже были в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=163\" target=\"_blank\" rel=\"noopener\">0:02:43 ↗<\/a> · <a href=\"#qa16-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Болотную тварь звали Нина, не Тина\">22<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Болотную тварь звали Нина, не Тина<\/b> Зрители спорили, как зовут болотную тварь — <a class=\"ref\" href=\"/c/nina/\">Нина<\/a> или Тина. В статблоке монстра она записана как Нина; ведущие лишь пошутили, что «Тина» подошло бы болотной твари больше. Канон — Нина (в выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a> её играет <a class=\"ref\" href=\"/p/lena-kukoyaka/\">Лена Кукояка<\/a>). <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep16.md (раздел «Кратко») чудовище названо «Тиной»; правильно — <a class=\"ref\" href=\"/c/nina/\">Нина<\/a>, как в разделе «Персонажи» того же конспекта.<\/span> <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5337\" target=\"_blank\" rel=\"noopener\">1:28:57 ↗<\/a> · <a href=\"#qa16-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: «Демонизация» и «Вампиры Мёртвых топей» поменялись местами\">28<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>«Демонизация» и «Вампиры Мёртвых топей» поменялись местами<\/b> «Демонизация» изначально стояла шестнадцатым выпуском, а вампирский — семнадцатым. Порядок поменяли, чтобы было время ещё раз пересмотреть сложную «Демонизацию» и привыкнуть к ней; смонтировали её в обычные сроки. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=2160\" target=\"_blank\" rel=\"noopener\">0:36:00 ↗<\/a> · <a href=\"#qa17-6\">к записи<\/a><\/span><\/span>", "outcome_html": "<a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> сожжён, сироты спасены Вампиром Беком и <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> ушёл с болотным чудовищем, его судьба неизвестна.", "world_html": ["<a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a>, старший вампир Мёртвых топей, уничтожен<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Молодые вампиры ещё пожалеют об убийстве графа\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Молодые вампиры ещё пожалеют об убийстве графа<\/b> Авторы признали, что «человечные» вампиры не соответствуют исходному лору, и намекнули, что они ещё пожалеют о содеянном. Старшего вампира с младшими связывают кровные узы: убив его, младший как минимум теряет силы. Кроме того, могут существовать другие старшие вампиры (по аналогии с Вольтури из «Сумерек»), которые такого не простят. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=891\" target=\"_blank\" rel=\"noopener\">0:14:51 ↗<\/a> · <a href=\"#qa16-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Высший совет вампиров: изначально 13 древних\">32<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Высший совет вампиров: изначально 13 древних<\/b> Высший вампирский совет — «как ЦК КПСС»: изначально 13 древних вампиров. Убиты двое — граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> и <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a>; жена и сыновья Димитара были вампирами, но не членами совета. Остальные 11 членов пока неизвестны и ещё появятся — клан Балана не может спать спокойно. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep20.md у <a class=\"ref\" href=\"/c/helga/\">Хельги<\/a> и детей не уточнён статус — по словам авторов, они вампиры, но не члены высшего совета; высшим вампиром был только <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар<\/a> (сыновей было двое).<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1275\" target=\"_blank\" rel=\"noopener\">0:21:15 ↗<\/a> · <a href=\"#qa20-10\">к записи<\/a><\/span><\/span>", "Поместье графа сожжено селянами Цветущей Лозы<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампирам нужны свои гробы с родной землёй\">20<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампирам нужны свои гробы с родной землёй<\/b> Вампиры приехали в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> со своими гробами. Если те сгорели вместе с поместьем, им придётся тяжело, но не смертельно: их прародители родом из Мёртвых топей, а родная земля помогает. В гробу лежит земля, и над ним нужно провести ритуал, чтобы он давал силы. Поэтому в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a> вампиры искали именно свои гробы, а не брали любые в похоронном бюро. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4655\" target=\"_blank\" rel=\"noopener\">1:17:35 ↗<\/a> · <a href=\"#qa16-23\">к записи<\/a><\/span><\/span>", "Таверна «Весёлый утопец» и винодельня Цветущей Лозы уничтожены", "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> покинул клан ради болотного чудовища", "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> встали на сторону сирот"], "scenes": [{"t": "0:01:26", "sec": 86, "html": "Рекламная рамка: мёртвая летучая мышь, которая несколько месяцев ехала почтой, приносит <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> и Вампиру Беку приглашение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> на день перерождения в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a>; Дан Балан жалуется на расходы.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Иделаида и Антон не поехали к графу\">8<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Иделаида и Антон не поехали к графу<\/b> На вопрос, почему <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> и <a class=\"ref\" href=\"/c/anton/\">Антон<\/a> не поехали к <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Владу Сосунеску<\/a>, авторы прямо не ответили. Прозвучали версии, что граф их не пригласил или что они с ним незнакомы, хотя <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> заметил, что они «кровь его крови». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3008\" target=\"_blank\" rel=\"noopener\">0:50:08 ↗<\/a> · <a href=\"#qa16-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:06:19", "sec": 379, "html": "Вводная: деревня <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a> выращивает на болотах виноград, вино дешёвое, «даёт в голову» из-за болотных газов. Рядом заброшенное поместье: граф сам пустил слух, что там был лепрозорий. Его фамильяр недавно умер, днём поместье осталось без охраны, и подростки разбудили его, тыкая палкой в гробу. Задача — найти их и заставить молчать."}, {"t": "0:08:23", "sec": 503, "html": "Представление: граф (веками маскирует убийства под несчастные случаи), <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (граф обратил его в старости; привёз «дорогой подарок»), <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (приехал в отпуск), <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> (в одну ночь его укусили крыса-оборотень и вампир, он принял обе болезни, не боится солнца; старшие вампиры помнят, что он был их фамильяром), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> (энергетический вампир, питается негативными эмоциями и может «заговорить» жертву до смерти). Механика очков крови и энергии.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Что было в карточке Дан Балана\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Что было в карточке Дан Балана<\/b> В карточке <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> было написано, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> едет к почитаемому графу — своему «отцу» — и что иерархия для него очень важна. Гудков эту установку почти не отыгрывал. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=997\" target=\"_blank\" rel=\"noopener\">0:16:37 ↗<\/a> · <a href=\"#qa16-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ликантропия в мире ПЧК\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ликантропия в мире ПЧК<\/b> Оборотнем становятся не по наследству, а от укуса. Выжив после укуса оборотня, человек примерно с 50-процентной вероятностью заражается; обращение занимает около двух недель. Дальше три пути: не контролировать себя и превращаться в зверя в полнолуние или при стрессе; научиться контролировать превращение; стать гибридом с промежуточной формой (полукрыса-получеловек), как <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4223\" target=\"_blank\" rel=\"noopener\">1:10:23 ↗<\/a> · <a href=\"#qa16-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Энергетическими вампирами становятся «по судьбе»\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Энергетическими вампирами становятся «по судьбе»<\/b> Энергетические вампиры, как <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>, ни от кого не заражаются: в какой-то момент у человека просто открывается способность высасывать энергию из других, «судьба сделала их такими». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4416\" target=\"_blank\" rel=\"noopener\">1:13:36 ↗<\/a> · <a href=\"#qa16-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Канистра бензина — импровизация игрока, а не сценарий\">25<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Канистра бензина — импровизация игрока, а не сценарий<\/b> Сожжение графа не планировали. В карточках игроков было написано только: придумай имя и подарок графу, держи его в секрете и подари в конце. Подарок <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> (канистру бензина) придумал <a class=\"ref\" href=\"/p/kostya-pushkin/\">Костя Пушкин<\/a>; <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> придумал для <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> вибратор. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5946\" target=\"_blank\" rel=\"noopener\">1:39:06 ↗<\/a> · <a href=\"#qa16-30\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дан Балан не мог обратить Джейкока\">45<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дан Балан не мог обратить Джейкока<\/b> <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> не мог укусить <a class=\"ref\" href=\"/c/dzheykob/\">Джейкока<\/a> и сделать его вампиром: кровь оборотня отравила бы его, как кровь «гнома» в палатке. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал гибридом только потому, что его сначала укусила крыса-оборотень, а обратили его ещё в переходном (инкубационном) периоде. <span class=\"note\">Подкаст по #33 · <a href=\"https://youtu.be/bRRVr7jN2fA?t=4139\" target=\"_blank\" rel=\"noopener\">1:08:59 ↗<\/a> · <a href=\"#qa33-12\">к записи<\/a><\/span><\/span>"}, {"t": "0:15:55", "sec": 955, "html": "Одного подростка граф запомнил: пижама-единорог и брекеты. Таверна «Весёлый утопец»: граф выдаёт себя за отца пропавших «ребятишек», трактирщик говорит, что там поёт сирота <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> в пижаме единорога; сегодня он не пришёл. Граф внушением заставляет трактирщика налить всем за «уже оплаченный» счёт."}, {"t": "0:22:31", "sec": 1351, "html": "Вампиров тошнит от вина «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>». Старуха в чёрном узнаёт <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, которого видела 70 лет назад. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> выкачивает из трактирщика энергию нудными «фактами» («собаки не мяукают») и замечает у того арбалет с серебряным болтом. Дан Балан брызгает старухе в глаза чесночным спреем.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиры не могут ни есть, ни пить человеческое\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиры не могут ни есть, ни пить человеческое<\/b> Вампиров тошнило от <a class=\"ref\" href=\"/a/vino-cvetushchaya-loza/\">вина<\/a> не потому, что оно горючее: вампиры вообще не могут употреблять еду и питьё для обычных гуманоидов. Организм сразу всё отторгает. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3324\" target=\"_blank\" rel=\"noopener\">0:55:24 ↗<\/a> · <a href=\"#qa16-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Трактирщик должен был оказаться охотником; план мастера\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Трактирщик должен был оказаться охотником; план мастера<\/b> Таверна задумывалась как песочница с несколькими зацепками — пьяницей и старухой, и обе сработали. Не сработал только трактирщик: он должен был раскрыться как убийца-охотник (на демонов/нечисть), но <a class=\"ref\" href=\"/c/adolf/\">Адольфу<\/a> повезло с бросками, он заметил арбалет и выкачал из трактирщика энергию. Жёсткого плана не было, только цепочка подсказок: сироту зовут <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> → он в «Доме сиротки» → он на винограднике → появляется монстр. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5059\" target=\"_blank\" rel=\"noopener\">1:24:19 ↗<\/a> · <a href=\"#qa16-25\">к записи<\/a><\/span><\/span>"}, {"t": "0:30:18", "sec": 1818, "html": "Граф парализует взглядом вышибалу Дмитрия. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> добивает трактирщика «утомительным диалогом». <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> стреляет трактирщику в ногу его же серебряным болтом и кричит, что тот «был вампиром»."}, {"t": "0:33:07", "sec": 1987, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> воем призывает белого волка; посетители выбегают его убивать. Вампиры выпивают парализованного вышибалу, Кукан Яка под видом приёма Геймлиха выпивает старуху. Бек находит 2 золотых и записку: трактирщик покупает выступления <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a> у эльфа-торговца из «Дома сиротки»."}, {"t": "0:38:27", "sec": 2307, "html": "Одну из комнат защищает магический барьер (нужно приглашение). Граф и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> ссорятся из-за старшинства: граф вонзает когти гному в зад и держит его как перчаточную куклу, Кукан Яка метит графа мочой оборотня (помеха на все броски), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> «гадит на обоих». Кто-то бросает на стул горящее полено — вино взрывается как коктейль Молотова, таверна сгорает. Граф улетает мышью через канализацию, Адольф уходит «быстрым шагом».<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Правило приглашения: вампиры свободно входят в общественные места\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Правило приглашения: вампиры свободно входят в общественные места<\/b> По правилам шоу вампиры входят в общественные места (таверны) без приглашения, а в жилые помещения — нет. Поэтому в таверне «Весёлый утопец» герои не смогли войти в комнату трактирщика, защищённую барьером: хозяин, который мог их пригласить, был уже убит. На вопрос, почему в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a> понадобилось приглашение в кузницу, авторы отшутились. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1597\" target=\"_blank\" rel=\"noopener\">0:26:37 ↗<\/a> · <a href=\"#qa16-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Традиционные ценности» вампиров\">24<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Традиционные ценности» вампиров<\/b> Из выпуска известны такие вампирские «традиционные ценности»: не блевать в сюртуках, старшие не ошибаются, старших надо уважать и давать им деньги по первому требованию. Старшинство держится на силе: ты старший, пока силён. Остальные ценности, возможно, раскроют позже. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5878\" target=\"_blank\" rel=\"noopener\">1:37:58 ↗<\/a> · <a href=\"#qa16-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему граф Сосунеску напал на Кукан Яку\">30<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему граф Сосунеску напал на Кукан Яку<\/b> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> объяснил, что граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> атаковал <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Яку, потому что тот вёл себя с графом непочтительно и не соблюдал старшинство. По словам актёра, такие непредсказуемые действия соответствовали логике персонажа. <span class=\"note\">Никита Кукушкин отвечает на вопросы · <a href=\"https://youtu.be/sRvWxLpc8RE?t=1024\" target=\"_blank\" rel=\"noopener\">0:17:04 ↗<\/a> · <a href=\"#qa-sRvWxLpc8RE-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кто может пригласить вампира и что со взорванным домом\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кто может пригласить вампира и что со взорванным домом<\/b> Пригласить вампира может только хозяин жилища — ни <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a>, ни <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Лука<\/a> не могли этого сделать. Если дом разрушен и перестал быть жильём, войти можно. В таверне «Весёлый утопец» вампиры могли входить в незанятые комнаты, но в арендованную — только по приглашению арендатора. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2700\" target=\"_blank\" rel=\"noopener\">0:45:00 ↗<\/a> · <a href=\"#qa20-24\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»\">42<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»<\/b> <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> был спокоен, потому что мог телепортироваться в любой момент. Но его выстрел промахнулся, а <a class=\"ref\" href=\"/c/anton/\">Антону<\/a> удался бросок на переворот машины, который зал встретил овацией. Мастер в кадре бросил за <a class=\"ref\" href=\"/a/teleportator-pif-pafa/\">Пиф-Пафа<\/a>, и тот не вырвался (бросок вырезали). Иначе следующим ходом он бы телепортировался и ушёл крюком на крышу. Его телепорт — не дальний, а аналог заклинания «Туманный шаг» (около 30 футов), как у <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> в выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a>. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=5884\" target=\"_blank\" rel=\"noopener\">1:38:04 ↗<\/a> · <a href=\"#qa28-20\">к записи<\/a><\/span><\/span>"}, {"t": "0:48:25", "sec": 2905, "html": "Селяне добивают волка; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> бьёт крестьянина кулаком в лицо, и толпа его окружает. Граф мышью находит трёх подростков-гопников на беговелах; они издеваются над его «кринжем» и «традиционными ценностями», граф выпускает на них рой саранчи, двое съедены заживо. Граф платит свидетелю монету, чтобы тот свалил всё на «злобного оборотня».<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Подростков-гопников нарочно нарисовали неприятными\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Подростков-гопников нарочно нарисовали неприятными<\/b> Чтобы зрителям было не так жалко подростков, которых граф скормил саранче, художники нарисовали их максимально неприятными уличными хулиганами и даже добавили сигарету. В сценарии их смерть была описана гораздо жутче, чем на рисунке. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3090\" target=\"_blank\" rel=\"noopener\">0:51:30 ↗<\/a> · <a href=\"#qa16-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампир пьёт кровь целую минуту и в это время беззащитен\">23<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампир пьёт кровь целую минуту и в это время беззащитен<\/b> Граф не выпил пьяницу, а заплатил ему монету, потому что не хватало времени. Селяне добежали бы за 1–4 хода (до 24 секунд), а вампир пьёт кровь около минуты, и всё это время и он, и жертва обездвижены. По словам авторов, это главная слабость вампиров, иначе они были бы «вообще боги». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5431\" target=\"_blank\" rel=\"noopener\">1:30:31 ↗<\/a> · <a href=\"#qa16-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Традиционные ценности» вампиров\">24<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Традиционные ценности» вампиров<\/b> Из выпуска известны такие вампирские «традиционные ценности»: не блевать в сюртуках, старшие не ошибаются, старших надо уважать и давать им деньги по первому требованию. Старшинство держится на силе: ты старший, пока силён. Остальные ценности, возможно, раскроют позже. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5878\" target=\"_blank\" rel=\"noopener\">1:37:58 ↗<\/a> · <a href=\"#qa16-29\">к записи<\/a><\/span><\/span>"}, {"t": "1:01:55", "sec": 3715, "html": "«Дом сиротки»: барьер не пускает, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, накрасившись «девочкой-сироткой», не может уговорить эльфа-торговца. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> представляется новым хозяином таверны и получает дневник <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a> (у торговца пропали и другие «звёзды» — Бебич и <a class=\"ref\" href=\"/c/egor-ship/\">Егор Шип<\/a>).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Кукан Яка не может без приглашения входить в дома\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Кукан Яка не может без приглашения входить в дома<\/b> <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — гибрид вампира и оборотня, и на нём лежит вампирское проклятие. Поэтому, как и прочие вампиры, он не может без приглашения входить в жилые дома, в какой бы форме ни был. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3182\" target=\"_blank\" rel=\"noopener\">0:53:02 ↗<\/a> · <a href=\"#qa16-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранные локации: изнанка «Дома сиротки» и «Цвет Банк»\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранные локации: изнанка «Дома сиротки» и «Цвет Банк»<\/b> Герои не попали внутрь «Дома сиротки». Эльф-торговец, его директор, наживался на сиротах: половину дома занимали комнаты с деньгами, другую — бараки для детей. В деревне был и непосещённый «банк мёртвых» «Цвет Банк», банк Цветущей <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Лозы<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3390\" target=\"_blank\" rel=\"noopener\">0:56:30 ↗<\/a> · <a href=\"#qa16-15\">к записи<\/a><\/span><\/span>"}, {"t": "1:06:07", "sec": 3967, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> уходит из игры («УЗИ мочевого пузыря»). По дневнику: пропал Бебич, дети решили, что его утащил монстр, выследили вампира в поместье и втроём полезли его убить днём; у них тайный шалаш на болотах у винодельни.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Почему Гудков (Дан Балан) ушёл посреди игры\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Почему Гудков (Дан Балан) ушёл посреди игры<\/b> Съёмка затянулась на четыре часа из-за долгой настройки звука. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> улетал поздним самолётом из Домодедово и уехал около 1:20 ночи, поэтому <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> покинул приключение. Второй «мотор» с <a class=\"ref\" href=\"/p/kostya-pushkin/\">Пушкиным<\/a> и <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукоякой<\/a> доигрывали примерно до трёх часов ночи. Авторы заметили, что Гудков мог бы эффектно погибнуть, например в таверне, а не просто уйти. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=2454\" target=\"_blank\" rel=\"noopener\">0:40:54 ↗<\/a> · <a href=\"#qa16-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Граф не убивал Бебича\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Граф не убивал Бебича<\/b> По дневнику сироты решили, что Бебича утащило чудище из поместья, и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> обвинил в этом графа. На самом деле граф его не убивал: Бебич висел в логове болотной твари. Опытный игрок мог спросить мастера, убивал ли граф Бебича, получить бросок на знание — и тайна раскрылась бы сразу. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3753\" target=\"_blank\" rel=\"noopener\">1:02:33 ↗<\/a> · <a href=\"#qa16-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Выпуски 16 и 17 снимали в один день; почему ушли Смирняга и Гудков\">27<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Выпуски 16 и 17 снимали в один день; почему ушли Смирняга и Гудков<\/b> «Демонизацию» и «Вампиров Мёртвых топей» сняли в один день, и из-за проблем со звуком начало задержалось на 4 часа. Игроки два с половиной часа считали в микрофоны, звукорежиссёры ездили за новыми арендованными колонками, а приключение пришлось начинать заново. Вся съёмка шла около 7 часов. Смирняга просидел на шесть часов дольше обещанного и ушёл во втором акте из трёх. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> тоже должен был улетать, но отменил рейс, чтобы не уходить посреди игры. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=307\" target=\"_blank\" rel=\"noopener\">0:05:07 ↗<\/a> · <a href=\"#qa17-1\">к записи<\/a><\/span><\/span>"}, {"t": "1:09:08", "sec": 4148, "html": "В шалаше — спальники, открытки с героями, три коктейля Молотова из вина и огниво (их забирают). Слышится рёв чудовища. У сторожки — растерзанный сторож; Бек, получив очко крови от Кукан Яки («Вечный слуга»), говорит с мёртвым: убийца — огромная «Нина», она гналась за тремя подростками к винодельне."}, {"t": "1:12:36", "sec": 4356, "html": "Выбивание двери: <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> бьётся головой, граф «гладит» дверь ногой, Бек заходит через незапертую вторую дверь. За бочками прячутся <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a>, ещё один мальчик и девочка. Граф, решив ударить в дверь двумя ногами, влетает в давильню (6 урона) и бросается на детей; Бек колеблется и защищает их."}, {"t": "1:18:27", "sec": 4707, "html": "Врывается болотное чудовище — самка-мать, которой нужно мясо для детей. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> говорит с ней (разговор с животными) и зовёт на свидание, тратя монету, — она соглашается. Кукан Яка отдаёт подросткам две бутылки с горючей смесью.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Пол и размножение болотной твари не определены\">11<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Пол и размножение болотной твари не определены<\/b> Все решили, что болотная тварь — самка, но её «не исследовали». Авторы предположили, что она могла размножиться почкованием или, как некоторые жабы, самооплодотворением. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3259\" target=\"_blank\" rel=\"noopener\">0:54:19 ↗<\/a> · <a href=\"#qa16-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему граф не знал о болотной твари\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему граф не знал о болотной твари<\/b> Деревня была охотничьими угодьями графа, а болотная тварь только что родила двух детёнышей и потому стала охотиться агрессивнее, чем раньше. Отсюда её реплика «я же мать». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3545\" target=\"_blank\" rel=\"noopener\">0:59:05 ↗<\/a> · <a href=\"#qa16-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву\">40<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву<\/b> Сначала на роль болотной твари авторы хотели позвать Артура Бабича, затем Илью <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, а в итоге позвали Лену, жену <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a>, чтобы сыграла настоящая супружеская пара. Изначально болотная тварь была просто монстром, которого надо было убить в сцене с сиротками, но <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> выбрал любовь. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5255\" target=\"_blank\" rel=\"noopener\">1:27:35 ↗<\/a> · <a href=\"#qa26-25\">к записи<\/a><\/span><\/span>"}, {"t": "1:23:13", "sec": 4993, "html": "<a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> бросает бутылку в графа, пол вспыхивает; граф уходит по потолку. Бек бросает бочку горючего вина в огонь. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>, «осознав, что мы нелюди», критически попадает бутылкой в графа (14 урона).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Бой игроков против графа не планировали\">2<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Бой игроков против графа не планировали<\/b> Авторы давно хотели устроить в финале логичный бой между персонажами игроков, но не знали, как сделать это естественно. В выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> так сложилось само: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> ушёл, а <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, которого <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> играл «по-человечески», решил убить графа. Граф вёл себя как чёткий злодей, а между ним и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Якой — вампиром нового поколения — назревал конфликт поколений. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=545\" target=\"_blank\" rel=\"noopener\">0:09:05 ↗<\/a> · <a href=\"#qa16-2\">к записи<\/a><\/span><\/span>"}, {"t": "1:26:38", "sec": 5198, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> решает уйти с возлюбленной, но напоследок даёт графу своё очко крови для честного поединка. Граф подпирает дверь телегой, запирая <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, Бека и детей в горящей винодельне. Бек и Адольф вышибают дверь, подростки выбираются. Кукан Яка произносит речь о любви («что было в Вегасе…») и уезжает на чудовище."}, {"t": "1:31:23", "sec": 5483, "html": "Винодельня взрывается: граф, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> и подростки без сознания, на ногах остаётся только Бек. Он отказывается пить кровь детей, стабилизирует Адольфа, и они решают отнести сирот в «Дом сиротки» и взять с них клятву молчать.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему сироты не кидали спасброски от смерти\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему сироты не кидали спасброски от смерти<\/b> Спасброски от смерти кидают только игровые персонажи. За NPC мастер бросает за кадром или не бросает вовсе. Выбор между графом и сиротами герои уже сделали, и второй бросок «выживут ли дети» обесценил бы этот выбор. К тому же во «втором финале» выяснилось, что граф не убивал Бебича и погиб незаслуженно. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3951\" target=\"_blank\" rel=\"noopener\">1:05:51 ↗<\/a> · <a href=\"#qa16-19\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:01", "sec": 5761, "html": "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> «дарит» графу подарок на день перерождения — канистру бензина — и сжигает его дотла.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Бой игроков против графа не планировали\">2<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Бой игроков против графа не планировали<\/b> Авторы давно хотели устроить в финале логичный бой между персонажами игроков, но не знали, как сделать это естественно. В выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> так сложилось само: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> ушёл, а <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, которого <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> играл «по-человечески», решил убить графа. Граф вёл себя как чёткий злодей, а между ним и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Якой — вампиром нового поколения — назревал конфликт поколений. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=545\" target=\"_blank\" rel=\"noopener\">0:09:05 ↗<\/a> · <a href=\"#qa16-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Убийц старшего вампира должен судить Совет\">19<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Убийц старшего вампира должен судить Совет<\/b> В мире ПЧК обращённые не умирают вместе с убитым старшим вампиром. Но по вампирскому кодексу убийц высшего вампира должен судить Совет — намёк на последствия для <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4550\" target=\"_blank\" rel=\"noopener\">1:15:50 ↗<\/a> · <a href=\"#qa16-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Канистра бензина — импровизация игрока, а не сценарий\">25<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Канистра бензина — импровизация игрока, а не сценарий<\/b> Сожжение графа не планировали. В карточках игроков было написано только: придумай имя и подарок графу, держи его в секрете и подари в конце. Подарок <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> (канистру бензина) придумал <a class=\"ref\" href=\"/p/kostya-pushkin/\">Костя Пушкин<\/a>; <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> придумал для <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> вибратор. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5946\" target=\"_blank\" rel=\"noopener\">1:39:06 ↗<\/a> · <a href=\"#qa16-30\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему вампиры убили графа: логика власти\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему вампиры убили графа: логика власти<\/b> Вампиры — властные существа, веками плетущие интриги, чтобы сместить соперника, убивая его «сыновей» и ставя своих. Граф пытался утвердить власть через авторитет, но за столом его никто не послушал. Остальные решили, что он ослаб и это удобный момент его убрать. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, по мнению <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, играл правильно: он не признавал авторитет графа и всё время демонстрировал силу. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa16-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску\">39<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b> Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">20<\/a> «Вампирское возмездие». <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 ↗<\/a> · <a href=\"#qa26-5\">к записи<\/a><\/span><\/span>"}, {"t": "1:37:41", "sec": 5861, "html": "Эпилог: разгневанные селяне находят в поместье вампирский гроб и сжигают поместье. Сцена с Кукан Якой в логове чудовища: под потолком висит живой изможденный Бебич, чудовище предлагает Кукан Яке съесть ребёнка; тот отказывается и предлагает съесть его самого, «а потом Бебич — ваш выбор». Клиффхэнгер.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Граф не убивал Бебича\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Граф не убивал Бебича<\/b> По дневнику сироты решили, что Бебича утащило чудище из поместья, и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> обвинил в этом графа. На самом деле граф его не убивал: Бебич висел в логове болотной твари. Опытный игрок мог спросить мастера, убивал ли граф Бебича, получить бросок на знание — и тайна раскрылась бы сразу. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3753\" target=\"_blank\" rel=\"noopener\">1:02:33 ↗<\/a> · <a href=\"#qa16-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампирам нужны свои гробы с родной землёй\">20<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампирам нужны свои гробы с родной землёй<\/b> Вампиры приехали в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> со своими гробами. Если те сгорели вместе с поместьем, им придётся тяжело, но не смертельно: их прародители родом из Мёртвых топей, а родная земля помогает. В гробу лежит земля, и над ним нужно провести ритуал, чтобы он давал силы. Поэтому в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a> вампиры искали именно свои гробы, а не брали любые в похоронном бюро. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4655\" target=\"_blank\" rel=\"noopener\">1:17:35 ↗<\/a> · <a href=\"#qa16-23\">к записи<\/a><\/span><\/span>"}, {"t": "1:40:46", "sec": 6046, "html": "Одна монета + 6 по броску Кости: 70 000 руб. в фонд сирот. Финальная песня «Сиротки из Мёртвых топей» (Сироткин).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Рабочее название — «Сиротки из Мёртвых топей»\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Рабочее название — «Сиротки из Мёртвых топей»<\/b> Во внутренних документах выпуск <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> назывался «Сиротки из <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвых топей<\/a>». Финальную песню про сироток Сироткин написал по пересказу сюжета, не видев выпуск. Название сменили на «Вампиры Мёртвых топей» ради узнаваемости: вампиры уже были в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=163\" target=\"_blank\" rel=\"noopener\">0:02:43 ↗<\/a> · <a href=\"#qa16-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Почему выпуск закончился тишиной, а не песней\">44<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Почему выпуск закончился тишиной, а не песней<\/b> Сюжетные песни писали под настроение: «Сиротки из Мёртвых топей» — по идее <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, песня к «Возвращению в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>» подчёркивала смерть <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>, а песню после «Судьбы <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» дали, чтобы сбить смех в финале. В выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">30<\/a> авторы намеренно оставили зрителя в тишине наедине с впечатлениями. <span class=\"note\">Подкаст по #30 · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=8218\" target=\"_blank\" rel=\"noopener\">2:16:58 ↗<\/a> · <a href=\"#qa30-32\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:07:28", "sec": 448}, {"t": "0:24:12", "sec": 1452}, {"t": "0:33:07", "sec": 1987}, {"t": "0:45:11", "sec": 2711}, {"t": "0:54:42", "sec": 3282}, {"t": "1:05:22", "sec": 3922}, {"t": "1:06:07", "sec": 3967}, {"t": "1:18:27", "sec": 4707}, {"t": "1:24:33", "sec": 5073}, {"t": "1:31:23", "sec": 5483}, {"t": "1:36:51", "sec": 5811}, {"t": "1:37:41", "sec": 5861}], "coins": {"ep": "16", "events": [{"t": "0:36:50", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "обыскал барную стойку (проверка внимания/мудрости) и нашёл серебро на сумму две золотые монеты", "result": null, "sec": 2210, "who_url": "/c/vampir-bek/", "reason_html": "обыскал барную стойку (проверка внимания/мудрости) и нашёл серебро на сумму две золотые монеты"}, {"t": "0:56:39", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "сделал верный вывод, что уцелевший ребёнок побежит в приют, и полетел за ним первым", "result": null, "sec": 3399, "who_url": "/c/vampir-bek/", "reason_html": "сделал верный вывод, что уцелевший ребёнок побежит в приют, и полетел за ним первым"}, {"t": "1:00:11", "kind": "give", "who": "Граф Влад Сосунеску", "actor": "Кукушкин", "to": "Кукан Яка", "reason": "отдал монету Кукан Яке, чтобы тот прикрыл вампиров перед разъярённой толпой (Кукан Яка убедил его проверкой харизмы с помехой)", "result": null, "sec": 3611, "who_url": "/c/graf-vlad-sosunesku/", "reason_html": "отдал монету Кукан Яке, чтобы тот прикрыл вампиров перед разъярённой толпой (<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> убедил его проверкой харизмы с помехой)"}, {"t": "1:21:15", "kind": "spend", "who": "Адольф", "actor": "Пушкин", "to": null, "reason": "потратил монету, чтобы помочь уговорить/очаровать болотное чудовище пойти на «свидание» вместо нападения на детей", "result": "чудовище согласилось, конфликт временно предотвращён", "sec": 4875, "who_url": "/c/adolf/", "reason_html": "потратил монету, чтобы помочь уговорить/очаровать болотное чудовище пойти на «свидание» вместо нападения на детей"}, {"t": "1:40:52", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "базовая монета за прохождение приключения плюс бонусный бросок d6 (выпало максимальное значение — 6)", "result": "итого 7 золотых монет (70 000 руб.) отправлены в дом сиротки", "sec": 6052, "who_url": null, "reason_html": "базовая монета за прохождение приключения плюс бонусный бросок d6 (выпало максимальное значение — 6)"}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 3, "spent": 0, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}, {"who": "Граф Влад Сосунеску", "actor": "Кукушкин", "earned": 0, "spent": 1, "img": "img/chars/vlad-sosunesku.webp", "who_url": "/c/graf-vlad-sosunesku/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Кукан Яка", "actor": "Кукояка", "earned": 1, "spent": 0, "img": "img/chars/kukan-yaka.webp", "who_url": "/c/kukanyaka/", "actor_url": "/p/denis-kukoyaka/"}, {"who": "Адольф", "actor": "Пушкин", "earned": 0, "spent": 1, "img": "img/chars/adol-f.webp", "who_url": "/c/adolf/", "actor_url": "/p/kostya-pushkin/"}], "notes": "Партия играет за вампиров, спасающих сирот от нашествия саранчи и болотного монстра. Итоговый выигрыш — максимальный бонусный бросок d6 (6), итого 7 монет (70 000 руб.), отправлены в дом сиротки."}, "cast": [{"name": "Граф Влад Сосунеску", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "старший вампир", "role": "", "fate": "погиб (сожжён Адольфом)", "id": "Сосунеску", "url": "/c/graf-vlad-sosunesku/", "img": "img/chars/vlad-sosunesku.webp", "other": [{"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему вампиры убили графа: логика власти\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему вампиры убили графа: логика власти<\/b> Вампиры — властные существа, веками плетущие интриги, чтобы сместить соперника, убивая его «сыновей» и ставя своих. Граф пытался утвердить власть через авторитет, но за столом его никто не послушал. Остальные решили, что он ослаб и это удобный момент его убрать. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, по мнению <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, играл правильно: он не признавал авторитет графа и всё время демонстрировал силу. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa16-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кукушкин надеется на воскрешение графа Сосунеску\">29<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кукушкин надеется на воскрешение графа Сосунеску<\/b> Из своих погибших персонажей <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> больше всего хотел бы воскресить графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. По его словам, граф вёл себя «абсолютно адекватно», а остальные игроки могли его спасти. Кукушкин верит, что граф ещё каким-то образом воскреснет. <span class=\"note\">Никита Кукушкин отвечает на вопросы · <a href=\"https://youtu.be/sRvWxLpc8RE?t=589\" target=\"_blank\" rel=\"noopener\">0:09:49 ↗<\/a> · <a href=\"#qa-sRvWxLpc8RE-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему граф Сосунеску напал на Кукан Яку\">30<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему граф Сосунеску напал на Кукан Яку<\/b> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> объяснил, что граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> атаковал <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Яку, потому что тот вёл себя с графом непочтительно и не соблюдал старшинство. По словам актёра, такие непредсказуемые действия соответствовали логике персонажа. <span class=\"note\">Никита Кукушкин отвечает на вопросы · <a href=\"https://youtu.be/sRvWxLpc8RE?t=1024\" target=\"_blank\" rel=\"noopener\">0:17:04 ↗<\/a> · <a href=\"#qa-sRvWxLpc8RE-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Высший совет вампиров: изначально 13 древних\">32<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Высший совет вампиров: изначально 13 древних<\/b> Высший вампирский совет — «как ЦК КПСС»: изначально 13 древних вампиров. Убиты двое — граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> и <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a>; жена и сыновья Димитара были вампирами, но не членами совета. Остальные 11 членов пока неизвестны и ещё появятся — клан Балана не может спать спокойно. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep20.md у <a class=\"ref\" href=\"/c/helga/\">Хельги<\/a> и детей не уточнён статус — по словам авторов, они вампиры, но не члены высшего совета; высшим вампиром был только <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар<\/a> (сыновей было двое).<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1275\" target=\"_blank\" rel=\"noopener\">0:21:15 ↗<\/a> · <a href=\"#qa20-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Сосунеску не воскресить, но его кровь живёт в клане Балан\">33<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Сосунеску не воскресить, но его кровь живёт в клане Балан<\/b> <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> воскресить нельзя, однако его кровь и частичка есть в <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балане<\/a> и во всех «детях» его клана — и это, возможно, когда-нибудь на что-то повлияет. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1339\" target=\"_blank\" rel=\"noopener\">0:22:19 ↗<\/a> · <a href=\"#qa20-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Властона планировали связать с вампирами\">34<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Властона планировали связать с вампирами<\/b> <a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> с вампирами связан не был, но авторы собирались это сделать; смерть <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> «немного обрезала» эти планы. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1878\" target=\"_blank\" rel=\"noopener\">0:31:18 ↗<\/a> · <a href=\"#qa20-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Влад Сосунеску родился из рекламного скетча Кукушкина\">36<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Влад Сосунеску родился из рекламного скетча Кукушкина<\/b> Персонажи из рекламных вставок — часть лора. <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> впервые появился в рекламной интеграции: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> за 15 минут так проработал его речь и идеологию, что авторы решили ввести его в выпуск. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4510\" target=\"_blank\" rel=\"noopener\">1:15:10 ↗<\/a> · <a href=\"#qa20-34\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Задумка персонажа для Варнавы — вампирша Бьянка Сосунеску\">38<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Задумка персонажа для Варнавы — вампирша Бьянка Сосунеску<\/b> На просьбу <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнавы<\/a> сыграть «ужасно плохого», обольстительного и безжалостного персонажа авторы предложили бывшую жену графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a>: они ненавидели друг друга; в отличие от старомодного Влада, для которого люди — скот, она современнее и «толерантнее», за новые веяния, но очень жёсткая. Позже Варнава сыграла её в выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a>. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1916\" target=\"_blank\" rel=\"noopener\">0:31:56 ↗<\/a> · <a href=\"#qa22-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Состав Высшего вампирского совета: 12 членов, пятеро мертвы\">43<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b> Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 ↗<\/a> · <a href=\"#qa28-28\">к записи<\/a><\/span><\/span>"}, {"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, бывший охранник винной лавки", "role": "", "fate": "выжил, покинул группу посреди приключения", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Что было в карточке Дан Балана\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Что было в карточке Дан Балана<\/b> В карточке <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> было написано, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> едет к почитаемому графу — своему «отцу» — и что иерархия для него очень важна. Гудков эту установку почти не отыгрывал. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=997\" target=\"_blank\" rel=\"noopener\">0:16:37 ↗<\/a> · <a href=\"#qa16-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Почему Гудков (Дан Балан) ушёл посреди игры\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Почему Гудков (Дан Балан) ушёл посреди игры<\/b> Съёмка затянулась на четыре часа из-за долгой настройки звука. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> улетал поздним самолётом из Домодедово и уехал около 1:20 ночи, поэтому <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> покинул приключение. Второй «мотор» с <a class=\"ref\" href=\"/p/kostya-pushkin/\">Пушкиным<\/a> и <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукоякой<\/a> доигрывали примерно до трёх часов ночи. Авторы заметили, что Гудков мог бы эффектно погибнуть, например в таверне, а не просто уйти. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=2454\" target=\"_blank\" rel=\"noopener\">0:40:54 ↗<\/a> · <a href=\"#qa16-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Сосунеску не воскресить, но его кровь живёт в клане Балан\">33<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Сосунеску не воскресить, но его кровь живёт в клане Балан<\/b> <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> воскресить нельзя, однако его кровь и частичка есть в <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балане<\/a> и во всех «детях» его клана — и это, возможно, когда-нибудь на что-то повлияет. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1339\" target=\"_blank\" rel=\"noopener\">0:22:19 ↗<\/a> · <a href=\"#qa20-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: Рой крыс Дан Балана заменён роем челюстей\">37<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>Рой крыс Дан Балана заменён роем челюстей<\/b> Особая способность <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> сменилась с роя крыс на рой челюстей, потому что <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> забыл свою основную способность; челюсти подошли лучше — у старика вставная челюсть и запасные в сумке. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 ↗<\/a> · <a href=\"#qa20-36\">к записи<\/a><\/span><\/span>"}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "вампир, разговор с мёртвыми", "role": "", "fate": "выжил", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Молодые вампиры ещё пожалеют об убийстве графа\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Молодые вампиры ещё пожалеют об убийстве графа<\/b> Авторы признали, что «человечные» вампиры не соответствуют исходному лору, и намекнули, что они ещё пожалеют о содеянном. Старшего вампира с младшими связывают кровные узы: убив его, младший как минимум теряет силы. Кроме того, могут существовать другие старшие вампиры (по аналогии с Вольтури из «Сумерек»), которые такого не простят. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=891\" target=\"_blank\" rel=\"noopener\">0:14:51 ↗<\/a> · <a href=\"#qa16-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Убийц старшего вампира должен судить Совет\">19<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Убийц старшего вампира должен судить Совет<\/b> В мире ПЧК обращённые не умирают вместе с убитым старшим вампиром. Но по вампирскому кодексу убийц высшего вампира должен судить Совет — намёк на последствия для <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4550\" target=\"_blank\" rel=\"noopener\">1:15:50 ↗<\/a> · <a href=\"#qa16-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску\">39<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b> Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">20<\/a> «Вампирское возмездие». <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 ↗<\/a> · <a href=\"#qa26-5\">к записи<\/a><\/span><\/span>"}, {"name": "Кукан Яка", "actor": "Денис Кукояка", "actor_url": "/p/denis-kukoyaka/", "race": "бывший речной гном и фамильяр, гибрид оборотня и вампира", "role": "", "fate": "неизвестно (ушёл с болотным чудовищем, в её логове)", "id": "Куканяка", "url": "/c/kukanyaka/", "img": "img/chars/kukan-yaka.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Кукан Яка не может без приглашения входить в дома\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Кукан Яка не может без приглашения входить в дома<\/b> <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — гибрид вампира и оборотня, и на нём лежит вампирское проклятие. Поэтому, как и прочие вампиры, он не может без приглашения входить в жилые дома, в какой бы форме ни был. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3182\" target=\"_blank\" rel=\"noopener\">0:53:02 ↗<\/a> · <a href=\"#qa16-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ликантропия в мире ПЧК\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ликантропия в мире ПЧК<\/b> Оборотнем становятся не по наследству, а от укуса. Выжив после укуса оборотня, человек примерно с 50-процентной вероятностью заражается; обращение занимает около двух недель. Дальше три пути: не контролировать себя и превращаться в зверя в полнолуние или при стрессе; научиться контролировать превращение; стать гибридом с промежуточной формой (полукрыса-получеловек), как <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4223\" target=\"_blank\" rel=\"noopener\">1:10:23 ↗<\/a> · <a href=\"#qa16-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему вампиры убили графа: логика власти\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему вампиры убили графа: логика власти<\/b> Вампиры — властные существа, веками плетущие интриги, чтобы сместить соперника, убивая его «сыновей» и ставя своих. Граф пытался утвердить власть через авторитет, но за столом его никто не послушал. Остальные решили, что он ослаб и это удобный момент его убрать. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, по мнению <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, играл правильно: он не признавал авторитет графа и всё время демонстрировал силу. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 ↗<\/a> · <a href=\"#qa16-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен\">31<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен<\/b> <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> вернулся за стол вампирской саги в выпуске, снятом накануне, но любовную линию с болотной тварью решили пока не развивать ради более важного сюжетного решения. Болотная тварь в будущем появится — исполнительницу ещё выбирали. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=343\" target=\"_blank\" rel=\"noopener\">0:05:43 ↗<\/a> · <a href=\"#qa20-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дан Балан не мог обратить Джейкока\">45<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дан Балан не мог обратить Джейкока<\/b> <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> не мог укусить <a class=\"ref\" href=\"/c/dzheykob/\">Джейкока<\/a> и сделать его вампиром: кровь оборотня отравила бы его, как кровь «гнома» в палатке. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал гибридом только потому, что его сначала укусила крыса-оборотень, а обратили его ещё в переходном (инкубационном) периоде. <span class=\"note\">Подкаст по #33 · <a href=\"https://youtu.be/bRRVr7jN2fA?t=4139\" target=\"_blank\" rel=\"noopener\">1:08:59 ↗<\/a> · <a href=\"#qa33-12\">к записи<\/a><\/span><\/span>"}, {"name": "Адольф", "actor": "Костя Пушкин", "actor_url": "/p/kostya-pushkin/", "race": "энергетический вампир, герцог из пустошей", "role": "", "fate": "выжил", "id": "Адольф", "url": "/c/adolf/", "img": "img/chars/adol-f.webp", "other": [{"key": "40", "label": "40", "title": "Паспорт хорошей твари"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Молодые вампиры ещё пожалеют об убийстве графа\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Молодые вампиры ещё пожалеют об убийстве графа<\/b> Авторы признали, что «человечные» вампиры не соответствуют исходному лору, и намекнули, что они ещё пожалеют о содеянном. Старшего вампира с младшими связывают кровные узы: убив его, младший как минимум теряет силы. Кроме того, могут существовать другие старшие вампиры (по аналогии с Вольтури из «Сумерек»), которые такого не простят. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=891\" target=\"_blank\" rel=\"noopener\">0:14:51 ↗<\/a> · <a href=\"#qa16-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Энергетическими вампирами становятся «по судьбе»\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Энергетическими вампирами становятся «по судьбе»<\/b> Энергетические вампиры, как <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>, ни от кого не заражаются: в какой-то момент у человека просто открывается способность высасывать энергию из других, «судьба сделала их такими». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4416\" target=\"_blank\" rel=\"noopener\">1:13:36 ↗<\/a> · <a href=\"#qa16-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Убийц старшего вампира должен судить Совет\">19<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Убийц старшего вампира должен судить Совет<\/b> В мире ПЧК обращённые не умирают вместе с убитым старшим вампиром. Но по вампирскому кодексу убийц высшего вампира должен судить Совет — намёк на последствия для <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4550\" target=\"_blank\" rel=\"noopener\">1:15:50 ↗<\/a> · <a href=\"#qa16-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»\">42<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»<\/b> <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> был спокоен, потому что мог телепортироваться в любой момент. Но его выстрел промахнулся, а <a class=\"ref\" href=\"/c/anton/\">Антону<\/a> удался бросок на переворот машины, который зал встретил овацией. Мастер в кадре бросил за <a class=\"ref\" href=\"/a/teleportator-pif-pafa/\">Пиф-Пафа<\/a>, и тот не вырвался (бросок вырезали). Иначе следующим ходом он бы телепортировался и ушёл крюком на крышу. Его телепорт — не дальний, а аналог заклинания «Туманный шаг» (около 30 футов), как у <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> в выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a>. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=5884\" target=\"_blank\" rel=\"noopener\">1:38:04 ↗<\/a> · <a href=\"#qa28-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Адольф — самозваный герцог пустоши и вернётся\">46<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Адольф — самозваный герцог пустоши и вернётся<\/b> Титул «герцог <a class=\"ref\" href=\"/place/pustosh/\">пустоши<\/a>» <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> придумал себе сам: настоящего звания нет, просто в проклятой пустоши он единственный живой, не считая скорпионов. Он, вероятно, знает, что произошло с <a class=\"ref\" href=\"/place/malestiya/\">Малестией<\/a>, и скоро вернётся в вампирскую ветку. <span class=\"note\">Подкаст по #36 · <a href=\"https://youtu.be/oEqxCRDdITw?t=3047\" target=\"_blank\" rel=\"noopener\">0:50:47 ↗<\/a> · <a href=\"#qa36-20\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Даниэль", "actor": "", "actor_url": null, "race": "", "role": "сирота-певец в пижаме единорога", "fate": "выжил, возвращён в Дом сиротки", "id": "Даниэль", "url": "/c/daniel/", "img": null, "other": []}, {"name": "Двое сирот", "actor": "", "actor_url": null, "race": "", "role": "спутники Даниэля", "fate": "выжили", "id": null, "url": null, "img": null, "other": []}, {"name": "Подростки-гопники", "actor": "", "actor_url": null, "race": "", "role": "хулиганы на беговелах", "fate": "двое съедены саранчой графа", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Подростков-гопников нарочно нарисовали неприятными\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Подростков-гопников нарочно нарисовали неприятными<\/b> Чтобы зрителям было не так жалко подростков, которых граф скормил саранче, художники нарисовали их максимально неприятными уличными хулиганами и даже добавили сигарету. В сценарии их смерть была описана гораздо жутче, чем на рисунке. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3090\" target=\"_blank\" rel=\"noopener\">0:51:30 ↗<\/a> · <a href=\"#qa16-11\">к записи<\/a><\/span><\/span>"}, {"name": "Бебич", "actor": "", "actor_url": null, "race": "", "role": "пропавший сирота-артист", "fate": "жив, в плену в логове чудовища", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Граф не убивал Бебича\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Граф не убивал Бебича<\/b> По дневнику сироты решили, что Бебича утащило чудище из поместья, и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> обвинил в этом графа. На самом деле граф его не убивал: Бебич висел в логове болотной твари. Опытный игрок мог спросить мастера, убивал ли граф Бебича, получить бросок на знание — и тайна раскрылась бы сразу. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3753\" target=\"_blank\" rel=\"noopener\">1:02:33 ↗<\/a> · <a href=\"#qa16-18\">к записи<\/a><\/span><\/span>"}, {"name": "Егор Шип", "actor": "", "actor_url": null, "race": "", "role": "пропавший сирота-артист", "fate": "неизвестно", "id": "Егор Шип", "url": "/c/egor-ship/", "img": null, "other": []}, {"name": "Эльф-торговец", "actor": "", "actor_url": null, "race": "", "role": "хозяин Дома сиротки", "fate": "выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранные локации: изнанка «Дома сиротки» и «Цвет Банк»\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранные локации: изнанка «Дома сиротки» и «Цвет Банк»<\/b> Герои не попали внутрь «Дома сиротки». Эльф-торговец, его директор, наживался на сиротах: половину дома занимали комнаты с деньгами, другую — бараки для детей. В деревне был и непосещённый «банк мёртвых» «Цвет Банк», банк Цветущей <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Лозы<\/a>. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3390\" target=\"_blank\" rel=\"noopener\">0:56:30 ↗<\/a> · <a href=\"#qa16-15\">к записи<\/a><\/span><\/span>"}, {"name": "Нина", "actor": "", "actor_url": null, "race": "", "role": "болотное чудовище, мать двух детёнышей", "fate": "выжила, ушла с Кукан Якой", "id": "Нина", "url": "/c/nina/", "img": "img/chars/nina.webp", "other": [{"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Пол и размножение болотной твари не определены\">11<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Пол и размножение болотной твари не определены<\/b> Все решили, что болотная тварь — самка, но её «не исследовали». Авторы предположили, что она могла размножиться почкованием или, как некоторые жабы, самооплодотворением. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3259\" target=\"_blank\" rel=\"noopener\">0:54:19 ↗<\/a> · <a href=\"#qa16-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему граф не знал о болотной твари\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему граф не знал о болотной твари<\/b> Деревня была охотничьими угодьями графа, а болотная тварь только что родила двух детёнышей и потому стала охотиться агрессивнее, чем раньше. Отсюда её реплика «я же мать». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3545\" target=\"_blank\" rel=\"noopener\">0:59:05 ↗<\/a> · <a href=\"#qa16-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Болотную тварь звали Нина, не Тина\">22<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Болотную тварь звали Нина, не Тина<\/b> Зрители спорили, как зовут болотну
