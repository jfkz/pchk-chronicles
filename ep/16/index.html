<script>window.EPD = {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "date": "2023-03-08", "minutes": 104, "duration": 6238.0, "video_id": "iJIxr6EtT68", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Мёртвые топи: деревня Цветущая Лоза, поместье графа, винодельня", "short_html": "Вампиры клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> с гибридом <a class=\"ref\" href=\"/c/kukanyaka/\">Куканякой<\/a> и энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> приезжают на день перерождения графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> в Мёртвые топи и должны заставить молчать подростков, разбудивших графа в гробу. Поиски в Цветущей Лозе приводят к пожару в таверне, убийствам и ссорам графа с Куканякой. У винодельни они находят сирот и болотное чудовище, в которое влюбляется Куканяка и уходит с ним. Раскаявшиеся <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> и Адольф спасают сирот и сжигают графа, а селяне сжигают его поместье.", "summary_html": "Продолжение вампирской ветви (вып. 12). <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> приглашает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> и Вампира Бека на свой «день перерождения» в Мёртвые топи; с ними едут гибрид <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> и энергетический вампир <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>. Днём подростки-сироты пробрались в поместье графа и тыкали его палкой в гробу, поэтому вампиры должны найти их и заставить молчать, пока селяне не сожгли поместье. Поиски в деревне Цветущая Лоза оборачиваются сожжённой таверной, убийствами и расколом группы. У винодельни вампиры находят подростков и болотное чудовище Тину. Куканяка влюбляется в чудовище и уходит с ним, а <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> и Адольф, раскаявшись, спасают сирот и сжигают графа. Селяне сжигают поместье.", "outcome_html": "<a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> сожжён, сироты спасены Вампиром Беком и <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> ушёл с болотным чудовищем, его судьба неизвестна.", "world_html": ["<a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a>, старший вампир Мёртвых топей, уничтожен", "Поместье графа сожжено селянами Цветущей Лозы", "Таверна «Весёлый утопец» и винодельня Цветущей Лозы уничтожены", "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> покинул клан ради болотного чудовища", "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> встали на сторону сирот"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Рекламная рамка: мёртвая летучая мышь, которая несколько месяцев ехала почтой, приносит <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> и Вампиру Беку приглашение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> на день перерождения в Мёртвые топи; Дан Балан жалуется на расходы."}, {"t": "0:05:32", "sec": 332, "html": "Вводная: деревня Цветущая Лоза выращивает на болотах виноград, вино дешёвое, «даёт в голову» из-за болотных газов. Рядом заброшенное поместье: граф сам пустил слух, что там был лепрозорий. Его фамильяр недавно умер, днём поместье осталось без охраны, и подростки разбудили его, тыкая палкой в гробу. Задача — найти их и заставить молчать."}, {"t": "0:08:46", "sec": 526, "html": "Представление: граф (веками маскирует убийства под несчастные случаи), <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (граф обратил его в старости; привёз «дорогой подарок»), <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> (приехал в отпуск), <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> (в одну ночь его укусили крыса-оборотень и вампир, он принял обе болезни, не боится солнца; старшие вампиры помнят, что он был их фамильяром), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> (энергетический вампир, питается негативными эмоциями и может «заговорить» жертву до смерти). Механика очков крови и энергии."}, {"t": "0:15:21", "sec": 921, "html": "Одного подростка граф запомнил: пижама-единорог и брекеты. Таверна «Весёлый утопец»: граф выдаёт себя за отца пропавших «ребятишек», трактирщик говорит, что там поёт сирота <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> в пижаме единорога; сегодня он не пришёл. Граф внушением заставляет трактирщика налить всем за «уже оплаченный» счёт."}, {"t": "0:20:45", "sec": 1245, "html": "Вампиров тошнит от вина «Цветущая Лоза». Старуха в чёрном узнаёт <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, которого видела 70 лет назад. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> выкачивает из трактирщика энергию нудными «фактами» («собаки не мяукают») и замечает у того арбалет с серебряным болтом. Дан Балан брызгает старухе в глаза чесночным спреем."}, {"t": "0:29:30", "sec": 1770, "html": "Граф парализует взглядом вышибалу Дмитрия. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> добивает трактирщика «утомительным диалогом». <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> стреляет трактирщику в ногу его же серебряным болтом и кричит, что тот «был вампиром»."}, {"t": "0:32:52", "sec": 1972, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> воем призывает белого волка; посетители выбегают его убивать. Вампиры выпивают парализованного вышибалу, Куканяка под видом приёма Геймлиха выпивает старуху. Бек находит 2 золотых и записку: трактирщик покупает выступления <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a> у эльфа-торговца из «Дома сиротки»."}, {"t": "0:37:08", "sec": 2228, "html": "Одну из комнат защищает магический барьер (нужно приглашение). Граф и <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> ссорятся из-за старшинства: граф вонзает когти гному в зад и держит его как перчаточную куклу, Куканяка метит графа мочой оборотня (помеха на все броски), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> «гадит на обоих». Кто-то бросает на стул горящее полено — вино взрывается как коктейль Молотова, таверна сгорает. Граф улетает мышью через канализацию, Адольф уходит «быстрым шагом»."}, {"t": "0:48:56", "sec": 2936, "html": "Селяне добивают волка; <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> бьёт крестьянина кулаком в лицо, и толпа его окружает. Граф мышью находит трёх подростков-гопников на беговелах; они издеваются над его «кринжем» и «традиционными ценностями», граф выпускает на них рой саранчи, двое съедены заживо. Граф платит свидетелю монету, чтобы тот свалил всё на «злобного оборотня»."}, {"t": "1:01:57", "sec": 3717, "html": "«Дом сиротки»: барьер не пускает, <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a>, накрасившись «девочкой-сироткой», не может уговорить эльфа-торговца. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> представляется новым хозяином таверны и получает дневник <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a> (у торговца пропали и другие «звёзды» — Беби и <a class=\"ref\" href=\"/c/egor-ship/\">Егор Шип<\/a>)."}, {"t": "1:06:13", "sec": 3973, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> уходит из игры («УЗИ мочевого пузыря»). По дневнику: пропал Беби, дети решили, что его утащил монстр, выследили вампира в поместье и втроём полезли его убить днём; у них тайный шалаш на болотах у винодельни."}, {"t": "1:08:22", "sec": 4102, "html": "В шалаше — спальники, открытки с героями, три коктейля Молотова из вина и огниво (их забирают). Слышится рёв чудовища. У сторожки — растерзанный сторож; Бек, получив очко крови от <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяки<\/a> («Вечный слуга»), говорит с мёртвым: убийца — огромная «Тина Болотная», она гналась за тремя подростками к винодельне."}, {"t": "1:12:46", "sec": 4366, "html": "Выбивание двери: <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> бьётся головой, граф «гладит» дверь ногой, Бек заходит через незапертую вторую дверь. За бочками прячутся <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a>, ещё один мальчик и девочка. Граф, решив ударить в дверь двумя ногами, влетает в давильню (6 урона) и бросается на детей; Бек колеблется и защищает их."}, {"t": "1:18:06", "sec": 4686, "html": "Врывается болотное чудовище — самка-мать, которой нужно мясо для детей. <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> говорит с ней (разговор с животными) и зовёт на свидание, тратя монету, — она соглашается. Куканяка отдаёт подросткам две бутылки с горючей смесью."}, {"t": "1:22:27", "sec": 4947, "html": "<a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> бросает бутылку в графа, пол вспыхивает; граф уходит по потолку. Бек бросает бочку горючего вина в огонь. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>, «осознав, что мы нелюди», критически попадает бутылкой в графа (14 урона)."}, {"t": "1:26:47", "sec": 5207, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> решает уйти с возлюбленной, но напоследок даёт графу своё очко крови для честного поединка. Граф подпирает дверь телегой, запирая <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, Бека и детей в горящей винодельне. Бек и Адольф вышибают дверь, подростки выбираются. Куканяка произносит речь о любви («что было в Вегасе…») и уезжает на чудовище."}, {"t": "1:31:08", "sec": 5468, "html": "Винодельня взрывается: граф, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> и подростки без сознания, на ногах остаётся только Бек. Он отказывается пить кровь детей, стабилизирует Адольфа, и они решают отнести сирот в «Дом сиротки» и взять с них клятву молчать."}, {"t": "1:35:31", "sec": 5731, "html": "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> «дарит» графу подарок на день перерождения — канистру бензина — и сжигает его дотла."}, {"t": "1:37:39", "sec": 5859, "html": "Эпилог: разгневанные селяне находят в поместье вампирский гроб и сжигают поместье. Сцена с <a class=\"ref\" href=\"/c/kukanyaka/\">Куканякой<\/a> в логове чудовища: под потолком висит живой изможденный Беби, чудовище предлагает Куканяке съесть ребёнка; тот отказывается и предлагает съесть его самого, «а потом Беби — ваш выбор». Клиффхэнгер."}, {"t": "1:40:49", "sec": 6049, "html": "Одна монета + 6 по броску Кости: 70 000 руб. в фонд сирот. Финальная песня «Сиротки из Мёртвых топей» (Сироткин)."}], "key_events": [{"t": "0:06:36", "sec": 396}, {"t": "0:25:09", "sec": 1509}, {"t": "0:34:00", "sec": 2040}, {"t": "0:44:39", "sec": 2679}, {"t": "0:55:30", "sec": 3330}, {"t": "1:05:09", "sec": 3909}, {"t": "1:06:13", "sec": 3973}, {"t": "1:18:06", "sec": 4686}, {"t": "1:24:37", "sec": 5077}, {"t": "1:31:08", "sec": 5468}, {"t": "1:36:35", "sec": 5795}, {"t": "1:37:39", "sec": 5859}], "coins": null, "cast": [{"name": "Граф Влад Сосунеску", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "старший вампир", "role": "", "fate": "погиб (сожжён Адольфом)", "id": "Сосунеску", "url": "/c/graf-vlad-sosunesku/", "img": "img/chars/vlad-sosunesku.webp", "other": [{"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}]}, {"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, бывший охранник винной лавки", "role": "", "fate": "выжил, покинул группу посреди приключения", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Вампир Бек", "actor": "BRB
