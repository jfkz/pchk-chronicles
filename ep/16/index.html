ю тварь — <a class=\"ref\" href=\"/c/nina/\">Нина<\/a> или Тина. В статблоке монстра она записана как Нина; ведущие лишь пошутили, что «Тина» подошло бы болотной твари больше. Канон — Нина (в выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a> её играет <a class=\"ref\" href=\"/p/lena-kukoyaka/\">Лена Кукояка<\/a>). <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep16.md (раздел «Кратко») чудовище названо «Тиной»; правильно — <a class=\"ref\" href=\"/c/nina/\">Нина<\/a>, как в разделе «Персонажи» того же конспекта.<\/span> <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5337\" target=\"_blank\" rel=\"noopener\">1:28:57 ↗<\/a> · <a href=\"#qa16-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен\">31<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен<\/b> <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> вернулся за стол вампирской саги в выпуске, снятом накануне, но любовную линию с болотной тварью решили пока не развивать ради более важного сюжетного решения. Болотная тварь в будущем появится — исполнительницу ещё выбирали. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=343\" target=\"_blank\" rel=\"noopener\">0:05:43 ↗<\/a> · <a href=\"#qa20-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву\">40<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву<\/b> Сначала на роль болотной твари авторы хотели позвать Артура Бабича, затем Илью <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, а в итоге позвали Лену, жену <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a>, чтобы сыграла настоящая супружеская пара. Изначально болотная тварь была просто монстром, которого надо было убить в сцене с сиротками, но <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> выбрал любовь. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5255\" target=\"_blank\" rel=\"noopener\">1:27:35 ↗<\/a> · <a href=\"#qa26-25\">к записи<\/a><\/span><\/span>"}, {"name": "Трактирщик «Весёлого утопца»", "actor": "", "actor_url": null, "race": "", "role": "держал серебряный арбалет", "fate": "погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Трактирщик должен был оказаться охотником; план мастера\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Трактирщик должен был оказаться охотником; план мастера<\/b> Таверна задумывалась как песочница с несколькими зацепками — пьяницей и старухой, и обе сработали. Не сработал только трактирщик: он должен был раскрыться как убийца-охотник (на демонов/нечисть), но <a class=\"ref\" href=\"/c/adolf/\">Адольфу<\/a> повезло с бросками, он заметил арбалет и выкачал из трактирщика энергию. Жёсткого плана не было, только цепочка подсказок: сироту зовут <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> → он в «Доме сиротки» → он на винограднике → появляется монстр. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5059\" target=\"_blank\" rel=\"noopener\">1:24:19 ↗<\/a> · <a href=\"#qa16-25\">к записи<\/a><\/span><\/span>"}, {"name": "Старуха в чёрном", "actor": "", "actor_url": null, "race": "", "role": "помнила Дан Балана", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Вышибала Дмитрий", "actor": "", "actor_url": null, "race": "", "role": "вышибала таверны", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Сторож винодельни", "actor": "", "actor_url": null, "race": "", "role": "жертва чудовища", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "Продолжение: Бесагон, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал вампиром, клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "Костюм гнома Кукан Яки (вампирская ветвь)", "dir": "back", "color": "#7C5CD6"}, {"key": "20", "label": "20", "title": "Вампирское возмездие", "note_html": "Следующий выпуск вампирской ветви", "dir": "out", "color": "#B03A7A"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "note_html": "Убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика", "note_html": "Клан Балан убил графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и Нина из Мёртвых топей", "dir": "back", "color": "#B03A7A"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Сожжение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "48", "label": "48", "title": "Ночь в музее", "note_html": "Вампирская ветвь", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["Граф: «Я за традиционные ценности, и в этой парадигме взрослые не ошибаются». — Подросток: «Чел, ты слит».", "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>: «А ты знал, что собаки не мяукают?»", "Граф Кукан Яке: «Я здесь граф, а не ты».", "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>: «Я верю, что только любовь может спасти мир».", "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>: «Самых ярких надо в первую очередь убивать»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> — историческая родина вампиров; деревня <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>; таверна «Весёлый утопец» (сгорела); поместье графа — «бывший лепрозорий» (сожжено селянами); «Дом сиротки»; шалаш сирот на болотах; винодельня (взорвана); логово болотного чудовища.<\/li>\n<li>Фракции: клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (вампиры), селяне Цветущей Лозы, сироты эльфа-торговца.<\/li>\n<li>Артефакты и предметы: вино «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>» (горючее и взрывоопасное из-за болотных газов), серебряные арбалетные болты, чесночный спрей <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, дневник <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a>, коктейли Молотова из вина, канистра бензина — «подарок» <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>47<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>47<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>11<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>14<\/small><\/button><button class=\"chip ptf t-retcon\" data-t=\"retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>8<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>12<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa16-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Рабочее название — «Сиротки из Мёртвых топей»<\/b><\/div><p>Во внутренних документах выпуск <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> назывался «Сиротки из <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвых топей<\/a>». Финальную песню про сироток Сироткин написал по пересказу сюжета, не видев выпуск. Название сменили на «Вампиры Мёртвых топей» ради узнаваемости: вампиры уже были в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a>.<\/p><blockquote>«16 выпуск «Вампиры из Мёртвых топей» изначально назывался в наших документах «Сиротки из Мёртвых топей»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-1\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=163\" target=\"_blank\" rel=\"noopener\">0:02:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa16-2\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Бой игроков против графа не планировали<\/b><\/div><p>Авторы давно хотели устроить в финале логичный бой между персонажами игроков, но не знали, как сделать это естественно. В выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> так сложилось само: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> ушёл, а <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, которого <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> играл «по-человечески», решил убить графа. Граф вёл себя как чёткий злодей, а между ним и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Якой — вампиром нового поколения — назревал конфликт поколений.<\/p><blockquote>«мы давно хотели сделать механику боя между персонажами в финале приключения… а тут сложилось»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-2\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=545\" target=\"_blank\" rel=\"noopener\">0:09:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa16-3\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Молодые вампиры ещё пожалеют об убийстве графа<\/b><\/div><p>Авторы признали, что «человечные» вампиры не соответствуют исходному лору, и намекнули, что они ещё пожалеют о содеянном. Старшего вампира с младшими связывают кровные узы: убив его, младший как минимум теряет силы. Кроме того, могут существовать другие старшие вампиры (по аналогии с Вольтури из «Сумерек»), которые такого не простят.<\/p><blockquote>«если ты убиваешь старшего вампира, то ты как минимум теряешь силы»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-3\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=891\" target=\"_blank\" rel=\"noopener\">0:14:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-4\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Что было в карточке Дан Балана<\/b><\/div><p>В карточке <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> было написано, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> едет к почитаемому графу — своему «отцу» — и что иерархия для него очень важна. Гудков эту установку почти не отыгрывал.<\/p><blockquote>«ты приехал к почитаемому тобой графу, который твой отец, и всё для тебя, и иерархия для тебя очень важна»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-4\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=997\" target=\"_blank\" rel=\"noopener\">0:16:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Правило приглашения: вампиры свободно входят в общественные места<\/b><\/div><p>По правилам шоу вампиры входят в общественные места (таверны) без приглашения, а в жилые помещения — нет. Поэтому в таверне «Весёлый утопец» герои не смогли войти в комнату трактирщика, защищённую барьером: хозяин, который мог их пригласить, был уже убит. На вопрос, почему в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a> понадобилось приглашение в кузницу, авторы отшутились.<\/p><blockquote>«в общественные места вампиры могут заходить без приглашения, в жилые помещения заходить без приглашения не могут»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-7\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1597\" target=\"_blank\" rel=\"noopener\">0:26:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa16-8\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему Гудков (Дан Балан) ушёл посреди игры<\/b><\/div><p>Съёмка затянулась на четыре часа из-за долгой настройки звука. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> улетал поздним самолётом из Домодедово и уехал около 1:20 ночи, поэтому <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> покинул приключение. Второй «мотор» с <a class=\"ref\" href=\"/p/kostya-pushkin/\">Пушкиным<\/a> и <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукоякой<\/a> доигрывали примерно до трёх часов ночи. Авторы заметили, что Гудков мог бы эффектно погибнуть, например в таверне, а не просто уйти.<\/p><blockquote>«очень долго звук настраивали, супер затянули всё на 4 часа, и то, что ребята доигрывали, — это был второй мотор»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa16/#qa16-8\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=2454\" target=\"_blank\" rel=\"noopener\">0:40:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa16-9\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Вампирская ветка ведёт к дестабилизации столицы<\/b><\/div><p>Сюжет каждого выпуска пишут после того, как известен итог предыдущего, но общий вектор у ветвей есть. Ещё в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a> обсуждали, почему столицу до сих пор не захватили и почему выгодно стравить вампиров с оборотнями. Глобальной задачей Бесагона была дестабилизация столицы. Действие будет всё больше переноситься в столицу, и для неё заказали карту. <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> связан с «зоной разлома», на тех же землях находится и <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a>; «всё связано, даже если кажется, что не связано».<\/p><blockquote>«глобальная задача была в двенадцатом выпуске у того же Бесагона — дестабилизировать ситуацию в столице»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-9\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=2746\" target=\"_blank\" rel=\"noopener\">0:45:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Почему Иделаида и Антон не поехали к графу<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> и <a class=\"ref\" href=\"/c/anton/\">Антон<\/a> не поехали к <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Владу Сосунеску<\/a>, авторы прямо не ответили. Прозвучали версии, что граф их не пригласил или что они с ним незнакомы, хотя <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> заметил, что они «кровь его крови».<\/p><p class=\"note\"><a href=\"/pod/qa16/#qa16-10\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3008\" target=\"_blank\" rel=\"noopener\">0:50:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa16-11\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Подростков-гопников нарочно нарисовали неприятными<\/b><\/div><p>Чтобы зрителям было не так жалко подростков, которых граф скормил саранче, художники нарисовали их максимально неприятными уличными хулиганами и даже добавили сигарету. В сценарии их смерть была описана гораздо жутче, чем на рисунке.<\/p><blockquote>«чтобы их было не жалко, их сделали максимально плохими… пририсовали сигарету»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-11\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3090\" target=\"_blank\" rel=\"noopener\">0:51:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кукан Яка не может без приглашения входить в дома<\/b><\/div><p><a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — гибрид вампира и оборотня, и на нём лежит вампирское проклятие. Поэтому, как и прочие вампиры, он не может без приглашения входить в жилые дома, в какой бы форме ни был.<\/p><blockquote>«его половина — это вампирская половина, на нём проклятие вампира»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-12\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3182\" target=\"_blank\" rel=\"noopener\">0:53:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-13\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Пол и размножение болотной твари не определены<\/b><\/div><p>Все решили, что болотная тварь — самка, но её «не исследовали». Авторы предположили, что она могла размножиться почкованием или, как некоторые жабы, самооплодотворением.<\/p><blockquote>«все решили, что это женщина, но её не исследовали на самом деле»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-13\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3259\" target=\"_blank\" rel=\"noopener\">0:54:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-14\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампиры не могут ни есть, ни пить человеческое<\/b><\/div><p>Вампиров тошнило от <a class=\"ref\" href=\"/a/vino-cvetushchaya-loza/\">вина<\/a> не потому, что оно горючее: вампиры вообще не могут употреблять еду и питьё для обычных гуманоидов. Организм сразу всё отторгает.<\/p><blockquote>«они на самом деле вообще не могли ничего пить, не есть, потому что они являются вампирами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-14\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3324\" target=\"_blank\" rel=\"noopener\">0:55:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa16-15\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранные локации: изнанка «Дома сиротки» и «Цвет Банк»<\/b><\/div><p>Герои не попали внутрь «Дома сиротки». Эльф-торговец, его директор, наживался на сиротах: половину дома занимали комнаты с деньгами, другую — бараки для детей. В деревне был и непосещённый «банк мёртвых» «Цвет Банк», банк Цветущей <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Лозы<\/a>.<\/p><blockquote>«в доме сиротки половина дома — это комнаты с деньгами, а другая часть — это бараки»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-15\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3390\" target=\"_blank\" rel=\"noopener\">0:56:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-17\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему граф не знал о болотной твари<\/b><\/div><p>Деревня была охотничьими угодьями графа, а болотная тварь только что родила двух детёнышей и потому стала охотиться агрессивнее, чем раньше. Отсюда её реплика «я же мать».<\/p><blockquote>«она родила только что двух детей и стала более агрессивно охотиться»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-17\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3545\" target=\"_blank\" rel=\"noopener\">0:59:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-18\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Граф не убивал Бебича<\/b><\/div><p>По дневнику сироты решили, что Бебича утащило чудище из поместья, и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> обвинил в этом графа. На самом деле граф его не убивал: Бебич висел в логове болотной твари. Опытный игрок мог спросить мастера, убивал ли граф Бебича, получить бросок на знание — и тайна раскрылась бы сразу.<\/p><blockquote>«Кукушкин мог сказать мастеру: а я убивал Бебича? Я не помню, чтобы я его убивал»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-18\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3753\" target=\"_blank\" rel=\"noopener\">1:02:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-19\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему сироты не кидали спасброски от смерти<\/b><\/div><p>Спасброски от смерти кидают только игровые персонажи. За NPC мастер бросает за кадром или не бросает вовсе. Выбор между графом и сиротами герои уже сделали, и второй бросок «выживут ли дети» обесценил бы этот выбор. К тому же во «втором финале» выяснилось, что граф не убивал Бебича и погиб незаслуженно.<\/p><blockquote>«выбор был сделан уже — спасти графа или спасти сирот, и делать второй бросок, выживут или не выживут, смысла нет»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa16/#qa16-19\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3951\" target=\"_blank\" rel=\"noopener\">1:05:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ликантропия в мире ПЧК<\/b><\/div><p>Оборотнем становятся не по наследству, а от укуса. Выжив после укуса оборотня, человек примерно с 50-процентной вероятностью заражается; обращение занимает около двух недель. Дальше три пути: не контролировать себя и превращаться в зверя в полнолуние или при стрессе; научиться контролировать превращение; стать гибридом с промежуточной формой (полукрыса-получеловек), как <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>.<\/p><blockquote>«у нас оборотень должен укусить обычного человека… есть вероятность примерно 50 процентов, что ты заразишься»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-20\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4223\" target=\"_blank\" rel=\"noopener\">1:10:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Энергетическими вампирами становятся «по судьбе»<\/b><\/div><p>Энергетические вампиры, как <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>, ни от кого не заражаются: в какой-то момент у человека просто открывается способность высасывать энергию из других, «судьба сделала их такими».<\/p><blockquote>«они просто появляются из жизни, судьба сделала их такими»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-21\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4416\" target=\"_blank\" rel=\"noopener\">1:13:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa16-22\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Убийц старшего вампира должен судить Совет<\/b><\/div><p>В мире ПЧК обращённые не умирают вместе с убитым старшим вампиром. Но по вампирскому кодексу убийц высшего вампира должен судить Совет — намёк на последствия для <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>.<\/p><blockquote>«за убийство верховного вампира их должны судить на Совете»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-22\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4550\" target=\"_blank\" rel=\"noopener\">1:15:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампирам нужны свои гробы с родной землёй<\/b><\/div><p>Вампиры приехали в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> со своими гробами. Если те сгорели вместе с поместьем, им придётся тяжело, но не смертельно: их прародители родом из Мёртвых топей, а родная земля помогает. В гробу лежит земля, и над ним нужно провести ритуал, чтобы он давал силы. Поэтому в выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">12<\/a> вампиры искали именно свои гробы, а не брали любые в похоронном бюро.<\/p><blockquote>«надо провести ритуал, чтобы этот гроб стал давать тебе силы… поэтому в двенадцатом выпуске вы побежали искать свои гробы»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa16/#qa16-23\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4655\" target=\"_blank\" rel=\"noopener\">1:17:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-25\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Трактирщик должен был оказаться охотником; план мастера<\/b><\/div><p>Таверна задумывалась как песочница с несколькими зацепками — пьяницей и старухой, и обе сработали. Не сработал только трактирщик: он должен был раскрыться как убийца-охотник (на демонов/нечисть), но <a class=\"ref\" href=\"/c/adolf/\">Адольфу<\/a> повезло с бросками, он заметил арбалет и выкачал из трактирщика энергию. Жёсткого плана не было, только цепочка подсказок: сироту зовут <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> → он в «Доме сиротки» → он на винограднике → появляется монстр.<\/p><blockquote>«кроме, наверное, тавернщика, который должен был раскрыться в качестве убийцы, охотника на демонов»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa16/#qa16-25\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5059\" target=\"_blank\" rel=\"noopener\">1:24:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa16-26\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Болотную тварь звали Нина, не Тина<\/b><\/div><p>Зрители спорили, как зовут болотную тварь — <a class=\"ref\" href=\"/c/nina/\">Нина<\/a> или Тина. В статблоке монстра она записана как Нина; ведущие лишь пошутили, что «Тина» подошло бы болотной твари больше. Канон — Нина (в выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a> её играет <a class=\"ref\" href=\"/p/lena-kukoyaka/\">Лена Кукояка<\/a>).<\/p><blockquote>«Нина, Тина… как ты думаешь, надо было её назвать Нина или Тина?»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep16.md (раздел «Кратко») чудовище названо «Тиной»; правильно — <a class=\"ref\" href=\"/c/nina/\">Нина<\/a>, как в разделе «Персонажи» того же конспекта.<\/p><p class=\"note\"><a href=\"/pod/qa16/#qa16-26\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5337\" target=\"_blank\" rel=\"noopener\">1:28:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-27\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампир пьёт кровь целую минуту и в это время беззащитен<\/b><\/div><p>Граф не выпил пьяницу, а заплатил ему монету, потому что не хватало времени. Селяне добежали бы за 1–4 хода (до 24 секунд), а вампир пьёт кровь около минуты, и всё это время и он, и жертва обездвижены. По словам авторов, это главная слабость вампиров, иначе они были бы «вообще боги».<\/p><blockquote>«все пьют кровь минуту… в тот момент, когда он пьёт, и тот и тот обездвиженный — вот это их слабость, иначе они вообще боги»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-27\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5431\" target=\"_blank\" rel=\"noopener\">1:30:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-29\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>«Традиционные ценности» вампиров<\/b><\/div><p>Из выпуска известны такие вампирские «традиционные ценности»: не блевать в сюртуках, старшие не ошибаются, старших надо уважать и давать им деньги по первому требованию. Старшинство держится на силе: ты старший, пока силён. Остальные ценности, возможно, раскроют позже.<\/p><blockquote>«не блевать в сюртуках, старшие не ошибаются, старших нужно уважать… давать деньги старшим по их первому требованию»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-29\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5878\" target=\"_blank\" rel=\"noopener\">1:37:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa16-30\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Канистра бензина — импровизация игрока, а не сценарий<\/b><\/div><p>Сожжение графа не планировали. В карточках игроков было написано только: придумай имя и подарок графу, держи его в секрете и подари в конце. Подарок <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> (канистру бензина) придумал <a class=\"ref\" href=\"/p/kostya-pushkin/\">Костя Пушкин<\/a>; <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> придумал для <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> вибратор.<\/p><blockquote>«в карточке было написано: придумай подарок и подари его в конце… не говори, скажи в конце»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-30\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5946\" target=\"_blank\" rel=\"noopener\">1:39:06 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-33\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему вампиры убили графа: логика власти<\/b><\/div><p>Вампиры — властные существа, веками плетущие интриги, чтобы сместить соперника, убивая его «сыновей» и ставя своих. Граф пытался утвердить власть через авторитет, но за столом его никто не послушал. Остальные решили, что он ослаб и это удобный момент его убрать. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, по мнению <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, играл правильно: он не признавал авторитет графа и всё время демонстрировал силу.<\/p><blockquote>«вампиры в целом проводят большие крупные интриги десятки, сотни лет для того, чтобы сместить власть другого»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-33\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=6500\" target=\"_blank\" rel=\"noopener\">1:48:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa17-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуски 16 и 17 снимали в один день; почему ушли Смирняга и Гудков<\/b><\/div><p>«Демонизацию» и «Вампиров Мёртвых топей» сняли в один день, и из-за проблем со звуком начало задержалось на 4 часа. Игроки два с половиной часа считали в микрофоны, звукорежиссёры ездили за новыми арендованными колонками, а приключение пришлось начинать заново. Вся съёмка шла около 7 часов. Смирняга просидел на шесть часов дольше обещанного и ушёл во втором акте из трёх. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> тоже должен был улетать, но отменил рейс, чтобы не уходить посреди игры.<\/p><blockquote>«мы снимали оба этих выпуска в один день… задержка была 4 часа задержка начала мотора… выпуск «Демонизация» снимался первый»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-1\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=307\" target=\"_blank\" rel=\"noopener\">0:05:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa17-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Демонизация» и «Вампиры Мёртвых топей» поменялись местами<\/b><\/div><p>«Демонизация» изначально стояла шестнадцатым выпуском, а вампирский — семнадцатым. Порядок поменяли, чтобы было время ещё раз пересмотреть сложную «Демонизацию» и привыкнуть к ней; смонтировали её в обычные сроки.<\/p><blockquote>«мы поменяли местами выходы этих выпусков: этот был шестнадцатый, стал семнадцатый, тот перешёл назад, с вампирами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-6\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2160\" target=\"_blank\" rel=\"noopener\">0:36:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa-sRvWxLpc8RE-2\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Кукушкин надеется на воскрешение графа Сосунеску<\/b><\/div><p>Из своих погибших персонажей <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> больше всего хотел бы воскресить графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. По его словам, граф вёл себя «абсолютно адекватно», а остальные игроки могли его спасти. Кукушкин верит, что граф ещё каким-то образом воскреснет.<\/p><blockquote>«я вёл себя абсолютно адекватно, вы могли его спасти… Я верю в то, что он ещё будет, он ещё каким-то образом воскреснет»<\/blockquote><p class=\"note\">Кукушкин · <a href=\"/pod/qa-sRvWxLpc8RE/#qa-sRvWxLpc8RE-2\">Никита Кукушкин отвечает на вопросы<\/a> · <a href=\"https://youtu.be/sRvWxLpc8RE?t=589\" target=\"_blank\" rel=\"noopener\">0:09:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa-sRvWxLpc8RE-4\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему граф Сосунеску напал на Кукан Яку<\/b><\/div><p><a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> объяснил, что граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> атаковал <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Яку, потому что тот вёл себя с графом непочтительно и не соблюдал старшинство. По словам актёра, такие непредсказуемые действия соответствовали логике персонажа.<\/p><blockquote>«Граф Сосунеску атаковал Кукан Яку, потому что позволил себя вести с графом абсолютно… не соблюдал»<\/blockquote><p class=\"note\">Кукушкин · <a href=\"/pod/qa-sRvWxLpc8RE/#qa-sRvWxLpc8RE-4\">Никита Кукушкин отвечает на вопросы<\/a> · <a href=\"https://youtu.be/sRvWxLpc8RE?t=1024\" target=\"_blank\" rel=\"noopener\">0:17:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-3\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен<\/b><\/div><p><a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> вернулся за стол вампирской саги в выпуске, снятом накануне, но любовную линию с болотной тварью решили пока не развивать ради более важного сюжетного решения. Болотная тварь в будущем появится — исполнительницу ещё выбирали.<\/p><blockquote>«мы решили не развивать, не трогать сейчас историю его и болотной твари любовную, потому что у нас было более важное сюжетное решение»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-3\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=343\" target=\"_blank\" rel=\"noopener\">0:05:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-10\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Высший совет вампиров: изначально 13 древних<\/b><\/div><p>Высший вампирский совет — «как ЦК КПСС»: изначально 13 древних вампиров. Убиты двое — граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> и <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a>; жена и сыновья Димитара были вампирами, но не членами совета. Остальные 11 членов пока неизвестны и ещё появятся — клан Балана не может спать спокойно.<\/p><blockquote>«древних их тринадцать было изначально… высшим вампиром был только Димитар Норд, его жена и дети не являлись»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep20.md у <a class=\"ref\" href=\"/c/helga/\">Хельги<\/a> и детей не уточнён статус — по словам авторов, они вампиры, но не члены высшего совета; высшим вампиром был только <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар<\/a> (сыновей было двое).<\/p><p class=\"note\"><a href=\"/pod/qa20/#qa20-10\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1275\" target=\"_blank\" rel=\"noopener\">0:21:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-11\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Сосунеску не воскресить, но его кровь живёт в клане Балан<\/b><\/div><p><a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> воскресить нельзя, однако его кровь и частичка есть в <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балане<\/a> и во всех «детях» его клана — и это, возможно, когда-нибудь на что-то повлияет.<\/p><blockquote>«кровь Влада Сосунеску и частичка Влада Сосунеску есть в Дан Балане, во всех его детях»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-11\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1339\" target=\"_blank\" rel=\"noopener\">0:22:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-17\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Властона планировали связать с вампирами<\/b><\/div><p><a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> с вампирами связан не был, но авторы собирались это сделать; смерть <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> «немного обрезала» эти планы.<\/p><blockquote>«Лорд Властон с вампирами не был связан, но мы собирались сделать, но смерть Влада Сосунеску чуть-чуть наши планы обрезала»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-17\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1878\" target=\"_blank\" rel=\"noopener\">0:31:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-24\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кто может пригласить вампира и что со взорванным домом<\/b><\/div><p>Пригласить вампира может только хозяин жилища — ни <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a>, ни <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Лука<\/a> не могли этого сделать. Если дом разрушен и перестал быть жильём, войти можно. В таверне «Весёлый утопец» вампиры могли входить в незанятые комнаты, но в арендованную — только по приглашению арендатора.<\/p><blockquote>«от хозяев жилища, всё верно»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-24\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2700\" target=\"_blank\" rel=\"noopener\">0:45:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Влад Сосунеску родился из рекламного скетча Кукушкина<\/b><\/div><p>Персонажи из рекламных вставок — часть лора. <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> впервые появился в рекламной интеграции: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> за 15 минут так проработал его речь и идеологию, что авторы решили ввести его в выпуск.<\/p><blockquote>«у нас был в интеграции этот граф Влад Сосунеску… он настолько продумал себе этого персонажа»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-34\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4510\" target=\"_blank\" rel=\"noopener\">1:15:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-retcon\" id=\"qa20-36\" data-type=\"retcon\"><div class=\"pn-h\"><sup class=fnn>37<\/sup><span class=\"ptype t-retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон<\/span><b>Рой крыс Дан Балана заменён роем челюстей<\/b><\/div><p>Особая способность <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> сменилась с роя крыс на рой челюстей, потому что <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> забыл свою основную способность; челюсти подошли лучше — у старика вставная челюсть и запасные в сумке.<\/p><blockquote>«вместо роя крыс у Дана Балана теперь рой челюстей, потому что это больше ему подходит»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-36\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa22-3\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>38<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Задумка персонажа для Варнавы — вампирша Бьянка Сосунеску<\/b><\/div><p>На просьбу <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнавы<\/a> сыграть «ужасно плохого», обольстительного и безжалостного персонажа авторы предложили бывшую жену графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a>: они ненавидели друг друга; в отличие от старомодного Влада, для которого люди — скот, она современнее и «толерантнее», за новые веяния, но очень жёсткая. Позже Варнава сыграла её в выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a>.<\/p><blockquote>«Бьянка Сосунеску… она бывшая жена графа Влада Сосунеску, им был Кукушкин, и они его грохнули»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-3\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1916\" target=\"_blank\" rel=\"noopener\">0:31:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>39<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b><\/div><p>Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">20<\/a> «Вампирское возмездие».<\/p><blockquote>«вместе с энергетическим вампиром по имени Адольф они сожгли графа Сосунеску, и Вампирбек, возможно, чувствуя некую вину за содеянное»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-5\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-25\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>40<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву<\/b><\/div><p>Сначала на роль болотной твари авторы хотели позвать Артура Бабича, затем Илью <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, а в итоге позвали Лену, жену <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a>, чтобы сыграла настоящая супружеская пара. Изначально болотная тварь была просто монстром, которого надо было убить в сцене с сиротками, но <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> выбрал любовь.<\/p><blockquote>«мы хотели Артура Бабича позвать... Потом мы хотели дать болотную тварь Соболеву»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-25\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=5255\" target=\"_blank\" rel=\"noopener\">1:27:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-33\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>41<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Солевая одноразка родилась из шутки в выпуске 20<\/b><\/div><p>Одноразку авторы положили в инвентарь Луки «<a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>» в выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">20<\/a> как шутку. Когда Лука погиб на корабле, она выпала у него из кармана, стала мемом, и в итоге в неё собрали <a class=\"ref\" href=\"/a/prah-vampirbeka-v-odnorazke/\">прах<\/a> <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы призвали игроков «оставлять следы»: например, фонарный столб <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан<\/a> Яки из выпуска <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> может ещё всплыть.<\/p><blockquote>«А у тебя из кармана выпадает солевая одноразка... И в эту солевую одноразку, опять же, это мем, туда помещают в итоге Вампирбека»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa26/#qa26-33\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=7319\" target=\"_blank\" rel=\"noopener\">2:01:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>42<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»<\/b><\/div><p><a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> был спокоен, потому что мог телепортироваться в любой момент. Но его выстрел промахнулся, а <a class=\"ref\" href=\"/c/anton/\">Антону<\/a> удался бросок на переворот машины, который зал встретил овацией. Мастер в кадре бросил за <a class=\"ref\" href=\"/a/teleportator-pif-pafa/\">Пиф-Пафа<\/a>, и тот не вырвался (бросок вырезали). Иначе следующим ходом он бы телепортировался и ушёл крюком на крышу. Его телепорт — не дальний, а аналог заклинания «Туманный шаг» (около 30 футов), как у <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> в выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a>.<\/p><blockquote>«Это не такой телепорт… это телепорт, равный заклинанию «Туманный шаг», как было у Адольфа в шестнадцатом выпуске.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-20\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5884\" target=\"_blank\" rel=\"noopener\">1:38:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>43<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b><\/div><p>Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво.<\/p><blockquote>«Семеро живы, пять мертвы, семь плюс пять — двенадцать, ребята.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-28\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-32\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>44<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему выпуск закончился тишиной, а не песней<\/b><\/div><p>Сюжетные песни писали под настроение: «Сиротки из Мёртвых топей» — по идее <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, песня к «Возвращению в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>» подчёркивала смерть <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>, а песню после «Судьбы <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» дали, чтобы сбить смех в финале. В выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">30<\/a> авторы намеренно оставили зрителя в тишине наедине с впечатлениями.<\/p><blockquote>«Здесь конкретно именно в этом выпуске хотелось, чтобы... ты наедине побыл с этими впечатлениями.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-32\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=8218\" target=\"_blank\" rel=\"noopener\">2:16:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa33-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>45<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Дан Балан не мог обратить Джейкока<\/b><\/div><p><a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> не мог укусить <a class=\"ref\" href=\"/c/dzheykob/\">Джейкока<\/a> и сделать его вампиром: кровь оборотня отравила бы его, как кровь «гнома» в палатке. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал гибридом только потому, что его сначала укусила крыса-оборотень, а обратили его ещё в переходном (инкубационном) периоде.<\/p><blockquote>«Почему Кукан Яка в тот момент стал? Потому что его укусила сначала крыса, а потом его обратили. У него ещё вот был он в переходном периоде.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-12\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=4139\" target=\"_blank\" rel=\"noopener\">1:08:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa36-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>46<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Адольф — самозваный герцог пустоши и вернётся<\/b><\/div><p>Титул «герцог <a class=\"ref\" href=\"/place/pustosh/\">пустоши<\/a>» <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> придумал себе сам: настоящего звания нет, просто в проклятой пустоши он единственный живой, не считая скорпионов. Он, вероятно, знает, что произошло с <a class=\"ref\" href=\"/place/malestiya/\">Малестией<\/a>, и скоро вернётся в вампирскую ветку.<\/p><blockquote>«то, что Адольф называется герцогом пустоши, это он сам себя так называет. У него нет такого звания, потому что на тот момент он являлся единственным живым.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa36/#qa36-20\">Подкаст по #36<\/a> · <a href=\"https://youtu.be/oEqxCRDdITw?t=3047\" target=\"_blank\" rel=\"noopener\">0:50:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>47<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Удобный стул Кости Пушкина и новые стулья с 43-го выпуска<\/b><\/div><p><a class=\"ref\" href=\"/p/kostya-pushkin/\">Костя Пушкин<\/a> сидел на офисном стуле, потому что после выпуска <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">16<\/a> отказался сидеть на «корытах» за игровым столом. С <a href=\"/ep/43/\" title=\"Груз Кристиночки\">43-го<\/a> выпуска за столом стоят новые, более мягкие стулья со спинкой; их кусочек показали в рекламной интеграции выпуска <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">40<\/a>.<\/p><blockquote>«Начиная с сорок третьего выпуска… Впервые вы увидите эти стулья.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-5\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1585\" target=\"_blank\" rel=\"noopener\">0:26:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><\/section>", "chars": {"Вампир Бек": {"name": "Вампирбек", "img": "img/chars/vampirbek.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%B0%D0%BC%D0%BF%D0%B8%D1%80%D0%B1%D0%B5%D0%BA", "summary": "Вампирбе́к — вампир из клана Балан, рикша из города Кёнигпон.", "infobox": {"Пол": "Мужской", "Раса": "Вампир", "Тип": "Игровой", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": true, "race": "Вампир", "portraits": [{"ep": "26", "thumb": "img/portraits/72dec7af01bdef1f.webp"}, {"ep": "23", "thumb": "img/portraits/04e2921226758e2a.webp"}, {"ep": "20", "thumb": "img/portraits/3a8ea11b15ebd411.webp"}, {"ep": "16", "thumb": "img/portraits/4f4a19de35cefce6.webp"}, {
