<script>window.EPD = {"anim": false, "key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "date": "2023-03-08", "minutes": 104, "duration": 6238.0, "video_id": "iJIxr6EtT68", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Мёртвые топи: деревня Цветущая Лоза, поместье графа, винодельня", "short_html": "Вампиры клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> с гибридом Кукан Якой и энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> приезжают на день перерождения графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> и должны заставить молчать подростков, разбудивших графа в гробу. Поиски в Цветущей Лозе приводят к пожару в таверне, убийствам и ссорам графа с Кукан Якой. У винодельни они находят сирот и болотное чудовище, в которое влюбляется <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и уходит с ним. Раскаявшиеся <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и Адольф спасают сирот и сжигают графа, а селяне сжигают его поместье.", "summary_html": "Продолжение вампирской ветви (вып. 12). <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> приглашает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> и Вампира Бека на свой «день перерождения» в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a>; с ними едут гибрид <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и энергетический вампир <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>. Днём подростки-сироты пробрались в поместье графа и тыкали его палкой в гробу, поэтому вампиры должны найти их и заставить молчать, пока селяне не сожгли поместье. Поиски в деревне <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a> оборачиваются сожжённой таверной, убийствами и расколом группы. У винодельни вампиры находят подростков и болотное чудовище Тину. Кукан Яка влюбляется в чудовище и уходит с ним, а <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и Адольф, раскаявшись, спасают сирот и сжигают графа. Селяне сжигают поместье.", "outcome_html": "<a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> сожжён, сироты спасены Вампиром Беком и <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> ушёл с болотным чудовищем, его судьба неизвестна.", "world_html": ["<a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a>, старший вампир Мёртвых топей, уничтожен", "Поместье графа сожжено селянами Цветущей Лозы", "Таверна «Весёлый утопец» и винодельня Цветущей Лозы уничтожены", "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> покинул клан ради болотного чудовища", "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> встали на сторону сирот"], "scenes": [{"t": "0:01:26", "sec": 86, "html": "Рекламная рамка: мёртвая летучая мышь, которая несколько месяцев ехала почтой, приносит <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> и Вампиру Беку приглашение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> на день перерождения в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a>; Дан Балан жалуется на расходы."}, {"t": "0:06:19", "sec": 379, "html": "Вводная: деревня <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a> выращивает на болотах виноград, вино дешёвое, «даёт в голову» из-за болотных газов. Рядом заброшенное поместье: граф сам пустил слух, что там был лепрозорий. Его фамильяр недавно умер, днём поместье осталось без охраны, и подростки разбудили его, тыкая палкой в гробу. Задача — найти их и заставить молчать."}, {"t": "0:08:23", "sec": 503, "html": "Представление: граф (веками маскирует убийства под несчастные случаи), <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (граф обратил его в старости; привёз «дорогой подарок»), <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (приехал в отпуск), <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> (в одну ночь его укусили крыса-оборотень и вампир, он принял обе болезни, не боится солнца; старшие вампиры помнят, что он был их фамильяром), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> (энергетический вампир, питается негативными эмоциями и может «заговорить» жертву до смерти). Механика очков крови и энергии."}, {"t": "0:15:55", "sec": 955, "html": "Одного подростка граф запомнил: пижама-единорог и брекеты. Таверна «Весёлый утопец»: граф выдаёт себя за отца пропавших «ребятишек», трактирщик говорит, что там поёт сирота <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> в пижаме единорога; сегодня он не пришёл. Граф внушением заставляет трактирщика налить всем за «уже оплаченный» счёт."}, {"t": "0:22:31", "sec": 1351, "html": "Вампиров тошнит от вина «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>». Старуха в чёрном узнаёт <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, которого видела 70 лет назад. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> выкачивает из трактирщика энергию нудными «фактами» («собаки не мяукают») и замечает у того арбалет с серебряным болтом. Дан Балан брызгает старухе в глаза чесночным спреем."}, {"t": "0:30:18", "sec": 1818, "html": "Граф парализует взглядом вышибалу Дмитрия. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> добивает трактирщика «утомительным диалогом». <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> стреляет трактирщику в ногу его же серебряным болтом и кричит, что тот «был вампиром»."}, {"t": "0:33:07", "sec": 1987, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> воем призывает белого волка; посетители выбегают его убивать. Вампиры выпивают парализованного вышибалу, Кукан Яка под видом приёма Геймлиха выпивает старуху. Бек находит 2 золотых и записку: трактирщик покупает выступления <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a> у эльфа-торговца из «Дома сиротки»."}, {"t": "0:38:27", "sec": 2307, "html": "Одну из комнат защищает магический барьер (нужно приглашение). Граф и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> ссорятся из-за старшинства: граф вонзает когти гному в зад и держит его как перчаточную куклу, Кукан Яка метит графа мочой оборотня (помеха на все броски), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> «гадит на обоих». Кто-то бросает на стул горящее полено — вино взрывается как коктейль Молотова, таверна сгорает. Граф улетает мышью через канализацию, Адольф уходит «быстрым шагом»."}, {"t": "0:48:25", "sec": 2905, "html": "Селяне добивают волка; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> бьёт крестьянина кулаком в лицо, и толпа его окружает. Граф мышью находит трёх подростков-гопников на беговелах; они издеваются над его «кринжем» и «традиционными ценностями», граф выпускает на них рой саранчи, двое съедены заживо. Граф платит свидетелю монету, чтобы тот свалил всё на «злобного оборотня»."}, {"t": "1:01:55", "sec": 3715, "html": "«Дом сиротки»: барьер не пускает, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, накрасившись «девочкой-сироткой», не может уговорить эльфа-торговца. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> представляется новым хозяином таверны и получает дневник <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a> (у торговца пропали и другие «звёзды» — Беби и <a class=\"ref\" href=\"/c/egor-ship/\">Егор Шип<\/a>)."}, {"t": "1:06:07", "sec": 3967, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> уходит из игры («УЗИ мочевого пузыря»). По дневнику: пропал Беби, дети решили, что его утащил монстр, выследили вампира в поместье и втроём полезли его убить днём; у них тайный шалаш на болотах у винодельни."}, {"t": "1:09:08", "sec": 4148, "html": "В шалаше — спальники, открытки с героями, три коктейля Молотова из вина и огниво (их забирают). Слышится рёв чудовища. У сторожки — растерзанный сторож; Бек, получив очко крови от Кукан Яки («Вечный слуга»), говорит с мёртвым: убийца — огромная «Тина Болотная», она гналась за тремя подростками к винодельне."}, {"t": "1:12:36", "sec": 4356, "html": "Выбивание двери: <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> бьётся головой, граф «гладит» дверь ногой, Бек заходит через незапертую вторую дверь. За бочками прячутся <a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a>, ещё один мальчик и девочка. Граф, решив ударить в дверь двумя ногами, влетает в давильню (6 урона) и бросается на детей; Бек колеблется и защищает их."}, {"t": "1:18:27", "sec": 4707, "html": "Врывается болотное чудовище — самка-мать, которой нужно мясо для детей. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> говорит с ней (разговор с животными) и зовёт на свидание, тратя монету, — она соглашается. Кукан Яка отдаёт подросткам две бутылки с горючей смесью."}, {"t": "1:23:13", "sec": 4993, "html": "<a class=\"ref\" href=\"/c/daniel/\">Даниэль<\/a> бросает бутылку в графа, пол вспыхивает; граф уходит по потолку. Бек бросает бочку горючего вина в огонь. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>, «осознав, что мы нелюди», критически попадает бутылкой в графа (14 урона)."}, {"t": "1:26:38", "sec": 5198, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> решает уйти с возлюбленной, но напоследок даёт графу своё очко крови для честного поединка. Граф подпирает дверь телегой, запирая <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, Бека и детей в горящей винодельне. Бек и Адольф вышибают дверь, подростки выбираются. Кукан Яка произносит речь о любви («что было в Вегасе…») и уезжает на чудовище."}, {"t": "1:31:23", "sec": 5483, "html": "Винодельня взрывается: граф, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> и подростки без сознания, на ногах остаётся только Бек. Он отказывается пить кровь детей, стабилизирует Адольфа, и они решают отнести сирот в «Дом сиротки» и взять с них клятву молчать."}, {"t": "1:36:01", "sec": 5761, "html": "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> «дарит» графу подарок на день перерождения — канистру бензина — и сжигает его дотла."}, {"t": "1:37:41", "sec": 5861, "html": "Эпилог: разгневанные селяне находят в поместье вампирский гроб и сжигают поместье. Сцена с Кукан Якой в логове чудовища: под потолком висит живой изможденный Беби, чудовище предлагает Кукан Яке съесть ребёнка; тот отказывается и предлагает съесть его самого, «а потом Беби — ваш выбор». Клиффхэнгер."}, {"t": "1:40:46", "sec": 6046, "html": "Одна монета + 6 по броску Кости: 70 000 руб. в фонд сирот. Финальная песня «Сиротки из Мёртвых топей» (Сироткин)."}], "key_events": [{"t": "0:07:28", "sec": 448}, {"t": "0:24:12", "sec": 1452}, {"t": "0:33:07", "sec": 1987}, {"t": "0:45:11", "sec": 2711}, {"t": "0:54:42", "sec": 3282}, {"t": "1:05:22", "sec": 3922}, {"t": "1:06:07", "sec": 3967}, {"t": "1:18:27", "sec": 4707}, {"t": "1:24:33", "sec": 5073}, {"t": "1:31:23", "sec": 5483}, {"t": "1:36:51", "sec": 5811}, {"t": "1:37:41", "sec": 5861}], "coins": {"ep": "16", "events": [{"t": "0:36:50", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "обыскал барную стойку (проверка внимания/мудрости) и нашёл серебро на сумму две золотые монеты", "result": null, "sec": 2210, "who_url": "/c/vampir-bek/", "reason_html": "обыскал барную стойку (проверка внимания/мудрости) и нашёл серебро на сумму две золотые монеты"}, {"t": "0:56:39", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "сделал верный вывод, что уцелевший ребёнок побежит в приют, и полетел за ним первым", "result": null, "sec": 3399, "who_url": "/c/vampir-bek/", "reason_html": "сделал верный вывод, что уцелевший ребёнок побежит в приют, и полетел за ним первым"}, {"t": "1:00:11", "kind": "give", "who": "Граф Влад Сосунеску", "actor": "Кукушкин", "to": "Кукан Яка", "reason": "отдал монету Кукан Яке, чтобы тот прикрыл вампиров перед разъярённой толпой (Кукан Яка убедил его проверкой харизмы с помехой)", "result": null, "sec": 3611, "who_url": "/c/graf-vlad-sosunesku/", "reason_html": "отдал монету Кукан Яке, чтобы тот прикрыл вампиров перед разъярённой толпой (<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> убедил его проверкой харизмы с помехой)"}, {"t": "1:21:15", "kind": "spend", "who": "Адольф", "actor": "Пушкин", "to": null, "reason": "потратил монету, чтобы помочь уговорить/очаровать болотное чудовище пойти на «свидание» вместо нападения на детей", "result": "чудовище согласилось, конфликт временно предотвращён", "sec": 4875, "who_url": "/c/adolf/", "reason_html": "потратил монету, чтобы помочь уговорить/очаровать болотное чудовище пойти на «свидание» вместо нападения на детей"}, {"t": "1:40:52", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "базовая монета за прохождение приключения плюс бонусный бросок d6 (выпало максимальное значение — 6)", "result": "итого 7 золотых монет (70 000 руб.) отправлены в дом сиротки", "sec": 6052, "who_url": null, "reason_html": "базовая монета за прохождение приключения плюс бонусный бросок d6 (выпало максимальное значение — 6)"}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 3, "spent": 0, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}, {"who": "Граф Влад Сосунеску", "actor": "Кукушкин", "earned": 0, "spent": 1, "img": "img/chars/vlad-sosunesku.webp", "who_url": "/c/graf-vlad-sosunesku/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Кукан Яка", "actor": "Кукояка", "earned": 1, "spent": 0, "img": "img/chars/kukan-yaka.webp", "who_url": "/c/kukanyaka/", "actor_url": "/p/denis-kukoyaka/"}, {"who": "Адольф", "actor": "Пушкин", "earned": 0, "spent": 1, "img": "img/chars/adol-f.webp", "who_url": "/c/adolf/", "actor_url": "/p/kostya-pushkin/"}], "notes": "Партия играет за вампиров, спасающих сирот от нашествия саранчи и болотного монстра. Итоговый выигрыш — максимальный бонусный бросок d6 (6), итого 7 монет (70 000 руб.), отправлены в дом сиротки."}, "cast": [{"name": "Г l, "img": null, "other": []}, {"name": "Тина Болотная", "actor": "", "actor_url": null, "race": "", "role": "болотное чудовище, мать двух детёнышей", "fate": "выжила, ушла с Кукан Якой", "id": null, "url": null, "img": null, "other": []}, {"name": "Трактирщик «Весёлого утопца»", "actor": "", "actor_url": null, "race": "", "role": "держал серебряный арбалет", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Старуха в чёрном", "actor": "", "actor_url": null, "race": "", "role": "помнила Дан Балана", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Вышибала Дмитрий", "actor": "", "actor_url": null, "race": "", "role": "вышибала таверны", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Сторож винодельни", "actor": "", "actor_url": null, "race": "", "role": "жертва чудовища", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "Продолжение: Бесогон, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал вампиром, клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "Костюм гнома Кукан Яки (вампирская ветвь)", "dir": "back", "color": "#7C5CD6"}, {"key": "20", "label": "20", "title": "Вампирское возмездие", "note_html": "Следующий выпуск вампирской ветви", "dir": "out", "color": "#B03A7A"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "note_html": "Убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика", "note_html": "Клан Балан убил графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и Нина из Мёртвых топей", "dir": "back", "color": "#B03A7A"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Сожжение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "48", "label": "48", "title": "Ночь в музее", "note_html": "Вампирская ветвь", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["Граф: «Я за традиционные ценности, и в этой парадигме взрослые не ошибаются». — Подросток: «Чел, ты слит».", "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>: «А ты знал, что собаки не мяукают?»", "Граф Кукан Яке: «Я здесь граф, а не ты».", "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>: «Я верю, что только любовь может спасти мир».", "<a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>: «Самых ярких надо в первую очередь убивать»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> — историческая родина вампиров; деревня <a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>; таверна «Весёлый утопец» (сгорела); поместье графа — «бывший лепрозорий» (сожжено селянами); «Дом сиротки»; шалаш сирот на болотах; винодельня (взорвана); логово болотного чудовища.<\/li>\n<li>Фракции: клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (вампиры), селяне Цветущей Лозы, сироты эльфа-торговца.<\/li>\n<li>Артефакты и предметы: вино «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>» (горючее и взрывоопасное из-за болотных газов), серебряные арбалетные болты, чесночный спрей <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, дневник <a class=\"ref\" href=\"/c/daniel/\">Даниэля<\/a>, коктейли Молотова из вина, канистра бензина — «подарок» <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>.<\/li>\n<\/ul>", "chars": {"Куканяка": {"name": "Кукан Яка", "img": "img/chars/kukan-yaka.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9A%D1%83%D0%BA%D0%B0%D0%BD_%D0%AF%D0%BA%D0%B0", "summary": "Кукан Яка — вампир-оборотень из клана Балан,
