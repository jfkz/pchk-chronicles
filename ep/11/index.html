<script>window.EPD = {"anim": false, "key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "date": "2022-09-07", "minutes": 104, "duration": 6230.0, "video_id": "uq4i73TjT5Y", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Оазис Шиш-Кебаб в пустыне за Багряным морем, башня-отель «Парус»", "short_html": "Превратившись в девушек, герои идут в наложницы халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>, чтобы украсть <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>.", "summary_html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард<\/a>, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> вместе с брошенной женой <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстанией<\/a> и её фрейлиной-убийцей Валей прибывают за <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a>, в оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a>, чтобы похитить у халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a> <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>. Выпив зелье маскировки, все мужчины превращаются в «соблазнительных дев» и проходят кастинг в наложницы в отеле-башне «Парус». По пути они узнают тайну джинна и роз халифа, убивают медсестру Зару (возлюбленную начальника <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>), шантажом получают у фальшивого евнуха бумажную розу и проникают в покои халифа. Щит добыт, но при прыжке с башни Сфинктерион не удерживает товарищей: барон Эдвард и Пэлиас разбиваются насмерть. Сфинктерион улетает со щитом и телом отца.", "outcome_html": "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> добыт, но барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> погибли. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с телом отца и щитом улетел; <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> и Валя выжили.", "world_html": ["Погиб барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард Лёвенхарт<\/a> — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> становится наследником <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>", "Погиб эльф <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>", "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> похищен у халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a> и теперь у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "<a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a>, бывшая жена <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, стала союзницей <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "<a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> оазиса остался несвободным"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Предыстория: после спасения с «Чёрного змея» (вып. 9) барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> покинули Гнилую Гавань и отправились на запад за артефактом. Скетч: подготовка к проникновению, зелье маскировки, походный певец-бард Сфинктериона поёт балладу о бароне."}, {"t": "0:08:30", "sec": 510, "html": "Завязка: оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a>, созданный джинном по желанию халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>. В пентхаусе башни-отеля «Парус» хранится <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>, способный победить армии. Халиф падок на красивых женщин — герои под зельем маскировки стали девушками."}, {"t": "0:09:14", "sec": 554, "html": "Представление: <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> ищет войско для возвращения <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>; <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> — 50-летняя волшебница, брошенная <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> ради молодой любовницы, жаждет мести; Валя — проданная в детстве за двух куриц сирота, ставшая убийцей и преданной фрейлиной Севстании."}, {"t": "0:17:18", "sec": 1038, "html": "Лобби «Паруса»: халифу каждую неделю приводят претенденток; та, что получит от него розу, станет наложницей. Пьяный «VIP-гость халифа» <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> буянит у бара. Бармен-полуэльфийка указывает на плачущую бывшую наложницу; Валя (фокусом) крадёт у пьяного серебряную карту."}, {"t": "0:27:33", "sec": 1653, "html": "Синий джинн за столиком пьёт «драконью кровь»: халиф загадал лишь два желания из трёх (богатый оазис и чтобы его хотели все женщины), поэтому джинн заперт. Для второго желания он создал куст волшебных роз. <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> просит найти его бутылку, обещая награду и ковёр-самолёт, и советует на ресепшене сослаться на <a class=\"ref\" href=\"/c/alyona-shish-kebab/\">Алёну Шиш-Кебаб<\/a>."}, {"t": "0:32:57", "sec": 1977, "html": "Казино: бывшая наложница <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a> рыдает у автомата. <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> утешает её («Золотой язык» <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> тоже в ход) и узнаёт главное: взявшая розу будет любить халифа до конца дней; есть евнух Донни, который только притворяется евнухом, и у него есть поддельная роза. Севстания назвалась сестрой Алёны — «Алимой»."}, {"t": "0:41:01", "sec": 2461, "html": "Рекламная вставка-тизер о вампирах Мёртвых топей (будущая вампирская ветвь)."}, {"t": "0:44:34", "sec": 2674, "html": "Ресепшн (эльф Финн) и лифт по серебряной карте на 10-й этаж, в номер 101 — к кастинг-менеджеру <a class=\"ref\" href=\"/c/lester/\">Лестеру<\/a> (пожилой мужчина в шёлковом халате)."}, {"t": "0:50:52", "sec": 3052, "html": "Кастинг: Валя проваливает акробатический танец, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> удивляет крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> (прошёл), <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> обманом проходит, «экзема» объясняется «военником». <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> настаивает на танце на шесте и бьётся головой в маске об пол, но <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> впечатлён. Валю Лестер оставляет «у себя на коленках», остальных отправляет на медосмотр."}, {"t": "1:01:52", "sec": 3712, "html": "Медкабинет: медсестра — <a class=\"ref\" href=\"/c/zara/\">Зара<\/a>, лечившая <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в лагере <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>. Она узнаёт Сфинктериона: он взорвал лагерь вместе с её возлюбленным, начальником лагеря. Бой: Зара обжигает Пэлиаса огнём, Пэлиас добивает её световыми стрелами; тело прячут в ванной, <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> делает Сфинктериона иллюзорной копией Зары."}, {"t": "1:09:10", "sec": 4150, "html": "«<a class=\"ref\" href=\"/c/zara/\">Зара<\/a>» (<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>) выдаёт троим «справки о здоровье»; <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> забирает Валю, <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в пентхаус. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> находит в столе Зары кулон полёта; Сфинктерион разбивает окно и с отцом взлетает на площадку для ковров-самолётов."}, {"t": "1:13:35", "sec": 4415, "html": "В лифте Валя, отвлекая <a class=\"ref\" href=\"/c/lester/\">Лестера<\/a> ласками, крадёт у него золотую карту."}, {"t": "1:15:54", "sec": 4554, "html": "Золотой этаж: халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> (тёмный эльф) идёт смотреть бои полуросликов. <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> запугиванием и хваткой «за самое дорогое» разоблачает Донни — у него есть всё, что евнуху не положено; он отдаёт бумажную розу и обещает молчать."}, {"t": "1:23:02", "sec": 4982, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в облике Зары обманывает служку на взлётной площадке. <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> представляет Валю халифу; Валя блефует, что роза у неё уже есть, халиф объявляет её своей наложницей и отправляет в покои. <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> магией делает спутникам поддельные розы."}, {"t": "1:28:56", "sec": 5336, "html": "Покои халифа: Щит под стеклянным куполом с магической ловушкой. «<a class=\"ref\" href=\"/c/zara/\">Зара<\/a>» выпроваживает пятерых наложниц на «медосмотр». <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> рассеивает магию (монета за ход) — спадают и ловушка, и все маскировки; <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> разбивает купол головой в железной маске. Щит добыт."}, {"t": "1:32:06", "sec": 5526, "html": "Побег: вместо лестницы решают прыгать с балкона, держась за <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с кулоном полёта. Атлетика 17 при сложности 18, переброс последними монетами — провал: хватка слабеет, все падают."}, {"t": "1:35:33", "sec": 5733, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> может спасти лишь одного — выбирает не только отца, а бросает всем верёвку. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> не успевают схватиться и разбиваются; <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> и Валя спасены верёвкой."}, {"t": "1:38:56", "sec": 5936, "html": "Предсмертные слова <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>: быть первым честным правителем, не назначать друзей по знакомству и вернуть земли народу. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уносит тело отца за горизонт. +2 монеты — 20 000 руб. на благотворительность. «А может, стоило освободить джинна…»"}, {"t": "1:41:25", "sec": 6085, "html": "Финальная песня-реквием о бароне и эльфе."}], "key_events": [{"t": "0:08:51", "sec": 531}, {"t": "0:31:10", "sec": 1870}, {"t": "0:37:17", "sec": 2237}, {"t": "0:50:52", "sec": 3052}, {"t": "1:03:05", "sec": 3785}, {"t": "1:11:21", "sec": 4281}, {"t": "1:19:52", "sec": 4792}, {"t": "1:26:19", "sec": 5179}, {"t": "1:30:50", "sec": 5450}, {"t": "1:35:33", "sec": 5733}, {"t": "1:38:56", "sec": 5936}], "coins": {"ep": "11", "events": [{"t": "0:40:58", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "утешил заплаканную Алёну впечатляющей проверкой харизмы с преимуществом (выпало 24), получил монету «за спасение»", "result": null, "sec": 2458, "who_url": null, "reason_html": "утешил заплаканную <a class=\"ref\" href=\"/c/alyona/\">Алёну<\/a> впечатляющей проверкой харизмы с преимуществом (выпало 24), получил монету «за спасение»"}, {"t": "0:59:29", "kind": "earn", "who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "to": null, "reason": "получил монету от мастера за честное признание во время опасного трюка на шесте (шутка про то, что «лидера нельзя попрекать»)", "result": null, "sec": 3569, "who_url": "/c/baron-edvard/", "reason_html": "получил монету от мастера за честное признание во время опасного трюка на шесте (шутка про то, что «лидера нельзя попрекать»)"}, {"t": "0:59:34", "kind": "other", "who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "to": null, "reason": "хотел потратить монету на переброс проверки после неудачного трюка на шесте, но партия проголосовала монету не тратить, так как танец уже был завершён", "result": "получил 1 урон от удара головой об пол, монета осталась неиспользованной", "sec": 3574, "who_url": "/c/baron-edvard/", "reason_html": "хотел потратить монету на переброс проверки после неудачного трюка на шесте, но партия проголосовала монету не тратить, так как танец уже был завершён"}, {"t": "1:31:04", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "получил монету за «шикарный ход» — план развеять магическую ловушку и снять иллюзию с наложниц, чтобы забрать щит Чёрного Владыки", "result": "план сработал, иллюзии спали, щит получен", "sec": 5464, "who_url": null, "reason_html": "получил монету за «шикарный ход» — план развеять магическую ловушку и снять иллюзию с наложниц, чтобы забрать щит Чёрного Владыки"}, {"t": "1:34:43", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили монету на переброс проверки атлетики (сложность 18) при удержании товарищей во время полёта/побега с балкона", "result": "переброс дал в сумме 10 — хуже исходного результата 17", "sec": 5683, "who_url": null, "reason_html": "потратили монету на переброс проверки атлетики (сложность 18) при удержании товарищей во время полёта/побега с балкона"}, {"t": "1:35:12", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили последнюю монету ещё на один переброс той же проверки атлетики", "result": "переброс не помог, хватка ослабла — товарищи упали с большой высоты, выжить смог только один", "sec": 5712, "who_url": null, "reason_html": "потратили последнюю монету ещё на один переброс той же проверки атлетики"}, {"t": "1:40:29", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "бонусный бросок d6 на монеты за прохождение подземелья", "result": "выпало 2, итого 2 золотые монеты (20 000 руб.) переданы на благотворительность", "sec": 6029, "who_url": null, "reason_html": "бонусный бросок d6 на монеты за прохождение подземелья"}], "totals": [{"who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "earned": 1, "spent": 0, "img": "img/chars/edvard-lyovenhart.webp", "who_url": "/c/baron-edvard/", "actor_url": "/p/nikita-kukushkin/"}], "notes": "Много событий с монетами в этом выпуске не удаётся привязать к конкретному персонажу — реплики не подписаны по именам. Финал траги : "фальшивый евнух, хранитель поддельных роз", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Алёна Шиш-Кебаб", "actor": "", "actor_url": null, "race": "", "role": "бывшая наложница халифа", "fate": "выжила", "id": "Алёна Шиш-Кебаб", "url": "/c/alyona-shish-kebab/", "img": "img/chars/alyona-shish-kebab.webp", "other": []}, {"name": "Зара", "actor": "", "actor_url": null, "race": "", "role": "медсестра, бывшая лекарка Фогельнеста, возлюбленная начальника лагеря", "fate": "погибла", "id": "Зара", "url": "/c/zara/", "img": "img/chars/zara.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}]}, {"name": "Финн", "actor": "", "actor_url": null, "race": "", "role": "эльф-портье отеля «Парус»", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Крыса Лариса", "actor": "", "actor_url": null, "race": "", "role": "компаньон Пэлиаса", "fate": "неизвестно", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}], "links": [{"key": "01", "label": "1", "title": "Башня Колдуна", "note_html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, спутник <a class=\"ref\" href=\"/c/sf : "<a class=\"ref\" href=\"/place/shish-kebab/\">Оазис Шиш-Кебаб<\/a> и <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a>", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Кто же знал, что он загадает только два» — джинн о халифе.", "«Если взять его розу — будешь любить его до скончания веков» — <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a>.", "«Руководствуйся своим сердцем, искренностью и профессионализмом… Верни наши земли народу, который это заслуживает» — последние слова барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>.", "«Бои карликов лучше фокусов этой старухи» — гость пентхауса.", "«А может быть, стоило освободить джинна…» — мастер в финале."], "places_html": "<ul>\n<li>За Багряным морем: оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a> в пустыне, башня-отель «Парус» (лобби, казино, 101 номер, медкабинет, золотой этаж, октагон для боёв полуросликов, покои халифа, площадка ковров-самолётов).<\/li>\n<li>Фракции: двор халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>; лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> (упоминается как бывший муж <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>).<\/li>\n<li>Артефакты: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> (добыт), бутылка джинна (не найдена), волшебные розы халифа (приворот навсегда) и бумажная поддельная роза, кулон полёта (2 раза в день), серебряная и золотая карты «Паруса», зелье маскировки, ковры-самолёты.<\/li>\n<\/ul>", "chars": {"Лариса": {"name": "Крыса Лариса", "img": "img/chars/larisa.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D0%B0%D1%80%D0%B8%D1%81%D0%B0", "summary": "Лари́са — бывшая крыса-компаньон эльфа Пэлиаса, бывший советник президента Сфинктериона.", "infobox": {"Пол": "Женский", "Раса": "Крыса", "Тип": "Игровой", "Игрок": "Александр Гудков", "На вики": "Лариса"}, "actors": ["Александр Гудков"], "kind": "pc", "dead": false, "race": "Крыса", "portraits"
