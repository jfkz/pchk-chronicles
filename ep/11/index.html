<script>window.EPD = {"anim": false, "key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "date": "2022-09-07", "minutes": 104, "duration": 6230.0, "video_id": "uq4i73TjT5Y", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Оазис Шиш Кебаб в пустыне за Багряным морем, башня-отель «Парус»", "short_html": "Превратившись в девушек, герои идут в наложницы халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>, чтобы украсть <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>.", "summary_html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард<\/a>, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> вместе с брошенной женой <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстанией<\/a> и её фрейлиной-убийцей Валей прибывают за <a class=\"ref\" href=\"/place/bagryanoe-more/\">Багряное море<\/a>, в оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a>, чтобы похитить у халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a> <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>. Выпив зелье маскировки, все мужчины превращаются в «соблазнительных дев» и проходят кастинг в наложницы в отеле-башне «Парус». По пути они узнают тайну джинна и роз халифа, убивают медсестру Зару (возлюбленную начальника <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>), шантажом получают у фальшивого евнуха бумажную розу и проникают в покои халифа. Щит добыт, но при прыжке с башни Сфинктерион не удерживает товарищей: барон Эдвард и Пэлиас разбиваются насмерть. Сфинктерион улетает со щитом и телом отца.", "outcome_html": "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> добыт, но барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> погибли. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с телом отца и щитом улетел; <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> и Валя выжили.", "world_html": ["Погиб барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард Лёвенхарт<\/a> — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> становится наследником <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>", "Погиб эльф <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>", "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> похищен у халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a> и теперь у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "<a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a>, бывшая жена <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, стала союзницей <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "<a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> оазиса остался несвободным"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Предыстория: после спасения с «Чёрного змея» (вып. 9) барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> покинули Гнилую Гавань и отправились на запад за артефактом. Скетч: подготовка к проникновению, зелье маскировки, походный певец-бард Сфинктериона поёт балладу о бароне."}, {"t": "0:08:30", "sec": 510, "html": "Завязка: оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a>, созданный джинном по желанию халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>. В пентхаусе башни-отеля «Парус» хранится <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>, способный победить армии. Халиф падок на красивых женщин — герои под зельем маскировки стали девушками."}, {"t": "0:09:14", "sec": 554, "html": "Представление: <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> ищет войско для возвращения <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>; <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> — 50-летняя волшебница, брошенная <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> ради молодой любовницы, жаждет мести; Валя — проданная в детстве за двух куриц сирота, ставшая убийцей и преданной фрейлиной Севстании."}, {"t": "0:17:18", "sec": 1038, "html": "Лобби «Паруса»: халифу каждую неделю приводят претенденток; та, что получит от него розу, станет наложницей. Пьяный «VIP-гость халифа» <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> буянит у бара. Бармен-полуэльфийка указывает на плачущую бывшую наложницу; Валя (фокусом) крадёт у пьяного серебряную карту."}, {"t": "0:27:33", "sec": 1653, "html": "Синий джинн за столиком пьёт «драконью кровь»: халиф загадал лишь два желания из трёх (богатый оазис и чтобы его хотели все женщины), поэтому джинн заперт. Для второго желания он создал куст волшебных роз. <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> просит найти его бутылку, обещая награду и ковёр-самолёт, и советует на ресепшене сослаться на <a class=\"ref\" href=\"/c/alyona-shish-kebab/\">Алёну Шиш Кебаб<\/a>."}, {"t": "0:32:57", "sec": 1977, "html": "Казино: бывшая наложница <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a> рыдает у автомата. <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> утешает её («Золотой язык» <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> тоже в ход) и узнаёт главное: взявшая розу будет любить халифа до конца дней; есть евнух <a class=\"ref\" href=\"/c/doni/\">Дони<\/a>, который только притворяется евнухом, и у него есть поддельная роза. Севстания назвалась сестрой Алёны — «Алимой»."}, {"t": "0:41:01", "sec": 2461, "html": "Рекламная вставка-тизер о вампирах Мёртвых топей (будущая вампирская ветвь)."}, {"t": "0:44:34", "sec": 2674, "html": "Ресепшн (эльф <a class=\"ref\" href=\"/c/finael/\">Финаэль<\/a>) и лифт по серебряной карте на 10-й этаж, в номер 101 — к кастинг-менеджеру <a class=\"ref\" href=\"/c/lester/\">Лестеру<\/a> (пожилой мужчина в шёлковом халате)."}, {"t": "0:50:52", "sec": 3052, "html": "Кастинг: Валя проваливает акробатический танец, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> удивляет крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> (прошёл), <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> обманом проходит, «экзема» объясняется «военником». <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> настаивает на танце на шесте и бьётся головой в маске об пол, но <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> впечатлён. Валю Лестер оставляет «у себя на коленках», остальных отправляет на медосмотр."}, {"t": "1:01:52", "sec": 3712, "html": "Медкабинет: медсестра — <a class=\"ref\" href=\"/c/zara/\">Зара<\/a>, лечившая <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в лагере <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>. Она узнаёт Сфинктериона: он взорвал лагерь вместе с её возлюбленным, начальником лагеря. Бой: Зара обжигает Пэлиаса огнём, Пэлиас добивает её световыми стрелами; тело прячут в ванной, <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> делает Сфинктериона иллюзорной копией Зары."}, {"t": "1:09:10", "sec": 4150, "html": "«<a class=\"ref\" href=\"/c/zara/\">Зара<\/a>» (<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>) выдаёт троим «справки о здоровье»; <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> забирает Валю, <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в пентхаус. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> находит в столе Зары кулон полёта; Сфинктерион разбивает окно и с отцом взлетает на площадку для ковров-самолётов."}, {"t": "1:13:35", "sec": 4415, "html": "В лифте Валя, отвлекая <a class=\"ref\" href=\"/c/lester/\">Лестера<\/a> ласками, крадёт у него золотую карту."}, {"t": "1:15:54", "sec": 4554, "html": "Золотой этаж: халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> (тёмный эльф) идёт смотреть бои полуросликов. <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> запугиванием и хваткой «за самое дорогое» разоблачает <a class=\"ref\" href=\"/c/doni/\">Дони<\/a> — у него есть всё, что евнуху не положено; он отдаёт бумажную розу и обещает молчать."}, {"t": "1:23:02", "sec": 4982, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в облике Зары обманывает служку на взлётной площадке. <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> представляет Валю халифу; Валя блефует, что роза у неё уже есть, халиф объявляет её своей наложницей и отправляет в покои. <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> магией делает спутникам поддельные розы."}, {"t": "1:28:56", "sec": 5336, "html": "Покои халифа: Щит под стеклянным куполом с магической ловушкой. «<a class=\"ref\" href=\"/c/zara/\">Зара<\/a>» выпроваживает пятерых наложниц на «медосмотр». <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> рассеивает магию (монета за ход) — спадают и ловушка, и все маскировки; <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> разбивает купол головой в железной маске. Щит добыт."}, {"t": "1:32:06", "sec": 5526, "html": "Побег: вместо лестницы решают прыгать с балкона, держась за <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с кулоном полёта. Атлетика 17 при сложности 18, переброс последними монетами — провал: хватка слабеет, все падают."}, {"t": "1:35:33", "sec": 5733, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> может спасти лишь одного — выбирает не только отца, а бросает всем верёвку. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> не успевают схватиться и разбиваются; <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a> и Валя спасены верёвкой."}, {"t": "1:38:56", "sec": 5936, "html": "Предсмертные слова <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>: быть первым честным правителем, не назначать друзей по знакомству и вернуть земли народу. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уносит тело отца за горизонт. +2 монеты — 20 000 руб. на благотворительность. «А может, стоило освободить джинна…»"}, {"t": "1:41:25", "sec": 6085, "html": "Финальная песня-реквием о бароне и эльфе."}], "key_events": [{"t": "0:08:51", "sec": 531}, {"t": "0:31:10", "sec": 1870}, {"t": "0:37:17", "sec": 2237}, {"t": "0:50:52", "sec": 3052}, {"t": "1:03:05", "sec": 3785}, {"t": "1:11:21", "sec": 4281}, {"t": "1:19:52", "sec": 4792}, {"t": "1:26:19", "sec": 5179}, {"t": "1:30:50", "sec": 5450}, {"t": "1:35:33", "sec": 5733}, {"t": "1:38:56", "sec": 5936}], "coins": {"ep": "11", "events": [{"t": "0:40:58", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "утешил заплаканную Алёну впечатляющей проверкой харизмы с преимуществом (выпало 24), получил монету «за спасение»", "result": null, "sec": 2458, "who_url": null, "reason_html": "утешил заплаканную <a class=\"ref\" href=\"/c/alyona/\">Алёну<\/a> впечатляющей проверкой харизмы с преимуществом (выпало 24), получил монету «за спасение»"}, {"t": "0:59:29", "kind": "earn", "who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "to": null, "reason": "получил монету от мастера за честное признание во время опасного трюка на шесте (шутка про то, что «лидера нельзя попрекать»)", "result": null, "sec": 3569, "who_url": "/c/baron-edvard/", "reason_html": "получил монету от мастера за честное признание во время опасного трюка на шесте (шутка про то, что «лидера нельзя попрекать»)"}, {"t": "0:59:34", "kind": "other", "who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "to": null, "reason": "хотел потратить монету на переброс проверки после неудачного трюка на шесте, но партия проголосовала монету не тратить, так как танец уже был завершён", "result": "получил 1 урон от удара головой об пол, монета осталась неиспользованной", "sec": 3574, "who_url": "/c/baron-edvard/", "reason_html": "хотел потратить монету на переброс проверки после неудачного трюка на шесте, но партия проголосовала монету не тратить, так как танец уже был завершён"}, {"t": "1:31:04", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "получил монету за «шикарный ход» — план развеять магическую ловушку и снять иллюзию с наложниц, чтобы забрать щит Чёрного Владыки", "result": "план сработал, иллюзии спали, щит получен", "sec": 5464, "who_url": null, "reason_html": "получил монету за «шикарный ход» — план развеять магическую ловушку и снять иллюзию с наложниц, чтобы забрать щит Чёрного Владыки"}, {"t": "1:34:43", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили монету на переброс проверки атлетики (сложность 18) при удержании товарищей во время полёта/побега с балкона", "result": "переброс дал в сумме 10 — хуже исходного результата 17", "sec": 5683, "who_url": null, "reason_html": "потратили монету на переброс проверки атлетики (сложность 18) при удержании товарищей во время полёта/побега с балкона"}, {"t": "1:35:12", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили последнюю монету ещё на один переброс той же проверки атлетики", "result": "переброс не помог, хватка ослабла — товарищи упали с большой высоты, выжить смог только один", "sec": 5712, "who_url": null, "reason_html": "потратили последнюю монету ещё на один переброс той же проверки атлетики"}, {"t": "1:40:29", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "бонусный бросок d6 на монеты за прохождение подземелья", "result": "выпало 2, итого 2 золотые монеты (20 000 руб.) переданы на благотворительность", "sec": 6029, "who_url": null, "reason_html": "бонусный бросок d6 на монеты за прохождение подземелья"}], "totals": [{"who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "earned": 1, "spent": 0, "img": "img/chars/edvard-lyovenhart.webp", "who_url": "/c/baron-edvard/", "actor_url": "/p/nikita-kukushkin/"}], "notes": "Много событий с монетами в этом выпуске не удаётся привязать к конкретному персонажу — реплики не подписаны по именам. Финал трагический: партия проваливает два переброса атлетики при побеге по воздуху, и почти все герои (в т.ч. барон Эдвард и Пэлиас) погибают при падении."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, воин", "role": "", "fate": "выжил", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Пэлиас", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "лесной эльф, следопыт", "role": "", "fate": "погиб", "id": "Пелиас", "url": "/c/pelias/", "img": "img/chars/pelias.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}]}, {"name": "барон Э "label": "29", "title": "Отель \"Глубокий канал\""}]}, {"name": "Дони", "actor": "", "actor_url": null, "race": "", "role": "фальшивый евнух, хранитель поддельных роз", "fate": "выжил", "id": "Дони", "url": "/c/doni/", "img": "img/chars/doni.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}]}, {"name": "Алёна Шиш Кебаб", "actor": "", "actor_url": null, "race": "", "role": "бывшая наложница халифа", "fate": "выжила", "id": "Алёна Шиш Кебаб", "url": "/c/alyona-shish-kebab/", "img": "img/chars/alyona-shish-kebab.webp", "other": []}, {"name": "Зара", "actor": "", "actor_url": null, "race": "", "role": "медсестра, бывшая лекарка Фогельнеста, возлюбленная начальника лагеря", "fate": "погибла", "id": "Зара", "url": "/c/zara/", "img": "img/chars/zara.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}]}, {"name": "Финаэль", "actor": "", "actor_url": null, "race": "", "role": "эльф-портье отеля «Парус»", "fate": "выжил", "id": "Финаэль", "url": "/c/finael/", "img": "img/chars/finael.webp", "other": []}, {"name": "Крыса Лариса", "actor": "", "actor_url": null, "race": "", "role": "компаньон Пэлиаса", "fate": "неизвестно", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}], "links": [{"key": "01", "label": "1", "title": "Башня колдуна", "note_html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, спутник <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, погибнет", "dir": "back", "color": "#C8423B"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "Лагерь <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>: <a class=\"ref\" href=\"/c/zara/\">Зара<\/a> и её возлюбленный — начальник лагеря", "dir": "out", "color": "#C8423B"}, {"key": "09", "label": "9", "title": "Человек в железной маске", "note_html": "Освобождение барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> с «Чёрного змея», железная маска", "dir": "out", "color": "#C8423B"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "Рекламный тизер вампиров Мёртвых топей", "dir": "out", "color": "#B03A7A"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "Щит и завет отца для освобождения <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "Костюм Эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и медведолюда Урса (ветвь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>)", "dir": "back", "color": "#7C5CD6"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> освобождает джинна", "dir": "out", "color": "#C8423B"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "note_html": "Гибель <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> отказалась его воскрешать", "dir": "back", "color": "#C8423B"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> добыт в оазисе <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a>, Валя помогала", "dir": "back", "color": "#C8423B"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "<a class=\"ref\" href=\"/place/shish-kebab/\">Оазис Шиш Кебаб<\/a> и <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a>", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Кто же знал, что он загадает только два» — джинн о халифе.", "«Если взять его розу — будешь любить его до скончания веков» — <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a>.", "«Руководствуйся своим сердцем, искренностью и профессионализмом… Верни наши земли народу, который это заслуживает» — последние слова барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>.", "«Бои карликов лучше фокусов этой старухи» — гость пентхауса.", "«А может быть, стоило освободить джинна…» — мастер в финале."], "places_html": "<ul>\n<li>За Багряным морем: оазис <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> в пустыне, башня-отель «Парус» (лобби, казино, 101 номер, медкабинет, золотой этаж, октагон для боёв полуросликов, покои халифа, площадка ковров-самолётов).<\/li>\n<li>Фракции: двор халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>; лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> (упоминается как бывший муж <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>).<\/li>\n<li>Артефакты: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> (добыт), бутылка джинна (не найдена), волшебные розы халифа (приворот навсегда) и бумажная поддельная роза, кулон полёта (2 раза в день), серебряная и золотая карты «Паруса», зелье маскировки, ковры-самолёты.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>9<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>9<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>1<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>4<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>2<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>1<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa18-7\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Рогозия и Пэлиаса не будут пересоздавать<\/b><\/div><p>Авторы заявили, что гнома-инженера у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> больше не будет (возможно, такого персонажа получит другой игрок), а погибшего <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> не будут создавать заново, потому что повтор получится вторичным.<\/p><blockquote>«не будет больше гнома-инженера у Босса, будет у другого человека»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-7\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2280\" target=\"_blank\" rel=\"noopener\">0:38:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-9\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранная Севстания во дворце Властона<\/b><\/div><p>Авторы до сих пор жалеют, что в 4-м выпуске герои не зашли к жене <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>: она ревновала мужа к любовнице, с которой тот выходил к людям, сидела запертой в спальне и могла слить пароли и помочь проникнуть в замок. Её лицо намеренно не показали, поэтому позже Севстанию смогла сыграть Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a> (вып. 11).<\/p><blockquote>«я до сих пор горю по поводу того, что вы не зашли к Севстании во дворце и не поговорили с ней»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> В ep04.md <a class=\"ref\" href=\"/c/stanislava/\">Жена Властона<\/a> описана лишь как автор гневной записки «по лору, вероятно, Севстания» — авторы подтвердили, что это Севстания, запертая и ревнующая, которая могла помочь героям.<\/p><p class=\"note\"><a href=\"/pod/qa18/#qa18-9\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2525\" target=\"_blank\" rel=\"noopener\">0:42:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-19\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем Теймураз прятал бутылку джинна в овце<\/b><\/div><p>Халиф не мог никому доверить бутылку и держал её при себе, тем более что джинн привязан к бутылке и существует лишь в радиусе от неё. После событий в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>, когда о джинне узнали (а герои могли легко взять бутылку, стоявшую на виду), он спрятал её в любимую овцу; наложницы-охранницы знали, что овца важна, но не знали про бутылку внутри.<\/p><blockquote>«девушки, которые охраняли, знали, что сама овца важна, а не бутылка внутри»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-19\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=3234\" target=\"_blank\" rel=\"noopener\">0:53:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Дух Пэлиаса нельзя было призвать щитом<\/b><\/div><p><a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> может призвать лишь дух того, кто умер не более часа назад (как было с отцом <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>), поэтому призвать дух <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> было нельзя.<\/p><blockquote>«условия какое-то: мёртвых не более часа»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-25\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4307\" target=\"_blank\" rel=\"noopener\">1:11:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-29\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Лариса и Пэлиас: в чашу взяли её кровь<\/b><\/div><p>На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в чашу познания смерти взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические.<\/p><blockquote>«раскрыть: это её кровь взяли в чашу познания смерти»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa19/#qa19-29\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-41\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Алан — горожанин, знавший Севстанию как жену лорда<\/b><\/div><p><a class=\"ref\" href=\"/c/alan/\">Алан<\/a> был человеком, жителем <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Валю он впустил, потому что знал <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a> как жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, свою леди. В <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионе<\/a> он видел демона и слышал, что падший рыцарь на стороне демонов. Поэтому он попросил контракт, гарантирующий жизнь ему и семье, раз демоны предлагают контракты.<\/p><blockquote>«Мы в Геленбурге, он житель Геленбурга, лорд Властон и его жена Севстания. Он знал её»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep24.md: <a class=\"ref\" href=\"/c/alan/\">Алан<\/a> назван «трусливым бесом из коллектора». На самом деле это очарованный горожанин-человек, которого герои видели бесом.<\/p><p class=\"note\"><a href=\"/pod/qa24/#qa24-41\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=6023\" target=\"_blank\" rel=\"noopener\">1:40:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa29-22\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Лестер не поднялся на собрание<\/b><\/div><p>Сутенёр <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> тоже должен был подняться на собрание, но в момент встречи оставался у себя в номере. В столицу он бежал из <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаба<\/a> после того, как халиф потерял власть.<\/p><blockquote>«Лестер был ещё у себя в номере в тот момент... должен был подняться туда наверх, но он не поднялся.»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> в списке «вероятно, погибли при взрыве», но на собрании его не было: во время встречи он оставался в своём номере.<\/p><p class=\"note\"><a href=\"/pod/qa29/#qa29-22\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-23\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Шиш Кебабом теперь правит джинн Джига<\/b><\/div><p>После того как халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> лишился джинна, халифа больше нет: <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн Джига<\/a> изгнал всех и сам правит <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабом<\/a>. Авторы допустили, что к этой истории вернутся.<\/p><blockquote>«Когда Халиф потерял власть, Джин Джига изгнал всех, теперь он там главный. Возможно, мы к этой истории вернёмся.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-23\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-5\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b><\/div><p>Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку.<\/p><blockquote>«мы не раз использовали персонажей, которые у нас были заявлены в выпусках как NPC, потом мы отдавали их игрокам»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-5\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><\/section>", "chars": {"Эдвард": {"name": "Барон Эдвард", "img": "img/chars/edvard-lyovenhart.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%AD%D0%B4%D0%B2%D0%B0%D1%80%D0%B4_%D0%9B%D1%91%D0%B2%D0%B5%D0%BD%D1%85%D0%B0%D1%80%D1%82", "summary": "Э́двард Лёвенхарт — барон, правитель Вёрджинвальда, отец Сфинктериона.", "infobox": {"Пол":
