<script>window.EPD = {"key": "14", "label": "14", "title": "Янус доставка", "date": "2022-12-27", "minutes": 115, "duration": 6917.0, "video_id": "9ciFFrYYK8E", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Берег реки, пещера кобольдов, гномий город Змей Хрустальный (Голубятня Мелонеса)", "short_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a>, переехавший с семьёй каннибалов в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>, работает курьером у контрабандиста <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и с командой доставляет эльфийскую соль — наркотик, вызывающий мутации. Банда пробивается через дилершу <a class=\"ref\" href=\"/c/diana/\">Диану<\/a>, гребнидов, медведя, орков и мост над кипящим маслом, но получатель <a class=\"ref\" href=\"/c/pablo-tehnik/\">Пабло Техник<\/a> оказывается посредником. В Змее Хрустальном настоящие заказчики, гномы-близнецы Мелонес и <a class=\"ref\" href=\"/c/vitalis/\">Виталис<\/a>, готовят распыление соли над столицей. Игристый раскрывается как агент гвардии <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>, <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> — как осведомитель; сеть накрыта, а Эрика атакуют голуби.", "summary_html": "Новогодний выпуск. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a>, бросив внебрачного сына, переехал с <a class=\"ref\" href=\"/c/sofiya/\">Софией<\/a>, Лёшей и семьёй каннибалов в столицу <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> и устроился курьером к главарю контрабандистов <a class=\"ref\" href=\"/c/yanus/\">Янусу<\/a> (семья — «под защитой» Януса). С <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a>, гоблином <a class=\"ref\" href=\"/c/biktor/\">Биктором<\/a>, жуликом <a class=\"ref\" href=\"/c/dobromraz/\">Добромразом<\/a> и одноглазым Игристым он должен забрать у эльфов эльфийскую соль (запрещённое вещество из кожи старых эльфов) и доставить гному <a class=\"ref\" href=\"/c/pablo-tehnik/\">Пабло Технику<\/a>. Соль даёт случайные мутации: у Эрика и Юлиана вырастают уши, позволяющие медленно летать. По дороге банда убивает дилершу <a class=\"ref\" href=\"/c/diana/\">Диану<\/a> и гребнидов, орков-людоедов, затем выясняет, что Пабло лишь посредник, а настоящие заказчики — гномы-близнецы Мелонес и <a class=\"ref\" href=\"/c/vitalis/\">Виталис<\/a> из «Голубятни» в Змее Хрустальном, которые готовили распыление тонны соли над столицей. В финале Игристый раскрывается как агент королевской гвардии <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>, Добромраз — как его осведомитель; сеть накрыта, Виталис убит, Мелонес сдаётся, а судьба Эрика, атакованного голубями, остаётся открытой.", "outcome_html": "Сеть торговли эльфийской солью раскрыта, план распыления соли над столицей сорван. Судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> после атаки голубей остаётся неизвестной.", "world_html": ["Семья <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и каннибалы живут в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a> под защитой контрабандиста <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>", "<a class=\"ref\" href=\"/a/elfiyskaya-sol/\">Эльфийская соль<\/a> — запрещённый наркотик из кожи старых эльфов, торгуется через гномов Змея Хрустального", "Королевская гвардия накрыла Голубятню Мелонеса, сорвав распыление тонны соли над столицей", "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> получили мутации от соли (уши, большая голова Эрика)"], "scenes": [{"t": "0:01:04", "sec": 64, "html": "Вводная: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> узнал о сыне от «блудливой селянки», бросил его и с семьёй каннибалов поселился в столице; ищет заработок и возвращается на криминальный путь. Рекламная сценка: Эрик с <a class=\"ref\" href=\"/c/sofiya/\">Софией<\/a> и ребёнком, индейка, подарки маме, <a class=\"ref\" href=\"/c/yulian/\">Юлиану<\/a>, <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныче<\/a>; София требует поклясться, что работа не криминальная."}, {"t": "0:06:29", "sec": 389, "html": "Мастер: вы контрабандисты «<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставки»; Янус велел забрать груз эльфийской соли и передать гному <a class=\"ref\" href=\"/c/pablo-tehnik/\">Пабло Технику<\/a>. Представление: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (охраняет <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> ради племянника), Эрик (стал отцом Лёши, семья под защитой Януса, скучает по «гениальности»), <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> (гоблина привезли в клетке и продали как питомца, он загрыз хозяина; хочет подняться в организации), <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> (жулик, гадалка, сидел на каторге, мечтает о пенсии в «Португалии»), <a class=\"ref\" href=\"/c/cisgender/\">Игристый<\/a> (сирота, форточник, экс-пират Гнилой Гавани, потерял глаз, сидел на каторге с Добромразом)."}, {"t": "0:13:57", "sec": 837, "html": "Лунная ночь на берегу: эльфы на лодке, плывущей магией. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> бросает им кулон с изображением брата <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, жены <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и ребёнка «на удачу» — эльф возвращает его. <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> изображает эльфийский акцент («меня воспитала семья высших эльфов»)."}, {"t": "0:18:16", "sec": 1096, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> тайком топит пустую эльфийскую лодку. Банда платит 5 золотых, эльфы проявляют пять мешков соли. Эрик пробует соль — у него вырастают огромные уродливые уши (−1 к харизме, можно медленно летать). <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> выторговывает скидку."}, {"t": "0:23:41", "sec": 1421, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> пытается ограбить эльфа и бьёт кинжалом — попадает в чёрную эльфийскую кольчугу. Эльф прожигает Эрика насквозь лучом огня; эльфы, назвав это «поучительным уроком», бросают зелье лечения и уплывают. Банда поит им Эрика."}, {"t": "0:29:01", "sec": 1741, "html": "Рекламная интерлюдия про другую партию (Карл-клирик, бард и др., мегафон) — к сюжету не относится."}, {"t": "0:33:16", "sec": 1996, "html": "Путь на юг к пещере кобольдов: эльфийка-блондинка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> хочет соль, у неё «тоже пропал гений»; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> плюёт ей в рот. Появляются гребниды (грибной народ, из того же племени, что и <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a>). <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> бьёт Диану дубиной и сражается с грибами; его закалывают ножами (22 урона)."}, {"t": "0:41:51", "sec": 2511, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> посыпает грибы солью — у тех меняются местами руки и ноги; Эрик заодно получает эффект «пускать ветры» при низких бросках. <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> пытается утащить мешок и погибает от выстрела в затылок, упав в облако соли. <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> кинжалами срезает шляпку грибу. Эрик после второй дозы становится ненавистным для всех животных."}, {"t": "0:48:15", "sec": 2895, "html": "<a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>-шаман оживляет <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> кровью принесённой в жертву курицы. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> кусает разъярённый ёж. Юлиан снова падает. Биктор кусает гриба и становится берсерком; <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> голосом раненого гриба приказывает остальным отступить. У трупа — зелье лечения, монета и паспорт гнома; Юлиана снова поят зельем."}, {"t": "0:54:45", "sec": 3285, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>, насадив живого гриба на ежа, убегает в лес; на него идёт ненавидящий его медведь. Эрик запихивает гриба медведю в пасть, тот от испуга выпускает споры — медведь погибает; Эрик вырезает у медведя «попку с пипкой» и носит на голове."}, {"t": "1:00:13", "sec": 3613, "html": "Лагерь трёх татуированных орков у пещеры, рядом — съеденные гномы и пять пони. <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> садится к костру, ест гномье мясо, делает «предсказание в кредит» о пяти лошадях Апокалипсиса — пони выходят, орков запугивают и они бегут. <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> убивает орка двумя костяными кинжалами. Найдены ещё паспорта гномов, колпаки и жилетки."}, {"t": "1:07:49", "sec": 4069, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> засыпает в лесу; ему является призрак брата-близнеца <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> («я утонул… моей родне очень плохо, возвращайся»). Эрик просыпается от укуса белки; стая белок-летяг гонится за ним."}, {"t": "1:12:08", "sec": 4328, "html": "В пещере кобольдов — мост-ловушка над кипящим маслом. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> сбрасывает одного пони в масло, чтобы запугать остальных; остальные проходят. Банда переправляется."}, {"t": "1:15:25", "sec": 4525, "html": "За камнем прячется <a class=\"ref\" href=\"/c/pablo-tehnik/\">Пабло Техник<\/a>. Выясняется, что он не платит — «заказчик, но не совсем»; деньги у Мелонеса, главного в «Голубятне» в Змее Хрустальном. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> макает его руку в кипящее масло. Мост оказывается давно сломанной, безопасной ловушкой. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>, отбившись от белок, «вспоминает брата и семью» и догоняет группу; у Пабло находят его паспорт — он гном."}, {"t": "1:21:55", "sec": 4915, "html": "Застава Змея Хрустального: ворота для граждан и неграждан. Банда надевает гномьи колпаки (в паспортах вместо фото — колпаки). <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> замечает у Игристого письмо капитана гвардии: «срочный приказ №1227 — внедриться в группу контрабандистов, расследовать закупки соли». Биктор с письмом и мешком соли уходит из сюжета (к <a class=\"ref\" href=\"/c/yanus/\">Янусу<\/a>)."}, {"t": "1:29:27", "sec": 5367, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> пытается сдать Игристого, но таможня не верит человеку с медвежьим органом на голове; он проваливает «гномий вопрос» (сколько пальцев у гнома — пять) и его выкидывают. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> проходит запугиванием («я вас съем, я каннибал»)."}, {"t": "1:34:55", "sec": 5695, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> крадёт колпак у стоящего рядом Пабло, снова пробует соль — голова раздувается вдвое, и под видом «больного гнома <a class=\"ref\" href=\"/c/pablo-tehnik/\">Пабло Техника<\/a>» он проходит в город."}, {"t": "1:37:04", "sec": 5824, "html": "«Голубятня Мелонеса» — склад голубей и голые гномы, фасующие соль в рюкзачки для голубей. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> пытается выслужиться перед Мелонесом, сдав Игристого и <a class=\"ref\" href=\"/c/dobromraz/\">Добромраза<\/a>. Появляется брат-близнец <a class=\"ref\" href=\"/c/vitalis/\">Виталис<\/a> и бросает голубя со взрывчаткой."}, {"t": "1:41:21", "sec": 6081, "html": "Раскрытие: Игристый — дварф <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> из королевской гвардии, внедрённый расследовать поставки соли; <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a>, которому грозила казнь, в обмен на свободу привёл его в банду. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> чувствует себя преданным, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> — «семью не продают»."}, {"t": "1:44:32", "sec": 6272, "html": "Бой в голубятне: <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> ловит голубя-бомбу и бросает в Мелонеса — взрыв соли; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> выпускает всех голубей (они ненавидят его); <a class=\"ref\" href=\"/c/vitalis/\">Виталис<\/a> голубем снова убивает <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> (третья «клиническая смерть»); облако соли: Цисгендий меняет пол, у кого-то вырастают уши. <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a> благословляет Цисгендия на гарантированный крит — голубь разрывает Виталиса в клочья."}, {"t": "1:51:06", "sec": 6666, "html": "Мелонес сдаётся гвардии. <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> воскрешают зельем, найденным у <a class=\"ref\" href=\"/c/diana/\">Дианы<\/a> (в четвёртый раз). Полсотни голубей выбивают дверь и атакуют <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> — его судьба оставлена на следующий выпуск."}, {"t": "1:53:18", "sec": 6798, "html": "Две монеты в фонд «Аистёнок»; эпилог: сорван план гномов Мелонеса и <a class=\"ref\" href=\"/c/vitalis/\">Виталиса<\/a> распылить тонну соли над столицей; «вернётся ли легендарный герой <a class=\"ref\" href=\"/c/dobromraz/\">Добромраз<\/a>?»"}], "key_events": [{"t": "0:06:29", "sec": 389}, {"t": "0:24:43", "sec": 1483}, {"t": "0:42:57", "sec": 2577}, {"t": "0:57:55", "sec": 3475}, {"t": "1:03:30", "sec": 3810}, {"t": "1:08:53", "sec": 4133}, {"t": "1:17:34", "sec": 4654}, {"t": "1:26:13", "sec": 5173}, {"t": "1:41:21", "sec": 6081}, {"t": "1:51:06", "sec": 6666}], "coins": {"ep": "14", "events": [{"t": "0:22:36", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "партия сторговалась с эльфами (проверка убеждения) и заплатила 4 золотые монеты вместо 5 за пять мешков контрабандной эльфийской соли", "result": null, "sec": 1356, "who_url": null, "reason_html": "партия сторговалась с эльфами (проверка убеждения) и заплатила 4 золотые монеты вместо 5 за пять мешков контрабандной эльфийской соли"}, {"t": "0:51:30", "kind": "earn", "who": "Биктор", "actor": "BRB", "to": null, "reason": "удержал зубами и добил грибное существо, при обыске тела нашёл золотую монету", "result": null, "sec": 3090, "who_url": "/c/biktor/", "reason_html": "удержал зубами и добил грибное существо, при обыске тела нашёл золотую монету"}, {"t": "0:56:52", "kind": "earn", "who": "Эрик Пенисов", "actor": "Кукушкин", "to": null, "reason": "получил монету за изобретательный многоходовый план — запихнуть гриб в пасть медведю, выбить ему глаза и сбежать", "result": null, "sec": 3412, "who_url": "/c/erik-penisov/", "reason_html": "получил монету за изобретательный многоходовый план — запихнуть гриб в пасть медведю, выбить ему глаза и сбежать"}, {"t": "1:02:26", "kind": "spend", "who": "Игристый", "actor": "Данила Поперечный", "to": null, "reason": "потратил монету на способность «предсказание», чтобы напуганная жертва (орк) не могла сама себе навредить", "result": null, "sec": 3746, "who_url": null, "reason_html": "потратил монету на способность «предсказание», чтобы напуганная жертва (орк) не могла сама себе навредить"}, {"t": "1:05:38", "kind": "earn", "who": "Игристый", "actor": "Данила Поперечный", "to": null, "reason": "убил орка двумя кинжалами скрытной атакой, при обыске тела нашёл золотую монету", "result": null, "sec": 3938, "who_url": null, "reason_html": "убил орка двумя кинжалами скрытной атакой, при обыске тела нашёл золотую монету"}, {"t": "1:13:16", "kind": "earn", "who": "Эрик Пенисов", "actor": "Кукушкин", "to": null, "reason": "перелетел через пропасть с кипящим маслом на своих увеличенных (от эльфийской соли) ушах, спас пони и себя", "result": null, "sec": 4396, "who_url": "/c/erik-penisov/", "reason_html": "перелетел через пропасть с кипящим маслом на своих увеличенных (от эльфийской соли) ушах, спас пони и себя"}, {"t": "1:39:10", "kind": "earn", "who": "Юлиан", "actor": "Александр Гудков", "to": null, "reason": "получил монету за комичный эпизод с закрыванием/открыванием подозрительной двери на голубятне", "result": null, "sec": 5950, "who_url": "/c/yulian/", "reason_html": "получил монету за комичный эпизод с закрыванием/открыванием подозрительной двери на голубятне"}, {"t": "1:45:50", "kind": "spend", "who": "Добромраз", "actor": "Руслан Кубик в Кубе", "to": "Юлиан", "reason": "потратил монету на способность «благословение», чтобы следующий бросок союзника (бросок взрывающимся голубем) стал автоматическим критическим", "result": null, "sec": 6350, "who_url": "/c/dobromraz/", "reason_html": "потратил монету на способность «благословение», чтобы следующий бросок союзника (бросок взрывающимся голубем) стал автоматическим критическим"}, {"t": "1:53:18", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "завершили приключение (разгромили сеть контрабанды эльфийской соли и голубятню), получили базовые 2 монеты плюс бонус за бросок d6", "result": "базовые 2 монеты эквивалентны 20 000 руб., итоговая сумма бонуса по броску d6 в отрывке не приведена", "sec": 6798, "who_url": null, "reason_html": "завершили приключение (разгромили сеть контрабанды эльфийской соли и голубятню), получили базовые 2 монеты плюс бонус за бросок d6"}], "totals": [{"who": "Биктор", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/biktor.webp", "who_url": "/c/biktor/", "actor_url": "/p/brb/"}, {"who": "Эрик Пенисов", "actor": "Кукушкин", "earned": 2, "spent": 0, "img": "img/chars/erik-penisov.webp", "who_url": "/c/erik-penisov/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Игристый", "actor": "Данила Поперечный", "earned": 1, "spent": 1, "img": null, "who_url": null, "actor_url": "/p/danila-poperechnyy/"}, {"who": "Юлиан", "actor": "Александр Гудков", "earned": 1, "spent": 0, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Добромраз", "actor": "Руслан Кубик в Кубе", "earned": 0, "spent": 1, "img": "img/chars/dobromraz.webp", "who_url": "/c/dobromraz/", "actor_url": "/p/ruslan-kubik-v-kube/"}], "notes": "Сюжет строится вокруг доставки контрабандной эльфийской соли за золотые монеты — часть монет в выпуске это обычная плата за товар (kind: loot), а не игровая механика. Юлиан погибал в бою с орком и был воскрешён найденным зельем; финал обрывается на битве с взрывающимися голубями в голубятне."}, "cast": [{"name": "Добромраз", "actor": "Руслан Кубик в Кубе", "actor_url": "/p/ruslan-kubik-v-kube/", "race": "человек, жулик-контрабандист, предсказатель", "role": "", "fate": "выжил, получил свободу как осведомитель гвардии", "id": "Добромраз", "url": "/c/dobromraz/", "img": "img/chars/dobromraz.webp", "other": []}, {"name": "Игристый", "actor": "Данила Поперечный", "actor_url": "/p/danila-poperechnyy/", "race": "дварф-монах королевской гвардии под прикрытием одноглазого экс-пирата", "role": "", "fate": "выжил, сменил пол от соли", "id": "Цисгендер", "url": "/c/cisgender/", "img": "img/chars/cisgendij.webp", "other": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}, {"key": "08", "label": "8", "title": "Покушение на Короля"}]}, {"name": "Юлиан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "человек, громила", "role": "", "fate": "выжил (несколько раз оживлён)", "id": "Юлиан", "url": "/c/yulian/", "img": "img/chars/yulian.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Биктор", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "гоблин, контрабандист-шаман", "role": "", "fate": "выжил, ушёл до входа в город", "id": "Биктор", "url": "/c/biktor/", "img": "img/chars/biktor.webp", "other": []}, {"name": "Эрик Пенисов", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "полурослик, плут", "role": "", "fate": "неизвестно (атакован стаей голубей)", "id": "Эрик", "url": "/c/erik-penisov/", "img": "img/chars/erik-penisov.webp", "other": [{"key": "01", "label": "1", "titl
