<script>window.EPD = {"anim": false, "key": "36", "label": "36", "title": "Руины Малестии", "date": "2025-03-09", "minutes": 107, "duration": 6446.0, "video_id": "OqBzHvxBCsg", "branch": "Отряд крысы Ларисы", "branch_color": "#DD7A2F", "place": "Пустошь и погребённая под песками столица Малестийской империи, дворец императора Элона", "short_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a>, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>, ставшие изгоями после «Рыжего петуха», вместе с дезертиром-котом <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрилом<\/a> и орком Лобом отправляются в руины Малестийской империи за оружием против демонов. Там они находят экспедицию лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, не знающую о его смерти, угоняют педальный танк «<a class=\"ref\" href=\"/a/zheleznyy-utyonok/\">Железный утёнок<\/a>» и проникают во дворец. Отряд добывает корону бессмертного императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a> и уничтожает его мумию, но император воскресает. Лариса заключает с ним сделку и становится бессмертной в обмен на обязательство выполнить его будущую просьбу.", "summary_html": "После трагедии на постоялом дворе «Рыжий петух» крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> стали изгоями и решили свергнуть короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, а для войны с демонами добыть древнее оружие в руинах погибшей Малестийской империи. К ним примкнули дезертировавший из сумки <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> кот-сержант <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> и орк Лоб. В пустоши отряд находит застрявшую там больше года экспедицию лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (<a class=\"ref\" href=\"/c/panasiy/\">Панасий<\/a>, доктор Вальд Мудлер, педальный танк «<a class=\"ref\" href=\"/a/zheleznyy-utyonok/\">Железный утёнок<\/a>»), не знающую о смерти Властона. Герои захватывают танк, проникают в погребённый дворец, добывают корону императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a> и побеждают мумию, но в итоге Лариса заключает с воскресающим императором сделку: он даёт ей силу — Лариса становится бессмертной, но обязана однажды выполнить его просьбу, иначе он заберёт её сердце.", "outcome_html": "Все герои выжили; крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> стала бессмертной, но обязана выполнить будущую просьбу императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a>, иначе он заберёт её сердце.", "world_html": ["<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> бессмертна и связана договором с императором <a class=\"ref\" href=\"/c/imperator-elon/\">Элоном<\/a>", "Отряд <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> стал изгоями и намерен свергнуть короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>", "Экспедиция лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> в <a class=\"ref\" href=\"/place/malestiya/\">Малестию<\/a> разгромлена, «<a class=\"ref\" href=\"/a/zheleznyy-utyonok/\">Железный утёнок<\/a>» уничтожен", "Император <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> <a class=\"ref\" href=\"/c/imperator-elon/\">Элон<\/a> бессмертен и не служит ни раю, ни аду"], "scenes": [{"t": "0:01:05", "sec": 65, "html": "Предыстория: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в союзе с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a> выдвинул королю ультиматум — выдать <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a>; король согласился. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> пытались перехватить дитя на «Рыжем петухе», но в стычке со Сфинктерионом «божественный сосуд уничтожен»."}, {"t": "0:03:16", "sec": 196, "html": "Завязка: отряд стал изгоем; у героев древняя карта Малестийской империи, погибшей в катастрофе. Цель — найти в столице <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> оружие против демонической армии."}, {"t": "0:04:43", "sec": 283, "html": "Представление: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> хочет свергнуть <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>, готового скормить демонам ребёнка; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> пытается отмыть репутацию от жёлтой прессы (нужно три подвига без скандала); <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> предал короля; кот <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> дезертировал от <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, вдохновившись Ларисой; орк Лоб носит «шлем интеллекта»."}, {"t": "0:11:29", "sec": 689, "html": "Лагерь «чёрных копателей» в руинах: зеркальная система направляет солнечный луч в пролом под землёй. <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> ранят стрелой, Лоб выдаёт её за ручную крысу."}, {"t": "0:16:05", "sec": 965, "html": "Разведка: над палаткой — флаг <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, солдаты в выцветшей форме войск лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>; они не знают, что Властон мёртв. Под брезентом — «<a class=\"ref\" href=\"/a/zheleznyy-utyonok/\">Железный утёнок<\/a>»."}, {"t": "0:20:52", "sec": 1252, "html": "<a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a> и Лоба ведут к командиру <a class=\"ref\" href=\"/c/panasiy/\">Панасию<\/a>. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>, подражая голосу, уводит часть стражи; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загрызает лучника, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> выпутывается и добивает его дротиком, переодевается в солдатскую форму."}, {"t": "0:34:04", "sec": 2044, "html": "<a class=\"ref\" href=\"/c/panasiy/\">Панасий<\/a> читает бестиарий; <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> говорит ему о гибели <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> от руки <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> — тот не верит и велит сбросить Лоба и Тигрила в яму «к доктору»."}, {"t": "0:37:12", "sec": 2232, "html": "<a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> «умывает» солдата верблюжьей мочой (подвиг «Золотой дождь справедливости»), выведывает, что утёнок — педальная самоходка с пушкой на двоих. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> подменяет ключи офицера на отмычки."}, {"t": "0:44:13", "sec": 2653, "html": "<a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> угоняют танк; погоня на верблюдах, картечь сносит четырёх солдат. <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> совершил три подвига — репутация восстановлена."}, {"t": "0:50:59", "sec": 3059, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> крадёт у <a class=\"ref\" href=\"/c/panasiy/\">Панасия<\/a> дневник Вальда Мудлера: экспедиция из 200 человек по приказу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> искала <a class=\"ref\" href=\"/place/malestiya/\">Малестию<\/a>; две трети погибли, остатки грабили других копателей; лагерь стоит прямо над дворцом императора, а Мудлер спустился вниз за императорской короной, дарующей бессмертие правителю."}, {"t": "0:56:00", "sec": 3360, "html": "В бестиарии — статья о кислотных кубах, которые любят солнце. Рой крыс <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> атакует <a class=\"ref\" href=\"/c/panasiy/\">Панасия<\/a>, солдаты в ужасе разбегаются от «проклятия», Панасий отдаёт перстень. Лариса с дневником и бестиарием прыгает в яму, посылает крысу с зельем животной речи предупредить друзей о минах."}, {"t": "1:02:40", "sec": 3760, "html": "В яме: зал с трупами солдат и жуками-скарабеями; кислотный куб по кличке Куб охраняет проход в императорские покои. Лоб направляет на него солнечный луч, <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> и Лоб убеждают Куба пропустить их (он недавно «пропустил одного» — Мудлера)."}, {"t": "1:07:42", "sec": 4062, "html": "Танк взрывает минированный въезд и спускается в пролом на лебёдке (<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> не удерживает, танк удачно падает на гусеницы)."}, {"t": "1:14:16", "sec": 4456, "html": "Спальня императора: зомби-солдаты <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> с хопешами у шкафа. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> запутывается в своей верёвке; Лоб в ярости крушит зомби, но берёт проклятый хопеш и превращается в зомби, ранив Тигрила."}, {"t": "1:20:14", "sec": 4814, "html": "Танк врывается в зал, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> стреляет из дробовика, <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> освобождает <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a>; ядро разбивает статую женщины и открывает тайный проход; зажигательная смесь сжигает зомби; выстрел <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциуса<\/a> выбивает меч из руки Лоба — проклятие снято."}, {"t": "1:27:12", "sec": 5232, "html": "Из шкафа выходит доктор Вальд Мудлер, глава организации «Ренессанс»: он не верит в смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и мечтает водрузить на него корону императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a> — последний император <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a> обрёл бессмертие и отказался служить и раю, и аду («первое атеистическое государство»). Мудлера связывают."}, {"t": "1:31:55", "sec": 5515, "html": "Тронный зал: мумия императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a> в короне, на алтаре — ссохшийся труп жены с кинжалом в груди. Мудлер тянется к короне, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> парализует его дротиком. <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a> на верёвке, как в «Миссия невыполнима», подменяет корону копией из хлебного мякиша."}, {"t": "1:36:14", "sec": 5774, "html": "Император оживает, поднимает гигантского скорпиона; отряд заваливает проход бомбой, но мумия встаёт у танка и обращает его в ржавчину."}, {"t": "1:39:26", "sec": 5966, "html": "Нежить уязвима к огню: зажигательная смесь и огнемёт <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> поджигают мумию, бутылка горючей настойки Лоба взрывает боекомплект танка — 92 урона, мумию разносит."}, {"t": "1:43:24", "sec": 6204, "html": "<a class=\"ref\" href=\"/c/imperator-elon/\">Император Элон<\/a> вновь собирается из песка: «Ни один муж не может меня убить». Он предлагает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a> сделку-рукопожатие: сила в обмен на одну просьбу в будущем, иначе он заберёт её сердце. Лариса соглашается «во имя добра и Земли»; вихрь песка забирает корону — Лариса становится бессмертной."}, {"t": "1:46:10", "sec": 6370, "html": "Финал: миссия выполнена (110 000 руб. на благотворительность). Закадровый итог: бывшие союзники <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> по отдельности стремятся спасти земной мир."}], "key_events": [{"t": "0:16:05", "sec": 965}, {"t": "0:44:13", "sec": 2653}, {"t": "0:52:56", "sec": 3176}, {"t": "1:02:40", "sec": 3760}, {"t": "1:19:05", "sec": 4745}, {"t": "1:24:20", "sec": 5060}, {"t": "1:27:12", "sec": 5232}, {"t": "1:36:14", "sec": 5774}, {"t": "1:42:08", "sec": 6128}, {"t": "1:44:31", "sec": 6271}], "coins": {"ep": "36", "events": [{"t": "0:39:26", "kind": "earn", "who": "Люциус", "actor": "Куруч", "to": null, "reason": "получил монету авансом за первый «подвиг» — обманом умыл стражника верблюжьей мочой под видом ухода за кожей", "result": null, "sec": 2366, "who_url": "/c/lyucius/", "reason_html": "получил монету авансом за первый «подвиг» — обманом умыл стражника верблюжьей мочой под видом ухода за кожей"}, {"t": "0:47:03", "kind": "spend", "who": "Люциус", "actor": "Куруч", "to": null, "reason": "потратил монету на переброс проверки силы/атлетики, чтобы сдвинуть захваченный танк с места", "result": "со сложностью 14 подвиг засчитан", "sec": 2823, "who_url": "/c/lyucius/", "reason_html": "потратил монету на переброс проверки силы/атлетики, чтобы сдвинуть захваченный танк с места"}, {"t": "0:47:40", "kind": "earn", "who": "Люциус", "actor": "Куруч", "to": null, "reason": "завершил третий «подвиг» — получил оставшиеся две золотые монеты (репутация полностью восстановлена)", "result": null, "sec": 2860, "who_url": "/c/lyucius/", "reason_html": "завершил третий «подвиг» — получил оставшиеся две золотые монеты (репутация полностью восстановлена)"}, {"t": "0:59:55", "kind": "spend", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "потратила монету на переброс проверки исполнения — танец крыс под Майкла Джексона", "result": "итог 16, чего хватило", "sec": 3595, "who_url": "/c/krysa-larisa/", "reason_html": "потратила монету на переброс проверки исполнения — танец крыс под Майкла Джексона"}, {"t": "1:01:36", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "получила монету за тактику — распределила крыс (спрятала кольцо и тетрадь, отправила крысу с дезинформацией к друзьям, пожертвовав зельем звериной речи)", "result": null, "sec": 3696, "who_url": "/c/krysa-larisa/", "reason_html": "получила монету за тактику — распределила крыс (спрятала кольцо и тетрадь, отправила крысу с дезинформацией к друзьям, пожертвовав зельем звериной речи)"}, {"t": "1:06:19", "kind": "spend", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "потратил две монеты на бонус к проверке убеждения стража Куба, чтобы получить разрешение забрать доктора", "result": "совокупного бонуса от двух монет хватило, Куб отступил", "sec": 3979, "who_url": "/c/serzhant-tigril/", "reason_html": "потратил две монеты на бонус к проверке убеждения стража Куба, чтобы получить разрешение забрать доктора"}, {"t": "1:12:42", "kind": "earn", "who": "Люциус", "actor": "Куруч", "to": null, "reason": "получил монету за решительность — успешно посадил кувыркающийся танк на колёса", "result": null, "sec": 4362, "who_url": "/c/lyucius/", "reason_html": "получил монету за решительность — успешно посадил кувыркающийся танк на колёса"}, {"t": "1:24:55", "kind": "earn", "who": "Люциус", "actor": "Куруч", "to": null, "reason": "получил монету за решительность — выстрелил ядром в статую, случайно обнаружив потайной проход", "result": null, "sec": 5095, "who_url": "/c/lyucius/", "reason_html": "получил монету за решительность — выстрелил ядром в статую, случайно обнаружив потайной проход"}, {"t": "1:37:17", "kind": "spend", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки ловкости рук, чтобы подменить корону хлебным мякишем", "result": "удачно — корона подменена незаметно", "sec": 5837, "who_url": "/c/serzhant-tigril/", "reason_html": "потратил монету на переброс проверки ловкости рук, чтобы подменить корону хлебным мякишем"}, {"t": "1:37:19", "kind": "earn", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "получил монету за взрыв бомбой прохода, чтобы отрезать путь гигантскому скорпиону", "result": null, "sec": 5839, "who_url": "/c/serzhant-tigril/", "reason_html": "получил монету за взрыв бомбой прохода, чтобы отрезать путь гигантскому скорпиону"}, {"t": "1:42:50", "kind": "earn", "who": "Сержант Тигрил", "actor": "BRB", "to": null, "reason": "получил монету за идею взорвать боекомплект танка (92 урона), уничтожившую мумию; по репликам идея разделена с Ворон Бароном, но монету адресовали Тигрилу", "result": null, "sec": 6170, "who_url": "/c/serzhant-tigril/", "reason_html": "получил монету за идею взорвать боекомплект танка (92 урона), уничтожившую мумию; по репликам идея разделена с <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Бароном<\/a>, но монету адресовали <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрилу<\/a>"}, {"t": "1:46:31", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили кубик, чтобы добавить монет в общий пул — итог 110 000 руб. на благотворительность", "result": null, "sec": 6391, "who_url": null, "reason_html": "в конце выпуска бросили кубик, чтобы добавить монет в общий пул — итог 110 000 руб. на благотворительность"}], "totals": [{"who": "Люциус", "actor": "Куруч", "earned": 5, "spent": 1, "img": "img/chars/lyucius.webp", "who_url": "/c/lyucius/", "actor_url": "/p/ilya-kuruch/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 1, "spent": 1, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сержант Тигрил", "actor": "BRB", "earned": 2, "spent": 3, "img": "img/chars/serzhant-tigril.webp", "who_url": "/c/serzhant-tigril/", "actor_url": "/p/brb/"}], "notes": "Люциус почти всю серию отрабатывал особую способность «три подвига → три золотые монеты» ради очищения репутации от бульварного скандала (получил один аванс, потом ещё две). Ворон Барон (Воронин) и Лоб (Орлов) в этой серии монет не зарабатывали и не тратили."}, "cast": [{"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, лидер отряда", "role": "", "fate": "выжила, стала бессмертной", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": e/malestiya/\">Руины Малестии<\/a>»", "dir": "back", "color": "#B8901C"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "Параллельная линия <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; оба бывших союзника ищут свой путь спасения мира", "dir": "out", "color": "#C8423B"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Божественный сосуд уничтожен, мирный план провалился", "dir": "back", "color": "#C8423B"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "<a class=\"ref\" href=\"/place/malestiya/\">Руины Малестии<\/a>: сделка <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с мумией императора, <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "50", "label": "50", "title": "Крыса корабельная", "note_html": "<a class=\"ref\" href=\"/place/malestiya/\">Руины Малестии<\/a>, мумия императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a>, свитки Апокалипсиса и бессмертие <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>", "dir": "back", "color": "#DD7A2F"}], "quotes_html": ["«Эта полоса в жизни не чёрная, а скорее коричневая». — <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a>", "«Золотой дождь справедливости». — заголовок подвига <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>", "«Ты не <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрил<\/a>, ты Том Круз».", "«Ни один муж не может меня убить». — император <a class=\"ref\" href=\"/c/imperator-elon/\">Элон<\/a>", "«Мы не заключаем здесь контрактов. Мы пожимаем руки». — император <a class=\"ref\" href=\"/c/imperator-elon/\">Элон<\/a>"], "places_html": "<ul>\n<li>Места: пустошь на месте Малестийской империи; руины столицы <a class=\"ref\" href=\"/place/malestiya/\">Малестия<\/a> (в 5–10 раз больше <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>); лагерь экспедиции над дворцом; зал стражи, спальня и тронный зал императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a>; бухта Фогель (упоминание маршрута экспедиции).<\/li>\n<li>Фракции: отряд <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> («отряд предателей»); остатки войск лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>; организация «Ренессанс» (основана Мудлером при Властоне); <a class=\"ref\" href=\"/place/malestiya/\">Малестийская империя<\/a> («первое атеистическое государство», не служила ни раю, ни аду).<\/li>\n<li>Артефакты: древняя карта <a class=\"ref\" href=\"/place/malestiya/\">Малестии<\/a>; «<a class=\"ref\" href=\"/a/zheleznyy-utyonok/\">Железный утёнок<\/a>» (педальный танк, уничтожен); дневник Вальда Мудлера; бестиарий <a class=\"ref\" href=\"/c/panasiy/\">Панасия<\/a>; перстень Панасия с рубином; корона императора <a class=\"ref\" href=\"/c/imperator-elon/\">Элона<\/a> (дарует бессмертие, забрана императором); проклятые хопеши; зуб мантикоры <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>; шлем интеллекта Лоба; огнемёт <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a>; верёвка <a class=\"ref\" href=\"/c/serzhant-tigril/\">Тигрила<\/a>.<\/li>\n<\/ul>", "chars": {"Элон": {"name": "Император Элон", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/imperator-elon/", "eps": [{"key": "36", "label": "36", "title": "Руины Малестии"}]}, "Лоб": {"name": "Лоб", "img": "img/chars/lob.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D0%BE%D0%B1", "summary": "Лоб - орк, рестлер. Соратник крысы Ларисы.", "infobox": {"Пол": "мужской", "Раса": "орк", "Игрок": "Сергей Орлов"}, "actors": ["Сергей Орлов"], "kind": "pc", "dead": false, "race": "орк", "portraits": [{"ep": "36", "thumb": "img/portraits/62e32bd971397e05.webp"}], "url": "/c/lob/", "eps": [{"key": "36", "label": "36", "title": "Руины Малестии"}]}, "Панасий": {"name": "Панасий", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind":
