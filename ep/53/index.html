<script>window.EPD = {"key": "53", "label": "53", "title": "В поисках Лёши", "date": "2026-09-26", "minutes": 132, "duration": 7893.0, "video_id": "QGsIvO9bNGg", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Кёнигпон, Кальтенбрунские ворота, лес и кладбище разбойников-нежити, Нурикфел", "short_html": "Во время затишья под <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрным Геленбургом<\/a> пятилетний <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> сбегает из дома, и его мать <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> с братом <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> и армейскими товарищами идут по следу. Через стражу ворот, торговца облепиховым маслом и лесную банду разбойников-зомби некроманта Джакса герои выясняют, что Лёша ушёл в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>. Там верховная богиня <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> ставит мальчика перед выбором: остаться с мамой или уйти на небеса спасать мир ценой её жизни. Лёша уходит в портал, а Венера обращает Софию в золотую пыль.", "summary_html": "Осенью, во время затишья под стенами Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, пятилетний <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> сбегает из дома в столице, оставив записку и забрав 11 золотых дяди <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, Юлиан и его армейские товарищи идут по следу: через стражу Кальтенбрунских ворот — к торговцу облепиховым маслом Эппиштайну, к затонувшей телеге у моста и в лес, где хозяйничают разбойники-зомби некроманта Джакса. Герои попадают в плен на кладбище, но выбираются: София высасывает душу Джакса, <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> принимает его облик, единорог выжигает нежить. Выясняется, что Лёша ушёл в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>; там, в саду эльфийского короля, его ждёт верховная богиня <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Она ставит ребёнка перед выбором — остаться с мамой и перестать быть избранным или уйти на небеса и спасти мир ценой матери. Лёша уходит в портал, а Венера одним словом обращает Софию в золотую пыль.", "outcome_html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> погибла, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> ушёл с <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a> на небеса как избранный, который должен сразиться с прадедом <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоном<\/a>. Остальные герои выжили.", "world_html": ["<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> забран <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a> на небеса как избранный против <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>", "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> (мать Лёши) убита <a class=\"ref\" href=\"/c/venera/\">Венерой<\/a>", "Шлёпа попал в небесные чертоги", "Король лесных эльфов лишён рта; эльфы унижены богиней", "Банда нежити некроманта Джакса уничтожена", "Демоны <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> выпустили заложников; под городом затишье"], "scenes": [{"t": "0:02:11", "sec": 131, "html": "Пролог-реклама: громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> спасает от упыря в склепе незадачливого съёмщика квартиры и отправляется «к сестре и племяннику в отпуск»."}, {"t": "0:06:56", "sec": 416, "html": "Предыстория: <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> велела купидону выстрелить в своего брата <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; тот полюбил полурослицу <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>, <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> испепелил сына и превратил беременную Мелиссу в каргу. Мелисса родила сына <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакиса<\/a>; тот женился на эльфийке и стал отцом близнецов; старший, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>, вошёл в семью каннибалов и женился на <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>, их сын — <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, потомок богов, прорицатель, помнящий прошлые реинкарнации, которого не раз пытались похитить демоны. Брэндон обрёл тело, <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> пала, <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> выпустил заложников."}, {"t": "0:10:58", "sec": 658, "html": "Завязка: затишье под <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, отличившимся воинам дали отпуск. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> с боевыми товарищами гостит у <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и Лёши в столице <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>. На одиннадцатый день Юлиан находит записку: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> ушёл из города «кое-что выяснить», вернётся через неделю, взял все монеты дяди."}, {"t": "0:13:35", "sec": 815, "html": "Представление героев: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> (семья каннибалов, мать-паучиха; <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> «перевернул жизнь», семья бросила каннибализм и служит добру); <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (стал жрецом и гениальным полководцем, ломал демонические пушки, уничтожил адский поезд; хочет отдать Лёшу в военную семинарию); <a class=\"ref\" href=\"/c/vitya-mamontov/\">Витя Мамонтов<\/a> (Лёша, возможно, сбежал после предложения «показать дружка»); <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> (прошла «дорогой ада», вышла за дварфа <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a>; Ярус остался в Кунизских горах решать вопрос с душой друга, вытащенной из ада); <a class=\"ref\" href=\"/c/titus/\">Титус<\/a> (близнец Яруса, сопровождает Багиру по просьбе брата и присматривается к Софии)."}, {"t": "0:22:00", "sec": 1320, "html": "Реклама: торговец продаёт «яйцо дракона» — «истинное зрение» <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> показывает куклу."}, {"t": "0:25:42", "sec": 1542, "html": "Кальтенбрунские ворота: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> отвлекает стражников грудью, <a class=\"ref\" href=\"/c/titus/\">Титус<\/a> пытается «заболтать» их, Витя спорит о варёном хариусе. Песочная «3D-голограмма» Лёши не помогает. Витя пытается послать Дружка на стреле к спящему ночному стражнику — критический провал, арбалет отбирают; Титус «решалой» улаживает конфликт."}, {"t": "0:36:11", "sec": 2171, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> соблазняет ночного стражника Каброна в башне: мальчик уехал утром в повозке торговца облепиховым маслом Эппиштайна (с сыном Диди) в сторону деревни Плежа на севере. Каброн начинает душить Софию; она оборачивается коброй и парализует его ядом."}, {"t": "0:43:48", "sec": 2628, "html": "<a class=\"ref\" href=\"/c/bagira/\">Багира<\/a>, прятавшаяся невидимкой, оглушает крестьянина-капустника (Шлёпу), угоняет его телегу; голого Шлёпу закапывают в капусту. Отряд едет на север."}, {"t": "0:48:17", "sec": 2897, "html": "Мост через реку: трое крестьян вытаскивают из ила лиловую телегу с надписью «Эппиштайн и сын». <a class=\"ref\" href=\"/c/titus/\">Титус<\/a> убивает одного крестьянина кинжалом-расчёской; его сталкивают в реку к гигантским пиявкам. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> бомбочкой с моста (крит. провал) до смерти пугает пиявок. Витя находит на дне две свои меченые монеты, в кармане убитого крестьянина — куклу Лёши."}, {"t": "1:00:49", "sec": 3649, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> по следам определяет: здесь было нападение существ, ходящих «как на ходулях»; детские и взрослые следы уходят в лес. В чаще <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> видит на деревьях костяные куколки и трёх крадущихся разбойников."}, {"t": "1:08:22", "sec": 4102, "html": "Бой: <a class=\"ref\" href=\"/c/titus/\">Титус<\/a> молится за <a class=\"ref\" href=\"/c/bagira/\">Багиру<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> опутывает разбойника лозой, Багира отрубает голову другому, Витя на цепне-«тарзанке» долетает до третьего и выясняет, что тот ходит на голых берцовых костях. Убитые разбойники восстают — это зомби, которых надо убивать дважды. Витя договаривается с разбойником Дегрином: их банда некроманта Джакса взяла в заложники деда и двух детей. Сломанная костяная куколка вызывает тревогу; попытка Софии отвлечь свистом — крит. провал."}, {"t": "1:27:28", "sec": 5248, "html": "Святая «бомба»: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/titus/\">Титус<\/a> увеличивают флягу со святой водой до бидона, Витя с помощью Дружка (после ссоры о «симбиозе, а не абьюзе») выстреливает им с динамитом — святой дождь растворяет часть зомби. Остальные наваливаются толпой; герои сдаются, выдав голого Шлёпу за «самого богатого человека в королевстве»."}, {"t": "1:32:26", "sec": 5546, "html": "Кладбище на холме: героев рассаживают по склепам. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> сидит с Эппи и Диди: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> ушёл через подкоп — он хочет спасти маму и едет в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> «что-то увидеть»."}, {"t": "1:36:40", "sec": 5800, "html": "Некромант Джакс приходит к склепу <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/bagira/\">Багиры<\/a>; София опутывает его лозой (крит) и высасывает его душу «душесосом». Управляя телом лозами, она голосом Джакса требует ключи. Багира переодевается Джаксом."}, {"t": "1:41:50", "sec": 6110, "html": "<a class=\"ref\" href=\"/c/titus/\">Титус<\/a> «решалой» убеждает стражника, что голый Шлёпа стоит полтора миллиона золотых; «Джакс»-<a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> выпускает Витю, Титуса и Шлёпу и запирает стражников в склепе."}, {"t": "1:48:02", "sec": 6482, "html": "«Джакс» собирает всех разбойников-зомби в часовне «на летучку», и <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> призывает единорога Мистера Пирожка: его луч света выжигает нежить. Пир борщом и ягодами; Эппи и Диди отпускают."}, {"t": "1:52:30", "sec": 6750, "html": "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> пуст; эльфы скорбно сидят вокруг своего короля (Рика/«<a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>» Луноликого), у которого нет рта. Эльфы рассказывают: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> на чистом эльфийском попросил заглянуть в чашу познания смерти, чтобы узнать, как умрёт его мама; явилась богиня, король хотел призвать дракона, и она лишила его рта; даже Великое древо не помогло."}, {"t": "1:55:30", "sec": 6930, "html": "Три ангела-стража у королевского сада. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> выдаёт Шлёпу за избранного на «проверку»; ангел (по броску) признаёт в нём «ещё одного избранного, божественный сосуд». Героев пропускают."}, {"t": "1:58:40", "sec": 7120, "html": "В саду <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> сидит под фиолетовым куполом, рядом — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>. Все падают на колени. Венера: материнская любовь душит свободу; Лёша — бог, помнящий все прошлые жизни, его место на небесах, он избран спасти мир."}, {"t": "2:02:35", "sec": 7355, "html": "Разговор матери и сына: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> говорит, как мудрец («время разбрасывать камни…»), <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> ставит выбор: остаться с мамой и принять человеческую природу — или уйти на небеса и спасти мир, пожертвовав мамой. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>: «Для меня ты больше, чем весь мир». <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> толкает Шлёпу в портал Венеры. Лёша узнаёт, что его прадед (<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a>) пришёл на небеса убить богов и сражаться с ним должен он."}, {"t": "2:08:55", "sec": 7735, "html": "«Я очень люблю тебя, мам» — <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> прыгает в портал; <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> останавливает время для остальных. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> клянётся сражаться против богов — Венера говорит «Умри», и София рассыпается золотой пылью."}], "key_events": [{"t": "0:11:56", "sec": 716}, {"t": "0:36:11", "sec": 2171}, {"t": "0:48:48", "sec": 2928}, {"t": "1:08:22", "sec": 4102}, {"t": "1:30:55", "sec": 5455}, {"t": "1:36:40", "sec": 5800}, {"t": "1:49:06", "sec": 6546}, {"t": "1:53:26", "sec": 6806}, {"t": "1:58:40", "sec": 7120}, {"t": "2:08:55", "sec": 7735}, {"t": "2:09:40", "sec": 7780}], "coins": {"ep": "53", "events": [{"t": "0:12:42", "kind": "loot", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "Лёша написал в записке, что забрал все 11 золотых монет Юлиана — эти внутриигровые деньги вычеркнули с листа персонажа", "result": null, "sec": 762, "who_url": "/c/yulian/", "reason_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> написал в записке, что забрал все 11 золотых монет <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> — эти внутриигровые деньги вычеркнули с листа персонажа"}, {"t": "0:46:23", "kind": "earn", "who": "Багира", "actor": "Настя Ли", "to": null, "reason": "удачная шутка/отыгрыш — подкупила пьяного свидетеля фразой «одна золотая, я ничего не видел»", "result": null, "sec": 2783, "who_url": "/c/bagira/", "reason_html": "удачная шутка/отыгрыш — подкупила пьяного свидетеля фразой «одна золотая, я ничего не видел»"}, {"t": "0:59:52", "kind": "loot", "who": "Витя Мамонтов", "actor": "Никитин", "to": null, "reason": "нашёл на илистом дне реки две свои помеченные золотые монеты — внутриигровые деньги, потерянные ранее", "result": null, "sec": 3592, "who_url": "/c/vitya-mamontov/", "reason_html": "нашёл на илистом дне реки две свои помеченные золотые монеты — внутриигровые деньги, потерянные ранее"}, {"t": "1:31:31", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "шутка про то, что за убитых торговцев, возможно, дадут денег — внутриигровое золото, а не игровая монета-награда", "result": null, "sec": 5491, "who_url": null, "reason_html": "шутка про то, что за убитых торговцев, возможно, дадут денег — внутриигровое золото, а не игровая монета-награда"}, {"t": "1:39:41", "kind": "earn", "who": "Багира", "actor": "Настя Ли", "to": null, "reason": "остроумная идея — сымитировать голос Джакса, чтобы обмануть грабителей", "result": null, "sec": 5981, "who_url": "/c/bagira/", "reason_html": "остроумная идея — сымитировать голос Джакса, чтобы обмануть грабителей"}, {"t": "1:58:04", "kind": "earn", "who": "София", "actor": "BRB", "to": null, "reason": "смешная реплика по ходу сцены с ангелами и очнувшимся Шлёпой", "result": null, "sec": 7084, "who_url": "/c/sofiya/", "reason_html": "смешная реплика по ходу сцены с ангелами и очнувшимся Шлёпой"}, {"t": "2:06:20", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "шутка — в момент выбора Лёши кто-то из игроков ради прикола пропихнул в портал Шлёпу вместо мальчика", "result": null, "sec": 7580, "who_url": null, "reason_html": "шутка — в момент выбора Лёши кто-то из игроков ради прикола пропихнул в портал Шлёпу вместо мальчика"}, {"t": "2:10:13", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальный подсчёт монет на столе: одному игроку выдали ещё одну монету и предложили бросить к10, чтобы определить итоговую сумму пожертвования", "result": "выпало 4 — вместе с остальными монетами в сумме 90 000 руб. ушли в благотворительный фонд", "sec": 7813, "who_url": null, "reason_html": "финальный подсчёт монет на столе: одному игроку выдали ещё одну монету и предложили бросить к10, чтобы определить итоговую сумму пожертвования"}], "totals": [{"who": "Багира", "actor": "Настя Ли", "earned": 2, "spent": 0, "img": null, "who_url": "/c/bagira/", "actor_url": "/p/nastya-li/"}, {"who": "София", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/sofiya.webp", "who_url": "/c/sofiya/", "actor_url": "/p/brb/"}], "notes": "Почти все монеты в выпуске — награды за шутки и находчивый отыгрыш (kind earn); реальных трат не зафиксировано — единственное обсуждение потратить монету на переброс Вити Мамонтова (0:53:02) закончилось отказом («не надо»). Несколько упоминаний монет — это внутриигровое золото персонажей (loot): деньги Юлиана, украденные Лёшей, монеты, найденные Витей Мамонтовым в реке, и шутка про выкуп за убитых торговцев. В финале выпуска оставшиеся на столе монеты конвертировали в рубли на благотворительность (итого 90 000 руб.)."}, "cast": [{"name": "София", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, друидка", "role": "", "fate": "погибла (обращена Венерой в золотую пыль)", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}]}, {"name": "Юлиан Лектор", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "громила, жрец Солнца", "role": "", "fate": "выжил", "id": "Юлиан", "url": "/c/yulian/", "img": "img/chars/yulian.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key":
