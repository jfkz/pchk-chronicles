<script>window.EPD = {"anim": false, "key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "date": "2024-09-28", "minutes": 150, "duration": 9006.0, "video_id": "Vb9GxPsLiKI", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Постоялый двор «Рыжий петух» семьи Люгеров на краю леса по дороге в Чёрный Геленбург", "short_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> и её спутники устраивают засаду на королевский конвой, везущий <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> маленького <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a>.", "summary_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> во главе адской армии предъявляет королю <a class=\"ref\" href=\"/c/korol-poni-v/\">Понию V<\/a> ультиматум: признать протекторат армии тьмы над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a> и за 7 дней выдать трёхлетнего мальчика <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a>. Король покупает ребёнка у прачки из Зелёного Моста за 30 золотых и отправляет с генерал-адъютантом Феликсом Пимелем. Бывшие соратники Сфинктериона устраивают засаду на постоялом дворе «Рыжий петух» семьи Люгеров, разбираются с призраком погибшего сына хозяина, включают вышку 5G, глушащую магию, усыпляют конвой снотворным и забирают ребёнка у боевого мага. Тут прилетают Сфинктерион и Валя на ядовитой виверне: Сфинктерион объясняет, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, изгнанный бог, хочет вселиться в «божественного» ребёнка, чтобы открыть портал в небесный мир, и ставит ультиматум — отдать ребёнка или начнётся война. Переговоры срываются в бой; под давлением «сосуд нужно разбить» (пророчество горбуна Херона) <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> бьёт ребёнка, атака попадает, и выпуск обрывается в тишине без развязки.", "outcome_html": "Ребёнок отбит у королевского конвоя, но <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> настиг героев; после боя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> ударил ребёнка, и судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a> осталась неизвестной (клиффхэнгер).", "world_html": ["Армия тьмы <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> вышла из Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> и предъявила ультиматум королю", "<a class=\"ref\" href=\"/c/korol-poni-v/\">Король Поний V<\/a> согласился выдать ребёнка армии тьмы", "Раскрыт план Тёмного Властелина: изгнанный бог хочет вселиться в божественного ребёнка и открыть портал в небесный мир", "Судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a> не решена, грозит война", "Вышка 5G на «Рыжем петухе» разрушена"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Интро: пародия на «Джокера» о том, как <a class=\"ref\" href=\"/p/sasha-maloy/\">Малого<\/a> пригласили в ПЧК. «Ранее»: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и исполнил магический контракт; <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад и через год вернулся цитаделью демонов; Сфинктерион с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Вороном Бароном<\/a>, <a class=\"ref\" href=\"/c/lyucius/\">Люциусом<\/a> и Валей уничтожил энергетический купол в храме Солнца; выяснилось, что он в союзе с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>. Валя приняла его сторону, остальные объявили его предателем."}, {"t": "0:07:05", "sec": 425, "html": "Текст ультиматума королю <a class=\"ref\" href=\"/c/korol-poni-v/\">Понию V<\/a>: протекторат армии тьмы над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, запрет провокаций, в течение 7 дней передать в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> живым мальчика <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a>. Подписано: «Командующий армией тьмы, президент <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион Лёвенхарт<\/a>»."}, {"t": "0:08:20", "sec": 500, "html": "<a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> — трёхлетний сын бедной прачки <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Палин<\/a> из Зелёного Моста; она продала сына за 30 золотых. Генерал-адъютант Феликс Пимель с гвардейцами везёт ребёнка; единственная точка для засады — постоялый двор «Рыжий петух» на краю леса. Запущен «условный счётчик» времени из 5 делений."}, {"t": "0:09:27", "sec": 567, "html": "Представление героев: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (выпила зелье звериной речи, потому что щита рядом нет) мстит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> чувствует ответственность, ведь ребёнка назвали в его честь; <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> всё ещё служит в разведотряде короля, но не согласен с жертвой; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> — недоросший древолюд из лесов <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>, почитатель эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>."}, {"t": "0:15:58", "sec": 958, "html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> расспрашивает ясень и тополь: на кладбище двора похоронено семейство Люгеров (3 года назад старик, недавно молодой). На дворе стоит вышка 5G — пока она работает, всякая магия в округе заблокирована (сейчас выключена)."}, {"t": "0:21:30", "sec": 1290, "html": "Мускулистая Баленса Люгер по приказу отца рубит яблоню; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> получает психический урон, когда при нём рубят деревья. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> отвлекает её бачатой; <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> крадёт топор, падает с ним в сухой колодец и находит там медвежью приманку (рыбу в медовом кляре)."}, {"t": "0:28:01", "sec": 1681, "html": "Хозяин Хуга Люгер рад постояльцам и снова велит рубить яблоню. Портрет семьи: жена Донателла, дочери Селин, Баленса, Колзидония, сыновья Херон (горбун) и покойный Карл. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в номере находит тайник Селин — 2 золотых и записку «Мама и папа, я задыхаюсь здесь… я хочу в город»; из кухни пахнет «химией»."}, {"t": "0:36:35", "sec": 2195, "html": "Яблоню Хуга посадил, когда родился его первенец Карл, которого убил медведь; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> обещает убить медведя, и Хуга отдаёт героям охотничье снаряжение."}, {"t": "0:40:07", "sec": 2407, "html": "<a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> соблазняет Баленсу в сарае (5 временных хитов), та соглашается не рубить яблоню. Трофеи сарая: три капкана, сеть, маскировочный костюм «кочка», дымовая шашка, сигнальный фаер, спрей от медведя и бутылёк снотворного Донателлы Люгер."}, {"t": "0:51:05", "sec": 3065, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> голосом отца выманивает Херона. Тот признаётся в вещих снах: придёт <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, небо и поля в огне, «его дух войдёт в мальчика», «ребёнок — сосуд, в него вольют скверну». Пульт от вышки был у деда, его, видимо, положили в могилу."}, {"t": "0:55:34", "sec": 3334, "html": "Кладбище: <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> корнями достаёт из гроба друидический пульт в целлофане. Из свежей могилы встаёт призрак Карла Люгера с яблоком и наносит <a class=\"ref\" href=\"/c/lyucius/\">Люциусу<\/a> 16 урона ледяным касанием. Герои бегут; Кудрегар включает вышку 5G (магия исчезает), но призрак не магический и преследует их."}, {"t": "1:04:56", "sec": 3896, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> на кухне вбивают клин между Хугой и Донателлой (пахнет её снотворным; после смерти Карла у неё зависимость). Селин в слезах обвиняет героев; Ворон Барон возвращает ей монеты и уговаривает подсыпать снотворное в еду гостей в обмен на поездку в город."}, {"t": "1:12:05", "sec": 4325, "html": "Призрак Карла в зале; Хуга узнаёт сына. По просьбе <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> Баленса срубает яблоню, и призрак сгорает в мареве. Хуга плачет."}, {"t": "1:17:22", "sec": 4642, "html": "Передовой отряд (гвардейцы Стасик и Денис) узнаёт <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>; тот выдаёт себя за хозяина двора. Баленса бьёт его, когда он признаётся, что всё ещё любит Валю. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> лепит из хлебного мякиша «PlayStation 4»; гвардейцев отправляют в баню. На кухне находят запас снотворного и два зелья лечения."}, {"t": "1:26:17", "sec": 5177, "html": "Прибывает генерал-адъютант Пимель с шестью всадниками, бронированной повозкой и толстым боевым магом. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> лепит фальшивый портрет «семьи <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>»; <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> убеждает Хугу помочь спасти мальчика «как его сына»."}, {"t": "1:34:13", "sec": 5653, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> вскрывает повозку с отключёнными рунами — она пуста, это обманка. В конюшне гвардеец издевается над Хероном; Ворон Барон убивает его напарника, второй признаётся: ребёнок спит под мантией мага. Херон убивает оставленного с ним гвардейца."}, {"t": "1:42:10", "sec": 6130, "html": "Ужин со снотворным: все засыпают, кроме мага, чья магия не работает из-за вышки. Его запугивают и достают из-под мантии спящего светловолосого малыша в слинге; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> объявляет себя крёстным. Селин остаётся с матерью."}, {"t": "1:48:26", "sec": 6506, "html": "На двор приземляется ядовитая виверна со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> и Валей; южные ворота перекрывает адский гном в шутовском колпаке с огненной лютней — <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>."}, {"t": "1:51:11", "sec": 6671, "html": "Речь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — изгнанный бог, считающий небесных богов несправедливыми (они питаются людскими страданиями и молитвами); вселившись в божественного ребёнка, он откроет портал в небесный мир и будет воевать с богами, а не с землёй. Сфинктерион обещает, что ребёнок выживет, и готов его усыновить; иначе будет война и «миллион гробов». Валя предлагает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a> место в ДК, <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> — должность по сельскому хозяйству."}, {"t": "2:01:05", "sec": 7265, "html": "Херон с мечом требует «разбить сосуд» и тычет в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: «Это сатана». <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> размышляет о «проблеме вагонетки». <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> под вышкой не работает."}, {"t": "2:09:02", "sec": 7742, "html": "Бой: виверна и Валя сносят вышку 5G, магия возвращается. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> массовым внушением приказывает отдать ребёнка; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> поддаются, виверна уносит Кудрегара, и ребёнок оказывается у Вали. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> голосом Сфинктериона приказывает «отмена, отдай ребёнка»; <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> проглатывает собственный парализующий дротик; пыльца Кудрегара сбивает виверну. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> на зелье ускорения призывает рой из 8 крыс, и они выхватывают ребёнка у Вали и тащат в лес."}, {"t": "2:21:38", "sec": 8498, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> некротическим лучом рушит башню, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> закрывает ворота. Сфинктерион в последний раз требует ребёнка; Валя стреляет по крысам и промахивается. Герои спорят, не убить ли ребёнка, раз и Херон, и Сфинктерион называют его сосудом (включают сообщение от «Вадика»)."}, {"t": "2:26:41", "sec": 8801, "html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> идёт к рою крыс и наносит ребёнку двойную атаку с преимуществом — удар попадает. Мастер допускает трактовку «это был захват», все кричат «отдай его нам». Выпуск обрывается в тишине: судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> неизвестна."}], "key_events": [{"t": "0:07:05", "sec": 425}, {"t": "0:08:20", "sec": 500}, {"t": "0:36:35", "sec": 2195}, {"t": "0:51:05", "sec": 3065}, {"t": "0:57:11", "sec": 3431}, {"t": "1:12:05", "sec": 4325}, {"t": "1:34:13", "sec": 5653}, {"t": "1:42:10", "sec": 6130}, {"t": "1:48:26", "sec": 6506}, {"t": "2:09:02", "sec": 7742}, {"t": "2:26:41", "sec": 8801}], "coins": {"ep": "30", "events": [{"t": "0:17:08", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Придумал поговорить с деревьями (ясенем, затем тополем), чтобы разведать, где на постоялом дворе останавливаются люди и лошади.", "result": null, "sec": 1028, "who_url": "/c/voron-baron/", "reason_html": "Придумал поговорить с деревьями (ясенем, затем тополем), чтобы разведать, где на постоялом дворе останавливаются люди и лошади."}, {"t": "0:32:03", "kind": "loot", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "Осматривая комнаты постоялого двора, нашла под половицей тайник с двумя золотыми монетами, завёрнутыми в записку Селин.", "result": null, "sec": 1923, "who_url": "/c/krysa-larisa/", "reason_html": "Осматривая комнаты постоялого двора, нашла под половицей тайник с двумя золотыми монетами, завёрнутыми в записку Селин."}, {"t": "0:45:53", "kind": "spend", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Потратил монету на переброс проверки обольщения/харизмы, ухаживая за дочерью трактирщика Донателлой.", "result": "Со второй попытки получилось — монету потом вернули.", "sec": 2753, "who_url": "/c/lyucius/", "reason_html": "Потратил монету на переброс проверки обольщения/харизмы, ухаживая за дочерью трактирщика Донателлой."}, {"t": "0:50:46", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Использовал способность имитации голоса, изображая мальчика Херона, чтобы выманить его и узнать про пульт от защитной вышки.", "result": null, "sec": 3046, "who_url": "/c/voron-baron/", "reason_html": "Использовал способность имитации голоса, изображая мальчика Херона, чтобы выманить его и узнать про пульт от защитной вышки."}, {"t": "0:58:34", "kind": "spend", "who": null, "actor": null, "to": "Кудрегар", "reason": "Кто-то из игроков потратил свою монету на переброс атлетики Кудрегара, помогая ему сбежать с кладбища от разъярённого призрака-хранителя яблони.", "result": "Кудрегару удалось сбежать.", "sec": 3514, "who_url": null, "reason_html": "Кто-то из игроков потратил свою монету на переброс атлетики <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, помогая ему сбежать с кладбища от разъярённого призрака-хранителя яблони."}, {"t": "1:16:35", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Меткое метанаблюдение о том, что если бы группа не остановила Донателлу раньше, она бы сама срубила яблоню, как и хотел её отец.", "result": null, "sec": 4595, "who_url": "/c/voron-baron/", "reason_html": "Меткое метанаблюдение о том, что если бы группа не остановила Донателлу раньше, она бы сама срубила яблоню, как и хотел её отец."}, {"t": "1:25:21", "kind": "give", "who": "Кудрегар", "actor": "Малой", "to": "Селин", "reason": "Подарил девочке Селин золотую монету на память, чтобы она продолжала доверять отряду.", "result": null, "sec": 5121, "who_url": "/c/kudrigar/", "reason_html": "Подарил девочке Селин золотую монету на память, чтобы она продолжала доверять отряду."}, {"t": "1:31:30", "kind": "earn", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Убедил (с преимуществом) стражника Хугу помочь спасти привезённого в заложники младенца.", "result": null, "sec": 5490, "who_url": "/c/lyucius/", "reason_html": "Убедил (с преимуществом) стражника Хугу помочь спасти привезённого в заложники младенца."}, {"t": "1:45:15", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Запугал мага-охранника, сняв с него колпак и высмеяв, заставив полностью сдаться.", "result": null, "sec": 6315, "who_url": "/c/voron-baron/", "reason_html": "Запугал мага-охранника, сняв с него колпак и высмеяв, заставив полностью сдаться."}, {"t": "1:46:06", "kind": "give", "who": "Кудрегар", "actor": "Малой", "to": "Селин", "reason": "Вернул Селин ещё одну золотую монету, как и обещал, хотя она решила остаться в деревне с матерью.", "result": null, "sec": 6366, "who_url": "/c/kudrigar/", "reason_html": "Вернул Селин ещё одну золотую монету, как и обещал, хотя она решила остаться в деревне с матерью."}, {"t": "2:12:39", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Трое персонажей потратили по монете, перебрасывая спасброски мудрости против массового внушения Сфинктериона отдать ему ребёнка.", "result": null, "sec": 7959, "who_url": null, "reason_html": "Трое персонажей потратили по монете, перебрасывая спасброски мудрости против массового внушения <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> отдать ему ребёнка."}, {"t": "2:19:17", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Напомнил остальным о судьбе несчастной семьи трактирщика, проявив сочувствие к пострадавшим NPC.", "result": null, "sec": 8357, "who_url": "/c/voron-baron/", "reason_html": "Напомнил остальным о судьбе несчастной семьи трактирщика, проявив сочувствие к пострадавшим NPC."}], "totals": [{"who": "Ворон Барон", "actor": "Воронин", "earned": 5, "spent": 0, "img": "img/chars/voron-baron.webp", "who_url": "/c/voron-baron/", "actor_url": "/p/filipp-voronin/"}, {"who": "Люциус", "actor": "Илья Куруч", "earned": 1, "spent": 1, "img": "img/chars/lyucius.webp", "who_url": "/c/lyucius/", "actor_url": "/p/ilya-kuruch/"}, {"who": "Кудрегар", "actor": "Малой", "earned": 0, "spent": 2, "img": "img/chars/kudregar.webp", "who_url": "/c/kudrigar/", "actor_url": "/p/sasha-maloy/"}], "notes": "Найденные Крысой Ларисой под половицей монеты — внутриигровой лут, в totals не включён. Дважды Кудрегар отдавал свои заработанные монеты NPC Селин как подарок (kind: give) — это не типичная передача монеты между игроками, но по смыслу ближе всего к \"give\". В конце выпуска — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие."}, "cast": [{"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, советник", "role": "", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}, {"name": "Люциус", "actor": "Илья Ку tml": "Древолюд <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и слух об убитом ребёнке", "dir": "back", "color": "#2F84C8"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "Провал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> на постоялом дворе «Рыжий петух», гибель малыша <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "Провал на постоялом дворе «Рыжий петух», гибель <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a>, раскол <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "37", "label": "37", "title": "Добровольцы", "note_html": "Гибель <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a> на «Рыжем петухе»", "dir": "back", "color": "#3E9A5E"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и события в постоялом дворе «Рыжий петух»", "dir": "back", "color": "#B03A7A"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Первая неудача с божественным сосудом", "dir": "back", "color": "#C8423B"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "Ультиматум <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "note_html": "Первая неудачная попытка <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> добыть божественное дитя", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Мальчик должен быть живой» — из ультиматума <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>.", "«Сосуд должен быть разбит!» — Херон.", "«Вы хотите пожертвовать миллионами жизней ради одной, а я четырьмя ради миллионов» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>.", "«Какой дипломат прилетает на переговоры с виверной?» — <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>.", "«Крыска, покажи, что у добра есть бицепс» — <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a>."], "places_html": "<ul>\n<li>Места: постоялый двор «Рыжий петух» (гостевой дом, кухня, сарай, конюшня, баня, колодец, семейное кладбище Люгеров, яблоня Карла); <a class=\"ref\" href=\"/place/zelyonyy-most/\">Зелёный Мост<\/a>; Чёрный (Адский) <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>; леса <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>.<\/li>\n<li>Фракции: армия тьмы (<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Адский Геленбург<\/a>); королевская гвардия <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>; отряд <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> и <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> (в шутку «Отряд Доминика Торетто»).<\/li>\n<li>Артефакты: вышка 5G, блокирующая магию (разрушена); друидический пульт от вышки; <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>; бронированная повозка с магическими рунами (обманка); снотворное Донателлы; охотничье снаряжение Хуги; зелья лечения; зелье ускорения; зелье звериной речи; плевательная трубка с парализующими дротиками; зуб мантикоры <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>; хлебный мякиш <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> (лепит немагические предметы); ядовитая виверна; огненная лютня Динь-Диня.<\/li>\n<\/ul>", "chars": {"Лариса": {"name": "Крыса Лариса", "img": "img/chars/larisa.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D0%B0%D1%80%D0%B8%D1%81%D0%B0", "summ
