<script>window.EPD = {"anim": false, "key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "date": "2024-09-28", "minutes": 150, "duration": 9006.0, "video_id": "Vb9GxPsLiKI", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Постоялый двор «Рыжий петух» семьи Люгеров на краю леса по дороге в Чёрный Геленбург", "short_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> и её спутники устраивают засаду на королевский конвой, везущий <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> маленького <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a>.", "summary_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> во главе адской армии предъявляет королю <a class=\"ref\" href=\"/c/korol-poni-v/\">Понию V<\/a> ультиматум: признать протекторат армии тьмы над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a> и за 7 дней выдать трёхлетнего мальчика <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a>. Король покупает ребёнка у прачки из Зелёного Моста за 30 золотых и отправляет с генерал-адъютантом Феликсом Пимелем. Бывшие соратники Сфинктериона устраивают засаду на постоялом дворе «Рыжий петух» семьи Люгеров, разбираются с призраком погибшего сына хозяина, включают вышку 5G, глушащую магию, усыпляют конвой снотворным и забирают ребёнка у боевого мага. Тут прилетают Сфинктерион и Валя на ядовитой виверне: Сфинктерион объясняет, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, изгнанный бог, хочет вселиться в «божественного» ребёнка, чтобы открыть портал в небесный мир, и ставит ультиматум — отдать ребёнка или начнётся война. Переговоры срываются в бой; под давлением «сосуд нужно разбить» (пророчество горбуна Херона) <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> бьёт ребёнка, атака попадает, и выпуск обрывается в тишине без развязки.", "outcome_html": "Ребёнок отбит у королевского конвоя, но <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> настиг героев; после боя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> ударил ребёнка, и судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a> осталась неизвестной (клиффхэнгер).", "world_html": ["Армия тьмы <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> вышла из Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> и предъявила ультиматум королю", "<a class=\"ref\" href=\"/c/korol-poni-v/\">Король Поний V<\/a> согласился выдать ребёнка армии тьмы", "Раскрыт план Тёмного Властелина: изгнанный бог хочет вселиться в божественного ребёнка и открыть портал в небесный мир", "Судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a> не решена, грозит война", "Вышка 5G на «Рыжем петухе» разрушена"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Интро: пародия на «Джокера» о том, как <a class=\"ref\" href=\"/p/sasha-maloy/\">Малого<\/a> пригласили в ПЧК. «Ранее»: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и исполнил магический контракт; <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад и через год вернулся цитаделью демонов; Сфинктерион с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Вороном Бароном<\/a>, <a class=\"ref\" href=\"/c/lyucius/\">Люциусом<\/a> и Валей уничтожил энергетический купол в храме Солнца; выяснилось, что он в союзе с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>. Валя приняла его сторону, остальные объявили его предателем."}, {"t": "0:07:05", "sec": 425, "html": "Текст ультиматума королю <a class=\"ref\" href=\"/c/korol-poni-v/\">Понию V<\/a>: протекторат армии тьмы над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, запрет провокаций, в течение 7 дней передать в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> живым мальчика <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a>. Подписано: «Командующий армией тьмы, президент <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион Лёвенхарт<\/a>»."}, {"t": "0:08:20", "sec": 500, "html": "<a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> — трёхлетний сын бедной прачки <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Пален<\/a> из Зелёного Моста; она продала сына за 30 золотых. Генерал-адъютант Феликс Пимель с гвардейцами везёт ребёнка; единственная точка для засады — постоялый двор «Рыжий петух» на краю леса. Запущен «условный счётчик» времени из 5 делений."}, {"t": "0:09:27", "sec": 567, "html": "Представление героев: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (выпила зелье звериной речи, потому что щита рядом нет) мстит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> чувствует ответственность, ведь ребёнка назвали в его честь; <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> всё ещё служит в разведотряде короля, но не согласен с жертвой; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> — недоросший древолюд из лесов <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>, почитатель эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>."}, {"t": "0:15:58", "sec": 958, "html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> расспрашивает ясень и тополь: на кладбище двора похоронено семейство Люгеров (3 года назад старик, недавно молодой). На дворе стоит вышка 5G — пока она работает, всякая магия в округе заблокирована (сейчас выключена)."}, {"t": "0:21:30", "sec": 1290, "html": "Мускулистая Баленса Люгер по приказу отца рубит яблоню; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> получает психический урон, когда при нём рубят деревья. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> отвлекает её бачатой; <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> крадёт топор, падает с ним в сухой колодец и находит там медвежью приманку (рыбу в медовом кляре)."}, {"t": "0:28:01", "sec": 1681, "html": "Хозяин Хуго Люгер рад постояльцам и снова велит рубить яблоню. Портрет семьи: жена Донателла, дочери Селин, Баленса, Колзидония, сыновья Херон (горбун) и покойный Карл. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> в номере находит тайник Селин — 2 золотых и записку «Мама и папа, я задыхаюсь здесь… я хочу в город»; из кухни пахнет «химией»."}, {"t": "0:36:35", "sec": 2195, "html": "Яблоню Хуга посадил, когда родился его первенец Карл, которого убил медведь; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> обещает убить медведя, и Хуга отдаёт героям охотничье снаряжение."}, {"t": "0:40:07", "sec": 2407, "html": "<a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> соблазняет Баленсу в сарае (5 временных хитов), та соглашается не рубить яблоню. Трофеи сарая: три капкана, сеть, маскировочный костюм «кочка», дымовая шашка, сигнальный фаер, спрей от медведя и бутылёк снотворного Донателлы Люгер."}, {"t": "0:51:05", "sec": 3065, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> голосом отца выманивает Херона. Тот признаётся в вещих снах: придёт <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, небо и поля в огне, «его дух войдёт в мальчика», «ребёнок — сосуд, в него вольют скверну». Пульт от вышки был у деда, его, видимо, положили в могилу."}, {"t": "0:55:34", "sec": 3334, "html": "Кладбище: <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> корнями достаёт из гроба друидический пульт в целлофане. Из свежей могилы встаёт призрак Карла Люгера с яблоком и наносит <a class=\"ref\" href=\"/c/lyucius/\">Люциусу<\/a> 16 урона ледяным касанием. Герои бегут; Кудрегар включает вышку 5G (магия исчезает), но призрак не магический и преследует их."}, {"t": "1:04:56", "sec": 3896, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> на кухне вбивают клин между Хугой и Донателлой (пахнет её снотворным; после смерти Карла у неё зависимость). Селин в слезах обвиняет героев; Ворон Барон возвращает ей монеты и уговаривает подсыпать снотворное в еду гостей в обмен на поездку в город."}, {"t": "1:12:05", "sec": 4325, "html": "Призрак Карла в зале; Хуга узнаёт сына. По просьбе <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> Баленса срубает яблоню, и призрак сгорает в мареве. Хуга плачет."}, {"t": "1:17:22", "sec": 4642, "html": "Передовой отряд (гвардейцы Стасик и Денис) узнаёт <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>; тот выдаёт себя за хозяина двора. Баленса бьёт его, когда он признаётся, что всё ещё любит Валю. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> лепит из хлебного мякиша «PlayStation 4»; гвардейцев отправляют в баню. На кухне находят запас снотворного и два зелья лечения."}, {"t": "1:26:17", "sec": 5177, "html": "Прибывает генерал-адъютант Пимель с шестью всадниками, бронированной повозкой и толстым боевым магом. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> лепит фальшивый портрет «семьи <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>»; <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> убеждает Хугу помочь спасти мальчика «как его сына»."}, {"t": "1:34:13", "sec": 5653, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> вскрывает повозку с отключёнными рунами — она пуста, это обманка. В конюшне гвардеец издевается над Хероном; Ворон Барон убивает его напарника, второй признаётся: ребёнок спит под мантией мага. Херон убивает оставленного с ним гвардейца."}, {"t": "1:42:10", "sec": 6130, "html": "Ужин со снотворным: все засыпают, кроме мага, чья магия не работает из-за вышки. Его запугивают и достают из-под мантии спящего светловолосого малыша в слинге; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> объявляет себя крёстным. Селин остаётся с матерью."}, {"t": "1:48:26", "sec": 6506, "html": "На двор приземляется ядовитая виверна со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> и Валей; южные ворота перекрывает адский гном в шутовском колпаке с огненной лютней — <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>."}, {"t": "1:51:11", "sec": 6671, "html": "Речь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — изгнанный бог, считающий небесных богов несправедливыми (они питаются людскими страданиями и молитвами); вселившись в божественного ребёнка, он откроет портал в небесный мир и будет воевать с богами, а не с землёй. Сфинктерион обещает, что ребёнок выживет, и готов его усыновить; иначе будет война и «миллион гробов». Валя предлагает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a> место в ДК, <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> — должность по сельскому хозяйству."}, {"t": "2:01:05", "sec": 7265, "html": "Херон с мечом требует «разбить сосуд» и тычет в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: «Это сатана». <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> размышляет о «проблеме вагонетки». <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> под вышкой не работает."}, {"t": "2:09:02", "sec": 7742, "html": "Бой: виверна и Валя сносят вышку 5G, магия возвращается. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> массовым внушением приказывает отдать ребёнка; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> поддаются, виверна уносит Кудрегара, и ребёнок оказывается у Вали. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> голосом Сфинктериона приказывает «отмена, отдай ребёнка»; <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> проглатывает собственный парализующий дротик; пыльца Кудрегара сбивает виверну. <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> на зелье ускорения призывает рой из 8 крыс, и они выхватывают ребёнка у Вали и тащат в лес."}, {"t": "2:21:38", "sec": 8498, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> некротическим лучом рушит башню, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> закрывает ворота. Сфинктерион в последний раз требует ребёнка; Валя стреляет по крысам и промахивается. Герои спорят, не убить ли ребёнка, раз и Херон, и Сфинктерион называют его сосудом (включают сообщение от «Вадика»)."}, {"t": "2:26:41", "sec": 8801, "html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> идёт к рою крыс и наносит ребёнку двойную атаку с преимуществом — удар попадает. Мастер допускает трактовку «это был захват», все кричат «отдай его нам». Выпуск обрывается в тишине: судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> неизвестна."}], "key_events": [{"t": "0:07:05", "sec": 425}, {"t": "0:08:20", "sec": 500}, {"t": "0:36:35", "sec": 2195}, {"t": "0:51:05", "sec": 3065}, {"t": "0:57:11", "sec": 3431}, {"t": "1:12:05", "sec": 4325}, {"t": "1:34:13", "sec": 5653}, {"t": "1:42:10", "sec": 6130}, {"t": "1:48:26", "sec": 6506}, {"t": "2:09:02", "sec": 7742}, {"t": "2:26:41", "sec": 8801}], "coins": {"ep": "30", "events": [{"t": "0:17:08", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Придумал поговорить с деревьями (ясенем, затем тополем), чтобы разведать, где на постоялом дворе останавливаются люди и лошади.", "result": null, "sec": 1028, "who_url": "/c/voron-baron/", "reason_html": "Придумал поговорить с деревьями (ясенем, затем тополем), чтобы разведать, где на постоялом дворе останавливаются люди и лошади."}, {"t": "0:32:03", "kind": "loot", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "Осматривая комнаты постоялого двора, нашла под половицей тайник с двумя золотыми монетами, завёрнутыми в записку Селин.", "result": null, "sec": 1923, "who_url": "/c/krysa-larisa/", "reason_html": "Осматривая комнаты постоялого двора, нашла под половицей тайник с двумя золотыми монетами, завёрнутыми в записку Селин."}, {"t": "0:45:53", "kind": "spend", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Потратил монету на переброс проверки обольщения/харизмы, ухаживая за дочерью трактирщика Донателлой.", "result": "Со второй попытки получилось — монету потом вернули.", "sec": 2753, "who_url": "/c/lyucius/", "reason_html": "Потратил монету на переброс проверки обольщения/харизмы, ухаживая за дочерью трактирщика Донателлой."}, {"t": "0:50:46", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Использовал способность имитации голоса, изображая мальчика Херона, чтобы выманить его и узнать про пульт от защитной вышки.", "result": null, "sec": 3046, "who_url": "/c/voron-baron/", "reason_html": "Использовал способность имитации голоса, изображая мальчика Херона, чтобы выманить его и узнать про пульт от защитной вышки."}, {"t": "0:58:34", "kind": "spend", "who": null, "actor": null, "to": "Кудрегар", "reason": "Кто-то из игроков потратил свою монету на переброс атлетики Кудрегара, помогая ему сбежать с кладбища от разъярённого призрака-хранителя яблони.", "result": "Кудрегару удалось сбежать.", "sec": 3514, "who_url": null, "reason_html": "Кто-то из игроков потратил свою монету на переброс атлетики <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, помогая ему сбежать с кладбища от разъярённого призрака-хранителя яблони."}, {"t": "1:16:35", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Меткое метанаблюдение о том, что если бы группа не остановила Донателлу раньше, она бы сама срубила яблоню, как и хотел её отец.", "result": null, "sec": 4595, "who_url": "/c/voron-baron/", "reason_html": "Меткое метанаблюдение о том, что если бы группа не остановила Донателлу раньше, она бы сама срубила яблоню, как и хотел её отец."}, {"t": "1:25:21", "kind": "give", "who": "Кудрегар", "actor": "Малой", "to": "Селин", "reason": "Подарил девочке Селин золотую монету на память, чтобы она продолжала доверять отряду.", "result": null, "sec": 5121, "who_url": "/c/kudrigar/", "reason_html": "Подарил девочке Селин золотую монету на память, чтобы она продолжала доверять отряду."}, {"t": "1:31:30", "kind": "earn", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Убедил (с преимуществом) стражника Хугу помочь спасти привезённого в заложники младенца.", "result": null, "sec": 5490, "who_url": "/c/lyucius/", "reason_html": "Убедил (с преимуществом) стражника Хугу помочь спасти привезённого в заложники младенца."}, {"t": "1:45:15", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Запугал мага-охранника, сняв с него колпак и высмеяв, заставив полностью сдаться.", "result": null, "sec": 6315, "who_url": "/c/voron-baron/", "reason_html": "Запугал мага-охранника, сняв с него колпак и высмеяв, заставив полностью сдаться."}, {"t": "1:46:06", "kind": "give", "who": "Кудрегар", "actor": "Малой", "to": "Селин", "reason": "Вернул Селин ещё одну золотую монету, как и обещал, хотя она решила остаться в деревне с матерью.", "result": null, "sec": 6366, "who_url": "/c/kudrigar/", "reason_html": "Вернул Селин ещё одну золотую монету, как и обещал, хотя она решила остаться в деревне с матерью."}, {"t": "2:12:39", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Трое персонажей потратили по монете, перебрасывая спасброски мудрости против массового внушения Сфинктериона отдать ему ребёнка.", "result": null, "sec": 7959, "who_url": null, "reason_html": "Трое персонажей потратили по монете, перебрасывая спасброски мудрости против массового внушения <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> отдать ему ребёнка."}, {"t": "2:19:17", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "Напомнил остальным о судьбе несчастной семьи трактирщика, проявив сочувствие к пострадавшим NPC.", "result": null, "sec": 8357, "who_url": "/c/voron-baron/", "reason_html": "Напомнил остальным о судьбе несчастной семьи трактирщика, проявив сочувствие к пострадавшим NPC."}], "totals": [{"who": "Ворон Барон", "actor": "Воронин", "earned": 5, "spent": 0, "img": "img/chars/voron-baron.webp", "who_url": "/c/voron-baron/", "actor_url": "/p/filipp-voronin/"}, {"who": "Люциус", "actor": "Илья Куруч", "earned": 1, "spent": 1, "img": "img/chars/lyucius.webp", "who_url": "/c/lyucius/", "actor_url": "/p/ilya-kuruch/"}, {"who": "Кудрегар", "actor": "Малой", "earned": 0, "spent": 2, "img": "img/chars/kudregar.webp", "who_url": "/c/kudrigar/", "actor_url": "/p/sasha-maloy/"}], "notes": "Найденные Крысой Ларисой под половицей монеты — внутриигровой лут, в totals не включён. Дважды Кудрегар отдавал свои заработанные монеты NPC Селин как подарок (kind: give) — это не типичная передача монеты между игроками, но по смыслу ближе всего к \"give\". В конце выпуска — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие."}, "cast": [{"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, советник", "role": "", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}, {"name": "Люциус", "actor": "Илья Ку html": "Древолюд <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и слух об убитом ребёнке", "dir": "back", "color": "#2F84C8"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "Провал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> на постоялом дворе «Рыжий петух», гибель малыша <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "Провал на постоялом дворе «Рыжий петух», гибель <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a>, раскол <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "37", "label": "37", "title": "Добровольцы", "note_html": "Гибель <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a> на «Рыжем петухе»", "dir": "back", "color": "#3E9A5E"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и события в постоялом дворе «Рыжий петух»", "dir": "back", "color": "#B03A7A"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Первая неудача с божественным сосудом", "dir": "back", "color": "#C8423B"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "Ультиматум <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> и <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "note_html": "Первая неудачная попытка <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> добыть божественное дитя", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Мальчик должен быть живой» — из ультиматума <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>.", "«Сосуд должен быть разбит!» — Херон.", "«Вы хотите пожертвовать миллионами жизней ради одной, а я четырьмя ради миллионов» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>.", "«Какой дипломат прилетает на переговоры с виверной?» — <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>.", "«Крыска, покажи, что у добра есть бицепс» — <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a>."], "places_html": "<ul>\n<li>Места: постоялый двор «Рыжий петух» (гостевой дом, кухня, сарай, конюшня, баня, колодец, семейное кладбище Люгеров, яблоня Карла); <a class=\"ref\" href=\"/place/zelyonyy-most/\">Зелёный Мост<\/a>; Чёрный (Адский) <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>; леса <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>.<\/li>\n<li>Фракции: армия тьмы (<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Адский Геленбург<\/a>); королевская гвардия <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>; отряд <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> и <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> (в шутку «Отряд Доминика Торетто»).<\/li>\n<li>Артефакты: вышка 5G, блокирующая магию (разрушена); друидический пульт от вышки; <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>; бронированная повозка с магическими рунами (обманка); снотворное Донателлы; охотничье снаряжение Хуги; зелья лечения; зелье ускорения; зелье звериной речи; плевательная трубка с парализующими дротиками; зуб мантикоры <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>; хлебный мякиш <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> (лепит немагические предметы); ядовитая виверна; огненная лютня Динь-Диня.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>45<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>45<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>4<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>16<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>10<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>14<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa24-11\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Люциус точно появится в следующих приключениях<\/b><\/div><p>Обсуждая мерч (фигурки <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>), авторы сказали, что <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> точно будет появляться в следующих приключениях.<\/p><blockquote>«Люциуса, потому что Люциус точно будет появляться в следующих приключениях»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-11\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1402\" target=\"_blank\" rel=\"noopener\">0:23:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Инициатива бросается автоматически; в выпуске 30 кидали «живую»<\/b><\/div><p>Броски инициативы пропали с экрана, потому что мастер их автоматизировал: программа сама расставляет персонажей по порядку. Когда неважно, кто начинает, первый ход обычно отдают игрокам. В выпуске 30 первый ход был важен, и там игроки бросали инициативу вживую.<\/p><blockquote>«в тридцатом выпуске сняли, там важно было, кто начинает, у кого преимущество первого хода. И тогда игроки кидали живую инициативу»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa26/#qa26-2\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=957\" target=\"_blank\" rel=\"noopener\">0:15:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-3\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Сюжет будет завязан на Люции Палене, сыне Эрика<\/b><\/div><p>На вопрос о сыне <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люции<\/a> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> проговорился, что на нём будет завязано всё, хотя игроки считали его «малышом-пустышкой». Перед подкастом авторы напомнили им о Люции. Если бы игроки помнили о нём, то на съёмках 1 мая не совершили бы «одиознейший поступок». Зрителям посоветовали ждать будущих выпусков.<\/p><blockquote>«Это всё не то, что будет, всё на нём будет завязано... мы-то думали, что это малыш-пустышка»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa26/#qa26-3\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=1128\" target=\"_blank\" rel=\"noopener\">0:18:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Задумка: третий акт с появлением Сфинктериона после «лёгкой» части<\/b><\/div><p>Авторы рассчитывали, что первые две трети приключения (до добычи ребёнка) игроки пройдут часа за три, решат, что всё кончилось, и тут появятся <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с Валей. На деле к третьему акту прошло около пяти часов, и игроки уже были вымотаны.<\/p><blockquote>«Мы рассчитывали, что вы... первые 2/3 приключения до добычи ребёнка вы пройдёте чуть быстрее.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa30/#qa30-1\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=817\" target=\"_blank\" rel=\"noopener\">0:13:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Тестовая игра: ребёнка отдали Сфинктериону<\/b><\/div><p>Приключение заранее прогнали на сотрудниках: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> играл Селезнёв, Валю — Шатохин. Крыса убежала в лес на волкодаве (в основной игре про волкодавов забыли), но у Сфинктериона было преимущество на проверку поиска добрых существ. После короткого спора и удара виверной тестеры ребёнка отдали. Большой зал со зрителями растягивает съёмку на 30–40% по сравнению с маленьким.<\/p><blockquote>«Закончилось там всё тем, что ребёнка они отдали, потому что Сфинктерионом был я, а Валей был Гриша.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa30/#qa30-2\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=1005\" target=\"_blank\" rel=\"noopener\">0:16:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa30-3\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Кудрегар мог спрятать ребёнка в лесу<\/b><\/div><p>Если бы <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> унёс ребёнка и договорился с лесом, деревья передавали бы его друг другу и укрывали. Сложность найти его была бы очень высокой.<\/p><blockquote>«Если ребёнка уносит Кудрегар-дерево и договаривается с лесом, чтобы они его закрывали, там высокая сложность и хрен этого ребёнка найдёшь.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa30/#qa30-3\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=1067\" target=\"_blank\" rel=\"noopener\">0:17:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-4\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB выяснил у авторов мотивацию Сфинктериона<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> перед игрой подробно расспросил Селезнёва о мотивации героя. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> заключил контракт, чтобы вернуть свой народ из ада, и выполняет его. Ему сказали, что есть и другие божественные дети и порталы, так что смерть этого ребёнка ничего не решит, а сам ребёнок, если его используют, выживет.<\/p><blockquote>«Мне сказали, что есть другие дети, что даже если они убьют, это вообще ничего не решит. Найдут других детей, найдут какой-нибудь портал.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa30/#qa30-4\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=1366\" target=\"_blank\" rel=\"noopener\">0:22:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Заряды Щита Чёрного Властелина вдали от ада<\/b><\/div><p>Вдали от ада у щита <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> пять зарядов. Три он потратил на массовое внушение, и осталось два — максимум на одну молнию, после чего щит бесполезен. Подсказку зала, что магия не работает из-за вышки, авторы назвали плохим выкриком.<\/p><blockquote>«У Сфинктериона на щите вдали от ада пять зарядов. Он потратил три заряда на то, чтобы сделать внушение.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-5\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=1750\" target=\"_blank\" rel=\"noopener\">0:29:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-6\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезанный ход команды Ларисы — почему Сфинктерион «ходил дважды»<\/b><\/div><p>Команда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> выиграла общую инициативу и походила первой. Потом команда <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> около 15 минут совещалась, так и не заявив действий, и мастер передал ход обратно. Эти 15 минут вырезали, поэтому зрителям показалось, что мастер подыгрывал Сфинктериону и давал ему ходить два раза. На монтаже вышку 5G «снесли за один ход», хотя в первом ходу были и неудачные попытки.<\/p><blockquote>«Пришлось вырезать на монтаже как раз-таки этот ход. Там было 15 минут примерно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-6\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=1876\" target=\"_blank\" rel=\"noopener\">0:31:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-7\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Семь монет на перебросы в финальном бою<\/b><\/div><p>Для боя игрокам засчитали семь благотворительных монет, которые можно было тратить на перебросы, не уменьшая сбор. Три потратили на спасброски от очарования щитом: прошла только <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>. Остальные монеты игроки, решив, что игра кончилась, забыли использовать.<\/p><blockquote>«Семь золотых монет на переброс. Они были все ваши.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-7\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=2017\" target=\"_blank\" rel=\"noopener\">0:33:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-8\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Что Селезнёв сказал BRB в гримёрке<\/b><\/div><p>Пока <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> и <a class=\"ref\" href=\"/p/sergey-orlov/\">Орлов<\/a> ждали выхода, Селезнёв сообщил им только одно: <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> переспал со старшей дочерью хозяина, Баленсой, и теперь она на стороне героев. Других подсказок, по его словам, не было.<\/p><blockquote>«Вадик сказал, что да, типа Люциус возлежал со старшей сестрой, и она теперь на его стороне.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa30/#qa30-8\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=2229\" target=\"_blank\" rel=\"noopener\">0:37:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Люциус не мог отдать ребёнка ни при каких условиях<\/b><\/div><p><a class=\"ref\" href=\"/p/ilya-kuruch/\">Куруч<\/a> рассказал, что после разговора с Селезнёвым перед игрой понял: его <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> не может отдать ребёнка ни при каких условиях, только биться насмерть или укрыть его. Поэтому он за столом настаивал на драке.<\/p><blockquote>«Я для себя понял... что я не могу этого ребёнка отдать при любых условиях.»<\/blockquote><p class=\"note\">Куруч · <a href=\"/pod/qa30/#qa30-9\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=2294\" target=\"_blank\" rel=\"noopener\">0:38:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-10\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>У Сфинктериона относительная свобода воли<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не под полной властью щита: чем дальше он от ада, тем слабее щит, и решения он принимает сам. Под вышкой 5G щит не работал, так что свои слова он говорил «от чистого сердца».<\/p><blockquote>«У Сфинктериона относительная свобода воли. Чем дальше он от ада, тем... слабее, в принципе, щит.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-10\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=2816\" target=\"_blank\" rel=\"noopener\">0:46:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему мастер сразу сказал Сфинктериону про вышку<\/b><\/div><p>Мастер не дал броска на знание о вышке 5G, потому что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уже дважды сталкивался с такими вышками — в выпусках 5 и 8 — и знает, как они работают. Подсказка при этом прозвучала из зала.<\/p><blockquote>«Сфинктерион два раза с этой вышкой встречался... И в восьмом выпуске, и в пятом выпуске.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-11\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3016\" target=\"_blank\" rel=\"noopener\">0:50:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-12\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Противников можно было обезвредить нелетально<\/b><\/div><p>Мастер напомнил: персонаж на нуле хитов не мёртв, а при ударе можно заявить нелетальную атаку. Например, оглушить Валю, связать и взять в плен (но не бомбой). Мёртвым считается тот, чей урон в минусе превысил максимум здоровья.<\/p><blockquote>«Всегда можно, нанося урон, заявить о том, что я наношу удар нелетальный, я оглушаю.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-12\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3349\" target=\"_blank\" rel=\"noopener\">0:55:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-13\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>BRB целился переубедить Ворона Барона<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что в переговорах главной целью для него был <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>: в прошлый раз тот колебался, а в карточке персонажа авторы прописали ему роль «мечущегося» и здравомыслящего.<\/p><blockquote>«Моей целью был Фил, потому что он в прошлый раз метался.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa30/#qa30-13\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3805\" target=\"_blank\" rel=\"noopener\">1:03:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-14\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кудрегару соблазнить Баленсу было бы почти невозможно<\/b><\/div><p>Мастер сказал, что для <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> сложность соблазнения Баленсы была 3: она его узнала и была безумно в него влюблена. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> в той ситуации он поставил бы огромную сложность, около 20 с помехой, так что помогли бы только две двадцатки.<\/p><blockquote>«Это была бы, наверное, двадцатая сложность с помехой на кубике, то есть две двадцатки бы смогли бы решить ситуацию.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa30/#qa30-14\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=4357\" target=\"_blank\" rel=\"noopener\">1:12:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-15\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Диалог Кудрегара с Хероном чуть не вырезали<\/b><\/div><p>Монтажёр при первой сборке вырезал весь диалог <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> с горбуном Хероном, решив, что тот «унижает его в каждой фразе». Авторы вернули сцену.<\/p><blockquote>«Он вырезал весь диалог Кудрегара с Хероном... Я говорю: «Не, давайте возвращаем».»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-15\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=4484\" target=\"_blank\" rel=\"noopener\">1:14:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-16\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Видения Херона, возможно, послали небесные боги<\/b><\/div><p>Зрители предположили, что боги небес послали Херону видения, чтобы «сосуд» уничтожили и <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> не попал на небеса. Авторы не стали ни подтверждать, ни опровергать. Один из ведущих склонился к «скорее да»: Херона озвучивал мастер, «бог игры».<\/p><blockquote>«Херон был как Сфинктерион у Тёмного Властелина, только... у небес.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-16\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=4807\" target=\"_blank\" rel=\"noopener\">1:20:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa30-17\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Сфинктерион больше не будет вести переговоры<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> заявил, что это были последние уговоры <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: в следующий раз он будет драться щитом и мечом, а переманивать придётся уже <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a>. Лариса, по словам <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, мстительна и может довести Сфинктериона до нуля хитов, но убивать его не хочет.<\/p><blockquote>«Вот в этот раз уговоры были последними. Я лучше погибну, но я буду применять все навыки.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa30/#qa30-17\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=5462\" target=\"_blank\" rel=\"noopener\">1:31:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa30-18\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Люций Пален погиб — «ветвь рода Пэнисовых отрублена»<\/b><\/div><p>Авторы подтвердили, что удар <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> убил ребёнка. Воскресить его зельями нельзя: решение игроков зафиксировано, и менять его авторы не будут. По их словам, этим «отрублена ветвь рода Пэнисовых», то есть <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> был из потомков <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Смерть намеренно не показали на экране.<\/p><blockquote>«Это ветвь рода Пэнисовых отрублена... мы даже авторски не будем менять это решение, потому что это решение игроков за столом.»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep30.md: «судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> неизвестна», «возможная связь с <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Пален<\/a>, прямо не подтверждено» — по словам авторов, Люций погиб окончательно, а его смерть «отрубила ветвь рода Пэнисовых», то есть мальчик — потомок <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> (сын его бывшей Кейт Пален).<\/p><p class=\"note\"><a href=\"/pod/qa30/#qa30-18\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=5821\" target=\"_blank\" rel=\"noopener\">1:37:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa30-19\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>После финала Сфинктерион натравил на героев короля<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что было дальше со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>: он улетел на виверне объясняться перед <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>, а по пути заглянул к королю <a class=\"ref\" href=\"/c/korol-poni-v/\">Понию V<\/a> и сказал, что из-за этой группы народ погибнет и армия тьмы придёт за ним. Теперь на героев будет охота.<\/p><blockquote>«Я заглянул к королю Понию... и сказал, что из-за вот этой группы ваш народ погибнет и тёмная армия придёт по вашу душу.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa30/#qa30-19\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=5885\" target=\"_blank\" rel=\"noopener\">1:38:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa30-20\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндону остались только два потомка — Эрик и Лёша<\/b><\/div><p><a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон (Тёмный Властелин)<\/a> должен вселиться в божественное тело своего потомка, чтобы попасть в небесный мир. После гибели <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> в живых остались только <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> (неизвестно, жив ли он) и <a class=\"ref\" href=\"/c/lyosha/\">Лёша Пэнисов<\/a>.<\/p><blockquote>«Брэндон должен вселиться в своего потомка. Из потомков Брэндона в живых остались только Эрик Пэнисов... и остался Лёша Пэнисов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-20\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=6039\" target=\"_blank\" rel=\"noopener\">1:40:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-21\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему Ворон Барон не перешёл к Сфинктериону<\/b><\/div><p><a class=\"ref\" href=\"/p/filipp-voronin/\">Воронин<\/a> ответил, что финал снимали около двух часов ночи и он уже плохо соображал. Вдобавок было странно семь часов спасать ребёнка, чтобы потом отдать его. Правильного ответа он не видел и остался с командой, с которой был в этом и прошлом выпуске.<\/p><blockquote>«Было принято решение не метаться из команды в команду, а остаться с теми, с кем я был весь этот выпуск и прошлый.»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa30/#qa30-21\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=6179\" target=\"_blank\" rel=\"noopener\">1:42:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa30-22\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Тёмный Властелин — не глава ада<\/b><\/div><p><a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, несмотря на имя, не главный в аду: есть иерархия, и он даже не глава первого круга, так что ему тоже может «прилететь». Это падший ангел, низвергнутый, по его мнению, несправедливо.<\/p><blockquote>«Тёмный Властелин, хоть он так и называется, но он не главный, глава первого круга ада... там тоже есть иерархия.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-22\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=6242\" target=\"_blank\" rel=\"noopener\">1:44:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa30-23\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Механику подвигов Люциуса могут изменить<\/b><\/div><p>Обсуждали, что механику <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> (за настоящий подвиг, о котором пишут газеты, он получает золотую монету) могут пересмотреть: после провала его уверенность пошатнулась. Газеты теперь будут печатать о нём ориентировки.<\/p><blockquote>«Его будут печатать просто уже как ориентировку.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-23\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=6371\" target=\"_blank\" rel=\"noopener\">1:46:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-24\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Валя никогда не была бывшей Люциуса<\/b><\/div><p><a class=\"ref\" href=\"/p/sergey-orlov/\">Сергей Орлов<\/a> в образе Вали ответил, что та никогда не была бывшей <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>: он лишь сам к ней подкатывал. С <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> у неё сугубо рабочие отношения. Сам Орлов хотел бы сыграть мужского персонажа вместо Вали.<\/p><blockquote>«Никогда Валя не была бывшая Люциуса... только то, что он ко мне подкатывал сам, этот Люциус.»<\/blockquote><p class=\"note\">Орлов · <a href=\"/pod/qa30/#qa30-24\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7095\" target=\"_blank\" rel=\"noopener\">1:58:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa30-25\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Что было бы, отдай герои ребёнка: война на небесах<\/b><\/div><p>Мастер сказал, что, забери <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ребёнка, тот остался бы жив: в теле поселилась бы душа Тёмного Властелина, а душа малыша отошла бы на второй план. Сам он «топил» за этот вариант: небеса горят, боги падают на землю и прячутся среди людей, демоны низвергают ангелов и уничтожают валькирий, а на главной площади распят <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, и <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> рассказывает «реальную историю» <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>.<\/p><blockquote>«Мне очень хотелось, чтобы горели небеса... распятие Гелиоса где-нибудь на главной площади, где Брэндон вещает и рассказывает реальную историю.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa30/#qa30-25\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7518\" target=\"_blank\" rel=\"noopener\">2:05:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-26\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Сюжет к этой точке привели и обстоятельства реального мира<\/b><\/div><p>На вопрос, затронет ли война ада и небес земной мир, авторы отказались отвечать: это как спросить, чем кончится книга. Они признали, что к текущей точке сюжета ПЧК во многом привели обстоятельства реального мира. Был бы за столом <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a>, до такого, вероятно, не дошло бы.<\/p><blockquote>«В точку, в которой сейчас находятся подземелья сюжетно, эти обстоятельства нас и привели, по большому счёту.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-26\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7777\" target=\"_blank\" rel=\"noopener\">2:09:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-27\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Маг не почувствовал действие вышки<\/b><\/div><p>Потерю магии из-за вышки 5G нельзя почувствовать без специальной заявки и проверки восприятия. Конвой заехал, ничего подозрительного не заметил, и маг засаду не заподозрил.<\/p><blockquote>«Это нельзя почувствовать. Ну, то есть можно, если ты именно делаешь такую заявку... проверку восприятия.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-27\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7841\" target=\"_blank\" rel=\"noopener\">2:10:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-28\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему ребёнок не проснулся, когда вышка отключила магию<\/b><\/div><p>Мальчика усыпили не заклинанием, а зельем-транквилизатором, поэтому вышка 5G не сняла сон. Авторы решили, что в приключении ребёнок не действует сам, а служит объектом, как артефакт.<\/p><blockquote>«Мы для себя решили, что ребёнок у нас не действует, он просто как объект, как артефакт.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-28\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7867\" target=\"_blank\" rel=\"noopener\">2:11:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa30-29\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Медведь и баня — несыгранные способы победить<\/b><\/div><p>Медведь был задуман как инструмент героев: стоило помахать медвежьей приманкой (рыбой в медовом кляре), и он раскидал бы и гвардию, и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>. Ещё был вариант загнать гвардейцев в баню (прямая подсказка «от баньки никто не отказывается»), закрыть и поджечь. Игроки выбрали другой предложенный путь — усыпление.<\/p><blockquote>«Вот помахал, прибежал медведь, он мог раскидать и войска, и раскидать и Сфинктериона или кого угодно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-29\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7929\" target=\"_blank\" rel=\"noopener\">2:12:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa30-30\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Если бы яблоню срубили сразу<\/b><\/div><p>Если бы яблоню Карла срубили в начале, призрак не появился бы (его бы отпустило), и добыть пульт от вышки из могилы было бы гораздо проще.<\/p><blockquote>«Призрак бы не появился. Призрак был бы отпущен, добыть пульт, который находится в могиле на кладбище, было бы в разы проще.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-30\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=8004\" target=\"_blank\" rel=\"noopener\">2:13:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-31\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем вмешался Сфинктерион<\/b><\/div><p>Герои вряд ли повезли бы ребёнка королю: в мотивации <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> было прописано, что он сначала добудет ребёнка, выяснит, зачем тот нужен, и решит сам. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> же действует открыто и законно, по условиям ультиматума: временный протекторат над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, отказ от провокаций и ребёнок в течение 7 дней.<\/p><blockquote>«У Ворона Барона было написано о том, что я думаю, что король совершает ошибку. Я сначала добуду ребёнка, разузнаю, зачем он нужен.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-31\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=8103\" target=\"_blank\" rel=\"noopener\">2:15:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-32\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему выпуск закончился тишиной, а не песней<\/b><\/div><p>Сюжетные песни писали под настроение: «Сиротки из Мёртвых топей» — по идее <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>, песня к «Возвращению в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>» подчёркивала смерть <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>, а песню после «Судьбы <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» дали, чтобы сбить смех в финале. В выпуске 30 авторы намеренно оставили зрителя в тишине наедине с впечатлениями.<\/p><blockquote>«Здесь конкретно именно в этом выпуске хотелось, чтобы... ты наедине побыл с этими впечатлениями.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-32\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=8218\" target=\"_blank\" rel=\"noopener\">2:16:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa31-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Соболев должен был играть весь выпуск, а кракена сильно вырезали<\/b><\/div><p><a class=\"ref\" href=\"/p/ilya-sobolev/\">Илья Соболев<\/a> должен был сидеть за столом с самого начала (возможно, вместо <a class=\"ref\" href=\"/c/gogen/\">Гогена<\/a>), но у него была смена на съёмках. Он приехал позже и долго ждал в гримёрке, пока герои освободят кракена; на моторе он отыграл около полутора часов. Сцену резко сократили: не хотели повторять финальный поворот #30 и не могли вытащить конструктив из непрерывного крика за столом.<\/p><blockquote>«Илья вышел и, кто был на моторе, подтвердит, выдал ещё шоу на полтора часа игрового времени»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-9\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=1150\" target=\"_blank\" rel=\"noopener\">0:19:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-19\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>«Культ Кракена» происходит после «Ультиматума Сфинктериона»<\/b><\/div><p><a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> не был в двух местах одновременно: его появление паразитом в мозгу кракена показывает, что #31 идёт после событий на постоялом дворе «Рыжий петух» в #30. После неудачи <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> Динь-Диня отправили на менее почётную миссию — скормили кракену, чтобы управлять им.<\/p><blockquote>«действие этого приключения происходит после событий в Рыжем петухе, в выпуске номер 30»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-19\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=2972\" target=\"_blank\" rel=\"noopener\">0:49:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa31-23\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Схема перемещений между мирами<\/b><\/div><p>Селезнёв показал схему миров, нарисованную Катей Гандрабурой. Демоны ходят между адом и Землёй, небесные существа — между небом и Землёй. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, переставший быть божеством, может попасть в ад, но путь наверх ему закрыт. Только люди с кристаллами телепортации, как <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>, могут попасть и в ад, и на небо. Как созданы очень прочные границы между мирами, пока не раскрывают.<\/p><blockquote>«люди, которых здесь олицетворяет Пахом, с помощью кристаллов телепортации могут перемещаться как в адский мир, так и в небесный»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa31/#qa31-23\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=3825\" target=\"_blank\" rel=\"noopener\">1:03:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-24\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Демоны не могли пройти через портал, им нужен был задел<\/b><\/div><p>Ни демоны, ни <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, ни <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> не могут пройти через портал с <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Острова соблазна<\/a> на небо. Его тащили к Чёрному <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургу<\/a>, чтобы держать рядом на будущее: когда Тёмный Властелин сам попадёт на небеса и снимет барьер или найдёт другую лазейку. На схеме отдельно показан ребёнок со стрелкой наверх: через него Тёмный Властелин и хочет подняться.<\/p><blockquote>«демоны, ни Тёмный Властелин, ни Сфинктерион не могут проникнуть через портал, открытый на острове соблазна, в Небесный мир»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep31.md: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> назван «(<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>)» — это Брэндон, изгнанный сын <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> (#27). Там же сказано, что демоны хотят «через портал попасть на небеса»; по словам авторов, сейчас пройти через портал они не могут и тащили его к <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургу<\/a> про запас.<\/p><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa31/#qa31-24\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=3888\" target=\"_blank\" rel=\"noopener\">1:04:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa33-2\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>В #30 в таверну должны были прийти Сфинктерион и Валя<\/b><\/div><p>Попутно вспомнили #30: его задумывали так, чтобы игроки «не наигрались» в таверне, а затем туда пришли <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с Валей. Так в итоге и вышло.<\/p><blockquote>«Вот так задумывался тридцатый выпуск, что вы не наигрались в этой в таверне и пришёл бы Сфинктерион с Валей.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-2\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=992\" target=\"_blank\" rel=\"noopener\">0:16:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-5\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Отчасти Мишу задумали как месть Гудкова BRB<\/b><\/div><p>Один из авторов объяснил метаигровую часть замысла: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>, которого <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> предал в #24 и вымотал в #30, дали возможность «отомстить» Big Russian Boss, чтобы и тот испытал предательство сокомандника за столом. Гудков ответил, что не мстил, а просто следовал заданной легенде.<\/p><blockquote>«задумка была в том, чтобы дать Александру Гудкову возможность отомстить именно Биг Рашен Боссу»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-5\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3744\" target=\"_blank\" rel=\"noopener\">1:02:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-16\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мастер о границах ретроспективной заявки<\/b><\/div><p>Бреганов объяснил: ретроспективная заявка допустима, если персонаж мог сделать это за кадром в разумные сроки и последствия ещё не объявлены. Решает мастер. Задним числом надеть бронежилет на уже убитого <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> нельзя. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мог заранее заявить, что голуби следят за домом <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>, но только до того, как узнал о предательстве Миши.<\/p><blockquote>«если герой или персонаж что-то за кадром мог сделать в разумные сроки... то нет ничего плохого в том, чтобы сказать, я ретроспективно заявляю»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa35/#qa35-16\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5836\" target=\"_blank\" rel=\"noopener\">1:37:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-22\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему Сфинктериону не дали поговорить с отрядом<\/b><\/div><p>Зрители спросили, почему <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>, в отличие от прошлых выпусков, не дали спора с оппонентами. Ответили, что слушать препирательства в третий раз невозможно: их всё равно вырезают на монтаже, а потом всё кончается боем.<\/p><blockquote>«Третий раз, что ли, слушать препирательство, которое мы вырезаем.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-22\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7550\" target=\"_blank\" rel=\"noopener\">2:05:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa36-2\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Лариса пошла против Поний V<\/b><\/div><p>Мотивацию <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> авторы взяли из слов <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> в подкасте после #30: король начал договариваться с демонами, и Лариса стала относиться к нему враждебно. По карточке она «мстительный убийца». Для неё недопустимы любые договорённости с адом: если король на них идёт, он не её король. Лариса не против рая. Она хочет изгнать адские войска с земли и стала «третьей силой» наряду со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалой<\/a> и бесом Мишей.<\/p><blockquote>«Для крысы договорённости недопустимы. Если король допускает какие-то договорённости с адской армией, он не её король. Всё, она его свергает»<\/blockquote><p class=\"note\"><a href=\"/pod/qa36/#qa36-2\">Подкаст по #36<\/a> · <a href=\"https://youtu.be/oEqxCRDdITw?t=512\" target=\"_blank\" rel=\"noopener\">0:08:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-38\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд<\/b><\/div><p>Отметили, что сбылось видение Херона: «небо упало, оно в огне». <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> считает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выполнил свою задачу перед Тёмным властелином и логичнее всего ему вернуться домой, в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>. Остальные возразили, что ни боги, ни люди, считающие его предателем, его в покое не оставят.<\/p><blockquote>«Получается, Херон был прав. Небо упало, оно теперь в огне.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa51-52/#qa51-52-38\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><\/section>", "chars": {"Пони V": {"name": "Король Поний V", "img": "img/chars/ponij-v.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9F%D0%BE%D0%BD%D0%B8%D0%B9_V", "summary": "По́ний V — молодой король Понии, пришедший к власти после смерти своего отца.", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Неигровой", "На вики": "Поний V"}, "actors": [], "kind": "npc", "dead": false, "race": "Человек", "portraits": [], "url": "/c/korol-poni-v/", "eps": [{"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, "Сфинктерион": {"name": "Сфинктерион", "img": "img/chars/sfinkterion.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D1%84%D0%B8%D0%BD%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D0%BE%D0%BD", "summary": "Сфинктериóн Лёвенхарт — первый персонаж вселенной «Подземелья Чикен Карри». Молодой воин, потомок древнего и знатного рода, Сфинктерион вначале стремился
