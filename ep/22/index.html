<script>window.EPD = {"key": "22", "label": "22", "title": "Отряд Солнца", "date": "2023-12-06", "minutes": 121, "duration": 7256.0, "video_id": "rmrg22uITEc", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Столица королевства (Кёнигпон): рынок Садосад, лавка эльфа Дододиса", "short_html": "Через год после провала <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> в ад семья бывших каннибалов с паладином <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a> — «Отряд Солнца» — истребляет нечисть в столице и берёт заказ эльфа <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a>. В лавке они побеждают гулей и изгоняют призрака из сестры эльфа, находят золотую маску Януса и встречают деда Али, вернувшегося из ада слугой Тёмного Властелина. Дододис надевает маску, становится Янусом и губит семью газом и наёмниками, Али уносит Лёшу. Всё это оказывается видением: у Лёши открылся дар предвидения, и семья отказывается от заказа.", "summary_html": "Прошёл год после катастрофы: <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад и вернулся «<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрным Геленбургом<\/a>», в столице появилась нечисть. Семья бывших каннибалов (<a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, бабушка <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a>) с паладином <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a> стала «Отрядом Солнца»: за деньги они истребляют нечисть и копят на учёбу маленького Лёши. Эльф-торговец <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> нанимает их очистить лавку. Там они бьются с гулями и призраком, вселившимся в сестру эльфа через проклятое ожерелье, находят в сейфе золотую маску Януса, а в тайной комнате встречают деда Али, вернувшегося из ада слугой Тёмного Властелина. Эльф надевает маску, превращается в Януса и травит всех газом; наёмники убивают семью, а Али уносит Лёшу. Но всё это оказалось видением: у Лёши открылся дар предвидения, он приходит в себя у входа в лавку, и семья отказывается от заказа.", "outcome_html": "Все живы: трагедия оказалась видением Лёши. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> получил дар предвидения и знает тайну <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, семья избегает ловушки.", "world_html": ["Прошёл год после катастрофы; <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> вернулся из ада как <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>, над ним не восходит солнце", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> пропал, <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a> без правителя", "В столице нечисть и комендантский час, война вампирских кланов", "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> готовится объявить независимость", "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> связан с нечистью; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> вербует мёртвых (Али)", "У Лёши открылся дар предвидения"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Заголовки газет: катастрофа на юге, <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стёрт с лица земли, президент <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> пропал, <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a> без правителя; версии о «продаже души»; в провал бьют молнии, город вернулся; разведчики короля пропадают; «<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> — цитадель зла»; нечисть в столице, комендантский час; годовщина катастрофы; над Чёрным Геленбургом не восходит солнце; король наказывает за слухи об адском вторжении; <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> готовится объявить независимость; пророки обещают адский апокалипсис; в столице война вампирских кланов, замечен восьмихвостый зверь."}, {"t": "0:01:12", "sec": 72, "html": "В таверне «Барсук» «заграничные купцы» пересказывают историю «Отряда Солнца»: семья каннибалов из таверны «Кайф» сбежала в столицу; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> провалили доставку эльфийской соли, и <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> приговорил их к смерти; жрецы храма Солнца нарекли Лёшу избранным; демоны пытались украсть малыша, но семья его спасла и примкнула к свету."}, {"t": "0:06:36", "sec": 396, "html": "Представление: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> — мать-одиночка, копит на лучшую эльфийскую школу для Лёши; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> получил от Солнца «Карающее слово»; бабушка <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a> закодировалась от алкоголя в Доме проклятых, чтобы не превращаться в паучиху, скорбит по мужу Али, убитому в «Кайфе»; паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> охраняет избранного ребёнка; <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> не видит в себе никаких способностей."}, {"t": "0:13:02", "sec": 782, "html": "Заказ: эльф <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> из торгового района/рынка Садосад на восточной окраине столицы — в его доме завелось зло. На рынке гадалка («Елена Блиновская») предсказывает Лёше «золотой свет» и продаёт <a class=\"ref\" href=\"/c/yulian/\">Юлиану<\/a> «марафон из пяти шагов». По рынку тройками ходят наёмники Януса и досматривают прохожих."}, {"t": "0:18:29", "sec": 1109, "html": "Семья крадётся между домами, чтобы обойти наёмников (Лёше дают соску с коньяком). Наёмники ловят <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, но после его «счёта до одиннадцати» подозрительно отпускают; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> понимает, что они хотели бы его убить, но почему-то не стали."}, {"t": "0:22:43", "sec": 1363, "html": "У лавки всякой всячины перепуганный <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>: при нём на покупателя что-то набросилось, в доме остались сестра <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> и три кошки. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> в объятиях ломает ему рёбра, выбивая плату (сошлись на двух золотых и кассе). Эльф гладит Лёшу по голове: «Малютка, будь осторожен»."}, {"t": "0:32:24", "sec": 1944, "html": "В торговом зале <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> «божественным чувством» чует нежить, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> замечает тень на балках. <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a> выпивает из фляги и становится паучихой; паутина сбивает кошку. Из-за прилавка на <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> прыгает гуль."}, {"t": "0:37:45", "sec": 2265, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> говорит с кошкой (разговор с животными); <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> вызывает гуля на дуэль, получает трупный яд, но выдерживает и «Карой Света» вспарывает гуля (30 урона). В кармане сгоревшего трупа покупателя и в кассе — золотые монеты."}, {"t": "0:43:08", "sec": 2588, "html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> находит за прилавком вино «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>», пьянеет и лезет через кошачью дверцу; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> вытаскивает его. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> освобождает кошку — та убегает."}, {"t": "0:46:20", "sec": 2780, "html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> на складе: за картиной (купец покупает раба) — сейф, рядом магическое оружие; он утаскивает оружие."}, {"t": "0:48:29", "sec": 2909, "html": "В спальне хозяина из-под кровати гуль тяжело ранит <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a> (без сознания). <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> лечит её «целебными руками» через поцелуй с языком; с потолка на него прыгает второй гуль (у Кряхтуна 2 здоровья). <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> отрубает гулю руку, Женуар-паучиха проглатывает одного гуля, Кряхтун отбивается табуреткой и «экспертом длинных мечей», Юлиан рассекает гулю рот."}, {"t": "1:04:04", "sec": 3844, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> в облике кошки бежит к Лёше: над ним парит одержимая призраком пухлая эльфийка — сестра <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a>. Присыпка для подгузников попадает Софии в рот (крит-провал)."}, {"t": "1:06:17", "sec": 3977, "html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a> опутывает последнего гуля паутиной; допрос: осталось два гуля, пришли «поесть», а прислала их «золотая маска» — <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> (понято за монету: золотая маска связана с миром нечисти). <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> испепеляет гуля «божественным словом»."}, {"t": "1:11:47", "sec": 4307, "html": "Призрак касается Лёши (первый «синяк») и некротическим касанием валит <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> (17 урона); <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> стреляет из магического арбалета, но не может его взвести. Эмоциональная сцена: «пробуждение силы» Лёши не удаётся. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> лечит Софию."}, {"t": "1:22:28", "sec": 4948, "html": "Экзорцизм: <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a> узнаёт, что проклятие исходит от ожерелья на <a class=\"ref\" href=\"/c/kristina/\">Кристине<\/a>; <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> читает отряду вдохновляющие стихи (Лермонтов, Тютчев) — бонусный кубик. Женуар пригвождает одержимую паутиной к стене, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> кропит святой водой, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> поёт «Солнце Монако» — призрак выходит из тела и бьёт Лёшу; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> разрубает ожерелье друидским серпом — призрак исчезает."}, {"t": "1:31:13", "sec": 5473, "html": "Ягоды друида приводят <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> в себя: ожерелье ей подарил брат. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> уговаривает её назвать код; в тумбочке <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> — записка с кодом и бычий пузырь, который Лёша проглатывает. В сейфе — золотая маска Януса (полулицо улыбается, полулицо плачет)."}, {"t": "1:36:32", "sec": 5792, "html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> надевает маску; голос из маски предлагает ему всемогущество: «Убей моего хозяина». Маску срывают."}, {"t": "1:38:42", "sec": 5922, "html": "За кошкой через скрытую дверь в обоях — комната для переговоров, где плачет человек, пахнущий серой. Это дед Али, муж <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a>: после смерти он попал в ад, но «справедливый» <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> дал ему шанс; зовёт семью отстроить <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> и поклониться ему, но сначала убить паладина. Признаётся, что сговорился с торговцем, чтобы заманить семью, и «купил <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>». Семья отказывается."}, {"t": "1:46:10", "sec": 6370, "html": "Входит <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, притягивает к себе маску Януса и превращается в Януса («ничего личного»), дёргает рычаг — из трубок идёт парализующий газ. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> парализованы; входят наёмники с пузырями на головах (противогазы). <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> притворяется убитой, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> закалывает себя, чтобы «разбудить» силу ребёнка."}, {"t": "1:51:37", "sec": 6697, "html": "Наёмники убивают <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и <a class=\"ref\" href=\"/c/zhanuariya/\">Женуар<\/a>, <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> закалывает <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a>; Али уносит Лёшу в переулок: «Мы увидимся с ними ещё раз, но уже в аду… твоя злость нужна нам»."}, {"t": "1:56:01", "sec": 6961, "html": "Лёше горько, сила подступает; решающий бросок доверяют зрителю Василию (сложность 10) — успех."}, {"t": "1:57:03", "sec": 7023, "html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> открывает глаза: эльф <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> гладит его по голове у входа в лавку, вся семья и паладин живы. Всё было видением. Семья отказывается от заказа и уходит. Эпилог: Лёша узнал о своём даре предвидения; что он сделает с открывшейся тайной Януса — в будущих выпусках."}], "key_events": [{"t": "0:00:06", "sec": 6}, {"t": "0:13:02", "sec": 782}, {"t": "0:37:45", "sec": 2265}, {"t": "1:06:17", "sec": 3977}, {"t": "1:22:28", "sec": 4948}, {"t": "1:36:32", "sec": 5792}, {"t": "1:38:42", "sec": 5922}, {"t": "1:46:10", "sec": 6370}, {"t": "1:51:37", "sec": 6697}, {"t": "1:57:03", "sec": 7023}], "coins": {"ep": "22", "events": [{"t": "0:24:54", "kind": "loot", "who": "Кряхтун", "actor": "Александр Паль", "to": null, "reason": "Кряхтун душит помощника эльфийской лавки, требуя денег за то, что отряд не разгромит склад; сошлись на двух золотых монетах.", "result": "эльф соглашается отдать две золотые монеты", "sec": 1494, "who_url": "/c/paladin-krihta/", "reason_html": "<a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> душит помощника эльфийской лавки, требуя денег за то, что отряд не разгромит склад; сошлись на двух золотых монетах."}, {"t": "0:40:59", "kind": "loot", "who": "Кряхтун", "actor": "Александр Паль", "to": null, "reason": "После победы над Гулем Кряхтун обыскивает карман убитого и кассу лавки в поисках денег.", "result": "найдены 2 золотые монеты — одна в кармане трупа, одна в кассе", "sec": 2459, "who_url": "/c/paladin-krihta/", "reason_html": "После победы над Гулем <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> обыскивает карман убитого и кассу лавки в поисках денег."}, {"t": "1:09:36", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Провал проверки Проницательности при попытке понять ответ связанного Гуля о том, кто послал нечисть; кто-то из отряда потратил золотую монету на переброс (не ясно, кто именно).", "result": "переброс удался, узнали про «золотую маску», связанную с миром нечисти (Янус)", "sec": 4176, "who_url": null, "reason_html": "Провал проверки Проницательности при попытке понять ответ связанного Гуля о том, кто послал нечисть; кто-то из отряда потратил золотую монету на переброс (не ясно, кто именно)."}, {"t": "1:13:56", "kind": "other", "who": "Лёша", "actor": "Никита Кукушкин", "to": null, "reason": "После неудачного броска атаки арбалетом с помехой семья в шутку обсуждала, не отдать ли золотую монету противнику-призраку («иностранное финансирование»), но решили монету не давать.", "result": "монету не потратили, переброса не было", "sec": 4436, "who_url": "/c/lyosha/", "reason_html": "После неудачного броска атаки арбалетом с помехой семья в шутку обсуждала, не отдать ли золотую монету противнику-призраку («иностранное финансирование»), но решили монету не давать."}, {"t": "1:39:47", "kind": "earn", "who": "Кряхтун", "actor": "Александр Паль", "to": null, "reason": "Мастер наградил монетой за отыгранное Кряхтуном божественное сострадание при входе в комнату к плачущему персонажу.", "result": null, "sec": 5987, "who_url": "/c/paladin-krihta/", "reason_html": "Мастер наградил монетой за отыгранное <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a> божественное сострадание при входе в комнату к плачущему персонажу."}, {"t": "1:57:03", "kind": "other", "who": null, "actor": "Василий (зритель из зала)", "to": null, "reason": "Критический спасбросок д20 (сложность 10) поручили сделать случайному зрителю Василию; мастер объявил, что переброса не будет даже за монету.", "result": "переброс запрещён, результат окончательный", "sec": 7023, "who_url": null, "reason_html": "Критический спасбросок д20 (сложность 10) поручили сделать случайному зрителю Василию; мастер объявил, что переброса не будет даже за монету."}, {"t": "1:59:11", "kind": "other", "who": null, "actor": "Никита Кукушкин", "to": null, "reason": "Финальный бросок в конце эфира определил размер пожертвования — выпало пять золотых монет, отправленных в общий благотворительный фонд.", "result": "5 золотых монет переданы на благотворительность", "sec": 7151, "who_url": null, "reason_html": "Финальный бросок в конце эфира определил размер пожертвования — выпало пять золотых монет, отправленных в общий благотворительный фонд."}], "totals": [{"who": "София", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sofiya.webp", "who_url": "/c/sofiya/", "actor_url": "/p/brb/"}, {"who": "Лёша", "actor": "Никита Кукушкин", "earned": 0, "spent": 0, "img": "img/chars/lyosha-penisov.webp", "who_url": "/c/lyosha/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 0, "spent": 0, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Женуар", "actor": "Варнава", "earned": 0, "spent": 0, "img": "img/chars/zhenuariya.webp", "who_url": "/c/zhanuariya/", "actor_url": null}, {"who": "Кряхтун", "actor": "Александр Паль", "earned": 1, "spent": 0, "img": "img/chars/kryahtun.webp", "who_url": "/c/paladin-krihta/", "actor_url": "/p/aleksandr-pal/"}], "notes": "Игровые монеты почти не расходовались: Кряхтун заработал 1 монету за отыгрыш божественного сострадания, и ещё 1 монету кто-то из отряда потратил на переброс проверки Проницательности (личность игрока не ясна из транскрипта). Отдельно фигурируют «лутовые» золотые монеты — вымогательство у эльфа и находки у трупа/в кассе (4 монеты) — это не игровая механика, а внутриигровые деньги персонажей. В конце эфира финальный бросок Никиты Кукушкина принёс 5 монет на благотворительность, а критический бросок зрителя Василия мастер прямо запретил перебрасывать даже за монету."}, "cast": [{"name": "София", "a
