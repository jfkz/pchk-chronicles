<script>window.EPD = {"anim": false, "key": "38", "label": "38", "title": "Возлюбленная", "date": "2025-05-19", "minutes": 111, "duration": 6650.0, "video_id": "bDkJlzAFKjY", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Деревня Лысая Падь и окрестные леса Вирджинвальда", "short_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> ищет забытую возлюбленную Тёмного Властелина, чтобы остановить его любовью.", "summary_html": "Бог Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> когда-то испепелил своего сына Брэндона (ныне <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>) за запретную любовь к полурослице, а её проклял и лишил памяти. <a class=\"ref\" href=\"/c/gnomka-talala/\">Гномка Талала<\/a>, воин света, задумала остановить Тёмного Властелина любовью: найти его возлюбленную, вернуть ей память и привести в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. По фото со скрижали Брэндона отряд находит деревню <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a> в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>, где все жители расплачиваются частями тела с таинственной лесной знахаркой. Пройдя дом-ловушку со стражем-домовёнком Кузей (и едва не погибнув от мимика и битых бутылок), герои узнают имя возлюбленной — <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — и получают урну с прахом Брэндона. Через красноколпачника они выходят на логово знахарки, уничтожают живой дом «Сигмадом» и мечом Гелиуса снимают проклятие с превратившейся в каргу Мелиссы; она вспоминает любовь, но за возвращение сына «должна что-то отдать» — и тут на скрижаль приходит сообщение от Гелиуса.", "outcome_html": "Все герои выжили; <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> расколдована, получила урну с прахом <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и готова отправиться с <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалой<\/a>, но за возвращение сына должна чем-то заплатить.", "world_html": ["<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — Брэндон, сын Верховного бога <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>", "Возлюбленная Тёмного Властелина <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> расколдована и вернула память", "Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> был отдан цыганам и назван Пенисовым — источник божественного рода Пенисовых", "Проклятие знахарки над деревней <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a> снято, её живой дом уничтожен", "<a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> вмешивается в план <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> через скрижаль"], "scenes": [{"t": "0:01:15", "sec": 75, "html": "Предыстория: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> через портал попала на небеса, узнала, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> — изгнанный сын Верховного Бога, а небеса наживаются на страданиях людей; бог Солнца дал ей меч, скрижаль сына и грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a>; на <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Острове Соблазна<\/a> Талала победила адских тварей и стала воином света."}, {"t": "0:03:17", "sec": 197, "html": "Легенда: <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> узнал о запретной любви сына к беременной полурослице, испепелил тело сына, а дух заточил в аду; полурослицу проклял и стёр ей память. Сын — Брэндон — взял имя <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>. Историю <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> поведал гномский бог <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a>. Задача — найти возлюбленную Брэндона и вернуть ей память."}, {"t": "0:04:31", "sec": 271, "html": "Представление: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> (план — «любовь спасёт мир»); грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> (по флагу <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> и клейму «ЛП» на свинье опознал деревню <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a>); принц кентавров <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> — сын королевы кентавров и барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда Лёвенхарта<\/a>, сводный брат <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, командовал обороной южных лесов Вирджинвальда; <a class=\"ref\" href=\"/c/leofitra/\">Лея Фитра<\/a> — выжившая после чумы полуэльфийка, бывшая содержанка гнома из Змея Хрустального, укушенная вампирами в гномской бане и ставшая дампиром; речной гном <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> из Гуся Пещерного (изгнан драконом Гимелудом), изобретатель с механической рукой, советник принца."}, {"t": "0:13:03", "sec": 783, "html": "Деревня <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a>: фото сделано полвека назад. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> находит самый ветхий дом с дырявой крышей и следами крови внутри."}, {"t": "0:15:55", "sec": 955, "html": "Однорукий <a class=\"ref\" href=\"/c/haydar/\">Хайдар<\/a> с топором встречает отряд грубо; <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> «модельной позой» очаровывает его. Остальные заходят в дом Хайдара: к кровати прикована его жена — нежить, оживлённая тёмной магией."}, {"t": "0:26:03", "sec": 1563, "html": "<a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> сбивает <a class=\"ref\" href=\"/c/haydar/\">Хайдара<\/a> хвостом; <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> мечом <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> снимает с Хайдара неизвестное проклятие. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> катает его над деревней: женщины здесь не могут рожать уже полвека, молодёжь уходит; жену ему «вылечила» знахарка из леса, которую никто не видел; рассказать больше он боится."}, {"t": "0:37:38", "sec": 2258, "html": "Беззубый крестьянин угощает горьким молоком; его корова Зоя бросается на <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a> и ранит её; <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> хватает корову за рога, <a class=\"ref\" href=\"/c/leofitra/\">Лея Фитра<\/a> подвешивает её силком."}, {"t": "0:44:08", "sec": 2648, "html": "Дом с фото: <a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> выбивает дверь и сбивает самострел. Изнутри грозит домовёнок Кузя, 50 лет ждущий хозяев. Дом полон ловушек: липкий пол (<a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> прилип), мимик-сундук хватает Лею Фитру, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> падает на осколки бутылок и оказывается при смерти, Конский проваливается в яму под ковром."}, {"t": "1:03:32", "sec": 3812, "html": "<a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> договаривается с Кузей: помощь за обещание вернуть хозяйку. Домовёнок вытаскивает героев; <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> откачивает <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a>. Кузя узнаёт меч — «этим мечом прокляли хозяйку». Андрей скармливает мимику корову Зою, и сундук выплёвывает Лею Фитру."}, {"t": "1:10:12", "sec": 4212, "html": "<a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> горном призывает двух ополченцев прочесать лес. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> угрозами заставляет Кузю вынести вещи из дома: зелья и урну — прах <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>."}, {"t": "1:15:53", "sec": 4553, "html": "Рассказ Кузи: <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> и <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a>, бросивший небеса, жили здесь; бог запретил браки богов с земными (от них рождаются полубоги). <a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a> явился с мечом, испепелил сына, мечом проклял Мелиссу и свёл её с ума; она стала «чудовищем», поедавшим детей в утробе; жители её изгнали. Родившегося сына Кузя отдал цыганам, которые назвали его «Пенисовым». Кузя отдаёт урну в обмен на обещание вернуть хозяйку."}, {"t": "1:18:52", "sec": 4732, "html": "Беззубый крестьянин (отдал знахарке зубы за воскрешение коровы) после снятия проклятия рассказывает ритуал: записку с желанием, смоченную кровью, кладут в дупло сухого дуба желаний на северо-западе; её забирает зверёк и приносит условия знахарки — обычно часть тела."}, {"t": "1:22:25", "sec": 4945, "html": "<a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> пишет записку своей кровью. Красная белка забирает её; после атак <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a>, Леи Фитры и копья Конского <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> снимает с неё проклятие — это злая фея-красноколпачник. Говорящий меч <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> бьёт молнией в дуб, и запуганный красноколпачник ведёт отряд в лес."}, {"t": "1:31:22", "sec": 5482, "html": "Логово: каменный дом среди костей оказывается живым домом из плоти — «Сигмадомом»; удар ноги отбрасывает Конского. <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> находит уязвимость (огонь и божественный свет); луч меча отрубает дому ногу, жир Леи Фитры валит его, <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> когтями пробивает червивое сердце."}, {"t": "1:39:22", "sec": 5962, "html": "Из руин выходит карга (бывшая <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a>) и молнией выводит из строя <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> и Конского. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> уговаривает её, <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпей<\/a> ищет её слабое место и тщетно «шарит в складках»; наконец Помпей открывает урну и грозит развеять прах <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>."}, {"t": "1:47:37", "sec": 6457, "html": "Карга соглашается на расколдовывание: <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> касается её мечом <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> — сложное проклятие спадает, и она превращается в милую бабушку-полурослицу. <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> забирает урну. Талала сообщает, что её сын жив; Мелисса отвечает, что для этого «должна что-то отдать». На скрижали приходит сообщение от Гелиуса — продолжение следует. 70 000 руб. на благотворительность."}], "key_events": [{"t": "0:03:17", "sec": 197}, {"t": "0:21:48", "sec": 1308}, {"t": "0:44:08", "sec": 2648}, {"t": "0:55:47", "sec": 3347}, {"t": "1:14:45", "sec": 4485}, {"t": "1:15:53", "sec": 4553}, {"t": "1:20:28", "sec": 4828}, {"t": "1:28:14", "sec": 5294}, {"t": "1:38:50", "sec": 5930}, {"t": "1:47:37", "sec": 6457}, {"t": "1:49:03", "sec": 6543}], "coins": {"ep": "38", "events": [{"t": "0:19:51", "kind": "earn", "who": "Лея Фитра", "actor": "Вика Чума", "to": null, "reason": "получила монету за грамотную идею — сначала выяснить, какое именно проклятие наложено, прежде чем его снимать", "result": null, "sec": 1191, "who_url": "/c/leofitra/", "reason_html": "получила монету за грамотную идею — сначала выяснить, какое именно проклятие наложено, прежде чем его снимать"}, {"t": "0:28:08", "kind": "earn", "who": "Гномка Талала", "actor": "Гудков", "to": null, "reason": "получила монету за (возможно случайное) применение снятия проклятия на муже — сняла с него одержимость лошадьми, хоть и не то проклятие, что искали", "result": null, "sec": 1688, "who_url": "/c/gnomka-talala/", "reason_html": "получила монету за (возможно случайное) применение снятия проклятия на муже — сняла с него одержимость лошадьми, хоть и не то проклятие, что искали"}, {"t": "0:41:46", "kind": "earn", "who": "Лея Фитра", "actor": "Вика Чума", "to": null, "reason": "получила монету за предположение, что мужчина и корова обращались к знахарке — это объяснило странное поведение коровы", "result": null, "sec": 2506, "who_url": "/c/leofitra/", "reason_html": "получила монету за предположение, что мужчина и корова обращались к знахарке — это объяснило странное поведение коровы"}, {"t": "0:52:28", "kind": "spend", "who": "Лея Фитра", "actor": "Вика Чума", "to": null, "reason": "потратила монету на переброс проверки внимательности, ползая по потолку в поисках ловушек", "result": null, "sec": 3148, "who_url": "/c/leofitra/", "reason_html": "потратила монету на переброс проверки внимательности, ползая по потолку в поисках ловушек"}, {"t": "0:57:58", "kind": "spend", "who": "Принц Конский", "actor": "Мезенцев", "to": null, "reason": "потратил две монеты подряд на переброс атаки с разбега по сундуку и проверки ловкости, пытаясь не задеть ловушки в доме", "result": "всё равно не хватило — провалился в потайную яму под ковром, получив 1 урон от падения", "sec": 3478, "who_url": "/c/princ-konskiy/", "reason_html": "потратил две монеты подряд на переброс атаки с разбега по сундуку и проверки ловкости, пытаясь не задеть ловушки в доме"}, {"t": "1:00:50", "kind": "earn", "who": "Принц Конский", "actor": "Мезенцев", "to": null, "reason": "получил монету за каламбур («сделай так, чтобы этот день был не последний»)", "result": null, "sec": 3650, "who_url": "/c/princ-konskiy/", "reason_html": "получил монету за каламбур («сделай так, чтобы этот день был не последний»)"}, {"t": "1:49:34", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска одна оставшаяся монета конвертирована в 10 000 руб.", "result": null, "sec": 6574, "who_url": null, "reason_html": "в конце выпуска одна оставшаяся монета конвертирована в 10 000 руб."}, {"t": "1:50:01", "kind": "other", "who": null, "actor": null, "to": null, "reason": "дополнительно бросили d6, добавив ещё монет — итоговая сумма на благотворительность составила 70 000 руб.", "result": null, "sec": 6601, "who_url": null, "reason_html": "дополнительно бросили d6, добавив ещё монет — итоговая сумма на благотворительность составила 70 000 руб."}], "totals": [{"who": "Лея Фитра", "actor": "Вика Чума", "earned": 2, "spent": 1, "img": "img/chars/leya-fitra.webp", "who_url": "/c/leofitra/", "actor_url": "/p/vika-chuma/"}, {"who": "Гномка Талала", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/talala.webp", "who_url": "/c/gnomka-talala/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Принц Конский", "actor": "Мезенцев", "earned": 1, "spent": 2, "img": "img/chars/konskij.webp", "who_url": "/c/princ-konskiy/", "actor_url": "/p/evgeniy-mezencev/"}], "notes": "Грифон Андрей и Помпей «Пупочек» в этом выпуске монет не зарабатывали и не тратили напрямую (хотя шутка Помпея, возможно, вдохновила бросок Принца Конского — награда всё равно ушла Конскому). В конце эпизода собранные монеты пересчитали в деньги для благотворительности — 70 000 руб."}, "cast": [{"name": "Гномка Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гном, воин света", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "25", "label": "25", "title": "Остров Соблазна"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Грифон Андрей", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "грифон, скакун бога Солнца", "role": "", "fate": "выжил", "id": "Андрей", "url": "/c/grifon-andrey/", "img": "img/chars/andrej.webp", "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Принц Конский", "actor": "Евгений Мезенцев", "actor_url": "/p/evge , {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Домовёнок Кузя", "actor": "", "actor_url": null, "race": "", "role": "хранитель дома Мелиссы и Брэндона", "fate": "жив", "id": "Домовёнок Кузя", "url": "/c/domovyonok-kuzya/", "img": "img/chars/domovyonok-kuzya.webp", "other": []}, {"name": "Хайдар", "actor": "", "actor_url": null, "race": "", "role": "однорукий крестьянин, муж оживлённой нежити", "fate": "жив", "id": "Хайдар", "url": "/c/haydar/", "img": "img/chars/hajdar.webp", "other": []}, {"name": "Беззубый крестьянин", "actor": "", "actor_url": null, "race": "", "role": "хозяин оживлённой коровы Зои", "fate": "жив", "id": null, "url": null, "img": null, "other": []}, {"name": "Корова Зоя", "actor": "", "actor_url": null, "race": "", "role": "оживлённая знахаркой корова", "fate": "погибла (скормлена мимику)", "id": null, "url": null, "img": null, "other": []}, {"name": "Мимик", "actor": "", "actor_url": null, "race": "", "role": "сундук-хищник в доме Мелиссы", "fate": "жив", "id": null, "url": null, "img": null, "other": []}, {"name": "Красноколпачник", "actor": "", "actor_url": null, "race": "", "role": "злая фея в облике красной белки, посыльный знахарки", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}, {"name": "Сигмадом", "actor": "", "actor_url": null, "race": "", "role": "живой дом из мертвечины, логово знахарки", "fate": "уничтожен", "id": null, "url": null, "img": null, "other": []}, {"name": "Сын Мелиссы и Брэндона", "actor": "", "actor_url": null, "race": "", "role": "полубог, отдан цыганам, назван «Пенисовым»", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}, {"name": "Дондон", "actor": "", "actor_url": null, "race": "", "role": "гномский бог", "fate": "неизвестно (упоминается)", "id": "Дондон", "url": "/c/dondon/", "img": null, "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}], "links": [{"key": "15", "label": "15", "title": "Возвращение в Верджинвальд", "note_html": "<a class=\"ref\" href=\"/c/princ-konskiy/\">Конский<\/a> — сын барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда Лёвенхарта<\/a>, сводный брат <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> (<a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>)", "dir": "out", "color": "#C8423B"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> попадает на небеса и получает дары бога Солнца", "dir": "out", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Победа <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> на <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Острове Соблазна<\/a>, она становится воином света", "dir": "out", "color": "#7C5CD6"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> — божественный потомок Тёмного Властелина", "dir": "out", "color": "#C8423B"}, {"key": "42", "label": "42", "title": "Чудная Долина", "note_html": "Продолжение линии <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> и полурослицы из Лысой Пади", "dir": "out", "color": "#7C5CD6"}], "quotes_html": ["«Не зря же говорят, что любовь спасёт мир». — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>", "«Я грифон Верховного бога. Я призван ходить по деревням… и освобождать их от тёмных сил». — <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>", "«Сигмадом!»", "«Обожаю рубить нежить. Как же я люблю, когда ты в моих руках». — меч <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a>", "«Этим мечом тебя заколдовали — и этим же мечом тебя расколдовываю». — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>"], "places_html": "<ul>\n<li>Места: деревня <a class=\"ref\" href=\"/place/lysaya-pad/\">Лысая Падь<\/a> в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>; дом <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; сухой дуб желаний; логово знахарки в лесу; упоминаются <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a> (гномская баня), Гусь Пещерный, <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>.<\/li>\n<li>Фракции: небесный мир (<a class=\"ref\" href=\"/c/gelius/\">Гелиус<\/a>, <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a>); войска <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> (оборона южных лесов); кентавры; речные гномы; адская армия Тёмного Властелина.<\/li>\n<li>Артефакты: меч <a class=\"ref\" href=\"/c/gelius/\">Гелиуса<\/a> (снимает проклятия, бьёт молнией и божественным светом); магическая скрижаль <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> (фото, связь с Гелиусом); колокольчик; урна с прахом Брэндона; горн призыва ополчения; механическая рука <a class=\"ref\" href=\"/c/pompey-pupochek/\">Помпея<\/a>; мягкие подковы Конского.<\/li>\n<\/ul>", "chars": {"Лея Фитра": {"name": "Лея Фитра", "img": "img/chars/leya-fitra.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D0%B5%D1%8F_%D0%A4%D0%B8%D1%82%D1%80%D0%B0", "summary": "Лея Фитра – полуэльфийка и дампир. До встречи с гномкой Талалой была любовницей богатого гнома в Змие Хрустальном.", "infobox": {"Пол": "женский", "Раса": "полуэльфийка, дампир", "Тип": "игровой", "Игрок": "Вика Чума"}, "actors": ["Вика Чума"], "kind": "pc", "dead": false, "race": "полуэльфийка, дампир", "portraits": [{"ep": "38", "thumb": "img/portraits/a5dd89f58eccf525.webp"}], "url": "/c/leofitra/", "eps": [{"key": "38", "label": "38", "title": "Возлюбленная"}]}, "Хайдар": {"name": "Хайдар", "img": "img/chars/hajdar.webp", "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/haydar/", "eps": [{"key": "38", "label": "38", "title"
