и, а третьим должно было стать противостояние харизмы (у <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> с помехой, у Дана с преимуществом, хотя у Дана харизма минусовая). Его отложили, чтобы закончить выпуск на эмоциональном подъёме, и вопрос, удержит ли Дан Винокуса в себе, может всплыть в будущих приключениях. Кто-то из мастеров тайком кинул пару кубиков, и, по его ощущениям, бросок не прошёл. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3095\" target=\"_blank\" rel=\"noopener\">0:51:35 ↗<\/a> · <a href=\"#qa40-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дан Балан получил силу всех выпитых Винокусом вампиров\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дан Балан получил силу всех выпитых Винокусом вампиров<\/b> <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, стал высшим вампиром. По правилам он получил силу не только <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, но и всех вампиров, которых тот выпил (как в «Горце»). При этом Винокус может навсегда захватить тело Дана: тогда Дан умрёт, и в теле старика будет Винокус. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 ↗<\/a> · <a href=\"#qa40-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Дан Балан хотел прийти к королю Понию\">19<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Дан Балан хотел прийти к королю Понию<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> рассказал, что следующим шагом Дана Балана после победы над вампирским советом он видел разговор с королём <a class=\"ref\" href=\"/c/korol-poni-v/\">Понием V<\/a> — показать ему свою новую силу, возможно с ультиматумом. Остальные шутили, что Дан должен обезуметь от власти и пить все позвоночники подряд. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3410\" target=\"_blank\" rel=\"noopener\">0:56:50 ↗<\/a> · <a href=\"#qa40-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новые силы Дана Балана после дьяблери над Винокусом — одну забыли\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новые силы Дана Балана после дьяблери над Винокусом — одну забыли<\/b> На вопрос, почему <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> слабо прокачался после поглощения <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, авторы перечислили новые способности. Устойчивость высшего вампира: за одно очко крови проваленный спасбросок становится успешным — про неё забыли и игрок, и авторы. Также огненный шар, газообразная форма (так когда-то сбежал <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>) и вдвое больше здоровья — то есть силы самого Винокуса. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2509\" target=\"_blank\" rel=\"noopener\">0:41:49 ↗<\/a> · <a href=\"#qa48-10\">к записи<\/a><\/span><\/span>"}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "автоматон (бывший вампир-рикша)", "role": "", "fate": "выжил, получил паспорт", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Кудрегар Пышнолистлов", "actor": "Саша Малой", "actor_url": "/p/sasha-maloy/", "race": "древолюд-берёза, друид", "role": "", "fate": "погиб (сгорел), по заявке игроков перерощен из семян", "id": "Кудригар", "url": "/c/kudrigar/", "img": "img/chars/kudregar.webp", "other": [{"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новый Кудрегар — потомок, а не воскрешённый герой\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новый Кудрегар — потомок, а не воскрешённый герой<\/b> Обычно погибшему навсегда герою в конце рисуют чёрно-белый портрет в рамке; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> его не нарисовали из-за заявки: пыльцу, которую он рассыпал в лавке «Красное и Красное», собрали и посадили. Авторы уточнили, что из семян вырастет потомок без памяти Кудрегара. Как говорилось в выпуске 34, дереву нужно 12 лет, чтобы стать древолюдом; процесс можно ускорить зельем, но существо может получиться недоразвитым. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep40.md сказано, что <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> «перерастили из семян». По словам авторов, Кудрегар погиб, а из семян вырастет лишь его потомок без памяти; стать древолюдом он сможет примерно через 12 лет (быстрее — только с помощью зелий и с риском недоразвитости).<\/span> <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1962\" target=\"_blank\" rel=\"noopener\">0:32:42 ↗<\/a> · <a href=\"#qa40-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Кудрегар получил двойной урон от огня после купания\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Кудрегар получил двойной урон от огня после купания<\/b> Хотя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> долго плыл, смола в нём выталкивает воду, а магический огонь мгновенно выпаривает влагу, так что уязвимость к огню сработала. Огненный шар нанёс 66 урона при 14 оставшихся хитах. Если бы игрок вспомнил про купание и выторговал половинный урон (33), Кудрегар не погиб бы сразу, а упал бы в ноль, как <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>; мастер, по словам авторов, не стал бы сильно спорить. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 ↗<\/a> · <a href=\"#qa40-16\">к записи<\/a><\/span><\/span>"}, {"name": "Адольф", "actor": "Костя Пушкин", "actor_url": "/p/kostya-pushkin/", "race": "энергетический вампир", "role": "", "fate": "выжил (без сознания), получил паспорт", "id": "Адольф", "url": "/c/adolf/", "img": "img/chars/adol-f.webp", "other": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}]}], "npcs": [{"name": "Владимир Винокус", "actor": "", "actor_url": null, "race": "", "role": "высший вампир, глава тайной канцелярии", "fate": "погиб (выпит Даном Баланом)", "id": "Винокус", "url": "/c/vladimir-vinokus/", "img": "img/chars/vladimir-vinokus.webp", "other": [{"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Каргу на Зверь Фест нанял высокопоставленный придворный\">1<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Каргу на Зверь Фест нанял высокопоставленный придворный<\/b> Ритуал кровавой луны на Зверь Фесте Карга устроила по найму некоего высокопоставленного человека при дворе короля, который хотел посеять суету руками монстров и пообещал ей дом для сирот. Его мотивацию, по словам авторов, можно будет понять в выпуске №40. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1024\" target=\"_blank\" rel=\"noopener\">0:17:04 ↗<\/a> · <a href=\"#qa38-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Происхождение королевской инквизиции и почему удар пришёлся по вампирам\">28<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Происхождение королевской инквизиции и почему удар пришёлся по вампирам<\/b> Королевская инквизиция создана в начале демонического нашествия, чтобы на фоне кризиса веры объединить жрецов против нечисти — «внутреннего врага». Её создали по инициативе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>, но действует она самостоятельно, как «НКВД», с широкими полномочиями и злоупотреблениями. Авторы сравнили её с испанской инквизицией, преследовавшей крещёных мавров и евреев, так же как инквизиция ПЧК преследует обладателей паспорта хорошей твари. Вампиров сочли самой опасной нечистью после того, как выяснилось, что вампиром был глава тайной канцелярии <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>; из «Вампирских анналов» инквизиторы поняли, что одним ударом могут уничтожить сотни столичных вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 ↗<\/a> · <a href=\"#qa48-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b> Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-31\">к записи<\/a><\/span><\/span>"}, {"name": "Осин Колов", "actor": "", "actor_url": null, "race": "", "role": "высший вампир", "fate": "погиб (выпит Винокусом)", "id": "Осин Колов", "url": "/c/osin-kolov/", "img": null, "other": []}, {"name": "Грязнис Домогайтис", "actor": "", "actor_url": null, "race": "", "role": "высший вампир-гном", "fate": "погиб (выпит Винокусом)", "id": "Грязнис Домогайтис", "url": "/c/gryaznis-domogaytis/", "img": "img/chars/gryaznis-domogajtis.webp", "other": [{"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}]}, {"name": "Милош Клыкович", "actor": "", "actor_url": null, "race": "", "role": "высший вампир", "fate": "выжил, судьба неизвестна", "id": "Милош Клыкович", "url": "/c/milosh-klykovich/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Милош Клыкович — единственный выживший на крестах\">16<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Милош Клыкович — единственный выживший на крестах<\/b> Авторы отметили, что очнувшийся в конце <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a> — единственный выживший из высших вампиров на крестах, и это задел на будущее. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3225\" target=\"_blank\" rel=\"noopener\">0:53:45 ↗<\/a> · <a href=\"#qa40-14\">к записи<\/a><\/span><\/span>"}, {"name": "Марго", "actor": "", "actor_url": null, "race": "", "role": "служащая МФЦ, благодарна Дану за фабрику крови", "fate": "выжила", "id": "Марго", "url": "/c/margo/", "img": "img/chars/margo.webp", "other": [{"key": "18", "label": "18", "title": "Охота на младенца"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Подсказки к ловушке в кабинете Дана Балана\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Подсказки к ловушке в кабинете Дана Балана<\/b> Главной задачей мастеров было отделить Дана Балана от отряда и не выдать ему паспорт. Дан мог разговорить Марго и узнать о записке тайной канцелярии, как потом узнал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Подсказкой была и дверь: на первую кнопку слышался звук отпирающегося замка, а на вторую, скрытую, — ничего. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1078\" target=\"_blank\" rel=\"noopener\">0:17:58 ↗<\/a> · <a href=\"#qa40-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Чужое имя не спасло бы Дана Балана\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Чужое имя не спасло бы Дана Балана<\/b> Задачей мастеров было захватить Дана Балана; если бы не вышло хитростью, тайная полиция зашла бы прямо в МФЦ и вывела бы его силой. У Марго было распоряжение спокойно, без борьбы отвести Дана и передать его тайной канцелярии. Выдать себя за Дана другой герой мог бы только при критическом успехе. Дверь-портал не отключалась, но вела на улицу, к повозке. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2593\" target=\"_blank\" rel=\"noopener\">0:43:13 ↗<\/a> · <a href=\"#qa40-11\">к записи<\/a><\/span><\/span>"}, {"name": "Клаус", "actor": "", "actor_url": null, "race": "", "role": "пьющий чиновник МФЦ", "fate": "выжил (вырублен)", "id": "Клаус", "url": "/c/klaus/", "img": null, "other": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему чиновник подыгрывал Кудрегару\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему чиновник подыгрывал Кудрегару<\/b> Зрители спросили, почему мастер продолжал диалог, хотя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> провоцировал чиновника. Кудрегар прошёл проверку харизмы и понравился Клаусу, а тот любил выпить; так Кудрегар случайно нашёл крючок, который мастера закладывали в каждого NPC. Став собутыльником, он превратился для чиновника в друга, которого нет смысла топить. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1899\" target=\"_blank\" rel=\"noopener\">0:31:39 ↗<\/a> · <a href=\"#qa40-7\">к записи<\/a><\/span><\/span>"}, {"name": "Николас", "actor": "", "actor_url": null, "race": "", "role": "чиновник МФЦ, отправил Дана в портал", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Королевские инквизиторы", "actor": "", "actor_url": null, "race": "", "role": "охотники на нечисть", "fate": "трое погибли", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Устройство королевской инквизиции\">11<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Устройство королевской инквизиции<\/b> Инквизиция — новая организация, созданная по приказу короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a> из-за демонического нашествия. Она подчиняется верховному жрецу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> из свиты короля, который следит за религиозными течениями и преступлениями религиозного и магического характера. Демоны, хоть Тёмного Властелина и не пустили на небеса, остались на земле и воюют как новое демоническое государство. Получив почти неограниченную власть, многие инквизиторы ею злоупотребляют; подробнее об этом обещали рассказать позже. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2465\" target=\"_blank\" rel=\"noopener\">0:41:05 ↗<\/a> · <a href=\"#qa40-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Инквизиторы в чёрных доспехах и в красных балахонах\">21<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Инквизиторы в чёрных доспехах и в красных балахонах<\/b> По задумке инквизиторы в красных балахонах — аналог жрецов, а в чёрных доспехах — паладинов. В игре их всё равно свели к одинаковым юнитам, чтобы было проще и игрокам, и мастерам: делать десяток разных врагов — ошибка. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3791\" target=\"_blank\" rel=\"noopener\">1:03:11 ↗<\/a> · <a href=\"#qa40-19\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Происхождение королевской инквизиции и почему удар пришёлся по вампирам\">28<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Происхождение королевской инквизиции и почему удар пришёлся по вампирам<\/b> Королевская инквизиция создана в начале демонического нашествия, чтобы на фоне кризиса веры объединить жрецов против нечисти — «внутреннего врага». Её создали по инициативе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>, но действует она самостоятельно, как «НКВД», с широкими полномочиями и злоупотреблениями. Авторы сравнили её с испанской инквизицией, преследовавшей крещёных мавров и евреев, так же как инквизиция ПЧК преследует обладателей паспорта хорошей твари. Вампиров сочли самой опасной нечистью после того, как выяснилось, что вампиром был глава тайной канцелярии <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>; из «Вампирских анналов» инквизиторы поняли, что одним ударом могут уничтожить сотни столичных вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 ↗<\/a> · <a href=\"#qa48-20\">к записи<\/a><\/span><\/span>"}, {"name": "Анастейша", "actor": "", "actor_url": null, "race": "", "role": "пьяная клиентка лавки", "fate": "выжила", "id": "Анастейша", "url": "/c/anasteysha/", "img": null, "other": []}, {"name": "Кристина", "actor": "", "actor_url": null, "race": "", "role": "торговка куколками", "fate": "выжила, в долгах", "id": "Кристина", "url": "/c/kristina/", "img": "img/chars/kristina.webp", "other": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}]}, {"name": "Прикуслав", "actor": "", "actor_url": null, "race": "", "role": "живая челюсть Дана Балана", "fate": "выжил", "id": "Прикуслав", "url": "/c/prikuslav/", "img": null, "other": [{"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}]}], "links": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "note_html": "Сожжение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика", "note_html": "Фабрика крови, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> и Клыкович", "dir": "out", "color": "#B03A7A"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров", "note_html": "Война с Высшим советом, живые челюсти Дана", "dir": "out", "color": "#B03A7A"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> и события в постоялом дворе «Рыжий петух»", "dir": "out", "color": "#C8423B"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "Задел: <a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a> и груз куколок", "dir": "out", "color": "#B8901C"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "Тайная канцелярия", "dir": "out", "color": "#DD7A2F"}, {"key": "48", "label": "48", "title": "Ночь в музее", "note_html": "Указ о паспорте хорошей твари; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> выпил <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["«Даже если вы поганые трупоеды, вы всё ещё можете быть честными гражданами королевства» — указ <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>.", "«Вампиру Дану Балану в выдаче паспорта отказать. Не уничтожать. Любым способом доставить в замок Насрат» — записка тайной канцелярии.", "«Я забрал у них право быть свободными» — <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>.", "«Такие твари-стукачи нам как раз и нужны» — инквизитор <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a>.", "«Поздравляю тебя, теперь ты хорошая тварь» — служащая МФЦ."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>; винная лавка «Красное и Красное»; МФЦ королевских прошений; замок-тюрьма Насрат (на скале на юго-востоке столицы, охраняет вход в гавань; подводный лаз, карцер, пыточная, восьмиугольный ритуальный зал); гавань Кёнигпона.<\/li>\n<li>Фракции: клан Балан; королевская инквизиция (четырёхлистный клевер); тайная канцелярия / тайная полиция (белая летучая мышь); Высший вампирский совет (почти уничтожен); МФЦ королевских прошений.<\/li>\n<li>Артефакты и документы: паспорт хорошей твари; указ <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> о статусе нечисти; схема замка Насрат; записка тайной канцелярии; амулет-детектор нечисти; зелья ускорения; серебряные болты; вино «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>29<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>29<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>6<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>10<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>6<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>6<\/small><\/button><\/div><article class=\"pnote t-addition\" id=\"qa38-2\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Каргу на Зверь Фест нанял высокопоставленный придворный<\/b><\/div><p>Ритуал кровавой луны на Зверь Фесте Карга устроила по найму некоего высокопоставленного человека при дворе короля, который хотел посеять суету руками монстров и пообещал ей дом для сирот. Его мотивацию, по словам авторов, можно будет понять в выпуске №40.<\/p><blockquote>«она была нанята неким высокопоставленным человеком при дворе короля… пообещал ей дом сиротки»<\/blockquote><p class=\"note\"><a href=\"/pod/qa38/#qa38-2\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1024\" target=\"_blank\" rel=\"noopener\">0:17:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa38-16\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Алексея Щербакова не позвали в выпуск №40<\/b><\/div><p>В выпуск №40 (с <a class=\"ref\" href=\"/p/kostya-pushkin/\">Пушкиным<\/a> и Малым) хотели пригласить Алексея <a class=\"ref\" href=\"/p/shcherbakov/\">Щербакова<\/a>, но отказались: там был сложный сюжетный поворот, и встроить ещё одного гостя было бы трудно.<\/p><blockquote>«Мы хотели туда пригласить ещё Лёшу Щербакова, но всё-таки не решились, потому что там и так сложная была у нас сцена.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa38/#qa38-16\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=4426\" target=\"_blank\" rel=\"noopener\">1:13:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa40-1\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Если бы Вампирбек зашёл в кабинет Кудрегара<\/b><\/div><p>Зрители спросили, что было бы, если бы <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пошёл не к первому окну, а в кабинет, где уже побывал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Авторы ответили, что просто ввели бы его туда и переиграли сцену; найти то же, что нашёл Кудрегар, он бы не смог.<\/p><blockquote>«Просто бы ввели бы его туда, да, и переиграли бы этот момент»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-1\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=380\" target=\"_blank\" rel=\"noopener\">0:06:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-2\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Собеседования один на один придумали, чтобы похитить Дана Балана<\/b><\/div><p>Сначала хотели, чтобы игроки оставались за столом в наушниках с музыкой, пока один играет сцену, но наушники не сработали, и остальных пришлось выводить в гримёрку. Смысл приёма был в том, что приключение строилось на заговоре против Дана Балана: его нужно было незаметно отделить от отряда, а если бы со стола уводили одного Дана, это бросалось бы в глаза — поэтому собеседование проходил каждый.<\/p><blockquote>«Частью этого приключения состоит заговор против Дана Балана, которого нужно выкрасть оттуда. А наиболее эффективный способ его выкрасть — это отделить от остальной команды.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-2\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=634\" target=\"_blank\" rel=\"noopener\">0:10:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-3\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Подсказки к ловушке в кабинете Дана Балана<\/b><\/div><p>Главной задачей мастеров было отделить Дана Балана от отряда и не выдать ему паспорт. Дан мог разговорить Марго и узнать о записке тайной канцелярии, как потом узнал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Подсказкой была и дверь: на первую кнопку слышался звук отпирающегося замка, а на вторую, скрытую, — ничего.<\/p><blockquote>«Когда он нажимал вторую кнопку, которая чуть подальше, ничего не произошло. Он просто нажал кнопку, как бы нет звука отпирающегося замка.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-3\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1078\" target=\"_blank\" rel=\"noopener\">0:17:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Сцену Дана Балана в Насрате хотели играть без остальных<\/b><\/div><p>Когда после собеседований действие перенеслось к Дану Балану в подземелье Насрата, авторы думали снова вывести остальных игроков из-за стола, чтобы они ничего не знали, но отказались: это опять вызвало бы стресс, особенно у <a class=\"ref\" href=\"/p/kostya-pushkin/\">Кости Пушкина<\/a>.<\/p><blockquote>«У нас возникла мысль, может быть, вас снову убрать из-за стола и сыграть как бы, ну, чтобы вы вообще ничего не знали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-4\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1523\" target=\"_blank\" rel=\"noopener\">0:25:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Удобный стул Кости Пушкина и новые стулья с 43-го выпуска<\/b><\/div><p><a class=\"ref\" href=\"/p/kostya-pushkin/\">Костя Пушкин<\/a> сидел на офисном стуле, потому что после выпуска 16 отказался сидеть на «корытах» за игровым столом. С 43-го выпуска за столом стоят новые, более мягкие стулья со спинкой; их кусочек показали в рекламной интеграции выпуска 40.<\/p><blockquote>«Начиная с сорок третьего выпуска… Впервые вы увидите эти стулья.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-5\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1585\" target=\"_blank\" rel=\"noopener\">0:26:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa40-6\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Что было бы без записки и если бы все получили паспорта<\/b><\/div><p>Ничего из этого не было спланировано, всё было импровизацией. Не получить паспорт можно было, только открыто заявив, что ты против короля. Если бы герои не узнали о записке, они всё равно хватились бы четвёртого, особенно преданный Дану <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>; по оценке авторов, скорее всего, всё закончилось бы резнёй в МФЦ, где нашлись бы карта и записка, а потом отряд поехал бы уничтожать угрозу в Насрат.<\/p><blockquote>«Скорее всего, если бы все получили паспорта, не нашли бы Дана Балана, это всё закончилось бы резнёй в МФЦ»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-6\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1711\" target=\"_blank\" rel=\"noopener\">0:28:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему чиновник подыгрывал Кудрегару<\/b><\/div><p>Зрители спросили, почему мастер продолжал диалог, хотя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> провоцировал чиновника. Кудрегар прошёл проверку харизмы и понравился Клаусу, а тот любил выпить; так Кудрегар случайно нашёл крючок, который мастера закладывали в каждого NPC. Став собутыльником, он превратился для чиновника в друга, которого нет смысла топить.<\/p><blockquote>«Он нашёл крючок, который мы поставили в каждого из наших. — Случайно абсолютно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-7\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1899\" target=\"_blank\" rel=\"noopener\">0:31:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-8\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Новый Кудрегар — потомок, а не воскрешённый герой<\/b><\/div><p>Обычно погибшему навсегда герою в конце рисуют чёрно-белый портрет в рамке; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> его не нарисовали из-за заявки: пыльцу, которую он рассыпал в лавке «Красное и Красное», собрали и посадили. Авторы уточнили, что из семян вырастет потомок без памяти Кудрегара. Как говорилось в выпуске 34, дереву нужно 12 лет, чтобы стать древолюдом; процесс можно ускорить зельем, но существо может получиться недоразвитым.<\/p><blockquote>«Кудрегару, чтобы превратиться в древолюда из обычного дерева, — 12 лет.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep40.md сказано, что <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> «перерастили из семян». По словам авторов, Кудрегар погиб, а из семян вырастет лишь его потомок без памяти; стать древолюдом он сможет примерно через 12 лет (быстрее — только с помощью зелий и с риском недоразвитости).<\/p><p class=\"note\"><a href=\"/pod/qa40/#qa40-8\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1962\" target=\"_blank\" rel=\"noopener\">0:32:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a>, <a href=\"/ep/34/\" title=\"Пропавшая ёлочка\">#34<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa40-9\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Устройство королевской инквизиции<\/b><\/div><p>Инквизиция — новая организация, созданная по приказу короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a> из-за демонического нашествия. Она подчиняется верховному жрецу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> из свиты короля, который следит за религиозными течениями и преступлениями религиозного и магического характера. Демоны, хоть Тёмного Властелина и не пустили на небеса, остались на земле и воюют как новое демоническое государство. Получив почти неограниченную власть, многие инквизиторы ею злоупотребляют; подробнее об этом обещали рассказать позже.<\/p><blockquote>«Есть в королевстве, в Понии, верховный жрец, который подчиняется королю… В общем, инквизиторы подчиняются верховному жрецу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-9\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2465\" target=\"_blank\" rel=\"noopener\">0:41:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Единственный выпущенный пленник Насрата<\/b><\/div><p>На вопрос, почему герои не освободили пленников и не сделали их союзниками, авторы напомнили, что одного всё же выпустили: это был преступник, мечтавший сбежать, и он просто ушёл домой.<\/p><blockquote>«Вы выпустили одного, и он просто сбежал… потому что это как бы преступник, который мечтал о том, чтобы сбежать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-10\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2527\" target=\"_blank\" rel=\"noopener\">0:42:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa40-11\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Чужое имя не спасло бы Дана Балана<\/b><\/div><p>Задачей мастеров было захватить Дана Балана; если бы не вышло хитростью, тайная полиция зашла бы прямо в МФЦ и вывела бы его силой. У Марго было распоряжение спокойно, без борьбы отвести Дана и передать его тайной канцелярии. Выдать себя за Дана другой герой мог бы только при критическом успехе. Дверь-портал не отключалась, но вела на улицу, к повозке.<\/p><blockquote>«Можно было изначально захватить хитростью. Если хитростью не получается, мы бы уже, конечно, тайную полицию бы вводили уже в само МФЦ.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-11\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2593\" target=\"_blank\" rel=\"noopener\">0:43:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa40-12\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дьяблери в мире ПЧК<\/b><\/div><p>Выпив человека, вампир получает очки крови для способностей. Дьяблери — когда вампир выпивает другого вампира; в ПЧК авторы усложнили эту механику: жертве вырывают позвоночный столб и высасывают его, получая все силы, а также жизнь, личность, память и навыки. Опасность в том, что с поглощённой личностью приходится бороться: проиграв, вампир отдаёт ей своё тело.<\/p><blockquote>«Он перенимает все силы того вампира… плюс его полностью жизнь, личность, память, знания, навыки… Ты, когда выпиваешь другую личность, тебе необходимо будет с ней бороться.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-12\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3033\" target=\"_blank\" rel=\"noopener\">0:50:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-13\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Спасбросок Дана Балана против Винокуса отложен<\/b><\/div><p>Решающий бросок не стали делать в выпуске: Дан выбросил критическую удачу на захват, бросок укуса пропустили, а третьим должно было стать противостояние харизмы (у <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> с помехой, у Дана с преимуществом, хотя у Дана харизма минусовая). Его отложили, чтобы закончить выпуск на эмоциональном подъёме, и вопрос, удержит ли Дан Винокуса в себе, может всплыть в будущих приключениях. Кто-то из мастеров тайком кинул пару кубиков, и, по его ощущениям, бросок не прошёл.<\/p><blockquote>«Я пару кубиков на стол кинул, думаю, вроде не прошёл. Думаю, ладно, давай закроем и решим это в будущих выпусках.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-13\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3095\" target=\"_blank\" rel=\"noopener\">0:51:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa40-14\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Милош Клыкович — единственный выживший на крестах<\/b><\/div><p>Авторы отметили, что очнувшийся в конце <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a> — единственный выживший из высших вампиров на крестах, и это задел на будущее.<\/p><blockquote>«Милош Клыкович, который проснулся, единственный выживший там на кресте»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-14\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3225\" target=\"_blank\" rel=\"noopener\">0:53:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa40-15\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дан Балан получил силу всех выпитых Винокусом вампиров<\/b><\/div><p><a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, стал высшим вампиром. По правилам он получил силу не только <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, но и всех вампиров, которых тот выпил (как в «Горце»). При этом Винокус может навсегда захватить тело Дана: тогда Дан умрёт, и в теле старика будет Винокус.<\/p><blockquote>«По факту Винокус может просто захватить навсегда тело Дана Балана, а Дан Балан умрёт и всё.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-15\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Кудрегар получил двойной урон от огня после купания<\/b><\/div><p>Хотя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> долго плыл, смола в нём выталкивает воду, а магический огонь мгновенно выпаривает влагу, так что уязвимость к огню сработала. Огненный шар нанёс 66 урона при 14 оставшихся хитах. Если бы игрок вспомнил про купание и выторговал половинный урон (33), Кудрегар не погиб бы сразу, а упал бы в ноль, как <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>; мастер, по словам авторов, не стал бы сильно спорить.<\/p><blockquote>«У меня было 14 ХП, а урон был 66. — Да, ты бы лёг в ноль.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-16\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa40-17\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Дан Балан хотел прийти к королю Понию<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> рассказал, что следующим шагом Дана Балана после победы над вампирским советом он видел разговор с королём <a class=\"ref\" href=\"/c/korol-poni-v/\">Понием V<\/a> — показать ему свою новую силу, возможно с ультиматумом. Остальные шутили, что Дан должен обезуметь от власти и пить все позвоночники подряд.<\/p><blockquote>«Моя тема была поговорить с Понием… рассказать о том, что есть вот такая сила.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa40/#qa40-17\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3410\" target=\"_blank\" rel=\"noopener\">0:56:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-18\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Путь в Насрат игроки нашли сами<\/b><\/div><p>Узнав, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> в замке Насрат, игроки сами за 10–15 минут составили план (плыть на <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегаре<\/a> по подводному ходу), и мастерам не пришлось придумывать для них дополнительные локации вроде аренды лодок. Если бы понадобилось, добавили бы другую сцену; герои могли, например, захватить рыбацкую лодку в порту.<\/p><blockquote>«Не надо было придумывать для вас какую-то дополнительную локацию, где там, не знаю, аренда подводных лодок, аренда батискафов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-18\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3665\" target=\"_blank\" rel=\"noopener\">1:01:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-19\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Инквизиторы в чёрных доспехах и в красных балахонах<\/b><\/div><p>По задумке инквизиторы в красных балахонах — аналог жрецов, а в чёрных доспехах — паладинов. В игре их всё равно свели к одинаковым юнитам, чтобы было проще и игрокам, и мастерам: делать десяток разных врагов — ошибка.<\/p><blockquote>«Те, что в красных балахонах, как жрецы. Те, что в чёрных доспехах, они как паладины.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-19\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3791\" target=\"_blank\" rel=\"noopener\">1:03:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-20\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Рыболюды — отсылка художников к «Ван-Пису»<\/b><\/div><p>Зрители заметили, что рыболюды на рисунках взяты из «Ван-Писа», где их тоже притесняли; авторы подтвердили, что это пасхалка художников. Футболка <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> с летучей мышью, похожей на символ тайной канцелярии, оказалась совпадением: он надел её, потому что выпуск был вампирский.<\/p><blockquote>«О, это рыболюды из Ван-Писа, а вы понимаете, что их там тоже, короче, кошмарили.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-20\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3855\" target=\"_blank\" rel=\"noopener\">1:04:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa40-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Куда пропал агент тайной полиции<\/b><\/div><p>Агент тайной полиции, ранивший <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, не был забыт мастером: он сбежал. Обычный человек понял, что <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> сам справится, а лезть между двумя могущественными вампирами ему незачем.<\/p><blockquote>«Он убежал, потому что понял, что, по идее, Винокус сам вывезет всю проблему, а ему нечего делать со сверхъестественными существами.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-22\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4045\" target=\"_blank\" rel=\"noopener\">1:07:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa40-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Устройство замка Насрат<\/b><\/div><p>Замок Насрат прикрывает гавань столицы и стоит на большой скале: внизу тюрьма (три уровня и цокольный этаж), выше гарнизон и сам замок. Имя замок впервые получил в выпуске 40, до этого его называли просто замком-тюрьмой. Пойди герои не через подводный ход со схемы рыболюдов, а через первый этаж, их бы сразу убили.<\/p><blockquote>«Замок Насрат. Наконец-то он обрёл название на сороковом выпуске. До этого просто назывался замок «Тюрьма» у нас.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-23\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4107\" target=\"_blank\" rel=\"noopener\">1:08:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa40-24\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Дверь-портал вела в карету, а не в замок<\/b><\/div><p>Часть зрителей решила, что из МФЦ есть портал прямо в замок Насрат. Авторы поправили: дверь была заклинанием переноса примерно на 150 футов и перенесла Дана Балана в карету у МФЦ, где его обездвижили колом и повезли в замок.<\/p><blockquote>«Там было сказано, что портал был в карету, которая стояла рядом с МФЦ.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-24\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4170\" target=\"_blank\" rel=\"noopener\">1:09:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-28\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Арка вампирской ветки в целом закончена<\/b><\/div><p>Авторы сказали, что арка вампирской ветки в целом завершилась и как она будет развиваться дальше, они пока не знают: должна начаться какая-то новая.<\/p><blockquote>«Сейчас мы пока не знаем, как будет развитие у вампирской ветки. Эта арка в целом закончилась.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-28\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=6807\" target=\"_blank\" rel=\"noopener\">1:53:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Новые силы Дана Балана после дьяблери над Винокусом — одну забыли<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> слабо прокачался после поглощения <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, авторы перечислили новые способности. Устойчивость высшего вампира: за одно очко крови проваленный спасбросок становится успешным — про неё забыли и игрок, и авторы. Также огненный шар, газообразная форма (так когда-то сбежал <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>) и вдвое больше здоровья — то есть силы самого Винокуса.<\/p><blockquote>«У тебя из новых была устойчивость высшего вампира… — Да, мы тоже, честно, про это забыли, поэтому не подсказали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-10\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2509\" target=\"_blank\" rel=\"noopener\">0:41:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Происхождение королевской инквизиции и почему удар пришёлся по вампирам<\/b><\/div><p>Королевская инквизиция создана в начале демонического нашествия, чтобы на фоне кризиса веры объединить жрецов против нечисти — «внутреннего врага». Её создали по инициативе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>, но действует она самостоятельно, как «НКВД», с широкими полномочиями и злоупотреблениями. Авторы сравнили её с испанской инквизицией, преследовавшей крещёных мавров и евреев, так же как инквизиция ПЧК преследует обладателей паспорта хорошей твари. Вампиров сочли самой опасной нечистью после того, как выяснилось, что вампиром был глава тайной канцелярии <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>; из «Вампирских анналов» инквизиторы поняли, что одним ударом могут уничтожить сотни столичных вампиров.<\/p><blockquote>«Королевская инквизиция как организация была создана в момент, когда началось демоническое нашествие, потому что кризис веры требовал консолидации жрецов для борьбы с нечистью.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-20\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b><\/div><p>Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги.<\/p><blockquote>«Было легко прятать от инквизиторов какую-то фабрику, учитывая, что он был главой тайной канцелярии.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-31\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><\/section>", "chars": {"Кудригар": {"name": "Кудрегар", "img": "img/chars/kudregar.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9A%D1%83%D0%B4%D1%80%D0%B5%D0%B3%D0%B0%D1%80", "summary": "Кудрегар Пышнолистлов (Кудрик) - древолюд-друид, бывший соратник крысы Ларисы, уборщик магазина «Красное&Красное».", "infobox": {"Пол": "Мужской", "Раса": "Древолюд", "Тип": "Игровой", "Игрок": "Александр Малой"}, "actors": ["Саша Малой"], "kind": "pc", "dead": true, "race": "Древолюд", "portraits": [{"ep": "40", "thumb": "img/portraits/6bc0d2056c3beb8e.webp"}, {"ep": "30", "thumb": "img/portraits/35b22e3d5d436174.webp"}], "url": "/c/kudrigar/", "eps": [{"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}]}, "Дан Балан": {"name": "Дан Балан", "img": "img/chars/dan-balan.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%B0%D0%BD_%D0%91%D0%B0%D0%BB%D0%B0%D0%BD", "summary": "Дан Бала́н — старый вампир из Мёртвых топей, патриарх вампирского клана Балан, ночной охранник круглосуточной алкогольной лавки «Красное&Красное» в Кёнигпоне.", "infobox": {"Пол": "Мужской", "Раса": "Вампир", "Тип": "Игровой", "Игрок": "Александр Гудков"}, "actors": ["Александр Гудков"], "kind": "pc", "dead": false, "race": "Вампир", "portraits": [{"ep": "40", "thumb": "img/portraits/900979812544e12e.webp"}, {"ep": "26", "thumb": "img/portraits/9da1a60aa3965dac.webp"}, {"ep": "23", "thumb": "img/portraits/259f11cbc39c7087.webp"}, {"ep": "20", "thumb": "img/portraits/7c5d1bf1bf2c14a8.webp"}, {"ep": "16", "thumb": "img/portraits/c83db0b6885808c6.webp"}, {"ep": "12", "thumb": "img/portraits/1bc6aae19b913e52.webp"}], "url": "/c/dan-balan/", "eps": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "
