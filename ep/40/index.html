<script>window.EPD = {"anim": false, "key": "40", "label": "40", "title": "Паспорт хорошей твари", "date": "2025-07-20", "minutes": 133, "duration": 7981.0, "video_id": "AFxewi5RiuY", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Кёнигпон: винная лавка «Красное и Красное», МФЦ королевских прошений, замок-тюрьма Насрат", "short_html": "Король велит нечисти получить «паспорт хорошей твари», и клан Балан отправляется в МФЦ.", "summary_html": "Демоны Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> дошли до <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>, и король <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> издаёт указ: вся разумная нечисть за три дня должна получить в МФЦ королевских прошений «паспорт хорошей твари», иначе её объявят союзницей демонов и уничтожат. Клан Балан решает легализоваться: после стычки с королевской инквизицией герои пробираются в МФЦ, где <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> получают паспорта, а Дана Балана через дверь-портал похищает тайная канцелярия. Выясняется, что её глава — высший вампир <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, который подбил короля переписать всю нечисть, чтобы её контролировать, и в замке-тюрьме Насрат выпивает спинной мозг пленных высших вампиров, забирая их силу. Отряд проникает в Насрат по подводному ходу; Кудрегар сгорает от огненного шара Винокуса, но <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> сам выпивает Винокуса и становится сильнейшим вампиром — правда, без паспорта и вне закона.", "outcome_html": "<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> уничтожен, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> поглотил силу древнего вампира, но остался без паспорта и вне закона. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> погиб, по заявке игроков его перерастили из семян.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новый Кудрегар — потомок, а не воскрешённый герой\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новый Кудрегар — потомок, а не воскрешённый герой<\/b> Обычно погибшему навсегда герою в конце рисуют чёрно-белый портрет в рамке; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> его не нарисовали из-за заявки: пыльцу, которую он рассыпал в лавке «Красное и Красное», собрали и посадили. Авторы уточнили, что из семян вырастет потомок без памяти Кудрегара. Как говорилось в выпуске 34, дереву нужно 12 лет, чтобы стать древолюдом; процесс можно ускорить зельем, но существо может получиться недоразвитым. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep40.md сказано, что <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> «перерастили из семян». По словам авторов, Кудрегар погиб, а из семян вырастет лишь его потомок без памяти; стать древолюдом он сможет примерно через 12 лет (быстрее — только с помощью зелий и с риском недоразвитости).<\/span> <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1962\" target=\"_blank\" rel=\"noopener\">0:32:42 ↗<\/a> · <a href=\"#qa40-8\">к записи<\/a><\/span><\/span>", "world_html": ["Введён паспорт хорошей твари: нечисть переписана и легализована, без паспорта её ждёт уничтожение", "Тайная канцелярия получила списки всей нечисти", "Высший вампирский совет почти полностью уничтожен (<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>, Колов, Грязнис мертвы)", "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> поднялся на вершину вампирской иерархии, но стал вне закона<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дан Балан получил силу всех выпитых Винокусом вампиров\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дан Балан получил силу всех выпитых Винокусом вампиров<\/b> <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, стал высшим вампиром. По правилам он получил силу не только <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, но и всех вампиров, которых тот выпил (как в «Горце»). При этом Винокус может навсегда захватить тело Дана: тогда Дан умрёт, и в теле старика будет Винокус. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 ↗<\/a> · <a href=\"#qa40-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новые силы Дана Балана после дьяблери над Винокусом — одну забыли\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новые силы Дана Балана после дьяблери над Винокусом — одну забыли<\/b> На вопрос, почему <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> слабо прокачался после поглощения <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, авторы перечислили новые способности. Устойчивость высшего вампира: за одно очко крови проваленный спасбросок становится успешным — про неё забыли и игрок, и авторы. Также огненный шар, газообразная форма (так когда-то сбежал <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>) и вдвое больше здоровья — то есть силы самого Винокуса. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2509\" target=\"_blank\" rel=\"noopener\">0:41:49 ↗<\/a> · <a href=\"#qa48-10\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> записан осведомителем инквизиции"], "scenes": [{"t": "0:01:06", "sec": 66, "html": "Пролог: <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> сожгли графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, клан Балан вступил в войну с Высшим вампирским советом и с помощью оборотней истребил большую часть совета."}, {"t": "0:08:14", "sec": 494, "html": "Завязка: полчища демонов Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> остановлены у столицы. Королевский указ о статусе нечисти: явиться в МФЦ королевских прошений за «паспортом хорошей твари» (ПХТ); получившие становятся гражданами, им прощаются прошлые грехи, разрешено охотиться и убивать демонов, запрещены распри; не получившие считаются перешедшими к демонам и подлежат уничтожению."}, {"t": "0:12:07", "sec": 727, "html": "–[0:17:03] Представление: все четверо работают в ночную смену в винной лавке «Красное и Красное» (Дан — охранник, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — грузчик-доставщик, <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> — уборщик, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> — консультант). Кудрегар — изгой после событий в постоялом дворе «Рыжий петух»."}, {"t": "0:18:05", "sec": 1085, "html": "Под утро в лавку вваливается пьяная «балерина» <a class=\"ref\" href=\"/c/anasteysha/\">Анастейша<\/a>, брошенная капитаном-бывшим пиратом; <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> высасывает у неё энергию."}, {"t": "0:22:36", "sec": 1356, "html": "Врываются двое королевских инквизиторов (нашивки четырёхлистного клевера) с амулетом, чующим нечисть. Бой: пыльца-аллергия <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, крюк-кошка <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (новая способность), укус Дана; Вампирбек убивает инквизитора в чёрной броне огнём «рот в рот». Трофеи: освящённые цепы, тяжёлый арбалет с серебряными болтами, дымовая шашка, кандалы, зелье ускорения.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Устройство королевской инквизиции\">11<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Устройство королевской инквизиции<\/b> Инквизиция — новая организация, созданная по приказу короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a> из-за демонического нашествия. Она подчиняется верховному жрецу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> из свиты короля, который следит за религиозными течениями и преступлениями религиозного и магического характера. Демоны, хоть Тёмного Властелина и не пустили на небеса, остались на земле и воюют как новое демоническое государство. Получив почти неограниченную власть, многие инквизиторы ею злоупотребляют; подробнее об этом обещали рассказать позже. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2465\" target=\"_blank\" rel=\"noopener\">0:41:05 ↗<\/a> · <a href=\"#qa40-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Инквизиторы в чёрных доспехах и в красных балахонах\">21<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Инквизиторы в чёрных доспехах и в красных балахонах<\/b> По задумке инквизиторы в красных балахонах — аналог жрецов, а в чёрных доспехах — паладинов. В игре их всё равно свели к одинаковым юнитам, чтобы было проще и игрокам, и мастерам: делать десяток разных врагов — ошибка. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3791\" target=\"_blank\" rel=\"noopener\">1:03:11 ↗<\/a> · <a href=\"#qa40-19\">к записи<\/a><\/span><\/span>"}, {"t": "0:32:17", "sec": 1937, "html": "Рассвет: Дана прячут в бочку (вместе с голым трупом инквизитора), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> надевает чёрную броню инквизитора, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> везёт повозку."}, {"t": "0:35:08", "sec": 2108, "html": "Вставка: Кристина (<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>) закупила 2000 зубастых «куколок», кучера по дороге в Гнилую Гавань съели волки, у неё кассовый разрыв; советчик-купец предлагает кредит («у <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> всё работало»)."}, {"t": "0:36:52", "sec": 2212, "html": "Патруль инквизиции останавливает повозку; <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> выдаёт себя за «брата»-инквизитора, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — за новую инквизиторскую машину."}, {"t": "0:39:31", "sec": 2371, "html": "Огромная очередь тварей у МФЦ. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> наговаривает на рыболюдов; одного из них (строил 100 лет назад при <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> IV замок Насрат) инквизитор сжигает, а Адольфу достаётся папка со схемой замка Насрат с тайным подводным ходом.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Рыболюды — отсылка художников к «Ван-Пису»\">22<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Рыболюды — отсылка художников к «Ван-Пису»<\/b> Зрители заметили, что рыболюды на рисунках взяты из «Ван-Писа», где их тоже притесняли; авторы подтвердили, что это пасхалка художников. Футболка <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> с летучей мышью, похожей на символ тайной канцелярии, оказалась совпадением: он надел её, потому что выпуск был вампирский. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3855\" target=\"_blank\" rel=\"noopener\">1:04:15 ↗<\/a> · <a href=\"#qa40-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Устройство замка Насрат\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Устройство замка Насрат<\/b> Замок Насрат прикрывает гавань столицы и стоит на большой скале: внизу тюрьма (три уровня и цокольный этаж), выше гарнизон и сам замок. Имя замок впервые получил в выпуске 40, до этого его называли просто замком-тюрьмой. Пойди герои не через подводный ход со схемы рыболюдов, а через первый этаж, их бы сразу убили. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4107\" target=\"_blank\" rel=\"noopener\">1:08:27 ↗<\/a> · <a href=\"#qa40-23\">к записи<\/a><\/span><\/span>"}, {"t": "0:45:31", "sec": 2731, "html": "Внутри МФЦ: стойка микрозаймов, туалет — труп инквизитора сажают на унитаз. Служащая Марго узнаёт Дана Балана и благодарит: её брат был узником уничтоженной им фабрики крови.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Подсказки к ловушке в кабинете Дана Балана\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Подсказки к ловушке в кабинете Дана Балана<\/b> Главной задачей мастеров было отделить Дана Балана от отряда и не выдать ему паспорт. Дан мог разговорить Марго и узнать о записке тайной канцелярии, как потом узнал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Подсказкой была и дверь: на первую кнопку слышался звук отпирающегося замка, а на вторую, скрытую, — ничего. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1078\" target=\"_blank\" rel=\"noopener\">0:17:58 ↗<\/a> · <a href=\"#qa40-3\">к записи<\/a><\/span><\/span>"}, {"t": "0:47:50", "sec": 2870, "html": "Подозрительный инквизитор (опознаёт броню своего брата) затянут крюк-кошкой в туалет и убит: электрошок <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, ветки <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, дымовая шашка в горло от <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Ещё одно зелье ускорения и золотая монета."}, {"t": "0:59:10", "sec": 3550, "html": "Собеседование Дана у лысого чиновника Николаса: «Вампир», прописка у гроба «Ваганьковская», жертвы — «маргиналы 80 лет». Подписав анкету, Дан берётся за ручку двери — это портал.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Собеседования один на один придумали, чтобы похитить Дана Балана\">4<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Собеседования один на один придумали, чтобы похитить Дана Балана<\/b> Сначала хотели, чтобы игроки оставались за столом в наушниках с музыкой, пока один играет сцену, но наушники не сработали, и остальных пришлось выводить в гримёрку. Смысл приёма был в том, что приключение строилось на заговоре против Дана Балана: его нужно было незаметно отделить от отряда, а если бы со стола уводили одного Дана, это бросалось бы в глаза — поэтому собеседование проходил каждый. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=634\" target=\"_blank\" rel=\"noopener\">0:10:34 ↗<\/a> · <a href=\"#qa40-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Подсказки к ловушке в кабинете Дана Балана\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Подсказки к ловушке в кабинете Дана Балана<\/b> Главной задачей мастеров было отделить Дана Балана от отряда и не выдать ему паспорт. Дан мог разговорить Марго и узнать о записке тайной канцелярии, как потом узнал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Подсказкой была и дверь: на первую кнопку слышался звук отпирающегося замка, а на вторую, скрытую, — ничего. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1078\" target=\"_blank\" rel=\"noopener\">0:17:58 ↗<\/a> · <a href=\"#qa40-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Чужое имя не спасло бы Дана Балана\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Чужое имя не спасло бы Дана Балана<\/b> Задачей мастеров было захватить Дана Балана; если бы не вышло хитростью, тайная полиция зашла бы прямо в МФЦ и вывела бы его силой. У Марго было распоряжение спокойно, без борьбы отвести Дана и передать его тайной канцелярии. Выдать себя за Дана другой герой мог бы только при критическом успехе. Дверь-портал не отключалась, но вела на улицу, к повозке. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2593\" target=\"_blank\" rel=\"noopener\">0:43:13 ↗<\/a> · <a href=\"#qa40-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дверь-портал вела в карету, а не в замок\">25<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дверь-портал вела в карету, а не в замок<\/b> Часть зрителей решила, что из МФЦ есть портал прямо в замок Насрат. Авторы поправили: дверь была заклинанием переноса примерно на 150 футов и перенесла Дана Балана в карету у МФЦ, где его обездвижили колом и повезли в замок. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4170\" target=\"_blank\" rel=\"noopener\">1:09:30 ↗<\/a> · <a href=\"#qa40-24\">к записи<\/a><\/span><\/span>"}, {"t": "1:06:20", "sec": 3980, "html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> хватает Марго, почуяв ложь, получает цепом от инквизитора. В кабинете у толстого пьющего чиновника Клауса он спаивает того виски, вырубает пощёчиной и находит записку с печатью тайной канцелярии: «Вампиру Дану Балану в выдаче паспорта отказать. Не уничтожать. Любым способом доставить в замок Насрат». Имитируя голос Клауса, Кудрегар обманывает инквизитора, получает подпись как «тварь-стукач» (осведомитель) и паспорт.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Если бы Вампирбек зашёл в кабинет Кудрегара\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Если бы Вампирбек зашёл в кабинет Кудрегара<\/b> Зрители спросили, что было бы, если бы <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пошёл не к первому окну, а в кабинет, где уже побывал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Авторы ответили, что просто ввели бы его туда и переиграли сцену; найти то же, что нашёл Кудрегар, он бы не смог. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=380\" target=\"_blank\" rel=\"noopener\">0:06:20 ↗<\/a> · <a href=\"#qa40-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Что было бы без записки и если бы все получили паспорта\">8<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Что было бы без записки и если бы все получили паспорта<\/b> Ничего из этого не было спланировано, всё было импровизацией. Не получить паспорт можно было, только открыто заявив, что ты против короля. Если бы герои не узнали о записке, они всё равно хватились бы четвёртого, особенно преданный Дану <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>; по оценке авторов, скорее всего, всё закончилось бы резнёй в МФЦ, где нашлись бы карта и записка, а потом отряд поехал бы уничтожать угрозу в Насрат. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1711\" target=\"_blank\" rel=\"noopener\">0:28:31 ↗<\/a> · <a href=\"#qa40-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему чиновник подыгрывал Кудрегару\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему чиновник подыгрывал Кудрегару<\/b> Зрители спросили, почему мастер продолжал диалог, хотя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> провоцировал чиновника. Кудрегар прошёл проверку харизмы и понравился Клаусу, а тот любил выпить; так Кудрегар случайно нашёл крючок, который мастера закладывали в каждого NPC. Став собутыльником, он превратился для чиновника в друга, которого нет смысла топить. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1899\" target=\"_blank\" rel=\"noopener\">0:31:39 ↗<\/a> · <a href=\"#qa40-7\">к записи<\/a><\/span><\/span>"}, {"t": "1:21:20", "sec": 4880, "html": "–[1:31:04] <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> («партия автоматонов 064Е…», «хозяин — <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>») и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> («каждая власть от Бога») тоже получают паспорта.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Если бы Вампирбек зашёл в кабинет Кудрегара\">3<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Если бы Вампирбек зашёл в кабинет Кудрегара<\/b> Зрители спросили, что было бы, если бы <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пошёл не к первому окну, а в кабинет, где уже побывал <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>. Авторы ответили, что просто ввели бы его туда и переиграли сцену; найти то же, что нашёл Кудрегар, он бы не смог. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=380\" target=\"_blank\" rel=\"noopener\">0:06:20 ↗<\/a> · <a href=\"#qa40-1\">к записи<\/a><\/span><\/span>"}, {"t": "1:33:36", "sec": 5616, "html": "Марго опознаёт печать тайной канцелярии. Отряд уходит из МФЦ; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> обмазывается смолой, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> садится в бочку-«скафандр», и все плывут на брёвнышке-<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегаре<\/a> к Насрату.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Что было бы без записки и если бы все получили паспорта\">8<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Что было бы без записки и если бы все получили паспорта<\/b> Ничего из этого не было спланировано, всё было импровизацией. Не получить паспорт можно было, только открыто заявив, что ты против короля. Если бы герои не узнали о записке, они всё равно хватились бы четвёртого, особенно преданный Дану <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>; по оценке авторов, скорее всего, всё закончилось бы резнёй в МФЦ, где нашлись бы карта и записка, а потом отряд поехал бы уничтожать угрозу в Насрат. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1711\" target=\"_blank\" rel=\"noopener\">0:28:31 ↗<\/a> · <a href=\"#qa40-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Путь в Насрат игроки нашли сами\">20<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Путь в Насрат игроки нашли сами<\/b> Узнав, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> в замке Насрат, игроки сами за 10–15 минут составили план (плыть на <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегаре<\/a> по подводному ходу), и мастерам не пришлось придумывать для них дополнительные локации вроде аренды лодок. Если бы понадобилось, добавили бы другую сцену; герои могли, например, захватить рыбацкую лодку в порту. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3665\" target=\"_blank\" rel=\"noopener\">1:01:05 ↗<\/a> · <a href=\"#qa40-18\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:32", "sec": 5792, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>: люди в чёрных мантиях с белой летучей мышью втыкают ему кол (паралич) и везут в Насрат. Восьмиугольный зал, на крестах — высшие вампиры <a class=\"ref\" href=\"/c/osin-kolov/\">Осин Колов<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, гном <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> и сам Дан. Фигура в красной мантии — <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Дверь-портал вела в карету, а не в замок\">25<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Дверь-портал вела в карету, а не в замок<\/b> Часть зрителей решила, что из МФЦ есть портал прямо в замок Насрат. Авторы поправили: дверь была заклинанием переноса примерно на 150 футов и перенесла Дана Балана в карету у МФЦ, где его обездвижили колом и повезли в замок. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4170\" target=\"_blank\" rel=\"noopener\">1:09:30 ↗<\/a> · <a href=\"#qa40-24\">к записи<\/a><\/span><\/span>"}, {"t": "1:38:28", "sec": 5908, "html": "<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> — глава тайной канцелярии: благодарит Дана за истребление совета, признаётся, что надоумил короля переписать всех тварей, чтобы управлять ими через паспорта. Выпивает спинной мозг <a class=\"ref\" href=\"/c/osin-kolov/\">Осина Колова<\/a> (древний запретный ритуал — вампир поглощает силы вампира, рискуя, что сущность жертвы захватит тело) и уходит «переварить».<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Каргу на Зверь Фест нанял высокопоставленный придворный\">1<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Каргу на Зверь Фест нанял высокопоставленный придворный<\/b> Ритуал кровавой луны на Зверь Фесте Карга устроила по найму некоего высокопоставленного человека при дворе короля, который хотел посеять суету руками монстров и пообещал ей дом для сирот. Его мотивацию, по словам авторов, можно будет понять в выпуске №40. <span class=\"note\">Подкаст по #38 · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=1024\" target=\"_blank\" rel=\"noopener\">0:17:04 ↗<\/a> · <a href=\"#qa38-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дьяблери в мире ПЧК\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дьяблери в мире ПЧК<\/b> Выпив человека, вампир получает очки крови для способностей. Дьяблери — когда вампир выпивает другого вампира; в ПЧК авторы усложнили эту механику: жертве вырывают позвоночный столб и высасывают его, получая все силы, а также жизнь, личность, память и навыки. Опасность в том, что с поглощённой личностью приходится бороться: проиграв, вампир отдаёт ей своё тело. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3033\" target=\"_blank\" rel=\"noopener\">0:50:33 ↗<\/a> · <a href=\"#qa40-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b> Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-31\">к записи<\/a><\/span><\/span>"}, {"t": "1:41:36", "sec": 6096, "html": "Дан пытается освободиться с помощью живой челюсти <a class=\"ref\" href=\"/c/prikuslav/\">Прикуслава<\/a> — не хватает силы. Грязнис объясняет суть ритуала."}, {"t": "1:45:12", "sec": 6312, "html": "Отряд ныряет в подводный лаз Насрата; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пробивает кирпичную стену в карцер. Охранник убит (кнут <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, двуручник Вампирбека, «вежливые оскорбления» <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>). Трофеи: многозарядный арбалет с серебряными болтами, электрошокер, серебряный кастет с ножом, ключи от камер.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Единственный выпущенный пленник Насрата\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Единственный выпущенный пленник Насрата<\/b> На вопрос, почему герои не освободили пленников и не сделали их союзниками, авторы напомнили, что одного всё же выпустили: это был преступник, мечтавший сбежать, и он просто ушёл домой. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2527\" target=\"_blank\" rel=\"noopener\">0:42:07 ↗<\/a> · <a href=\"#qa40-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Устройство замка Насрат\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Устройство замка Насрат<\/b> Замок Насрат прикрывает гавань столицы и стоит на большой скале: внизу тюрьма (три уровня и цокольный этаж), выше гарнизон и сам замок. Имя замок впервые получил в выпуске 40, до этого его называли просто замком-тюрьмой. Пойди герои не через подводный ход со схемы рыболюдов, а через первый этаж, их бы сразу убили. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4107\" target=\"_blank\" rel=\"noopener\">1:08:27 ↗<\/a> · <a href=\"#qa40-23\">к записи<\/a><\/span><\/span>"}, {"t": "1:52:22", "sec": 6742, "html": "<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> выпивает Грязниса. Дан песней-проклятием с монетами выбивает крит — Винокус давится спинным мозгом и бьётся в конвульсиях, но у Дана не выходит заколоть его щепкой."}, {"t": "1:57:50", "sec": 7070, "html": "Отряд убивает палача в пыточной. Агент тайной полиции ранит <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> болтом.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Куда пропал агент тайной полиции\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Куда пропал агент тайной полиции<\/b> Агент тайной полиции, ранивший <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, не был забыт мастером: он сбежал. Обычный человек понял, что <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> сам справится, а лезть между двумя могущественными вампирами ему незачем. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=4045\" target=\"_blank\" rel=\"noopener\">1:07:25 ↗<\/a> · <a href=\"#qa40-22\">к записи<\/a><\/span><\/span>"}, {"t": "2:01:42", "sec": 7302, "html": "Финальный бой в ритуальном зале: серебряный болт <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, коробка горючего вина «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>» и огнемёт <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, укус челюсти. Огненный шар <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>: <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> (уязвимость к огню) получает 66 урона и сгорает в пепел, Адольф без сознания.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Кудрегар получил двойной урон от огня после купания\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Кудрегар получил двойной урон от огня после купания<\/b> Хотя <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> долго плыл, смола в нём выталкивает воду, а магический огонь мгновенно выпаривает влагу, так что уязвимость к огню сработала. Огненный шар нанёс 66 урона при 14 оставшихся хитах. Если бы игрок вспомнил про купание и выторговал половинный урон (33), Кудрегар не погиб бы сразу, а упал бы в ноль, как <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a>; мастер, по словам авторов, не стал бы сильно спорить. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 ↗<\/a> · <a href=\"#qa40-16\">к записи<\/a><\/span><\/span>"}, {"t": "2:07:04", "sec": 7624, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, выпив зелье ускорения, крюк-кошкой дёргает рубильник и освобождает Дана. Дан хватает <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> и выпивает его спинной мозг — в голове проносятся чужие жизни, драккары, сотни голосов.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дьяблери в мире ПЧК\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дьяблери в мире ПЧК<\/b> Выпив человека, вампир получает очки крови для способностей. Дьяблери — когда вампир выпивает другого вампира; в ПЧК авторы усложнили эту механику: жертве вырывают позвоночный столб и высасывают его, получая все силы, а также жизнь, личность, память и навыки. Опасность в том, что с поглощённой личностью приходится бороться: проиграв, вампир отдаёт ей своё тело. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3033\" target=\"_blank\" rel=\"noopener\">0:50:33 ↗<\/a> · <a href=\"#qa40-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Спасбросок Дана Балана против Винокуса отложен\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Спасбросок Дана Балана против Винокуса отложен<\/b> Решающий бросок не стали делать в выпуске: Дан выбросил критическую удачу на захват, бросок укуса пропустили, а третьим должно было стать противостояние харизмы (у <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> с помехой, у Дана с преимуществом, хотя у Дана харизма минусовая). Его отложили, чтобы закончить выпуск на эмоциональном подъёме, и вопрос, удержит ли Дан Винокуса в себе, может всплыть в будущих приключениях. Кто-то из мастеров тайком кинул пару кубиков, и, по его ощущениям, бросок не прошёл. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3095\" target=\"_blank\" rel=\"noopener\">0:51:35 ↗<\/a> · <a href=\"#qa40-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дан Балан получил силу всех выпитых Винокусом вампиров\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дан Балан получил силу всех выпитых Винокусом вампиров<\/b> <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, стал высшим вампиром. По правилам он получил силу не только <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, но и всех вампиров, которых тот выпил (как в «Горце»). При этом Винокус может навсегда захватить тело Дана: тогда Дан умрёт, и в теле старика будет Винокус. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3287\" target=\"_blank\" rel=\"noopener\">0:54:47 ↗<\/a> · <a href=\"#qa40-15\">к записи<\/a><\/span><\/span>"}, {"t": "2:11:14", "sec": 7874, "html": "Эпилог игроков: из «семян», рассыпанных <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегаром<\/a> в лавке, выращивают нового Кудрегара. Мастер: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> взлетел на вершину вампирской иерархии, но без паспорта он вне закона; открытые вопросы — признают ли его другие вампиры и что подумает очнувшийся <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новый Кудрегар — потомок, а не воскрешённый герой\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новый Кудрегар — потомок, а не воскрешённый герой<\/b> Обычно погибшему навсегда герою в конце рисуют чёрно-белый портрет в рамке; <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегару<\/a> его не нарисовали из-за заявки: пыльцу, которую он рассыпал в лавке «Красное и Красное», собрали и посадили. Авторы уточнили, что из семян вырастет потомок без памяти Кудрегара. Как говорилось в выпуске 34, дереву нужно 12 лет, чтобы стать древолюдом; процесс можно ускорить зельем, но существо может получиться недоразвитым. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep40.md сказано, что <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> «перерастили из семян». По словам авторов, Кудрегар погиб, а из семян вырастет лишь его потомок без памяти; стать древолюдом он сможет примерно через 12 лет (быстрее — только с помощью зелий и с риском недоразвитости).<\/span> <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1962\" target=\"_blank\" rel=\"noopener\">0:32:42 ↗<\/a> · <a href=\"#qa40-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Милош Клыкович — единственный выживший на крестах\">16<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Милош Клыкович — единственный выживший на крестах<\/b> Авторы отметили, что очнувшийся в конце <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a> — единственный выживший из высших вампиров на крестах, и это задел на будущее. <span class=\"note\">Подкаст по #40 · <a href=\"https://youtu.be/xeMzbeaWtQg?t=3225\" target=\"_blank\" rel=\"noopener\">0:53:45 ↗<\/a> · <a href=\"#qa40-14\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:08:14", "sec": 494}, {"t": "0:22:36", "sec": 1356}, {"t": "0:43:22", "sec": 2602}, {"t": "1:03:04", "sec": 3784}, {"t": "1:16:03", "sec": 4563}, {"t": "1:38:28", "sec": 5908}, {"t": "1:40:36", "sec": 6036}, {"t": "1:45:12", "sec": 6312}, {"t": "2:05:00", "sec": 7500}, {"t": "2:10:05", "sec": 7805}], "coins": {"ep": "40", "events": [{"t": "0:52:03", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "эффектно затащил инквизитора крюком-кошкой в туалет для внезапной расправы", "result": null, "sec": 3123, "who_url": "/c/vampir-bek/", "reason_html": "эффектно затащил инквизитора крюком-кошкой в туалет для внезапной расправы"}, {"t":
