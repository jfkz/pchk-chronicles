<script>window.EPD = {"anim": false, "key": "40", "label": "40", "title": "Паспорт хорошей твари", "date": "2025-07-20", "minutes": 133, "duration": 7981.0, "video_id": "AFxewi5RiuY", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Кёнигпон: винная лавка «Красное и Красное», МФЦ королевских прошений, замок-тюрьма Насрат", "short_html": "Король велит нечисти получить «паспорт хорошей твари», и клан Балан отправляется в МФЦ.", "summary_html": "Демоны Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> дошли до <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>, и король <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a> издаёт указ: вся разумная нечисть за три дня должна получить в МФЦ королевских прошений «паспорт хорошей твари», иначе её объявят союзницей демонов и уничтожат. Клан Балан решает легализоваться: после стычки с королевской инквизицией герои пробираются в МФЦ, где <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a>, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> получают паспорта, а Дана Балана через дверь-портал похищает тайная канцелярия. Выясняется, что её глава — высший вампир <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, который подбил короля переписать всю нечисть, чтобы её контролировать, и в замке-тюрьме Насрат выпивает спинной мозг пленных высших вампиров, забирая их силу. Отряд проникает в Насрат по подводному ходу; Кудрегар сгорает от огненного шара Винокуса, но <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> сам выпивает Винокуса и становится сильнейшим вампиром — правда, без паспорта и вне закона.", "outcome_html": "<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> уничтожен, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> поглотил силу древнего вампира, но остался без паспорта и вне закона. <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> погиб, по заявке игроков его перерастили из семян.", "world_html": ["Введён паспорт хорошей твари: нечисть переписана и легализована, без паспорта её ждёт уничтожение", "Тайная канцелярия получила списки всей нечисти", "Высший вампирский совет почти полностью уничтожен (<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>, Колов, Грязниц мертвы)", "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> поднялся на вершину вампирской иерархии, но стал вне закона", "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> записан осведомителем инквизиции"], "scenes": [{"t": "0:01:06", "sec": 66, "html": "Пролог: <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> сожгли графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, клан Балан вступил в войну с Высшим вампирским советом и с помощью оборотней истребил большую часть совета."}, {"t": "0:08:14", "sec": 494, "html": "Завязка: полчища демонов Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> остановлены у столицы. Королевский указ о статусе нечисти: явиться в МФЦ королевских прошений за «паспортом хорошей твари» (ПХТ); получившие становятся гражданами, им прощаются прошлые грехи, разрешено охотиться и убивать демонов, запрещены распри; не получившие считаются перешедшими к демонам и подлежат уничтожению."}, {"t": "0:12:07", "sec": 727, "html": "–[0:17:03] Представление: все четверо работают в ночную смену в винной лавке «Красное и Красное» (Дан — охранник, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — грузчик-доставщик, <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> — уборщик, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> — консультант). Кудрегар — изгой после событий в постоялом дворе «Рыжий петух»."}, {"t": "0:18:05", "sec": 1085, "html": "Под утро в лавку вваливается пьяная «балерина» <a class=\"ref\" href=\"/c/anasteysha/\">Анастейша<\/a>, брошенная капитаном-бывшим пиратом; <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> высасывает у неё энергию."}, {"t": "0:22:36", "sec": 1356, "html": "Врываются двое королевских инквизиторов (нашивки четырёхлистного клевера) с амулетом, чующим нечисть. Бой: пыльца-аллергия <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, крюк-кошка <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (новая способность), укус Дана; Вампирбек убивает инквизитора в чёрной броне огнём «рот в рот». Трофеи: освящённые цепы, тяжёлый арбалет с серебряными болтами, дымовая шашка, кандалы, зелье ускорения."}, {"t": "0:32:17", "sec": 1937, "html": "Рассвет: Дана прячут в бочку (вместе с голым трупом инквизитора), <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> надевает чёрную броню инквизитора, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> везёт повозку."}, {"t": "0:35:08", "sec": 2108, "html": "Вставка: Кристина (<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>) закупила 2000 зубастых «куколок», кучера по дороге в Гнилую Гавань съели волки, у неё кассовый разрыв; советчик-купец предлагает кредит («у <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> всё работало»)."}, {"t": "0:36:52", "sec": 2212, "html": "Патруль инквизиции останавливает повозку; <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> выдаёт себя за «брата»-инквизитора, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — за новую инквизиторскую машину."}, {"t": "0:39:31", "sec": 2371, "html": "Огромная очередь тварей у МФЦ. <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> наговаривает на рыболюдов; одного из них (строил 100 лет назад при <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> IV замок Насрат) инквизитор сжигает, а Адольфу достаётся папка со схемой замка Насрат с тайным подводным ходом."}, {"t": "0:45:31", "sec": 2731, "html": "Внутри МФЦ: стойка микрозаймов, туалет — труп инквизитора сажают на унитаз. Служащая Марго узнаёт Дана Балана и благодарит: её брат был узником уничтоженной им фабрики крови."}, {"t": "0:47:50", "sec": 2870, "html": "Подозрительный инквизитор (опознаёт броню своего брата) затянут крюк-кошкой в туалет и убит: электрошок <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, ветки <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, дымовая шашка в горло от <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Ещё одно зелье ускорения и золотая монета."}, {"t": "0:59:10", "sec": 3550, "html": "Собеседование Дана у лысого чиновника Николаса: «Вампир», прописка у гроба «Ваганьковская», жертвы — «маргиналы 80 лет». Подписав анкету, Дан берётся за ручку двери — это портал."}, {"t": "1:06:20", "sec": 3980, "html": "<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> хватает Марго, почуяв ложь, получает цепом от инквизитора. В кабинете у толстого пьющего чиновника Клауса он спаивает того виски, вырубает пощёчиной и находит записку с печатью тайной канцелярии: «Вампиру Дану Балану в выдаче паспорта отказать. Не уничтожать. Любым способом доставить в замок Насрат». Имитируя голос Клауса, Кудрегар обманывает инквизитора, получает подпись как «тварь-стукач» (осведомитель) и паспорт."}, {"t": "1:21:20", "sec": 4880, "html": "–[1:31:04] <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> («партия автоматонов 064Е…», «хозяин — <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>») и <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> («каждая власть от Бога») тоже получают паспорта."}, {"t": "1:33:36", "sec": 5616, "html": "Марго опознаёт печать тайной канцелярии. Отряд уходит из МФЦ; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> обмазывается смолой, <a class=\"ref\" href=\"/c/adolf/\">Адольф<\/a> садится в бочку-«скафандр», и все плывут на брёвнышке-<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегаре<\/a> к Насрату."}, {"t": "1:36:32", "sec": 5792, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>: люди в чёрных мантиях с белой летучей мышью втыкают ему кол (паралич) и везут в Насрат. Восьмиугольный зал, на крестах — высшие вампиры <a class=\"ref\" href=\"/c/osin-kolov/\">Осин Колов<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, гном Грязниц Домогаетес и сам Дан. Фигура в красной мантии — <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>."}, {"t": "1:38:28", "sec": 5908, "html": "<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> — глава тайной канцелярии: благодарит Дана за истребление совета, признаётся, что надоумил короля переписать всех тварей, чтобы управлять ими через паспорта. Выпивает спинной мозг <a class=\"ref\" href=\"/c/osin-kolov/\">Осина Колова<\/a> (древний запретный ритуал — вампир поглощает силы вампира, рискуя, что сущность жертвы захватит тело) и уходит «переварить»."}, {"t": "1:41:36", "sec": 6096, "html": "Дан пытается освободиться с помощью живой челюсти <a class=\"ref\" href=\"/c/prikuslav/\">Прикуслава<\/a> — не хватает силы. Грязниц объясняет суть ритуала."}, {"t": "1:45:12", "sec": 6312, "html": "Отряд ныряет в подводный лаз Насрата; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пробивает кирпичную стену в карцер. Охранник убит (кнут <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a>, двуручник Вампирбека, «вежливые оскорбления» <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>). Трофеи: многозарядный арбалет с серебряными болтами, электрошокер, серебряный кастет с ножом, ключи от камер."}, {"t": "1:52:22", "sec": 6742, "html": "<a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> выпивает Грязница. Дан песней-проклятием с монетами выбивает крит — Винокус давится спинным мозгом и бьётся в конвульсиях, но у Дана не выходит заколоть его щепкой."}, {"t": "1:57:50", "sec": 7070, "html": "Отряд убивает палача в пыточной. Агент тайной полиции ранит <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> болтом."}, {"t": "2:01:42", "sec": 7302, "html": "Финальный бой в ритуальном зале: серебряный болт <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a>, коробка горючего вина «<a class=\"ref\" href=\"/place/cvetushchaya-loza/\">Цветущая Лоза<\/a>» и огнемёт <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, укус челюсти. Огненный шар <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>: <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегар<\/a> (уязвимость к огню) получает 66 урона и сгорает в пепел, Адольф без сознания."}, {"t": "2:07:04", "sec": 7624, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, выпив зелье ускорения, крюк-кошкой дёргает рубильник и освобождает Дана. Дан хватает <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> и выпивает его спинной мозг — в голове проносятся чужие жизни, драккары, сотни голосов."}, {"t": "2:11:14", "sec": 7874, "html": "Эпилог игроков: из «семян», рассыпанных <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегаром<\/a> в лавке, выращивают нового Кудрегара. Мастер: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> взлетел на вершину вампирской иерархии, но без паспорта он вне закона; открытые вопросы — признают ли его другие вампиры и что подумает очнувшийся <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>."}], "key_events": [{"t": "0:08:14", "sec": 494}, {"t": "0:22:36", "sec": 1356}, {"t": "0:43:22", "sec": 2602}, {"t": "1:03:04", "sec": 3784}, {"t": "1:16:03", "sec": 4563}, {"t": "1:38:28", "sec": 5908}, {"t": "1:40:36", "sec": 6036}, {"t": "1:45:12", "sec": 6312}, {"t": "2:05:00", "sec": 7500}, {"t": "2:10:05", "sec": 7805}], "coins": {"ep": "40", "events": [{"t": "0:52:03", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "эффектно затащил инквизитора крюком-кошкой в туалет для внезапной расправы", "result": null, "sec": 3123, "who_url": "/c/vampir-bek/", "reason_html": "эффектно затащил инквизитора крюком-кошкой в туалет для внезапной расправы"}, {"t": "0:58:34", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "при обыске поверженного инквизитора нашли зелье ускорения и золотую монету", "result": null, "sec": 3514, "who_url": null, "reason_html": "при обыске поверженного инквизитора нашли зелье ускорения и золотую монету"}, {"t": "1:05:59", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "потратили монету на переброс проверки Проницательности, чтобы понять, врёт ли Марго о судьбе Дан Балана", "result": "переброс дал отличный результат, но Марго всё равно скрывала правду", "sec": 3959, "who_url": null, "reason_html": "потратили монету на переброс проверки Проницательности, чтобы понять, врёт ли Марго о судьбе <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>"}, {"t": "1:16:35", "kind": "earn", "who": "Кудрегар Пышнолистов", "actor": "Саша Малой", "to": null, "reason": "разгадал секретную записку — узнал, что инквизиция велела не выдавать паспорт Дан Балану и доставить его в замок", "result": null, "sec": 4595, "who_url": "/c/kudrigar/", "reason_html": "разгадал секретную записку — узнал, что инквизиция велела не выдавать паспорт <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> и доставить его в замок"}, {"t": "1:34:40", "kind": "earn", "who": "Адольф", "actor": "Костя Пушкин", "to": null, "reason": "за великолепную мотивационную речь перед вылазкой на спасение Дан Балана", "result": null, "sec": 5680, "who_url": "/c/adolf/", "reason_html": "за великолепную мотивационную речь перед вылазкой на спасение <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>"}, {"t": "1:36:09", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "за находчивый план переправы через воду — превратить дерево-Кудрегара и Адольфа с бочкой в «подводную лодку»", "result": null, "sec": 5769, "who_url": null, "reason_html": "за находчивый план переправы через воду — превратить дерево-<a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> и <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> с бочкой в «подводную лодку»"}, {"t": "1:54:23", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "переброс проверки Харизмы/Исполнения (песня), чтобы заставить вампира Винокуса подавиться спинным мозгом", "result": "критическая удача, Винокус подавился", "sec": 6863, "who_url": "/c/dan-balan/", "reason_html": "переброс проверки Харизмы/Исполнения (песня), чтобы заставить вампира <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> подавиться спинным мозгом"}, {"t": "1:57:00", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "переброс проверки Силы челюсти-помощника, чтобы отломить щепку для удара в сердце Винокуса", "result": "выпало 4 — снова не хватило", "sec": 7020, "who_url": "/c/dan-balan/", "reason_html": "переброс проверки Силы челюсти-помощника, чтобы отломить щепку для удара в сердце <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>"}, {"t": "1:57:14", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "ещё один переброс той же проверки Силы, чтобы отломить щепку в сердце", "result": "итог — провал", "sec": 7034, "who_url": "/c/dan-balan/", "reason_html": "ещё один переброс той же проверки Силы, чтобы отломить щепку в сердце"}, {"t": "2:09:24", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "переброс броска схватить и укусить Винокуса в решающий момент финальной схватки", "result": "успех — Дан Балан вцепился зубами и высосал спинной мозг Винокуса, победа", "sec": 7764, "who_url": "/c/dan-balan/", "reason_html": "переброс броска схватить и укусить <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> в решающий момент финальной схватки"}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}, {"who": "Кудрегар Пышнолистов", "actor": "Саша Малой", "earned": 1, "spent": 0, "img": "img/chars/kudregar.webp", "who_url": "/c/kudrigar/", "actor_url": "/p/sasha-maloy/"}, {"who": "Адольф", "actor": "Костя Пушкин", "earned": 1, "spent": 0, "img": "img/chars/adol-f.webp", "who_url": "/c/adolf/", "actor_url": "/p/kostya-pushkin/"}, {"who": "Дан Балан", "actor": "Гудков", "earned": 0, "spent": 4, "img": "img/chars/dan-balan.webp", "who_url": "/c/dan-balan/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Несколько эпизодов (обыск инквизитора, план с бочкой-подлодкой, переброс Проницательности у Марго) не позволяют однозначно определить получателя. В конце выпуска на столе монет не осталось, итоговую сумму для благотворительности (7 монет = 70 000 руб) определили дополнительным броском кубика."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, глава клана Балан", "role": "", "fate": "выжил, выпил Винокуса и поглотил его силу; остался без паспорта", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "автоматон (бывший вампир-рикша)", "role": "", "fate": "выжил, получил паспорт", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "
