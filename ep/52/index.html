span class=\"ptype\">Уточнение<\/span> <b>Харизма универсальна; неприязнь сторон — через помеху<\/b> Зрители спросили, почему у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> высокая харизма даже на небесах. Ответили, что харизма — внутренняя сила влияния и от мира не зависит. Неприязнь между сторонами (например, демона и ангела) мастер отражает проверкой с помехой, а не снижением характеристики. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1904\" target=\"_blank\" rel=\"noopener\">0:31:44 ↗<\/a> · <a href=\"#qa51-52-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Тайный план BRB: «грех гордыни» как уловка\">36<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Тайный план BRB: «грех гордыни» как уловка<\/b> У <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был план, о котором он никому не сказал: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> «возгордится», заявит, что его кровь самая ценная, и потребует, чтобы кто-то другой убил себя, а потом остановится. Ему возразили, что такой «искусственный» грех не сработал бы. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5160\" target=\"_blank\" rel=\"noopener\">1:26:00 ↗<\/a> · <a href=\"#qa51-52-34\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд\">40<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд<\/b> Отметили, что сбылось видение Херона: «небо упало, оно в огне». <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> считает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выполнил свою задачу перед Тёмным властелином и логичнее всего ему вернуться домой, в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>. Остальные возразили, что ни боги, ни люди, считающие его предателем, его в покое не оставят. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 ↗<\/a> · <a href=\"#qa51-52-38\">к записи<\/a><\/span><\/span>"}, {"name": "Коленвалус Рихтованус", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "тифлинг, механик-изобретатель", "role": "", "fate": "погиб (самоубийство ради осквернения бомбы) и воскрешён Локи", "id": "Коленвалус", "url": "/c/kolenvalus/", "img": "img/chars/kolenvalus.webp", "other": [{"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Гудков о Коленвалусе: технарь без чувств, но ради Локи пошёл бы против Сфинктериона\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Гудков о Коленвалусе: технарь без чувств, но ради Локи пошёл бы против Сфинктериона<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> описал <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> как абсолютного технаря, в котором нет места чувствам. Появление «сына» Локи добавило ему немного человечности. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> Коленвалус полностью доверяет и иерархию не нарушает, но если бы тот угрожал Локи, Коленвалус встал бы против него. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1378\" target=\"_blank\" rel=\"noopener\">0:22:58 ↗<\/a> · <a href=\"#qa51-52-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Опыты Коленвалуса: слабые грехи бомбу не оскверняют, работают убийство и самоубийство\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Опыты Коленвалуса: слабые грехи бомбу не оскверняют, работают убийство и самоубийство<\/b> В своей мастерской <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> проверял на святой воде грехи разной тяжести. Гнев, ложь и чревоугодие не действовали; сработал только тяжкий грех — убийство или самоубийство. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5157\" target=\"_blank\" rel=\"noopener\">1:25:57 ↗<\/a> · <a href=\"#qa51-52-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Самоубийство Коленвалуса засчитали как грех: решают боги\">38<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Самоубийство Коленвалуса засчитали как грех: решают боги<\/b> Зрители спорили, не было ли самоубийство <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> скорее самопожертвованием, которое не может осквернить бомбу (вспоминали фильм «Константин»). Бреганов сказал, что религия мира не авраамическая и мораль местных богов неизвестна. Решение принимают боги небесного мира, и для осквернения бомбы его приняли. Внезапный удар мечом в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> был бы двойным грехом — убийством и предательством. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5602\" target=\"_blank\" rel=\"noopener\">1:33:22 ↗<\/a> · <a href=\"#qa51-52-36\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Воскрешение Коленвалуса: сложность 18 была занижена\">39<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Воскрешение Коленвалуса: сложность 18 была занижена<\/b> Воскресить <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> предложил сам игрок, и зал поддержал. Локи бросал с преимуществом против сложности 18 при модификаторе +2 и выбросил 19. Задним числом авторы признали, что ставить надо было хотя бы 20. Судьбу Коленвалуса в шутку предложили решить голосованием в телеграме. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5822\" target=\"_blank\" rel=\"noopener\">1:37:02 ↗<\/a> · <a href=\"#qa51-52-37\">к записи<\/a><\/span><\/span>"}, {"name": "Локтевалус «Локи»", "actor": "Чепурченко", "actor_url": "/p/chepurchenko/", "race": "гомункул (гибрид демона и ангела), лекарь", "role": "", "fate": "выжил", "id": "Локтевалус «Локи»", "url": "/c/loktevalus-loki/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул\">2<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b> Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 ↗<\/a> · <a href=\"#qa49-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает<\/b> Небесные существа могут попасть на Землю только с разрешения небесной канцелярии. Для этого им выдают ангельский паспорт, и он же служит инструментом перемещения. Сам <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> после тёмного контракта пройти Великую границу не мог. Отряд телепортировался по касанию с помощью паспорта, а границу миновал благодаря ангельской крови Локи: аура гомункула поглощала тёмную ауру спутников. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1123\" target=\"_blank\" rel=\"noopener\">0:18:43 ↗<\/a> · <a href=\"#qa51-52-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Божественный ключ Дон-Дона у Локи; отцу пользоваться запрещено — сцену вырезали\">18<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Божественный ключ Дон-Дона у Локи; отцу пользоваться запрещено — сцену вырезали<\/b> Судьба божественного гаечного ключа осталась в выпуске неясной. Из монтажа вырезали момент, где <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> отдаёт ключ Локи и запрещает его отцу им пользоваться. Ключ остался у отряда. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2631\" target=\"_blank\" rel=\"noopener\">0:43:51 ↗<\/a> · <a href=\"#qa51-52-16\">к записи<\/a><\/span><\/span>"}, {"name": "Ангелин", "actor": "Гоген Солнцев", "actor_url": "/p/gogen-solncev/", "race": "падший ангел", "role": "", "fate": "выжил", "id": "Ангелин", "url": "/c/angelin/", "img": "img/chars/angelin.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает<\/b> Небесные существа могут попасть на Землю только с разрешения небесной канцелярии. Для этого им выдают ангельский паспорт, и он же служит инструментом перемещения. Сам <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> после тёмного контракта пройти Великую границу не мог. Отряд телепортировался по касанию с помощью паспорта, а границу миновал благодаря ангельской крови Локи: аура гомункула поглощала тёмную ауру спутников. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1123\" target=\"_blank\" rel=\"noopener\">0:18:43 ↗<\/a> · <a href=\"#qa51-52-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Ангелин узнал планировку виллы критом на проверке истории\">21<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Ангелин узнал планировку виллы критом на проверке истории<\/b> К вилле <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> тоже не подготовили отдельную карту с крышей, и игроки сразу увидели весь дом. <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> сказал, что бывал здесь. Мастер дал ему проверку истории, выпала двадцатка, и мастер рассказал всё о доме: сканер, комнаты, гардеробную. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2963\" target=\"_blank\" rel=\"noopener\">0:49:23 ↗<\/a> · <a href=\"#qa51-52-19\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гоген не извинился перед ангелом из подозрения к авторам\">41<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гоген не извинился перед ангелом из подозрения к авторам<\/b> Ангел соглашался простить <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>, если тот покается. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> отказался: ему постоянно казалось, что Селезнёв подсылает персонажей, которые тянут время, и в каждом предложении он искал подвох. К тому же, по его словам, он сам гордый человек. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6288\" target=\"_blank\" rel=\"noopener\">1:44:48 ↗<\/a> · <a href=\"#qa51-52-39\">к записи<\/a><\/span><\/span>"}, {"name": "Фригидия и Эротика", "actor": "Блохина", "actor_url": "/p/blohina/", "race": "полубогини-двойняшки (Эротика живёт в чреве Фригидии)", "role": "", "fate": "выжили", "id": "Фригидия и Эротика", "url": "/c/frigidiya-i-erotika/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него\">9<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него<\/b> Запрет на любовь и потомство богов от земных существ введён не менее 50 лет назад: тогда <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сошёлся с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, и это последнее известное нарушение. Все полубоги родились до запрета; последним «разрешённым» полубогом был сотрудник пиар-отдела из 27-го выпуска по имени Вильхем. Значит, Фригидии больше 50 лет, возможно 70–100: полубоги живут долго и сохраняют молодость. Авторы допустили, что существует ещё неизвестный полубог, рождённый уже при запрете. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1651\" target=\"_blank\" rel=\"noopener\">0:27:31 ↗<\/a> · <a href=\"#qa51-52-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Закон обратной силы не имеет: Фригидия легальна, но полубогов начали истреблять\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Закон обратной силы не имеет: Фригидия легальна, но полубогов начали истреблять<\/b> Фригидия родилась до запрета и была «легальной» полубогиней. Однако она заметила, что таких полубогов начали уничтожать, и поэтому укрылась у Тёмного властелина. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1838\" target=\"_blank\" rel=\"noopener\">0:30:38 ↗<\/a> · <a href=\"#qa51-52-8\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Венера", "actor": "", "actor_url": null, "race": "", "role": "верховная богиня, дочь Гелиоса, подстроила любовь Брэндона и Мелиссы", "fate": "сейф ограблен, Великая граница уничтожена; ищет Лёшу", "id": "Венера", "url": "/c/venera/", "img": "img/chars/venera.webp", "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Сканирующий глаз и сигнализация виллы: валькирии, затем Венера — конец миссии\">23<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Сканирующий глаз и сигнализация виллы: валькирии, затем Венера — конец миссии<\/b> Если бы сработала сигнализация виллы (сканирующий глаз, взятый вне сейфа артефакт или стычка), прилетели бы валькирии, а при подозрении они вызвали бы <a class=\"ref\" href=\"/c/venera/\">Венеру<\/a>. Прямое столкновение с Венерой означало провал и гибель. На своей территории она останавливает время и получает 1d4 лишних хода, а убить может щелчком пальцев. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3265\" target=\"_blank\" rel=\"noopener\">0:54:25 ↗<\/a> · <a href=\"#qa51-52-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Мраморная беседка Венеры — её личный реинкарнатор: героев превратили бы в камни\">24<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Мраморная беседка Венеры — её личный реинкарнатор: героев превратили бы в камни<\/b> Ажурная беседка у виллы — личный портал реинкарнации <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, вроде того, что был в 27-м выпуске. Поймав героев, Венера изобразила бы доброту и пообещала отпустить их на Землю без стирания памяти. На деле она отправила бы их в беседку, и они переродились бы цветком в Кунисских горах, сосной в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> или галькой на пляже Багряного моря, сохранив память. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3330\" target=\"_blank\" rel=\"noopener\">0:55:30 ↗<\/a> · <a href=\"#qa51-52-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему Венера пощадила купидона-свидетеля: версии без канона\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему Венера пощадила купидона-свидетеля: версии без канона<\/b> Участники обсудили, почему <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> оставила купидона живым у себя, не стёрла ему память и хранила его язык в сейфе. Прозвучали версии: язык был средством шантажа; Венера считает себя доброй и не убивает божественных существ; держала врага ближе к себе. Окончательного ответа не дали — то ли она «глупая садистка», то ли за этим что-то стоит. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4295\" target=\"_blank\" rel=\"noopener\">1:11:35 ↗<\/a> · <a href=\"#qa51-52-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b> <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 ↗<\/a> · <a href=\"#qa51-52-29\">к записи<\/a><\/span><\/span>"}, {"name": "Дон-Дон", "actor": "", "actor_url": null, "race": "", "role": "гномий бог-изобретатель, создатель святой бомбы", "fate": "выжил, остался в департаменте", "id": "Дон-Дон", "url": "/c/dondon/", "img": null, "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "38", "label": "38", "title": "Возлюбленная"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Отряд мог сменить миссию, но к Гелиосу добраться было бы ещё опаснее\">32<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Отряд мог сменить миссию, но к Гелиосу добраться было бы ещё опаснее<\/b> Авторы подтвердили, что после разоблачения <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> герои могли отказаться от уничтожения накопителя. Однако никто из отряда не знал, где находится <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, а любая встреча с богом смертельно опасна. <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> — изгой среди богов: он любил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и Гелиоса и хочет их воссоединения. Остальные боги держатся за свои места и «черпают любовь», поэтому видят в этом угрозу. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4492\" target=\"_blank\" rel=\"noopener\">1:14:52 ↗<\/a> · <a href=\"#qa51-52-30\">к записи<\/a><\/span><\/span>"}, {"name": "Купидон", "actor": "", "actor_url": null, "race": "", "role": "бывший стрелок Венеры, лишённый крыльев и языка", "fate": "язык возвращён, унесён отрядом на землю", "id": "Купидон", "url": "/c/kupidon/", "img": null, "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ответы сейфа не подгоняли; подсказкой был безъязыкий купидон\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ответы сейфа не подгоняли; подсказкой был безъязыкий купидон<\/b> Заготовленные ответы не меняли: игроки ошиблись дважды, и вместо двух дополнительных вопросов задали один «грязный». Мастер считал, что ответить на 10 вопросов без ошибок нереально, поэтому заложил подсказку — шорох безъязыкого купидона. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> слышал все ответы и мог подсказывать кивками или морганием, но игроки, боясь ловушек, на шорох не пошли. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3922\" target=\"_blank\" rel=\"noopener\">1:05:22 ↗<\/a> · <a href=\"#qa51-52-24\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Безъязыкого купидона зовут Питер\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Безъязыкого купидона зовут Питер<\/b> Безкрылого и безъязыкого купидона, найденного у сейфа <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, зовут Питер. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4010\" target=\"_blank\" rel=\"noopener\">1:06:50 ↗<\/a> · <a href=\"#qa51-52-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему Венера пощадила купидона-свидетеля: версии без канона\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему Венера пощадила купидона-свидетеля: версии без канона<\/b> Участники обсудили, почему <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> оставила купидона живым у себя, не стёрла ему память и хранила его язык в сейфе. Прозвучали версии: язык был средством шантажа; Венера считает себя доброй и не убивает божественных существ; держала врага ближе к себе. Окончательного ответа не дали — то ли она «глупая садистка», то ли за этим что-то стоит. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4295\" target=\"_blank\" rel=\"noopener\">1:11:35 ↗<\/a> · <a href=\"#qa51-52-28\">к записи<\/a><\/span><\/span>"}, {"name": "Ангел небесного войска", "actor": "", "actor_url": null, "race": "", "role": "преследователь Ангелина", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Три архангела", "actor": "", "actor_url": null, "race": "", "role": "стражи Накопителя Любви", "fate": "не предотвратили взрыв", "id": null, "url": null, "img": null, "other": []}, {"name": "Тёмный властелин", "actor": "", "actor_url": null, "race": "", "role": "наниматель отряда", "fate": "готовит поход на небеса", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Имя Брэндон — кельтское, «принц»; пантеон эклектичен\">29<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Имя Брэндон — кельтское, «принц»; пантеон эклектичен<\/b> Имя <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> авторы назвали кельтским и перевели как «принц». Боги ПЧК намеренно эклектичны по происхождению имён. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4231\" target=\"_blank\" rel=\"noopener\">1:10:31 ↗<\/a> · <a href=\"#qa51-52-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b> <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 ↗<\/a> · <a href=\"#qa51-52-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон — бог-посланник и наследник, «обманутый бог наследства»\">43<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон — бог-посланник и наследник, «обманутый бог наследства»<\/b> Своей сферы у <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> не было: он был наследником, а также посланником небес к людям, вроде Прометея. В отличие от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, пребывавшего на небесах, он ходил по земному миру, изучал проблемы людей и одаривал их, например райскими елями для <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> и <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8025\" target=\"_blank\" rel=\"noopener\">2:13:45 ↗<\/a> · <a href=\"#qa51-52-54\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "Ветвь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; в предыстории — убийство лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и союз с Тёмным властелином", "dir": "out", "color": "#C8423B"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> (Избранное чадо) назван потомком <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> — упомянута в финале в связи со свитком апокалипсиса", "dir": "out", "color": "#C8423B"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> стал падшим ангелом, подписав демонический контракт (ветвь <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>)", "dir": "out", "color": "#7C5CD6"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — падший рыцарь Тёмного властелина", "dir": "out", "color": "#C8423B"}, {"key": "51", "label": "51", "title": "Точка невозврата", "note_html": "Прямое продолжение: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> отправил в небеса «того, кто не боится тяжёлых решений» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "53", "label": "53", "title": "В поисках Лёши", "note_html": "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> искала «бога Лёшу»; пала <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Двери у него есть, нет ключа. Мне нужен бог <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, и нужен немедленно». — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>", "«Пусть теперь в их мир придут страдания и война… а мы наконец-то сможем жить с нашими женщинами и рожать детей». — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>", "«Ой, я допился до <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона Лёвенхарта<\/a>». — <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a>", "«Ведь можно и языком». — правильный ответ сейфа <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>", "«Ты вонючий смерд. Твоё место будет только на гречке всю жизнь». — <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a>, «нечестивое слово» ангелу"], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>: орбиты парящих скал, Департамент изобретательства, небесная канцелярия, вилла <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> на тропическом острове, <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> (восьмиконечная цитадель с генератором и шахтой молитв с турбиной). Земля: <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>, мастерская <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в Котельниках.<\/li>\n<li>Боги небесного мира, небесное войско (ангелы, архангелы, валькирии, купидоны), слуги Тёмного властелина.<\/li>\n<li><a class=\"ref\" href=\"/a/svyataya-bomba/\">Святая бомба<\/a> (взорвана), сервисный ключ от накопителя, ангельский паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>, Маховик времени, Веер тысячи воздыханий, божественный гаечный ключ Дон-Дона, ненасытное платье Фригидии (вмещает до 200 кг), резонатор еретика, верёвка с кошкой, щит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, чертёж и остов 40-метрового робота «Небесный страж».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>44<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>44<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>11<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>12<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>8<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>12<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa48-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Составы ближайших выпусков и «двойной» съёмочный день Талалы и Сфинктериона<\/b><\/div><p>Авторы раскрыли составы: в 49-м — <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, Турал и <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Никита Шевчук<\/a>, в 50-м — Сабина, <a class=\"ref\" href=\"/p/dima-koval/\">Дима Коваль<\/a> и <a class=\"ref\" href=\"/p/ruslan-usachev/\">Руслан Усачев<\/a>. Затем снимали выпуск с <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a>, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатиром<\/a> и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболевым<\/a> и экспериментальный второй мотор с Дашей <a class=\"ref\" href=\"/p/blohina/\">Блохиной<\/a>, Славой <a class=\"ref\" href=\"/p/chepurchenko/\">Чепурченко<\/a> и <a class=\"ref\" href=\"/c/gogen/\">Гогеном<\/a>. Бреганов отметил, что ветки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> снимаются в один день, и события одного выпуска могут сильно повлиять на другой.<\/p><blockquote>«Как в один день и Талала, и Сфинктерион… События одного выпуска сильно пересекаются с событиями другого выпуска и могут очень сильно повлиять на то, что произойдёт в следующем моторе.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa48/#qa48-19\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3717\" target=\"_blank\" rel=\"noopener\">1:01:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b><\/div><p>Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку.<\/p><blockquote>«мы не раз использовали персонажей, которые у нас были заявлены в выпусках как NPC, потом мы отдавали их игрокам»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-5\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>В «диктанте» 52-го Тёмный властелин ещё не расколдован<\/b><\/div><p>Зрители спросили, почему в начале 52-го выпуска Тёмный властелин показан в демоническом облике, хотя в 51-м его расколдовали. Объяснили, что события 52-го происходят раньше финала 51-го: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в конце 51-го говорит, что уже отправил посланника на небеса.<\/p><blockquote>«На тот момент он ещё не был расколдованный.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa51-52/#qa51-52-1\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1096\" target=\"_blank\" rel=\"noopener\">0:18:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-2\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает<\/b><\/div><p>Небесные существа могут попасть на Землю только с разрешения небесной канцелярии. Для этого им выдают ангельский паспорт, и он же служит инструментом перемещения. Сам <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> после тёмного контракта пройти Великую границу не мог. Отряд телепортировался по касанию с помощью паспорта, а границу миновал благодаря ангельской крови Локи: аура гомункула поглощала тёмную ауру спутников.<\/p><blockquote>«Паспорт — это просто инструмент. За счёт паспорта вы телепортировались, а за счёт ауры гомункула вы прошли Великую границу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-2\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1123\" target=\"_blank\" rel=\"noopener\">0:18:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-3\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Портал из 46-го выпуска охраняет армия валькирий<\/b><\/div><p>Портал на небеса, который <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил в 46-м выпуске, не использовали, потому что известно, куда он ведёт: выход на небесной стороне охраняется. Вышедших оттуда сразу растерзала бы армия валькирий.<\/p><blockquote>«Там стоит армия валькирий, и вас просто потрошат.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-3\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1187\" target=\"_blank\" rel=\"noopener\">0:19:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-4\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ускаманоса не взяли: слишком пахнет серой<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, почему <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>, ближайшего соратника <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, не взяли на миссию. Он настолько жесток, что его не пропустили бы на небеса даже с паспортом и гомункулом, поэтому подбирали героев «с серой моралью».<\/p><blockquote>«Из-за своих злодеяний он так сильно пахнет серой, что нас сразу же обнаружат.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa51-52/#qa51-52-4\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1289\" target=\"_blank\" rel=\"noopener\">0:21:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-5\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Гудков о Коленвалусе: технарь без чувств, но ради Локи пошёл бы против Сфинктериона<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> описал <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> как абсолютного технаря, в котором нет места чувствам. Появление «сына» Локи добавило ему немного человечности. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> Коленвалус полностью доверяет и иерархию не нарушает, но если бы тот угрожал Локи, Коленвалус встал бы против него.<\/p><blockquote>«Если будет Сфинктерион угрожать Локи, то, конечно, наверное, он станет… против этого персонажа.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa51-52/#qa51-52-5\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1378\" target=\"_blank\" rel=\"noopener\">0:22:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Устройство бомбы выдали заранее, чтобы не растягивать сюжет<\/b><\/div><p>Зрителям показалось, что в начале 52-го выпуска героям выдали много информации, узнанной за кадром. Авторы ответили, что отдельное приключение о разгадке бомбы сочли бы растягиванием, тем более что её механизм узнаётся одним броском интеллекта. <a class=\"ref\" href=\"/c/gogen/\">Гогену<\/a> перед игрой подробно объясняли правила и карту шахты.<\/p><blockquote>«Смешно, что если бы мы сделали такое приключение, нам бы сказали: «Опять растягиваете».»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-6\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1449\" target=\"_blank\" rel=\"noopener\">0:24:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-7\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него<\/b><\/div><p>Запрет на любовь и потомство богов от земных существ введён не менее 50 лет назад: тогда <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сошёлся с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, и это последнее известное нарушение. Все полубоги родились до запрета; последним «разрешённым» полубогом был сотрудник пиар-отдела из 27-го выпуска по имени Вильхем. Значит, Фригидии больше 50 лет, возможно 70–100: полубоги живут долго и сохраняют молодость. Авторы допустили, что существует ещё неизвестный полубог, рождённый уже при запрете.<\/p><blockquote>«Это последний известный факт нарушения. После этого нарушений не было. Все полубоги, рождённые от этих смешанных браков, они были до.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-7\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1651\" target=\"_blank\" rel=\"noopener\">0:27:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-8\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Закон обратной силы не имеет: Фригидия легальна, но полубогов начали истреблять<\/b><\/div><p>Фригидия родилась до запрета и была «легальной» полубогиней. Однако она заметила, что таких полубогов начали уничтожать, и поэтому укрылась у Тёмного властелина.<\/p><blockquote>«Закон не имеет обратной силы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-8\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1838\" target=\"_blank\" rel=\"noopener\">0:30:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Паспорт ангела — маячок, тёмную ауру щита скрывал гомункул<\/b><\/div><p>Ангелы отследили паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> не из-за тёмной ауры: каждый паспорт, выданный небесной канцелярией, работает как маячок. Тёмную ауру <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и его щита при этом гасила аура гомункула, поэтому её не почувствовали.<\/p><blockquote>«Каждый паспорт ангела отслеживается не потому, что он тёмный или светлый, а просто потому, что это предмет, который выдаётся в небесной канцелярии.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-9\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1872\" target=\"_blank\" rel=\"noopener\">0:31:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Харизма универсальна; неприязнь сторон — через помеху<\/b><\/div><p>Зрители спросили, почему у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> высокая харизма даже на небесах. Ответили, что харизма — внутренняя сила влияния и от мира не зависит. Неприязнь между сторонами (например, демона и ангела) мастер отражает проверкой с помехой, а не снижением характеристики.<\/p><blockquote>«Харизма — это внутренняя сила влияния на окружение вокруг себя.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-10\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1904\" target=\"_blank\" rel=\"noopener\">0:31:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-11\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранный бой с автоматонами: забыли нарисовать крыши<\/b><\/div><p>Авторы ждали, что герои пойдут к Дон-Дону через главный цех мимо автоматонов (скрытность 14). Провал скрытности вёл к нелетальному бою: автоматоны связывают нарушителей «в куб». Когда один автоматон опускается до 5 хитов, он включает самоуничтожение, а <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> его отключает. Сцену пропустили, потому что на карте «забыли сделать крыши»: игроки увидели гигантский скелет робота и обошли здание через окно.<\/p><blockquote>«Это была наша упущение. Мы забыли сделать крыши.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-11\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2026\" target=\"_blank\" rel=\"noopener\">0:33:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-12\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Робот «Небесный страж» можно было использовать против ангелов<\/b><\/div><p>При удачных переговорах с Дон-Доном героям, окружённым ангелами, можно было сесть в недостроенного 40-метрового робота «Небесный страж». Чтобы им управлять, нужно сесть в кресло пилота на месте головы и пройти проверку интеллекта 12. Робот ползает на одной руке и бьёт с бонусом +12 на 10d6. Засада ангелов из-за засвеченного паспорта <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> случилась бы в любом случае.<\/p><blockquote>«Нужно расположиться на сиденье пилота вместо головы и пройти проверку интеллекта 12.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-12\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2089\" target=\"_blank\" rel=\"noopener\">0:34:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-13\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Ждали, что паспорт выбросят и с небес спрыгнут; щит мастер засчитал за удачную идею<\/b><\/div><p>Авторы ожидали, что отряд избавится от паспорта (например, сбросит его в реку, чтобы увести погоню), а после падения границы герои просто спрыгнут на землю, крылатые полетят сами. Идею спрятать паспорт за тёмным щитом, чтобы тёмная аура «аннулировала» маячок, приняли после проверки интеллекта: мастер не отвергает хорошую идею, которая понравилась залу.<\/p><blockquote>«Мастер же не может вам препятствовать… вы предложили неплохую идею.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-13\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2153\" target=\"_blank\" rel=\"noopener\">0:35:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-14\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Бой с ангелами сократили: игрокам не хотелось драться<\/b><\/div><p>Большая боевая сцена выпала из-за обхода цеха. Бой с ангелами вышел коротким: двоих прогнали множественным внушением, а последний выбросил единицу и поскользнулся. Мастер сознательно ускорил бой, потому что у игроков не было настроения драться.<\/p><blockquote>«Когда игрокам не хочется драться и настроение как будто бы падает, мастер всегда старается побыстрее этот бой пройти.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-14\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2280\" target=\"_blank\" rel=\"noopener\">0:38:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-15\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Неподобранные изобретения Дон-Дона: пузырь тишины, клещи для сейфа, рюкзак полёта<\/b><\/div><p>В департаменте изобретательства можно было найти полезные вещи. Пузырь тишины на минуту глушит любой звук: с ним можно было без тревоги брать вещи у <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> или нейтрализовать заклинателя. Гидравлические клещи взламывали сейф Венеры без анкеты. Были также рюкзак с крыльями для полёта со скоростью бега, противопожарная броня (КБ 20, огнетушитель, сопротивление огню) и маячок вызова беспилотной небесной лодки, которую привозит пеликан.<\/p><blockquote>«Если вы раздобудете пузырь тишины, то в доме Венеры вы можете брать любой артефакт, и сигнализация не сработает.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-15\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2362\" target=\"_blank\" rel=\"noopener\">0:39:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-16\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Божественный ключ Дон-Дона у Локи; отцу пользоваться запрещено — сцену вырезали<\/b><\/div><p>Судьба божественного гаечного ключа осталась в выпуске неясной. Из монтажа вырезали момент, где <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> отдаёт ключ Локи и запрещает его отцу им пользоваться. Ключ остался у отряда.<\/p><blockquote>«Мы вырезали потом из выпуска момент, когда Дон-Дон говорил: «Я даю его тебе, Локи», и запрещаю твоему отцу им пользоваться.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-16\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2631\" target=\"_blank\" rel=\"noopener\">0:43:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-17\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Шахта накопителя открывается раз в 100 лет для техобслуживания<\/b><\/div><p>Шахта, открывающаяся раз в 100 лет, — это не пошлый эвфемизм и не предзнаменование. Это штатный технологический процесс: раз в столетие туда залезают для ремонта и чистки.<\/p><blockquote>«Раз в 100 лет ремонтирующаяся шахта — это естественный технологический процесс.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-17\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2811\" target=\"_blank\" rel=\"noopener\">0:46:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-18\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Бонусная сцена проверки документов патрулём валькирий не случилась<\/b><\/div><p>По пути от департамента к вилле <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> могла быть полубоевая сцена: патруль валькирий на грифонах проверяет документы и может узнать <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> успешно прошёл проверку навигации, а паспорт был спрятан, поэтому отряд долетел без встреч. Авторы подчеркнули, что сцена была бонусной, а не обязательной.<\/p><blockquote>«Поэтому там эта сцена была бонусная, она не пропущена.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-18\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2900\" target=\"_blank\" rel=\"noopener\">0:48:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Ангелин узнал планировку виллы критом на проверке истории<\/b><\/div><p>К вилле <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> тоже не подготовили отдельную карту с крышей, и игроки сразу увидели весь дом. <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> сказал, что бывал здесь. Мастер дал ему проверку истории, выпала двадцатка, и мастер рассказал всё о доме: сканер, комнаты, гардеробную.<\/p><blockquote>«Ангелин, по-моему, выбросил 20, то есть критическую удачу. И нужно было рассказать всё.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-19\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2963\" target=\"_blank\" rel=\"noopener\">0:49:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Купидоны и ангелы: иерархия как у демонов (не продумано)<\/b><\/div><p>На вопрос, вырастают ли купидоны в ангелов, авторы признали, что этого не продумывали. Допустили, что небесные существа, как и демоны, растут, поднимаются в иерархии и меняют облик. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> и <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> в шутку настаивали, что купидоны — взрослые «карлики»: одному из них 800 лет.<\/p><blockquote>«Да, мы это не продумывали, но… вполне можно, потому что как и демонические сущности, демоны тоже растут.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-20\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3074\" target=\"_blank\" rel=\"noopener\">0:51:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-21\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Сканирующий глаз и сигнализация виллы: валькирии, затем Венера — конец миссии<\/b><\/div><p>Если бы сработала сигнализация виллы (сканирующий глаз, взятый вне сейфа артефакт или стычка), прилетели бы валькирии, а при подозрении они вызвали бы <a class=\"ref\" href=\"/c/venera/\">Венеру<\/a>. Прямое столкновение с Венерой означало провал и гибель. На своей территории она останавливает время и получает 1d4 лишних хода, а убить может щелчком пальцев.<\/p><blockquote>«Если у вас прямое столкновение с Венерой, то это конец миссии, это гибель.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-21\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3265\" target=\"_blank\" rel=\"noopener\">0:54:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-22\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Мраморная беседка Венеры — её личный реинкарнатор: героев превратили бы в камни<\/b><\/div><p>Ажурная беседка у виллы — личный портал реинкарнации <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, вроде того, что был в 27-м выпуске. Поймав героев, Венера изобразила бы доброту и пообещала отпустить их на Землю без стирания памяти. На деле она отправила бы их в беседку, и они переродились бы цветком в Кунисских горах, сосной в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> или галькой на пляже Багряного моря, сохранив память.<\/p><blockquote>«Я отправлю вас на Землю, чтобы вы могли начать новую жизнь. Даже тебя, Ангелин.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-22\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3330\" target=\"_blank\" rel=\"noopener\">0:55:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-23\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Анкету сейфа Венеры составили с помощью ChatGPT<\/b><\/div><p>Вопросы анкеты подобрали через ChatGPT. Сначала попросили список банальных вопросов об отношениях, потом попросили ответить на них от лица «взрослой уверенной женщины на руководящей должности»; эти ответы и сочли правильными. Формулировку «После какого свидания можно давать секс?» предложила девушка одного из авторов, и её оставили без изменений.<\/p><blockquote>«Ответь на них так, как бы ответила вот такая женщина.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-23\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3480\" target=\"_blank\" rel=\"noopener\">0:58:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-24\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ответы сейфа не подгоняли; подсказкой был безъязыкий купидон<\/b><\/div><p>Заготовленные ответы не меняли: игроки ошиблись дважды, и вместо двух дополнительных вопросов задали один «грязный». Мастер считал, что ответить на 10 вопросов без ошибок нереально, поэтому заложил подсказку — шорох безъязыкого купидона. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> слышал все ответы и мог подсказывать кивками или морганием, но игроки, боясь ловушек, на шорох не пошли.<\/p><blockquote>«Купидон знал ответы на все вопросы, но он не мог говорить… Вот так взламывался этот сейф за счёт купидона безъязыкого.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-24\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3922\" target=\"_blank\" rel=\"noopener\">1:05:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-25\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Безъязыкого купидона зовут Питер<\/b><\/div><p>Безкрылого и безъязыкого купидона, найденного у сейфа <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, зовут Питер.<\/p><blockquote>«Его зовут Питер.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-25\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4010\" target=\"_blank\" rel=\"noopener\">1:06:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b><\/div><p>Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела купидона. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>.<\/p><blockquote>«Это любовное чувство настоящее, но… основой для неё была именно золотая стрела Купидона.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-26\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-27\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Имя Брэндон — кельтское, «принц»; пантеон эклектичен<\/b><\/div><p>Имя <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> авторы назвали кельтским и перевели как «принц». Боги ПЧК намеренно эклектичны по происхождению имён.<\/p><blockquote>«Брэндон — это не американское имя, если что, а оно кельтское, которое с кельтского означает принц.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa51-52/#qa51-52-27\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4231\" target=\"_blank\" rel=\"noopener\">1:10:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Почему Венера пощадила купидона-свидетеля: версии без канона<\/b><\/div><p>Участники обсудили, почему <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> оставила купидона живым у себя, не стёрла ему память и хранила его язык в сейфе. Прозвучали версии: язык был средством шантажа; Венера считает себя доброй и не убивает божественных существ; держала врага ближе к себе. Окончательного ответа не дали — то ли она «глупая садистка», то ли за этим что-то стоит.<\/p><blockquote>«Либо она глупая садистка, либо всё-таки что-то может быть это и значит, почему она именно так сделала.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-28\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4295\" target=\"_blank\" rel=\"noopener\">1:11:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-29\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b><\/div><p><a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней.<\/p><blockquote>«Брэндон был испепелён, и верховным богом стала она сама.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-29\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-30\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Отряд мог сменить миссию, но к Гелиосу добраться было бы ещё опаснее<\/b><\/div><p>Авторы подтвердили, что после разоблачения <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> герои могли отказаться от уничтожения накопителя. Однако никто из отряда не знал, где находится <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, а любая встреча с богом смертельно опасна. <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> — изгой среди богов: он любил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и Гелиоса и хочет их воссоединения. Остальные боги держатся за свои места и «черпают любовь», поэтому видят в этом угрозу.<\/p><blockquote>«Любой из богов может щелчком пальца уничтожить любого из этих низкоуровневых героев.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-30\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4492\" target=\"_blank\" rel=\"noopener\">1:14:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Нижний вход в накопитель охранялся; было три пути внутрь<\/b><\/div><p>Технический вход не был беззащитным: вокруг летали лодки и грифоны, и их обошли успешной проверкой навигации. Внутрь было три пути: сервисный ключ останавливает лопасти; без ключа можно проскочить лопасти только на критической ловкости, иначе они перемалывают; через главный вход мимо трёх архангелов — почти наверняка смерть. Систему, которую невозможно взломать, авторы считают бессмысленной для игры.<\/p><blockquote>«Нет смысла давать игроку систему, которую невозможно сломать.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-31\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4672\" target=\"_blank\" rel=\"noopener\">1:17:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-32\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Маховик времени отматывает на 100 секунд весь мир, включая богов<\/b><\/div><p>Маховик времени не создаёт копий, как хроноворот в «Гарри Поттере». Он хранит «буфер» последних 100 секунд и откатывает всю вселенную, богов в том числе; память сохраняет только владелец. Пользоваться им можно два раза в день. Участники спорили, не слишком ли он силён, но авторы подтвердили именно эту механику.<\/p><blockquote>«Весь мир получается, да, они в себе в буфер свой сохраняют последние 100 секунд всегда.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-32\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4837\" target=\"_blank\" rel=\"noopener\">1:20:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-33\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Опыты Коленвалуса: слабые грехи бомбу не оскверняют, работают убийство и самоубийство<\/b><\/div><p>В своей мастерской <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> проверял на святой воде грехи разной тяжести. Гнев, ложь и чревоугодие не действовали; сработал только тяжкий грех — убийство или самоубийство.<\/p><blockquote>«Гнев, ложь — ничего не работало. Работал сильный грех.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa51-52/#qa51-52-33\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5157\" target=\"_blank\" rel=\"noopener\">1:25:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Тайный план BRB: «грех гордыни» как уловка<\/b><\/div><p>У <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был план, о котором он никому не сказал: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> «возгордится», заявит, что его кровь самая ценная, и потребует, чтобы кто-то другой убил себя, а потом остановится. Ему возразили, что такой «искусственный» грех не сработал бы.<\/p><blockquote>«У меня в голове был план, о котором я никому не рассказал… вот это возгордиться.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa51-52/#qa51-52-34\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5160\" target=\"_blank\" rel=\"noopener\">1:26:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-35\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>37<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Авторы ждали от Сфинктериона жертвы или убийства; бомбу нельзя осквернить заранее<\/b><\/div><p>Авторы ожидали самопожертвования или того, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сам выберет и убьёт кого-то, как когда-то лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Вариантов не прописывали, а лишь создали обстоятельства; конспект с условием выдали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> заранее. Осквернить бомбу можно только рядом с накопителем: в земном мире она самоочищается.<\/p><blockquote>«Нельзя сделать это заранее в земном мире, потому что она самоочищается.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-35\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-36\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>38<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Самоубийство Коленвалуса засчитали как грех: решают боги<\/b><\/div><p>Зрители спорили, не было ли самоубийство <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> скорее самопожертвованием, которое не может осквернить бомбу (вспоминали фильм «Константин»). Бреганов сказал, что религия мира не авраамическая и мораль местных богов неизвестна. Решение принимают боги небесного мира, и для осквернения бомбы его приняли. Внезапный удар мечом в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> был бы двойным грехом — убийством и предательством.<\/p><blockquote>«Самопожертвование должен принять или не принять Бог. Он решает.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa51-52/#qa51-52-36\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5602\" target=\"_blank\" rel=\"noopener\">1:33:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa51-52-37\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>39<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Воскрешение Коленвалуса: сложность 18 была занижена<\/b><\/div><p>Воскресить <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> предложил сам игрок, и зал поддержал. Локи бросал с преимуществом против сложности 18 при модификаторе +2 и выбросил 19. Задним числом авторы признали, что ставить надо было хотя бы 20. Судьбу Коленвалуса в шутку предложили решить голосованием в телеграме.<\/p><blockquote>«Сложность надо было двадцатку хотя бы поставить, потому что у него плюс два.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-37\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5822\" target=\"_blank\" rel=\"noopener\">1:37:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-38\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>40<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд<\/b><\/div><p>Отметили, что сбылось видение Херона: «небо упало, оно в огне». <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> считает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выполнил свою задачу перед Тёмным властелином и логичнее всего ему вернуться домой, в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>. Остальные возразили, что ни боги, ни люди, считающие его предателем, его в покое не оставят.<\/p><blockquote>«Получается, Херон был прав. Небо упало, оно теперь в огне.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa51-52/#qa51-52-38\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-39\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>41<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гоген не извинился перед ангелом из подозрения к авторам<\/b><\/div><p>Ангел соглашался простить <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>, если тот покается. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> отказался: ему постоянно казалось, что Селезнёв подсылает персонажей, которые тянут время, и в каждом предложении он искал подвох. К тому же, по его словам, он сам гордый человек.<\/p><blockquote>«У меня всё время ощущение, что ты пытаешься увести не туда игру… каких-то карликов, алкашей подсылаешь.»<\/blockquote><p class=\"note\">Гоген · <a href=\"/pod/qa51-52/#qa51-52-39\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6288\" target=\"_blank\" rel=\"noopener\">1:44:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-43\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>42<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ангелов создают боги энергией любви из генератора<\/b><\/div><p>У ангелов нет гениталий, но они пополняют число по-другому: их создают боги, возможно из праведников, энергией любви, поступающей через генератор накопителя. Чем могущественнее бог, тем больше существ он может создать. Суккубы и инкубы своего семени не производят: суккуб забирает семя мужчины, а инкуб, осквернив его, передаёт женщине; так рождаются тифлинги.<\/p><blockquote>«Они создаются богами с помощью той энергии любви, которая им приходит с помощью этого генератора.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-43\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6902\" target=\"_blank\" rel=\"noopener\">1:55:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-54\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>43<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндон — бог-посланник и наследник, «обманутый бог наследства»<\/b><\/div><p>Своей сферы у <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> не было: он был наследником, а также посланником небес к людям, вроде Прометея. В отличие от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, пребывавшего на небесах, он ходил по земному миру, изучал проблемы людей и одаривал их, например райскими елями для <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> и <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>.<\/p><blockquote>«Он бог-посланник от небес к людям. Он поэтому много заботился о людях.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-54\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8025\" target=\"_blank\" rel=\"noopener\">2:13:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-55\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>44<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Связь концовки 51-го с 52-м задумывали, но отказались<\/b><\/div><p>При разработке хотели, чтобы финал 51-го влиял на 52-й, но от этого отказались. В финальном сценарии исход 51-го никак не менял 52-й.<\/p><blockquote>«Мы сначала хотели сделать так, чтобы концовка пятьдесят первого влияла на пятьдесят второй, а потом мы отказались.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-55\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8194\" target=\"_blank\" rel=\"noopener\">2:16:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><\/section>", "chars": {"Ангелин": {"name": "Ангелин", "img": "img/chars/angelin.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%90%D0%BD%D0%B3%D0%B5%D0%BB%D0%B8%D0%BD", "summary": "Ангелин - бывший ангел по вызову. Сейчас – падший ангел.", "infobox": {"Пол": "Мужской", "Раса": "Небожитель (падший)", "Тип": "Игровой", "Игрок": "Гоген Солнцев"}, "actors": ["Гоген Солнцев"], "kind": "pc", "dead": false, "race": "Небожитель (падший)", "portraits": [{"ep": "35", "thumb": "img/portraits/21424d1229ca013b.webp"}, {"ep": "31", "thumb": "img/portraits/8a12e172deea6d1b.webp"}], "url": "/c/angelin/", "eps": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, "Сфинктерион": {"name": "Сфинктерион", "
