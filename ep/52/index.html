<script>window.EPD = {"key": "52", "label": "52", "title": "Накопитель Любви", "date": "2026-08-29", "minutes": 109, "duration": 6540.0, "video_id": "REiqMLUvb_A", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Небесный мир: Департамент изобретательства, вилла Венеры, Накопитель Любви; финал — мастерская Коленвалуса в Котельниках (земля)", "short_html": "По заданию Тёмного властелина падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с отрядом (тифлинг-механик <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, его гомункул Локи, падший ангел <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> и полубогини <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидия и Эротика<\/a>) проникает в небесный мир, чтобы уничтожить <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a>, питающий Великую границу. Герои узнают у бога-изобретателя <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a> о техническом входе, грабят сейф <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, пройдя её «анкету о любви», и выясняют, что именно Венера подстроила любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>. Через турбинную шахту они проникают в цитадель, Коленвалус оскверняет святую бомбу собственной смертью, отряд телепортируется на землю, и Великая граница сгорает. Локи воскрешает отца.", "summary_html": "Прямое продолжение финала вып. 51: Тёмный властелин отправил падшего рыцаря <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с отрядом «злых» союзников в небесный мир, чтобы уничтожить <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> — механизм, питающий Великую границу между мирами. Под прикрытием светлой ауры гомункула Локи герои добывают у гномьего бога-изобретателя <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a> сведения о техническом входе, грабят сейф верховной богини <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> (отвечая на её «анкету о любви») и узнают, что именно Венера через купидона свела <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> с земной полурослицей. Через турбинную шахту они проникают в цитадель; святую бомбу, которая против божественного накопителя бесполезна, нужно «осквернить» тяжким грехом — и <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> совершает самоубийство, вонзив детонатор себе в сердце. Бомба взрывается, Великая граница сгорает, а Локи в мастерской в Котельниках воскрешает отца.", "outcome_html": "<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> между мирами уничтожена; отряд вернулся на землю, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> умер и воскрешён. Небеса открыты для Тёмного властелина и демонов.", "world_html": ["<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> взорван, Великая граница уничтожена — небесный мир открыт", "Раскрыто, что <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> (дочь <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>) подстроила любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>", "Верховная богиня — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>; <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a> мечтает о возвращении <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>", "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> назван потомком <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>, которого ищут <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> и Тёмный властелин", "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> строит боевого робота «Небесный страж» для войны на земле", "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> объявлен на небесах предателем"], "scenes": [{"t": "≈0:03", "sec": 182, "html": "На небесах верховная богиня <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> выслушивает доклад: люди разбили демонов на равнинах, те укрылись в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. Венера проповедует «баланс страданий и избавлений» ради молитв (реклама Авито-путешествий «от небес»). Затем спрашивает о потомке <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> — Лёше: небесный мир в безопасности, пока Брэндон его не нашёл («двери у него есть, нет ключа»); Венера сама летит искать «бога Лёшу»."}, {"t": "≈0:09", "sec": 545, "html": "Предыстория: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, желая прекратить феодальную распрю, зарезал лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — и демоны превратили <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> в филиал ада. Из чувства вины он заключил союз с Тёмным властелином: тот оставит землю в покое, если рыцарь поможет ему пересечь границу миров. Соратники объявили Сфинктериона изменником, но он открыл портал в небесный мир и добыл святую бомбу."}, {"t": "≈0:15", "sec": 908, "html": "Представление героев: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет «впустить в дом жестоких богов их злейших врагов», чтобы земля жила спокойно; <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> разгадал, что его гомункул Локи — гибрид демона и ангела, чья аура скроет осквернённых от Великой границы; Локи — наивный ребёнок, которому обещали «большой фейерверк»; <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> рисует карту небес (орбиты летающих скал, департаменты, вилла <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> под охраной трёх архангелов); <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидия и Эротика<\/a> — дочери смертной бегуньи и бога, овладевшего ею в облике страуса; полубогов стали истреблять собственные родители-боги, и сёстры укрылись у Тёмного властелина."}, {"t": "≈0:21", "sec": 1272, "html": "Наставления Тёмного властелина («диктант»): держаться рядом с гомункулом (от героев пахнет серой); три архангела непобедимы, но есть технический вход — ключ у гномьего бога <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>. Обнявшись с Локи, держащим ангельский паспорт, отряд телепортируется к Департаменту изобретательства."}, {"t": "≈0:27", "sec": 1635, "html": "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> (за монету) вспоминает: <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a> любил людей и хотел облегчить их труд, но <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, желающая страданий, его затирает. Герои обходят здание, вырезают стекло; внутри пьяный Дондон над чертежом робота «Небесный страж»."}, {"t": "≈0:33", "sec": 1998, "html": "Разговор с <a class=\"ref\" href=\"/c/dondon/\">Дондоном<\/a>: он знает <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, пугается Эротики, умиляется Локи и дарит ему свой божественный гаечный ключ. Фригидия (крит) очаровывает бога. Выясняется: сервисного ключа у него нет — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> забрала его и хранит в сейфе на своей вилле (сейф открывается ответами на контрольные вопросы). Святую бомбу сделал сам Дондон — нарочно с долгим таймером, чтобы взрыв можно было остановить; против накопителя она бесполезна, а сервисный ключ останавливает турбину в шахте молитв. Дондон против войны на небесах и хочет возвращения <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> верховным богом. Под заказ Венеры он строит огромную боевую машину для земли."}, {"t": "≈0:39", "sec": 2362, "html": "Три ангела небесного войска окружают департамент: паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> «засвечен». <a class=\"ref\" href=\"/c/dondon/\">Дондон<\/a> не помогает, но выключает свои автоматоны. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> внушением прогоняет двух ангелов; третий пронзает Ангелина копьём, поскальзывается «на собственных слезах»; бой: «нечестивое слово» Ангелина, укус Локи, «резонатор еретика» <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> (заодно оглушает Фригидию); Сфинктерион добивает ангела мечом."}, {"t": "≈0:45", "sec": 2725, "html": "На небесной лодке Локи лечит <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> и Фригидию, кошка-«абордажный крюк» зализывает раны <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалусу<\/a>. Паспорт Ангелина прячут в «самую грязную вещь на небесах» — щит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, чтобы его не отслеживали."}, {"t": "≈0:51", "sec": 3088, "html": "<a class=\"ref\" href=\"/c/villi/\">Вилла<\/a> <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> на парящем тропическом острове: <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> (крит) помнит планировку — сканирующий глаз у входа, спальня; Венеры нет дома. Фригидию превращают в «светильник-страуса» как подарок от <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>; купидонов уговорами и внушением отправляют «охранять озеро»."}, {"t": "≈0:57", "sec": 3452, "html": "В спальне под кроватью — сейф. Голос сейфа проводит «анкету» <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>: 10+ вопросов о свиданиях и отношениях («кто платит», «после какого свидания», «сколько сантиметров» и т.п.); с двумя ошибками герои отвечают верно, последний вопрос — «влияет ли длина на оргазм?» — «нет, ведь можно и языком»."}, {"t": "≈1:03", "sec": 3815, "html": "В сейфе: сервисный ключ (легендарный, копию сделать нельзя), розовый веер, отрезанный язык в банке и золотые часы на цепочке. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> оставляет вместо них баночку солидола. Выбежавшего бескрылого безъязыкого купидона оглушают и прячут в «ненасытное платье» Фригидии."}, {"t": "≈1:09", "sec": 4178, "html": "<a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> изучает трофеи: «Маховик времени» (отматывает 100 секунд, дважды в день) и «Веер тысячи воздыханий» (к нему «сопрягается» Эротика). <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> возвращает купидону язык."}, {"t": "≈1:15", "sec": 4542, "html": "Эротика читает мысли купидона: по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> он выстрелил в её брата <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> (сына <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>) и в проходившую полурослицу — любовь, за которую Гелиос покарал сына, подстроила Венера, дочь Гелиоса; потом она лишила купидона крыльев и языка."}, {"t": "≈1:21", "sec": 4905, "html": "<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> — восьмиконечная цитадель с лучом, питающим барьер; у входа три архангела, вокруг грифоны. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> проводит лодку облаками к шахте под островом, где звучат молитвы земных существ. Первая попытка вставить ключ проваливается — Коленвалус отматывает время маховиком; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> взбирается по верёвке и поворачивает ключ — турбина останавливается."}, {"t": "≈1:27", "sec": 5268, "html": "По лестнице герои попадают в восьмиугольный зал со статуями богов, генератором и накопителем. <a class=\"ref\" href=\"/a/svyataya-bomba/\">Святая бомба<\/a> несёт «божественный» положительный заряд — её нужно осквернить тяжким грехом. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> пытается сбежать, Фригидия телепортом ловит его; убивать свидетеля не решаются."}, {"t": "≈1:33", "sec": 5632, "html": "Архангелы замечают остановку лопастей. Пока спорят, кто совершит самоубийство, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> вонзает детонатор себе в сердце и активирует бомбу; бомба покрывается ржавчиной и трещинами. Архангелы врываются («святая бомба не несёт вреда!»), но отряд, отпив крови купидона, телепортируется по ангельскому паспорту на землю — к мастерской Коленвалуса в Котельниках."}, {"t": "≈1:39", "sec": 5995, "html": "Божественный купол сгорает, как бумага; с неба падают горящие куски земли — <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> уничтожена."}, {"t": "≈1:45", "sec": 6358, "html": "<a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> мёртв, но Локи в знакомой мастерской (с преимуществом, сложность 18) возвращает отца к жизни. Финальный закадровый текст: Тёмный властелин вернул тело и готов начать поход на небеса; вопрос — чем ответит <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> и что будет, если крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> добудет свиток апокалипсиса."}], "key_events": [{"t": "~0:02", "sec": null}, {"t": "~0:20", "sec": null}, {"t": "~0:30", "sec": null}, {"t": "~0:47", "sec": null}, {"t": "~1:12", "sec": null}, {"t": "~1:28", "sec": null}, {"t": "~1:34", "sec": null}, {"t": "~1:42", "sec": null}, {"t": "~1:45", "sec": null}, {"t": "~1:47", "sec": null}], "coins": {"ep": "52", "events": [{"t": null, "kind": "earn", "who": "Локтевалус «Локи»", "actor": "Чепурченко", "to": null, "reason": "Мастер выдал монету за лучшее представление персонажа (введение Локи).", "result": null, "sec": null, "who_url": "/c/loktevalus-loki/", "reason_html": "Мастер выдал монету за лучшее представление персонажа (введение Локи)."}, {"t": null, "kind": "earn", "who": "Фригидия и Эротика", "actor": "Блохина", "to": null, "reason": "Мастер выдал монету за яркое, эпатажное представление персонажа.", "result": null, "sec": null, "who_url": "/c/frigidiya-i-erotika/", "reason_html": "Мастер выдал монету за яркое, эпатажное представление персонажа."}, {"t": null, "kind": "give", "who": "Локтевалус «Локи»", "actor": "Чепурченко", "to": "Ангелин", "reason": "Локи отдал свою монету дяде Ангелину, чтобы тот мог перебросить проверку и вспомнить сведения о Дондоне.", "result": null, "sec": null, "who_url": "/c/loktevalus-loki/", "reason_html": "Локи отдал свою монету дяде <a class=\"ref\" href=\"/c/angelin/\">Ангелину<\/a>, чтобы тот мог перебросить проверку и вспомнить сведения о <a class=\"ref\" href=\"/c/dondon/\">Дондоне<\/a>."}, {"t": null, "kind": "spend", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "Потратил монету на переброс проверки интеллекта/истории, чтобы вспомнить лор про гномьего бога Дондона.", "result": "переброс не дал сразу результата, потребовалась ещё одна попытка", "sec": null, "who_url": "/c/angelin/", "reason_html": "Потратил монету на переброс проверки интеллекта/истории, чтобы вспомнить лор про гномьего бога <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>."}, {"t": null, "kind": "give", "who": "Локтевалус «Локи»", "actor": "Чепурченко", "to": "Ангелин", "reason": "После уговоров Локи отдал ещё одну монету дяде Ангелину для второго переброса той же проверки.", "result": null, "sec": null, "who_url": "/c/loktevalus-loki/", "reason_html": "После уговоров Локи отдал ещё одну монету дяде <a class=\"ref\" href=\"/c/angelin/\">Ангелину<\/a> для второго переброса той же проверки."}, {"t": null, "kind": "spend", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "Потратил вторую монету на повторный переброс проверки, чтобы вспомнить лор про Дондона.", "result": "успешно вспомнил, что Дондон — гномий бог-изобретатель, любивший людей и мечтавший облегчить их жизнь", "sec": null, "who_url": "/c/angelin/", "reason_html": "Потратил вторую монету на повторный переброс проверки, чтобы вспомнить лор про <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>."}, {"t": null, "kind": "earn", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "Мастер выдал монету за находчивость: Ангелин сообразил, что паспорта выдают только ангелам, пересекающим барьер, поэтому убитый ангел был «невыездным».", "result": null, "sec": null, "who_url": "/c/angelin/", "reason_html": "Мастер выдал монету за находчивость: <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> сообразил, что паспорта выдают только ангелам, пересекающим барьер, поэтому убитый ангел был «невыездным»."}, {"t": null, "kind": "spend", "who": "Коленвалус Рихтованос", "actor": "Гудков", "to": null, "reason": "Потратил монету на переброс проверки навигации (интеллект), чтобы провести небесную лодку к дому Венеры незаметно.", "result": "переброс удался, лодка благополучно долетела до дома Венеры", "sec": null, "who_url": "/c/kolenvalus/", "reason_html": "Потратил монету на переброс проверки навигации (интеллект), чтобы провести небесную лодку к дому <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> незаметно."}, {"t": null, "kind": "earn", "who": "Фригидия и Эротика", "actor": "Блохина", "to": null, "reason": "Мастер выдал монету за находчивость: Фригидия использовала способность телепортации, чтобы догнать сбежавшего херувима-купидона.", "result": null, "sec": null, "who_url": "/c/frigidiya-i-erotika/", "reason_html": "Мастер выдал монету за находчивость: Фригидия использовала способность телепортации, чтобы догнать сбежавшего херувима-купидона."}, {"t": null, "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "Мастер выдал монету за находчивую идею — использовать убийство херувима как доказательство греха для осквернения бомбы.", "result": null, "sec": null, "who_url": "/c/sfinkterion/", "reason_html": "Мастер выдал монету за находчивую идею — использовать убийство херувима как доказательство греха для осквернения бомбы."}, {"t": null, "kind": "other", "who": null, "actor": null, "to": null, "reason": "В конце игры подсчитали монеты, оставшиеся у игроков (две), бросили дополнительный d10 для бонусных монет за победу, и по итоговому числу монет определили сумму пожертвования в благотворительный фонд (итого 40 000 руб.).", "result": null, "sec": null, "who_url": null, "reason_html": "В конце игры подсчитали монеты, оставшиеся у игроков (две), бросили дополнительный d10 для бонусных монет за победу, и по итоговому числу монет определили сумму пожертвования в благотворительный фонд (итого 40 000 руб.)."}], "totals": [{"who": "Локтевалус «Локи»", "actor": "Чепурченко", "earned": 1, "spent": 2, "img": null, "who_url": "/c/loktevalus-loki/", "actor_url": "/p/chepurchenko/"}, {"who": "Ангелин", "actor": "Гоген Солнцев", "earned": 3, "spent": 2, "img": "img/chars/angelin.webp", "who_url": "/c/angelin/", "actor_url": "/p/gogen-solncev/"}, {"who": "Фригидия и Эротика", "actor": "Блохина", "earned": 2, "spent": 0, "img": null, "who_url": "/c/frigidiya-i-erotika/", "actor_url": "/p/blohina/"}, {"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Коленвалус Рихтованос", "actor": "Гудков", "earned": 0, "spent": 1, "img": "img/chars/kolenvalus.webp", "who_url": "/c/kolenvalus/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "В этом выпуске в файле-сниппете нет таймкодов, поэтому все значения t выставлены в null. Отдельная особенность выпуска — благотворительная монетная механика: оставшиеся на конец игры монеты (плюс бонусный бросок d10 за победу) конвертировались в сумму пожертвования в благотворительный фонд (40 000 руб.). Один неоднозначный эпизод с упоминанием «монеты» при броске кубиков «пирамидкой» (около сцены со вставкой ключа) не включён в события как игровая транзакция — из контекста непонятно, была ли это реальная выдача/трата монеты или просто шутка про совпадающие значения кубиков."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, падший рыцарь (воин)", "role": "", "fate": "выжил", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на Короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21 о будет только на гречке всю жизнь». — <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a>, «нечестивое слово» ангелу"], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>: орбиты парящих скал, Департамент изобретательства, небесная канцелярия, вилла <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> на тропическом острове, <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> (восьмиконечная цитадель с генератором и шахтой молитв с турбиной). Земля: <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>, мастерская <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> в Котельниках.<\/li>\n<li>Боги небесного мира, небесное войско (ангелы, архангелы, валькирии, купидоны), слуги Тёмного властелина.<\/li>\n<li><a class=\"ref\" href=\"/a/svyataya-bomba/\">Святая бомба<\/a> (взорвана), сервисный ключ от накопителя, ангельский паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>, Маховик времени, Веер тысячи воздыханий, божественный гаечный ключ <a class=\"ref\" href=\"/c/dondon/\">Дондона<\/a>, ненасытное платье Фригидии (вмещает до 200 кг), резонатор еретика, верёвка с кошкой, щит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, чертёж и остов 40-метрового робота «Небесный страж».<\/li>\n<\/ul>", "chars": {"Локтевалус «Локи»": {"name": "Локтевалус «Локи»", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Чепурченко"], "kind": "pc", "dead": false, "race": "гомункул (гибрид демона и ангела), лекарь", "portraits": [], "url": "/c/loktevalus-loki/", "eps": [{"key": "52", "label": "52", "title": "Накопитель Любви"}]}, "Ангелин": {"name": "Ангелин", "img": "img/chars/angelin.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%90%D0%BD%D0%B3%D0%B5%D0%BB%D0%B8%D0%BD", "summary": "Ангелин - бывший ангел по вызову. Сейчас – падший ангел.", "infobox": {"Пол": "Мужской", "Раса": "Небожитель (падший)", "Тип": "Игровой", "Игрок": "Гоген Солнцев"}, "actors": ["Гоге
