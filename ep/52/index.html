<script>window.EPD = {"anim": false, "key": "52", "label": "52", "title": "Накопитель Любви", "date": "2026-08-29", "minutes": 109, "duration": 6540.0, "video_id": "REiqMLUvb_A", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Небесный мир: Департамент изобретательства, вилла Венеры, Накопитель Любви; финал — мастерская Коленвалуса в Котельниках (земля)", "short_html": "Падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с отрядом проникает в небесный мир, чтобы уничтожить <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a>.", "summary_html": "Прямое продолжение финала вып. 51: Тёмный властелин отправил падшего рыцаря <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с отрядом «злых» союзников в небесный мир, чтобы уничтожить <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> — механизм, питающий Великую границу между мирами. Под прикрытием светлой ауры гомункула Локи герои добывают у гномьего бога-изобретателя Дон-Дона сведения о техническом входе, грабят сейф верховной богини <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> (отвечая на её «анкету о любви») и узнают, что именно Венера через купидона свела <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> с земной полурослицей. Через турбинную шахту они проникают в цитадель; святую бомбу, которая против божественного накопителя бесполезна, нужно «осквернить» тяжким грехом — и <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> совершает самоубийство, вонзив детонатор себе в сердце. Бомба взрывается, Великая граница сгорает, а Локи в мастерской в Котельниках воскрешает отца.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: В «диктанте» 52-го Тёмный властелин ещё не расколдован\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>В «диктанте» 52-го Тёмный властелин ещё не расколдован<\/b> Зрители спросили, почему в начале 52-го выпуска Тёмный властелин показан в демоническом облике, хотя в 51-м его расколдовали. Объяснили, что события 52-го происходят раньше финала 51-го: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в конце 51-го говорит, что уже отправил посланника на небеса. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1096\" target=\"_blank\" rel=\"noopener\">0:18:16 ↗<\/a> · <a href=\"#qa51-52-1\">к записи<\/a><\/span><\/span>", "outcome_html": "<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> между мирами уничтожена; отряд вернулся на землю, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> умер и воскрешён. Небеса открыты для Тёмного властелина и демонов.", "world_html": ["<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> взорван, Великая граница уничтожена — небесный мир открыт<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд\">40<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд<\/b> Отметили, что сбылось видение Херона: «небо упало, оно в огне». <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> считает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выполнил свою задачу перед Тёмным властелином и логичнее всего ему вернуться домой, в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>. Остальные возразили, что ни боги, ни люди, считающие его предателем, его в покое не оставят. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 ↗<\/a> · <a href=\"#qa51-52-38\">к записи<\/a><\/span><\/span>", "Раскрыто, что <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> (дочь <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>) подстроила любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона\">28<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b> Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела купидона. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 ↗<\/a> · <a href=\"#qa51-52-26\">к записи<\/a><\/span><\/span>", "Верховная богиня — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>; <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> мечтает о возвращении <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b> <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 ↗<\/a> · <a href=\"#qa51-52-29\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> назван потомком <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>, которого ищут <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> и Тёмный властелин", "<a class=\"ref\" href=\"/c/venera/\">Венера<\/a> строит боевого робота «Небесный страж» для войны на земле", "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> объявлен на небесах предателем"], "scenes": [{"t": "≈0:03", "sec": 182, "html": "На небесах верховная богиня <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> выслушивает доклад: люди разбили демонов на равнинах, те укрылись в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. Венера проповедует «баланс страданий и избавлений» ради молитв (реклама Авито-путешествий «от небес»). Затем спрашивает о потомке <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> — Лёше: небесный мир в безопасности, пока Брэндон его не нашёл («двери у него есть, нет ключа»); Венера сама летит искать «бога Лёшу»."}, {"t": "≈0:09", "sec": 545, "html": "Предыстория: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, желая прекратить феодальную распрю, зарезал лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — и демоны превратили <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> в филиал ада. Из чувства вины он заключил союз с Тёмным властелином: тот оставит землю в покое, если рыцарь поможет ему пересечь границу миров. Соратники объявили Сфинктериона изменником, но он открыл портал в небесный мир и добыл святую бомбу.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Портал из 46-го выпуска охраняет армия валькирий\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Портал из 46-го выпуска охраняет армия валькирий<\/b> Портал на небеса, который <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил в 46-м выпуске, не использовали, потому что известно, куда он ведёт: выход на небесной стороне охраняется. Вышедших оттуда сразу растерзала бы армия валькирий. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1187\" target=\"_blank\" rel=\"noopener\">0:19:47 ↗<\/a> · <a href=\"#qa51-52-3\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:15", "sec": 908, "html": "Представление героев: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет «впустить в дом жестоких богов их злейших врагов», чтобы земля жила спокойно; <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> разгадал, что его гомункул Локи — гибрид демона и ангела, чья аура скроет осквернённых от Великой границы; Локи — наивный ребёнок, которому обещали «большой фейерверк»; <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> рисует карту небес (орбиты летающих скал, департаменты, вилла <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> под охраной трёх архангелов); <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидия и Эротика<\/a> — дочери смертной бегуньи и бога, овладевшего ею в облике страуса; полубогов стали истреблять собственные родители-боги, и сёстры укрылись у Тёмного властелина.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ускаманоса не взяли: слишком пахнет серой\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ускаманоса не взяли: слишком пахнет серой<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, почему <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>, ближайшего соратника <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, не взяли на миссию. Он настолько жесток, что его не пропустили бы на небеса даже с паспортом и гомункулом, поэтому подбирали героев «с серой моралью». <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1289\" target=\"_blank\" rel=\"noopener\">0:21:29 ↗<\/a> · <a href=\"#qa51-52-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Закон обратной силы не имеет: Фригидия легальна, но полубогов начали истреблять\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Закон обратной силы не имеет: Фригидия легальна, но полубогов начали истреблять<\/b> Фригидия родилась до запрета и была «легальной» полубогиней. Однако она заметила, что таких полубогов начали уничтожать, и поэтому укрылась у Тёмного властелина. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1838\" target=\"_blank\" rel=\"noopener\">0:30:38 ↗<\/a> · <a href=\"#qa51-52-8\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:21", "sec": 1272, "html": "Наставления Тёмного властелина («диктант»): держаться рядом с гомункулом (от героев пахнет серой); три архангела непобедимы, но есть технический вход — ключ у гномьего бога Дон-Дона. Обнявшись с Локи, держащим ангельский паспорт, отряд телепортируется к Департаменту изобретательства.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: В «диктанте» 52-го Тёмный властелин ещё не расколдован\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>В «диктанте» 52-го Тёмный властелин ещё не расколдован<\/b> Зрители спросили, почему в начале 52-го выпуска Тёмный властелин показан в демоническом облике, хотя в 51-м его расколдовали. Объяснили, что события 52-го происходят раньше финала 51-го: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в конце 51-го говорит, что уже отправил посланника на небеса. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1096\" target=\"_blank\" rel=\"noopener\">0:18:16 ↗<\/a> · <a href=\"#qa51-52-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как отряд попал на небеса: паспорт телепортирует, аура гомункула скрывает<\/b> Небесные существа могут попасть на Землю только с разрешения небесной канцелярии. Для этого им выдают ангельский паспорт, и он же служит инструментом перемещения. Сам <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> после тёмного контракта пройти Великую границу не мог. Отряд телепортировался по касанию с помощью паспорта, а границу миновал благодаря ангельской крови Локи: аура гомункула поглощала тёмную ауру спутников. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1123\" target=\"_blank\" rel=\"noopener\">0:18:43 ↗<\/a> · <a href=\"#qa51-52-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Устройство бомбы выдали заранее, чтобы не растягивать сюжет\">8<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Устройство бомбы выдали заранее, чтобы не растягивать сюжет<\/b> Зрителям показалось, что в начале 52-го выпуска героям выдали много информации, узнанной за кадром. Авторы ответили, что отдельное приключение о разгадке бомбы сочли бы растягиванием, тем более что её механизм узнаётся одним броском интеллекта. <a class=\"ref\" href=\"/c/gogen/\">Гогену<\/a> перед игрой подробно объясняли правила и карту шахты. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1449\" target=\"_blank\" rel=\"noopener\">0:24:09 ↗<\/a> · <a href=\"#qa51-52-6\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:27", "sec": 1635, "html": "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> (за монету) вспоминает: <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> любил людей и хотел облегчить их труд, но <a class=\"ref\" href=\"/c/venera/\">Венера<\/a>, желающая страданий, его затирает. Герои обходят здание, вырезают стекло; внутри пьяный Дон-Дон над чертежом робота «Небесный страж».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранный бой с автоматонами: забыли нарисовать крыши\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранный бой с автоматонами: забыли нарисовать крыши<\/b> Авторы ждали, что герои пойдут к Дон-Дону через главный цех мимо автоматонов (скрытность 14). Провал скрытности вёл к нелетальному бою: автоматоны связывают нарушителей «в куб». Когда один автоматон опускается до 5 хитов, он включает самоуничтожение, а <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> его отключает. Сцену пропустили, потому что на карте «забыли сделать крыши»: игроки увидели гигантский скелет робота и обошли здание через окно. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2026\" target=\"_blank\" rel=\"noopener\">0:33:46 ↗<\/a> · <a href=\"#qa51-52-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Робот «Небесный страж» можно было использовать против ангелов\">14<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Робот «Небесный страж» можно было использовать против ангелов<\/b> При удачных переговорах с Дон-Доном героям, окружённым ангелами, можно было сесть в недостроенного 40-метрового робота «Небесный страж». Чтобы им управлять, нужно сесть в кресло пилота на месте головы и пройти проверку интеллекта 12. Робот ползает на одной руке и бьёт с бонусом +12 на 10d6. Засада ангелов из-за засвеченного паспорта <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> случилась бы в любом случае. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2089\" target=\"_blank\" rel=\"noopener\">0:34:49 ↗<\/a> · <a href=\"#qa51-52-12\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:33", "sec": 1998, "html": "Разговор с Дон-Доном: он знает <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, пугается Эротики, умиляется Локи и дарит ему свой божественный гаечный ключ. Фригидия (крит) очаровывает бога. Выясняется: сервисного ключа у него нет — <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> забрала его и хранит в сейфе на своей вилле (сейф открывается ответами на контрольные вопросы). Святую бомбу сделал сам <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> — нарочно с долгим таймером, чтобы взрыв можно было остановить; против накопителя она бесполезна, а сервисный ключ останавливает турбину в шахте молитв. Дон-Дон против войны на небесах и хочет возвращения <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> верховным богом. Под заказ Венеры он строит огромную боевую машину для земли.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Неподобранные изобретения Дон-Дона: пузырь тишины, клещи для сейфа, рюкзак полёта\">17<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Неподобранные изобретения Дон-Дона: пузырь тишины, клещи для сейфа, рюкзак полёта<\/b> В департаменте изобретательства можно было найти полезные вещи. Пузырь тишины на минуту глушит любой звук: с ним можно было без тревоги брать вещи у <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> или нейтрализовать заклинателя. Гидравлические клещи взламывали сейф Венеры без анкеты. Были также рюкзак с крыльями для полёта со скоростью бега, противопожарная броня (КБ 20, огнетушитель, сопротивление огню) и маячок вызова беспилотной небесной лодки, которую привозит пеликан. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2362\" target=\"_blank\" rel=\"noopener\">0:39:22 ↗<\/a> · <a href=\"#qa51-52-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Божественный ключ Дон-Дона у Локи; отцу пользоваться запрещено — сцену вырезали\">18<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Божественный ключ Дон-Дона у Локи; отцу пользоваться запрещено — сцену вырезали<\/b> Судьба божественного гаечного ключа осталась в выпуске неясной. Из монтажа вырезали момент, где <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> отдаёт ключ Локи и запрещает его отцу им пользоваться. Ключ остался у отряда. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2631\" target=\"_blank\" rel=\"noopener\">0:43:51 ↗<\/a> · <a href=\"#qa51-52-16\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:39", "sec": 2362, "html": "Три ангела небесного войска окружают департамент: паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> «засвечен». <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> не помогает, но выключает свои автоматоны. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> внушением прогоняет двух ангелов; третий пронзает Ангелина копьём, поскальзывается «на собственных слезах»; бой: «нечестивое слово» Ангелина, укус Локи, «резонатор еретика» <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> (заодно оглушает Фригидию); Сфинктерион добивает ангела мечом.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Паспорт ангела — маячок, тёмную ауру щита скрывал гомункул\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Паспорт ангела — маячок, тёмную ауру щита скрывал гомункул<\/b> Ангелы отследили паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> не из-за тёмной ауры: каждый паспорт, выданный небесной канцелярией, работает как маячок. Тёмную ауру <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и его щита при этом гасила аура гомункула, поэтому её не почувствовали. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1872\" target=\"_blank\" rel=\"noopener\">0:31:12 ↗<\/a> · <a href=\"#qa51-52-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Харизма универсальна; неприязнь сторон — через помеху\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Харизма универсальна; неприязнь сторон — через помеху<\/b> Зрители спросили, почему у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> высокая харизма даже на небесах. Ответили, что харизма — внутренняя сила влияния и от мира не зависит. Неприязнь между сторонами (например, демона и ангела) мастер отражает проверкой с помехой, а не снижением характеристики. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1904\" target=\"_blank\" rel=\"noopener\">0:31:44 ↗<\/a> · <a href=\"#qa51-52-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Робот «Небесный страж» можно было использовать против ангелов\">14<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Робот «Небесный страж» можно было использовать против ангелов<\/b> При удачных переговорах с Дон-Доном героям, окружённым ангелами, можно было сесть в недостроенного 40-метрового робота «Небесный страж». Чтобы им управлять, нужно сесть в кресло пилота на месте головы и пройти проверку интеллекта 12. Робот ползает на одной руке и бьёт с бонусом +12 на 10d6. Засада ангелов из-за засвеченного паспорта <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> случилась бы в любом случае. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2089\" target=\"_blank\" rel=\"noopener\">0:34:49 ↗<\/a> · <a href=\"#qa51-52-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Бой с ангелами сократили: игрокам не хотелось драться\">16<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Бой с ангелами сократили: игрокам не хотелось драться<\/b> Большая боевая сцена выпала из-за обхода цеха. Бой с ангелами вышел коротким: двоих прогнали множественным внушением, а последний выбросил единицу и поскользнулся. Мастер сознательно ускорил бой, потому что у игроков не было настроения драться. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2280\" target=\"_blank\" rel=\"noopener\">0:38:00 ↗<\/a> · <a href=\"#qa51-52-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гоген не извинился перед ангелом из подозрения к авторам\">41<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гоген не извинился перед ангелом из подозрения к авторам<\/b> Ангел соглашался простить <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>, если тот покается. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> отказался: ему постоянно казалось, что Селезнёв подсылает персонажей, которые тянут время, и в каждом предложении он искал подвох. К тому же, по его словам, он сам гордый человек. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6288\" target=\"_blank\" rel=\"noopener\">1:44:48 ↗<\/a> · <a href=\"#qa51-52-39\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:45", "sec": 2725, "html": "На небесной лодке Локи лечит <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> и Фригидию, кошка-«абордажный крюк» зализывает раны <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалусу<\/a>. Паспорт Ангелина прячут в «самую грязную вещь на небесах» — щит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, чтобы его не отслеживали.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Паспорт ангела — маячок, тёмную ауру щита скрывал гомункул\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Паспорт ангела — маячок, тёмную ауру щита скрывал гомункул<\/b> Ангелы отследили паспорт <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> не из-за тёмной ауры: каждый паспорт, выданный небесной канцелярией, работает как маячок. Тёмную ауру <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и его щита при этом гасила аура гомункула, поэтому её не почувствовали. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1872\" target=\"_blank\" rel=\"noopener\">0:31:12 ↗<\/a> · <a href=\"#qa51-52-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Ждали, что паспорт выбросят и с небес спрыгнут; щит мастер засчитал за удачную идею\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Ждали, что паспорт выбросят и с небес спрыгнут; щит мастер засчитал за удачную идею<\/b> Авторы ожидали, что отряд избавится от паспорта (например, сбросит его в реку, чтобы увести погоню), а после падения границы герои просто спрыгнут на землю, крылатые полетят сами. Идею спрятать паспорт за тёмным щитом, чтобы тёмная аура «аннулировала» маячок, приняли после проверки интеллекта: мастер не отвергает хорошую идею, которая понравилась залу. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2153\" target=\"_blank\" rel=\"noopener\">0:35:53 ↗<\/a> · <a href=\"#qa51-52-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Бонусная сцена проверки документов патрулём валькирий не случилась\">20<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Бонусная сцена проверки документов патрулём валькирий не случилась<\/b> По пути от департамента к вилле <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> могла быть полубоевая сцена: патруль валькирий на грифонах проверяет документы и может узнать <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> успешно прошёл проверку навигации, а паспорт был спрятан, поэтому отряд долетел без встреч. Авторы подчеркнули, что сцена была бонусной, а не обязательной. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2900\" target=\"_blank\" rel=\"noopener\">0:48:20 ↗<\/a> · <a href=\"#qa51-52-18\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:51", "sec": 3088, "html": "<a class=\"ref\" href=\"/c/villi/\">Вилла<\/a> <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> на парящем тропическом острове: <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> (крит) помнит планировку — сканирующий глаз у входа, спальня; Венеры нет дома. Фригидию превращают в «светильник-страуса» как подарок от Дон-Дона; купидонов уговорами и внушением отправляют «охранять озеро».<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Ангелин узнал планировку виллы критом на проверке истории\">21<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Ангелин узнал планировку виллы критом на проверке истории<\/b> К вилле <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> тоже не подготовили отдельную карту с крышей, и игроки сразу увидели весь дом. <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> сказал, что бывал здесь. Мастер дал ему проверку истории, выпала двадцатка, и мастер рассказал всё о доме: сканер, комнаты, гардеробную. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2963\" target=\"_blank\" rel=\"noopener\">0:49:23 ↗<\/a> · <a href=\"#qa51-52-19\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Купидоны и ангелы: иерархия как у демонов (не продумано)\">22<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Купидоны и ангелы: иерархия как у демонов (не продумано)<\/b> На вопрос, вырастают ли купидоны в ангелов, авторы признали, что этого не продумывали. Допустили, что небесные существа, как и демоны, растут, поднимаются в иерархии и меняют облик. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> и <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> в шутку настаивали, что купидоны — взрослые «карлики»: одному из них 800 лет. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3074\" target=\"_blank\" rel=\"noopener\">0:51:14 ↗<\/a> · <a href=\"#qa51-52-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Сканирующий глаз и сигнализация виллы: валькирии, затем Венера — конец миссии\">23<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Сканирующий глаз и сигнализация виллы: валькирии, затем Венера — конец миссии<\/b> Если бы сработала сигнализация виллы (сканирующий глаз, взятый вне сейфа артефакт или стычка), прилетели бы валькирии, а при подозрении они вызвали бы <a class=\"ref\" href=\"/c/venera/\">Венеру<\/a>. Прямое столкновение с Венерой означало провал и гибель. На своей территории она останавливает время и получает 1d4 лишних хода, а убить может щелчком пальцев. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3265\" target=\"_blank\" rel=\"noopener\">0:54:25 ↗<\/a> · <a href=\"#qa51-52-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Мраморная беседка Венеры — её личный реинкарнатор: героев превратили бы в камни\">24<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Мраморная беседка Венеры — её личный реинкарнатор: героев превратили бы в камни<\/b> Ажурная беседка у виллы — личный портал реинкарнации <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, вроде того, что был в 27-м выпуске. Поймав героев, Венера изобразила бы доброту и пообещала отпустить их на Землю без стирания памяти. На деле она отправила бы их в беседку, и они переродились бы цветком в Кунисских горах, сосной в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> или галькой на пляже Багряного моря, сохранив память. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3330\" target=\"_blank\" rel=\"noopener\">0:55:30 ↗<\/a> · <a href=\"#qa51-52-22\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:57", "sec": 3452, "html": "В спальне под кроватью — сейф. Голос сейфа проводит «анкету» <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>: 10+ вопросов о свиданиях и отношениях («кто платит», «после какого свидания», «сколько сантиметров» и т.п.); с двумя ошибками герои отвечают верно, последний вопрос — «влияет ли длина на оргазм?» — «нет, ведь можно и языком».<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Анкету сейфа Венеры составили с помощью ChatGPT\">25<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Анкету сейфа Венеры составили с помощью ChatGPT<\/b> Вопросы анкеты подобрали через ChatGPT. Сначала попросили список банальных вопросов об отношениях, потом попросили ответить на них от лица «взрослой уверенной женщины на руководящей должности»; эти ответы и сочли правильными. Формулировку «После какого свидания можно давать секс?» предложила девушка одного из авторов, и её оставили без изменений. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3480\" target=\"_blank\" rel=\"noopener\">0:58:00 ↗<\/a> · <a href=\"#qa51-52-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ответы сейфа не подгоняли; подсказкой был безъязыкий купидон\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ответы сейфа не подгоняли; подсказкой был безъязыкий купидон<\/b> Заготовленные ответы не меняли: игроки ошиблись дважды, и вместо двух дополнительных вопросов задали один «грязный». Мастер считал, что ответить на 10 вопросов без ошибок нереально, поэтому заложил подсказку — шорох безъязыкого купидона. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> слышал все ответы и мог подсказывать кивками или морганием, но игроки, боясь ловушек, на шорох не пошли. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=3922\" target=\"_blank\" rel=\"noopener\">1:05:22 ↗<\/a> · <a href=\"#qa51-52-24\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:03", "sec": 3815, "html": "В сейфе: сервисный ключ (легендарный, копию сделать нельзя), розовый веер, отрезанный язык в банке и золотые часы на цепочке. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> оставляет вместо них баночку солидола. Выбежавшего бескрылого безъязыкого купидона оглушают и прячут в «ненасытное платье» Фригидии.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Безъязыкого купидона зовут Питер\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Безъязыкого купидона зовут Питер<\/b> Безкрылого и безъязыкого купидона, найденного у сейфа <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>, зовут Питер. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4010\" target=\"_blank\" rel=\"noopener\">1:06:50 ↗<\/a> · <a href=\"#qa51-52-25\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:09", "sec": 4178, "html": "<a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> изучает трофеи: «Маховик времени» (отматывает 100 секунд, дважды в день) и «Веер тысячи воздыханий» (к нему «сопрягается» Эротика). <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> возвращает купидону язык.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Маховик времени отматывает на 100 секунд весь мир, включая богов\">34<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Маховик времени отматывает на 100 секунд весь мир, включая богов<\/b> Маховик времени не создаёт копий, как хроноворот в «Гарри Поттере». Он хранит «буфер» последних 100 секунд и откатывает всю вселенную, богов в том числе; память сохраняет только владелец. Пользоваться им можно два раза в день. Участники спорили, не слишком ли он силён, но авторы подтвердили именно эту механику. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4837\" target=\"_blank\" rel=\"noopener\">1:20:37 ↗<\/a> · <a href=\"#qa51-52-32\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:15", "sec": 4542, "html": "Эротика читает мысли купидона: по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> он выстрелил в её брата <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> (сына <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>) и в проходившую полурослицу — любовь, за которую Гелиос покарал сына, подстроила Венера, дочь Гелиоса; потом она лишила купидона крыльев и языка.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона\">28<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b> Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела купидона. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 ↗<\/a> · <a href=\"#qa51-52-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему Венера пощадила купидона-свидетеля: версии без канона\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему Венера пощадила купидона-свидетеля: версии без канона<\/b> Участники обсудили, почему <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> оставила купидона живым у себя, не стёрла ему память и хранила его язык в сейфе. Прозвучали версии: язык был средством шантажа; Венера считает себя доброй и не убивает божественных существ; держала врага ближе к себе. Окончательного ответа не дали — то ли она «глупая садистка», то ли за этим что-то стоит. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4295\" target=\"_blank\" rel=\"noopener\">1:11:35 ↗<\/a> · <a href=\"#qa51-52-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Отряд мог сменить миссию, но к Гелиосу добраться было бы ещё опаснее\">32<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Отряд мог сменить миссию, но к Гелиосу добраться было бы ещё опаснее<\/b> Авторы подтвердили, что после разоблачения <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a> герои могли отказаться от уничтожения накопителя. Однако никто из отряда не знал, где находится <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a>, а любая встреча с богом смертельно опасна. <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> — изгой среди богов: он любил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и Гелиоса и хочет их воссоединения. Остальные боги держатся за свои места и «черпают любовь», поэтому видят в этом угрозу. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4492\" target=\"_blank\" rel=\"noopener\">1:14:52 ↗<\/a> · <a href=\"#qa51-52-30\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:21", "sec": 4905, "html": "<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Накопитель Любви<\/a> — восьмиконечная цитадель с лучом, питающим барьер; у входа три архангела, вокруг грифоны. <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> проводит лодку облаками к шахте под островом, где звучат молитвы земных существ. Первая попытка вставить ключ проваливается — Коленвалус отматывает время маховиком; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> взбирается по верёвке и поворачивает ключ — турбина останавливается.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Шахта накопителя открывается раз в 100 лет для техобслуживания\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Шахта накопителя открывается раз в 100 лет для техобслуживания<\/b> Шахта, открывающаяся раз в 100 лет, — это не пошлый эвфемизм и не предзнаменование. Это штатный технологический процесс: раз в столетие туда залезают для ремонта и чистки. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=2811\" target=\"_blank\" rel=\"noopener\">0:46:51 ↗<\/a> · <a href=\"#qa51-52-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Нижний вход в накопитель охранялся; было три пути внутрь\">33<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Нижний вход в накопитель охранялся; было три пути внутрь<\/b> Технический вход не был беззащитным: вокруг летали лодки и грифоны, и их обошли успешной проверкой навигации. Внутрь было три пути: сервисный ключ останавливает лопасти; без ключа можно проскочить лопасти только на критической ловкости, иначе они перемалывают; через главный вход мимо трёх архангелов — почти наверняка смерть. Систему, которую невозможно взломать, авторы считают бессмысленной для игры. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4672\" target=\"_blank\" rel=\"noopener\">1:17:52 ↗<\/a> · <a href=\"#qa51-52-31\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Маховик времени отматывает на 100 секунд весь мир, включая богов\">34<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Маховик времени отматывает на 100 секунд весь мир, включая богов<\/b> Маховик времени не создаёт копий, как хроноворот в «Гарри Поттере». Он хранит «буфер» последних 100 секунд и откатывает всю вселенную, богов в том числе; память сохраняет только владелец. Пользоваться им можно два раза в день. Участники спорили, не слишком ли он силён, но авторы подтвердили именно эту механику. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4837\" target=\"_blank\" rel=\"noopener\">1:20:37 ↗<\/a> · <a href=\"#qa51-52-32\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:27", "sec": 5268, "html": "По лестнице герои попадают в восьмиугольный зал со статуями богов, генератором и накопителем. <a class=\"ref\" href=\"/a/svyataya-bomba/\">Святая бомба<\/a> несёт «божественный» положительный заряд — её нужно осквернить тяжким грехом. <a class=\"ref\" href=\"/c/kupidon/\">Купидон<\/a> пытается сбежать, Фригидия телепортом ловит его; убивать свидетеля не решаются.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Опыты Коленвалуса: слабые грехи бомбу не оскверняют, работают убийство и самоубийство\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Опыты Коленвалуса: слабые грехи бомбу не оскверняют, работают убийство и самоубийство<\/b> В своей мастерской <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> проверял на святой воде грехи разной тяжести. Гнев, ложь и чревоугодие не действовали; сработал только тяжкий грех — убийство или самоубийство. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5157\" target=\"_blank\" rel=\"noopener\">1:25:57 ↗<\/a> · <a href=\"#qa51-52-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Авторы ждали от Сфинктериона жертвы или убийства; бомбу нельзя осквернить заранее\">37<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Авторы ждали от Сфинктериона жертвы или убийства; бомбу нельзя осквернить заранее<\/b> Авторы ожидали самопожертвования или того, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сам выберет и убьёт кого-то, как когда-то лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Вариантов не прописывали, а лишь создали обстоятельства; конспект с условием выдали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> заранее. Осквернить бомбу можно только рядом с накопителем: в земном мире она самоочищается. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 ↗<\/a> · <a href=\"#qa51-52-35\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ангелов создают боги энергией любви из генератора\">42<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ангелов создают боги энергией любви из генератора<\/b> У ангелов нет гениталий, но они пополняют число по-другому: их создают боги, возможно из праведников, энергией любви, поступающей через генератор накопителя. Чем могущественнее бог, тем больше существ он может создать. Суккубы и инкубы своего семени не производят: суккуб забирает семя мужчины, а инкуб, осквернив его, передаёт женщине; так рождаются тифлинги. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6902\" target=\"_blank\" rel=\"noopener\">1:55:02 ↗<\/a> · <a href=\"#qa51-52-43\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:33", "sec": 5632, "html": "Архангелы замечают остановку лопастей. Пока спорят, кто совершит самоубийство, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> вонзает детонатор себе в сердце и активирует бомбу; бомба покрывается ржавчиной и трещинами. Архангелы врываются («святая бомба не несёт вреда!»), но отряд, отпив крови купидона, телепортируется по ангельскому паспорту на землю — к мастерской Коленвалуса в Котельниках.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Тайный план BRB: «грех гордыни» как уловка\">36<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Тайный план BRB: «грех гордыни» как уловка<\/b> У <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был план, о котором он никому не сказал: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> «возгордится», заявит, что его кровь самая ценная, и потребует, чтобы кто-то другой убил себя, а потом остановится. Ему возразили, что такой «искусственный» грех не сработал бы. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5160\" target=\"_blank\" rel=\"noopener\">1:26:00 ↗<\/a> · <a href=\"#qa51-52-34\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Авторы ждали от Сфинктериона жертвы или убийства; бомбу нельзя осквернить заранее\">37<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Авторы ждали от Сфинктериона жертвы или убийства; бомбу нельзя осквернить заранее<\/b> Авторы ожидали самопожертвования или того, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сам выберет и убьёт кого-то, как когда-то лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Вариантов не прописывали, а лишь создали обстоятельства; конспект с условием выдали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> заранее. Осквернить бомбу можно только рядом с накопителем: в земном мире она самоочищается. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 ↗<\/a> · <a href=\"#qa51-52-35\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Самоубийство Коленвалуса засчитали как грех: решают боги\">38<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Самоубийство Коленвалуса засчитали как грех: решают боги<\/b> Зрители спорили, не было ли самоубийство <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> скорее самопожертвованием, которое не может осквернить бомбу (вспоминали фильм «Константин»). Бреганов сказал, что религия мира не авраамическая и мораль местных богов неизвестна. Решение принимают боги небесного мира, и для осквернения бомбы его приняли. Внезапный удар мечом в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> был бы двойным грехом — убийством и предательством. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5602\" target=\"_blank\" rel=\"noopener\">1:33:22 ↗<\/a> · <a href=\"#qa51-52-36\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:39", "sec": 5995, "html": "Божественный купол сгорает, как бумага; с неба падают горящие куски земли — <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> уничтожена.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд\">40<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Пророчество Херона сбылось; Сфинктерион думает вернуться в Вёрджинвальд<\/b> Отметили, что сбылось видение Херона: «небо упало, оно в огне». <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> считает, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выполнил свою задачу перед Тёмным властелином и логичнее всего ему вернуться домой, в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>. Остальные возразили, что ни боги, ни люди, считающие его предателем, его в покое не оставят. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5964\" target=\"_blank\" rel=\"noopener\">1:39:24 ↗<\/a> · <a href=\"#qa51-52-38\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:45", "sec": 6358, "html": "<a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> мёртв, но Локи в знакомой мастерской (с преимуществом, сложность 18) возвращает отца к жизни. Финальный закадровый текст: Тёмный властелин вернул тело и готов начать поход на небеса; вопрос — чем ответит <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> и что будет, если крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> добудет свиток апокалипсиса.<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Воскрешение Коленвалуса: сложность 18 была занижена\">39<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Воскрешение Коленвалуса: сложность 18 была занижена<\/b> Воскресить <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> предложил сам игрок, и зал поддержал. Локи бросал с преимуществом против сложности 18 при модификаторе +2 и выбросил 19. Задним числом авторы признали, что ставить надо было хотя бы 20. Судьбу Коленвалуса в шутку предложили решить голосованием в телеграме. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=5822\" target=\"_blank\" rel=\"noopener\">1:37:02 ↗<\/a> · <a href=\"#qa51-52-37\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "~0:02", "sec": null}, {"t": "~0:20", "sec": null}, {"t":
