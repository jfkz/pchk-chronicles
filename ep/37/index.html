<script>window.EPD = {"anim": false, "key": "37", "label": "37", "title": "Добровольцы", "date": "2025-04-14", "minutes": 107, "duration": 6407.0, "video_id": "9TmL8N5ZGFo", "branch": "Фронт", "branch_color": "#3E9A5E", "place": "Река Розалия у городка Фельткерн, тыл демонов, Туманный холм", "short_html": "Адская армия наступает на столицу, но королевские войска сдерживают её на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a> с помощью райских елей. Отряд добровольцев во главе с двумя «командирами», <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> и паладином <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a>, отправляется на Туманный холм уничтожить демоническое дальнобойное оружие; рядовые-простолюдины гибнут один за другим и заменяются новыми. Оружием оказывается демон Грета, питающийся людьми; Кряхтун, проглоченный ею, подрывает её динамитом изнутри. Выжившие побеждают, но средство вызова эвакуации утонуло в начале миссии.", "summary_html": "После срыва планов <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> адская армия Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> наступает на столицу, но королевские войска сдерживают её на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a> с помощью «райских елей». Отряд добровольцев — два самопровозглашённых «командира», громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a>, плюс сменяющиеся простолюдины (новая механика: у рядовых запасные карточки, погибшие не воскрешаются) — отправляется в тыл демонов на Туманный холм, чтобы уничтожить дальнобойное оружие, угрожающее мосту у городка Фельткерн. Почти все рядовые гибнут один за другим, Кряхтуна захватывают и скармливают оружию — гигантскому демону-пушке Грете, питающейся людьми. В последний момент Кряхтун подрывает Грету динамитом изнутри, погибая сам. Выжившие — Юлиан, <a class=\"ref\" href=\"/c/snezhana/\">Снежана<\/a>, <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a> и моряк <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a> — побеждают, но дымовая шашка для вызова гномского дирижабля утонула в самом начале, и их эвакуация под вопросом.", "outcome_html": "Грета уничтожена, мост у Фельткерна спасён; <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и почти все рядовые погибли, выжили <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/snezhana/\">Снежана<\/a>, <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a> и <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a>, но их эвакуация под вопросом.", "world_html": ["Адская армия наступает на столицу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>, фронт остановлен на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a>", "На переправах люди используют райские ели против демонов", "Демоническое дальнобойное оружие Грета у Фельткерна уничтожено", "Паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун (Кряхтун)<\/a> погиб"], "scenes": [{"t": "0:01:14", "sec": 74, "html": "Предыстория: президент <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обещал Тёмному Властелину божественного потомка, но план сорван дважды — «древолюд уничтожил <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палина<\/a>», а «бес-предатель убил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пенисова<\/a>». Адская армия пошла на столицу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>."}, {"t": "0:03:49", "sec": 229, "html": "Завязка: королевские войска остановили демонов на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a>; на переправах стоят «райские ели», испепеляющие нечисть божественным светом. Демоны установили на Туманном холме (40 км южнее Фельткерна) оружие, способное уничтожить райскую ель. Задача добровольцев — уничтожить его."}, {"t": "0:04:59", "sec": 299, "html": "Представление: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (из семьи бывших каннибалов, Отряд Солнца; прошёл экспресс-курс жрецов — святая вода, свадьбы, освящение повозок; «назначен командиром»), паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> (тоже «командир»; мечтает покорить сестру Юлиана <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a>), пасечник <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a>, пастух <a class=\"ref\" href=\"/c/ignat/\">Игнат<\/a> с колли Бимом, могильщик <a class=\"ref\" href=\"/c/antoshka/\">Антошка<\/a> (несёт дымовую шашку для вызова гномского дирижабля)."}, {"t": "0:13:01", "sec": 781, "html": "Переправа на бычьих пузырях: <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> ради шутки протыкает пузырь <a class=\"ref\" href=\"/c/antoshka/\">Антошки<\/a>, шум привлекает гигантского спрута — Антошку утаскивает под воду вместе с дымовой шашкой. Вводится механика запасных персонажей."}, {"t": "0:18:39", "sec": 1119, "html": "<a class=\"ref\" href=\"/c/ignat/\">Игнат<\/a> оттолкнулся от <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуна<\/a> и отправил его обратно к спруту; <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> отвлекает спрута банкой мёда. На берегу находят полурослика-оруженосца <a class=\"ref\" href=\"/c/fyodor-dvenyatin/\">Фёдора Двенятина<\/a> — выжившего из десятого (предыдущего) отряда; он помнит вспышку и адский патруль на машине."}, {"t": "0:21:47", "sec": 1307, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> делает святую воду. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> призывает пони (одноразово), по нему отряд забирается на обрыв, а сам паладин уносится вдоль берега «в гармонии с природой»."}, {"t": "0:29:07", "sec": 1747, "html": "Адский патруль из четырёх демонов: <a class=\"ref\" href=\"/c/ignat/\">Игнат<\/a> пытается разжалобить их историей про Бима и погибает от огненного снаряда. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> поливает демонов святой водой, <a class=\"ref\" href=\"/c/fyodor/\">Фёдор<\/a> атакует секирой Юлиана, но его разрывают пополам; «Слово солнца» Юлиана убивает двоих, <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> добивает демона вилами, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> возвращается и метает меч в последнего."}, {"t": "0:41:55", "sec": 2515, "html": "В багажнике адской машины — пленники: укротитель Лев (его цирк сожрали бесы) и торговец Олег, работавший на демонов и знающий инфернальный язык. Олег забирает пропуска демонов (Боб, <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a>, <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, Бальтазар младший); Лев свистком берёт себе Бима. Олег садится за руль, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> — за гарпун."}, {"t": "0:50:54", "sec": 3054, "html": "Пугало в кукурузном поле оказывается замученным пленником: у него зелья и карта минных полей у подножия холма. Засада бесов — Льву взрывает голову. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> гарпуном цепляет беса, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> по случайности тоже висит на гарпуне и добивает беса."}, {"t": "0:58:47", "sec": 3527, "html": "У просеки перед укреплениями к отряду выходит менестрель Стас Бердюшкин (его зовут «<a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> Бедро»), сосланный в добровольцы за куплет про короля. <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> предлагает запустить его на гарпуне как приманку; менестреля простреливают в колено."}, {"t": "1:08:58", "sec": 4138, "html": "<a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> гарпуном перебрасывают через ворота КПП — демоны сбегаются и разрывают его. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> и Бим уходят в лес, где находят полуэльфийку <a class=\"ref\" href=\"/c/snezhana/\">Снежану<\/a>: её друзей-древолюдов распилили на забор, и она знает дыру в нём."}, {"t": "1:13:16", "sec": 4396, "html": "Олег и <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> едут на КПП с пропусками; вдохновляющий стих «Умом Россию не понять» не помогает — демон пронзает Олега трезубцем. Кряхтун «Карой света» разрубает демона и бежит, но крылатый демон и пятеро других скручивают его и везут «на корм Грете»."}, {"t": "1:18:22", "sec": 4702, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> посылает Бима за <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a>. К отряду присоединяется <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a>, ученица волшебника, сбежавшая от учителя, который хотел принести её в жертву демонам. Юлиан венчает <a class=\"ref\" href=\"/c/bithoven/\">Битховена<\/a> и Айсидору (бонус к броне и проверкам)."}, {"t": "1:22:55", "sec": 4975, "html": "Отряд проходит через дыру в заборе, по карте обходит минное поле и поднимается на Туманный холм — к площадке разгрузки, где кран поднимает клетки с людьми. Разгадка: оружие — огромный демон Грета, заряжающийся людской плотью."}, {"t": "1:30:42", "sec": 5442, "html": "У <a class=\"ref\" href=\"/c/aysidora/\">Айсидоры<\/a> — связка динамита. Демоны подвешивают <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуна<\/a> на крюк и спускают на «адское блюдце». <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> атакует демона вилами, промахивается и погибает."}, {"t": "1:33:56", "sec": 5636, "html": "На блюдце с <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a> — дворфиха-аптекарь <a class=\"ref\" href=\"/c/finis/\">Финис<\/a>, притворившаяся пленницей; она бросается на Грету (шестиногое хитиновое чудовище с двуствольной пушкой на спине) и её съедают."}, {"t": "1:36:40", "sec": 5800, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> подсаживает <a class=\"ref\" href=\"/c/aysidora/\">Айсидору<\/a> на вершину, она волшебной рукой бросает зажжённый динамит, Грета отбивает его. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> ловит динамит, Грета глотает паладина — и взрывается изнутри."}, {"t": "1:42:10", "sec": 6130, "html": "Грета уничтожена, отряд залит чёрной жижей. Выясняется, что сообщить об успехе нечем — шашка утонула с <a class=\"ref\" href=\"/c/antoshka/\">Антошкой<\/a>. Новый рядовой, полурослик-моряк <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a>, отправляет Бима с запиской «Монстр побеждён, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> сожран, все остальные счастливы»."}, {"t": "1:44:25", "sec": 6265, "html": "Победа: выжившие (<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a>, <a class=\"ref\" href=\"/c/snezhana/\">Снежана<\/a>, <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a>) получают уровень и становятся героями; Паль в конце тянет карточку антропоморфного гриба <a class=\"ref\" href=\"/c/gogen/\">Гогена<\/a>. 60 000 руб. на благотворительность. Эвакуация — в будущих выпусках."}], "key_events": [{"t": "0:03:49", "sec": 229}, {"t": "0:15:09", "sec": 909}, {"t": "0:31:33", "sec": 1893}, {"t": "0:43:53", "sec": 2633}, {"t": "0:51:52", "sec": 3112}, {"t": "1:09:44", "sec": 4184}, {"t": "1:15:40", "sec": 4540}, {"t": "1:21:20", "sec": 4880}, {"t": "1:28:50", "sec": 5330}, {"t": "1:42:10", "sec": 6130}], "coins": {"ep": "37", "events": [{"t": "0:32:03", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета за придуманную историю про пса Бима, которой отвлекли демонов; из фрагмента не ясно, кто из добровольцев её рассказал", "result": null, "sec": 1923, "who_url": null, "reason_html": "монета за придуманную историю про пса Бима, которой отвлекли демонов; из фрагмента не ясно, кто из добровольцев её рассказал"}, {"t": "0:41:00", "kind": "earn", "who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "to": null, "reason": "монету дали не за красоту прыжка с пони на воткнутый меч, а просто за то, что группа наконец забралась на обрыв", "result": null, "sec": 2460, "who_url": "/c/paladin-krihta/", "reason_html": "монету дали не за красоту прыжка с пони на воткнутый меч, а просто за то, что группа наконец забралась на обрыв"}, {"t": "0:49:35", "kind": "earn", "who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "to": null, "reason": "получил монету «за конструктив» — придумал стрелять по воронам-разведчикам с брони машины", "result": null, "sec": 2975, "who_url": "/c/paladin-krihta/", "reason_html": "получил монету «за конструктив» — придумал стрелять по воронам-разведчикам с брони машины"}, {"t": "0:51:42", "kind": "loot", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "обыскал повешенного пленника и нашёл два зелья лечения, свиток-карту и одну золотую монету", "result": null, "sec": 3102, "who_url": "/c/yulian/", "reason_html": "обыскал повешенного пленника и нашёл два зелья лечения, свиток-карту и одну золотую монету"}, {"t": "0:51:46", "kind": "earn", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "получил монету за критический успех проверки внимательности при обыске тела", "result": null, "sec": 3106, "who_url": "/c/yulian/", "reason_html": "получил монету за критический успех проверки внимательности при обыске тела"}, {"t": "1:00:24", "kind": "earn", "who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "to": null, "reason": "получил монету за яркую предысторию нового персонажа-менестреля", "result": null, "sec": 3624, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "reason_html": "получил монету за яркую предысторию нового персонажа-менестреля"}, {"t": "1:05:19", "kind": "spend", "who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "to": null, "reason": "Кряхтун потратил общую монету, чтобы помочь Филиппу с переброском проверки атлетики (бег от демонов)", "result": "переброс дал результат, которого хватило (17 против сложности 17)", "sec": 3919, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "reason_html": "<a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> потратил общую монету, чтобы помочь <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппу<\/a> с переброском проверки атлетики (бег от демонов)"}, {"t": "1:11:11", "kind": "earn", "who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "to": null, "reason": "получил (посмертно) монету за углублённую предысторию персонажа в момент драматичной гибели", "result": null, "sec": 4271, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "reason_html": "получил (посмертно) монету за углублённую предысторию персонажа в момент драматичной гибели"}, {"t": "1:15:25", "kind": "spend", "who": "Олег", "actor": "Зулькарнаев", "to": null, "reason": "потратил монету на переброс проверки обмана/харизмы — попытка вдохновить стихом демона на КПП", "result": "критическая неудача — демон пронзил его трезубцем насквозь", "sec": 4525, "who_url": "/c/oleg/", "reason_html": "потратил монету на переброс проверки обмана/харизмы — попытка вдохновить стихом демона на КПП"}, {"t": "1:26:25", "kind": "spend", "who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "to": null, "reason": "потратил две монеты подряд на переброс/бонус к проверке выносливости (сложность 21), пытаясь вырваться из хватки пятерых демонов", "result": "не помогло — демоны не отпустили, Кряхтун погиб", "sec": 5185, "who_url": "/c/paladin-krihta/", "reason_html": "потратил две монеты подряд на переброс/бонус к проверке выносливости (сложность 21), пытаясь вырваться из хватки пятерых демонов"}, {"t": "1:29:36", "kind": "earn", "who": "Снежана", "actor": "Чепурченко", "to": null, "reason": "получила монету за то, что первой поняла, чем питается демоническое оружие «Гретта» (людьми)", "result": null, "sec": 5376, "who_url": "/c/snezhana/", "reason_html": "получила монету за то, что первой поняла, чем питается демоническое оружие «Гретта» (людьми)"}, {"t": "1:39:16", "kind": "spend", "who": "Лев", "actor": "Чепурченко", "to": null, "reason": "потратил три монеты подряд (все оставшиеся) на переброс проверки магии (нужно 15+, сложность 17), чтобы забросить зажжённый динамит в пасть демонической пушки", "result": "итог 16 — не хватило против брони 17, но динамит подхватили и закинули вручную в тот же ход, пушка уничтожена", "sec": 5956, "who_url": "/c/lev/", "reason_html": "потратил три монеты подряд (все оставшиеся) на переброс проверки магии (нужно 15+, сложность 17), чтобы забросить зажжённый динамит в пасть демонической пушки"}, {"t": "1:45:52", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили два d6 (для двух новых персонажей), чтобы определить прибавку монет к призовому фонду — итог 60 000 руб.", "result": null, "sec": 6352, "who_url": null, "reason_html": "в конце выпуска бросили два d6 (для двух новых персонажей), чтобы определить прибавку монет к призовому фонду — итог 60 000 руб."}], "totals": [{"who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "earned": 2, "spent": 2, "img": "img/chars/kryahtun.webp", "who_url": "/c/paladin-krihta/", "actor_url": "/p/aleksandr-pal/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "earned": 2, "spent": 1, "img": null, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "actor_url": "/p/chepurchenko/"}, {"who": "Снежана", "actor": "Чепурченко", "earned": 1, "spent": 0, "img": null, "who_url": "/c/snezhana/", "actor_url": "/p/chepurchenko/"}, {"who": "Олег", "actor": "Зулькарнаев", "earned": 0, "spent": 1, "img": null, "who_url": "/c/oleg/", "actor_url": "/p/zulkarnaev/"}, {"who": "Лев", "actor": "Чепурченко", "earned": 0, "spent": 3, "img": null, "who_url": "/c/lev/", "actor_url": "/p/chepurchenko/"}], "notes": "Выпуск построен вокруг гибнущих один за другим «добровольцев» (актёры Чепурченко, Зулькарнаев и BRB играют по несколько недолговечных персонажей), из-за чего для части эпизодов конкретный получатель монеты не установим по фрагменту. Несколько монет потратили безрезультатно на почти безнадёжные броски перед гибелью персонажей."}, "cast": [{"name": "Юлиан", "actor": "Александр Гудко
