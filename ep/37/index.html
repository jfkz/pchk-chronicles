<script>window.EPD = {"anim": false, "key": "37", "label": "37", "title": "Добровольцы", "date": "2025-04-14", "minutes": 107, "duration": 6407.0, "video_id": "9TmL8N5ZGFo", "branch": "Фронт", "branch_color": "#3E9A5E", "place": "Река Розалия у городка Фельткерн, тыл демонов, Туманный холм", "short_html": "Отряд добровольцев отправляют на Туманный холм уничтожить дальнобойное оружие адской армии.", "summary_html": "После срыва планов <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> адская армия Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> наступает на столицу, но королевские войска сдерживают её на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a> с помощью «райских елей». Отряд добровольцев — два самопровозглашённых «командира», громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a>, плюс сменяющиеся простолюдины (новая механика: у рядовых запасные карточки, погибшие не воскрешаются) — отправляется в тыл демонов на Туманный холм, чтобы уничтожить дальнобойное оружие, угрожающее мосту у городка Фельткерн. Почти все рядовые гибнут один за другим, Кряхтуна захватывают и скармливают оружию — гигантскому демону-пушке Грете, питающейся людьми. В последний момент Кряхтун подрывает Грету динамитом изнутри, погибая сам. Выжившие — Юлиан, <a class=\"ref\" href=\"/c/snezhana/\">Снежана<\/a>, <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a> и моряк <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> — побеждают, но дымовая шашка для вызова гномского дирижабля утонула в самом начале, и их эвакуация под вопросом.", "outcome_html": "Грета уничтожена, мост у Фельткерна спасён; <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и почти все рядовые погибли, выжили <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/snezhana/\">Снежана<\/a>, <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a> и <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a>, но их эвакуация под вопросом.", "world_html": ["Адская армия наступает на столицу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>, фронт остановлен на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a>", "На переправах люди используют райские ели против демонов<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Райские ели растут в Чудной Долине\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Райские ели растут в Чудной Долине<\/b> Райские ели, упоминавшиеся в выпуске 15 и в «Добровольцах» (вып. 37) как оружие божественного света против демонов, добывают в Чудной Долине; за ними туда спускаются, спрос на них большой, и тот, кто владеет этим ресурсом, может склонить чашу весов в войне. Ели должны были стоять на фоне по пути к ванне, но общий план вырезали. Новогодние ёлки — это другое. Авторы допустили, что тема долины не раскрыта и в неё можно вернуться, в том числе в ПЧК Онлайн. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4795\" target=\"_blank\" rel=\"noopener\">1:19:55 ↗<\/a> · <a href=\"#qa41-42-22\">к записи<\/a><\/span><\/span>", "Демоническое дальнобойное оружие Грета у Фельткерна уничтожено<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Наступлению помогли и Добровольцы из выпуска 37\">6<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Наступлению помогли и Добровольцы из выпуска 37<\/b> Блокада Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — итог не одного выпуска: учитывается и уничтожение демонической пушки Греты в выпуске 37, и работа множества других отрядов добровольцев, сражающихся с адскими силами. <span class=\"note\">Подкаст по #47 · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 ↗<\/a> · <a href=\"#qa47-26\">к записи<\/a><\/span><\/span>", "Паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун (Кряхтун)<\/a> погиб"], "scenes": [{"t": "0:01:14", "sec": 74, "html": "Предыстория: президент <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обещал Тёмному Властелину божественного потомка, но план сорван дважды — «древолюд уничтожил <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a>», а «бес-предатель убил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>». Адская армия пошла на столицу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>."}, {"t": "0:03:49", "sec": 229, "html": "Завязка: королевские войска остановили демонов на реке <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a>; на переправах стоят «райские ели», испепеляющие нечисть божественным светом. Демоны установили на Туманном холме (40 км южнее Фельткерна) оружие, способное уничтожить райскую ель. Задача добровольцев — уничтожить его.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Райские ели растут в Чудной Долине\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Райские ели растут в Чудной Долине<\/b> Райские ели, упоминавшиеся в выпуске 15 и в «Добровольцах» (вып. 37) как оружие божественного света против демонов, добывают в Чудной Долине; за ними туда спускаются, спрос на них большой, и тот, кто владеет этим ресурсом, может склонить чашу весов в войне. Ели должны были стоять на фоне по пути к ванне, но общий план вырезали. Новогодние ёлки — это другое. Авторы допустили, что тема долины не раскрыта и в неё можно вернуться, в том числе в ПЧК Онлайн. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4795\" target=\"_blank\" rel=\"noopener\">1:19:55 ↗<\/a> · <a href=\"#qa41-42-22\">к записи<\/a><\/span><\/span>"}, {"t": "0:04:59", "sec": 299, "html": "Представление: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (из семьи бывших каннибалов, Отряд Солнца; прошёл экспресс-курс жрецов — святая вода, свадьбы, освящение повозок; «назначен командиром»), паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> (тоже «командир»; мечтает покорить сестру Юлиана <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a>), пасечник <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a>, пастух <a class=\"ref\" href=\"/c/ignat/\">Игнат<\/a> с колли Бимом, могильщик <a class=\"ref\" href=\"/c/antoshka/\">Антошка<\/a> (несёт дымовую шашку для вызова гномского дирижабля)."}, {"t": "0:13:01", "sec": 781, "html": "Переправа на бычьих пузырях: <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> ради шутки протыкает пузырь <a class=\"ref\" href=\"/c/antoshka/\">Антошки<\/a>, шум привлекает гигантского спрута — Антошку утаскивает под воду вместе с дымовой шашкой. Вводится механика запасных персонажей.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Новая механика — в #37, снятом под номером 38\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Новая механика — в #37, снятом под номером 38<\/b> Новая механика, о которой Селезнёв говорил в прошлом подкасте, относится не к #36, а к #37. Его снимали вечерним мотором под номером 38 (Слава <a class=\"ref\" href=\"/p/chepurchenko/\">Чепурченко<\/a>, <a class=\"ref\" href=\"/p/aleksandr-pal/\">Александр Паль<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>, <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, Лев <a class=\"ref\" href=\"/p/zulkarnaev/\">Зулькарнаев<\/a>); порядок выпусков при съёмке и при публикации менялся. Чепурченко после игры сказал, что хочет ещё раз сыграть так же. <span class=\"note\">Подкаст по #36 · <a href=\"https://youtu.be/oEqxCRDdITw?t=1968\" target=\"_blank\" rel=\"noopener\">0:32:48 ↗<\/a> · <a href=\"#qa36-13\">к записи<\/a><\/span><\/span>"}, {"t": "0:18:39", "sec": 1119, "html": "<a class=\"ref\" href=\"/c/ignat/\">Игнат<\/a> оттолкнулся от <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуна<\/a> и отправил его обратно к спруту; <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> отвлекает спрута банкой мёда. На берегу находят полурослика-оруженосца <a class=\"ref\" href=\"/c/fyodor-dvenyatin/\">Фёдора Двенятина<\/a> — выжившего из десятого (предыдущего) отряда; он помнит вспышку и адский патруль на машине."}, {"t": "0:21:47", "sec": 1307, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> делает святую воду. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> призывает пони (одноразово), по нему отряд забирается на обрыв, а сам паладин уносится вдоль берега «в гармонии с природой»."}, {"t": "0:29:07", "sec": 1747, "html": "Адский патруль из четырёх демонов: <a class=\"ref\" href=\"/c/ignat/\">Игнат<\/a> пытается разжалобить их историей про Бима и погибает от огненного снаряда. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> поливает демонов святой водой, <a class=\"ref\" href=\"/c/fyodor/\">Фёдор<\/a> атакует секирой Юлиана, но его разрывают пополам; «Слово солнца» Юлиана убивает двоих, <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> добивает демона вилами, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> возвращается и метает меч в последнего."}, {"t": "0:41:55", "sec": 2515, "html": "В багажнике адской машины — пленники: укротитель Лев (его цирк сожрали бесы) и торговец Олег, работавший на демонов и знающий инфернальный язык. Олег забирает пропуска демонов (Боб, <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a>, <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, Бальтазар младший); Лев свистком берёт себе Бима. Олег садится за руль, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> — за гарпун."}, {"t": "0:50:54", "sec": 3054, "html": "Пугало в кукурузном поле оказывается замученным пленником: у него зелья и карта минных полей у подножия холма. Засада бесов — Льву взрывает голову. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> гарпуном цепляет беса, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> по случайности тоже висит на гарпуне и добивает беса."}, {"t": "0:58:47", "sec": 3527, "html": "У просеки перед укреплениями к отряду выходит менестрель Стас Бердюшкин (его зовут «<a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> Бедро»), сосланный в добровольцы за куплет про короля. <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> предлагает запустить его на гарпуне как приманку; менестреля простреливают в колено."}, {"t": "1:08:58", "sec": 4138, "html": "<a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> гарпуном перебрасывают через ворота КПП — демоны сбегаются и разрывают его. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> и Бим уходят в лес, где находят полуэльфийку <a class=\"ref\" href=\"/c/snezhana/\">Снежану<\/a>: её друзей-древолюдов распилили на забор, и она знает дыру в нём."}, {"t": "1:13:16", "sec": 4396, "html": "Олег и <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> едут на КПП с пропусками; вдохновляющий стих «Умом Россию не понять» не помогает — демон пронзает Олега трезубцем. Кряхтун «Карой света» разрубает демона и бежит, но крылатый демон и пятеро других скручивают его и везут «на корм Грете»."}, {"t": "1:18:22", "sec": 4702, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> посылает Бима за <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a>. К отряду присоединяется <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a>, ученица волшебника, сбежавшая от учителя, который хотел принести её в жертву демонам. Юлиан венчает <a class=\"ref\" href=\"/c/bithoven/\">Битховена<\/a> и Айсидору (бонус к броне и проверкам)."}, {"t": "1:22:55", "sec": 4975, "html": "Отряд проходит через дыру в заборе, по карте обходит минное поле и поднимается на Туманный холм — к площадке разгрузки, где кран поднимает клетки с людьми. Разгадка: оружие — огромный демон Грета, заряжающийся людской плотью."}, {"t": "1:30:42", "sec": 5442, "html": "У <a class=\"ref\" href=\"/c/aysidora/\">Айсидоры<\/a> — связка динамита. Демоны подвешивают <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуна<\/a> на крюк и спускают на «адское блюдце». <a class=\"ref\" href=\"/c/bithoven/\">Битховен<\/a> атакует демона вилами, промахивается и погибает."}, {"t": "1:33:56", "sec": 5636, "html": "На блюдце с <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуном<\/a> — дворфиха-аптекарь <a class=\"ref\" href=\"/c/finis/\">Финис<\/a>, притворившаяся пленницей; она бросается на Грету (шестиногое хитиновое чудовище с двуствольной пушкой на спине) и её съедают."}, {"t": "1:36:40", "sec": 5800, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> подсаживает <a class=\"ref\" href=\"/c/aysidora/\">Айсидору<\/a> на вершину, она волшебной рукой бросает зажжённый динамит, Грета отбивает его. <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> ловит динамит, Грета глотает паладина — и взрывается изнутри."}, {"t": "1:42:10", "sec": 6130, "html": "Грета уничтожена, отряд залит чёрной жижей. Выясняется, что сообщить об успехе нечем — шашка утонула с <a class=\"ref\" href=\"/c/antoshka/\">Антошкой<\/a>. Новый рядовой, полурослик-моряк <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a>, отправляет Бима с запиской «Монстр побеждён, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> сожран, все остальные счастливы»."}, {"t": "1:44:25", "sec": 6265, "html": "Победа: выжившие (<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/aysidora/\">Айсидора<\/a>, <a class=\"ref\" href=\"/c/snezhana/\">Снежана<\/a>, <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a>) получают уровень и становятся героями; Паль в конце тянет карточку антропоморфного гриба <a class=\"ref\" href=\"/c/gogen/\">Гогена<\/a>. 60 000 руб. на благотворительность. Эвакуация — в будущих выпусках."}], "key_events": [{"t": "0:03:49", "sec": 229}, {"t": "0:15:09", "sec": 909}, {"t": "0:31:33", "sec": 1893}, {"t": "0:43:53", "sec": 2633}, {"t": "0:51:52", "sec": 3112}, {"t": "1:09:44", "sec": 4184}, {"t": "1:15:40", "sec": 4540}, {"t": "1:21:20", "sec": 4880}, {"t": "1:28:50", "sec": 5330}, {"t": "1:42:10", "sec": 6130}], "coins": {"ep": "37", "events": [{"t": "0:32:03", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета за придуманную историю про пса Бима, которой отвлекли демонов; из фрагмента не ясно, кто из добровольцев её рассказал", "result": null, "sec": 1923, "who_url": null, "reason_html": "монета за придуманную историю про пса Бима, которой отвлекли демонов; из фрагмента не ясно, кто из добровольцев её рассказал"}, {"t": "0:41:00", "kind": "earn", "who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "to": null, "reason": "монету дали не за красоту прыжка с пони на воткнутый меч, а просто за то, что группа наконец забралась на обрыв", "result": null, "sec": 2460, "who_url": "/c/paladin-krihta/", "reason_html": "монету дали не за красоту прыжка с пони на воткнутый меч, а просто за то, что группа наконец забралась на обрыв"}, {"t": "0:49:35", "kind": "earn", "who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "to": null, "reason": "получил монету «за конструктив» — придумал стрелять по воронам-разведчикам с брони машины", "result": null, "sec": 2975, "who_url": "/c/paladin-krihta/", "reason_html": "получил монету «за конструктив» — придумал стрелять по воронам-разведчикам с брони машины"}, {"t": "0:51:42", "kind": "loot", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "обыскал повешенного пленника и нашёл два зелья лечения, свиток-карту и одну золотую монету", "result": null, "sec": 3102, "who_url": "/c/yulian/", "reason_html": "обыскал повешенного пленника и нашёл два зелья лечения, свиток-карту и одну золотую монету"}, {"t": "0:51:46", "kind": "earn", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "получил монету за критический успех проверки внимательности при обыске тела", "result": null, "sec": 3106, "who_url": "/c/yulian/", "reason_html": "получил монету за критический успех проверки внимательности при обыске тела"}, {"t": "1:00:24", "kind": "earn", "who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "to": null, "reason": "получил монету за яркую предысторию нового персонажа-менестреля", "result": null, "sec": 3624, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "reason_html": "получил монету за яркую предысторию нового персонажа-менестреля"}, {"t": "1:05:19", "kind": "spend", "who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "to": null, "reason": "Кряхтун потратил общую монету, чтобы помочь Филиппу с переброском проверки атлетики (бег от демонов)", "result": "переброс дал результат, которого хватило (17 против сложности 17)", "sec": 3919, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "reason_html": "<a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> потратил общую монету, чтобы помочь <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппу<\/a> с переброском проверки атлетики (бег от демонов)"}, {"t": "1:11:11", "kind": "earn", "who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "to": null, "reason": "получил (посмертно) монету за углублённую предысторию персонажа в момент драматичной гибели", "result": null, "sec": 4271, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "reason_html": "получил (посмертно) монету за углублённую предысторию персонажа в момент драматичной гибели"}, {"t": "1:15:25", "kind": "spend", "who": "Олег", "actor": "Зулькарнаев", "to": null, "reason": "потратил монету на переброс проверки обмана/харизмы — попытка вдохновить стихом демона на КПП", "result": "критическая неудача — демон пронзил его трезубцем насквозь", "sec": 4525, "who_url": "/c/oleg/", "reason_html": "потратил монету на переброс проверки обмана/харизмы — попытка вдохновить стихом демона на КПП"}, {"t": "1:26:25", "kind": "spend", "who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "to": null, "reason": "потратил две монеты подряд на переброс/бонус к проверке выносливости (сложность 21), пытаясь вырваться из хватки пятерых демонов", "result": "не помогло — демоны не отпустили, Кряхтун погиб", "sec": 5185, "who_url": "/c/paladin-krihta/", "reason_html": "потратил две монеты подряд на переброс/бонус к проверке выносливости (сложность 21), пытаясь вырваться из хватки пятерых демонов"}, {"t": "1:29:36", "kind": "earn", "who": "Снежана", "actor": "Чепурченко", "to": null, "reason": "получила монету за то, что первой поняла, чем питается демоническое оружие «Гретта» (людьми)", "result": null, "sec": 5376, "who_url": "/c/snezhana/", "reason_html": "получила монету за то, что первой поняла, чем питается демоническое оружие «Гретта» (людьми)"}, {"t": "1:39:16", "kind": "spend", "who": "Лев", "actor": "Чепурченко", "to": null, "reason": "потратил три монеты подряд (все оставшиеся) на переброс проверки магии (нужно 15+, сложность 17), чтобы забросить зажжённый динамит в пасть демонической пушки", "result": "итог 16 — не хватило против брони 17, но динамит подхватили и закинули вручную в тот же ход, пушка уничтожена", "sec": 5956, "who_url": "/c/lev/", "reason_html": "потратил три монеты подряд (все оставшиеся) на переброс проверки магии (нужно 15+, сложность 17), чтобы забросить зажжённый динамит в пасть демонической пушки"}, {"t": "1:45:52", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили два d6 (для двух новых персонажей), чтобы определить прибавку монет к призовому фонду — итог 60 000 руб.", "result": null, "sec": 6352, "who_url": null, "reason_html": "в конце выпуска бросили два d6 (для двух новых персонажей), чтобы определить прибавку монет к призовому фонду — итог 60 000 руб."}], "totals": [{"who": "Кряхтун (паладин Кряхтун)", "actor": "Паль", "earned": 2, "spent": 2, "img": "img/chars/kryahtun.webp", "who_url": "/c/paladin-krihta/", "actor_url": "/p/aleksandr-pal/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "earned": 2, "spent": 1, "img": null, "who_url": "/c/stas-berdyushkin-filipp-bedro/", "actor_url": "/p/chepurchenko/"}, {"who": "Снежана", "actor": "Чепурченко", "earned": 1, "spent": 0, "img": null, "who_url": "/c/snezhana/", "actor_url": "/p/chepurchenko/"}, {"who": "Олег", "actor": "Зулькарнаев", "earned": 0, "spent": 1, "img": null, "who_url": "/c/oleg/", "actor_url": "/p/zulkarnaev/"}, {"who": "Лев", "actor": "Чепурченко", "earned": 0, "spent": 3, "img": null, "who_url": "/c/lev/", "actor_url": "/p/chepurchenko/"}], "notes": "Выпуск построен вокруг гибнущих один за другим «добровольцев» (актёры Чепурченко, Зулькарнаев и BRB играют по несколько недолговечных персонажей), из-за чего для части эпизодов конкретный получатель монеты не установим по фрагменту. Несколько монет потратили безрезультатно на почти безнадёжные броски перед гибелью персонажей."}, "cast": [{"name": "Юлиан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "человек, громила, жрец-недоучка", "role": "", "fate": "выжил", "id": "Юлиан", "url": "/c/yulian/", "img": "img/chars/yulian.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Кряхтун", "actor": "Александр Паль", "actor_url": "/p/aleksandr-pal/", "race": "человек, паладин света", "role": "", "fate": "погиб (сожран Гретой, взорвал её изнутри)", "id": "Крихта", "url": "/c/paladin-krihta/", "img": "img/chars/kryahtun.webp", "other": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}]}, {"name": "Гоген", "actor": "Александр Паль", "actor_url": "/p/aleksandr-pal/", "race": "антропоморфный гриб", "role": "", "fate": "выжил (введён в финале)", "id": "Гоген", "url": "/c/gogen/", "img": null, "other": []}, {"name": "Битховен", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, пасечник", "role": "", "fate": "погиб", "id": "Битховен", "url": "/c/bithoven/", "img": null, "other": []}, {"name": "Финис", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "дворфиха, аптекарь", "role": "", "fate": "погибла (съедена Гретой)", "id": "Финис", "url": "/c/finis/", "img": null, "other": []}, {"name": "Федук", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "полурослик, моряк", "role": "", "fate": "выжил", "id": "Федук", "url": "/c/fiduk/", "img": null, "other": [{"key": "43", "label": "43", "title": "Груз Кристиночки"}]}, {"name": "Игнат", "actor": "Чепурченко", "actor_url": "/p/chepurchenko/", "race": "человек, пастух", "role": "", "fate": "погиб", "id": "Игнат", "url": "/c/ignat/", "img": null, "other": []}, {"name": "Лев", "actor": "Чепурченко", "actor_url": "/p/chepurchenko/", "race": "человек, укротитель зверей", "role": "", "fate": "погиб", "id": "Лев", "url": "/c/lev/", "img": null, "other": []}, {"name": "Стас Бердюшкин «Филипп Бедро»", "actor": "Чепурченко", "actor_url": "/p/chepurchenko/", "race": "человек, менестрель", "role": "", "fate": "погиб", "id": "Стас Бердюшкин «Филипп Бедро»", "url": "/c/stas-berdyushkin-filipp-bedro/", "img": null, "other": []}, {"name": "Снежана", "actor": "Чепурченко", "actor_url": "/p/chepurchenko/", "race": "полуэльфийка, лесничая", "role": "", "fate": " ся)", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}], "links": [{"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — президент <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> (введённая им демократия)", "dir": "out", "color": "#C8423B"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, его сестра <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> (Паль) — персонажи ветви <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "Гибель <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция Палена<\/a> на «Рыжем петухе»", "dir": "out", "color": "#C8423B"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка", "note_html": "Паль уже играл паладина <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтуна<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> убил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> — договорённость <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a> сорвана", "dir": "out", "color": "#C8423B"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "<a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> и отряд добровольцев, уничтоживший демоническое оружие", "dir": "back", "color": "#B8901C"}], "quotes_html": ["«Говорят, до нас было 10 попыток, и все погибали. Но наша вылазка будет точно удачной, потому что после одиннадцати дальше цифр нету». — <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>", "«<a class=\"ref\" href=\"/c/antoshka/\">Антошка<\/a>, я же пошутил». — <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a>", "«Умом Россию не понять…» — «вдохновляющий» стих на КПП", "«Ты, паладин, станешь отличной зарядкой для моего оружия». — «Соси мой длинный меч».", "«Монстр побеждён, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> сожран, все остальные счастливы». — записка <a class=\"ref\" href=\"/c/fiduk/\">Федука<\/a>"], "places_html": "<ul>\n<li>Места: река <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a> (линия фронта на великой равнине); городок Фельткерн и мост; Туманный холм с укреплениями, КПП, площадкой разгрузки и «адским блюдцем»; кукурузное поле с пугалом; минное поле у подножия холма; упоминается городок Сидора (родина <a class=\"ref\" href=\"/c/aysidora/\">Айсидоры<\/a>).<\/li>\n<li>Фракции: королевские войска <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> и добровольцы; адская армия Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>; Отряд Солнца (семья <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>); гномы (дирижабль подкрепления).<\/li>\n<li>Артефакты: райские ели (оружие божественного света на переправах); дымовая шашка вызова гномского дирижабля (утонула); адская машина с гарпуном (угнана); металлические пропуска демонов; карта минных полей; святая вода <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>; свиток призыва пони; связка динамита; сборник героических стихов.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>6<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>6<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>2<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>1<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa36-13\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Новая механика — в #37, снятом под номером 38<\/b><\/div><p>Новая механика, о которой Селезнёв говорил в прошлом подкасте, относится не к #36, а к #37. Его снимали вечерним мотором под номером 38 (Слава <a class=\"ref\" href=\"/p/chepurchenko/\">Чепурченко<\/a>, <a class=\"ref\" href=\"/p/aleksandr-pal/\">Александр Паль<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>, <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, Лев <a class=\"ref\" href=\"/p/zulkarnaev/\">Зулькарнаев<\/a>); порядок выпусков при съёмке и при публикации менялся. Чепурченко после игры сказал, что хочет ещё раз сыграть так же.<\/p><blockquote>«Он у нас сейчас тридцать седьмой, но мы его снимали под номером 38. Это вечерний мотор»<\/blockquote><p class=\"note\"><a href=\"/pod/qa36/#qa36-13\">Подкаст по #36<\/a> · <a href=\"https://youtu.be/oEqxCRDdITw?t=1968\" target=\"_blank\" rel=\"noopener\">0:32:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa38-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндон строил замок Вёрджинвальда и привёз райскую ель<\/b><\/div><p>На фотографиях скрижали, которые в выпуске №27 рассматривали за кадром, видно, как <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> возводил укрепления в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a>: он был одним из строителей замка Вёрджинвальда и привёз туда райскую ель, уничтожившую демона в №15 (о райских елях говорилось в №37). Он защищал простых людей и служил им. Имя «Брэндон» — отсылка к «Беверли-Хиллз»: мажор, сын Верховного бога.<\/p><blockquote>«он был одним из тех, кто строил замок Вёрджинвальда, кто привёз туда райскую ель, которая уничтожила демонов в пятнадцатом выпуске»<\/blockquote><p class=\"note\"><a href=\"/pod/qa38/#qa38-21\">Подкаст по #38<\/a> · <a href=\"https://youtu.be/5X6L81ZpnSQ?t=5171\" target=\"_blank\" rel=\"noopener\">1:26:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a>, <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-22\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Райские ели растут в Чудной Долине<\/b><\/div><p>Райские ели, упоминавшиеся в выпуске 15 и в «Добровольцах» (вып. 37) как оружие божественного света против демонов, добывают в Чудной Долине; за ними туда спускаются, спрос на них большой, и тот, кто владеет этим ресурсом, может склонить чашу весов в войне. Ели должны были стоять на фоне по пути к ванне, но общий план вырезали. Новогодние ёлки — это другое. Авторы допустили, что тема долины не раскрыта и в неё можно вернуться, в том числе в ПЧК Онлайн.<\/p><blockquote>«Так вот, как раз эти райские ели добываются в этой Чудной Долине… и спрос на них сейчас очень большой.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-22\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=4795\" target=\"_blank\" rel=\"noopener\">1:19:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>План Сыроеги: эпидемия через игрушки в столице<\/b><\/div><p>Сыроега обосновалась в борделе, где останавливаются купцы и контрабандисты, и через очарованных узнавала, кто что везёт. Ценный груз она не крала, а начиняла спорами, чтобы его довезли до столицы: когда ребёнок дёрнет за ниточку и уродец скажет «Мама!», началась бы эпидемия. Это была диверсия демонов в тылу, в обход застывшего фронта (как в выпуске 37).<\/p><blockquote>«Когда Кристина их продаст, они разлетятся по рукам, потянут за ниточку, чтобы зубастый уродец сказал: «Мама!» И начнётся эпидемия.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-9\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=1783\" target=\"_blank\" rel=\"noopener\">0:29:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-11\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как устроен Чёрный Геленбург и мотивация Сфинктериона<\/b><\/div><p>Демонам в земном мире нужны пища и ресурсы для вторжения на небеса, поэтому люди работают на фабриках. Демоны не убивают людей просто так, а предлагают контракты за привилегии; это обычный тоталитарный режим. Жители <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — заложники обстоятельств, а <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выбирает меньшее зло: если не пустить демонов на небеса, пострадают <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>, столица и весь мир. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признал, что сам представлял положение людей лучше, чем увидел.<\/p><blockquote>«Жители Геленбурга в некотором смысле — жертва, заложники обстоятельств. Это меньшее зло — это как раз выбор сильного лидера.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-11\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1856\" target=\"_blank\" rel=\"noopener\">0:30:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Наступлению помогли и Добровольцы из выпуска 37<\/b><\/div><p>Блокада Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — итог не одного выпуска: учитывается и уничтожение демонической пушки Греты в выпуске 37, и работа множества других отрядов добровольцев, сражающихся с адскими силами.<\/p><blockquote>«Не только последствия этого выпуска, но и последствия тридцать седьмого выпуска «Добровольцы», когда они уничтожили пушку.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-26\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><\/section>", "chars": {"Битховен": {"name": "Битховен", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": true, "race": "человек, пасечник", "portraits": [], "url": "/c/bithoven/", "eps": [{"key": "37", "label": "37", "title": "Добровольцы"}]}, "Юлиан": {"name": "Юлиан", "img": "img/chars/yulian.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%AE%D0%BB%D0%B8%D0%B0%D0%BD", "summary": "Юлиа́н Ле́ктор — громила из семьи каннибалов с уродливым шрамом на месте левого глаза. Брат Софии, шурин Эрика Пэнисова.", "infobox": {}, "actors": ["Александр Гудков"], "kind": "pc", "dead": false, "race": "человек, громила-проводник (сын паучихи)", "portraits": [], "url": "/c/yulian/", "eps": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, "Олег": {"name": "Олег", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Зулькарнаев"], "kind": "pc", "dead": true, "race": "человек, уличный торговец", "portraits": [], "u
