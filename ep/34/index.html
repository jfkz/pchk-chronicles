<script>window.EPD = {"key": "34", "label": "34", "title": "Пропавшая ёлочка", "date": "2024-12-30", "minutes": 99, "duration": 5913.0, "video_id": "CrT8bkdKWVU", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Кёнигпон в канун Нового года: лавка дриады, мебельная мастерская, университетский сквер", "short_html": "В канун Нового года у ведьмы <a class=\"ref\" href=\"/c/miramistina/\">Мирамистины<\/a> пропадает оживлённая ею ёлочка, и Отряд Солнца помогает её искать. На фоне погромов древолюдов герои спасают дриаду <a class=\"ref\" href=\"/c/kashtanya/\">Каштаню<\/a> от «Кожаных мстителей» и освобождают пленных древолюдов на мебельной мастерской. Оказывается, ёлочку (Элизабет) выкрали по просьбе возлюбленного дриады, чтобы вернуть родителям-древолюдам. Речь <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> мирит погромщиков с древолюдами, и все встречают Новый год вместе.", "summary_html": "Накануне Нового года ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> обнаруживает, что из её лаборатории пропала оживлённая ею ёлочка с разумом двухлетнего ребёнка, и просит подругу <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> и Отряд Солнца найти её. На фоне погромов после того, как древолюд на глазах гвардейцев растерзал ребёнка, герои спасают дриаду <a class=\"ref\" href=\"/c/kashtanya/\">Каштаню<\/a> от «Кожаных мстителей», а затем освобождают пленных древолюдов на мебельной мастерской «Мягкий стул», где их распиливают циркулярной пилой. Выясняется, что ёлочку (её настоящее имя — Элизабет) выкрал грибнид по просьбе профессора Мариэля, возлюбленного Каштани, чтобы вернуть её родителям-древолюдам. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> произносит речь о том, что люди каждый Новый год убивают «древесных детей», и мирит толпу погромщиков с древолюдами. Ёлочка остаётся с настоящими родителями, и все празднуют Новый год вместе.", "outcome_html": "Никто из героев не погиб; древолюды спасены, погромщики разошлись, ёлочка вернулась к родителям.", "world_html": ["Волна погромов древолюдов в столице после инцидента с <a class=\"ref\" href=\"/c/kudrigar/\">Кудригаром<\/a>", "Перемирие между жителями столицы и древолюдами в новогоднюю ночь", "Ёлочка-древолюд Элизабет возвращена родителям", "<a class=\"ref\" href=\"/c/kashtanya/\">Каштаня<\/a> обещает, что древолюды больше не будут убивать детей"], "scenes": [{"t": "0:01:11", "sec": 71, "html": "Пролог-скетч: отец Алиментий изгоняет демона из Эльзы, жены трубочиста Базиля, одержимой через магическую скрижаль (пародия на рекламу антивируса); из-за Чёрного Геленбурга развелось много нечисти. Отряд Солнца живёт в двух кварталах, но сейчас занят заданием."}, {"t": "0:05:31", "sec": 331, "html": "Пересказ года: адская армия вырвалась из Чёрного Геленбурга; древолюд <a class=\"ref\" href=\"/c/kudrigar/\">Кудригар<\/a> погубил невинное дитя при очевидцах; клан Балан истребил почти весь высший вампирский совет; Отряд Солнца (бывшие каннибалы) отобрал у <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> артефакт Душесос Дайсаул."}, {"t": "0:09:56", "sec": 596, "html": "Завязка: ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> выкопала в лесу ёлочку и ритуалом оживила её; ёлочка пропала из лаборатории. Мирамистина обращается к подруге-друидке <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и Отряду Солнца. Имя ёлочке дают на ходу — Хламидиана."}, {"t": "0:11:00", "sec": 660, "html": "Представление: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> мечтает сбежать от быта на самоубийственное задание; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> раскрашивает ёлочные игрушки по номерам (до 11); паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтун<\/a> готов терпеть тёмную ведьму, пока она на стороне добра; бобёр <a class=\"ref\" href=\"/c/kiryusha/\">Кирюша<\/a> — фамильяр, спасённый ведьмой от браконьеров."}, {"t": "0:17:26", "sec": 1046, "html": "Друиды ищут растения через дриад: герои идут в лавку «Дети <a class=\"ref\" href=\"/c/kashtanya/\">Каштани<\/a>», из которой растёт вечнозелёный каштан. Лавка «закрыта»; <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтун<\/a> читает Тютчева («Умом Россию не понять» — его единственный стих), бобёр прогрызает дверь."}, {"t": "0:22:42", "sec": 1362, "html": "Внутри дриаду <a class=\"ref\" href=\"/c/kashtanya/\">Каштаню<\/a> держат в заложниках погромщики. Один хватает <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> и приставляет ей к горлу топор; <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтун<\/a> вызывает его на дуэль, <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> валит его «ведьминым смехом», <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> берёт второго в захват."}, {"t": "0:32:08", "sec": 1928, "html": "Третий погромщик с зажигательной смесью объясняет: по городу идёт волна погромов — ходят слухи, что древолюд растерзал ребёнка на глазах гвардейцев («Денис и Стасик всё видели»); двор рекомендовал древолюдам не выходить. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> притворяется ненавистницей древолюдов и узнаёт, что пленных распиливают в мебельной мастерской «Мягкий стул»."}, {"t": "0:38:29", "sec": 2309, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> опутывает погромщика травами; <a class=\"ref\" href=\"/c/kashtanya/\">Каштаня<\/a> лианами убивает двух других (третьего оставляет «на сладкое»). Отряд погромщиков называет себя «Кожаные мстители». Каштаня заигрывает с <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтуном<\/a>, утверждает, что привязана к своему дереву и не может уйти."}, {"t": "0:40:37", "sec": 2437, "html": "<a class=\"ref\" href=\"/c/kashtanya/\">Каштаня<\/a> допрашивает <a class=\"ref\" href=\"/c/miramistina/\">Мирамистину<\/a>: ёлочку сделали древолюдом, повесили на неё «мамины игрушки»; дриада соглашается, что ёлочку, возможно, увезли на мастерскую."}, {"t": "0:47:56", "sec": 2876, "html": "У мастерской <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> запугивает охрану, стирает им память леденцами забвения и внушает ложные воспоминания. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> вырубает нанюхавшегося лаком мастера."}, {"t": "0:55:20", "sec": 3320, "html": "Цех распила: толпа бородатых мужиков требует казни, пленных древолюдов (пихту и др.) пускают по конвейеру к циркулярной пиле. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, показав символ Отряда Солнца, призывает остановиться и увеличивает бобра до гигантских размеров — толпа кричит «Царь-бобёр!»."}, {"t": "1:00:43", "sec": 3643, "html": "<a class=\"ref\" href=\"/c/kiryusha/\">Кирюша<\/a> (благодаря стиху <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтуна<\/a>) бобровой струёй смывает первую толпу; вторая с топорами нападает, чары увеличения спадают, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> уменьшает бобра, и его всё равно изрубают до 1 HP."}, {"t": "1:08:14", "sec": 4094, "html": "Бой: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> морозным лучом и ледяным осколком, <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтун<\/a> «Карой света» убивает пятерых; последний погромщик бежит. Древолюды освобождены."}, {"t": "1:13:41", "sec": 4421, "html": "Древолюды направляют героев к связанному грибниду в сборочном цехе. Очарованный печеньем, он признаётся: это он украл ёлочку, потому что профессор Мариэль сказал, что ведьма злая; ёлочку отвели к профессору в университетский сквер."}, {"t": "1:17:57", "sec": 4677, "html": "В сквере профессор играет с ёлочкой в снежки. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> швыряет под ноги дохлую мышь, <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтун<\/a> обнимает профессора. <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> пытается забрать ёлочку, но её останавливает <a class=\"ref\" href=\"/c/kashtanya/\">Каштаня<\/a>: ёлочку зовут Элизабет, она под защитой. Профессор — возлюбленный Каштани; её история про привязку к дереву была ложью, чтобы герои спасли древолюдов."}, {"t": "1:21:11", "sec": 4871, "html": "Ревнующий <a class=\"ref\" href=\"/c/paladin-krihta/\">Крихтун<\/a> бьёт «Карой света», профессор парирует. <a class=\"ref\" href=\"/c/kashtanya/\">Каштаня<\/a> опутывает <a class=\"ref\" href=\"/c/miramistina/\">Мирамистину<\/a> корнями и пробуждает парковые деревья. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> Душесосом высасывает душу профессора."}, {"t": "1:24:25", "sec": 5065, "html": "<a class=\"ref\" href=\"/c/kiryusha/\">Кирюша<\/a> догоняет ёлочку, и тут появляются её настоящие родители — две голубые ели-древолюды. Древолюды объясняют: разумными они становятся к 12 годам, а ведьма ускорила процесс зельями и травмировала пятилетнего ребёнка ради праздника."}, {"t": "1:26:32", "sec": 5192, "html": "В сквер врывается толпа «Кожаных мстителей» во главе со Стасиком и Денисом — подкачанными солдатами в латах, теми самыми «очевидцами»."}, {"t": "1:27:36", "sec": 5256, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> произносит речь: каждый Новый год люди убивают не своих, а древесных детей, наряжая их, — вот почему деревья против нас. Проверка убеждения сложности 24 успешна. Толпа признаёт: «А тупица-то прав» — и уходит жечь что-нибудь в порту."}, {"t": "1:30:49", "sec": 5449, "html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> предлагает семьям древолюдов вместе встречать праздники. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> возвращает душу профессору; <a class=\"ref\" href=\"/c/kashtanya/\">Каштаня<\/a> извиняется за обман ради спасения своей семьи-древолюдов и обещает, что древолюды больше не будут убивать детей (и скидку 50%). Все празднуют Новый год в сквере; древолюды угощают жареными бобрами. 140 000 руб. — на благотворительность."}, {"t": "1:36:01", "sec": 5761, "html": "Финальная песня «Песня зимних чудесов»."}], "key_events": [{"t": "0:09:56", "sec": 596}, {"t": "0:22:42", "sec": 1362}, {"t": "0:32:08", "sec": 1928}, {"t": "0:55:20", "sec": 3320}, {"t": "1:08:14", "sec": 4094}, {"t": "1:13:41", "sec": 4421}, {"t": "1:20:09", "sec": 4809}, {"t": "1:24:25", "sec": 5065}, {"t": "1:27:36", "sec": 5256}, {"t": "1:31:52", "sec": 5512}], "coins": {"ep": "34", "events": [{"t": "0:28:56", "kind": "earn", "who": "Кирюша", "actor": "Борис Зелигер", "to": null, "reason": "получил монету за помощь Мирамистине с подсчётами — она разбирается в числах только до девяти, а он «математик»", "result": null, "sec": 1736, "who_url": "/c/kiryusha/", "reason_html": "получил монету за помощь <a class=\"ref\" href=\"/c/miramistina/\">Мирамистине<\/a> с подсчётами — она разбирается в числах только до девяти, а он «математик»"}, {"t": "0:43:45", "kind": "loot", "who": "Юлиан", "actor": "BRB", "to": null, "reason": "нашёл в кассе лавки два золотых, забрал один, подменив его куском колбасы", "result": null, "sec": 2625, "who_url": "/c/yulian/", "reason_html": "нашёл в кассе лавки два золотых, забрал один, подменив его куском колбасы"}, {"t": "0:43:45", "kind": "earn", "who": "Юлиан", "actor": "BRB", "to": null, "reason": "получил монету за находчивую шутку — подмену украденной монеты куском колбасы", "result": null, "sec": 2625, "who_url": "/c/yulian/", "reason_html": "получил монету за находчивую шутку — подмену украденной монеты куском колбасы"}, {"t": "0:53:12", "kind": "spend", "who": "Кирюша", "actor": "Борис Зелигер", "to": null, "reason": "потратил монету на переброс проверки, чтобы поймать сбежавшего мастера-лакировщика", "result": "переброс дал 12 — мастера схватили и удержали", "sec": 3192, "who_url": "/c/kiryusha/", "reason_html": "потратил монету на переброс проверки, чтобы поймать сбежавшего мастера-лакировщика"}, {"t": "0:59:41", "kind": "spend", "who": "Кирюша", "actor": "Борис Зелигер", "to": null, "reason": "потратил монету на переброс проверки выносливости (сложность 18) при использовании бобровой струи, чтобы разогнать толпу лесорубов", "result": null, "sec": 3581, "who_url": "/c/kiryusha/", "reason_html": "потратил монету на переброс проверки выносливости (сложность 18) при использовании бобровой струи, чтобы разогнать толпу
