<script>window.EPD = {"anim": false, "key": "20", "label": "20", "title": "Вампирское возмездие", "date": "2023-08-25", "minutes": 120, "duration": 7181.0, "video_id": "bI4ELqJITzM", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Столица: бордель «Барсук», дом фамильяров на улице Похищения, 13; порт Южного острова и пароход «Баловень»", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, объявленный изгоями, ищет похищенную вампиршу <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a>.", "party_html": "Клан-изгой: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, вампир-рикша, вампир-жиголо, ведьма и шестнадцатилетний дампир.", "summary_html": "За убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> высший совет вампиров объявил клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> изгоями, а вампиршу <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> похитили прямо из борделя «Барсук», где она работала. Дан Балан, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, жиголо Антон, ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> и их сын-дампир Лука выясняют, что певица <a class=\"ref\" href=\"/c/elvira/\">Эльвира<\/a> и фамильяры из дома <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a> по приказу вампира <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитара Норда<\/a> увезли Иделаиду на пароход «Баловень». Герои догоняют судно на катамаране, освобождают пронзённую колом Иделаиду, отвергают предложение Димитара выдать Дан Балана на казнь, и Мирамистина взрывает котёл парохода — Димитар и его семья погибают. На рассвете уцелевшие плывут к городу; Лука и Дан Балан без сознания.", "outcome_html": "<a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> спасена, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> с семьёй погибли. Клан уцелел, но конфликт с советом вампиров не разрешён; Лука и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> без сознания.", "world_html": ["Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> объявлен советом вампиров изгоями", "Высший вампир <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> и его семья уничтожены", "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> сломал вековой запрет на вход вампиров без приглашения", "Пароход «Баловень» взорван"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Вступление: <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, получившие силы вампира и оборотня, отправились в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> на перерождение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>; Вампирбек защитил сирот-подростков и убил старшего вампира; Кукан Яка закрутил роман с болотной тварью; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> и Вампирбек вернулись в столицу (вып. 16)."}, {"t": "0:03:30", "sec": 210, "html": "Завязка: высший совет вампиров объявил клан изгоями и фактически приговорил к смерти; этой ночью пропала <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a>. Представление героев; «семейная фотография» Антона, <a class=\"ref\" href=\"/c/miramistina/\">Мирамистины<\/a> и Луки. Механика очков крови (1 — жертва жива, 2 — убита)."}, {"t": "0:12:05", "sec": 725, "html": "Бордель «Барсук», где <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> много лет работала в ночную смену. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> паркует рикшу за углом; эльф-вышибала не пускает Луку, но его пропускают после обмана («мне 43, меня заколдовали»)."}, {"t": "0:18:40", "sec": 1120, "html": "Бар: бармен Лисин требует плату за информацию. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> рассказывает анекдот про ограбление — полуорк-вышибала выводит его вместе с Антоном."}, {"t": "0:21:40", "sec": 1300, "html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> кормит Лисина печеньем очарования; в VIP-комнате он рассказывает: <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> позвали двое клиентов — один с бакенбардами, другой со сломанным носом; ковра в комнате нет. Мирамистина заставляет его лизнуть пол: на языке ворс ковра, толстые курчавые волосы и мёртвое семя. Берёт у Лисина золотую монету «до завтра»."}, {"t": "0:28:22", "sec": 1702, "html": "Лука «рофлит» официантку Инессу («Ты срака вурдалака»); с <a class=\"ref\" href=\"/c/dan-balan/\">Дан Баланом<\/a> идёт за ней на кухню."}, {"t": "0:30:35", "sec": 1835, "html": "На улице <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> кричит «у него пистолет!» — полуорки дерутся между собой. У рикши Вампира Бека сняли колёса — у него депрессия (помеха на проверки); Антон как «муж на час» мастерит колёса из крышек бочек."}, {"t": "0:40:54", "sec": 2454, "html": "На кухне обнаружены грязные колёса рикши. Охранники хватают <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> и Луку; Лука в «гормональной истерике» бьёт деревянными катанами, кусает и добивает охранника ножом; уносит колёса."}, {"t": "0:49:36", "sec": 2976, "html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> меняет облик на певицу <a class=\"ref\" href=\"/c/elvira/\">Эльвиру<\/a> и оспаривает у неё «авторство песни»; толпа не верит. Эльвира шепчет: «Была тут одна — тебя ждёт такая же судьба», и её выкидывают на улицу."}, {"t": "0:54:10", "sec": 3250, "html": "Во дворе извозчик <a class=\"ref\" href=\"/c/dzheyson/\">Джейсон<\/a> признаётся, что вчера отвёз двоих мужчин с ковром на улицу Похищения, 13. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> дважды промахивается укусом в дверь; Лука убивает Джейсона камнем из рогатки."}, {"t": "0:59:28", "sec": 3568, "html": "Улица Похищения, 13: <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> в облике <a class=\"ref\" href=\"/c/elvira/\">Эльвиры<\/a> (в наручниках и с вставной челюстью-кляпом) как «заложница». <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> выбивает дверь; хозяева — пожилые <a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a> (бакенбарды, пенсне) и его жена. Лука замечает, что Генрих косится на ковёр."}, {"t": "1:04:50", "sec": 3890, "html": "Вампиры не могут войти без приглашения; дампир Лука входит и хватает жену <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>. Из засады — фамильяры с бакенбардами (кинжал) и со сломанным носом (арбалет). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> роем челюстей заставляет Генриха «сказать» приглашение — вековой запрет сломан, вампиры входят."}, {"t": "1:14:27", "sec": 4467, "html": "Антон когтями разрывает шею фамильяру с бакенбардами (критический удар). <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> в облике <a class=\"ref\" href=\"/c/elvira/\">Эльвиры<\/a> приказывает сложить оружие — <a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a> («Эльвира, у нас же приказ!») останавливает бой: фамильяры должны доставить клан."}, {"t": "1:17:33", "sec": 4653, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> обещает фамильярам вампиризм, «оживляет» труп разговором с мёртвыми; вампиры выпивают фамильяров. <a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a> угрожает кинжалом Антону — Дан Балан рубит его огненным серебряным мечом Бегона (отнят у кузнеца Артемиса)."}, {"t": "1:23:08", "sec": 4988, "html": "Раненая жена <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a> выдаёт: парализованную <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> отвезли в порт Южного острова, пристань №5, — и сбегает в ночь. Находки: фото режиссёра <a class=\"ref\" href=\"/c/maykl-kou/\">Майкла Коу<\/a>, серьга Иделаиды в крови на ковре, записка «Доставить вампиров из клана Балан к пристани №5 в порту Южного острова» за подписью <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитара Норда<\/a>, две монеты."}, {"t": "1:25:40", "sec": 5140, "html": "Порт Южного острова: служащий Сашка в ночном окошке; пристань №5 пуста. В таверне «Рыба-пила» матросы рассказывают, что единственный паровой корабль «Баловень» (на китовом жире) уже отплыл. Лука покупает катамаран за эротическую карточку; прокатчик видел <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> на носу «Баловня»."}, {"t": "1:32:48", "sec": 5568, "html": "Двухпалубная яхта «Баловень»: <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> привязана к шесту с осиновым колом в груди. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сталкивает матроса в гребное колесо; Антон и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (летучими мышами) поднимают Иделаиду, но её держат цепи. Антон в машинном отделении выпивает кочегара."}, {"t": "1:40:12", "sec": 6012, "html": "Выходит высший вампир <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> — изо рта вылетает саранча (у Антона остаётся 1 хит). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> бьёт мечом Бегона (24 урона — двойной от серебра и огня), цепи срезаны, <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> бросают на катамаран."}, {"t": "1:47:25", "sec": 6445, "html": "Вампир рвёт Луку когтями — тот без сознания (спасброски от смерти). Димитар предлагает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> место в совете, но тот отказывается; жена Димитара <a class=\"ref\" href=\"/c/helga/\">Хельга<\/a> режет Дан Балана (20 урона), дети Димитара бьют кровавыми стрелами."}, {"t": "1:51:20", "sec": 6680, "html": "Димитар требует выдать <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> на сожжение на рассвете в обмен на свободу клана — Антон отказывается. <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> поворачивает вентиль котла невидимой рукой; катамаран тихо отплывает."}, {"t": "1:56:38", "sec": 6998, "html": "Котёл взрывается: Димитар, <a class=\"ref\" href=\"/c/helga/\">Хельга<\/a> и их дети погибают (30 урона). На рассвете <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> крутит педали, вампиры укрыты пледом и брезентом; Лука и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> без сознания. Монет не осталось, за победу — 3 монеты (30 000 руб. на благотворительность)."}], "key_events": [{"t": "0:03:30", "sec": 210}, {"t": "0:21:40", "sec": 1300}, {"t": "0:49:36", "sec": 2976}, {"t": "0:54:10", "sec": 3250}, {"t": "1:04:50", "sec": 3890}, {"t": "1:23:08", "sec": 4988}, {"t": "1:32:48", "sec": 5568}, {"t": "1:40:12", "sec": 6012}, {"t": "1:51:20", "sec": 6680}, {"t": "1:56:38", "sec": 6998}], "coins": {"ep": "20", "events": [{"t": "0:39:47", "kind": "loot", "who": "Мирамистина", "actor": "Складчикова", "to": null, "reason": "выпросила у NPC-бармена Лисина золотую монету в долг перед уходом (внутриигровые деньги, не механика)", "result": "монету дал, обещала вернуть завтра", "sec": 2387, "who_url": "/c/miramistina/", "reason_html": "выпросила у NPC-бармена Лисина золотую монету в долг перед уходом (внутриигровые деньги, не механика)"}, {"t": "0:51:02", "kind": "spend", "who": "Мирамистина", "actor": "Складчикова", "to": null, "reason": "отдала золотую монету, чтобы перебросить проверку в споре с певицей Эльвирой за авторство песни", "result": "переброс не помог, монету потратили впустую", "sec": 3062, "who_url": "/c/miramistina/", "reason_html": "отдала золотую монету, чтобы перебросить проверку в споре с певицей <a class=\"ref\" href=\"/c/elvira/\">Эльвирой<\/a> за авторство песни"}, {"t": "1:12:29", "kind": "earn", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "мастер выдал монету за находчивое использование способности «Рой челюстей» — направил одну челюсть в рот старику Генриху", "result": null, "sec": 4349, "who_url": "/c/dan-balan/", "reason_html": "мастер выдал монету за находчивое использование способности «Рой челюстей» — направил одну челюсть в рот старику <a class=\"ref\" href=\"/c/genrih/\">Генриху<\/a>"}, {"t": "1:18:02", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "отдал монету за дополнительный кубик к проверке Убеждения, уговаривая фамильяров с
