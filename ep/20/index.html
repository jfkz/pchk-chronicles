<script>window.EPD = {"anim": false, "key": "20", "label": "20", "title": "Вампирское возмездие", "date": "2023-08-25", "minutes": 120, "duration": 7181.0, "video_id": "bI4ELqJITzM", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Столица: бордель «Барсук», дом фамильяров на улице Похищения, 13; порт Южного острова и пароход «Баловень»", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, объявленный изгоями, ищет похищенную вампиршу <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a>.", "summary_html": "За убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> высший совет вампиров объявил клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> изгоями, а вампиршу <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> похитили прямо из борделя «Барсук», где она работала. Дан Балан, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>, жиголо Антон, ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> и их сын-дампир Лука выясняют, что певица <a class=\"ref\" href=\"/c/elvira/\">Эльвира<\/a> и фамильяры из дома <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a> по приказу вампира <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитара Норда<\/a> увезли Иделаиду на пароход «Баловень». Герои догоняют судно на катамаране, освобождают пронзённую колом Иделаиду, отвергают предложение Димитара выдать Дан Балана на казнь, и Мирамистина взрывает котёл парохода — Димитар и его семья погибают. На рассвете уцелевшие плывут к городу; Лука и Дан Балан без сознания.", "outcome_html": "<a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> спасена, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> с семьёй погибли. Клан уцелел, но конфликт с советом вампиров не разрешён; Лука и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> без сознания.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Спасброски от смерти на катамаране не нужны\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Спасброски от смерти на катамаране не нужны<\/b> После боя Лука и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> лежали без сознания, но их не стали «спасать» в кадре: ничто больше не мешало героям восстановить союзников, пока они плыли домой к гробам. Дом клана теперь отмечен на карте. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1535\" target=\"_blank\" rel=\"noopener\">0:25:35 ↗<\/a> · <a href=\"#qa20-15\">к записи<\/a><\/span><\/span>", "world_html": ["Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> объявлен советом вампиров изгоями<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как стать старейшиной вампиров\">27<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как стать старейшиной вампиров<\/b> Стать старейшиной (членом высшего совета) можно силой, купить место или жениться на члене совета — последнее авторы подали как подсказку <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a>. Наказание за убийство Димитара уже не наказание, а война: совет хочет смерти клана. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4682\" target=\"_blank\" rel=\"noopener\">1:18:02 ↗<\/a> · <a href=\"#qa20-35\">к записи<\/a><\/span><\/span>", "Высший вампир <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> и его семья уничтожены<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Высший совет вампиров: изначально 13 древних\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Высший совет вампиров: изначально 13 древних<\/b> Высший вампирский совет — «как ЦК КПСС»: изначально 13 древних вампиров. Убиты двое — граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> и <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a>; жена и сыновья Димитара были вампирами, но не членами совета. Остальные 11 членов пока неизвестны и ещё появятся — клан Балана не может спать спокойно. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep20.md у <a class=\"ref\" href=\"/c/helga/\">Хельги<\/a> и детей не уточнён статус — по словам авторов, они вампиры, но не члены высшего совета; высшим вампиром был только Димитар (сыновей было двое).<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1275\" target=\"_blank\" rel=\"noopener\">0:21:15 ↗<\/a> · <a href=\"#qa20-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Убийство второго высшего вампира — гражданская война\">10<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Убийство второго высшего вампира — гражданская война<\/b> За убийство одного высшего вампира полагается наказание, а убийство второго означает гражданскую войну среди вампиров, у которых появились идеологические расхождения. Последствия покажут в вампирском выпуске, снятом 6 сентября. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1443\" target=\"_blank\" rel=\"noopener\">0:24:03 ↗<\/a> · <a href=\"#qa20-14\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> сломал вековой запрет на вход вампиров без приглашения<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кто может пригласить вампира и что со взорванным домом\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кто может пригласить вампира и что со взорванным домом<\/b> Пригласить вампира может только хозяин жилища — ни <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a>, ни Лука не могли этого сделать. Если дом разрушен и перестал быть жильём, войти можно. В таверне «Весёлый утопец» вампиры могли входить в незанятые комнаты, но в арендованную — только по приглашению арендатора. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2700\" target=\"_blank\" rel=\"noopener\">0:45:00 ↗<\/a> · <a href=\"#qa20-24\">к записи<\/a><\/span><\/span>", "Пароход «Баловень» взорван<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Не взорвав «Баловень», герои получили бы корабль\">22<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Не взорвав «Баловень», герои получили бы корабль<\/b> Если бы герои уничтожили вампиров другим способом, не взрывая пароход, у клана остался бы самый быстрый корабль «Баловень». <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3319\" target=\"_blank\" rel=\"noopener\">0:55:19 ↗<\/a> · <a href=\"#qa20-28\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Вступление: <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, получившие силы вампира и оборотня, отправились в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> на перерождение графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>; Вампирбек защитил сирот-подростков и убил старшего вампира; Кукан Яка закрутил роман с болотной тварью; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> и Вампирбек вернулись в столицу (вып. 16)."}, {"t": "0:03:30", "sec": 210, "html": "Завязка: высший совет вампиров объявил клан изгоями и фактически приговорил к смерти; этой ночью пропала <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a>. Представление героев; «семейная фотография» Антона, <a class=\"ref\" href=\"/c/miramistina/\">Мирамистины<\/a> и Луки. Механика очков крови (1 — жертва жива, 2 — убита)."}, {"t": "0:12:05", "sec": 725, "html": "Бордель «Барсук», где <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> много лет работала в ночную смену. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> паркует рикшу за углом; эльф-вышибала не пускает Луку, но его пропускают после обмана («мне 43, меня заколдовали»)."}, {"t": "0:18:40", "sec": 1120, "html": "Бар: бармен Лиссин требует плату за информацию. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> рассказывает анекдот про ограбление — полуорк-вышибала выводит его вместе с Антоном.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Диана в «Барсуке» — пасхалка художниц к 8-му выпуску\">16<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Диана в «Барсуке» — пасхалка художниц к 8-му выпуску<\/b> Эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> из 8-го выпуска на иллюстрации бара «Барсук» — пасхалка от художниц: она «постоянно сидит в «Барсуке»» и, судя по всему, отошла от истории с крысой в штанах. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2307\" target=\"_blank\" rel=\"noopener\">0:38:27 ↗<\/a> · <a href=\"#qa20-22\">к записи<\/a><\/span><\/span>"}, {"t": "0:21:40", "sec": 1300, "html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> кормит Лиссина печеньем очарования; в VIP-комнате он рассказывает: <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> позвали двое клиентов — один с бакенбардами, другой со сломанным носом; ковра в комнате нет. Мирамистина заставляет его лизнуть пол: на языке ворс ковра, толстые курчавые волосы и мёртвое семя. Берёт у Лиссина золотую монету «до завтра».<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Все вампиры бесплодны\">29<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Все вампиры бесплодны<\/b> Мёртвое семя — свойство всех вампиров: они не могут размножаться. Антон уже был вампиром, когда познакомился с <a class=\"ref\" href=\"/c/miramistina/\">Мирамистиной<\/a>, и его семя «оживила» ведьма. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 ↗<\/a> · <a href=\"#qa20-37\">к записи<\/a><\/span><\/span>"}, {"t": "0:28:22", "sec": 1702, "html": "Лука «рофлит» официантку Инессу («Ты срака вурдалака»); с <a class=\"ref\" href=\"/c/dan-balan/\">Дан Баланом<\/a> идёт за ней на кухню."}, {"t": "0:30:35", "sec": 1835, "html": "На улице <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> кричит «у него пистолет!» — полуорки дерутся между собой. У рикши Вампира Бека сняли колёса — у него депрессия (помеха на проверки); Антон как «муж на час» мастерит колёса из крышек бочек."}, {"t": "0:40:54", "sec": 2454, "html": "На кухне обнаружены грязные колёса рикши. Охранники хватают <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> и Луку; Лука в «гормональной истерике» бьёт деревянными катанами, кусает и добивает охранника ножом; уносит колёса.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Деревянные катаны Луки — осиновые и могут обездвижить вампира\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Деревянные катаны Луки — осиновые и могут обездвижить вампира<\/b> По легенде мама разрешила Луке только деревянные катаны — он ещё ученик. Катаны осиновые, это было прямо написано в его карточке: ими как колом можно было парализовать обездвиженного или спящего вампира, даже высшего — одним ударом. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=834\" target=\"_blank\" rel=\"noopener\">0:13:54 ↗<\/a> · <a href=\"#qa20-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Колёса рикши украли ради наживы, убийство охранника не заметили\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Колёса рикши украли ради наживы, убийство охранника не заметили<\/b> Кража колёс — бизнес злачного заведения, которое создано вытягивать из посетителей деньги. Убийство охранника на кухне обошлось без последствий: остальные охранники были заняты (выводили <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, держали <a class=\"ref\" href=\"/c/miramistina/\">Мирамистину<\/a>), персонал испугался, а в таком месте убийства случаются постоянно. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3446\" target=\"_blank\" rel=\"noopener\">0:57:26 ↗<\/a> · <a href=\"#qa20-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Правило «слышит один — слышат все» и «мигрирующие» колёса\">24<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Правило «слышит один — слышат все» и «мигрирующие» колёса<\/b> С первых тестовых игр в шоу действует правило: что слышит один игрок, слышат все, если мастер не скажет обратного (как в 9-м выпуске, где <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварду<\/a> указали, что он не знает о приходе сына). Колёса рикши на самом деле лежали не на кухне, а в предбаннике за стеной; когда <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> вслух предположил, что они на кухне, их «переместили» — авторы называют это мигрирующими вещами. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep20.md колёса найдены «на кухне» — по сценарию они лежали в предбаннике за кухней и были перенесены на кухню по ходу игры.<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3596\" target=\"_blank\" rel=\"noopener\">0:59:56 ↗<\/a> · <a href=\"#qa20-30\">к записи<\/a><\/span><\/span>"}, {"t": "0:49:36", "sec": 2976, "html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> меняет облик на певицу <a class=\"ref\" href=\"/c/elvira/\">Эльвиру<\/a> и оспаривает у неё «авторство песни»; толпа не верит. Эльвира шепчет: «Была тут одна — тебя ждёт такая же судьба», и её выкидывают на улицу."}, {"t": "0:54:10", "sec": 3250, "html": "Во дворе извозчик <a class=\"ref\" href=\"/c/dzheyson/\">Джейсон<\/a> признаётся, что вчера отвёз двоих мужчин с ковром на улицу Похищения, 13. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> дважды промахивается укусом в дверь; Лука убивает Джейсона камнем из рогатки.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему харизма Луки разная\">31<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему харизма Луки разная<\/b> У Луки харизма −1 (с эльфом на входе), но при обмане извозчика модификатор был +2: к харизме добавляется навык обмана — подростки хорошо врут. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4819\" target=\"_blank\" rel=\"noopener\">1:20:19 ↗<\/a> · <a href=\"#qa20-39\">к записи<\/a><\/span><\/span>"}, {"t": "0:59:28", "sec": 3568, "html": "Улица Похищения, 13: <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> в облике <a class=\"ref\" href=\"/c/elvira/\">Эльвиры<\/a> (в наручниках и с вставной челюстью-кляпом) как «заложница». <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> выбивает дверь; хозяева — пожилые <a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a> (бакенбарды, пенсне) и его жена. Лука замечает, что Генрих косится на ковёр.<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Под ковром был тайник, а не проход в подвал\">2<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Под ковром был тайник, а не проход в подвал<\/b> По сценарию под ковром в доме фамильяров был люк-тайник (ящик под половицей) с заначкой и серебряными кинжалами. Бреганов на съёмке забыл это и описал целый проход в подземелье; сцена заняла много времени, и её вырезали из монтажа, тем более что клинки так и не пригодились. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=770\" target=\"_blank\" rel=\"noopener\">0:12:50 ↗<\/a> · <a href=\"#qa20-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Мастер не напомнил скованной ведьме про соматический компонент — ради драмы\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Мастер не напомнил скованной ведьме про соматический компонент — ради драмы<\/b> <a class=\"ref\" href=\"/c/miramistina/\">Мирамистине<\/a> в наручниках и с кляпом не напомнили, что для заклинания нужны свободные руки и рот (вербальный и соматический компоненты), сознательно: попытка колдовать и осознание, что она связана, были интереснее. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2992\" target=\"_blank\" rel=\"noopener\">0:49:52 ↗<\/a> · <a href=\"#qa20-25\">к записи<\/a><\/span><\/span>"}, {"t": "1:04:50", "sec": 3890, "html": "Вампиры не могут войти без приглашения; дампир Лука входит и хватает жену <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>. Из засады — фамильяры с бакенбардами (кинжал) и со сломанным носом (арбалет). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> роем челюстей заставляет Генриха «сказать» приглашение — вековой запрет сломан, вампиры входят.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как челюсть произнесла приглашение за Генриха\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как челюсть произнесла приглашение за Генриха<\/b> Челюсть <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> магическая: вместе с ней вылетают мышцы и связки до диафрагмы, и её сокращения заставляли рот и гортань жертвы произнести нужные слова. Заявку придумала команда, её одобрили зал и мастер; было две проверки подряд — ловкость (попасть в рот) и исполнение, обе пройдены. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=657\" target=\"_blank\" rel=\"noopener\">0:10:57 ↗<\/a> · <a href=\"#qa20-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Помеха на запугивание Генриха — из-за засады\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Помеха на запугивание Генриха — из-за засады<\/b> Лука, схвативший жену <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>, запугивал старика с помехой, потому что Генрих знал о спрятанных за его спиной, за диваном и на лестнице фамильярах, которых герои ещё не видели. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1213\" target=\"_blank\" rel=\"noopener\">0:20:13 ↗<\/a> · <a href=\"#qa20-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: Рой крыс Дан Балана заменён роем челюстей\">28<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>Рой крыс Дан Балана заменён роем челюстей<\/b> Особая способность <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> сменилась с роя крыс на рой челюстей, потому что <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> забыл свою основную способность; челюсти подошли лучше — у старика вставная челюсть и запасные в сумке. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 ↗<\/a> · <a href=\"#qa20-36\">к записи<\/a><\/span><\/span>"}, {"t": "1:14:27", "sec": 4467, "html": "Антон когтями разрывает шею фамильяру с бакенбардами (критический удар). <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> в облике <a class=\"ref\" href=\"/c/elvira/\">Эльвиры<\/a> приказывает сложить оружие — <a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a> («Эльвира, у нас же приказ!») останавливает бой: фамильяры должны доставить клан."}, {"t": "1:17:33", "sec": 4653, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> обещает фамильярам вампиризм, «оживляет» труп разговором с мёртвыми; вампиры выпивают фамильяров. <a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a> угрожает кинжалом Антону — Дан Балан рубит его огненным серебряным мечом Бегона (отнят у кузнеца Артемиса).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Фамильяров можно было сделать союзниками\">13<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Фамильяров можно было сделать союзниками<\/b> Мастер дал <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> бросок убеждения с преимуществом на обещание «все фамильяры могут стать вампирами» — фамильяров действительно убедили, и их можно было обратить и взять в союзники, но герои предпочли их выпить. NPC могут быть и противниками, и нейтралами, и союзниками. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1878\" target=\"_blank\" rel=\"noopener\">0:31:18 ↗<\/a> · <a href=\"#qa20-18\">к записи<\/a><\/span><\/span>"}, {"t": "1:23:08", "sec": 4988, "html": "Раненая жена <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a> выдаёт: парализованную <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> отвезли в порт Южного острова, пристань №5, — и сбегает в ночь. Находки: фото режиссёра <a class=\"ref\" href=\"/c/maykl-kou/\">Майкла Коу<\/a>, серьга Иделаиды в крови на ковре, записка «Доставить вампиров из клана Балан к пристани №5 в порту Южного острова» за подписью <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитара Норда<\/a>, две монеты."}, {"t": "1:25:40", "sec": 5140, "html": "Порт Южного острова: служащий Сашка в ночном окошке; пристань №5 пуста. В таверне «Рыба-пила» матросы рассказывают, что единственный паровой корабль «Баловень» (на китовом жире) уже отплыл. Лука покупает катамаран за эротическую карточку; прокатчик видел <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> на носу «Баловня».<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кто был на собрании преступной верхушки\">36<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кто был на собрании преступной верхушки<\/b> Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12). <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 ↗<\/a> · <a href=\"#qa29-21\">к записи<\/a><\/span><\/span>"}, {"t": "1:32:48", "sec": 5568, "html": "Двухпалубная яхта «Баловень»: <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> привязана к шесту с осиновым колом в груди. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сталкивает матроса в гребное колесо; Антон и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (летучими мышами) поднимают Иделаиду, но её держат цепи. Антон в машинном отделении выпивает кочегара."}, {"t": "1:40:12", "sec": 6012, "html": "Выходит высший вампир <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> — изо рта вылетает саранча (у Антона остаётся 1 хит). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> бьёт мечом Бегона (24 урона — двойной от серебра и огня), цепи срезаны, <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> бросают на катамаран.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Магический щит не спасает от роя саранчи\">32<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Магический щит не спасает от роя саранчи<\/b> Заклинание щита защищает только от атак ближнего и дальнего боя, а от роя саранчи Димитара спасает лишь спасбросок ловкости, поэтому <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> не могла от него закрыться. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4883\" target=\"_blank\" rel=\"noopener\">1:21:23 ↗<\/a> · <a href=\"#qa20-40\">к записи<\/a><\/span><\/span>"}, {"t": "1:47:25", "sec": 6445, "html": "Вампир рвёт Луку когтями — тот без сознания (спасброски от смерти). Димитар предлагает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> место в совете, но тот отказывается; жена Димитара <a class=\"ref\" href=\"/c/helga/\">Хельга<\/a> режет Дан Балана (20 урона), дети Димитара бьют кровавыми стрелами.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Что предлагал Димитар Дан Балану\">8<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Что предлагал Димитар Дан Балану<\/b> Димитар хотел, чтобы <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> подтвердил переход на сторону совета, отдав своих «детей» — <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, Антона, <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a>, ведьму — на сожжение солнцем; взамен Дан Балан занял бы в высшем совете место <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1355\" target=\"_blank\" rel=\"noopener\">0:22:35 ↗<\/a> · <a href=\"#qa20-12\">к записи<\/a><\/span><\/span>"}, {"t": "1:51:20", "sec": 6680, "html": "Димитар требует выдать <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> на сожжение на рассвете в обмен на свободу клана — Антон отказывается. <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> поворачивает вентиль котла невидимой рукой; катамаран тихо отплывает.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Димитар не полетел за катамараном\">20<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Димитар не полетел за катамараном<\/b> Димитар не знал о манипуляциях с топливом и котлом (<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> действовала невидимой рукой), а преследовать катамаран не было смысла: у его семьи были дальнобойные заклинания, которыми следующим ходом добили бы <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> и Антона и потопили лодку. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3057\" target=\"_blank\" rel=\"noopener\">0:50:57 ↗<\/a> · <a href=\"#qa20-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:56:38", "sec": 6998, "html": "Котёл взрывается: Димитар, <a class=\"ref\" href=\"/c/helga/\">Хельга<\/a> и их дети погибают (30 урона). На рассвете <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> крутит педали, вампиры укрыты пледом и брезентом; Лука и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> без сознания. Монет не осталось, за победу — 3 монеты (30 000 руб. на благотворительность)."}], "key_events": [{"t": "0:03:30", "sec": 210}, {"t": "0:21:40", "sec": 1300}, {"t": "0:49:36", "sec": 2976}, {"t": "0:54:10", "sec": 3250}, {"t": "1:04:50", "sec": 3890}, {"t": "1:23:08", "sec": 4988}, {"t": "1:32:48", "sec": 5568}, {"t": "1:40:12", "sec": 6012}, {"t": "1:51:20", "sec": 6680}, {"t": "1:56:38", "sec": 6998}], "coins": {"ep": "20", "events": [{"t": "0:39:47", "kind": "loot", "who": "Мирамистина", "actor": "Складчикова", "to": null, "reason": "выпросила у NPC-бармена Лиссина золотую монету в долг перед уходом (внутриигровые деньги, не механика)", "result": "монету дал, обещала вернуть завтра", "sec": 2387, "who_url": "/c/miramistina/", "reason_html": "выпросила у NPC-бармена Лиссина золотую монету в долг перед уходом (внутриигровые деньги, не механика)"}, {"t": "0:51:02", "kind": "spend", "who": "Мирамистина", "actor": "Складчикова", "to": null, "reason": "отдала золотую монету, чтобы перебросить проверку в споре с певицей Эльвирой за авторство песни", "result": "переброс не помог, монету потратили впустую", "sec": 3062, "who_url": "/c/miramistina/", "reason_html": "отдала золотую монету, чтобы перебросить проверку в споре с певицей <a class=\"ref\" href=\"/c/elvira/\">Эльвирой<\/a> за авторство песни"}, {"t": "1:12:29", "kind": "earn", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "мастер выдал монету за находчивое использование способности «Рой челюстей» — направил одну челюсть в рот старику Генриху", "result": null, "sec": 4349, "who_url": "/c/dan-balan/", "reason_html": "мастер выдал монету за находчивое использование способности «Рой челюстей» — направил одну челюсть в рот старику <a class=\"ref\" href=\"/c/genrih/\">Генриху<\/a>"}, {"t": "1:18:02", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "отдал монету за дополнительный кубик к проверке Убеждения, уговаривая фамильяров стать вампирами", "result": "успех (14), фамильярам понравилось предложение", "sec": 4682, "who_url": "/c/dan-balan/", "reason_html": "отдал монету за дополнительный кубик к проверке Убеждения, уговаривая фамильяров стать вампирами"}, {"t": "1:22:02", "kind": "other", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "хотели потратить монету на атаку по Генриху, но монет больше не осталось", "result": "переброса не было, атака прошла обычным броском", "sec": 4922, "who_url": "/c/dan-balan/", "reason_html": "хотели потратить монету на атаку по <a class=\"ref\" href=\"/c/genrih/\">Генриху<\/a>, но монет больше не осталось"}, {"t": "1:25:08", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "в доме Генриха рядом с запиской Димитара найдены две золотые монеты (внутриигровая находка)", "result": null, "sec": 5108, "who_url": null, "reason_html": "в доме <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a> рядом с запиской Димитара найдены две золотые монеты (внутриигровая находка)"}, {"t": "1:35:44", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "отдал монету на переброс проверки Силы при ударе ногой матроса у борта корабля", "result": "переброс удался, матроса столкнули в гребное колесо и он погиб", "sec": 5744, "who_url": "/c/vampir-bek/", "reason_html": "отдал монету на переброс проверки Силы при ударе ногой матроса у борта корабля"}, {"t": "1:39:03", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "отдал монету бонусом к броску Силы, пиная кочегара ногами в топку", "result": "попадание (14), кочегар получил ожог", "sec": 5943, "who_url": "/c/dan-balan/", "reason_html": "отдал монету бонусом к броску Силы, пиная кочегара ногами в топку"}, {"t": "1:43:00", "kind": "spend", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "отдал монету за дополнительный кубик в решающей атаке мечом Бегона по старшему вампиру Димитару (несколько раз просили ещё монету, но явно отдали одну)", "result": "попадание, 24 урона с учётом серебра и огня", "sec": 6180, "who_url": "/c/dan-balan/", "reason_html": "отдал монету за дополнительный кубик в решающей атаке мечом Бегона по старшему вампиру Димитару (несколько раз просили ещё монету, но явно отдали одну)"}, {"t": "1:46:53", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "отдал монету на переброс проверки Интеллекта, пытаясь понять как взорвать корабль", "result": "переброс тоже не хватило, загадка не разгадана", "sec": 6413, "who_url": "/c/anton/", "reason_html": "отдал монету на переброс проверки Интеллекта, пытаясь понять как взорвать корабль"}, {"t": "1:58:49", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "вся команда получила бонусные монеты за победу — бросок D6 выпал на 3, монеты сразу отправлены в благотворительный фонд (своих монет к концу игры не осталось)", "result": null, "sec": 7129, "who_url": null, "reason_html": "вся команда получила бонусные монеты за победу — бросок D6 выпал на 3, монеты сразу отправлены в благотворительный фонд (своих монет к концу игры не осталось)"}], "totals": [{"who": "Дан Балан", "actor": "Гудков", "earned": 1, "spent": 3, "img": "img/chars/dan-balan.webp", "who_url": "/c/dan-balan/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Вампирбек", "actor": "BRB", "earned": 0, "spent": 1, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}, {"who": "Мирамистина", "actor": "Складчикова", "earned": 0, "spent": 1, "img": "img/chars/miramistina.webp", "who_url": "/c/miramistina/", "actor_url": "/p/viktoriya-skladchikova/"}, {"who": "Антон", "actor": "Шастун", "earned": 0, "spent": 1, "img": "img/chars/anton.webp", "who_url": "/c/anton/", "actor_url": "/p/anton-shastun/"}, {"who": "Лука «СуперБигДикГан»", "actor": "Позов", "earned": 0, "spent": 0, "img": "img/chars/luka.webp", "who_url": "/c/luka-superbigdikgan/", "actor_url": "/p/dmitriy-pozov/"}], "notes": "Больше всего монет заработал и потратил Дан Балан (Гудков) — находчивость с Роем челюстей и несколько перебросов в финальной драке; в конце игры у команды не осталось накопленных монет, и бонусные 3 монеты за победу (бросок D6) сразу отправили в благотворительный фонд. Отдельно упомянуты золотые монеты как внутриигровые деньги (loot): монета, одолженная у бармена, и две монеты-находка в доме предателя."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир-старейшина, глава клана", "role": "", "fate": "выжил (без сознания)", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Сосунеску не воскресить, но его кровь живёт в клане Балан\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Сосунеску не воскресить, но его кровь живёт в клане Балан<\/b> <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> воскресить нельзя, однако его кровь и частичка есть в <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балане<\/a> и во всех «детях» его клана — и это, возможно, когда-нибудь на что-то повлияет. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1339\" target=\"_blank\" rel=\"noopener\">0:22:19 ↗<\/a> · <a href=\"#qa20-11\">к записи<\/a><\/span><\/span>"}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "вампир-рикша", "role": "", "fate": "выжил", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Преемник Дан Балана\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Преемник Дан Балана<\/b> Если <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> умрёт, главой клана Балан, скорее всего, станет <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — или тот, кто сильнее, после того как все перегрызут друг другу глотки. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 ↗<\/a> · <a href=\"#qa20-38\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску\">33<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b> Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске 16 он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске 20 «Вампирское возмездие». <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 ↗<\/a> · <a href=\"#qa26-5\">к записи<\/a><\/span><\/span>"}, {"name": "Мирамистина", "actor": "Виктория Складчикова", "actor_url": "/p/viktoriya-skladchikova/", "race": "человек, ведьма", "role": "", "fate": "выжила", "id": "Мирамистина", "url": "/c/miramistina/", "img": "img/chars/miramistina.webp", "other": [{"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Мирамистина и Антон живут вместе\">9<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Мирамистина и Антон живут вместе<\/b> На вопрос, сошлись ли <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> и Антон, ответили, что они живут вместе и препятствий этому нет. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1423\" target=\"_blank\" rel=\"noopener\">0:23:43 ↗<\/a> · <a href=\"#qa20-13\">к записи<\/a><\/span><\/span>"}, {"name": "Антон", "actor": "Антон Шастун", "actor_url": "/p/anton-shastun/", "race": "вампир-жиголо", "role": "", "fate": "выжил", "id": "Антон", "url": "/c/anton/", "img": "img/chars/anton.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Антон и Мирамистина — случайная связь, двойное отцовство объясняют зелья\">35<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Антон и Мирамистина — случайная связь, двойное отцовство объясняют зелья<\/b> <a class=\"ref\" href=\"/p/anton-shastun/\">Шастун<\/a> ответил, что <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> Антону не жена, а случайная связь. Узнав о двойном отцовстве, Антон сперва напрягся, но успокоился, поняв, что всё дело в зельях ведьмы. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=4317\" target=\"_blank\" rel=\"noopener\">1:11:57 ↗<\/a> · <a href=\"#qa28-12\">к записи<\/a><\/span><\/span>"}, {"name": "Лука «СуперБигДикГан»", "actor": "Дмитрий Позов", "actor_url": "/p/dmitriy-pozov/", "race": "дампир, подросток 16 лет", "role": "", "fate": "выжил (без сознания)", "id": "Лука", "url": "/c/luka-superbigdikgan/", "img": "img/chars/luka.webp", "other": [{"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Солевая одноразка родилась из шутки в выпуске 20\">34<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Солевая одноразка родилась из шутки в выпуске 20<\/b> Одноразку авторы положили в инвентарь Луки «<a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>» в выпуске 20 как шутку. Когда Лука погиб на корабле, она выпала у него из кармана, стала мемом, и в итоге в неё собрали прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы призвали игроков «оставлять следы»: например, фонарный столб Кукан Яки из выпуска 16 может ещё всплыть. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=7319\" target=\"_blank\" rel=\"noopener\">2:01:59 ↗<\/a> · <a href=\"#qa26-33\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Иделаида", "actor": "", "actor_url": null, "race": "", "role": "вампирша клана, похищена", "fate": "спасена, парализована осиновым колом", "id": "Аделаида", "url": "/c/adelaida/", "img": "img/chars/idelaida.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}]}, {"name": "Лиссин", "actor": "", "actor_url": null, "race": "", "role": "бармен «Барсука»", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Инесса", "actor": "", "actor_url": null, "race": "", "role": "официантка «Барсука»", "fate": "выжила", "id": null, "url": null, "img": null, "other": []}, {"name": "Эльвира", "actor": "", "actor_url": null, "race": "", "role": "певица «Барсука», соучастница похищения", "fate": "выжила", "id": "Эльвира", "url": "/c/elvira/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Эльвира сдала Иделаиду из ревности\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Эльвира сдала Иделаиду из ревности<\/b> Фамильяры спокойно вынесли <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> в ковре из «Барсука», потому что певица <a class=\"ref\" href=\"/c/elvira/\">Эльвира<\/a> была с ними заодно: она знала и фамильяров, и Иделаиду и сдала её из ревности — двум звёздам в одном коллективе не ужиться. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4414\" target=\"_blank\" rel=\"noopener\">1:13:34 ↗<\/a> · <a href=\"#qa20-33\">к записи<\/a><\/span><\/span>"}, {"name": "Джейсон", "actor": "", "actor_url": null, "race": "", "role": "извозчик, отвёз ковёр с Иделаидой", "fate": "погиб", "id": "Джейсон", "url": "/c/dzheyson/", "img": "img/chars/dzhejson.webp", "other": []}, {"name": "Генрих", "actor": "", "actor_url": null, "race": "", "role": "пожилой фамильяр, похититель", "fate": "погиб", "id": "Генрих", "url": "/c/genrih/", "img": "img/chars/genrih.webp", "other": [{"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}]}, {"name": "Жена Генриха", "actor": "", "actor_url": null, "race": "", "role": "фамильяр", "fate": "сбежала раненой", "id": null, "url": null, "img": null, "other": []}, {"name": "Фамильяры с бакенбардами и со сломанным носом", "actor": "", "actor_url": null, "race": "", "role": "похитители Иделаиды", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}, {"name": "Димитар Норд", "actor": "", "actor_url": null, "race": "", "role": "высший вампир, организатор похищения", "fate": "погиб", "id": "Димитар Норд", "url": "/c/dimitar-nord/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Норды — богатые судовладельцы, купившие бессмертие\">25<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Норды — богатые судовладельцы, купившие бессмертие<\/b> Семья Норд — очень богатые владельцы судоходной компании в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a>. Они купили себе бессмертие (обращение) и место в высшем совете для главы семейства. «Баловень» — первый в королевстве быстрый паровой корабль, их яхта для отдыха: на ней устроили вечеринку, чтобы на рассвете сжечь <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a>. Любой в порту знал бы, что «Баловнем» владеет граф Норд. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4220\" target=\"_blank\" rel=\"noopener\">1:10:20 ↗<\/a> · <a href=\"#qa20-32\">к записи<\/a><\/span><\/span>"}, {"name": "Хельга", "actor": "", "actor_url": null, "race": "", "role": "жена Димитара, вампирша", "fate": "погибла", "id": "Хельга", "url": "/c/helga/", "img": null, "other": []}, {"name": "Дети Димитара", "actor": "", "actor_url": null, "race": "", "role": "молодые вампиры", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}, {"name": "Майкл Коу", "actor": "", "actor_url": null, "race": "", "role": "режиссёр (фото в доме фамильяров)", "fate": "упоминается", "id": "Майкл Коу", "url": "/c/maykl-kou/", "img": "img/chars/majkl-kou.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Бесагон — фамильяр, получивший силу от Властона\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Бесагон — фамильяр, получивший силу от Властона<\/b> <a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a> (Бесагон) не был вампиром: он был тщеславным фамильяром, мечтавшим о бессмертии, но понял, что хозяин никогда его не обратит. Тогда он договорился с лордом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>, который дал ему инфернальный значок и задание. Фамильяры помнили его как одного из немногих, кто добился бессмертия, и боготворили — отсюда портрет в доме <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep12.md сказано лишь, что силу Бесагону даёт орден; авторы уточнили, что орден (инфернальный значок) Бесагон получил от лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> по договору.<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2118\" target=\"_blank\" rel=\"noopener\">0:35:18 ↗<\/a> · <a href=\"#qa20-20\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a>, Антон, режиссёр <a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a>; меч Бегона ранее отнят у кузнеца Артемиса", "dir": "out", "color": "#B03A7A"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "note_html": "Убийство графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> в Мёртвых топях — причина изгнания клана", "dir": "out", "color": "#B03A7A"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "Анонс: эльф с огненными волосами (<a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a>) в следующем приключении", "dir": "out", "color": "#C8423B"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "note_html": "Столкновения с Высшим советом вампиров", "dir": "back", "color": "#B03A7A"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров", "note_html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a>, Антон, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "note_html": "<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> — мать <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка", "note_html": "Ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> и её сын-дампир", "dir": "back", "color": "#2F84C8"}, {"key": "48", "label": "48", "title": "Ночь в музее", "note_html": "Вампирская ветвь", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["«Ты срака вурдалака» — «рофл» Луки", "«Лучше бы у меня отняли ноги» — <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> об украденных колёсах", "«Была тут одна — теперь тебя ждёт такая же судьба» — <a class=\"ref\" href=\"/c/elvira/\">Эльвира<\/a>", "«Всё, что ты можешь даровать, — это пепел» — Антон Димитару", "«Это передача Юлии Высоцкой: сегодня мы готовим шашлычок из вампиров на гриле» — перед взрывом"], "places_html": "<ul>\n<li>Столица: бордель «Барсук», VIP-комната, кухня; улица Похищения, 13 (дом <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>).<\/li>\n<li>Порт Южного острова: администрация порта, пристань №5, таверна «Рыба-пила», прокат катамаранов; пароход «Баловень» (гребное колесо, котёл на китовом жире).<\/li>\n<li>Фракции: клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (изгои); высший совет вампиров; семья <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитара Норда<\/a>; фамильяры.<\/li>\n<li>Артефакты: серебряный огненный меч Бегона, рой челюстей <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, печенье очарования, эротические карточки Луки, гель для волос с мокрым эффектом, осиновый кол, наручники с мехом, рикша Вампира Бека.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>36<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>36<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>10<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>14<\/small><\/button><button class=\"chip ptf t-retcon\" data-t=\"retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон <small>1<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>4<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>6<\/small><\/button><\/div><article class=\"pnote t-clarification\" id=\"qa20-4\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как челюсть произнесла приглашение за Генриха<\/b><\/div><p>Челюсть <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> магическая: вместе с ней вылетают мышцы и связки до диафрагмы, и её сокращения заставляли рот и гортань жертвы произнести нужные слова. Заявку придумала команда, её одобрили зал и мастер; было две проверки подряд — ловкость (попасть в рот) и исполнение, обе пройдены.<\/p><blockquote>«челюсть магическая… она делала такие сокращения, что рот сам под буквы подстраивался»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-4\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=657\" target=\"_blank\" rel=\"noopener\">0:10:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa20-6\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Под ковром был тайник, а не проход в подвал<\/b><\/div><p>По сценарию под ковром в доме фамильяров был люк-тайник (ящик под половицей) с заначкой и серебряными кинжалами. Бреганов на съёмке забыл это и описал целый проход в подземелье; сцена заняла много времени, и её вырезали из монтажа, тем более что клинки так и не пригодились.<\/p><blockquote>«изначально по сценарию там должен был просто быть люк… сейф с заначкой плюс серебряные клинки»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-6\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=770\" target=\"_blank\" rel=\"noopener\">0:12:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Деревянные катаны Луки — осиновые и могут обездвижить вампира<\/b><\/div><p>По легенде мама разрешила Луке только деревянные катаны — он ещё ученик. Катаны осиновые, это было прямо написано в его карточке: ими как колом можно было парализовать обездвиженного или спящего вампира, даже высшего — одним ударом.<\/p><blockquote>«мог, потому что это катана осиновая… это написано было у него прямым текстом в карточке»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-7\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=834\" target=\"_blank\" rel=\"noopener\">0:13:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-8\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему не называют сложность бросков<\/b><\/div><p>Сложность часто вырезают на монтаже или не называют специально: для проницательности и внимания её скрывают, чтобы не выдавать сюжет (например, сложность 20–22 у лжеца). Сложность социальных проверок строится от пассивной мудрости оппонента (база около 10) с поправками на обстоятельства и помехой; называют её, когда нужен азарт «выкинуть выше числа».<\/p><blockquote>«мы вырезаем это специально, чтобы потом можно было регулировать и вести сюжет как надо мастеру»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-8\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=991\" target=\"_blank\" rel=\"noopener\">0:16:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Помеха на запугивание Генриха — из-за засады<\/b><\/div><p>Лука, схвативший жену <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>, запугивал старика с помехой, потому что Генрих знал о спрятанных за его спиной, за диваном и на лестнице фамильярах, которых герои ещё не видели.<\/p><blockquote>«старик знал про то, что сзади у него за спиной, и тут за диваном, и там на лестнице ещё три человека»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-9\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1213\" target=\"_blank\" rel=\"noopener\">0:20:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-10\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Высший совет вампиров: изначально 13 древних<\/b><\/div><p>Высший вампирский совет — «как ЦК КПСС»: изначально 13 древних вампиров. Убиты двое — граф <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a> и <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a>; жена и сыновья Димитара были вампирами, но не членами совета. Остальные 11 членов пока неизвестны и ещё появятся — клан Балана не может спать спокойно.<\/p><blockquote>«древних их тринадцать было изначально… высшим вампиром был только Димитар Норд, его жена и дети не являлись»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep20.md у <a class=\"ref\" href=\"/c/helga/\">Хельги<\/a> и детей не уточнён статус — по словам авторов, они вампиры, но не члены высшего совета; высшим вампиром был только Димитар (сыновей было двое).<\/p><p class=\"note\"><a href=\"/pod/qa20/#qa20-10\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1275\" target=\"_blank\" rel=\"noopener\">0:21:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-11\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Сосунеску не воскресить, но его кровь живёт в клане Балан<\/b><\/div><p><a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> воскресить нельзя, однако его кровь и частичка есть в <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балане<\/a> и во всех «детях» его клана — и это, возможно, когда-нибудь на что-то повлияет.<\/p><blockquote>«кровь Влада Сосунеску и частичка Влада Сосунеску есть в Дан Балане, во всех его детях»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-11\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1339\" target=\"_blank\" rel=\"noopener\">0:22:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Что предлагал Димитар Дан Балану<\/b><\/div><p>Димитар хотел, чтобы <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> подтвердил переход на сторону совета, отдав своих «детей» — <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, Антона, <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a>, ведьму — на сожжение солнцем; взамен Дан Балан занял бы в высшем совете место <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>.<\/p><blockquote>«ты отдаёшь своих детей, они сгорают на солнце, а ты сам остаёшься с ним, и тебя делают членом высшего вампирского совета»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-12\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1355\" target=\"_blank\" rel=\"noopener\">0:22:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-13\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Мирамистина и Антон живут вместе<\/b><\/div><p>На вопрос, сошлись ли <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> и Антон, ответили, что они живут вместе и препятствий этому нет.<\/p><blockquote>«они живут вместе, да, не вижу факторов, которые бы этому препятствовали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-13\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1423\" target=\"_blank\" rel=\"noopener\">0:23:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-14\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Убийство второго высшего вампира — гражданская война<\/b><\/div><p>За убийство одного высшего вампира полагается наказание, а убийство второго означает гражданскую войну среди вампиров, у которых появились идеологические расхождения. Последствия покажут в вампирском выпуске, снятом 6 сентября.<\/p><blockquote>«когда ты убиваешь второго, это уже гражданская война среди вампиров»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-14\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1443\" target=\"_blank\" rel=\"noopener\">0:24:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-15\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Спасброски от смерти на катамаране не нужны<\/b><\/div><p>После боя Лука и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> лежали без сознания, но их не стали «спасать» в кадре: ничто больше не мешало героям восстановить союзников, пока они плыли домой к гробам. Дом клана теперь отмечен на карте.<\/p><blockquote>«ничто им больше не могло помешать восстановить своих союзников… не было необходимости бросать снова спасброски»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-15\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1535\" target=\"_blank\" rel=\"noopener\">0:25:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-17\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Властона планировали связать с вампирами<\/b><\/div><p><a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> с вампирами связан не был, но авторы собирались это сделать; смерть <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> «немного обрезала» эти планы.<\/p><blockquote>«Лорд Властон с вампирами не был связан, но мы собирались сделать, но смерть Влада Сосунеску чуть-чуть наши планы обрезала»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-17\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1878\" target=\"_blank\" rel=\"noopener\">0:31:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-18\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Фамильяров можно было сделать союзниками<\/b><\/div><p>Мастер дал <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a> бросок убеждения с преимуществом на обещание «все фамильяры могут стать вампирами» — фамильяров действительно убедили, и их можно было обратить и взять в союзники, но герои предпочли их выпить. NPC могут быть и противниками, и нейтралами, и союзниками.<\/p><blockquote>«мастер дал тебе бросок с преимуществом… ты попал в их желание. Так вы их убедили, но не решили сделать их своими слугами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-18\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1878\" target=\"_blank\" rel=\"noopener\">0:31:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Бесагон — фамильяр, получивший силу от Властона<\/b><\/div><p><a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a> (Бесагон) не был вампиром: он был тщеславным фамильяром, мечтавшим о бессмертии, но понял, что хозяин никогда его не обратит. Тогда он договорился с лордом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>, который дал ему инфернальный значок и задание. Фамильяры помнили его как одного из немногих, кто добился бессмертия, и боготворили — отсюда портрет в доме <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>.<\/p><blockquote>«он понял, что его хозяин никогда не сделает его вампиром, он ушёл, договорился с лордом Властоном, инфернальный значок дал ему»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep12.md сказано лишь, что силу Бесагону даёт орден; авторы уточнили, что орден (инфернальный значок) Бесагон получил от лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> по договору.<\/p><p class=\"note\"><a href=\"/pod/qa20/#qa20-20\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2118\" target=\"_blank\" rel=\"noopener\">0:35:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-21\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Как придумали Луку, Мирамистину и роль для Позова<\/b><\/div><p>Изначально в 20-м выпуске должен был играть <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукояка<\/a>, а <a class=\"ref\" href=\"/p/dmitriy-pozov/\">Позову<\/a> хотели дать болотную тварь. Кукояка заболел, и без него это потеряло смысл; тогда придумали ведьму для <a class=\"ref\" href=\"/p/viktoriya-skladchikova/\">Виктории Складчиковой<\/a>, связали её с Антоном общим ребёнком-подростком, и в последнюю очередь поняли, что подростком будет Позов. На роль болотной твари (Нины) также рассматривали Бабича и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>.<\/p><blockquote>«у нас должен был быть Кукояка в этом выпуске, и мы хотели Позову дать болотную тварь»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-21\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2216\" target=\"_blank\" rel=\"noopener\">0:36:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-22\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Диана в «Барсуке» — пасхалка художниц к 8-му выпуску<\/b><\/div><p>Эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> из 8-го выпуска на иллюстрации бара «Барсук» — пасхалка от художниц: она «постоянно сидит в «Барсуке»» и, судя по всему, отошла от истории с крысой в штанах.<\/p><blockquote>«это пасхалка от художниц… она постоянно сидит в «Барсуке»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-22\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2307\" target=\"_blank\" rel=\"noopener\">0:38:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-23\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Атаки при отходе давно отменены, инициатива живая<\/b><\/div><p>Шоу давно отказалось от правила атаки при отходе (применяли пару раз, когда игроки наглели): первые 10 выпусков игрокам вообще не показывали карту, расстояния не считают. Жёсткую инициативу заменили «живой» — первым ходит тот, кто первым заговорил, чтобы бои были динамичнее.<\/p><blockquote>«мы отказались от этого правила очень давно… мы используем реальную живую инициативу»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-23\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2425\" target=\"_blank\" rel=\"noopener\">0:40:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-24\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кто может пригласить вампира и что со взорванным домом<\/b><\/div><p>Пригласить вампира может только хозяин жилища — ни <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a>, ни Лука не могли этого сделать. Если дом разрушен и перестал быть жильём, войти можно. В таверне «Весёлый утопец» вампиры могли входить в незанятые комнаты, но в арендованную — только по приглашению арендатора.<\/p><blockquote>«от хозяев жилища, всё верно»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-24\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2700\" target=\"_blank\" rel=\"noopener\">0:45:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-25\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мастер не напомнил скованной ведьме про соматический компонент — ради драмы<\/b><\/div><p><a class=\"ref\" href=\"/c/miramistina/\">Мирамистине<\/a> в наручниках и с кляпом не напомнили, что для заклинания нужны свободные руки и рот (вербальный и соматический компоненты), сознательно: попытка колдовать и осознание, что она связана, были интереснее.<\/p><blockquote>«если бы Саня сказал ей: блин, ты же не можешь колдовать, у тебя руки связаны, было бы не так интересно»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-25\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2992\" target=\"_blank\" rel=\"noopener\">0:49:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Димитар не полетел за катамараном<\/b><\/div><p>Димитар не знал о манипуляциях с топливом и котлом (<a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> действовала невидимой рукой), а преследовать катамаран не было смысла: у его семьи были дальнобойные заклинания, которыми следующим ходом добили бы <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> и Антона и потопили лодку.<\/p><blockquote>«не было смысла ему залетать на катамаран, потому что у них были дальнобойные заклинания»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-26\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3057\" target=\"_blank\" rel=\"noopener\">0:50:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-27\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему у героев огромные бонусы атаки<\/b><\/div><p>Большие характеристики дают намеренно: они задают вектор игры персонажа и делают так, чтобы атаки чаще попадали, а урон оставался прежним; врагов подстраивают математически. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> — парадокс: старик с силой +4 и харизмой −4; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сбалансирован как паладин (сила +3, харизма +2).<\/p><blockquote>«урон по сути остаётся примерно тем же самым, но атаки попадают чаще, а чем успешнее, тем интереснее смотреть»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-27\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3060\" target=\"_blank\" rel=\"noopener\">0:51:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-28\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Не взорвав «Баловень», герои получили бы корабль<\/b><\/div><p>Если бы герои уничтожили вампиров другим способом, не взрывая пароход, у клана остался бы самый быстрый корабль «Баловень».<\/p><blockquote>«если бы вы не взорвали корабль «Баловень», а каким-то другим способом уничтожили вампиров… у вас был бы корабль»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-28\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3319\" target=\"_blank\" rel=\"noopener\">0:55:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-29\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Колёса рикши украли ради наживы, убийство охранника не заметили<\/b><\/div><p>Кража колёс — бизнес злачного заведения, которое создано вытягивать из посетителей деньги. Убийство охранника на кухне обошлось без последствий: остальные охранники были заняты (выводили <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, держали <a class=\"ref\" href=\"/c/miramistina/\">Мирамистину<\/a>), персонал испугался, а в таком месте убийства случаются постоянно.<\/p><blockquote>«злачные места, они таковыми являются, они созданы для того, чтобы вытягивать из вас все деньги»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-29\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3446\" target=\"_blank\" rel=\"noopener\">0:57:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-30\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Правило «слышит один — слышат все» и «мигрирующие» колёса<\/b><\/div><p>С первых тестовых игр в шоу действует правило: что слышит один игрок, слышат все, если мастер не скажет обратного (как в 9-м выпуске, где <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварду<\/a> указали, что он не знает о приходе сына). Колёса рикши на самом деле лежали не на кухне, а в предбаннике за стеной; когда <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> вслух предположил, что они на кухне, их «переместили» — авторы называют это мигрирующими вещами.<\/p><blockquote>«колёса были в предбаннике, не в кухне… они мигрирующие»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep20.md колёса найдены «на кухне» — по сценарию они лежали в предбаннике за кухней и были перенесены на кухню по ходу игры.<\/p><p class=\"note\"><a href=\"/pod/qa20/#qa20-30\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3596\" target=\"_blank\" rel=\"noopener\">0:59:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Норды — богатые судовладельцы, купившие бессмертие<\/b><\/div><p>Семья Норд — очень богатые владельцы судоходной компании в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a>. Они купили себе бессмертие (обращение) и место в высшем совете для главы семейства. «Баловень» — первый в королевстве быстрый паровой корабль, их яхта для отдыха: на ней устроили вечеринку, чтобы на рассвете сжечь <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a>. Любой в порту знал бы, что «Баловнем» владеет граф Норд.<\/p><blockquote>«они владельцы судоходной компании в этом городе, в Кёнигпоне… и купили себе место бессмертия»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-32\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4220\" target=\"_blank\" rel=\"noopener\">1:10:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-33\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Эльвира сдала Иделаиду из ревности<\/b><\/div><p>Фамильяры спокойно вынесли <a class=\"ref\" href=\"/c/adelaida/\">Иделаиду<\/a> в ковре из «Барсука», потому что певица <a class=\"ref\" href=\"/c/elvira/\">Эльвира<\/a> была с ними заодно: она знала и фамильяров, и Иделаиду и сдала её из ревности — двум звёздам в одном коллективе не ужиться.<\/p><blockquote>«она слила, потому что это тупо ревность в одном коллективе… две звезды в одном месте не может быть»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-33\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4414\" target=\"_blank\" rel=\"noopener\">1:13:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-35\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Как стать старейшиной вампиров<\/b><\/div><p>Стать старейшиной (членом высшего совета) можно силой, купить место или жениться на члене совета — последнее авторы подали как подсказку <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a>. Наказание за убийство Димитара уже не наказание, а война: совет хочет смерти клана.<\/p><blockquote>«либо силой доказать свою силу, либо купить, либо жениться на члене вампирского совета — это тебе подсказка»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-35\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4682\" target=\"_blank\" rel=\"noopener\">1:18:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a><\/p><\/article><article class=\"pnote t-retcon\" id=\"qa20-36\" data-type=\"retcon\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон<\/span><b>Рой крыс Дан Балана заменён роем челюстей<\/b><\/div><p>Особая способность <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> сменилась с роя крыс на рой челюстей, потому что <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> забыл свою основную способность; челюсти подошли лучше — у старика вставная челюсть и запасные в сумке.<\/p><blockquote>«вместо роя крыс у Дана Балана теперь рой челюстей, потому что это больше ему подходит»<\/blockq
