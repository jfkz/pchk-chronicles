uote><p class=\"note\"><a href=\"/pod/qa20/#qa20-36\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-37\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Все вампиры бесплодны<\/b><\/div><p>Мёртвое семя — свойство всех вампиров: они не могут размножаться. Антон уже был вампиром, когда познакомился с <a class=\"ref\" href=\"/c/miramistina/\">Мирамистиной<\/a>, и его семя «оживила» ведьма.<\/p><blockquote>«это проблема всех вампиров, их семя бесплодно»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-37\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-38\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Преемник Дан Балана<\/b><\/div><p>Если <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> умрёт, главой клана Балан, скорее всего, станет <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> — или тот, кто сильнее, после того как все перегрызут друг другу глотки.<\/p><blockquote>«скорее всего Вампирбек, или кто-то сильнее»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-38\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4760\" target=\"_blank\" rel=\"noopener\">1:19:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-39\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему харизма Луки разная<\/b><\/div><p>У Луки харизма −1 (с эльфом на входе), но при обмане извозчика модификатор был +2: к харизме добавляется навык обмана — подростки хорошо врут.<\/p><blockquote>«это его навык обман, поэтому добавится»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-39\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4819\" target=\"_blank\" rel=\"noopener\">1:20:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa20-40\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Магический щит не спасает от роя саранчи<\/b><\/div><p>Заклинание щита защищает только от атак ближнего и дальнего боя, а от роя саранчи Димитара спасает лишь спасбросок ловкости, поэтому <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> не могла от него закрыться.<\/p><blockquote>«механика заклинания саранчи — это спасбросок ловкости»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-40\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4883\" target=\"_blank\" rel=\"noopener\">1:21:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b><\/div><p>Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске 16 он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске 20 «Вампирское возмездие».<\/p><blockquote>«вместе с энергетическим вампиром по имени Адольф они сожгли графа Сосунеску, и Вампирбек, возможно, чувствуя некую вину за содеянное»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-5\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-33\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Солевая одноразка родилась из шутки в выпуске 20<\/b><\/div><p>Одноразку авторы положили в инвентарь Луки «<a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>» в выпуске 20 как шутку. Когда Лука погиб на корабле, она выпала у него из кармана, стала мемом, и в итоге в неё собрали прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы призвали игроков «оставлять следы»: например, фонарный столб Кукан Яки из выпуска 16 может ещё всплыть.<\/p><blockquote>«А у тебя из кармана выпадает солевая одноразка... И в эту солевую одноразку, опять же, это мем, туда помещают в итоге Вампирбека»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa26/#qa26-33\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=7319\" target=\"_blank\" rel=\"noopener\">2:01:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Антон и Мирамистина — случайная связь, двойное отцовство объясняют зелья<\/b><\/div><p><a class=\"ref\" href=\"/p/anton-shastun/\">Шастун<\/a> ответил, что <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> Антону не жена, а случайная связь. Узнав о двойном отцовстве, Антон сперва напрягся, но успокоился, поняв, что всё дело в зельях ведьмы.<\/p><blockquote>«Когда потом понял, что там всё основано на зельях… что это просто намешали зелья, вот тогда в целом ну ладно.»<\/blockquote><p class=\"note\">Шастун · <a href=\"/pod/qa28/#qa28-12\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4317\" target=\"_blank\" rel=\"noopener\">1:11:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кто был на собрании преступной верхушки<\/b><\/div><p>Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12).<\/p><blockquote>«Это были те же люди, что в списке на заселение? — Нет, там ещё часть людей была дополнительно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-21\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><\/section>", "chars": {"Мирамистина": {"name": "Мирамистина", "img": "img/chars/miramistina.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9C%D0%B8%D1%80%D0%B0%D0%BC%D0%B8%D1%81%D1%82%D0%B8%D0%BD%D0%B0", "summary": "Мирамисти́на — 32-летняя ведьма, мать дампира Луки от вампира Антона.", "infobox": {"Пол": "Женский", "Раса": "Человек", "Тип": "Игровой", "Игрок": "Виктория Складчикова"}, "actors": ["Виктория Складчикова"], "kind": "pc", "dead": false, "race": "Человек", "portraits": [{"ep": "34", "thumb": "img/portraits/48fb7bb2cddb5ad7.webp"}, {"ep": "20", "thumb": "img/portraits/67e5fc95cff2442b.webp"}], "url": "/c/miramistina/", "eps": [{"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}]}, "Хельга": {"name": "Хельга", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": true, "race": "", "portraits": [], "url": "/c/helga/", "eps": [{"key": "20", "label": "20", "title": "Вампирское возмездие"}]}, "Лука": {"name": "Лука «СуперБигДикГан»",
