<script>window.EPD = {"anim": false, "key": "19", "label": "19", "title": "Час эльфийского суда", "date": "2023-06-30", "minutes": 102, "duration": 6138.0, "video_id": "jUyBXgLva78", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Нурикфел — столица лесных эльфов: главная площадь, поминальная беседка, шатёр халифа, королевский сад", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> приезжает в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> за союзом против <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, но король эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> обвиняет его в убийстве <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и грозит казнью до заката. Обвинение подстроил халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a>, мстящий за украденный щит. <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> ради дриады убивает садовника и получает чашу познания смерти, а <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> освобождает джинна, который захватывает <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a> и изгоняет халифа. Чаша показывает, что Пэлиас разбился сам, и обвинение снято, но Полуэльфа казнят за садовника; единственное желание джинна — «Убей Властона».", "summary_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, освободивший <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>, едет с посольством в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> просить лесных эльфов о союзе против <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, но король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a> обвиняет его в убийстве эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и грозит казнью всему посольству до заката. Выясняется, что обвинение подстроил халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a>, мстящий за украденный щит. Герои убивают стражу халифа, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> ради дриады убивает королевского садовника и получает чашу познания смерти, а <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> освобождает джинна халифа, который захватывает <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a> и изгоняет Теймураза. Чаша показывает, что Пэлиас разбился сам, прыгнув с крыши, — обвинение снято, но за убийство садовника Полуэльфа казнят на гильотине. Единственное желание джинна Лариса тратит на «Убей Властона» — исполнено ли оно, неизвестно.", "outcome_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> оправдан, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> казнён за убийство садовника. <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> свободен и правит Шиш-Кебабом; загадано убийство <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — результат неизвестен.", "world_html": ["<a class=\"ref\" href=\"/c/halif-timuras/\">Халиф Теймураз<\/a> свергнут, <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a> во власти освобождённого джинна", "Загадано желание «Убей <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (последствия не раскрыты)", "Лесные эльфы сняли обвинение с <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> (союз с эльфами)", "Раскрыто, что <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> давно сотрудничает с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Вступление: барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> и эльф <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> погибли при побеге из покоев халифа в Шиш-Кебабе; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> со щитом Тёмного Властелина, <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, полуорком-кентавром и духом отца одолел демона-наместника и освободил <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальд<\/a>; барон Эдвард погребён в семейной усыпальнице."}, {"t": "0:02:14", "sec": 134, "html": "Сценка: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> спасает <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> от пятого покушения. <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> строит портал в ад; король <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> отказался от насилия и не вмешивается в феодальные распри — решено просить помощи у лесных эльфов, родичей <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>."}, {"t": "0:10:03", "sec": 603, "html": "Завязка: посольство <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a> прибывает в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> — столицу лесных эльфов с дворцом в великом древе. Представление героев; <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> тайно надеется, что король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> признает в нём сына-бастарда."}, {"t": "0:16:10", "sec": 970, "html": "<a class=\"ref\" href=\"/c/korol-nurik/\">Король Нурик Луноликий<\/a> обвиняет <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в убийстве <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (тело на поминальном камне); по священному закону — смертная казнь для всего посольства. Есть «свидетель»; до заката герои должны доказать невиновность, побег приравнивается к признанию вины."}, {"t": "0:19:10", "sec": 1150, "html": "<a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a>, коснувшись <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, видит «постыдное» воспоминание: на крыше небоскрёба в пустыне <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> предлагает улететь на ковре-самолёте, а барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> — просто спрыгнуть."}, {"t": "0:23:50", "sec": 1430, "html": "Поминальная беседка на озере: очередь эльфов не пускает «убийц», <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> пробивается «золотым языком». Эльфийка у тела рассказывает о чаше познания смерти (показывает последние минуты умершего), спрятанной в королевском саду; где — знает только дриада. Полуэльф подделывает «документ СНИЛС» о невиновности — без толку."}, {"t": "0:34:45", "sec": 2085, "html": "Шатёр в восточном стиле: охранник-евнух <a class=\"ref\" href=\"/c/doni/\">Дони<\/a>, стражник халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> лепит кальян из мякиша; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обещает вернуть щит и проходит."}, {"t": "0:39:36", "sec": 2376, "html": "В шатре тёмный эльф халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> с наложницами признаёт, что знает о невиновности <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, но хочет наказать его за кражу щита; хвалится давним сотрудничеством с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>. Запись на «хлебный диктофон» не работает."}, {"t": "0:42:16", "sec": 2536, "html": "Драка: <a class=\"ref\" href=\"/c/doni/\">Дони<\/a> хватает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> разрубает Дони пополам, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> режет финкой, крысы Ларисы, напавшие на халифа, испепеляются синим джинном. <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> некротическим лучом испепеляет второго охранника; джинн ураганом выбрасывает героев из шатра."}, {"t": "0:49:40", "sec": 2980, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> догадывается о сути контракта джинна: халиф не загадывает третье желание, чтобы джинн оставался его защитником (монета за догадку)."}, {"t": "0:56:50", "sec": 3410, "html": "Королевский сад: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> отвлекает стражу крысиной песней, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> как «мастер заборов» перелезает внутрь. Дриада (Полуэльф назвался Игорем Балбековым) обещает чашу, если он убьёт садовника, калечащего «её детей»-растения."}, {"t": "1:07:15", "sec": 4035, "html": "<a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> отвлекает старика-садовника «цаплей» и режет его же ножницами; добивает, изображая искусственное дыхание при двух королевских эльфах, и убеждает их, что садовник погиб сам."}, {"t": "1:13:33", "sec": 4413, "html": "<a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> тайно подзывает героев: у халифа осталось одно желание, бутылка джинна — в желудке овцы в саду. Дриада благодарит <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a> и указывает цветок, под которым зарыта чаша."}, {"t": "1:18:57", "sec": 4737, "html": "Ворон лепит садовый магазин из мякиша, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мечом выкапывает мраморную чашу. Инструкция: плоть умершего, кровь любовника, ручки держат два существа эльфийской крови."}, {"t": "1:21:25", "sec": 4885, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> находит овцу с двумя наложницами халифа: роем крыс убивает одну, вторую — укусом в пах; критическим ударом бритвой вспарывает овцу и достаёт бутылку."}, {"t": "1:30:30", "sec": 5430, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> разбивает бутылку — джинн свободен. Он превращает <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a> в оборванца и вышвыривает смерчем: «<a class=\"ref\" href=\"/place/shish-kebab/\">Шиш-Кебаб<\/a> теперь мой». В благодарность джинн дарит Ларисе одно желание."}, {"t": "1:34:10", "sec": 5650, "html": "Суд на главной площади у гильотины: чаша показывает, что <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> сам разбился, спрыгнув с крыши вместо полёта на ковре. Эльфы синхронно бьют себя по лицу; король снимает обвинение, валит всё на врагов."}, {"t": "1:35:37", "sec": 5737, "html": "Толпа требует казни хотя бы ворона; проверка чашей смерти садовника выдаёт <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a>. Его ведут на гильотину; он кричит, что он сын короля."}, {"t": "1:38:10", "sec": 5890, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пытается загадать воскрешение <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (и крылья Ворону) — джинн отказывает в «двух желаниях». В итоге звучит «Убей <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>!» — джинн щёлкает пальцами. Гильотина падает на шею <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a>."}, {"t": "1:40:54", "sec": 6054, "html": "5 монет — 50 000 руб. в фонд борьбы с игровой зависимостью. Закадровый текст: желание — мощная сила, способная «поколебать основы мироздания»."}], "key_events": [{"t": "0:16:10", "sec": 970}, {"t": "0:39:36", "sec": 2376}, {"t": "0:42:16", "sec": 2536}, {"t": "1:03:50", "sec": 3830}, {"t": "1:07:15", "sec": 4035}, {"t": "1:21:25", "sec": 4885}, {"t": "1:30:30", "sec": 5430}, {"t": "1:34:10", "sec": 5650}, {"t": "1:38:10", "sec": 5890}], "coins": {"ep": "19", "events": [{"t": "0:50:22", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "за верную догадку об устройстве контракта с джином (три желания)", "result": null, "sec": 3022, "who_url": "/c/sfinkterion/", "reason_html": "за верную догадку об устройстве контракта с джином (три желания)"}, {"t": "0:52:37", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "за находчивость — предложил имитировать голосом диктофонную запись как доказательство невиновности", "result": null, "sec": 3157, "who_url": "/c/voron-baron/", "reason_html": "за находчивость — предложил имитировать голосом диктофонную запись как доказательство невиновности"}, {"t": "0:59:04", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "за отыгрыш — исполнила крысиную песню, чтобы отвлечь охрану сада", "result": null, "sec": 3544, "who_url": "/c/krysa-larisa/", "reason_html": "за отыгрыш — исполнила крысиную песню, чтобы отвлечь охрану сада"}, {"t": "1:11:00", "kind": "spend", "who": "Полуэльф", "actor": "Щербаков", "to": null, "reason": "потратил общую (благотворительную) золотую монету партии, чтобы перебросить неудачный бросок на скрытность/ловкость (изображал искусственное дыхание, а сам пил кровь)", "result": "не помогло — эльфы всё равно поняли, что происходит", "sec": 4260, "who_url": "/c/poluelf/", "reason_html": "потратил общую (благотворительную) золотую монету партии, чтобы перебросить неудачный бросок на скрытность/ловкость (изображал искусственное дыхание, а сам пил кровь)"}, {"t": "1:32:53", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "за красивый жест — партия решила посадить сорванный цветок обратно; конкретный получатель монеты не ясен из транскрипта", "result": null, "sec": 5573, "who_url": null, "reason_html": "за красивый жест — партия решила посадить сорванный цветок обратно; конкретный получатель монеты не ясен из транскрипта"}, {"t": "1:40:47", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "финальный бонус за победу в приключении — бросок к6 добавил монеты к общему счёту партии (итого 5 монет = 50.000 руб., переведено в благотворительный фонд по выбору игроков)", "result": "выпало 2, итого 5 монет", "sec": 6047, "who_url": null, "reason_html": "финальный бонус за победу в приключении — бросок к6 добавил монеты к общему счёту партии (итого 5 монет = 50.000 руб., переведено в благотворительный фонд по выбору игроков)"}], "totals": [{"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Ворон Барон", "actor": "Воронин", "earned": 1, "spent": 0, "img": "img/chars/voron-baron.webp", "who_url": "/c/voron-baron/", "actor_url": "/p/filipp-voronin/"}, {"who": "Полуэльф", "actor": "Щербаков", "earned": 0, "spent": 1, "img": "img/chars/poluel-f.webp", "who_url": "/c/poluelf/", "actor_url": "/p/shcherbakov/"}], "notes": "1 золотая монета = 10.000 руб., в финале все накопленные монеты (5 шт., включая 2 бонусные от броска к6 за победу) конвертированы в 50.000 руб. и переведены в выбранный игроками благотворительный фонд. Монета за спасение цветка и финальный бонус — общие/не привязаны к конкретному персонажу; одна монета на столе была общей 'благотворительной' и потрачена на переброс."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, воин, правитель Вирджинвальда", "role": "", "fate": "выжил", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на Короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "говорящая крыса, советник", "role": "", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key":
