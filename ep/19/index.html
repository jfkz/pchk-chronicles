уровня.<\/p><blockquote>«наша дриада была где-то посерединке, третьего-четвёртого уровня»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-13\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2523\" target=\"_blank\" rel=\"noopener\">0:42:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa19-14\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему спрятали чашу познания смерти<\/b><\/div><p><a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">Чашу<\/a> спрятали ещё до правления <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>: короли, владевшие ею, сходили с ума, потому что для живого чаша каждый раз показывает разную смерть — обстоятельства жизни постоянно меняются. Чашу отдали дриаде, и та её спрятала, поэтому ни одно поколение эльфов не знало, где она.<\/p><blockquote>«чаша по нашему лору была спрятана ещё до правления Нурика этими эльфами, потому что короли, которые обладали этой чашей, они сходили с ума»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-14\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2664\" target=\"_blank\" rel=\"noopener\">0:44:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-15\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Для смерти садовника нужна была кровь его любовника<\/b><\/div><p>Чтобы увидеть смерть садовника, по инструкции нужна была кровь его любовника; любовника у садовника, по шутливой версии ведущих, не было. Вопрос, как именно <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чаша<\/a> показала его смерть, остался открытым.<\/p><blockquote>«для этого нужно было найти кровь того, кто с ним спал»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-15\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2795\" target=\"_blank\" rel=\"noopener\">0:46:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ворон Барон посадил цветок, чтобы не обидеть дриаду<\/b><\/div><p>Фил объяснил, что вернул выкопанный цветок на место из уважения к дриаде, трепетно относящейся к растениям. Авторы подтвердили: если бы герои погубили её цветок, отношения с дриадой испортились бы; за этот поступок Фил получил монету.<\/p><blockquote>«если бы вы убили её цветок, оно бы испортилось»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa19/#qa19-16\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2915\" target=\"_blank\" rel=\"noopener\">0:48:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-17\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему игроки плохо помнят прошлые приключения<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что из-за параллельных ветвей и долгих перерывов между съёмками (персонажа играют раз в 8–12 месяцев) игроки забывают события, и предложил перед съёмкой давать им прочитать лор персонажа. Авторы признали, что часто боятся рассказывать больше, чтобы не подсказывать, и согласились давать больше информации.<\/p><blockquote>«я играю там один раз в восемь месяцев или там раз в год»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa19/#qa19-17\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=3020\" target=\"_blank\" rel=\"noopener\">0:50:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa19-18\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Две ветки сюжета: чаша с дриадой и джинн<\/b><\/div><p>Невиновность можно было доказать двумя путями: через <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу<\/a> и дриаду или через ветку <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинна<\/a> (освободить его и, например, воскресить <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>).<\/p><blockquote>«две ветки: это ветка чаши с дриадой и ветка с джинном»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-18\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=3193\" target=\"_blank\" rel=\"noopener\">0:53:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-19\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем Теймураз прятал бутылку джинна в овце<\/b><\/div><p><a class=\"ref\" href=\"/c/halif-timuras/\">Халиф<\/a> не мог никому доверить <a class=\"ref\" href=\"/a/butylka-dzhinna/\">бутылку<\/a> и держал её при себе, тем более что <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинн<\/a> привязан к бутылке и существует лишь в радиусе от неё. После событий в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>, когда о джинне узнали (а герои могли легко взять бутылку, стоявшую на виду), он спрятал её в любимую овцу; наложницы-охранницы знали, что овца важна, но не знали про бутылку внутри.<\/p><blockquote>«девушки, которые охраняли, знали, что сама овца важна, а не бутылка внутри»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-19\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=3234\" target=\"_blank\" rel=\"noopener\">0:53:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Лариса загадала смерть Властона, а не Пэлиаса<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> объяснил, что после пяти часов игры зал выкрикивал варианты, и игроки «схватили первое попавшееся»; кроме того, <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинны<\/a> обычно не воскрешают. По его логике крыса после смерти <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> получила свой «звёздный шанс» и уже не хотела его возвращения, а у погибшего героя есть аура. Для <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, влюблённой в Пэлиаса, логичнее было бы его воскресить.<\/p><blockquote>«крыса после смерти Пэлиаса получила свой звёздный шанс… теперь она не хочет, чтобы он возвращался»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa19/#qa19-20\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=3453\" target=\"_blank\" rel=\"noopener\">0:57:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-21\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Глобальное желание должно быть простым<\/b><\/div><p>Шатохин сказал, что желание «переселить душу <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в тело <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» мастер бы не принял: желание, глобально влияющее на вселенную, должно быть простым и понятным каждому зрителю. Бреганов не согласился, сказав, что принял бы интересную заявку. Желания работают по механике заклинания: игрок загадывает, мастер трактует; <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинны<\/a> в ПЧК — собственный лор, бывают злые и добрые.<\/p><blockquote>«желание, которое таким глобальным образом влияет на сюжет и на всю вселенную, должно быть простым и понятным»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa19/#qa19-21\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=3737\" target=\"_blank\" rel=\"noopener\">1:02:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa19-22\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Две пасхалки к персонажу Чебаткова; Нурик пришлёт его в 21-м<\/b><\/div><p>В <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19-м<\/a> выпуске были две пасхалки к персонажу <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгения Чебаткова<\/a>; выпуск с ним уже снят — король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> направит его в отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске.<\/p><blockquote>«король Нурик выпишет персонажа Чеботкова в отряд Сфинктериона в 21 выпуске»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-22\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4105\" target=\"_blank\" rel=\"noopener\">1:08:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-23\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Художники упрощали предметы из хлебного мякиша<\/b><\/div><p>Художница рассказала, что команда устала рисовать детально проработанные предметы, которые лепил <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>, и некоторые из них вообще не нарисовали.<\/p><blockquote>«все команды художников заебались рисовать предметы из мякиша… некоторые вообще выкидывали, не рисовали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-23\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4105\" target=\"_blank\" rel=\"noopener\">1:08:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-24\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Инвентарь заполняют безделушками «на всякий случай»<\/b><\/div><p>Авторы объяснили, что после способностей добивают инвентарь персонажей безделушками (банка с гайками, мешочек цветных камушков) на случай, если игроки захотят их использовать; практического назначения у них нет.<\/p><blockquote>«мы добиваем инвентарь всякими безделушками всем игрокам на случай, если игроки захотят это использовать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-24\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4152\" target=\"_blank\" rel=\"noopener\">1:09:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-25\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Дух Пэлиаса нельзя было призвать щитом<\/b><\/div><p><a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> может призвать лишь дух того, кто умер не более часа назад (как было с отцом <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>), поэтому призвать дух <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> было нельзя.<\/p><blockquote>«условия какое-то: мёртвых не более часа»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-25\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4307\" target=\"_blank\" rel=\"noopener\">1:11:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa19-26\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Смерть Властона не произойдёт за кадром<\/b><\/div><p>Авторы сказали, что сценарии пишут не наперёд, а по следствиям сыгранного, и последствия желания покажут в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске: убийство <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> «за кадром» они себе драматически позволить не могут.<\/p><blockquote>«мы авторски и драматически не можем позволить себе убийство Властона за кадром»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-26\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4365\" target=\"_blank\" rel=\"noopener\">1:12:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa19-27\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Смерть не разрывает договор Властона с демонами<\/b><\/div><p><a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> — колдун по договору с демонами; его смерть контракт не разрывает, а завершает: хозяин получает душу колдуна и всё, что причитается по условиям, — «бенефициары получат своё».<\/p><blockquote>«действие контракта его смерть не разрывает, но обычно, когда колдун умирает, то его хозяин получает его душу»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-27\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4431\" target=\"_blank\" rel=\"noopener\">1:13:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-28\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Король Нурик — пародия на Нурлана Сабурова, а не гость<\/b><\/div><p>Зрители решили, что в выпуске сыграет Нурлан Сабуров, увидев его по центру афиши, но это пародийный NPC — король эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a>; на афиши часто ставят знаковых NPC.<\/p><blockquote>«это не Нурлан, это король эльфов Нурик Луноликий… мы часто включаем на афиши каких-то NPC знаковых»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-28\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=4497\" target=\"_blank\" rel=\"noopener\">1:14:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-29\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Лариса и Пэлиас: в чашу взяли её кровь<\/b><\/div><p>На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу познания смерти<\/a> взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические.<\/p><blockquote>«раскрыть: это её кровь взяли в чашу познания смерти»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa19/#qa19-29\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-retcon\" id=\"qa21-31\" data-type=\"retcon\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон<\/span><b>У эльфов всё-таки бывают растительность на лице и морщины<\/b><\/div><p>Изначально авторы задумали эльфов без растительности на лице и морщин: они не стареют внешне и умирают «молодыми». Концепцию изменили, когда художницы нарисовали эльфа-старика, которого убил <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> в выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19<\/a>, слишком молодым. Убийство должно было выглядеть отвратительным, поэтому эльфу дорисовали морщины и волосы.<\/p><blockquote>«мы изначально говорили, что у эльфов не может быть никакой растительности, но нас сломал дед-эльф, которого убил полуэльф»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-31\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=3942\" target=\"_blank\" rel=\"noopener\">1:05:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-12\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Расу кенку Филу выбрали авторы<\/b><\/div><p><a class=\"ref\" href=\"/p/filipp-voronin/\">Фил Воронин<\/a> сам расу не выбирал: о кенку он впервые узнал из карточки за час до съёмки. Он хотел играть животное. Голосовую особенность кенку (говорить только услышанными фразами) Филу всерьёз не вводили: он говорит, что тогда не смог бы шутить.<\/p><blockquote>«Нет, конечно. Я впервые о ней услышал, читая карточку за час до»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa24/#qa24-12\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1581\" target=\"_blank\" rel=\"noopener\">0:26:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-13\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему Ворон Барон больше не лепит из мякиша<\/b><\/div><p>Фил нарочно не стал повторять приём с <a class=\"ref\" href=\"/a/hlebnyy-myakish-tvorec/\">хлебным<\/a> мякишем из выпуска <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19<\/a>, чтобы не было ощущения повтора. Кроме того, художницы пожаловались ему, что замучились рисовать всё, что он лепил. Поэтому он решил пожалеть их труд.<\/p><blockquote>«они мне написали, что они замучились рисовать всё, что я из мякиша лепил. Я просто пожалел людей»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa24/#qa24-13\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1876\" target=\"_blank\" rel=\"noopener\">0:31:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-28\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Щит Чёрного Властелина подавляет волю владельца<\/b><\/div><p>Авторы подтвердили теорию зрителя: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>, как и меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>», задуман как артефакт со своей волей, который подавляет или меняет волю владельца. Отсюда агрессия и недоверие <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> после того, как он получил щит.<\/p><blockquote>«и щит, подавляющий волю, так же как и меч Кара Гелиоса, задумывался как артефакт со своей волей»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-28\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=5187\" target=\"_blank\" rel=\"noopener\">1:26:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a>, <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-29\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гонку придумали под рекламодателя<\/b><\/div><p>Гоночный выпуск появился из-за интеграции «Авито Автотеки», но концепцию авторы придумали сами. Желание джинна задумали как рифму к выпуску, где крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, с которой всё началось: ограничений на то, чтобы загадать ещё одно желание, не было.<\/p><blockquote>«Мы ещё придумали… рифму какую-то с выпуском, где крыса Лариса загадала желание… смерть Властона»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-29\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5840\" target=\"_blank\" rel=\"noopener\">1:37:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa41-42-31\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Природа и пределы силы джинна Джиги<\/b><\/div><p><a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> — аномалия природного, вселенского происхождения, не связанная ни с богами, ни с адом. Он не всемогущ: исполняет только чужие желания, не может прямо повлиять на волю существа (только подтолкнуть), не может стереть небесный мир и не воскрешает, хотя может вернуть в прошлое; его можно убить. Глобальные желания он исполняет косвенно — например, даёт оружие, а применить его решают за столом, как со смертью <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<\/p><blockquote>«Джин не всемогущий… он некая аномалия, не связанная ни с раем, ни с адом, ни с богами, но у него… природное вселенское происхождение.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-31\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a>, <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa49-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Нурик не помогает Сфинктериону<\/b><\/div><p>По союзу с эльфами из вып. 19 они должны были помогать <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальду<\/a> против <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Помощь не понадобилась, потому что крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала джинну смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> всё же дал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> своего лучшего бойца — Лоса <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>. На вопрос, почему в нынешнем договоре есть бумага с текстом, а тогда её не было, ответили шуткой про «ретроспективную заявку».<\/p><blockquote>«Нурик дал тебе, Сфинктериону, лучшего своего бойца... Лоса Ускаманоса»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-22\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><\/section>", "chars": {"Ворон Барон": {"name": "Ворон Барон", "img": "img/chars/voron-baron.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%BE%D1%80%D0%BE%D0%BD_%D0%91%D0%B0%D1%80%D0%BE%D0%BD", "summary": "Воро́н Баро́н — человекоподобный ворон, бывший телохранитель президента Сфинктериона.", "infobox": {"Пол": "Мужской", "Раса": "Кенку", "Тип": "Игровой", "Игрок": "Филипп Воронин"}, "actors": ["Филипп Воронин"], "kind": "pc", "dead": false, "race": "Кенку", "portraits": [{"ep": "36", "thumb": "img/portraits/cc38484e7680a9fb.webp"}, {"ep": "24", "thumb": "img/portraits/32f1c97364827953.webp"}, {"ep": "19", "thumb": "img/portraits/ea0c3773d0366365.webp"}], "url": "/c/voron-baron/", "eps":
