<script>window.EPD = {"anim": false, "key": "19", "label": "19", "title": "Час эльфийского суда", "date": "2023-06-30", "minutes": 102, "duration": 6138.0, "video_id": "jUyBXgLva78", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Нурикфел — столица лесных эльфов: главная площадь, поминальная беседка, шатёр халифа, королевский сад", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, приехавшего к эльфам за союзом, обвиняют в убийстве <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и грозят казнить до заката.", "summary_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>, освободивший <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>, едет с посольством в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> просить лесных эльфов о союзе против <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, но король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a> обвиняет его в убийстве эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и грозит казнью всему посольству до заката. Выясняется, что обвинение подстроил халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a>, мстящий за украденный щит. Герои убивают стражу халифа, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> ради дриады убивает королевского садовника и получает чашу познания смерти, а <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> освобождает джинна халифа, который захватывает <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> и изгоняет Теймураза. Чаша показывает, что Пэлиас разбился сам, прыгнув с крыши, — обвинение снято, но за убийство садовника Полуэльфа казнят на гильотине. Единственное желание джинна Лариса тратит на «Убей Властона» — исполнено ли оно, неизвестно.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Две ветки сюжета: чаша с дриадой и джинн\">18<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Две ветки сюжета: чаша с дриадой и джинн<\/b> Невиновность можно было доказать двумя путями: через <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу<\/a> и дриаду или через ветку <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинна<\/a> (освободить его и, например, воскресить <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>). <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3193\" target=\"_blank\" rel=\"noopener\">0:53:13 ↗<\/a> · <a href=\"#qa19-18\">к записи<\/a><\/span><\/span>", "outcome_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> оправдан, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> казнён за убийство садовника. <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> свободен и правит <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабом<\/a>; загадано убийство <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — результат неизвестен.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Смерть Властона не произойдёт за кадром\">26<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Смерть Властона не произойдёт за кадром<\/b> Авторы сказали, что сценарии пишут не наперёд, а по следствиям сыгранного, и последствия желания покажут в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске: убийство <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> «за кадром» они себе драматически позволить не могут. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4365\" target=\"_blank\" rel=\"noopener\">1:12:45 ↗<\/a> · <a href=\"#qa19-26\">к записи<\/a><\/span><\/span>", "world_html": ["<a class=\"ref\" href=\"/c/halif-timuras/\">Халиф Теймураз<\/a> свергнут, <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> во власти освобождённого джинна", "Загадано желание «Убей <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (последствия не раскрыты)<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Глобальное желание должно быть простым\">21<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Глобальное желание должно быть простым<\/b> Шатохин сказал, что желание «переселить душу <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в тело <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» мастер бы не принял: желание, глобально влияющее на вселенную, должно быть простым и понятным каждому зрителю. Бреганов не согласился, сказав, что принял бы интересную заявку. Желания работают по механике заклинания: игрок загадывает, мастер трактует; <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинны<\/a> в ПЧК — собственный лор, бывают злые и добрые. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3737\" target=\"_blank\" rel=\"noopener\">1:02:17 ↗<\/a> · <a href=\"#qa19-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Смерть Властона не произойдёт за кадром\">26<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Смерть Властона не произойдёт за кадром<\/b> Авторы сказали, что сценарии пишут не наперёд, а по следствиям сыгранного, и последствия желания покажут в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске: убийство <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> «за кадром» они себе драматически позволить не могут. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4365\" target=\"_blank\" rel=\"noopener\">1:12:45 ↗<\/a> · <a href=\"#qa19-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Смерть не разрывает договор Властона с демонами\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Смерть не разрывает договор Властона с демонами<\/b> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> — колдун по договору с демонами; его смерть контракт не разрывает, а завершает: хозяин получает душу колдуна и всё, что причитается по условиям, — «бенефициары получат своё». <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4431\" target=\"_blank\" rel=\"noopener\">1:13:51 ↗<\/a> · <a href=\"#qa19-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Природа и пределы силы джинна Джиги\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Природа и пределы силы джинна Джиги<\/b> <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> — аномалия природного, вселенского происхождения, не связанная ни с богами, ни с адом. Он не всемогущ: исполняет только чужие желания, не может прямо повлиять на волю существа (только подтолкнуть), не может стереть небесный мир и не воскрешает, хотя может вернуть в прошлое; его можно убить. Глобальные желания он исполняет косвенно — например, даёт оружие, а применить его решают за столом, как со смертью <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 ↗<\/a> · <a href=\"#qa41-42-31\">к записи<\/a><\/span><\/span>", "Лесные эльфы сняли обвинение с <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> (союз с эльфами)<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Две пасхалки к персонажу Чебаткова; Нурик пришлёт его в 21-м\">22<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Две пасхалки к персонажу Чебаткова; Нурик пришлёт его в 21-м<\/b> В <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19-м<\/a> выпуске были две пасхалки к персонажу <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгения Чебаткова<\/a>; выпуск с ним уже снят — король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> направит его в отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4105\" target=\"_blank\" rel=\"noopener\">1:08:25 ↗<\/a> · <a href=\"#qa19-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Нурик не помогает Сфинктериону\">36<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Нурик не помогает Сфинктериону<\/b> По союзу с эльфами из вып. 19 они должны были помогать <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальду<\/a> против <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Помощь не понадобилась, потому что крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала джинну смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> всё же дал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> своего лучшего бойца — Лоса <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>. На вопрос, почему в нынешнем договоре есть бумага с текстом, а тогда её не было, ответили шуткой про «ретроспективную заявку». <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 ↗<\/a> · <a href=\"#qa49-22\">к записи<\/a><\/span><\/span>", "Раскрыто, что <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> давно сотрудничает с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Вступление: барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> и эльф <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> погибли при побеге из покоев халифа в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> со щитом Чёрного Властелина, <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>, полуорком-кентавром и духом отца одолел демона-наместника и освободил <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>; барон Эдвард погребён в семейной усыпальнице.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дух Пэлиаса нельзя было призвать щитом\">25<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дух Пэлиаса нельзя было призвать щитом<\/b> <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> может призвать лишь дух того, кто умер не более часа назад (как было с отцом <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>), поэтому призвать дух <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> было нельзя. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4307\" target=\"_blank\" rel=\"noopener\">1:11:47 ↗<\/a> · <a href=\"#qa19-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Щит Чёрного Властелина подавляет волю владельца\">33<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Щит Чёрного Властелина подавляет волю владельца<\/b> Авторы подтвердили теорию зрителя: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>, как и меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>», задуман как артефакт со своей волей, который подавляет или меняет волю владельца. Отсюда агрессия и недоверие <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> после того, как он получил щит. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=5187\" target=\"_blank\" rel=\"noopener\">1:26:27 ↗<\/a> · <a href=\"#qa31-28\">к записи<\/a><\/span><\/span>"}, {"t": "0:02:14", "sec": 134, "html": "Сценка: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> спасает <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> от пятого покушения. <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> строит портал в ад; король <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> отказался от насилия и не вмешивается в феодальные распри — решено просить помощи у лесных эльфов, родичей <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>."}, {"t": "0:10:03", "sec": 603, "html": "Завязка: посольство <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> прибывает в <a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> — столицу лесных эльфов с дворцом в великом древе. Представление героев; <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> тайно надеется, что король <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> признает в нём сына-бастарда.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Нурик мог признать бастарда, но заявка прозвучала слишком поздно\">11<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Нурик мог признать бастарда, но заявка прозвучала слишком поздно<\/b> Мастер сказал, что вариант с семейной линией, где <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> признаёт сына, был возможен — ничего жёстко не закреплено. Но <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> заявил о родстве неуверенно и лишь на плахе, где король ради репутации скорее поспешил бы казнить бастарда; такие разговоры стоило вести наедине или раньше (например, при встрече с членами королевской семьи во дворце). Мастер, вероятно, в суматохе финала эту реплику просто не расслышал — проигнорирована она была не специально. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2157\" target=\"_blank\" rel=\"noopener\">0:35:57 ↗<\/a> · <a href=\"#qa19-11\">к записи<\/a><\/span><\/span>"}, {"t": "0:16:10", "sec": 970, "html": "<a class=\"ref\" href=\"/c/korol-nurik/\">Король Нурик Луноликий<\/a> обвиняет <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в убийстве <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (тело на поминальном камне); по священному закону — смертная казнь для всего посольства. Есть «свидетель»; до заката герои должны доказать невиновность, побег приравнивается к признанию вины."}, {"t": "0:19:10", "sec": 1150, "html": "<a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a>, коснувшись <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, видит «постыдное» воспоминание: на крыше небоскрёба в пустыне <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> предлагает улететь на ковре-самолёте, а барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> — просто спрыгнуть."}, {"t": "0:23:50", "sec": 1430, "html": "Поминальная беседка на озере: очередь эльфов не пускает «убийц», <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> пробивается «золотым языком». Эльфийка у тела рассказывает о чаше познания смерти (показывает последние минуты умершего), спрятанной в королевском саду; где — знает только дриада. Полуэльф подделывает «документ СНИЛС» о невиновности — без толку.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Почему спрятали чашу познания смерти\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Почему спрятали чашу познания смерти<\/b> <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">Чашу<\/a> спрятали ещё до правления <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>: короли, владевшие ею, сходили с ума, потому что для живого чаша каждый раз показывает разную смерть — обстоятельства жизни постоянно меняются. Чашу отдали дриаде, и та её спрятала, поэтому ни одно поколение эльфов не знало, где она. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2664\" target=\"_blank\" rel=\"noopener\">0:44:24 ↗<\/a> · <a href=\"#qa19-14\">к записи<\/a><\/span><\/span>"}, {"t": "0:34:45", "sec": 2085, "html": "Шатёр в восточном стиле: охранник-евнух <a class=\"ref\" href=\"/c/doni/\">Дони<\/a>, стражник халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> лепит кальян из мякиша; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обещает вернуть щит и проходит.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Художники упрощали предметы из хлебного мякиша\">23<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Художники упрощали предметы из хлебного мякиша<\/b> Художница рассказала, что команда устала рисовать детально проработанные предметы, которые лепил <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>, и некоторые из них вообще не нарисовали. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4105\" target=\"_blank\" rel=\"noopener\">1:08:25 ↗<\/a> · <a href=\"#qa19-23\">к записи<\/a><\/span><\/span>"}, {"t": "0:39:36", "sec": 2376, "html": "В шатре тёмный эльф халиф <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураз<\/a> с наложницами признаёт, что знает о невиновности <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, но хочет наказать его за кражу щита; хвалится давним сотрудничеством с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>. Запись на «хлебный диктофон» не работает."}, {"t": "0:42:16", "sec": 2536, "html": "Драка: <a class=\"ref\" href=\"/c/doni/\">Дони<\/a> хватает <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a>; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> разрубает Дони пополам, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> режет финкой, крысы Ларисы, напавшие на халифа, испепеляются синим джинном. <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> некротическим лучом испепеляет второго охранника; джинн ураганом выбрасывает героев из шатра.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Финка Полуэльфа — пародия на «финку НКВД»\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Финка Полуэльфа — пародия на «финку НКВД»<\/b> Эльфийскую финку <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфу<\/a> дали в шутку как пародийный «патриотический инструмент» — финку НКВД «от эльфийских мастеров»; производитель финок, не зная содержания выпуска, сам предложил рекламу. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=637\" target=\"_blank\" rel=\"noopener\">0:10:37 ↗<\/a> · <a href=\"#qa19-3\">к записи<\/a><\/span><\/span>"}, {"t": "0:49:40", "sec": 2980, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> догадывается о сути контракта джинна: халиф не загадывает третье желание, чтобы джинн оставался его защитником (монета за догадку)."}, {"t": "0:56:50", "sec": 3410, "html": "Королевский сад: <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> отвлекает стражу крысиной песней, <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> как «мастер заборов» перелезает внутрь. Дриада (Полуэльф назвался Игорем Балбековым) обещает чашу, если он убьёт садовника, калечащего «её детей»-растения.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дриада — пленница королевского сада, коренная жительница этих мест\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дриада — пленница королевского сада, коренная жительница этих мест<\/b> Дриада привязана к одному дереву и не может от него далеко уйти, поэтому вокруг него и разбили королевский сад. Она была здесь коренным обитателем, а эльфы пришли и подчинили её; она «экспонат» и не может сама никого убить или нарушить закон <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> — её накажут ещё большими страданиями. Поэтому она хочет страданий эльфов, но чужими руками. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2356\" target=\"_blank\" rel=\"noopener\">0:39:16 ↗<\/a> · <a href=\"#qa19-12\">к записи<\/a><\/span><\/span>"}, {"t": "1:07:15", "sec": 4035, "html": "<a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> отвлекает старика-садовника «цаплей» и режет его же ножницами; добивает, изображая искусственное дыхание при двух королевских эльфах, и убеждает их, что садовник погиб сам.<button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: У эльфов всё-таки бывают растительность на лице и морщины\">30<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>У эльфов всё-таки бывают растительность на лице и морщины<\/b> Изначально авторы задумали эльфов без растительности на лице и морщин: они не стареют внешне и умирают «молодыми». Концепцию изменили, когда художницы нарисовали эльфа-старика, которого убил <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> в выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19<\/a>, слишком молодым. Убийство должно было выглядеть отвратительным, поэтому эльфу дорисовали морщины и волосы. <span class=\"note\">Подкаст по #21 · <a href=\"https://youtu.be/75PDShLb2xc?t=3942\" target=\"_blank\" rel=\"noopener\">1:05:42 ↗<\/a> · <a href=\"#qa21-31\">к записи<\/a><\/span><\/span>"}, {"t": "1:13:33", "sec": 4413, "html": "<a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> тайно подзывает героев: у халифа осталось одно желание, бутылка джинна — в желудке овцы в саду. Дриада благодарит <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a> и указывает цветок, под которым зарыта чаша.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Зачем Теймураз прятал бутылку джинна в овце\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Зачем Теймураз прятал бутылку джинна в овце<\/b> <a class=\"ref\" href=\"/c/halif-timuras/\">Халиф<\/a> не мог никому доверить <a class=\"ref\" href=\"/a/butylka-dzhinna/\">бутылку<\/a> и держал её при себе, тем более что <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинн<\/a> привязан к бутылке и существует лишь в радиусе от неё. После событий в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>, когда о джинне узнали (а герои могли легко взять бутылку, стоявшую на виду), он спрятал её в любимую овцу; наложницы-охранницы знали, что овца важна, но не знали про бутылку внутри. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3234\" target=\"_blank\" rel=\"noopener\">0:53:54 ↗<\/a> · <a href=\"#qa19-19\">к записи<\/a><\/span><\/span>"}, {"t": "1:18:57", "sec": 4737, "html": "Ворон лепит садовый магазин из мякиша, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мечом выкапывает мраморную чашу. Инструкция: плоть умершего, кровь любовника, ручки держат два существа эльфийской крови.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ворон Барон посадил цветок, чтобы не обидеть дриаду\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ворон Барон посадил цветок, чтобы не обидеть дриаду<\/b> Фил объяснил, что вернул выкопанный цветок на место из уважения к дриаде, трепетно относящейся к растениям. Авторы подтвердили: если бы герои погубили её цветок, отношения с дриадой испортились бы; за этот поступок Фил получил монету. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2915\" target=\"_blank\" rel=\"noopener\">0:48:35 ↗<\/a> · <a href=\"#qa19-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Художники упрощали предметы из хлебного мякиша\">23<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Художники упрощали предметы из хлебного мякиша<\/b> Художница рассказала, что команда устала рисовать детально проработанные предметы, которые лепил <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>, и некоторые из них вообще не нарисовали. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4105\" target=\"_blank\" rel=\"noopener\">1:08:25 ↗<\/a> · <a href=\"#qa19-23\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лариса и Пэлиас: в чашу взяли её кровь\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лариса и Пэлиас: в чашу взяли её кровь<\/b> На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу познания смерти<\/a> взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 ↗<\/a> · <a href=\"#qa19-29\">к записи<\/a><\/span><\/span>"}, {"t": "1:21:25", "sec": 4885, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> находит овцу с двумя наложницами халифа: роем крыс убивает одну, вторую — укусом в пах; критическим ударом бритвой вспарывает овцу и достаёт бутылку.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Зачем Теймураз прятал бутылку джинна в овце\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Зачем Теймураз прятал бутылку джинна в овце<\/b> <a class=\"ref\" href=\"/c/halif-timuras/\">Халиф<\/a> не мог никому доверить <a class=\"ref\" href=\"/a/butylka-dzhinna/\">бутылку<\/a> и держал её при себе, тем более что <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинн<\/a> привязан к бутылке и существует лишь в радиусе от неё. После событий в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>, когда о джинне узнали (а герои могли легко взять бутылку, стоявшую на виду), он спрятал её в любимую овцу; наложницы-охранницы знали, что овца важна, но не знали про бутылку внутри. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3234\" target=\"_blank\" rel=\"noopener\">0:53:54 ↗<\/a> · <a href=\"#qa19-19\">к записи<\/a><\/span><\/span>"}, {"t": "1:30:30", "sec": 5430, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> разбивает бутылку — джинн свободен. Он превращает <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a> в оборванца и вышвыривает смерчем: «<a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> теперь мой». В благодарность джинн дарит Ларисе одно желание."}, {"t": "1:34:10", "sec": 5650, "html": "Суд на главной площади у гильотины: чаша показывает, что <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> сам разбился, спрыгнув с крыши вместо полёта на ковре. Эльфы синхронно бьют себя по лицу; король снимает обвинение, валит всё на врагов.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лариса и Пэлиас: в чашу взяли её кровь\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лариса и Пэлиас: в чашу взяли её кровь<\/b> На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу познания смерти<\/a> взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 ↗<\/a> · <a href=\"#qa19-29\">к записи<\/a><\/span><\/span>"}, {"t": "1:35:37", "sec": 5737, "html": "Толпа требует казни хотя бы ворона; проверка чашей смерти садовника выдаёт <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a>. Его ведут на гильотину; он кричит, что он сын короля.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Казнь за убийство садовника — заложенная «мастерская ловушка»\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Казнь за убийство садовника — заложенная «мастерская ловушка»<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a>, убив садовника, попал в ловушку сценария: если в саду убивают эльфа и находят <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу<\/a>, её обязательно используют и на этой смерти. Фил, сдавший Полуэльфа, по его словам действовал интуитивно; дриада явно подставила Полуэльфа, натравив его на садовника. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=1987\" target=\"_blank\" rel=\"noopener\">0:33:07 ↗<\/a> · <a href=\"#qa19-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Нурик мог признать бастарда, но заявка прозвучала слишком поздно\">11<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Нурик мог признать бастарда, но заявка прозвучала слишком поздно<\/b> Мастер сказал, что вариант с семейной линией, где <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> признаёт сына, был возможен — ничего жёстко не закреплено. Но <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> заявил о родстве неуверенно и лишь на плахе, где король ради репутации скорее поспешил бы казнить бастарда; такие разговоры стоило вести наедине или раньше (например, при встрече с членами королевской семьи во дворце). Мастер, вероятно, в суматохе финала эту реплику просто не расслышал — проигнорирована она была не специально. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2157\" target=\"_blank\" rel=\"noopener\">0:35:57 ↗<\/a> · <a href=\"#qa19-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Для смерти садовника нужна была кровь его любовника\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Для смерти садовника нужна была кровь его любовника<\/b> Чтобы увидеть смерть садовника, по инструкции нужна была кровь его любовника; любовника у садовника, по шутливой версии ведущих, не было. Вопрос, как именно <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чаша<\/a> показала его смерть, остался открытым. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2795\" target=\"_blank\" rel=\"noopener\">0:46:35 ↗<\/a> · <a href=\"#qa19-15\">к записи<\/a><\/span><\/span>"}, {"t": "1:38:10", "sec": 5890, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пытается загадать воскрешение <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (и крылья Ворону) — джинн отказывает в «двух желаниях». В итоге звучит «Убей <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>!» — джинн щёлкает пальцами. Гильотина падает на шею <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a>.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Желание отложили ради драмы финала\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Желание отложили ради драмы финала<\/b> Получив чашу и освободив джинна, игроки намеренно отложили желание до суда, чтобы в финале был выбор: спасти <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a> на плахе или воскресить <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2053\" target=\"_blank\" rel=\"noopener\">0:34:13 ↗<\/a> · <a href=\"#qa19-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Лариса загадала смерть Властона, а не Пэлиаса\">20<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Лариса загадала смерть Властона, а не Пэлиаса<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> объяснил, что после пяти часов игры зал выкрикивал варианты, и игроки «схватили первое попавшееся»; кроме того, <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинны<\/a> обычно не воскрешают. По его логике крыса после смерти <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> получила свой «звёздный шанс» и уже не хотела его возвращения, а у погибшего героя есть аура. Для <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, влюблённой в Пэлиаса, логичнее было бы его воскресить. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3453\" target=\"_blank\" rel=\"noopener\">0:57:33 ↗<\/a> · <a href=\"#qa19-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Глобальное желание должно быть простым\">21<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Глобальное желание должно быть простым<\/b> Шатохин сказал, что желание «переселить душу <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> в тело <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» мастер бы не принял: желание, глобально влияющее на вселенную, должно быть простым и понятным каждому зрителю. Бреганов не согласился, сказав, что принял бы интересную заявку. Желания работают по механике заклинания: игрок загадывает, мастер трактует; <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинны<\/a> в ПЧК — собственный лор, бывают злые и добрые. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3737\" target=\"_blank\" rel=\"noopener\">1:02:17 ↗<\/a> · <a href=\"#qa19-21\">к записи<\/a><\/span><\/span>"}, {"t": "1:40:54", "sec": 6054, "html": "5 монет — 50 000 руб. в фонд борьбы с игровой зависимостью. Закадровый текст: желание — мощная сила, способная «поколебать основы мироздания»."}], "key_events": [{"t": "0:16:10", "sec": 970}, {"t": "0:39:36", "sec": 2376}, {"t": "0:42:16", "sec": 2536}, {"t": "1:03:50", "sec": 3830}, {"t": "1:07:15", "sec": 4035}, {"t": "1:21:25", "sec": 4885}, {"t": "1:30:30", "sec": 5430}, {"t": "1:34:10", "sec": 5650}, {"t": "1:38:10", "sec": 5890}], "coins": {"ep": "19", "events": [{"t": "0:50:22", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "за верную догадку об устройстве контракта с джином (три желания)", "result": null, "sec": 3022, "who_url": "/c/sfinkterion/", "reason_html": "за верную догадку об устройстве контракта с джином (три желания)"}, {"t": "0:52:37", "kind": "earn", "who": "Ворон Барон", "actor": "Воронин", "to": null, "reason": "за находчивость — предложил имитировать голосом диктофонную запись как доказательство невиновности", "result": null, "sec": 3157, "who_url": "/c/voron-baron/", "reason_html": "за находчивость — предложил имитировать голосом диктофонную запись как доказательство невиновности"}, {"t": "0:59:04", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "за отыгрыш — исполнила крысиную песню, чтобы отвлечь охрану сада", "result": null, "sec": 3544, "who_url": "/c/krysa-larisa/", "reason_html": "за отыгрыш — исполнила крысиную песню, чтобы отвлечь охрану сада"}, {"t": "1:11:00", "kind": "spend", "who": "Полуэльф", "actor": "Щербаков", "to": null, "reason": "потратил общую (благотворительную) золотую монету партии, чтобы перебросить неудачный бросок на скрытность/ловкость (изображал искусственное дыхание, а сам пил кровь)", "result": "не помогло — эльфы всё равно поняли, что происходит", "sec": 4260, "who_url": "/c/poluelf/", "reason_html": "потратил общую (благотворительную) золотую монету партии, чтобы перебросить неудачный бросок на скрытность/ловкость (изображал искусственное дыхание, а сам пил кровь)"}, {"t": "1:32:53", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "за красивый жест — партия решила посадить сорванный цветок обратно; конкретный получатель монеты не ясен из транскрипта", "result": null, "sec": 5573, "who_url": null, "reason_html": "за красивый жест — партия решила посадить сорванный цветок обратно; конкретный получатель монеты не ясен из транскрипта"}, {"t": "1:40:47", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "финальный бонус за победу в приключении — бросок к6 добавил монеты к общему счёту партии (итого 5 монет = 50.000 руб., переведено в благотворительный фонд по выбору игроков)", "result": "выпало 2, итого 5 монет", "sec": 6047, "who_url": null, "reason_html": "финальный бонус за победу в приключении — бросок к6 добавил монеты к общему счёту партии (итого 5 монет = 50.000 руб., переведено в благотворительный фонд по выбору игроков)"}], "totals": [{"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 1, "spent": 0, "img": "img/chars/sfinkterion.webp", "who_url": "/c/sfinkterion/", "actor_url": "/p/brb/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Ворон Барон", "actor": "Воронин", "earned": 1, "spent": 0, "img": "img/chars/voron-baron.webp", "who_url": "/c/voron-baron/", "actor_url": "/p/filipp-voronin/"}, {"who": "Полуэльф", "actor": "Щербаков", "earned": 0, "spent": 1, "img": "img/chars/poluel-f.webp", "who_url": "/c/poluelf/", "actor_url": "/p/shcherbakov/"}], "notes": "1 золотая монета = 10.000 руб., в финале все накопленные монеты (5 шт., включая 2 бонусные от броска к6 за победу) конвертированы в 50.000 руб. и переведены в выбранный игроками благотворительный фонд. Монета за спасение цветка и финальный бонус — общие/не привязаны к конкретному персонажу; одна монета на столе была общей 'благотворительной' и потрачена на переброс."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, воин, правитель Вёрджинвальда", "role": "", "fate": "выжил", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Щит Чёрного Властелина подавляет волю владельца\">33<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Щит Чёрного Властелина подавляет волю владельца<\/b> Авторы подтвердили теорию зрителя: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>, как и меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>», задуман как артефакт со своей волей, который подавляет или меняет волю владельца. Отсюда агрессия и недоверие <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> после того, как он получил щит. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=5187\" target=\"_blank\" rel=\"noopener\">1:26:27 ↗<\/a> · <a href=\"#qa31-28\">к записи<\/a><\/span><\/span>"}, {"name": "Крыса Лариса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "говорящая крыса, советник", "role": "", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Лариса загадала смерть Властона, а не Пэлиаса\">20<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Лариса загадала смерть Властона, а не Пэлиаса<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> объяснил, что после пяти часов игры зал выкрикивал варианты, и игроки «схватили первое попавшееся»; кроме того, <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинны<\/a> обычно не воскрешают. По его логике крыса после смерти <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> получила свой «звёздный шанс» и уже не хотела его возвращения, а у погибшего героя есть аура. Для <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>, влюблённой в Пэлиаса, логичнее было бы его воскресить. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3453\" target=\"_blank\" rel=\"noopener\">0:57:33 ↗<\/a> · <a href=\"#qa19-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лариса и Пэлиас: в чашу взяли её кровь\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лариса и Пэлиас: в чашу взяли её кровь<\/b> На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу познания смерти<\/a> взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 ↗<\/a> · <a href=\"#qa19-29\">к записи<\/a><\/span><\/span>"}, {"name": "Ворон Барон", "actor": "Филипп Воронин", "actor_url": "/p/filipp-voronin/", "race": "кенку (сын эльфийки и ворона), телохранитель", "role": "", "fate": "выжил", "id": "Ворон Барон", "url": "/c/voron-baron/", "img": "img/chars/voron-baron.webp", "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ворон Барон посадил цветок, чтобы не обидеть дриаду\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ворон Барон посадил цветок, чтобы не обидеть дриаду<\/b> Фил объяснил, что вернул выкопанный цветок на место из уважения к дриаде, трепетно относящейся к растениям. Авторы подтвердили: если бы герои погубили её цветок, отношения с дриадой испортились бы; за этот поступок Фил получил монету. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2915\" target=\"_blank\" rel=\"noopener\">0:48:35 ↗<\/a> · <a href=\"#qa19-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Расу кенку Филу выбрали авторы\">31<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Расу кенку Филу выбрали авторы<\/b> <a class=\"ref\" href=\"/p/filipp-voronin/\">Фил Воронин<\/a> сам расу не выбирал: о кенку он впервые узнал из карточки за час до съёмки. Он хотел играть животное. Голосовую особенность кенку (говорить только услышанными фразами) Филу всерьёз не вводили: он говорит, что тогда не смог бы шутить. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=1581\" target=\"_blank\" rel=\"noopener\">0:26:21 ↗<\/a> · <a href=\"#qa24-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Почему Ворон Барон больше не лепит из мякиша\">32<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Почему Ворон Барон больше не лепит из мякиша<\/b> Фил нарочно не стал повторять приём с <a class=\"ref\" href=\"/a/hlebnyy-myakish-tvorec/\">хлебным<\/a> мякишем из выпуска <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19<\/a>, чтобы не было ощущения повтора. Кроме того, художницы пожаловались ему, что замучились рисовать всё, что он лепил. Поэтому он решил пожалеть их труд. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=1876\" target=\"_blank\" rel=\"noopener\">0:31:16 ↗<\/a> · <a href=\"#qa24-13\">к записи<\/a><\/span><\/span>"}, {"name": "Полуэльф", "actor": "Щербаков", "actor_url": "/p/shcherbakov/", "race": "полуэльф, оракул-дипломат, бастард короля эльфов", "role": "", "fate": "погиб (казнён на гильотине)", "id": "Полуэльф", "url": "/c/poluelf/", "img": "img/chars/poluel-f.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Финка Полуэльфа — пародия на «финку НКВД»\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Финка Полуэльфа — пародия на «финку НКВД»<\/b> Эльфийскую финку <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфу<\/a> дали в шутку как пародийный «патриотический инструмент» — финку НКВД «от эльфийских мастеров»; производитель финок, не зная содержания выпуска, сам предложил рекламу. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=637\" target=\"_blank\" rel=\"noopener\">0:10:37 ↗<\/a> · <a href=\"#qa19-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Казнь за убийство садовника — заложенная «мастерская ловушка»\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Казнь за убийство садовника — заложенная «мастерская ловушка»<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a>, убив садовника, попал в ловушку сценария: если в саду убивают эльфа и находят <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу<\/a>, её обязательно используют и на этой смерти. Фил, сдавший Полуэльфа, по его словам действовал интуитивно; дриада явно подставила Полуэльфа, натравив его на садовника. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=1987\" target=\"_blank\" rel=\"noopener\">0:33:07 ↗<\/a> · <a href=\"#qa19-9\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Король Нурик Луноликий", "actor": "", "actor_url": null, "race": "", "role": "король лесных эльфов (в глоссарии Рик Луноликий)", "fate": "выжил", "id": "Нурик", "url": "/c/korol-nurik/", "img": "img/chars/nurik-lunolikij.webp", "other": [{"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "49", "label": "49", "title": "Раненый дракон"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Нурик мог признать бастарда, но заявка прозвучала слишком поздно\">11<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Нурик мог признать бастарда, но заявка прозвучала слишком поздно<\/b> Мастер сказал, что вариант с семейной линией, где <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> признаёт сына, был возможен — ничего жёстко не закреплено. Но <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> заявил о родстве неуверенно и лишь на плахе, где король ради репутации скорее поспешил бы казнить бастарда; такие разговоры стоило вести наедине или раньше (например, при встрече с членами королевской семьи во дворце). Мастер, вероятно, в суматохе финала эту реплику просто не расслышал — проигнорирована она была не специально. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2157\" target=\"_blank\" rel=\"noopener\">0:35:57 ↗<\/a> · <a href=\"#qa19-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Король Нурик — пародия на Нурлана Сабурова, а не гость\">28<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Король Нурик — пародия на Нурлана Сабурова, а не гость<\/b> Зрители решили, что в выпуске сыграет Нурлан Сабуров, увидев его по центру афиши, но это пародийный NPC — король эльфов <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик Луноликий<\/a>; на афиши часто ставят знаковых NPC. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4497\" target=\"_blank\" rel=\"noopener\">1:14:57 ↗<\/a> · <a href=\"#qa19-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Нурик не помогает Сфинктериону\">36<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Нурик не помогает Сфинктериону<\/b> По союзу с эльфами из вып. 19 они должны были помогать <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальду<\/a> против <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Помощь не понадобилась, потому что крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> загадала джинну смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> всё же дал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> своего лучшего бойца — Лоса <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>. На вопрос, почему в нынешнем договоре есть бумага с текстом, а тогда её не было, ответили шуткой про «ретроспективную заявку». <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=5323\" target=\"_blank\" rel=\"noopener\">1:28:43 ↗<\/a> · <a href=\"#qa49-22\">к записи<\/a><\/span><\/span>"}, {"name": "Эльф Пэлиас", "actor": "", "actor_url": null, "race": "", "role": "погибший спутник Сфинктериона, чью смерть расследуют", "fate": "погиб (не воскрешён)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дух Пэлиаса нельзя было призвать щитом\">25<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дух Пэлиаса нельзя было призвать щитом<\/b> <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> может призвать лишь дух того, кто умер не более часа назад (как было с отцом <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>), поэтому призвать дух <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> было нельзя. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4307\" target=\"_blank\" rel=\"noopener\">1:11:47 ↗<\/a> · <a href=\"#qa19-25\">к записи<\/a><\/span><\/span>"}, {"name": "Халиф Теймураз", "actor": "", "actor_url": null, "race": "", "role": "тёмный эльф, правитель Шиш Кебаба, союзник Властона, подставил героев", "fate": "свергнут, превращён в нищего и изгнан", "id": "Тимурас", "url": "/c/halif-timuras/", "img": "img/chars/tejmuraz.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Зачем Теймураз прятал бутылку джинна в овце\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Зачем Теймураз прятал бутылку джинна в овце<\/b> <a class=\"ref\" href=\"/c/halif-timuras/\">Халиф<\/a> не мог никому доверить <a class=\"ref\" href=\"/a/butylka-dzhinna/\">бутылку<\/a> и держал её при себе, тем более что <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">джинн<\/a> привязан к бутылке и существует лишь в радиусе от неё. После событий в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>, когда о джинне узнали (а герои могли легко взять бутылку, стоявшую на виду), он спрятал её в любимую овцу; наложницы-охранницы знали, что овца важна, но не знали про бутылку внутри. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=3234\" target=\"_blank\" rel=\"noopener\">0:53:54 ↗<\/a> · <a href=\"#qa19-19\">к записи<\/a><\/span><\/span>"}, {"name": "Джинн", "actor": "", "actor_url": null, "race": "", "role": "синий джинн халифа", "fate": "освобождён, захватил Шиш Кебаб", "id": "Джинн", "url": "/c/dzhinn-dzhiga/", "img": "img/chars/dzhiga.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Природа и пределы силы джинна Джиги\">35<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Природа и пределы силы джинна Джиги<\/b> <a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> — аномалия природного, вселенского происхождения, не связанная ни с богами, ни с адом. Он не всемогущ: исполняет только чужие желания, не может прямо повлиять на волю существа (только подтолкнуть), не может стереть небесный мир и не воскрешает, хотя может вернуть в прошлое; его можно убить. Глобальные желания он исполняет косвенно — например, даёт оружие, а применить его решают за столом, как со смертью <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <span class=\"note\">Подкаст по #41 и #42 · <a href=\"https://youtu.be/CeOY3-RoBxM?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 ↗<\/a> · <a href=\"#qa41-42-31\">к записи<\/a><\/span><\/span>"}, {"name": "Дони", "actor": "", "actor_url": null, "race": "", "role": "стражник-евнух халифа", "fate": "погиб", "id": "Дони", "url": "/c/doni/", "img": "img/chars/doni.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}]}, {"name": "Наложницы халифа", "actor": "", "actor_url": null, "race": "", "role": "охрана овцы с бутылкой", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}, {"name": "Дриада", "actor": "", "actor_url": null, "race": "", "role": "хранительница королевского сада", "fate": "выжила", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Казнь за убийство садовника — заложенная «мастерская ловушка»\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Казнь за убийство садовника — заложенная «мастерская ловушка»<\/b> Авторы пояснили, что <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a>, убив садовника, попал в ловушку сценария: если в саду убивают эльфа и находят <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу<\/a>, её обязательно используют и на этой смерти. Фил, сдавший Полуэльфа, по его словам действовал интуитивно; дриада явно подставила Полуэльфа, натравив его на садовника. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=1987\" target=\"_blank\" rel=\"noopener\">0:33:07 ↗<\/a> · <a href=\"#qa19-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Дриада — пленница королевского сада, коренная жительница этих мест\">12<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Дриада — пленница королевского сада, коренная жительница этих мест<\/b> Дриада привязана к одному дереву и не может от него далеко уйти, поэтому вокруг него и разбили королевский сад. Она была здесь коренным обитателем, а эльфы пришли и подчинили её; она «экспонат» и не может сама никого убить или нарушить закон <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> — её накажут ещё большими страданиями. Поэтому она хочет страданий эльфов, но чужими руками. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2356\" target=\"_blank\" rel=\"noopener\">0:39:16 ↗<\/a> · <a href=\"#qa19-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Источники механик и уровень дриады\">13<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Источники механик и уровень дриады<\/b> Авторы рассказали, что берут механики и бестиарий из официальных источников D&amp;D (через dnd.su и ttg.club), упрощая их. Дриады в D&amp;D бывают от 1-го до 9-го уровня; дриада из выпуска была примерно 3–4-го уровня. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2523\" target=\"_blank\" rel=\"noopener\">0:42:03 ↗<\/a> · <a href=\"#qa19-13\">к записи<\/a><\/span><\/span>"}, {"name": "Королевский садовник", "actor": "", "actor_url": null, "race": "", "role": "старый эльф-садовник", "fate": "погиб (убит Полуэльфом)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Для смерти садовника нужна была кровь его любовника\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Для смерти садовника нужна была кровь его любовника<\/b> Чтобы увидеть смерть садовника, по инструкции нужна была кровь его любовника; любовника у садовника, по шутливой версии ведущих, не было. Вопрос, как именно <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чаша<\/a> показала его смерть, остался открытым. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=2795\" target=\"_blank\" rel=\"noopener\">0:46:35 ↗<\/a> · <a href=\"#qa19-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: У эльфов всё-таки бывают растительность на лице и морщины\">30<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>У эльфов всё-таки бывают растительность на лице и морщины<\/b> Изначально авторы задумали эльфов без растительности на лице и морщин: они не стареют внешне и умирают «молодыми». Концепцию изменили, когда художницы нарисовали эльфа-старика, которого убил <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> в выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19<\/a>, слишком молодым. Убийство должно было выглядеть отвратительным, поэтому эльфу дорисовали морщины и волосы. <span class=\"note\">Подкаст по #21 · <a href=\"https://youtu.be/75PDShLb2xc?t=3942\" target=\"_blank\" rel=\"noopener\">1:05:42 ↗<\/a> · <a href=\"#qa21-31\">к записи<\/a><\/span><\/span>"}, {"name": "Лорд Властон", "actor": "", "actor_url": null, "race": "", "role": "главный антагонист, цель последнего желания", "fate": "неизвестно", "id": "Властон", "url": "/c/lord-vlaston/", "img": "img/chars/lord-vlaston.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "06", "label": "6", "title": "Адский поезд"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Смерть не разрывает договор Властона с демонами\">27<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Смерть не разрывает договор Властона с демонами<\/b> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> — колдун по договору с демонами; его смерть контракт не разрывает, а завершает: хозяин получает душу колдуна и всё, что причитается по условиям, — «бенефициары получат своё». <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=4431\" target=\"_blank\" rel=\"noopener\">1:13:51 ↗<\/a> · <a href=\"#qa19-27\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "Гибель эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> при побеге из покоев халифа в <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебабе<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "Освобождение <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — новый правитель", "dir": "out", "color": "#C8423B"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> строит портал в ад", "dir": "out", "color": "#7C5CD6"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона", "note_html": "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a>, союз с эльфами, джинн исполнил желание <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> — смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "Желание <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> джинну о смерти <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> и джинн; щит Чёрного Властелина у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "крыса <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> — бывшая советница <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в его ветви (вып. 1–20)", "dir": "back", "color": "#DD7A2F"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> освободила джинна", "dir": "back", "color": "#C8423B"}, {"key": "50", "label": "50", "title": "Крыса корабельная", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> — бывший советник <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "52", "label": "52", "title": "Накопитель Любви", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Крыса Лариса<\/a> — упомянута в финале в связи со свитком апокалипсиса", "dir": "back", "color": "#C8423B"}, {"key": "53", "label": "53", "title": "В поисках Лёши", "note_html": "<a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> и король лесных эльфов", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Да зачем тебе ковёр? Мы можем летать. <a class=\"ref\" href=\"/c/dava/\">Давайте<\/a> просто прыгнем с крыши» — барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в видении", "«Это было тупо, но это была трагическая случайность, а не убийство» — видение чаши", "«Мы на своём пути всё стёрли с лица земли, чтобы доказать, что мы ничего не делали» — о ходе расследования", "«Ну что, <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> теперь мой, а ты проваливай в ту дыру, из которой вылез» — джинн <a class=\"ref\" href=\"/c/halif-timuras/\">Теймуразу<\/a>", "«Убей <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>!» — «А кто это?» — последнее желание"], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/nurikfell/\">Нурикфел<\/a> — столица лесных эльфов: главная площадь с гильотиной, дворец в великом древе, золотой мостик, поминальная беседка на озере у водопада, королевский сад, шатёр халифа.<\/li>\n<li><a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> (оазис) — теперь во власти джинна; <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> (отправная точка).<\/li>\n<li>Фракции: лесные эльфы короля <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a>; двор халифа <a class=\"ref\" href=\"/c/halif-timuras/\">Теймураза<\/a>; дипломатический орден «Золотой язык» имени <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда Лёвенхарта<\/a>.<\/li>\n<li>Артефакты: щит Чёрного Властелина (некротический луч; даёт <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a> речь), чаша познания смерти, бутылка джинна (разбита), эльфийская финка (не оставляет следов), хлебный мякиш-творец.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>36<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>36<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>4<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>12<\/small><\/button><button class=\"chip ptf t-retcon\" data-t=\"retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>4<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>15<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa17-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск с Щербаковым озвучивали заново<\/b><\/div><p>После проблем со звуком авторы на следующей съёмке (выпуск с Алексеем <a class=\"ref\" href=\"/p/shcherbakov/\">Щербаковым<\/a>) вообще не писали звук во время игры. Потом все собрались и четыре часа переозвучивали выпуск.<\/p><blockquote>«выпуск Щербакова… мы получается не записывали звук вообще тогда… и потом мы собирались 4 часа, озвучивали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-3\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=511\" target=\"_blank\" rel=\"noopener\">0:08:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезанная из 19-го выпуска вставка<\/b><\/div><p>В начале подкаста показали эксклюзивную вставку, которая должна была стоять в середине <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19-го<\/a> выпуска, но в него не вошла.<\/p><blockquote>«уникальная видеовставка, которая не вошла в девятнадцатый выпуск подземелий, но там в середине должна была быть»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-1\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=9\" target=\"_blank\" rel=\"noopener\">0:00:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Финка Полуэльфа — пародия на «финку НКВД»<\/b><\/div><p>Эльфийскую финку <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфу<\/a> дали в шутку как пародийный «патриотический инструмент» — финку НКВД «от эльфийских мастеров»; производитель финок, не зная содержания выпуска, сам предложил рекламу.<\/p><blockquote>«мы Лёхе для стёба дали… финку НКВД… у него была финка от эльфийских мастеров»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-3\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=637\" target=\"_blank\" rel=\"noopener\">0:10:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гудков должен был подарить Щербакову пневматику с выстрелом<\/b><\/div><p>По задумке в конце съёмки <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> должен был подарить <a class=\"ref\" href=\"/p/shcherbakov/\">Щербакову<\/a> пневматическое оружие и «проверить» его, выстрелив в него; этого так и не сделали.<\/p><blockquote>«он пневмат должен был подарить Щербакову, но чтобы проверить, он должен был в него выстрелить»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-4\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=776\" target=\"_blank\" rel=\"noopener\">0:12:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Щербаков приехал без подготовки и не знал о зрителях в зале<\/b><\/div><p>Фила перед съёмкой час инструктировали Шатохин и мастер, а <a class=\"ref\" href=\"/p/shcherbakov/\">Щербаков<\/a> приехал ровно к началу, думал, что съёмка пройдёт в пустой чёрной студии, и не ожидал полного зала и пяти часов игры.<\/p><blockquote>«он думал, что мы снимаем в пустой студии, в чёрной, когда он увидел, что зал…»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa19/#qa19-5\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=839\" target=\"_blank\" rel=\"noopener\">0:13:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Авторы советовали мастеру «напихивать Щербакову лор»<\/b><\/div><p>Бреганов признал, что в какой-то момент игры ему было очень тяжело; авторы подсказали ему, что <a class=\"ref\" href=\"/p/shcherbakov/\">Щербаков<\/a> специально ломает формат и «щупает пределы», и посоветовали просто вести игру и нагружать его лором. Мастер подчеркнул, что за много лет никогда не стремился кого-то «слить» через NPC.<\/p><blockquote>«Саня, всё, забей, он специально ломает… Просто веди и как можно больше ему лора напихивай»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-6\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=1302\" target=\"_blank\" rel=\"noopener\">0:21:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-7\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Из монтажа вырезаны прямые оскорбления зрителей и вялое начало<\/b><\/div><p>Из выпуска вырезали прямые оскорбления <a class=\"ref\" href=\"/p/shcherbakov/\">Щербаковым<\/a> людей в зале (Щербаков сам согласился), а также затянутое начало, где игроки долго не могли найти «правильные действия»; часть грубых фраз оставили.<\/p><blockquote>«самое страшное — это было прямое оскорбление людей в зале, мы это подрежем»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-7\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=1363\" target=\"_blank\" rel=\"noopener\">0:22:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-8\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><span class=\"tag\">возможно, шутка<\/span><b>Кукушкин мог быть в 19-м выпуске<\/b><\/div><p>Из разговора следует, что <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> должен был участвовать в <a href=\"/ep/19/\" title=\"Час эльфийского суда\">19-м<\/a> выпуске (за день до съёмки этого не случилось), и <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> его особенно не хватало.<\/p><blockquote>«в том выпуске должен был быть… Кукушкин»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa19/#qa19-8\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=1733\" target=\"_blank\" rel=\"noopener\">0:28:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Казнь за убийство садовника — заложенная «мастерская ловушка»<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a>, убив садовника, попал в ловушку сценария: если в саду убивают эльфа и находят <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу<\/a>, её обязательно используют и на этой смерти. Фил, сдавший Полуэльфа, по его словам действовал интуитивно; дриада явно подставила Полуэльфа, натравив его на садовника.<\/p><blockquote>«если ты убиваешь по сценарию эльфов в саду и находишь чашу, то в любом случае эту чашу используют, чтобы посмотреть, как умер этот»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-9\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=1987\" target=\"_blank\" rel=\"noopener\">0:33:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Желание отложили ради драмы финала<\/b><\/div><p>Получив чашу и освободив джинна, игроки намеренно отложили желание до суда, чтобы в финале был выбор: спасти <a class=\"ref\" href=\"/c/poluelf/\">Полуэльфа<\/a> на плахе или воскресить <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>.<\/p><blockquote>«мы сразу же сказали: давайте-ка желание мы перенесём после суда, чтобы как раз был конфликт»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-10\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2053\" target=\"_blank\" rel=\"noopener\">0:34:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa19-11\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Нурик мог признать бастарда, но заявка прозвучала слишком поздно<\/b><\/div><p>Мастер сказал, что вариант с семейной линией, где <a class=\"ref\" href=\"/c/korol-nurik/\">Нурик<\/a> признаёт сына, был возможен — ничего жёстко не закреплено. Но <a class=\"ref\" href=\"/c/poluelf/\">Полуэльф<\/a> заявил о родстве неуверенно и лишь на плахе, где король ради репутации скорее поспешил бы казнить бастарда; такие разговоры стоило вести наедине или раньше (например, при встрече с членами королевской семьи во дворце). Мастер, вероятно, в суматохе финала эту реплику просто не расслышал — проигнорирована она была не специально.<\/p><blockquote>«у нас нет никогда ничего такого закреплённого, жёсткого… всё можно отыграть»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa19/#qa19-11\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2157\" target=\"_blank\" rel=\"noopener\">0:35:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa19-12\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дриада — пленница королевского сада, коренная жительница этих мест<\/b><\/div><p>Дриада привязана к одному дереву и не может от него далеко уйти, поэтому вокруг него и разбили королевский сад. Она была здесь коренным обитателем, а эльфы пришли и подчинили её; она «экспонат» и не может сама никого убить или нарушить закон <a class=\"ref\" href=\"/c/korol-nurik/\">Нурика<\/a> — её накажут ещё большими страданиями. Поэтому она хочет страданий эльфов, но чужими руками.<\/p><blockquote>«она была здесь коренным народом, и пришли эльфы и забрали её»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-12\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=2356\" target=\"_blank\" rel=\"noopener\">0:39:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-13\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Источники механик и уровень дриады<\/b><\/div><p>Авторы рассказали, что берут механики и бестиарий из официальных источников D&amp;D (через dnd.su и ttg.club), упрощая их. Дриады в D&amp;D бывают от 1-го до 9-го уровня; дриада из выпуска была примерно 3–4-го
