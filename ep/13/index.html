<script>window.EPD = {"key": "13", "label": "13", "title": "Проклятые роды", "date": "2022-11-26", "minutes": 100, "duration": 5993.0, "video_id": "2kIkDOiVVUw", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Деревня Зелёный Мост и военный лагерь войск Властона рядом с ней", "short_html": "Через год после выпуска 7 войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> разгромили таверну «Кайф», и семья каннибалов с <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком Пенисовым<\/a> везёт беременную <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> в <a class=\"ref\" href=\"/place/zelyonyy-most/\">Зелёный Мост<\/a> к повитухе <a class=\"ref\" href=\"/c/helena/\">Хелене<\/a>, чтобы спасти её от родового проклятия. Хелену арестовали по доносу <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Палин<\/a>, у которой обнаруживается сын <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> от Эрика. Семья пробивается через солдат, освобождает Хелену из лагеря и добивается отзыва доноса. Младенец рождается игошей, но Эрик метким плевком вливает в него зелье снятия проклятий; сына называют Лёшей.", "summary_html": "Продолжение выпуска 7: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> уже год живёт в семье каннибалов из таверны «Кайф». Войска лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> разгромили таверну, погибли отец семейства и один из сыновей; выжившие — мать-паучиха, громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, беременная <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, её муж Эрик и приёмыш-гриб <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a> — едут в деревню <a class=\"ref\" href=\"/place/zelyonyy-most/\">Зелёный Мост<\/a> за повитухой <a class=\"ref\" href=\"/c/helena/\">Хеленой<\/a>, единственной, кто может спасти Софию от родового проклятия. Хелену арестовали по доносу <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Палин<\/a>, у которой, как выясняется, есть сын <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> от Эрика. Семья освобождает повитуху, Кейт отзывает донос, и София рожает — младенец оказывается игошей (проклятым летающим младенцем), но Эрик метким плевком вливает в него зелье снятия проклятий. Ребёнка называют Лёшей.", "outcome_html": "Все герои выжили; у <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> родился здоровый сын <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, повитуха <a class=\"ref\" href=\"/c/helena/\">Хелена<\/a> спасена. <a class=\"ref\" href=\"/c/serzh/\">Серж<\/a> погиб от случайной магии Софии.", "world_html": ["<a class=\"ref\" href=\"/place/taverna-kayf/\">Таверна «Кайф<\/a>» разрушена войсками <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, семья каннибалов потеряла отца и одного сына", "Родился <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> Пенисов (будущее Избранное чадо), изначально проклятый младенец-игоша", "У <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> есть внебрачный сын <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> от <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Палин<\/a> в Зелёном Мосту", "Войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> стоят лагерем у Зелёного Моста и преследуют «ведьм»", "Таверна «Грустно и невкусно» в Зелёном Мосту обрушена"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Рекламная рамка: «Эльф <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>»-рассказчик и сестра <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a>; кусок страшилки про барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>, который вонзает в себя осколок и называет себя дьяволом, требуя «ключи» у испуганного полурослика в трюме (отсылка к сцене из прошлых выпусков)."}, {"t": "0:03:17", "sec": 197, "html": "Рассказчик напоминает события выпуска 7: таверна «Кайф», охотник <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, громила <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, семья каннибалов и паучиха; все герои погибли, кроме <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, которого отец семейства сделал мужем младшей дочери <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>."}, {"t": "0:08:00", "sec": 480, "html": "Вводная мастера: год стабильности в «Кайфе», затем войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> разгромили таверну, отец и один сын погибли. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> беременна, род проклят — нужна особая повитуха <a class=\"ref\" href=\"/c/helena/\">Хелена<\/a> из деревни <a class=\"ref\" href=\"/place/zelyonyy-most/\">Зелёный Мост<\/a>. Представление персонажей; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> заявляет, что потерял свою «гениальность» и хочет стать хорошим мужем и отцом."}, {"t": "0:16:13", "sec": 973, "html": "Мост через бурную реку охраняют солдаты <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, повозку не пропускают. <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> давит на жалость, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> изображает (или начинает) роды. <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a> от стресса выпускает галлюциногенные споры — стражники падают, но урон получают и свои."}, {"t": "0:19:24", "sec": 1164, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> снимает с охранника кирасу и надевает на беременную <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a>. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> зачем-то сталкивает повозку со всеми пожитками (и вяленой человечиной) в реку; стражники с другого берега стреляют из стационарного арбалета «Скорпион» — Юлиан без сознания."}, {"t": "0:25:51", "sec": 1551, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> создаёт лечебные ягоды (черника) и спасает брата. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> выходит вперёд животом, стража не стреляет. <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a> материализует кролика с виски, подмешивает в бутылку кусочек своей плоти (мгновенное слабительное) и угощает охрану — их пропускают."}, {"t": "0:31:10", "sec": 1870, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> ныряет за «реликвиями» к утонувшей повозке, его уносит течением и бьёт о скалы. Выбравшись, он видит охранников, испражняющихся от отравленного виски, и скрытой атакой жестоко убивает одного (с поясом добыча — золотая монета), но второй вырубает его мечом."}, {"t": "0:38:45", "sec": 2325, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> идёт спасать <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, раскалывает голову второму охраннику ударом кулаков, подбирает у него бутылку отравленного виски и зелье лечения. <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> лечит семью «задушевной беседой»."}, {"t": "0:44:06", "sec": 2646, "html": "У дороги на колесе распят бывший староста деревни <a class=\"ref\" href=\"/c/serzh/\">Серж<\/a> — муж повитухи <a class=\"ref\" href=\"/c/helena/\">Хелены<\/a>. <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Палин<\/a> донесла коменданту, что Хелена ведьма, её увезли в военный лагерь <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, скоро сожгут. Серж советует не лезть в лагерь, а уговорить Кейт отозвать донос; повод доноса — Хелена сказала, что ребёнок Кейт не от мужа, а «от мерзкого полурослика из таверны»."}, {"t": "0:48:29", "sec": 2909, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> в стрессе выпускает бесконтрольную магию: пять световых стрел испепеляют <a class=\"ref\" href=\"/c/serzh/\">Сержа<\/a> дотла. Подходит патруль из четырёх; <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> отвлекает их «мостиком», <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a> подрезает ноги ножом, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> вгоняет отравленную бутылку в живот солдату (перебросив критическую неудачу благодаря удаче полурослика в критическую удачу)."}, {"t": "0:55:04", "sec": 3304, "html": "<a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> превращается в огромную паучиху, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> сводит одного солдата с ума психической волной, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> после того как лизнул шляпку <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныча<\/a> (баф) раскалывает голову ещё одному, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> перерезает горло следующему. Последнего паучиха обматывает паутиной; допрошенный шипением, он называет палатку <a class=\"ref\" href=\"/c/helena/\">Хелены<\/a> — вторую; Гибилоныч подтверждает через «мировую грибную сеть»."}, {"t": "1:03:58", "sec": 3838, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> просит дать ему побыть главой семьи и делит группу: он с <a class=\"ref\" href=\"/c/sofiya/\">Софией<\/a> идёт в дом повитухи, остальные — к <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт<\/a>. По дороге <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a> бесполезно допрашивает козу (узнаёт лишь, что <a class=\"ref\" href=\"/c/helena/\">Хелена<\/a> лечила и животных, а писарь плачет по отнятой бочке)."}, {"t": "1:08:15", "sec": 4095, "html": "В доме <a class=\"ref\" href=\"/c/helena/\">Хелены<\/a> квартируют солдаты; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> заклинанием «успокоение» усмиряет агрессивного. В комнате повитухи он берёт её медицинскую сумку, золотую монету, зелье лечения (для <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>) и искрящееся фиолетовое зелье, которое вливает Софии — это зелье невидимости. Эрик «занимается любовью» с невидимой женой."}, {"t": "1:10:24", "sec": 4224, "html": "Дом <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Палин<\/a>: <a class=\"ref\" href=\"/c/zhanuariya/\">Женуария<\/a> представляется бабушкой. Кейт признаётся, что её сын <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> — от <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>: около полутора лет назад Эрик скрывался в деревне от солдат <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, у них была «любовь на минуту» на берегу у моста. Муж Кейт Алекс Палин ушёл в таверну «Кайф» искать Эрика и пропал (мастер напоминает: в выпуске 7 Алекс Палин напал на Эрика и был убит <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a>). Кейт согласна отозвать заявление, если ей принесут стиральную бочку и приведут Эрика."}, {"t": "1:18:59", "sec": 4739, "html": "Невидимая <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> идёт в военный лагерь с гербами <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, находит в палатке прикованную <a class=\"ref\" href=\"/c/helena/\">Хелену<\/a>; та чувствует на ней тёмное проклятие. София освобождает её, они разрезают заднюю стенку палатки и незаметно уходят."}, {"t": "1:19:30", "sec": 4770, "html": "Таверна «Грустно и невкусно»: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> хватает стиральную бочку и выбегает с ней сквозь стену — таверна обрушивается; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> собирает две монеты со стола солдат. Писарь, владелец бочки, в панике бежит вместе с Юлианом к дому <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт<\/a>."}, {"t": "1:24:21", "sec": 5061, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> шантажирует писаря (коза «рассказала», что писарь с ней развлекался). Писарь пишет отказ <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт<\/a> от показаний против <a class=\"ref\" href=\"/c/helena/\">Хелены<\/a>. Кейт бросается к <a class=\"ref\" href=\"/c/erik-penisov/\">Эрику<\/a> («Огненная Кузня»), тот её не помнит, осматривает сына <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> (похож, голубые глаза, соска в коньяке) и признаёт, что готов взять ответственность, но заявляет, что любит <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a>; Кейт гонит его."}, {"t": "1:29:43", "sec": 5383, "html": "Приходят <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> с <a class=\"ref\" href=\"/c/helena/\">Хеленой<\/a>; София устраивает <a class=\"ref\" href=\"/c/erik-penisov/\">Эрику<\/a> сцену ревности и требует отдать сумку с зельями. Пока <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт<\/a> в шоке, <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a> её рукой подписывает бумагу, писарь несёт её коменданту — Хелену оправдывают."}, {"t": "1:31:50", "sec": 5510, "html": "<a class=\"ref\" href=\"/c/helena/\">Хелена<\/a> предупреждает о тяжёлых родах и готовит зелье снятия проклятия; <a class=\"ref\" href=\"/c/gebeloma/\">Гибилоныч<\/a>, потратив кучу монет на перебросы, в итоге через грибную сеть подтверждает, что зелье настоящее."}, {"t": "1:34:00", "sec": 5640, "html": "Роды проходят успешно, но младенец впивается зубами в руку <a class=\"ref\" href=\"/c/helena/\">Хелены<\/a>, зелье разбивается, а ребёнок взлетает под потолок — это игоша, проклятый младенец с огромной красной головой, связанный пуповиной с <a class=\"ref\" href=\"/c/sofiya/\">Софией<\/a>."}, {"t": "1:35:03", "sec": 5703, "html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> слизывает разлитое зелье с пола и метким плевком по параболе попадает младенцу в рот. Младенец спускается и превращается в обычного ребёнка. <a class=\"ref\" href=\"/c/helena/\">Хелена<\/a> велит дать имя и поцеловать — Эрик называет сына Лёшей, целует в лоб и обещает, что сын сделает так, что в королевстве больше не будет войн."}, {"t": "1:38:21", "sec": 5901, "html": "Победа, выиграна одна монета + ещё одна; <a class=\"ref\" href=\"/p/wylsacom/\">Wylsacom<\/a> выбирает лучшего игрока; деньги в фонд «Ночлежка». Финал: семья обрела счастье; «какая судьба ждёт малыша Лёшу Пенисова?»"}], "key_events": [{"t": "0:08:00", "sec": 480}, {"t": "0:18:19", "sec": 1099}, {"t": "0:44:06", "sec": 2646}, {"t": "0:49:34", "sec": 2974}, {"t": "1:13:38", "sec": 4418}, {"t": "1:19:30", "sec": 4770}, {"t": "1:23:17", "sec": 4997}, {"t": "1:31:50", "sec": 5510}, {"t": "1:34:00", "sec": 5640}, {"t": "1:36:11", "sec": 5771}], "coins": {"ep": "13", "events": [{"t": "0:27:58", "kind": "earn", "who": "Гибилоныч", "actor": "Wylsacom", "to": null, "reason": "получил монету за комичный эпизод со спорами (грибной персонаж напугал стражников, те обделались)", "result": null, "sec": 1678, "who_url": "/c/gebeloma/", "reason_html": "получил монету за комичный эпизод со спорами (грибной персонаж напугал стражников, те обделались)"}, {"t": "0:35:30", "kind": "earn", "who": "Эрик Пенисов", "actor": "Кукушкин", "to": null, "reason": "убил стражника скрытой атакой и обчистил его карман (проверка ловкости рук 18) — первая монета за игру", "result": null, "sec": 2130, "who_url": "/c/erik-penisov/", "reason_html": "убил стражника скрытой атакой и обчистил его карман (проверка ловкости рук 18) — первая монета за игру"}, {"t": "1:09:18", "kind": "earn", "who": "Эрик Пенисов", "actor": "Кукушкин", "to": null, "reason": "обыскал комнату повитухи (проверка внимания 12) и нашёл под матрасом вторую за игру золотую монету", "result": null, "sec": 4158, "who_url": "/c/erik-penisov/", "reason_html": "обыскал комнату повитухи (проверка внимания 12) и нашёл под матрасом вторую за игру золотую монету"}, {"t": "1:21:09", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "во время эффектного побега (проломил стену таверны бочкой, критический успех) успел схватить со стола две золотые монеты солдат", "result": null, "sec": 4869, "who_url": null, "reason_html": "во время эффектного побега (проломил стену таверны бочкой, критический успех) успел схватить со стола две золотые монеты солдат"}, {"t": "1:31:50", "kind": "earn", "who": "Женуария Николаевна", "actor": "Екатерина Варнава", "to": null, "reason": "получила монету за хитрый трюк — подписала оправдательный документ за находившуюся в шоке роженицу, пока никто не видел", "result": null, "sec": 5510, "who_url": "/c/zhanuariya/", "reason_html": "получила монету за хитрый трюк — подписала оправдательный документ за находившуюся в шоке роженицу, пока никто не видел"}, {"t": "1:32:54", "kind": "spend", "who": "Гибилоныч", "actor": "Wylsacom", "to": null, "reason": "несколько раз (около трёх монет) потратил монеты на переброс проверки способности «грибная сеть», пытаясь узнать состав зелья для младенца", "result": "все попытки провалились (сеть «недоступна»), роды начались раньше, чем удалось выяснить ответ", "sec": 5574, "who_url": "/c/gebeloma/", "reason_html": "несколько раз (около трёх монет) потратил монеты на переброс проверки способности «грибная сеть», пытаясь узнать состав зелья для младенца"}, {"t": "1:38:21", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "базовая монета за успешное завершение приключения плюс монета по итогам бонусного броска", "result": "итого 2 золотые монеты (20 000 руб.) отправлены в фонд помощи бездомным (ночлежку)", "sec": 5901, "who_url": null, "reason_html": "базовая монета за успешное завершение приключения плюс монета по итогам бонусного броска"}], "totals": [{"who": "Гибилоныч", "actor": "Wylsacom", "earned": 1, "spent": 3, "img": "img/chars/gibilonych.webp", "who_url": "/c/gebeloma/", "actor_url": "/p/wylsacom/"}, {"who": "Эрик Пенисов", "actor": "Кукушкин", "earned": 2, "spent": 0, "img": "img/chars/erik-penisov.webp", "who_url": "/c/erik-penisov/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Женуария Николаевна", "actor": "Екатерина Варнава", "earned": 1, "spent": 0, "img": "img/chars/zhenuariya.webp", "who_url": "/c/zhanuariya/", "actor_url": "/p/ekaterina-varnava/"}], "notes": "В финале Гибилоныч в шутку говорит, что «потерял пять монет», подключаясь к грибной сети, — точное число потраченных монет в этом эпизоде неоднозначно (по репликам похоже на три), но все переброски там были неудачными. Итоговые 20 000 руб. отправлены в фонд ночлежки."}, "cast": [{"name": "Женуария Николаевна", "actor": "Екатерина Варнава", "actor_url": "/p/ekaterina-varnava/", "race": "человек, проклятая мать-паучиха, лечит беседами", "role": "", "fate": "выжила", "id": "Жануария", "url": "/c/zhanuariya/", "img": "img/chars/zhenuariya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "42", "label": "42", "title": "Чудная Долина"}]}, {"name": "Гибилоныч", "actor": "Wylsacom", "actor_url": "/p/wylsacom/", "race": "разумный гриб (гриболюд), споры и грибная сеть", "role": "", "fate": "выжил", "id": "Гибилоныч", "url": "/c/gebeloma/", "img": "img/chars/gibilonych.webp", "other": []}, {"name": "Юлиан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "человек, громила", "role": "", "fate": "выжил", "id": "Юлиан", "url": "/c/yulian/", "img": "img/chars/yulian.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "София", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, дикая магия (магия схваток), лечебные ягоды", "role": "", "fate": "выжила, родила сына", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key
