<script>window.EPD = {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "date": "2024-11-20", "minutes": 125, "duration": 7502.0, "video_id": "cZrmGos4fhg", "branch": "Янус и дракон Гимелут", "branch_color": "#B8901C", "place": "Река от Кёнигпона на север, эльфийская таможня на границе, вулкан Нергал и руины гномьего города Гусь Пещерный", "short_html": "<a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>, днём торговец, а ночью главарь преступного мира Янус, подчинённый золотой маской, плывёт к вулкану Нергал выкупить похищенную сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> — вместе с тремя мужчинами, которые её добиваются. По пути он теряет руку в пасти гномьей жабы, проходит эльфийскую таможню и крадёт драконобойку. В руинах гномьего города Гусь Пещерный похитителями оказываются высшие вампиры, работающие на красного дракона Гемелута, которому нужна маска. Кристину спасают, но она уходит с сатиром и <a class=\"ref\" href=\"/c/glamur/\">Гламуром<\/a>, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> переходит к дракону, а Дадодис в золотом доспехе и маске гибнет в жерле вулкана.", "summary_html": "<a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>, днём торговец из района Садосад, а ночью — главарь преступного мира Янус (его волю подчинила золотая двуликая маска), получает письмо: его сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> похитили и обменяют на маску у вулкана Нергал. Он собирает «спасательную команду» из трёх мужчин, каждый из которых хочет Кристину, и плывёт на рыбацкой лодке вверх по реке, сражаясь с речными гномами и проходя эльфийскую таможню, где крадёт из конфиската гномью «драконобойку». В руинах гномьего города Гусь Пещерный похитителями оказываются высшие вампиры во главе с Чеприяном Чесноческу, работающие на красного дракона Гемелута, который собирает золотой комплект с маской. Кристину спасают, но она уходит с сатиром и <a class=\"ref\" href=\"/c/glamur/\">Гламуром<\/a>, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> переходит на сторону дракона, а Дадодис в золотом доспехе и маске гибнет — дракон сбрасывает его в жерло Нергала и забирает маску.", "outcome_html": "<a class=\"ref\" href=\"/c/yanus/\">Янус (Дадодис)<\/a> погиб, маска и золотой доспех у дракона Гемелута. <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> спасена и выходит за <a class=\"ref\" href=\"/c/glamur/\">Гламура<\/a>, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> улетел с драконом.", "world_html": ["<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>, главарь преступного мира столицы, мёртв", "Маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и золотой доспех у красного дракона Гемелута в Нергале", "План высших вампиров взорвать Нергал («Чёрное небо») сорван, многие вампиры сожжены", "Драконобойка — единственное оружие против дракона — уничтожена", "Гусь Пещерный по-прежнему во власти дракона"], "scenes": [{"t": "0:01:06", "sec": 66, "html": "Пересказ: <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> возил эльфийскую соль, по заказу демонов охотился на Избранное дитя, продал взрывчатку высшим вампирам для подрыва древнего вулкана; Отряд Солнца раскрыл его личность, в отеле «Глубокий канал» вампиры устроили на него покушение."}, {"t": "0:02:10", "sec": 130, "html": "Завязка: <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> (лавка в районе Садосад) любит торговлю и сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a>. Похитители требуют золотую маску, встреча — в руинах гномьей котельной на западном склоне вулкана Нергал."}, {"t": "0:03:13", "sec": 193, "html": "Представление: <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> нашёл маску в купленном с аукциона сарае, она подчинила его волю; сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> — бывший муж <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a> (застала его с нимфами), бывший привратник колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>; тёмный эльф <a class=\"ref\" href=\"/c/glamur/\">Гламур<\/a> — её бывший любовник, сбежавший от свадьбы; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> — рыбак, знакомый по рынку. Все, кроме брата, хотят Кристину."}, {"t": "0:12:44", "sec": 764, "html": "Плавание на лодке «<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>». <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> вылавливает сапожок 28-го размера. [0:13:51] Засада речных гномов: гномы с крюками на мосту и из воды, голые гномы-берсерки, выстреливаемые деревьями-катапультами."}, {"t": "0:21:14", "sec": 1274, "html": "<a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> переодевается в «самую сексуальную гномиху» и очаровывает голых гномов; <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> надевает маску и призывает двух гулей (один в «прыжке веры» долетает до моста и растерзывает гномов). <a class=\"ref\" href=\"/c/glamur/\">Гламур<\/a> перерубает канаты, сатир дует в паруса."}, {"t": "0:29:43", "sec": 1783, "html": "Жаба старого гнома-погонщика утягивает <a class=\"ref\" href=\"/c/yanus/\">Дадодиса<\/a> языком; при попытке «дрессировки» жаба откусывает ему левую руку. Дадодис некротическим шаром убивает погонщика, забирает его душу в клетку душ и телепортируется на лодку переносящей дверью."}, {"t": "0:43:27", "sec": 2607, "html": "Туман — неофициальная граница Понии и Эльфийской цитадели. Патруль высших эльфов конвоирует лодку на таможенную заставу; <a class=\"ref\" href=\"/c/glamur/\">Гламура<\/a> гримируют под светлого эльфа."}, {"t": "0:47:43", "sec": 2863, "html": "Таможенник Анаэл «находит» подброшенную эльфийскую соль; <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> надевает маску, эльфы узнают Януса и в страхе отпускают. У заставы — сожжённый корабль «Багровый закат», на котором вампиры везли купленную у Януса взрывчатку (взрывчатки на борту не было), со следами когтей дракона."}, {"t": "0:57:20", "sec": 3440, "html": "Эльфы отдают героям пленного гнома Кукана Ламу, ненавидящего драконов: дракон несколько веков назад захватил город горных гномов Гусь Пещерный. Призрак <a class=\"ref\" href=\"/c/yanus/\">Дадодиса<\/a> обнаруживает в конфискате «мощное оружие»."}, {"t": "1:04:43", "sec": 3883, "html": "Гном говорит, что единственное оружие против дракона — драконобойка — осталось на таможне. Герои возвращаются; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> удочкой сдёргивает эльфа с вышки, <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> дверью проникает в конфискат и на парящем диске выносит драконобойку, книги и семена борщевика."}, {"t": "1:13:21", "sec": 4401, "html": "Драконобойку надо подключить к паровой системе Гуся Пещерного. Гном заключает сделку с <a class=\"ref\" href=\"/c/yanus/\">Дадодисом<\/a>: город — гномам, <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> — брату. Книга «Падение Малестийской империи»: тысячу лет назад бог даровал магу из Великой Фаларии три свитка — Кали, Немезиду и Левиафана; одним из них уничтожена Малестийская империя."}, {"t": "1:16:30", "sec": 4590, "html": "Руины Гуся Пещерного у подножия Нергала, гномья котельная: горы золота, золотой латный доспех без шлема, клетка с <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a> над лавой, восемь вампиров. Маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> питает золото."}, {"t": "1:19:42", "sec": 4782, "html": "Старый вампир Чеприян Чесноческу требует маску; <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> отпускают (она утешает влюблённого в неё вампира). <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> чувствует ложь и страх вампира. Он хватает доспех — появляется красный дракон Гемелут, собирающий золотой комплект, которому не хватает маски."}, {"t": "1:28:01", "sec": 5281, "html": "<a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> провоцирует дракона, и тот сжигает вампиров; Мираторг выживает благодаря сопротивлению огню. [1:32:13] Выясняется: вампиры пришли подорвать вулкан по плану «Чёрное небо», но попали в плен к дракону и договорились достать ему маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>."}, {"t": "1:33:15", "sec": 5595, "html": "<a class=\"ref\" href=\"/c/glamur/\">Гламур<\/a> договаривается с драконом, что уйдёт с <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a>; [1:35:22] сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> признаётся Кристине в любви (критический успех), она его обнимает."}, {"t": "1:39:33", "sec": 5973, "html": "<a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> отдаёт дракону маску и дарит золотые серёжки, но дракон требует признания: маска достаётся тому, кто убил прежнего владельца. Дадодис рассказывает, что прежний хозяин-иноземец умер у него в лавке от аллергии на мёд в сбитне. Вампиры улетают летучими мышами."}, {"t": "1:45:00", "sec": 6300, "html": "Гном подключает драконобойку не к тому вентилю, и дракон его съедает. [1:46:02] <a class=\"ref\" href=\"/c/glamur/\">Гламур<\/a> делает <a class=\"ref\" href=\"/c/kristina/\">Кристине<\/a> предложение с кольцом; она соглашается и выходит за Гламура, но жить будет втроём с ним и сатиром. Троица уходит."}, {"t": "1:50:20", "sec": 6620, "html": "<a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>, оставшись с драконом, дверью уносит маску и золотой доспех наружу и надевает их (броня 22, сопротивление всему урону). Маска называет его идиотом и мечтает сделать Гусь Пещерный базой Януса."}, {"t": "1:54:38", "sec": 6878, "html": "<a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>, обиженный тем, как <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> забыла о нём, просит дракона принять его как родственника, бросает драконобойку в лаву и садится на дракона."}, {"t": "1:57:50", "sec": 7070, "html": "Финальный бой: дракон и <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> жгут <a class=\"ref\" href=\"/c/yanus/\">Дадодиса<\/a>; Янус «перстом смерти» ранит дракона на 33. Дракон пронзает Дадодиса когтями, срывает с него маску и доспех и бросает в жерло Нергала. Последние слова: «Только никому не рассказывай про <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>»."}], "key_events": [{"t": "0:02:10", "sec": 130}, {"t": "0:21:14", "sec": 1274}, {"t": "0:29:43", "sec": 1783}, {"t": "0:47:43", "sec": 2863}, {"t": "1:06:51", "sec": 4011}, {"t": "1:19:42", "sec": 4782}, {"t": "1:28:01", "sec": 5281}, {"t": "1:46:02", "sec": 6362}, {"t": "1:54:38", "sec": 6878}, {"t": "2:00:58", "sec": 7258}], "coins": {"ep": "32", "events": [{"t": "0:14:56", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "гномы на мосту предлагают продать найденный сапог за одну золотую монету (внутриигровые деньги, не игровая механика)", "result": null, "sec": 896, "who_url": null, "reason_html": "гномы на мосту предлагают продать найденный сапог за одну золотую монету (внутриигровые деньги, не игровая механика)"}, {"t": "0:31:50", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета за шутку про дрессировку лягушки, но мастер прямо сказал «не скажу за что» и не назвал получателя", "result": null, "sec": 1910, "who_url": null, "reason_html": "монета за шутку про дрессировку лягушки, но мастер прямо сказал «не скажу за что» и не назвал получателя"}, {"t": "0:39:17", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "получил монету за комедийный талант — притворная отрыжка со звуковым эффектом", "result": null, "sec": 2357, "who_url": "/c/miratorg/", "reason_html": "получил монету за комедийный талант — притворная отрыжка со звуковым эффектом"}, {"t": "0:40:19", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "получил ещё одну монету за продолжение того же номера с шуточными «товарами на продажу»", "result": null, "sec": 2419, "who_url": "/c/miratorg/", "reason_html": "получил ещё одну монету за продолжение того же номера с шуточными «товарами на продажу»"}, {"t": "0:54:06", "kind": "spend", "who": "Дадодис", "actor": "Александр Гудков", "to": null, "reason": "потратил монету на переброс проверки запугивания эльфов-таможенников", "result": "переброс с бонусом +5 успешен — эльфы напуганы", "sec": 3246, "who_url": "/c/yanus/", "reason_html": "потратил монету на переброс проверки запугивания эльфов-таможенников"}, {"t": "1:12:18", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "эльфы соглашаются отпустить лодку за взятку в одну золотую монету", "result": null, "sec": 4338, "who_url": null, "reason_html": "эльфы соглашаются отпустить лодку за взятку в одну золотую монету"}, {"t": "1:13:21", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "вместо долгих проверок напрямую спросил гнома, как работает драконобойка — награда за находчивость", "result": null, "sec": 4401, "who_url": "/c/miratorg/", "reason_html": "вместо долгих проверок напрямую спросил гнома, как работает драконобойка — награда за находчивость"}, {"t": "1:18:36", "kind": "loot", "who": "Дадодис", "actor": "Александр Гудков", "to": null, "reason": "нашёл в сокровищнице гору золота (около тысячи монет) и золотой доспех", "result": null, "sec": 4716, "who_url": "/c/yanus/", "reason_html": "нашёл в сокровищнице гору золота (около тысячи монет) и золотой доспех"}, {"t": "1:19:42", "kind": "loot", "who": "Дадодис", "actor": "Александр Гудков", "to": null, "reason": "скармливает найденные золотые монеты маске Януса, чтобы зарядить её магией (внутриигровой ресурс, не игровая монета)", "result": null, "sec": 4782, "who_url": "/c/yanus/", "reason_html": "скармливает найденные золотые монеты маске <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, чтобы зарядить её магией (внутриигровой ресурс, не игровая монета)"}, {"t": "1:30:07", "kind": "spend", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "потратил монету на переброс спасброска ловкости от огненного дыхания дракона", "result": "переброс дал 18 — недостаточно для сложности 19", "sec": 5407, "who_url": "/c/miratorg/", "reason_html": "потратил монету на переброс спасброска ловкости от огненного дыхания дракона"}, {"t": "1:31:11", "kind": "spend", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "потратил вторую монету на ещё один переброс того же спасброска", "result": "итог 17 — снова не хватило, но персонаж выжил благодаря сопротивлению огню (28 урона вместо 55)", "sec": 5471, "who_url": "/c/miratorg/", "reason_html": "потратил вторую монету на ещё один переброс того же спасброска"}, {"t": "1:31:11", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "награда за то, что выжил в пламени дракона", "result": null, "sec": 5471, "who_url": "/c/miratorg/", "reason_html": "награда за то, что выжил в пламени дракона"}, {"t": "1:38:29", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "растрогал дракона искренним признанием в любви — монета «за настоящие чувства»", "result": null, "sec": 5909, "who_url": "/c/miratorg/", "reason_html": "растрогал дракона искренним признанием в любви — монета «за настоящие чувства»"}, {"t": "1:47:07", "kind": "earn", "who": "Сатир Дудочник", "actor": "Сатир", "to": null, "reason": "поддержал и вдохновил Гламура перед предложением руки и сердца Кристине", "result": null, "sec": 6427, "who_url": "/c/satir-dudochnik/", "reason_html": "поддержал и вдохновил <a class=\"ref\" href=\"/c/glamur/\">Гламура<\/a> перед предложением руки и сердца <a class=\"ref\" href=\"/c/kristina/\">Кристине<\/a>"}, {"t": "1:48:09", "kind": "spend", "who": "Гламур", "actor": "Руслан Усачев", "to": null, "reason": "потратил монету на переброс броска красноречия во время предложения руки и сердца", "result": "переброс сделан; по мнению мастера, для успеха хватило бы и первого результата", "sec": 6489, "who_url": "/c/glamur/", "reason_html": "потратил монету на переброс броска красноречия во время предложения руки и сердца"}, {"t": "2:03:08", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили d6, чтобы определить, сколько монет добавить в общий пул на будущее", "result": null, "sec": 7388, "who_url": null, "reason_html": "в конце выпуска бросили d6, чтобы определить, сколько монет добавить в общий пул на будущее"}], "totals": [{"who": "Мираторг", "actor": "BRB", "earned": 5, "spent": 2, "img": "img/chars/miratorg.webp", "who_url": "/c/miratorg/", "actor_url": "/p/brb/"}, {"who": "Дадодис", "actor": "Александр Гудков", "earned": 0, "spent": 1, "img": "img/chars/dododis.webp", "who_url": "/c/yanus/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сатир Дудочник", "actor": "Сатир", "earned": 1, "spent": 0, "img": "img/chars/satir-dudochnik.webp", "who_url": "/c/satir-dudochnik/", "actor_url": "/p/satir/"}, {"who": "Гламур", "actor": "Руслан Усачев", "earned": 0, "spent": 1, "img": "img/chars/glam-ur.webp", "who_url": "/c/glamur/", "actor_url": "/p/ruslan-usachev/"}], "notes": "В выпуске несколько «золотых монет» — это внутриигровые деньги (взятка эльфам, клад в сокровищнице, топливо для маски Януса), они отмечены как loot и не входят в totals. Часть игровых монет мастер выдавал без называния получателя или причины («не скажу за что»)."}, "cast": [{"name": "Дадодис", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "эльф, торговец; маг-некромант в золотой маске Януса", "role": "", "fate": "погиб (сброшен драконом в жерло Нергала)", "id": "Янус", "url": "/c/yanus/", "img": "img/chars/dododis.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на Короля"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}]}, {"name": "Сатир Ду label": "28b", "title": "Часть 2 Чёрное небо вампиров", "note_html": "вулкан Нергал", "dir": "back", "color": "#B03A7A"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\"", "note_html": "Покушение вампиров на <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> в отеле «Глубокий канал»", "dir": "out", "color": "#2F84C8"}, {"key": "33", "label": "33", "title": "Зверь Фест", "note_html": "«Багровый закат» со взрывчаткой уплыл к Нергалу", "dir": "back", "color": "#B03A7A"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "Контрабанда эльфийской соли (<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>), на которой пропал <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "Книга о падении Малестийской империи — задел на «Руины Малестии»", "dir": "out", "color": "#DD7A2F"}, {"key": "39", "label": "39", "title": "Кунисская пленница", "note_html": "Гибель Эльфдодиса в вулкане Нергал; маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> перешла к <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гимелуту<\/a>; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> оттуда же", "dir": "back", "color": "#B8901C"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a> вернётся в «Грузе Кристиночки» (тот же состав)", "dir": "out", "color": "#B8901C"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "Три свитка апокалипсиса из Великой Фаларии (Кали, Немезида, Левиафан)", "dir": "back", "color": "#DD7A2F"}, {"key": "49", "label": "49", "title": "Раненый дракон", "note_html": "Гибель <a class=\"ref\" href=\"/c/yanus/\">Дадодиса<\/a> (Януса) у Нергала, маска Януса перешла к дракону; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> перешёл на сторону дракона", "dir": "back", "color": "#B8901C"}, {"key": "50", "label": "50", "title": "Крыса корабельная", "note_html": "Рекламная сценка-флешбэк с <a class=\"ref\" href=\"/c/yanus/\">Дадодисом<\/a> (Янусом), маской и <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a>", "dir": "back", "color": "#DD7A2F"}], "quotes_html": ["«Ты собрал команду по спасению сестры, и единственные, кого ты нашёл, — те, кто хочет трахнуть твою сестру». — Мастер", "«Не я, пчёлы убили его». — <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> о прежнем владельце маски", "«Эта жизнь с тобой была интересной… Прощай, <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>». — маска Януса", "«Только никому не рассказывай про <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>». — <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>"], "places_html": "<ul>\n<li>Места: Кёнигпон (район Садосад, лавка всякой всячины), река к северу, подвесной мост, граница Понии и Эльфийской цитадели (туман), таможенная застава высших эльфов, вулкан Нергал, руины гномьего города Гусь Пещерный (котельная), Малестийская пустошь (в книге).<\/li>\n<li>Фракции: преступный мир <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, высшие вампиры (план «Чёрное небо»), Эльфийская цитадель (высшие эльфы) и её патруль, речные гномы (бывшие горные гномы), тёмные эльфы.<\/li>\n<li>Артефакты: золотая маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (призыв нежити, некротический шар, клетка душ, переносящая дверь, парящий диск, перст смерти), золотой латный доспех, драконобойка (брошена в лаву), книги «Падение Малестийской империи» и «Величие тёмных эльфов», три свитка — Кали, Немезида, Левиафан (упомянуты), семена борщевика, эльфийская соль, корабль «Багровый закат».<\/li>\n<\/ul>", "chars": {"Мираторг": {"name": "Мираторг", "img": "img/chars/miratorg.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9C%D0%B8%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B3", "summary": "Мираторг – драконорожденный, столичный рыбак, друг и коллега эльфа Дододиса. Основное оружие – Огненное дыхание, Бамбуковая удочка", "infobox": {"Пол": "Мужской", "Раса": "Драконорожденный",
