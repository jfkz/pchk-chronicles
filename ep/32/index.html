<script>window.EPD = {"anim": false, "key": "32", "label": "32", "title": "Путешествие к Нергалу", "date": "2024-11-20", "minutes": 125, "duration": 7502.0, "video_id": "cZrmGos4fhg", "branch": "Янус и дракон Гимелут", "branch_color": "#B8901C", "place": "Река от Кёнигпона на север, эльфийская таможня на границе, вулкан Нергал и руины гномьего города Гусь Пещерный", "short_html": "<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, тайный главарь преступного мира Янус, плывёт к вулкану <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> выкупить похищенную сестру.", "summary_html": "<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, днём торговец из района Садосад, а ночью — главарь преступного мира Янус (его волю подчинила золотая двуликая маска), получает письмо: его сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> похитили и обменяют на маску у вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>. Он собирает «спасательную команду» из трёх мужчин, каждый из которых хочет Кристину, и плывёт на рыбацкой лодке вверх по реке, сражаясь с речными гномами и проходя эльфийскую таможню, где крадёт из конфиската гномью «драконобойку». В руинах гномьего города Гусь Пещерный похитителями оказываются высшие вампиры во главе с Чеприяном Чесноческу, работающие на красного дракона Гемелута, который собирает золотой комплект с маской. Кристину спасают, но она уходит с сатиром и Глам'Уром, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> переходит на сторону дракона, а Дододис в золотом доспехе и маске гибнет — дракон сбрасывает его в жерло Нергала и забирает маску.", "outcome_html": "<a class=\"ref\" href=\"/c/yanus/\">Янус (Дододис)<\/a> погиб, маска и золотой доспех у дракона Гемелута. <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> спасена и выходит за Глам'Ура, <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> улетел с драконом.", "world_html": ["<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>, главарь преступного мира столицы, мёртв", "<a class=\"ref\" href=\"/a/zolotaya-maska-yanusa/\">Маска Януса<\/a> и золотой доспех у красного дракона Гемелута в <a class=\"ref\" href=\"/place/nergal/\">Нергале<\/a>", "План высших вампиров взорвать <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> («Чёрное небо») сорван, многие вампиры сожжены", "<a class=\"ref\" href=\"/a/drakonoboyki/\">Драконобойка<\/a> — единственное оружие против дракона — уничтожена", "Гусь Пещерный по-прежнему во власти дракона"], "scenes": [{"t": "0:00:52", "sec": 52, "html": "Пересказ: <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> возил эльфийскую соль, по заказу демонов охотился на Избранное дитя, продал взрывчатку высшим вампирам для подрыва древнего вулкана; Отряд Солнца раскрыл его личность, в отеле «Глубокий канал» вампиры устроили на него покушение."}, {"t": "0:02:45", "sec": 165, "html": "Завязка: <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> (лавка в районе Садосад) любит торговлю и сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a>. Похитители требуют золотую маску, встреча — в руинах гномьей котельной на западном склоне вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>."}, {"t": "0:03:49", "sec": 229, "html": "Представление: <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> нашёл маску в купленном с аукциона сарае, она подчинила его волю; сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> — бывший муж <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a> (застала его с нимфами), бывший привратник колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>; тёмный эльф <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> — её бывший любовник, сбежавший от свадьбы; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> — рыбак, знакомый по рынку. Все, кроме брата, хотят Кристину."}, {"t": "0:12:33", "sec": 753, "html": "Плавание на лодке «<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>». <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> вылавливает сапожок 28-го размера. [0:13:51] Засада речных гномов: гномы с крюками на мосту и из воды, голые гномы-берсерки, выстреливаемые деревьями-катапультами."}, {"t": "0:21:08", "sec": 1268, "html": "<a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> переодевается в «самую сексуальную гномиху» и очаровывает голых гномов; <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> надевает маску и призывает двух гулей (один в «прыжке веры» долетает до моста и растерзывает гномов). <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> перерубает канаты, сатир дует в паруса."}, {"t": "0:30:34", "sec": 1834, "html": "Жаба старого гнома-погонщика утягивает <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> языком; при попытке «дрессировки» жаба откусывает ему левую руку. Дододис некротическим шаром убивает погонщика, забирает его душу в клетку душ и телепортируется на лодку переносящей дверью."}, {"t": "0:42:36", "sec": 2556, "html": "Туман — неофициальная граница <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> и Эльфийской цитадели. Патруль высших эльфов конвоирует лодку на таможенную заставу; Глам'Ура гримируют под светлого эльфа."}, {"t": "0:47:38", "sec": 2858, "html": "Таможенник Анаэл «находит» подброшенную эльфийскую соль; <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> надевает маску, эльфы узнают Януса и в страхе отпускают. У заставы — сожжённый корабль «Багровый закат», на котором вампиры везли купленную у Януса взрывчатку (взрывчатки на борту не было), со следами когтей дракона."}, {"t": "0:57:06", "sec": 3426, "html": "Эльфы отдают героям пленного гнома Кукана Ламу, ненавидящего драконов: дракон несколько веков назад захватил город горных гномов Гусь Пещерный. Призрак <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> обнаруживает в конфискате «мощное оружие»."}, {"t": "1:04:38", "sec": 3878, "html": "Гном говорит, что единственное оружие против дракона — драконобойка — осталось на таможне. Герои возвращаются; <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> удочкой сдёргивает эльфа с вышки, <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> дверью проникает в конфискат и на парящем диске выносит драконобойку, книги и семена борщевика."}, {"t": "1:12:56", "sec": 4376, "html": "<a class=\"ref\" href=\"/a/drakonoboyki/\">Драконобойку<\/a> надо подключить к паровой системе Гуся Пещерного. Гном заключает сделку с <a class=\"ref\" href=\"/c/yanus/\">Дододисом<\/a>: город — гномам, <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> — брату. Книга «Падение Малестийской империи»: тысячу лет назад бог даровал магу из Великой <a class=\"ref\" href=\"/place/velikaya-falariya/\">Фаларии<\/a> три свитка — Кали, Немезиду и Левиафана; одним из них уничтожена <a class=\"ref\" href=\"/place/malestiya/\">Малестийская империя<\/a>."}, {"t": "1:16:44", "sec": 4604, "html": "Руины Гуся Пещерного у подножия <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>, гномья котельная: горы золота, золотой латный доспех без шлема, клетка с <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a> над лавой, восемь вампиров. <a class=\"ref\" href=\"/a/zolotaya-maska-yanusa/\">Маску Януса<\/a> питает золото."}, {"t": "1:20:00", "sec": 4800, "html": "Старый вампир Чеприян Чесноческу требует маску; <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> отпускают (она утешает влюблённого в неё вампира). <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> чувствует ложь и страх вампира. Он хватает доспех — появляется красный дракон Гемелут, собирающий золотой комплект, которому не хватает маски."}, {"t": "1:27:38", "sec": 5258, "html": "<a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> провоцирует дракона, и тот сжигает вампиров; Мираторг выживает благодаря сопротивлению огню. [1:32:13] Выясняется: вампиры пришли подорвать вулкан по плану «Чёрное небо», но попали в плен к дракону и договорились достать ему маску <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>."}, {"t": "1:33:43", "sec": 5623, "html": "<a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> договаривается с драконом, что уйдёт с <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a>; [1:35:22] сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> признаётся Кристине в любви (критический успех), она его обнимает."}, {"t": "1:39:30", "sec": 5970, "html": "<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> отдаёт дракону маску и дарит золотые серёжки, но дракон требует признания: маска достаётся тому, кто убил прежнего владельца. Дододис рассказывает, что прежний хозяин-иноземец умер у него в лавке от аллергии на мёд в сбитне. Вампиры улетают летучими мышами."}, {"t": "1:45:21", "sec": 6321, "html": "Гном подключает драконобойку не к тому вентилю, и дракон его съедает. [1:46:02] <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> делает <a class=\"ref\" href=\"/c/kristina/\">Кристине<\/a> предложение с кольцом; она соглашается и выходит за Глам'Ура, но жить будет втроём с ним и сатиром. Троица уходит."}, {"t": "1:51:20", "sec": 6680, "html": "<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, оставшись с драконом, дверью уносит маску и золотой доспех наружу и надевает их (броня 22, сопротивление всему урону). Маска называет его идиотом и мечтает сделать Гусь Пещерный базой Януса."}, {"t": "1:54:40", "sec": 6880, "html": "<a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a>, обиженный тем, как <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> забыла о нём, просит дракона принять его как родственника, бросает драконобойку в лаву и садится на дракона."}, {"t": "1:57:39", "sec": 7059, "html": "Финальный бой: дракон и <a class=\"ref\" href=\"/c/miratorg/\">Мираторг<\/a> жгут <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a>; Янус «перстом смерти» ранит дракона на 33. Дракон пронзает Дододиса когтями, срывает с него маску и доспех и бросает в жерло <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>. Последние слова: «Только никому не рассказывай про <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>»."}], "key_events": [{"t": "0:02:45", "sec": 165}, {"t": "0:21:08", "sec": 1268}, {"t": "0:30:34", "sec": 1834}, {"t": "0:47:38", "sec": 2858}, {"t": "1:06:39", "sec": 3999}, {"t": "1:20:00", "sec": 4800}, {"t": "1:27:38", "sec": 5258}, {"t": "1:46:36", "sec": 6396}, {"t": "1:54:40", "sec": 6880}, {"t": "2:01:16", "sec": 7276}], "coins": {"ep": "32", "events": [{"t": "0:15:18", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "гномы на мосту предлагают продать найденный сапог за одну золотую монету (внутриигровые деньги, не игровая механика)", "result": null, "sec": 918, "who_url": null, "reason_html": "гномы на мосту предлагают продать найденный сапог за одну золотую монету (внутриигровые деньги, не игровая механика)"}, {"t": "0:32:07", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета за шутку про дрессировку лягушки, но мастер прямо сказал «не скажу за что» и не назвал получателя", "result": null, "sec": 1927, "who_url": null, "reason_html": "монета за шутку про дрессировку лягушки, но мастер прямо сказал «не скажу за что» и не назвал получателя"}, {"t": "0:39:49", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "получил монету за комедийный талант — притворная отрыжка со звуковым эффектом", "result": null, "sec": 2389, "who_url": "/c/miratorg/", "reason_html": "получил монету за комедийный талант — притворная отрыжка со звуковым эффектом"}, {"t": "0:40:12", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "получил ещё одну монету за продолжение того же номера с шуточными «товарами на продажу»", "result": null, "sec": 2412, "who_url": "/c/miratorg/", "reason_html": "получил ещё одну монету за продолжение того же номера с шуточными «товарами на продажу»"}, {"t": "0:54:26", "kind": "spend", "who": "Дододис", "actor": "Александр Гудков", "to": null, "reason": "потратил монету на переброс проверки запугивания эльфов-таможенников", "result": "переброс с бонусом +5 успешен — эльфы напуганы", "sec": 3266, "who_url": "/c/yanus/", "reason_html": "потратил монету на переброс проверки запугивания эльфов-таможенников"}, {"t": "1:12:18", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "эльфы соглашаются отпустить лодку за взятку в одну золотую монету", "result": null, "sec": 4338, "who_url": null, "reason_html": "эльфы соглашаются отпустить лодку за взятку в одну золотую монету"}, {"t": "1:13:51", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "вместо долгих проверок напрямую спросил гнома, как работает драконобойка — награда за находчивость", "result": null, "sec": 4431, "who_url": "/c/miratorg/", "reason_html": "вместо долгих проверок напрямую спросил гнома, как работает драконобойка — награда за находчивость"}, {"t": "1:18:38", "kind": "loot", "who": "Дододис", "actor": "Александр Гудков", "to": null, "reason": "нашёл в сокровищнице гору золота (около тысячи монет) и золотой доспех", "result": null, "sec": 4718, "who_url": "/c/yanus/", "reason_html": "нашёл в сокровищнице гору золота (около тысячи монет) и золотой доспех"}, {"t": "1:19:39", "kind": "loot", "who": "Дододис", "actor": "Александр Гудков", "to": null, "reason": "скармливает найденные золотые монеты маске Януса, чтобы зарядить её магией (внутриигровой ресурс, не игровая монета)", "result": null, "sec": 4779, "who_url": "/c/yanus/", "reason_html": "скармливает найденные золотые монеты маске <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, чтобы зарядить её магией (внутриигровой ресурс, не игровая монета)"}, {"t": "1:30:21", "kind": "spend", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "потратил монету на переброс спасброска ловкости от огненного дыхания дракона", "result": "переброс дал 18 — недостаточно для сложности 19", "sec": 5421, "who_url": "/c/miratorg/", "reason_html": "потратил монету на переброс спасброска ловкости от огненного дыхания дракона"}, {"t": "1:31:11", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "награда за то, что выжил в пламени дракона", "result": null, "sec": 5471, "who_url": "/c/miratorg/", "reason_html": "награда за то, что выжил в пламени дракона"}, {"t": "1:32:05", "kind": "spend", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "потратил вторую монету на ещё один переброс того же спасброска", "result": "итог 17 — снова не хватило, но персонаж выжил благодаря сопротивлению огню (28 урона вместо 55)", "sec": 5525, "who_url": "/c/miratorg/", "reason_html": "потратил вторую монету на ещё один переброс того же спасброска"}, {"t": "1:39:16", "kind": "earn", "who": "Мираторг", "actor": "BRB", "to": null, "reason": "растрогал дракона искренним признанием в любви — монета «за настоящие чувства»", "result": null, "sec": 5956, "who_url": "/c/miratorg/", "reason_html": "растрогал дракона искренним признанием в любви — монета «за настоящие чувства»"}, {"t": "1:48:02", "kind": "earn", "who": "Сатир Дудочник", "actor": "Сатир", "to": null, "reason": "поддержал и вдохновил Глам'Ура перед предложением руки и сердца Кристине", "result": null, "sec": 6482, "who_url": "/c/satir-dudochnik/", "reason_html": "поддержал и вдохновил Глам'Ура перед предложением руки и сердца <a class=\"ref\" href=\"/c/kristina/\">Кристине<\/a>"}, {"t": "1:48:43", "kind": "spend", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "потратил монету на переброс броска красноречия во время предложения руки и сердца", "result": "переброс сделан; по мнению мастера, для успеха хватило бы и первого результата", "sec": 6523, "who_url": "/c/glamur/", "reason_html": "потратил монету на переброс броска красноречия во время предложения руки и сердца"}, {"t": "2:03:47", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили d6, чтобы определить, сколько монет добавить в общий пул на будущее", "result": null, "sec": 7427, "who_url": null, "reason_html": "в конце выпуска бросили d6, чтобы определить, сколько монет добавить в общий пул на будущее"}], "totals": [{"who": "Мираторг", "actor": "BRB", "earned": 5, "spent": 2, "img": "img/chars/miratorg.webp", "who_url": "/c/miratorg/", "actor_url": "/p/brb/"}, {"who": "Дододис", "actor": "Александр Гудков", "earned": 0, "spent": 1, "img": "img/chars/dododis.webp", "who_url": "/c/yanus/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сатир Дудочник", "actor": "Сатир", "earned": 1, "spent": 0, "img": "img/chars/satir-dudochnik.webp", "who_url": "/c/satir-dudochnik/", "actor_url": "/p/satir/"}, {"who": "Глам'Ур", "actor": "Руслан Усачев", "earned": 0, "spent": 1, "img": "img/chars/glam-ur.webp", "who_url": "/c/glamur/", "actor_url": "/p/ruslan-usachev/"}], "notes": "В выпуске несколько «золотых монет» — это внутриигровые деньги (взятка эльфам, клад в сокровищнице, топливо для маски Януса), они отмечены как loot и не входят в totals. Часть игровых монет мастер выдавал без называния получателя или причины («не скажу за что»)."}, "cast": [{"name": "Дододис", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "эльф, торговец; маг-некромант в золотой маске Януса", "role": "", "fate": "погиб (сброшен драконом в жерло Нергала)", "id": "Янус", "url": "/c/yanus/", "img": "img/chars/dododis.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на Короля"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}]}, {"name": "Сатир Дудочник", "actor": "Сатир", "actor_url": "/p/satir/", "race": "сатир, бард-флейтист, пародист", "role": "", "fate": "выжил", "id": "Дудочник", "url": "/c/sa
