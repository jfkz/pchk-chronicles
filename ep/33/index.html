<script>window.EPD = {"anim": false, "key": "33", "label": "33", "title": "Зверь Фест", "date": "2024-12-14", "minutes": 99, "duration": 5942.0, "video_id": "aalb4uiuRyo", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Фестиваль Зверьфест в Гнилой Лощине, пригород Кёнигпона", "short_html": "Клан Балан охраняет фестиваль оборотней Зверьфест, где пропадают посетители.", "summary_html": "Охранная гильдия оборотней «Лунный волк» не смогла охранять ежегодный фестиваль звериной культуры Зверьфест в Гнилой Лощине, и столичные оборотни попросили о помощи вампирский клан Балан — <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> возвращает долг чести. Поиски пропавшего мужа-«лисёнка» <a class=\"ref\" href=\"/c/per/\">Пьера<\/a> выводят героев на заговор адских гномов — красных колпаков, переодетых волонтёрами: собирая обрывки рецепта, они понимают, что готовится ритуал «Лунной ярости». Восходит кровавая луна, и все, кто в зачарованных масках, начинают убивать. Герои снимают маски с обезумевших, Дина уводит толпу за пределы пентаграммы, а Дан Балан переворачивает котёл с бульоном в кафе «Мясной пир» и прерывает ритуал. Стоявшая за этим старуха-ведьма Корга уходит, обещая новую встречу.", "outcome_html": "Ритуал сорван, фестиваль спасён; ведьма Корга сбежала, <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> на грани смерти.", "world_html": ["Клан Балан вернул долг чести оборотням", "У клана появился новый враг — ведьма Корга с могущественным покровителем", "Адские гномы (красные колпаки) действуют в окрестностях столицы"], "scenes": [{"t": "0:01:15", "sec": 75, "html": "Пролог: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> едут в столицу; Бек вспоминает, что «Багровый закат» со взрывчаткой уплыл к <a class=\"ref\" href=\"/place/nergal/\">Нергалу<\/a> (связь с #32). Пересказ: клан освободил <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Сосунеску<\/a>, ударил по высшему вампирскому совету на фабрике крови (где погиб Вампирбек), сорвал план «Чёрное небо» в гномьем городе; Дан Балан оживил сына в теле кованого рыцаря."}, {"t": "0:04:50", "sec": 290, "html": "Завязка: фестиваль Зверьфест организуют оборотни, чтобы снизить страх людей и поддержать страдающих ликантропией. Гильдия «Лунный волк» не может дать охрану (проблемы с налогами и лицензиями), поэтому община оборотней обращается к клану Балан."}, {"t": "0:05:40", "sec": 340, "html": "Представление: <a class=\"ref\" href=\"/c/dina-nikitina/\">Дина Никитина<\/a> — демоница, некогда остановившая адский апокалипсис, теперь прожигает жизнь в столице; познакомилась с Даном Баланом на оргии и поехала следить, чтобы он не изменял. <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> — оборотень из клана организаторов; <a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a> — прошлым летом покусанная «свинёнком» девушка, ставшая кабанихой."}, {"t": "0:12:50", "sec": 770, "html": "У входа <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> находит пепел; Дина определяет — сожжён лунный камень для ритуала. Организаторы-оборотни Глен, Фиона и Педан выдают значки охраны и уверяют, что всё спокойно."}, {"t": "0:16:50", "sec": 1010, "html": "Девушка просит найти пропавшего мужа <a class=\"ref\" href=\"/c/per/\">Пьера<\/a> в костюме лисёнка, намазавшегося бобровой струёй. <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> берёт след. Группа разделяется: <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> идёт к колесу обозрения."}, {"t": "0:19:17", "sec": 1157, "html": "Навязчивая волонтёрка с масками заставляет всех надеть звериные маски (бобёр, свинья); <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> в облике гибрида запугивает её и узнаёт, что «лис» ушёл от жены в зону животной страсти."}, {"t": "0:24:07", "sec": 1447, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> трясёт хомяка-сборщика пожертвований <a class=\"ref\" href=\"/c/fyodor/\">Фёдора<\/a> и вытряхивает у него из щёк две украденные монеты. [0:28:45] Остальные находят в мусорке первый обрывок пергамента с описанием ритуала (красная луна, «зачарованные» внутри сходят с ума)."}, {"t": "0:30:30", "sec": 1830, "html": "У колеса обозрения <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> прыжком на 9 м замечает «лиса» в люльке. Два волонтёра в красных колпаках, снявшие цепи с привода, атакуют его топорами."}, {"t": "0:36:00", "sec": 2160, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> призывает Дину <a class=\"ref\" href=\"/p/nikita-nikitin/\">Никитину<\/a> через отражение («Пиковая дама, приди» трижды). Бой: Дина насылает блох и душит, её зомби-собака Гриша плюётся кислотой (и оказывается разрублена пополам), Бек жжёт огнём. Убитые волонтёры превращаются в обгорелых гномоподобных существ в красных колпаках."}, {"t": "0:42:13", "sec": 2533, "html": "Умирающий «мозг операции» проговаривается: использовано пять лунных камней, готовится «кровавая баня». <a class=\"ref\" href=\"/c/per/\">Пьер<\/a> найден в люльке мёртвым и обескровленным; Дина говорит с его трупом: его убили в зоне животной страсти. Второй допрос мёртвого «мозга»: ритуал не остановить, способ — в недостающем куске рецепта."}, {"t": "0:49:20", "sec": 2960, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пытается починиться и открывает способность «масло»; Дина сшивает Гришу (одно здоровье)."}, {"t": "0:52:11", "sec": 3131, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> и <a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a> в палатке «Зона животной страсти»: ещё одно пепелище лунного камня. Лиса <a class=\"ref\" href=\"/c/florenta/\">Флорента<\/a> пристаёт к Джейкоку и незаметно выдёргивает волос у Дана Балана (он забирает волос обратно)."}, {"t": "0:57:25", "sec": 3445, "html": "<a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a> разыгрывает у Дана Балана «сердечный приступ»; козочка Дереза хлещет «мёртвого» деда плетью. [1:02:36] <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> приковывает <a class=\"ref\" href=\"/c/florenta/\">Флоренту<\/a> наручниками; Бейба ценой «хрюканья» попадает в балдахин к волку."}, {"t": "1:06:55", "sec": 4015, "html": "<a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> находит в балдахине запах крови <a class=\"ref\" href=\"/c/per/\">Пьера<\/a> — убит здесь."}, {"t": "1:09:01", "sec": 4141, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> нащупывает иллюзию: козочка — замаскированный адский гном. Он выпивает её, но адская кровь вызывает рвоту; в костюме — двуручный топор."}, {"t": "1:13:45", "sec": 4425, "html": "<a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a> находит под подушкой третий обрывок — рецепт ритуала «Лунной ярости»: зачарованные предметы (маски) вымочить в бульоне, сжечь пять лунных камней по вершинам пентаграммы, в центре — котёл с бульоном, свежая кровь жертвы и волос оборотня. На две минуты носители зачарованных предметов внутри пентаграммы сходят с ума и убивают. <a class=\"ref\" href=\"/c/florenta/\">Флорента<\/a> исчезает из наручников."}, {"t": "1:15:41", "sec": 4541, "html": "Восходит кровавая луна; по всему фестивалю люди в масках нападают на других. Девушка-кошка — та самая волонтёрка с масками — загрызает мужчину."}, {"t": "1:17:36", "sec": 4656, "html": "Челюсти-фамильяры Дана Балана собирают всех у кафе «Мясной пир». Дина срывает маску с «кошки» — морок спадает (снятие маски снимает проклятие)."}, {"t": "1:19:53", "sec": 4793, "html": "В кафе работники наслаждаются хаосом: красные колпаки метают ножи, уродливая старуха Корга варит бульон в чане — это центр пентаграммы. <a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a> и <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> атакуют Коргу; она призывает огненную гиену; выясняется, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> когда-то «лишил её девственности». Корга хочет открыть приют для сирот и пожирать детей."}, {"t": "1:25:57", "sec": 5157, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> бьёт Коргу «мечом Бесогона» (вязаным), но она выживает. Молния Корги валит <a class=\"ref\" href=\"/c/dzheykob/\">Джейкока<\/a> (на грани смерти); <a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a> падает и встаёт."}, {"t": "1:30:45", "sec": 5445, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> открывает способность «дымовая шашка»; Дина со сцены приказывает всем снять маски и уводит одержимую толпу в лес, за пределы пентаграммы."}, {"t": "1:33:58", "sec": 5638, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> перерубает цепь и мечом-рычагом опрокидывает котёл — ритуал прерван, луна перестаёт быть красной, люди приходят в себя."}, {"t": "1:36:43", "sec": 5803, "html": "Корга выходит из дыма и обещает Дану Балану: «Мы ещё встретимся» — и исчезает. <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a> на грани жизни и смерти (<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> раздумывает, не укусить ли его). 90 000 руб. — на благотворительность."}], "key_events": [{"t": "0:04:50", "sec": 290}, {"t": "0:16:50", "sec": 1010}, {"t": "0:36:00", "sec": 2160}, {"t": "0:44:20", "sec": 2660}, {"t": "1:09:01", "sec": 4141}, {"t": "1:13:45", "sec": 4425}, {"t": "1:15:41", "sec": 4541}, {"t": "1:19:53", "sec": 4793}, {"t": "1:33:58", "sec": 5638}, {"t": "1:36:43", "sec": 5803}], "coins": {"ep": "33", "events": [{"t": "0:09:52", "kind": "loot", "who": "Джейкок", "actor": "Слава Бустер", "to": null, "reason": "по предыстории персонажа прохожие на площади бросают ему медные монеты за уличные выступления", "result": null, "sec": 592, "who_url": "/c/dzheykob/", "reason_html": "по предыстории персонажа прохожие на площади бросают ему медные монеты за уличные выступления"}, {"t": "0:24:19", "kind": "loot", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "у персонажа нет даже медных монет, чтобы пожертвовать в благотворительный ящик", "result": null, "sec": 1459, "who_url": "/c/vampir-bek/", "reason_html": "у персонажа нет даже медных монет, чтобы пожертвовать в благотворительный ящик"}, {"t": "0:26:07", "kind": "loot", "who": "Джейкок", "actor": "Слава Бустер", "to": null, "reason": "обещает хомяку медную монетку из чужих пожертвований, если тот поможет с информацией", "result": null, "sec": 1567, "who_url": "/c/dzheykob/", "reason_html": "обещает хомяку медную монетку из чужих пожертвований, если тот поможет с информацией"}, {"t": "0:26:51", "kind": "loot", "who": "Джейкок", "actor": "Слава Бустер", "to": null, "reason": "нашёл две золотые монеты во рту хомяка-воришки", "result": null, "sec": 1611, "who_url": "/c/dzheykob/", "reason_html": "нашёл две золотые монеты во рту хомяка-воришки"}, {"t": "0:33:36", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "работник аттракциона просит монету за починку колеса обозрения, но у группы денег нет", "result": null, "sec": 2016, "who_url": null, "reason_html": "работник аттракциона просит монету за починку колеса обозрения, но у группы денег нет"}, {"t": "0:47:52", "kind": "loot", "who": "Дина Никитина", "actor": "Ирина Мягкова", "to": null, "reason": "нашла золотую монету в кармане мёртвого гнома", "result": null, "sec": 2872, "who_url": "/c/dina-nikitina/", "reason_html": "нашла золотую монету в кармане мёртвого гнома"}, {"t": "0:51:12", "kind": "spend", "who": "Дина Никитина", "actor": "Ирина Мягкова", "to": null, "reason": "потратила монету на переброс сложной проверки медицины (сложность 18), чтобы срастить и оживить собаку", "result": "переброс дал 17, но с бонусом мудрости +2 проверка засчитана", "sec": 3072, "who_url": "/c/dina-nikitina/", "reason_html": "потратила монету на переброс сложной проверки медицины (сложность 18), чтобы срастить и оживить собаку"}, {"t": "1:17:34", "kind": "earn", "who": "Дан Балан", "actor": "Александр Гудков", "to": null, "reason": "получил монету за находчивый план — отправил зачарованные челюсти собрать всю банду у кафе", "result": null, "sec": 4654, "who_url": "/c/dan-balan/", "reason_html": "получил монету за находчивый план — отправил зачарованные челюсти собрать всю банду у кафе"}, {"t": "1:29:52", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета «за невероятное совпадение» при одновременных спасбросках троих игроков (Дан Балан, Бейба, Джейкок) — получатель мастером не назван", "result": null, "sec": 5392, "who_url": null, "reason_html": "монета «за невероятное совпадение» при одновременных спасбросках троих игроков (<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/c/beyba/\">Бейба<\/a>, <a class=\"ref\" href=\"/c/dzheykob/\">Джейкок<\/a>) — получатель мастером не назван"}, {"t": "1:34:11", "kind": "spend", "who": "Дан Балан", "actor": "Александр Гудков", "to": null, "reason": "потратил монету на переброс атаки мечом по цепям котла", "result": "переброс удался — цепь разрублена, котёл держится на двух цепях", "sec": 5651, "who_url": "/c/dan-balan/", "reason_html": "потратил монету на переброс атаки мечом по цепям котла"}, {"t": "1:35:14", "kind": "spend", "who": "Дан Балан", "actor": "Александр Гудков", "to": null, "reason": "потратил вторую монету на переброс проверки силы, чтобы опрокинуть котёл", "result": "итог 14 хватило — котёл перевёрнут", "sec": 5714, "who_url": "/c/dan-balan/", "reason_html": "потратил вторую монету на переброс проверки силы, чтобы опрокинуть котёл"}, {"t": "1:37:58", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили кубик, чтобы определить сумму на благотворительность — вышло 90 000 руб.", "result": null, "sec": 5878, "who_url": null, "reason_html": "в конце выпуска бросили кубик, чтобы определить сумму на благотворительность — вышло 90 000 руб."}], "totals": [{"who": "Дан Балан", "actor": "Александр Гудков", "earned": 1, "spent": 2, "img": "img/chars/dan-balan.webp", "who_url": "/c/dan-balan/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Дина Никитина", "actor": "Ирина Мягкова", "earned": 0, "sp
