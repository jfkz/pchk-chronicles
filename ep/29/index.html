<script>window.EPD = {"anim": false, "key": "29", "label": "29", "title": "Отель \"Глубокий канал\"", "date": "2024-08-29", "minutes": 130, "duration": 7788.0, "video_id": "oflt0oNWTpQ", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Отель «Глубокий канал» на набережной в столице Кёнигпон", "short_html": "Чтобы вылечить Лёшу от души кентавра, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> проникают в отель «Глубокий канал» за душесосом <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>.", "summary_html": "После ловушки <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (22) младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, Избранное чадо, от пережитых видений сходит с ума и считает себя могучим кентавром <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалосом<\/a>. Излечить его может артефакт «душесос» (эктоплазматический аспиратор «<a class=\"ref\" href=\"/a/dushesos-daysol/\">Дайсол<\/a>»), который Янус привезёт на конференцию торговцев в столичный отель «Глубокий канал». <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> с двумя тайными агентами стражи, <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a> и <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытусом<\/a>, проникают в отель и выясняют, что его захватили вампиры высшего совета во главе с Боеном Гробовым, которые собираются взорвать всю криминальную верхушку столицы. Герои временно объединяются с вампирами, но в итоге сами взрывают их бочки с порохом: гибнут вампиры, Боен Гробов и вся преступная верхушка. Раненый Янус отдаёт душесос «божественному чаду» и скрывается; душу кентавра переселяют в гоблина <a class=\"ref\" href=\"/c/biktor/\">Биктора<\/a>, а Лёша приходит в себя.", "outcome_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> исцелён, душа кентавра в теле гоблина <a class=\"ref\" href=\"/c/biktor/\">Биктора<\/a>; погибли Боен Гробов и вся преступная верхушка столицы, <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> сбежал.", "world_html": ["Уничтожена криминальная верхушка столицы (взрыв в отеле «Глубокий канал»)<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дододис поплыл без наёмников\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дододис поплыл без наёмников<\/b> Спасение сестры было личным делом <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a>, а не Януса. К тому же преступную организацию Януса и всех, с кем он работал, уничтожили в #29: в городе грядёт передел. Раскрытый и ожидающий нового покушения, Дододис обратился к тем, кому, как ему казалось, мог доверять. <span class=\"note\">Подкаст по #32 · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8518\" target=\"_blank\" rel=\"noopener\">2:21:58 ↗<\/a> · <a href=\"#qa32-31\">к записи<\/a><\/span><\/span>", "Погиб член высшего вампирского совета Боен Гробов", "Высший вампирский совет охотится на <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиры узнали о Янусе из рапорта городской стражи\">28<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиры узнали о Янусе из рапорта городской стражи<\/b> После #29 стражники под прикрытием <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, выяснявшие, не Янус ли эльф <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, написали рапорт. Видимо, у вампиров есть свой человек в страже, который читает такие рапорты. <span class=\"note\">Подкаст по #32 · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8453\" target=\"_blank\" rel=\"noopener\">2:20:53 ↗<\/a> · <a href=\"#qa32-30\">к записи<\/a><\/span><\/span>", "Гоблин <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> теперь носит душу кентавра <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a>", "<a class=\"ref\" href=\"/a/zolotaya-maska-yanusa/\">Маска Януса<\/a> хочет, чтобы её носил <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>"], "scenes": [{"t": "0:00:53", "sec": 53, "html": "«Ранее»: семья каннибалов из таверны «Кайф» стала «Отрядом Солнца»; эльф-торговец <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> оказался главарём преступного мира Янусом и по заказу Тёмного Властелина устроил им ловушку, от которой спасло прорицание Лёши. Пролог: Дододис спорит с голосом маски Януса («в этом мире продаётся всё») и обещает любимой <a class=\"ref\" href=\"/c/kristina/\">Кристиночке<\/a> избавиться от маски."}, {"t": "0:05:42", "sec": 342, "html": "Завязка: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> считает себя кентавром; друид подсказал, что вылечит его «душесос». Капитан стражи Мухомор выделил <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> двух агентов, чтобы проверить, что Янус — это <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, и арестовать его.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: История душесоса «Дайсол» (вырезана из выпуска)\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>История душесоса «Дайсол» (вырезана из выпуска)<\/b> Из сценария зачитали историю, которую мастер прочитал на съёмке, но её вырезали. <a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос «Дайсол<\/a>» разработали гномы-изобретатели в городе <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змий Хрустальный<\/a> для военных целей: из фей высасывали души, чтобы делать волшебное оружие и доспехи (так создаются артефакты вроде Щита Чёрного Властелина и маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>). Потом его продавали гражданским для ловли призраков, но это вызвало всплеск преступности; душесосы запретили и уничтожали, уцелели единицы, если не один. Механика основана на заклинании Magic Jar. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4100\" target=\"_blank\" rel=\"noopener\">1:08:20 ↗<\/a> · <a href=\"#qa29-15\">к записи<\/a><\/span><\/span>"}, {"t": "0:12:38", "sec": 758, "html": "Трёхэтажный отель «Глубокий канал» на набережной одноимённого канала, 9-я ежегодная конференция торговцев и предпринимателей. Маскировка: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> — «эскортница» в одеяле и с агрессивным макияжем, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — «сумка» и загримирован; <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> гримирует всех. <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> с чемоданом входит в отель.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Глаз на шраме Юлиана нарисовал Чрездевиц\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Глаз на шраме Юлиана нарисовал Чрездевиц<\/b> Нарисованный глаз на месте шрама <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> появился в #29: это был макияж, который сделал ему <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=5251\" target=\"_blank\" rel=\"noopener\">1:27:31 ↗<\/a> · <a href=\"#qa31-29\">к записи<\/a><\/span><\/span>"}, {"t": "0:17:41", "sec": 1061, "html": "Кобыла у повозки «подмигивает» <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалосу<\/a>; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> бьёт её книжкой и получает копытом, <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> — отравленным кинжалом, лошадь кусает <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>. Возница уезжает, а стражники помогают «хромой даме» войти в отель."}, {"t": "0:25:22", "sec": 1522, "html": "Фойе: администраторша, носильщик, двое наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> на входе. <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> получает психический урон, когда ведёт себя как ребёнок, и «по-кентаврьи» мочится на ковёр (из него вылетает камень), а <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> под шумок крадёт ключ от номера 3 и план эвакуации. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> крадёт две монеты.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Психический урон Буцефалоса — механика раздвоения личности\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Психический урон Буцефалоса — механика раздвоения личности<\/b> Мастер пояснил, что <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> получал психический урон, когда вспоминал, что он ребёнок, и пытался действовать как <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>. В мире игры у Лёши диссоциативное расстройство личности, и борьба двух личностей наносила урон. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=444\" target=\"_blank\" rel=\"noopener\">0:07:24 ↗<\/a> · <a href=\"#qa29-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранная NPC: бывшая Подприкрытуса Аника\">18<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранная NPC: бывшая Подприкрытуса Аника<\/b> На первом этаже отеля была девушка, знакомая <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытуса<\/a>: его бывшая Аника, упомянутая на одном из подкастов. Мастер хотел через неё дать персонажу немного драматического конфликта, но Подприкрытус действовал слишком эффективно и обошёл эту сцену. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4522\" target=\"_blank\" rel=\"noopener\">1:15:22 ↗<\/a> · <a href=\"#qa29-19\">к записи<\/a><\/span><\/span>"}, {"t": "0:34:45", "sec": 2085, "html": "Список гостей: 1 — Джек Куклочёт, 2 — «Трансцио», 3 — <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, 4 — <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a>, 5 — эльф <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, 6 — господин Зуб, 7 — Стинки, 8 — <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a>. Предполагаемое место тайной встречи — большой зал на третьем этаже.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кто был на собрании преступной верхушки\">20<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кто был на собрании преступной верхушки<\/b> Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12). <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 ↗<\/a> · <a href=\"#qa29-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Трансакцио усыпили клофелинщицы, у него был пропуск наверх\">22<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Трансакцио усыпили клофелинщицы, у него был пропуск наверх<\/b> Трансакцио — владелец кредитной организации «Дам вам нал» (из вып. 18). Его не было на собрании: в номер 2 сначала стучались <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, и там был слышен лишь шорох. На самом деле клофелинщицы усыпили его, а у него можно было взять пропуск на третий этаж. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4823\" target=\"_blank\" rel=\"noopener\">1:20:23 ↗<\/a> · <a href=\"#qa29-24\">к записи<\/a><\/span><\/span>"}, {"t": "0:44:12", "sec": 2652, "html": "Громила <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a> требует ключ и смотрит в одну точку: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> понимает, что он зачарован. Управляющий «<a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a>» заклинанием пытается заставить Юлиана отдать ключ; ключ отдают, и Юлиан с <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a> идут за Кабаном. <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> и <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a> выводят на улицу, в саду они убивают двух наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (Буцефалос — топорами и копытами)."}, {"t": "1:00:04", "sec": 3604, "html": "<a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> под зельем невидимости поднимается на второй этаж и замечает снятые со стен зеркала (нежить). В номере 5 (<a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>) — фото полной эльфийки «<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>» и чемодан нарядов; он забирает платье с декольте. Потом прячется под кроватью в номере 3.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранная сцена: собрание преступной верхушки\">16<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранная сцена: собрание преступной верхушки<\/b> Если бы <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> прошёл проверку внимания в номере 5 и нашёл шкаф-муляж, он поднялся бы в скрытности на третий этаж и подсмотрел собрание преступной верхушки города. Для этого ему и давали скрытность. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4399\" target=\"_blank\" rel=\"noopener\">1:13:19 ↗<\/a> · <a href=\"#qa29-17\">к записи<\/a><\/span><\/span>"}, {"t": "1:04:58", "sec": 3898, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> подслушивают сутенёра <a class=\"ref\" href=\"/c/lester/\">Лестера<\/a> (номер 4), который муштрует девушек для «толстосумов»; Лестер предлагает девушек за золото. Юлиан вызывает дух мёртвой крысы и заражается трупным ядом, но забирает чумную крысу с собой."}, {"t": "1:10:38", "sec": 4238, "html": "<a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> в форме охранника тащит <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> за волосы через кухню; неестественно сильный и холодный официант выставляет их на улицу. София выведывает, что официанты «в плане» (бочки на кухне — горючее) и подчиняются Боену Гробову. Официант оказывается вампиром и кусает Софию; Буцефалос на критическом успехе сбивает его в канал, где проточная вода растворяет вампира. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> «молоком» и ягодами Софии приводит её в чувство.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: София не стала вампиром после укуса официанта\">6<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>София не стала вампиром после укуса официанта<\/b> Укус вампира-официанта был просто питьём крови, обмена кровью не было. В мире ПЧК, в отличие от ликантропии (её передаёт укус с шансом примерно 50 на 50), вампиром становятся только с согласия: вампир должен выпить часть твоей крови и влить свою. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2460\" target=\"_blank\" rel=\"noopener\">0:41:00 ↗<\/a> · <a href=\"#qa29-5\">к записи<\/a><\/span><\/span>"}, {"t": "1:24:33", "sec": 5073, "html": "Номер 3: зачарованный <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a> приглашает вампиров-официантов, и те крепят бочки с порохом под потолком, чтобы взрыв пробил проход в зал на третьем этаже и уничтожил собравшихся. Входит «<a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a>» — вампир Боен Гробов, который выпил настоящего управляющего и занял его место."}, {"t": "1:28:58", "sec": 5338, "html": "Конференц-зал (выступает делец из «Чучельника» с чучелами бобров). <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a>, загримированный «уродливым шпицем», тушит камин; вампира-официанта сталкивают на осиновые поленья, и он парализован. Свиток разговора с мёртвыми раскрывает план: высший вампирский совет приказал Боену Гробову уничтожить всю криминальную верхушку города, их цель — <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>."}, {"t": "1:34:54", "sec": 5694, "html": "Второй вампир предлагает союз; в северном камине спрятан труп фотографа (вспышка опасна вампирам). Герои поднимаются в номер 3 к Гробову, торгуются за душесос и маску; у <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a> находят серебряный значок стражи.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Газета в холле — подсказка про фотографа\">24<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Газета в холле — подсказка про фотографа<\/b> В газете «Вечерний <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>», которую мимоходом упомянули при описании холла, была подсказка: «на мероприятии работает наш фотограф». Это крючок к трупу фотографа в камине, а сам фотограф — подсказка, что вампиров можно ослепить вспышкой фотоаппарата. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=5622\" target=\"_blank\" rel=\"noopener\">1:33:42 ↗<\/a> · <a href=\"#qa29-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:40:15", "sec": 6015, "html": "<a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> выскакивает из-под кровати и ослепляет вампиров вспышкой фотоаппарата; все выбегают, и тифлинг из дверей огненным снарядом подрывает бочки. Вампиры и Боен Гробов гибнут, потолок обрушивается, криминальная верхушка столицы горит.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Нейт был стукачом стражи, Янус высосал его душу\">17<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Нейт был стукачом стражи, Янус высосал его душу<\/b> Господин <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a>, торговец пижамами из «Мира хлопка» и участник заговора против короля (вып. 8), сидел в тюрьме. Его выпустили в обмен на сотрудничество со стражей, и на собрание он пришёл с записывающим камнем. <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> его вычислил и в несыгранной катсцене высосал из него душу душесосом. Нейт погиб до взрыва, а не при нём. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a> в списке «вероятно, погибли при взрыве» — по словам авторов, его ещё до взрыва казнил <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>: высосал душу душесосом, разоблачив как осведомителя стражи.<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4399\" target=\"_blank\" rel=\"noopener\">1:13:19 ↗<\/a> · <a href=\"#qa29-18\">к записи<\/a><\/span><\/span>"}, {"t": "1:44:41", "sec": 6281, "html": "Раненый <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> с душесосом смотрит сверху и убегает. <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> поднимаются на кошке-крюке; путь преграждает гоблин <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> («предатель», старый напарник Юлиана), ранит Подприкрытуса в колени и падает от отравленного болта; Юлиан стабилизирует его и несёт в слинге.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Янус и Биктор выжили при взрыве\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Янус и Биктор выжили при взрыве<\/b> На собрании <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> и его личный охранник <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> (с футляром, где лежал душесос) выступали в северной части зала, а стол стоял ближе к южной, где был взрыв. Поэтому остальных убило, а Януса и Биктора лишь ранило. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4584\" target=\"_blank\" rel=\"noopener\">1:16:24 ↗<\/a> · <a href=\"#qa29-20\">к записи<\/a><\/span><\/span>"}, {"t": "1:52:40", "sec": 6760, "html": "Наёмники <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> на лестнице: <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> «песней паралича» (рэп «АК-47») парализует одного. <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> проламывает стену телом наёмника и открывает спрятанную за шкафом-муляжом винтовую лестницу; по следам крови он настигает Януса у кухни первого этажа. <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> находит сосуд для душесоса и инструкцию.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Песнь паралича действует на одну цель, спас-бросок кидает мастер\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Песнь паралича действует на одну цель, спас-бросок кидает мастер<\/b> Песнь паралича (рэп «АК-47») <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a> была прописана как заклинание на одну цель, поэтому парализовало одного наёмника. Бросок на экране был спас-броском NPC против фиксированной сложности 13 Чрездевица: для такой пассивной проверки мастеру нужно выбросить как можно меньше. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3584\" target=\"_blank\" rel=\"noopener\">0:59:44 ↗<\/a> · <a href=\"#qa29-12\">к записи<\/a><\/span><\/span>"}, {"t": "2:01:58", "sec": 7318, "html": "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> узнаёт «божественное чадо»; <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> блефует, что всё это спланировал он. Маска говорит, что хотела бы, чтобы <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> «носил» её (маска истины Януса); Янус бросает чемодан с душесосом («честная сделка») и исчезает.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Зачем Янусу душесос\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Зачем Янусу душесос<\/b> <a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос<\/a> — ценнейший артефакт: он вытаскивает душу из любого существа, например из дракона, без боя. Душу можно пересаживать в животных и пытать, пока она не выдаст секреты. Душесос остался у героев. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4226\" target=\"_blank\" rel=\"noopener\">1:10:26 ↗<\/a> · <a href=\"#qa29-16\">к записи<\/a><\/span><\/span>"}, {"t": "2:05:32", "sec": 7532, "html": "<a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос<\/a> всасывает душу кентавра из Лёши; её выдувают в тело гоблина <a class=\"ref\" href=\"/c/biktor/\">Биктора<\/a>. <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> теперь «кентавр в теле гоблина», <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> приходит в себя. Итог: 6 монет (60 000 руб.) уходят на благотворительность.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Почему душу кентавра переселили в Биктора\">4<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Почему душу кентавра переселили в Биктора<\/b> Авторы объяснили, что у <a class=\"ref\" href=\"/p/shakulin/\">Шакулина<\/a> не было собственного визуального образа для иллюстраций: на картинках действий рисовали Лёшу с призраком кентавра. <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> — уже готовый персонаж со своим образом, поэтому душу поселили в него; новый Биктор получит черты кентавра. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=1743\" target=\"_blank\" rel=\"noopener\">0:29:03 ↗<\/a> · <a href=\"#qa29-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Других вариантов для души Буцефалоса не обсуждали\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Других вариантов для души Буцефалоса не обсуждали<\/b> На вопрос, куда ещё думали переселить кентавра, авторы ответили, что конкретных вариантов не прорабатывали: важно было выселить душу и так вылечить Лёшу. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3280\" target=\"_blank\" rel=\"noopener\">0:54:40 ↗<\/a> · <a href=\"#qa29-10\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:05:42", "sec": 342}, {"t": "0:25:22", "sec": 1522}, {"t": "1:00:04", "sec": 3604}, {"t": "1:18:14", "sec": 4694}, {"t": "1:24:33", "sec": 5073}, {"t": "1:32:55", "sec": 5575}, {"t": "1:40:15", "sec": 6015}, {"t": "1:46:19", "sec": 6379}, {"t": "2:01:58", "sec": 7318}, {"t": "2:05:40", "sec": 7540}], "coins": {"ep": "29", "events": [{"t": "0:36:20", "kind": "loot", "who": "София", "actor": "BRB", "to": null, "reason": "Работая на ресепшене отеля, ловко (проверка ловкости рук с преимуществом) стащила две золотые монеты из-под руки коллеги-администраторши Лейлы.", "result": null, "sec": 2180, "who_url": "/c/sofiya/", "reason_html": "Работая на ресепшене отеля, ловко (проверка ловкости рук с преимуществом) стащила две золотые монеты из-под руки коллеги-администраторши Лейлы."}, {"t": "0:53:45", "kind": "earn", "who": "Буцефалос", "actor": "Шакулин", "to": null, "reason": "Совершил своё первое убийство — лягнул нападавшего копытами насмерть, защищая «мать» Софию (в теле младенца).", "result": null, "sec": 3225, "who_url": "/c/bucefalos/", "reason_html": "Совершил своё первое убийство — лягнул нападавшего копытами насмерть, защищая «мать» <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> (в теле младенца)."}, {"t": "1:06:29", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Хороший отыгрыш верности жене — сравнил предложенных девушек с фотографией своей эльфийской жены Галы и ответил «никто».", "result": null, "sec": 3989, "who_url": null, "reason_html": "Хороший отыгрыш верности жене — сравнил предложенных девушек с фотографией своей эльфийской жены Галы и ответил «никто»."}, {"t": "1:09:26", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Потратили монету, чтобы поговорить с мёртвой крысой через свиток «разговор с мёртвыми» после провала обычного разговора с животными.", "result": null, "sec": 4166, "who_url": null, "reason_html": "Потратили монету, чтобы поговорить с мёртвой крысой через свиток «разговор с мёртвыми» после провала обычного разговора с животными."}, {"t": "1:15:02", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Потратили монету на переброс обмана (харизма) при попытке убедить официанта, что они «часть плана» заговорщика Боэн Гробова.", "result": "Официант не поверил и скрылся на кухне.", "sec": 4502, "who_url": null, "reason_html": "Потратили монету на переброс обмана (харизма) при попытке убедить официанта, что они «часть плана» заговорщика Боэн Гробова."}, {"t": "1:22:05", "kind": "earn", "who": "Буцефалос", "actor": "Шакулин", "to": null, "reason": "Критический успех — разбежался и лягнул вампира-официанта своими маленькими копытами прямо в проточную воду, доказав, что он кентавр.", "result": null, "sec": 4925, "who_url": "/c/bucefalos/", "reason_html": "Критический успех — разбежался и лягнул вампира-официанта своими маленькими копытами прямо в проточную воду, доказав, что он кентавр."}, {"t": "1:25:48", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Остроумный вопрос про то, что вампиры вовсе не устойчивы к огню.", "result": null, "sec": 5148, "who_url": null, "reason_html": "Остроумный вопрос про то, что вампиры вовсе не устойчивы к огню."}, {"t": "1:36:40", "kind": "earn", "who": "Чрездевиц", "actor": "SQWOZBAB", "to": null, "reason": "Разгадал через расследование, почему фотографии вампиров не проявляются (они воспринимают вспышку как свет).", "result": null, "sec": 5800, "who_url": "/c/cherezdevic/", "reason_html": "Разгадал через расследование, почему фотографии вампиров не проявляются (они воспринимают вспышку как свет)."}, {"t": "1:40:30", "kind": "earn", "who": "Подприкрытус", "actor": "SALUKI", "to": null, "reason": "Вылез из-под кровати с камерой и ослепил вампиров вспышкой — эффектный подвиг.", "result": null, "sec": 6030, "who_url": "/c/podprikrytus/", "reason_html": "Вылез из-под кровати с камерой и ослепил вампиров вспышкой — эффектный подвиг."}, {"t": "1:49:56", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "Потратил монету на переброс проверки медицины, пытаясь стабилизировать смертельно раненного Биктора.", "result": "Неудача — не смог его спасти.", "sec": 6596, "who_url": "/c/yulian/", "reason_html": "Потратил монету на переброс проверки медицины, пытаясь стабилизировать смертельно раненного <a class=\"ref\" href=\"/c/biktor/\">Биктора<\/a>."}, {"t": "2:00:25", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "Потратил монету на переброс огненной атаки по вражескому солдату.", "result": "Критический провал — атака не удалась.", "sec": 7225, "who_url": "/c/yulian/", "reason_html": "Потратил монету на переброс огненной атаки по вражескому солдату."}], "totals": [{"who": "София", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sofiya.webp", "who_url": "/c/sofiya/", "actor_url": "/p/brb/"}, {"who": "Буцефалос", "actor": "Шакулин", "earned": 2, "spent": 0, "img": "img/chars/bucefalos.webp", "who_url": "/c/bucefalos/", "actor_url": "/p/shakulin/"}, {"who": "Чрездевиц", "actor": "SQWOZBAB", "earned": 1, "spent": 0, "img": "img/chars/chrezdevic.webp", "who_url": "/c/cherezdevic/", "actor_url": "/p/sqwozbab/"}, {"who": "Подприкрытус", "actor": "SALUKI", "earned": 1, "spent": 0, "img": "img/chars/podprikrytus.webp", "who_url": "/c/podprikrytus/", "actor_url": "/p/saluki/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 0, "spent": 2, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Несколько монетных событий в этом выпуске (за верность жене, разговор с мёртвой крысой, обман официанта, шутка про огонь) невозможно однозначно привязать к конкретному персонажу по фрагменту транскрипта — отмечены who: null. Найденные Софией на ресепшене монеты — внутриигровой лут, не отражён в totals. В конце выпуска — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие."}, "cast": [{"name": "Буцефалос", "actor": "Шакулин", "actor_url": "/p/shakulin/", "race": "дух кентавра в младенце, варвар", "role": "", "fate": "превратился — переселён в тело гоблина Биктора", "id": "Буцефалос", "url": "/c/bucefalos/", "img": "img/chars/bucefalos.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кентавр Буцефалос жил сотни лет назад\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кентавр Буцефалос жил сотни лет назад<\/b> Авторы сказали, что кентавр <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> жил в мире за 300–500, а может и за 1000 лет до событий выпуска. Поэтому игроку не нужно было знать лор: кентавр видел этот мир впервые. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=1029\" target=\"_blank\" rel=\"noopener\">0:17:09 ↗<\/a> · <a href=\"#qa29-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Реинкарнации: у души не больше 12 жизней, Буцефалос — прошлая жизнь Лёши\">8<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Реинкарнации: у души не больше 12 жизней, Буцефалос — прошлая жизнь Лёши<\/b> Душа вечна, но проходит не больше двенадцати реинкарнаций; при каждой ей стирают память (как в вып. 27). Божественным считается тело: полубожественное тело Лёши умеет вспоминать прошлые жизни и чуть расщеплять душу. Под давлением экстремальных событий оно «защитилось», вызвав из памяти самое сильное своё воплощение — кентавра <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a>. Таких воплощений в Лёше может быть не больше двенадцати; по сути он «мультиклассовый» персонаж. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2589\" target=\"_blank\" rel=\"noopener\">0:43:09 ↗<\/a> · <a href=\"#qa29-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Буцефалос в теле Биктора не получил божественной силы\">13<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Буцефалос в теле Биктора не получил божественной силы<\/b> Частичка божественности души означает лишь, что душа помнит, как была в божественном теле. Все божественные способности остались в теле Лёши; поэтому злодеям и нужно его живое тело. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3706\" target=\"_blank\" rel=\"noopener\">1:01:46 ↗<\/a> · <a href=\"#qa29-13\">к записи<\/a><\/span><\/span>"}, {"name": "София", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, друид", "role": "", "fate": "выжила", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Возраст Софии\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Возраст Софии<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сначала сказал, что <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> 17 лет, но после реплики «она родила в 14?» поправился: ей 23. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2454\" target=\"_blank\" rel=\"noopener\">0:40:54 ↗<\/a> · <a href=\"#qa29-4\">к записи<\/a><\/span><\/span>"}, {"name": "Юлиан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "человек, громила", "role": "", "fate": "выжил", "id": "Юлиан", "url": "/c/yulian/", "img": "img/chars/yulian.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Чрездевиц", "actor": "SQWOZBAB", "actor_url": "/p/sqwozbab/", "race": "бард, городской стражник", "role": "", "fate": "выжил", "id": "Черездевиц", "url": "/c/cherezdevic/", "img": "img/chars/chrezdevic.webp", "other": [{"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}]}, {"name": "Подприкрытус", "actor": "SALUKI", "actor_url": "/p/saluki/", "race": "тифлинг, шпион-убийца, городской стражник", "role": "", "fate": "выжил", "id": "Подприкрытус", "url": "/c/podprikrytus/", "img": "img/chars/podprikrytus.webp", "other": []}], "npcs": [{"name": "Младенец Лёша", "actor": "", "actor_url": null, "race": "", "role": "Избранное чадо, сын Софии", "fate": "исцелён", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Персонажи Кукушкина: Лёша «свободен», ветки придётся менять\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Персонажи Кукушкина: Лёша «свободен», ветки придётся менять<\/b> После того как <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкина<\/a> признали иностранным агентом, персонаж <a class=\"ref\" href=\"/c/lyosha/\">Лёша Пэнисов<\/a> стал «свободным» (его могут играть другие). Много веток было завязано на персонажах Кукушкина, и авторы думают, как их сохранить и развивать. Рекламодатели проверяют гостей, поэтому выпуск с Кукушкиным, если и выйдет, будет без рекламы. <span class=\"note\">Подкаст по #24 · <a href=\"https://youtu.be/KPSVRyWdrds?t=4893\" target=\"_blank\" rel=\"noopener\">1:21:33 ↗<\/a> · <a href=\"#qa24-31\">к записи<\/a><\/span><\/span>"}, {"name": "Янус / эльф Дододис", "actor": "", "actor_url": null, "race": "", "role": "главарь преступного мира столицы, носитель маски Януса", "fate": "выжил (ранен, скрылся)", "id": null, "url": null, "img": null, "other": []}, {"name": "Боен Гробов", "actor": "", "actor_url": null, "race": "", "role": "член высшего вампирского совета под личиной управляющего Генриха", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Генрих", "actor": "", "actor_url": null, "race": "", "role": "управляющий отелем", "fate": "погиб (выпит Гробовым)", "id": "Генрих", "url": "/c/genrih/", "img": "img/chars/genrih.webp", "other": [{"key": "20", "label": "20", "title": "Вампирское возмездие"}]}, {"name": "Гоблин Биктор", "actor": "", "actor_url": null, "race": "", "role": "телохранитель Януса, бывший напарник Юлиана", "fate": "превратился — в его теле теперь душа Буцефалоса", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: У Биктора одна душа — теперь это Буцефалос\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>У Биктора одна душа — теперь это Буцефалос<\/b> Когда в тело вселяют новую душу, прежняя замещается. Поэтому в гоблине теперь не <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>, а <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a>. С Лёшей механика другая: его душа не замещалась. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2528\" target=\"_blank\" rel=\"noopener\">0:42:08 ↗<\/a> · <a href=\"#qa29-6\">к записи<\/a><\/span><\/span>"}, {"name": "Кабан", "actor": "", "actor_url": null, "race": "", "role": "зачарованный постоялец номера 3", "fate": "неизвестно", "id": "Кабан", "url": "/c/kaban/", "img": null, "other": [{"key": "25", "label": "25", "title": "Остров соблазна"}]}, {"name": "Лестер", "actor": "", "actor_url": null, "race": "", "role": "сутенёр, постоялец номера 4", "fate": "неизвестно (вероятно, погиб при взрыве)", "id": "Лестер", "url": "/c/lester/", "img": "img/chars/lester.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Лестер не поднялся на собрание\">21<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Лестер не поднялся на собрание<\/b> Сутенёр <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> тоже должен был подняться на собрание, но в момент встречи оставался у себя в номере. В столицу он бежал из <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаба<\/a> после того, как халиф потерял власть. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> в списке «вероятно, погибли при взрыве», но на собрании его не было: во время встречи он оставался в своём номере.<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 ↗<\/a> · <a href=\"#qa29-22\">к записи<\/a><\/span><\/span>"}, {"name": "Кристиночка", "actor": "", "actor_url": null, "race": "", "role": "возлюбленная Дододиса (фото)", "fate": "неизвестно", "id": "Кристина", "url": "/c/kristina/", "img": "img/chars/kristina.webp", "other": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}]}, {"name": "Капитан Мухомор", "actor": "", "actor_url": null, "race": "", "role": "начальник городской стражи", "fate": "выжил", "id": "Капитан Мухомор", "url": "/c/kapitan-muhomor/", "img": "img/chars/kapitan-muhomor.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на короля"}]}, {"name": "Вампиры-официанты", "actor": "", "actor_url": null, "race": "", "role": "подручные Гробова", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}, {"name": "Фотограф", "actor": "", "actor_url": null, "race": "", "role": "убит вампирами", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "09", "label": "9", "title": "Человек в железной маске", "note_html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> (<a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a>), спутник <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "22", "label": "22", "title": "Отряд Солнца", "note_html": "ловушка Януса/<a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a>, «Отряд Солнца»", "dir": "out", "color": "#2F84C8"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "note_html": "высший вампирский совет", "dir": "out", "color": "#B03A7A"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "божественные дети как сосуды; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Покушение вампиров на <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> в отеле «Глубокий канал»", "dir": "back", "color": "#B8901C"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка", "note_html": "Отряд Солнца отобрал у <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> <a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос<\/a>", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«В этом мире продаётся всё: чувства, желания, души» — <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>.", "«Я кошка Джека Куклачёва» — <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> охраннику.", "«Чей бобёр?» — официант-вампир о загримированном «шпице».", "«Ты ещё тупее меня, раз работаешь на <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>» — <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> <a class=\"ref\" href=\"/c/biktor/\">Биктору<\/a>."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> (столица); отель «Глубокий канал» на набережной одноимённого канала (фойе, номера 1–8, номера 9 и 91 с потайной винтовой лестницей, конференц-зал, кухня, сад, веранда-ресторан); район «Адская кухня».<\/li>\n<li>Фракции: «Отряд Солнца»; городская стража; преступный мир <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; высший вампирский совет; банда «Мёртвая династия» (в прошлом).<\/li>\n<li>Артефакты: душесос — эктоплазматический аспиратор «<a class=\"ref\" href=\"/a/dushesos-daysol/\">Дайсол<\/a>» (кнопки «всос/высос», сосуд-накопитель душ); маска истины <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; бочки с порохом; фотоаппарат со вспышкой (2 заряда); свиток разговора с мёртвыми; осиновые колья; соска с коньяком; серебряный значок стражи; зелье невидимости; кошка-крюк; крюк для мяса; чумная крыса.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>29<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>29<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>6<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>13<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>3<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa24-31\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Персонажи Кукушкина: Лёша «свободен», ветки придётся менять<\/b><\/div><p>После того как <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкина<\/a> признали иностранным агентом, персонаж <a class=\"ref\" href=\"/c/lyosha/\">Лёша Пэнисов<\/a> стал «свободным» (его могут играть другие). Много веток было завязано на персонажах Кукушкина, и авторы думают, как их сохранить и развивать. Рекламодатели проверяют гостей, поэтому выпуск с Кукушкиным, если и выйдет, будет без рекламы.<\/p><blockquote>«Персонаж теперь свободный… у нас много веток завязано именно было на персонажах Кукушкина. Ну, сейчас будем думать о том, как это менять»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-31\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4893\" target=\"_blank\" rel=\"noopener\">1:21:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a>, <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Психический урон Буцефалоса — механика раздвоения личности<\/b><\/div><p>Мастер пояснил, что <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> получал психический урон, когда вспоминал, что он ребёнок, и пытался действовать как <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>. В мире игры у Лёши диссоциативное расстройство личности, и борьба двух личностей наносила урон.<\/p><blockquote>«Когда ты напоминал о том, что ты ребёнок, и пытался пользоваться способностями, как будто бы ты ребёнок, я тебе должен был психический урон.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa29/#qa29-1\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=444\" target=\"_blank\" rel=\"noopener\">0:07:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-2\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кентавр Буцефалос жил сотни лет назад<\/b><\/div><p>Авторы сказали, что кентавр <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> жил в мире за 300–500, а может и за 1000 лет до событий выпуска. Поэтому игроку не нужно было знать лор: кентавр видел этот мир впервые.<\/p><blockquote>«Этот кентавр жил там лет 300-500 назад, может и 1000 лет назад.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-2\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=1029\" target=\"_blank\" rel=\"noopener\">0:17:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa29-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему душу кентавра переселили в Биктора<\/b><\/div><p>Авторы объяснили, что у <a class=\"ref\" href=\"/p/shakulin/\">Шакулина<\/a> не было собственного визуального образа для иллюстраций: на картинках действий рисовали Лёшу с призраком кентавра. <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> — уже готовый персонаж со своим образом, поэтому душу поселили в него; новый Биктор получит черты кентавра.<\/p><blockquote>«У нас главная проблема была... что мы Васю не сможем изобразить в иллюстрациях.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa29/#qa29-3\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=1743\" target=\"_blank\" rel=\"noopener\">0:29:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-4\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Возраст Софии<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сначала сказал, что <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> 17 лет, но после реплики «она родила в 14?» поправился: ей 23.<\/p><blockquote>«Сколько лет Софии? — 17. — Что ж тогда, она родила в 14? — ...ей 23.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa29/#qa29-4\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2454\" target=\"_blank\" rel=\"noopener\">0:40:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>София не стала вампиром после укуса официанта<\/b><\/div><p>Укус вампира-официанта был просто питьём крови, обмена кровью не было. В мире ПЧК, в отличие от ликантропии (её передаёт укус с шансом примерно 50 на 50), вампиром становятся только с согласия: вампир должен выпить часть твоей крови и влить свою.<\/p><blockquote>«Он должен спросить твоего согласия, чтобы ты стал вампиром, и вылить твою кровь или часть и влить часть своей.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-5\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2460\" target=\"_blank\" rel=\"noopener\">0:41:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-6\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>У Биктора одна душа — теперь это Буцефалос<\/b><\/div><p>Когда в тело вселяют новую душу, прежняя замещается. Поэтому в гоблине теперь не <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>, а <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a>. С Лёшей механика другая: его душа не замещалась.<\/p><blockquote>«Сейчас это не Биктор, сейчас это Буцефалос. Но у Лёши не заместилось. У Лёши другая механика.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-6\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2528\" target=\"_blank\" rel=\"noopener\">0:42:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-7\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Реинкарнации: у души не больше 12 жизней, Буцефалос — прошлая жизнь Лёши<\/b><\/div><p>Душа вечна, но проходит не больше двенадцати реинкарнаций; при каждой ей стирают память (как в вып. 27). Божественным считается тело: полубожественное тело Лёши умеет вспоминать прошлые жизни и чуть расщеплять душу. Под давлением экстремальных событий оно «защитилось», вызвав из памяти самое сильное своё воплощение — кентавра <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a>. Таких воплощений в Лёше может быть не больше двенадцати; по сути он «мультиклассовый» персонаж.<\/p><blockquote>«Буцефалос, этот кентавр — это одна из реинкарнаций Лёшиной души.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-7\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2589\" target=\"_blank\" rel=\"noopener\">0:43:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa29-8\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>SALUKI летел на съёмки тремя самолётами<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> рассказал, что Арсений (<a class=\"ref\" href=\"/p/saluki/\">SALUKI<\/a>) — большой фанат шоу и давно мечтал сыграть; чтобы успеть на съёмки выпуска 29, ему пришлось лететь тремя самолётами.<\/p><blockquote>«Чтобы тремя самолётами он долетел, успел на съёмки, потому что мечтал очень.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa29/#qa29-8\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=2865\" target=\"_blank\" rel=\"noopener\">0:47:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Тифлинг может стать вампиром<\/b><\/div><p>Отвечая на вопрос, может ли тифлинг стать вампиром, сказали, что может: это живой гуманоид, а демоническая кровь ничего не меняет. Кровь демонов, ихор, просто менее питательна для вампира.<\/p><blockquote>«Может ли тифлинг стать вампиром? — Да. Это живое существо, гуманоид.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-9\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3052\" target=\"_blank\" rel=\"noopener\">0:50:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa29-10\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Других вариантов для души Буцефалоса не обсуждали<\/b><\/div><p>На вопрос, куда ещё думали переселить кентавра, авторы ответили, что конкретных вариантов не прорабатывали: важно было выселить душу и так вылечить Лёшу.<\/p><blockquote>«По-моему, мы даже не размышляли над конкретными вариантами... Нам важно было выселить душу и излечить таким образом.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-10\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3280\" target=\"_blank\" rel=\"noopener\">0:54:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Песнь паралича действует на одну цель, спас-бросок кидает мастер<\/b><\/div><p>Песнь паралича (рэп «АК-47») <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a> была прописана как заклинание на одну цель, поэтому парализовало одного наёмника. Бросок на экране был спас-броском NPC против фиксированной сложности 13 Чрездевица: для такой пассивной проверки мастеру нужно выбросить как можно меньше.<\/p><blockquote>«Песнь паралича у нас была написана как на одну цель.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-12\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3584\" target=\"_blank\" rel=\"noopener\">0:59:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-13\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Буцефалос в теле Биктора не получил божественной силы<\/b><\/div><p>Частичка божественности души означает лишь, что душа помнит, как была в божественном теле. Все божественные способности остались в теле Лёши; поэтому злодеям и нужно его живое тело.<\/p><blockquote>«Нет, всё тело, все божественные способности остались в Лёше.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-13\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3706\" target=\"_blank\" rel=\"noopener\">1:01:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-15\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>История душесоса «Дайсол» (вырезана из выпуска)<\/b><\/div><p>Из сценария зачитали историю, которую мастер прочитал на съёмке, но её вырезали. <a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос «Дайсол<\/a>» разработали гномы-изобретатели в городе <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змий Хрустальный<\/a> для военных целей: из фей высасывали души, чтобы делать волшебное оружие и доспехи (так создаются артефакты вроде Щита Чёрного Властелина и маски <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>). Потом его продавали гражданским для ловли призраков, но это вызвало всплеск преступности; душесосы запретили и уничтожали, уцелели единицы, если не один. Механика основана на заклинании Magic Jar.<\/p><blockquote>«Дайсол разработан гномами-изобретателями в городе Змий Хрустальный. Изначально он использовался в военных целях.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-15\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4100\" target=\"_blank\" rel=\"noopener\">1:08:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем Янусу душесос<\/b><\/div><p><a class=\"ref\" href=\"/a/dushesos-daysol/\">Душесос<\/a> — ценнейший артефакт: он вытаскивает душу из любого существа, например из дракона, без боя. Душу можно пересаживать в животных и пытать, пока она не выдаст секреты. Душесос остался у героев.<\/p><blockquote>«Представь себе, что у тебя есть оружие, способное вытащить душу из дракона.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-16\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4226\" target=\"_blank\" rel=\"noopener\">1:10:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa29-17\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранная сцена: собрание преступной верхушки<\/b><\/div><p>Если бы <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> прошёл проверку внимания в номере 5 и нашёл шкаф-муляж, он поднялся бы в скрытности на третий этаж и подсмотрел собрание преступной верхушки города. Для этого ему и давали скрытность.<\/p><blockquote>«Если бы он обнаружил шкаф-муляж, он бы поднялся на третий этаж... и подсмотрел за собранием.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-17\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4399\" target=\"_blank\" rel=\"noopener\">1:13:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa29-18\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Нейт был стукачом стражи, Янус высосал его душу<\/b><\/div><p>Господин <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a>, торговец пижамами из «Мира хлопка» и участник заговора против короля (вып. 8), сидел в тюрьме. Его выпустили в обмен на сотрудничество со стражей, и на собрание он пришёл с записывающим камнем. <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> его вычислил и в несыгранной катсцене высосал из него душу душесосом. Нейт погиб до взрыва, а не при нём.<\/p><blockquote>«Нейта выпустили, потому что он договорился сотрудничать с городской стражей. У него был на теле записывающий камень.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a> в списке «вероятно, погибли при взрыве» — по словам авторов, его ещё до взрыва казнил <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>: высосал душу душесосом, разоблачив как осведомителя стражи.<\/p><p class=\"note\"><a href=\"/pod/qa29/#qa29-18\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4399\" target=\"_blank\" rel=\"noopener\">1:13:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa29-19\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранная NPC: бывшая Подприкрытуса Аника<\/b><\/div><p>На первом этаже отеля была девушка, знакомая <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытуса<\/a>: его бывшая Аника, упомянутая на одном из подкастов. Мастер хотел через неё дать персонажу немного драматического конфликта, но Подприкрытус действовал слишком эффективно и обошёл эту сцену.<\/p><blockquote>«Я хотел дать немножечко конфликта. Но он слишком был эффективен и он обошёл все эти драматические нотки.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-19\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4522\" target=\"_blank\" rel=\"noopener\">1:15:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-20\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Янус и Биктор выжили при взрыве<\/b><\/div><p>На собрании <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> и его личный охранник <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> (с футляром, где лежал душесос) выступали в северной части зала, а стол стоял ближе к южной, где был взрыв. Поэтому остальных убило, а Януса и Биктора лишь ранило.<\/p><blockquote>«Они были в северной части комнаты... и взрыв был в южной. Поэтому убило вот этих, а Януса и Биктора ранило.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-20\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4584\" target=\"_blank\" rel=\"noopener\">1:16:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кто был на собрании преступной верхушки<\/b><\/div><p>Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12).<\/p><blockquote>«Это были те же люди, что в списке на заселение? — Нет, там ещё часть людей была дополнительно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-21\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa29-22\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Лестер не поднялся на собрание<\/b><\/div><p>Сутенёр <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> тоже должен был подняться на собрание, но в момент встречи оставался у себя в номере. В столицу он бежал из <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаба<\/a> после того, как халиф потерял власть.<\/p><blockquote>«Лестер был ещё у себя в номере в тот момент... должен был подняться туда наверх, но он не поднялся.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep29.md: <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a> в списке «вероятно, погибли при взрыве», но на собрании его не было: во время встречи он оставался в своём номере.<\/p><p class=\"note\"><a href=\"/pod/qa29/#qa29-22\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-24\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Трансакцио усыпили клофелинщицы, у него был пропуск наверх<\/b><\/div><p>Трансакцио — владелец кредитной организации «Дам вам нал» (из вып. 18). Его не было на собрании: в номер 2 сначала стучались <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, и там был слышен лишь шорох. На самом деле клофелинщицы усыпили его, а у него можно было взять пропуск на третий этаж.<\/p><blockquote>«Там, на самом деле, были клофелинщицы, которые его усыпили. И у него можно было пропуск на третий этаж получить.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-24\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4823\" target=\"_blank\" rel=\"noopener\">1:20:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa29-25\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Марат заменил заболевшего Андрея Токсиса<\/b><\/div><p>Изначально в выпуске 29 должны были играть <a class=\"ref\" href=\"/p/saluki/\">SALUKI<\/a> и <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> Токсис. Токсис заболел за два дня до съёмки, и его заменил Марат (<a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a>), которого выдернули из конного похода с женой.<\/p><blockquote>«За 2 дня до мотора этого выпуска у нас должен был быть Салуки и Андрей Токсис. Токсис заболел, и мы набрали Марата.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-25\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=5332\" target=\"_blank\" rel=\"noopener\">1:28:52 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Газета в холле — подсказка про фотографа<\/b><\/div><p>В газете «Вечерний <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>», которую мимоходом упомянули при описании холла, была подсказка: «на мероприятии работает наш фотограф». Это крючок к трупу фотографа в камине, а сам фотограф — подсказка, что вампиров можно ослепить вспышкой фотоаппарата.<\/p><blockquote>«Там была подсказка про фотографа... Это был такой вот крючок на фотографа, который потом сработал в камине.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-26\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=5622\" target=\"_blank\" rel=\"noopener\">1:33:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa30-18\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Люций Пален погиб — «ветвь рода Пэнисовых отрублена»<\/b><\/div><p>Авторы подтвердили, что удар <a class=\"ref\" href=\"/c/kudrigar/\">Кудрегара<\/a> убил ребёнка. Воскресить его зельями нельзя: решение игроков зафиксировано, и менять его авторы не будут. По их словам, этим «отрублена ветвь рода Пэнисовых», то есть <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a> был из потомков <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Смерть намеренно не показали на экране.<\/p><blockquote>«Это ветвь рода Пэнисовых отрублена... мы даже авторски не будем менять это решение, потому что это решение игроков за столом.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep30.md: «судьба <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> неизвестна», «возможная связь с <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт Пален<\/a>, прямо не подтверждено» — по словам авторов, Люций погиб окончательно, а его смерть «отрубила ветвь рода Пэнисовых», то есть мальчик — потомок <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> (сын его бывшей Кейт Пален).<\/p><p class=\"note\"><a href=\"/pod/qa30/#qa30-18\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=5821\" target=\"_blank\" rel=\"noopener\">1:37:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa30-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндону остались только два потомка — Эрик и Лёша<\/b><\/div><p><a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон (Тёмный Властелин)<\/a> должен вселиться в божественное тело своего потомка, чтобы попасть в небесный мир. После гибели <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> в живых остались только <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> (неизвестно, жив ли он) и <a class=\"ref\" href=\"/c/lyosha/\">Лёша Пэнисов<\/a>.<\/p><blockquote>«Брэндон должен вселиться в своего потомка. Из потомков Брэндона в живых остались только Эрик Пэнисов... и остался Лёша Пэнисов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-20\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=6039\" target=\"_blank\" rel=\"noopener\">1:40:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-29\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Глаз на шраме Юлиана нарисовал Чрездевиц<\/b><\/div><p>Нарисованный глаз на месте шрама <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> появился в #29: это был макияж, который сделал ему <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>.<\/p><blockquote>«в двадцать девятом выпуске это ему нарисовал Чрездевиц, макияж сделал»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-29\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=5251\" target=\"_blank\" rel=\"noopener\">1:27:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa32-30\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампиры узнали о Янусе из рапорта городской стражи<\/b><\/div><p>После #29 стражники под прикрытием <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, выяснявшие, не Янус ли эльф <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a>, написали рапорт. Видимо, у вампиров есть свой человек в страже, который читает такие рапорты.<\/p><blockquote>«видимо, у вампиров есть в полиции кто-то свой, кто читает эти рапорты»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-30\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8453\" target=\"_blank\" rel=\"noopener\">2:20:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa32-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Дододис поплыл без наёмников<\/b><\/div><p>Спасение сестры было личным делом <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a>, а не Януса. К тому же преступную организацию Януса и всех, с кем он работал, уничтожили в #29: в городе грядёт передел. Раскрытый и ожидающий нового покушения, Дододис обратился к тем, кому, как ему казалось, мог доверять.<\/p><blockquote>«Это не выбор Януса, это выбор Дододиса»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-31\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8518\" target=\"_blank\" rel=\"noopener\">2:21:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><\/section>", "chars": {"Лестер": {"name": "Лестер", "img": "img/chars/lester.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D0%B5%D1%81%D1%82%D0%B5%D1%80", "summary": "Лестер - распорядитель гарема халифа Теймураза.", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Неигровой"}, "actors": [], "kind": "npc", "dead": true, "race": "Человек", "portraits": [], "url": "/c/lester/", "eps": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}]}, "София": {"name": "София", "img": "img/chars/sofiya.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D0%BE%D1%84%D0%B8%D1%8F", "summary": "Софи́я Пэ́нисова-Ле́ктор
