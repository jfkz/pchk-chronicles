<script>window.EPD = {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\"", "date": "2024-08-29", "minutes": 130, "duration": 7788.0, "video_id": "oflt0oNWTpQ", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Отель «Глубокий канал» на набережной в столице Кёнигпон", "short_html": "Младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> после видений считает себя кентавром <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалосом<\/a>; излечить его может душесос, который <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> привёз на конференцию торговцев в отель «Глубокий канал». <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> с агентами стражи <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевицем<\/a> и <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытусом<\/a> проникают в отель, захваченный вампирами высшего совета во главе с Боином Гробовым, которые хотят взорвать всю криминальную верхушку столицы. Герои сами подрывают вампирские бочки с порохом: гибнут вампиры, Гробов и преступная верхушка. Раненый Янус отдаёт душесос «божественному чаду» и скрывается, а душу кентавра переселяют в гоблина Виктора, и Лёша исцеляется.", "summary_html": "После ловушки <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (22) младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, Избранное чадо, от пережитых видений сходит с ума и считает себя могучим кентавром <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалосом<\/a>. Излечить его может артефакт «душесос» (эктоплазматический аспиратор «Дайсол»), который Янус привезёт на конференцию торговцев в столичный отель «Глубокий канал». <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> с двумя тайными агентами стражи, <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевицем<\/a> и <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытусом<\/a>, проникают в отель и выясняют, что его захватили вампиры высшего совета во главе с Боином Гробовым, которые собираются взорвать всю криминальную верхушку столицы. Герои временно объединяются с вампирами, но в итоге сами взрывают их бочки с порохом: гибнут вампиры, Боин Гробов и вся преступная верхушка. Раненый Янус отдаёт душесос «божественному чаду» и скрывается; душу кентавра переселяют в гоблина Виктора, а Лёша приходит в себя.", "outcome_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> исцелён, душа кентавра в теле гоблина Виктора; погибли Боин Гробов и вся преступная верхушка столицы, <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> сбежал.", "world_html": ["Уничтожена криминальная верхушка столицы (взрыв в отеле «Глубокий канал»)", "Погиб член высшего вампирского совета Боин Гробов", "Высший вампирский совет охотится на <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>", "Гоблин Виктор теперь носит душу кентавра <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a>", "Маска <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> хочет, чтобы её носил <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>"], "scenes": [{"t": "0:00:30", "sec": 30, "html": "«Ранее»: семья каннибалов из таверны «Кайф» стала «Отрядом Солнца»; эльф-торговец <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> оказался главарём преступного мира Янусом и по заказу Тёмного Властелина устроил им ловушку, от которой спасло прорицание Лёши. Пролог: Дадодис спорит с голосом маски Януса («в этом мире продаётся всё») и обещает любимой <a class=\"ref\" href=\"/c/kristina/\">Кристиночке<\/a> избавиться от маски."}, {"t": "0:05:16", "sec": 316, "html": "Завязка: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> считает себя кентавром; друид подсказал, что вылечит его «душесос». Капитан стражи Мухомор выделил <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> двух агентов, чтобы проверить, что Янус — это <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>, и арестовать его."}, {"t": "0:12:46", "sec": 766, "html": "Трёхэтажный отель «Глубокий канал» на набережной одноимённого канала, 9-я ежегодная конференция торговцев и предпринимателей. Маскировка: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> — «эскортница» в одеяле и с агрессивным макияжем, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — «сумка» и загримирован; <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевиц<\/a> гримирует всех. <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a> с чемоданом входит в отель."}, {"t": "0:17:54", "sec": 1074, "html": "Кобыла у повозки «подмигивает» <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалосу<\/a>; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> бьёт её книжкой и получает копытом, <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> — отравленным кинжалом, лошадь кусает <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>. Возница уезжает, а стражники помогают «хромой даме» войти в отель."}, {"t": "0:25:29", "sec": 1529, "html": "Фойе: администраторша, носильщик, двое наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> на входе. <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> получает психический урон, когда ведёт себя как ребёнок, и «по-кентаврьи» мочится на ковёр (из него вылетает камень), а <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> под шумок крадёт ключ от номера 3 и план эвакуации. <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> крадёт две монеты."}, {"t": "0:34:57", "sec": 2097, "html": "Список гостей: 1 — Джек Куклочёт, 2 — «Трансцио», 3 — <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, 4 — <a class=\"ref\" href=\"/c/lester/\">Лестер<\/a>, 5 — эльф <a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>, 6 — господин Зуб, 7 — Стинки, 8 — <a class=\"ref\" href=\"/c/neyt/\">Нейт<\/a>. Предполагаемое место тайной встречи — большой зал на третьем этаже."}, {"t": "0:40:09", "sec": 2409, "html": "Громила <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a> требует ключ и смотрит в одну точку: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> понимает, что он зачарован. Управляющий «<a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a>» заклинанием пытается заставить Юлиана отдать ключ; ключ отдают, и Юлиан с <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевицем<\/a> идут за Кабаном. <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> и <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалоса<\/a> выводят на улицу, в саду они убивают двух наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> (Буцефалос — топорами и копытами)."}, {"t": "0:46:28", "sec": 2788, "html": "<a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> под зельем невидимости поднимается на второй этаж и замечает снятые со стен зеркала (нежить). В номере 5 (<a class=\"ref\" href=\"/c/yanus/\">Дадодис<\/a>) — фото полной эльфийки «<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>» и чемодан нарядов; он забирает платье с декольте. Потом прячется под кроватью в номере 3."}, {"t": "1:04:25", "sec": 3865, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевиц<\/a> подслушивают сутенёра <a class=\"ref\" href=\"/c/lester/\">Лестера<\/a> (номер 4), который муштрует девушек для «толстосумов»; Лестер предлагает девушек за золото. Юлиан вызывает дух мёртвой крысы и заражается трупным ядом, но забирает чумную крысу с собой."}, {"t": "1:10:42", "sec": 4242, "html": "<a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> в форме охранника тащит <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> за волосы через кухню; неестественно сильный и холодный официант выставляет их на улицу. София выведывает, что официанты «в плане» (бочки на кухне — горючее) и подчиняются Боину Гробову. Официант оказывается вампиром и кусает Софию; Буцефалос на критическом успехе сбивает его в канал, где проточная вода растворяет вампира. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> «молоком» и ягодами Софии приводит её в чувство."}, {"t": "1:24:34", "sec": 5074, "html": "Номер 3: зачарованный <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a> приглашает вампиров-официантов, и те крепят бочки с порохом под потолком, чтобы взрыв пробил проход в зал на третьем этаже и уничтожил собравшихся. Входит «<a class=\"ref\" href=\"/c/genrih/\">Генрих<\/a>» — вампир Боин Гробов, который выпил настоящего управляющего и занял его место."}, {"t": "1:28:50", "sec": 5330, "html": "Конференц-зал (выступает делец из «Чучельника» с чучелами бобров). <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a>, загримированный «уродливым шпицем», тушит камин; вампира-официанта сталкивают на осиновые поленья, и он парализован. Свиток разговора с мёртвыми раскрывает план: высший вампирский совет приказал Боину Гробову уничтожить всю криминальную верхушку города, их цель — <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>."}, {"t": "1:35:12", "sec": 5712, "html": "Второй вампир предлагает союз; в северном камине спрятан труп фотографа (вспышка опасна вампирам). Герои поднимаются в номер 3 к Гробову, торгуются за душесос и маску; у <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевица<\/a> находят серебряный значок стражи."}, {"t": "1:40:25", "sec": 6025, "html": "<a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> выскакивает из-под кровати и ослепляет вампиров вспышкой фотоаппарата; все выбегают, и тифлинг из дверей огненным снарядом подрывает бочки. Вампиры и Боин Гробов гибнут, потолок обрушивается, криминальная верхушка столицы горит."}, {"t": "1:44:45", "sec": 6285, "html": "Раненый <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> с душесосом смотрит сверху и убегает. <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> поднимаются на кошке-крюке; путь преграждает гоблин Виктор («предатель», старый напарник Юлиана), ранит Подприкрытуса в колени и падает от отравленного болта; Юлиан стабилизирует его и несёт в слинге."}, {"t": "1:51:06", "sec": 6666, "html": "Наёмники <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> на лестнице: <a class=\"ref\" href=\"/c/cherezdevic/\">Черездевиц<\/a> «песней паралича» (рэп «АК-47») парализует одного. <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> проламывает стену телом наёмника и открывает спрятанную за шкафом-муляжом винтовую лестницу; по следам крови он настигает Януса у кухни первого этажа. <a class=\"ref\" href=\"/c/podprikrytus/\">Подприкрытус<\/a> находит сосуд для душесоса и инструкцию."}, {"t": "2:02:02", "sec": 7322, "html": "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> узнаёт «божественное чадо»; <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> блефует, что всё это спланировал он. Маска говорит, что хотела бы, чтобы <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> «носил» её (маска истины Януса); Янус бросает чемодан с душесосом («честная сделка») и исчезает."}, {"t": "2:04:09", "sec": 7449, "html": "Душесос всасывает душу кентавра из Лёши; её выдувают в тело гоблина Виктора. <a class=\"ref\" href=\"/c/bucefalos/\">Буцефалос<\/a> теперь «кентавр в теле гоблина», <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> приходит в себя. Итог: 6 монет (60 000 руб.) уходят на благотворительность."}], "key_events": [{"t": "0:05:16", "sec": 316}, {"t": "0:25:29", "sec": 1529}, {"t": "0:46:28", "sec": 2788}, {"t": "1:18:10", "sec": 4690}, {"t": "1:24:34", "sec": 5074}, {"t": "1:33:04", "sec": 5584}, {"t": "1:40:25", "sec": 6025}, {"t": "1:46:53", "sec": 6413}, {"t": "2:02:02", "sec": 7322}, {"t": "2:05:12", "sec": 7512}], "coins": {"ep": "29", "events": [{"t": "0:35:59", "kind": "loot", "who": "София", "actor": "BRB", "to": null, "reason": "Работая на ресепшене отеля, ловко (проверка ловкости рук с преимуществом) стащила две золотые монеты из-под руки коллеги-администраторши Лейлы.", "result": null, "sec": 2159, "who_url": "/c/sofiya/", "reason_html": "Работая на ресепшене отеля, ловко (проверка ловкости рук с преимуществом) стащила две золотые монеты из-под руки коллеги-администраторши Лейлы."}, {"t": "0:53:49", "kind": "earn", "who": "Буцефалос", "actor": "Шакулин", "to": null, "reason": "Совершил своё первое убийство — лягнул нападавшего копытами насмерть, защищая «мать» Софию (в теле младенца).", "result": null, "sec": 3229, "who_url": "/c/bucefalos/", "reason_html": "Совершил своё первое убийство — лягнул нападавшего копытами насмерть, защищая «мать» <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> (в теле младенца)."}, {"t": "1:06:31", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Хороший отыгрыш верности жене — сравнил предложенных девушек с фотографией своей эльфийской жены Галы и ответил «никто».", "result": null, "sec": 3991, "who_url": null, "reason_html": "Хороший отыгрыш верности жене — сравнил предложенных девушек с фотографией своей эльфийской жены Галы и ответил «никто»."}, {"t": "1:08:37", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Потратили монету, чтобы поговорить с мёртвой крысой через свиток «разговор с мёртвыми» после провала обычного разговора с животными.", "result": null, "sec": 4117, "who_url": null, "reason_html": "Потратили монету, чтобы поговорить с мёртвой крысой через свиток «разговор с мёртвыми» после провала обычного разговора с животными."}, {"t": "1:15:01", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "Потратили монету на переброс обмана (харизма) при попытке убедить официанта, что они «часть плана» заговорщика Боэн Гробова.", "result": "Официант не поверил и скрылся на кухне.", "sec": 4501, "who_url": null, "reason_html": "Потратили монету на переброс обмана (харизма) при попытке убедить официанта, что они «часть плана» заговорщика Боэн Гробова."}, {"t": "1:21:26", "kind": "earn", "who": "Буцефалос", "actor": "Шакулин", "to": null, "reason": "Критический успех — разбежался и лягнул вампира-официанта своими маленькими копытами прямо в проточную воду, доказав, что он кентавр.", "result": null, "sec": 4886, "who_url": "/c/bucefalos/", "reason_html": "Критический успех — разбежался и лягнул вампира-официанта своими маленькими копытами прямо в проточную воду, доказав, что он кентавр."}, {"t": "1:25:37", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Остроумный вопрос про то, что вампиры вовсе не устойчивы к огню.", "result": null, "sec": 5137, "who_url": null, "reason_html": "Остроумный вопрос про то, что вампиры вовсе не устойчивы к огню."}, {"t": "1:36:15", "kind": "earn", "who": "Черездевиц", "actor": "SQWOZBAB", "to": null, "reason": "Разгадал через расследование, почему фотографии вампиров не проявляются (они воспринимают вспышку как свет).", "result": null, "sec": 5775, "who_url": "/c/cherezdevic/", "reason_html": "Разгадал через расследование, почему фотографии вампиров не проявляются (они воспринимают вспышку как свет)."}, {"t": "1:40:25", "kind": "earn", "who": "Подприкрытус", "actor": "SALUKI", "to": null, "reason": "Вылез из-под кровати с камерой и ослепил вампиров вспышкой — эффектный подвиг.", "result": null, "sec": 6025, "who_url": "/c/podprikrytus/", "reason_html": "Вылез из-под кровати с камерой и ослепил вампиров вспышкой — эффектный подвиг."}, {"t": "1:50:05", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "Потратил монету на переброс проверки медицины, пытаясь стабилизировать смертельно раненного Виктора.", "result": "Неудача — не смог его спасти.", "sec": 6605, "who_url": "/c/yulian/", "reason_html": "Потратил монету на переброс проверки медицины, пытаясь стабилизировать смертельно раненного Виктора."}, {"t": "1:59:56", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "Потратил монету на переброс огненной атаки по вражескому солдату.", "result": "Критический провал — атака не удалась.", "sec": 7196, "who_url": "/c/yulian/", "reason_html": "Потратил монету на переброс огненной атаки по вражескому солдату."}], "totals": [{"who": "София", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sofiya.webp", "who_url": "/c/sofiya/", "actor_url": "/p/brb/"}, {"who": "Буцефалос", "actor": "Шакулин", "earned": 2, "spent": 0, "img": "img/chars/bucefalos.webp", "who_url": "/c/bucefalos/", "actor_url": "/p/shakulin/"}, {"who":
