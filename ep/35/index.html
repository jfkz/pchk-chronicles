ection\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Виталис не арестован, а погиб в #14<\/b><\/div><p>Авторы напомнили финал #14: из двух гномов-хозяев голубятни одного убили, другого арестовали. В #14 погиб <a class=\"ref\" href=\"/c/vitalis/\">Виталис<\/a>, Милонис сдался.<\/p><blockquote>«Арестовали Мелониса Виталиса, двух гномов, короче. Одного убили, другого арестовали.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep35.md: голубятня названа «бывшей собственностью арестованных гномов <a class=\"ref\" href=\"/c/vitalis/\">Милониса и Виталиса<\/a>» и «Милонис и Виталис — арестованы». На самом деле арестован (сдался) только Милонис, а Виталис погиб в #14.<\/p><p class=\"note\"><a href=\"/pod/qa35/#qa35-29\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8359\" target=\"_blank\" rel=\"noopener\">2:19:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa35-30\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Мать и отец тифлингов Эа и Демаша на иллюстрации Влада<\/b><\/div><p>На иллюстрации к легенде <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влада Пивкавцепеша<\/a> были он с молодой девушкой, а затем девушка с двумя тифлингами. Авторы подтвердили догадку зрителей, что это Эа и <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> из #3, то есть Влад — их отец. В #3 близнецы говорили, что их родители убиты; по словам авторов, мать могли убить в том числе за связь с демоном.<\/p><blockquote>«Некоторые предположили, что это Эа и Демаш, персонажи третьего приключения. Да, действительно, это они.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-30\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8465\" target=\"_blank\" rel=\"noopener\">2:21:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa36-25\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Реакция Никиты Кукушкина на смерть Эрика<\/b><\/div><p><a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> позвонил в первую же ночь после выхода выпуска о гибели <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> и спросил, почему его убили. Ему объяснили, что сейчас нет возможности вернуть его в игру, а Эрик был «сосудом» в сюжете. Никита расстроился.<\/p><blockquote>«Он первый же день позвонил мне после Эрика и говорит: «Почему ты его убил?»<\/blockquote><p class=\"note\"><a href=\"/pod/qa36/#qa36-25\">Подкаст по #36<\/a> · <a href=\"https://youtu.be/oEqxCRDdITw?t=4829\" target=\"_blank\" rel=\"noopener\">1:20:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa40-9\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Устройство королевской инквизиции<\/b><\/div><p>Инквизиция — новая организация, созданная по приказу короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a> из-за демонического нашествия. Она подчиняется верховному жрецу <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> из свиты короля, который следит за религиозными течениями и преступлениями религиозного и магического характера. Демоны, хоть Тёмного Властелина и не пустили на небеса, остались на земле и воюют как новое демоническое государство. Получив почти неограниченную власть, многие инквизиторы ею злоупотребляют; подробнее об этом обещали рассказать позже.<\/p><blockquote>«Есть в королевстве, в Понии, верховный жрец, который подчиняется королю… В общем, инквизиторы подчиняются верховному жрецу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-9\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=2465\" target=\"_blank\" rel=\"noopener\">0:41:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Белиала вместо Горгоны — не ляп<\/b><\/div><p>Зрители сочли ляпом, что главредом «Геленбургской правды» стала Белиала, хотя в выпуске 35 им была <a class=\"ref\" href=\"/c/gorgona-zagolovkina/\">Горгона Заголовкина<\/a>. Авторы пояснили, что мир живёт между выпусками: после провала с телом <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и его команда впали в немилость, Горгону, видимо, понизили, и газету теперь контролирует демон. Это их предположение.<\/p><blockquote>«Персонаж Горгона Заголовкина представлялась раньше главным редактором «Геленбургской правды», но теперь на этом месте сидит Белиала.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-5\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=908\" target=\"_blank\" rel=\"noopener\">0:15:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><\/section>", "chars": {"Миша": {"name": "Бес Миша", "img": "img/chars/misha.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9C%D0%B8%D1%88%D0%B0", "summary": "Ми́ша — бес, мелкий клерк из девятого круга ада, питающий особую любовь к
