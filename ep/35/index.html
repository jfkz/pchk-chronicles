<script>window.EPD = {"anim": false, "key": "35", "label": "35", "title": "Второй Шанс", "date": "2025-02-10", "minutes": 102, "duration": 6129.0, "video_id": "aCYWh-P7bHU", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Гномский город Змей Хрустальный, деревня Нижний Творожок, озеро Влажное", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ищет пропавшего <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> как новый сосуд для Тёмного Властелина.", "summary_html": "После провала на постоялом дворе «Рыжий петух» падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ищет другой сосуд для духа Тёмного Властелина — пропавшего мерзкого полурослика <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>. Отряд из демонов и слуг ада выясняет в гномском городе <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a>, что почтовые голуби (одурманенные эльфийской солью) заклевали Эрика до состояния «ни жив ни мёртв», зашили в ортопедическую подушку и отправили посылкой в деревню <a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a>. Оттуда тело похитили амазонки, чья царица Олега решила выйти за «божественного» полурослика замуж. Отряд срывает свадьбу на озере Влажное, но бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, тайно не желающий пускать Тёмного Властелина на небеса, телепортируется с Эриком к старушке <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a> и сжигает тело. Эрик Пэнисов погибает; миссия формально выполнена (полурослик найден), но Сфинктерион предан.", "outcome_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> окончательно убит бесом Мишей; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> предан собственным союзником. Отряд формально выполнил задачу — нашёл полурослика.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Авторы не знают, кто прав — Сфинктерион или Миша\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Авторы не знают, кто прав — Сфинктерион или Миша<\/b> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> искренне верит, что, проведя Тёмного Властелина окольным путём на небеса, спасёт земной мир от войны. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> верит в обратное. Авторы подчеркнули, что ни один персонаж не несёт «авторской правды», а исход зависит от того, при каких обстоятельствах демоны проникнут на небеса. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=6773\" target=\"_blank\" rel=\"noopener\">1:52:53 ↗<\/a> · <a href=\"#qa35-19\">к записи<\/a><\/span><\/span>", "world_html": ["<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> погиб — у Тёмного Властелина остался единственный божественный потомок, малыш <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>", "Среди бесов есть противники похода Тёмного Властелина на небеса (бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>)", "<a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> ищет Избранное дитя", "Голубиной республике обещана тысяча соток земли", "<a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> связана контрактом с бесом Мишей"], "scenes": [{"t": "0:01:09", "sec": 69, "html": "Предыстория: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> женился на друидессе <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> (сын <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>), от селянки <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт<\/a> у него сын <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a>; Эрик взялся доставить эльфийскую соль и пропал. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> хочет попасть в небесный мир, вселившись в божественного потомка — Эрика или его детей. Отряд крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> «обрубил росток рода Пэнисовых» (гибель малыша Люция на «Рыжем петухе»)."}, {"t": "0:04:36", "sec": 276, "html": "Представление: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> (убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, покинул демоническую армию, поклялся не вредить гномам) ищет <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, чтобы «мирно» предотвратить войну; бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> (вместе с <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучином<\/a> украл кристалл телепортации); <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> (продал душу по адскому контракту, отвергнут друзьями); инкуб <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влад Пивкавцепеш<\/a>; журналистка <a class=\"ref\" href=\"/c/gorgona-zagolovkina/\">Горгона Заголовкина<\/a>."}, {"t": "0:11:57", "sec": 717, "html": "Голубятня на западной окраине Змея Хрустального (бывшая собственность арестованных гномов <a class=\"ref\" href=\"/c/vitalis/\">Милониса и Виталиса<\/a>). Старушка-гномка <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> кормит голубей, которые не клюют зерно, а собирают его в почтовые сумки."}, {"t": "0:14:40", "sec": 880, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> Щитом Чёрного Властелина (животная речь) допрашивает голубей: полурослик «не жив не мёртв», тело «убрал <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a>» — президент голубиной «республики»."}, {"t": "0:19:57", "sec": 1197, "html": "<a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> замечает демонов и зовёт полицию; бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> обманом убеждает её, что они «тоже голуби». <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> падает в ловушку-яму с голубиным помётом, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> вытаскивает его на крышу."}, {"t": "0:25:03", "sec": 1503, "html": "Голубь Гриф принимает беляш-подкуп для президента; запугивание <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> проваливается. Перо Горгоны разведывает здание: сотни голубей-сортировщиков, президент <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a> на троне из коробок."}, {"t": "0:31:30", "sec": 1890, "html": "Драка: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> пробивает стеклянную крышу, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> хватает президента, бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> огненным снарядом поджигает голубятню. Появляется гномская полиция (лейтенант Пунь-Понь), Мишу бьёт ловушка с кирпичами."}, {"t": "0:36:30", "sec": 2190, "html": "Президент <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a> гипнотизирует <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и заставляет атаковать <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>; Влад «щелбаном» хвоста по голубю пытается снять морок."}, {"t": "0:44:14", "sec": 2654, "html": "Горгона способностью «Сенсация» выпускает фальшивую газету о покушении на мэра — полиция уезжает. <a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> покупает душу <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>: теперь она может щелчком вызвать его в любой момент.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Три способа беса получить душу\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Три способа беса получить душу<\/b> Авторы напомнили механику, заявленную ещё в #17: бес получает душу через ритуальное убийство кинжалом на пентаграмме во имя Асмодея, выкупает её за деньги (душа переходит к бесу после смерти) или оказывает услугу либо служит человеку какое-то время, например десять лет. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> с <a class=\"ref\" href=\"/c/dzhuna/\">Джуной<\/a> воспользовался последним способом. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4310\" target=\"_blank\" rel=\"noopener\">1:11:50 ↗<\/a> · <a href=\"#qa35-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:47:53", "sec": 2873, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> договаривается с президентом: расписка — «когда найдём <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и земля будет спасена от войны, голубям выделят тысячу соток». Голубь отдаёт почтовый журнал."}, {"t": "0:51:12", "sec": 3072, "html": "Запись в журнале: под действием эльфийской соли голуби в ярости заклевали <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, потом пытались лечить, но он «ни жив ни мёртв»; его зашили в ортопедическую подушку (заказ с Вульфберис) и отправили кузнецу Жоржу в деревню <a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a>. Там же — заказ «белое платье, туфли, фейерверки к озеру Влажное»."}, {"t": "0:53:48", "sec": 3228, "html": "<a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a> только что пережил набег амазонок, которые «используют» мужчин для зачатия и подкидывают мальчиков. <a class=\"ref\" href=\"/c/kuznec-zhorzh/\">Кузнец Жорж<\/a> под каблуком жены <a class=\"ref\" href=\"/c/sergeya/\">Сергеи<\/a> — бывшей амазонки."}, {"t": "0:59:42", "sec": 3582, "html": "<a class=\"ref\" href=\"/c/sergeya/\">Сергея<\/a> рассказывает Горгоне: ушла из племени ради Жоржа, её прокляли, а царице Олеге «мужиться» можно. Жорж: тело «кукушонка» было живым, но жрец сказал, что душу не принимают ни рай, ни ад — он завис между мирами; во время набега амазонки его украли.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ретроспективной заявкой Миша уже пользовался в деревне\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ретроспективной заявкой Миша уже пользовался в деревне<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> применил ретроспективную заявку и раньше в выпуске: в Нижнем Творожке, пока <a class=\"ref\" href=\"/c/sergeya/\">Сергея<\/a> говорила с Горгоной, бес «параллельно» поговорил с кузнецом Жоржем, хотя тому приказали уйти. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5140\" target=\"_blank\" rel=\"noopener\">1:25:40 ↗<\/a> · <a href=\"#qa35-12\">к записи<\/a><\/span><\/span>"}, {"t": "1:03:20", "sec": 3800, "html": "Приглашение на свадьбу съела коза; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> запугивает козу, жители хватают вилы. <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> вызывает беса Мишу (открыть форточку) — он переносится к ней с навозом в руках и находит приглашение: свадьба царицы Олеги на озере Влажное, ведёт главная жрица Ипполита. Коза возвращена жителям.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Телепортацию к патрону придумали ещё для #17\">14<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Телепортацию к патрону придумали ещё для #17<\/b> Механику, по которой хозяин контракта может мгновенно вызвать к себе беса, придумали ещё к #17, но там она не пригодилась: <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> и так постоянно телепортировался. Мастер хотел через неё издеваться над бесами: например, бомж с контрактом выдёргивал бы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучина<\/a> посреди важного действия. В #35 её впервые использовали в сюжете. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5353\" target=\"_blank\" rel=\"noopener\">1:29:13 ↗<\/a> · <a href=\"#qa35-14\">к записи<\/a><\/span><\/span>"}, {"t": "1:10:19", "sec": 4219, "html": "Лагерь амазонок на озере Влажное. Горгона выпускает газету «Покорённые амазонки»; перо роняет её на свадьбу, жрица сжигает её как «поздравление от короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>». <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> вызывает виверну сигнальным факелом."}, {"t": "1:13:05", "sec": 4385, "html": "Церемония: царица Олега выходит за безжизненное тело <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, привязанное к стойке; жрица «кивает» за него. Протест Горгоны игнорируется. Молодожёнов сажают на плот, смазанный китовым жиром.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Видение Ипполиты: брак с «ни живым ни мёртвым» и сожжение\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Видение Ипполиты: брак с «ни живым ни мёртвым» и сожжение<\/b> Из дневника: богини <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> и <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> молчали, у амазонок испортились ногти, роды стали страшнее, многие перестали хотеть детей. Ипполите было видение: одна из амазонок нарушит закон и выйдет замуж за «ни живого ни мёртвого» с родинкой в форме лица <a class=\"ref\" href=\"/place/poniya/\">Пония<\/a> IV, их сожгут вместе — и страдания кончатся. <a class=\"ref\" href=\"/c/carica-olega/\">Царица Олега<\/a> решила стать этой невестой. Сны указали на горы у воды, поэтому племя откочевало ближе к гномскому городу. В деревне козопасов (<a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a>) они нашли <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Видение настоящее, от богов, а посылка с Эриком — решение самих голубей. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7836\" target=\"_blank\" rel=\"noopener\">2:10:36 ↗<\/a> · <a href=\"#qa35-24\">к записи<\/a><\/span><\/span>"}, {"t": "1:20:08", "sec": 4808, "html": "Дочь царицы <a class=\"ref\" href=\"/c/romana/\">Романа<\/a> поджигает плот огненной стрелой (ритуальное сожжение). <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> сбрасывает огнеупорного беса Мишу на плот; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> отвлекает внимание речью о «протекторате». Влад, превратившись в жрицу Ипполиту, объявляет настоящую жрицу самозванкой — амазонки бросаются в воду спасать царицу.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Смысл свадьбы и сожжения у амазонок\">25<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Смысл свадьбы и сожжения у амазонок<\/b> Сожжение на плоту — ритуальная «чистая смерть» во имя богов: супруги вместе возносятся в небесный мир, и царица договаривается с богинями о возвращении их милости. Амазонки решили, что боги прогневались, потому что те не вступают в браки. Поэтому брак и сожжение должны были всё исправить. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8157\" target=\"_blank\" rel=\"noopener\">2:15:57 ↗<\/a> · <a href=\"#qa35-25\">к записи<\/a><\/span><\/span>"}, {"t": "1:27:41", "sec": 5261, "html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a>, заранее оставивший <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a> записку «вызови на закате» (и написавший время козьим помётом на окне), телепортируется к ней вместе с <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>. <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> обманом («<a class=\"ref\" href=\"/c/romana/\">Романа<\/a>, я твой отец») останавливает стрельбу; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> некротическим лучом тушит плот, царица Олега прыгает в воду.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: BRB: без телепортации Эрик всё равно сгорел бы на плоту\">8<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>BRB: без телепортации Эрик всё равно сгорел бы на плоту<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> признал, что телепортация к <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a> в целом не требовалась: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> и так горел на плоту, и вряд ли его спасла бы виверна. Переносом к Джуне <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> прежде всего спасал себя от мести отряда. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> возразил, что тело сгорает не за один ход, а мастер дал бы отряду шанс его спасти. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4019\" target=\"_blank\" rel=\"noopener\">1:06:59 ↗<\/a> · <a href=\"#qa35-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Надпись помётом на окне — художественная вольность мастера\">13<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Надпись помётом на окне — художественная вольность мастера<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> указал на нестыковку: <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> плохо видит, не смогла прочесть контракт, а в комнате у неё темно, так что прочесть на закате надпись козьим помётом на окне она бы не смогла. Участники признали, что надпись — лишь «художественное описание мастера для прикола». По сути <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> просто договорился со старушкой, чтобы она вызвала его в нужный момент. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5241\" target=\"_blank\" rel=\"noopener\">1:27:21 ↗<\/a> · <a href=\"#qa35-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Вызов к Джуне был одной проверкой Интеллекта со сложностью 16\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Вызов к Джуне был одной проверкой Интеллекта со сложностью 16<\/b> Многократные вызовы («вызови меня через минуту, потом ещё раз…») свели к одной проверке Интеллекта со сложностью 16 при модификаторе 0, то есть около 25% успеха. Это не была заявка «на критический успех». Мастер разрешил её, потому что знал план <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> и видел, что тот действует пошагово, а последствия ещё не были объявлены. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5531\" target=\"_blank\" rel=\"noopener\">1:32:11 ↗<\/a> · <a href=\"#qa35-15\">к записи<\/a><\/span><\/span>"}, {"t": "1:35:55", "sec": 5755, "html": "В квартире <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a> <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> раскрывает мотив: он против проникновения Тёмного Властелина на небеса (это вызовет хаос и передел), его компаньон <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> ищет Избранное дитя, а задача Миши — найти и уничтожить Эрика. Он сжигает тело Эрика огненным снарядом. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> перестаёт дышать.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Гудков-Юлиан не стал бы убивать Эрика\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Гудков-Юлиан не стал бы убивать Эрика<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что убил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, потому что играл за беса Мишу, которому Эрик не близок. Если бы он играл за <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> или если бы за столом сидел <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a>, он бы так не поступил. А <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучина<\/a>, по его словам, он не убил бы никогда. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3922\" target=\"_blank\" rel=\"noopener\">1:05:22 ↗<\/a> · <a href=\"#qa35-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Скрытую мотивацию Миши не публиковали\">17<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Скрытую мотивацию Миши не публиковали<\/b> В отличие от скрытых мотиваций <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, текст легенды Миши после выпуска выкладывать не стали: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам пересказал её в финальном монологе <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a>. Он не договорил только последнюю фразу. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=6392\" target=\"_blank\" rel=\"noopener\">1:46:32 ↗<\/a> · <a href=\"#qa35-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Недоговорённая фраза монолога: демоны будут кормиться землёй\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Недоговорённая фраза монолога: демоны будут кормиться землёй<\/b> Последняя фраза из карточки Миши, которую <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> не произнёс: «Откуда ещё демонам черпать силы для войны?» Если демоны пойдут войной на небесный мир, силы для неё они будут черпать из земного мира, сделав его своим тылом. Поэтому <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> хотел оставить демонов на земле, где их можно разбить и загнать обратно в ад. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> живёт молитвами и любовью, нижний — душами. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=6672\" target=\"_blank\" rel=\"noopener\">1:51:12 ↗<\/a> · <a href=\"#qa35-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: Из финала вырезали, что душа Эрика ушла в ад\">26<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>Из финала вырезали, что душа Эрика ушла в ад<\/b> На съёмке мастер объявил, что душу <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> забрал ад, но в финальном монтаже это вырезали. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> убил Эрика не адским клинком во имя Асмодея, а огненным снарядом, и куда попала душа, осталось неясным (возможно, в чистилище). Если бы Эрик сгорел на плоту в ритуале, его душа принадлежала бы раю. Тёмному Властелину нужно тело, а не душа, и тело уничтожено. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8244\" target=\"_blank\" rel=\"noopener\">2:17:24 ↗<\/a> · <a href=\"#qa35-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:40:34", "sec": 6034, "html": "Финал: полурослик найден — победа, 60 000 руб. на благотворительность. Закадровый итог: предавший друзей <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сам стал жертвой предательства; некоторые бесы не хотят пускать Тёмного Властелина на небеса."}], "key_events": [{"t": "0:14:40", "sec": 880}, {"t": "0:31:30", "sec": 1890}, {"t": "0:45:53", "sec": 2753}, {"t": "0:47:53", "sec": 2873}, {"t": "0:51:12", "sec": 3072}, {"t": "1:01:28", "sec": 3688}, {"t": "1:07:48", "sec": 4068}, {"t": "1:13:05", "sec": 4385}, {"t": "1:25:07", "sec": 5107}, {"t": "1:27:41", "sec": 5261}, {"t": "1:38:35", "sec": 5915}], "coins": {"ep": "35", "events": [{"t": "0:43:38", "kind": "earn", "who": "Ангелин «Колосажатель»", "actor": "Гоген Солнцев", "to": null, "reason": "получил монету за идею разобраться с охраной-голубями, чтобы гном стал сговорчивее", "result": null, "sec": 2618, "who_url": "/c/angelin/", "reason_html": "получил монету за идею разобраться с охраной-голубями, чтобы гном стал сговорчивее"}, {"t": "1:08:21", "kind": "loot", "who": "Бес Миша", "actor": "Александр Гудков", "to": null, "reason": "роясь в фекалиях в поисках приглашения на свадьбу, нашёл также две золотые монеты", "result": null, "sec": 4101, "who_url": "/c/bes-misha/", "reason_html": "роясь в фекалиях в поисках приглашения на свадьбу, нашёл также две золотые монеты"}, {"t": "1:12:24", "kind": "earn", "who": "Горгона Заголовкина", "actor": "Саша Сулим", "to": null, "reason": "получила монету за газетную аферу — статья о «женитьбе короля тьмы на амазонке», чтобы отвлечь охрану свадьбы", "result": null, "sec": 4344, "who_url": "/c/gorgona-zagolovkina/", "reason_html": "получила монету за газетную аферу — статья о «женитьбе короля тьмы на амазонке», чтобы отвлечь охрану свадьбы"}, {"t": "1:29:26", "kind": "spend", "who": "Бес Миша", "actor": "Александр Гудков", "to": null, "reason": "группа потратила монету, чтобы дать бонус к почти невозможной проверке интеллекта (сложность 16 при интеллекте около нуля)", "result": "недостаточно", "sec": 5366, "who_url": "/c/bes-misha/", "reason_html": "группа потратила монету, чтобы дать бонус к почти невозможной проверке интеллекта (сложность 16 при интеллекте около нуля)"}, {"t": "1:29:29", "kind": "spend", "who": "Бес Миша", "actor": "Александр Гудков", "to": null, "reason": "потратили вторую монету на ещё одну попытку того же безнадёжного броска интеллекта", "result": "всё равно не хватило до 16", "sec": 5369, "who_url": "/c/bes-misha/", "reason_html": "потратили вторую монету на ещё одну попытку того же безнадёжного броска интеллекта"}, {"t": "1:41:03", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили кубики (докинув и дополнительную монетку) для суммы на благотворительность — 60 000 руб.", "result": null, "sec": 6063, "who_url": null, "reason_html": "в конце выпуска бросили кубики (докинув и дополнительную монетку) для суммы на благотворительность — 60 000 руб."}], "totals": [{"who": "Ангелин «Колосажатель»", "actor": "Гоген Солнцев", "earned": 1, "spent": 0, "img": "img/chars/angelin.webp", "who_url": "/c/angelin/", "actor_url": "/p/gogen-solncev/"}, {"who": "Горгона Заголовкина", "actor": "Саша Сулим", "earned": 1, "spent": 0, "img": "img/chars/gorgona-zagolovkina.webp", "who_url": "/c/gorgona-zagolovkina/", "actor_url": "/p/sasha-sulim/"}, {"who": "Бес Миша", "actor": "Александр Гудков", "earned": 0, "spent": 2, "img": "img/chars/misha.webp", "who_url": "/c/bes-misha/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Две монеты, потраченные на попытку броска интеллекта со сложностью 16 при почти нулевом модификаторе, не помогли — проверка была объективно невыполнима. Найденные в доме Джуны две золотые монеты — обычные внутриигровые деньги (loot)."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, падший рыцарь", "role": "", "fate": "выжил", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: BRB о будущем Сфинктериона: против и тёмных, и светлых\">21<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>BRB о будущем Сфинктериона: против и тёмных, и светлых<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сказал, что видит развитие <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> так: преданный и тёмными силами, он может набрать демонов-NPC и стать врагом и тёмных, и светлых, оставив себе единственную цель — защищать людей. Если «совет земли» отвергнет его условия, он предложит <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> сжечь мир и начать человечество заново. Авторы посоветовали смотреть #36 с этой мыслью в голове. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7370\" target=\"_blank\" rel=\"noopener\">2:02:50 ↗<\/a> · <a href=\"#qa35-21\">к записи<\/a><\/span><\/span>"}, {"name": "Бес Миша", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "бес, беглец из ада", "role": "", "fate": "выжил", "id": "Миша", "url": "/c/bes-misha/", "img": "img/chars/misha.webp", "other": [{"key": "17", "label": "17", "title": "Демонизация"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гудкову заранее выдали скрытую цель — решить судьбу Эрика\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гудкову заранее выдали скрытую цель — решить судьбу Эрика<\/b> Накануне съёмки авторы показали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> скрытую легенду: найти <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и убить его (или нет — на его усмотрение). Как это сделать, не подсказывали, только прошлись по способностям. Ключом стала способность беса телепортироваться к своему патрону, с которым у него контракт. Союзников в команде у него не было. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4219\" target=\"_blank\" rel=\"noopener\">1:10:19 ↗<\/a> · <a href=\"#qa35-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: BRB мог догадаться о двойной игре Миши\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>BRB мог догадаться о двойной игре Миши<\/b> Авторы считают, что у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> были основания заподозрить Мишу: в #17 и в этом выпуске бес представлялся любителем земных наслаждений, который уже предавал ад и своё начальство. Если бы <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> просто ударил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> кинжалом при всех, мастер не дал бы ему умереть от одного удара и потом не разрешил бы ретроспективную заявку. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4531\" target=\"_blank\" rel=\"noopener\">1:15:31 ↗<\/a> · <a href=\"#qa35-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Миша служит Асмодею, а Асмодей стоит над Тёмным Властелином\">20<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Миша служит Асмодею, а Асмодей стоит над Тёмным Властелином<\/b> <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> приносит жертвы во имя Асмодея — своего патрона. Асмодей не наказывает его за «предательство» ада, значит, поступки Миши его устраивают. Асмодей — «серый кардинал»: он начальник и Миши, и Тёмного Властелина, хотя позиционирует себя как приятель Тёмного Властелина. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7085\" target=\"_blank\" rel=\"noopener\">1:58:05 ↗<\/a> · <a href=\"#qa35-20\">к записи<\/a><\/span><\/span>"}, {"name": "Ангелин «Колосажатель»", "actor": "Гоген Солнцев", "actor_url": "/p/gogen-solncev/", "race": "падший ангел по вызову", "role": "", "fate": "выжил", "id": "Ангелин", "url": "/c/angelin/", "img": "img/chars/angelin.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Влад Пивкавцепеш", "actor": "Макс +100500", "actor_url": "/p/maks-100500/", "race": "инкуб, демон-искуситель", "role": "", "fate": "выжил", "id": "Влад Пивкавцепеш", "url": "/c/vlad-pivko-cepesh/", "img": "img/chars/vlad-pivkavcepesh.webp", "other": [{"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Мать и отец тифлингов Эа и Демаша на иллюстрации Влада\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Мать и отец тифлингов Эа и Демаша на иллюстрации Влада<\/b> На иллюстрации к легенде <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влада Пивкавцепеша<\/a> были он с молодой девушкой, а затем девушка с двумя тифлингами. Авторы подтвердили догадку зрителей, что это Эа и <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> из #3, то есть Влад — их отец. В #3 близнецы говорили, что их родители убиты; по словам авторов, мать могли убить в том числе за связь с демоном. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8465\" target=\"_blank\" rel=\"noopener\">2:21:05 ↗<\/a> · <a href=\"#qa35-30\">к записи<\/a><\/span><\/span>"}, {"name": "Горгона Заголовкина", "actor": "Саша Сулим", "actor_url": "/p/sasha-sulim/", "race": "ведьма-журналистка", "role": "", "fate": "выжила", "id": "Горгона Заголовкина", "url": "/c/gorgona-zagolovkina/", "img": "img/chars/gorgona-zagolovkina.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Белиала вместо Горгоны — не ляп\">33<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Белиала вместо Горгоны — не ляп<\/b> Зрители сочли ляпом, что главредом «Геленбургской правды» стала Белиала, хотя в выпуске 35 им была <a class=\"ref\" href=\"/c/gorgona-zagolovkina/\">Горгона Заголовкина<\/a>. Авторы пояснили, что мир живёт между выпусками: после провала с телом <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и его команда впали в немилость, Горгону, видимо, понизили, и газету теперь контролирует демон. Это их предположение. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=908\" target=\"_blank\" rel=\"noopener\">0:15:08 ↗<\/a> · <a href=\"#qa46-5\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Эрик Пэнисов", "actor": "", "actor_url": null, "race": "", "role": "мерзкий полурослик, божественный потомок, в коме «между мирами»", "fate": "погиб (сожжён бесом Мишей)", "id": "Эрик", "url": "/c/erik-penisov/", "img": "img/chars/erik-penisov.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кукушкин не верит в гибель Эрика Пэнисова\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кукушкин не верит в гибель Эрика Пэнисова<\/b> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> заявил, что не верит в последнюю «смерть» <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>: по его мнению, это «бред», авторы просто на него разозлились, и Эрик погибнуть не мог. Это позиция актёра, а не авторов. <span class=\"note\">Никита Кукушкин отвечает на вопросы · <a href=\"https://youtu.be/sRvWxLpc8RE?t=656\" target=\"_blank\" rel=\"noopener\">0:10:56 ↗<\/a> · <a href=\"#qa-sRvWxLpc8RE-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Судьбу Эрика Пэнисова отдали Гудкову и BRB\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Судьбу Эрика Пэнисова отдали Гудкову и BRB<\/b> Судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> висела с #14, его последнего появления. Его хотели вернуть в #18, но <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> не приехал на съёмку. Авторы решили, что судьбу Эрика должны решить два игрока, которые были с ним с первого приключения: персонаж <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был заинтересован, чтобы Эрик выжил, персонаж <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> — чтобы погиб. Показывать это в игре, а не объявлять гибель за кадром, решили сознательно. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3827\" target=\"_blank\" rel=\"noopener\">1:03:47 ↗<\/a> · <a href=\"#qa35-6\">к записи<\/a><\/span><\/span>"}, {"name": "Джуна", "actor": "", "actor_url": null, "race": "", "role": "старушка-гномка, кормит голубей; продала душу бесу Мише", "fate": "выжила", "id": "Джуна", "url": "/c/dzhuna/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Джуна могла запретить Мише сжигать тело\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Джуна могла запретить Мише сжигать тело<\/b> По контракту <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> выполняет приказы <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>. Она могла бы запретить ему жечь тело у неё дома, и он бы не смог этого сделать. Но Джуна не знала, что задумал бес, и ушла на кухню за пирожками. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8359\" target=\"_blank\" rel=\"noopener\">2:19:19 ↗<\/a> · <a href=\"#qa35-27\">к записи<\/a><\/span><\/span>"}, {"name": "Арагорн", "actor": "", "actor_url": null, "race": "", "role": "голубь-президент почтовой голубиной республики, гипнотизёр", "fate": "выжил", "id": "Арагорн", "url": "/c/aragorn/", "img": "img/chars/aragorn.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Президент Арагорн поумнел от эльфийской соли\">28<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Президент Арагорн поумнел от эльфийской соли<\/b> Голуби остались в голубятне Змия Хрустального после #14 вместе с эльфийской солью. Соль подействовала на них по-разному: <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a> стал сверхумным, обрёл телепатию и внушение, а остальные голуби основали свою «республику» с иерархией. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8359\" target=\"_blank\" rel=\"noopener\">2:19:19 ↗<\/a> · <a href=\"#qa35-28\">к записи<\/a><\/span><\/span>"}, {"name": "Гриф", "actor": "", "actor_url": null, "race": "", "role": "голубь-вожак стаи", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Лейтенант Пунь-Понь", "actor": "", "actor_url": null, "race": "", "role": "гномская полиция", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Кузнец Жорж", "actor": "", "actor_url": null, "race": "", "role": "житель Нижнего Творожка, получатель посылки с телом Эрика", "fate": "выжил", "id": "Кузнец Жорж", "url": "/c/kuznec-zhorzh/", "img": null, "other": []}, {"name": "Сергея", "actor": "", "actor_url": null, "race": "", "role": "бывшая амазонка, жена Жоржа", "fate": "выжила", "id": "Сергея", "url": "/c/sergeya/", "img": null, "other": []}, {"name": "Царица Олега", "actor": "", "actor_url": null, "race": "", "role": "царица амазонок, «невеста» Эрика", "fate": "выжила (обожжена)", "id": "Царица Олега", "url": "/c/carica-olega/", "img": null, "other": []}, {"name": "Ипполита", "actor": "", "actor_url": null, "race": "", "role": "главная жрица амазонок", "fate": "выжила", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Дневник Ипполиты должны были найти, но провалили бросок\">23<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Дневник Ипполиты должны были найти, но провалили бросок<\/b> Мотивацию амазонок объяснял дневник жрицы Ипполиты. Авторы рассчитывали, что герои найдут его в палатках или на связанной жрице под доспехами, но <a class=\"ref\" href=\"/p/sasha-sulim/\">Саша Сулим<\/a> провалила бросок Внимания, и к дневнику больше не возвращались. В подкасте его зачитал мастер. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7750\" target=\"_blank\" rel=\"noopener\">2:09:10 ↗<\/a> · <a href=\"#qa35-23\">к записи<\/a><\/span><\/span>"}, {"name": "Романа", "actor": "", "actor_url": null, "race": "", "role": "дочь царицы Олеги, лучница", "fate": "выжила", "id": "Романа", "url": "/c/romana/", "img": null, "other": []}, {"name": "Капучин", "actor": "", "actor_url": null, "race": "", "role": "компаньон беса Миши, ищет Избранное дитя", "fate": "неизвестно (упоминается)", "id": "Бес Капучин", "url": "/c/bes-kapuchino/", "img": "img/chars/kapuchin.webp", "other": [{"key": "17", "label": "17", "title": "Демонизация"}]}, {"name": "Милонис и Виталис", "actor": "", "actor_url": null, "race": "", "role": "гномы, бывшие владельцы голубятни", "fate": "арестованы (упоминаются)", "id": "Виталис", "url": "/c/vitalis/", "img": "img/chars/vitalis.webp", "other": [{"key": "14", "label": "14", "title": "Янус доставка"}], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Виталис не арестован, а погиб в #14\">29<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Виталис не арестован, а погиб в #14<\/b> Авторы напомнили финал #14: из двух гномов-хозяев голубятни одного убили, другого арестовали. В #14 погиб <a class=\"ref\" href=\"/c/vitalis/\">Виталис<\/a>, Милонис сдался. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep35.md: голубятня названа «бывшей собственностью арестованных гномов <a class=\"ref\" href=\"/c/vitalis/\">Милониса и Виталиса<\/a>» и «Милонис и Виталис — арестованы». На самом деле арестован (сдался) только Милонис, а Виталис погиб в #14.<\/span> <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8359\" target=\"_blank\" rel=\"noopener\">2:19:19 ↗<\/a> · <a href=\"#qa35-29\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "17", "label": "17", "title": "Демонизация", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> и <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> помогли украсть кристалл телепортации Адского вокзала", "dir": "out", "color": "#7C5CD6"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — Избранное чадо", "dir": "out", "color": "#2F84C8"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "Провал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> на постоялом дворе «Рыжий петух», гибель малыша <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> — ангел по вызову, продавший душу ради друзей", "dir": "out", "color": "#7C5CD6"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Контрабанда эльфийской соли (<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a>), на которой пропал <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "36", "label": "36", "title": "Руины Малестии", "note_html": "Параллельная линия <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; оба бывших союзника ищут свой путь спасения мира", "dir": "back", "color": "#DD7A2F"}, {"key": "37", "label": "37", "title": "Добровольцы", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> убил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> — договорённость <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a> сорвана", "dir": "back", "color": "#3E9A5E"}, {"key": "38", "label": "38", "title": "Возлюбленная", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> — божественный потомок Тёмного Властелина", "dir": "back", "color": "#7C5CD6"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> уничтожил тело для духа Тёмного Властелина", "dir": "back", "color": "#B8901C"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "Погибшее божественное дитя — не <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>: живы ещё два потомка Тёмного Властелина, Лёша и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши", "note_html": "В живых остались два потомка Тёмного Властелина — <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> охотится за ними", "dir": "back", "color": "#2F84C8"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "note_html": "Вторая неудачная попытка — охота за Лёшей и <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Не жив, не мёртв… Это <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> Шрёдингер, что ли?»", "«Мы голуби мира».", "«<a class=\"ref\" href=\"/c/romana/\">Романа<\/a>, я твой отец». — <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a>", "«Милая <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a>, ты не зря продала мне душу. Ты спасла мир». — бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>", "«<a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, а ты форточку-то закроешь?» — «Позже, <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a>, позже»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a> (гномский город), почтовая голубятня; деревня <a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a> (таверна «Чарочка», кузница Жоржа); озеро Влажное (временная стоянка амазонок); упоминаются деревня <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a>, острова Золотого карпа, баня «Гномский пар».<\/li>\n<li>Фракции: демоническая армия Тёмного Властелина; голубиная почтовая республика; гномская полиция; амазонки (кочевое племя без мужчин); «Геленбургская правда».<\/li>\n<li>Артефакты: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> (6 зарядов, животная речь); волшебное перо Горгоны; сигнальный факел вызова виверны; почтовый журнал голубятни; расписка <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> о тысяче соток; свадебное приглашение; контракт на душу <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>; удостоверение адского работника девятого круга; ортопедическая подушка с Вульфберис.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>33<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>33<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>5<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>12<\/small><\/button><button class=\"chip ptf t-retcon\" data-t=\"retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон <small>1<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>2<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>11<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa-sRvWxLpc8RE-3\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Кукушкин не верит в гибель Эрика Пэнисова<\/b><\/div><p><a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> заявил, что не верит в последнюю «смерть» <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>: по его мнению, это «бред», авторы просто на него разозлились, и Эрик погибнуть не мог. Это позиция актёра, а не авторов.<\/p><blockquote>«то, что последний раз типа Эрик погиб, я вообще в это честно не верю… Эрик не мог погибнуть вообще»<\/blockquote><p class=\"note\">Кукушкин · <a href=\"/pod/qa-sRvWxLpc8RE/#qa-sRvWxLpc8RE-3\">Никита Кукушкин отвечает на вопросы<\/a> · <a href=\"https://youtu.be/sRvWxLpc8RE?t=656\" target=\"_blank\" rel=\"noopener\">0:10:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa31-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Ангельский колокольчик был страховкой на случай, если Гоген не освоится<\/b><\/div><p>Способность колокольчика прописали так, чтобы <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> могла один раз вызвать ангела и отпустить его в любой момент: если бы <a class=\"ref\" href=\"/p/gogen-solncev/\">Гоген Солнцев<\/a> растерялся или заскучал, его персонажа просто отпустили бы. <a class=\"ref\" href=\"/c/gogen/\">Гоген<\/a> втянулся, доиграл до конца, и авторы сразу решили позвать его ещё раз, уже в «тёмную ветку».<\/p><blockquote>«гудок талала могла отпустить его в любой момент это было прописано в способности специально»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-1\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=471\" target=\"_blank\" rel=\"noopener\">0:07:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Влад Пивкавцепеш играл активнее, чем попало в монтаж<\/b><\/div><p>Участники отметили, что <a class=\"ref\" href=\"/p/maks-100500/\">Макс +100500<\/a> делал заявки, но в монтаж они почти не попали. Сам <a class=\"ref\" href=\"/c/maks/\">Макс<\/a> признал, что раскрыл персонажа процентов на десять: ждал, пока ему дадут время, и проявился только в финале, когда превратился в жрицу.<\/p><blockquote>«Я помню, что Макс играл активнее, чем в монтаж попало. В монтаже его практически нет.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-3\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=1969\" target=\"_blank\" rel=\"noopener\">0:32:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Второй шанс» снимали в один день с «Зверь Фестом»<\/b><\/div><p>Выпуск сняли в октябре, в один день с #33 «Зверь Фест». Слово «ретроспективная заявка» прозвучало на съёмке «Зверь Феста», и в следующем моторе <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> им воспользовался.<\/p><blockquote>«Мы снимали это в день с... 33-м, со Зверфестом.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa35/#qa35-4\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3629\" target=\"_blank\" rel=\"noopener\">1:00:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Отчасти Мишу задумали как месть Гудкова BRB<\/b><\/div><p>Один из авторов объяснил метаигровую часть замысла: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>, которого <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> предал в #24 и вымотал в #30, дали возможность «отомстить» Big Russian Boss, чтобы и тот испытал предательство сокомандника за столом. Гудков ответил, что не мстил, а просто следовал заданной легенде.<\/p><blockquote>«задумка была в том, чтобы дать Александру Гудкову возможность отомстить именно Биг Рашен Боссу»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-5\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3744\" target=\"_blank\" rel=\"noopener\">1:02:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Судьбу Эрика Пэнисова отдали Гудкову и BRB<\/b><\/div><p>Судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> висела с #14, его последнего появления. Его хотели вернуть в #18, но <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> не приехал на съёмку. Авторы решили, что судьбу Эрика должны решить два игрока, которые были с ним с первого приключения: персонаж <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был заинтересован, чтобы Эрик выжил, персонаж <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> — чтобы погиб. Показывать это в игре, а не объявлять гибель за кадром, решили сознательно.<\/p><blockquote>«мы решили, что судьбу Эрика должны решить Александр Гудков и Big Russian Boss»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-6\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3827\" target=\"_blank\" rel=\"noopener\">1:03:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Гудков-Юлиан не стал бы убивать Эрика<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что убил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, потому что играл за беса Мишу, которому Эрик не близок. Если бы он играл за <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> или если бы за столом сидел <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a>, он бы так не поступил. А <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучина<\/a>, по его словам, он не убил бы никогда.<\/p><blockquote>«Допустим, если бы я играл за Юлиана, я вряд ли бы убил Эрика.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa35/#qa35-7\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3922\" target=\"_blank\" rel=\"noopener\">1:05:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-8\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB: без телепортации Эрик всё равно сгорел бы на плоту<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> признал, что телепортация к <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a> в целом не требовалась: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> и так горел на плоту, и вряд ли его спасла бы виверна. Переносом к Джуне <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> прежде всего спасал себя от мести отряда. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> возразил, что тело сгорает не за один ход, а мастер дал бы отряду шанс его спасти.<\/p><blockquote>«мне даже, по сути, этот хук с возвращением к Джуни и не нужен был. Потому что все и так шло как надо.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa35/#qa35-8\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4019\" target=\"_blank\" rel=\"noopener\">1:06:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-9\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гудкову заранее выдали скрытую цель — решить судьбу Эрика<\/b><\/div><p>Накануне съёмки авторы показали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> скрытую легенду: найти <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и убить его (или нет — на его усмотрение). Как это сделать, не подсказывали, только прошлись по способностям. Ключом стала способность беса телепортироваться к своему патрону, с которым у него контракт. Союзников в команде у него не было.<\/p><blockquote>«Сань, твоя задача будет... выкрасть Эрика Пеннисова и решить его судьбу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-9\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4219\" target=\"_blank\" rel=\"noopener\">1:10:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Три способа беса получить душу<\/b><\/div><p>Авторы напомнили механику, заявленную ещё в #17: бес получает душу через ритуальное убийство кинжалом на пентаграмме во имя Асмодея, выкупает её за деньги (душа переходит к бесу после смерти) или оказывает услугу либо служит человеку какое-то время, например десять лет. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> с <a class=\"ref\" href=\"/c/dzhuna/\">Джуной<\/a> воспользовался последним способом.<\/p><blockquote>«Либо ты становишься её слугой на короткий промежуток времени, например, на 10 лет.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-10\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4310\" target=\"_blank\" rel=\"noopener\">1:11:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-11\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB мог догадаться о двойной игре Миши<\/b><\/div><p>Авторы считают, что у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> были основания заподозрить Мишу: в #17 и в этом выпуске бес представлялся любителем земных наслаждений, который уже предавал ад и своё начальство. Если бы <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> просто ударил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> кинжалом при всех, мастер не дал бы ему умереть от одного удара и потом не разрешил бы ретроспективную заявку.<\/p><blockquote>«он уже предавал ад и предавал своих... боссов по иерархии. И Биг Рашен Босс об этом знал.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-11\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4531\" target=\"_blank\" rel=\"noopener\">1:15:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ретроспективной заявкой Миша уже пользовался в деревне<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> применил ретроспективную заявку и раньше в выпуске: в Нижнем Творожке, пока <a class=\"ref\" href=\"/c/sergeya/\">Сергея<\/a> говорила с Горгоной, бес «параллельно» поговорил с кузнецом Жоржем, хотя тому приказали уйти.<\/p><blockquote>«А мы поговорим, типа, в моменте, как будто это было, пока они там разговаривали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-12\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5140\" target=\"_blank\" rel=\"noopener\">1:25:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa35-13\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Надпись помётом на окне — художественная вольность мастера<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> указал на нестыковку: <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> плохо видит, не смогла прочесть контракт, а в комнате у неё темно, так что прочесть на закате надпись козьим помётом на окне она бы не смогла. Участники признали, что надпись — лишь «художественное описание мастера для прикола». По сути <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> просто договорился со старушкой, чтобы она вызвала его в нужный момент.<\/p><blockquote>«Это просто художественное описание мастера чисто для прикола.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-13\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5241\" target=\"_blank\" rel=\"noopener\">1:27:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-14\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Телепортацию к патрону придумали ещё для #17<\/b><\/div><p>Механику, по которой хозяин контракта может мгновенно вызвать к себе беса, придумали ещё к #17, но там она не пригодилась: <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> и так постоянно телепортировался. Мастер хотел через неё издеваться над бесами: например, бомж с контрактом выдёргивал бы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучина<\/a> посреди важного действия. В #35 её впервые использовали в сюжете.<\/p><blockquote>«На самом деле мы это придумали еще для 17 выпуска, нам просто не удалось это никаким образом использовать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-14\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5353\" target=\"_blank\" rel=\"noopener\">1:29:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-15\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Вызов к Джуне был одной проверкой Интеллекта со сложностью 16<\/b><\/div><p>Многократные вызовы («вызови меня через минуту, потом ещё раз…») свели к одной проверке Интеллекта со сложностью 16 при модификаторе 0, то есть около 25% успеха. Это не была заявка «на критический успех». Мастер разрешил её, потому что знал план <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> и видел, что тот действует пошагово, а последствия ещё не были объявлены.<\/p><blockquote>«Это был бросок интеллекта 16-й сложности, учитывая, что его модификатор интеллекта 0.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-15\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5531\" target=\"_blank\" rel=\"noopener\">1:32:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мастер о границах ретроспективной заявки<\/b><\/div><p>Бреганов объяснил: ретроспективная заявка допустима, если персонаж мог сделать это за кадром в разумные сроки и последствия ещё не объявлены. Решает мастер. Задним числом надеть бронежилет на уже убитого <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> нельзя. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мог заранее заявить, что голуби следят за домом <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>, но только до того, как узнал о предательстве Миши.<\/p><blockquote>«если герой или персонаж что-то за кадром мог сделать в разумные сроки... то нет ничего плохого в том, чтобы сказать, я ретроспективно заявляю»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa35/#qa35-16\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5836\" target=\"_blank\" rel=\"noopener\">1:37:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-17\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Скрытую мотивацию Миши не публиковали<\/b><\/div><p>В отличие от скрытых мотиваций <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, текст легенды Миши после выпуска выкладывать не стали: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам пересказал её в финальном монологе <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a>. Он не договорил только последнюю фразу.<\/p><blockquote>«Нет, мы её не записывали, она была написана... нами текстово, но мы решили её не дописывать после выпуска»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-17\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=6392\" target=\"_blank\" rel=\"noopener\">1:46:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-18\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Недоговорённая фраза монолога: демоны будут кормиться землёй<\/b><\/div><p>Последняя фраза из карточки Миши, которую <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> не произнёс: «Откуда ещё демонам черпать силы для войны?» Если демоны пойдут войной на небесный мир, силы для неё они будут черпать из земного мира, сделав его своим тылом. Поэтому <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> хотел оставить демонов на земле, где их можно разбить и загнать обратно в ад. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> живёт молитвами и любовью, нижний — душами.<\/p><blockquote>«Откуда ещё демонам черпать силы для войны?»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-18\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=6672\" target=\"_blank\" rel=\"noopener\">1:51:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-19\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Авторы не знают, кто прав — Сфинктерион или Миша<\/b><\/div><p><a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> искренне верит, что, проведя Тёмного Властелина окольным путём на небеса, спасёт земной мир от войны. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> верит в обратное. Авторы подчеркнули, что ни один персонаж не несёт «авторской правды», а исход зависит от того, при каких обстоятельствах демоны проникнут на небеса.<\/p><blockquote>«Я не знаю, кто из этих героев прав.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-19\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=6773\" target=\"_blank\" rel=\"noopener\">1:52:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa35-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Миша служит Асмодею, а Асмодей стоит над Тёмным Властелином<\/b><\/div><p><a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> приносит жертвы во имя Асмодея — своего патрона. Асмодей не наказывает его за «предательство» ада, значит, поступки Миши его устраивают. Асмодей — «серый кардинал»: он начальник и Миши, и Тёмного Властелина, хотя позиционирует себя как приятель Тёмного Властелина.<\/p><blockquote>«Асмадей там есть такой теневой кардинал серый... он босс Тёмного Властелина в том числе.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-20\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7085\" target=\"_blank\" rel=\"noopener\">1:58:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa35-21\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>BRB о будущем Сфинктериона: против и тёмных, и светлых<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сказал, что видит развитие <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> так: преданный и тёмными силами, он может набрать демонов-NPC и стать врагом и тёмных, и светлых, оставив себе единственную цель — защищать людей. Если «совет земли» отвергнет его условия, он предложит <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> сжечь мир и начать человечество заново. Авторы посоветовали смотреть #36 с этой мыслью в голове.<\/p><blockquote>«или он в конце будет против и тёмных, и светлых»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa35/#qa35-21\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7370\" target=\"_blank\" rel=\"noopener\">2:02:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-22\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему Сфинктериону не дали поговорить с отрядом<\/b><\/div><p>Зрители спросили, почему <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>, в отличие от прошлых выпусков, не дали спора с оппонентами. Ответили, что слушать препирательства в третий раз невозможно: их всё равно вырезают на монтаже, а потом всё кончается боем.<\/p><blockquote>«Третий раз, что ли, слушать препирательство, которое мы вырезаем.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-22\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7550\" target=\"_blank\" rel=\"noopener\">2:05:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-23\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Дневник Ипполиты должны были найти, но провалили бросок<\/b><\/div><p>Мотивацию амазонок объяснял дневник жрицы Ипполиты. Авторы рассчитывали, что герои найдут его в палатках или на связанной жрице под доспехами, но <a class=\"ref\" href=\"/p/sasha-sulim/\">Саша Сулим<\/a> провалила бросок Внимания, и к дневнику больше не возвращались. В подкасте его зачитал мастер.<\/p><blockquote>«Мы думали его подсунуть, короче, что она его реально под доспехами держит, когда вы ее скрутили.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-23\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7750\" target=\"_blank\" rel=\"noopener\">2:09:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa35-24\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Видение Ипполиты: брак с «ни живым ни мёртвым» и сожжение<\/b><\/div><p>Из дневника: богини <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> и <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> молчали, у амазонок испортились ногти, роды стали страшнее, многие перестали хотеть детей. Ипполите было видение: одна из амазонок нарушит закон и выйдет замуж за «ни живого ни мёртвого» с родинкой в форме лица <a class=\"ref\" href=\"/place/poniya/\">Пония<\/a> IV, их сожгут вместе — и страдания кончатся. <a class=\"ref\" href=\"/c/carica-olega/\">Царица Олега<\/a> решила стать этой невестой. Сны указали на горы у воды, поэтому племя откочевало ближе к гномскому городу. В деревне козопасов (<a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a>) они нашли <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Видение настоящее, от богов, а посылка с Эриком — решение самих голубей.<\/p><blockquote>«Он был ни жив, ни мёртв. А на теле была родинка в форме лица Пония IV. Мы сожгли её вместе с мужем, и наши страдания закончились.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa35/#qa35-24\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7836\" target=\"_blank\" rel=\"noopener\">2:10:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-25\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Смысл свадьбы и сожжения у амазонок<\/b><\/div><p>Сожжение на плоту — ритуальная «чистая смерть» во имя богов: супруги вместе возносятся в небесный мир, и царица договаривается с богинями о возвращении их милости. Амазонки решили, что боги прогневались, потому что те не вступают в браки. Поэтому брак и сожжение должны были всё исправить.<\/p><blockquote>«Давайте мы вступим в брак, сожжём, сделаем чистое убийство, вознесёмся и договоримся.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-25\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8157\" target=\"_blank\" rel=\"noopener\">2:15:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-retcon\" id=\"qa35-26\" data-type=\"retcon\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон<\/span><b>Из финала вырезали, что душа Эрика ушла в ад<\/b><\/div><p>На съёмке мастер объявил, что душу <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> забрал ад, но в финальном монтаже это вырезали. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> убил Эрика не адским клинком во имя Асмодея, а огненным снарядом, и куда попала душа, осталось неясным (возможно, в чистилище). Если бы Эрик сгорел на плоту в ритуале, его душа принадлежала бы раю. Тёмному Властелину нужно тело, а не душа, и тело уничтожено.<\/p><blockquote>«На моторе мы сказали о том, что его душу забирает ад. ...на финальном монтаже мы это отрезали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-26\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8244\" target=\"_blank\" rel=\"noopener\">2:17:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-27\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Джуна могла запретить Мише сжигать тело<\/b><\/div><p>По контракту <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> выполняет приказы <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>. Она могла бы запретить ему жечь тело у неё дома, и он бы не смог этого сделать. Но Джуна не знала, что задумал бес, и ушла на кухню за пирожками.<\/p><blockquote>«Джуна должна была сказать, не смей сжигать его здесь. И он бы не смог это сделать.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-27\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8359\" target=\"_blank\" rel=\"noopener\">2:19:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa35-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Президент Арагорн поумнел от эльфийской соли<\/b><\/div><p>Голуби остались в голубятне Змия Хрустального после #14 вместе с эльфийской солью. Соль подействовала на них по-разному: <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a> стал сверхумным, обрёл телепатию и внушение, а остальные голуби основали свою «республику» с иерархией.<\/p><blockquote>«Арагорн отрастил себе мозги.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-28\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8359\" target=\"_blank\" rel=\"noopener\">2:19:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa35-29\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-corr
