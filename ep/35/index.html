<script>window.EPD = {"anim": false, "key": "35", "label": "35", "title": "Второй Шанс", "date": "2025-02-10", "minutes": 102, "duration": 6129.0, "video_id": "aCYWh-P7bHU", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Гномский город Змей Хрустальный, деревня Нижний Творожок, озеро Влажное", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ищет пропавшего <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пенисова<\/a> как новый сосуд для Тёмного Властелина.", "summary_html": "После провала на постоялом дворе «Рыжий петух» падший рыцарь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ищет другой сосуд для духа Тёмного Властелина — пропавшего мерзкого полурослика <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пенисова<\/a>. Отряд из демонов и слуг ада выясняет в гномском городе <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a>, что почтовые голуби (одурманенные эльфийской солью) заклевали Эрика до состояния «ни жив ни мёртв», зашили в ортопедическую подушку и отправили посылкой в деревню <a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a>. Оттуда тело похитили амазонки, чья царица Олега решила выйти за «божественного» полурослика замуж. Отряд срывает свадьбу на озере Влажное, но бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, тайно не желающий пускать Тёмного Властелина на небеса, телепортируется с Эриком к старушке <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a> и сжигает тело. Эрик Пенисов погибает; миссия формально выполнена (полурослик найден), но Сфинктерион предан.", "outcome_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> окончательно убит бесом Мишей; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> предан собственным союзником. Отряд формально выполнил задачу — нашёл полурослика.", "world_html": ["<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> погиб — у Тёмного Властелина остался единственный божественный потомок, малыш <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>", "Среди бесов есть противники похода Тёмного Властелина на небеса (бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>)", "<a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> ищет Избранное дитя", "Голубиной республике обещана тысяча соток земли", "<a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> связана контрактом с бесом Мишей"], "scenes": [{"t": "0:01:09", "sec": 69, "html": "Предыстория: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> женился на друидессе <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> (сын <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>), от селянки <a class=\"ref\" href=\"/c/keyt-palin/\">Кейт<\/a> у него сын <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люций<\/a>; Эрик взялся доставить эльфийскую соль и пропал. <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> хочет попасть в небесный мир, вселившись в божественного потомка — Эрика или его детей. Отряд крысы <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> «обрубил росток рода Пенисовых» (гибель малыша Люция на «Рыжем петухе»)."}, {"t": "0:04:36", "sec": 276, "html": "Представление: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> (убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, покинул демоническую армию, поклялся не вредить гномам) ищет <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, чтобы «мирно» предотвратить войну; бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> (вместе с <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучином<\/a> украл кристалл телепортации); <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> (продал душу по адскому контракту, отвергнут друзьями); инкуб <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влад Пивко-Цепеш<\/a>; журналистка <a class=\"ref\" href=\"/c/gorgona-zagolovkina/\">Горгона Заголовкина<\/a>."}, {"t": "0:11:57", "sec": 717, "html": "Голубятня на западной окраине Змея Хрустального (бывшая собственность арестованных гномов <a class=\"ref\" href=\"/c/vitalis/\">Милониса и Виталиса<\/a>). Старушка-гномка <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> кормит голубей, которые не клюют зерно, а собирают его в почтовые сумки."}, {"t": "0:14:40", "sec": 880, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> Щитом Тёмного Властелина (животная речь) допрашивает голубей: полурослик «не жив не мёртв», тело «убрал <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a>» — президент голубиной «республики»."}, {"t": "0:19:57", "sec": 1197, "html": "<a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> замечает демонов и зовёт полицию; бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> обманом убеждает её, что они «тоже голуби». <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> падает в ловушку-яму с голубиным помётом, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> вытаскивает его на крышу."}, {"t": "0:25:03", "sec": 1503, "html": "Голубь Гриф принимает беляш-подкуп для президента; запугивание <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> проваливается. Перо Горгоны разведывает здание: сотни голубей-сортировщиков, президент <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a> на троне из коробок."}, {"t": "0:31:30", "sec": 1890, "html": "Драка: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> пробивает стеклянную крышу, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> хватает президента, бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> огненным снарядом поджигает голубятню. Появляется гномская полиция (лейтенант Пунь-Понь), Мишу бьёт ловушка с кирпичами."}, {"t": "0:36:30", "sec": 2190, "html": "Президент <a class=\"ref\" href=\"/c/aragorn/\">Арагорн<\/a> гипнотизирует <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и заставляет атаковать <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>; Влад «щелбаном» хвоста по голубю пытается снять морок."}, {"t": "0:44:14", "sec": 2654, "html": "Горгона способностью «Сенсация» выпускает фальшивую газету о покушении на мэра — полиция уезжает. <a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> покупает душу <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>: теперь она может щелчком вызвать его в любой момент."}, {"t": "0:47:53", "sec": 2873, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> договаривается с президентом: расписка — «когда найдём <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и земля будет спасена от войны, голубям выделят тысячу соток». Голубь отдаёт почтовый журнал."}, {"t": "0:51:12", "sec": 3072, "html": "Запись в журнале: под действием эльфийской соли голуби в ярости заклевали <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, потом пытались лечить, но он «ни жив ни мёртв»; его зашили в ортопедическую подушку (заказ с Вульфберис) и отправили кузнецу Жоржу в деревню <a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a>. Там же — заказ «белое платье, туфли, фейерверки к озеру Влажное»."}, {"t": "0:53:48", "sec": 3228, "html": "<a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a> только что пережил набег амазонок, которые «используют» мужчин для зачатия и подкидывают мальчиков. <a class=\"ref\" href=\"/c/kuznec-zhorzh/\">Кузнец Жорж<\/a> под каблуком жены <a class=\"ref\" href=\"/c/sergeya/\">Сергеи<\/a> — бывшей амазонки."}, {"t": "0:59:42", "sec": 3582, "html": "<a class=\"ref\" href=\"/c/sergeya/\">Сергея<\/a> рассказывает Горгоне: ушла из племени ради Жоржа, её прокляли, а царице Олеге «мужиться» можно. Жорж: тело «кукушонка» было живым, но жрец сказал, что душу не принимают ни рай, ни ад — он завис между мирами; во время набега амазонки его украли."}, {"t": "1:03:20", "sec": 3800, "html": "Приглашение на свадьбу съела коза; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> запугивает козу, жители хватают вилы. <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a> вызывает беса Мишу (открыть форточку) — он переносится к ней с навозом в руках и находит приглашение: свадьба царицы Олеги на озере Влажное, ведёт главная жрица Ипполита. Коза возвращена жителям."}, {"t": "1:10:19", "sec": 4219, "html": "Лагерь амазонок на озере Влажное. Горгона выпускает газету «Покорённые амазонки»; перо роняет её на свадьбу, жрица сжигает её как «поздравление от короля <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>». <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> вызывает виверну сигнальным факелом."}, {"t": "1:13:05", "sec": 4385, "html": "Церемония: царица Олега выходит за безжизненное тело <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, привязанное к стойке; жрица «кивает» за него. Протест Горгоны игнорируется. Молодожёнов сажают на плот, смазанный китовым жиром."}, {"t": "1:20:08", "sec": 4808, "html": "Дочь царицы <a class=\"ref\" href=\"/c/romana/\">Романа<\/a> поджигает плот огненной стрелой (ритуальное сожжение). <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> сбрасывает огнеупорного беса Мишу на плот; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> отвлекает внимание речью о «протекторате». Влад, превратившись в жрицу Ипполиту, объявляет настоящую жрицу самозванкой — амазонки бросаются в воду спасать царицу."}, {"t": "1:27:41", "sec": 5261, "html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a>, заранее оставивший <a class=\"ref\" href=\"/c/dzhuna/\">Джуне<\/a> записку «вызови на закате» (и написавший время козьим помётом на окне), телепортируется к ней вместе с <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>. <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> обманом («<a class=\"ref\" href=\"/c/romana/\">Романа<\/a>, я твой отец») останавливает стрельбу; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> некротическим лучом тушит плот, царица Олега прыгает в воду."}, {"t": "1:35:55", "sec": 5755, "html": "В квартире <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a> <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> раскрывает мотив: он против проникновения Тёмного Властелина на небеса (это вызовет хаос и передел), его компаньон <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> ищет Избранное дитя, а задача Миши — найти и уничтожить Эрика. Он сжигает тело Эрика огненным снарядом. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> перестаёт дышать."}, {"t": "1:40:34", "sec": 6034, "html": "Финал: полурослик найден — победа, 60 000 руб. на благотворительность. Закадровый итог: предавший друзей <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сам стал жертвой предательства; некоторые бесы не хотят пускать Тёмного Властелина на небеса."}], "key_events": [{"t": "0:14:40", "sec": 880}, {"t": "0:31:30", "sec": 1890}, {"t": "0:45:53", "sec": 2753}, {"t": "0:47:53", "sec": 2873}, {"t": "0:51:12", "sec": 3072}, {"t": "1:01:28", "sec": 3688}, {"t": "1:07:48", "sec": 4068}, {"t": "1:13:05", "sec": 4385}, {"t": "1:25:07", "sec": 5107}, {"t": "1:27:41", "sec": 5261}, {"t": "1:38:35", "sec": 5915}], "coins": {"ep": "35", "events": [{"t": "0:43:38", "kind": "earn", "who": "Ангелин «Колосажатель»", "actor": "Гоген Солнцев", "to": null, "reason": "получил монету за идею разобраться с охраной-голубями, чтобы гном стал сговорчивее", "result": null, "sec": 2618, "who_url": "/c/angelin/", "reason_html": "получил монету за идею разобраться с охраной-голубями, чтобы гном стал сговорчивее"}, {"t": "1:08:21", "kind": "loot", "who": "Бес Миша", "actor": "Александр Гудков", "to": null, "reason": "роясь в фекалиях в поисках приглашения на свадьбу, нашёл также две золотые монеты", "result": null, "sec": 4101, "who_url": "/c/bes-misha/", "reason_html": "роясь в фекалиях в поисках приглашения на свадьбу, нашёл также две золотые монеты"}, {"t": "1:12:24", "kind": "earn", "who": "Горгона Заголовкина", "actor": "Саша Сулим", "to": null, "reason": "получила монету за газетную аферу — статья о «женитьбе короля тьмы на амазонке», чтобы отвлечь охрану свадьбы", "result": null, "sec": 4344, "who_url": "/c/gorgona-zagolovkina/", "reason_html": "получила монету за газетную аферу — статья о «женитьбе короля тьмы на амазонке», чтобы отвлечь охрану свадьбы"}, {"t": "1:29:26", "kind": "spend", "who": "Бес Миша", "actor": "Александр Гудков", "to": null, "reason": "группа потратила монету, чтобы дать бонус к почти невозможной проверке интеллекта (сложность 16 при интеллекте около нуля)", "result": "недостаточно", "sec": 5366, "who_url": "/c/bes-misha/", "reason_html": "группа потратила монету, чтобы дать бонус к почти невозможной проверке интеллекта (сложность 16 при интеллекте около нуля)"}, {"t": "1:29:29", "kind": "spend", "who": "Бес Миша", "actor": "Александр Гудков", "to": null, "reason": "потратили вторую монету на ещё одну попытку того же безнадёжного броска интеллекта", "result": "всё равно не хватило до 16", "sec": 5369, "who_url": "/c/bes-misha/", "reason_html": "потратили вторую монету на ещё одну попытку того же безнадёжного броска интеллекта"}, {"t": "1:41:03", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска бросили кубики (докинув и дополнительную монетку) для суммы на благотворительность — 60 000 руб.", "result": null, "sec": 6063, "who_url": null, "reason_html": "в конце выпуска бросили кубики (докинув и дополнительную монетку) для суммы на благотворительность — 60 000 руб."}], "totals": [{"who": "Ангелин «Колосажатель»", "actor": "Гоген Солнцев", "earned": 1, "spent": 0, "img": "img/chars/angelin.webp", "who_url": "/c/angelin/", "actor_url": "/p/gogen-solncev/"}, {"who": "Горгона Заголовкина", "actor": "Саша Сулим", "earned": 1, "spent": 0, "img": "img/chars/gorgona-zagolovkina.webp", "who_url": "/c/gorgona-zagolovkina/", "actor_url": "/p/sasha-sulim/"}, {"who": "Бес Миша", "actor": "Александр Гудков", "earned": 0, "spent": 2, "img": "img/chars/misha.webp", "who_url": "/c/bes-misha/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Две монеты, потраченные на попытку броска интеллекта со сложностью 16 п ном<\/a> сорвана", "dir": "back", "color": "#3E9A5E"}, {"key": "38", "label": "38", "title": "Возлюбленная", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> — божественный потомок Тёмного Властелина", "dir": "back", "color": "#7C5CD6"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> уничтожил тело для духа Тёмного Властелина", "dir": "back", "color": "#B8901C"}, {"key": "44", "label": "44", "title": "Королевская охота", "note_html": "Погибшее божественное дитя — не <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>: живы ещё два потомка Тёмного Властелина, Лёша и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "dir": "back", "color": "#DD7A2F"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши", "note_html": "В живых остались два потомка Тёмного Властелина — <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> охотится за ними", "dir": "back", "color": "#2F84C8"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "note_html": "Вторая неудачная попытка — охота за Лёшей и <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>", "dir": "back", "color": "#C8423B"}], "quotes_html": ["«Не жив, не мёртв… Это <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> Шрёдингер, что ли?»", "«Мы голуби мира».", "«<a class=\"ref\" href=\"/c/romana/\">Романа<\/a>, я твой отец». — <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a>", "«Милая <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a>, ты не зря продала мне душу. Ты спасла мир». — бес <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>", "«<a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a>, а ты форточку-то закроешь?» — «Позже, <a class=\"ref\" href=\"/c/dzhuna/\">Джуна<\/a>, позже»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a> (гномский город), почтовая голубятня; деревня <a class=\"ref\" href=\"/place/nizhniy-tvorozhok/\">Нижний Творожок<\/a> (таверна «Чарочка», кузница Жоржа); озеро Влажное (временная стоянка амазонок); упоминаются деревня <a class=\"ref\" href=\"/place/gryunberg/\">Грюнберг<\/a>, острова Золотого карпа, баня «Гномский пар».<\/li>\n<li>Фракции: демоническая армия Тёмного Властелина; голубиная почтовая республика; гномская полиция; амазонки (кочевое племя без мужчин); «Геленбургская правда».<\/li>\n<li>Артефакты: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> (6 зарядов, животная речь); волшебное перо Горгоны; сигнальный факел вызова виверны; почтовый журнал голубятни; расписка <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> о тысяче соток; свадебное приглашение; контракт на душу <a class=\"ref\" href=\"/c/dzhuna/\">Джуны<\/a>; удостоверение адского работника девятого круга; ортопедическая подушка с Вульфберис.<\/li>\n<\/ul>", "chars": {"Романа": {"name": "Романа", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/romana/", "eps": [{"key": "35", "label": "35", "title": "Второй Шанс"}]}, "Бес Капучин": {"name": "Бес Капучин", "img": "img/chars/kapuchin.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9A%D0%B0%D0%BF%D1%83%D1%87%D0%B8%D0%BD", "summary": "Капучи́н — бес, адский работник девятого круга, питающий особую любовь к земной жизни.", "infobox": {"На вики": "Капучин"}, "actors": ["Никита Кукушкин"], "kind": "pc", "dead": false, "race": "бес-баянист", "portraits": [], "url": "/c/bes-kapuchino/", "eps": [{"key": "17", "label": "17", "title": "Демонизация"}, {"key": "35", "label": "35", "title": "Второй Шанс"}]}, "Царица Олега": {"name": "Царица Олега", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/carica-olega/", "eps": [{"key": "3
