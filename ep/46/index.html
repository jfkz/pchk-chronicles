<script>window.EPD = {"anim": false, "key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "date": "2026-02-21", "minutes": 128, "duration": 7666.0, "video_id": "fWKNerWKgBo", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Чёрный Геленбург: дом чернокнижника, редакция «Геленбургской правды», пекарня, подземный штаб повстанцев, Аббатство Солнца с порталом на небеса", "short_html": "Отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> расследует убийство чернокнижника и выходит на подполье, готовящее удар по аду.", "summary_html": "После победы в гонке за желанием отряд падшего рыцаря <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> добился того, что джинн открыл портал на небеса в Аббатстве Солнца в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>, но демонов пока не пускает <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>. Сфинктериону поручают расследовать убийство чернокнижника Тотона Длиннобрового, искавшего способ провести демонов через портал. След через газету «Геленбургская правда» и пекаря-связного Ромбабу выводит героев на подземный штаб подпольщиков ББПП («Боевая бригада повстанцев-праведников»), действующих с благословения небес: взрыв на химической фабрике должен отвлечь демонов, пока валькирии через портал установят святую бомбу. Сфинктерион предупреждает Тёмного Властелина, становится его чемпионом и во главе демонических отрядов уничтожает валькирий у портала. Бомбу захватывают неактивированной; Сфинктерион отказывается активировать её для себя и везёт Тёмному Властелину, решив остаться «земным правителем».", "outcome_html": "Прорыв небесных сил через портал отбит, святая бомба захвачена и отправлена Тёмному Властелину. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> стал чемпионом Тёмного Властелина, но остался «земным правителем» и тайно готов взорвать повелителя, если тот навредит людям.", "world_html": ["<a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> открыл портал на небеса в Аббатстве Солнца; демонов удерживает <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>", "Небеса открыто вступили в войну: валькирии, святая бомба, обещание прощения восставшим людям", "Подполье ББПП в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> обезглавлено (штаб уничтожен, связной погиб)", "Химическая фабрика <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> взорвана", "Портал закован цепями из демонической стали", "<a class=\"ref\" href=\"/a/svyataya-bomba/\">Святая бомба<\/a> у Тёмного Властелина", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — чемпион Тёмного Властелина"], "scenes": [{"t": "0:01:28", "sec": 88, "html": "Предыстория: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в гневе убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и тем исполнил демонический контракт — <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стал Чёрным. Чтобы спасти земной мир, рыцарь присягнул Тёмному Властелину и взялся помочь ему подняться на небеса; дважды не сумел добыть божественных потомков Тёмного Властелина, затем выиграл гонку за желанием джинна и потребовал портал на небеса."}, {"t": "0:03:16", "sec": 196, "html": "Пролог: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> разговаривает с матерью-баронессой, которая правит родовыми землями; она слышала, что сын «предал род людской». Он отвечает, что готов слыть монстром, лишь бы защитить её, своих людей и весь мир."}, {"t": "0:05:42", "sec": 342, "html": "Завязка: джинн открыл портал в бывшем Аббатстве Солнца на горе; <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> не пускает демонов на небеса, а ангелов в ад. Порабощённые жители куют оружие для адской армии. Найден мёртвым чернокнижник Тотон Длиннобровый, продавший душу демонам и искавший способ провести их через портал."}, {"t": "0:06:50", "sec": 410, "html": "Представление героев (все — соратники <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> по гонке за желанием). Отряд едет на огромном адском автомобиле «<a class=\"ref\" href=\"/a/demonovoz/\">Демоновозе<\/a>»."}, {"t": "0:13:22", "sec": 802, "html": "Во дворе дома Тотона демон-«участковый» Матхак и его помощник, бывший жандарм Руперт, казнят соседей чернокнижника, требуя признания. Щекотка призрачной руки <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> случайно заставляет демона разорвать старика; Коленвалус выдворяет Матхака фальшивым приказом на чёрном пергаменте."}, {"t": "0:20:12", "sec": 1212, "html": "Аран де Морт говорит с мёртвым стариком: вечером в 6 в дом зашёл ухоженный богатый мужчина в очках с длинными волосами. Сосед-любитель детективов Ливай назначен «главным свидетелем»; Лосус вырезает ему на руке букву «С»."}, {"t": "0:26:24", "sec": 1584, "html": "Дом-лаборатория разгромлен, у Тотона отрублена голова; следов магии нет — борьба была физической, раны от крупного лезвия и кинжалов. Время смерти — с полуночи до двух. Найдены: записная книжка (встреча с репортёром «Геленбургской правды» Хорстом Федером в 6 вечера), гомункул, называющий Лосуса «папой», приклеенный под столом пульсирующий камень, бумаги об исследованиях проникновения на небеса, карманные часы с буквами «ББП» и запиской «8 вечера»; следы взлома окна ведут из канализации. Мастер запускает отсчёт из шести делений."}, {"t": "0:33:22", "sec": 2002, "html": "Отряд делится: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и Лосус едут в редакцию, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> и Аран де Морт спускаются в канализацию, где следов нет, а рой крыс нападает на Аран де Морт — все трое еле спасаются."}, {"t": "0:39:41", "sec": 2381, "html": "Редакция «Геленбургской правды» («Вся правда в правде»). Лосус «Шёпотом могил» доводит Хорста Федера до полусмерти (1 хит). Главный редактор, демоница Белиала, уводит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в кабинет; её заклинание не срабатывает — камень оказывается камнем антимагии. Сфинктерион шантажом заставляет её сотрудничать."}, {"t": "0:48:58", "sec": 2938, "html": "Лосус угрозами жене Хорста Тине выбивает признание: Хорст по заданию ББПП подложил камень чернокнижнику; жрецы, оставшиеся в городе, передают от богов, что каждый восставший против демонов будет прощён и контракты могут быть отменены; связной — пекарь Ромбаба. В столе Хорста — этикетки пекарни (одна обожжена) и клей. Пламя короны <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> проявляет тайнопись: «Проникни к Тотону и спрячь камень у него в доме». Белиала отрывает Хорсту голову."}, {"t": "1:03:51", "sec": 3831, "html": "Пекарня «Ромбаба»: в тележке — тайник с белыми чернилами, пером и свечой; под ковром — люк в канализацию и шифровка из чисел. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> расшифровывает её по газете: «В 8 вечера устроить хлопок в химической мастерской» и «бей демонов в том районе». По следам муки герои идут по канализации."}, {"t": "1:12:07", "sec": 4327, "html": "Камень антимагии развеивает иллюзорный завал; Лосус замечает растяжку. За ней — бывший коллектор, превращённый в подземный храм и штаб повстанцев, со статуей ангела («Кай-ангел») с божественными прожилками. Трое повстанцев жгут бумаги; уже 7 вечера."}, {"t": "1:15:25", "sec": 4525, "html": "Бой: повстанцы бросают бомбы в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, Лосус и <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> ранят их, Сфинктерион убивает одного, Лосус насаживает другого на меч статуи — статуя лечит «доброго» повстанца. Рука Аран де Морт случайно бьёт её саму; Сфинктерион некротическим лучом обрушивает статую — повстанца размазывает, Аран де Морт придавлена, но её откачивают. Последний, «мучной» повстанец (Ромбаба) сбивает Ангелина в чан со святой водой (38 урона, 0 хитов) и подрывает себя бомбой рядом со Сфинктерионом; Аран де Морт реанимирует Ангелина."}, {"t": "1:41:00", "sec": 6060, "html": "Трофеи: три больших зелья лечения, компоненты для бомб, настоящий план ББПП и голова Тотона. Голова: убийцы — двое мёртвых повстанцев; «святая бомба» пришла «из-за границы», после активации её не остановить, но на активацию нужна минута. План: взрыв в 8 вечера на химической фабрике отвлечёт бесов, а в 9 вечера из портала выйдут валькирии."}, {"t": "1:46:33", "sec": 6393, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> впервые связывается с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a> через <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>. Тот стягивает все демонические силы к порталу и провозглашает Сфинктериона своим чемпионом. Отряд позволяет фабрике взорваться, подрывает мосты от восстания и мчится к Аббатству Солнца; камень антимагии вмуровывают в плитку у портала."}, {"t": "1:51:36", "sec": 6696, "html": "Из портала выходят шесть отрядов валькирий и колесница на двух пегасах с валькирией в очках и трёхметровой святой сферой-бомбой. Массовый бой отрядов: 10 отрядов демонов против 6 отрядов валькирий; <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> с огнемётом, гарпунами и «зубами демона» таранит строй валькирий и выдерживает 133 урона."}, {"t": "2:01:14", "sec": 7274, "html": "За секунды до активации <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бьёт валькирию-подрывника шипастым шаром, подтягивает её кошкой, а Лосус добивает стрелой в рот. Бомба не активирована; демонические культисты заковывают портал цепями из демонической стали."}, {"t": "2:04:24", "sec": 7464, "html": "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> велит привезти бомбу ему. Соратники уговаривают <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> оставить её себе и стать сильнее повелителя; он отказывается: «Я не хочу становиться властителем адских отрядов, я хочу оставаться земным правителем», — но просит <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> научить его её активировать, чтобы взорвать себя вместе с Тёмным Властелином, если тот навредит людям."}], "key_events": [{"t": "0:03:16", "sec": 196}, {"t": "0:05:42", "sec": 342}, {"t": "0:26:24", "sec": 1584}, {"t": "0:48:58", "sec": 2938}, {"t": "1:03:51", "sec": 3831}, {"t": "1:15:25", "sec": 4525}, {"t": "1:41:00", "sec": 6060}, {"t": "1:46:33", "sec": 6393}, {"t": "1:51:36", "sec": 6696}, {"t": "2:01:14", "sec": 7274}, {"t": "2:04:24", "sec": 7464}], "coins": {"ep": "46", "events": [{"t": "0:59:48", "kind": "earn", "who": "Леди Аран де Морт", "actor": "Лиза Аранова", "to": null, "reason": "лучший результат проверки Расследования (15) — догадалась прогреть записку над огнём короны Сфинктериона, чтобы проявить тайный текст", "result": null, "sec": 3588, "who_url": "/c/ledi-arandemort/", "reason_html": "лучший результат проверки Расследования (15) — догадалась прогреть записку над огнём короны <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, чтобы проявить тайный текст"}, {"t": "1:12:29", "kind": "earn", "who": "Ускаманос", "actor": "Евгений Чебатков", "to": null, "reason": "подошёл к завалу камней вместе с камнем антимагии и развеял иллюзию, обнаружив скрытый храм", "result": null, "sec": 4349, "who_url": "/c/los-uskomanos/", "reason_html": "подошёл к завалу камней вместе с камнем антимагии и развеял иллюзию, обнаружив скрытый храм"}, {"t": "1:13:41", "kind": "spend", "who": "Ускаманос", "actor": "Евгений Чебатков", "to": null, "reason": "переброс проверки Внимательности при осторожном проходе через храм", "result": "заметил натянутую леску-ловушку под ногами", "sec": 4421, "who_url": "/c/los-uskomanos/", "reason_html": "переброс проверки Внимательности при осторожном проходе через храм"}, {"t": "1:19:19", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "переброс промаха выстрелом из лука по нападавшим у статуи", "result": null, "sec": 4759, "who_url": null, "reason_html": "переброс промаха выстрелом из лука по нападавшим у статуи"}, {"t": "1:31:27", "kind": "other", "who": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "to": null, "reason": "монета за шуточный «эксперимент» — попытку переброса проверки Убеждения без монеты, в полной тишине", "result": null, "sec": 5487, "who_url": "/c/angelin/", "reason_html": "монета за шуточный «эксперимент» — попытку переброса проверки Убеждения без монеты, в полной тишине"}, {"t": "1:31:44", "kind": "spend", "who": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "to": null, "reason": "полноценный переброс проверки Убеждения, чтобы уговорить ангела-стража слезть со статуи", "result": "тоже не сработало", "sec": 5504, "who_url": "/c/angelin/", "reason_html": "полноценный переброс проверки Убеждения, чтобы уговорить ангела-стража слезть со статуи"}, {"t": "1:52:46", "kind": "earn", "who": "Ускаманос", "actor": "Евгений Чебатков", "to": null, "reason": "за решительный командный клич атаковать валькирий («атакуем, сёстры, бля»)", "result": null, "sec": 6766, "who_url": "/c/los-uskomanos/", "reason_html": "за решительный командный клич атаковать валькирий («атакуем, сёстры, бля»)"}, {"t": "1:57:37", "kind": "spend", "who": "Коленвалус Рихтованус", "actor": "Гудков", "to": null, "reason": "переброс атаки зубами демоновоза по обожжённому отряду валькирий", "result": "попадание", "sec": 7057, "who_url": "/c/kolenvalus/", "reason_html": "переброс атаки зубами демоновоза по обожжённому отряду валькирий"}, {"t": "2:04:24", "kind": "spend", "who": "Коленвалус Рихтованус", "actor": "Гудков", "to": null, "reason": "переброс атаки шипастым шаром демоновоза по последней валькирии у бомбы", "result": "попадание (20), почти добил её", "sec": 7464, "who_url": "/c/kolenvalus/", "reason_html": "переброс атаки шипастым шаром демоновоза по последней валькирии у бомбы"}], "totals": [{"who": "Леди Аран де Морт", "actor": "Лиза Аранова", "earned": 1, "spent": 0, "img": null, "who_url": "/c/ledi-arandemort/", "actor_url": "/p/liza-aranova/"}, {"who": "Ускаманос", "actor": "Евгений Чебатков", "earned": 2, "spent": 1, "img": "img/chars/uskamanos.webp", "who_url": "/c/los-uskomanos/", "actor_url": "/p/evgeniy-chebatkov/"}, {"who": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "earned": 1, "spent": 1, "img": "img/chars/angelin.webp", "who_url": "/c/angelin/", "actor_url": "/p/gogen-solncev/"}, {"who": "Коленвалус Рихтованус", "actor": "Гудков", "earned": 0, "spent": 2, "img": "img/chars/kolenvalus.webp", "who_url": "/c/kolenvalus/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Один переброс атаки из лука (1:18:36) не удалось однозначно привязать к персонажу — исключён из totals. В конце выпуска на столе осталась одна монета, докинутый кубик добавил ещё пять (итого 60 000 руб на благотворительность) — общий подсчёт, не по конкретному персонажу."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, падший рыцарь", "role": "", "fate": "выжил; стал чемпионом Тёмного Властелина", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Коленвалус Рихтованус", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "тифлинг, механик-инженер", "role": "", "fate": "выжил", "id": "Коленвалус", "url": "/c/kolenvalus/", "img": "img/chars/kolenvalus.webp", "other": [{"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Ускаманос", "actor": "Евгений Чебатков", "actor_url": "/p/evgeniy-chebatkov/", "race": "лесной эльф, лучник", "role": "", "fate": "выжил", "id": "Лос Ускаманос", "url": "/c/los-uskomanos/", "img": "img/chars/uskamanos.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "41", "label": "41", "title": "Гонка за желанием"}]}, {"name": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "actor_url": "/p/gogen-solncev/", "race": "падший ангел, палач", "role": "", "fate": "выжил (был при смерти)", "id": "Ангелин", "url": "/c/angelin/", "img": "img/chars/angelin.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "35", "label": "35", "title": "Второй Шанс"}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, {"name": "Леди Аран де Морт", "actor": "Лиза Аранова", "actor_url": "/p/liza-aranova/", "race": "человек, некромант", "role": "", "fate": "выжила (была при смерти)", "id": "Леди Аран де Морт", "url": "/c/ledi-arandemort/", "img": null, "other": []}], "npcs": [{"name": "Мать Сфинктериона", "actor": "", "actor_url": null, "race": "", "role": "баронесса, правит родовыми землями", "fate": "жива", "id": null, "url": null, "img": null, "other": []}, {"name": "Тотон Длиннобровый", "actor": "", "actor_url": null, "race": "", "role": "чернокнижник, искал способ провести демонов через портал", "fate": "погиб (убит до событий выпуска)", "id": null, "url": null, "img": null, "other": []}, {"name": "Матхак", "actor": "", "actor_url": null, "race": "", "role": "демон-«участковый»", "fate": "выжил, отстранён", "id": null, "url": null, "img": null, "other": []}, {"name": "Руперт", "actor": "", "actor_url": null, "race": "", "role": "бывший жандарм, помощник Матхака", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Ливай", "actor": "", "actor_url": null, "race": "", "role": "сосед Тотона, свидетель", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Хорст Федер", "actor": "", "actor_url": null, "race": "", "role": "репортёр «Геленбургской правды», агент ББПП", "fate": "погиб (убит Белиалой)", "id": null, "url": null, "img": null, "other": []}, {"name": "Тина Федер", "actor": "", "actor_url": null, "race": "", "role": "журналистка, жена Хорста", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}, {"name": "Белиала", "actor": "", "actor_url": null, "race": "", "role": "демоница, главный редактор «Геленбургской правды»", "fate": "выжила", "id": null, "url": null, "img": null, "other": []}, {"name": "Ромбаба", "actor": "", "actor_url": null, "race": "", "role": "пекарь-связной ББПП", "fate": "погиб (подорвал себя)", "id": null, "url": null, "img": null, "other": []}, {"name": "Валькирии", "actor": "", "actor_url": null, "race": "", "role": "небесные воительницы с святой бомбой", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}, {"name": "Тёмный Властелин", "actor": "", "actor_url": null, "race": "", "role": "предводитель демонов", "fate": "жив", "id": "Брэндон", "url": "/c/brendon-tyomnyy-vlastelin/", "img": "img/chars/tyomnyj-vlastelin.webp", "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Гомункул", "actor": "", "actor_url": null, "race": "", "role": "создание Тотона", "fate": "забран Лосусом", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "Ветвь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: родовые земли баронства Лёвенхартов", "dir": "out", "color": "#C8423B"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "Первая неудачная попытка <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> добыть божественное дитя", "dir": "out", "color": "#C8423B"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "Вторая неудачная попытка — охота за Лёшей и <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "Гонка за желанием: победа отряда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, желание открыть портал на небеса", "dir": "out", "color": "#C8423B"}], "quotes_html": ["«Пусть я буду монстром в чьих-то глазах, но я защищу тебя, своих людей. И весь мир».", "«Когда-то ты был нашим спасителем, а теперь ты стал подстилкой демонов».", "«Я не хочу становиться властителем адских отрядов. Я хочу оставаться земным правителем».", "«Впервые за 5 лет прозвучало слово „хулиганьё“»."], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>: дом-лаборатория Тотона, канализация, редакция «Геленбургской правды», пекарня «Ромбаба», подземный храм-штаб ББПП, химическая фабрика (взорвана), Аббатство Солнца на горе с порталом на небеса; родовые земли Лёвенхартов.<\/li>\n<li>Фракции: демоны Тёмного Властелина, демонические культисты, ББПП (Боевая бригада повстанцев-праведников), жрецы в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>, небесные силы/боги, валькирии.<\/li>\n<li>Артефакты: портал на небеса и <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>; камень антимагии; святая бомба (сфера с божественными символами, из-за Великой границы); <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> (связь с повелителем); огненная корона <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> (огнемёт, гарпуны, зубы демона, шипастый шар); статуя ангела, лечащая добрых и ранящая злых; цепи из демонической стали; план ББПП; зелья лечения; гомункул.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>37<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>37<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>7<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>13<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>2<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>8<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>6<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa46-1\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Голову Тотона спрашивали о портале — вырезано<\/b><\/div><p>Голову Тотона на самом деле спросили, добился ли он успеха в исследованиях портала, но этот фрагмент вырезали. До конца он не дошёл, однако кипа его бумаг, которую забрал <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, станет темой следующих выпусков: тифлинг может закончить начатое Тотоном.<\/p><blockquote>«Вы взяли кипу бумаг с его исследованиями. И это всё в любом случае была бы тема следующих выпусков.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-1\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=459\" target=\"_blank\" rel=\"noopener\">0:07:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa46-2\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Гомункула, судя по всему, забрал Коленвалус<\/b><\/div><p>На подкасте заявку взять гомункула себе приписали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>, а <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> спрашивали, оставит ли он себе «добытого друга». Гомункул при этом называл «папой» <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a>.<\/p><blockquote>«Колинвалус, в этом приключении ты добыл себе друга. Оставишь ли ты себе гомункула?»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep46.md: «<a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> — ... забрал гомункула» — по подкасту гомункула, по-видимому, взял себе <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> (гомункул лишь называет Ускаманоса «папой»); нужно сверить с выпуском.<\/p><p class=\"note\"><a href=\"/pod/qa46/#qa46-2\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=521\" target=\"_blank\" rel=\"noopener\">0:08:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa46-3\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Инфернальный язык — это английский<\/b><\/div><p>Демоны говорили на английском — импровизация мастера: нужен был непонятный язык, который понимает <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Чебатков<\/a>. Это также отсылка к рекламе из выпуска 4, где инфернальным тоже был английский. Бреганов действительно говорил по-английски, звук не переписывали.<\/p><blockquote>«Это абсолютно точная импровизация, потому что просто надо было поговорить на каком-то непонятном языке, но который понимал Чебатков.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-3\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=655\" target=\"_blank\" rel=\"noopener\">0:10:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-4\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Тина Федер, скорее всего, жива<\/b><\/div><p>Белиала увела Тину в кабинет, но, по словам авторов, признала её невиновной: Тина действительно ничего не знала о делах мужа. Демоница сидит на законной контролирующей должности, поэтому, скорее всего, Тина жива и невредима.<\/p><blockquote>«Она выяснила, что скорее всего Тина невиновна... Скорее всего, Тина жива.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-4\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=844\" target=\"_blank\" rel=\"noopener\">0:14:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Белиала вместо Горгоны — не ляп<\/b><\/div><p>Зрители сочли ляпом, что главредом «Геленбургской правды» стала Белиала, хотя в выпуске 35 им была <a class=\"ref\" href=\"/c/gorgona-zagolovkina/\">Горгона Заголовкина<\/a>. Авторы пояснили, что мир живёт между выпусками: после провала с телом <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и его команда впали в немилость, Горгону, видимо, понизили, и газету теперь контролирует демон. Это их предположение.<\/p><blockquote>«Персонаж Горгона Заголовкина представлялась раньше главным редактором «Геленбургской правды», но теперь на этом месте сидит Белиала.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-5\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=908\" target=\"_blank\" rel=\"noopener\">0:15:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-6\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Хорста можно было спасти<\/b><\/div><p>Хорста Федера можно было не убивать: достаточно было не сообщать Белиале, что он предатель. На контролирующей должности у неё не было выбора: получив доказательства, она обязана была его казнить, и мастер намекал героям сжалиться.<\/p><blockquote>«Можно же Белиале было не говорить, что он предатель.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-6\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1034\" target=\"_blank\" rel=\"noopener\">0:17:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-7\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Хорст не сжёг записку: акция «10 этикеток»<\/b><\/div><p>У Хорста было 10 этикеток Ромбабы, и только одна, обожжённая, была посланием. Он не сжёг её до конца, потому что за 10 этикеток пекарь давал бесплатную ромовую бабу: жадность погубила.<\/p><blockquote>«Он купил 10 ромбаб... и подумал: «Если я не сожгу, я ему обратно отдам 10 и получу бесплатную ромбабу».»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-7\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1098\" target=\"_blank\" rel=\"noopener\">0:18:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa46-8\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Метагейм в разговоре с Белиалой разрешили намеренно<\/b><\/div><p><a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> использовал в разговоре с Белиалой сведения из допроса, при котором не присутствовал. Мастер прямо разрешил это, чтобы не тратить хронометраж на лишние действия в мирной сцене. Внутриигровое оправдание: Сфинктерион подозревал Хорста как последнего, кто встречался с Тотоном, и «додавливал» начальницу.<\/p><blockquote>«Саня говорит: «Да, конечно, можешь это использовать», мы просто вырезаем, и он это использует.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-8\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1226\" target=\"_blank\" rel=\"noopener\">0:20:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-9\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>В Чёрном Геленбурге есть раскаявшиеся носители контрактов<\/b><\/div><p>Белиала не верила, что Хорст может предать, раз у него контракт с тёмными силами. Однако в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> есть люди, которые заключили контракт, но хотят вернуться на светлую сторону и спасти душу, — на этом и держится ББПП.<\/p><blockquote>«Есть в Чёрном Геленбурге люди, которые заключили контракт с тёмными силами, но хотели бы снова вернуться на светлую сторону, спасти свою душу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-9\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1351\" target=\"_blank\" rel=\"noopener\">0:22:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-10\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Путь через канализацию у дома Тотона<\/b><\/div><p>Люк у дома Тотона вёл по следам убийц прямо в штаб повстанцев, минуя редакцию; тогда у героев не было бы газеты для шифра. Но убийство произошло около 2 часов ночи, а герои пришли около полудня, следы остыли, и проверка выживания была на сложность 20. Её провалили, поэтому напали крысы. У пекарни следы были свежими, со сложностью 10–15.<\/p><blockquote>«Следы уже поубавились, поэтому там бросок выживания 20, они его не пробросили, соответственно, их атакуют крысы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-10\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1601\" target=\"_blank\" rel=\"noopener\">0:26:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как устроен Чёрный Геленбург и мотивация Сфинктериона<\/b><\/div><p>Демонам в земном мире нужны пища и ресурсы для вторжения на небеса, поэтому люди работают на фабриках. Демоны не убивают людей просто так, а предлагают контракты за привилегии; это обычный тоталитарный режим. Жители <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — заложники обстоятельств, а <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> выбирает меньшее зло: если не пустить демонов на небеса, пострадают <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>, столица и весь мир. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признал, что сам представлял положение людей лучше, чем увидел.<\/p><blockquote>«Жители Геленбурга в некотором смысле — жертва, заложники обстоятельств. Это меньшее зло — это как раз выбор сильного лидера.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-11\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=1856\" target=\"_blank\" rel=\"noopener\">0:30:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-12\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Задумка BRB: бомба как козырь против Тёмного Властелина<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> отказался оставить бомбу себе, чтобы не вызвать подозрений и показать, что выполняет договор. При этом он хочет, чтобы <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> заранее «запрограммировал» бомбу как план Б, если демоны нападут на людей. Сфинктерион не хочет быть главой ада, он хочет остаться земным правителем.<\/p><blockquote>«Нам же ничего не мешает её условно предварительно запрограммировать в своих целях... Это как план Б, что если демоны нападают, то мы условно взрыв устраиваем.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa46/#qa46-12\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2177\" target=\"_blank\" rel=\"noopener\">0:36:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-13\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Первое вступление небес в войну<\/b><\/div><p>Герои в последний раз были в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> в выпуске 24, и выпуск 46 нужен был, чтобы показать, как изменился город, — для этого нарисовали огромную карту. Впервые в бой вступили небесные силы: валькирии сделали вылазку, и баланс сил, нарушенный демонами, начал качаться в другую сторону.<\/p><blockquote>«Первый раз в бой вступили небесные существа, валькирии подключились, вылазку сделали.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-13\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2367\" target=\"_blank\" rel=\"noopener\">0:39:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-14\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Следующее приключение: способ провести демонов через портал<\/b><\/div><p>Авторы спросили <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, в какую сторону вести ветку: использовать портал или взорвать Тёмного Властелина святой бомбой. Сошлись на том, что следующая история начнётся с того, что по записям Тотона придуман способ провести демонов через портал.<\/p><blockquote>«Мы придумали, как демонам войти в портал». — Отлично. Хорошо. Договорились.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-14\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2620\" target=\"_blank\" rel=\"noopener\">0:43:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-15\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Статуя ангела Кая — канал связи ББПП с небесами<\/b><\/div><p>Статуя в штабе повстанцев наполнена божественной энергией: через неё ББПП связывается с небесами и получает от них силу, поэтому она лечит добрых. Ангел Кай реально существует и служит своего рода связным и пропагандистом божественных сил. Некромантка Аран де Морт не набрала на проверке достаточно, чтобы понять, что статуя лечит добрых.<\/p><blockquote>«Это статуя, наполненная божественной энергией, которая даёт возможность боевой бригаде повстанцев-праведников связываться с небесными силами, получать от них силу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-15\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2683\" target=\"_blank\" rel=\"noopener\">0:44:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-16\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Три заготовленные концовки<\/b><\/div><p>Из портала в любом случае выходили шесть отрядов валькирий со святой бомбой. Лучший вариант: герои раскрывают план ББПП и сами поднимают защиту портала — 10 отрядов демонов против 6 (так и вышло: идею связаться с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a> авторы не предусматривали, подойти мог и любой бес на улице). Средний: герои срывают взрыв на химической фабрике, но о вторжении не знают и прибывают к началу боя — 5 отрядов против 6, шансы 50 на 50. Худший: герои отвлекаются, едут на взрыв, и у портала остаются 2 отряда демонов против 6.<\/p><blockquote>«Изначально при подготовке к приключению мы рассматривали три варианта концовки.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-16\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2747\" target=\"_blank\" rel=\"noopener\">0:45:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa46-17\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>На тест-игре авторы поехали на химическую фабрику<\/b><\/div><p>Если бы <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не дёрнул дверь пекарни, героям удалось бы застать Ромбабу врасплох и по газетному шифру выйти на фабрику. На тестовой игре, которую вёл Селезнёв, Шатохин и Бреганов поехали именно туда, а не в канализацию. На фабрике была охрана с досмотром на входе.<\/p><blockquote>«В тестовом приключении мы с Брегановым, Вадик нам его проводил, мы с Саней поехали в химическую лабораторию.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-17\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2875\" target=\"_blank\" rel=\"noopener\">0:47:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa46-18\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Механика массовой битвы отрядов<\/b><\/div><p>Для массового боя придумали своё правило: один отряд демонов против одного отряда валькирий побеждает на 11+ на d20, а вдвоём против одного — уже на 7+. Отряд — это 10 существ. После фазы отрядов бросали кубик на число раундов: если бы их оказалось больше 10, бомба успела бы зарядиться, и взрыв стал бы неотвратим.<\/p><blockquote>«Если один отряд демонов противостоит одному отряду валькирий, то он побеждает, если на кубике выпадет 11 и больше. Но если ... два отряда демонов, то сложность броска будет всего лишь семь.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-18\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=3002\" target=\"_blank\" rel=\"noopener\">0:50:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-19\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Взрыв фабрики не нужно было предотвращать<\/b><\/div><p>Отвечая на упрёк в подсуживании, авторы пояснили: героям нужно было не сорвать взрыв мастерской, а понять, что это отвлекающий манёвр, и вызвать подкрепление к порталу. При неудачных бросках валькирии разметали бы героев, и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> пришлось бы бежать.<\/p><blockquote>«Им не надо было предотвращать взрыв мастерской, им надо было понять, что взрыв мастерской — это отвлекающий манёвр для атаки на портал.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-19\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=3318\" target=\"_blank\" rel=\"noopener\">0:55:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa46-20\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Связь через Щит Чёрного Властелина — импровизация<\/b><\/div><p><a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> раньше ни разу не связывались напрямую; звонок через щит авторы сценарно не закладывали. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признался, что сделал это ещё и потому, что ждал в конце подвоха и хотел заранее усилиться. Авторы сравнили это со скрижалью для связи с <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>.<\/p><blockquote>«Это крутая импровизация была... Мы такое не закладываем сценарно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-20\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=3440\" target=\"_blank\" rel=\"noopener\">0:57:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-21\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Портал уничтожают только с той стороны, где он создан<\/b><\/div><p>Небеса не могли подорвать портал со своей стороны: в небесном мире у него лишь «хвост», выход, а уничтожать нужно ретранслятор в земном мире, где портал создан. Так же было с порталом на <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Острове соблазна<\/a>, кристалл которого <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> уничтожила божественным мечом.<\/p><blockquote>«Правило такое: где портал создан, там и уничтожаем.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-21\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=3826\" target=\"_blank\" rel=\"noopener\">1:03:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-22\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Характеристики святой бомбы<\/b><\/div><p>По сценарию святая бомба наносит 50d12 урона божественным светом в радиусе 200 м и уничтожает всю нежить и мелких бесов. Все видевшие вспышку ослеплены на минуту (10 ходов), а в радиусе 500 м всех отбрасывает на 10 м с уроном 3d6 за падение. Затронутая территория трое суток считается освящённой: злые существа получают 2d6 урона светом в час, демоны уязвимы к нему (двойной урон). Там же трое суток не работают заклинания 6-го уровня и ниже. Валькирии, вероятно, шли на самоубийство: у них есть сопротивление, но взрыв скорее всего убил бы их. Активировать бомбу сложно, у неё целая инструкция, поэтому зарядить её на небесах и просто протолкнуть было нельзя.<\/p><blockquote>«Святая бомба наносит 50d12 урона... Вся территория, которую затронул взрыв, считается освещённой на 3 дня, 72 часа.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-22\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4019\" target=\"_blank\" rel=\"noopener\">1:06:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-23\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Шатохин ждал взрыва и бегства<\/b><\/div><p>Шатохин рассчитывал, что героям не удастся предотвратить взрыв: тогда им пришлось бы за отведённое время уехать за 200 м от эпицентра, а после этого перерисовывать карту города.<\/p><blockquote>«Я думал, что миссия закончится так, что вам не удастся предотвратить взрыв. Взрыв состоится, и я думал, как вы будете убегать.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-23\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4081\" target=\"_blank\" rel=\"noopener\">1:08:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-24\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ускаманос режет бороды не просто так<\/b><\/div><p><a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Чебатков<\/a> сказал, что <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> срезает бороды по какой-то причине, которая ещё раскроется. Его история далеко не раскрыта, а философия такая: он за добро и ради добра готов на любую жестокость.<\/p><blockquote>«Лос Ускаманос за добро. И ради этого добра он готов на любую жестокость.»<\/blockquote><p class=\"note\">Чебатков · <a href=\"/pod/qa46/#qa46-24\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4269\" target=\"_blank\" rel=\"noopener\">1:11:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Головоломка в редакции: давить на жену<\/b><\/div><p>В редакции была простая головоломка: допрашивать нужно было не Хорста Федера, а его жену. Хорст сдавался, только если давили на Тину, что <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> и сделал.<\/p><blockquote>«Надо было допрашивать не Хорста Федера, а давить на его жену. И он давил именно на его жену.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-25\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4332\" target=\"_blank\" rel=\"noopener\">1:12:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-26\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ускаманос не боится мести Клока<\/b><\/div><p><a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманос<\/a> не ждёт встречи с дварфом, которого сжёг в топке <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоза<\/a> в выпуске 41 и который клялся мстить из ада: он уверен, что тот, как и все, просто много болтает. Авторы пообещали выстрелить «чеховским ружьём», когда зрители об этом забудут.<\/p><blockquote>«Лос Ускаманос уверен, что этот дварф, как и все другие, просто много болтает.»<\/blockquote><p class=\"note\">Чебатков · <a href=\"/pod/qa46/#qa46-26\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4394\" target=\"_blank\" rel=\"noopener\">1:13:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa46-28\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Кости принца Коктобеуса забыли убрать из карточки<\/b><\/div><p>В карточке <a class=\"ref\" href=\"/c/los-uskomanos/\">Ускаманоса<\/a> к выпуску 46 по ошибке остались кости <a class=\"ref\" href=\"/c/princ-koktobius/\">принца Коктобеуса<\/a> из выпуска 41. По версии авторов, эльф, как и обещал, отнёс кости и похоронил их у великого эльфийского древа по древним традициям.<\/p><blockquote>«Мы забыли у него убрать вот эти вот кости принца Коктобеуса, с которыми он ходил в гонке за желанием.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-28\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4519\" target=\"_blank\" rel=\"noopener\">1:15:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-29\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Коленвалус не предлагал предательства<\/b><\/div><p><a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a> уговаривал <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> оставить бомбу не ради измены Тёмному Властелину: он хотел, чтобы рыцарь стал ему ровней или сильнее и чтобы его самого боялись. Имея бумаги Тотона, он уверен, что разберётся в бомбе. Бомба одноразовая, со средним уроном около 325, так что ею, скорее всего, можно убить Тёмного Властелина.<\/p><blockquote>«Я его не предлагал предать Властелина, просто хотел, чтобы он стал... Это не предательство, это инженерная мысль.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa46/#qa46-29\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4905\" target=\"_blank\" rel=\"noopener\">1:21:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-30\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>У гомункула будет продолжение<\/b><\/div><p>Авторы пообещали продолжить историю гомункула и выяснить, чей биоматериал использован для его создания. Мастер же так упорно настаивал его покормить, чтобы отвлечь героев и потянуть время, пока шёл счётчик; гомункул плотояден.<\/p><blockquote>«Будет ли продолжение гомункула? Я думаю, что да... отца найдём, или даже не отца, а кто именно сдавал свой биоматериал.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-30\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=5153\" target=\"_blank\" rel=\"noopener\">1:25:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-31\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Матхаку можно было просто приказать уйти<\/b><\/div><p>Как воевода, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мог в официальной форме приказать демону-«участковому» уйти: тот бы немного попрепирался, но ушёл. Грубое «иди отсюда» мастер счёл просто грубостью, а не приказом.<\/p><blockquote>«Реально демону вначале можно было просто приказать уйти... Ну немножко бы попрепирались, но ушёл бы.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-31\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=5279\" target=\"_blank\" rel=\"noopener\">1:27:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa46-32\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Камень антимагии: зря закопали и, возможно, неверно применили<\/b><\/div><p>Камень антимагии, вмурованный у портала, в финальной битве ничего не дал: радиус у него в несколько метров, и игроки лишь усложнили себе жизнь. Почему он блокировал врождённый заговор тифлинга, но не божественную силу статуи, объяснили разным масштабом артефактов. Тут же признали, что могла быть ошибка: огненный снаряд — простейший заговор нулевого уровня.<\/p><blockquote>«Скорее ближе последнее, что игроки просто усложнили себе жизнь... Не, ну там может быть ошибка, да?»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-32\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=5405\" target=\"_blank\" rel=\"noopener\">1:30:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa46-33\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем повстанцы убили Тотона<\/b><\/div><p>Убийство Тотона не было прямо связано с прорывом валькирий. На химфабрике досматривают на входе, и взрывчатку можно пронести только в бездонных сумках, которые были у Тотона: за ними повстанцы и залезли к нему. Заодно они наказали предателя рода людского, помогавшего демонам попасть на небеса. Расследовать, как они рассчитывали, должен был демон в цепях, который просто убивает подозреваемых.<\/p><blockquote>«Способ, как пронести взрывчатку в химическую лабораторию секретно, — это были бездонные сумки... заговорщики залезли к Тотону Длиннобровому для того, чтобы их добыть.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-33\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=5663\" target=\"_blank\" rel=\"noopener\">1:34:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa46-34\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Финал шоу может прийти из любой ветки<\/b><\/div><p>Авторы сказали, что глобальная арка — победа Тёмного Властелина со сменой власти на небесах или изгнание демонов в ад — может завершиться через любую ветку; какая успеет первой, зависит от гостей и кубиков.<\/p><blockquote>«Все ветки могут привести к финалу. Ну вот какая это сделает раньше, вот делайте свои ставки.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-34\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=5916\" target=\"_blank\" rel=\"noopener\">1:38:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-35\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Некромантия в Понии вне закона<\/b><\/div><p>Изучать смерть на трупах в <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> можно, но некромантия, особенно с подъёмом чужих мертвецов и использованием их труда («некрокоммунизм»), — уголовное преступление. Авторы допустили, что Аран де Морт перебралась в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> не только ради знаний, но и из-за гонений.<\/p><blockquote>«По идее, если ты занимаешься некромантией в Понии, то ты сразу пересекаешь линию легальности.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-35\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=6296\" target=\"_blank\" rel=\"noopener\">1:44:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-5\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b><\/div><p>Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку.<\/p><blockquote>«мы не раз использовали персонажей, которые у нас были заявлены в выпусках как NPC, потом мы отдавали их игрокам»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-5\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-3\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Портал из 46-го выпуска охраняет армия валькирий<\/b><\/div><p>Портал на небеса, который <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> получил в 46-м выпуске, не использовали, потому что известно, куда он ведёт: выход на небесной стороне охраняется. Вышедших оттуда сразу растерзала бы армия валькирий.<\/p><blockquote>«Там стоит армия валькирий, и вас просто потрошат.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-3\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1187\" target=\"_blank\" rel=\"noopener\">0:19:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-42\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения<\/b><\/div><p>Распятый ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> — тот же, чья статуя была в 46-м выпуске. Демоны не увезли его делать адский локомотив, как пытались с Мистером Пирожком: публичные пытки почти божественного существа устрашали подполье <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Позже его всё равно превратили бы в локомотив.<\/p><blockquote>«Это акт устрашения, чтобы такого больше не было.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-42\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6790\" target=\"_blank\" rel=\"noopener\">1:53:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><\/section>", "chars": {"Коленвалус": {"name": "Коленвалус", "img": "img/chars/kolenvalus.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9A%D0%BE%D0%BB%D0%B5%D0%BD%D0%B2%D0%B0%D0%BB%D1%83%D1%81", "summary": "Коленвалус Рихтованус – тифлинг-механик, родом из", "infobox": {"Пол": "Мужской", "Раса": "Тифлинг", "Тип": "Игровой", "Игрок": "Александр Гудков"}, "actors": ["Александр Гудков"], "kind": "pc", "dead": true, "race": "Тифлинг", "portraits": [], "url": "/c/kolenvalus/", "eps": [{"key": "41", "label": "41", "title": "Гонка за желанием"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "52", "label": "52", "title": "Накопитель Любви"}]}, "Леди Аран де Морт": {"name": "Леди Аран де Морт", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Лиза Аранова"], "kind": "pc", "dead": false, "race": "человек, некромант", "portraits": [], "url": "/c/ledi-arandemort/", "eps": [{"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}]}, "Сфинктерион": {"name": "Сфинктерион", "img": "img/chars/sfinkterion.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D1%84%D0%B8%D0%BD%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D0%BE%D0%BD", "summary": "Сфинктериóн Лёвенхарт — первый персонаж вселенной «Подземелья Чикен Карри».
