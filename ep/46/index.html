<script>window.EPD = {"anim": false, "key": "46", "label": "46", "title": "Операция \"Гром в аду\"", "date": "2026-02-21", "minutes": 128, "duration": 7666.0, "video_id": "fWKNerWKgBo", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Чёрный Геленбург: дом чернокнижника, редакция «Геленбургской правды», пекарня, подземный штаб повстанцев, Аббатство Солнца с порталом на небеса", "short_html": "Отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, добившийся от джинна портала на небеса в Аббатстве Солнца, расследует убийство чернокнижника Тоттена Длиннобрового, искавшего способ провести демонов через Великую границу. След через газету «Геленбургская правда» и пекаря-связного Ромбабу выводит на подземный штаб подпольщиков ББПП, которые с благословения небес готовят отвлекающий взрыв на фабрике и прорыв валькирий со святой бомбой через портал. Сфинктерион предупреждает Тёмного Властелина, становится его чемпионом и во главе демонических отрядов уничтожает валькирий. Бомба захвачена неактивированной, и Сфинктерион везёт её Тёмному Властелину, отказавшись от власти над адом.", "summary_html": "После победы в гонке за желанием отряд падшего рыцаря <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> добился того, что джинн открыл портал на небеса в Аббатстве Солнца в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>, но демонов пока не пускает <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>. Сфинктериону поручают расследовать убийство чернокнижника Тоттена Длиннобрового, искавшего способ провести демонов через портал. След через газету «Геленбургская правда» и пекаря-связного Ромбабу выводит героев на подземный штаб подпольщиков ББПП («Боевая бригада повстанцев-праведников»), действующих с благословения небес: взрыв на химической фабрике должен отвлечь демонов, пока валькирии через портал установят святую бомбу. Сфинктерион предупреждает Тёмного Властелина, становится его чемпионом и во главе демонических отрядов уничтожает валькирий у портала. Бомбу захватывают неактивированной; Сфинктерион отказывается активировать её для себя и везёт Тёмному Властелину, решив остаться «земным правителем».", "outcome_html": "Прорыв небесных сил через портал отбит, святая бомба захвачена и отправлена Тёмному Властелину. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> стал чемпионом Тёмного Властелина, но остался «земным правителем» и тайно готов взорвать повелителя, если тот навредит людям.", "world_html": ["<a class=\"ref\" href=\"/c/dzhinn-dzhiga/\">Джинн<\/a> открыл портал на небеса в Аббатстве Солнца; демонов удерживает <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>", "Небеса открыто вступили в войну: валькирии, святая бомба, обещание прощения восставшим людям", "Подполье ББПП в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> обезглавлено (штаб уничтожен, связной погиб)", "Химическая фабрика <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> взорвана", "Портал закован цепями из демонической стали", "<a class=\"ref\" href=\"/a/svyataya-bomba/\">Святая бомба<\/a> у Тёмного Властелина", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — чемпион Тёмного Властелина"], "scenes": [{"t": "0:01:28", "sec": 88, "html": "Предыстория: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> в гневе убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и тем исполнил демонический контракт — <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стал Чёрным. Чтобы спасти земной мир, рыцарь присягнул Тёмному Властелину и взялся помочь ему подняться на небеса; дважды не сумел добыть божественных потомков Тёмного Властелина, затем выиграл гонку за желанием джинна и потребовал портал на небеса."}, {"t": "0:03:16", "sec": 196, "html": "Пролог: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> разговаривает с матерью-баронессой, которая правит родовыми землями; она слышала, что сын «предал род людской». Он отвечает, что готов слыть монстром, лишь бы защитить её, своих людей и весь мир."}, {"t": "0:05:42", "sec": 342, "html": "Завязка: джинн открыл портал в бывшем Аббатстве Солнца на горе; <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> не пускает демонов на небеса, а ангелов в ад. Порабощённые жители куют оружие для адской армии. Найден мёртвым чернокнижник Тоттен Длиннобровый, продавший душу демонам и искавший способ провести их через портал."}, {"t": "0:06:50", "sec": 410, "html": "Представление героев (все — соратники <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> по гонке за желанием). Отряд едет на огромном адском автомобиле «<a class=\"ref\" href=\"/a/demonovoz/\">Демоновозе<\/a>»."}, {"t": "0:13:22", "sec": 802, "html": "Во дворе дома Тоттена демон-«участковый» Матхак и его помощник, бывший жандарм Руперт, казнят соседей чернокнижника, требуя признания. Щекотка призрачной руки <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> случайно заставляет демона разорвать старика; Коленвалус выдворяет Матхака фальшивым приказом на чёрном пергаменте."}, {"t": "0:20:12", "sec": 1212, "html": "Арандеморт говорит с мёртвым стариком: вечером в 6 в дом зашёл ухоженный богатый мужчина в очках с длинными волосами. Сосед-любитель детективов Ливай назначен «главным свидетелем»; Лосус вырезает ему на руке букву «С»."}, {"t": "0:26:24", "sec": 1584, "html": "Дом-лаборатория разгромлен, у Тоттена отрублена голова; следов магии нет — борьба была физической, раны от крупного лезвия и кинжалов. Время смерти — с полуночи до двух. Найдены: записная книжка (встреча с репортёром «Геленбургской правды» Хорстом Федером в 6 вечера), гомункул, называющий Лосуса «папой», приклеенный под столом пульсирующий камень, бумаги об исследованиях проникновения на небеса, карманные часы с буквами «ББП» и запиской «8 вечера»; следы взлома окна ведут из канализации. Мастер запускает отсчёт из шести делений."}, {"t": "0:33:22", "sec": 2002, "html": "Отряд делится: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и Лосус едут в редакцию, <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалус<\/a>, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> и Арандеморт спускаются в канализацию, где следов нет, а рой крыс нападает на Арандеморт — все трое еле спасаются."}, {"t": "0:39:41", "sec": 2381, "html": "Редакция «Геленбургской правды» («Вся правда в правде»). Лосус «Шёпотом могил» доводит Хорста Федера до полусмерти (1 хит). Главный редактор, демоница Белиала, уводит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в кабинет; её заклинание не срабатывает — камень оказывается камнем антимагии. Сфинктерион шантажом заставляет её сотрудничать."}, {"t": "0:48:58", "sec": 2938, "html": "Лосус угрозами жене Хорста Тине выбивает признание: Хорст по заданию ББПП подложил камень чернокнижнику; жрецы, оставшиеся в городе, передают от богов, что каждый восставший против демонов будет прощён и контракты могут быть отменены; связной — пекарь Ромбаба. В столе Хорста — этикетки пекарни (одна обожжена) и клей. Пламя короны <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> проявляет тайнопись: «Проникни к Тоттену и спрячь камень у него в доме». Белиала отрывает Хорсту голову."}, {"t": "1:03:51", "sec": 3831, "html": "Пекарня «Ромбаба»: в тележке — тайник с белыми чернилами, пером и свечой; под ковром — люк в канализацию и шифровка из чисел. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> расшифровывает её по газете: «В 8 вечера устроить хлопок в химической мастерской» и «бей демонов в том районе». По следам муки герои идут по канализации."}, {"t": "1:12:07", "sec": 4327, "html": "Камень антимагии развеивает иллюзорный завал; Лосус замечает растяжку. За ней — бывший коллектор, превращённый в подземный храм и штаб повстанцев, со статуей ангела («Кай-ангел») с божественными прожилками. Трое повстанцев жгут бумаги; уже 7 вечера."}, {"t": "1:15:25", "sec": 4525, "html": "Бой: повстанцы бросают бомбы в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, Лосус и <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> ранят их, Сфинктерион убивает одного, Лосус насаживает другого на меч статуи — статуя лечит «доброго» повстанца. Рука Арандеморт случайно бьёт её саму; Сфинктерион некротическим лучом обрушивает статую — повстанца размазывает, Арандеморт придавлена, но её откачивают. Последний, «мучной» повстанец (Ромбаба) сбивает Ангелина в чан со святой водой (38 урона, 0 хитов) и подрывает себя бомбой рядом со Сфинктерионом; Арандеморт реанимирует Ангелина."}, {"t": "1:41:00", "sec": 6060, "html": "Трофеи: три больших зелья лечения, компоненты для бомб, настоящий план ББПП и голова Тоттена. Голова: убийцы — двое мёртвых повстанцев; «святая бомба» пришла «из-за границы», после активации её не остановить, но на активацию нужна минута. План: взрыв в 8 вечера на химической фабрике отвлечёт бесов, а в 9 вечера из портала выйдут валькирии."}, {"t": "1:46:33", "sec": 6393, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> впервые связывается с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a> через <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a>. Тот стягивает все демонические силы к порталу и провозглашает Сфинктериона своим чемпионом. Отряд позволяет фабрике взорваться, подрывает мосты от восстания и мчится к Аббатству Солнца; камень антимагии вмуровывают в плитку у портала."}, {"t": "1:51:36", "sec": 6696, "html": "Из портала выходят шесть отрядов валькирий и колесница на двух пегасах с валькирией в очках и трёхметровой святой сферой-бомбой. Массовый бой отрядов: 10 отрядов демонов против 6 отрядов валькирий; <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> с огнемётом, гарпунами и «зубами демона» таранит строй валькирий и выдерживает 133 урона."}, {"t": "2:01:14", "sec": 7274, "html": "За секунды до активации <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бьёт валькирию-подрывника шипастым шаром, подтягивает её кошкой, а Лосус добивает стрелой в рот. Бомба не активирована; демонические культисты заковывают портал цепями из демонической стали."}, {"t": "2:04:24", "sec": 7464, "html": "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> велит привезти бомбу ему. Соратники уговаривают <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> оставить её себе и стать сильнее повелителя; он отказывается: «Я не хочу становиться властителем адских отрядов, я хочу оставаться земным правителем», — но просит <a class=\"ref\" href=\"/c/kolenvalus/\">Коленвалуса<\/a> научить его её активировать, чтобы взорвать себя вместе с Тёмным Властелином, если тот навредит людям."}], "key_events": [{"t": "0:03:16", "sec": 196}, {"t": "0:05:42", "sec": 342}, {"t": "0:26:24", "sec": 1584}, {"t": "0:48:58", "sec": 2938}, {"t": "1:03:51", "sec": 3831}, {"t": "1:15:25", "sec": 4525}, {"t": "1:41:00", "sec": 6060}, {"t": "1:46:33", "sec": 6393}, {"t": "1:51:36", "sec": 6696}, {"t": "2:01:14", "sec": 7274}, {"t": "2:04:24", "sec": 7464}], "coins": {"ep": "46", "events": [{"t": "0:59:48", "kind": "earn", "who": "Леди Арандеморт", "actor": "Лиза Аранова", "to": null, "reason": "лучший результат проверки Расследования (15) — догадалась прогреть записку над огнём короны Сфинктериона, чтобы проявить тайный текст", "result": null, "sec": 3588, "who_url": "/c/ledi-arandemort/", "reason_html": "лучший результат проверки Расследования (15) — догадалась прогреть записку над огнём короны <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, чтобы проявить тайный текст"}, {"t": "1:12:29", "kind": "earn", "who": "Ускаманос", "actor": "Евгений Чебатков", "to": null, "reason": "подошёл к завалу камней вместе с камнем антимагии и развеял иллюзию, обнаружив скрытый храм", "result": null, "sec": 4349, "who_url": "/c/los-uskomanos/", "reason_html": "подошёл к завалу камней вместе с камнем антимагии и развеял иллюзию, обнаружив скрытый храм"}, {"t": "1:13:41", "kind": "spend", "who": "Ускаманос", "actor": "Евгений Чебатков", "to": null, "reason": "переброс проверки Внимательности при осторожном проходе через храм", "result": "заметил натянутую леску-ловушку под ногами", "sec": 4421, "who_url": "/c/los-uskomanos/", "reason_html": "переброс проверки Внимательности при осторожном проходе через храм"}, {"t": "1:19:19", "kind": "spend", "who": null, "actor": null, "to": null, "reason": "переброс промаха выстрелом из лука по нападавшим у статуи", "result": null, "sec": 4759, "who_url": null, "reason_html": "переброс промаха выстрелом из лука по нападавшим у статуи"}, {"t": "1:31:27", "kind": "other", "who": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "to": null, "reason": "монета за шуточный «эксперимент» — попытку переброса проверки Убеждения без монеты, в полной тишине", "result": null, "sec": 5487, "who_url": "/c/angelin/", "reason_html": "монета за шуточный «эксперимент» — попытку переброса проверки Убеждения без монеты, в полной тишине"}, {"t": "1:31:44", "kind": "spend", "who": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "to": null, "reason": "полноценный переброс проверки Убеждения, чтобы уговорить ангела-стража слезть со статуи", "result": "тоже не сработало", "sec": 5504, "who_url": "/c/angelin/", "reason_html": "полноценный переброс проверки Убеждения, чтобы уговорить ангела-стража слезть со статуи"}, {"t": "1:52:46", "kind": "earn", "who": "Ускаманос", "actor": "Евгений Чебатков", "to": null, "reason": "за решительный командный клич атаковать валькирий («атакуем, сёстры, бля»)", "result": null, "sec": 6766, "who_url": "/c/los-uskomanos/", "reason_html": "за решительный командный клич атаковать валькирий («атакуем, сёстры, бля»)"}, {"t": "1:57:37", "kind": "spend", "who": "Коленвалус Рихтованус", "actor": "Гудков", "to": null, "reason": "переброс атаки зубами демоновоза по обожжённому отряду валькирий", "result": "попадание", "sec": 7057, "who_url": "/c/kolenvalus/", "reason_html": "переброс атаки зубами демоновоза по обожжённому отряду валькирий"}, {"t": "2:04:24", "kind": "spend", "who": "Коленвалус Рихтованус", "actor": "Гудков", "to": null, "reason": "переброс атаки шипастым шаром демоновоза по последней валькирии у бомбы", "result": "попадание (20), почти добил её", "sec": 7464, "who_url": "/c/kolenvalus/", "reason_html": "переброс атаки шипастым шаром демоновоза по последней валькирии у бомбы"}], "totals": [{"who": "Леди Арандеморт", "actor": "Лиза Аранова", "earned": 1, "spent": 0, "img": null, "who_url": "/c/ledi-arandemort/", "actor_url": "/p/liza-aranova/"}, {"who": "Ускаманос", "actor": "Евгений Чебатков", "earned": 2, "spent": 1, "img": "img/chars/uskamanos.webp", "who_url": "/c/los-uskomanos/", "actor_url": "/p/evgeniy-chebatkov/"}, {"who": "Ангелин Колосожатель", "actor": "Гоген Солнцев", "earned": 1, "spent": 1, "img": "img/chars/angelin.webp", "who_url": "/c/angelin/", "actor_url": "/p/gogen-solncev/"}, {"who": "Коленвалус Рихтованус", "actor": "Гудков", "earned": 0, "spent": 2, "img": "img/chars/kolenvalus.webp", "who_url": "/c/kolenvalus/", "actor_url": "/p/aleksandr-gudkov/"}], "notes": "Один переброс атаки из лука (1:18:36) не удалось однозначно привязать к персонажу — исключён из totals. В конце выпуска на столе осталась одна монета, докинутый кубик добавил ещё пять (итого 60 000 руб на благотворительность) — общий подсчёт, не по конкретному персонажу."}, "cast": [{"name": "Сфинктерион Лёвенхарт", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, падший рыцарь", "role": "", "fate": "выжил; стал чемпионом Тёмного Властелина", "id": "Сфинктерион", "url": "/c/sfinkterion/", "img": "img/chars/sfinkterion.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "03", "label": "3", "title": "Пещера кобольдов"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "08", "label": "8", "title": "Покушение на Короля"}, {"key": "09", "label": "9", "title": "Человек в железной ма иганьё“»."], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>: дом-лаборатория Тоттена, канализация, редакция «Геленбургской правды», пекарня «Ромбаба», подземный храм-штаб ББПП, химическая фабрика (взорвана), Аббатство Солнца на горе с порталом на небеса; родовые земли Лёвенхартов.<\/li>\n<li>Фракции: демоны Тёмного Властелина, демонические культисты, ББПП (Боевая бригада повстанцев-праведников), жрецы в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>, небесные силы/боги, валькирии.<\/li>\n<li>Артефакты: портал на небеса и <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a>; камень антимагии; святая бомба (сфера с божественными символами, из-за Великой границы); <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Тёмного Властелина<\/a> (связь с повелителем); огненная корона <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; <a class=\"ref\" href=\"/a/demonovoz/\">Демоновоз<\/a> (огнемёт, гарпуны, зубы демона, шипастый шар); статуя ангела, лечащая добрых и ранящая злых; цепи из демонической стали; план ББПП; зелья лечения; гомункул.<\/li>\n<\/ul>", "chars": {"Брэндон": {"name": "Брэндон, Тёмный Властелин", "img": "img/chars/tyomnyj-vlastelin.webp", "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": false, "race": "", "portraits": [], "url": "/c/brendon-tyomnyy-vlastelin/", "eps": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, "Коленвалус": {"name": "Коленвалус", "img": "img/chars/kolenvalus.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9A%D0%BE%D0%BB%D0%B5%D0%BD%D0%B2%D0%B0%D0%BB%D1%83%D1%81", "summary": "Ко
