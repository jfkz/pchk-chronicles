<script>window.EPD = {"anim": false, "key": "51", "label": "51", "title": "Точка невозврата", "date": "2026-07-26", "minutes": 115, "duration": 6889.0, "video_id": "-7zlqEWYvdA", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Осаждённый Чёрный Геленбург и лагерь королевской армии в деревне Защелканка", "short_html": "Под видом гуманитарной телеги отряд <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> проникает в осаждённый <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> к Тёмному Властелину.", "summary_html": "Королевские войска осаждают <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> — последний оплот демонов. Под видом гуманитарной телеги с продовольствием в город отправляют двух «самых ущербных» солдат (Павла Толю и сатира-Жанетт), к которым присоединяется отряд <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> и расколдованная, омоложённая полурослица <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — возлюбленная Тёмного властелина <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>. Герои освобождают распятого ангела <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a>, узнают, что добрая часть духа Брэндона заточена в зеркале Асмодея во дворце лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, и разбивают зеркало, попутно теряя Павла Толю. Внутри зеркала они переживают день трагедии и уговаривают <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> опустить меч; Брэндон возвращает себе тело из праха, воссоединяется с Мелиссой и обещает остановить войну — но «точка невозврата пройдена»: он уже отправил в небесный мир того, кто обрушит Великую границу.", "outcome_html": "<a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> погиб, остальные выжили. Тёмный властелин <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> вернул тело и любовь, обещал освободить <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> и прекратить войну на земле, но начал войну против богов.", "world_html": ["<a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">Зеркало Асмодея<\/a> уничтожено", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> (Тёмный властелин) обрёл физическое тело и получил меч <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса\">17<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> назвал это сверхзадачей <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: вручить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> то самое оружие, которым его покарали, чтобы он поверил в благие намерения отца. Это жест полной открытости без «фиги в кармане»: вот твой прах, твоя любимая и меч отца. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7831\" target=\"_blank\" rel=\"noopener\">2:10:31 ↗<\/a> · <a href=\"#qa51-52-51\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> обещает освободить заложников <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> и остановить войну с <a class=\"ref\" href=\"/place/poniya/\">Понией<\/a><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется<\/b> Вернув добрые чувства, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> утратил слепую ненависть и отпускает заложников Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — в этом победа героев: людей больше не используют как щит демонов. Однако мстить богам за несправедливые законы он хотел изначально, поэтому уйти в домик у леса для него уже не вариант. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7895\" target=\"_blank\" rel=\"noopener\">2:11:35 ↗<\/a> · <a href=\"#qa51-52-52\">к записи<\/a><\/span><\/span>", "Посланник <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> отправлен в небесный мир, чтобы обрушить Великую границу", "<a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> вознёсся на небеса"], "scenes": [{"t": "0:01:38", "sec": 98, "html": "Предыстория: бог <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> запретил богам любовь к земным существам, но его сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> полюбил полурослицу <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>. Гелиос испепелил сына (душа — в преисподнюю), а беременную Мелиссу превратил в каргу. Дух мщения Брэндона стал Тёмным властелином и вырвался из ада по магическому контракту. Раскаявшийся Гелиос отдал свой меч гномке <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a>; та нашла Мелиссу, расколдовала и омолодила её и идёт в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> соединить влюблённых.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него<\/b> Запрет на любовь и потомство богов от земных существ введён не менее 50 лет назад: тогда <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сошёлся с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, и это последнее известное нарушение. Все полубоги родились до запрета; последним «разрешённым» полубогом был сотрудник пиар-отдела из <a href=\"/ep/27/\" title=\"Достучаться до небес\">27-го<\/a> выпуска по имени Вильхем. Значит, <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидии<\/a> больше 50 лет, возможно 70–100: полубоги живут долго и сохраняют молодость. Авторы допустили, что существует ещё неизвестный полубог, рождённый уже при запрете. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1651\" target=\"_blank\" rel=\"noopener\">0:27:31 ↗<\/a> · <a href=\"#qa51-52-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b> Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела <a class=\"ref\" href=\"/c/kupidon/\">купидона<\/a>. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 ↗<\/a> · <a href=\"#qa51-52-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b> <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 ↗<\/a> · <a href=\"#qa51-52-29\">к записи<\/a><\/span><\/span>"}, {"t": "0:03:32", "sec": 212, "html": "Кукольный спектакль о «счастливом финале» (<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> «уехали в отпуск»), переходящий в рекламу."}, {"t": "0:08:40", "sec": 520, "html": "Завязка: королевские войска освободили <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a> и осадили <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. <a class=\"ref\" href=\"/c/korol-poni-v/\">Король Поний V<\/a> приказывает отправить в город телеги с продовольствием для десятков тысяч заложников. <a class=\"ref\" href=\"/c/general-chester/\">Генерал Честер<\/a> решает использовать гуманитарную телегу, чтобы вытащить из города лидера сопротивления <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a>."}, {"t": "0:11:35", "sec": 695, "html": "Представление героев: <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> (оборотень-пони, получил в МФЦ «паспорт хорошей твари» и тут же призван в армию) и сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> в образе Жанетт (после того как у жены «появился второй муж», ушёл, работал администратором таверны «Налево от сосны», открыл «походный бордель» в лагере; за избиение пьяного солдата приговорён к казни, но может искупить вину подвигом)."}, {"t": "0:15:20", "sec": 920, "html": "Генеральский шатёр: грубый генерал Честер «инструктирует» героев. [0:18:39] Входит отряд <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: Талала с мечом, грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> и печальная <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a>. Талала объясняет план «спасти мир любовью». Жрец Солнца чувствует от меча светлую энергию и убеждает генерала отпустить их вместе. Генерал выдаёт свечу с зелёными искрами для сигнала и назначает лидером отряда Милфею (сочтя её единственной разумной).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Соболева и Сатира посадили первыми намеренно; ждали, что они убьют генерала\">7<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Соболева и Сатира посадили первыми намеренно; ждали, что они убьют генерала<\/b> Начало <a href=\"/ep/51/\" title=\"Точка невозврата\">51-го<\/a> выпуска с двумя Ильями задумали заранее: дать им «наиграться» до прихода остальных, чтобы потом было меньше хаоса. Авторы на 80% были уверены, что они убьют <a class=\"ref\" href=\"/c/general-chester/\">генерала Честера<\/a> и к приходу <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> всем придётся прятать труп. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6599\" target=\"_blank\" rel=\"noopener\">1:49:59 ↗<\/a> · <a href=\"#qa51-52-40\">к записи<\/a><\/span><\/span>"}, {"t": "0:31:52", "sec": 1912, "html": "Деревня Защелканка (лагерь королевских войск): по договору с демонами — один кучер и две лошади. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> выпотрошил одну лошадь и залез в её шкуру, <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> стал пони во второй упряжке, Жанетт спрятана в магической коробке Павла, <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — в бочке из-под редьки, <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> — среди брокколи, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — кучер. В пути Милфея (крит) успокаивает Мелиссу; та чувствует, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в городе, но в нём «только злость и ненависть»."}, {"t": "0:40:08", "sec": 2408, "html": "Лесные ворота над лавовым разломом: демон Кормак требует «взятку» — сожрать лошадь. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> призывает лошадь, которая эффектно падает с неба. <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> невидимкой крадёт у демона все повязки-пропуска и инфернальный трезубец. Демон чует от <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> святую энергию меча; Талала врёт, что поила лошадей святой водой, и сбрасывает бочку с водой в лаву."}, {"t": "0:52:34", "sec": 3154, "html": "Разрушенный <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>, Рыночная площадь: голодная толпа; вниз головой на постаменте распят ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a>, демон сечёт его цепью, рядом адский пёс.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения<\/b> Распятый ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> — тот же, чья статуя была в <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">46-м<\/a> выпуске. Демоны не увезли его делать <a class=\"ref\" href=\"/a/adskiy-lokomotiv/\">адский локомотив<\/a>, как пытались с Мистером Пирожком: публичные пытки почти божественного существа устрашали подполье <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Позже его всё равно превратили бы в локомотив. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6790\" target=\"_blank\" rel=\"noopener\">1:53:10 ↗<\/a> · <a href=\"#qa51-52-42\">к записи<\/a><\/span><\/span>"}, {"t": "0:57:51", "sec": 3471, "html": "<a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a>-пародист принимает облик падшего/тёмного рыцаря <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> (видел его «в башне колдуна») и отправляет демона-палача «в отпуск на два дня», получив его плеть. <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> прячет <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a> в коробку; та делится сном: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в разрушенном здании смотрит в зеркало без отражения и от злобы превращается в чудовище; Мелисса хочет отдать ему урну с его прахом, чтобы он вновь обрёл плоть.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сны Мелиссы о Брэндоне — следствие реальной связи, а не внушение\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сны Мелиссы о Брэндоне — следствие реальной связи, а не внушение<\/b> Сны <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> о <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоне<\/a> у <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> не навязаны богами, как видения Лёши или Херона. Их связывает настоящая любовь, и чем ближе Мелисса к Брэндону, тем лучше она чувствует его во сне. Сюжетно сны подсказывали игрокам, что именно зеркало забирает у Брэндона тёплые чувства. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7050\" target=\"_blank\" rel=\"noopener\">1:57:30 ↗<\/a> · <a href=\"#qa51-52-44\">к записи<\/a><\/span><\/span>"}, {"t": "1:07:10", "sec": 4030, "html": "<a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> «исцеляет» внушением хромого горожанина — нога отрывается при ударе по мячу и достаётся адскому псу. Тем временем сатир говорит с <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангелом<\/a>: дух мщения способен лишь на разрушение, пока его доброе начало заточено в зеркале Асмодея; ангел просит убить его божественным оружием, чтобы переродиться на небесах, и называет место — старый дворец на утёсе."}, {"t": "1:15:10", "sec": 4510, "html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> пускает сигнальные искры (попытка выдать это за праздник — критический провал, демоны кричат о саботаже). <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> пронзает <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a> мечом <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, сатир рубит адские цепи трезубцем (крит) — дух ангела возносится и вспышкой ослепляет демонов. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> голым выходит из облика пони; отряд улетает на <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрее<\/a>."}, {"t": "1:21:25", "sec": 4885, "html": "Старый дворец лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (бывшего правителя <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, продавшего душу демонам). Его охраняет желатиновый куб Кисель, обязанный хозяину жизнью. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> представляется «архитектором из ТНТ», герои обещают Киселю солнечный свет; <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> бьёт его лучом меча — куб в экстазе, но отползает, открывая путь к зеркалу.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Кисель не обязан Брэндону жизнью — он благодарен за освобождение\">11<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Кисель не обязан Брэндону жизнью — он благодарен за освобождение<\/b> Формулировка «куб задолжал жизнь» неточна. Кисель — тот самый куб из мусорной комнаты (<a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-й<\/a> выпуск, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> — «Блины»), из которого в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку с контрактом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Когда <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> вернулся из ада, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный властелин<\/a> устроил во дворце место для <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала Асмодея<\/a> и выпустил Киселя из мусорной комнаты. Он единственный проявил к кубу участие, не смог лишь показать ему солнце, поэтому Кисель ему благодарен. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 12 и список NPC) Кисель назван «обязанным хозяину жизнью»; по словам авторов, он не обязан жизнью, а благодарен Тёмному <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">властелину<\/a> за то, что тот выпустил его из мусорной комнаты и проявил к нему заботу.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7138\" target=\"_blank\" rel=\"noopener\">1:58:58 ↗<\/a> · <a href=\"#qa51-52-45\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Солнечный луч Талалы на Киселе не должен был сработать\">12<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Солнечный луч Талалы на Киселе не должен был сработать<\/b> Солнечный луч меча работает только тогда, когда клинок отражает солнце, а над <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрным Геленбургом<\/a> его нет: небо всегда закрыто тучами. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> не дочитал способность до конца, мастер этого не заметил, и зрители потом указали на ошибку. Сцену оставили ради озвучки Бреганова. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7264\" target=\"_blank\" rel=\"noopener\">2:01:04 ↗<\/a> · <a href=\"#qa51-52-46\">к записи<\/a><\/span><\/span>"}, {"t": "1:29:40", "sec": 5380, "html": "<a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">Зеркало Асмодея<\/a> — «кусок абсолютной ночи», поглощающий свет; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> регулярно подолгу в него смотрит. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> замечает внутри что-то светлое. Удар копытами Павла отбрасывает его. [1:32:49] <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> верхом на Андрее под песню (крит) раскалывает зеркало трещиной.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале\">13<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале<\/b> <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> по природе добрый бог, обиженный на отца и богов. В <a class=\"ref\" href=\"/place/ad/\">аду<\/a> Асмодей подсказал ему, что <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> может забрать добрые чувства, которые мешают мести. Брэндон добровольно, без обмана, заключил их туда и стал чистым духом мщения — Тёмным властелином. В зеркало он смотрел, чтобы пересматривать момент своей гибели и проклятия <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и подпитывать ненависть. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 17) сказано, что «<a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> ему дали в преисподней, чтобы он вечно прокручивал день своей гибели»; по словам авторов, зеркало подсказал Асмодей, а <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сам добровольно запер в нём свои добрые чувства и смотрел в него, чтобы подпитывать ненависть.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7337\" target=\"_blank\" rel=\"noopener\">2:02:17 ↗<\/a> · <a href=\"#qa51-52-47\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Механика зеркала Асмодея: три ветки\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Механика зеркала Асмодея: три ветки<\/b> По <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркалу<\/a> нужно попасть против сложности 25 магическим оружием или 30 обычным (только критом); промах наносит атакующему некротический урон. Для разрушения нужно три попадания, и первое вызывает Тёмного властелина, который вселяется в героя. Говорить с ним бесполезно, а бой с ним — ветка, где он убивает всех, кроме <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>. Третья ветка — войти в зеркало с помощью праха, крови или ДНК <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; это видят только смотревшие в зеркало, поэтому <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатир<\/a> снаружи остался. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7468\" target=\"_blank\" rel=\"noopener\">2:04:28 ↗<\/a> · <a href=\"#qa51-52-48\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:10", "sec": 5770, "html": "Тёмный властелин вселяется в Павла Толю; <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> взывает к нему от имени раскаявшегося отца, но дух иссушает тело Павла — <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> погибает (<a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболев<\/a> выбывает).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Механика зеркала Асмодея: три ветки\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Механика зеркала Асмодея: три ветки<\/b> По <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркалу<\/a> нужно попасть против сложности 25 магическим оружием или 30 обычным (только критом); промах наносит атакующему некротический урон. Для разрушения нужно три попадания, и первое вызывает Тёмного властелина, который вселяется в героя. Говорить с ним бесполезно, а бой с ним — ветка, где он убивает всех, кроме <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>. Третья ветка — войти в зеркало с помощью праха, крови или ДНК <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; это видят только смотревшие в зеркало, поэтому <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатир<\/a> снаружи остался. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7468\" target=\"_blank\" rel=\"noopener\">2:04:28 ↗<\/a> · <a href=\"#qa51-52-48\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Тёмный властелин вселился в Павла Толю, потому что это смешно и Соболев уходил\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Тёмный властелин вселился в Павла Толю, потому что это смешно и Соболев уходил<\/b> Для вселения выбрали Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толю<\/a>: он с самого начала вёл себя эксцентрично, это было смешнее всего, а <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a> можно было «отпустить» из игры. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7532\" target=\"_blank\" rel=\"noopener\">2:05:32 ↗<\/a> · <a href=\"#qa51-52-49\">к записи<\/a><\/span><\/span>"}, {"t": "1:41:19", "sec": 6079, "html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> уговаривает <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>; та бросает прах <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> на зеркало, и зеркало затягивает всех (кроме сатира) внутрь. <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> с разбега бьёт в зеркало двумя ногами (крит).<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Механика зеркала Асмодея: три ветки\">14<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Механика зеркала Асмодея: три ветки<\/b> По <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркалу<\/a> нужно попасть против сложности 25 магическим оружием или 30 обычным (только критом); промах наносит атакующему некротический урон. Для разрушения нужно три попадания, и первое вызывает Тёмного властелина, который вселяется в героя. Говорить с ним бесполезно, а бой с ним — ветка, где он убивает всех, кроме <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>. Третья ветка — войти в зеркало с помощью праха, крови или ДНК <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; это видят только смотревшие в зеркало, поэтому <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатир<\/a> снаружи остался. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7468\" target=\"_blank\" rel=\"noopener\">2:04:28 ↗<\/a> · <a href=\"#qa51-52-48\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Зеркало разбил повторный крит сатира, а не уговоры Гелиоса\">16<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Зеркало разбил повторный крит сатира, а не уговоры Гелиоса<\/b> Внутри <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> героям показывают зацикленную сцену у домика. По замыслу её нужно было изменить, нанеся урон <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a>; урон <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> выбрасывал героя из зеркала и убивал его в реальности. Бездействие вело к безумию через спасброски мудрости. Герои лишь уговаривали Гелиоса, а зеркало на самом деле разрушил удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> на критической удаче — второй урон после Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толи<\/a>. Совпадение по времени создало впечатление, что сработали уговоры. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 16) сказано: «<a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> опускает меч в нерешительности — и мир <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> рушится». По словам авторов, зеркало разрушил критический удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> снаружи (повторный урон), а не разговор с Гелиосом.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7658\" target=\"_blank\" rel=\"noopener\">2:07:38 ↗<\/a> · <a href=\"#qa51-52-50\">к записи<\/a><\/span><\/span>"}, {"t": "1:45:38", "sec": 6338, "html": "Внутри зеркала: день трагедии у лесного домика — <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> заносит меч над <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоном<\/a> («не позволю убить наше дитя»). <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> уговаривают Гелиоса (Талала предъявляет его же дары: меч, колокольчик, грифона, скрижаль). Гелиос опускает меч в нерешительности — и мир зеркала рушится.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Зеркало разбил повторный крит сатира, а не уговоры Гелиоса\">16<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Зеркало разбил повторный крит сатира, а не уговоры Гелиоса<\/b> Внутри <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> героям показывают зацикленную сцену у домика. По замыслу её нужно было изменить, нанеся урон <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a>; урон <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> выбрасывал героя из зеркала и убивал его в реальности. Бездействие вело к безумию через спасброски мудрости. Герои лишь уговаривали Гелиоса, а зеркало на самом деле разрушил удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> на критической удаче — второй урон после Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толи<\/a>. Совпадение по времени создало впечатление, что сработали уговоры. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 16) сказано: «<a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> опускает меч в нерешительности — и мир <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> рушится». По словам авторов, зеркало разрушил критический удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> снаружи (повторный урон), а не разговор с Гелиосом.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7658\" target=\"_blank\" rel=\"noopener\">2:07:38 ↗<\/a> · <a href=\"#qa51-52-50\">к записи<\/a><\/span><\/span>"}, {"t": "1:49:12", "sec": 6552, "html": "Во дворце <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> узнаёт <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>; «Горько!» — поцелуй. Зеркало ему дали в преисподней, чтобы он вечно прокручивал день своей гибели. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> отдаёт ему меч <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; Брэндон с помощью праха восстанавливает физическое тело.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале\">13<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале<\/b> <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> по природе добрый бог, обиженный на отца и богов. В <a class=\"ref\" href=\"/place/ad/\">аду<\/a> Асмодей подсказал ему, что <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> может забрать добрые чувства, которые мешают мести. Брэндон добровольно, без обмана, заключил их туда и стал чистым духом мщения — Тёмным властелином. В зеркало он смотрел, чтобы пересматривать момент своей гибели и проклятия <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и подпитывать ненависть. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 17) сказано, что «<a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> ему дали в преисподней, чтобы он вечно прокручивал день своей гибели»; по словам авторов, зеркало подсказал Асмодей, а <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сам добровольно запер в нём свои добрые чувства и смотрел в него, чтобы подпитывать ненависть.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7337\" target=\"_blank\" rel=\"noopener\">2:02:17 ↗<\/a> · <a href=\"#qa51-52-47\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса\">17<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> назвал это сверхзадачей <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: вручить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> то самое оружие, которым его покарали, чтобы он поверил в благие намерения отца. Это жест полной открытости без «фиги в кармане»: вот твой прах, твоя любимая и меч отца. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7831\" target=\"_blank\" rel=\"noopener\">2:10:31 ↗<\/a> · <a href=\"#qa51-52-51\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Брэндон не искал свой прах, потому что не знал о нём\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Брэндон не искал свой прах, потому что не знал о нём<\/b> Прах подходил для восстановления тела не хуже тел потомков (<a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a>), но <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> считал себя полностью уничтоженным. О сохранённом прахе знал только <a class=\"ref\" href=\"/c/domovyonok-kuzya/\">домовёнок Кузя<\/a>, который собрал его (<a href=\"/ep/38/\" title=\"Возлюбленная\">38-й<\/a> выпуск). <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7962\" target=\"_blank\" rel=\"noopener\">2:12:42 ↗<\/a> · <a href=\"#qa51-52-53\">к записи<\/a><\/span><\/span>"}, {"t": "1:52:01", "sec": 6721, "html": "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> обещает освободить пленников города, остановить войну и уйти с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> в домик у леса, построить «новый порядок» ради униженных — но «точка невозврата пройдена»: он уже отправил в небесный мир того, «кто не боится тяжёлых решений»; «<a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> падёт, и в небесах засияет солнце надежды».<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: В «диктанте» 52-го Тёмный властелин ещё не расколдован\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>В «диктанте» 52-го Тёмный властелин ещё не расколдован<\/b> Зрители спросили, почему в начале <a href=\"/ep/52/\" title=\"Накопитель Любви\">52-го<\/a> выпуска Тёмный властелин показан в демоническом облике, хотя в 51-м его расколдовали. Объяснили, что события 52-го происходят раньше финала 51-го: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в конце 51-го говорит, что уже отправил посланника на небеса. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1096\" target=\"_blank\" rel=\"noopener\">0:18:16 ↗<\/a> · <a href=\"#qa51-52-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется<\/b> Вернув добрые чувства, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> утратил слепую ненависть и отпускает заложников Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — в этом победа героев: людей больше не используют как щит демонов. Однако мстить богам за несправедливые законы он хотел изначально, поэтому уйти в домик у леса для него уже не вариант. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7895\" target=\"_blank\" rel=\"noopener\">2:11:35 ↗<\/a> · <a href=\"#qa51-52-52\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:08:40", "sec": 520}, {"t": "0:19:05", "sec": 1145}, {"t": "0:40:08", "sec": 2408}, {"t": "0:57:51", "sec": 3471}, {"t": "1:08:58", "sec": 4138}, {"t": "1:17:15", "sec": 4635}, {"t": "1:35:35", "sec": 5735}, {"t": "1:37:00", "sec": 5820}, {"t": "1:45:38", "sec": 6338}, {"t": "1:52:01", "sec": 6721}], "coins": {"ep": "51", "events": [{"t": "0:27:11", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета за шутку в разговоре перед началом игры (предложили показать пресс), получатель по фрагменту не ясен", "result": null, "sec": 1631, "who_url": null, "reason_html": "монета за шутку в разговоре перед началом игры (предложили показать пресс), получатель по фрагменту не ясен"}, {"t": "0:45:55", "kind": "earn", "who": "Милфея", "actor": "Бортич", "to": null, "reason": "за отличный план с розыгрышем демонов при помощи призванной лошади", "result": null, "sec": 2755, "who_url": "/c/milfeya/", "reason_html": "за отличный план с розыгрышем демонов при помощи призванной лошади"}, {"t": "0:55:04", "kind": "earn", "who": "Талала", "actor": "Гудков", "to": null, "reason": "за план освободить ангела без драки с демонами", "result": null, "sec": 3304, "who_url": "/c/gnomka-talala/", "reason_html": "за план освободить ангела без драки с демонами"}, {"t": "0:58:51", "kind": "earn", "who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "to": null, "reason": "за находчивость: вспомнил и красочно описал, что видел демона Синктариона, чтобы правдоподобно замаскироваться под него", "result": null, "sec": 3531, "who_url": "/c/satir-dudochnik/", "reason_html": "за находчивость: вспомнил и красочно описал, что видел демона Синктариона, чтобы правдоподобно замаскироваться под него"}, {"t": "1:44:23", "kind": "spend", "who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "to": null, "reason": "потратил монету на переброс броска атаки (прыжок в зеркало, сложность 30)", "result": "продолжили перебрасывать", "sec": 6263, "who_url": "/c/satir-dudochnik/", "reason_html": "потратил монету на переброс броска атаки (прыжок в зеркало, сложность 30)"}, {"t": "1:44:37", "kind": "spend", "who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "to": null, "reason": "потратил ещё одну монету на очередной переброс того же броска", "result": "в итоге критическая удача", "sec": 6277, "who_url": "/c/satir-dudochnik/", "reason_html": "потратил ещё одну монету на очередной переброс того же броска"}], "totals": [{"who": "Милфея", "actor": "Бортич", "earned": 1, "spent": 0, "img": "img/chars/milfeya.webp", "who_url": "/c/milfeya/", "actor_url": "/p/aleksandra-bortich/"}, {"who": "Талала", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/talala.webp", "who_url": "/c/gnomka-talala/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "earned": 1, "spent": 2, "img": "img/chars/satir-dudochnik.webp", "who_url": "/c/satir-dudochnik/", "actor_url": "/p/satir/"}], "notes": "Всего в выпуске выдано 4 монеты (одна — получателя по фрагменту не установить) и потрачено 2, обе — на переброс одного и того же сложного броска (прыжок в зеркало со сложностью 30), который под конец увенчался критической удачей; передач монет между игроками и лутовых (внутриигровых) монет в этом выпуске не зафиксировано."}, "cast": [{"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, воин света с мечом Гелиоса", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "25", "label": "25", "title": "Остров соблазна"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "42", "label": "42", "title": "Чудная Долина"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса\">17<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> назвал это сверхзадачей <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: вручить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> то самое оружие, которым его покарали, чтобы он поверил в благие намерения отца. Это жест полной открытости без «фиги в кармане»: вот твой прах, твоя любимая и меч отца. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7831\" target=\"_blank\" rel=\"noopener\">2:10:31 ↗<\/a> · <a href=\"#qa51-52-51\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Будущее ветки Талалы не решено\">22<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Будущее ветки Талалы не решено<\/b> На вопрос о продолжении ветки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> определённого ответа не дали. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что Талала «всё отдала» и ей остаётся устроить личную жизнь; шутили о романе с Кузей. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8269\" target=\"_blank\" rel=\"noopener\">2:17:49 ↗<\/a> · <a href=\"#qa51-52-56\">к записи<\/a><\/span><\/span>"}, {"name": "Грифон Андрей", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "небесный грифон, бывший скакун Гелиоса", "role": "", "fate": "выжил", "id": "Андрей", "url": "/c/grifon-andrey/", "img": "img/chars/andrej.webp", "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "42", "label": "42", "title": "Чудная Долина"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Грифон Андрей — нейтральный мудрец-«маркетолог»\">23<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Грифон Андрей — нейтральный мудрец-«маркетолог»<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> описал грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> как скорее нейтрального верного соратника. Он мудрец и «смотрящий за <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесным миром<\/a>»: понимает, что небожители часто творят глупости, и старается подать их поступки так, будто они мудрые. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8693\" target=\"_blank\" rel=\"noopener\">2:24:53 ↗<\/a> · <a href=\"#qa51-52-57\">к записи<\/a><\/span><\/span>"}, {"name": "Милфея", "actor": "Александра Бортич", "actor_url": "/p/aleksandra-bortich/", "race": "фея-проказница, бард", "role": "", "fate": "выжила", "id": "Милфея", "url": "/c/milfeya/", "img": "img/chars/milfeya.webp", "other": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Бортич получила задание помогать Талале продвигать сюжет\">8<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Бортич получила задание помогать Талале продвигать сюжет<\/b> <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Александре Бортич<\/a> дали отдельную задачу — помогать <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> пройти миссию, потому что <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболев<\/a> и <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> будут создавать хаос, а Гудкову тяжело вести отряд. Поэтому <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> порой буквально затыкала партнёров. Сама Бортич добавила, что до монтажа хаоса было гораздо больше и она лишь пыталась не дать отряду погибнуть у телеги. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6662\" target=\"_blank\" rel=\"noopener\">1:51:02 ↗<\/a> · <a href=\"#qa51-52-41\">к записи<\/a><\/span><\/span>"}, {"name": "Сатир Дудочник", "actor": "Сатир", "actor_url": "/p/satir/", "race": "сатир, мастер перевоплощений/пародист", "role": "", "fate": "выжил", "id": "Дудочник", "url": "/c/satir-dudochnik/", "img": "img/chars/satir-dudochnik.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Зеркало разбил повторный крит сатира, а не уговоры Гелиоса\">16<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Зеркало разбил повторный крит сатира, а не уговоры Гелиоса<\/b> Внутри <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> героям показывают зацикленную сцену у домика. По замыслу её нужно было изменить, нанеся урон <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a>; урон <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> выбрасывал героя из зеркала и убивал его в реальности. Бездействие вело к безумию через спасброски мудрости. Герои лишь уговаривали Гелиоса, а зеркало на самом деле разрушил удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> на критической удаче — второй урон после Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толи<\/a>. Совпадение по времени создало впечатление, что сработали уговоры. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 16) сказано: «<a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> опускает меч в нерешительности — и мир <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> рушится». По словам авторов, зеркало разрушил критический удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> снаружи (повторный урон), а не разговор с Гелиосом.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7658\" target=\"_blank\" rel=\"noopener\">2:07:38 ↗<\/a> · <a href=\"#qa51-52-50\">к записи<\/a><\/span><\/span>"}, {"name": "Павел Толя", "actor": "Илья Соболев", "actor_url": "/p/ilya-sobolev/", "race": "оборотень (превращается в пони)", "role": "", "fate": "погиб", "id": "Павел Толя", "url": "/c/pavel-tolya/", "img": "img/chars/pavel-tolya.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Тёмный властелин вселился в Павла Толю, потому что это смешно и Соболев уходил\">15<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Тёмный властелин вселился в Павла Толю, потому что это смешно и Соболев уходил<\/b> Для вселения выбрали Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толю<\/a>: он с самого начала вёл себя эксцентрично, это было смешнее всего, а <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a> можно было «отпустить» из игры. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7532\" target=\"_blank\" rel=\"noopener\">2:05:32 ↗<\/a> · <a href=\"#qa51-52-49\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Мелисса", "actor": "", "actor_url": null, "race": "", "role": "полурослица, возлюбленная Брэндона, расколдована и омоложена", "fate": "выжила, воссоединилась с Брэндоном", "id": "Мелисса", "url": "/c/melissa/", "img": null, "other": [{"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "42", "label": "42", "title": "Чудная Долина"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b> Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела <a class=\"ref\" href=\"/c/kupidon/\">купидона<\/a>. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 ↗<\/a> · <a href=\"#qa51-52-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Сны Мелиссы о Брэндоне — следствие реальной связи, а не внушение\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Сны Мелиссы о Брэндоне — следствие реальной связи, а не внушение<\/b> Сны <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> о <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоне<\/a> у <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> не навязаны богами, как видения Лёши или Херона. Их связывает настоящая любовь, и чем ближе Мелисса к Брэндону, тем лучше она чувствует его во сне. Сюжетно сны подсказывали игрокам, что именно зеркало забирает у Брэндона тёплые чувства. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7050\" target=\"_blank\" rel=\"noopener\">1:57:30 ↗<\/a> · <a href=\"#qa51-52-44\">к записи<\/a><\/span><\/span>"}, {"name": "Брэндон", "actor": "", "actor_url": null, "race": "", "role": "сын Гелиоса, дух мщения, повелитель демонов", "fate": "обрёл тело и доброе начало, остановил войну на земле, но начал поход против небес", "id": "Брэндон", "url": "/c/brendon-tyomnyy-vlastelin/", "img": "img/chars/tyomnyj-vlastelin.webp", "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "46", "label": "46", "title": "Операция \"Гром в аду\""}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b> Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела <a class=\"ref\" href=\"/c/kupidon/\">купидона<\/a>. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 ↗<\/a> · <a href=\"#qa51-52-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Имя Брэндон — кельтское, «принц»; пантеон эклектичен\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Имя Брэндон — кельтское, «принц»; пантеон эклектичен<\/b> Имя <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> авторы назвали кельтским и перевели как «принц». Боги ПЧК намеренно эклектичны по происхождению имён. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4231\" target=\"_blank\" rel=\"noopener\">1:10:31 ↗<\/a> · <a href=\"#qa51-52-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b> <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 ↗<\/a> · <a href=\"#qa51-52-29\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале\">13<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале<\/b> <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> по природе добрый бог, обиженный на отца и богов. В <a class=\"ref\" href=\"/place/ad/\">аду<\/a> Асмодей подсказал ему, что <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> может забрать добрые чувства, которые мешают мести. Брэндон добровольно, без обмана, заключил их туда и стал чистым духом мщения — Тёмным властелином. В зеркало он смотрел, чтобы пересматривать момент своей гибели и проклятия <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и подпитывать ненависть. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 17) сказано, что «<a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> ему дали в преисподней, чтобы он вечно прокручивал день своей гибели»; по словам авторов, зеркало подсказал Асмодей, а <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сам добровольно запер в нём свои добрые чувства и смотрел в него, чтобы подпитывать ненависть.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7337\" target=\"_blank\" rel=\"noopener\">2:02:17 ↗<\/a> · <a href=\"#qa51-52-47\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется<\/b> Вернув добрые чувства, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> утратил слепую ненависть и отпускает заложников Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — в этом победа героев: людей больше не используют как щит демонов. Однако мстить богам за несправедливые законы он хотел изначально, поэтому уйти в домик у леса для него уже не вариант. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7895\" target=\"_blank\" rel=\"noopener\">2:11:35 ↗<\/a> · <a href=\"#qa51-52-52\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Брэндон не искал свой прах, потому что не знал о нём\">19<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Брэндон не искал свой прах, потому что не знал о нём<\/b> Прах подходил для восстановления тела не хуже тел потомков (<a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a>), но <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> считал себя полностью уничтоженным. О сохранённом прахе знал только <a class=\"ref\" href=\"/c/domovyonok-kuzya/\">домовёнок Кузя<\/a>, который собрал его (<a href=\"/ep/38/\" title=\"Возлюбленная\">38-й<\/a> выпуск). <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7962\" target=\"_blank\" rel=\"noopener\">2:12:42 ↗<\/a> · <a href=\"#qa51-52-53\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Брэндон — бог-посланник и наследник, «обманутый бог наследства»\">20<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Брэндон — бог-посланник и наследник, «обманутый бог наследства»<\/b> Своей сферы у <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> не было: он был наследником, а также посланником небес к людям, вроде Прометея. В отличие от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, пребывавшего на небесах, он ходил по земному миру, изучал проблемы людей и одаривал их, например райскими елями для <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> и <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8025\" target=\"_blank\" rel=\"noopener\">2:13:45 ↗<\/a> · <a href=\"#qa51-52-54\">к записи<\/a><\/span><\/span>"}, {"name": "Гелиос", "actor": "", "actor_url": null, "race": "", "role": "бог Солнца (в видении внутри зеркала)", "fate": "опустил меч, раскаивается", "id": "Гелиус", "url": "/c/gelius/", "img": null, "other": [{"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}]}, {"name": "Генерал Честер", "actor": "", "actor_url": null, "race": "", "role": "командующий осадой Геленбурга", "fate": "выжил", "id": "Генерал Честер", "url": "/c/general-chester/", "img": null, "other": []}, {"name": "Жрец Солнца", "actor": "", "actor_url": null, "race": "", "role": "поручился за отряд Талалы", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Кай Ангел", "actor": "", "actor_url": null, "race": "", "role": "ангел, лидер сопротивления в Геленбурге", "fate": "убит мечом Гелиоса по своей просьбе, вознёсся", "id": "Кай Ангел", "url": "/c/kay-angel/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения<\/b> Распятый ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> — тот же, чья статуя была в <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">46-м<\/a> выпуске. Демоны не увезли его делать <a class=\"ref\" href=\"/a/adskiy-lokomotiv/\">адский локомотив<\/a>, как пытались с Мистером Пирожком: публичные пытки почти божественного существа устрашали подполье <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Позже его всё равно превратили бы в локомотив. <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6790\" target=\"_blank\" rel=\"noopener\">1:53:10 ↗<\/a> · <a href=\"#qa51-52-42\">к записи<\/a><\/span><\/span>"}, {"name": "Кормак", "actor": "", "actor_url": null, "race": "", "role": "демон-стражник лесных ворот", "fate": "обманут", "id": null, "url": null, "img": null, "other": []}, {"name": "Кисель", "actor": "", "actor_url": null, "race": "", "role": "желатиновый куб, страж дворца", "fate": "ранен солнечным лучом, выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Кисель не обязан Брэндону жизнью — он благодарен за освобождение\">11<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Кисель не обязан Брэндону жизнью — он благодарен за освобождение<\/b> Формулировка «куб задолжал жизнь» неточна. Кисель — тот самый куб из мусорной комнаты (<a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-й<\/a> выпуск, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> — «Блины»), из которого в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку с контрактом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Когда <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> вернулся из ада, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный властелин<\/a> устроил во дворце место для <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала Асмодея<\/a> и выпустил Киселя из мусорной комнаты. Он единственный проявил к кубу участие, не смог лишь показать ему солнце, поэтому Кисель ему благодарен. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 12 и список NPC) Кисель назван «обязанным хозяину жизнью»; по словам авторов, он не обязан жизнью, а благодарен Тёмному <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">властелину<\/a> за то, что тот выпустил его из мусорной комнаты и проявил к нему заботу.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7138\" target=\"_blank\" rel=\"noopener\">1:58:58 ↗<\/a> · <a href=\"#qa51-52-45\">к записи<\/a><\/span><\/span>"}, {"name": "Кара Гелиоса", "actor": "", "actor_url": null, "race": "", "role": "разумный говорящий меч", "fate": "передан Брэндону", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "06", "label": "6", "title": "Адский поезд", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — сестра гнома Динь-Диня из ветви <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Ветвь <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a>, меч <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; гибель <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> на небесах («друг» Талалы)", "dir": "out", "color": "#7C5CD6"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — падший рыцарь, присягнувший Тёмному властелину (в его облик рядится сатир)", "dir": "out", "color": "#C8423B"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "Вероятная отсылка: сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> и история его жены со «вторым мужем»", "dir": "out", "color": "#B8901C"}, {"key": "52", "label": "52", "title": "Накопитель Любви", "note_html": "Посланник <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> на небеса — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>; <a class=\"ref\" href=\"/a/nakopitel-lyubvi/\">Великая граница<\/a> падёт", "dir": "out", "color": "#C8423B"}, {"key": "53", "label": "53", "title": "В поисках Лёши", "note_html": "Родословная Лёши восходит к <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссе<\/a>", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Я верю, что любовь сильнее всего. Клянусь вселенской силой матки». — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>", "«А так надо!» — дрессированная лошадь (сквозной мем выпуска)", "«<a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a>, архитектор. …Я из канала ТНТ „Школа ремонта“». — Павел Толя желатиновому кубу", "«Боги никогда не будут справедливыми, а я больше никогда не буду прежним». — <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a>", "«Не пытайтесь меня переубедить, ибо точка невозврата пройдена». — <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a>"], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> (Рыночная площадь, лесные ворота над лавовым разломом, дворец лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> на утёсе); деревня Защелканка (лагерь королевской армии); <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a>; таверна «Налево от сосны».<\/li>\n<li>Королевская армия <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>; сопротивление <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>; демоны; небесный мир / преисподняя.<\/li>\n<li>Меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>»; зеркало Асмодея (разбито); урна с прахом <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; инфернальный трезубец (у <a class=\"ref\" href=\"/c/milfeya/\">Милфеи<\/a>/сатира); магическая коробка Павла Толи; сигнальная свеча с зелёными искрами; повязки-пропуска демонов; колокольчик и скрижаль, подаренные <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>23<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>23<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>5<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>9<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>2<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>1<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>5<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa48-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Составы ближайших выпусков и «двойной» съёмочный день Талалы и Сфинктериона<\/b><\/div><p>Авторы раскрыли составы: в 49-м — <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, Турал и <a class=\"ref\" href=\"/p/nikita-shevchuk/\">Никита Шевчук<\/a>, в 50-м — Сабина, <a class=\"ref\" href=\"/p/dima-koval/\">Дима Коваль<\/a> и <a class=\"ref\" href=\"/p/ruslan-usachev/\">Руслан Усачев<\/a>. Затем снимали выпуск с <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a>, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатиром<\/a> и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболевым<\/a> и экспериментальный второй мотор с Дашей <a class=\"ref\" href=\"/p/blohina/\">Блохиной<\/a>, Славой <a class=\"ref\" href=\"/p/chepurchenko/\">Чепурченко<\/a> и <a class=\"ref\" href=\"/c/gogen/\">Гогеном<\/a>. Бреганов отметил, что ветки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> снимаются в один день, и события одного выпуска могут сильно повлиять на другой.<\/p><blockquote>«Как в один день и Талала, и Сфинктерион… События одного выпуска сильно пересекаются с событиями другого выпуска и могут очень сильно повлиять на то, что произойдёт в следующем моторе.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa48/#qa48-19\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3717\" target=\"_blank\" rel=\"noopener\">1:01:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/49/\" title=\"Раненый дракон\">#49<\/a>, <a href=\"/ep/50/\" title=\"Крыса корабельная\">#50<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>В «диктанте» 52-го Тёмный властелин ещё не расколдован<\/b><\/div><p>Зрители спросили, почему в начале <a href=\"/ep/52/\" title=\"Накопитель Любви\">52-го<\/a> выпуска Тёмный властелин показан в демоническом облике, хотя в 51-м его расколдовали. Объяснили, что события 52-го происходят раньше финала 51-го: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в конце 51-го говорит, что уже отправил посланника на небеса.<\/p><blockquote>«На тот момент он ещё не был расколдованный.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa51-52/#qa51-52-1\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1096\" target=\"_blank\" rel=\"noopener\">0:18:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-7\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Запрет на связи богов с земными существами — не менее 50 лет; все полубоги рождены до него<\/b><\/div><p>Запрет на любовь и потомство богов от земных существ введён не менее 50 лет назад: тогда <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сошёлся с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a>, и это последнее известное нарушение. Все полубоги родились до запрета; последним «разрешённым» полубогом был сотрудник пиар-отдела из <a href=\"/ep/27/\" title=\"Достучаться до небес\">27-го<\/a> выпуска по имени Вильхем. Значит, <a class=\"ref\" href=\"/c/frigidiya-i-erotika/\">Фригидии<\/a> больше 50 лет, возможно 70–100: полубоги живут долго и сохраняют молодость. Авторы допустили, что существует ещё неизвестный полубог, рождённый уже при запрете.<\/p><blockquote>«Это последний известный факт нарушения. После этого нарушений не было. Все полубоги, рождённые от этих смешанных браков, они были до.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-7\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=1651\" target=\"_blank\" rel=\"noopener\">0:27:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Любовь Брэндона и Мелиссы настоящая, но вызвана золотой стрелой купидона<\/b><\/div><p>Авторы опирались на греческий миф об Амуре: у него есть золотые стрелы, вызывающие любовь, и свинцовые, вызывающие отторжение. В мире ПЧК существует и естественная влюблённость, и любовь «с первого взгляда» от выстрела <a class=\"ref\" href=\"/c/kupidon/\">купидона<\/a>. Любовь <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> — второго рода: чувство настоящее, но его основой стала золотая стрела, выпущенная по приказу <a class=\"ref\" href=\"/c/venera/\">Венеры<\/a>.<\/p><blockquote>«Это любовное чувство настоящее, но… основой для неё была именно золотая стрела Купидона.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-26\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4106\" target=\"_blank\" rel=\"noopener\">1:08:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-27\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Имя Брэндон — кельтское, «принц»; пантеон эклектичен<\/b><\/div><p>Имя <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> авторы назвали кельтским и перевели как «принц». Боги ПЧК намеренно эклектичны по происхождению имён.<\/p><blockquote>«Брэндон — это не американское имя, если что, а оно кельтское, которое с кельтского означает принц.»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa51-52/#qa51-52-27\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4231\" target=\"_blank\" rel=\"noopener\">1:10:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-29\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндон был наследником Гелиоса; после его гибели верховной богиней стала Венера<\/b><\/div><p><a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> готовил <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> в наследники небесного мира. Подставив брата любовью к смертной, <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> после его испепеления сама стала верховной богиней.<\/p><blockquote>«Брэндон был испепелён, и верховным богом стала она сама.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-29\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=4458\" target=\"_blank\" rel=\"noopener\">1:14:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a>, <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-40\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Соболева и Сатира посадили первыми намеренно; ждали, что они убьют генерала<\/b><\/div><p>Начало <a href=\"/ep/51/\" title=\"Точка невозврата\">51-го<\/a> выпуска с двумя Ильями задумали заранее: дать им «наиграться» до прихода остальных, чтобы потом было меньше хаоса. Авторы на 80% были уверены, что они убьют <a class=\"ref\" href=\"/c/general-chester/\">генерала Честера<\/a> и к приходу <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> всем придётся прятать труп.<\/p><blockquote>«Мы вообще думали, они завалят этого генерала, и потом, когда придёт Талала, им всем придётся прятать труп.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-40\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6599\" target=\"_blank\" rel=\"noopener\">1:49:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-41\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Бортич получила задание помогать Талале продвигать сюжет<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandra-bortich/\">Александре Бортич<\/a> дали отдельную задачу — помогать <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> пройти миссию, потому что <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболев<\/a> и <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> будут создавать хаос, а Гудкову тяжело вести отряд. Поэтому <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> порой буквально затыкала партнёров. Сама Бортич добавила, что до монтажа хаоса было гораздо больше и она лишь пыталась не дать отряду погибнуть у телеги.<\/p><blockquote>«Саше Бортич была поставлена задача помогать Саше Гудкову и его персонажу Талале проходить миссию.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-41\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6662\" target=\"_blank\" rel=\"noopener\">1:51:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-42\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения<\/b><\/div><p>Распятый ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> — тот же, чья статуя была в <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">46-м<\/a> выпуске. Демоны не увезли его делать <a class=\"ref\" href=\"/a/adskiy-lokomotiv/\">адский локомотив<\/a>, как пытались с Мистером Пирожком: публичные пытки почти божественного существа устрашали подполье <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Позже его всё равно превратили бы в локомотив.<\/p><blockquote>«Это акт устрашения, чтобы такого больше не было.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-42\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6790\" target=\"_blank\" rel=\"noopener\">1:53:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-44\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясн
