яет неясное или спорное в выпуске\">Уточнение<\/span><b>Сны Мелиссы о Брэндоне — следствие реальной связи, а не внушение<\/b><\/div><p>Сны <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> о <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоне<\/a> у <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> не навязаны богами, как видения Лёши или Херона. Их связывает настоящая любовь, и чем ближе Мелисса к Брэндону, тем лучше она чувствует его во сне. Сюжетно сны подсказывали игрокам, что именно зеркало забирает у Брэндона тёплые чувства.<\/p><blockquote>«Она реально о нём думала, у них есть реальная связь, у них есть любовь.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-44\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7050\" target=\"_blank\" rel=\"noopener\">1:57:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa51-52-45\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Кисель не обязан Брэндону жизнью — он благодарен за освобождение<\/b><\/div><p>Формулировка «куб задолжал жизнь» неточна. Кисель — тот самый куб из мусорной комнаты (<a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-й<\/a> выпуск, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> — «Блины»), из которого в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку с контрактом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Когда <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> вернулся из ада, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный властелин<\/a> устроил во дворце место для <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала Асмодея<\/a> и выпустил Киселя из мусорной комнаты. Он единственный проявил к кубу участие, не смог лишь показать ему солнце, поэтому Кисель ему благодарен.<\/p><blockquote>«Смысл в формулировке. Он не задолжал жизнь Брэндону.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep51.md (п. 12 и список NPC) Кисель назван «обязанным хозяину жизнью»; по словам авторов, он не обязан жизнью, а благодарен Тёмному <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">властелину<\/a> за то, что тот выпустил его из мусорной комнаты и проявил к нему заботу.<\/p><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-45\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7138\" target=\"_blank\" rel=\"noopener\">1:58:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa51-52-46\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Солнечный луч Талалы на Киселе не должен был сработать<\/b><\/div><p>Солнечный луч меча работает только тогда, когда клинок отражает солнце, а над <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрным Геленбургом<\/a> его нет: небо всегда закрыто тучами. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> не дочитал способность до конца, мастер этого не заметил, и зрители потом указали на ошибку. Сцену оставили ради озвучки Бреганова.<\/p><blockquote>«Солнечный луч на мече работает только когда от меча отражается солнце.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-46\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7264\" target=\"_blank\" rel=\"noopener\">2:01:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-47\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Брэндон сам, по совету Асмодея, запер добрые чувства в зеркале<\/b><\/div><p><a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> по природе добрый бог, обиженный на отца и богов. В <a class=\"ref\" href=\"/place/ad/\">аду<\/a> Асмодей подсказал ему, что <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> может забрать добрые чувства, которые мешают мести. Брэндон добровольно, без обмана, заключил их туда и стал чистым духом мщения — Тёмным властелином. В зеркало он смотрел, чтобы пересматривать момент своей гибели и проклятия <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a> и подпитывать ненависть.<\/p><blockquote>«Он добровольно… туда поместил все свои добрые чувства, чтобы быть одержимым только желанием мщения.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep51.md (п. 17) сказано, что «<a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркало<\/a> ему дали в преисподней, чтобы он вечно прокручивал день своей гибели»; по словам авторов, зеркало подсказал Асмодей, а <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> сам добровольно запер в нём свои добрые чувства и смотрел в него, чтобы подпитывать ненависть.<\/p><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-47\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7337\" target=\"_blank\" rel=\"noopener\">2:02:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-48\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Механика зеркала Асмодея: три ветки<\/b><\/div><p>По <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркалу<\/a> нужно попасть против сложности 25 магическим оружием или 30 обычным (только критом); промах наносит атакующему некротический урон. Для разрушения нужно три попадания, и первое вызывает Тёмного властелина, который вселяется в героя. Говорить с ним бесполезно, а бой с ним — ветка, где он убивает всех, кроме <a class=\"ref\" href=\"/c/melissa/\">Мелиссы<\/a>. Третья ветка — войти в зеркало с помощью праха, крови или ДНК <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>; это видят только смотревшие в зеркало, поэтому <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатир<\/a> снаружи остался.<\/p><blockquote>«Чтобы уничтожить зеркало, надо три раза нанести ему урон.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-48\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7468\" target=\"_blank\" rel=\"noopener\">2:04:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-49\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Тёмный властелин вселился в Павла Толю, потому что это смешно и Соболев уходил<\/b><\/div><p>Для вселения выбрали Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толю<\/a>: он с самого начала вёл себя эксцентрично, это было смешнее всего, а <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a> можно было «отпустить» из игры.<\/p><blockquote>«Мне показалось, это будет самым весёлым, поскольку он с самого начала начал вести себя довольно эксцентрично.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-49\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7532\" target=\"_blank\" rel=\"noopener\">2:05:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa51-52-50\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Зеркало разбил повторный крит сатира, а не уговоры Гелиоса<\/b><\/div><p>Внутри <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> героям показывают зацикленную сцену у домика. По замыслу её нужно было изменить, нанеся урон <a class=\"ref\" href=\"/c/gelius/\">Гелиосу<\/a>; урон <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> выбрасывал героя из зеркала и убивал его в реальности. Бездействие вело к безумию через спасброски мудрости. Герои лишь уговаривали Гелиоса, а зеркало на самом деле разрушил удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> на критической удаче — второй урон после Павла <a class=\"ref\" href=\"/c/pavel-tolya/\">Толи<\/a>. Совпадение по времени создало впечатление, что сработали уговоры.<\/p><blockquote>«Сработал повторный урон сатира на критическую удачу, и он разрушил зеркало. Не ваши действия внутри, а именно его урон.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep51.md (п. 16) сказано: «<a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> опускает меч в нерешительности — и мир <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала<\/a> рушится». По словам авторов, зеркало разрушил критический удар <a class=\"ref\" href=\"/c/satir-dudochnik/\">сатира<\/a> снаружи (повторный урон), а не разговор с Гелиосом.<\/p><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-50\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7658\" target=\"_blank\" rel=\"noopener\">2:07:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-51\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Меч отца как символ безоружности: зачем Талала отдала Кару Гелиоса<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> назвал это сверхзадачей <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: вручить <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндону<\/a> то самое оружие, которым его покарали, чтобы он поверил в благие намерения отца. Это жест полной открытости без «фиги в кармане»: вот твой прах, твоя любимая и меч отца.<\/p><blockquote>«Отдать ему оружие, тем, чем он был проклят, в его же руки, чтобы он поверил в благие намерения отца.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa51-52/#qa51-52-51\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7831\" target=\"_blank\" rel=\"noopener\">2:10:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-52\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>«Точка невозврата»: Брэндон отпустит заложников, но от войны с небесами не откажется<\/b><\/div><p>Вернув добрые чувства, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> утратил слепую ненависть и отпускает заложников Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — в этом победа героев: людей больше не используют как щит демонов. Однако мстить богам за несправедливые законы он хотел изначально, поэтому уйти в домик у леса для него уже не вариант.<\/p><blockquote>«От своей цели Брэндон не откажется.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-52\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7895\" target=\"_blank\" rel=\"noopener\">2:11:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-53\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Брэндон не искал свой прах, потому что не знал о нём<\/b><\/div><p>Прах подходил для восстановления тела не хуже тел потомков (<a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>, <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a>), но <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> считал себя полностью уничтоженным. О сохранённом прахе знал только <a class=\"ref\" href=\"/c/domovyonok-kuzya/\">домовёнок Кузя<\/a>, который собрал его (<a href=\"/ep/38/\" title=\"Возлюбленная\">38-й<\/a> выпуск).<\/p><blockquote>«Потому что он не знал, что существует его прах.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-53\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7962\" target=\"_blank\" rel=\"noopener\">2:12:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/38/\" title=\"Возлюбленная\">#38<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-54\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Брэндон — бог-посланник и наследник, «обманутый бог наследства»<\/b><\/div><p>Своей сферы у <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> не было: он был наследником, а также посланником небес к людям, вроде Прометея. В отличие от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, пребывавшего на небесах, он ходил по земному миру, изучал проблемы людей и одаривал их, например райскими елями для <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> и <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>.<\/p><blockquote>«Он бог-посланник от небес к людям. Он поэтому много заботился о людях.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-54\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8025\" target=\"_blank\" rel=\"noopener\">2:13:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa51-52-55\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Связь концовки 51-го с 52-м задумывали, но отказались<\/b><\/div><p>При разработке хотели, чтобы финал 51-го влиял на 52-й, но от этого отказались. В финальном сценарии исход 51-го никак не менял 52-й.<\/p><blockquote>«Мы сначала хотели сделать так, чтобы концовка пятьдесят первого влияла на пятьдесят второй, а потом мы отказались.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-55\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8194\" target=\"_blank\" rel=\"noopener\">2:16:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa51-52-56\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Будущее ветки Талалы не решено<\/b><\/div><p>На вопрос о продолжении ветки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> определённого ответа не дали. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что Талала «всё отдала» и ей остаётся устроить личную жизнь; шутили о романе с Кузей.<\/p><blockquote>«Пока не знаю, кстати.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa51-52/#qa51-52-56\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8269\" target=\"_blank\" rel=\"noopener\">2:17:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa51-52-57\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Грифон Андрей — нейтральный мудрец-«маркетолог»<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> описал грифона <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> как скорее нейтрального верного соратника. Он мудрец и «смотрящий за <a class=\"ref\" href=\"/place/nebesnyy-mir/\">небесным миром<\/a>»: понимает, что небожители часто творят глупости, и старается подать их поступки так, будто они мудрые.<\/p><blockquote>«Он, получается, верный соратник, скорее нейтральный… Короче, он такой маркетолог.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa51-52/#qa51-52-57\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=8693\" target=\"_blank\" rel=\"noopener\">2:24:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a><\/p><\/article><\/section>", "chars": {"Милфея": {"name": "Милфея", "img": "img/chars/milfeya.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9C%D0%B8%D0%BB%D1%84%D0%B5%D1%8F", "summary": "", "infobox": {"Пол": "Женский", "Раса": "Фея", "Тип": "Игровой", "Игрок": "Александра Бортич"}, "actors": ["Александра Бортич"], "kind": "pc", "dead": false, "race": "Фея", "portraits": [{"ep": "31", "thumb": "img/portraits/ad79a351818ea7f2.webp"}], "url": "/c/milfeya/", "eps": [{"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, "Кай Ангел": {"name":
