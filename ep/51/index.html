<script>window.EPD = {"key": "51", "label": "51", "title": "Точка невозврата", "date": "2026-07-26", "minutes": 115, "duration": 6889.0, "video_id": "-7zlqEWYvdA", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Осаждённый Чёрный Геленбург и лагерь королевской армии в деревне Защелканка", "short_html": "Во время осады Чёрного Геленбурга двух штрафников (оборотня-пони Павла Толю и сатира-«Жанетт») и отряд гномки <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> с грифоном <a class=\"ref\" href=\"/c/grifon-andrey/\">Андреем<\/a>, феей <a class=\"ref\" href=\"/c/milfeya/\">Милфеей<\/a> и полурослицей <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> отправляют в город под видом гуманитарной телеги. Герои освобождают распятого ангела <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a> и узнают, что доброе начало Тёмного властелина <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> заточено в зеркале Асмодея во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Разбивая зеркало, они теряют Павла Толю, а внутри зеркала уговаривают <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> опустить меч над сыном. Брэндон воссоединяется с Мелиссой, обретает тело и обещает остановить войну, но уже послал в небесный мир того, кто обрушит Великую границу.", "summary_html": "Королевские войска осаждают Чёрный Геленбург — последний оплот демонов. Под видом гуманитарной телеги с продовольствием в город отправляют двух «самых ущербных» солдат (Павла Толю и сатира-Жанетт), к которым присоединяется отряд <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> и расколдованная, омоложённая полурослица <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — возлюбленная Тёмного властелина <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>. Герои освобождают распятого ангела <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a>, узнают, что добрая часть духа Брэндона заточена в зеркале Асмодея во дворце лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, и разбивают зеркало, попутно теряя Павла Толю. Внутри зеркала они переживают день трагедии и уговаривают <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> опустить меч; Брэндон возвращает себе тело из праха, воссоединяется с Мелиссой и обещает остановить войну — но «точка невозврата пройдена»: он уже отправил в небесный мир того, кто обрушит Великую границу.", "outcome_html": "<a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> погиб, остальные выжили. Тёмный властелин <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> вернул тело и любовь, обещал освободить Геленбург и прекратить войну на земле, но начал войну против богов.", "world_html": ["Зеркало Асмодея уничтожено", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> (Тёмный властелин) обрёл физическое тело и получил меч <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> обещает освободить заложников Геленбурга и остановить войну с Понией", "Посланник <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> отправлен в небесный мир, чтобы обрушить Великую границу", "<a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> вознёсся на небеса"], "scenes": [{"t": "0:01:32", "sec": 92, "html": "Предыстория: бог <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> запретил богам любовь к земным существам, но его сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> полюбил полурослицу <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>. Гелиос испепелил сына (душа — в преисподнюю), а беременную Мелиссу превратил в каргу. Дух мщения Брэндона стал Тёмным властелином и вырвался из ада по магическому контракту. Раскаявшийся Гелиос отдал свой меч гномке <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a>; та нашла Мелиссу, расколдовала и омолодила её и идёт в Чёрный Геленбург соединить влюблённых."}, {"t": "0:03:41", "sec": 221, "html": "Кукольный спектакль о «счастливом финале» (<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> и <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> «уехали в отпуск»), переходящий в рекламу."}, {"t": "0:08:07", "sec": 487, "html": "Завязка: королевские войска освободили Великие равнины и осадили Чёрный Геленбург. <a class=\"ref\" href=\"/c/korol-poni-v/\">Король Поний V<\/a> приказывает отправить в город телеги с продовольствием для десятков тысяч заложников. <a class=\"ref\" href=\"/c/general-chester/\">Генерал Честер<\/a> решает использовать гуманитарную телегу, чтобы вытащить из города лидера сопротивления <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a>."}, {"t": "0:11:17", "sec": 677, "html": "Представление героев: <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> (оборотень-пони, получил в МФЦ «паспорт хорошей твари» и тут же призван в армию) и сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> в образе Жанетт (после того как у жены «появился второй муж», ушёл, работал администратором таверны «Налево от сосны», открыл «походный бордель» в лагере; за избиение пьяного солдата приговорён к казни, но может искупить вину подвигом)."}, {"t": "0:15:31", "sec": 931, "html": "Генеральский шатёр: грубый генерал Честер «инструктирует» героев. [0:18:39] Входит отряд <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: Талала с мечом, грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> и печальная <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a>. Талала объясняет план «спасти мир любовью». Жрец Солнца чувствует от меча светлую энергию и убеждает генерала отпустить их вместе. Генерал выдаёт свечу с зелёными искрами для сигнала и назначает лидером отряда Милфею (сочтя её единственной разумной)."}, {"t": "0:34:31", "sec": 2071, "html": "Деревня Защелканка (лагерь королевских войск): по договору с демонами — один кучер и две лошади. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> выпотрошил одну лошадь и залез в её шкуру, <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> стал пони во второй упряжке, Жанетт спрятана в магической коробке Павла, <a class=\"ref\" href=\"/c/melissa/\">Мелисса<\/a> — в бочке из-под редьки, <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> — среди брокколи, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — кучер. В пути Милфея (крит) успокаивает Мелиссу; та чувствует, что <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в городе, но в нём «только злость и ненависть»."}, {"t": "0:42:57", "sec": 2577, "html": "Лесные ворота над лавовым разломом: демон Кормак требует «взятку» — сожрать лошадь. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> призывает лошадь, которая эффектно падает с неба. <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> невидимкой крадёт у демона все повязки-пропуска и инфернальный трезубец. Демон чует от <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> святую энергию меча; Талала врёт, что поила лошадей святой водой, и сбрасывает бочку с водой в лаву."}, {"t": "0:52:34", "sec": 3154, "html": "Разрушенный Геленбург, Рыночная площадь: голодная толпа; вниз головой на постаменте распят ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a>, демон сечёт его цепью, рядом адский пёс."}, {"t": "0:57:51", "sec": 3471, "html": "<a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a>-пародист принимает облик падшего/тёмного рыцаря <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> (видел его «в башне колдуна») и отправляет демона-палача «в отпуск на два дня», получив его плеть. <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> прячет <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a> в коробку; та делится сном: <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> в разрушенном здании смотрит в зеркало без отражения и от злобы превращается в чудовище; Мелисса хочет отдать ему урну с его прахом, чтобы он вновь обрёл плоть."}, {"t": "1:07:26", "sec": 4046, "html": "<a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> «исцеляет» внушением хромого горожанина — нога отрывается при ударе по мячу и достаётся адскому псу. Тем временем сатир говорит с <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангелом<\/a>: дух мщения способен лишь на разрушение, пока его доброе начало заточено в зеркале Асмодея; ангел просит убить его божественным оружием, чтобы переродиться на небесах, и называет место — старый дворец на утёсе."}, {"t": "1:14:51", "sec": 4491, "html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> пускает сигнальные искры (попытка выдать это за праздник — критический провал, демоны кричат о саботаже). <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> пронзает <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангела<\/a> мечом <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, сатир рубит адские цепи трезубцем (крит) — дух ангела возносится и вспышкой ослепляет демонов. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> голым выходит из облика пони; отряд улетает на <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрее<\/a>."}, {"t": "1:21:07", "sec": 4867, "html": "Старый дворец лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (бывшего правителя Геленбурга, продавшего душу демонам). Его охраняет желатиновый куб Кисель, обязанный хозяину жизнью. <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> представляется «архитектором из ТНТ», герои обещают Киселю солнечный свет; <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> бьёт его лучом меча — куб в экстазе, но отползает, открывая путь к зеркалу."}, {"t": "1:29:37", "sec": 5377, "html": "Зеркало Асмодея — «кусок абсолютной ночи», поглощающий свет; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> регулярно подолгу в него смотрит. <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> замечает внутри что-то светлое. Удар копытами Павла отбрасывает его. [1:32:49] <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> верхом на Андрее под песню (крит) раскалывает зеркало трещиной."}, {"t": "1:35:00", "sec": 5700, "html": "Тёмный властелин вселяется в Павла Толю; <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> взывает к нему от имени раскаявшегося отца, но дух иссушает тело Павла — <a class=\"ref\" href=\"/c/pavel-tolya/\">Павел Толя<\/a> погибает (<a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболев<\/a> выбывает)."}, {"t": "1:41:19", "sec": 6079, "html": "<a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> уговаривает <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>; та бросает прах <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> на зеркало, и зеркало затягивает всех (кроме сатира) внутрь. <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> с разбега бьёт в зеркало двумя ногами (крит)."}, {"t": "1:45:35", "sec": 6335, "html": "Внутри зеркала: день трагедии у лесного домика — <a class=\"ref\" href=\"/c/gelius/\">Гелиос<\/a> заносит меч над <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндоном<\/a> («не позволю убить наше дитя»). <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> уговаривают Гелиоса (Талала предъявляет его же дары: меч, колокольчик, грифона, скрижаль). Гелиос опускает меч в нерешительности — и мир зеркала рушится."}, {"t": "1:48:48", "sec": 6528, "html": "Во дворце <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> узнаёт <a class=\"ref\" href=\"/c/melissa/\">Мелиссу<\/a>; «Горько!» — поцелуй. Зеркало ему дали в преисподней, чтобы он вечно прокручивал день своей гибели. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> отдаёт ему меч <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; Брэндон с помощью праха восстанавливает физическое тело."}, {"t": "1:52:01", "sec": 6721, "html": "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндон<\/a> обещает освободить пленников города, остановить войну и уйти с <a class=\"ref\" href=\"/c/melissa/\">Мелиссой<\/a> в домик у леса, построить «новый порядок» ради униженных — но «точка невозврата пройдена»: он уже отправил в небесный мир того, «кто не боится тяжёлых решений»; «Великая граница падёт, и в небесах засияет солнце надежды»."}], "key_events": [{"t": "0:08:07", "sec": 487}, {"t": "0:18:39", "sec": 1119}, {"t": "0:42:57", "sec": 2577}, {"t": "0:57:51", "sec": 3471}, {"t": "1:08:31", "sec": 4111}, {"t": "1:16:58", "sec": 4618}, {"t": "1:32:49", "sec": 5569}, {"t": "1:37:09", "sec": 5829}, {"t": "1:45:35", "sec": 6335}, {"t": "1:52:01", "sec": 6721}], "coins": {"ep": "51", "events": [{"t": "0:27:07", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "монета за шутку в разговоре перед началом игры (предложили показать пресс), получатель по фрагменту не ясен", "result": null, "sec": 1627, "who_url": null, "reason_html": "монета за шутку в разговоре перед началом игры (предложили показать пресс), получатель по фрагменту не ясен"}, {"t": "0:45:04", "kind": "earn", "who": "Милфея", "actor": "Бортич", "to": null, "reason": "за отличный план с розыгрышем демонов при помощи призванной лошади", "result": null, "sec": 2704, "who_url": "/c/milfeya/", "reason_html": "за отличный план с розыгрышем демонов при помощи призванной лошади"}, {"t": "0:54:43", "kind": "earn", "who": "Талала", "actor": "Гудков", "to": null, "reason": "за план освободить ангела без драки с демонами", "result": null, "sec": 3283, "who_url": "/c/gnomka-talala/", "reason_html": "за план освободить ангела без драки с демонами"}, {"t": "0:58:54", "kind": "earn", "who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "to": null, "reason": "за находчивость: вспомнил и красочно описал, что видел демона Синктариона, чтобы правдоподобно замаскироваться под него", "result": null, "sec": 3534, "who_url": "/c/satir-dudochnik/", "reason_html": "за находчивость: вспомнил и красочно описал, что видел демона Синктариона, чтобы правдоподобно замаскироваться под него"}, {"t": "1:43:28", "kind": "spend", "who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "to": null, "reason": "потратил монету на переброс броска атаки (прыжок в зеркало, сложность 30)", "result": "продолжили перебрасывать", "sec": 6208, "who_url": "/c/satir-dudochnik/", "reason_html": "потратил монету на переброс броска атаки (прыжок в зеркало, сложность 30)"}, {"t": "1:44:30", "kind": "spend", "who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "to": null, "reason": "потратил ещё одну монету на очередной переброс того же броска", "result": "в итоге критическая удача", "sec": 6270, "who_url": "/c/satir-dudochnik/", "reason_html": "потратил ещё одну монету на очередной переброс того же броска"}], "totals": [{"who": "Милфея", "actor": "Бортич", "earned": 1, "spent": 0, "img": "img/chars/milfeya.webp", "who_url": "/c/milfeya/", "actor_url": "/p/aleksandra-bortich/"}, {"who": "Талала", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/talala.webp", "who_url": "/c/gnomka-talala/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сатир Дудочник (Жанетт)", "actor": "Сатир", "earned": 1, "spent": 2, "img": "img/chars/satir-dudochnik.webp", "who_url": "/c/satir-dudochnik/", "actor_url": "/p/satir/"}], "notes": "Всего в выпуске выдано 4 монеты (одна — получателя по фрагменту не установить) и потрачено 2, обе — на переброс одного и того же сложного броска (прыжок в зеркало со сложностью 30), который под конец увенчался критической удачей; передач монет между игроками и лутовых (внутриигровых) монет в этом выпуске не зафиксировано."}, "cast": [{"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, воин света с мечом Гелиоса", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label" ": "", "actor_url": null, "race": "", "role": "демон-стражник лесных ворот", "fate": "обманут", "id": null, "url": null, "img": null, "other": []}, {"name": "Кисель", "actor": "", "actor_url": null, "race": "", "role": "желатиновый куб, страж дворца", "fate": "ранен солнечным лучом, выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Кара Гелиоса", "actor": "", "actor_url": null, "race": "", "role": "разумный говорящий меч", "fate": "передан Брэндону", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "06", "label": "6", "title": "Адский поезд", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — сестра гнома Динь-Диня из ветви <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Ветвь <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>: грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a>, фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a>, меч <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>; гибель <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> на небесах («друг» Талалы)", "dir": "out", "color": "#7C5CD6"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — падший рыцарь, присягнувший Тёмному властелину (в его облик рядится сатир)", "dir": "out", "color": "#C8423B"}, {"key": "43", "label": "43", "title": "Груз Кристиночки", "note_html": "Вероятная отсылка: сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> и история его жены со «вторым мужем»", "dir": "out", "color": "#B8901C"}, {"key": "52", "label": "52", "title": "Накопитель Любви", "note_html": "Посланник <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> на небеса — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>; Великая граница падёт", "dir": "out", "color": "#C8423B"}, {"key": "53", "label"
