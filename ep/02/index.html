<script>window.EPD = {"anim": false, "key": "02", "label": "2", "title": "Новогоднее приключение", "date": "2021-01-08", "minutes": 60, "duration": 3624.0, "video_id": "XqMe7zUzLuI", "branch": "Ваншоты", "branch_color": "#7D8A84", "place": "Кальтенбрун (северный город в снежных горах), замёрзшее озеро и мастерская волшебника Клауса", "short_html": "В новогоднюю ночь демон похищает <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> и грозит <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбруну<\/a> годом без рассвета, и герои отправляются в мастерскую волшебника Клауса.", "summary_html": "Канун Нового года в северном городке <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбрун<\/a>. Горожане ждут волшебника Клауса с подарками, но на площадь нападают злые снеговики, а демон утаскивает <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, «самого чистого и доброго», и грозит, что рассвет не наступит целый год. <a class=\"ref\" href=\"/c/burgomistr/\">Бургомистр<\/a>-гном отправляет героев в мастерскую Клауса на острове посреди замёрзшего озера. Там они побеждают гигантскую подлёдную рыбу, обходят заколдованных игрушек-стражей и сражаются с демоном и одержимым Савлом. Демон убит, Савл освобождается и раскаивается, спасённый Клаус дарит героям 5 золотых монет. Собранные деньги идут в благотворительный проект «Помощь».", "outcome_html": "Демон убит, Новый год в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбруне<\/a> спасён, <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> освобождён от одержимости. Все герои живы.", "world_html": ["Первое появление <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбруна<\/a>", "Демоны действуют в <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> задолго до первой волны демонизации", "У <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пенисова<\/a> есть брат-близнец <a class=\"ref\" href=\"/c/savl/\">Савл<\/a>"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Рекламная сценка (интеграция М.Видео) и новогоднее вступление. Гости — <a class=\"ref\" href=\"/p/danila-poperechnyy/\">Поперечный<\/a> и <a class=\"ref\" href=\"/p/minogarova/\">Миногарова<\/a>."}, {"t": "0:04:45", "sec": 285, "html": "Завязка: в снежных горах на севере стоит процветающий город <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбрун<\/a>. Горожане ждут на площади, когда в полночь появится волшебник Клаус и раздаст подарки."}, {"t": "0:05:00", "sec": 300, "html": "Представление героев. <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> — лесной гном-бард, городской любимец с сатирическими куплетами. <a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a> — полуорчиха-варвар, её приютили мельники. <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> — рыжий дварф-монах, «духовный лидер» <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбруна<\/a>. <a class=\"ref\" href=\"/c/kvir/\">Квир<\/a> — друид-гендерфлюид: выпив грога, превращается в козу, лечит скот. <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> — брат <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пенисова<\/a>; прежде творил неблагочестивые дела, но был ослеплён явившейся силой, дал обет мира и не поднимает глаз."}, {"t": "0:10:20", "sec": 620, "html": "Праздник на площади. <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> сжигает в костре своё оружие (лук, меч, колчан, кулон с портретом брата) и раздаёт кошелёк бедным. За добрый поступок получает монету. <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> и <a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a> пытаются спасти оружие из огня."}, {"t": "0:13:44", "sec": 824, "html": "Раздаётся крик, из снега вырастают шесть злых снеговиков с сосульками-когтями и ранят героев. Бой: <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> бьёт мечом и кулаками, <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> отказывается сражаться и пытается обнять снеговика, чтобы «растопить его сердце». <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> атакует злой насмешкой, <a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a> разбивает снеговика молотом. Цисгендий вырывает у снеговика монету, служившую ему глазом."}, {"t": "0:21:33", "sec": 1293, "html": "На площадь опускается магическая тьма. Дьявольский голос объявляет, что праздник окончен и год не настанет рассвет. Крылатое существо хватает <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> и уносит (<a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> временно уходит из-за стола)."}, {"t": "0:23:12", "sec": 1392, "html": "<a class=\"ref\" href=\"/c/burgomistr/\">Бургомистр<\/a>, коренастый гном, рассказывает, что демон захватил мастерскую волшебника Клауса на острове посреди озера. Из «магической скрижали» (М.Видео) он предлагает героям на выбор сушилку для обуви (временные хиты) или триммер (+1 к харизме). Берут сушилку."}, {"t": "0:25:36", "sec": 1536, "html": "Через сосновый лес герои выходят к замёрзшему озеру. <a class=\"ref\" href=\"/c/kvir/\">Квир<\/a> в облике козы служит санями, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> поёт ободряющую песню (вдохновение d6). Под льдом плывёт огромная рыба."}, {"t": "0:28:20", "sec": 1700, "html": "<a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a> отвлекает рыбу и прячется на чернильном пятне, которое <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> заранее оставил на льду. Рыба пробивает лёд и почти хватает её. Динь-Динь с вдохновением попадает дротиком ей в глаз, Кринжелика добивает молотом по черепу и достаёт монету из желудка."}, {"t": "0:33:07", "sec": 1987, "html": "У мастерской стоят заколдованные тёмной магией игрушки: оловянный солдатик, шоколадный заяц, пряничный человечек и ёлка со звездой-прожектором. <a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a> танцем завораживает солдатика, <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> ломает амбарный замок чёрного хода, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> маскируется под Кринжелика. Все проникают внутрь."}, {"t": "0:37:06", "sec": 2226, "html": "В цехе загипнотизированные гномы-мастера собирают игрушки, на троне сидит двухметровый рогатый демон <a class=\"ref\" href=\"/c/honorat/\">Гонорат<\/a> в красном кафтане. Одержимый <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> бросается на друзей."}, {"t": "0:40:31", "sec": 2431, "html": "Бой. <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> психически «атакует» <a class=\"ref\" href=\"/c/cisgender/\">Цисгендия<\/a> (8 урона), Цисгендий промахивается по нему. <a class=\"ref\" href=\"/c/kvir/\">Квир<\/a> в облике козы бодает Савла, тот ранит и убивает козью форму Квира. <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> накладывает на Савла жуткий смех Таши. <a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a> в ярости роняет молот себе на голову."}, {"t": "0:50:05", "sec": 3005, "html": "<a class=\"ref\" href=\"/c/honorat/\">Гонорат<\/a> пикирует на <a class=\"ref\" href=\"/c/krindzheliko/\">Кринжелика<\/a>. <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a> душит демона чётками, <a class=\"ref\" href=\"/c/kvir/\">Квир<\/a> промахивается увеличенной дубинкой. <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> смехом Таши вводит демона в истерику, Кринжелика раскалывает ему ключицу молотом (12 урона)."}, {"t": "0:54:05", "sec": 3245, "html": "Демон промахивается рогами по <a class=\"ref\" href=\"/c/cisgender/\">Цисгендию<\/a>, и тот ударом ноги проламывает ему череп. <a class=\"ref\" href=\"/c/honorat/\">Гонорат<\/a> мёртв."}, {"t": "0:55:20", "sec": 3320, "html": "Чары спадают с <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>. Он помнит всё, падает на колени, просит прощения и клянётся посвятить год друзьям."}, {"t": "0:56:46", "sec": 3406, "html": "Из кладовки выходит освобождённый волшебник Клаус, крупный гном в красном тулупе. За спасённый праздник он дарит героям 5 золотых монет. Реальные призы — сушилки для обуви."}, {"t": "0:57:32", "sec": 3452, "html": "Благотворительность: игроки добавляют к монетам свои деньги (прозвучали суммы 360 и 470 тыс. руб.). Всё отправляют в проект Поперечного «Помощь» — приложение адресной помощи пожилым."}], "key_events": [{"t": "0:04:45", "sec": 285}, {"t": "0:10:20", "sec": 620}, {"t": "0:13:44", "sec": 824}, {"t": "0:21:33", "sec": 1293}, {"t": "0:23:12", "sec": 1392}, {"t": "0:28:20", "sec": 1700}, {"t": "0:33:07", "sec": 1987}, {"t": "0:37:06", "sec": 2226}, {"t": "0:54:05", "sec": 3245}, {"t": "0:55:20", "sec": 3320}, {"t": "0:56:46", "sec": 3406}], "coins": {"ep": "02", "events": [{"t": "0:11:26", "kind": "earn", "who": "Савл", "actor": "Кукушкин", "to": null, "reason": "сжёг своё снаряжение и раздал кошелёк беднякам, получил монету за добрый поступок", "result": null, "sec": 686, "who_url": "/c/savl/", "reason_html": "сжёг своё снаряжение и раздал кошелёк беднякам, получил монету за добрый поступок"}, {"t": "0:20:25", "kind": "earn", "who": "Кринжелика", "actor": "Миногарова", "to": null, "reason": "во время боя со снеговиками кулаком выдернула золотую монету, вставленную вместо глаза одного из них", "result": null, "sec": 1225, "who_url": "/c/krindzheliko/", "reason_html": "во время боя со снеговиками кулаком выдернула золотую монету, вставленную вместо глаза одного из них"}, {"t": "0:32:18", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "после победы над рыбой-чудищем кто-то из отряда достал из её желудка блестящую монету", "result": null, "sec": 1938, "who_url": null, "reason_html": "после победы над рыбой-чудищем кто-то из отряда достал из её желудка блестящую монету"}, {"t": "0:44:26", "kind": "spend", "who": "Савл", "actor": "Кукушкин", "to": null, "reason": "потратил монету на переброс атаки, превратившись в козу и боднув демона", "result": "переброс всё равно неудачный, атака не попала", "sec": 2666, "who_url": "/c/savl/", "reason_html": "потратил монету на переброс атаки, превратившись в козу и боднув демона"}, {"t": "0:49:09", "kind": "spend", "who": "Кринжелика", "actor": "Миногарова", "to": null, "reason": "потратила монету на переброс атаки боевым молотом по демон
