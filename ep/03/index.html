<script>window.EPD = {"key": "03", "label": "3", "title": "Пещера кобольдов", "date": "2021-02-27", "minutes": 53, "duration": 3202.0, "video_id": "WfUzqXhiKy8", "branch": "Ваншоты", "branch_color": "#7D8A84", "place": "Пещера кобольдов возле деревни селян (в лесу)", "short_html": "Селяне нанимают охотников на монстров, потому что кобольды стали похищать скот и людей. Отряд <a class=\"ref\" href=\"/c/ragozin/\">Рагозина<\/a> проходит ловушку над кипящим маслом, убивает нескольких кобольдов и узнаёт, что тролль захватил кладку кобольдов и заставляет их воровать ему еду. Под видом поваров герои скармливают троллю бомбу, а затем выжигают его изнутри, запихнув в брюхо горящего <a class=\"ref\" href=\"/c/dimash/\">Димаша<\/a>. Кобольды освобождены и благодарят <a class=\"ref\" href=\"/c/deyn/\">Дэйна<\/a>.", "summary_html": "Кобольды из соседней пещеры всегда таскали у селян кур, но теперь стали пропадать скот и люди. Деревня наняла отряд охотников на монстров гнома <a class=\"ref\" href=\"/c/ragozin/\">Рагозина<\/a>. Герои проходят ловушку-клетку над кипящим маслом, убивают нескольких кобольдов и выясняют, что те воруют еду не для себя. Тролль захватил кладку их яиц и заставляет кобольдов кормить его, иначе убивает детёнышей. Под видом поваров герои подают троллю суп с бомбой, а потом добивают его огнём: сестра запихивает горящего брата <a class=\"ref\" href=\"/c/dimash/\">Димаша<\/a> троллю в брюхо. Кобольды благодарят <a class=\"ref\" href=\"/c/deyn/\">Дэйна<\/a>, награда отряда — 6 монет (60 000 руб.).", "outcome_html": "Тролль убит, кладка кобольдов освобождена, набеги на деревню должны прекратиться. Судьба <a class=\"ref\" href=\"/c/dimash/\">Димаша<\/a> после боя не проговорена.", "world_html": ["Сокращение армии молодым королём оставило без дела множество солдат", "Кобольды пещеры освобождены от тролля"], "scenes": [{"t": "0:00:01", "sec": 1, "html": "Рекламная сценка со Spotify: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкина<\/a> «выгоняют» из шоу. Представление гостей — Юлии <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Ахмедовой<\/a> и <a class=\"ref\" href=\"/p/timur-karginov/\">Тимура Каргинова<\/a>."}, {"t": "0:03:21", "sec": 201, "html": "Завязка: селяне давно соседствуют с кланом кобольдов, которые таскают кур и кроликов. Но в последнее время пропадают скот и люди, и жители на последние деньги нанимают бродячих охотников на монстров."}, {"t": "0:04:26", "sec": 266, "html": "Герои. <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> — инженер «в первом поколении», делал катапульты по госзаказу, стал охотником за головами и собрал отряд. Тифлинги-близнецы (брат и сестра) — сироты, выросли в кадетском корпусе; когда корпус расформировали, стали убивать чудовищ. <a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a> — горный дварф, жил армией, но молодой король распустил три четверти войска, и теперь Дэйн хочет заработать на дом (сам говорит о себе, что он гей). <a class=\"ref\" href=\"/c/dimash/\">Димаш<\/a> — тифлинг, продал душу Лорду Фею за чудотворные силы."}, {"t": "0:08:47", "sec": 527, "html": "Солнечная поляна у входа в пещеру, вход образует расколотая каменная плита. Перед <a class=\"ref\" href=\"/c/dimash/\">Димашем<\/a> является его покровитель <a class=\"ref\" href=\"/c/lord-fey/\">Лорд Фей<\/a> (полупрозрачный, с крыльями бабочки) и через «волшебную скрижаль» М.Видео предлагает артефакт. Герои выбирают электрошашлычницу: каждый кусок мяса лечит 1 хит."}, {"t": "0:10:52", "sec": 652, "html": "Огромная пещера со светящимися грибами, внизу расщелина с кипящим маслом, под потолком мост. <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> находит ворот лебёдки, <a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a> опускает мост. На мосту видны кусочки жареного мяса, то есть мост раскалён."}, {"t": "0:14:02", "sec": 842, "html": "Сестра, жароустойчивая как тифлинг, переносит друзей через мост. На середине мост захлопывается клеткой. <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> отстреливает один трос, клетку зацепляют кошкой и раскачивают до балкона."}, {"t": "0:17:13", "sec": 1033, "html": "<a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> выбирается из клетки, а сестра застревает бёдрами. <a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a> критически проваливает попытку разогнуть прутья: сталагмит ломается, и клетка повисает над маслом. Дэйн топорами (с помощью заклинания <a class=\"ref\" href=\"/c/dimash/\">Димаша<\/a>) перерубает тросы, сестра ловит оборванный трос."}, {"t": "0:20:29", "sec": 1229, "html": "Появляются кобольды. <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> промахивается из аркебузы, <a class=\"ref\" href=\"/c/dimash/\">Димаш<\/a> попадает мистическим зарядом. Сестра перебирается по тросу на балкон кобольдов, ловит брошенный топор <a class=\"ref\" href=\"/c/deyn/\">Дэйна<\/a>, но её ранят стрелой и мечами, и она при смерти. Рагозин срывается к маслу."}, {"t": "0:25:53", "sec": 1553, "html": "<a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a> убивает двух кобольдов топором и ножом. <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> в полёте взрывает бомбой сталагмит, тот падает и спасает его, последний кобольд убегает. Дэйн вытягивает Рагозина верёвкой. Из кобольдов жарят шашлык и восстанавливают здоровье."}, {"t": "0:31:17", "sec": 1877, "html": "Отряд выбирает правый, большой проход. <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> ставит ловушку с бомбой под сталагмитами."}, {"t": "0:32:22", "sec": 1942, "html": "Кухня кобольдов: печь, вагонетка с огромной чашей супа. Повара говорят на драконьем, понимает только <a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a>: «Он опять сожрёт яйцо, если будет недоволен». <a class=\"ref\" href=\"/c/dimash/\">Димаш<\/a> усыпляет двух из пяти, третий метает нож."}, {"t": "0:34:31", "sec": 2071, "html": "<a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a> на драконьем убеждает кобольдов (критический успех). Повара рассказывают, что тролль на троне давно захватил всю их кладку и убивает детёнышей за непослушание. Он же заставляет кобольдов воровать еду в деревне. Взять тролля могут только огонь и кислота."}, {"t": "0:37:46", "sec": 2266, "html": "План: бомба в супе с надписью «Фрикаделька». Благодарные кобольды дают две монеты и поварские костюмы (на <a class=\"ref\" href=\"/c/dimash/\">Димаша<\/a> налезает только колпак)."}, {"t": "0:39:52", "sec": 2392, "html": "Тронный зал: жирный бородавчатый тролль с бивнями требует суп. <a class=\"ref\" href=\"/c/deyn/\">Дэйн<\/a> с переброса монетой убеждает его, что всё в порядке. Тролль глотает бомбу, <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> жмёт кнопку, и бомба взрывается у него в желудке."}, {"t": "0:43:04", "sec": 2584, "html": "<a class=\"ref\" href=\"/c/dimash/\">Димаш<\/a> очаровывает раненого тролля: мол, это новое блюдо. Тролль разевает пасть, и герои засыпают туда порох, бусины, свинцовые пули и бросают факел («мексиканское блюдо»). Второй взрыв."}, {"t": "0:46:17", "sec": 2777, "html": "Разъярённый тролль бьёт <a class=\"ref\" href=\"/c/deyn/\">Дэйна<\/a> (8 урона), Дэйн отвечает молотом в пах. Герои вспарывают троллю живот, <a class=\"ref\" href=\"/c/dimash/\">Димаш<\/a> поджигает сам себя, тролль швыряет сестру о стены (10 урона)."}, {"t": "0:48:34", "sec": 2914, "html": "Сестра запихивает горящего брата в брюхо тролля, <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> ударом двух ног проталкивает <a class=\"ref\" href=\"/c/dimash/\">Димаша<\/a> целиком. Огонь и порох выжигают тролля изнутри, и он падает замертво."}, {"t": "0:49:41", "sec": 2981, "html": "Кобольды благодарят героев. Повар отдаёт <a class=\"ref\" href=\"/c/deyn/\">Дэйну<\/a> мешочек с тремя монетами из украденного у людей и просит мудрости. Дэйн говорит: «Безделье — игрушка дьявола». Итог: 6 монет, то есть 60 000 руб. на благотворительность, в призах электрошашлычница."}], "key_events": [{"t": "0:04:26", "sec": 266}, {"t": "0:08:47", "sec": 527}, {"t": "0:15:08", "sec": 908}, {"t": "0:17:13", "sec": 1033}, {"t": "0:20:29", "sec": 1229}, {"t": "0:34:31", "sec": 2071}, {"t": "0:39:52", "sec": 2392}, {"t": "0:43:04", "sec": 2584}, {"t": "0:48:34", "sec": 2914}, {"t": "0:49:41", "sec": 2981}], "coins": {"ep": "03", "events": [{"t": "0:16:10", "kind": "earn", "who": "Рагозин", "actor": "Каргинов", "to": null, "reason": "получил монету за успешный трюк с раскачиванием подвесной клетки на верёвке с крюком", "result": null, "sec": 970, "who_url": "/c/ragozin/", "reason_html": "получил монету за успешный трюк с раскачиванием подвесной клетки на верёвке с крюком"}, {"t": "0:29:12", "kind": "earn", "who": "Рагозин", "actor": "Каргинов", "to": null, "reason": "получил монету за точно рассчитанный взрыв бомбы, обрушивший сталагмит на кобольда", "result": null, "sec": 1752, "who_url": "/c/ragozin/", "reason_html": "получил монету за точно рассчитанный взрыв бомбы, обрушивший сталагмит на кобольда"}, {"t": "0:35:34", "kind": "earn", "who": "Дэйн", "actor": "BRB", "to": null, "reason": "получил монету за критический успех в проверке убеждения (харизма) при переговорах с кобольдами", "result": null, "sec": 2134, "who_url": "/c/deyn/", "reason_html": "получил монету за критический успех в проверке убеждения (харизма) при переговорах с кобольдами"}, {"t": "0:38:49", "kind": "earn", "who": "Дэйн", "actor": "BRB", "to": null, "reason": "кобольды наградили Дэйна двумя монетами за помощь их детям, которых мучает тролль", "result": null, "sec": 2329, "who_url": "/c/deyn/", "reason_html": "кобольды наградили <a class=\"ref\" href=\"/c/deyn/\">Дэйна<\/a> двумя монетами за помощь их детям, которых мучает тролль"}, {"t": "0:40:54", "kind": "spend", "who": "Дэйн", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки харизмы, чтобы обмануть тролля, притворившись поваром", "result": "переброс успешен (19) — тролль поверил и не заподозрил обман", "sec": 2454, "who_url": "/c/deyn/", "reason_html": "потратил монету на переброс проверки харизмы, чтобы обмануть тролля, притворившись поваром"}, {"t": "0:49:41", "kind": "earn", "who": "Дэйн", "actor": "BRB", "to": null, "reason": "кобольды подарили Дэйну кошель с тремя монетами — золотом, украденным у жертв тролля — в благодарность за спасение", "result": null, "sec": 2981, "who_url": "/c/deyn/", "reason_html": "кобольды подарили <a class=\"ref\" href=\"/c/deyn/\">Дэйну<\/a> кошель с тремя монетами — золотом, украденным у жертв тролля — в благодарность за спасение"}], "totals": [{"who": "Рагозин", "actor": "Каргинов", "earned": 2, "spent": 0, "img": "img/chars/rogozij.webp", "who_url": "/c/ragozin/", "actor_url": null}, {"who": "Дэйн", "actor": "BRB", "earned": 6, "spent": 1, "img": "img/chars/dejn.webp", "who_url": "/c/deyn/", "actor_url": "/p/brb/"}, {"who": "Димаш", "actor": "Гудков", "earned": 0, "spent": 0, "img": "img/chars/demash.webp", "who_url": "/c/dimash/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "сестра-близнец Димаша", "actor": "Ахмедова", "earned": 0, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Итоговое объявление мастера «заработали шесть монет — 60 000 руб.» немного расходится с суммой отдельных наград по транскрипту (получается больше) — вероятно, часть реплик о монетах дублирует один и тот же момент из-за шумного автосубтитра. Только Дэйн тратил монету за весь выпуск — на обман тролля."}, "cast": [{"name": "Рагозин", "actor": "Тимур Каргинов", "actor_url": "/p/timur-karginov/", "race": "гном, инженер-подрывник, охотник за головами", "role": "", "fate": "выжил", "id": "Рагозин", "url": "/c/ragozin/", "img": "img/chars/rogozij.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}]}, {"name": "Сестра-близнец Димаша", "actor": "Юлия Ахмедова", "actor_url": "/p/yuliya-ahmedova/", "race": "тифлинг, фехтовальщица с рапирой", "role": "", "fate": "выжила", "id": "Сестра-близнец Димаша", "url": "/c/sestra-bliznec-dimasha/", "img": null, "other": []}, {"name": "Дэйн", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "горный дварф, воин, бывший солдат", "role": "", "fate": "выжил", "id": "Дэйн", "url": "/c/deyn/", "img": "img/chars/dejn.webp", "other": []}, {"name": "Димаш", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "тифлинг, колдун (пакт с Лордом Феем)", "role": "", "fate": "неизвестно (запихнут горящим в брюхо тролля; вероятно выжил)", "id": "Димаш", "url": "/c/dimash/", "img": "img/chars/demash.webp", "other": []}], "npcs": [{"name": "Лорд Фей", "actor": "", "actor_url": null, "race": "", "role": "покровитель Димаша, выдал артефакт", "fate": "неизвестно", "id": "Лорд Фей", "url": "/c/lord-fey/", "img": "img/chars/lord-fej.webp", "other": []}, {"name": "Тролль", "actor": "", "actor_url": null, "race": "", "role": "узурпатор пещеры, держал в заложниках кладку кобольдов (имя искажено, ~«Хорсел»)", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Кобольды-повара", "actor": "", "actor_url": null, "race": "", "role": "рабы тролля, союзники героев", "fate": "выжили", "id": null, "url": null, "img": null, "other": []}, {"name": "Кобольды-стражи", "actor": "", "actor_url": null, "race": "", "role": "охрана балкона", "fate": "двое убиты, один сбежал", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "02", "label": "2", "title": "Новогоднее приключение", "note_html": "Та же интеграция с «волшебной скрижалью» М.Видео", "dir": "out", "color": "#7D8A84"}, {"key": "04", "label": "4", "title": "Дворец лорда Властона", "note_html": "Вступительная баллада пересказывает победу над троллем", "dir": "back", "color": "#7C5CD6"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "Гном <a class=\"ref\" href=\"/c/ragozin/\">Рагозин<\/a> «из третьего выпуска» устраивает засаду <a class=\"ref\" href=\"/c/erik-penisov/\">Эрику<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "note_html": "Г
