<script>window.EPD = {"anim": false, "key": "03", "label": "3", "title": "Пещера кобольдов", "date": "2021-02-27", "minutes": 53, "duration": 3202.0, "video_id": "WfUzqXhiKy8", "branch": "Ваншоты", "branch_color": "#7D8A84", "place": "Пещера кобольдов возле деревни селян (в лесу)", "short_html": "Отряд <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> спускается в пещеру кобольдов, которые повадились красть у селян скот и людей.", "summary_html": "Кобольды из соседней пещеры всегда таскали у селян кур, но теперь стали пропадать скот и люди. Деревня наняла отряд охотников на монстров гнома <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a>. Герои проходят ловушку-клетку над кипящим маслом, убивают нескольких кобольдов и выясняют, что те воруют еду не для себя. Тролль захватил кладку их яиц и заставляет кобольдов кормить его, иначе убивает детёнышей. Под видом поваров герои подают троллю суп с бомбой, а потом добивают его огнём: сестра запихивает горящего брата <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> троллю в брюхо. Кобольды благодарят <a class=\"ref\" href=\"/c/deyn/\">Дейна<\/a>, награда отряда — 6 монет (60 000 руб.).", "outcome_html": "Тролль убит, кладка кобольдов освобождена, набеги на деревню должны прекратиться. Судьба <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> после боя не проговорена.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг\">2<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг<\/b> Пришедшая в студию <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Юлия Ахмедова<\/a> и ведущие вспомнили героев выпуска <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>: <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> хотел взять в жёны сестру <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> (<a class=\"ref\" href=\"/c/ea/\">Эа<\/a>), и они уехали на юг, в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; там «должно быть южное приключение». Демаш, по полушутливым словам за столом, умер. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep03.md: о <a class=\"ref\" href=\"/c/dimash/\">Демаше<\/a> сказано «судьба прямо не проговорена, скорее всего выжил»; в подкасте полушутя сказали, что Демаш умер, а его сестру зовут <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> (уверенность низкая).<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3379\" target=\"_blank\" rel=\"noopener\">0:56:19 ↗<\/a> · <a href=\"#qa29-11\">к записи<\/a><\/span><\/span>", "world_html": ["Сокращение армии молодым королём оставило без дела множество солдат", "Кобольды пещеры освобождены от тролля"], "scenes": [{"t": "0:00:01", "sec": 1, "html": "Рекламная сценка со Spotify: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкина<\/a> «выгоняют» из шоу. Представление гостей — Юлии <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Ахмедовой<\/a> и <a class=\"ref\" href=\"/p/timur-karginov/\">Тимура Каргинова<\/a>."}, {"t": "0:04:10", "sec": 250, "html": "Завязка: селяне давно соседствуют с кланом кобольдов, которые таскают кур и кроликов. Но в последнее время пропадают скот и люди, и жители на последние деньги нанимают бродячих охотников на монстров."}, {"t": "0:04:40", "sec": 280, "html": "Герои. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> — инженер «в первом поколении», делал катапульты по госзаказу, стал охотником за головами и собрал отряд. Тифлинги-близнецы (брат и сестра) — сироты, выросли в кадетском корпусе; когда корпус расформировали, стали убивать чудовищ. <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> — горный дварф, жил армией, но молодой король распустил три четверти войска, и теперь Дейн хочет заработать на дом (сам говорит о себе, что он гей). <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> — тифлинг, продал душу Лорду Фею за чудотворные силы.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Мать и отец тифлингов Эа и Демаша на иллюстрации Влада\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Мать и отец тифлингов Эа и Демаша на иллюстрации Влада<\/b> На иллюстрации к легенде <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влада Пивкавцепеша<\/a> были он с молодой девушкой, а затем девушка с двумя тифлингами. Авторы подтвердили догадку зрителей, что это <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> и <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> из <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a>, то есть Влад — их отец. В <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a> близнецы говорили, что их родители убиты; по словам авторов, мать могли убить в том числе за связь с демоном. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8465\" target=\"_blank\" rel=\"noopener\">2:21:05 ↗<\/a> · <a href=\"#qa35-30\">к записи<\/a><\/span><\/span>"}, {"t": "0:09:00", "sec": 540, "html": "Солнечная поляна у входа в пещеру, вход образует расколотая каменная плита. Перед <a class=\"ref\" href=\"/c/dimash/\">Демашем<\/a> является его покровитель <a class=\"ref\" href=\"/c/lord-fey/\">Лорд Фей<\/a> (полупрозрачный, с крыльями бабочки) и через «волшебную скрижаль» М.Видео предлагает артефакт. Герои выбирают электрошашлычницу: каждый кусок мяса лечит 1 хит."}, {"t": "0:10:55", "sec": 655, "html": "Огромная пещера со светящимися грибами, внизу расщелина с кипящим маслом, под потолком мост. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> находит ворот лебёдки, <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> опускает мост. На мосту видны кусочки жареного мяса, то есть мост раскалён."}, {"t": "0:14:10", "sec": 850, "html": "Сестра, жароустойчивая как тифлинг, переносит друзей через мост. На середине мост захлопывается клеткой. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> отстреливает один трос, клетку зацепляют кошкой и раскачивают до балкона.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: После выпуска 3 начали рисовать карты локаций\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>После выпуска 3 начали рисовать карты локаций<\/b> Путаница с клеткой в приключении с <a class=\"ref\" href=\"/p/timur-karginov/\">Каргиновым<\/a> (выпуск <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>) научила авторов рисовать карты и подробно всё описывать. Когда герои вернулись в ту же <a class=\"ref\" href=\"/place/peshchera-koboldov/\">пещеру<\/a> в выпуске с <a class=\"ref\" href=\"/p/danila-poperechnyy/\">Поперечным<\/a> и «Кубиком в Кубе», мост и пещера уже были нарисованы с разных ракурсов. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=5790\" target=\"_blank\" rel=\"noopener\">1:36:30 ↗<\/a> · <a href=\"#qa17-20\">к записи<\/a><\/span><\/span>"}, {"t": "0:17:37", "sec": 1057, "html": "<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> выбирается из клетки, а сестра застревает бёдрами. <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> критически проваливает попытку разогнуть прутья: сталагмит ломается, и клетка повисает над маслом. Дейн топорами (с помощью заклинания <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a>) перерубает тросы, сестра ловит оборванный трос.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: После выпуска 3 начали рисовать карты локаций\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>После выпуска 3 начали рисовать карты локаций<\/b> Путаница с клеткой в приключении с <a class=\"ref\" href=\"/p/timur-karginov/\">Каргиновым<\/a> (выпуск <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>) научила авторов рисовать карты и подробно всё описывать. Когда герои вернулись в ту же <a class=\"ref\" href=\"/place/peshchera-koboldov/\">пещеру<\/a> в выпуске с <a class=\"ref\" href=\"/p/danila-poperechnyy/\">Поперечным<\/a> и «Кубиком в Кубе», мост и пещера уже были нарисованы с разных ракурсов. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=5790\" target=\"_blank\" rel=\"noopener\">1:36:30 ↗<\/a> · <a href=\"#qa17-20\">к записи<\/a><\/span><\/span>"}, {"t": "0:21:11", "sec": 1271, "html": "Появляются кобольды. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> промахивается из аркебузы, <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> попадает мистическим зарядом. Сестра перебирается по тросу на балкон кобольдов, ловит брошенный топор <a class=\"ref\" href=\"/c/deyn/\">Дейна<\/a>, но её ранят стрелой и мечами, и она при смерти. Рогозий срывается к маслу."}, {"t": "0:25:56", "sec": 1556, "html": "<a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> убивает двух кобольдов топором и ножом. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> в полёте взрывает бомбой сталагмит, тот падает и спасает его, последний кобольд убегает. Дейн вытягивает Рогозия верёвкой. Из кобольдов жарят шашлык и восстанавливают здоровье."}, {"t": "0:31:42", "sec": 1902, "html": "Отряд выбирает правый, большой проход. <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> ставит ловушку с бомбой под сталагмитами."}, {"t": "0:32:47", "sec": 1967, "html": "Кухня кобольдов: печь, вагонетка с огромной чашей супа. Повара говорят на драконьем, понимает только <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a>: «Он опять сожрёт яйцо, если будет недоволен». <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> усыпляет двух из пяти, третий метает нож."}, {"t": "0:35:38", "sec": 2138, "html": "<a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> на драконьем убеждает кобольдов (критический успех). Повара рассказывают, что тролль на троне давно захватил всю их кладку и убивает детёнышей за непослушание. Он же заставляет кобольдов воровать еду в деревне. Взять тролля могут только огонь и кислота."}, {"t": "0:37:56", "sec": 2276, "html": "План: бомба в супе с надписью «Фрикаделька». Благодарные кобольды дают две монеты и поварские костюмы (на <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> налезает только колпак)."}, {"t": "0:40:06", "sec": 2406, "html": "Тронный зал: жирный бородавчатый тролль с бивнями требует суп. <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> с переброса монетой убеждает его, что всё в порядке. Тролль глотает бомбу, <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> жмёт кнопку, и бомба взрывается у него в желудке."}, {"t": "0:42:38", "sec": 2558, "html": "<a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> очаровывает раненого тролля: мол, это новое блюдо. Тролль разевает пасть, и герои засыпают туда порох, бусины, свинцовые пули и бросают факел («мексиканское блюдо»). Второй взрыв."}, {"t": "0:45:39", "sec": 2739, "html": "Разъярённый тролль бьёт <a class=\"ref\" href=\"/c/deyn/\">Дейна<\/a> (8 урона), Дейн отвечает молотом в пах. Герои вспарывают троллю живот, <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> поджигает сам себя, тролль швыряет сестру о стены (10 урона)."}, {"t": "0:48:22", "sec": 2902, "html": "Сестра запихивает горящего брата в брюхо тролля, <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> ударом двух ног проталкивает <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> целиком. Огонь и порох выжигают тролля изнутри, и он падает замертво."}, {"t": "0:50:04", "sec": 3004, "html": "Кобольды благодарят героев. Повар отдаёт <a class=\"ref\" href=\"/c/deyn/\">Дейну<\/a> мешочек с тремя монетами из украденного у людей и просит мудрости. Дейн говорит: «Безделье — игрушка дьявола». Итог: 6 монет, то есть 60 000 руб. на благотворительность, в призах электрошашлычница."}], "key_events": [{"t": "0:04:40", "sec": 280}, {"t": "0:09:00", "sec": 540}, {"t": "0:15:08", "sec": 908}, {"t": "0:17:37", "sec": 1057}, {"t": "0:21:11", "sec": 1271}, {"t": "0:35:38", "sec": 2138}, {"t": "0:40:06", "sec": 2406}, {"t": "0:42:38", "sec": 2558}, {"t": "0:48:22", "sec": 2902}, {"t": "0:50:04", "sec": 3004}], "coins": {"ep": "03", "events": [{"t": "0:16:22", "kind": "earn", "who": "Рогозий", "actor": "BRB", "to": null, "reason": "получил монету за успешный трюк с раскачиванием подвесной клетки на верёвке с крюком", "result": null, "sec": 982, "who_url": "/c/ragozin/", "reason_html": "получил монету за успешный трюк с раскачиванием подвесной клетки на верёвке с крюком"}, {"t": "0:29:14", "kind": "earn", "who": "Рогозий", "actor": "BRB", "to": null, "reason": "получил монету за точно рассчитанный взрыв бомбы, обрушивший сталагмит на кобольда", "result": null, "sec": 1754, "who_url": "/c/ragozin/", "reason_html": "получил монету за точно рассчитанный взрыв бомбы, обрушивший сталагмит на кобольда"}, {"t": "0:35:34", "kind": "earn", "who": "Дейн", "actor": "Каргинов", "to": null, "reason": "получил монету за критический успех в проверке убеждения (харизма) при переговорах с кобольдами", "result": null, "sec": 2134, "who_url": "/c/deyn/", "reason_html": "получил монету за критический успех в проверке убеждения (харизма) при переговорах с кобольдами"}, {"t": "0:39:24", "kind": "earn", "who": "Дейн", "actor": "Каргинов", "to": null, "reason": "кобольды наградили Дейна двумя монетами за помощь их детям, которых мучает тролль", "result": null, "sec": 2364, "who_url": "/c/deyn/", "reason_html": "кобольды наградили <a class=\"ref\" href=\"/c/deyn/\">Дейна<\/a> двумя монетами за помощь их детям, которых мучает тролль"}, {"t": "0:41:07", "kind": "spend", "who": "Дейн", "actor": "Каргинов", "to": null, "reason": "потратил монету на переброс проверки харизмы, чтобы обмануть тролля, притворившись поваром", "result": "переброс успешен (19) — тролль поверил и не заподозрил обман", "sec": 2467, "who_url": "/c/deyn/", "reason_html": "потратил монету на переброс проверки харизмы, чтобы обмануть тролля, притворившись поваром"}, {"t": "0:50:34", "kind": "earn", "who": "Дейн", "actor": "Каргинов", "to": null, "reason": "кобольды подарили Дейну кошель с тремя монетами — золотом, украденным у жертв тролля — в благодарность за спасение", "result": null, "sec": 3034, "who_url": "/c/deyn/", "reason_html": "кобольды подарили <a class=\"ref\" href=\"/c/deyn/\">Дейну<\/a> кошель с тремя монетами — золотом, украденным у жертв тролля — в благодарность за спасение"}], "totals": [{"who": "Рогозий", "actor": "BRB", "earned": 2, "spent": 0, "img": "img/chars/rogozij.webp", "who_url": "/c/ragozin/", "actor_url": "/p/brb/"}, {"who": "Дейн", "actor": "Тимур Каргинов", "earned": 6, "spent": 1, "img": "img/chars/dejn.webp", "who_url": "/c/deyn/", "actor_url": "/p/timur-karginov/"}, {"who": "Демаш", "actor": "Александр Гудков", "earned": 0, "spent": 0, "img": "img/chars/demash.webp", "who_url": "/c/dimash/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "сестра-близнец Демаша", "actor": "Ахмедова", "earned": 0, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Итоговое объявление мастера «заработали шесть монет — 60 000 руб.» немного расходится с суммой отдельных наград по транскрипту (получается больше) — вероятно, часть реплик о монетах дублирует один и тот же момент из-за шумного автосубтитра. Только Дейн тратил монету за весь выпуск — на обман тролля."}, "cast": [{"name": "Рогозий", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "гном, инженер-подрывник, охотник за головами", "role": "", "fate": "выжил", "id": "Рагозин", "url": "/c/ragozin/", "img": "img/chars/rogozij.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}]}, {"name": "Сестра-близнец Демаша", "actor": "Юлия Ахмедова", "actor_url": "/p/yuliya-ahmedova/", "race": "тифлинг, фехтовальщица с рапирой", "role": "", "fate": "выжила", "id": "Сестра-близнец Демаша", "url": "/c/sestra-bliznec-dimasha/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг\">2<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг<\/b> Пришедшая в студию <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Юлия Ахмедова<\/a> и ведущие вспомнили героев выпуска <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>: <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> хотел взять в жёны сестру <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> (<a class=\"ref\" href=\"/c/ea/\">Эа<\/a>), и они уехали на юг, в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; там «должно быть южное приключение». Демаш, по полушутливым словам за столом, умер. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep03.md: о <a class=\"ref\" href=\"/c/dimash/\">Демаше<\/a> сказано «судьба прямо не проговорена, скорее всего выжил»; в подкасте полушутя сказали, что Демаш умер, а его сестру зовут <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> (уверенность низкая).<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3379\" target=\"_blank\" rel=\"noopener\">0:56:19 ↗<\/a> · <a href=\"#qa29-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Мать и отец тифлингов Эа и Демаша на иллюстрации Влада\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Мать и отец тифлингов Эа и Демаша на иллюстрации Влада<\/b> На иллюстрации к легенде <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влада Пивкавцепеша<\/a> были он с молодой девушкой, а затем девушка с двумя тифлингами. Авторы подтвердили догадку зрителей, что это <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> и <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> из <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a>, то есть Влад — их отец. В <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a> близнецы говорили, что их родители убиты; по словам авторов, мать могли убить в том числе за связь с демоном. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8465\" target=\"_blank\" rel=\"noopener\">2:21:05 ↗<\/a> · <a href=\"#qa35-30\">к записи<\/a><\/span><\/span>"}, {"name": "Дейн", "actor": "Тимур Каргинов", "actor_url": "/p/timur-karginov/", "race": "горный дварф, воин, бывший солдат", "role": "", "fate": "выжил", "id": "Дейн", "url": "/c/deyn/", "img": "img/chars/dejn.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг\">2<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг<\/b> Пришедшая в студию <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Юлия Ахмедова<\/a> и ведущие вспомнили героев выпуска <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>: <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> хотел взять в жёны сестру <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> (<a class=\"ref\" href=\"/c/ea/\">Эа<\/a>), и они уехали на юг, в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; там «должно быть южное приключение». Демаш, по полушутливым словам за столом, умер. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep03.md: о <a class=\"ref\" href=\"/c/dimash/\">Демаше<\/a> сказано «судьба прямо не проговорена, скорее всего выжил»; в подкасте полушутя сказали, что Демаш умер, а его сестру зовут <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> (уверенность низкая).<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3379\" target=\"_blank\" rel=\"noopener\">0:56:19 ↗<\/a> · <a href=\"#qa29-11\">к записи<\/a><\/span><\/span>"}, {"name": "Демаш", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "тифлинг, колдун (пакт с Лордом Феем)", "role": "", "fate": "неизвестно (запихнут горящим в брюхо тролля; вероятно выжил)", "id": "Демаш", "url": "/c/dimash/", "img": "img/chars/demash.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг\">2<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг<\/b> Пришедшая в студию <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Юлия Ахмедова<\/a> и ведущие вспомнили героев выпуска <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>: <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> хотел взять в жёны сестру <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> (<a class=\"ref\" href=\"/c/ea/\">Эа<\/a>), и они уехали на юг, в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; там «должно быть южное приключение». Демаш, по полушутливым словам за столом, умер. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep03.md: о <a class=\"ref\" href=\"/c/dimash/\">Демаше<\/a> сказано «судьба прямо не проговорена, скорее всего выжил»; в подкасте полушутя сказали, что Демаш умер, а его сестру зовут <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> (уверенность низкая).<\/span> <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3379\" target=\"_blank\" rel=\"noopener\">0:56:19 ↗<\/a> · <a href=\"#qa29-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Мать и отец тифлингов Эа и Демаша на иллюстрации Влада\">3<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Мать и отец тифлингов Эа и Демаша на иллюстрации Влада<\/b> На иллюстрации к легенде <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влада Пивкавцепеша<\/a> были он с молодой девушкой, а затем девушка с двумя тифлингами. Авторы подтвердили догадку зрителей, что это <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> и <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> из <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a>, то есть Влад — их отец. В <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a> близнецы говорили, что их родители убиты; по словам авторов, мать могли убить в том числе за связь с демоном. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8465\" target=\"_blank\" rel=\"noopener\">2:21:05 ↗<\/a> · <a href=\"#qa35-30\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Лорд Фей", "actor": "", "actor_url": null, "race": "", "role": "покровитель Демаша, выдал артефакт", "fate": "неизвестно", "id": "Лорд Фей", "url": "/c/lord-fey/", "img": "img/chars/lord-fej.webp", "other": []}, {"name": "Тролль", "actor": "", "actor_url": null, "race": "", "role": "узурпатор пещеры, держал в заложниках кладку кобольдов (имя искажено, ~«Хорсел»)", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Кобольды-повара", "actor": "", "actor_url": null, "race": "", "role": "рабы тролля, союзники героев", "fate": "выжили", "id": null, "url": null, "img": null, "other": []}, {"name": "Кобольды-стражи", "actor": "", "actor_url": null, "race": "", "role": "охрана балкона", "fate": "двое убиты, один сбежал", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "02", "label": "2", "title": "Новогоднее приключение", "note_html": "Та же интеграция с «волшебной скрижалью» М.Видео", "dir": "out", "color": "#7D8A84"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона", "note_html": "Вступительная баллада пересказывает победу над троллем", "dir": "back", "color": "#7C5CD6"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "Гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> «из третьего выпуска» устраивает засаду <a class=\"ref\" href=\"/c/erik-penisov/\">Эрику<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "note_html": "Гном-охотник за головами <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> вернётся в ветви <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a> (таверна «Кайф») и погибнет там", "dir": "out", "color": "#2F84C8"}], "quotes_html": ["«Хороший кобольд — мёртвый кобольд». (<a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a>)", "«Прощайся со своей жизнью, козёл». (<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>, нажимая кнопку)", "«Безделье — игрушка дьявола». (<a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> — кобольдам)", "«Я лучше убью сначала, потом извинюсь перед родственниками». (<a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a>)"], "places_html": "<ul>\n<li>Деревня селян (не названа), пещера кобольдов: мост-ловушка над расщелиной с кипящим маслом, кухня, тронный зал тролля.<\/li>\n<li>Клан кобольдов, отряд охотников на монстров <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a>, кадетский корпус (расформирован).<\/li>\n<li>Артефакты: электрошашлычница (1 хит за кусок мяса), увлажнитель воздуха (не взят), аркебуза и бомбы <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a>, пульт с красной кнопкой, 15-метровая верёвка.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>3<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><article class=\"pnote t-backstage\" id=\"qa17-20\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>После выпуска 3 начали рисовать карты локаций<\/b><\/div><p>Путаница с клеткой в приключении с <a class=\"ref\" href=\"/p/timur-karginov/\">Каргиновым<\/a> (выпуск <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>) научила авторов рисовать карты и подробно всё описывать. Когда герои вернулись в ту же <a class=\"ref\" href=\"/place/peshchera-koboldov/\">пещеру<\/a> в выпуске с <a class=\"ref\" href=\"/p/danila-poperechnyy/\">Поперечным<\/a> и «Кубиком в Кубе», мост и пещера уже были нарисованы с разных ракурсов.<\/p><blockquote>«после этого приключения мы сделали вывод о том, что надо делать карты… когда вы в эту пещеру вернулись в выпуске с Поперечным и Кубиком»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-20\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=5790\" target=\"_blank\" rel=\"noopener\">1:36:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-11\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Судьба героев «Пещеры кобольдов»: Дейн и сестра Демаша ушли на юг<\/b><\/div><p>Пришедшая в студию <a class=\"ref\" href=\"/p/yuliya-ahmedova/\">Юлия Ахмедова<\/a> и ведущие вспомнили героев выпуска <a href=\"/ep/03/\" title=\"Пещера кобольдов\">3<\/a>: <a class=\"ref\" href=\"/c/deyn/\">Дейн<\/a> хотел взять в жёны сестру <a class=\"ref\" href=\"/c/dimash/\">Демаша<\/a> (<a class=\"ref\" href=\"/c/ea/\">Эа<\/a>), и они уехали на юг, в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>; там «должно быть южное приключение». Демаш, по полушутливым словам за столом, умер.<\/p><blockquote>«Тимур по идее хотел её в жёны взять. Да. И они уехали на юг, в Геленбург.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep03.md: о <a class=\"ref\" href=\"/c/dimash/\">Демаше<\/a> сказано «судьба прямо не проговорена, скорее всего выжил»; в подкасте полушутя сказали, что Демаш умер, а его сестру зовут <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> (уверенность низкая).<\/p><p class=\"note\"><a href=\"/pod/qa29/#qa29-11\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=3379\" target=\"_blank\" rel=\"noopener\">0:56:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa35-30\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Мать и отец тифлингов Эа и Демаша на иллюстрации Влада<\/b><\/div><p>На иллюстрации к легенде <a class=\"ref\" href=\"/c/vlad-pivko-cepesh/\">Влада Пивкавцепеша<\/a> были он с молодой девушкой, а затем девушка с двумя тифлингами. Авторы подтвердили догадку зрителей, что это <a class=\"ref\" href=\"/c/ea/\">Эа<\/a> и <a class=\"ref\" href=\"/c/dimash/\">Демаш<\/a> из <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a>, то есть Влад — их отец. В <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a> близнецы говорили, что их родители убиты; по словам авторов, мать могли убить в том числе за связь с демоном.<\/p><blockquote>«Некоторые предположили, что это Эа и Демаш, персонажи третьего приключения. Да, действительно, это они.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-30\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=8465\" target=\"_blank\" rel=\"noopener\">2:21:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/03/\" title=\"Пещера кобольдов\">#3<\/a><\/p><\/article><\/section>", "chars": {"Сестра-близнец Демаша": {"name": "Сестра-близнец Демаша", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Юлия Ахмедова"], "kind": "pc", "dead": false, "race": "тифлинг, фехтовальщица с рапирой", "portraits": [], "url": "/c/sestra-bliznec-dimasha/", "eps": [{"key": "03", "label": "3", "title": "П
