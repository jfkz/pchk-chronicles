<script>window.EPD = {"key": "05", "label": "5", "title": "Шахты Фогельнест", "date": "2021-06-29", "minutes": 67, "duration": 4040.0, "video_id": "eUvNxxRIO7Y", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Каторжный лагерь — угольные шахты Фогельнест у подножия горы (после падения Вирджинвальда)", "short_html": "Продолжение выпуска 1: после убийства колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> арестованы солдатами <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и сосланы на вечную каторгу в шахты Фогельнест, где кристалл блокирует магию. С медведолюдом Урсом и гномом Кукан Якой они крадут у начальника лагеря амулет-выключатель купола, минируют и взрывают склад, убив начальника и часть охраны. Монстр из шахты оказывается выросшей детской черепашкой Урса — панцирником Кешей, который помогает перебить охрану и выносит ворота. Герои бегут на волю.", "summary_html": "Прямое продолжение выпуска 1: после убийства колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> схвачены солдатами лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (Вирджинвальд пал), <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> сбежал. Героев отправили на вечную каторгу в угольные шахты Фогельнест, где магию блокирует кристалл-«вышка 5G». Вместе с сокамерниками — медведолюдом Урсом и гномом Кукан Якой — они крадут у начальника лагеря амулет-выключатель купола, взрывают склад с динамитом (гибнут начальник и часть охраны), а спавший в шахте монстр-панцирник Кеша оказывается детской черепашкой Урса и переходит на их сторону. Охрана разбегается, панцирник выносит ворота, и герои бегут из лагеря.", "outcome_html": "Все четверо героев и панцирник Кеша бегут из Фогельнеста; начальник лагеря и часть охраны погибли, лагерь разрушен.", "world_html": ["Вирджинвальд оккупирован войсками <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "Лагерь Фогельнест разгромлен, начальник погиб, заключённые разбегаются", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обзавёлся спутниками — Урсом (и его панцирником) и Кукан Якой", "Родня <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> враждует со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>"], "scenes": [{"t": "0:00:04", "sec": 4, "html": "Пролог-сценка: после победы над <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a> <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> варит северную настойку; солдаты <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> объявляют, что Вирджинвальд пал, и арестовывают <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и Пэлиаса за убийство; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> исчезает в скрытности."}, {"t": "0:04:22", "sec": 262, "html": "Представление: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> отсутствует (шутка про «репетицию в Гоголь-центре»); гости — <a class=\"ref\" href=\"/p/garik-harlamov/\">Харламов<\/a> и <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукояка<\/a>. Героев сослали на вечную каторгу в угольные шахты Фогельнест у подножия горы; идёт второй день."}, {"t": "0:05:27", "sec": 327, "html": "Персонажи: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет отвоевать дом; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> — «радикальный эколог» с ручной крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> (Ларой); <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — гном-ассасин, которого Пэлиас спас от волков, он нарочно совершил «публичное скотоложество» с козой, чтобы попасть на каторгу к другу; Урс — медведолюд, воспитатель Сфинктериона, застрял в полузверином облике из-за зелий <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>, сослан за отказ присягнуть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>."}, {"t": "0:09:37", "sec": 577, "html": "Странность: начальник лагеря запретил входить в шахты, заключённые строят укрепление у входа. <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> на вышке на юге блокирует магию во всём лагере."}, {"t": "0:11:45", "sec": 705, "html": "Старый заключённый-гном (сидит 2 года) объясняет: в шахте засел монстр, похожий на вытянутую черепаху; охрана достраивает скорпионы (большие арбалеты), чтобы выманить его людьми, прикованными к столбам, и расстрелять. Через пещеру есть выход на волю."}, {"t": "0:15:56", "sec": 956, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> роняет себе камень на ногу, чтобы отвлечь охрану; его несут в медчасть (Урс, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>)."}, {"t": "0:19:06", "sec": 1146, "html": "Рекламная вставка: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> в лесу находит «скрижаль Иви» — это засада охотника за головами гнома <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> («из третьего выпуска»), клиффхэнгер."}, {"t": "0:21:14", "sec": 1274, "html": "В медчасти магия работает: <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> находит под полом некромантскую пентаграмму, гасящую действие кристалла, и тайный шкафчик медсестры Зары. Урс «скунсовым» запахом отвлекает её, крыса выносит из шкафа свёрток: медицинские иглы, паралитический яд, монету."}, {"t": "0:24:21", "sec": 1461, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> (крит скрытности) прячется в шатре; входит начальник лагеря — любовник Зары, выгоняет остальных и бьёт <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>."}, {"t": "0:27:32", "sec": 1652, "html": "Пока пара занята, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> крадёт амулет начальника с друидическими символами; неудачная иллюзия выдаёт его силуэт, он убегает и незаметно передаёт амулет Урсу. На амулете переключатель «вкл/выкл» — это выключатель купола. Урс прячет его «в анус»."}, {"t": "0:33:48", "sec": 2028, "html": "Колокол на обед. Начальник ищет беглеца — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> отправляет погоню в шахты. Сфинктерион толчком в очереди устраивает массовую драку у кухни."}, {"t": "0:35:52", "sec": 2152, "html": "Дварф <a class=\"ref\" href=\"/c/gradvart/\">Градварт<\/a> уводит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в помывочную: трое дварфов мстят за «обесчещенную» сестру — дварфийку <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> (из выпуска 1). Сфинктерион получает удар, убегает и сдаёт дварфов охране как бунтовщиков — их ставят на столбы."}, {"t": "0:39:00", "sec": 2340, "html": "Урс запугивает часового у склада; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> усыпляет парализующими иглами двух спящих охранников. На складе: динамит, порох, детонатор со шнуром, оружие (<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> берёт длинный двуручный меч), монеты. Склад минируют, шнур тянут к кустам за медчастью."}, {"t": "0:43:11", "sec": 2591, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> заманивает начальника и шестерых стражников на склад («нашёл зачинщика бунта»); по сигналу крысы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> жмёт детонатор."}, {"t": "0:45:18", "sec": 2718, "html": "Взрыв уничтожает склад, гибнут несколько солдат и начальник лагеря. Из шахты с рёвом вырывается монстр и утаскивает под землю дварфа со столба."}, {"t": "0:46:21", "sec": 2781, "html": "Урс касается чудовища (дар речи с животными): на боку нацарапано «Кеша» — это панцирник, детская черепашка Урса, которая выросла и теперь будет служить только ему."}, {"t": "0:49:34", "sec": 2974, "html": "Бой с охраной у скорпиона. Кеша, не сдержав нрав, атакует <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (промах); Пэлиас двойным выстрелом убивает двух лучников на вышке; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> круговым ударом разрубает стражника у скорпиона; Кеша выпрыгивает из-под земли, ломает скорпион и глотает стрелка."}, {"t": "0:58:59", "sec": 3539, "html": "Удар ногой Кукан Яки «по щеке» — и деморализованная охрана бросает оружие и бежит к главному выходу. Бой окончен."}, {"t": "1:01:04", "sec": 3664, "html": "Кеша пытается «засосать» Кукан Яку, промахивается и на полном ходу разносит ворота в щепки. Урс достаёт амулет и отключает купол."}, {"t": "1:02:09", "sec": 3729, "html": "Перепалка Урса и Кукан Яки (попытки засунуть друг в друга руку/ногу). <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> находит под помывочной тайник дварфов с боевыми топорами и монетой и спокойно уходит через ворота."}, {"t": "1:05:18", "sec": 3918, "html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> уходят от погони раздражённого панцирника (противостояние по ловкости — успех)."}, {"t": "1:06:22", "sec": 3982, "html": "Побег из Фогельнеста удался. Итог — 7 монет (70 000 руб.) в Фонд Хабенского."}], "key_events": [{"t": "0:02:14", "sec": 134}, {"t": "0:12:48", "sec": 768}, {"t": "0:19:06", "sec": 1146}, {"t": "0:21:14", "sec": 1274}, {"t": "0:27:32", "sec": 1652}, {"t": "0:36:55", "sec": 2215}, {"t": "0:40:04", "sec": 2404}, {"t": "0:45:18", "sec": 2718}, {"t": "0:47:26", "sec": 2846}, {"t": "1:00:02", "sec": 3602}, {"t": "1:01:04", "sec": 3664}, {"t": "1:06:22", "sec": 3982}], "coins": {"ep": "05", "events": [{"t": "0:13:50", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "получил монету за сообразительность — разгадал по найденной записке план охраны с монстром в шахте", "result": null, "sec": 830, "who_url": "/c/sfinkterion/", "reason_html": "получил монету за сообразительность — разгадал по найденной записке план охраны с монстром в шахте"}, {"t": "0:30:40", "kind": "spend", "who": "Кукан Яка", "actor": "Кукояка", "to": null, "reason": "потратил монету на п
