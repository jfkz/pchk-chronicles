<script>window.EPD = {"anim": false, "key": "05", "label": "5", "title": "Шахты Фогельнест", "date": "2021-06-29", "minutes": 67, "duration": 4040.0, "video_id": "eUvNxxRIO7Y", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Каторжный лагерь — угольные шахты Фогельнест у подножия горы (после падения Вёрджинвальда)", "short_html": "Сосланные на каторгу <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> готовят побег из шахт <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>, где кристалл глушит магию.", "summary_html": "Прямое продолжение выпуска 1: после убийства колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> схвачены солдатами лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (<a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> пал), <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> сбежал. Героев отправили на вечную каторгу в угольные шахты <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>, где магию блокирует кристалл-«вышка 5G». Вместе с сокамерниками — медведолюдом Урсом и гномом Кукан Якой — они крадут у начальника лагеря амулет-выключатель купола, взрывают склад с динамитом (гибнут начальник и часть охраны), а спавший в шахте монстр-панцирник Кеша оказывается детской черепашкой Урса и переходит на их сторону. Охрана разбегается, панцирник выносит ворота, и герои бегут из лагеря.", "outcome_html": "Все четверо героев и панцирник Кеша бегут из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>; начальник лагеря и часть охраны погибли, лагерь разрушен.", "world_html": ["<a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> оккупирован войсками <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "Лагерь <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a> разгромлен, начальник погиб, заключённые разбегаются", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обзавёлся спутниками — Урсом (и его панцирником) и Кукан Якой", "Родня <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> враждует со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>"], "scenes": [{"t": "0:00:04", "sec": 4, "html": "Пролог-сценка: после победы над <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a> <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> варит северную настойку; солдаты <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> объявляют, что <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> пал, и арестовывают <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и Пэлиаса за убийство; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> исчезает в скрытности."}, {"t": "0:04:02", "sec": 242, "html": "Представление: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> отсутствует (шутка про «репетицию в Гоголь-центре»); гости — <a class=\"ref\" href=\"/p/garik-harlamov/\">Харламов<\/a> и <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукояка<\/a>. Героев сослали на вечную каторгу в угольные шахты <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a> у подножия горы; идёт второй день."}, {"t": "0:05:45", "sec": 345, "html": "Персонажи: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хочет отвоевать дом; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> — «радикальный эколог» с ручной крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> (Ларой); <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — гном-ассасин, которого Пэлиас спас от волков, он нарочно совершил «публичное скотоложество» с козой, чтобы попасть на каторгу к другу; Урс — медведолюд, воспитатель Сфинктериона, застрял в полузверином облике из-за зелий <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>, сослан за отказ присягнуть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>."}, {"t": "0:10:08", "sec": 608, "html": "Странность: начальник лагеря запретил входить в шахты, заключённые строят укрепление у входа. <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> на вышке на юге блокирует магию во всём лагере."}, {"t": "0:11:05", "sec": 665, "html": "Старый заключённый-гном (сидит 2 года) объясняет: в шахте засел монстр, похожий на вытянутую черепаху; охрана достраивает скорпионы (большие арбалеты), чтобы выманить его людьми, прикованными к столбам, и расстрелять. Через пещеру есть выход на волю."}, {"t": "0:16:12", "sec": 972, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> роняет себе камень на ногу, чтобы отвлечь охрану; его несут в медчасть (Урс, <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>)."}, {"t": "0:19:06", "sec": 1146, "html": "Рекламная вставка: <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> в лесу находит «скрижаль Иви» — это засада охотника за головами гнома <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a> («из третьего выпуска»), клиффхэнгер."}, {"t": "0:21:14", "sec": 1274, "html": "В медчасти магия работает: <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> находит под полом некромантскую пентаграмму, гасящую действие кристалла, и тайный шкафчик медсестры Зары. Урс «скунсовым» запахом отвлекает её, крыса выносит из шкафа свёрток: медицинские иглы, паралитический яд, монету."}, {"t": "0:24:38", "sec": 1478, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> (крит скрытности) прячется в шатре; входит начальник лагеря — любовник Зары, выгоняет остальных и бьёт <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>."}, {"t": "0:27:32", "sec": 1652, "html": "Пока пара занята, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> крадёт амулет начальника с друидическими символами; неудачная иллюзия выдаёт его силуэт, он убегает и незаметно передаёт амулет Урсу. На амулете переключатель «вкл/выкл» — это выключатель купола. Урс прячет его «в анус»."}, {"t": "0:33:37", "sec": 2017, "html": "Колокол на обед. Начальник ищет беглеца — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> отправляет погоню в шахты. Сфинктерион толчком в очереди устраивает массовую драку у кухни."}, {"t": "0:36:06", "sec": 2166, "html": "Дварф <a class=\"ref\" href=\"/c/gradvart/\">Градварт<\/a> уводит <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> в помывочную: трое дварфов мстят за «обесчещенную» сестру — дварфийку <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a> (из выпуска 1). Сфинктерион получает удар, убегает и сдаёт дварфов охране как бунтовщиков — их ставят на столбы."}, {"t": "0:39:10", "sec": 2350, "html": "Урс запугивает часового у склада; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> усыпляет парализующими иглами двух спящих охранников. На складе: динамит, порох, детонатор со шнуром, оружие (<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> берёт длинный двуручный меч), монеты. Склад минируют, шнур тянут к кустам за медчастью."}, {"t": "0:44:03", "sec": 2643, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> заманивает начальника и шестерых стражников на склад («нашёл зачинщика бунта»); по сигналу крысы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> жмёт детонатор."}, {"t": "0:45:31", "sec": 2731, "html": "Взрыв уничтожает склад, гибнут несколько солдат и начальник лагеря. Из шахты с рёвом вырывается монстр и утаскивает под землю дварфа со столба."}, {"t": "0:46:22", "sec": 2782, "html": "Урс касается чудовища (дар речи с животными): на боку нацарапано «Кеша» — это панцирник, детская черепашка Урса, которая выросла и теперь будет служить только ему."}, {"t": "0:49:47", "sec": 2987, "html": "Бой с охраной у скорпиона. Кеша, не сдержав нрав, атакует <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (промах); Пэлиас двойным выстрелом убивает двух лучников на вышке; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> круговым ударом разрубает стражника у скорпиона; Кеша выпрыгивает из-под земли, ломает скорпион и глотает стрелка."}, {"t": "0:59:46", "sec": 3586, "html": "Удар ногой Кукан Яки «по щеке» — и деморализованная охрана бросает оружие и бежит к главному выходу. Бой окончен."}, {"t": "1:01:10", "sec": 3670, "html": "Кеша пытается «засосать» Кукан Яку, промахивается и на полном ходу разносит ворота в щепки. Урс достаёт амулет и отключает купол."}, {"t": "1:02:09", "sec": 3729, "html": "Перепалка Урса и Кукан Яки (попытки засунуть друг в друга руку/ногу). <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> находит под помывочной тайник дварфов с боевыми топорами и монетой и спокойно уходит через ворота."}, {"t": "1:05:22", "sec": 3922, "html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> уходят от погони раздражённого панцирника (противостояние по ловкости — успех)."}, {"t": "1:06:22", "sec": 3982, "html": "Побег из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a> удался. Итог — 7 монет (70 000 руб.) в Фонд Хабенского."}], "key_events": [{"t": "0:02:33", "sec": 153}, {"t": "0:13:26", "sec": 806}, {"t": "0:19:06", "sec": 1146}, {"t": "0:21:14", "sec": 1274}, {"t": "0:27:32", "sec": 1652}, {"t": "0:37:16", "sec": 2236}, {"t": "0:43:33", "sec": 2613}, {"t": "0:45:31", "sec": 2731}, {"t": "0:47:23", "sec": 2843}, {"t": "1:00:16", "sec": 3616}, {"t": "1:01:10", "sec": 3670}, {"t": "1:06:22", "sec": 3982}], "coins": {"ep": "05", "events": [{"t": "0:14:09", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "получил монету за сообразительность — разгадал по найденной записке план охраны с монстром в шахте", "result": null, "sec": 849, "who_url": "/c/sfinkterion/", "reason_html": "получил монету за сообразительность — разгадал по найденной записке план охраны с монстром в шахте"}, {"t": "0:30:40", "kind": "spend", "who": "Кукан Яка", "actor": "Кукояка", "to": null, "reason": "потратил монету на переброс проверки харизмы (обман), пытаясь голосом заставить пленницу «признаться» в любви к другому персонажу", "result": "переброс не помог — начальник охраны всё равно заметил его силуэт", "sec": 1840, "who_url": "/c/kukanyaka/", "reason_html": "потратил монету на переброс проверки харизмы (обман), пытаясь голосом заставить пленницу «признаться» в любви к другому персонажу"}, {"t": "0:33:27", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "ручная крыса нашла свёрток с медицинскими иглами, ядом и золотой монетой (владелец крысы из шумного транскрипта не разобрать)", "result": null, "sec": 2007, "who_url": null, "reason_html": "ручная крыса нашла свёрток с медицинскими иглами, ядом и золотой монетой (владелец крысы из шумного транскрипта не разобрать)"}, {"t": "0:41:25", "kind": "earn", "who": "Пэлиас", "actor": "Гудков", "to": null, "reason": "проверкой внимательности (следопыт) нашёл в ящиках оружие и две золотые монеты", "result": null, "sec": 2485, "who_url": "/c/pelias/", "reason_html": "проверкой внимательности (следопыт) нашёл в ящиках оружие и две золотые монеты"}, {"t": "1:03:16", "kind": "earn", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "нашёл тайник дварфов под полом душевой с боевыми топорами и золотой монетой (удачная проверка внимательности)", "result": null, "sec": 3796, "who_url": "/c/sfinkterion/", "reason_html": "нашёл тайник дварфов под полом душевой с боевыми топорами и золотой монетой (удачная проверка внимательности)"}, {"t": "1:06:35", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "вся команда получила три монеты за победу — успешный побег из лагеря Фогельнест, итог семь монет за выпуск", "result": null, "sec": 3995, "who_url": null, "reason_html": "вся команда получила три монеты за победу — успешный побег из лагеря <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>, итог семь монет за выпуск"}], "totals": [{"who": "Сфинктерион Лёвенхарт", "actor": "BRB", "earned": 2, "spent": 0, "img": " лятые роды"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}]}], "links": [{"key": "01", "label": "1", "title": "Башня колдуна", "note_html": "Убийство колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>, девственница-дварфийка <a class=\"ref\" href=\"/c/eldi/\">Илдэ<\/a>; арест героев — прямое продолжение", "dir": "out", "color": "#C8423B"}, {"key": "03", "label": "3", "title": "Пещера кобольдов", "note_html": "Гном <a class=\"ref\" href=\"/c/ragozin/\">Рогозий<\/a> «из третьего выпуска» устраивает засаду <a class=\"ref\" href=\"/c/erik-penisov/\">Эрику<\/a>", "dir": "out", "color": "#7D8A84"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "note_html": "Задел продолжения ветви <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> после засады <a class=\"ref\" href=\"/c/ragozin/\">Рогозия<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "08", "label": "8", "title": "Покушение на короля", "note_html": "Побег <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a> — продолжение", "dir": "back", "color": "#C8423B"}, {"key": "09", "label": "9", "title": "Человек в железной маске", "note_html": "Служба в столичной страже и сорванное покушение на короля (упомянуто во вступлении)", "dir": "back", "color": "#C8423B"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "Лагерь <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>: <a class=\"ref\" href=\"/c/zara/\">Зара<\/a> и её возлюбленный — начальник лагеря", "dir": "back", "color": "#C8423B"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — беглец из каторжного лагеря <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> захватил <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> — предпосылка освобождения баронства", "dir": "out", "color": "#C8423B"}, {"key": "25", "label": "25", "title": "Остров соблазна", "note_html": "<a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a> — трагедия, в которой погибли сослуживцы <a class=\"ref\" href=\"/c/pshen/\">Пшена<\/a>", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Когда я рядом, девственность — это неизбежная потеря». — <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>", "«Плут, ты можешь спрятаться от нас, но тебе не спрятаться от гнева лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>».", "«Ты обесчестил нашу сестру… Илде. Надеюсь, ты запомнишь это имя, когда отправишься на тот свет». — дварф", "«Я Кеша… Теперь я буду служить только тебе». — панцирник Урсу", "«Наконец-то хоть что-то я сделал за эти пять выпусков». — <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> (<a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>)"], "places_html": "<ul>\n<li><b>Каторжный лагерь / угольные шахты <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a><\/b> — у подножия горы; двор, вышки, медчасть, бараки с помывочной, кухня, склад, штаб, столбы для наказаний; пещера — ход наружу.<\/li>\n<li><b><a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a><\/b> — пал, занят войсками <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<\/li>\n<li>Фракции: войска лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>; охрана лагеря; дварфы-заключённые.<\/li>\n<li>Артефакты: <b>кристалл-«вышка 5G»<\/b>, блокирующий магию в лагере; <b>амулет начальника<\/b> с друидическими символами «вкл/выкл» — выключатель купола; <b>некромантская пентаграмма<\/b> в медчасти; паралитический яд и иглы; динамит с детонатором; скорпионы (гигантские арбалеты).<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>11<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>11<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>2<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>1<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>2<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>4<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>2<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa16-24\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Урс, скорее всего, вернётся<\/b><\/div><p><a class=\"ref\" href=\"/p/garik-harlamov/\">Гарик Харламов<\/a> хочет снова сниматься, и авторы считают, что Урс ещё появится в выпусках.<\/p><blockquote>«постоянно пишу Гарику, постоянно хочет, ему очень нравится проект, я думаю, что будет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-24\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4793\" target=\"_blank\" rel=\"noopener\">1:19:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa17-11\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Откуда берутся кристаллы телепортации<\/b><\/div><p><a class=\"ref\" href=\"/c/kristal/\">Кристаллы<\/a> телепортации бывают разного размера. Гигантский кристалл добыли в горных хребтах у <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>, в шахтах, где работали гномы, дварфы и каторжники. Это редкий и очень ценный материал вроде мифрила. Чтобы он заработал как телепорт, нужны особые магические манипуляции; подробности авторы пока не раскрывают.<\/p><blockquote>«место происхождения — горные хребты в районе Фогельнеста, шахты… это редкий материал по типу как мифрил»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-11\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=3845\" target=\"_blank\" rel=\"noopener\">1:04:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa17-18\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Цисгендий может навсегда остаться женщиной<\/b><\/div><p><a class=\"ref\" href=\"/p/danila-poperechnyy/\">Поперечный<\/a> хочет, чтобы <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>, сменивший пол от эльфийской соли в выпуске 14, остался женщиной. Авторы считают это возможным: как Урс застрял полумедведем-получеловеком из-за мутагенных зелий, так и Цисгендий мог застрять в новом облике из-за соли или чего-то выпитого раньше. Это стало бы болезнью или проклятием.<\/p><blockquote>«он из-за каких-то мутантских вот этих зелий остался медведолюдом… то же самое могло произойти с Цисгендием»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-18\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=5474\" target=\"_blank\" rel=\"noopener\">1:31:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa17-29\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Кешу-панцирника в выпуске 5 играл опоздавший Кукушкин<\/b><\/div><p>На вопрос, что случилось с Кешей-панцирником, авторы рассказали, что <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> тогда опоздал на съёмку и ему дали этого «имбового» персонажа. Выходит, Кукушкин в выпуске 5 всё же был: «приглашённый актёр театра и кино» за Кешей — это он.<\/p><blockquote>«тогда Кукушкин опоздал на съёмку, мы дали ему этого персонажа»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> В summaries/ep05.md сказано, что Кукушкин в выпуске отсутствует, а Кешу-панцирника играет «неназванный приглашённый актёр театра и кино»; по словам авторов, Кешу играл опоздавший на съёмку <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a>.<\/p><p class=\"note\"><a href=\"/pod/qa17/#qa17-29\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6920\" target=\"_blank\" rel=\"noopener\">1:55:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-8\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Фигурку Урса сделают, когда персонаж «наберёт объём»<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/p/garik-harlamov/\">Гарику Харламову<\/a> не дарят фигурку его персонажа, ответили, что фигурка Урса появится, как только у персонажа добавится объёма.<\/p><blockquote>«как только добавится объём у этого персонажа, сразу появится и фигурка»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-8\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2333\" target=\"_blank\" rel=\"noopener\">0:38:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa18-27\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Гомосексуальность Эрика Пэнисова — не канон<\/b><\/div><p>На вопрос о связи «гения» <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> с его гомосексуальностью авторы ответили, что это никогда не было каноном: это придумал <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a>, и авторы ему не подыгрывали.<\/p><blockquote>«Гомосексуализм Эрика — это не канон, этого никогда не было, это придумал Кукушкин»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-27\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=5618\" target=\"_blank\" rel=\"noopener\">1:33:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Панические атаки Кукояки на съёмках были настоящими<\/b><\/div><p>Авторы подтвердили, что у <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a> на съёмках 5-го и 12-го выпусков действительно случались панические атаки (он убегал и возвращался), и только потом с этим связали рекламу психологического сервиса.<\/p><blockquote>«он когда приходил на пятый выпуск, у него случались панические атаки, он убегал, прибегал, мы не знали, что происходит»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-2\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=571\" target=\"_blank\" rel=\"noopener\">0:09:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa21-16\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Начальник лагеря Фогельнест — Джонатан Твёрдый, сын генерала<\/b><\/div><p>У Ирэны был брат Джонатан Твёрдый — тот самый начальник лагеря из пятого выпуска, погибший, когда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> взорвал склад с боеприпасами в <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнесте<\/a>. <a class=\"ref\" href=\"/c/general-tvyordyy/\">Генерал Твёрдый<\/a> — классический карьерист: подложил дочь под лорда, продвинул сына по службе, а вершиной карьеры видел титул лорда <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> и всех южных земель.<\/p><blockquote>«у неё был брат Джонатан Твёрдый — его, кстати, Сфинктерион тоже грохнул, взорвав этот склад с боеприпасами в лагере Фогельнест»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep05.md: начальник лагеря назван без имени. По словам авторов, это Джонатан Твёрдый, сын генерала Твёрдого и брат Ирэны Твёрдой.<\/p><p class=\"note\"><a href=\"/pod/qa21/#qa21-16\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=1820\" target=\"_blank\" rel=\"noopener\">0:30:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa24-19\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Выпуск 05 собирались начать с пира и предательства в Вёрджинвальде<\/b><\/div><p>Пятое приключение хотели открыть пиром в <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальде<\/a> с бароном <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвардом<\/a>, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>: входит кто-то из министров барона, предаёт их, героев берут в плен и отправляют в шахты. От идеи отказались, потому что это катсцена с заранее понятным исходом, где игроки были бы «куклами».<\/p><blockquote>«мы хотели пятое приключение начинать с того, что они все пируют в Вёрджинвальде… и их захватывают, берут в плен»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-19\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=3187\" target=\"_blank\" rel=\"noopener\">0:53:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему мастер сразу сказал Сфинктериону про вышку<\/b><\/div><p>Мастер не дал броска на знание о вышке 5G, потому что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> уже дважды сталкивался с такими вышками — в выпусках 5 и 8 — и знает, как они работают. Подсказка при этом прозвучала из зала.<\/p><blockquote>«Сфинктерион два раза с этой вышкой встречался... И в восьмом выпуске, и в пятом выпуске.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa30/#qa30-11\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3016\" target=\"_blank\" rel=\"noopener\">0:50:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa32-34\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Речные гномы родились из оговорки в «Шахтах Фогельнест»<\/b><\/div><p>Речных гномов изначально не существовало: они появились из оговорки в #5, когда участникам за час до съёмки велели придумать имена, и гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал то ли «ручным», то ли «речным». Потом «ручной гном» стал фамильяром вампиров, а речные гномы — изгнанными из дома горными гномами, которые грабят суда на реке.<\/p><blockquote>«мы ещё поняли, откуда взялся речной, которых никогда не существовало. Были горные гномы»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-34\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8791\" target=\"_blank\" rel=\"noopener\">2:26:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><\/section>", "chars": {"Эрик": {"name": "Эрик Пэнисов", "img": "img/chars/erik-penisov.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%AD%D1%80%D0%B8%D0%BA_%D0%9F%D1%8D%D0%BD%D0%B8%D1%81%D0%BE%D0%B2", "summary": "Э́рик Пэ́нисов — полурослик, плут, один из главных героев вселенной игры «Подземелья Чикен Карри».", "infobox": {"Пол": "Мужской", "Раса": "Полурослик", "Тип": "Игровой", "Игрок": "Никита Кукушкин"}, "actors": ["Никита Кукушкин"], "kind": "pc", "dead": true, "race": "Полурослик", "portraits": [{"ep": "14", "thumb": "img/portraits/4e0550ca7670e144.webp"}, {"ep": "13", "thumb": "img/portraits/d9600a7f722f7a11.webp"}, {"ep": "7", "thumb": "img/portraits/1d44de2a8dae9bfe.webp"}, {"ep": "1", "thumb": "img/portraits/17592c9211967539.webp"}], "url": "/c/erik-penisov/", "eps": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5"
