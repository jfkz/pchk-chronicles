<script>window.EPD = {"anim": false, "key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "date": "2024-07-13", "minutes": 73, "duration": 4364.0, "video_id": "2J5w_JG83uI", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Гномий город Змей Хрустальный: бани «Гномский пар» и аэродром", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> идёт по следу взрывателей для вулкана к гному-вампиру Домогайтису и Адриан Вурдаласку.", "summary_html": "Клан допивает пойманного наёмника Пиф-Пафа, находит у него телепортатор, бомбы, чек на 100 золотых и записку Адриан Вурдаласку, заказавшего <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязниса Домогайтиса<\/a>. Под видом гномов герои проникают в бани «Гномский пар», в кабинку, забронированную Пиф-Пафом, где стоят заминированная кукла и боевой автоматон. Разгадав код самоуничтожения, они помещают в робота прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> — тот воскресает в теле кованого рыцаря, пробивает стену к Домогайтису, и клан убивает его охрану. Домогайтис признаётся, что уже передал взрыватели Адриану (дирижабль «Красный дракон»), переживает взрыв куклы и улетает туманом. На аэродроме <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> метлой с бомбой взрывает «Красный дракон»; Адриан Вурдаласку гибнет, план «Чёрное небо» сорван. Тест на отцовство показывает, что у СуперБигДикГана два отца — Антон и <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a>.", "outcome_html": "План «Чёрное небо» сорван, взрыватели уничтожены, Адриан Вурдаласку погиб; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> возрождён в теле автоматона, Домогайтис сбежал.", "world_html": ["План высшего вампирского совета «Чёрное небо» (подрыв вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>) сорван, гномьи взрыватели уничтожены", "Высший совет потерял Адриан Вурдаласку", "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> возрождён в теле умного автоматона (кованого рыцаря)", "<a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> жив и враждебен клану", "В Змее Хрустальном взорван дирижабль «Красный дракон» на аэродроме", "Появляется новая вампирша — обращённая Антоном полуэльфийка"], "scenes": [{"t": "0:00:44", "sec": 44, "html": "«Ранее» и сцена-видение: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> говорит с прахом <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>; тот сперва против воскрешения в «гномьем роботе» («я погиб как герой»), но соглашается."}, {"t": "0:04:58", "sec": 298, "html": "После аварии Антон держит оглушённого Пиф-Пафа; <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> отпивает у него кровь."}, {"t": "0:07:32", "sec": 452, "html": "Обыск: телепортатор-коробочка с кнопкой (прыжок примерно на 10 м), дымовая и осколочная бомбы, пистолет-крюк с лебёдкой, записка («Сегодня в полночь <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> будет в банях „Гномский пар“ практически без охраны. Ход за тобой. Адриан Вурдаласку»), ключ с биркой № 3, чек в Гномбанк на 100 золотых на предъявителя."}, {"t": "0:09:20", "sec": 560, "html": "<a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> досуха выпивает Пиф-Пафа и восстанавливает здоровье."}, {"t": "0:10:38", "sec": 638, "html": "В колпаках и с паспортами герои выходят к толпе гномов-зевак у места крушения; один снял погоню на «магическую скрижаль». <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> и Антон («Антон Нолан») выдают всё за съёмки боевика и заставляют удалить запись, а зевак отправляют на главную площадь «сниматься». Паспорта разобраны: Боньк-Боньк, Дзвеньк-Дзвеньк, Кунь-Кунь, Чих-Пых, Толик."}, {"t": "0:15:45", "sec": 945, "html": "Бани «Гномский пар»: администратор-гномка <a class=\"ref\" href=\"/c/chek/\">Чек-Ин<\/a>, охранник Го-Ша со сканвордом. <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> проваливает комплимент, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> на критическом успехе «соблазняет» Гошу искусственной розой (тот берёт её «для жены»). Кабинка № 3 записана на псевдоним Пиф-Пафа «Пих-Пах»; туда несколько дней назад доставили два больших ящика."}, {"t": "0:21:36", "sec": 1296, "html": "В раздевалке, завернувшись в полотенца поверх всего инвентаря, герои находят и забирают форму пилота дирижабля."}, {"t": "0:25:04", "sec": 1504, "html": "Купальня: у кабинки № 2 стоят два охранника-вампира (грим течёт от пара). В VIP-кабинке № 3 — безжизненная кукла (любовный автоматон) и ящик с боевым автоматоном, уже принявшим черты Пиф-Пафа (в нём его биоматериал)."}, {"t": "0:27:14", "sec": 1634, "html": "Антон вскрывает ящик под кашель <a class=\"ref\" href=\"/c/vampirap/\">Вампидапа<\/a>; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> на критическом успехе бесшумно отодвигает его от стены."}, {"t": "0:32:47", "sec": 1967, "html": "Сброс до заводских настроек запускает самоуничтожение; за минуту герои решают головоломку с ящиками, монетами и кристаллами и вводят код 46."}, {"t": "0:36:00", "sec": 2160, "html": "В отсек бронзового сердечника кладут солевую одноразку с прахом — автоматон принимает облик <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (очки, густая борода). Вампирбек воскресает «андроидом»: двуручный меч, огненное дыхание, ракеты, уязвимость к электричеству и воде, 10 случайных «особых действий» (бросок d10); обещает, что это его «последний заезд»."}, {"t": "0:40:20", "sec": 2420, "html": "Пробуя «ракеты», <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> случайно активирует мощный прыжок и застревает в потолке. <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> отвечает постучавшему охраннику, что это «кукла-ублажительница», и убеждает его не мешать. Кукла оказывается заминирована — её не трогают."}, {"t": "0:45:38", "sec": 2738, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пробивает кулаками стену; за ней Домогайтис с двумя девушками — полуорчихой и полуэльфийкой. Двух вампиров-телохранителей убивают: Антон из арбалета, <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> серебряной катаной, <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> кинжалом между глаз, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> огненным серебряным мечом Бесагона."}, {"t": "0:52:08", "sec": 3128, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> для устрашения выжигает огнём мебель. Полуорчиха Сисиль (сестра <a class=\"ref\" href=\"/c/kristof/\">Кристофа<\/a>) заслоняет Домогайтиса. Тот рассказывает: взрыватели он уже передал Адриан Вурдаласку, одному из исполнителей плана «Чёрное небо»; сам голосовал против и, видимо, поэтому Адриан заказал его Пиф-Пафу. Взрыватели — на аэродроме, в дирижабле «Красный дракон»."}, {"t": "0:56:38", "sec": 3398, "html": "Домогайтиса отпускают в соседнюю комнату, но <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> «ножницами» бьёт мячом из бычьего пузыря в заминированную куклу — взрыв (17 урона огнём), однако Домогайтис выходит из пламени, превращается в туман и улетает."}, {"t": "0:58:28", "sec": 3508, "html": "Сисиль упрекает героев (Домогайтис создал лагерь и спас мигрантов от улицы и волков); <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГан<\/a> выдыхает на неё ядовитый дым солевой одноразки — она теряет сознание. Антон выпивает полуэльфийку и поит её своей кровью: через сутки она должна стать вампиром."}, {"t": "1:03:05", "sec": 3785, "html": "На оставленной паровой повозке клан едет на аэродром: четыре дирижабля, «Красный дракон» заправляют водородом, погрузкой руководит Адриан Вурдаласку с охраной."}, {"t": "1:05:10", "sec": 3910, "html": "Осколочную бомбу прилепляют мятной жвачкой к метле <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>, её конец затачивают колом. Адриан сбивает метлу порывом ветра, но <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> выправляет курс — «Красный дракон» взрывается огненным шаром; к ногам героев катится голова Адриан Вурдаласку."}, {"t": "1:08:30", "sec": 4110, "html": "Возвращается сумка с роем челюстей; Тошнислав приносит тест на отцовство: у <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a> два отца — <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> соединила ДНК двух вампиров (Антона и <a class=\"ref\" href=\"/c/vampirap/\">Вампидапа<\/a>) в одно семя."}, {"t": "1:10:44", "sec": 4244, "html": "Финал: собранные монеты уходят в благотворительный фонд (80 000 руб.); чек Гномбанка остаётся не обналиченным. Закадровый итог: ещё один высший вампир пал от клана Балан, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> возрождён в кованом рыцаре."}], "key_events": [{"t": "0:07:32", "sec": 452}, {"t": "0:09:20", "sec": 560}, {"t": "0:15:45", "sec": 945}, {"t": "0:32:47", "sec": 1967}, {"t": "0:36:00", "sec": 2160}, {"t": "0:45:38", "sec": 2738}, {"t": "0:53:44", "sec": 3224}, {"t": "0:57:20", "sec": 3440}, {"t": "1:01:08", "sec": 3668}, {"t": "1:07:36", "sec": 4056}, {"t": "1:09:04", "sec": 4144}], "coins": {"ep": "28b", "events": [{"t": "0:07:59", "kind": "loot", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "Обыскал тело убитого Пивпафа и нашёл на нём две золотые монеты (гонорар за убийство), а также телепортатор, дымовую шашку и крюк с лебёдкой.", "result": null, "sec": 479, "who_url": "/c/dan-balan/", "reason_html": "Обыскал тело убитого Пивпафа и нашёл на нём две золотые монеты (гонорар за убийство), а также телепортатор, дымовую шашку и крюк с лебёдкой."}, {"t": "0:17:03", "kind": "earn", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "Комично очаровал официанта Гошу и подарил цветок его жене, отыграв верность семейным ценностям.", "result": null, "sec": 1023, "who_url": "/c/dan-balan/", "reason_html": "Комично очаровал официанта Гошу и подарил цветок его жене, отыграв верность семейным ценностям."}, {"t": "0:31:36", "kind": "spend", "who": "Вампирap", "actor": "Попов", "to": null, "reason": "Потратил монету на переброс проверки атлетики (сила), пытаясь аккуратно, не потревожив триггер, сдвинуть с места робота-автоматона.", "result": null, "sec": 1896, "who_url": null, "reason_html": "Потратил монету на переброс проверки атлетики (сила), пытаясь аккуратно, не потревожив триггер, сдвинуть с места робота-автоматона."}, {"t": "0:35:12", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Группа успела разгадать математическую головоломку и ввести код деактивации робота (46) до истечения таймера самоуничтожения.", "result": null, "sec": 2112, "who_url": null, "reason_html": "Группа успела разгадать математическую головоломку и ввести код деактивации робота (46) до истечения таймера самоуничтожения."}, {"t": "0:46:43", "kind": "earn", "who": "Вампирap", "actor": "Попов", "to": null, "reason": "Проявил сострадание к напуганным пленницам грязниса Домогайтиса вместо немедленной расправы.", "result": null, "sec": 2803, "who_url": null, "reason_html": "Проявил сострадание к напуганным пленницам грязниса Домогайтиса вместо немедленной расправы."}, {"t": "0:48:25", "kind": "spend", "who": "СуперБигДикГан", "actor": "Позов", "to": null, "reason": "Потратил монету на переброс атаки серебряной катаной по вампиру-охраннику.", "result": "Попадание, урон удвоен как от серебряного оружия.", "sec": 2905, "who_url": "/c/luka-superbigdikgan/", "reason_html": "Потратил монету на переброс атаки серебряной катаной по вампиру-охраннику."}, {"t": "1:02:35", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Выпил кровь пленённой полуэльфийки и обратил её в вампира — тяжёлый, мрачный отыгрыш морального выбора («Сисиль расплавил»).", "result": null, "sec": 3755, "who_url": "/c/anton/", "reason_html": "Выпил кровь пленённой полуэльфийки и обратил её в вампира — тяжёлый, мрачный отыгрыш морального выбора («Сисиль расплавил»)."}], "totals": [{"who": "Дан Балан", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/dan-balan.webp", "who_url": "/c/dan-balan/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Вампирap", "actor": "Попов", "earned": 1, "spent": 1, "img": null, "who_url": null, "actor_url": "/p/arseniy-popov/"}, {"who": "СуперБигДикГан", "actor": "Позов", "earned": 0, "spent": 1, "img": "img/chars/luka.webp", "who_url": "/c/luka-superbigdikgan/", "actor_url": "/p/dmitriy-pozov/"}, {"who": "Антон", "actor": "Шастун", "earned": 1, "spent": 0, "img": "img/chars/anton.webp", "who_url": "/c/anton/", "actor_url": "/p/anton-shastun/"}], "notes": "Вторая часть выпуска о Чёрном небе вампиров, продолжение ep28a. В партии в этой части камео BRB в роли Вампира Бека (упомянут в шапке), но отдельных монетных событий с ним в транскрипте не найдено. В конце выпуска — традиционный бросок d6 для благотворительного фонда (70 000–80 000 руб.), не учтён как игровое событие."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "престарелый вампир, глава клана", "role": "", "fate": "выжил", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Антон", "actor": "Антон Шастун", "actor_url": "/p/anton-shastun/", "race": "вампир-жиголо", "role": "", "fate": "выжил", "id": "Антон", "url": "/c/anton/", "img": "img/chars/anton.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "  "#B03A7A"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика", "note_html": "гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> на четвёртой фабрике", "dir": "out", "color": "#B03A7A"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров", "note_html": "первая часть", "dir": "out", "color": "#B03A7A"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\"", "note_html": "высший вампирский совет", "dir": "back", "color": "#2F84C8"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>", "dir": "out", "color": "#B8901C"}], "quotes_html": ["«Какого хуя я робот?.. Я Android» — <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> после воскрешения.", "«Обещаю, это мой последний заезд» — <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (снова).", "«Я, между прочим, голосовал против. Я за чил и за отдых» — <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>.", "«Контейнер для биоматериала переполнен» — <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> голосом робота."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змей Хрустальный<\/a> — место крушения, бани «Гномский пар» (общая купальня, VIP-кабинки 1–3), аэродром с четырьмя дирижаблями, Гномбанк и гномий отель на центральной площади (упомянуты).<\/li>\n<li>Фракции: клан Балан; высший вампирский совет; мигранты лагеря.<\/li>\n<li>Артефакты: боевой умный автоматон (теперь тело <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>); заминированный любовный автоматон-кукла (взорван); телепортатор Пиф-Пафа; осколочная и дымовая бомбы; пистолет-крюк с лебёдкой; чек Гномбанка на 100 золотых; форма пилота дирижабля; гномьи взрыватели (уничтожены вместе с «Красным драконом»); серебряный огненный меч Бесагона; солевая одноразка (ядовитый дым); тест на отцовство.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>37<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>37<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>8<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>11<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>9<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>8<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa26-6\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Следующий вампирский выпуск — 28, без BRB<\/b><\/div><p>Авторы подтвердили, что следующий выпуск вампирской ветки — 28-й. Его играли <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>, <a class=\"ref\" href=\"/p/anton-shastun/\">Антон Шастун<\/a>, <a class=\"ref\" href=\"/p/arseniy-popov/\">Арсений Попов<\/a> и <a class=\"ref\" href=\"/p/dmitriy-pozov/\">Дмитрий Позов<\/a>, без <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, потому что <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> мёртв.<\/p><blockquote>«следующий выпуск вампирской ветки — это двадцать восьмой»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-6\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2123\" target=\"_blank\" rel=\"noopener\">0:35:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-10\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Моторы растянулись до 6–9 часов; 28-й сняли за один мотор<\/b><\/div><p>Выпуск 26 сняли в первом моторе съёмочного пула, и это был один из самых долгих моторов. С 26-го по 30-й выпуски игры шли не меньше шести, а то и девяти часов. Выпуск 28, наоборот, сняли за один мотор.<\/p><blockquote>«начиная с двадцать шестого, двадцать седьмого, двадцать восьмого, двадцать девятого и тридцатого... меньше шести нет уже»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-10\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2774\" target=\"_blank\" rel=\"noopener\">0:46:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa27-27\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Выпуск 28 разделят на две части; к большой ветке готовят финальную битву<\/b><\/div><p>Авторы анонсировали, что выпуск 28 с уже знакомыми персонажами разделят на две части и что кто-то в нём, возможно, умрёт. Большая сюжетная ветка, по их словам, движется к концу, скорее всего к финальной битве, и дальнейшие планы есть.<\/p><blockquote>«Ждите двадцать восьмой выпуск… мы разделим двадцать восьмой выпуск на две части… Скорее всего, будет какая-то финальная битва.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-27\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6506\" target=\"_blank\" rel=\"noopener\">1:48:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск 28 сняли за один мотор и заранее протестировали<\/b><\/div><p>Авторы рассказали, что приключение 28 было полностью готово: сценарий, карты, Бреганов выспался и всё прочитал. В отличие от 26 и 27, которые не успели проверить, его заранее прогнали на тестовой игре в офисной переговорке. Сняли его за один мотор и уже потом разделили на две части.<\/p><blockquote>«Двадцать восьмое приключение тестировалось вот здесь, в комнате, которая находится за этим телевизором… мы её называем переговорка.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-1\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=145\" target=\"_blank\" rel=\"noopener\">0:02:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гудков не знал, вернётся ли BRB, но всё делал, чтобы его посадить за стол<\/b><\/div><p>Авторы рассказали: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> догадывался, что <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> могут воскресить, раз <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал его прах, но не знал, произойдёт ли это в этом выпуске и как. Импровизаторы не знали ничего. Гудков сказал, что все его действия в игре были направлены на то, чтобы <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сел за стол пятым игроком.<\/p><blockquote>«Все мои действия, всё было направлено для того, чтобы его туда посадить, так что я не играл без него.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa28/#qa28-2\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=239\" target=\"_blank\" rel=\"noopener\">0:03:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-3\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Список уязвимостей вампиров<\/b><\/div><p>Авторы перечислили уязвимости вампиров ПЧК: серебро (чем оно чище, тем сильнее действует), текущая вода, огонь, солнечный свет, святая вода и божественная энергия, ведь вампиры — нежить. Серебряный меч ранил бы и самого <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, если бы не оплётка на рукояти.<\/p><blockquote>«Прежде всего серебро, текущая вода, огонь, солнце, солнечные лучи, святая вода, божественная энергия, поскольку вампиры — это нежить.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-3\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=877\" target=\"_blank\" rel=\"noopener\">0:14:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-4\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Воскрешение Вампирбека стало возможным только благодаря действиям игроков<\/b><\/div><p>Авторы по-прежнему считают воскрешение плохой идеей, но здесь его заслужили. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам, без указаний, собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> в солевую одноразку (выпуск 26) и записал в карточку, что воспользуется любым шансом его воскресить. Тогда авторы сделали из этого испытание: игроки должны были узнать об умных автоматонах, догадаться положить в робота одноразку с биоматериалом и за минуту обезвредить самоуничтожение.<\/p><blockquote>«Воскрешение должно быть заслужено… только если герои могут сами с этим справиться, сами дойти до этой мысли.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-4\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1140\" target=\"_blank\" rel=\"noopener\">0:19:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Появление BRB не было прописано в сценарии<\/b><\/div><p>Авторы ответили зрителям, что выход <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> не был запланирован. Его позвали на съёмку с 9 вечера и прятали от игроков, не зная, сыграет ли он. На тестовой игре <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> воскресили только через три с половиной часа. Если бы загадку не решили, BRB бы так и не вышел. Видение с прахом в начале 28b — рекламная интеграция, её сняли позже, поэтому кажется, что всё было известно заранее.<\/p><blockquote>«Это не было запланировано. Потому что если бы мы не отгадали загадку, Игорь бы не вышел.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-5\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1329\" target=\"_blank\" rel=\"noopener\">0:22:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-6\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Провал головоломки означал гибель всего клана и финал ветки<\/b><\/div><p>Если бы игроки не ввели код, автоматон взорвался бы рядом с ними. Огонь наносит вампирам двойной урон, так что они бы, скорее всего, погибли, и выпуск не пришлось бы делить. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> в шутку описал альтернативный финал: «эпичный выход» и встреча всех братьев в загробном мире — «был бы крутой финал ветки вампиров».<\/p><blockquote>«Если бы они не решили ту задачку, они бы, скорее всего, там все сами и умерли, потому что там был взрыв огнём, который наносил двойной урон.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-6\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1457\" target=\"_blank\" rel=\"noopener\">0:24:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-7\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Как придумали головоломку с кодом 46 и почему подсказали Гудкову<\/b><\/div><p>Сначала на тестовой игре разминирование решили одним броском интеллекта, потом заменили его головоломкой. Шатохин и Селезнёв перерешали 10–15 похожих задач и сами справлялись секунд за 40, а съёмочная группа — минуты за две. Боясь, что все погибнут, авторы перед съёмкой дали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> три похожие задачки «размять мозг». В итоге задачу решил <a class=\"ref\" href=\"/p/arseniy-popov/\">Попов<\/a>, ответ 46, и всё было честно, без монтажа.<\/p><blockquote>«Мы с Вадиком, обсудив, говорим: давай к Сане подойдём и подкинем ему просто несколько таких задачек, просто потренироваться.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa28/#qa28-7\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1648\" target=\"_blank\" rel=\"noopener\">0:27:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-8\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Самоуничтожение кованого рыцаря: 7d6 огнём, десятая способность<\/b><\/div><p>Авторы показали карточку кованого рыцаря: у него 10 способностей по броску d10. Десятая — самоуничтожение, работает при 40 хитах и наносит 7d6 урона огнём (вампирам вдвое больше). Идею кованых нашёл Селезнёв в редакции D&amp;D 3.5, а не в Baldur's Gate.<\/p><blockquote>«Номер 10 — это самоуничтожение, и эта фишка работает, если у него 40 ХП.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-8\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1906\" target=\"_blank\" rel=\"noopener\">0:31:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск поделили из-за иллюстраций, а не из-за звёзд<\/b><\/div><p>Авторы объяснили, что 28, как и «Судьбу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>» (21a/21b), снимали как одно приключение. На монтаже материала оказалось больше 2,5 часа. Художницы рисуют около 150 иллюстраций за 3–4 недели, а на полную версию понадобилось бы около 250. Поэтому выпустили первую часть, а остальные иллюстрации дорисовали ко второй; бюджет на художников был как на два выпуска.<\/p><blockquote>«Это производственная необходимость и экономика шоу.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-9\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1991\" target=\"_blank\" rel=\"noopener\">0:33:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-10\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>BRB сам придумал, что Вампирбек недоволен воскрешением<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что пока ждал, почти не смотрел игру: так честнее для персонажа, который не знает, что происходит. Он решил, что <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> не должен быть доволен воскрешением в механическом теле, ведь в прахе был не только он. Авторы добавили эту мотивацию в рекламную интеграцию в начале 28b.<\/p><blockquote>«Я понял, что Вампирбек не очень должен быть доволен своим воскрешением. Ну и плюс, как бы, это механическое устройство.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa28/#qa28-10\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=3536\" target=\"_blank\" rel=\"noopener\">0:58:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa28-11\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Имя персонажа Попова пишется «Вампидап»<\/b><\/div><p>Авторы рассказали, что при подготовке карточки сомневались в написании и спросили самого <a class=\"ref\" href=\"/p/arseniy-popov/\">Попова<\/a>. Он ответил, что персонажа зовут <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a>, и это фонетическая шутка.<\/p><blockquote>«Отправь Арсению, спроси, кто он… И Арсений прислал: он Вампидап.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-11\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4258\" target=\"_blank\" rel=\"noopener\">1:10:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-12\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Антон и Мирамистина — случайная связь, двойное отцовство объясняют зелья<\/b><\/div><p><a class=\"ref\" href=\"/p/anton-shastun/\">Шастун<\/a> ответил, что <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> Антону не жена, а случайная связь. Узнав о двойном отцовстве, Антон сперва напрягся, но успокоился, поняв, что всё дело в зельях ведьмы.<\/p><blockquote>«Когда потом понял, что там всё основано на зельях… что это просто намешали зелья, вот тогда в целом ну ладно.»<\/blockquote><p class=\"note\">Шастун · <a href=\"/pod/qa28/#qa28-12\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4317\" target=\"_blank\" rel=\"noopener\">1:11:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-13\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Вампидап не собирается воспитывать СуперБигДикГана<\/b><\/div><p><a class=\"ref\" href=\"/p/arseniy-popov/\">Попов<\/a> сказал, что <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> не будет брать на себя воспитание. Он считает <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a> достаточно взрослым и самостоятельным.<\/p><blockquote>«Да нет, конечно, не собираюсь я брать на себя функции воспитания, к тому же я считаю, что СуперБигДикГан уже достаточно взрослый.»<\/blockquote><p class=\"note\">Попов · <a href=\"/pod/qa28/#qa28-13\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4393\" target=\"_blank\" rel=\"noopener\">1:13:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-14\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>СуперБигДикГану ближе Антон<\/b><\/div><p><a class=\"ref\" href=\"/p/dmitriy-pozov/\">Позов<\/a> ответил, что из двух отцов <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГану<\/a> пока ближе Антон: по легенде тот рядом с детства. <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> появился неожиданно, и ещё надо разобраться, где он был и отец ли он вообще.<\/p><blockquote>«Мне кажется, что пока Антон, потому что, кажется, по легенде он со мной с самого детства. А вот Арсений-Вампидап как-то так появился неожиданно в моей жизни.»<\/blockquote><p class=\"note\">Позов · <a href=\"/pod/qa28/#qa28-14\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4463\" target=\"_blank\" rel=\"noopener\">1:14:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-15\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Грязнис Домогайтис нарисован с Жерара Депардье<\/b><\/div><p>Художница Катя Гандрабура объяснила, что Домогайтиса нарисовали похожим на Жерара Депардье из-за его скандалов («почитайте новости»). Внешность NPC придумывают художники или авторы, иногда места NPC покупают подписчики, а иногда персонажа добавляют по шутке игрока за столом.<\/p><blockquote>«Почему Жерар Депардье? Потому что это самое что ни на есть Грязнис Домогайтис, почитайте новости, поймёте.»<\/blockquote><p class=\"note\">Катя Гандрабура · <a href=\"/pod/qa28/#qa28-15\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4646\" target=\"_blank\" rel=\"noopener\">1:17:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-16\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Чек-Ин Гномбанка на 100 золотых хотят обналичить в будущем выпуске<\/b><\/div><p><a class=\"ref\" href=\"/c/chek/\">Чек-Ин<\/a> на 100 золотых положили Пиф-Пафу для забавы, не зная, найдут ли его. Обналичить его в том же выпуске было нельзя, это отдельный длинный сюжет. Авторы хотят сделать выпуск-квест: клан Балан или новые персонажи пытаются обналичить чек в Гномбанке, и при успехе 1 млн рублей уйдёт в заранее объявленный фонд. Обсуждались идеи стола против стола и игры на время. Квест пока не придуман.<\/p><blockquote>«Мы бы хотели сделать прямо такой сюжет, что команда… клан Балан идут обналичивать 100 золотых в Гномбанк.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-16\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=4816\" target=\"_blank\" rel=\"noopener\">1:20:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-17\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Адриан Вурдаласку заказал Грязниса Домогайтиса<\/b><\/div><p>Домогайтис голосовал против плана «Чёрное небо» и не хотел превращать людей в скот. Ему нравилось жить в Змии Хрустальном и устраивать арт-вечеринки. Высший вампирский совет почти у власти и в конфронтации с кланом Балан, несогласных он не терпит. Поэтому, когда Домогайтис передал взрыватели, Адриан Вурдаласку нанял Пиф-Пафа и выписал ему чек на 100 золотых. Внутри совета нет единства.<\/p><blockquote>«Заявив о своей позиции в высшем вампирском совете, он подписал себе смертный приговор.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-17\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5218\" target=\"_blank\" rel=\"noopener\">1:26:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-18\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Домогайтис мог стать союзником клана Балан<\/b><\/div><p>Авторы отметили, что Домогайтис, которого хочет убить совет, был потенциальным союзником клана Балан. Игроки упустили этот шанс и настроили его против себя. Девушки в банях были с ним по доброй воле: он пил их кровь, но не убивал, держа при себе, как вампиры держат фамильяров.<\/p><blockquote>«Если высший вампирский совет хочет убрать Грязниса, то значит, что Грязнис потенциально ваш союзник. Вы этой возможностью не воспользовались.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-18\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5346\" target=\"_blank\" rel=\"noopener\">1:29:06 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-19\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Настоящий план Пиф-Пафа: бойня в банях и снайпер на крыше<\/b><\/div><p><a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> распустил среди мигрантов слухи, демонизирующие Домогайтиса, и завербовал отряд (<a class=\"ref\" href=\"/c/kristof/\">Кристоф<\/a>, изобретатель <a class=\"ref\" href=\"/c/villi/\">Вилли<\/a> и др.), чтобы отправить его в бани. Сам он собирался лечь на крышу с гномьей снайперской винтовкой. Он хотел взорвать котельную, чтобы перекрыть чёрный ход. Затем ожил бы боевой автоматон и, как Терминатор, зачистил бы бани, а выбегающих Пиф-Паф добил бы с крыши. Так всё выглядело бы как бунт мигрантов, и свидетелей бы не осталось. Клан Балан он предал бы при любых договорённостях.<\/p><blockquote>«Он оживает, он зачищает бани, а Пиф-Паф сам просто расслабленный лежит на крыше, и кто выбегает, того он пристреливает.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-19\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5473\" target=\"_blank\" rel=\"noopener\">1:31:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-20\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Пиф-Паф не телепортировался; телепорт — аналог «Туманного шага»<\/b><\/div><p><a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a> был спокоен, потому что мог телепортироваться в любой момент. Но его выстрел промахнулся, а Антону удался бросок на переворот машины, который зал встретил овацией. Мастер в кадре бросил за Пиф-Пафа, и тот не вырвался (бросок вырезали). Иначе следующим ходом он бы телепортировался и ушёл крюком на крышу. Его телепорт — не дальний, а аналог заклинания «Туманный шаг» (около 30 футов), как у <a class=\"ref\" href=\"/c/adolf/\">Адольфа<\/a> в выпуске 16.<\/p><blockquote>«Это не такой телепорт… это телепорт, равный заклинанию «Туманный шаг», как было у Адольфа в шестнадцатом выпуске.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-20\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=5884\" target=\"_blank\" rel=\"noopener\">1:38:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-21\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>В автоматоне — сознание Вампирбека; кованый рыцарь похож на вампира<\/b><\/div><p>Сознание <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> загружено в кованого рыцаря: он тот же, с прежними идеалами, хотя они могут измениться. В прахе есть частица высшего вампира и волка, но это пока не проявилось. Кованый рыцарь, как вампир, боится воды: в любой воде он может получить паралич (спасбросок выносливости). Отсюда совет в инструкции «не погружать в воду», это была подсказка к бою. Ещё он уязвим к электричеству и нуждается в «режиме» вроде медитации. Зелья его не лечат, восстановить его могут только заклинание починки или изобретатель.<\/p><blockquote>«Твоё сознание было загружено в кованого рыцаря, и, соответственно, внутри ты всё тот же Вампирбек, но в иной оболочке.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-21\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6075\" target=\"_blank\" rel=\"noopener\">1:41:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-22\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Главным должен был стать бой с автоматоном, а не аэродром<\/b><\/div><p>По замыслу главным испытанием был бой с боевым автоматоном: на тестовой игре он оказался очень тяжёлым, одна ракета по стоящим кучей героям — «капец». Робот активировался от любого шороха, и игрокам повезло тихо попасть в кабинку № 3 с ключом. Аэродром задумывался как короткий «посткэпшот». Дирижабль «Красный дракон» можно было захватить, сбить ракетой <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (у него в инвентаре было три) или упустить вместе с Адрианом.<\/p><blockquote>«Вот этот бой, он должен был быть главным… и бой на аэродроме, он как бы не главный.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-22\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6264\" target=\"_blank\" rel=\"noopener\">1:44:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-23\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Погоня, три препятствия и задуманное двойное отцовство<\/b><\/div><p>Погоня была необязательной: героев мог преследовать <a class=\"ref\" href=\"/c/pif-paf/\">Пиф-Паф<\/a>, если узнавал о клане Балан, или городская стража. Для погони заготовили три препятствия: крутой поворот, брёвна и храм семейных ценностей с тестом на отцовство, а также полицейский автомобиль и дирижабль стражи. Двойное отцовство («50 на 50») было задумано изначально и не зависело от выборов игроков. Ведьма <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> соединила живое из мёртвого биоматериала двух вампиров одной команды.<\/p><blockquote>«Изначально мы решили, что 50 на 50… ведьма Мирамистина сумела соединить, вычленить что-то живое из мёртвого биоматериала двух вампиров.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-23\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6458\" target=\"_blank\" rel=\"noopener\">1:47:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-24\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дьяблери: вампир, выпивший вампира, получает его силы и риск<\/b><\/div><p>Бреганов объяснил дьяблери: вампир, выпивший другого вампира, забирает его жизненную энергию, особенности и способности. Сообщество вампиров это запрещает: выпитый может попытаться вернуть контроль над телом, и борьба двух сущностей в одном теле может идти годами незаметно для выпившего. Последствия непредсказуемы.<\/p><blockquote>«Вампир может вернуть себе контроль над телом, и борьба между двумя сущностями в одном вампире может происходить годами.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa28/#qa28-24\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6636\" target=\"_blank\" rel=\"noopener\">1:50:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa28-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Технологии ПЧК: Змий Хрустальный — стимпанк-город гномов<\/b><\/div><p>Авторы пояснили, что <a class=\"ref\" href=\"/place/zmiy-hrustalnyy/\">Змий Хрустальный<\/a> с самого начала был на карте как технологичный город изобретателей: техника — сильная сторона гномов ростом около 90 см. Мир ПЧК намеренно эклектичен. <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> — классическое средневековое фэнтези. Столица <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> (<a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>) — переход от Возрождения к классицизму. Змий Хрустальный — стимпанк, <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> — восточноевропейский хоррор, <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a> — магия и «магический небоскрёб».<\/p><blockquote>«Змий Хрустальный у нас получился стимпанком, Мёртвые топи — это восточноевропейский хоррор, Шиш Кебаб — магия, магический небоскрёб.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-25\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6723\" target=\"_blank\" rel=\"noopener\">1:52:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-26\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Автоматонов Дон-Дон создал, ещё когда был смертным изобретателем<\/b><\/div><p>Умные автоматоны — разработка гнома Дон-Дона, но не божественное создание. Их сделали, когда <a class=\"ref\" href=\"/c/dondon/\">Дон-Дон<\/a> был ещё талантливым изобретателем, а не богом, которым он стал позже (отсылка к выпуску 27).<\/p><blockquote>«Это не божественное создание… в тот момент Дон-Дон ещё не был богом, он был просто очень талантливым изобретателем, который дослужился до бога.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-26\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6862\" target=\"_blank\" rel=\"noopener\">1:54:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa28-27\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Кукла для любовных утех была ловушкой; Вампирбек мог воскреснуть в ней<\/b><\/div><p>Заминированная кукла была ловушкой. Если бы <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> швырнул её, как собирался, случился бы гарантированный взрыв, и выжил бы, скорее всего, один герой. Куклу можно было разминировать и поместить в неё прах. У неё тоже была карточка с 10 способностями по d10, но в основном поддерживающими. Тогда <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> воскрес бы в теле секс-куклы.<\/p><blockquote>«Кукла для любовных утех была ловушкой… Это был бы взрыв, просто гарантированный взрыв в моменте.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-27\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=6935\" target=\"_blank\" rel=\"noopener\">1:55:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-28\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b><\/div><p>Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво.<\/p><blockquote>«Семеро живы, пять мертвы, семь плюс пять — двенадцать, ребята.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-28\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa32-23\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Гибелью Дододиса Гудков невольно помог Дан Балану<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> признал, что не хотел убивать дракона, рассуждая как <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>: дракон — единственная защита вулкана от плана «Чёрное небо» высших вампиров. Авторы заметили, что выпуск — кросс-ветка: клан Дан Балана лишил совет взрывателей в #28, но бочки со взрывчаткой уплыли к вулкану. На слова Гудкова, что дракон не страшен, авторы намекнули, что он «кое-чего не знает».<\/p><blockquote>«будучи играя в шкуре Дана Балана, не убил бы дракона, потому что это единственная защита вулкана»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa32/#qa32-23\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=7457\" target=\"_blank\" rel=\"noopener\">2:04:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa32-24\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Как вампиры оказались в плену у дракона<\/b><\/div><p>Если бы в #28 дирижабль не остановили, взрывчатку опустили бы в жерло мимо дракона и взорвали дистанционно. Потеряв дирижабль, вампиры повезли взрывчатку (упущенную ещё в #26) кораблём, а затем на телеге через заброшенный город и разбудили дракона. Он взял их в заложники, и они договорились: вампиры добывают ему ценный артефакт (маску), а дракон взрывает для них вулкан и отпускает с миром.<\/p><blockquote>«Они добудут для него ценный артефакт, который ему нужен, а взамен дракон взорвёт для них вулкан и отпустит с миром»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-24\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=7737\" target=\"_blank\" rel=\"noopener\">2:08:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa33-14\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как работает самоуничтожение Вампирбека<\/b><\/div><p>Самоуничтожение — одна из граней кубика способностей <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (выпадение 10 на d10 срабатывает как реле), поэтому оно может включиться случайно; в #28b это уже происходило. Чтобы остановить его, нужно залезть роботу в спину и пройти спасбросок (называли интеллект СЛ 15, затем мудрость). Сам Вампирбек отключить его не может — это должен сделать союзник, например <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>. Авторы назвали это «чеховским ружьём»: урон от взрыва большой.<\/p><blockquote>«Раз активировал реле номер 10, у тебя... запускается процесс самоуничтожения... Это бомба замедленного действия... чеховское ружьё.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-14\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=4471\" target=\"_blank\" rel=\"noopener\">1:14:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa33-17\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мотивация Вампирбека в третьей жизни<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> остаётся с кланом Балан, <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> ответил, что его персонаж сейчас меньше всех действует из мотивации: он машина, которую запустили и используют. По замыслу BRB, Вампирбек расстроен своим воскрешением: всю жизнь управлял повозками, а теперь сам стал машиной в «ебучем теле».<\/p><blockquote>«человек, который управлял всю жизнь машинами какими-то, теперь сам стал машиной, и ему от этого не очень прикольно»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa33/#qa33-17\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=4778\" target=\"_blank\" rel=\"noopener\">1:19:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa33-34\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Чек-Ин Гномбанка хотели обналичить в новогоднем выпуске<\/b><\/div><p>В 2024 году планировали новогодний выпуск-импровизацию, где обналичили бы чек Гномбанка на 100 золотых (миллион рублей на благотворительность). Не сложилось, перенесли на следующий год.<\/p><blockquote>«в этом году должен был быть новогодним выпуск с импровизацией, где мы должны были обналичить чек Гномбанк на миллион руб... минимум на 100 золотых монет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-34\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=7255\" target=\"_blank\" rel=\"noopener\">2:00:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-22\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Механика самоуничтожения Вампирбека<\/b><\/div><p>Когда здоровье <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> падает до шести, запускается самоуничтожение: в его следующий ход происходит взрыв на 7d6 (спасбросок Ловкости вдвое снижает урон). Остановить его может союзник проверкой Интеллекта Сл 10, как в выпуске 28. Радиус взрыва и то, что Вампирбек не может обезвредить себя сам, в карточке не указаны намеренно, чтобы оставить мастеру свободу. При спасении многое зависело бы от того, кто ходит раньше: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> или Вампирбек.<\/p><blockquote>«Если твоё здоровье опускается до шести, запускается процесс самоуничтожения… Чтобы остановить самоуничтожение, нужно пройти проверку Интеллекта 10.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-22\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4480\" target=\"_blank\" rel=\"noopener\">1:14:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><\/section>", "chars": {"Вампир Бек": {"name": "Вампирбек", "img": "img/chars/vampirbek.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%B0%D0%BC%D0%BF%D0%B8%D1%80%D0%B1%D0%B5%D0%BA", "summary": "Вампирбе́к — вампир из клана Балан, рикша из города Кёнигпон.", "infobox": {"Пол": "Мужской", "Рас
