<script>window.EPD = {"anim": false, "key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "date": "2024-07-13", "minutes": 73, "duration": 4364.0, "video_id": "2J5w_JG83uI", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Гномий город Змей Хрустальный: бани «Гномский пар» и аэродром", "short_html": "Клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> идёт по следу взрывателей для вулкана к гному-вампиру Домогайтису и Адриану Вурдоласку.", "summary_html": "Клан допивает пойманного наёмника Пиф-Пафа, находит у него телепортатор, бомбы, чек на 100 золотых и записку Адриану Вурдоласку, заказавшего <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязниса Домогайтиса<\/a>. Под видом гномов герои проникают в бани «Гномский пар», в кабинку, забронированную Пиф-Пафом, где стоят заминированная кукла и боевой автоматон. Разгадав код самоуничтожения, они помещают в робота прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> — тот воскресает в теле кованого рыцаря, пробивает стену к Домогайтису, и клан убивает его охрану. Домогайтис признаётся, что уже передал взрыватели Адриану (дирижабль «Красный дракон»), переживает взрыв куклы и улетает туманом. На аэродроме <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> метлой с бомбой взрывает «Красный дракон»; Адриану Вурдоласку гибнет, план «Чёрное небо» сорван. Тест на отцовство показывает, что у Супербигдикгана два отца — Антон и <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a>.", "outcome_html": "План «Чёрное небо» сорван, взрыватели уничтожены, Адриану Вурдоласку погиб; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> возрождён в теле автоматона, Домогайтис сбежал.", "world_html": ["План высшего вампирского совета «Чёрное небо» (подрыв вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>) сорван, гномьи взрыватели уничтожены", "Высший совет потерял Адриану Вурдоласку", "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> возрождён в теле умного автоматона (кованого рыцаря)", "<a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> жив и враждебен клану", "В Змее Хрустальном взорван дирижабль «Красный дракон» на аэродроме", "Появляется новая вампирша — обращённая Антоном полуэльфийка"], "scenes": [{"t": "0:00:44", "sec": 44, "html": "«Ранее» и сцена-видение: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> говорит с прахом <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>; тот сперва против воскрешения в «гномьем роботе» («я погиб как герой»), но соглашается."}, {"t": "0:04:58", "sec": 298, "html": "После аварии Антон держит оглушённого Пиф-Пафа; <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> отпивает у него кровь."}, {"t": "0:07:32", "sec": 452, "html": "Обыск: телепортатор-коробочка с кнопкой (прыжок примерно на 10 м), дымовая и осколочная бомбы, пистолет-крюк с лебёдкой, записка («Сегодня в полночь <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a> будет в банях „Гномский пар“ практически без охраны. Ход за тобой. Адриану Вурдоласку»), ключ с биркой № 3, чек в Гномбанк на 100 золотых на предъявителя."}, {"t": "0:09:20", "sec": 560, "html": "<a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> досуха выпивает Пиф-Пафа и восстанавливает здоровье."}, {"t": "0:10:38", "sec": 638, "html": "В колпаках и с паспортами герои выходят к толпе гномов-зевак у места крушения; один снял погоню на «магическую скрижаль». <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> и Антон («Антон Нолан») выдают всё за съёмки боевика и заставляют удалить запись, а зевак отправляют на главную площадь «сниматься». Паспорта разобраны: Боньк-Боньк, Дзвеньк-Дзвеньк, Кунь-Кунь, Чих-Пых, Толик."}, {"t": "0:15:45", "sec": 945, "html": "Бани «Гномский пар»: администратор-гномка Чек, охранник Гоша со сканвордом. <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> проваливает комплимент, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> на критическом успехе «соблазняет» Гошу искусственной розой (тот берёт её «для жены»). Кабинка № 3 записана на псевдоним Пиф-Пафа «Пих-Пах»; туда несколько дней назад доставили два больших ящика."}, {"t": "0:21:36", "sec": 1296, "html": "В раздевалке, завернувшись в полотенца поверх всего инвентаря, герои находят и забирают форму пилота дирижабля."}, {"t": "0:25:04", "sec": 1504, "html": "Купальня: у кабинки № 2 стоят два охранника-вампира (грим течёт от пара). В VIP-кабинке № 3 — безжизненная кукла (любовный автоматон) и ящик с боевым автоматоном, уже принявшим черты Пиф-Пафа (в нём его биоматериал)."}, {"t": "0:27:14", "sec": 1634, "html": "Антон вскрывает ящик под кашель <a class=\"ref\" href=\"/c/vampirap/\">Вампидапа<\/a>; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> на критическом успехе бесшумно отодвигает его от стены."}, {"t": "0:32:47", "sec": 1967, "html": "Сброс до заводских настроек запускает самоуничтожение; за минуту герои решают головоломку с ящиками, монетами и кристаллами и вводят код 46."}, {"t": "0:36:00", "sec": 2160, "html": "В отсек бронзового сердечника кладут солевую одноразку с прахом — автоматон принимает облик <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (очки, густая борода). Вампирбек воскресает «андроидом»: двуручный меч, огненное дыхание, ракеты, уязвимость к электричеству и воде, 10 случайных «особых действий» (бросок d10); обещает, что это его «последний заезд»."}, {"t": "0:40:20", "sec": 2420, "html": "Пробуя «ракеты», <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> случайно активирует мощный прыжок и застревает в потолке. <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> отвечает постучавшему охраннику, что это «кукла-ублажительница», и убеждает его не мешать. Кукла оказывается заминирована — её не трогают."}, {"t": "0:45:38", "sec": 2738, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> пробивает кулаками стену; за ней Домогайтис с двумя девушками — полуорчихой и полуэльфийкой. Двух вампиров-телохранителей убивают: Антон из арбалета, <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> серебряной катаной, <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> кинжалом между глаз, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> огненным серебряным мечом Бесогона."}, {"t": "0:52:08", "sec": 3128, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> для устрашения выжигает огнём мебель. Полуорчиха Сисиль (сестра <a class=\"ref\" href=\"/c/kristof/\">Кристофа<\/a>) заслоняет Домогайтиса. Тот рассказывает: взрыватели он уже передал Адриану Вурдоласку, одному из исполнителей плана «Чёрное небо»; сам голосовал против и, видимо, поэтому Адриан заказал его Пиф-Пафу. Взрыватели — на аэродроме, в дирижабле «Красный дракон»."}, {"t": "0:56:38", "sec": 3398, "html": "Домогайтиса отпускают в соседнюю комнату, но <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> «ножницами» бьёт мячом из бычьего пузыря в заминированную куклу — взрыв (17 урона огнём), однако Домогайтис выходит из пламени, превращается в туман и улетает."}, {"t": "0:58:28", "sec": 3508, "html": "Сисиль упрекает героев (Домогайтис создал лагерь и спас мигрантов от улицы и волков); <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикган<\/a> выдыхает на неё ядовитый дым солевой одноразки — она теряет сознание. Антон выпивает полуэльфийку и поит её своей кровью: через сутки она должна стать вампиром."}, {"t": "1:03:05", "sec": 3785, "html": "На оставленной паровой повозке клан едет на аэродром: четыре дирижабля, «Красный дракон» заправляют водородом, погрузкой руководит Адриану Вурдоласку с охраной."}, {"t": "1:05:10", "sec": 3910, "html": "Осколочную бомбу прилепляют мятной жвачкой к метле <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикгана<\/a>, её конец затачивают колом. Адриан сбивает метлу порывом ветра, но <a class=\"ref\" href=\"/c/vampirap/\">Вампидап<\/a> выправляет курс — «Красный дракон» взрывается огненным шаром; к ногам героев катится голова Адриану Вурдоласку."}, {"t": "1:08:30", "sec": 4110, "html": "Возвращается сумка с роем челюстей; Тошнислав приносит тест на отцовство: у <a class=\"ref\" href=\"/c/luka-superbigdikgan/\">Супербигдикгана<\/a> два отца — <a class=\"ref\" href=\"/c/miramistina/\">Мирамистина<\/a> соединила ДНК двух вампиров (Антона и <a class=\"ref\" href=\"/c/vampirap/\">Вампидапа<\/a>) в одно семя."}, {"t": "1:10:44", "sec": 4244, "html": "Финал: собранные монеты уходят в благотворительный фонд (80 000 руб.); чек Гномбанка остаётся не обналиченным. Закадровый итог: ещё один высший вампир пал от клана Балан, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> возрождён в кованом рыцаре."}], "key_events": [{"t": "0:07:32", "sec": 452}, {"t": "0:09:20", "sec": 560}, {"t": "0:15:45", "sec": 945}, {"t": "0:32:47", "sec": 1967}, {"t": "0:36:00", "sec": 2160}, {"t": "0:45:38", "sec": 2738}, {"t": "0:53:44", "sec": 3224}, {"t": "0:57:20", "sec": 3440}, {"t": "1:01:08", "sec": 3668}, {"t": "1:07:36", "sec": 4056}, {"t": "1:09:04", "sec": 4144}], "coins": {"ep": "28b", "events": [{"t": "0:07:59", "kind": "loot", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "Обыскал тело убитого Пивпафа и нашёл на нём две золотые монеты (гонорар за убийство), а также телепортатор, дымовую шашку и крюк с лебёдкой.", "result": null, "sec": 479, "who_url": "/c/dan-balan/", "reason_html": "Обыскал тело убитого Пивпафа и нашёл на нём две золотые монеты (гонорар за убийство), а также телепортатор, дымовую шашку и крюк с лебёдкой."}, {"t": "0:17:03", "kind": "earn", "who": "Дан Балан", "actor": "Гудков", "to": null, "reason": "Комично очаровал официанта Гошу и подарил цветок его жене, отыграв верность семейным ценностям.", "result": null, "sec": 1023, "who_url": "/c/dan-balan/", "reason_html": "Комично очаровал официанта Гошу и подарил цветок его жене, отыграв верность семейным ценностям."}, {"t": "0:31:36", "kind": "spend", "who": "Вампирap", "actor": "Попов", "to": null, "reason": "Потратил монету на переброс проверки атлетики (сила), пытаясь аккуратно, не потревожив триггер, сдвинуть с места робота-автоматона.", "result": null, "sec": 1896, "who_url": null, "reason_html": "Потратил монету на переброс проверки атлетики (сила), пытаясь аккуратно, не потревожив триггер, сдвинуть с места робота-автоматона."}, {"t": "0:35:12", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Группа успела разгадать математическую головоломку и ввести код деактивации робота (46) до истечения таймера самоуничтожения.", "result": null, "sec": 2112, "who_url": null, "reason_html": "Группа успела разгадать математическую головоломку и ввести код деактивации робота (46) до истечения таймера самоуничтожения."}, {"t": "0:46:43", "kind": "earn", "who": "Вампирap", "actor": "Попов", "to": null, "reason": "Проявил сострадание к напуганным пленницам грязниса Домогайтиса вместо немедленной расправы.", "result": null, "sec": 2803, "who_url": null, "reason_html": "Проявил сострадание к напуганным пленницам грязниса Домогайтиса вместо немедленной расправы."}, {"t": "0:48:25", "kind": "spend", "who": "Супербигдикган", "actor": "Позов", "to": null, "reason": "Потратил монету на переброс атаки серебряной катаной по вампиру-охраннику.", "result": "Попадание, урон удвоен как от серебряного оружия.", "sec": 2905, "who_url": "/c/luka-superbigdikgan/", "reason_html": "Потратил монету на переброс атаки серебряной катаной по вампиру-охраннику."}, {"t": "1:02:35", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "Выпил кровь пленённой полуэльфийки и обратил её в вампира — тяжёлый, мрачный отыгрыш морального выбора («Сисиль расплавил»).", "result": null, "sec": 3755, "who_url": "/c/anton/", "reason_html": "Выпил кровь пленённой полуэльфийки и обратил её в вампира — тяжёлый, мрачный отыгрыш морального выбора («Сисиль расплавил»)."}], "totals": [{"who": "Дан Балан", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/dan-balan.webp", "who_url"
