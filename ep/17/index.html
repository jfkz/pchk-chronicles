<script>window.EPD = {"key": "17", "label": "17", "title": "Демонизация", "date": "2023-04-13", "minutes": 89, "duration": 5326.0, "video_id": "QqgBzPfBkj0", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Геленбург: каретная мастерская Пахома, лавка «Руки-Загребуки», улицы у стройки «подземного вокзала»", "short_html": "После взрыва <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a> демоны <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> строят в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> «подземный вокзал» — новый адский портал, для запуска которого везут гигантский кристалл. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> собирает беглых бесов Мишу и <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>, демоницу Дину <a class=\"ref\" href=\"/p/nikita-nikitin/\">Никитину<\/a> и гнома-матершинника Виктора. Они захватывают бывшую каретную мастерскую Пахома, добывают порох у эльфа Малика, взрывают конвой на перекрёстке и убивают страшного стража <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a>. <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> украден и перенесён в лес, но от ритуальных убийств союзников кристалл в руке Пахома чернеет.", "summary_html": "После взрыва <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a> (вып. 10) в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> хлынули демоны, а лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> строит в центре города подземный «вокзал» — новый адский портал, для запуска которого не хватает гигантского кристалла телепортации. Мучимый совестью <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> собирает команду беглых бесов и гнома-матершинника, чтобы перехватить повозку с кристаллом. Герои отбивают бывшую каретную мастерскую Пахома, добывают порох у подпольного торговца оружием эльфа Малика, устраивают засаду с пороховой «зеброй» на перекрёстке, взрывают конвой и в бою убивают монстра-стража <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a>. <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> украден и унесён телепортом в лес, но кристалл в руке Пахома чернеет от ритуальных убийств, совершённых его союзниками.", "outcome_html": "<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> для адского портала похищен, вторая волна демонизации отсрочена. Гном Виктор погиб, кристалл <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> заражён тёмной энергией.", "world_html": ["Строительство Адского вокзала <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> лишено ключевого кристалла", "Гигантский кристалл спрятан в лесу у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>", "<a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">Кристалл телепортации Пахома<\/a> заражается тёмной энергией и вредит носителю", "В <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> демоны действуют открыто по договорённости со стражей"], "scenes": [{"t": "0:03:17", "sec": 197, "html": "Вступление: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с помощью кристалла сбежал из адского поезда, взорвал <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a> и невольно открыл портал в преисподнюю. Юбилейный «комнатный комикон»: игроки в костюмах персонажей прошлых выпусков."}, {"t": "0:05:25", "sec": 325, "html": "Завязка: <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>, демоны организованно подчиняются лорду <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> и строят «подземный вокзал» для адских поездов — новый портал. Этой ночью на корабле привезут огромный кристалл телепортации и повезут на стройку; его надо выкрасть и вывезти из города (уничтожать в городе нельзя — взрыв)."}, {"t": "0:06:30", "sec": 390, "html": "Представление героев: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> (кристалл врос в руку и истощает его), беглые бесы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> (баянист) и <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> (клерк), демоница <a class=\"ref\" href=\"/c/dina-nikitina/\">Дина Никитина<\/a> с мёртвой собакой Гришей (писает кислотой), гном-матершинник Виктор со сборником «Тёщин язык». Механика: бесы забирают души (ритуальное убийство, за золотую монету или услугу по согласию); две души дают суперспособность."}, {"t": "0:13:00", "sec": 780, "html": "План <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>: перегородить широкую дорогу тяжёлой повозкой, загнать конвой в переулок и обстрелять. Нужны повозка (в бывшей каретной мастерской Пахома) и пушки/порох (по слухам — в лавке «Руки-Загребуки» эльфа Малика). Зазывала раздаёт флаеры со скидкой 50%."}, {"t": "0:16:06", "sec": 966, "html": "Телепорт кристаллом во двор мастерской. Бесы пугают рабочих, предлагая исполнить «любое желание». <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и Дина идут в контору: клиент-качок ломает себе палец, пытаясь оттолкнуть Пахома, и зовёт стражу; Дина насылает проклятие вшей — вши заживо съедают девушку за стойкой."}, {"t": "0:21:31", "sec": 1291, "html": "В кабинете новый хозяин мастерской — полуголый чемпион «по борьбе с голым торсом» (портрет «графа Ротана»). <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> бьёт его психической иглой, тот душит Пахома с прогиба; Пахом превращает алмаз в клинок и добивает его в затылок."}, {"t": "0:24:45", "sec": 1485, "html": "Во дворе Виктор спаивает рабочего спиртом, «фокусом» заманивает в пентаграмму — <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> закалывает его ритуальным кинжалом «во имя Асмодея» и забирает первую душу. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> открывает свой старый сейф (код 0-1-1-2-3-1-11-15): три золотые монеты и его шар для предсказаний; найдены зелье силы, тюбик масла, рабочая одежда."}, {"t": "0:36:40", "sec": 2200, "html": "<a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> насаживает рабочих на трезубец и забирает души; каждый ритуал бьёт по <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> — кристалл покрывается чёрной энергией, по венам руки течёт чёрная жидкость, кожа трескается. Спор о том, «отдал ли» Капучин трезубец рабочему, решается броском — Капучин получает 6 урона. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> добирает вторую душу."}, {"t": "0:43:10", "sec": 2590, "html": "Виктор ловит беглого рабочего крюком-кошкой; тот (назвался Эдер Грак) становится кучером. Виктор за минуту чинит и «тюнингует» лёгкую мусорную повозку."}, {"t": "0:47:28", "sec": 2848, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с Виктором телепортируются к лавке (кристалл наносит Пахому урон). Остальные уезжают на телеге от стражи; Дина обольщает кучера, тот сбрасывает хвост, долго целуется с ней (к поцелую присоединяется <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>)."}, {"t": "0:50:37", "sec": 3037, "html": "Лавка «Руки-Загребуки»: Виктор очаровывает эльфа Малика частушками; в жилой комнате — люк в подпольный склад оружия с двумя женщинами-громилами и пушкой под тканью. Цена пушки — 6 золотых."}, {"t": "0:55:58", "sec": 3358, "html": "Тем временем кучер отказывается подписать контракт; Гриша промахивается кислотой, Дина убивает его «страшным секретом» на ушко («Кеннеди убил <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>»), <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> забирает душу. Стража окружает «клоунов»-бесов: стражник возмущён — с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> договаривались, что бесов в этой части города не будет."}, {"t": "0:59:10", "sec": 3550, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> вместо оплаты вонзает Малику ножницы в руку; громилы избивают Виктора, Пахом телекинезом заваливает их оружием. Малик уходит через магическую дверь, склад начинает рушиться. Пушку телепортировать нельзя — герои уносят 4 бочонка пороха."}, {"t": "1:05:42", "sec": 3942, "html": "Бой со стражей: <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> играет на баяне (12 звукового урона всем), <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> огненным снарядом сжигает стражнику лицо, Дина раскручивает Гришу за хвост — критическая кислотная струя (84 урона) растворяет стражу."}, {"t": "1:09:05", "sec": 4145, "html": "Подготовка засады: порох рассыпан «пешеходным переходом», <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> ставит иллюзорный шлагбаум. <a class=\"ref\" href=\"/p/smirnov/\">Смирнов<\/a> уходит со съёмки — Виктор подписывает контракт и отдаёт душу, им начинает управлять <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>."}, {"t": "1:13:22", "sec": 4402, "html": "Вечером конвой (стальная повозка, латники) подъезжает; Дина «тупит», просит объехать и выигрывает в камень-ножницы-бумагу — конвой сворачивает к «шлагбауму» с Виктором-чучелом."}, {"t": "1:17:44", "sec": 4664, "html": "<a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> огненным снарядом поджигает порох: взрыв уничтожает стражу и тело Виктора; повозка лежит на боку, как саркофаг."}, {"t": "1:19:57", "sec": 4797, "html": "<a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> вскрывает замок — изнутри вырывается <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a>: изуродованное сшитое гвоздями существо в поварском колпаке с молотом и мясным крюком (похож на повара из дворца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>). <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> прикрывается силовым щитом и уговаривает его: «они заколдовали и меня»."}, {"t": "1:23:12", "sec": 4992, "html": "Дина душит монстра, <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> сковывает его дьявольскими путами (сила двух душ), <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> добивает фаерболом — <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a> сгорает."}, {"t": "1:26:30", "sec": 5190, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> хватает гигантский кристалл, все берутся за руки и телепортируются в безопасное место в лесу. Монет не осталось — 0 рублей; 10 000 руб. отправлены в благотворительный фонд."}], "key_events": [{"t": "0:05:25", "sec": 325}, {"t": "0:21:31", "sec": 1291}, {"t": "0:29:06", "sec": 1746}, {"t": "0:50:37", "sec": 3037}, {"t": "1:05:42", "sec": 3942}, {"t": "1:13:22", "sec": 4402}, {"t": "1:17:44", "sec": 4664}, {"t": "1:21:03", "sec": 4863}, {"t": "1:26:30", "sec": 5190}], "coins": {"ep": "17", "events": [{"t": "0:31:22", "kind": "loot", "who": "Медиум Пахом", "actor": "BRB", "to": null, "reason": "нашёл три золотые монеты в сейфе кабинета директора мастерской (внутриигровые деньги)", "result": null, "sec": 1882, "who_url": "/c/medium-pahom/", "reason_html": "нашёл три золотые монеты в сейфе кабинета директора мастерской (внутриигровые деньги)"}, {"t": "0:32:25", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "обыскали тело мёртвой девушки на ресепшене и нашли ещё одну золотую монету (внутриигровые деньги)", "result": null, "sec": 1945, "who_url": null, "reason_html": "обыскали тело мёртвой девушки на ресепшене и нашли ещё одну золотую монету (внутриигровые деньги)"}, {"t": "0:33:29", "kind": "earn", "who": "Бес Капучин", "actor": "Кукушкин", "to": null, "reason": "получил монету от мастера за отыгрыш: рисовал пентаграмму, оставаясь в облике ворона, не проговаривая действие вслух", "result": null, "sec": 2009, "who_url": "/c/bes-kapuchino/", "reason_html": "получил монету от мастера за отыгрыш: рисовал пентаграмму, оставаясь в облике ворона, не проговаривая действие вслух"}, {"t": "1:01:20", "kind": "spend", "who": "Медиум Пахом", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки телекинеза при магической атаке на громил (первый бросок 10 — недостаточно)", "result": null, "sec": 3680, "who_url": "/c/medium-pahom/", "reason_html": "потратил монету на переброс проверки телекинеза при магической атаке на громил (первый бросок 10 — недостаточно)"}, {"t": "1:06:51", "kind": "spend", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "потратил две монеты подряд на два переброса промаха Огненным снарядом по страже (первый бросок 11 — мимо)", "result": "второй переброс дал 16", "sec": 4011, "who_url": "/c/bes-misha/", "reason_html": "потратил две монеты подряд на два переброса промаха Огненным снарядом по страже (первый бросок 11 — мимо)"}, {"t": "1:13:22", "kind": "earn", "who": "Бес Капучин", "actor": "Кукушкин", "to": null, "reason": "получил монету за сюжетный твист — после гибели Виктора получил контроль над его телом (второе тело)", "result": null, "sec": 4402, "who_url": "/c/bes-kapuchino/", "reason_html": "получил монету за сюжетный твист — после гибели Виктора получил контроль над его телом (второе тело)"}, {"t": "1:16:36", "kind": "earn", "who": "Гном-матершинник Виктор", "actor": "Смирнов", "to": null, "reason": "получил монету за находчивость — после неудачной попытки уговорить стражу предложил им сыграть в камень-ножницы-бумагу", "result": null, "sec": 4596, "who_url": "/c/viktor/", "reason_html": "получил монету за находчивость — после неудачной попытки уговорить стражу предложил им сыграть в камень-ножницы-бумагу"}, {"t": "1:17:44", "kind": "other", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "хотели потратить монету на переброс попытки поджечь стражника, но монет уже не осталось", "result": null, "sec": 4664, "who_url": "/c/bes-misha/", "reason_html": "хотели потратить монету на переброс попытки поджечь стражника, но монет уже не осталось"}], "totals": [{"who": "Медиум Пахом", "actor": "BRB", "earned": 0, "spent": 1, "img": "img/chars/pahom.webp", "who_url": "/c/medium-pahom/", "actor_url": "/p/brb/"}, {"who": "Бес Миша", "actor": "Гудков", "earned": 0, "spent": 2, "img": "img/chars/misha.webp", "who_url": "/c/bes-misha/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Бес Капучин", "actor": "Кукушкин", "earned": 2, "spent": 0, "img": "img/chars/kapuchin.webp", "who_url": "/c/bes-kapuchino/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Дина Никитина", "actor": "Мягкова", "earne
