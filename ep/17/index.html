<script>window.EPD = {"anim": false, "key": "17", "label": "17", "title": "Демонизация", "date": "2023-04-13", "minutes": 89, "duration": 5326.0, "video_id": "QqgBzPfBkj0", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Геленбург: каретная мастерская Пахома, лавка «Руки-Загребуки», улицы у стройки «подземного вокзала»", "short_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> собирает беглых бесов, чтобы сорвать постройку нового адского портала в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>.", "summary_html": "После взрыва <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a> (вып. 10) в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> хлынули демоны, а лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> строит в центре города подземный «вокзал» — новый адский портал, для запуска которого не хватает гигантского кристалла телепортации. Мучимый совестью <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> собирает команду беглых бесов и гнома-матершинника, чтобы перехватить повозку с кристаллом. Герои отбивают бывшую каретную мастерскую Пахома, добывают порох у подпольного торговца оружием эльфа Малика, устраивают засаду с пороховой «зеброй» на перекрёстке, взрывают конвой и в бою убивают монстра-стража <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a>. <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> украден и унесён телепортом в лес, но кристалл в руке Пахома чернеет от ритуальных убийств, совершённых его союзниками.", "outcome_html": "<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> для адского портала похищен, вторая волна демонизации отсрочена. Гном Виктор погиб, кристалл <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> заражён тёмной энергией.", "world_html": ["Строительство Адского вокзала <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> лишено ключевого кристалла", "Гигантский кристалл спрятан в лесу у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>", "<a class=\"ref\" href=\"/a/kristall-teleportacii-pahoma/\">Кристалл телепортации Пахома<\/a> заражается тёмной энергией и вредит носителю", "В <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> демоны действуют открыто по договорённости со стражей"], "scenes": [{"t": "0:03:50", "sec": 230, "html": "Вступление: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с помощью кристалла сбежал из адского поезда, взорвал <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a> и невольно открыл портал в преисподнюю. Юбилейный «комнатный комикон»: игроки в костюмах персонажей прошлых выпусков."}, {"t": "0:06:10", "sec": 370, "html": "Завязка: <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>, демоны организованно подчиняются лорду <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a> и строят «подземный вокзал» для адских поездов — новый портал. Этой ночью на корабле привезут огромный кристалл телепортации и повезут на стройку; его надо выкрасть и вывезти из города (уничтожать в городе нельзя — взрыв)."}, {"t": "0:07:05", "sec": 425, "html": "Представление героев: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> (кристалл врос в руку и истощает его), беглые бесы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> (баянист) и <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> (клерк), демоница <a class=\"ref\" href=\"/c/dina-nikitina/\">Дина Никитина<\/a> с мёртвой собакой Гришей (писает кислотой), гном-матершинник Виктор со сборником «Тёщин язык». Механика: бесы забирают души (ритуальное убийство, за золотую монету или услугу по согласию); две души дают суперспособность."}, {"t": "0:13:45", "sec": 825, "html": "План <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>: перегородить широкую дорогу тяжёлой повозкой, загнать конвой в переулок и обстрелять. Нужны повозка (в бывшей каретной мастерской Пахома) и пушки/порох (по слухам — в лавке «Руки-Загребуки» эльфа Малика). Зазывала раздаёт флаеры со скидкой 50%."}, {"t": "0:16:27", "sec": 987, "html": "Телепорт кристаллом во двор мастерской. Бесы пугают рабочих, предлагая исполнить «любое желание». <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и Дина идут в контору: клиент-качок ломает себе палец, пытаясь оттолкнуть Пахома, и зовёт стражу; Дина насылает проклятие вшей — вши заживо съедают девушку за стойкой."}, {"t": "0:21:00", "sec": 1260, "html": "В кабинете новый хозяин мастерской — полуголый чемпион «по борьбе с голым торсом» (портрет «графа Ротана»). <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> бьёт его психической иглой, тот душит Пахома с прогиба; Пахом превращает алмаз в клинок и добивает его в затылок."}, {"t": "0:25:42", "sec": 1542, "html": "Во дворе Виктор спаивает рабочего спиртом, «фокусом» заманивает в пентаграмму — <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> закалывает его ритуальным кинжалом «во имя Асмодея» и забирает первую душу. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> открывает свой старый сейф (код 0-1-1-2-3-1-11-15): три золотые монеты и его шар для предсказаний; найдены зелье силы, тюбик масла, рабочая одежда."}, {"t": "0:36:25", "sec": 2185, "html": "<a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> насаживает рабочих на трезубец и забирает души; каждый ритуал бьёт по <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> — кристалл покрывается чёрной энергией, по венам руки течёт чёрная жидкость, кожа трескается. Спор о том, «отдал ли» Капучин трезубец рабочему, решается броском — Капучин получает 6 урона. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> добирает вторую душу."}, {"t": "0:43:47", "sec": 2627, "html": "Виктор ловит беглого рабочего крюком-кошкой; тот (назвался Эдар Граг) становится кучером. Виктор за минуту чинит и «тюнингует» лёгкую мусорную повозку."}, {"t": "0:46:50", "sec": 2810, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с Виктором телепортируются к лавке (кристалл наносит Пахому урон). Остальные уезжают на телеге от стражи; Дина обольщает кучера, тот сбрасывает хвост, долго целуется с ней (к поцелую присоединяется <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>)."}, {"t": "0:50:18", "sec": 3018, "html": "Лавка «Руки-Загребуки»: Виктор очаровывает эльфа Малика частушками; в жилой комнате — люк в подпольный склад оружия с двумя женщинами-громилами и пушкой под тканью. Цена пушки — 6 золотых."}, {"t": "0:55:38", "sec": 3338, "html": "Тем временем кучер отказывается подписать контракт; Гриша промахивается кислотой, Дина убивает его «страшным секретом» на ушко («Кеннеди убил <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>»), <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> забирает душу. Стража окружает «клоунов»-бесов: стражник возмущён — с <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> договаривались, что бесов в этой части города не будет."}, {"t": "1:00:16", "sec": 3616, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> вместо оплаты вонзает Малику ножницы в руку; громилы избивают Виктора, Пахом телекинезом заваливает их оружием. Малик уходит через магическую дверь, склад начинает рушиться. Пушку телепортировать нельзя — герои уносят 4 бочонка пороха."}, {"t": "1:05:48", "sec": 3948, "html": "Бой со стражей: <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> играет на баяне (12 звукового урона всем), <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> огненным снарядом сжигает стражнику лицо, Дина раскручивает Гришу за хвост — критическая кислотная струя (84 урона) растворяет стражу."}, {"t": "1:10:00", "sec": 4200, "html": "Подготовка засады: порох рассыпан «пешеходным переходом», <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> ставит иллюзорный шлагбаум. <a class=\"ref\" href=\"/p/smirnov/\">Смирнов<\/a> уходит со съёмки — Виктор подписывает контракт и отдаёт душу, им начинает управлять <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>."}, {"t": "1:13:05", "sec": 4385, "html": "Вечером конвой (стальная повозка, латники) подъезжает; Дина «тупит», просит объехать и выигрывает в камень-ножницы-бумагу — конвой сворачивает к «шлагбауму» с Виктором-чучелом."}, {"t": "1:18:35", "sec": 4715, "html": "<a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> огненным снарядом поджигает порох: взрыв уничтожает стражу и тело Виктора; повозка лежит на боку, как саркофаг."}, {"t": "1:20:36", "sec": 4836, "html": "<a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> вскрывает замок — изнутри вырывается <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a>: изуродованное сшитое гвоздями существо в поварском колпаке с молотом и мясным крюком (похож на повара из дворца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>). <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> прикрывается силовым щитом и уговаривает его: «они заколдовали и меня»."}, {"t": "1:23:18", "sec": 4998, "html": "Дина душит монстра, <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> сковывает его дьявольскими путами (сила двух душ), <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> добивает фаерболом — <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a> сгорает."}, {"t": "1:26:38", "sec": 5198, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> хватает гигантский кристалл, все берутся за руки и телепортируются в безопасное место в лесу. Монет не осталось — 0 рублей; 10 000 руб. отправлены в благотворительный фонд."}], "key_events": [{"t": "0:06:10", "sec": 370}, {"t": "0:21:00", "sec": 1260}, {"t": "0:29:18", "sec": 1758}, {"t": "0:50:18", "sec": 3018}, {"t": "1:05:48", "sec": 3948}, {"t": "1:13:05", "sec": 4385}, {"t": "1:18:35", "sec": 4715}, {"t": "1:20:50", "sec": 4850}, {"t": "1:26:38", "sec": 5198}], "coins": {"ep": "17", "events": [{"t": "0:31:34", "kind": "loot", "who": "Медиум Пахом", "actor": "BRB", "to": null, "reason": "нашёл три золотые монеты в сейфе кабинета директора мастерской (внутриигровые деньги)", "result": null, "sec": 1894, "who_url": "/c/medium-pahom/", "reason_html": "нашёл три золотые монеты в сейфе кабинета директора мастерской (внутриигровые деньги)"}, {"t": "0:32:38", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "обыскали тело мёртвой девушки на ресепшене и нашли ещё одну золотую монету (внутриигровые деньги)", "result": null, "sec": 1958, "who_url": null, "reason_html": "обыскали тело мёртвой девушки на ресепшене и нашли ещё одну золотую монету (внутриигровые деньги)"}, {"t": "0:34:19", "kind": "earn", "who": "Бес Капучин", "actor": "Кукушкин", "to": null, "reason": "получил монету от мастера за отыгрыш: рисовал пентаграмму, оставаясь в облике ворона, не проговаривая действие вслух", "result": null, "sec": 2059, "who_url": "/c/bes-kapuchino/", "reason_html": "получил монету от мастера за отыгрыш: рисовал пентаграмму, оставаясь в облике ворона, не проговаривая действие вслух"}, {"t": "1:02:05", "kind": "spend", "who": "Медиум Пахом", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки телекинеза при магической атаке на громил (первый бросок 10 — недостаточно)", "result": null, "sec": 3725, "who_url": "/c/medium-pahom/", "reason_html": "потратил монету на переброс проверки телекинеза при магической атаке на громил (первый бросок 10 — недостаточно)"}, {"t": "1:07:21", "kind": "spend", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "потратил две монеты подряд на два переброса промаха Огненным снарядом по страже (первый бросок 11 — мимо)", "result": "второй переброс дал 16", "sec": 4041, "who_url": "/c/bes-misha/", "reason_html": "потратил две монеты подряд на два переброса промаха Огненным снарядом по страже (первый бросок 11 — мимо)"}, {"t": "1:13:47", "kind": "earn", "who": "Бес Капучин", "actor": "Кукушкин", "to": null, "reason": "получил монету за сюжетный твист — после гибели Виктора получил контроль над его телом (второе тело)", "result": null, "sec": 4427, "who_url": "/c/bes-kapuchino/", "reason_html": "получил монету за сюжетный твист — после гибели Виктора получил контроль над его телом (второе тело)"}, {"t": "1:16:57", "kind": "earn", "who": "Гном-матершинник Виктор", "actor": "Смирнов", "to": null, "reason": "получил монету за находчивость — после неудачной попытки уговорить стражу предложил им сыграть в камень-ножницы-бумагу", "result": null, "sec": 4617, "who_url": "/c/viktor/", "reason_html": "получил монету за находчивость — после неудачной попытки уговорить стражу предложил им сыграть в камень-ножницы-бумагу"}, {"t": "1:18:20", "kind": "other", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "хотели потратить монету на переброс попытки поджечь стражника, но монет уже не осталось", "result": null, "sec": 4700, "who_url": "/c/bes-misha/", "reason_html": "хотели потратить монету на переброс попытки поджечь стражника, но монет уже не осталось"}], "totals": [{"who": "Медиум Пахом", "actor": "BRB", "earned": 0, "spent": 1, "img": "img/chars/pahom.webp", "who_url": "/c/medium-pahom/", "actor_url": "/p/brb/"}, {"who": "Бес Миша", "actor": "Гудков", "earned": 0, "spent": 2, "img": "img/chars/misha.webp", "who_url": "/c/bes-misha/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Бес Капучин", "actor": "Кукушкин", "earned": 2, "spent": 0, "img": "img/chars/kapuchin.webp", "who_url": "/c/bes-kapuchino/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Дина Никитина", "actor": "Мягкова", "earned": 0, "spent": 0, "img": "img/chars/dina-nikitina.webp", "who_url": "/c/dina-nikitina/", "actor_url": "/p/irina-myagkova/"}, {"who": "Гном-матершинник Виктор", "actor": "Смирнов", "earned": 1, "spent": 0, "img": "img/chars/viktor.webp", "who_url": "/c/viktor/", "actor_url": "/p/smirnov/"}], "notes": "Монеты встречаются и как игровая механика (перебросы у Пахома и Миши, награды за отыгрыш у Капучина и Виктора), и как внутриигровые деньги (золото в сейфе, на теле девушки, оплата пушки золотом по весу). Игру закончили без монет — благотворительный взнос по итогу 0 руб."}, "cast": [{"name": "Медиум Пахом", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": e": "Оазис Шиш Кебаб"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}]}], "links": [{"key": "06", "label": "6", "title": "Адский поезд", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> сбежал из адского поезда с кристаллом, бросив друзей", "dir": "out", "color": "#7C5CD6"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "Взрыв <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a> и открытие портала — первая волна демонизации", "dir": "out", "color": "#7C5CD6"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "Костюм Эльфа <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> и медведолюда Урса (ветвь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>)", "dir": "out", "color": "#C8423B"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "note_html": "Костюм гнома Кукан Яки (вампирская ветвь)", "dir": "out", "color": "#B03A7A"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> строит портал в ад", "dir": "back", "color": "#C8423B"}, {"key": "25", "label": "25", "title": "Остров соблазна", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл (Адского вокзала)", "dir": "back", "color": "#7C5CD6"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл Адского вокзала", "dir": "back", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Ветвь <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>, демонизация", "dir": "back", "color": "#7C5CD6"}, {"key": "33", "label": "33", "title": "Зверь Фест", "note_html": "Пиковая дама <a class=\"ref\" href=\"/c/dina-nikitina/\">Дина Никитина<\/a> (<a class=\"ref\" href=\"/p/irina-myagkova/\">Мягкова<\/a>)", "dir": "back", "color": "#B03A7A"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> и <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> помогли украсть кристалл телепортации Адского вокзала", "dir": "back", "color": "#C8423B"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/place/ad/\">Адский вокзал<\/a> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и кристалл", "dir": "back", "color": "#3E9A5E"}], "quotes_html": ["«<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, отнеси меня в портал!» — <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>", "«Так будет с каждым, кто будет бухать на рабочем месте» — гном Виктор над трупом рабочего", "«На самом деле Кеннеди убил <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>» — «страшный секрет» Дины <a class=\"ref\" href=\"/p/nikita-nikitin/\">Никитиной<\/a>", "«Смотри, я такой же, как ты — они тоже меня заколдовали» — <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> монстру <a class=\"ref\" href=\"/c/yudzhin/\">Юджину<\/a>"], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>: улицы, каретная мастерская <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> (с «толканом» и табличкой «У Пахома»), лавка «Руки-Загребуки», склад-подвал Малика, стройка «подземного вокзала» (адский портал).<\/li>\n<li>Лес — «безопасное место», куда унесён кристалл.<\/li>\n<li>Фракции: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> и подчинённые ему демоны; стража <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> (договорённость Властона о зонах для бесов); беглые бесы.<\/li>\n<li>Артефакты: кристалл телепортации <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> (вросший, чернеет от тёмной энергии ритуалов); гигантский кристалл для портала; шар для предсказаний Пахома; зелье силы; духи с цветочным запахом (обольщение); ритуальный кинжал, трезубец, баян; алмаз Пахома (превращается в оружие); сборник «Тёщин язык»; контракты на души.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>32<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>32<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>7<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>13<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>3<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>5<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa17-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуски 16 и 17 снимали в один день; почему ушли Смирняга и Гудков<\/b><\/div><p>«Демонизацию» и «Вампиров Мёртвых топей» сняли в один день, и из-за проблем со звуком начало задержалось на 4 часа. Игроки два с половиной часа считали в микрофоны, звукорежиссёры ездили за новыми арендованными колонками, а приключение пришлось начинать заново. Вся съёмка шла около 7 часов. Смирняга просидел на шесть часов дольше обещанного и ушёл во втором акте из трёх. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> тоже должен был улетать, но отменил рейс, чтобы не уходить посреди игры.<\/p><blockquote>«мы снимали оба этих выпуска в один день… задержка была 4 часа задержка начала мотора… выпуск «Демонизация» снимался первый»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-1\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=307\" target=\"_blank\" rel=\"noopener\">0:05:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa17-2\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Смирнягу зовут Лёша (Алексей) Смирнов<\/b><\/div><p>В подкасте игрока, сыгравшего гнома Виктора, называют «<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> <a class=\"ref\" href=\"/p/smirnov/\">Смирнов<\/a>» и «Лёха». В нашем конспекте и глоссарии он записан как «Антон Смирнов».<\/p><blockquote>«не обвиняйте, пожалуйста, Смирнягу, Лёшу Смирнова, что он куда-то торопился»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> В summaries/ep17.md и глоссарии исполнитель роли гнома Виктора указан как «Антон <a class=\"ref\" href=\"/p/smirnov/\">Смирнов<\/a> („Смирняга“)»; по подкасту — Алексей (<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>) Смирнов.<\/p><p class=\"note\"><a href=\"/pod/qa17/#qa17-2\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=369\" target=\"_blank\" rel=\"noopener\">0:06:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-4\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Юджин не был устойчив к огню<\/b><\/div><p><a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a> — не демон, а обычный человек, которого переделали в магическое существо: облили кислотой, сшили заново из той же плоти и вернули в тело душу. Поэтому сопротивления огню у него не было. Оно было бы у рождённого демона, беса или, скажем, тифлинга.<\/p><blockquote>«этого персонажа переделали из обычного человека в некое магическое существо, он не является демоном… не получил никаких сопротивлений»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa17/#qa17-4\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=854\" target=\"_blank\" rel=\"noopener\">0:14:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кристалл нужно было вывезти, а не уничтожить<\/b><\/div><p>Уничтожать гигантский кристалл телепортации задачей не было: его нужно было выкрасть и вывезти за пределы города, потому что взрывать его в городе нельзя. Что станет с кристаллом, решится в следующих приключениях. Реплику о вырезанной часовой сцене уничтожения кристалла, видимо, сказали в шутку.<\/p><blockquote>«задачи уничтожить кристалл не ставили, задача была выкрасть кристалл и вывезти его за пределы города»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-5\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=1233\" target=\"_blank\" rel=\"noopener\">0:20:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa17-6\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Демонизация» и «Вампиры Мёртвых топей» поменялись местами<\/b><\/div><p>«Демонизация» изначально стояла шестнадцатым выпуском, а вампирский — семнадцатым. Порядок поменяли, чтобы было время ещё раз пересмотреть сложную «Демонизацию» и привыкнуть к ней; смонтировали её в обычные сроки.<\/p><blockquote>«мы поменяли местами выходы этих выпусков: этот был шестнадцатый, стал семнадцатый, тот перешёл назад, с вампирами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-6\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2160\" target=\"_blank\" rel=\"noopener\">0:36:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa17-7\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Механика урона от кристалла Пахома<\/b><\/div><p><a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> телепортации сросся с рукой <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> и живёт с ним в симбиозе. Он работает на тёмной энергии, а Пахом добрый. Первая телепортация за день бесплатна, дальше урон растёт: d4, d6, d8, d10, d12, затем 2d12, 3d12, 4d12. Ещё Пахом получает урон, когда при нём совершают ритуальное убийство ради души. Сделка о душе по обоюдному согласию без убийства злом не считается.<\/p><blockquote>«первая телепортация за день бесплатная… дальше идёт прогрессивный накопительный эффект»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-7\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2393\" target=\"_blank\" rel=\"noopener\">0:39:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa17-8\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>За последнюю телепортацию урон Пахому не бросали<\/b><\/div><p>За финальную телепортацию с гигантским кристаллом <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> урона не получил: бросок просто не сделали. Перед этим Пахом вылечился тремя борщами до максимальных 19 хитов, а дальше разыграли кат-сцену. Авторы признали, что бросок пропустили, но убить Пахома он бы не мог.<\/p><blockquote>«последняя телепортация — да, мы по сути просто её не сделали… это был просто лишний бросок, лишняя математика»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-8\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2455\" target=\"_blank\" rel=\"noopener\">0:40:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-9\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB о Пахоме: обманщик, обиженный на налоги<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> назвал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> «крысятником» с особым навыком обмана, не слишком добрым по своей природе, и противопоставил его прямолинейному воину <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>. Мотив Пахома из выпуска 4: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> «закошмарил» налогами его каретную мастерскую, и он решил пробраться во дворец.<\/p><blockquote>«у Пахома в особых навыках обман… Пахом классный персонаж для крысятничества, и я этим пользуюсь»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa17/#qa17-9\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2740\" target=\"_blank\" rel=\"noopener\">0:45:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa17-10\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Знак адского вокзала — перевёрнутая «М» метро; у Бесагона была перечёркнутая V<\/b><\/div><p>Знак подземного вокзала в выпуске 17 — перевёрнутая буква «М» метро с рожками, ведь вокзал для адских поездов — пародия на метро. Зрители увидели в нём букву W. По той же причине в выпуске 12 Бесагон рисует на стене перечёркнутые клыки: в тестовой версии там была перечёркнутая буква V («вампиры»), и Шатохина долго уговаривали её убрать.<\/p><blockquote>«это просто перевёрнутый знак метро… в изначальной версии… у нас было там перечёркнутая буква V»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-10\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=3436\" target=\"_blank\" rel=\"noopener\">0:57:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa17-11\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Откуда берутся кристаллы телепортации<\/b><\/div><p><a class=\"ref\" href=\"/c/kristal/\">Кристаллы<\/a> телепортации бывают разного размера. Гигантский кристалл добыли в горных хребтах у <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>, в шахтах, где работали гномы, дварфы и каторжники. Это редкий и очень ценный материал вроде мифрила. Чтобы он заработал как телепорт, нужны особые магические манипуляции; подробности авторы пока не раскрывают.<\/p><blockquote>«место происхождения — горные хребты в районе Фогельнеста, шахты… это редкий материал по типу как мифрил»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-11\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=3845\" target=\"_blank\" rel=\"noopener\">1:04:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-12\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Откуда Пахом знал повара Властона<\/b><\/div><p>Готовясь проникнуть во дворец <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (выпуск 4), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> изучал персонал. К тому же повар лорда — знаменитость с несколькими ресторанами в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. По правилам шоу то, что видит или слышит один герой, знают и остальные, если мастер не скажет обратного.<\/p><blockquote>«он готовился, изучал сотрудников, персонал дворца… повар именитый, лорда все его знают, у него несколько ресторанов в Геленбурге»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-12\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=3964\" target=\"_blank\" rel=\"noopener\">1:06:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-14\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему на складе Малика дело дошло до насилия<\/b><\/div><p>Пушка стоила 6 золотых, а монет у героев не было. Про флаер со скидкой 50%, который им совали за пять минут до этого, все забыли и решили вопрос силой. Мирным путём с Маликом можно было договориться.<\/p><blockquote>«он говорит, шесть золотых за пушку, у вас флаеры, флаер 50%… вы просто забыли видимо про флаер»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-14\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=4433\" target=\"_blank\" rel=\"noopener\">1:13:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-15\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мусорная повозка была заложена в сюжет<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> выбрал мусорную телегу, думая о лёгкой и быстрой повозке для бегства, но мусорную повозку авторы заложили в сюжет намеренно. Стражники брезгуют её трогать, поэтому <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> получил преимущество на обман, когда вывалил мусор. Офицер конвоя презирал «мусорщиков», но, проиграв в камень-ножницы-бумагу, честно поехал в объезд — навстречу засаде.<\/p><blockquote>«по факту это то, что мы закладывали в сюжет: если вы берёте мусорную телегу, то стражники… её не трогают»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-15\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=4585\" target=\"_blank\" rel=\"noopener\">1:16:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa17-16\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Что ждало героев на «подземном вокзале»<\/b><\/div><p>Локацию стройки адского вокзала показали на общем плане: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>, рельсы, портал. Авторы опасались, что <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> потянет группу туда. Там были толпы демонов, которые запрягли бы героев работать, а при отказе всех перебили бы, и шоу закончилось бы сразу.<\/p><blockquote>«там куча демонов, которые бы запрягли их работать, они бы отказались работать, их бы всех порешали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-16\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=4688\" target=\"_blank\" rel=\"noopener\">1:18:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-19\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Бросок Миши на подрыв пороха был формальностью<\/b><\/div><p>У порохового «перехода» класс брони был 5, поэтому огненный снаряд Миши попадал почти гарантированно. Бросок оставили ради драмы.<\/p><blockquote>«класс брони пять по правилам… бросок был исключительно такой, для драмы»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-19\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=5760\" target=\"_blank\" rel=\"noopener\">1:36:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-21\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Мастер не подыгрывает: Юджин оказался слишком лёгким, а в «Кайфе» все погибли честно<\/b><\/div><p>Мастер не подстраивает бои в пользу игроков. Финальный босс выпуска 17, у которого было около 35–40 хитов, оказался слишком простым: солдаты погибли при взрыве, весь урон пришёлся на него, и игрокам повезло с бросками. В выпуске 7 все герои погибли в честном бою. <a class=\"ref\" href=\"/c/zhanuariya/\">Паучиху<\/a> можно было одолеть командной игрой: выманивать и убивать членов семьи по одному, баланс это позволял.<\/p><blockquote>«финальный босс в семнадцатом выпуске оказался типа слишком простым… в таверне вы все сдохли, потому что вы не работали в команде»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-21\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=5820\" target=\"_blank\" rel=\"noopener\">1:37:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-24\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Откуда у Пахома лачуга в лесу<\/b><\/div><p><a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> владел каретной мастерской и вполне мог когда-то построить себе лачугу в лесу. Такая заявка игрока не требует броска и не вызывает вопросов у мастера.<\/p><blockquote>«Пахом — владелец каретной мастерской, неужели у него не было когда-то денег себе лачугу в лесу построить»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-24\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6359\" target=\"_blank\" rel=\"noopener\">1:45:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa17-26\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Демоны были сильными намеренно; дальше убийства не сойдут с рук<\/b><\/div><p>Демонов сделали сильными намеренно: им нужно было собирать души ради спецспособностей. Контракты заключать не получалось, поэтому они убивали слабых, а мощным оказался лишь финальный противник. Авторы пообещали, что в следующих приключениях будет сложнее и убивать без последствий не выйдет.<\/p><blockquote>«в следующих приключениях, короче, будет сложно и нельзя будет убивать просто так»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-26\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6509\" target=\"_blank\" rel=\"noopener\">1:48:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa17-28\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Мастер выругался за стражника нарочно<\/b><\/div><p>Впервые в шоу мастер выругался матом за NPC-стражника, и это было сделано специально. Резкая грубость должна была показать, что стражник — серьёзная угроза, а не проходной персонаж.<\/p><blockquote>«в рамках персонажа я должен был сказать какую-то мощную грубость, чтобы… не относились к этому персонажу как к чему-то проходному»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa17/#qa17-28\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6786\" target=\"_blank\" rel=\"noopener\">1:53:06 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa17-30\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Куда может телепортироваться Пахом<\/b><\/div><p><a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> может переноситься туда, где уже бывал (например, во дворец <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>), но должен назвать место назначения. Найти там самого Властона это не гарантирует.<\/p><blockquote>«он может переместиться во дворец, где он был, но не факт, что там находится Властон»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-30\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=7058\" target=\"_blank\" rel=\"noopener\">1:57:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa17-31\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Ошибка мастера: удар Юджина должен был попасть по Пахому<\/b><\/div><p>В финальном бою <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a> выбросил 16 на атаку. Броня <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> была 11 плюс 5 от силового щита, то есть ровно 16, а при равенстве попадание засчитывается атакующему. Удар должен был пройти, но мастер этого не заметил; авторы обнаружили ляп только на монтаже. Скорее всего, Пахома бы это не убило: союзники могли бы его подлечить.<\/p><blockquote>«у него выпало 16, у Пахома броня 11, и он воспользовался щитом, который добавлял 5 к броне… атака всегда в приоритете»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-31\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=7075\" target=\"_blank\" rel=\"noopener\">1:57:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa-sRvWxLpc8RE-6\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Бес Капучин ради контракта готов на всё, кроме смерти<\/b><\/div><p>На вопрос, на что готов бес <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a> ради контракта, <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> ответил: практически на всё, кроме того, чтобы лишиться жизни.<\/p><blockquote>«Капучин ради контракта… практически на всё, кроме того, чтобы лишиться жизни»<\/blockquote><p class=\"note\">Кукушкин · <a href=\"/pod/qa-sRvWxLpc8RE/#qa-sRvWxLpc8RE-6\">Никита Кукушкин отвечает на вопросы<\/a> · <a href=\"https://youtu.be/sRvWxLpc8RE?t=1538\" target=\"_blank\" rel=\"noopener\">0:25:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa21-18\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Говорящий ворон — бес-перевёртыш, подталкивавший Ларису к убийству<\/b><\/div><p>Ворон не намекал, что <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> надо оставить в живых, а наоборот, давил на мстительность <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> и призывал её убить лорда. Это был бес-перевёртыш. Любой мелкий бес (как <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> или <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>) умеет превращаться в ворона, паука и т. п. Таких бесов тысячи, и вороны служат дьяволу чем-то вроде камер наблюдения, которые к тому же могут действовать. Убей <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> ворона, тот принял бы истинный облик беса.<\/p><blockquote>«ворон — это бес-перевёртыш… у любого беса мелкого есть способность превращаться в ворона, в паука ещё во что-то»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep21b.md: говорящий ворон описан как «возможно, агент адских сил». Авторы подтвердили, что это бес-перевёртыш, слуга дьявола.<\/p><p class=\"note\"><a href=\"/pod/qa21/#qa21-18\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=1985\" target=\"_blank\" rel=\"noopener\">0:33:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa22-15\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Дододиса можно было убить у входа и забрать маску<\/b><\/div><p>Другой вариант — сразу атаковать <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> у входа: при обычном бое он сбежал бы, как эльф Малик через магическую дверь в выпуске 17, но внезапной атакой его можно было убить, пройти мимо Али и забрать маску — уникальный артефакт для волшебников с высоким интеллектом, со своей волей, как <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>.<\/p><blockquote>«забираешь маску, и у тебя есть маска — уникальный магический артефакт для волшебников с высоким интеллектом, со своей какой-то волей, как щит Чёрного Властелина»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-15\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=4980\" target=\"_blank\" rel=\"noopener\">1:23:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-21\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Космология ПЧК: земной мир между адом и небесами<\/b><\/div><p>Авторы показали схему вселенной: посередине земной мир, под ним адский мир, над ним небесный. Вокруг ходит адский поезд. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> питается любовью и энергией живущих людей, и попасть туда — привилегия немногих. Большинство грешны и попадают в ад, а ад питается душами: умерших, проданных по контрактам или отнятых ритуальными убийствами, как это делали бесы <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> и <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>.<\/p><blockquote>«мир небесный питается энергией живущих людей… А ад питается душами попавших людей, либо контрактами, или забранными, как Миша и Капучин делали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-21\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=3445\" target=\"_blank\" rel=\"noopener\">0:57:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-27\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Динь-Динь — не первый, кто вернулся из ада<\/b><\/div><p>До Динь-Диня из ада возвращались дед Али в #22 и, как напомнил зритель, повар <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a>. Отличие в том, что Али всегда был NPC, а <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>, бывший персонаж игрока, стал NPC только в этом приключении.<\/p><blockquote>«не только Динь-Динь у нас появлялся, Али, насколько вы можете это вспомнить, в приключении под номером 22»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-27\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=4966\" target=\"_blank\" rel=\"noopener\">1:22:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa33-10\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Вампирбек не мог призвать Пиковую даму без её карты<\/b><\/div><p>Авторы признали, что мастер подыграл игрокам. Призвать Дину <a class=\"ref\" href=\"/p/nikita-nikitin/\">Никитину<\/a> можно только с зеркалом и картой пиковой дамы, а карты у <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> не было. Сцену оставили, потому что персонаж был в опасности, а шутки получились удачными. У Дины целая колода пиковых дам, которые она раздаёт как визитки тем, кто может её вызвать.<\/p><blockquote>«вызывать Дину Никитину пиковую даму можно только, если у тебя есть карта пиковой дамы... Но мастер пошёл, мы все вместе пошли навстречу, подыграли игрокам»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-10\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=3959\" target=\"_blank\" rel=\"noopener\">1:05:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa33-11\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дина Никитина — уникальная демоница<\/b><\/div><p>На вопрос, одна ли такая пиковая дама, ответили, что <a class=\"ref\" href=\"/c/dina-nikitina/\">Дина Никитина<\/a>, судя по всему, единственная — это уникальный персонаж. В других ветках её можно призвать как NPC, но только по правилам: с зеркалом и её картой.<\/p><blockquote>«Она демоница. И, судя по всему, она, я бы сказал, да, что она одна. Уникальный персонаж.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa33/#qa33-11\">Подкаст по #33<\/a> · <a href=\"https://youtu.be/bRRVr7jN2fA?t=4079\" target=\"_blank\" rel=\"noopener\">1:07:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/33/\" title=\"Зверь Фест\">#33<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-10\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Три способа беса получить душу<\/b><\/div><p>Авторы напомнили механику, заявленную ещё в #17: бес получает душу через ритуальное убийство кинжалом на пентаграмме во имя Асмодея, выкупает её за деньги (душа переходит к бесу после смерти) или оказывает услугу либо служит человеку какое-то время, например десять лет. <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> с <a class=\"ref\" href=\"/c/dzhuna/\">Джуной<\/a> воспользовался последним способом.<\/p><blockquote>«Либо ты становишься её слугой на короткий промежуток времени, например, на 10 лет.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-10\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4310\" target=\"_blank\" rel=\"noopener\">1:11:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa35-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB мог догадаться о двойной игре Миши<\/b><\/div><p>Авторы считают, что у <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> были основания заподозрить Мишу: в #17 и в этом выпуске бес представлялся любителем земных наслаждений, который уже предавал ад и своё начальство. Если бы <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> просто ударил <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> кинжалом при всех, мастер не дал бы ему умереть от одного удара и потом не разрешил бы ретроспективную заявку.<\/p><blockquote>«он уже предавал ад и предавал своих... боссов по иерархии. И Биг Рашен Босс об этом знал.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-11\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=4531\" target=\"_blank\" rel=\"noopener\">1:15:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-14\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Телепортацию к патрону придумали ещё для #17<\/b><\/div><p>Механику, по которой хозяин контракта может мгновенно вызвать к себе беса, придумали ещё к #17, но там она не пригодилась: <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> и так постоянно телепортировался. Мастер хотел через неё издеваться над бесами: например, бомж с контрактом выдёргивал бы <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучина<\/a> посреди важного действия. В #35 её впервые использовали в сюжете.<\/p><blockquote>«На самом деле мы это придумали еще для 17 выпуска, нам просто не удалось это никаким образом использовать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-14\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=5353\" target=\"_blank\" rel=\"noopener\">1:29:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa35-20\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Миша служит Асмодею, а Асмодей стоит над Тёмным Властелином<\/b><\/div><p><a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> приносит жертвы во имя Асмодея — своего патрона. Асмодей не наказывает его за «предательство» ада, значит, поступки Миши его устраивают. Асмодей — «серый кардинал»: он начальник и Миши, и Тёмного Властелина, хотя позиционирует себя как приятель Тёмного Властелина.<\/p><blockquote>«Асмадей там есть такой теневой кардинал серый... он босс Тёмного Властелина в том числе.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-20\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=7085\" target=\"_blank\" rel=\"noopener\">1:58:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><\/section>", "chars": {"Дина Никитина": {"name": "Дина Никитина", "img": "img/chars/dina-nikitina.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%B8%D0%BD%D0%B0_%D0%9D%D0%B8%D0%BA%D0%B8%D1%82%D0%B8%D0%BD%D0%B0", "summary": "Ди́на Ники́тина — демоница в обличии Пиковой дамы из третьего круга ада.", "infobox": {"Пол": "Женский", "Раса": "Демон", "Тип": "Игровой", "Игрок": "Ирина Мягкова"}, "actors": ["Ирина Мягкова"], "kind": "pc", "dead":
