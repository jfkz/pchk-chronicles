против нечисти; в субтитрах «меч Бесагона»); серебряная катана Блэта; зелья невидимости и ускорения; перстень-ключ Цецы от лаборатории; кровавые, разговорные и пугающие грибы Нины; журнал «Playwolf» с Цецей; схемы скрещивания вампиров и оборотней; письмо Адриана Вурдаласку; взрывчатка на корабле «Багровый закат»; одноразка с пеплом Вампира Бека.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>43<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>43<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>10<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>13<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>9<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>10<\/small><\/button><\/div><article class=\"pnote t-correction\" id=\"qa16-26\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Болотную тварь звали Нина, не Тина<\/b><\/div><p>Зрители спорили, как зовут болотную тварь — Нина или Тина. В статблоке монстра она записана как Нина; ведущие лишь пошутили, что «Тина» подошло бы болотной твари больше. Канон — Нина (в выпуске 26 её играет <a class=\"ref\" href=\"/p/lena-kukoyaka/\">Лена Кукояка<\/a>).<\/p><blockquote>«Нина, Тина… как ты думаешь, надо было её назвать Нина или Тина?»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep16.md (раздел «Кратко») чудовище названо «Тиной»; правильно — Нина, как в разделе «Персонажи» того же конспекта.<\/p><p class=\"note\"><a href=\"/pod/qa16/#qa16-26\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5337\" target=\"_blank\" rel=\"noopener\">1:28:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa20-3\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен<\/b><\/div><p><a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> вернулся за стол вампирской саги в выпуске, снятом накануне, но любовную линию с болотной тварью решили пока не развивать ради более важного сюжетного решения. Болотная тварь в будущем появится — исполнительницу ещё выбирали.<\/p><blockquote>«мы решили не развивать, не трогать сейчас историю его и болотной твари любовную, потому что у нас было более важное сюжетное решение»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-3\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=343\" target=\"_blank\" rel=\"noopener\">0:05:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-21\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Как придумали Луку, Мирамистину и роль для Позова<\/b><\/div><p>Изначально в 20-м выпуске должен был играть <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукояка<\/a>, а <a class=\"ref\" href=\"/p/dmitriy-pozov/\">Позову<\/a> хотели дать болотную тварь. Кукояка заболел, и без него это потеряло смысл; тогда придумали ведьму для <a class=\"ref\" href=\"/p/viktoriya-skladchikova/\">Виктории Складчиковой<\/a>, связали её с Антоном общим ребёнком-подростком, и в последнюю очередь поняли, что подростком будет Позов. На роль болотной твари (Нины) также рассматривали Бабича и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>.<\/p><blockquote>«у нас должен был быть Кукояка в этом выпуске, и мы хотели Позову дать болотную тварь»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-21\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2216\" target=\"_blank\" rel=\"noopener\">0:36:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa22-3\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Задумка персонажа для Варнавы — вампирша Бьянка Сосунеску<\/b><\/div><p>На просьбу <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнавы<\/a> сыграть «ужасно плохого», обольстительного и безжалостного персонажа авторы предложили бывшую жену графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a>: они ненавидели друг друга; в отличие от старомодного Влада, для которого люди — скот, она современнее и «толерантнее», за новые веяния, но очень жёсткая. Позже Варнава сыграла её в выпуске 26.<\/p><blockquote>«Бьянка Сосунеску… она бывшая жена графа Влада Сосунеску, им был Кукушкин, и они его грохнули»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-3\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1916\" target=\"_blank\" rel=\"noopener\">0:31:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa25-6\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Посох паутины для выпуска 26 — эскизы художницы<\/b><\/div><p>Художница Маша Брагина нарисовала шесть вариантов посоха, накладывающего заклинание паутины, — артефакта выпуска 26. Зрителям предложили выбрать вариант, хотя, возможно, авторы уже выбрали сами.<\/p><blockquote>«посох паутины для следующего двадцать шестого выпуска, у нас есть артефакт»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-6\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1083\" target=\"_blank\" rel=\"noopener\">0:18:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-4\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Смерть Вампирбека не планировалась<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сказал, что смерть <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> не была задумана. В тот день у него ничего не получалось, кубики не шли, и он решил, что лучше погибнуть ярко, чем «серо». Шутку о том, что персонажа «слили» из-за сложной в производстве фигурки, всерьёз принимать не стоит.<\/p><blockquote>«Не хотел, не убивал БРБ. Так тупо случилось... Лучше так умереть.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa26/#qa26-4\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=1893\" target=\"_blank\" rel=\"noopener\">0:31:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b><\/div><p>Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске 16 он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске 20 «Вампирское возмездие».<\/p><blockquote>«вместе с энергетическим вампиром по имени Адольф они сожгли графа Сосунеску, и Вампирбек, возможно, чувствуя некую вину за содеянное»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-5\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-6\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Следующий вампирский выпуск — 28, без BRB<\/b><\/div><p>Авторы подтвердили, что следующий выпуск вампирской ветки — 28-й. Его играли <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>, <a class=\"ref\" href=\"/p/anton-shastun/\">Антон Шастун<\/a>, <a class=\"ref\" href=\"/p/arseniy-popov/\">Арсений Попов<\/a> и <a class=\"ref\" href=\"/p/dmitriy-pozov/\">Дмитрий Позов<\/a>, без <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, потому что <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> мёртв.<\/p><blockquote>«следующий выпуск вампирской ветки — это двадцать восьмой»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-6\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2123\" target=\"_blank\" rel=\"noopener\">0:35:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Бьянка не поставила огненную стену сразу<\/b><\/div><p>Авторы ожидали, что <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> войдёт первой и спалит обоих членов Совета стеной огня. Но <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a> и <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> берегли очки крови (стена стоила 4 очка): они думали, что после двух советников появится третий, ещё сильнее. Поэтому первым зашёл <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и поджёг себя маслом для бороды.<\/p><blockquote>«мы с Катей рассчитывали её в финале применить... мы думали, что после того, как этих двух стеной, появится ещё и третий»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa26/#qa26-7\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2245\" target=\"_blank\" rel=\"noopener\">0:37:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-8\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему герои ликовали после смерти Вампирбека<\/b><\/div><p>Аплодисменты после гибели <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> относились к концу приключения: игроки радовались, что миссия выполнена и не надо плыть на корабль. В монтаже смерть и объявление победы оказались почти в одной склейке.<\/p><blockquote>«Мы, кстати, аплодировали, что мне не нужно дальше ехать на корабль и ещё дальше продолжать приключение»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa26/#qa26-8\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2555\" target=\"_blank\" rel=\"noopener\">0:42:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-9\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Вырезанный акт: бой на «Багровом закате» с Адрианом Вурдаласку<\/b><\/div><p>По сценарию третий член Совета был на фабрике. Если бы герои быстро дошли до лаборатории, они получили бы записку вовремя и успели бы перехватить третьего вампира в промышленном порту рядом с фабрикой. Там их ждал бой на корабле «Багровый закат» с этим вампиром, фамильярами и моряками, чтобы предотвратить отправку взрывчатки. Игра шла слишком долго, и акт вырезали: корабль считается отчалившим.<\/p><blockquote>«Вы бы нашли корабль «Багровый закат». Вам бы предстояло нападение, где бы вы встретили третьего вампира и фамильяров различных моряков»<\/blockquote><p class=\"note\">автор Селезнёв · <a href=\"/pod/qa26/#qa26-9\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2711\" target=\"_blank\" rel=\"noopener\">0:45:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-10\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Моторы растянулись до 6–9 часов; 28-й сняли за один мотор<\/b><\/div><p>Выпуск 26 сняли в первом моторе съёмочного пула, и это был один из самых долгих моторов. С 26-го по 30-й выпуски игры шли не меньше шести, а то и девяти часов. Выпуск 28, наоборот, сняли за один мотор.<\/p><blockquote>«начиная с двадцать шестого, двадцать седьмого, двадцать восьмого, двадцать девятого и тридцатого... меньше шести нет уже»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-10\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=2774\" target=\"_blank\" rel=\"noopener\">0:46:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Раунд внезапности спас отряд от гибридов<\/b><\/div><p>Героев выручило то, что они тихо забрали у Цецы перстень, без шума вошли в лабораторию и убили вампиров за один ход в раунде внезапности. Иначе советники выпустили бы гибридов, и те, скорее всего, убили бы отряд.<\/p><blockquote>«если бы вы не убили вампиров за один свой ход, они бы вызволили гибридов, а гибриды, скорее всего, убили бы вас»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-12\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=3162\" target=\"_blank\" rel=\"noopener\">0:52:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-13\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Прах Вампирбека: авторы обязаны рассмотреть воскрешение<\/b><\/div><p>Авторский принцип — не воскрешать погибших персонажей, если герои сами ничего для этого не делают. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (вместе с пеплом волка и Юры) в солевую одноразку, поэтому авторы обязаны рассмотреть его использование, и шанс воскрешения есть. Для сравнения привели <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>: после выпуска 10 никто не пытался раскопать его останки в руинах <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a>.<\/p><blockquote>«ты собрал этот прах, и в любом случае мы, как авторы, обязаны будем рассмотреть вариант использовать этот прах»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-13\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=3259\" target=\"_blank\" rel=\"noopener\">0:54:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-14\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Как попадают в Совет высших вампиров<\/b><\/div><p>В Совет попадают по чистоте крови и возрасту: вампир с чистой кровью, проживший 300–400 лет, уже претендует на место из-за своей силы. Древнейших старейшин, заставших аналог Египта, сейчас нет. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a>, возможно, вошла в Совет лишь как жена <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>.<\/p><blockquote>«если у вас чистая кровь, если вы живёте больше 300–400 лет, вы уже претендуете на место в высшем совете»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa26/#qa26-14\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=3908\" target=\"_blank\" rel=\"noopener\">1:05:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-15\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Дан Балан и Бьянка: влечение есть<\/b><\/div><p>На вопрос, сблизятся ли <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что старик Дан Балан всё ещё полон страсти и предпочитает молоденьких. Это обыграли в рекламном интро выпуска 26 со сценой в гробу.<\/p><blockquote>«Дан Балан, он хоть и старик, но в нём сексуальная кровь кипит»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa26/#qa26-15\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4015\" target=\"_blank\" rel=\"noopener\">1:06:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-16\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему «добрые» вампиры выпили ассенизатора<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что у <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> было меньше всех очков крови и ради миссии он был готов выпить прохожего, тем более что тот хотел избить родственника. Авторы сравнили клан Балан с судьёй Дреддом: они сами вершат уличное правосудие без суда. За юмором сцены стоит страшная по сути ситуация.<\/p><blockquote>«приравнивает клан Балан, в частности Вампирбека, Дан Балана, к некому судье Дредду»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-16\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4113\" target=\"_blank\" rel=\"noopener\">1:08:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-17\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём<\/b><\/div><p>Высшие вампиры не собираются уничтожать людей. Они хотят превратить человечество в фабрику-ферму без королей и мэров. Днём править они не могут, поэтому выводят гибридов дампиров и оборотней: эти союзники выносят солнце и будут держать власть днём.<\/p><blockquote>«Вампиры не хотят уничтожить человечество. Вампиры хотят всё человечество превратить в фабрику.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-17\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4339\" target=\"_blank\" rel=\"noopener\">1:12:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-18\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Маскарад и Шабаш: клан Балан против доминирования Совета<\/b><\/div><p>Мастер описал два мировоззрения вампиров. «Маскарад» живёт среди людей под маской: так живёт клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (охранник, рикша). «Шабаш» открыто считает людей кормовой базой. В Совете много фракций со своими интригами, но в целом он стоит за господство над людьми, а клан Балан — за прежнюю жизнь в тени, где он «супергерой города».<\/p><blockquote>«Маскарад всегда притворяется, что живёт среди людей... А Шабаш говорит: «Здравствуйте, мы вампиры... Вы у нас кормовая база»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa26/#qa26-18\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4468\" target=\"_blank\" rel=\"noopener\">1:14:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-19\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Имена членов Совета придумал Бреганов на ходу<\/b><\/div><p>Один из авторов, заполняя список Совета, попросил мастера быстро накидать вампирских имён. Бреганов тут же выдал: <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a>, литовец <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, болгары Боен Гробов и <a class=\"ref\" href=\"/c/osin-kolov/\">Осин Колов<\/a>. В запасе остались Алек Газманго и Корнелия Газманго.<\/p><blockquote>«Саня, нам нужны вампирские имена, типа Адриан Вурдаласку... Давай, жги»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep26.md (список Совета, 0:11:02) имена даны по автосубтитрам: «Осен Колов», «Баян Гробов», «Чиприан Чесноческу». Канон по глоссарию: <a class=\"ref\" href=\"/c/osin-kolov/\">Осин Колов<\/a>, Боен Гробов, Чиприян Чесноческу. Ещё один член Совета — литовец <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>.<\/p><p class=\"note\"><a href=\"/pod/qa26/#qa26-19\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4532\" target=\"_blank\" rel=\"noopener\">1:15:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Как устроена кровяная фабрика: карусель, пастеризация, бутилированная кровь<\/b><\/div><p>Фабрика пародирует молочный комбинат и птицефабрику. Людей по номерам выводят из коровника на карусель, подключают к венам трубки, потом возвращают обратно. Кровь проходит через охладитель и загуститель и разливается по сосудам. Пастеризация и консервирование крови — технологическая революция в мире ПЧК: обычно вампиры пьют только свежую кровь живых существ. Таких фабрик немного; оставшуюся бутилированную кровь можно будет найти в будущих приключениях.<\/p><blockquote>«это технология консервирования крови... это революция, технологическая революция в мире вот этого фэнтези нашего»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-20\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4676\" target=\"_blank\" rel=\"noopener\">1:17:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Непосещённая кухня: отработанных людей перемалывали со свёклой<\/b><\/div><p>Герои не побывали в двух помещениях фабрики: на складе готовой продукции и на «кухне». На кухню через зону разгрузки привозили свёклу, и там людей, отслуживших свой срок как доноры, перемалывали вместе с ней в корм для остальных пленников.<\/p><blockquote>«людей, которые отслужили свой срок, вместе с этой свёклой перемалывали, собственно, в корм»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-21\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4815\" target=\"_blank\" rel=\"noopener\">1:20:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-22\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином<\/b><\/div><p>Клан Балан против войны: в ней будут гибнуть люди. Высшие вампиры вряд ли пьют демонов, ведь у тех в жилах ихор, а не кровь. План Совета — взять всю власть в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a>, убить короля и гвардию. Если придёт <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, договориться с ним и поделить людей: вампирам — кровь, дьяволам — души и энергия.<\/p><blockquote>«они, скорее всего, заключат с ним сделку о том, чтобы сосуществовать и делить людей»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa26/#qa26-22\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=4985\" target=\"_blank\" rel=\"noopener\">1:23:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Входы на фабрику: четыре пути, вентиляция нарисована не там<\/b><\/div><p>У фабрики было несколько входов: главный, ворота отгрузки (сразу к Цеце и красному цеху), канализация (на неё указывал ассенизатор) и вентиляция. Вентиляционный блок задумали на крыше, увидеть его можно было, только взлетев: он вёл прямо в коровник. На иллюстрации вентиляцию по ошибке нарисовали сбоку.<\/p><blockquote>«вентиляционный блок задумывался на крыше, который бы вы не могли увидеть с земли, а могли увидеть, взлетев»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-23\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=5115\" target=\"_blank\" rel=\"noopener\">1:25:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-24\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему крысы смогли убить Дан Балана<\/b><\/div><p>Это были не обычные крысы, а три гигантские, «как корабельные». Тоннель был их территорией, и они защищали его до последнего.<\/p><blockquote>«крысы были гигантские... их было три. Они защищали своё место»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-24\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=5187\" target=\"_blank\" rel=\"noopener\">1:26:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-25\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву<\/b><\/div><p>Сначала на роль болотной твари авторы хотели позвать Артура Бабича, затем Илью <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, а в итоге позвали Лену, жену <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a>, чтобы сыграла настоящая супружеская пара. Изначально болотная тварь была просто монстром, которого надо было убить в сцене с сиротками, но <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> выбрал любовь.<\/p><blockquote>«мы хотели Артура Бабича позвать... Потом мы хотели дать болотную тварь Соболеву»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-25\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=5255\" target=\"_blank\" rel=\"noopener\">1:27:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-26\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Съели ли Кукан Яка и Нина Бебича — ответ в будущих выпусках<\/b><\/div><p>Авторы знают, съели ли <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и его семья Бебича, но не раскрыли: зрителям предложили гадать, а правильный ответ обещали когда-нибудь показать.<\/p><blockquote>«Я знаю ответ на этот вопрос... А правильный ответ мы когда-нибудь узнаем в следующих сериях»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-26\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=5920\" target=\"_blank\" rel=\"noopener\">1:38:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-27\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Вампирбек не мог спастись и чем ему могли помочь<\/b><\/div><p><a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> истратил весь ход: полное перемещение, бонусное действие на поджог масла и две атаки, которые мастер ему разрешил. Превратиться в мышь он уже не мог, оставались только реакция и спасбросок. Нины в комнате не было. Если бы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> или Нина сделали хоть что-то, дающее преимущество (например, корни Нины), Вампирбек мог бы выжить или его удалось бы стабилизировать.<\/p><blockquote>«Если бы кто-то из ходящих вслед за ним, Кукан Яка или Лена, совершили хоть что-то, что дало бы ему преимущество, возможно бы, Вампирбек остался жив»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-27\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=5982\" target=\"_blank\" rel=\"noopener\">1:39:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-28\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Записка Адриана уцелела в огне ради сюжета<\/b><\/div><p>Авторы признали, что записка нужна была, чтобы продвинуть героев по сюжету и показать, что третьего вампира на фабрике нет. В шутку объяснили, почему она не сгорела: лежала в алмазной шкатулке Гнилоша, которая упала и раскрылась.<\/p><blockquote>«записка задумывалась как способ продвинуть наших персонажей по сюжету»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-28\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=6136\" target=\"_blank\" rel=\"noopener\">1:42:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa26-29\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Гибриды были сильнее высших вампиров и питались через трубки<\/b><\/div><p>Гибриды из резервуаров были чудовищно сильны, сильнее высших вампиров: боевые «танки» ближнего боя. Бой с ними строился как головоломка, вроде боя с личом или с Прохором фон де Лизом в выпуске 15: убить их почти невозможно, пока не поймёшь, что они питаются через трубки, и не отключишь их.<\/p><blockquote>«Они сильнее, чем высшие вампиры были, потому что они боевые танки в ближнем бою»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-29\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=6286\" target=\"_blank\" rel=\"noopener\">1:44:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa26-30\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Очки Блэта были просто аксессуаром<\/b><\/div><p>Тёмные очки Блэта были декоративными. Если бы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> надел их и отнёсся к ним как к ценности, авторы могли бы на ходу сделать их артефактом: очками видения сквозь стены (как у <a class=\"ref\" href=\"/c/adelaida/\">Иделаиды<\/a> в выпуске 12) или видения невидимого.<\/p><blockquote>«Очки были просто декоративные. Это был аксессуар Блэта просто для красоты.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-30\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=6557\" target=\"_blank\" rel=\"noopener\">1:49:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-31\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Блэта и Цецу можно было переманить<\/b><\/div><p>Договориться можно было с обоими, но социальные проверки субъективны: нужно было задеть то, что волнует персонажа. <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a>, гордая своей революцией в пастеризации крови, любила свою работу на производстве. Убеждению помогли бы преимущество за знание прошлых событий и разговоры о славе клана.<\/p><blockquote>«Вы всегда можете договориться... Ей нравится работать здесь на производстве. Они совершили революцию, научились пастеризовать эту кровь»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-31\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=6621\" target=\"_blank\" rel=\"noopener\">1:50:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa26-32\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Тело Цецы не сожгли — её можно вернуть<\/b><\/div><p>Авторы подчеркнули, что Цецу не сожгли, её тело осталось лежать, а развеян был пепел Блэта. Поэтому есть возможность её вернуть, хотя это не обещано. Цецу художница Аня нарисовала похожей на жену Шатохина Юлю.<\/p><blockquote>«Не факт, что вернётся, но есть возможность её вернуть»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep26.md <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> погибла от роя саранчи («Погибла (саранча)»). По словам авторов, её тело не сожгли и её можно вернуть: смерть не окончательная.<\/p><p class=\"note\"><a href=\"/pod/qa26/#qa26-32\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=6767\" target=\"_blank\" rel=\"noopener\">1:52:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-33\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Солевая одноразка родилась из шутки в выпуске 20<\/b><\/div><p>Одноразку авторы положили в инвентарь Луки «<a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>» в выпуске 20 как шутку. Когда Лука погиб на корабле, она выпала у него из кармана, стала мемом, и в итоге в неё собрали прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы призвали игроков «оставлять следы»: например, фонарный столб Кукан Яки из выпуска 16 может ещё всплыть.<\/p><blockquote>«А у тебя из кармана выпадает солевая одноразка... И в эту солевую одноразку, опять же, это мем, туда помещают в итоге Вампирбека»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa26/#qa26-33\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=7319\" target=\"_blank\" rel=\"noopener\">2:01:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa26-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Идею собрать прах подсказала вырезанная сцена с пеплом Блэта<\/b><\/div><p>Когда отряд подошёл к лаборатории без ключа, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> бегал назад за перстнем. Там трое работников собирали пепел своих хозяев, а он разогнал их и раздул прах. По мнению авторов, это засело у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> в подкорке, и в финале <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>.<\/p><blockquote>«трое работников в белых костюмах пытаются собрать пепел своих бывших хозяев»<\/blockquote><p class=\"note\"><a href=\"/pod/qa26/#qa26-34\">Подкаст по #26<\/a> · <a href=\"https://youtu.be/leurb6i-MaA?t=7369\" target=\"_blank\" rel=\"noopener\">2:02:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa27-26\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>36<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуски 26 и 27 сняли в один день<\/b><\/div><p>Авторы рассказали, что гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (выпуск 26) и <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> (выпуск 27) снимали в один день, «на одном моторе».<\/p><blockquote>«В двадцать шестом погиб Вампирбек, в двадцать седьмом погиб Пахом, и это было всё на одном моторе, в один день.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-26\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6450\" target=\"_blank\" rel=\"noopener\">1:47:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>37<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуск 28 сняли за один мотор и заранее протестировали<\/b><\/div><p>Авторы рассказали, что приключение 28 было полностью готово: сценарий, карты, Бреганов выспался и всё прочитал. В отличие от 26 и 27, которые не успели проверить, его заранее прогнали на тестовой игре в офисной переговорке. Сняли его за один мотор и уже потом разделили на две части.<\/p><blockquote>«Двадцать восьмое приключение тестировалось вот здесь, в комнате, которая находится за этим телевизором… мы её называем переговорка.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-1\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=145\" target=\"_blank\" rel=\"noopener\">0:02:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">#28a<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa28-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>38<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Воскрешение Вампирбека стало возможным только благодаря действиям игроков<\/b><\/div><p>Авторы по-прежнему считают воскрешение плохой идеей, но здесь его заслужили. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам, без указаний, собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> в солевую одноразку (выпуск 26) и записал в карточку, что воспользуется любым шансом его воскресить. Тогда авторы сделали из этого испытание: игроки должны были узнать об умных автоматонах, догадаться положить в робота одноразку с биоматериалом и за минуту обезвредить самоуничтожение.<\/p><blockquote>«Воскрешение должно быть заслужено… только если герои могут сами с этим справиться, сами дойти до этой мысли.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-4\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=1140\" target=\"_blank\" rel=\"noopener\">0:19:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa28-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>39<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b><\/div><p>Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво.<\/p><blockquote>«Семеро живы, пять мертвы, семь плюс пять — двенадцать, ребята.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa28/#qa28-28\">Подкаст по #28<\/a> · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa32-24\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>40<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Как вампиры оказались в плену у дракона<\/b><\/div><p>Если бы в #28 дирижабль не остановили, взрывчатку опустили бы в жерло мимо дракона и взорвали дистанционно. Потеряв дирижабль, вампиры повезли взрывчатку (упущенную ещё в #26) кораблём, а затем на телеге через заброшенный город и разбудили дракона. Он взял их в заложники, и они договорились: вампиры добывают ему ценный артефакт (маску), а дракон взрывает для них вулкан и отпускает с миром.<\/p><blockquote>«Они добудут для него ценный артефакт, который ему нужен, а взамен дракон взорвёт для них вулкан и отпустит с миром»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-24\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=7737\" target=\"_blank\" rel=\"noopener\">2:08:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-14\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>41<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ловушка пробуждения: игроки обошли её, не заметив<\/b><\/div><p>Ержана можно разбудить любым способом, но после долгого сна он просыпается в гневе, нападает на всех и мгновенно высосал бы Егора. Успокоить его можно было только жертвами, например у фабрики крови из выпуска 26. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> разбудила его медальоном, а женщины из рода Хадисы обладают способностью его успокаивать, поэтому ловушка не сработала.<\/p><blockquote>«Все из рода вот этой Динары, Хадиса и прочие женщины-потомки, только они могут его успокаивать.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-14\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2955\" target=\"_blank\" rel=\"noopener\">0:49:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>42<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b><\/div><p>Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги.<\/p><blockquote>«Было легко прятать от инквизиторов какую-то фабрику, учитывая, что он был главой тайной канцелярии.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-31\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>43<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b><\/div><p>Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку.<\/p><blockquote>«мы не раз использовали персонажей, которые у нас были заявлены в выпусках как NPC, потом мы отдавали их игрокам»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-5\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><\/section>", "chars": {"Дан Балан": {"name": "Дан Балан", "img": "img/chars/dan-balan.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%B0%D0%BD_%D0%91%D0%B0%D0%BB%D0%B0%D0%BD", "summary": "Дан Бала́н — старый вампир из Мёртвых топей, патриарх вампирского клана Балан, ночной охранник круглосуточной алкогольной лавки «
