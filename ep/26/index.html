<script>window.EPD = {"anim": false, "key": "26", "label": "26", "title": "Четвёртая Фабрика", "date": "2024-04-22", "minutes": 115, "duration": 6878.0, "video_id": "XQecjEcXqS0", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Кёнигпон, промышленный остров на юго-западе столицы: «Четвёртая фабрика» (вампирское логово под видом молочного завода)", "short_html": "Клан Балан с освобождённой <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянкой Сосунеску<\/a> штурмует «Четвёртую фабрику», где собираются члены Совета высших вампиров. Под видом молочного завода там устроена кровяная ферма: людей доят на карусели и ставят опыты по выведению гибридов по образцу Кукан Яки. Отряд убивает управляющую Цецу, охотника-полукровку Блэда и двух членов Совета — <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилоша Диковича<\/a> и Юру; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> гибнет в огненной стене Бьянки. В пепле находят письмо Адриана Вурдолаку о плане разбудить вулкан, закрыть солнце пеплом и убить короля.", "summary_html": "После убийства графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> Совет высших вампиров охотится на клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>. Клан освободил из заточения вдову графа <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a> и теперь бьёт в ответ: ночью на промышленном острове <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>, на молочной «Четвёртой фабрике», должны собраться трое членов Совета. Внутри оказывается вампирская кровяная ферма: людей держат в клетках, «доят» на карусели и ставят опыты по выведению гибридов вампира и оборотня по образцу Кукан Яки. Отряд убивает управляющую Цецу, наёмника-гибрида Блэда и двух членов Совета, <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилоша Диковича<\/a> и Юру из Четвёртой фабрики. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сгорает в огненной стене Бьянки. Найденное письмо раскрывает план третьего советника, Адриана Вурдолаку: разбудить древний вулкан взрывчаткой, закрыть солнце пеплом и вырезать короля.", "outcome_html": "Двое членов Совета убиты, кровяная ферма уничтожена, пленники освобождены; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб. Адриан Вурдолаку готовит извержение вулкана и переворот.", "world_html": ["Гибель членов Совета <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилоша Диковича<\/a> и Юры", "Уничтожена кровяная ферма и лаборатория гибридов Совета", "Раскрыт план Адриана Вурдолаку: разбудить вулкан у <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>, закрыть солнце и убить короля", "Совет высших вампиров готов открыть столицу Тёмному Властелину"], "scenes": [{"t": "≈0:02", "sec": 156, "html": "Пролог: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> утром прощается с молодой любовницей и отшивает её. Этой ночью клан идёт на Совет в его собственном логове, и все могут погибнуть."}, {"t": "≈0:07", "sec": 469, "html": "Предыстория от мастера: клан Балан убил графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Сосунеску<\/a>, Совет объявил на них охоту, клан освободил вдову Влада, могущественную <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a>. Задача — проникнуть на фабрику (молочное производство как прикрытие) и уничтожить троих членов Совета."}, {"t": "≈0:13", "sec": 782, "html": "Герои представляются. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> говорит, что в столице все ждут «пришествия Тёмного Властелина», а Совет откроет ему ворота; девиз клана — «защищать добрых, выпивать до дна злодеев». <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> теперь гибрид. К нему приехала болотная жена Нина, оставившая двоих детей сестре. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> рассказывает, что Влад в сговоре с Советом вогнал ей кол во сне и она веками лежала в гробу среди культистов."}, {"t": "≈0:18", "sec": 1094, "html": "Правила очков крови. Список Совета у <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки<\/a>: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, Димитр Упыряну и Флориан Наклыкану мертвы. Живы Адриан Вурдолаку, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a>, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, Осен Колов, Баян Гробов, Чиприан Чесноческу и Юра из Четвёртой фабрики (многие имена искажены автосубтитрами)."}, {"t": "≈0:23", "sec": 1407, "html": "На проходной охранник не пускает повозку Вампира Бека. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> пытается внушить ему мысль, но он пугается красных глаз и прячется."}, {"t": "≈0:28", "sec": 1720, "html": "Пьяный ассенизатор просит подвезти. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> выпивают его над люком (<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> до этого пнул его за оскорбление Нины). Отряд спускается в канализацию. Нину, чтобы она пролезла в люк, мажут слюной и гелем для волос."}, {"t": "≈0:33", "sec": 2032, "html": "В тоннеле крысы загрызают <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> до смерти. Нина прячет его тело себе в рот, выплёвывает крыс, и отряд давит их, проталкивая Нину вперёд. Наверху виден «божественный свет», но это дыра туалета."}, {"t": "≈0:39", "sec": 2345, "html": "Герои вылезают в туалет фабрики. Там находят журнал «Playwolf» с разворотом, перерисованным в вампиршу Цецу: рабочие фанатеют от своей управляющей. Нина оживляет <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> кровавым грибом. В раздевалке берут белые комбинезоны, золотую монету и посох паутины, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> снимает с петель дверь и носит её с собой."}, {"t": "≈0:44", "sec": 2657, "html": "Разнорабочего Торна <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> допрашивает и убивает. Нина заставляет его труп ответить на три вопроса «грибным разговором»: <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> — вампирша, управляющая производством, в красном цехе (западное крыло); фабрикой управляет <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (восточное крыло)."}, {"t": "≈0:49", "sec": 2970, "html": "В душевой отряд встречает пленника. Людей держат в «коровнике» в клетках, кормят кровавым фаршем со свёклой и водят на «дойку», где кровь выкачивают на карусели."}, {"t": "≈0:54", "sec": 3283, "html": "В коровнике охранник не верит «сотрудникам» в комбинезонах. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> в облике летучей мыши крадёт ключ, но попадается, и начинается бой. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, намазавшись кремом для рук, проскальзывает к клеткам. Нина опутывает охрану лозами, Бьянка спрыгивает с потолка на рабочих, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> добивают стражу. Охранник свистит в свисток, который слышат только оборотни."}, {"t": "≈0:59", "sec": 3595, "html": "С потолка появляется Блэд — темнокожий полукровка в тёмных очках, с серебряной катаной, пародия на Блейда. Кунаями он убивает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> метит Блэда мочой, и все его атаки теперь с помехой. Нина швыряет гриб испуга, Блэд в ужасе бежит, а пленники идут за Ниной. Дан Балана воскрешают, выжав ему в рот кровь двух рабочих."}, {"t": "≈1:05", "sec": 3908, "html": "В красном цехе на карусели выкачивают кровь, на конвейере её охлаждают, сгущают и разливают по сосудам. Управляющая <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> — брюнетка в роговых очках, в одежде из крашеной человеческой кожи, на пальце перстень-ключ от лаборатории. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, знаменитость среди вампиров, раздевается ради переговоров, выкрадывает губами перстень и погибает от катаны Блэда."}, {"t": "≈1:10", "sec": 4221, "html": "Нина «целует» мёртвого мужа, забирает у него изо рта перстень и оживляет его кровавым грибом, а <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> притворяется мёртвым. <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> зовёт <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a> одну к старейшинам. Под грибом правды она признаётся, что хотела отделить Бьянку и убить её руками старейшин, и называет лабораторию: в ней <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> и Юра."}, {"t": "≈1:15", "sec": 4533, "html": "Бой: Нина кидает Цецу в Блэда на потолке, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> выпускает изо рта рой саранчи, и <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> погибает. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> критическим ударом меча испепеляет Блэда. Трофеи: зелья невидимости и ускорения, серебряная катана. Отряд лечится кровью из шлангов карусели."}, {"t": "≈1:20", "sec": 4846, "html": "У лаборатории в клетке сидит отмытый пленник, «подготовленный к опытам». Совет высасывает людей досуха и искусственно выводит армию полукровок-дампиров."}, {"t": "≈1:25", "sec": 5158, "html": "В лаборатории стоят клетка с оборотнем-волком и два резервуара с гибридами. Лаборанты молча уходят. На столах лежат схемы скрещивания оборотня с вампиром и оживления вампирского семени по образцу Кукан Яки, «прародителя гибридов». <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> по праву альфы подчиняет волка."}, {"t": "≈1:31", "sec": 5471, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> под зельем невидимости поджигает гроб Юры (коробка вина и огненный меч). <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> бросает в Гнилоша масло для бороды, получает критический провал и поджигает себя. Волк не смог его вытащить."}, {"t": "≈1:36", "sec": 5784, "html": "<a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> решает пожертвовать товарищем и ставит огненную стену: 46 урона по вампирам. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> проваливает спасбросок и сгорает («Главное — деду за руль не пускайте»). Вместе с ним гибнут волк и Юра из Четвёртой фабрики."}, {"t": "≈1:41", "sec": 6096, "html": "Обгоревший Гнилош ковыляет к резервуарам с гибридами, но Нина садится на него и раздавливает. Трубки питания гибридов перерубают катаной."}, {"t": "≈1:46", "sec": 6409, "html": "В пепле находят записку Адриана Вурдолаку «брату». <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставил взрывчатку в порт, «Багровый закат» отчалил к <a class=\"ref\" href=\"/place/nergal/\">Нергалу<\/a>. Адриан хочет сам сбросить взрывчатку в жерло древнего вулкана: когда пепел закроет солнце, надо резать короля и гвардию."}, {"t": "≈1:52", "sec": 6722, "html": "Пепел Вампира Бека, перемешанный с пеплом волка и Юры, собирают в одноразку, чтобы когда-нибудь воскресить. ПТС на повозку сгорел вместе с ним. Эпилог: «Твоя жизнь стала ценой за смерть двух членов вампирского совета»."}], "key_events": [{"t": "0:05:22", "sec": 322}, {"t": "0:23:33", "sec": 1413}, {"t": "0:47:10", "sec": 2830}, {"t": "1:05:34", "sec": 3934}, {"t": "1:17:13", "sec": 4633}, {"t": "1:26:30", "sec": 5190}, {"t": "1:37:08", "sec": 5828}, {"t": "1:46:50", "sec": 6410}, {"t": "1:48:58", "sec": 6538}, {"t": "1:51:25", "sec": 6685}], "coins": {"ep": "26", "events": [{"t": "0:36:26", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Остроумно разгадал по улике (испачканный журнал), что у вампиров нет отражения, поэтому для журнала они используют образ перерисованной оборотницы.", "result": null, "sec": 2186, "who_url": "/c/vampir-bek/", "reason_html": "Остроумно разгадал по улике (испачканный журнал), что у вампиров нет отражения, поэтому для журнала они используют образ перерисованной оборотницы."}, {"t": "0:37:06", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Успешно осмотрел шкафчики сотрудников фабрики (проверка внимания).", "result": null, "sec": 2226, "who_url": "/c/vampir-bek/", "reason_html": "Успешно осмотрел шкафчики сотрудников фабрики (проверка внимания)."}, {"t": "0:37:25", "kind": "loot", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "В шкафчике сотрудника нашёл золотую монету и посох паутины.", "result": null, "sec": 2245, "who_url": "/c/vampir-bek/", "reason_html": "В шкафчике сотрудника нашёл золотую монету и посох паутины."}, {"t": "0:43:45", "kind": "spend", "who": "Нина", "actor": "Лена Кукояка", "to": null, "reason": "Потратили монету на дополнительный (четвёртый) вопрос к мёртвому телу через её способность «грибной разговор».", "result": null, "sec": 2625, "who_url": "/c/nina/", "reason_html": "Потратили монету на дополнительный (четвёртый) вопрос к мёртвому телу через её способность «грибной разговор»."}, {"t": "1:11:41", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Монета за комично неверную попытку истолковать жесты обессиленного пленника на карусели («мы максимально тупые»).", "result": null, "sec": 4301, "who_url": null, "reason_html": "Монета за комично неверную попытку истолковать жесты обессиленного пленника на карусели («мы максимально тупые»)."}, {"t": "1:20:24", "kind": "earn", "who": "Нина", "actor": "Лена Кукояка", "to": null, "reason": "Отвлекла и поцеловала мужа вампирши Цецы, вытащила у него изо рта кольцо и незаметно подложила кровавый гриб.", "result": "Проверка ловкости/убеждения прошла успешно.", "sec": 4824, "who_url": "/c/nina/", "reason_html": "Отвлекла и поцеловала мужа вампирши Цецы, вытащила у него изо рта кольцо и незаметно подложила кровавый гриб."}, {"t": "1:33:07", "kind": "earn", "who": "Кукан Яка", "actor": "Денис Кукояка", "to": null, "reason": "Выяснил у пленника и охранника детали плана по созданию гибридов-дампиров (скрещивание оборотней и вампиров).", "result": null, "sec": 5587, "who_url": "/c/kukanyaka/", "reason_html": "Выяснил у пленника и охранника детали плана по созданию гибридов-дампиров (скрещивание оборотней и вампиров)."}, {"t": "1:36:31", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Потратил монету на переброс проверки убеждения (харизма) волка-оборотня, называя себя «сверхсуществом».", "result": null, "sec": 5791, "who_url": "/c/vampir-bek/", "reason_html": "Потратил монету на переброс проверки убеждения (харизма) волка-оборотня, называя себя «сверхсуществом»."}, {"t": "1:41:42", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Потратил две монеты подряд на переброс атак горючим маслом для бороды по Гнилышу Диковичу.", "result": "Оба раза неудача — Вампирбек в итоге поджёг сам себя.", "sec": 6102, "who_url": "/c/vampir-bek/", "reason_html": "Потратил две монеты подряд на переброс атак горючим маслом для бороды по Гнилышу Диковичу."}, {"t": "1:43:30", "kind": "spend", "who": "Бьянка Сосунеску", "actor": "Екатерина Варнава", "to": null, "reason": "Потратила монеты (переброс и два дополнительных кубика) на попытку волка-альфы вытащить горящего Вампербека из огня.", "result": "Волк не справился — Вампирбек и волк сгорели заживо.", "sec": 6210, "who_url": "/c/byanka-sosunesku/", "reason_html": "Потратила монеты (переброс и два дополнительных кубика) на попытку волка-альфы вытащить горящего Вампербека из огня."}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 2, "spent": 3, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}, {"who": "Нина", "actor": "Лена Кукояка", "earned": 1, "spent": 1, "img": "img/chars/nina.webp", "who_url": "/c/nina/", "actor_url": "/p/lena-kukoyaka/"}, {"who": "Кукан Яка", "actor": "Денис Кукояка", "earned": 1, "spent": 0, "img": "img/chars/kukan-yaka.webp", "who_url": "/c/kukanyaka/", "actor_url": "/p/denis-kukoyaka/"}, {"who": "Бьянка Сосунеску", "actor": "Екатерина Варнава", "earned": 0, "spent": 2, "img": "img/chars/b-yanka-sosunesku.webp", "who_url": "/c/byanka-sosunesku/", "actor_url": "/p/ekaterina-varnava/"}], "notes": "В начале выпуска светящееся пятнышко на потолке ошибочно приняли за монету — это оказался источник света, не игровое событие (0:27:03). В конце выпуска — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие. Выпуск заканчивается гибелью Вампира Бека (Вампербека) в огне."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, глава клана", "role": "", "fate": "выжил (дважды погибал и был возвращён кровью)", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "вампир, извозчик", "role": "", "fate": "погиб — сгорел в огненной стене Бьянки", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {
