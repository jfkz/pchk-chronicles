<script>window.EPD = {"anim": false, "key": "26", "label": "26", "title": "Четвёртая фабрика", "date": "2024-04-22", "minutes": 115, "duration": 6878.0, "video_id": "XQecjEcXqS0", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Кёнигпон, промышленный остров на юго-западе столицы: «Четвёртая фабрика» (вампирское логово под видом молочного завода)", "short_html": "Клан Балан штурмует «Четвёртую фабрику», где собирается Совет высших вампиров.", "summary_html": "После убийства графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> Совет высших вампиров охотится на клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>. Клан освободил из заточения вдову графа <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a> и теперь бьёт в ответ: ночью на промышленном острове <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпона<\/a>, на молочной «Четвёртой фабрике», должны собраться трое членов Совета. Внутри оказывается вампирская кровяная ферма: людей держат в клетках, «доят» на карусели и ставят опыты по выведению гибридов вампира и оборотня по образцу Кукан Яки. Отряд убивает управляющую Цецу, наёмника-гибрида Блэта и двух членов Совета, <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилоша Диковича<\/a> и Юру из Четвёртой фабрики. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сгорает в огненной стене Бьянки. Найденное письмо раскрывает план третьего советника, Адриана Вурдаласку: разбудить древний вулкан взрывчаткой, закрыть солнце пеплом и вырезать короля.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции\">42<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b> Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-31\">к записи<\/a><\/span><\/span>", "outcome_html": "Двое членов Совета убиты, кровяная ферма уничтожена, пленники освобождены; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб. Адриан Вурдаласку готовит извержение вулкана и переворот.", "world_html": ["Гибель членов Совета <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилоша Диковича<\/a> и Юры", "Уничтожена кровяная ферма и лаборатория гибридов Совета<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём<\/b> Высшие вампиры не собираются уничтожать людей. Они хотят превратить человечество в фабрику-ферму без королей и мэров. Днём править они не могут, поэтому выводят гибридов дампиров и оборотней: эти союзники выносят солнце и будут держать власть днём. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4339\" target=\"_blank\" rel=\"noopener\">1:12:19 ↗<\/a> · <a href=\"#qa26-17\">к записи<\/a><\/span><\/span>", "Раскрыт план Адриана Вурдаласку: разбудить вулкан у <a class=\"ref\" href=\"/place/nergal/\">Нергала<\/a>, закрыть солнце и убить короля<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Как вампиры оказались в плену у дракона\">40<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Как вампиры оказались в плену у дракона<\/b> Если бы в #28 дирижабль не остановили, взрывчатку опустили бы в жерло мимо дракона и взорвали дистанционно. Потеряв дирижабль, вампиры повезли взрывчатку (упущенную ещё в #26) кораблём, а затем на телеге через заброшенный город и разбудили дракона. Он взял их в заложники, и они договорились: вампиры добывают ему ценный артефакт (маску), а дракон взрывает для них вулкан и отпускает с миром. <span class=\"note\">Подкаст по #32 · <a href=\"https://youtu.be/SdpeDKQeFQM?t=7737\" target=\"_blank\" rel=\"noopener\">2:08:57 ↗<\/a> · <a href=\"#qa32-24\">к записи<\/a><\/span><\/span>", "Совет высших вампиров готов открыть столицу Тёмному Властелину<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином\">23<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином<\/b> Клан Балан против войны: в ней будут гибнуть люди. Высшие вампиры вряд ли пьют демонов, ведь у тех в жилах ихор, а не кровь. План Совета — взять всю власть в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a>, убить короля и гвардию. Если придёт <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, договориться с ним и поделить людей: вампирам — кровь, дьяволам — души и энергия. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4985\" target=\"_blank\" rel=\"noopener\">1:23:05 ↗<\/a> · <a href=\"#qa26-22\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "≈0:02", "sec": 156, "html": "Пролог: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> утром прощается с молодой любовницей и отшивает её. Этой ночью клан идёт на Совет в его собственном логове, и все могут погибнуть.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дан Балан и Бьянка: влечение есть\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дан Балан и Бьянка: влечение есть<\/b> На вопрос, сблизятся ли <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что старик Дан Балан всё ещё полон страсти и предпочитает молоденьких. Это обыграли в рекламном интро выпуска 26 со сценой в гробу. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4015\" target=\"_blank\" rel=\"noopener\">1:06:55 ↗<\/a> · <a href=\"#qa26-15\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:07", "sec": 469, "html": "Предыстория от мастера: клан Балан убил графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Сосунеску<\/a>, Совет объявил на них охоту, клан освободил вдову Влада, могущественную <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a>. Задача — проникнуть на фабрику (молочное производство как прикрытие) и уничтожить троих членов Совета."}, {"t": "≈0:13", "sec": 782, "html": "Герои представляются. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> говорит, что в столице все ждут «пришествия Тёмного Властелина», а Совет откроет ему ворота; девиз клана — «защищать добрых, выпивать до дна злодеев». <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> теперь гибрид. К нему приехала болотная жена Нина, оставившая двоих детей сестре. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> рассказывает, что Влад в сговоре с Советом вогнал ей кол во сне и она веками лежала в гробу среди культистов.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен<\/b> <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> вернулся за стол вампирской саги в выпуске, снятом накануне, но любовную линию с болотной тварью решили пока не развивать ради более важного сюжетного решения. Болотная тварь в будущем появится — исполнительницу ещё выбирали. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=343\" target=\"_blank\" rel=\"noopener\">0:05:43 ↗<\/a> · <a href=\"#qa20-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Маскарад и Шабаш: клан Балан против доминирования Совета\">19<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Маскарад и Шабаш: клан Балан против доминирования Совета<\/b> Мастер описал два мировоззрения вампиров. «Маскарад» живёт среди людей под маской: так живёт клан <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (охранник, рикша). «Шабаш» открыто считает людей кормовой базой. В Совете много фракций со своими интригами, но в целом он стоит за господство над людьми, а клан Балан — за прежнюю жизнь в тени, где он «супергерой города». <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4468\" target=\"_blank\" rel=\"noopener\">1:14:28 ↗<\/a> · <a href=\"#qa26-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином\">23<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином<\/b> Клан Балан против войны: в ней будут гибнуть люди. Высшие вампиры вряд ли пьют демонов, ведь у тех в жилах ихор, а не кровь. План Совета — взять всю власть в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a>, убить короля и гвардию. Если придёт <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, договориться с ним и поделить людей: вампирам — кровь, дьяволам — души и энергия. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4985\" target=\"_blank\" rel=\"noopener\">1:23:05 ↗<\/a> · <a href=\"#qa26-22\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:18", "sec": 1094, "html": "Правила очков крови. Список Совета у <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки<\/a>: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, Димитр Упыряну и Флореан Наклыкану мертвы. Живы Адриан Вурдаласку, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a>, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, Осен Колов, Баян Гробов, Чиприан Чесноческу и Юра из Четвёртой фабрики (многие имена искажены автосубтитрами).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Как попадают в Совет высших вампиров\">15<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Как попадают в Совет высших вампиров<\/b> В Совет попадают по чистоте крови и возрасту: вампир с чистой кровью, проживший 300–400 лет, уже претендует на место из-за своей силы. Древнейших старейшин, заставших аналог Египта, сейчас нет. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a>, возможно, вошла в Совет лишь как жена <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=3908\" target=\"_blank\" rel=\"noopener\">1:05:08 ↗<\/a> · <a href=\"#qa26-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Имена членов Совета придумал Бреганов на ходу\">20<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Имена членов Совета придумал Бреганов на ходу<\/b> Один из авторов, заполняя список Совета, попросил мастера быстро накидать вампирских имён. Бреганов тут же выдал: <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a>, литовец <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, болгары Боен Гробов и <a class=\"ref\" href=\"/c/osin-kolov/\">Осин Колов<\/a>. В запасе остались Алек Газманго и Корнелия Газманго. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep26.md (список Совета, 0:11:02) имена даны по автосубтитрам: «Осен Колов», «Баян Гробов», «Чиприан Чесноческу». Канон по глоссарию: <a class=\"ref\" href=\"/c/osin-kolov/\">Осин Колов<\/a>, Боен Гробов, Чиприян Чесноческу. Ещё один член Совета — литовец <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>.<\/span> <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4532\" target=\"_blank\" rel=\"noopener\">1:15:32 ↗<\/a> · <a href=\"#qa26-19\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Состав Высшего вампирского совета: 12 членов, пятеро мертвы\">39<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b> Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 ↗<\/a> · <a href=\"#qa28-28\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:23", "sec": 1407, "html": "На проходной охранник не пускает повозку Вампира Бека. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> пытается внушить ему мысль, но он пугается красных глаз и прячется."}, {"t": "≈0:28", "sec": 1720, "html": "Пьяный ассенизатор просит подвезти. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> выпивают его над люком (<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> до этого пнул его за оскорбление Нины). Отряд спускается в канализацию. Нину, чтобы она пролезла в люк, мажут слюной и гелем для волос.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему «добрые» вампиры выпили ассенизатора\">17<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему «добрые» вампиры выпили ассенизатора<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> объяснил, что у <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> было меньше всех очков крови и ради миссии он был готов выпить прохожего, тем более что тот хотел избить родственника. Авторы сравнили клан Балан с судьёй Дреддом: они сами вершат уличное правосудие без суда. За юмором сцены стоит страшная по сути ситуация. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4113\" target=\"_blank\" rel=\"noopener\">1:08:33 ↗<\/a> · <a href=\"#qa26-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Входы на фабрику: четыре пути, вентиляция нарисована не там\">24<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Входы на фабрику: четыре пути, вентиляция нарисована не там<\/b> У фабрики было несколько входов: главный, ворота отгрузки (сразу к Цеце и красному цеху), канализация (на неё указывал ассенизатор) и вентиляция. Вентиляционный блок задумали на крыше, увидеть его можно было, только взлетев: он вёл прямо в коровник. На иллюстрации вентиляцию по ошибке нарисовали сбоку. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5115\" target=\"_blank\" rel=\"noopener\">1:25:15 ↗<\/a> · <a href=\"#qa26-23\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:33", "sec": 2032, "html": "В тоннеле крысы загрызают <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> до смерти. Нина прячет его тело себе в рот, выплёвывает крыс, и отряд давит их, проталкивая Нину вперёд. Наверху виден «божественный свет», но это дыра туалета.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему крысы смогли убить Дан Балана\">25<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему крысы смогли убить Дан Балана<\/b> Это были не обычные крысы, а три гигантские, «как корабельные». Тоннель был их территорией, и они защищали его до последнего. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5187\" target=\"_blank\" rel=\"noopener\">1:26:27 ↗<\/a> · <a href=\"#qa26-24\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:39", "sec": 2345, "html": "Герои вылезают в туалет фабрики. Там находят журнал «Playwolf» с разворотом, перерисованным в вампиршу Цецу: рабочие фанатеют от своей управляющей. Нина оживляет <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> кровавым грибом. В раздевалке берут белые комбинезоны, золотую монету и посох паутины, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> снимает с петель дверь и носит её с собой.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Посох паутины для выпуска 26 — эскизы художницы\">5<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Посох паутины для выпуска 26 — эскизы художницы<\/b> Художница Маша Брагина нарисовала шесть вариантов посоха, накладывающего заклинание паутины, — артефакта выпуска 26. Зрителям предложили выбрать вариант, хотя, возможно, авторы уже выбрали сами. <span class=\"note\">Подкаст по #25 · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1083\" target=\"_blank\" rel=\"noopener\">0:18:03 ↗<\/a> · <a href=\"#qa25-6\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:44", "sec": 2657, "html": "Разнорабочего Торна <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> допрашивает и убивает. Нина заставляет его труп ответить на три вопроса «грибным разговором»: <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> — вампирша, управляющая производством, в красном цехе (западное крыло); фабрикой управляет <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (восточное крыло)."}, {"t": "≈0:49", "sec": 2970, "html": "В душевой отряд встречает пленника. Людей держат в «коровнике» в клетках, кормят кровавым фаршем со свёклой и водят на «дойку», где кровь выкачивают на карусели.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Как устроена кровяная фабрика: карусель, пастеризация, бутилированная кровь\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Как устроена кровяная фабрика: карусель, пастеризация, бутилированная кровь<\/b> Фабрика пародирует молочный комбинат и птицефабрику. Людей по номерам выводят из коровника на карусель, подключают к венам трубки, потом возвращают обратно. Кровь проходит через охладитель и загуститель и разливается по сосудам. Пастеризация и консервирование крови — технологическая революция в мире ПЧК: обычно вампиры пьют только свежую кровь живых существ. Таких фабрик немного; оставшуюся бутилированную кровь можно будет найти в будущих приключениях. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4676\" target=\"_blank\" rel=\"noopener\">1:17:56 ↗<\/a> · <a href=\"#qa26-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Непосещённая кухня: отработанных людей перемалывали со свёклой\">22<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Непосещённая кухня: отработанных людей перемалывали со свёклой<\/b> Герои не побывали в двух помещениях фабрики: на складе готовой продукции и на «кухне». На кухню через зону разгрузки привозили свёклу, и там людей, отслуживших свой срок как доноры, перемалывали вместе с ней в корм для остальных пленников. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4815\" target=\"_blank\" rel=\"noopener\">1:20:15 ↗<\/a> · <a href=\"#qa26-21\">к записи<\/a><\/span><\/span>"}, {"t": "≈0:54", "sec": 3283, "html": "В коровнике охранник не верит «сотрудникам» в комбинезонах. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> в облике летучей мыши крадёт ключ, но попадается, и начинается бой. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, намазавшись кремом для рук, проскальзывает к клеткам. Нина опутывает охрану лозами, Бьянка спрыгивает с потолка на рабочих, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> добивают стражу. Охранник свистит в свисток, который слышат только оборотни."}, {"t": "≈0:59", "sec": 3595, "html": "С потолка появляется Блэт — темнокожий полукровка в тёмных очках, с серебряной катаной, пародия на Блейда. Кунаями он убивает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> метит Блэта мочой, и все его атаки теперь с помехой. Нина швыряет гриб испуга, Блэт в ужасе бежит, а пленники идут за Ниной. Дан Балана воскрешают, выжав ему в рот кровь двух рабочих.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Очки Блэта были просто аксессуаром\">31<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Очки Блэта были просто аксессуаром<\/b> Тёмные очки Блэта были декоративными. Если бы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> надел их и отнёсся к ним как к ценности, авторы могли бы на ходу сделать их артефактом: очками видения сквозь стены (как у <a class=\"ref\" href=\"/c/adelaida/\">Иделаиды<\/a> в выпуске 12) или видения невидимого. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6557\" target=\"_blank\" rel=\"noopener\">1:49:17 ↗<\/a> · <a href=\"#qa26-30\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:05", "sec": 3908, "html": "В красном цехе на карусели выкачивают кровь, на конвейере её охлаждают, сгущают и разливают по сосудам. Управляющая <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> — брюнетка в роговых очках, в одежде из крашеной человеческой кожи, на пальце перстень-ключ от лаборатории. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>, знаменитость среди вампиров, раздевается ради переговоров, выкрадывает губами перстень и погибает от катаны Блэта.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Как устроена кровяная фабрика: карусель, пастеризация, бутилированная кровь\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Как устроена кровяная фабрика: карусель, пастеризация, бутилированная кровь<\/b> Фабрика пародирует молочный комбинат и птицефабрику. Людей по номерам выводят из коровника на карусель, подключают к венам трубки, потом возвращают обратно. Кровь проходит через охладитель и загуститель и разливается по сосудам. Пастеризация и консервирование крови — технологическая революция в мире ПЧК: обычно вампиры пьют только свежую кровь живых существ. Таких фабрик немного; оставшуюся бутилированную кровь можно будет найти в будущих приключениях. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4676\" target=\"_blank\" rel=\"noopener\">1:17:56 ↗<\/a> · <a href=\"#qa26-20\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:10", "sec": 4221, "html": "Нина «целует» мёртвого мужа, забирает у него изо рта перстень и оживляет его кровавым грибом, а <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> притворяется мёртвым. <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> зовёт <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку<\/a> одну к старейшинам. Под грибом правды она признаётся, что хотела отделить Бьянку и убить её руками старейшин, и называет лабораторию: в ней <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> и Юра.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Блэта и Цецу можно было переманить\">32<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Блэта и Цецу можно было переманить<\/b> Договориться можно было с обоими, но социальные проверки субъективны: нужно было задеть то, что волнует персонажа. <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a>, гордая своей революцией в пастеризации крови, любила свою работу на производстве. Убеждению помогли бы преимущество за знание прошлых событий и разговоры о славе клана. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6621\" target=\"_blank\" rel=\"noopener\">1:50:21 ↗<\/a> · <a href=\"#qa26-31\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:15", "sec": 4533, "html": "Бой: Нина кидает Цецу в Блэта на потолке, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> выпускает изо рта рой саранчи, и <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> погибает. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> критическим ударом меча испепеляет Блэта. Трофеи: зелья невидимости и ускорения, серебряная катана. Отряд лечится кровью из шлангов карусели.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Тело Цецы не сожгли — её можно вернуть\">33<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Тело Цецы не сожгли — её можно вернуть<\/b> Авторы подчеркнули, что Цецу не сожгли, её тело осталось лежать, а развеян был пепел Блэта. Поэтому есть возможность её вернуть, хотя это не обещано. Цецу художница Аня нарисовала похожей на жену Шатохина Юлю. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep26.md <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> погибла от роя саранчи («Погибла (саранча)»). По словам авторов, её тело не сожгли и её можно вернуть: смерть не окончательная.<\/span> <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6767\" target=\"_blank\" rel=\"noopener\">1:52:47 ↗<\/a> · <a href=\"#qa26-32\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:20", "sec": 4846, "html": "У лаборатории в клетке сидит отмытый пленник, «подготовленный к опытам». Совет высасывает людей досуха и искусственно выводит армию полукровок-дампиров.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём<\/b> Высшие вампиры не собираются уничтожать людей. Они хотят превратить человечество в фабрику-ферму без королей и мэров. Днём править они не могут, поэтому выводят гибридов дампиров и оборотней: эти союзники выносят солнце и будут держать власть днём. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4339\" target=\"_blank\" rel=\"noopener\">1:12:19 ↗<\/a> · <a href=\"#qa26-17\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:25", "sec": 5158, "html": "В лаборатории стоят клетка с оборотнем-волком и два резервуара с гибридами. Лаборанты молча уходят. На столах лежат схемы скрещивания оборотня с вампиром и оживления вампирского семени по образцу Кукан Яки, «прародителя гибридов». <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> по праву альфы подчиняет волка.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиры хотят не уничтожить, а «одомашнить» человечество; гибриды — для власти днём<\/b> Высшие вампиры не собираются уничтожать людей. Они хотят превратить человечество в фабрику-ферму без королей и мэров. Днём править они не могут, поэтому выводят гибридов дампиров и оборотней: эти союзники выносят солнце и будут держать власть днём. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4339\" target=\"_blank\" rel=\"noopener\">1:12:19 ↗<\/a> · <a href=\"#qa26-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Гибриды были сильнее высших вампиров и питались через трубки\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Гибриды были сильнее высших вампиров и питались через трубки<\/b> Гибриды из резервуаров были чудовищно сильны, сильнее высших вампиров: боевые «танки» ближнего боя. Бой с ними строился как головоломка, вроде боя с личом или с Прохором фон де Лизом в выпуске 15: убить их почти невозможно, пока не поймёшь, что они питаются через трубки, и не отключишь их. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6286\" target=\"_blank\" rel=\"noopener\">1:44:46 ↗<\/a> · <a href=\"#qa26-29\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:31", "sec": 5471, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> под зельем невидимости поджигает гроб Юры (коробка вина и огненный меч). <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> бросает в Гнилоша масло для бороды, получает критический провал и поджигает себя. Волк не смог его вытащить.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Смерть Вампирбека не планировалась\">6<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Смерть Вампирбека не планировалась<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сказал, что смерть <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> не была задумана. В тот день у него ничего не получалось, кубики не шли, и он решил, что лучше погибнуть ярко, чем «серо». Шутку о том, что персонажа «слили» из-за сложной в производстве фигурки, всерьёз принимать не стоит. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1893\" target=\"_blank\" rel=\"noopener\">0:31:33 ↗<\/a> · <a href=\"#qa26-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Бьянка не поставила огненную стену сразу\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Бьянка не поставила огненную стену сразу<\/b> Авторы ожидали, что <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> войдёт первой и спалит обоих членов Совета стеной огня. Но <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a> и <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> берегли очки крови (стена стоила 4 очка): они думали, что после двух советников появится третий, ещё сильнее. Поэтому первым зашёл <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и поджёг себя маслом для бороды. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=2245\" target=\"_blank\" rel=\"noopener\">0:37:25 ↗<\/a> · <a href=\"#qa26-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Раунд внезапности спас отряд от гибридов\">13<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Раунд внезапности спас отряд от гибридов<\/b> Героев выручило то, что они тихо забрали у Цецы перстень, без шума вошли в лабораторию и убили вампиров за один ход в раунде внезапности. Иначе советники выпустили бы гибридов, и те, скорее всего, убили бы отряд. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=3162\" target=\"_blank\" rel=\"noopener\">0:52:42 ↗<\/a> · <a href=\"#qa26-12\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:36", "sec": 5784, "html": "<a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> решает пожертвовать товарищем и ставит огненную стену: 46 урона по вампирам. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> проваливает спасбросок и сгорает («Главное — деду за руль не пускайте»). Вместе с ним гибнут волк и Юра из Четвёртой фабрики.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Смерть Вампирбека не планировалась\">6<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Смерть Вампирбека не планировалась<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сказал, что смерть <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> не была задумана. В тот день у него ничего не получалось, кубики не шли, и он решил, что лучше погибнуть ярко, чем «серо». Шутку о том, что персонажа «слили» из-за сложной в производстве фигурки, всерьёз принимать не стоит. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1893\" target=\"_blank\" rel=\"noopener\">0:31:33 ↗<\/a> · <a href=\"#qa26-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b> Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске 16 он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске 20 «Вампирское возмездие». <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 ↗<\/a> · <a href=\"#qa26-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Бьянка не поставила огненную стену сразу\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Бьянка не поставила огненную стену сразу<\/b> Авторы ожидали, что <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> войдёт первой и спалит обоих членов Совета стеной огня. Но <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнава<\/a> и <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> берегли очки крови (стена стоила 4 очка): они думали, что после двух советников появится третий, ещё сильнее. Поэтому первым зашёл <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и поджёг себя маслом для бороды. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=2245\" target=\"_blank\" rel=\"noopener\">0:37:25 ↗<\/a> · <a href=\"#qa26-7\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему герои ликовали после смерти Вампирбека\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему герои ликовали после смерти Вампирбека<\/b> Аплодисменты после гибели <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> относились к концу приключения: игроки радовались, что миссия выполнена и не надо плыть на корабль. В монтаже смерть и объявление победы оказались почти в одной склейке. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=2555\" target=\"_blank\" rel=\"noopener\">0:42:35 ↗<\/a> · <a href=\"#qa26-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Вампирбек не мог спастись и чем ему могли помочь\">28<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Вампирбек не мог спастись и чем ему могли помочь<\/b> <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> истратил весь ход: полное перемещение, бонусное действие на поджог масла и две атаки, которые мастер ему разрешил. Превратиться в мышь он уже не мог, оставались только реакция и спасбросок. Нины в комнате не было. Если бы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> или Нина сделали хоть что-то, дающее преимущество (например, корни Нины), Вампирбек мог бы выжить или его удалось бы стабилизировать. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5982\" target=\"_blank\" rel=\"noopener\">1:39:42 ↗<\/a> · <a href=\"#qa26-27\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:41", "sec": 6096, "html": "Обгоревший Гнилош ковыляет к резервуарам с гибридами, но Нина садится на него и раздавливает. Трубки питания гибридов перерубают катаной.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Гибриды были сильнее высших вампиров и питались через трубки\">30<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Гибриды были сильнее высших вампиров и питались через трубки<\/b> Гибриды из резервуаров были чудовищно сильны, сильнее высших вампиров: боевые «танки» ближнего боя. Бой с ними строился как головоломка, вроде боя с личом или с Прохором фон де Лизом в выпуске 15: убить их почти невозможно, пока не поймёшь, что они питаются через трубки, и не отключишь их. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6286\" target=\"_blank\" rel=\"noopener\">1:44:46 ↗<\/a> · <a href=\"#qa26-29\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:46", "sec": 6409, "html": "В пепле находят записку Адриана Вурдаласку «брату». <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставил взрывчатку в порт, «Багровый закат» отчалил к <a class=\"ref\" href=\"/place/nergal/\">Нергалу<\/a>. Адриан хочет сам сбросить взрывчатку в жерло древнего вулкана: когда пепел закроет солнце, надо резать короля и гвардию.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Вырезанный акт: бой на «Багровом закате» с Адрианом Вурдаласку\">11<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Вырезанный акт: бой на «Багровом закате» с Адрианом Вурдаласку<\/b> По сценарию третий член Совета был на фабрике. Если бы герои быстро дошли до лаборатории, они получили бы записку вовремя и успели бы перехватить третьего вампира в промышленном порту рядом с фабрикой. Там их ждал бой на корабле «Багровый закат» с этим вампиром, фамильярами и моряками, чтобы предотвратить отправку взрывчатки. Игра шла слишком долго, и акт вырезали: корабль считается отчалившим. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=2711\" target=\"_blank\" rel=\"noopener\">0:45:11 ↗<\/a> · <a href=\"#qa26-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином\">23<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Позиция вампиров в войне ада и небес; план Совета на сделку с Тёмным Властелином<\/b> Клан Балан против войны: в ней будут гибнуть люди. Высшие вампиры вряд ли пьют демонов, ведь у тех в жилах ихор, а не кровь. План Совета — взять всю власть в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a>, убить короля и гвардию. Если придёт <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, договориться с ним и поделить людей: вампирам — кровь, дьяволам — души и энергия. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4985\" target=\"_blank\" rel=\"noopener\">1:23:05 ↗<\/a> · <a href=\"#qa26-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Записка Адриана уцелела в огне ради сюжета\">29<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Записка Адриана уцелела в огне ради сюжета<\/b> Авторы признали, что записка нужна была, чтобы продвинуть героев по сюжету и показать, что третьего вампира на фабрике нет. В шутку объяснили, почему она не сгорела: лежала в алмазной шкатулке Гнилоша, которая упала и раскрылась. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6136\" target=\"_blank\" rel=\"noopener\">1:42:16 ↗<\/a> · <a href=\"#qa26-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Как вампиры оказались в плену у дракона\">40<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Как вампиры оказались в плену у дракона<\/b> Если бы в #28 дирижабль не остановили, взрывчатку опустили бы в жерло мимо дракона и взорвали дистанционно. Потеряв дирижабль, вампиры повезли взрывчатку (упущенную ещё в #26) кораблём, а затем на телеге через заброшенный город и разбудили дракона. Он взял их в заложники, и они договорились: вампиры добывают ему ценный артефакт (маску), а дракон взрывает для них вулкан и отпускает с миром. <span class=\"note\">Подкаст по #32 · <a href=\"https://youtu.be/SdpeDKQeFQM?t=7737\" target=\"_blank\" rel=\"noopener\">2:08:57 ↗<\/a> · <a href=\"#qa32-24\">к записи<\/a><\/span><\/span>"}, {"t": "≈1:52", "sec": 6722, "html": "Пепел Вампира Бека, перемешанный с пеплом волка и Юры, собирают в одноразку, чтобы когда-нибудь воскресить. ПТС на повозку сгорел вместе с ним. Эпилог: «Твоя жизнь стала ценой за смерть двух членов вампирского совета».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Прах Вампирбека: авторы обязаны рассмотреть воскрешение\">14<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Прах Вампирбека: авторы обязаны рассмотреть воскрешение<\/b> Авторский принцип — не воскрешать погибших персонажей, если герои сами ничего для этого не делают. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (вместе с пеплом волка и Юры) в солевую одноразку, поэтому авторы обязаны рассмотреть его использование, и шанс воскрешения есть. Для сравнения привели <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>: после выпуска 10 никто не пытался раскопать его останки в руинах <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a>. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=3259\" target=\"_blank\" rel=\"noopener\">0:54:19 ↗<\/a> · <a href=\"#qa26-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Солевая одноразка родилась из шутки в выпуске 20\">34<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Солевая одноразка родилась из шутки в выпуске 20<\/b> Одноразку авторы положили в инвентарь Луки «<a class=\"ref\" href=\"/c/luka-superbigdikgan/\">СуперБигДикГана<\/a>» в выпуске 20 как шутку. Когда Лука погиб на корабле, она выпала у него из кармана, стала мемом, и в итоге в неё собрали прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы призвали игроков «оставлять следы»: например, фонарный столб Кукан Яки из выпуска 16 может ещё всплыть. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=7319\" target=\"_blank\" rel=\"noopener\">2:01:59 ↗<\/a> · <a href=\"#qa26-33\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Идею собрать прах подсказала вырезанная сцена с пеплом Блэта\">35<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Идею собрать прах подсказала вырезанная сцена с пеплом Блэта<\/b> Когда отряд подошёл к лаборатории без ключа, <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> бегал назад за перстнем. Там трое работников собирали пепел своих хозяев, а он разогнал их и раздул прах. По мнению авторов, это засело у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> в подкорке, и в финале <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=7369\" target=\"_blank\" rel=\"noopener\">2:02:49 ↗<\/a> · <a href=\"#qa26-34\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Воскрешение Вампирбека стало возможным только благодаря действиям игроков\">38<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Воскрешение Вампирбека стало возможным только благодаря действиям игроков<\/b> Авторы по-прежнему считают воскрешение плохой идеей, но здесь его заслужили. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам, без указаний, собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> в солевую одноразку (выпуск 26) и записал в карточку, что воспользуется любым шансом его воскресить. Тогда авторы сделали из этого испытание: игроки должны были узнать об умных автоматонах, догадаться положить в робота одноразку с биоматериалом и за минуту обезвредить самоуничтожение. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=1140\" target=\"_blank\" rel=\"noopener\">0:19:00 ↗<\/a> · <a href=\"#qa28-4\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:05:22", "sec": 322}, {"t": "0:23:33", "sec": 1413}, {"t": "0:47:10", "sec": 2830}, {"t": "1:05:34", "sec": 3934}, {"t": "1:17:13", "sec": 4633}, {"t": "1:26:30", "sec": 5190}, {"t": "1:37:08", "sec": 5828}, {"t": "1:46:50", "sec": 6410}, {"t": "1:48:58", "sec": 6538}, {"t": "1:51:25", "sec": 6685}], "coins": {"ep": "26", "events": [{"t": "0:36:26", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Остроумно разгадал по улике (испачканный журнал), что у вампиров нет отражения, поэтому для журнала они используют образ перерисованной оборотницы.", "result": null, "sec": 2186, "who_url": "/c/vampir-bek/", "reason_html": "Остроумно разгадал по улике (испачканный журнал), что у вампиров нет отражения, поэтому для журнала они используют образ перерисованной оборотницы."}, {"t": "0:37:06", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Успешно осмотрел шкафчики сотрудников фабрики (проверка внимания).", "result": null, "sec": 2226, "who_url": "/c/vampir-bek/", "reason_html": "Успешно осмотрел шкафчики сотрудников фабрики (проверка внимания)."}, {"t": "0:37:25", "kind": "loot", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "В шкафчике сотрудника нашёл золотую монету и посох паутины.", "result": null, "sec": 2245, "who_url": "/c/vampir-bek/", "reason_html": "В шкафчике сотрудника нашёл золотую монету и посох паутины."}, {"t": "0:43:45", "kind": "spend", "who": "Нина", "actor": "Лена Кукояка", "to": null, "reason": "Потратили монету на дополнительный (четвёртый) вопрос к мёртвому телу через её способность «грибной разговор».", "result": null, "sec": 2625, "who_url": "/c/nina/", "reason_html": "Потратили монету на дополнительный (четвёртый) вопрос к мёртвому телу через её способность «грибной разговор»."}, {"t": "1:11:41", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Монета за комично неверную попытку истолковать жесты обессиленного пленника на карусели («мы максимально тупые»).", "result": null, "sec": 4301, "who_url": null, "reason_html": "Монета за комично неверную попытку истолковать жесты обессиленного пленника на карусели («мы максимально тупые»)."}, {"t": "1:20:24", "kind": "earn", "who": "Нина", "actor": "Лена Кукояка", "to": null, "reason": "Отвлекла и поцеловала мужа вампирши Цецы, вытащила у него изо рта кольцо и незаметно подложила кровавый гриб.", "result": "Проверка ловкости/убеждения прошла успешно.", "sec": 4824, "who_url": "/c/nina/", "reason_html": "Отвлекла и поцеловала мужа вампирши Цецы, вытащила у него изо рта кольцо и незаметно подложила кровавый гриб."}, {"t": "1:33:07", "kind": "earn", "who": "Кукан Яка", "actor": "Денис Кукояка", "to": null, "reason": "Выяснил у пленника и охранника детали плана по созданию гибридов-дампиров (скрещивание оборотней и вампиров).", "result": null, "sec": 5587, "who_url": "/c/kukanyaka/", "reason_html": "Выяснил у пленника и охранника детали плана по созданию гибридов-дампиров (скрещивание оборотней и вампиров)."}, {"t": "1:36:31", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Потратил монету на переброс проверки убеждения (харизма) волка-оборотня, называя себя «сверхсуществом».", "result": null, "sec": 5791, "who_url": "/c/vampir-bek/", "reason_html": "Потратил монету на переброс проверки убеждения (харизма) волка-оборотня, называя себя «сверхсуществом»."}, {"t": "1:41:42", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "Потратил две монеты подряд на переброс атак горючим маслом для бороды по Гнилышу Диковичу.", "result": "Оба раза неудача — Вампирбек в итоге поджёг сам себя.", "sec": 6102, "who_url": "/c/vampir-bek/", "reason_html": "Потратил две монеты подряд на переброс атак горючим маслом для бороды по Гнилышу Диковичу."}, {"t": "1:43:30", "kind": "spend", "who": "Бьянка Сосунеску", "actor": "Екатерина Варнава", "to": null, "reason": "Потратила монеты (переброс и два дополнительных кубика) на попытку волка-альфы вытащить горящего Вампербека из огня.", "result": "Волк не справился — Вампирбек и волк сгорели заживо.", "sec": 6210, "who_url": "/c/byanka-sosunesku/", "reason_html": "Потратила монеты (переброс и два дополнительных кубика) на попытку волка-альфы вытащить горящего Вампербека из огня."}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 2, "spent": 3, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}, {"who": "Нина", "actor": "Лена Кукояка", "earned": 1, "spent": 1, "img": "img/chars/nina.webp", "who_url": "/c/nina/", "actor_url": "/p/lena-kukoyaka/"}, {"who": "Кукан Яка", "actor": "Денис Кукояка", "earned": 1, "spent": 0, "img": "img/chars/kukan-yaka.webp", "who_url": "/c/kukanyaka/", "actor_url": "/p/denis-kukoyaka/"}, {"who": "Бьянка Сосунеску", "actor": "Екатерина Варнава", "earned": 0, "spent": 2, "img": "img/chars/b-yanka-sosunesku.webp", "who_url": "/c/byanka-sosunesku/", "actor_url": "/p/ekaterina-varnava/"}], "notes": "В начале выпуска светящееся пятнышко на потолке ошибочно приняли за монету — это оказался источник света, не игровое событие (0:27:03). В конце выпуска — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие. Выпуск заканчивается гибелью Вампира Бека (Вампербека) в огне."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, глава клана", "role": "", "fate": "выжил (дважды погибал и был возвращён кровью)", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дан Балан и Бьянка: влечение есть\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дан Балан и Бьянка: влечение есть<\/b> На вопрос, сблизятся ли <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что старик Дан Балан всё ещё полон страсти и предпочитает молоденьких. Это обыграли в рекламном интро выпуска 26 со сценой в гробу. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4015\" target=\"_blank\" rel=\"noopener\">1:06:55 ↗<\/a> · <a href=\"#qa26-15\">к записи<\/a><\/span><\/span>"}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "вампир, извозчик", "role": "", "fate": "погиб — сгорел в огненной стене Бьянки", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Смерть Вампирбека не планировалась\">6<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Смерть Вампирбека не планировалась<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сказал, что смерть <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> не была задумана. В тот день у него ничего не получалось, кубики не шли, и он решил, что лучше погибнуть ярко, чем «серо». Шутку о том, что персонажа «слили» из-за сложной в производстве фигурки, всерьёз принимать не стоит. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1893\" target=\"_blank\" rel=\"noopener\">0:31:33 ↗<\/a> · <a href=\"#qa26-4\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Жертвенность Вампирбека — из-за вины за сожжение графа Сосунеску<\/b> Авторы связали готовность <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> пожертвовать собой с его ролью в начале вампирской мести. В выпуске 16 он вместе с энергетическим вампиром <a class=\"ref\" href=\"/c/adolf/\">Адольфом<\/a> сжёг графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>, нарушив законы высших вампиров. Пожертвовать собой он был готов ещё в выпуске 20 «Вампирское возмездие». <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=1973\" target=\"_blank\" rel=\"noopener\">0:32:53 ↗<\/a> · <a href=\"#qa26-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Прах Вампирбека: авторы обязаны рассмотреть воскрешение\">14<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Прах Вампирбека: авторы обязаны рассмотреть воскрешение<\/b> Авторский принцип — не воскрешать погибших персонажей, если герои сами ничего для этого не делают. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> (вместе с пеплом волка и Юры) в солевую одноразку, поэтому авторы обязаны рассмотреть его использование, и шанс воскрешения есть. Для сравнения привели <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>: после выпуска 10 никто не пытался раскопать его останки в руинах <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a>. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=3259\" target=\"_blank\" rel=\"noopener\">0:54:19 ↗<\/a> · <a href=\"#qa26-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Вампирбек не мог спастись и чем ему могли помочь\">28<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Вампирбек не мог спастись и чем ему могли помочь<\/b> <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> истратил весь ход: полное перемещение, бонусное действие на поджог масла и две атаки, которые мастер ему разрешил. Превратиться в мышь он уже не мог, оставались только реакция и спасбросок. Нины в комнате не было. Если бы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> или Нина сделали хоть что-то, дающее преимущество (например, корни Нины), Вампирбек мог бы выжить или его удалось бы стабилизировать. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5982\" target=\"_blank\" rel=\"noopener\">1:39:42 ↗<\/a> · <a href=\"#qa26-27\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Воскрешение Вампирбека стало возможным только благодаря действиям игроков\">38<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Воскрешение Вампирбека стало возможным только благодаря действиям игроков<\/b> Авторы по-прежнему считают воскрешение плохой идеей, но здесь его заслужили. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сам, без указаний, собрал прах <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> в солевую одноразку (выпуск 26) и записал в карточку, что воспользуется любым шансом его воскресить. Тогда авторы сделали из этого испытание: игроки должны были узнать об умных автоматонах, догадаться положить в робота одноразку с биоматериалом и за минуту обезвредить самоуничтожение. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=1140\" target=\"_blank\" rel=\"noopener\">0:19:00 ↗<\/a> · <a href=\"#qa28-4\">к записи<\/a><\/span><\/span>"}, {"name": "Кукан Яка", "actor": "Денис Кукояка", "actor_url": "/p/denis-kukoyaka/", "race": "гибрид вампира и оборотня", "role": "", "fate": "выжил (убит Блэтом и воскрешён Ниной)", "id": "Куканяка", "url": "/c/kukanyaka/", "img": "img/chars/kukan-yaka.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}]}, {"name": "Нина", "actor": "Лена Кукояка", "actor_url": "/p/lena-kukoyaka/", "race": "болотная тварь", "role": "", "fate": "выжила", "id": "Нина", "url": "/c/nina/", "img": "img/chars/nina.webp", "other": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}], "fn_html": "<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Болотную тварь звали Нина, не Тина\">1<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Болотную тварь звали Нина, не Тина<\/b> Зрители спорили, как зовут болотную тварь — Нина или Тина. В статблоке монстра она записана как Нина; ведущие лишь пошутили, что «Тина» подошло бы болотной твари больше. Канон — Нина (в выпуске 26 её играет <a class=\"ref\" href=\"/p/lena-kukoyaka/\">Лена Кукояка<\/a>). <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep16.md (раздел «Кратко») чудовище названо «Тиной»; правильно — Нина, как в разделе «Персонажи» того же конспекта.<\/span> <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=5337\" target=\"_blank\" rel=\"noopener\">1:28:57 ↗<\/a> · <a href=\"#qa16-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кукан Яка вернулся в вампирскую ветку, роман с болотной тварью отложен<\/b> <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> вернулся за стол вампирской саги в выпуске, снятом накануне, но любовную линию с болотной тварью решили пока не развивать ради более важного сюжетного решения. Болотная тварь в будущем появится — исполнительницу ещё выбирали. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=343\" target=\"_blank\" rel=\"noopener\">0:05:43 ↗<\/a> · <a href=\"#qa20-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Как придумали Луку, Мирамистину и роль для Позова\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Как придумали Луку, Мирамистину и роль для Позова<\/b> Изначально в 20-м выпуске должен был играть <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Кукояка<\/a>, а <a class=\"ref\" href=\"/p/dmitriy-pozov/\">Позову<\/a> хотели дать болотную тварь. Кукояка заболел, и без него это потеряло смысл; тогда придумали ведьму для <a class=\"ref\" href=\"/p/viktoriya-skladchikova/\">Виктории Складчиковой<\/a>, связали её с Антоном общим ребёнком-подростком, и в последнюю очередь поняли, что подростком будет Позов. На роль болотной твари (Нины) также рассматривали Бабича и <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2216\" target=\"_blank\" rel=\"noopener\">0:36:56 ↗<\/a> · <a href=\"#qa20-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву\">26<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Болотную тварь хотели отдать Артуру Бабичу, потом Соболеву<\/b> Сначала на роль болотной твари авторы хотели позвать Артура Бабича, затем Илью <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, а в итоге позвали Лену, жену <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a>, чтобы сыграла настоящая супружеская пара. Изначально болотная тварь была просто монстром, которого надо было убить в сцене с сиротками, но <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> выбрал любовь. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=5255\" target=\"_blank\" rel=\"noopener\">1:27:35 ↗<\/a> · <a href=\"#qa26-25\">к записи<\/a><\/span><\/span>"}, {"name": "Бьянка Сосунеску", "actor": "Екатерина Варнава", "actor_url": "/p/ekaterina-varnava/", "race": "высший вампир", "role": "", "fate": "выжила", "id": "Бьянка", "url": "/c/byanka-sosunesku/", "img": "img/chars/b-yanka-sosunesku.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Задумка персонажа для Варнавы — вампирша Бьянка Сосунеску\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Задумка персонажа для Варнавы — вампирша Бьянка Сосунеску<\/b> На просьбу <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Варнавы<\/a> сыграть «ужасно плохого», обольстительного и безжалостного персонажа авторы предложили бывшую жену графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a> — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a>: они ненавидели друг друга; в отличие от старомодного Влада, для которого люди — скот, она современнее и «толерантнее», за новые веяния, но очень жёсткая. Позже Варнава сыграла её в выпуске 26. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=1916\" target=\"_blank\" rel=\"noopener\">0:31:56 ↗<\/a> · <a href=\"#qa22-3\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Как попадают в Совет высших вампиров\">15<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Как попадают в Совет высших вампиров<\/b> В Совет попадают по чистоте крови и возрасту: вампир с чистой кровью, проживший 300–400 лет, уже претендует на место из-за своей силы. Древнейших старейшин, заставших аналог Египта, сейчас нет. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a>, возможно, вошла в Совет лишь как жена <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=3908\" target=\"_blank\" rel=\"noopener\">1:05:08 ↗<\/a> · <a href=\"#qa26-14\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Дан Балан и Бьянка: влечение есть\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Дан Балан и Бьянка: влечение есть<\/b> На вопрос, сблизятся ли <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a> и <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> ответил, что старик Дан Балан всё ещё полон страсти и предпочитает молоденьких. Это обыграли в рекламном интро выпуска 26 со сценой в гробу. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=4015\" target=\"_blank\" rel=\"noopener\">1:06:55 ↗<\/a> · <a href=\"#qa26-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул\">43<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b> Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 ↗<\/a> · <a href=\"#qa49-5\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Цеца", "actor": "", "actor_url": null, "race": "", "role": "вампирша, управляющая красным цехом", "fate": "погибла", "id": "Цеца", "url": "/c/ceca/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Блэта и Цецу можно было переманить\">32<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Блэта и Цецу можно было переманить<\/b> Договориться можно было с обоими, но социальные проверки субъективны: нужно было задеть то, что волнует персонажа. <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a>, гордая своей революцией в пастеризации крови, любила свою работу на производстве. Убеждению помогли бы преимущество за знание прошлых событий и разговоры о славе клана. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6621\" target=\"_blank\" rel=\"noopener\">1:50:21 ↗<\/a> · <a href=\"#qa26-31\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Тело Цецы не сожгли — её можно вернуть\">33<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Тело Цецы не сожгли — её можно вернуть<\/b> Авторы подчеркнули, что Цецу не сожгли, её тело осталось лежать, а развеян был пепел Блэта. Поэтому есть возможность её вернуть, хотя это не обещано. Цецу художница Аня нарисовала похожей на жену Шатохина Юлю. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep26.md <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a> погибла от роя саранчи («Погибла (саранча)»). По словам авторов, её тело не сожгли и её можно вернуть: смерть не окончательная.<\/span> <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6767\" target=\"_blank\" rel=\"noopener\">1:52:47 ↗<\/a> · <a href=\"#qa26-32\">к записи<\/a><\/span><\/span>"}, {"name": "Блэт", "actor": "", "actor_url": null, "race": "", "role": "полукровка-охотник на службе Совета, серебряная катана", "fate": "погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Очки Блэта были просто аксессуаром\">31<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Очки Блэта были просто аксессуаром<\/b> Тёмные очки Блэта были декоративными. Если бы <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> надел их и отнёсся к ним как к ценности, авторы могли бы на ходу сделать их артефактом: очками видения сквозь стены (как у <a class=\"ref\" href=\"/c/adelaida/\">Иделаиды<\/a> в выпуске 12) или видения невидимого. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6557\" target=\"_blank\" rel=\"noopener\">1:49:17 ↗<\/a> · <a href=\"#qa26-30\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Блэта и Цецу можно было переманить\">32<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Блэта и Цецу можно было переманить<\/b> Договориться можно было с обоими, но социальные проверки субъективны: нужно было задеть то, что волнует персонажа. <a class=\"ref\" href=\"/c/ceca/\">Цеца<\/a>, гордая своей революцией в пастеризации крови, любила свою работу на производстве. Убеждению помогли бы преимущество за знание прошлых событий и разговоры о славе клана. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=6621\" target=\"_blank\" rel=\"noopener\">1:50:21 ↗<\/a> · <a href=\"#qa26-31\">к записи<\/a><\/span><\/span>"}, {"name": "Гнилош Дикович", "actor": "", "actor_url": null, "race": "", "role": "член Совета высших вампиров, хозяин фабрики", "fate": "погиб", "id": "Гнилош Дикович", "url": "/c/gnilosh-dikovich/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Состав Высшего вампирского совета: 12 членов, пятеро мертвы\">39<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b> Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 ↗<\/a> · <a href=\"#qa28-28\">к записи<\/a><\/span><\/span>"}, {"name": "Юра из Четвёртой фабрики", "actor": "", "actor_url": null, "race": "", "role": "член Совета высших вампиров", "fate": "погиб (сгорел)", "id": null, "url": null, "img": null, "other": []}, {"name": "Адриан Вурдаласку", "actor": "", "actor_url": null, "race": "", "role": "член Совета, автор письма о вулкане", "fate": "выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Вырезанный акт: бой на «Багровом закате» с Адрианом Вурдаласку\">11<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Вырезанный акт: бой на «Багровом закате» с Адрианом Вурдаласку<\/b> По сценарию третий член Совета был на фабрике. Если бы герои быстро дошли до лаборатории, они получили бы записку вовремя и успели бы перехватить третьего вампира в промышленном порту рядом с фабрикой. Там их ждал бой на корабле «Багровый закат» с этим вампиром, фамильярами и моряками, чтобы предотвратить отправку взрывчатки. Игра шла слишком долго, и акт вырезали: корабль считается отчалившим. <span class=\"note\">Подкаст по #26 · <a href=\"https://youtu.be/leurb6i-MaA?t=2711\" target=\"_blank\" rel=\"noopener\">0:45:11 ↗<\/a> · <a href=\"#qa26-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Состав Высшего вампирского совета: 12 членов, пятеро мертвы\">39<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Состав Высшего вампирского совета: 12 членов, пятеро мертвы<\/b> Авторы с игроками пересчитали совет. Всего в нём 12 членов. Погибли пятеро: <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влад Сосунеску<\/a>, <a class=\"ref\" href=\"/c/dimitar-nord/\">Димитар Норд<\/a> (на корабле, купил место и бессмертие), <a class=\"ref\" href=\"/c/gnilosh-dikovich/\">Гнилош Дикович<\/a> (фабрика), Флореан (глава службы безопасности, его уничтожила Бьянка при её освобождении) и Адриан Вурдаласку. Живы <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>, <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка Сосунеску<\/a> (на стороне клана), Боен Гробов, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимир Винокус<\/a>, <a class=\"ref\" href=\"/c/milosh-klykovich/\">Милош Клыкович<\/a>, Чиприян Чесноческу и ещё один. Счёт шёл сбивчиво. <span class=\"note\">Подкаст по #28 · <a href=\"https://youtu.be/drZSni0fegc?t=7066\" target=\"_blank\" rel=\"noopener\">1:57:46 ↗<\/a> · <a href=\"#qa28-28\">к записи<\/a><\/span><\/span>"}, {"name": "Торн", "actor": "", "actor_url": null, "race": "", "role": "разнорабочий фабрики", "fate": "погиб", "id": "Торн", "url": "/c/torn/", "img": null, "other": []}, {"name": "Оборотень-волк", "actor": "", "actor_url": null, "race": "", "role": "пленник лаборатории, подчинился Кукан Яке", "fate": "погиб (сгорел)", "id": null, "url": null, "img": null, "other": []}, {"name": "Пленники-доноры", "actor": "", "actor_url": null, "race": "", "role": "люди, из которых выкачивали кровь", "fate": "освобождены", "id": null, "url": null, "img": null, "other": []}, {"name": "Янус", "actor": "", "actor_url": null, "race": "", "role": "контрабандист, доставил взрывчатку для вампиров", "fate": "упоминается", "id": "Янус", "url": "/c/yanus/", "img": "img/chars/dododis.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}]}], "links": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — бывший фамильяр, стал гибридом; Бесагон", "dir": "out", "color": "#B03A7A"}, {"key": "14", "label": "14", "title": "Янус доставка", "note_html": "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> доставил взрывчатку в порт", "dir": "out", "color": "#2F84C8"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "note_html": "Клан Балан убил графа <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Влада Сосунеску<\/a>; <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> и Нина из Мёртвых топей", "dir": "out", "color": "#B03A7A"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "note_html": "Освобождение <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянки Сосунеску<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "В столице ждут пришествия Тёмного Властелина после падения <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров", "note_html": "гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> на кровяной фабрике", "dir": "back", "color": "#B03A7A"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "note_html": "гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> на четвёртой фабрике", "dir": "back", "color": "#B03A7A"}, {"key": "33", "label": "33", "title": "Зверь Фест", "note_html": "Фабрика крови, гибель <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Фабрика крови, <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> и Клыкович", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["«Защищать добрых, выпивать до дна злодеев» — девиз клана Балан.", "«Надо было столько лет лежать в гробу, чтобы в итоге вылезти из дырки туалета» — <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянка<\/a>.", "«Главное — деду за руль не пускайте, он вас всех угробит» — последние слова Вампира Бека.", "«Я с голой жопой на руке у чужой женщины на глазах у жены умер» — <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>.", "«Как только его пепел закроет солнце, не медлите. Режьте короля» — письмо Адриана Вурдаласку."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> — промышленный остров на юго-западе столицы; «Четвёртая фабрика» (проходная, канализация, туалет, раздевалка, душевая, «коровник», красный цех с каруселью, лаборатория, кабинет Гнилоша); <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> (упоминаются); <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>, куда отчалил «Багровый закат», и древний вулкан.<\/li>\n<li>Фракции: Совет высших вампиров; клан Балан; оборотни; рабочие и охрана фабрики.<\/li>\n<li>Артефакты: список членов Совета; посох паутины; серебряный меч <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> (огненный,
