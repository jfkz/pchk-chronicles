<script>window.EPD = {"anim": false, "key": "47", "label": "47", "title": "Вокзал грешных душ", "date": "2026-03-27", "minutes": 128, "duration": 7684.0, "video_id": "TjbqyGMhRrU", "branch": "Фронт", "branch_color": "#3E9A5E", "place": "Ад: Вокзал грешных душ (Адский вокзал); лагерь королевской армии у фронта Чёрного Геленбурга", "short_html": "Королевский десант отправляется в ад, чтобы уничтожить адский локомотив, возящий демонов в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>.", "summary_html": "Спустя больше двух лет демонического вторжения королевское командование отправляет в ад через портал из кристаллов телепортации десант из 500 бойцов, чтобы уничтожить адский локомотив, возящий демонов в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. Из-за сбоя портала выживают лишь пятеро героев. Под видом грешников и «перебежчиков» они проходят досмотр на <a class=\"ref\" href=\"/place/ad/\">Вокзале грешных душ<\/a> (соблазнив гусеницу-святоискатель через червя Дружка), спасают из адской клетки дварфа <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a>, крадут билеты и свиток изгнания и освобождают пленного единорога Мистера Пирожка. Залив в топку локомотива бочку святой воды и добив осквернённого ангела-демона топки вместе с единорогом, отряд возвращается через эвакуационный портал. Подвиг позволяет королевской армии перейти в наступление и блокировать Чёрный <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>.", "outcome_html": "Все пятеро героев и <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> выжили, остальные десантники погибли; один из двух адских локомотивов выведен из строя, единорог спасён.", "world_html": ["Уничтожен адский локомотив, возивший демонов в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; у демонов остался один поезд", "Единорог спасён — третьего локомотива не будет", "Королевская армия форсировала реку <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалию<\/a> и освободила <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a>", "<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> полностью блокирован с суши у Геленбургского разлома", "<a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран Десперадо<\/a> вызволен из ада"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Бусти-заставка от лица <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>: он теперь «боевой жрец войск <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> Пятого»."}, {"t": "0:01:30", "sec": 90, "html": "Пролог: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> погиб, но его <a class=\"ref\" href=\"/place/ad/\">Адский вокзал<\/a> достроен; <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стал <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрным Геленбургом<\/a>, цитаделью Тёмного властелина; люди сдержали первое нашествие, демоны переходят к интригам и диверсиям. Ведущие называют выпуск «заключительным»."}, {"t": "0:04:17", "sec": 257, "html": "Завязка: демоны, погибая на земле, возрождаются в аду и возвращаются на фронт. Для наступления на <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> из всех кристаллов телепортации королевства сделана <a class=\"ref\" href=\"/a/izumrudnyy-portal/\">Изумрудная арка-портал<\/a> в ад. 500 бойцов шагают в портал, но большинство падает в лаву или разбивается; задача — уничтожить адский локомотив. Через 4 часа откроется эвакуационный портал на 1 минуту."}, {"t": "0:05:56", "sec": 356, "html": "Представление героев: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (бывший каннибал, семья встала на путь света после появления племянника; в армии научился делать святую воду, проводить свадьбы и похороны), <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> (друид-отшельник из <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбруна<\/a>, на праздниках превращается в козу; стал военно-полевым лекарем), <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> (дварф из Кунисских гор, обожжён драконом, вылечен в столичной больнице и отрабатывает долг в армии), <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> (эльфийка-ниндзя, бывшая наёмная убийца, помилована в обмен на службу), <a class=\"ref\" href=\"/c/vitya-mamontov/\">Витя Мамонтов<\/a> (охотник из <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вирджинвальда<\/a>, проглотил яйцо бычьего цепня и подружился с паразитом Дружком, который общается телепатически)."}, {"t": "0:17:33", "sec": 1053, "html": "Площадь перед вокзалом среди моря лавы; толпы грешников идут к дверям. Витя встречает одноклассника Лёшу, <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> в тени от <a class=\"ref\" href=\"/c/kvir/\">Квирка<\/a> крадёт у него погребальные монеты. Герои понимают, что «сбоящие порталы» — это их собственный десант."}, {"t": "0:25:00", "sec": 1500, "html": "Демон чует запах живых, но отряд вливается в поток грешников, завернув оружие в тюки."}, {"t": "0:29:19", "sec": 1759, "html": "Досмотр: рамки-«святоискатели» и адские гусеницы, глотающие вещи. Витя роняет арбалет (критическая неудача); <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> с козьими рогами выдаёт себя за «перебежчика с контрактом» по кличке Блатной — демон пропускает отряд без очереди."}, {"t": "0:33:10", "sec": 1990, "html": "Плакат запрещённых вещей (святые символы, оружие и т.п.). Через Дружка Витя телепатически знакомится с гусеницей Камиллой — одинокой и мечтающей о путешествиях. <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> пытается её соблазнить, проваливает бросок, гусеница пищит, и демон бьёт его вилами. Тогда Витя выпускает Дружка по штанине и тот «заболтывает» Камиллу (накормленный козьим кефиром) — гусеница пропускает бочку святой воды, освящённую секиру, оружие и прочее. Отряд выдаёт себя за декораторов нового зала."}, {"t": "0:51:40", "sec": 3100, "html": "Главный зал: суккубы-близняшки за стойкой информации объясняют порядок (форма 66К, кассы, перрон) и дают буклет «Лёгкий путь грешника». На «выставке достижений адского хозяйства» в клетке «индивидуальной пытки» алабай бесконечно грызёт дварфа <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a> — праведника, попавшего в ад за единственный грех: застрелил собаку из снайперской винтовки в упор."}, {"t": "0:56:08", "sec": 3368, "html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> звонит по «дварфской связи» Эмиру — тот разрешает спасать <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a>."}, {"t": "0:58:20", "sec": 3500, "html": "Витя устраивает отвлекающий манёвр (кислотная рвота через паразита), <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> ворует шесть билетов на разные круги (гордецы, еретики, чревоугодники, самоубийцы, сладострастники, жадные)."}, {"t": "1:02:14", "sec": 3734, "html": "<a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> в зале безразличных душ (полупрозрачные грешники, не познавшие ни греха, ни праведности) поит <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> «козьим молоком» (лечение). Смотритель зала грозит свитком изгнания; Квирк изучает его — свиток может отправить любое существо вокзала в глубины ада."}, {"t": "1:06:12", "sec": 3972, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> отвлекает алабая енотовой шапкой, пущенной из арбалета, <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> ставит туманное облако, Юлиан размягчает адский замок святой водой изо рта и критом бесшумно вскрывает клетку; <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a> прячут под плащом Юлиана. <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> тем временем крадёт у безразличного смотрителя свиток изгнания."}, {"t": "1:13:03", "sec": 4383, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> проводит свадебный обряд «бракосочетание» над <a class=\"ref\" href=\"/c/yarus/\">Ярусом<\/a> и <a class=\"ref\" href=\"/c/bagira/\">Багирой<\/a> (бонус к броне и проверкам на неделю)."}, {"t": "1:15:01", "sec": 4501, "html": "У турникетов героев едва не замечают демон-муха и начальник вокзала Фламес: в ад привезли единорога, чтобы осквернить его на девятом круге и сделать третий локомотив; сейчас поездов два, и один гоняют в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. Отряд проходит турникеты по билетам как «группировка Блатного». Лицо <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a> <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> «перелепливает» силой, чтобы его не узнали."}, {"t": "1:20:07", "sec": 4807, "html": "Табло и схема ада-спирали. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> освящает святой водой всё оружие отряда (+1d6 урона святостью)."}, {"t": "1:22:35", "sec": 4955, "html": "Перрон: поезд, будка стрелочника, клетка под тентом. Дружок чует «светлое существо» — это единорог. Червь-симбионт (самый умный в отряде) выясняет: единороги призывают солнечный свет и обожают девственников; почти весь отряд признаётся, что девственники."}, {"t": "1:27:09", "sec": 5229, "html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> через прикосновение говорит с единорогом Мистером Пирожком: в топке локомотива заточён осквернённый ангел, ставший демоном; если убить его, локомотив станет грудой железа. Магию единорога блокирует узда."}, {"t": "1:29:44", "sec": 5384, "html": "Демон-муха приказывает отправить поезд в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; грешников распускают. <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> скрытно срезает узду единорога («Я девственница» — «Я чувствую, ты чиста»). Отряд крадётся к локомотиву (крит <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, маскировочный «адский» плащ Вити), <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> с поцелованным молотом Олегом убивает беса-машиниста, Дружок добивает его."}, {"t": "1:41:38", "sec": 6098, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> заливает в топку 55 фляг святой воды — 197 урона; из пламени выходит рогатый осквернённый ангел-демон топки."}, {"t": "1:44:55", "sec": 6295, "html": "Бой на перроне: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> бьёт «словом солнца», Витя ультразвуковым криком оглушает суккубов, <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> с зельем турбодварфа критует молотом (39 урона), <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a>-коза в брючках бодает освящёнными рогами, <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> открывает клетку единорога и с его спины в прыжке рубит демона освящёнными катанами."}, {"t": "1:58:14", "sec": 7094, "html": "Открывается эвакуационный портал, в зал врываются сотни демонов; луч единорога наносит 66 урона святым светом, демон топки гибнет, адский огонь в его груди гаснет навсегда."}, {"t": "2:00:10", "sec": 7210, "html": "Отряд на единороге прыгает в портал; застрявшего под поездом Витю вытаскивает Дружок, сцепившись с верёвкой <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a>."}, {"t": "2:01:52", "sec": 7312, "html": "В лагере вернулись только они. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> женит <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> и <a class=\"ref\" href=\"/c/bagira/\">Багиру<\/a> (кольцо из яблока); Витя с Дружком уходит в лес, Ярус зовёт его другом. Остаток монет — 120 000 руб. на благотворительность."}, {"t": "2:06:44", "sec": 7604, "html": "Эпилог: уничтожение локомотива замедлило пополнение демонической армии; королевские войска форсировали реку <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалию<\/a>, освободили <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a> и дошли до Геленбургского разлома — <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> полностью блокирован с суши."}], "key_events": [{"t": "0:04:17", "sec": 257}, {"t": "0:29:19", "sec": 1759}, {"t": "0:46:20", "sec": 2780}, {"t": "0:54:13", "sec": 3253}, {"t": "1:08:05", "sec": 4085}, {"t": "1:15:47", "sec": 4547}, {"t": "1:27:09", "sec": 5229}, {"t": "1:43:02", "sec": 6182}, {"t": "1:58:40", "sec": 7120}, {"t": "2:02:36", "s
