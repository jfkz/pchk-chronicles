<script>window.EPD = {"anim": false, "key": "47", "label": "47", "title": "Вокзал грешных душ", "date": "2026-03-27", "minutes": 128, "duration": 7684.0, "video_id": "TjbqyGMhRrU", "branch": "Фронт", "branch_color": "#3E9A5E", "place": "Ад: Вокзал грешных душ (Адский вокзал); лагерь королевской армии у фронта Чёрного Геленбурга", "short_html": "Королевский десант отправляется в ад, чтобы уничтожить адский локомотив, возящий демонов в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>.", "summary_html": "Спустя больше двух лет демонического вторжения королевское командование отправляет в ад через портал из кристаллов телепортации десант из 500 бойцов, чтобы уничтожить адский локомотив, возящий демонов в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. Из-за сбоя портала выживают лишь пятеро героев. Под видом грешников и «перебежчиков» они проходят досмотр на <a class=\"ref\" href=\"/place/ad/\">Вокзале грешных душ<\/a> (соблазнив гусеницу-святоискатель через червя Дружка), спасают из адской клетки дварфа <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a>, крадут билеты и свиток изгнания и освобождают пленного единорога Мистера Пирожка. Залив в топку локомотива бочку святой воды и добив осквернённого ангела-демона топки вместе с единорогом, отряд возвращается через эвакуационный портал. Подвиг позволяет королевской армии перейти в наступление и блокировать Чёрный <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>.", "outcome_html": "Все пятеро героев и <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> выжили, остальные десантники погибли; один из двух адских локомотивов выведен из строя, единорог спасён.", "world_html": ["Уничтожен адский локомотив, возивший демонов в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; у демонов остался один поезд", "Единорог спасён — третьего локомотива не будет", "Королевская армия форсировала реку <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалию<\/a> и освободила <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a>", "<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> полностью блокирован с суши у Геленбургского разлома", "<a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран Десперадо<\/a> вызволен из ада"], "scenes": [{"t": "0:00:06", "sec": 6, "html": "Бусти-заставка от лица <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>: он теперь «боевой жрец войск <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a> Пятого»."}, {"t": "0:01:30", "sec": 90, "html": "Пролог: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> погиб, но его <a class=\"ref\" href=\"/place/ad/\">Адский вокзал<\/a> достроен; <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стал <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрным Геленбургом<\/a>, цитаделью Тёмного властелина; люди сдержали первое нашествие, демоны переходят к интригам и диверсиям. Ведущие называют выпуск «заключительным»."}, {"t": "0:04:17", "sec": 257, "html": "Завязка: демоны, погибая на земле, возрождаются в аду и возвращаются на фронт. Для наступления на <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> из всех кристаллов телепортации королевства сделана <a class=\"ref\" href=\"/a/izumrudnyy-portal/\">Изумрудная арка-портал<\/a> в ад. 500 бойцов шагают в портал, но большинство падает в лаву или разбивается; задача — уничтожить адский локомотив. Через 4 часа откроется эвакуационный портал на 1 минуту."}, {"t": "0:05:56", "sec": 356, "html": "Представление героев: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> (бывший каннибал, семья встала на путь света после появления племянника; в армии научился делать святую воду, проводить свадьбы и похороны), <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> (друид-отшельник из <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>, на праздниках превращается в козу; стал военно-полевым лекарем), <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> (дварф из Кунисских гор, обожжён драконом, вылечен в столичной больнице и отрабатывает долг в армии), <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> (эльфийка-ниндзя, бывшая наёмная убийца, помилована в обмен на службу), <a class=\"ref\" href=\"/c/vitya-mamontov/\">Витя Мамонтов<\/a> (охотник из <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>, проглотил яйцо бычьего цепня и подружился с паразитом Дружком, который общается телепатически)."}, {"t": "0:17:33", "sec": 1053, "html": "Площадь перед вокзалом среди моря лавы; толпы грешников идут к дверям. Витя встречает одноклассника Лёшу, <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> в тени от <a class=\"ref\" href=\"/c/kvir/\">Квирка<\/a> крадёт у него погребальные монеты. Герои понимают, что «сбоящие порталы» — это их собственный десант."}, {"t": "0:25:00", "sec": 1500, "html": "Демон чует запах живых, но отряд вливается в поток грешников, завернув оружие в тюки."}, {"t": "0:29:19", "sec": 1759, "html": "Досмотр: рамки-«святоискатели» и адские гусеницы, глотающие вещи. Витя роняет арбалет (критическая неудача); <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> с козьими рогами выдаёт себя за «перебежчика с контрактом» по кличке Блатной — демон пропускает отряд без очереди."}, {"t": "0:33:10", "sec": 1990, "html": "Плакат запрещённых вещей (святые символы, оружие и т.п.). Через Дружка Витя телепатически знакомится с гусеницей Камиллой — одинокой и мечтающей о путешествиях. <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> пытается её соблазнить, проваливает бросок, гусеница пищит, и демон бьёт его вилами. Тогда Витя выпускает Дружка по штанине и тот «заболтывает» Камиллу (накормленный козьим кефиром) — гусеница пропускает бочку святой воды, освящённую секиру, оружие и прочее. Отряд выдаёт себя за декораторов нового зала."}, {"t": "0:51:40", "sec": 3100, "html": "Главный зал: суккубы-близняшки за стойкой информации объясняют порядок (форма 66К, кассы, перрон) и дают буклет «Лёгкий путь грешника». На «выставке достижений адского хозяйства» в клетке «индивидуальной пытки» алабай бесконечно грызёт дварфа <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a> — праведника, попавшего в ад за единственный грех: застрелил собаку из снайперской винтовки в упор."}, {"t": "0:56:08", "sec": 3368, "html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> звонит по «дварфской связи» Эмиру — тот разрешает спасать <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a>."}, {"t": "0:58:20", "sec": 3500, "html": "Витя устраивает отвлекающий манёвр (кислотная рвота через паразита), <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> ворует шесть билетов на разные круги (гордецы, еретики, чревоугодники, самоубийцы, сладострастники, жадные)."}, {"t": "1:02:14", "sec": 3734, "html": "<a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> в зале безразличных душ (полупрозрачные грешники, не познавшие ни греха, ни праведности) поит <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> «козьим молоком» (лечение). Смотритель зала грозит свитком изгнания; Квирк изучает его — свиток может отправить любое существо вокзала в глубины ада."}, {"t": "1:06:12", "sec": 3972, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> отвлекает алабая енотовой шапкой, пущенной из арбалета, <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> ставит туманное облако, Юлиан размягчает адский замок святой водой изо рта и критом бесшумно вскрывает клетку; <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a> прячут под плащом Юлиана. <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> тем временем крадёт у безразличного смотрителя свиток изгнания."}, {"t": "1:13:03", "sec": 4383, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> проводит свадебный обряд «бракосочетание» над <a class=\"ref\" href=\"/c/yarus/\">Ярусом<\/a> и <a class=\"ref\" href=\"/c/bagira/\">Багирой<\/a> (бонус к броне и проверкам на неделю)."}, {"t": "1:15:01", "sec": 4501, "html": "У турникетов героев едва не замечают демон-муха и начальник вокзала Фламес: в ад привезли единорога, чтобы осквернить его на девятом круге и сделать третий локомотив; сейчас поездов два, и один гоняют в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. Отряд проходит турникеты по билетам как «группировка Блатного». Лицо <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана<\/a> <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> «перелепливает» силой, чтобы его не узнали."}, {"t": "1:20:07", "sec": 4807, "html": "Табло и схема ада-спирали. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> освящает святой водой всё оружие отряда (+1d6 урона святостью)."}, {"t": "1:22:35", "sec": 4955, "html": "Перрон: поезд, будка стрелочника, клетка под тентом. Дружок чует «светлое существо» — это единорог. Червь-симбионт (самый умный в отряде) выясняет: единороги призывают солнечный свет и обожают девственников; почти весь отряд признаётся, что девственники."}, {"t": "1:27:09", "sec": 5229, "html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> через прикосновение говорит с единорогом Мистером Пирожком: в топке локомотива заточён осквернённый ангел, ставший демоном; если убить его, локомотив станет грудой железа. Магию единорога блокирует узда."}, {"t": "1:29:44", "sec": 5384, "html": "Демон-муха приказывает отправить поезд в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; грешников распускают. <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> скрытно срезает узду единорога («Я девственница» — «Я чувствую, ты чиста»). Отряд крадётся к локомотиву (крит <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, маскировочный «адский» плащ Вити), <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> с поцелованным молотом Олегом убивает беса-машиниста, Дружок добивает его."}, {"t": "1:41:38", "sec": 6098, "html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> заливает в топку 55 фляг святой воды — 197 урона; из пламени выходит рогатый осквернённый ангел-демон топки."}, {"t": "1:44:55", "sec": 6295, "html": "Бой на перроне: <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> бьёт «словом солнца», Витя ультразвуковым криком оглушает суккубов, <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> с зельем турбодварфа критует молотом (39 урона), <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a>-коза в брючках бодает освящёнными рогами, <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> открывает клетку единорога и с его спины в прыжке рубит демона освящёнными катанами."}, {"t": "1:58:14", "sec": 7094, "html": "Открывается эвакуационный портал, в зал врываются сотни демонов; луч единорога наносит 66 урона святым светом, демон топки гибнет, адский огонь в его груди гаснет навсегда."}, {"t": "2:00:10", "sec": 7210, "html": "Отряд на единороге прыгает в портал; застрявшего под поездом Витю вытаскивает Дружок, сцепившись с верёвкой <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a>."}, {"t": "2:01:52", "sec": 7312, "html": "В лагере вернулись только они. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> женит <a class=\"ref\" href=\"/c/yarus/\">Яруса<\/a> и <a class=\"ref\" href=\"/c/bagira/\">Багиру<\/a> (кольцо из яблока); Витя с Дружком уходит в лес, Ярус зовёт его другом. Остаток монет — 120 000 руб. на благотворительность."}, {"t": "2:06:44", "sec": 7604, "html": "Эпилог: уничтожение локомотива замедлило пополнение демонической армии; королевские войска форсировали реку <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалию<\/a>, освободили <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a> и дошли до Геленбургского разлома — <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> полностью блокирован с суши."}], "key_events": [{"t": "0:04:17", "sec": 257}, {"t": "0:29:19", "sec": 1759}, {"t": "0:46:20", "sec": 2780}, {"t": "0:54:13", "sec": 3253}, {"t": "1:08:05", "sec": 4085}, {"t": "1:15:47", "sec": 4547}, {"t": "1:27:09", "sec": 5229}, {"t": "1:43:02", "sec": 6182}, {"t": "1:58:40", "sec": 7120}, {"t": "2:02:36", "s n/", "race": "человек, охотник-следопыт с паразитом-симбионтом", "role": "", "fate": "выжил", "id": "Витя Мамонтов", "url": "/c/vitya-mamontov/", "img": null, "other": [{"key": "53", "label": "53", "title": "В поисках Лёши"}]}], "npcs": [{"name": "Дружок", "actor": "", "actor_url": null, "race": "", "role": "бычий цепень-симбионт Вити, телепат", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Шафран Десперадо", "actor": "", "actor_url": null, "race": "", "role": "дварф-снайпер, друг Яруса, мучился в адской клетке", "fate": "спасён, лицо изменено", "id": "Шафран", "url": "/c/shafran-desperado/", "img": "img/chars/shafran.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "39", "label": "39", "title": "Кунисская пленница"}]}, {"name": "Мистер Пирожок", "actor": "", "actor_url": null, "race": "", "role": "единорог, предназначенный для осквернения в третий локомотив", "fate": "освобождён", "id": null, "url": null, "img": null, "other": []}, {"name": "Осквернённый ангел", "actor": "", "actor_url": null, "race": "", "role": "демон топки адского локомотива", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Камилла", "actor": "", "actor_url": null, "race": "", "role": "адская гусеница-святоискатель на досмотре", "fate": "выжила", "id": null, "url": null, "img": null, "other": []}, {"name": "Фламес", "actor": "", "actor_url": null, "race": "", "role": "начальник вокзала, огромный демон", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Демон-муха", "actor": "", "actor_url": null, "race": "", "role": "военный демон, требовавший поезд в Чёрный Геленбург", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": []}, {"name": "Лёша", "actor": "", "actor_url": null, "race": "", "role": "одноклассник Вити, грешник", "fate": "в аду", "id": "Лёша", "url": "/c/lyosha/", "img": "img/chars/lyosha-penisov.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, {"name": "Смотритель зала безразличных душ", "actor": "", "actor_url": null, "race": "", "role": "хранитель свитка изгнания", "fate": "выжил, лишился свитка", "id": null, "url": null, "img": null, "other": []}, {"name": "Седой генерал", "actor": "", "actor_url": null, "race": "", "role": "командир лагеря королевской армии", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "06", "label": "6", "title": "Адский поезд", "note_html": "<a class=\"ref\" href=\"/place/ad/\">Адский поезд<\/a> грешных душ", "dir": "out", "color": "#7C5CD6"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "<a class=\"ref\" href=\"/place/ad/\">Адский вокзал<\/a> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и кристалл", "dir": "out", "color": "#7C5CD6"}, {"key": "18", "label": "18", "title": "Охота на младенца", "note_html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и его семья каннибалов обратились к свету из-за племянника Лёши", "dir": "out", "color": "#2F84C8"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "Гибель <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "39", "label": "39", "title": "Кунисская пленница", "note_html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> и <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран Десперадо<\/a>, <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a> и дракон", "dir": "out", "color": "#B8901C"}, {"key": "49", "label": "49", "title": "Раненый дракон", "note_html": "<a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> вспоминает бой с драконом в Кунисских горах", "dir": "back", "color": "#B8901C"}, {"key": "53", "label": "53", "title": "В поисках Лёши", "note_html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a>, <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> и <a class=\"ref\" href=\"/c/vitya-mamontov/\">Витя Мамонтов<\/a> с Дружком — отряд из вып. 47; адский поезд уничтожен, душа друга вытащена из ада", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Это вокзал или аэропорт?» — о плакате запрещённых вещей.", "«Мы собираем элитный отряд для захвата ада. У вас у всех интеллект меньше, чем у червя. Но вы молодцы, вы старательны».", "Единорог: «Кто ты?» — <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a>: «Я девственница».", "«Я счастлив, что я в аду».", "«Властью, данной мне солнцем, пирожком, Витей, <a class=\"ref\" href=\"/c/kvir/\">Квирком<\/a> и мной — объявляю вас мужем и женой»."], "places_html": "<ul>\n<li>Места: <a class=\"ref\" href=\"/place/ad/\">Вокзал грешных душ<\/a> (Адский вокзал) в аду — площадь среди лавы, зона досмотра, главный зал, зал безразличных душ, перрон с двумя путями, кабинет Фламеса; схема ада-спирали с кругами; <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>; <a class=\"ref\" href=\"/place/kunisskie-gory/\">Кунисские горы<\/a>; <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбург<\/a>; <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a>; река <a class=\"ref\" href=\"/place/reka-rozaliya/\">Розалия<\/a>, <a class=\"ref\" href=\"/place/velikie-ravniny/\">Великие равнины<\/a>, Геленбургский разлом.<\/li>\n<li>Фракции: королевский десантный батальон армии <a class=\"ref\" href=\"/c/korol-poni-v/\">Поний V<\/a>; демоны Тёмного властелина; «группировка Блатного» (легенда отряда).<\/li>\n<li>Артефакты: <a class=\"ref\" href=\"/a/izumrudnyy-portal/\">Изумрудный портал<\/a> из кристаллов телепортации; адский локомотив на тяге осквернённого ангела; свиток изгнания; узда, блокирующая магию; бочка святой воды на 30 л/60 фляг; молот Олег; зелье турбодварфа; погребальные монеты; билеты на круги ада; буклет «Лёгкий путь грешника».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>34<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>34<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>7<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>12<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>10<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>5<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa47-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Витя Мамонтов и Дружок придуманы по рилсам Никитина<\/b><\/div><p>Персонажа с бычьим цепнем авторы предложили сами: Бреганов при подготовке пересмотрел рилсы <a class=\"ref\" href=\"/p/nikita-nikitin/\">Никиты Никитина<\/a>, и толчком стал ролик-пародия о человеке, заражённом «чужим». По задумке червь может жить снаружи не дольше 10 минут, потом слабеет он и сам Витя, поэтому Дружок должен прятаться обратно.<\/p><blockquote>«Живёт не больше 10 минут без погружения. — Потом слабеет и он, и ты.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-1\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=522\" target=\"_blank\" rel=\"noopener\">0:08:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-3\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Свадьба Яруса — его мечта ещё из выпуска 39<\/b><\/div><p>О бонусах свадьбы мастер сказал игрокам только в середине игры, и сыграть её решили не сразу. Зрители заметили, что ещё в выпуске 39 <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> называл своей мечтой жениться на «нормальной бабе»: <a class=\"ref\" href=\"/p/ilya-makarov/\">Макаров<\/a> помнил это и вёл персонажа к свадьбе с самого начала.<\/p><blockquote>«Его мечта — это найти женщину и жениться на нормальной бабе. Это его мечта из прошлого выпуска.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-3\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=1992\" target=\"_blank\" rel=\"noopener\">0:33:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-4\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Багира была изгоем среди лесных эльфов<\/b><\/div><p><a class=\"ref\" href=\"/p/nastya-li/\">Настя Ли<\/a> рассказала, что лесные эльфы презирают дварфов, но <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> в юности была среди эльфов аутсайдером, ни с кем не дружила и не впитала их стереотипов. С <a class=\"ref\" href=\"/c/yarus/\">Ярусом<\/a> они сейчас «притираются»; возможно, их по-настоящему объединяют только сражения на краю жизни.<\/p><blockquote>«Лесные эльфы презирают дварфов, но Багира была аутсайдером, со мной никто не дружил, и поэтому у меня нет этих стереотипов.»<\/blockquote><p class=\"note\">Настя Ли · <a href=\"/pod/qa47/#qa47-4\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2059\" target=\"_blank\" rel=\"noopener\">0:34:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-5\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Цели Дружка: стать с Витей единым организмом<\/b><\/div><p>Как Витя заполучил цепня, остаётся неизвестной предысторией. Червь, видимо, бесплоден или договорился с Витей и не размножается. Закрыв базовую потребность в питании, он развил высокий интеллект и телепатию, а в финале сказал, что хочет стать с Виктором единым организмом: либо они придут к симбиозу как у Венома, либо Дружок хочет забрать личность Вити.<\/p><blockquote>«Он в конце сказал: я хочу, Виктор, стать единым организмом. То есть, возможно, вы придёте к этому Веному, либо он хочет забрать мою личность.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-5\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2374\" target=\"_blank\" rel=\"noopener\">0:39:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-6\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Бесконтактный бой и энергия ци Багиры остались неиспользованными<\/b><\/div><p>У <a class=\"ref\" href=\"/c/bagira/\">Багиры<\/a> действительно была способность бесконтактного боя и запас энергии ци, но боевых сцен оказалось мало, и почти ничего из этого <a class=\"ref\" href=\"/p/nastya-li/\">Настя Ли<\/a> не применила. Мастер пояснил, что «ниндзя» в D&amp;D — это подкласс монаха, отсюда ловля снарядов и бег по стенам.<\/p><blockquote>«Ниндзя — это и есть в ДНД монах. То есть это подкласс монаха.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-6\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2503\" target=\"_blank\" rel=\"noopener\">0:41:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-7\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Без святой воды финальный бой был бы проигран<\/b><\/div><p>На вопрос, почему босс погиб, не сделав ни одного удара, авторы ответили: у демона топки было около 300 ХП, рядом стояли три суккуба, а за стеной ждали десять отрядов демонов. Внезапный первый раунд был единственным шансом. Без почти 60 литров святой воды, залитых в топку после успешной скрытности, отряду пришлось бы бежать в портал, проиграв миссию.<\/p><blockquote>«Один раунд боя вы проходите, поднимается шум, и из-за стены прибегают 10 отрядов демонов… Там надо было сливаться в портал. И вы бы проиграли.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-7\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2566\" target=\"_blank\" rel=\"noopener\">0:42:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-8\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Свиток изгнания мог убрать демона топки<\/b><\/div><p>Авторы отметили, что украденный свиток изгнания был сильным ресурсом: им можно было отправить одного мощного противника, например демона из топки, в глубины ада (по шутке <a class=\"ref\" href=\"/p/ilya-makarov/\">Макарова<\/a> — «в столовую»). В бою его так и не применили.<\/p><blockquote>«Интересная вещица, для того чтобы избавиться от одного соперника очень сильного, демона из топки телепортировать в столовую, как Макар сказал.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-8\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2693\" target=\"_blank\" rel=\"noopener\">0:44:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Таймер совпал с реальным временем съёмки; в тот же день сняли выпуск 48<\/b><\/div><p>Выпуск сняли примерно за 4,5 часа: полчаса на представление, а дальше ровно каждый час закрывалось одно деление четырёхчасового таймера. Это одна из самых коротких и динамичных съёмок. В тот же день сняли и следующий, вампирский выпуск, тоже примерно за 4,5 часа.<\/p><blockquote>«Мы вообще в тот день сняли два выпуска: ваш и следующий, который будет вампирский, и оба сняли примерно за 4,5 часа.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-9\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2945\" target=\"_blank\" rel=\"noopener\">0:49:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-10\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Шафрана спасать не планировали — он был шуткой для зрителей<\/b><\/div><p>Авторы не ожидали, что игроки станут освобождать <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафрана Десперадо<\/a>: его поместили в клетку ради шутки. После выпуска 39 было много вопросов, зачем он застрелил собаку. Отсюда версия, что он погиб праведником, но единственный грех — убийство невинной пастушьей собаки — перевесил всё остальное.<\/p><blockquote>«Мы не думали, что вы его будете освобождать. Он там был ради шутки реально.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-10\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3135\" target=\"_blank\" rel=\"noopener\">0:52:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Оседлать единорога может только девственница<\/b><\/div><p>Деталь о любви единорогов к девственникам мастер взял из мифологии и Сапковского, где к Цири приходил единорог. По его словам, оседлать единорога может только девственница-женщина: про мужчин-девственников уточнения нет.<\/p><blockquote>«Оседлать единорога может только девственница. Всё. — А девственник? — Нет такого уточнения.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-11\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3386\" target=\"_blank\" rel=\"noopener\">0:56:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-12\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранный путь через камеру хранения и бабуина Бабби<\/b><\/div><p>Если бы отряд не пошёл «путём грешника», он мог свернуть направо, в камеру хранения с бесами. Оттуда по длинному коридору, залитому ихором, адский бабуин Бабби возит на тележке конфискованное оружие к перрону для демонов. Там, скорее всего, случился бы бой; бабуина можно было бы уговорить через разговор с животными, пробежать коридор по стене (<a class=\"ref\" href=\"/c/bagira/\">Багира<\/a>) или угнать его тележку.<\/p><blockquote>«По этому коридору ходит бабуин, адский бабуин, который возит всё оружие, которое здесь забрали, сюда на перрон для демонов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-12\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3574\" target=\"_blank\" rel=\"noopener\">0:59:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-13\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Добыча в камере хранения, которую не нашли<\/b><\/div><p>Погребальный инвентарь грешников отбирают на входе: полезное бесы возвращают в земной мир, святое сбрасывают в лаву. В камере хранения отряд мог найти амулет сопротивления огню (огненный урон вдвое меньше), кисть освящения оружия (d8 божественного урона вместо d6), бутылку бесконечного кофе, палочку превращений на пять зарядов (полиморф), предмет защиты от добра и зла и коробку для заточения беса. Заточённый бес (спасбросок Мудрости 17) после освобождения час подчиняется приказам.<\/p><blockquote>«Мне нравилась коробка для заточения беса. … Если его выпустить, он будет час повиноваться всем твоим командам.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-13\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3762\" target=\"_blank\" rel=\"noopener\">1:02:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-14\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Раноед прибережён для будущих выпусков<\/b><\/div><p>Ещё одним предметом камеры хранения был жук «раноед»: если посадить его на кожу, он залезает внутрь и сперва заживляет раны как регенерация, а потом начинает есть носителя, если его не выманить на свежую рану. Мастер решил приберечь его на будущее.<\/p><blockquote>«Вот жук, пожирающий раны. Тоже прикольный, но я сейчас про него не расскажу. Мы его где-нибудь ещё заюзаем.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-14\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=3824\" target=\"_blank\" rel=\"noopener\">1:03:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-15\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ихор: из чего сделан Стикс и возрождаются демоны<\/b><\/div><p>Коридор у бабуина был залит не кислотой, а ихором. Концепцию взяли из модуля Baldur's Gate: Descent into Avernus. Ихор — это остатки демонов, из которых они затем возрождаются; из него состоит река Стикс, постоянно меняющая направление. Рядом с ихором обитают лемуры, низшие бесформенные демоны. Как у эльфийской соли, у ихора есть таблица мутаций при контакте.<\/p><blockquote>«Ихор — это остатки от демонов, которые потом перевозрождаются заново, в этом ихоре появляются заново.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-15\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4011\" target=\"_blank\" rel=\"noopener\">1:06:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-16\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вокзал построен по «Божественной комедии» Данте и Родену<\/b><\/div><p>При разработке ада авторы вдохновлялись «Божественной комедией»: круги ада, выставка пыток показывала, что ждёт глубже. Статую на площади вокзала взяли с «Врат ада» Родена, которые венчает «Мыслитель». Работа над адом шла веселее, чем над «небесной канцелярией» из выпуска о небесах.<\/p><blockquote>«Вдохновились конкретно «Божественной комедией», потому что эти круги ада показали пытки.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-16\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4136\" target=\"_blank\" rel=\"noopener\">1:08:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-17\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зал вечного ожидания — не чистилище, а участь робких душ<\/b><\/div><p>Христианства в мире ПЧК нет, поэтому нет и чистилища или лимба. В зале вечного ожидания сидят холодные робкие души: при жизни они не совершили ни зла, ни добра и всё ждали лучшего момента. Им не назначают билет на круги ада: они блекнут, становятся прозрачными и исчезают навсегда. Свежие грешники, наоборот, материальны, их можно ранить.<\/p><blockquote>«Мы поместили туда холодные робкие души, не познавшие ни победы, ни поражения, которые и при жизни жили в вечном ожидании лучшего момента.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-17\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4200\" target=\"_blank\" rel=\"noopener\">1:10:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-18\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Для гусениц-святоискателей было заготовлено одно решение<\/b><\/div><p>Авторы обычно готовят к препятствию одно-два решения на случай, если у игроков ничего не выйдет. Для гусениц-святоискателей заготовленным решением было общение с ними — телепатия Вити или разговор с животными, ведь гусеницы разумны. Подсказки также намекали, что без очереди пропускают обладателей контрактов с демонами и что можно устроить отвлекающий манёвр.<\/p><blockquote>«С гусеницами у нас реально было только вот твоя способность с ними пообщаться.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-18\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4389\" target=\"_blank\" rel=\"noopener\">1:13:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-19\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>В аду есть животные: гусеницы пойманы в адских пустошах<\/b><\/div><p>Гусеницы-святоискатели не живут на вокзале: это пойманные в адских пустошах существа (Камилла мечтала ползать там на воле), которых используют как биомеханизм. Адский бабуин Бабби тоже местное животное. Авторы специально решили, что в аду есть животные, чтобы пригодился разговор с животными.<\/p><blockquote>«Её захватили и здесь положили. — Как и бабуин Бабби, он адский.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-19\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4516\" target=\"_blank\" rel=\"noopener\">1:15:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-20\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем был таймер: эвакуационный портал открывался независимо от героев<\/b><\/div><p>Эвакуационный портал открывался ровно через 4 часа, где бы ни были герои. Тогда отряду пришлось бы выбирать: идти к цели или прыгнуть в портал, спасшись, но провалив миссию (портал мог открыться ещё в зале ожидания или камере хранения). Благодаря темпу игроков портал открылся точно в момент победы.<\/p><blockquote>«Вам приходится как команде принять решение: дойти всё-таки до вашей финальной точки миссии либо выпрыгнуть в портал и не закончить её.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-20\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4579\" target=\"_blank\" rel=\"noopener\">1:16:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-21\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Альтернативный финал: прорыв на локомотиве в Чёрный Геленбург<\/b><\/div><p>Среди рассмотренных финалов был такой: если портал открывается слишком рано, отряд жертвует эвакуацией и узнаёт по схеме ада о портале в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. Для этого готовили отдельную локацию — адское море с рельсами: погоню на локомотиве или бой в поезде. Отряд вышел бы не на солнечную поляну со свадьбой, а прямо в цитадель демонической армии. Также рассматривались гибель отряда до портала и победа с долгим ожиданием портала.<\/p><blockquote>«Ваш отряд выходит не на поляну, освещённую утренним солнцем, где происходит милая свадьба, а в цитадель демонической армии, Чёрный Геленбург.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-21\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4710\" target=\"_blank\" rel=\"noopener\">1:18:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-22\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Единорог мог сам стать двигателем поезда<\/b><\/div><p>Ещё в одном варианте отряд, пропустив портал и убив демона топки, уговорил бы единорога занять место в топке и, возможно ценой жизни, вывезти поезд через портал в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>.<\/p><blockquote>«Вы должны были тогда уговорить единорога, чтобы он сам залез туда в топку и, может быть, пожертвовав бы собой, вывез этот поезд.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-22\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4835\" target=\"_blank\" rel=\"noopener\">1:20:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-23\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Портал в Чёрный Геленбург уничтожить было нечем<\/b><\/div><p>Готового способа уничтожить портал в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> у авторов не было: это была бы «платина», доступная только при оригинальном плане самих игроков, например самодельной святой бомбе из святых вещей камеры хранения. Портал уничтожают с той стороны, где он открыт, и священным оружием — как <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> разрубила кристалл портала Карой <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> в выпуске 31.<\/p><blockquote>«Портал должен быть уничтожен с той стороны, с которой он открыт.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-23\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4901\" target=\"_blank\" rel=\"noopener\">1:21:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-24\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Демона-муху зовут Кишкадёр; разговор в кабинете Фламеса не попал в эфир<\/b><\/div><p>Авторы упомянули, что военного демона-муху зовут Кишкадёр. Его разговор с начальником вокзала Фламесом о двух локомотивах игроки должны были подслушать, если бы пошли в кабинет Фламеса; в эфире имя не прозвучало.<\/p><blockquote>«Кишкадёр и Фламес. — Да, это в эфире, по-моему, не было.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-24\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=4965\" target=\"_blank\" rel=\"noopener\">1:22:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему один уничтоженный локомотив переломил ход войны<\/b><\/div><p>Локомотивов у демонов было всего два, а доставка душ на круги ада обязательна: это энергия, без которой ад не работает. С одним поездом демоны вынуждены возить только души и больше не могут перебрасывать подкрепления в <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>. Силы людей и демонов были примерно равны, и победы не было лишь потому, что убитые демоны бесконечно возвращались. Поэтому королевская армия смогла перейти в наступление.<\/p><blockquote>«Если у них один поезд, они не будут возить демонов биться в Чёрный Геленбург, потому что это не их основная задача. Их основная задача — поддерживать работу ада.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-25\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5156\" target=\"_blank\" rel=\"noopener\">1:25:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-26\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Наступлению помогли и Добровольцы из выпуска 37<\/b><\/div><p>Блокада Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> — итог не одного выпуска: учитывается и уничтожение демонической пушки Греты в выпуске 37, и работа множества других отрядов добровольцев, сражающихся с адскими силами.<\/p><blockquote>«Не только последствия этого выпуска, но и последствия тридцать седьмого выпуска «Добровольцы», когда они уничтожили пушку.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-26\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-27\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Ярус против дракона: месть Гиммилуту откладывается<\/b><\/div><p>На вопрос, позовёт ли <a class=\"ref\" href=\"/c/yarus/\">Ярус<\/a> новых друзей против дракона, <a class=\"ref\" href=\"/p/ilya-makarov/\">Илья Макаров<\/a> ответил, что противник серьёзный: нужно хорошо подготовиться и иметь козыри в рукаве. Теперь Ярус переживает и за семью, поэтому пока он продолжает свой путь.<\/p><blockquote>«Серьёзный, на самом деле, противник. И тяжеловато втягивать друзей в такую передрягу.»<\/blockquote><p class=\"note\">Илья Макаров · <a href=\"/pod/qa47/#qa47-27\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5600\" target=\"_blank\" rel=\"noopener\">1:33:20 в видео ↗<\/a> · о выпуске <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-28\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>BRB хочет развивать Квирка<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> считает, что <a class=\"ref\" href=\"/c/kvir/\">Квирка<\/a> стоит раскрыть дальше, тем более что у него появилась логичная сюжетная линия, но решать будут авторы. Он напомнил, что Квирк — персонаж ещё из новогоднего выпуска, и пошутил, что следующего появления придётся ждать четыре года.<\/p><blockquote>«Развивать было бы супер, тем более теперь есть некая логичная линия, куда он вписывается.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa47/#qa47-28\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5729\" target=\"_blank\" rel=\"noopener\">1:35:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/02/\" title=\"Новогоднее приключение\">#2<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-29\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Из ада вывели только душу Шафрана — её статус не решён<\/b><\/div><p><a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> погиб в выпуске 39, поэтому отряд вынес из ада только его душу, к тому же изуродованную пытками и «перелепкой» лица. Авторы признали, что после свадьбы о нём забыли и теперь нужно решить по лору, кем он вышел: призраком, как барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, или неупокоенным духом-рейфом, жаждущим мести <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилуту<\/a>. Тело ему могли бы дать некромант или чумная крыса из инвентаря.<\/p><blockquote>«Нам очень нужно понять теперь, как он вышел, в каком качестве. … Если он вышел, то это будет неупокоенный призрак, который будет желать только мести.»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep47.md («Итог») пишет, что «все пятеро героев и спасённый <a class=\"ref\" href=\"/c/shafran-desperado/\">Шафран<\/a> выжили», а в разделе персонажей — что Шафран «спасён из ада». На деле Шафран мёртв с выпуска 39: из ада вынесли только его (изуродованную) душу, и в каком виде она существует, авторы ещё не решили.<\/p><p class=\"note\"><a href=\"/pod/qa47/#qa47-29\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=5854\" target=\"_blank\" rel=\"noopener\">1:37:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/39/\" title=\"Кунисская пленница\">#39<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-30\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Как ангела или единорога превращают в двигатель локомотива<\/b><\/div><p>Существа божественного происхождения (ангел, единорог, планетар) производят столько энергии, что становятся «реактором» для поезда. Демоны захватывают такое существо: единорога можно поймать, например, в Чудной Долине, приманив девственницей. Затем на него надевают демоническую вещь вроде узды, позволяющую пройти через Великую границу, и оскверняют на одном из нижних кругов ада.<\/p><blockquote>«Они производят так много энергии, что могут стать чем-то типа реактора. Поезд ездит как будто бы на реакторе с осквернённой божественной силой.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-30\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6044\" target=\"_blank\" rel=\"noopener\">1:40:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-31\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ангелин слишком слаб, чтобы стать локомотивом<\/b><\/div><p>Отвечая, грозит ли падшему <a class=\"ref\" href=\"/c/angelin/\">Ангелину<\/a> участь двигателя, авторы сказали, что для этого нужен уровень примерно 15 по D&amp;D (как у планетара); единорог подходит, а Ангелин тянет разве что на дрезину. Персонажи ПЧК в основном 4–5 уровня.<\/p><blockquote>«Ангелин для этого слаб. Чтобы стать двигателем локомотива, надо быть уровня там пятнадцатого, некий планетар.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-31\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6170\" target=\"_blank\" rel=\"noopener\">1:42:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa47-33\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Мистер Пирожок не станет спутником Багиры, но его можно призвать<\/b><\/div><p>Мастер сказал, что <a class=\"ref\" href=\"/c/bagira/\">Багира<\/a> не начнёт следующую миссию верхом на единороге, как нельзя постоянно летать на драконе. Мистер Пирожок жарит солнечным светом в радиусе около 100 м один-два раза в сутки. Он свободное существо и уйдёт, но в уплату долга позволит призвать себя, когда будет очень нужно.<\/p><blockquote>«Он тебе скажет: «Но во исполнение моего долга ты сможешь меня призвать, когда будет очень-очень нужно».»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-33\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6297\" target=\"_blank\" rel=\"noopener\">1:44:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa47-34\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Единороги — земные светлые существа; ангелов в ад затягивают контрактом<\/b><\/div><p>Единороги в лоре ПЧК — земные существа, родом из Чудной Долины (хотя родиться могут где угодно). Они всегда светлые, сопровождают светлых богов и не являются лошадьми. По гипотезе мастера, ангела в ад затягивают как <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a>: долго истязают, пока он от изнеможения не подпишет контракт и не станет адским существом. Отдать энергию поезду для него — избавление от пыток. Обратное невозможно: небесные существа не могут насильно сделать демона светлым.<\/p><blockquote>«Долго мучаем, истязаем… он сказал: «Да, я заключаю контракт» от изнеможения. И в итоге: теперь ты адское существо, мы тебя утягиваем вниз.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa47/#qa47-34\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6361\" target=\"_blank\" rel=\"noopener\">1:46:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa47-35\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Откуда «козье молоко» у Квирка<\/b><\/div><p>Зрители заметили, что коза не даёт молока без беременности. В подкасте предложили объяснение: друид превращается только в животных, которых видел, и, возможно, <a class=\"ref\" href=\"/c/kvir/\">Квирк<\/a> превращается в уже оплодотворённую козу.<\/p><blockquote>«Возможно, Квирк видел только оплодотворённую козу. И он превращается в козу, которая уже была оплодотворена.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-35\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=6552\" target=\"_blank\" rel=\"noopener\">1:49:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa51-52-42\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кай Ангел — тот самый ангел со статуи из 46-го; его держали для устрашения<\/b><\/div><p>Распятый ангел <a class=\"ref\" href=\"/c/kay-angel/\">Кай Ангел<\/a> — тот же, чья статуя была в 46-м выпуске. Демоны не увезли его делать адский локомотив, как пытались с Мистером Пирожком: публичные пытки почти божественного существа устрашали подполье <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Позже его всё равно превратили бы в локомотив.<\/p><blockquote>«Это акт устрашения, чтобы такого больше не было.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-42\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=6790\" target=\"_blank\" rel=\"noopener\">1:53:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a><\/p><\/article><\/section>", "chars": {"Багира": {"name": "Багира", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Настя Ли"], "kind": "pc", "dead": false, "race": "лесная эльфийка, ниндзя/убийца", "portraits": [], "url": "/c/bagira/", "eps": [{"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}]}, "Квирк": {"name": "Квирк", "img": "img/chars/kvirk.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9A%D0%B2%D0%B8%D1%80%D0%BA", "summary": "Квирк — друид-ветеринар из Кальтенбурга, который любит животных и умеет превращаться в козу.", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Игровой", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": false, "race": "Человек", "portraits": [], "url": "/c/kvir/", "eps": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "47", "label": "47", "title":
