<script>window.EPD = {"anim": false, "key": "24", "label": "24", "title": "Чёрный Геленбург", "date": "2024-02-19", "minutes": 108, "duration": 6466.0, "video_id": "bLVwc2WfEMg", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Разрушенный Геленбург, вернувшийся из ада; храм Солнца", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> штурмуют храм Солнца — последний «оплот бесов» в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>.", "summary_html": "Прошёл год после того, как <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> по дьявольскому контракту убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад. Герои вместе с «сопротивлением» штурмуют последний оплот бесов — храм Солнца, из которого бьёт «адский луч». В храме выясняется, что всё это время героев держало демоническое очарование: «бесы» были горожанами, а луч — защитным куполом жрецов Солнца, не выпускавшим демонов из города. Сфинктерион оказывается Падшим рыцарем, слугой Тёмного Властелина: он приказывает жрецам разрушить купол, и демоны захватывают храм. Валя остаётся с ним, а <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> отказываются присягать и улетают сквозь витраж.", "outcome_html": "<a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> окончательно во власти демонов, во главе с Падшим рыцарем <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> (с ним Валя). <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> бежали.", "world_html": ["Защитный купол над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a> уничтожен, армия демонов может идти на <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a>", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> стал Падшим рыцарем и слугой Тёмного Властелина", "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> порвала со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> хочет уничтожить <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> богов"], "scenes": [{"t": "0:04:24", "sec": 264, "html": "Вступление мастера: <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> вернули из ада в земной мир, почти весь город «зачищен», но бесы засели в храме под энергетическим куполом. Скоро «адский луч» накопит заряд и испепелит защитников. Задача — разрушить последнюю баррикаду и уничтожить источник луча."}, {"t": "0:04:28–0:09:49", "sec": null, "html": "Герои представляются. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> клянётся исправить ошибку (жрецы восстановили его родовой меч). <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> винит себя: это она загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и Валя пришли с королевским разведотрядом короля <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a>, Валю послала госпожа <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a>. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> — знаменитый охотник на монстров, пишет заметки о своих подвигах."}, {"t": "0:10:25", "sec": 625, "html": "Солдаты сопротивления привязывают к спинам героев пороховые бочки с зажжёнными фитилями: план — добежать до баррикады бесов и взорвать её. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> бочку не дали."}, {"t": "0:17:20–0:23:54", "sec": null, "html": "Боевая сцена «три раунда до взрыва». Валя уходит в скрытность, бесы с крыш стреляют огненными шипами, первые ряды солдат взрываются. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> трусит, прибегает обратно и прячется за углом, где натыкается на огромного беса."}, {"t": "0:23:43", "sec": 1423, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> швыряет бочку, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> подрывает её выстрелом из дробовика в воздухе. Баррикада частично разрушена."}, {"t": "0:27:06–0:29:23", "sec": null, "html": "Атака бесов роняет <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> стабилизирует его медицинским набором — ещё один «подвиг»."}, {"t": "0:33:41–0:35:49", "sec": null, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> срывает с <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> догорающую бочку и швыряет её к баррикаде, а затем прикрывает всех щитом Чёрного Властелина. Взрыв сносит баррикаду, никто не пострадал, бесы отступают дальше на восток."}, {"t": "0:38:01–0:42:19", "sec": null, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> находит несущую балку здания и разрубает её некротическим лучом. Крыша хоронит бесов-лучников с тяжёлыми арбалетами-«скорпионами»."}, {"t": "0:42:19–0:49:00", "sec": null, "html": "Из люка на героев смотрят огненные глаза. Валя называет себя человеком <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>, и существо пускает всех в коллектор. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> запугивает его: это бес <a class=\"ref\" href=\"/c/alan/\">Алан<\/a>, он предлагает кровавый контракт и обещает отвести в храм. Вода в коллекторе подозрительно чистая, без запаха."}, {"t": "0:49:00–0:53:11", "sec": null, "html": "<a class=\"ref\" href=\"/c/alan/\">Алан<\/a> признаётся, что соврал и хотел сбежать из города. Алана бросают в воду, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> парализует его дротиком, потом его откачивают и оставляют лежать парализованным. В кармане находят «бронзатор Б1»: по слухам, средство из храма Солнца, которое «смывает грехи»."}, {"t": "0:54:15–0:59:39", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> разведывает двор храма: огненный столб бьёт из главного здания, вокруг огневые позиции «демонов», пастбища и грядки. Главный вход заперт, изнутри идёт «тёмная эманация», а входить можно только разбив зелье против скверны. Критический успех Ларисы: она находит забаррикадированные витражные окна, люк у купола и дыру в куполе."}, {"t": "1:00:41–1:03:52", "sec": null, "html": "Войска <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> штурмуют баррикады, отряд лезет через окно. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> убивает беса некротическим лучом. Внутри видно, как «демоны-жрецы» молятся у статуи, изо рта которой бьёт поток энергии. Есть орган и шкаф с зельями."}, {"t": "1:04:56–1:07:10", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> с призванным роем крыс крадёт с полки восемь зелий: полная трансформация, сила гигантов, полёт, ускорение, жидкая удача, уязвимость, благословение, увеличение и другие."}, {"t": "1:07:10–1:09:16", "sec": null, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> не пускает внутрь барьер, и он разбивает зелье против скверны. Очарование спадает: в храме не бесы, а испуганные горожане, а луч поддерживают жрецы Солнца с криком «защитите храм». Снаружи в двери ломятся демоны."}, {"t": "1:09:16–1:13:45", "sec": null, "html": "У <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> горят красные глаза, на голове огненная корона: он Падший рыцарь. Разбитый фиал осквернил храм. Настоящий подвиг совершили не жители: город поднял из ада <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, которому нужен не земной мир, а уничтожение мира Небесного, то есть богов. Сфинктерион получил от него силу и хочет «выиграть последнюю битву в истории»."}, {"t": "1:14:55–1:16:00", "sec": null, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> внушением (спасбросок мудрости 16) приказывает пятерым жрецам разрушить купол: «стереть все границы», пусть будет одна глобальная битва добра со злом («Imagine» Леннона)."}, {"t": "1:16:00–1:18:12", "sec": null, "html": "Валя переходит на сторону <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и бьёт Ворона катаром (критический провал). <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> колеблется."}, {"t": "1:19:18–1:21:26", "sec": null, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> с жидкой удачей от крыс бросает в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> бронзатор, но флакон отскакивает от нагрудника."}, {"t": "1:21:26–1:26:49", "sec": null, "html": "Спор о «границах» и предательстве. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> бросает бомбу в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и Валю, щит поглощает почти весь урон."}, {"t": "1:26:49–1:32:13", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пытается выпить трансформацию в стометровый кислотный куб, но мастер это запрещает. Она пьёт силу гигантов (сила 27) и разбивает бронзатор о броню <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>. Святое средство обжигает его до 1 хита, но расколдовать не может."}, {"t": "1:33:14", "sec": 5594, "html": "Жрецы под внушением разбивают статую-артефакт, и защитный купол над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a> исчезает. Миссия <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> выполнена."}, {"t": "1:33:17–1:37:38", "sec": null, "html": "Таран выбивает двери, волна демонов вырезает горожан. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> просит крупного рогатого демона не трогать «своих людей» и требует от бывших спутников присяги. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> отказывается («лучше умру, держась за руку со слабыми»)."}, {"t": "1:37:38–1:42:05", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> пьют зелья полёта, ускорения и жидкой удачи. Со спасброском ловкости 18 они взлетают и уходят через разбитый витраж под обстрелом. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признаётся, что у него было скрытое задание: всю игру обманывать остальных."}, {"t": "1:43:20", "sec": 6200, "html": "Мастер: «Силы тьмы одержали верх над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, твоя армия может выдвигаться в <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a>». Заработанные за «подвиги» золотые монеты превращаются в 30 000 ₽ на благотворительность."}], "key_events": [{"t": "0:04:24", "sec": 264}, {"t": "0:31:00", "sec": 1860}, {"t": "0:44:26", "sec": 2666}, {"t": "1:05:05", "sec": 3905}, {"t": "1:08:07", "sec": 4087}, {"t": "1:09:25", "sec": 4165}, {"t": "1:15:12", "sec": 4512}, {"t": "1:31:10", "sec": 5470}, {"t": "1:33:14", "sec": 5594}, {"t": "1:42:36", "sec": 6156}], "coins": {"ep": "24", "events": [{"t": "0:25:34", "kind": "earn", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Написал в газету романтическую заметку про Валю — мастер посчитал это подвигом, достойным публикации.", "result": null, "sec": 1534, "who_url": "/c/lyucius/", "reason_html": "Написал в газету романтическую заметку про Валю — мастер посчитал это подвигом, достойным публикации."}, {"t": "0:29:27", "kind": "earn", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Бросился на помощь Сфинктериону под шквальным огнём и вернул его буквально с того света.", "result": "Сфинктерион восстановил половину здоровья.", "sec": 1767, "who_url": "/c/lyucius/", "reason_html": "Бросился на помощь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> под шквальным огнём и вернул его буквально с того света."}, {"t": "0:39:22", "kind": "spend", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "Потратила монету на дополнительный кубик к броску, упрашивая зуб мантикоры помочь ей.", "result": "Бросок прошёл успешно.", "sec": 2362, "who_url": "/c/krysa-larisa/", "reason_html": "Потратила монету на дополнительный кубик к броску, упрашивая зуб мантикоры помочь ей."}, {"t": "0:40:44", "kind": "earn", "who": "Валя", "actor": "Сергей Орлов", "to": null, "reason": "Мощной лучевой атакой разрушила здание с демонами и тяжёлыми арбалетами — засчитан подвиг.", "result": "Крыша дома обрушилась на демонов.", "sec": 2444, "who_url": "/c/valya/", "reason_html": "Мощной лучевой атакой разрушила здание с демонами и тяжёлыми арбалетами — засчитан подвиг."}, {"t": "0:56:00", "kind": "spend", "who": "Валя", "actor": "Сергей Орлов", "to": null, "reason": "Потратила монету из своего кошелька на переброс общей проверки скрытности группы у входа в храм — чёрная одежда оказалась слишком заметной.", "result": null, "sec": 3360, "who_url": "/c/valya/", "reason_html": "Потратила монету из своего кошелька на переброс общей проверки скрытности группы у входа в храм — чёрная одежда оказалась слишком заметной."}, {"t": "1:00:44", "kind": "spend", "who": "Сфинктерион", "actor": "BRB", "to": null, "reason": "Потратили монету на переброс попытки Сфинктериона пролезть в окно храма — застрял в форточке.", "result": null, "sec": 3644, "who_url": "/c/sfinkterion/", "reason_html": "Потратили монету на переброс попытки <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> пролезть в окно храма — застрял в форточке."}, {"t": "1:08:58", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Подвиг — перевернули оставленного лежать в воде человека, чтобы тот не захлебнулся артезианской водой.", "result": null, "sec": 4138, "who_url": null, "reason_html": "Подвиг — перевернули оставленного лежать в воде человека, чтобы тот не захлебнулся артезианской водой."}, {"t": "1:12:41", "kind": "earn", "who": "Сфинктерион", "actor": "BRB", "to": null, "reason": "Получил сразу две монеты за раскрытие правды об энергетическом куполе-источнике, защищающем город от демонов.", "result": null, "sec": 4361, "who_url": "/c/sfinkterion/", "reason_html": "Получил сразу две монеты за раскрытие правды об энергетическом куполе-источнике, защищающем город от демонов."}, {"t": "1:16:06", "kind": "earn", "who": "Сфинктерион", "actor": "BRB", "to": null, "reason": "Монета за следование своей легенде — произнёс речь о стирании границ и объединении через общую войну (в духе песни Imagine).", "result": null, "sec": 4566, "who_url": "/c/sfinkterion/", "reason_html": "Монета за следование своей легенде — произнёс речь о стирании границ и объединении через общую войну (в духе песни Imagine)."}, {"t": "1:24:51", "kind": "earn", "who": "Ворон Барон", "actor": "Фил Воронин", "to": null, "reason": "Выбрал остаться на стороне друзей, а не предать их ради тёмного триумфа Сфинктериона.", "result": null, "sec": 5091, "who_url": "/c/voron-baron/", "reason_html": "Выбрал остаться на стороне друзей, а не предать их ради тёмного триумфа <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>."}, {"t": "1:31:38", "kind": "other", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "Попытались потратить монету на переброс атаки бронзатором по Сфинктериону, но переброс запрещён правилами (фиксированный результат).", "result": "Монету вернули в фонд, переброс не состоялся.", "sec": 5498, "who_url": "/c/krysa-larisa/", "reason_html": "Попытались потратить монету на переброс атаки бронзатором по <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>, но переброс запрещён правилами (фиксированный результат)."}], "totals": [{"who": "Люциус", "actor": "Илья Куруч", "earned": 2, "spent": 0, "img": "img/chars/lyucius.webp", "who_url": "/c/lyucius/", "actor_url": "/p/ilya-kuruch/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 0, "spent": 1, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Валя", "actor": "Сергей Орлов", "e иса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, советник", "role": "", "fate": "выжила, сбежала", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}, {"name": "Ворон Барон", "actor": "Филипп Воронин", "actor_url": "/p/filipp-voronin/", "race": "кенку, бард-разведчик", "role": "", "fate": "выжил, сбежал", "id": "Ворон Барон", "url": "/c/voron-baron/", "img": "img/chars/voron-baron.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, {"name": "Валя", "actor": "Сергей Орлов", "actor_url": "/p/sergey-orlov/", "race": "человек, фрейлина-убийца", "role": "", "fate": "выжила, осталась с Сфинктерионом", "id": "Валя", "url": "/c/valya/", "img": "img/chars/valya.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}]}, {"name": "Люциус", "actor": "Илья Куруч", "actor_url": "/p/ilya-kuruch/", "race": "человек, охотник н  "id": null, "url": null, "img": null, "other": []}, {"name": "Севстания", "actor": "", "actor_url": null, "race": "", "role": "госпожа Вали", "fate": "упоминается", "id": "Станислава", "url": "/c/stanislava/", "img": "img/chars/sevstaniya.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}]}], "links": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "<a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a> добыт в оазисе <a class=\"ref\" href=\"/place/shish-kebab/\">Шиш Кебаб<\/a>, Валя помогала", "dir": "out", "color": "#C8423B"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — «президент», ввёл демократию", "dir": "out", "color": "#C8423B"}, {"key": "19", "label": "19", "title": "Час эльфийского суда", "note_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> и джинн; щит Чёрного Властелина у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убил <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> по дьявольскому контракту, <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад; #24 — через год", "dir": "out", "color": "#C8423B"}, {"key": "25", "label": "25", "title": "Остров соблазна", "note_html": "<a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> — цитадель Тёмного Властелина после предательства <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика", "note_html": "В столице ждут пришествия Тёмного Властелина после падения <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>", "dir": "back", "color": "#B03A7A"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> — адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, присягнувший дьяволу; осквернение храмов Солнца колбами; <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "купол, раскол отряда, Валя со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "41", "label": "41", "title": "Гонка за желанием", "note_html": "<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>", "dir": "back", "color": "#3E9A5E"}], "quotes_html": ["«Зачем быть крутым, если можно быть недосягаемым» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>.", "«Уважаемая система, дайте, пожалуйста, золотую монету» — <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> за каждый «подвиг».", "«Я лучше умру, держась за руку со слабыми, чем буду лизать жопу сильным» — <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>.", "«Мы сотрём все границы: нету добра и зла» — <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a>.", "«У нас есть город, есть храм, у нас есть всё… но нет совести»."], "places_html": "<ul>\n<li>Места: разрушенный «<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>»; баррикады бесов; коллектор под городом; храм Солнца со статуей, органом и шкафом зелий.<\/li>\n<li>Фракции: демоны Тёмного Властелина; жрецы Солнца; королевский разведотряд короля <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a>; жители <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>.<\/li>\n<li>Артефакты: <b><a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a><\/b>; восстановленный родовой меч Лёвенхартов; <b>бронзатор Б1<\/b> (жжёт нечисть как святая вода); зелье против скверны; зуб мантикоры (на удачу); бумажная роза евнуха <a class=\"ref\" href=\"/c/doni/\">Дони<\/a> (артефакт Вали, дарит воспоминания); перстень-оберег <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>; целебные черви <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a>; статуя-источник купола (уничтожена); набор храмовых зелий.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>49<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>49<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>8<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>22<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>5<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>13<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa21-42\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Чёрный Геленбург: через год город поднимется из руин как форпост ада<\/b><\/div><p>Авторы не хотят делать ад отдельной локацией: опыт «Нисхождения в Авернус» показал, что адский антураж быстро надоедает. Перед двадцать вторым выпуском пообещали иллюстрированную экспозицию. Город провалился, на его месте возникла огненная дыра, над ней сгустились чёрные небеса, и целый год туда били молнии. Затем из руин поднялся такой же, но мрачный и искорёженный <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> — форпост дьявольского мира на Земле, благодаря которому демонам больше не нужны поезда для перемещения.<\/p><blockquote>«из этих руин поднялся город, ровно такой же Геленбург, но весь мрачный, искорёженный. Геленбург — это форпост дьявольского мира, но в мире Земном»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-42\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=5776\" target=\"_blank\" rel=\"noopener\">1:36:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Скрытая мотивация Сфинктериона заменила идею «двух столов»<\/b><\/div><p>Зрители предлагали две команды за разными столами, которые в конце подерутся. Как сделать два стола, авторы не придумали. Вместо этого конфликт между игроками устроили через скрытую мотивацию <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и его идеологическое столкновение с крысой <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a>.<\/p><blockquote>«в этом приключении это удалось реализовать с помощью как раз-таки скрытой мотивации персонажа Сфинктериона и идеологического столкновения»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-1\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=67\" target=\"_blank\" rel=\"noopener\">0:01:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-2\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Газетные иллюстрации к выпуску 22: что было за год после падения Геленбурга<\/b><\/div><p>Авторы напомнили, что события между выпусками 21 и 24 показаны в газетных заголовках к выпуску 22. <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стёрт с лица земли, президент <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> пропал, <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> остался без правителя. В провал били молнии, затем город вернулся. Король выслал спасательный отряд, разведчики пропали, в столице ввели комендантский час из-за нечисти. Между падением Геленбурга и выпусками 22, 23 и 24 прошёл год.<\/p><blockquote>«Президент Сфинктерион пропал. Вёрджинвальд без правителя… В провал на месте Геленбурга бьют молнии. Город вернулся»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-2\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=129\" target=\"_blank\" rel=\"noopener\">0:02:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a>, <a href=\"/ep/23/\" title=\"Пробуждение Сосунеску\">#23<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-3\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Чёрный Геленбург — первые земли ада в земном мире<\/b><\/div><p><a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> упал в ад, но <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> вернул его в земной мир, и теперь это его форпост. По словам авторов, раньше у ада никогда не было собственных земель в мире земном.<\/p><blockquote>«Чёрный Геленбург — это форпост Тёмного Властелина в земном мире. Никогда такого не было, чтобы ад имел свои земли в мире земном»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-3\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=258\" target=\"_blank\" rel=\"noopener\">0:04:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-4\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Скрытые мотивации у постоянных игроков; BRB получил её впервые<\/b><\/div><p>У всех постоянных игроков уже были скрытые мотивации: у <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> за <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, у Данилы Поперечного (Игристое/<a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>). <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкину<\/a> её не давали, потому что «у него в голове всегда скрытая мотивация». В выпуске 24 скрытую мотивацию впервые дали <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, и только ему: как опытный игрок, он получил задание обыграть остальных. Изначально идея была немного другой.<\/p><blockquote>«в этот раз мы решили впервые дать скрытую мотивацию Big Russian Boss&#x27;у. Дали ему только одному»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-4\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=322\" target=\"_blank\" rel=\"noopener\">0:05:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сфинктерион путано объяснял мотивы, потому что они навязаны<\/b><\/div><p>Зрители писали, что <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> невнятно подавал мотивацию. Авторы ответили, что так и должно быть: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> нёс не свои мотивы, а навязанные ему <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>, и пересказывал их как запомнил.<\/p><blockquote>«так и должно быть, потому что он несёт не свои мотивы, он несёт мотивы, навязанные ему»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-5\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=387\" target=\"_blank\" rel=\"noopener\">0:06:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-6\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>BRB не сказали, что очарование идёт от щита<\/b><\/div><p>Перед игрой <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> сообщили, что сегодня он на стороне демонов: после падения <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> предстал перед <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>, и тот его убедил. Что всё дело в щите и Сфинктериона можно расколдовать, нарочно не сказали, чтобы BRB не пользовался лазейкой «расколдуйте меня». Об этом ему сообщили только после игры.<\/p><blockquote>«я специально не говорил о том, что это всё типа про щит, что его можно расколдовать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-6\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=749\" target=\"_blank\" rel=\"noopener\">0:12:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-8\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сделка с Тёмным Властелином: присягнувших не трогают<\/b><\/div><p><a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> предложил <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> сделку: если тот договорится со своими людьми, никого не тронут. Авторы уточнили, что демоны в храме убивали только сопротивлявшихся, то есть солдат с оружием, а не всех подряд. Ад в их мире в целом «законно злой».<\/p><blockquote>«Дьяволы убили только тех, кто сопротивлялся. Мы не говорим, что там убили всех»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep24.md: сказано, что горожане в храме перебиты демонами («волна демонов вырезает горожан»). По словам авторов, демоны убивали только сопротивлявшихся (солдат с оружием), а не всех.<\/p><p class=\"note\"><a href=\"/pod/qa24/#qa24-8\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1087\" target=\"_blank\" rel=\"noopener\">0:18:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-9\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дьяволы законно злые, демоны хаотично злые<\/b><\/div><p>Авторы описали мировоззрение сил ада. Дьявольский мир в целом законопослушен: дьяволы законно злые и не нарушают договоров, а демоны хаотично злые. Пример — Король Ночи и Джоффри из «Игры престолов».<\/p><blockquote>«дьявольский мир довольно законопослушный. Они законно злые… есть дьяволы, которые законно злые, есть демоны, которые хаотично злые»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-9\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1150\" target=\"_blank\" rel=\"noopener\">0:19:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-10\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Тёмный Властелин «зашёл» к Сфинктериону через спасение его народа<\/b><\/div><p>Чужую идею нельзя навязать человеку, который её совсем не разделяет. Поэтому <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> сыграл на желании <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> сохранить людей и потомство: все уже провалились в ад, и выбор был между гибелью всех и договором. Сфинктерион — законный правитель <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>, а не <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, но заботится и о жителях Геленбурга, понимая, что демоны всё равно выберутся.<\/p><blockquote>«Тёмный Властелин зашёл через сохранение детей, сохранение потомства»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-10\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1272\" target=\"_blank\" rel=\"noopener\">0:21:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa24-11\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Люциус точно появится в следующих приключениях<\/b><\/div><p>Обсуждая мерч (фигурки <a class=\"ref\" href=\"/c/voron-baron/\">Ворона Барона<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>), авторы сказали, что <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциус<\/a> точно будет появляться в следующих приключениях.<\/p><blockquote>«Люциуса, потому что Люциус точно будет появляться в следующих приключениях»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-11\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1402\" target=\"_blank\" rel=\"noopener\">0:23:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-12\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Расу кенку Филу выбрали авторы<\/b><\/div><p><a class=\"ref\" href=\"/p/filipp-voronin/\">Фил Воронин<\/a> сам расу не выбирал: о кенку он впервые узнал из карточки за час до съёмки. Он хотел играть животное. Голосовую особенность кенку (говорить только услышанными фразами) Филу всерьёз не вводили: он говорит, что тогда не смог бы шутить.<\/p><blockquote>«Нет, конечно. Я впервые о ней услышал, читая карточку за час до»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa24/#qa24-12\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1581\" target=\"_blank\" rel=\"noopener\">0:26:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-13\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Почему Ворон Барон больше не лепит из мякиша<\/b><\/div><p>Фил нарочно не стал повторять приём с хлебным мякишем из выпуска 19, чтобы не было ощущения повтора. Кроме того, художницы пожаловались ему, что замучились рисовать всё, что он лепил. Поэтому он решил пожалеть их труд.<\/p><blockquote>«они мне написали, что они замучились рисовать всё, что я из мякиша лепил. Я просто пожалел людей»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa24/#qa24-13\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1876\" target=\"_blank\" rel=\"noopener\">0:31:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-14\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Балаклава Фила — отсылка к Pussy Riot и замена банданы Куруча<\/b><\/div><p>Фил хотел сидеть в бандане, но <a class=\"ref\" href=\"/p/ilya-kuruch/\">Илья Куруч<\/a> её не отдал. Тогда Фил надел свою зимнюю балаклаву, и это «чеховское ружьё» выстрелило в финале шуткой про Pussy Riot и осквернение храма.<\/p><blockquote>«ружьё чеховское стрельнуло в конце, то есть с балаклавой»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa24/#qa24-14\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=1998\" target=\"_blank\" rel=\"noopener\">0:33:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-15\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Ворон Барон засомневался, но не присягнул<\/b><\/div><p>Фила заставило засомневаться то, что <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> мог их убить, но не убил. Ни в одном доводе Сфинктериона, однако, не было варианта без жертв. А довериться персонажу, который всю игру обманывал и начал убеждать только после выполнения задачи, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> не мог. Он переживал и за горожан в храме.<\/p><blockquote>«тяжело о доверии говорить к персонажу, когда он тебя всю игру, получается, обманывал и потом такой: «Доверяйте мне»<\/blockquote><p class=\"note\">Воронин · <a href=\"/pod/qa24/#qa24-15\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=2205\" target=\"_blank\" rel=\"noopener\">0:36:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-16\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сфинктерион — антигерой, а не злодей<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> не считает <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> отрицательным персонажем: тот просто идёт наперекор остальным. Авторы сказали, что приключения уходят в «серую зону» dark-фэнтези, но разделять добро и зло всё же надо. Сфинктериона они относят скорее к антигероям, чем к злодеям.<\/p><blockquote>«есть злодеи, а есть антигерои. Вот он всё-таки ближе к антигероям, чем злодеям»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-16\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=2760\" target=\"_blank\" rel=\"noopener\">0:46:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-17\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Превращение Ларисы в огромный кислотный куб было невозможно<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> хотел в отчаянии стать гигантским кислотным кубом, накрыть храм и защитить луч от демонов: он не знал, что луч поддерживают жрецы. Авторы ответили, что по механике заклинания размер меняется максимум на одну категорию. К тому же демонов внутри тогда не было, а куб уничтожил бы жрецов, статую и союзников.<\/p><blockquote>«это как бы невозможно было по механике заклинания, потому что ты должен оставаться, в принципе, в тех же размерах. Может, там на одну категорию»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-17\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=2975\" target=\"_blank\" rel=\"noopener\">0:49:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-18\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Сцену встречи Сфинктериона с Тёмным Властелином не играли намеренно<\/b><\/div><p>Авторы признали, что зрителям было бы интересно увидеть, как <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> попал в ад и говорил с <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмным Властелином<\/a>. Но тогда остальные игроки заранее знали бы о его перевороте, и это было бы совсем другое приключение, а выбора у очарованного героя всё равно не было.<\/p><blockquote>«было бы вам интересно посмотреть на то, как Сфинктерион опустился в ад, как он предстал перед Тёмным Властелином… Это совершенно другое приключение»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-18\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=3119\" target=\"_blank\" rel=\"noopener\">0:51:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-21\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Космология ПЧК: земной мир между адом и небесами<\/b><\/div><p>Авторы показали схему вселенной: посередине земной мир, под ним адский мир, над ним небесный. Вокруг ходит адский поезд. <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> питается любовью и энергией живущих людей, и попасть туда — привилегия немногих. Большинство грешны и попадают в ад, а ад питается душами: умерших, проданных по контрактам или отнятых ритуальными убийствами, как это делали бесы <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> и <a class=\"ref\" href=\"/c/bes-kapuchino/\">Капучин<\/a>.<\/p><blockquote>«мир небесный питается энергией живущих людей… А ад питается душами попавших людей, либо контрактами, или забранными, как Миша и Капучин делали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-21\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=3445\" target=\"_blank\" rel=\"noopener\">0:57:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-22\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Цель Тёмного Властелина — не земной мир, а уничтожение небес<\/b><\/div><p><a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> нарушил баланс миров, и поднял его сам <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, а не люди. <a class=\"ref\" href=\"/place/zemnoy-mir/\">Земной мир<\/a> ему нужен только как источник силы. Он хочет поквитаться с Небесным миром, потому что небеса «назначили» дьяволов дьяволами, а себя объявили богами.<\/p><blockquote>«Тёмный Властелин хочет поквитаться с миром небесным. Он хочет его уничтожить. Ведь именно небеса назначили дьяволов дьяволами, а себя объявили богами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-22\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=3481\" target=\"_blank\" rel=\"noopener\">0:58:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-23\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Идея «стереть все границы» в духе «Imagine» Леннона<\/b><\/div><p>Мотивацию <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> объясняли <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> через песню «Imagine». Вселенский мир якобы достижим, только если уничтожить все границы: королевств, религий и трёх миров. Для этого нужна последняя война: земные жители присягают аду и тем спасаются, их энергия помогает аду добраться до небес, а когда небеса падут и миры объединятся, наступит покой. Авторы сами считают идею утопичной.<\/p><blockquote>«добиться вселенского мира можно только единственным способом: уничтожив все границы, которые только существуют, объединив все три мира»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-23\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=3674\" target=\"_blank\" rel=\"noopener\">1:01:14 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-24\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Посыл дьяволов людям: «боги не отвечают, мы всегда рядом»<\/b><\/div><p>Авторы изложили, как демоны вербуют сторонников. Боги не отвечают на молитвы: жрецу, молящемуся всю жизнь, разве что под конец перепадёт хорошее заклинание. Дьяволы, демоны и бесы всегда рядом и дают силу при жизни по контракту, как <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>.<\/p><blockquote>«Боги не отвечают на ваши молитвы, а мы, дьяволы, демоны, бесы, мы всегда рядом. Заключите с нами контракт»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-24\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4063\" target=\"_blank\" rel=\"noopener\">1:07:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Очарование не спало, потому что его источник — щит, а не Сфинктерион<\/b><\/div><p>Бреганов объяснил, почему очарование не рассеялось, когда <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> лежал без сознания. Источником был не сам Сфинктерион, а <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>, который никто не обезвредил. Авторы добавили, что концентрацию на усиленном массовом внушении через щит держал сам <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>. Этим же внушением Сфинктерион подчинил жрецов.<\/p><blockquote>«не сам Сфинктерион был источником этого очарования, а щит. Щит же никто не обезвредил»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa24/#qa24-25\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4254\" target=\"_blank\" rel=\"noopener\">1:10:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-26\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Гудков принимал бронзатор за «расколдователь»<\/b><\/div><p><a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пыталась вернуть <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> думал, что бронзатор Б1 снимет очарование. На деле средство лишь жгло нечисть. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> добавил, что не знал о связи щита с очарованием.<\/p><blockquote>«он думал, что бронзатор работает с этим, как его, расколдователем»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-26\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4382\" target=\"_blank\" rel=\"noopener\">1:13:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa24-27\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Тёмный Властелин может снять очарование и дать Сфинктериону выбор<\/b><\/div><p><a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> сделали очарованным, потому что за один выпуск он сам к такому решению прийти не мог: он считал дьяволов врагами, и событий для такой трансформации не было. Со временем <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> может отпустить концентрацию, и тогда Сфинктерион сам примет решение.<\/p><blockquote>«в какой-то момент Тёмный Властелин может отпустить эту концентрацию и дать Сфинктериону возможность принимать своё собственное решение»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-27\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4445\" target=\"_blank\" rel=\"noopener\">1:14:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa24-28\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Будущая команда Сфинктериона: подходит Лос Ускаманос<\/b><\/div><p>Авторы спросили <a class=\"ref\" href=\"/p/brb/\">BRB<\/a>, готов ли он играть <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> с новой идеологией или тот станет NPC. BRB готов. Обсуждали, кто войдёт в его команду. Беса Мишу отвергли (ему нужны земные наслаждения), а <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> подходит: он верен Сфинктериону, симпатизировал жрецам, и его судьба после падения неизвестна. <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что сыграет за «тёмную» сторону, если ему пропишут мотивацию.<\/p><blockquote>«Лос Ускаманос, персонаж Чебаткова, он подойдёт в эту команду, потому что он верен Сфинктериону»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-28\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4540\" target=\"_blank\" rel=\"noopener\">1:15:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/41/\" title=\"Гонка за желанием\">#41<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-29\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Голос Ларисы зависит не только от щита<\/b><\/div><p>«Животная речь» щита работает наоборот: позволяет животному говорить человеческим языком. Это не эксклюзив щита, а одно из заклинаний мира, его можно найти и сделать постоянным. Кроме того, если в партии будет друид, говорящий с животными, <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларису<\/a> по правилу «что слышит один, слышат все» будут понимать все игроки. Авторы допустили и сюжет, где Лариса теряет и ищет голос.<\/p><blockquote>«это не эксклюзив щита, это одно из заклинаний в этом мире. Это заклинание можно найти где угодно и сделать его на постоянной основе»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-29\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4817\" target=\"_blank\" rel=\"noopener\">1:20:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-30\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Разная сложность бросков бочек — из-за расстояния<\/b><\/div><p><a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> бросал бочку в первом раунде, когда до баррикады было далеко (сложность 16), а Валя — во втором раунде, когда подбежали ближе (сложность 10).<\/p><blockquote>«Зависит от расстояния. Сфинктерион кидал бочку в первом раунде, когда было далеко»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-30\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=4893\" target=\"_blank\" rel=\"noopener\">1:21:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-33\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Тёмный Властелин — «лорд ада», но не обязательно его правитель<\/b><\/div><p>На вопрос, один ли повелитель демонов или их много, как в D&amp;D, авторы ответили, что в аду вертикаль власти с главной фигурой наверху. При этом <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> называется лордом ада, но не факт, что он правитель или главный. Подробности обещали раскрыть в будущих приключениях.<\/p><blockquote>«Тёмный Властелин, он называется лорд ада, но не факт, что он правитель конкретного… не факт, что он там главный»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-33\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5072\" target=\"_blank\" rel=\"noopener\">1:24:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-34\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>«Бес» за углом, где пряталась Валя, был паладином<\/b><\/div><p>Огромный «бес» за углом был обычным паладином, который охранял подступы к стрелкам на крыше. Когда появились противники, он отступил на следующую линию обороны.<\/p><blockquote>«За углом стоял обычный паладин, который защищал этот небольшой угол от посягательств демонов, как он думал тогда»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-34\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5177\" target=\"_blank\" rel=\"noopener\">1:26:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-35\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Фитили на бочках подожгли сразу, чтобы не дать задуматься<\/b><\/div><p>Мастер не дал героям обсудить план с бочками, потому что этого хотели демоны: торопить героев, чтобы те быстрее оказались в бою и не задавали «странных критических вопросов». Авторы заметили, что спешка почти всегда заставляет принимать неверные решения.<\/p><blockquote>«демоны хотели заставить их как можно быстрее действовать… и не вызывать как раз-таки вот этих странных критических вопросов»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa24/#qa24-35\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5241\" target=\"_blank\" rel=\"noopener\">1:27:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-36\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Вода в коллекторе была святой — подсказка, которую упустили<\/b><\/div><p>Вода в коллекторе была святой: если бы в неё толкнули <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>, он бы зашипел. <a class=\"ref\" href=\"/c/alan/\">Алан<\/a> не зашипел, потому что был человеком. Мастер намекал, что вода чистая и не пахнет канализацией. Отметку «критический уровень» игроки поняли как угрозу затопления, хотя она означала, что воды осталось мало.<\/p><blockquote>«когда мы кинули беса в воду, он не зашипел… а тебя бы мы толкнули, ты бы зашипел»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-36\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5288\" target=\"_blank\" rel=\"noopener\">1:28:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa24-37\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранная концовка: рычаг за статуей и святая вода из резервуара<\/b><\/div><p>Под храмом был резервуар святой воды ровно на один залп. За статуей находился рычаг с надписью «При появлении демонов разбить стекло, дёрнуть рычаг»: вода шла через крышу, как пожарный ороситель. В идеальном сценарии <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> оскверняет храм, очарование спадает, герои побеждают ослабленного Сфинктериона, по подсказке мастера уничтожают пульсирующий щит в божественном огне статуи, и Сфинктерион становится добрым. Ворвавшихся демонов смывают святой водой.<\/p><blockquote>«При появлении демонов разбить стекло, дёрнуть рычаг. Когда ты дёргаешь рычаг, вода из резервуара идёт через крышу и поливает, как пожарная поливалка»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-37\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5447\" target=\"_blank\" rel=\"noopener\">1:30:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa24-38\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Орган в храме давал вдохновение<\/b><\/div><p>Орган в храме был «органом вдохновения»: любое доброе существо, сыгравшее на нём, получало вдохновение d8. Это тоже был путь к победе.<\/p><blockquote>«Любое доброе существо, которое играет на этом органе, получает вдохновение D8»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-38\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5765\" target=\"_blank\" rel=\"noopener\">1:36:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-39\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Сфинктериона спасла единица на d10<\/b><\/div><p><a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> был в очень слабой позиции. При последней атаке <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> выкинул единицу на d10: выпади два, и Сфинктерион был бы мёртв.<\/p><blockquote>«Ты на D10 выкинул единицу. Если бы ты выкинул два, Сфинктерион был бы мёртв»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-39\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5765\" target=\"_blank\" rel=\"noopener\">1:36:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-40\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зелья временные; жрец не дёрнул рычаг из-за паники<\/b><\/div><p>Эффекты выпитых зелий временные, от 10 ходов до суток, так что сила гигантов у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> пройдёт. Жрецы не дёрнули рычаг сами: после взрыва статуи началась паника, многие были очарованы или без сознания, а сюжетно NPC не должен решать исход за игроков.<\/p><blockquote>«это было бы не прикольно по сюжету, если бы какой-то NPC решал судьбу других NPC»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-40\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=5959\" target=\"_blank\" rel=\"noopener\">1:39:19 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa24-41\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Алан — горожанин, знавший Севстанию как жену лорда<\/b><\/div><p><a class=\"ref\" href=\"/c/alan/\">Алан<\/a> был человеком, жителем <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Валю он впустил, потому что знал <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a> как жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, свою леди. В <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионе<\/a> он видел демона и слышал, что падший рыцарь на стороне демонов. Поэтому он попросил контракт, гарантирующий жизнь ему и семье, раз демоны предлагают контракты.<\/p><blockquote>«Мы в Геленбурге, он житель Геленбурга, лорд Властон и его жена Севстания. Он знал её»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> summaries/ep24.md: <a class=\"ref\" href=\"/c/alan/\">Алан<\/a> назван «трусливым бесом из коллектора». На самом деле это очарованный горожанин-человек, которого герои видели бесом.<\/p><p class=\"note\"><a href=\"/pod/qa24/#qa24-41\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=6023\" target=\"_blank\" rel=\"noopener\">1:40:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa24-42\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Правило для зала: подсказывать только по просьбе игроков<\/b><\/div><p>Авторы договорились, что зрители в зале могут подсказывать, только когда игроки сами просят помощи. Выкрики мешают съёмке и плохо слышны, их приходится титровать. Подсказки про ускоряющее зелье в выпуске 24 были из зала.<\/p><blockquote>«Если к вам обратились игроки… это о&#x27;кей. А если вы просто что-то там выкрикиваете и мешаете игрокам, когда идёт съёмка, не прикольно»<\/blockquote><p class=\"note\"><a href=\"/pod/qa24/#qa24-42\">Подкаст по #24<\/a> · <a href=\"https://youtu.be/KPSVRyWdrds?t=6285\" target=\"_blank\" rel=\"noopener\">1:44:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-7\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуски 25 и 24 снимали в один день; BRB берёг силы для Падшего рыцаря<\/b><\/div><p>«<a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров соблазна<\/a>» сняли утром (мотор в 12), а «<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>» — вечером того же дня (в 6). Утром <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> узнал, что в вечернем выпуске у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> будет скрытая мотивация (предательство), и в 25-м намеренно экономил силы. Отсюда его отстранённость.<\/p><blockquote>«когда мне сказали с утра, что у меня будет скрытая мотивация, я хотел очень хорошо отыграть второй выпуск, и первый я был пассивный»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa25/#qa25-7\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1667\" target=\"_blank\" rel=\"noopener\">0:27:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-8\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Пляжный эпизод» должен был идти до крупного выпуска, но выпуски переставили<\/b><\/div><p>Авторы назвали выпуск 25 «пляжным эпизодом» в духе аниме: спокойная серия, где снижают накал и дают развиться линиям персонажей перед крупными событиями. Но выпуски переставили местами, и пляжный вышел после «Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>».<\/p><blockquote>«только у нас, видишь, из-за того что мы переставили выпуски местами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-8\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1770\" target=\"_blank\" rel=\"noopener\">0:29:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa25-27\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь<\/b><\/div><p>Демоны входят в святые места светлого божества, только осквернив их, поэтому и осквернили храм Солнца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. В <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> демона не пустит тот же барьер. Если осквернить храм и поместить туда кристалл, тот уже не перенесёт в Небесный мир: не будет божественной эссенции. Переноситься туда могут только боги и носители божественной крови, остальным нужны особые обстоятельства. Об этом обещаны будущие приключения.<\/p><blockquote>«только боги могут переноситься в Небесный мир. Если у тебя есть божественная кровь, то тогда ты можешь переноситься»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-27\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4309\" target=\"_blank\" rel=\"noopener\">1:11:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa27-9\" data-type=\"correction\"><div class=\"pn-h\"><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>«Главный адепт Гелиоса, присягнувший дьяволу» — лорд Властон, а не Сфинктерион<\/b><\/div><p>На вопрос, кто этот адепт, авторы ответили: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Там культ Солнца был популярной, а одно время и государственной религией, и жрецы под влиянием Властона отвернулись от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>. Из-за этого предательства Гелиос потерял множество храмов и впал в «божественную депрессию».<\/p><blockquote>«О ком же речь? О Сфинктерионе? — Нет, речь шла о Властоне. Лорд Геленбурга, в котором была распространена… храм Солнца — популярная религия на юге королевства.»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> В summaries/ep27.md (раздел «Персонажи и NPC», «Упоминаются», и раздел связей про #24) главный адепт <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>, присягнувший дьяволу, назван <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>. По словам авторов, это лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>.<\/p><p class=\"note\"><a href=\"/pod/qa27/#qa27-9\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=2443\" target=\"_blank\" rel=\"noopener\">0:40:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-4\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB выяснил у авторов мотивацию Сфинктериона<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> перед игрой подробно расспросил Селезнёва о мотивации героя. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> заключил контракт, чтобы вернуть свой народ из ада, и выполняет его. Ему сказали, что есть и другие божественные дети и порталы, так что смерть этого ребёнка ничего не решит, а сам ребёнок, если его используют, выживет.<\/p><blockquote>«Мне сказали, что есть другие дети, что даже если они убьют, это вообще ничего не решит. Найдут других детей, найдут какой-нибудь портал.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa30/#qa30-4\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=1366\" target=\"_blank\" rel=\"noopener\">0:22:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa30-13\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>BRB целился переубедить Ворона Барона<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что в переговорах главной целью для него был <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a>: в прошлый раз тот колебался, а в карточке персонажа авторы прописали ему роль «мечущегося» и здравомыслящего.<\/p><blockquote>«Моей целью был Фил, потому что он в прошлый раз метался.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa30/#qa30-13\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=3805\" target=\"_blank\" rel=\"noopener\">1:03:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa30-24\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Валя никогда не была бывшей Люциуса<\/b><\/div><p><a class=\"ref\" href=\"/p/sergey-orlov/\">Сергей Орлов<\/a> в образе Вали ответил, что та никогда не была бывшей <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a>: он лишь сам к ней подкатывал. С <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> у неё сугубо рабочие отношения. Сам Орлов хотел бы сыграть мужского персонажа вместо Вали.<\/p><blockquote>«Никогда Валя не была бывшая Люциуса... только то, что он ко мне подкатывал сам, этот Люциус.»<\/blockquote><p class=\"note\">Орлов · <a href=\"/pod/qa30/#qa30-24\">Подкаст по #30<\/a> · <a href=\"https://youtu.be/7eb7Yt-FDNk?t=7095\" target=\"_blank\" rel=\"noopener\">1:58:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-28\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Щит Чёрного Властелина подавляет волю владельца<\/b><\/div><p>Авторы подтвердили теорию зрителя: <a class=\"ref\" href=\"/a/shchit-tyomnogo-vlastelina/\">Щит Чёрного Властелина<\/a>, как и меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>», задуман как артефакт со своей волей, который подавляет или меняет волю владельца. Отсюда агрессия и недоверие <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> после того, как он получил щит.<\/p><blockquote>«и щит, подавляющий волю, так же как и меч Кара Гелиоса, задумывался как артефакт со своей волей»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-28\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=5187\" target=\"_blank\" rel=\"noopener\">1:26:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a>, <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-5\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Отчасти Мишу задумали как месть Гудкова BRB<\/b><\/div><p>Один из авторов объяснил метаигровую часть замысла: <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a>, которого <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> предал в #24 и вымотал в #30, дали возможность «отомстить» Big Russian Boss, чтобы и тот испытал предательство сокомандника за столом. Гудков ответил, что не мстил, а просто следовал заданной легенде.<\/p><blockquote>«задумка была в том, чтобы дать Александру Гудкову возможность отомстить именно Биг Рашен Боссу»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-5\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3744\" target=\"_blank\" rel=\"noopener\">1:02:24 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/30/\" title=\"Ультиматум Сфинктериона\">#30<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa46-13\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Первое вступление небес в войну<\/b><\/div><p>Герои в последний раз были в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> в выпуске 24, и выпуск 46 нужен был, чтобы показать, как изменился город, — для этого нарисовали огромную карту. Впервые в бой вступили небесные силы: валькирии сделали вылазку, и баланс сил, нарушенный демонами, начал качаться в другую сторону.<\/p><blockquote>«Первый раз в бой вступили небесные существа, валькирии подключились, вылазку сделали.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa46/#qa46-13\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=2367\" target=\"_blank\" rel=\"noopener\">0:39:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Люциус сделан по образу охотника на нечисть Ильи Куруча<\/b><\/div><p>Авторы напомнили, что <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> придумали на основе образа охотника на нечисть в кожаной шляпе из пранков Ильи <a class=\"ref\" href=\"/p/ilya-kuruch/\">Куруча<\/a>; после этого прохожие стали узнавать Куруча на улице как <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люциуса<\/a>.<\/p><blockquote>«Мы на основе этого образа, вот этой кожаной шляпы, сделали Люциуса.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-2\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=913\" target=\"_blank\" rel=\"noopener\">0:15:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><\/section>", "chars": {"Люциус": {"name": "Люциус", "img": "img/chars/lyucius.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D1%8E%D1%86%D0%B8%D1%83%D1%81", "summary": "Лю́циус — знаменитый охотник на монстров, искатель приключений, подвигов и славы.", "infobox": {}, "actors": ["Илья Куруч"], "kind": "pc", "dead": false, "race": "человек, охотник на монстров", "portraits": [], "url": "/c/lyucius/", "eps": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, "Алан": {"name": "Алан", "img": "img/chars/alan.webp", "wiki_url": null, "summary": "", "info
