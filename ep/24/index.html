<script>window.EPD = {"anim": false, "key": "24", "label": "24", "title": "Чёрный Геленбург", "date": "2024-02-19", "minutes": 108, "duration": 6466.0, "video_id": "bLVwc2WfEMg", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Разрушенный Геленбург, вернувшийся из ада; храм Солнца", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> с <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисой<\/a> штурмуют храм Солнца — последний «оплот бесов» в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>.", "summary_html": "Прошёл год после того, как <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> по дьявольскому контракту убил лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> провалился в ад. Герои вместе с «сопротивлением» штурмуют последний оплот бесов — храм Солнца, из которого бьёт «адский луч». В храме выясняется, что всё это время героев держало демоническое очарование: «бесы» были горожанами, а луч — защитным куполом жрецов Солнца, не выпускавшим демонов из города. Сфинктерион оказывается Падшим рыцарем, слугой Тёмного Властелина: он приказывает жрецам разрушить купол, и демоны захватывают храм. Валя остаётся с ним, а <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> отказываются присягать и улетают сквозь витраж.", "outcome_html": "<a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> окончательно во власти демонов, во главе с Падшим рыцарем <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a> (с ним Валя). <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> бежали.", "world_html": ["Защитный купол над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a> уничтожен, армия демонов может идти на <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a>", "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> стал Падшим рыцарем и слугой Тёмного Властелина", "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> порвала со <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерионом<\/a>", "<a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a> хочет уничтожить <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> богов"], "scenes": [{"t": "0:04:24", "sec": 264, "html": "Вступление мастера: <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> вернули из ада в земной мир, почти весь город «зачищен», но бесы засели в храме под энергетическим куполом. Скоро «адский луч» накопит заряд и испепелит защитников. Задача — разрушить последнюю баррикаду и уничтожить источник луча."}, {"t": "0:04:28–0:09:49", "sec": null, "html": "Герои представляются. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> клянётся исправить ошибку (жрецы восстановили его родовой меч). <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> винит себя: это она загадала смерть <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и Валя пришли с королевским разведотрядом короля <a class=\"ref\" href=\"/place/poniya/\">Пони<\/a>, Валю послала госпожа <a class=\"ref\" href=\"/c/stanislava/\">Севстания<\/a>. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> — знаменитый охотник на монстров, пишет заметки о своих подвигах."}, {"t": "0:10:25", "sec": 625, "html": "Солдаты сопротивления привязывают к спинам героев пороховые бочки с зажжёнными фитилями: план — добежать до баррикады бесов и взорвать её. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> бочку не дали."}, {"t": "0:17:20–0:23:54", "sec": null, "html": "Боевая сцена «три раунда до взрыва». Валя уходит в скрытность, бесы с крыш стреляют огненными шипами, первые ряды солдат взрываются. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> трусит, прибегает обратно и прячется за углом, где натыкается на огромного беса."}, {"t": "0:23:43", "sec": 1423, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> швыряет бочку, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> подрывает её выстрелом из дробовика в воздухе. Баррикада частично разрушена."}, {"t": "0:27:06–0:29:23", "sec": null, "html": "Атака бесов роняет <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> стабилизирует его медицинским набором — ещё один «подвиг»."}, {"t": "0:33:41–0:35:49", "sec": null, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> срывает с <a class=\"ref\" href=\"/c/lyucius/\">Люциуса<\/a> догорающую бочку и швыряет её к баррикаде, а затем прикрывает всех щитом Тёмного Властелина. Взрыв сносит баррикаду, никто не пострадал, бесы отступают дальше на восток."}, {"t": "0:38:01–0:42:19", "sec": null, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> находит несущую балку здания и разрубает её некротическим лучом. Крыша хоронит бесов-лучников с тяжёлыми арбалетами-«скорпионами»."}, {"t": "0:42:19–0:49:00", "sec": null, "html": "Из люка на героев смотрят огненные глаза. Валя называет себя человеком <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>, и существо пускает всех в коллектор. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> запугивает его: это бес <a class=\"ref\" href=\"/c/alan/\">Алан<\/a>, он предлагает кровавый контракт и обещает отвести в храм. Вода в коллекторе подозрительно чистая, без запаха."}, {"t": "0:49:00–0:53:11", "sec": null, "html": "<a class=\"ref\" href=\"/c/alan/\">Алан<\/a> признаётся, что соврал и хотел сбежать из города. Алана бросают в воду, <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> парализует его дротиком, потом его откачивают и оставляют лежать парализованным. В кармане находят «бронзатор Б1»: по слухам, средство из храма Солнца, которое «смывает грехи»."}, {"t": "0:54:15–0:59:39", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> разведывает двор храма: огненный столб бьёт из главного здания, вокруг огневые позиции «демонов», пастбища и грядки. Главный вход заперт, изнутри идёт «тёмная эманация», а входить можно только разбив зелье против скверны. Критический успех Ларисы: она находит забаррикадированные витражные окна, люк у купола и дыру в куполе."}, {"t": "1:00:41–1:03:52", "sec": null, "html": "Войска <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> штурмуют баррикады, отряд лезет через окно. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> убивает беса некротическим лучом. Внутри видно, как «демоны-жрецы» молятся у статуи, изо рта которой бьёт поток энергии. Есть орган и шкаф с зельями."}, {"t": "1:04:56–1:07:10", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> с призванным роем крыс крадёт с полки восемь зелий: полная трансформация, сила гигантов, полёт, ускорение, жидкая удача, уязвимость, благословение, увеличение и другие."}, {"t": "1:07:10–1:09:16", "sec": null, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> не пускает внутрь барьер, и он разбивает зелье против скверны. Очарование спадает: в храме не бесы, а испуганные горожане, а луч поддерживают жрецы Солнца с криком «защитите храм». Снаружи в двери ломятся демоны."}, {"t": "1:09:16–1:13:45", "sec": null, "html": "У <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> горят красные глаза, на голове огненная корона: он Падший рыцарь. Разбитый фиал осквернил храм. Настоящий подвиг совершили не жители: город поднял из ада <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный Властелин<\/a>, которому нужен не земной мир, а уничтожение мира Небесного, то есть богов. Сфинктерион получил от него силу и хочет «выиграть последнюю битву в истории»."}, {"t": "1:14:55–1:16:00", "sec": null, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> внушением (спасбросок мудрости 16) приказывает пятерым жрецам разрушить купол: «стереть все границы», пусть будет одна глобальная битва добра со злом («Imagine» Леннона)."}, {"t": "1:16:00–1:18:12", "sec": null, "html": "Валя переходит на сторону <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и бьёт Ворона катаром (критический провал). <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> колеблется."}, {"t": "1:19:18–1:21:26", "sec": null, "html": "<a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> с жидкой удачей от крыс бросает в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> бронзатор, но флакон отскакивает от нагрудника."}, {"t": "1:21:26–1:26:49", "sec": null, "html": "Спор о «границах» и предательстве. <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> бросает бомбу в <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и Валю, щит поглощает почти весь урон."}, {"t": "1:26:49–1:32:13", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> пытается выпить трансформацию в стометровый кислотный куб, но мастер это запрещает. Она пьёт силу гигантов (сила 27) и разбивает бронзатор о броню <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>. Святое средство обжигает его до 1 хита, но расколдовать не может."}, {"t": "1:33:14", "sec": 5594, "html": "Жрецы под внушением разбивают статую-артефакт, и защитный купол над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a> исчезает. Миссия <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> выполнена."}, {"t": "1:33:17–1:37:38", "sec": null, "html": "Таран выбивает двери, волна демонов вырезает горожан. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> просит крупного рогатого демона не трогать «своих людей» и требует от бывших спутников присяги. <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> отказывается («лучше умру, держась за руку со слабыми»)."}, {"t": "1:37:38–1:42:05", "sec": null, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a>, <a class=\"ref\" href=\"/c/voron-baron/\">Ворон Барон<\/a> и <a class=\"ref\" href=\"/c/lyucius/\">Люциус<\/a> пьют зелья полёта, ускорения и жидкой удачи. Со спасброском ловкости 18 они взлетают и уходят через разбитый витраж под обстрелом. <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> признаётся, что у него было скрытое задание: всю игру обманывать остальных."}, {"t": "1:43:20", "sec": 6200, "html": "Мастер: «Силы тьмы одержали верх над <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, твоя армия может выдвигаться в <a class=\"ref\" href=\"/place/poniya/\">Понию<\/a>». Заработанные за «подвиги» золотые монеты превращаются в 30 000 ₽ на благотворительность."}], "key_events": [{"t": "0:04:24", "sec": 264}, {"t": "0:31:00", "sec": 1860}, {"t": "0:44:26", "sec": 2666}, {"t": "1:05:05", "sec": 3905}, {"t": "1:08:07", "sec": 4087}, {"t": "1:09:25", "sec": 4165}, {"t": "1:15:12", "sec": 4512}, {"t": "1:31:10", "sec": 5470}, {"t": "1:33:14", "sec": 5594}, {"t": "1:42:36", "sec": 6156}], "coins": {"ep": "24", "events": [{"t": "0:25:34", "kind": "earn", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Написал в газету романтическую заметку про Валю — мастер посчитал это подвигом, достойным публикации.", "result": null, "sec": 1534, "who_url": "/c/lyucius/", "reason_html": "Написал в газету романтическую заметку про Валю — мастер посчитал это подвигом, достойным публикации."}, {"t": "0:29:27", "kind": "earn", "who": "Люциус", "actor": "Илья Куруч", "to": null, "reason": "Бросился на помощь Сфинктериону под шквальным огнём и вернул его буквально с того света.", "result": "Сфинктерион восстановил половину здоровья.", "sec": 1767, "who_url": "/c/lyucius/", "reason_html": "Бросился на помощь <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> под шквальным огнём и вернул его буквально с того света."}, {"t": "0:39:22", "kind": "spend", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "Потратила монету на дополнительный кубик к броску, упрашивая зуб мантикоры помочь ей.", "result": "Бросок прошёл успешно.", "sec": 2362, "who_url": "/c/krysa-larisa/", "reason_html": "Потратила монету на дополнительный кубик к броску, упрашивая зуб мантикоры помочь ей."}, {"t": "0:40:44", "kind": "earn", "who": "Валя", "actor": "Сергей Орлов", "to": null, "reason": "Мощной лучевой атакой разрушила здание с демонами и тяжёлыми арбалетами — засчитан подвиг.", "result": "Крыша дома обрушилась на демонов.", "sec": 2444, "who_url": "/c/valya/", "reason_html": "Мощной лучевой атакой разрушила здание с демонами и тяжёлыми арбалетами — засчитан подвиг."}, {"t": "0:56:00", "kind": "spend", "who": "Валя", "actor": "Сергей Орлов", "to": null, "reason": "Потратила монету из своего кошелька на переброс общей проверки скрытности группы у входа в храм — чёрная одежда оказалась слишком заметной.", "result": null, "sec": 3360, "who_url": "/c/valya/", "reason_html": "Потратила монету из своего кошелька на переброс общей проверки скрытности группы у входа в храм — чёрная одежда оказалась слишком заметной."}, {"t": "1:00:44", "kind": "spend", "who": "Сфинктерион", "actor": "BRB", "to": null, "reason": "Потратили монету на переброс попытки Сфинктериона пролезть в окно храма — застрял в форточке.", "result": null, "sec": 3644, "who_url": "/c/sfinkterion/", "reason_html": "Потратили монету на переброс попытки <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> пролезть в окно храма — застрял в форточке."}, {"t": "1:08:58", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "Подвиг — перевернули оставленного лежать в воде человека, чтобы тот не захлебнулся артезианской водой.", "result": null, "sec": 4138, "who_url": null, "reason_html": "Подвиг — перевернули оставленного лежать в воде человека, чтобы тот не захлебнулся артезианской водой."}, {"t": "1:12:41", "kind": "earn", "who": "Сфинктерион", "actor": "BRB", "to": null, "reason": "Получил сразу две монеты за раскрытие правды об энергетическом куполе-источнике, защищающем город от демонов.", "result": null, "sec": 4361, "who_url": "/c/sfinkterion/", "reason_html": "Получил сразу две монеты за раскрытие правды об энергетическом куполе-источнике, защищающем город от демонов."}, {"t": "1:16:06", "kind": "earn", "who": "Сфинктерион", "actor": "BRB", "to": null, "reason": "Монета за следование своей легенде — произнёс речь о стирании границ и объединении через общую войну (в духе песни Imagine).", "result": null, "sec": 4566, "who_url": "/c/sfinkterion/", "reason_html": "Монета за следование своей легенде — произнёс речь о стирании границ и объединении через общую войну (в духе песни Imagine)."}, {"t": "1:24:51", "kind": "earn", "who": "Ворон Барон", "actor": "Фил Воронин", "to": null, "reason": "Выбрал остаться на стороне друзей, а не предать их ради тёмного триумфа Сфинктериона.", "result": null, "sec": 5091, "who_url": "/c/voron-baron/", "reason_html": "Выбрал остаться на стороне друзей, а не предать их ради тёмного триумфа <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>."}, {"t": "1:31:38", "kind": "other", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "Попытались потратить монету на переброс атаки бронзатором по Сфинктериону, но переброс запрещён правилами (фиксированный результат).", "result": "Монету вернули в фонд, переброс не состоялся.", "sec": 5498, "who_url": "/c/krysa-larisa/", "reason_html": "Попытались потратить монету на переброс атаки бронзатором по <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>, но переброс запрещён правилами (фиксированный результат)."}], "totals": [{"who": "Люциус", "actor": "Илья Куруч", "earned": 2, "spent": 0, "img": "img/chars/lyucius.webp", "who_url": "/c/lyucius/", "actor_url": "/p/ilya-kuruch/"}, {"who": "Крыса Лариса", "actor": "Гудков", "earned": 0, "spent": 1, "img": "img/chars/larisa.webp", "who_url": "/c/krysa-larisa/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Валя", "actor": "Сергей Орлов", "e иса", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "крыса, советник", "role": "", "fate": "выжила, сбежала", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Верджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}]}, {"name": "Ворон Барон", "actor": "Филипп Воронин", "actor_url": "/p/filipp-voronin/", "race": "кенку, бард-разведчик", "role": "", "fate": "выжил, сбежал", "id": "Ворон Барон", "url": "/c/voron-baron/", "img": "img/chars/voron-baron.webp", "other": [{"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}]}, {"name": "Валя", "actor": "Сергей Орлов", "actor_url": "/p/sergey-orlov/", "race": "человек, фрейлина-убийца", "role": "", "fate": "выжила, осталась с Сфинктерионом", "id": "Валя", "url": "/c/valya/", "img": "img/chars/valya.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}]}, {"name": "Люциус", "actor": "Илья Куруч", "actor_url": "/p/ilya-kuruch/", "race": "человек, охотник н
