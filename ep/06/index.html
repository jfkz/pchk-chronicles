<script>window.EPD = {"anim": false, "key": "06", "label": "6", "title": "Адский поезд", "date": "2021-09-22", "minutes": 62, "duration": 3750.0, "video_id": "NtwgMWhABAs", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Адский поезд грешных душ, идущий по морю лавы в ад (после ловушки во дворце Властона)", "short_html": "Сброшенные в люк герои <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> оказываются на адском поезде и ищут способ выбраться из ада.", "summary_html": "Продолжение выпуска 4: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> сбросил героев через люк в погребе своего дворца, и они падают на адский поезд, везущий души грешников по лавовому морю в ад. Дух убитого колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> и суккубиха <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> предлагают сделку: сжечь адский контракт Филиппа, чтобы вернуть ему тело, и добыть кристалл телепортации, висящий кулоном на шее хозяйки поезда — дьяволицы Ады Пуговой. Герои освобождают дерьмодемона, усыпляют проводника, натравливают трёхглавого пса, Барбара сжигает контракт в трубе локомотива и разоблачает предателя Филиппа, дьяволицу травят «Святым Кротом» в её любимом вине и снимают с неё кристалл. Но медиум <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> в одиночку активирует кристалл и уносится в портал; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> остаются на поезде и погибают, их души навсегда заперты в аду.", "outcome_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> бежал из ада с кристаллом телепортации; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> погибли, их души заперты в аду; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> осталась в аду.", "world_html": ["<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> мертвы (души в аду)", "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> завладел кристаллом телепортации и покинул ад", "<a class=\"ref\" href=\"/c/koldun-filipp/\">Колдун Филипп<\/a> вернул себе тело (судьба неизвестна)", "Раскрыто, что <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> и <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> имели канал связи с дьяволами"], "scenes": [{"t": "0:00:03", "sec": 3, "html": "Рекап: <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> пытался омолодиться к балу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и был убит <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> проникли во дворец Властона и уничтожили дьявольскую амфору, но Властон настиг их в винном погребе и отправил в ад."}, {"t": "0:03:53", "sec": 233, "html": "Ловушка-люк: падение над морем лавы, герои пробивают крышу последнего вагона искорёженного поезда и падают на мешки с бумагами. Задача — выбраться и вернуться в свой мир.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Провал в ад в выпуске 04 был задуман заранее\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Провал в ад в выпуске 04 был задуман заранее<\/b> Катсцена с провалом героев в бездну в конце выпуска 04 была задумана заранее как связка со следующим выпуском (адский поезд), чем бы ни кончилось приключение. <span class=\"note\">Подкаст по #21 · <a href=\"https://youtu.be/75PDShLb2xc?t=5710\" target=\"_blank\" rel=\"noopener\">1:35:10 ↗<\/a> · <a href=\"#qa21-41\">к записи<\/a><\/span><\/span>"}, {"t": "0:04:56", "sec": 296, "html": "Представление героев: <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> (уже бывал на пожизненной каторге), <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> (артист, ставший героем поневоле), <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> (хочет отомстить <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>, но «словами, без крови»), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> («я собрал эту команду — мне и выводить»)."}, {"t": "0:08:40", "sec": 520, "html": "Рекламная сценка «из преисподней»: скучающие бесы и грешница на сковородке."}, {"t": "0:11:10", "sec": 670, "html": "В почтовом вагоне — дух колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> и суккубиха <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> (её сослали из столичного борделя обратно в ад за то, что не отправляла души; Филипп обещал вернуть её в мир людей). Филипп: нужно найти и уничтожить его адский контракт — тогда вернётся тело и он вытащит всех. Контракт — у главной дьяволицы Ады или в её купе."}, {"t": "0:15:43", "sec": 943, "html": "Плацкарт, полный торчащих ног. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> отмычками вскрывает туалет: там заперт дерьмодемон Салазвон, которого бесы-проводники заставили чистить туалеты."}, {"t": "0:19:14", "sec": 1154, "html": "Салазвон дарит бутылку «Святой Крот» (0,5 л, травит любого дьявола или беса) и монету. Появляется бес-проводник; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> усыпляет его заклинанием «Сон», у него забирают универсальный ключ проводника. Дерьмодемона выпускают."}, {"t": "0:21:33", "sec": 1293, "html": "Герои ловко проходят через «частокол ног» и встречают души убитых ими во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> и дворцового повара <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a>."}, {"t": "0:23:12", "sec": 1392, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> обманом обещает <a class=\"ref\" href=\"/c/shalim/\">Шалиму<\/a> воскрешение; тот рассказывает, что в поезде есть кристалл и инструкция к нему, а заправляет всем дьяволица. Пахом телекинезом выбрасывает дух Шалима в лаву."}, {"t": "0:26:07", "sec": 1567, "html": "Купейный вагон. В купе дьяволицы — портрет тучной рыжей дьяволицы в окружении суккубов и трёхглавый пёс. <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> превращается в дьяволицу (с перебросом), пёс ей верит."}, {"t": "0:27:47", "sec": 1667, "html": "На столе два свитка: адский контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> и инструкция к кристаллу телепортации (фраза активации «<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, унеси меня в портал», переносит всех, кто касается его рукой)."}, {"t": "0:28:23", "sec": 1703, "html": "Оффтоп: <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> (<a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a>) рвёт футболку <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a> с рекламой его стендап-тура.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Зачем Кукушкин порвал футболку Соболеву\">2<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Зачем Кукушкин порвал футболку Соболеву<\/b> Зритель спросил, зачем <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> порвал футболку Ильи <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, и отнёс этот случай к «выпускам про вампиров». На самом деле это было в «Адском поезде»: <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> рвёт футболку Соболева. Кукушкин объяснил, что раз уж сцена началась, её надо было «дожать» до конца. <span class=\"note\">Никита Кукушкин отвечает на вопросы · <a href=\"https://youtu.be/sRvWxLpc8RE?t=1086\" target=\"_blank\" rel=\"noopener\">0:18:06 ↗<\/a> · <a href=\"#qa-sRvWxLpc8RE-5\">к записи<\/a><\/span><\/span>"}, {"t": "0:30:16", "sec": 1816, "html": "Суккуб-денди в костюме-тройке разоблачает самозванку (крит. провал) и нападает; проводник выпускает вонючую зомби-курицу. <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> приказывает псу — тот выбрасывает суккуба в окно и рвёт курицу; проводник запирается."}, {"t": "0:33:08", "sec": 1988, "html": "Находки: монета за картиной; в заброшенном купе — бутылка любимого вина дьяволицы «666 алых роз»."}, {"t": "0:34:52", "sec": 2092, "html": "Выламывают дверь, за которой заперся проводник: кристалл — кулон на шее дьяволицы, печь — в локомотиве, дьяволица — в вагоне-ресторане. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> надевает форму проводника (позже — поварскую), пытается сбросить беса с поезда, гоняется за ним по крыше и привязывает его к себе."}, {"t": "0:38:36", "sec": 2316, "html": "<a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> вылетает в окно и бросает контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> в трубу локомотива — Филипп материализуется. Он предлагает Барбаре сдать дьяволице души остальных в обмен на кристалл и сбежать вдвоём; Барбара (крит. успех обмана) делает вид, что согласна."}, {"t": "0:41:12", "sec": 2472, "html": "В купе с костюмами находят монету и кляп; <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> переодеваются в костюмы-тройки."}, {"t": "0:43:50", "sec": 2630, "html": "Вагон-ресторан в стиле рококо: дьяволица с суккубами; <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> предлагает ей души героев за кристалл. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> разоблачают его («он хотел украсть у тебя кристалл»). Дьяволица душит Филиппа до потери сознания."}, {"t": "0:46:26", "sec": 2786, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> в роли повара предлагает дьяволице «отведать» героев под его руководством. <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> соблазняет и уводит в туалет суккуба <a class=\"ref\" href=\"/c/maks/\">Макса<\/a> (пародист) и убивает его когтями, затем принимает его облик."}, {"t": "0:52:38", "sec": 3158, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> незаметно подливает Святой Крот в бокал; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> выдаёт его за любимое «666 алых роз». Дьяволица выпивает и начинает извергать внутренности; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> в облике <a class=\"ref\" href=\"/c/maks/\">Макса<\/a> снимает с неё кулон-кристалл."}, {"t": "0:54:40", "sec": 3280, "html": "Суккубы душат и режут <a class=\"ref\" href=\"/c/volodimir/\">Володимира<\/a>; <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> кислотой Крота ослепляет одного, <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> иллюзией «улетающего кристалла» заставляет двоих выпрыгнуть в лаву, слепого суккуба добивают из арбалета."}, {"t": "0:59:15", "sec": 3555, "html": "<a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> очнулся и просит кристалл. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> берёт кристалл «подразнить» и произносит активационную фразу — портал засасывает только его.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему кристалл врос в руку Пахома и почему убивал его\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему кристалл врос в руку Пахома и почему убивал его<\/b> <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь, когда <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> совершил злой поступок: телепортировался из адского поезда, предав друзей. Тёмный кристалл «почувствовал своего» и вступил с ним в симбиоз. В аду кристалл был силён и смог перенести Пахома в другой мир. На Земле и на небесах он ослаб, а раз Пахом остался добрым, кристалл высасывал из него силы. <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4648\" target=\"_blank\" rel=\"noopener\">1:17:28 ↗<\/a> · <a href=\"#qa27-22\">к записи<\/a><\/span><\/span>"}, {"t": "1:00:05", "sec": 3605, "html": "Итог мастера: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> победил (5 + 6 бонусных = 11 монет, 110 000 руб. — в проект «Помощь»); <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> мертвы — тела истлели, души навсегда в аду; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> до конца жизни будет работать на нудной бумажной работе.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Жанне, Динь-Диню и Володимиру некуда возвращаться: их тела исчезли\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Жанне, Динь-Диню и Володимиру некуда возвращаться: их тела исчезли<\/b> В отличие от Али, у которого тело осталось на земле, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> попали в ад телами на поезде; когда поезд въехал на территорию ада, их тела исчезли и туда добрались только души — поэтому вернуть их не во что. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6369\" target=\"_blank\" rel=\"noopener\">1:46:09 ↗<\/a> · <a href=\"#qa22-21\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:03:53", "sec": 233}, {"t": "0:11:10", "sec": 670}, {"t": "0:19:14", "sec": 1154}, {"t": "0:23:12", "sec": 1392}, {"t": "0:27:47", "sec": 1667}, {"t": "0:38:36", "sec": 2316}, {"t": "0:44:30", "sec": 2670}, {"t": "0:52:38", "sec": 3158}, {"t": "0:58:06", "sec": 3486}, {"t": "0:59:15", "sec": 3555}, {"t": "1:01:13", "sec": 3673}], "coins": {"ep": "06", "events": [{"t": "0:14:25", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "получил монету за сообразительность — придумал план найти и уничтожить контракт Филиппа с адом, чтобы выбраться", "result": null, "sec": 865, "who_url": "/c/volodimir/", "reason_html": "получил монету за сообразительность — придумал план найти и уничтожить контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> с адом, чтобы выбраться"}, {"t": "0:21:12", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "освобождённый дерьмодемон Салазвон подарил ей золотую монету (и флакон «священный крот») в благодарность", "result": null, "sec": 1272, "who_url": "/c/zhanna/", "reason_html": "освобождённый дерьмодемон Салазвон подарил ей золотую монету (и флакон «священный крот») в благодарность"}, {"t": "0:32:01", "kind": "spend", "who": "Барбара", "actor": "Шмыкова", "to": null, "reason": "потратила монету на переброс проверки харизмы, пытаясь притвориться дьяволицей на картине", "result": "переброс тоже неудачный (критический провал) — суккуб раскусил обман и атаковал", "sec": 1921, "who_url": "/c/barbara/", "reason_html": "потратила монету на переброс проверки харизмы, пытаясь притвориться дьяволицей на картине"}, {"t": "0:32:24", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "получила монету за хороший план — уговорить трёхглавого пса напасть на демонов и зомби-курицу", "result": null, "sec": 1944, "who_url": "/c/zhanna/", "reason_html": "получила монету за хороший план — уговорить трёхглавого пса напасть на демонов и зомби-курицу"}, {"t": "0:33:33", "kind": "spend", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "потратила монету на переброс проверки харизмы, чтобы отдать псу команду атаковать", "result": "переброс успешен (19) — пёс разорвал суккуба и зомби-курицу", "sec": 2013, "who_url": "/c/zhanna/", "reason_html": "потратила монету на переброс проверки харизмы, чтобы отдать псу команду атаковать"}, {"t": "0:33:36", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "при обыске купе за картиной нашли золотую монету", "result": null, "sec": 2016, "who_url": null, "reason_html": "при обыске купе за картиной нашли золотую монету"}, {"t": "0:42:25", "kind": "earn", "who": "Динь-Динь", "actor": "Гудков", "to": null, "reason": "находясь снаружи на крыше поезда, через окно разглядел золотую монету в комнате с костюмами", "result": null, "sec": 2545, "who_url": "/c/din-din/", "reason_html": "находясь снаружи на крыше поезда, через окно разглядел золотую монету в комнате с костюмами"}, {"t": "0:47:37", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "получила монету за предложенный план — соблазнить дьяволицу святым кротом", "result": null, "sec": 2857, "who_url": "/c/zhanna/", "reason_html": "получила монету за предложенный план — соблазнить дьяволицу святым кротом"}, {"t": "0:58:18", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "получил монету за удачный обман — иллюзией кристалла выманил суккубов в окно (в лаву)", "result": null, "sec": 3498, "who_url": "/c/volodimir/", "reason_html": "получил монету за удачный обман — иллюзией кристалла выманил суккубов в окно (в лаву)"}, {"t": "1:00:47", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "спасся через портал (единственный выживший), получил пять монет за спасение плюс шесть бонусных по броску d6", "result": "итого 11 монет — 110 000 руб. отправлены в благотворительный проект «Помощь»", "sec": 3647, "who_url": "/c/medium-pahom/", "reason_html": "спасся через портал (единственный выживший), получил пять монет за спасение плюс шесть бонусных по броску d6"}], "totals": [{"who": "Володимир", "actor": "Соболев", "earned": 2, "spent": 0, "img": "img/chars/volodimir.webp", "who_url": "/c/volodimir/", "actor_url": "/p/ilya-sobolev/"}, {"who": "Жанна", "actor": "Кукушкин", "earned": 3, "spent": 2, "img": "img/chars/zhanna.webp", "who_url": "/c/zhanna/", "actor_url": "/p/nikita-kukushkin/"}, {"who": "Динь-Динь", "actor": "Гудков", "earned": 1, "spent": 0, "img": "img/chars/din-din.webp", "who_url": "/c/din-din/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Пахом", "actor": "BRB", "earned": 11, "spent": 0, "img": "img/chars/pahom.webp", "who_url": "/c/medium-pahom/", "actor_url": "/p/brb/"}, {"who": "Барбара", "actor": "Шмыкова", "earned": 0, "spent": 1, "img": "img/chars/barbara.webp", "who_url": "/c/barbara/", "actor_url": null}, {"who": "неизвестно (атрибуция не читается)", "actor": null, "earned": 1, "spent": 0, "img": null, "who_url": null, "actor_url": null}], "notes": "Единственный выживший — Пахом — телепортировался домой и в одиночку унёс призовой фонд (11 монет = 110 000 руб.), остальные персонажи (Володимир, Жанна, Динь-Динь) погибли/застряли в адском поезде. Барбара — единственная, кто потратил монету безрезультатно; Жанна тратила и получала монеты почти подряд по ходу боя с трёхглавым псом."}, "cast": [{"name": "Володимир", "actor": "Илья Соболев", "actor_url": "/p/ilya-sobolev/", "race": "полурослик, головорез", "role": "", "fate": "погиб, душа заперта в аду", "id": "Володимир", "url": "/c/volodimir/", "img": "img/chars/volodimir.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}]}, {"name": "Жанна", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "эльфийка, мать Эрика и Савла", "role": "", "fate": "погибла, душа заперта в аду", "id": "Жанна", "url": "/c/zhanna/", "img": "img/chars/zhanna.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}]}, {"name": "Динь-Динь", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "лесной гном, артист-бард", "role": "", "fate": "погиб, душа заперта в аду", "id": "Динь-Динь", "url": "/c/din-din/", "img": "img/chars/din-din.webp", "other": [{"key": "02", "label": "2", "title": "Новогоднее приключение"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}], "fn_html": "<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Талала — «авторский косяк»: вторичная замена Динь-Диня\">3<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Талала — «авторский косяк»: вторичная замена Динь-Диня<\/b> Авторы признали ошибкой, что после гибели Динь-Диня дали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> по сути того же барда, сменив пол и имя, — гномку <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a>; в 10-м выпуске она «не сработала» и блёкла на фоне Динь-Диня. Тогда же сказали, что вряд ли будут использовать Талалу снова (позже она всё же вернулась в вып. 25). <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2258\" target=\"_blank\" rel=\"noopener\">0:37:38 ↗<\/a> · <a href=\"#qa18-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Освобождённая душа Динь-Диня ушла на небеса\">8<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Освобождённая душа Динь-Диня ушла на небеса<\/b> После того как <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> освободила брата, его душа, принадлежавшая аду со времён адского поезда (#6), отправилась в небесный мир. <span class=\"note\">Подкаст по #31 · <a href=\"https://youtu.be/gPaDLkZfWao?t=3057\" target=\"_blank\" rel=\"noopener\">0:50:57 ↗<\/a> · <a href=\"#qa31-20\">к записи<\/a><\/span><\/span>"}, {"name": "Пахом", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, медиум-экстрасенс", "role": "", "fate": "выжил, унесён порталом", "id": "Пахом", "url": "/c/medium-pahom/", "img": "img/chars/pahom.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "25", "label": "25", "title": "Остров соблазна"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: BRB о Пахоме: обманщик, обиженный на налоги\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>BRB о Пахоме: обманщик, обиженный на налоги<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> назвал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> «крысятником» с особым навыком обмана, не слишком добрым по своей природе, и противопоставил его прямолинейному воину <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>. Мотив Пахома из выпуска 4: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> «закошмарил» налогами его каретную мастерскую, и он решил пробраться во дворец. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=2740\" target=\"_blank\" rel=\"noopener\">0:45:40 ↗<\/a> · <a href=\"#qa17-9\">к записи<\/a><\/span><\/span>"}, {"name": "Барбара", "actor": "Варвара Шмыкова", "actor_url": "/p/varvara-shmykova/", "race": "суккуб (дьяволица)", "role": "", "fate": "осталась в аду, приговорена к бумажной работе", "id": "Барбара", "url": "/c/barbara/", "img": "img/chars/barbara.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}]}], "npcs": [{"name": "Колдун Филипп", "actor": "", "actor_url": null, "race": "", "role": "дух убитого колдуна, заказчик-предатель", "fate": "вернул тело, остался на поезде; неизвестно", "id": "Филипп", "url": "/c/koldun-filipp/", "img": "img/chars/filipp.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}]}, {"name": "Дьяволица Ада Испугова", "actor": "", "actor_url": null, "race": "", "role": "хозяйка поезда (пародия на Аллу Пугачёву)", "fate": "отравле g/chars/lord-vlaston.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "09", "label": "9", "title": "Человек в железной маске"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}]}], "links": [{"key": "01", "label": "1", "title": "Башня колдуна", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> убил колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> — здесь его дух на адском поезде", "dir": "out", "color": "#C8423B"}, {"key": "02", "label": "2", "title": "Новогоднее приключение", "note_html": "<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> погибнет в адском поезде", "dir": "back", "color": "#7D8A84"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона", "note_html": "<a class=\"ref\" href=\"/place/dvorec-vlastona/\">Дворец Властона<\/a>, уничтожение амфоры, ловушка в погребе; души <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> и повара <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> унесён порталом — продолжение его ветви (<a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a>)", "dir": "out", "color": "#7C5CD6"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "Линия адских кристаллов/Адского вокзала: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украдёт кристалл", "dir": "out", "color": "#7C5CD6"}, {"key": "25", "label": "25", "title": "Остров соблазна", "note_html": "Гибель Динь-Диня, брата <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> предал друзей в адском поезде", "dir": "back", "color": "#7C5CD6"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона", "note_html": "гном <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> погиб в адском поезде, здесь он адский гном", "dir": "back", "color": "#C8423B"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> погиб в адском поезде", "dir": "back", "color": "#7C5CD6"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/place/ad/\">Адский поезд<\/a> грешных душ", "dir": "back", "color": "#3E9A5E"}, {"key": "51", "label": "51", "title": "Точка невозврата", "note_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> — сестра гнома Динь-Диня из ветви <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Я стану тупым артистом. Как Саша <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>». — <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>", "«Мне кажется, здесь пахнет не говном, а обманом». — бес-проводник", "«Меня убили какие-то… ворвались в мою же башню во время ритуала и затыкали ножами». — дух <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a>", "«<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, унеси меня в портал». — <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a>", "«Вы сыграли в эту игру так, как вы сыграли… Я лишь только обрабатываю». — мастер"], "places_html": "<ul>\n<li><b><a class=\"ref\" href=\"/place/ad/\">Адский поезд<\/a><\/b> грешных душ, идущий по морю лавы к «столице ада»: почтовый вагон, плацкарт, купейный вагон, вагон-ресторан, локомотив с печью.<\/li>\n<li><a class=\"ref\" href=\"/place/dvorec-vlastona/\">Дворец Властона<\/a> и его винный погреб с люком-ловушкой (упоминается).<\/li>\n<li>Фракции: бесы-проводники, суккубы, Совет архидьяволов (сослал <a class=\"ref\" href=\"/c/barbara/\">Барбару<\/a>).<\/li>\n<li>Артефакты: <b>кристалл телепортации<\/b> (кулон дьяволицы; «<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, унеси меня в портал»); <b>адский контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a><\/b> (сожжён); инструкция к кристаллу; <b>«Святой Крот»<\/b> (кислота против бесов); вино «666 алых роз»; универсальный ключ проводника; дьявольская амфора (уничтожена в вып. 4).<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>9<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>9<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>2<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>3<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>1<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>2<\/small><\/button><\/div><article class=\"pnote t-clarification\" id=\"qa17-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB о Пахоме: обманщик, обиженный на налоги<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> назвал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> «крысятником» с особым навыком обмана, не слишком добрым по своей природе, и противопоставил его прямолинейному воину <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>. Мотив Пахома из выпуска 4: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> «закошмарил» налогами его каретную мастерскую, и он решил пробраться во дворец.<\/p><blockquote>«у Пахома в особых навыках обман… Пахом классный персонаж для крысятничества, и я этим пользуюсь»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa17/#qa17-9\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2740\" target=\"_blank\" rel=\"noopener\">0:45:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa-sRvWxLpc8RE-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Зачем Кукушкин порвал футболку Соболеву<\/b><\/div><p>Зритель спросил, зачем <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> порвал футболку Ильи <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a>, и отнёс этот случай к «выпускам про вампиров». На самом деле это было в «Адском поезде»: <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> рвёт футболку Соболева. Кукушкин объяснил, что раз уж сцена началась, её надо было «дожать» до конца.<\/p><blockquote>«раз мы начинаем выжимать какую-то ситуацию, нужно выжать и разорвать до конца»<\/blockquote><p class=\"note\">Кукушкин · <a href=\"/pod/qa-sRvWxLpc8RE/#qa-sRvWxLpc8RE-5\">Никита Кукушкин отвечает на вопросы<\/a> · <a href=\"https://youtu.be/sRvWxLpc8RE?t=1086\" target=\"_blank\" rel=\"noopener\">0:18:06 в видео ↗<\/a> · о выпуске <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa18-6\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Талала — «авторский косяк»: вторичная замена Динь-Диня<\/b><\/div><p>Авторы признали ошибкой, что после гибели Динь-Диня дали <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкову<\/a> по сути того же барда, сменив пол и имя, — гномку <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a>; в 10-м выпуске она «не сработала» и блёкла на фоне Динь-Диня. Тогда же сказали, что вряд ли будут использовать Талалу снова (позже она всё же вернулась в вып. 25).<\/p><blockquote>«мы дали ему гномку Талалу, и гномка Талала уже не работала в десятом выпуске… она по сравнению с Динь-Динем блёкнет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-6\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2258\" target=\"_blank\" rel=\"noopener\">0:37:38 в видео ↗<\/a> · о выпуске <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa21-10\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Альтернативная концовка: открыть шкатулку кровью Властона и уничтожить контракт<\/b><\/div><p>По задумке шкатулку можно было открыть, капнув на неё кровью живого <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (например, из пальца), и прочитать контракт. Дальше открывалась бы отдельная миссия по уничтожению контракта по образцу контракта <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> в адском поезде. Например, нести контракт с телом Властона к вулкану <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> на северо-востоке <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>, как во «Властелине колец». <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> же не открыл контракт, а исполнил его.<\/p><blockquote>«ты не открыл контракт, ты его исполнил, понимаешь. И после этого была бы отдельная миссия по уничтожению контракта»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-10\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=1233\" target=\"_blank\" rel=\"noopener\">0:20:33 в видео ↗<\/a> · о выпуске <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa21-41\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Провал в ад в выпуске 04 был задуман заранее<\/b><\/div><p>Катсцена с провалом героев в бездну в конце выпуска 04 была задумана заранее как связка со следующим выпуском (адский поезд), чем бы ни кончилось приключение.<\/p><blockquote>«катсцена была с проваливанием в ад — это просто у нас было так задумано, чисто связь со следующим выпуском»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-41\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=5710\" target=\"_blank\" rel=\"noopener\">1:35:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa22-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Жанне, Динь-Диню и Володимиру некуда возвращаться: их тела исчезли<\/b><\/div><p>В отличие от Али, у которого тело осталось на земле, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> попали в ад телами на поезде; когда поезд въехал на территорию ада, их тела исчезли и туда добрались только души — поэтому вернуть их не во что.<\/p><blockquote>«их тела исчезли, потому что они телами попали в этот поезд… у Али в отличие от них было тело на земле»<\/blockquote><p class=\"note\"><a href=\"/pod/qa22/#qa22-21\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6369\" target=\"_blank\" rel=\"noopener\">1:46:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa27-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему кристалл врос в руку Пахома и почему убивал его<\/b><\/div><p><a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> врос в ладонь, когда <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> совершил злой поступок: телепортировался из адского поезда, предав друзей. Тёмный кристалл «почувствовал своего» и вступил с ним в симбиоз. В аду кристалл был силён и смог перенести Пахома в другой мир. На Земле и на небесах он ослаб, а раз Пахом остался добрым, кристалл высасывал из него силы.<\/p><blockquote>«Мы так решили, что кристалл почувствовал своего и вступил с тобой в симбиоз… Поскольку ты оставался добрым существом, он из тебя высасывал энергию.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-22\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=4648\" target=\"_blank\" rel=\"noopener\">1:17:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/10/\" title=\"Храм Юмора\">#10<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa31-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Освобождённая душа Динь-Диня ушла на небеса<\/b><\/div><p>После того как <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> освободила брата, его душа, принадлежавшая аду со времён адского поезда (#6), отправилась в небесный мир.<\/p><blockquote>«она отправилась в Небесный мир, потому что до этого она принадлежала как раз-таки аду»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-20\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=3057\" target=\"_blank\" rel=\"noopener\">0:50:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-27\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Динь-Динь — не первый, кто вернулся из ада<\/b><\/div><p>До Динь-Диня из ада возвращались дед Али в #22 и, как напомнил зритель, повар <a class=\"ref\" href=\"/c/yudzhin/\">Юджин<\/a>. Отличие в том, что Али всегда был NPC, а <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>, бывший персонаж игрока, стал NPC только в этом приключении.<\/p><blockquote>«не только Динь-Динь у нас появлялся, Али, насколько вы можете это вспомнить, в приключении под номером 22»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-27\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=4966\" target=\"_blank\" rel=\"noopener\">1:22:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><\/section>", "chars": {"Филипп": {"name": "Колдун Филипп", "img": "img/chars/filipp.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%D0%BF", "summary": "Филипп – колдун и музыкант, близкий друг Лорда Властона. Первый антагонист вселенной «Подземелья Чикен Карри».", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Неигровой", "На вики": "Филипп"}, "actors": [], "kind": "npc", "dead": false, "race": "Человек", "portraits": [], "url": "/c/koldun-filipp/", "eps": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "06", "label": "6", "title": "Адский поезд"}]}, "Жанна": {"name": "Жанна", "img": "img/chars/zhanna.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%96%D0%B0%D0%BD%D0%BD%D0%B0", "summary": "Жа́нна Ники́тична – благородная эльфийка-воровка из Геленбурга.", "infobox": {"Пол": "Женский", "Раса": "Эльф| Тип=Игровой", "Игрок": "Никита Кукушкин"}, "actors": ["Никита Кукушкин"], "kind": "pc", "dead": true, "race": "Эльф| Тип=Игровой", "portraits": [{"ep": "6", "thumb": "img/portraits/0db78c4204988648.webp"}, {"ep": "4", "thumb": "img/portraits/fbefb4fe4f9ea508.webp"}], "url": "/c/zhanna/", "eps": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "06", "label": "6", "title": "Адский поезд"}]}, "Володимир": {"name": "Володимир", "img": "img/chars/volodimir.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%BE%D0%BB%D0%BE%D0%B4%D0%B8%D0%BC%D0%B8%D1%80", "summary": "Володимир – полурослик-головорез из Геленбурга. Несм
