<script>window.EPD = {"anim": false, "key": "06", "label": "6", "title": "Адский поезд", "date": "2021-09-22", "minutes": 62, "duration": 3750.0, "video_id": "NtwgMWhABAs", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Адский поезд грешных душ, идущий по морю лавы в ад (после ловушки во дворце Властона)", "short_html": "Сброшенные в люк герои <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> оказываются на адском поезде и ищут способ выбраться из ада.", "summary_html": "Продолжение выпуска 4: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> сбросил героев через люк в погребе своего дворца, и они падают на адский поезд, везущий души грешников по лавовому морю в ад. Дух убитого колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> и суккубиха <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> предлагают сделку: сжечь адский контракт Филиппа, чтобы вернуть ему тело, и добыть кристалл телепортации, висящий кулоном на шее хозяйки поезда — дьяволицы Ады Пуговой. Герои освобождают дерьмодемона, усыпляют проводника, натравливают трёхглавого пса, Барбара сжигает контракт в трубе локомотива и разоблачает предателя Филиппа, дьяволицу травят «Святым Кротом» в её любимом вине и снимают с неё кристалл. Но медиум <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> в одиночку активирует кристалл и уносится в портал; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> остаются на поезде и погибают, их души навсегда заперты в аду.", "outcome_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> бежал из ада с кристаллом телепортации; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> погибли, их души заперты в аду; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> осталась в аду.", "world_html": ["<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> мертвы (души в аду)", "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> завладел кристаллом телепортации и покинул ад", "<a class=\"ref\" href=\"/c/koldun-filipp/\">Колдун Филипп<\/a> вернул себе тело (судьба неизвестна)", "Раскрыто, что <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> и <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> имели канал связи с дьяволами"], "scenes": [{"t": "0:00:03", "sec": 3, "html": "Рекап: <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> пытался омолодиться к балу <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и был убит <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a>; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>, <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> проникли во дворец Властона и уничтожили дьявольскую амфору, но Властон настиг их в винном погребе и отправил в ад."}, {"t": "0:03:53", "sec": 233, "html": "Ловушка-люк: падение над морем лавы, герои пробивают крышу последнего вагона искорёженного поезда и падают на мешки с бумагами. Задача — выбраться и вернуться в свой мир."}, {"t": "0:04:56", "sec": 296, "html": "Представление героев: <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> (уже бывал на пожизненной каторге), <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> (артист, ставший героем поневоле), <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> (хочет отомстить <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>, но «словами, без крови»), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> («я собрал эту команду — мне и выводить»)."}, {"t": "0:08:40", "sec": 520, "html": "Рекламная сценка «из преисподней»: скучающие бесы и грешница на сковородке."}, {"t": "0:11:10", "sec": 670, "html": "В почтовом вагоне — дух колдуна <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> и суккубиха <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> (её сослали из столичного борделя обратно в ад за то, что не отправляла души; Филипп обещал вернуть её в мир людей). Филипп: нужно найти и уничтожить его адский контракт — тогда вернётся тело и он вытащит всех. Контракт — у главной дьяволицы Ады или в её купе."}, {"t": "0:15:43", "sec": 943, "html": "Плацкарт, полный торчащих ног. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> отмычками вскрывает туалет: там заперт дерьмодемон Салазвон, которого бесы-проводники заставили чистить туалеты."}, {"t": "0:19:14", "sec": 1154, "html": "Салазвон дарит бутылку «Святой Крот» (0,5 л, травит любого дьявола или беса) и монету. Появляется бес-проводник; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> усыпляет его заклинанием «Сон», у него забирают универсальный ключ проводника. Дерьмодемона выпускают."}, {"t": "0:21:33", "sec": 1293, "html": "Герои ловко проходят через «частокол ног» и встречают души убитых ими во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> — <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> и дворцового повара <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a>."}, {"t": "0:23:12", "sec": 1392, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> обманом обещает <a class=\"ref\" href=\"/c/shalim/\">Шалиму<\/a> воскрешение; тот рассказывает, что в поезде есть кристалл и инструкция к нему, а заправляет всем дьяволица. Пахом телекинезом выбрасывает дух Шалима в лаву."}, {"t": "0:26:07", "sec": 1567, "html": "Купейный вагон. В купе дьяволицы — портрет тучной рыжей дьяволицы в окружении суккубов и трёхглавый пёс. <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> превращается в дьяволицу (с перебросом), пёс ей верит."}, {"t": "0:27:47", "sec": 1667, "html": "На столе два свитка: адский контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> и инструкция к кристаллу телепортации (фраза активации «<a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a>, кристалл, унеси меня в портал», переносит всех, кто касается его рукой)."}, {"t": "0:28:23", "sec": 1703, "html": "Оффтоп: <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> (<a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a>) рвёт футболку <a class=\"ref\" href=\"/p/ilya-sobolev/\">Соболева<\/a> с рекламой его стендап-тура."}, {"t": "0:30:16", "sec": 1816, "html": "Суккуб-денди в костюме-тройке разоблачает самозванку (крит. провал) и нападает; проводник выпускает вонючую зомби-курицу. <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> приказывает псу — тот выбрасывает суккуба в окно и рвёт курицу; проводник запирается."}, {"t": "0:33:08", "sec": 1988, "html": "Находки: монета за картиной; в заброшенном купе — бутылка любимого вина дьяволицы «666 алых роз»."}, {"t": "0:34:52", "sec": 2092, "html": "Выламывают дверь, за которой заперся проводник: кристалл — кулон на шее дьяволицы, печь — в локомотиве, дьяволица — в вагоне-ресторане. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> надевает форму проводника (позже — поварскую), пытается сбросить беса с поезда, гоняется за ним по крыше и привязывает его к себе."}, {"t": "0:38:36", "sec": 2316, "html": "<a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> вылетает в окно и бросает контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> в трубу локомотива — Филипп материализуется. Он предлагает Барбаре сдать дьяволице души остальных в обмен на кристалл и сбежать вдвоём; Барбара (крит. успех обмана) делает вид, что согласна."}, {"t": "0:41:12", "sec": 2472, "html": "В купе с костюмами находят монету и кляп; <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> переодеваются в костюмы-тройки."}, {"t": "0:43:50", "sec": 2630, "html": "Вагон-ресторан в стиле рококо: дьяволица с суккубами; <a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> предлагает ей души героев за кристалл. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> разоблачают его («он хотел украсть у тебя кристалл»). Дьяволица душит Филиппа до потери сознания."}, {"t": "0:46:26", "sec": 2786, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> в роли повара предлагает дьяволице «отведать» героев под его руководством. <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> соблазняет и уводит в туалет суккуба <a class=\"ref\" href=\"/c/maks/\">Макса<\/a> (пародист) и убивает его когтями, затем принимает его облик."}, {"t": "0:52:38", "sec": 3158, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> незаметно подливает Святой Крот в бокал; <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> выдаёт его за любимое «666 алых роз». Дьяволица выпивает и начинает извергать внутренности; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> в облике <a class=\"ref\" href=\"/c/maks/\">Макса<\/a> снимает с неё кулон-кристалл."}, {"t": "0:54:40", "sec": 3280, "html": "Суккубы душат и режут <a class=\"ref\" href=\"/c/volodimir/\">Володимира<\/a>; <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> кислотой Крота ослепляет одного, <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> иллюзией «улетающего кристалла» заставляет двоих выпрыгнуть в лаву, слепого суккуба добивают из арбалета."}, {"t": "0:59:15", "sec": 3555, "html": "<a class=\"ref\" href=\"/c/koldun-filipp/\">Филипп<\/a> очнулся и просит кристалл. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> берёт кристалл «подразнить» и произносит активационную фразу — портал засасывает только его."}, {"t": "1:00:05", "sec": 3605, "html": "Итог мастера: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> победил (5 + 6 бонусных = 11 монет, 110 000 руб. — в проект «Помощь»); <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> и <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> мертвы — тела истлели, души навсегда в аду; <a class=\"ref\" href=\"/c/barbara/\">Барбара<\/a> до конца жизни будет работать на нудной бумажной работе."}], "key_events": [{"t": "0:03:53", "sec": 233}, {"t": "0:11:10", "sec": 670}, {"t": "0:19:14", "sec": 1154}, {"t": "0:23:12", "sec": 1392}, {"t": "0:27:47", "sec": 1667}, {"t": "0:38:36", "sec": 2316}, {"t": "0:44:30", "sec": 2670}, {"t": "0:52:38", "sec": 3158}, {"t": "0:58:06", "sec": 3486}, {"t": "0:59:15", "sec": 3555}, {"t": "1:01:13", "sec": 3673}], "coins": {"ep": "06", "events": [{"t": "0:14:25", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "получил монету за сообразительность — придумал план найти и уничтожить контракт Филиппа с адом, чтобы выбраться", "result": null, "sec": 865, "who_url": "/c/volodimir/", "reason_html": "получил монету за сообразительность — придумал план найти и уничтожить контракт <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппа<\/a> с адом, чтобы выбраться"}, {"t": "0:21:12", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "освобождённый дерьмодемон Салазвон подарил ей золотую монету (и флакон «священный крот») в благодарность", "result": null, "sec": 1272, "who_url": "/c/zhanna/", "reason_html": "освобождённый дерьмодемон Салазвон подарил ей золотую монету (и флакон «священный крот») в благодарность"}, {"t": "0:32:01", "kind": "spend", "who": "Барбара", "actor": "Шмыкова", "to": null, "reason": "потратила монету на переброс проверки харизмы, пытаясь притвориться дьяволицей на картине", "result": "переброс тоже неудачный (критический провал) — суккуб раскусил обман и атаковал", "sec": 1921, "who_url": "/c/barbara/", "reason_html": "потратила монету на переброс проверки харизмы, пытаясь притвориться дьяволицей на картине"}, {"t": "0:32:24", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "получила монету за хороший план — уговорить трёхглавого пса напасть на демонов и зомби-курицу", "result": null, "sec": 1944, "who_url": "/c/zhanna/", "reason_html": "получила монету за хороший план — уговорить трёхглавого пса напасть на демонов и зомби-курицу"}, {"t": "0:33:33", "kind": "spend", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "потратила монету на переброс проверки харизмы, чтобы отдать псу команду атаковать", "result": "переброс успешен (19) — пёс разорвал суккуба и зомби-курицу", "sec": 2013, "who_url": "/c/zhanna/", "reason_html": "потратила монету на переброс проверки харизмы, чтобы отдать псу команду атаковать"}, {"t": "0:33:36", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "при обыске купе за картиной нашли золотую монету", "result": null, "sec": 2016, "who_url": null, "reason_html": "при обыске купе за картиной нашли золотую монету"}, {"t": "0:42:25", "kind": "earn", "who": "Динь-Динь", "actor": "Гудков", "to": null, "reason": "находясь снаружи на крыше поезда, через окно разглядел золотую монету в комнате с костюмами", "result": null, "sec": 2545, "who_url": "/c/din-din/", "reason_html": "находясь снаружи на крыше поезда, через окно разглядел золотую монету в комнате с костюмами"}, {"t": "0:47:37", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "получила монету за предложенный план — соблазнить дьяволицу святым кротом", "result": null, "sec": 2857, "who_url": "/c/zhanna/", "reason_html": "получила монету за предложенный план — соблазнить дьяволицу святым кротом"}, {"t": "0:58:18", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "получил монету за удачный обман — иллюзией кристалла выманил суккубов в окно (в лаву)", "result": null, "sec": 3498, "who_url": "/c/volodimir/", "reason_html": "получил монету за удачный обман — иллюзией кристалла выманил суккубов в окно (в лаву)"}, {"t": "1:00:47", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "спасся через портал (единственный выживший), получил пять монет за спасение плюс шесть бонусных по броску d6", "result": "итого 11 монет — 110 000 руб. отправлены в
