<script>window.EPD = {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "date": "2023-10-23", "minutes": 92, "duration": 5501.0, "video_id": "lUuaBGksavU", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Геленбург, дворец лорда Властона", "short_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> понимает, что шкатулка — адская вещь под печатью демона, открываемая кровью. Эльф внедряется к верховному жрецу Гуди как ученик «Джизи», а <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> договаривается с генералом Твёрдым о перевороте; отряд убивает Гуди, генерал вырезает жрецов. Умирающий <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> подписывает мирный договор ради обещания спасти его, но Сфинктерион закалывает его. Смерть Властона исполняет инфернальный контракт в шкатулке, и Геленбург вместе с героями проваливается в преисподнюю.", "summary_html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> выясняет, что добытая шкатулка — вещь из преисподней под печатью демона, открыть которую может «лишь кровь». Эльф <a class=\"ref\" href=\"/c/los-uskomanos/\">Лос Ускаманос<\/a> в солдатской форме обманывает верховного жреца Гуди, становится его учеником «Джизи», а <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> заключает сделку с генералом Твёрдым, который готовит переворот против жрецов. Отряд убивает Гуди, генерал устраивает резню жрецов и приводит Сфинктериона к умирающему <a class=\"ref\" href=\"/c/lord-vlaston/\">Властону<\/a>; тот подписывает мирный договор в обмен на обещание спасти ему жизнь, но Сфинктерион тут же закалывает его обломком меча. Смерть Властона исполняет адский контракт в шкатулке: море закипает лавой, трещина опоясывает Геленбург, и город вместе с героями проваливается в преисподнюю.", "outcome_html": "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> мёртв, мирный договор подписан, но исполнение адского контракта отправило Геленбург вместе с героями в преисподнюю. Судьба партии неизвестна.", "world_html": ["<a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> погиб", "Мирный договор Вирджинвальда и Геленбурга подписан", "Верховный жрец Гуди и тёмные жрецы Геленбурга перебиты", "<a class=\"ref\" href=\"/c/general-tvyordyy/\">Генерал Твёрдый<\/a> устроил переворот", "Геленбург провалился в преисподнюю, море вокруг превратилось в лаву", "Исполнен инфернальный контракт <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с Лордом тьмы"], "scenes": [{"t": "0:00:00", "sec": 0, "html": "Напоминание событий части 1."}, {"t": "0:04:19", "sec": 259, "html": "Шкатулка: чёрная, без крышки и скважины, в инфернальных рунах, излучает тёмную энергию; <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> (уже имевшая дело с бесами) понимает, что это вещь из преисподней, закрытая печатью демона. Благодарный желатиновый «кисель» даёт ей монету. Лариса идёт на кухню."}, {"t": "0:06:28", "sec": 388, "html": "<a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> пытается очаровать солдата у клетки «глазами вселенной» — крит, солдат его возненавидел и сажает в клетку; кот бьёт его керамбитом, <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> вступает в бой. Которный поднимает крестьян на бунт — они валят солдата; сам кот удирает в канализационную трубу."}, {"t": "0:13:04", "sec": 784, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> разрубает второго солдата пополам; крестьяне добивают первого камнями. Сфинктерион объявляет себя их королём и освободителем, велит жениться и жить свободно; крестьянин благодарит «президента»."}, {"t": "0:15:12", "sec": 912, "html": "У фонтана говорящий ворон нагадил на <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; называет себя «просто наблюдателем», говорит, что <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> приносит в жертву даже собственных подданных, чтобы продлить жизнь на час-два, и что, выздоровев, растопчет договор. Улетает."}, {"t": "0:19:36", "sec": 1176, "html": "Офицер ведёт эльфа и <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> в главный зал: жрец на пентаграмме приносит в жертву крестьянина и собирает в сосуд его субстанцию. Эльф понимает инфернальную мантру: «забираю эту жизнь во славу Лорда тьмы, чтобы передать её его вассалу». Офицер шепчет, что жрецы «заполонили дворец» и солдаты по слову генерала Твёрдого готовы их перерезать."}, {"t": "0:22:49", "sec": 1369, "html": "Палата верховного жреца Гуди Благочестивого, который «здесь заправляет практически всем» и отбирает крестьян для ритуалов. Эльф обманом выдаёт <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> за безгрешную деву; Гуди награждает офицера и приказывает провести ритуал."}, {"t": "0:28:12", "sec": 1692, "html": "Эльф просит доверить ритуал ему, повторяет мантру на «инфернальном», получает жреческую мантию. Гуди замечает уши — эльф выдаёт себя за полукровку, ненавидящего эльфов, и с преимуществом убеждает жреца. Гуди нарекает его учеником — жрецом Джизи — и тайно поручает найти тёмную инфернальную шкатулку, не показывая её солдатам, которые готовят переворот. Эльф клянётся никогда его не предавать."}, {"t": "0:36:56", "sec": 2216, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> незаметно пересекает кухню, выходит к <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a> у трубы; мусор из трубы начинает выходить наружу — канализация прочистилась."}, {"t": "0:39:08", "sec": 2348, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> лезет по стене к балкону (офицеры сбрасывают с балкона крестьянина, которого жрецы сочли «испорченным»), вырезает стекло кулоном и проникает в женскую спальню, где генерал Твёрдый с двумя солдатами."}, {"t": "0:41:20", "sec": 2480, "html": "Переговоры: генерал наживается на войне, но хочет власти; жрецы лишь откладывают неизбежное, конкурент — жрецы «в белых платьях». Сделка: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> убивает Гуди, генерал займёт престол Геленбурга и станет другом навеки; тайный лаз ведёт из комнаты охраны в кальянную Гуди; солдаты № 11 и 12 помогают. Рукопожатие."}, {"t": "0:45:38", "sec": 2738, "html": "Лаз — задняя стенка книжного стеллажа; за ним Гуди напевает «грешник туда, грешник сюда… всех на костёр». <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> пытается разбить шкатулку: меч Лёвенхартов раскалывается, некротический луч щита поглощается шкатулкой (заряды щита уходят в неё)."}, {"t": "0:47:44", "sec": 2864, "html": "В главном зале эльф-«Джизи» пытается отложить ритуал над <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a>, два жреца не верят; он бросает дымовые шашки, и все сбегаются в комнату охраны. Руна на шкатулке: «Лишь кровь откроет меня». Кровь из раны <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> и порез <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> шкатулка впитывает, но не открывается."}, {"t": "0:53:10", "sec": 3190, "html": "<a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> на крыше заглядывает в покои <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>: лорд лежит, облысевший; рядом фаворитка Ирен Твёрдая, жрец поит его мерцающим зельем, офицеры. Кота впускают, он очаровывает Ирен, но просит помять ей грудь; жрец называет его шарлатаном, и кота вышвыривают в окно."}, {"t": "1:01:43", "sec": 3703, "html": "Отряд врывается в кальянную: некротическая молния (32 урона) превращает в пыль крестьянина и жреца и опаляет Гуди, <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> рубит его огненным топором, эльф тройной атакой добивает стилетом в лоб: «Помнишь, я говорил, что не предам тебя?» Кровь Гуди жадно впитывается шкатулкой. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> отрезает ему голову."}, {"t": "1:10:26", "sec": 4226, "html": "<a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> сквозь дым проносит генералу записку «Дело сделано». <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a>, выброшенный из окна, разбивается о скалы (37 урона), умирает и воскресает способностью «девять жизней», лезет обратно."}, {"t": "1:13:38", "sec": 4418, "html": "Генерал торжествует, отдаёт офицеру приказ — солдаты режут жрецов в главном зале. Эльф сбрасывает мантию жреца на <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> и остаётся в солдатской форме. <a class=\"ref\" href=\"/c/kotornyy/\">Которный<\/a> обыскивает комнату 7: две золотые монеты, зелье силы и зелье лечения."}, {"t": "1:18:04", "sec": 4684, "html": "Покои <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>: Ирен умоляет пощадить лорда (называет генерала «папенька»); генерал требует, чтобы <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> сам убил Властона, а договор генерал подпишет потом. Сфинктерион «дипломатом» за монету получает союзника — жреца у постели, но тот сразу мутнеет глазами и падает замертво. Ворон на окне телепатически велит <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисе<\/a>: «Убей Властона»."}, {"t": "1:21:16", "sec": 4876, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> показывает шкатулку и блефует, что может уничтожить дворец и что здание окружено; генерал останавливает офицеров. <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> узнаёт Сфинктериона и шёпотом соглашается подписать договор, если тот спасёт ему жизнь: «Мне нельзя умирать». Ирен приносит перо, Властон подписывает мирный договор."}, {"t": "1:24:36", "sec": 5076, "html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> вонзает обломок меча Лёвенхартов в горло <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>; Ирен в истерике, генерал улыбается. Шкатулка покрывается огненными рунами и открывается: из неё выплывает горящий инфернальный контракт — «Контракт исполнен»."}, {"t": "1:26:43", "sec": 5203, "html": "Море вокруг закипает и превращается в лаву, гигантская трещина опоясывает дворец и весь город, и Геленбург вместе с героями проваливается в преисподнюю."}, {"t": "1:28:52", "sec": 5332, "html": "Итог игры: осталась одна монета (10 000 руб. на благотворительность). Финальная песня: «Лёвенхарт, ты исполнил контракт… открыл двери ада… целый город — могила… завладел градом тьмы…». Судьба героев — в будущих выпусках."}], "key_events": [{"t": "0:04:19", "sec": 259}, {"t": "0:11:56", "sec": 716}, {"t": "0:15:12", "sec": 912}, {"t": "0:19:36", "sec": 1176}, {"t": "0:33:43", "sec": 2023}, {"t": "0:41:20", "sec": 2480}, {"t": "0:46:41", "sec": 2801}, {"t": "1:02:46", "sec": 3766}, {"t": "1:13:38", "sec": 4418}, {"t": "1:23:28", "sec": 5008}, {"t": "1:25:40", "sec": 5140}, {"t": "1:26:43", "sec": 5203}], "coins": {"ep": "21b", "events": [{"t": "0:06:28", "kind": "earn", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "мастер наградил монетой за отыгрыш сцены с благодарным нпс-киселём на кухне", "result": null, "sec": 388, "who_url": "/c/krysa-larisa/", "reason_html": "мастер наградил монетой за отыгрыш сцены с благодарным нпс-киселём на кухне"}, {"t": "0:06:28", "kind": "loot", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "на кухне описана золотая монета в копилке — внутриигровая мелочь, не игровая награда", "result": null, "sec": 388, "who_url": "/c/krysa-larisa/", "reason_html": "на кухне описана золотая монета в копилке — внутриигровая мелочь, не игровая награда"}, {"t": "0:16:19", "kind": "other", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "в шутку обыскивает ворона на наличие монеты", "result": "монеты не нашёл, ворон вместо этого заговорил", "sec": 979, "who_url": "/c/sfinkterion/", "reason_html": "в шутку обыскивает ворона на наличие монеты"}, {"t": "0:27:04", "kind": "loot", "who": "Лос Ускаманос (жрец Джизи)", "actor": "Евгений Чеботков", "to": null, "reason": "в образе жреца Джизи наградил офицера-нпс золотой монетой (внутриигровые деньги) за то, что тот привёл пленницу", "result": null, "sec": 1624, "who_url": "/c/los-uskomanos/", "reason_html": "в образе жреца Джизи наградил офицера-нпс золотой монетой (внутриигровые деньги) за то, что тот привёл пленницу"}, {"t": "1:10:26", "kind": "earn", "who": "Вульф Ва", "actor": "Расул Чабдаров", "to": null, "reason": "мастер выдал монету, когда партия распределяла роли и Вульф Ва вызвалась остаться одна разговаривать с генералом", "result": null, "sec": 4226, "who_url": "/c/vulfa/", "reason_html": "мастер выдал монету, когда партия распределяла роли и <a class=\"ref\" href=\"/c/vulfa/\">Вульф Ва<\/a> вызвалась остаться одна разговаривать с генералом"}, {"t": "1:12:33", "kind": "spend", "who": "Который", "actor": "Пимп (Young P&H)", "to": null, "reason": "потратил монету на переброс проверки ловкости (акробатика, сложность 17), чтобы зацепиться за стену при падении со скалы", "result": "со второй попытки проверку прошёл", "sec": 4353, "who_url": null, "reason_html": "потратил монету на переброс проверки ловкости (акробатика, сложность 17), чтобы зацепиться за стену при падении со скалы"}, {"t": "1:17:58", "kind": "loot", "who": "Крыса Лариса", "actor": "Гудков", "to": null, "reason": "при обыске комнаты на ценные вещи нашла две золотые монеты, а также зелья силы и лечения", "result": null, "sec": 4678, "who_url": "/c/krysa-larisa/", "reason_html": "при обыске комнаты на ценные вещи нашла две золотые монеты, а также зелья силы и лечения"}, {"t": "1:19:04", "kind": "loot", "who": "Сфинктерион Лёвенхарт", "actor": "BRB", "to": null, "reason": "потратил золотую монету (внутриигровое золото) на способность «Дипломат», чтобы попытаться сделать генерала союзником", "result": "способность сработала не так, как ожидалось — союзника выбирает мастер, а не игрок", "sec": 4744, "who_url": "/c/sfinkterion/", "reason_html": "потратил золотую монету (внутриигровое золото) на способность «Дипломат», чтобы попытаться сделать генерала союзником"}, {"t": "1:27:48", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце выпуска мастер подсчитал монеты партии — осталась одна монета (2 заработанные минус 1 потраченная), что равн
