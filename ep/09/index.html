<script>window.EPD = {"anim": false, "key": "09", "label": "9", "title": "Человек в железной маске", "date": "2022-03-24", "minutes": 103, "duration": 6159.0, "video_id": "l9reQH01D-k", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Пиратский город Гнилая Гавань: таверна «Кровавый поплавок» и корабль «Чёрный змей»", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> проникают на пиратский корабль «Чёрный змей», чтобы спасти барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a> из железной маски.", "summary_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> узнают, что отец Сфинктериона, барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, не казнён, а закован <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> в железную маску и передан пиратам в Гнилой Гавани. Вместе с медведолюдом Урсом и бардом-полуорком <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a> они проникают на пиратский корабль «Чёрный змей» (Чрездевиц переодет юнгой-гномом, остальные спрятаны в бочках из-под рома). Параллельно Эдвард в клетке на нижней палубе выбивает ключи у странного «слуги» <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a>, угрожая самоубийством и «дьяволом». Герои пробиваются через трюм, воссоединяются с бароном, но оказывается, что всё это ловушка Властона: из останков Писчека вылезает бес, а корабль расстреливает другой галеон. Отряд пробивает борт взрывом, «Чёрный змей» взрывается, барон (голый, в маске) и едва живой Пэлиас спасены.", "outcome_html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард<\/a> освобождён, все герои выжили, «Чёрный змей» уничтожен. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обрёл союзников (Урс, <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>) для освобождения <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a>.", "world_html": ["<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард Лёвенхарт<\/a> на свободе (всё ещё в железной маске)", "Подтверждено сотрудничество <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с демонами: бес устроил ловушку на Лёвенхартов", "Пиратский корабль «Чёрный змей» уничтожен в Гнилой Гавани", "Сформирован отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, Урс, <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>"], "scenes": [{"t": "0:00:23", "sec": 23, "html": "Вступление: после побега из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a> <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> служили в столичной страже, сорвали покушение на короля и отправились на запад. Представление гостей (<a class=\"ref\" href=\"/p/garik-harlamov/\">Харламов<\/a>, <a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a>, <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> «появится позже»).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: SQWOZBAB попал в 9-й выпуск вместо Ильича\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>SQWOZBAB попал в 9-й выпуск вместо Ильича<\/b> <a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a> рассказал, что его позвали просто посмотреть игру, но в <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске должен был играть Ильич из Little Big, который заболел и не приехал. Марата посадили вместо него, на карточке персонажа заклеили лицо Ильича — так появился <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=150\" target=\"_blank\" rel=\"noopener\">0:02:30 ↗<\/a> · <a href=\"#qa18-1\">к записи<\/a><\/span><\/span>"}, {"t": "0:03:17", "sec": 197, "html": "Завязка: <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> захвачен <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>; барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард Лёвенхарт<\/a> жив, закован в железную маску и увезён в Гнилую Гавань на корабль «Чёрный змей», который скоро отплывёт. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> теперь в личной гвардии короля; весть пришла от медведолюда Урса (создал партизанский отряд в Вёрджинвальде после побега с каторги).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Гнилая Гавань — пиратская республика\">2<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Гнилая Гавань — пиратская республика<\/b> Гнилую <a class=\"ref\" href=\"/place/gnilaya-gavan/\">Гавань<\/a> придумали при подготовке выпуска <a href=\"/ep/09/\" title=\"Человек в железной маске\">9<\/a> как независимый город — пиратскую республику под управлением совета пиратских капитанов. Авторы не исключают морского приключения за пиратов, но с возможностью выбрать добро. Прозвучала идея персонажа-дворянина-белоручки, который ушёл в «белые пираты». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=6207\" target=\"_blank\" rel=\"noopener\">1:43:27 ↗<\/a> · <a href=\"#qa16-32\">к записи<\/a><\/span><\/span>"}, {"t": "0:08:37", "sec": 517, "html": "Уличная терраса таверны «Кровавый поплавок» напротив пирса. Дварф из пиратской команды спорит на монету, что медведь говорит, и подначивает Урса."}, {"t": "0:11:38", "sec": 698, "html": "Потасовка: Урс хватает дварфа за голову; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> промахивается клинком; <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> блефует, что они тоже пираты («на подводной лодке»), затем — что они «портовые девицы». В итоге Урс раздавливает дварфу череп, с трупа выпадает золотая монета; собутыльники в ужасе молчат."}, {"t": "0:19:33", "sec": 1173, "html": "С корабля выбегает юнга за ромом — «гномыч». Выясняется, что это 45-летний гном <a class=\"ref\" href=\"/c/bill-gnomych/\">Билл Гномыч<\/a>; он сообщает, что пленник — на третьей (нижней) палубе. Урс превращает ветку можжевельника в дубинку и убивает его."}, {"t": "0:23:38", "sec": 1418, "html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> с помощью набора для маскировки становится двойником <a class=\"ref\" href=\"/c/gnomych/\">Гномыча<\/a> (только огромным)."}, {"t": "0:24:24", "sec": 1464, "html": "Параллельная сцена (флешбек и темница): <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> по пути в лесах <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> (реклама доставки). Затем — барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в клетке на третьей палубе; к нему приставлен «слуга» полурослик <a class=\"ref\" href=\"/c/pischek/\">Писчек<\/a> по приказу лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Правило «слышит один — слышат все» и «мигрирующие» колёса\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Правило «слышит один — слышат все» и «мигрирующие» колёса<\/b> С первых тестовых игр в шоу действует правило: что слышит один игрок, слышат все, если мастер не скажет обратного (как в <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске, где <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварду<\/a> указали, что он не знает о приходе сына). Колёса рикши на самом деле лежали не на кухне, а в предбаннике за стеной; когда <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> вслух предположил, что они на кухне, их «переместили» — авторы называют это мигрирующими вещами. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep20.md колёса найдены «на кухне» — по сценарию они лежали в предбаннике за кухней и были перенесены на кухню по ходу игры.<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3596\" target=\"_blank\" rel=\"noopener\">0:59:56 ↗<\/a> · <a href=\"#qa20-30\">к записи<\/a><\/span><\/span>"}, {"t": "0:30:46", "sec": 1846, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> «проверяет на ложь» <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a> пальцем, затем пытается удержать его сквозь решётку; Писчек колет барона маникюрными ножницами и отбегает. Игра в «города» ни к чему не приводит."}, {"t": "0:37:10", "sec": 2230, "html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и Урс лезут в бочки (Урс — в иллюзорную большую, созданную <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a>), <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> втискивается в тесную бочку «как Ума Турман»."}, {"t": "0:39:06", "sec": 2346, "html": "«Капитанский ром»: <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>-<a class=\"ref\" href=\"/c/gnomych/\">Гномыч<\/a> проходит по трапу, запугивает стражу и отправляет её к таверне к «мужику, который делает любые вещи больше» (после траты монеты — успех). На палубе он сталкивает пиратов между собой, наврав, что двое с мачты велели везти не ром, а боржоми (критический успех) — на палубе начинается резня."}, {"t": "0:45:00", "sec": 2700, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> применяет способности «Золотой язык» и «Тактик»: понимает, что <a class=\"ref\" href=\"/c/pischek/\">Писчек<\/a> до ужаса боится дьявола. Эдвард изображает одержимость, режет на груди пентаграмму осколком тарелки и грозит убить себя и прислать за Писчеком дьявола (получает монету за ход) — Писчек отдаёт ключи; барон ломает ему руку и выходит из клетки.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Кукушкин: Эдвард «перешёл грань» в первом появлении\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Кукушкин: Эдвард «перешёл грань» в первом появлении<\/b> В телефонном разговоре <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> сказал, что его неадекватных персонажей придумывают Шатохин и Селезнёв. Он признал, что барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> при первом появлении перешёл грань того, что мог себе позволить, хотя и был в стрессе после пыток, голода и железной маски. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=7661\" target=\"_blank\" rel=\"noopener\">2:07:41 ↗<\/a> · <a href=\"#qa16-34\">к записи<\/a><\/span><\/span>"}, {"t": "0:54:32", "sec": 3272, "html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> сталкивает тележку с бочками вниз — она падает сквозь люк на третью палубу, друзья получают урон. На второй палубе (кают-компания) он дразнит пиратов иллюзорными бутылками рома, получает 15 урона и прыгает вниз на Урса; Урс лечит его."}, {"t": "0:59:25", "sec": 3565, "html": "Трюм с порохом: шкипер (щитовод) и четверо матросов. «Корпоратив»: Урс достаёт из «природного кармана» клок волос и брелок. Бой: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> круговым ударом разрубает пирата; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> критически промахивается и ранит себя в ногу; <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> «твоя мамка на второй палубе» добивает раненого; Пэлиас падает без сознания."}, {"t": "1:08:16", "sec": 4096, "html": "Урс гасит свечи, достаёт грязную медицинскую сумку. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в запертой комнате хочет поджечь пороховой корабль, но Урс/<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> уговаривают его дождаться помощи. Эдвард тараном из <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a> выбивает дверь (Писчек погибает)."}, {"t": "1:16:29", "sec": 4589, "html": "Бой в темноте: <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> иллюзией голоса шкипера приказывает сдаться (крит, но шкипер тут же отменяет приказ); Урс набрасывает бочку на двух пиратов; <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> с «утаённой» монетой перебрасывает и убивает пирата из мушкета; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хватает шкипера и перерезает ему горло."}, {"t": "1:25:08", "sec": 5108, "html": "Урс стабилизирует <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (19 на медицину). <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> порывается застрелить Урса за «оскорбление»; сын уговаривает его. В ящиках — два зелья лечения.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Кукушкин: Эдвард «перешёл грань» в первом появлении\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Кукушкин: Эдвард «перешёл грань» в первом появлении<\/b> В телефонном разговоре <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> сказал, что его неадекватных персонажей придумывают Шатохин и Селезнёв. Он признал, что барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> при первом появлении перешёл грань того, что мог себе позволить, хотя и был в стрессе после пыток, голода и железной маски. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=7661\" target=\"_blank\" rel=\"noopener\">2:07:41 ↗<\/a> · <a href=\"#qa16-34\">к записи<\/a><\/span><\/span>"}, {"t": "1:28:18", "sec": 5298, "html": "Из потолка сползает бес, на котором висят клочья тела <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a>: «Отец и сын Лёвенхарты наконец вместе — всё, как задумал лорд. Корабль — ваша могила». <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в запале разрывает на себе кольчугу."}, {"t": "1:32:03", "sec": 5523, "html": "Залп десятка пушек с левого борта: «Чёрный змей» расстреливает огромный галеон, вода заливает третью палубу. <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> снова без сознания. Отряд бежит на вторую палубу, бес преследует <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Каюта капитана «Чёрного змея»: рысь, ключ и злодейский план\">8<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Каюта капитана «Чёрного змея»: рысь, ключ и злодейский план<\/b> В <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске на корабль можно было пробраться через корму по тайной лестнице для куртизанок в каюту капитана. Там был бой с рысью, которая спала на капитанской кровати, и лежал ключ от темницы <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>. Капитан уехал покупать новый корабль, чтобы расстрелять этот; по голодающим матросам (всё мясо шло рыси), отсутствию пороха и рваным парусам герои могли бы догадаться о ловушке. Поскольку каюту пропустили, план капитана пришлось объяснять зрителям иллюстрациями. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2851\" target=\"_blank\" rel=\"noopener\">0:47:31 ↗<\/a> · <a href=\"#qa18-12\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:28", "sec": 5788, "html": "Урс взрывает бочки у борта — в корпусе дыра с видом на вечернюю Гнилую Гавань. Все выпрыгивают на пирс; демон вцепляется в <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>, но тот выскальзывает из разорванной кольчуги и бежит голым с пентаграммой на груди."}, {"t": "1:39:46", "sec": 5986, "html": "«Чёрный змей» взрывается. Урс на последнем броске (ровно 8) спасает <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> от смерти. Пять бонусных монет — 50 000 руб. в детский фонд («Подари жизнь»).<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: В 9-м выпуске забыли спасброски Пэлиаса\">10<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>В 9-м выпуске забыли спасброски Пэлиаса<\/b> Авторы признали, что в <a href=\"/ep/09/\" : "Гарик Харламов", "actor_url": "/p/garik-harlamov/", "race": "медведолюд, друид", "role": "", "fate": "выжил", "id": "Урс", "url": "/c/urs/", "img": "img/chars/urs.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Урс, скорее всего, вернётся\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Урс, скорее всего, вернётся<\/b> <a class=\"ref\" href=\"/p/garik-harlamov/\">Гарик Харламов<\/a> хочет снова сниматься, и авторы считают, что <a class=\"ref\" href=\"/c/urs/\">Урс<\/a> ещё появится в выпусках. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4793\" target=\"_blank\" rel=\"noopener\">1:19:53 ↗<\/a> · <a href=\"#qa16-24\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Фигурку Урса сделают, когда персонаж «наберёт объём»\">7<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Фигурку Урса сделают, когда персонаж «наберёт объём»<\/b> На вопрос, почему <a class=\"ref\" href=\"/p/garik-harlamov/\">Гарику Харламову<\/a> не дарят фигурку его персонажа, ответили, что фигурка <a class=\"ref\" href=\"/c/urs/\">Урса<\/a> появится, как только у персонажа добавится объёма. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2333\" target=\"_blank\" rel=\"noopener\">0:38:53 ↗<\/a> · <a href=\"#qa18-8\">к записи<\/a><\/span><\/span>"}, {"name": "Чрездевиц", "actor": "SQWOZBAB", "actor_url": "/p/sqwozbab/", "race": "полуорк, бард", "role": "", "fate": "выжил", "id": "Черездевиц", "url": "/c/cherezdevic/", "img": "img/chars/chrezdevic.webp", "other": [{"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: SQWOZBAB попал в 9-й выпуск вместо Ильича\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>SQWOZBAB попал в 9-й выпуск вместо Ильича<\/b> <a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a> рассказал, что его позвали просто посмотреть игру, но в <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске должен был играть Ильич из Little Big, который заболел и не приехал. Марата посадили вместо него, на карточке персонажа заклеили лицо Ильича — так появился <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=150\" target=\"_blank\" rel=\"noopener\">0:02:30 ↗<\/a> · <a href=\"#qa18-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Часть песен Чрездевица вырезали\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Часть песен Чрездевица вырезали<\/b> Выяснилось, что несколько песен, которые <a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a> исполнял за <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a>, были вырезаны на монтаже, потому что не подходили по смыслу. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=1338\" target=\"_blank\" rel=\"noopener\">0:22:18 ↗<\/a> · <a href=\"#qa18-4\">к записи<\/a><\/span><\/span>"}, {"name": "барон Эдвард Лёвенхарт", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "человек, аристократ (отец Сфинктериона)", "role": "", "fate": "выжил, освобождён (остался в железной маске)", "id": "Эдвард", "url": "/c/baron-edvard/", "img": "img/chars/edvard-lyovenhart.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Кукушкин: Эдвард «перешёл грань» в первом появлении\">3<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Кукушкин: Эдвард «перешёл грань» в первом появлении<\/b> В телефонном разговоре <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> сказал, что его неадекватных персонажей придумывают Шатохин и Селезнёв. Он признал, что барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> при первом появлении перешёл грань того, что мог себе позволить, хотя и был в стрессе после пыток, голода и железной маски. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=7661\" target=\"_blank\" rel=\"noopener\">2:07:41 ↗<\/a> · <a href=\"#qa16-34\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Крыса Лариса", "actor": "", "actor_url": null, "race": "", "role": "животное-компаньон Пэлиаса", "fate": "выжила", "id": "Лариса", "url": "/c/krysa-larisa/", "img": "img/chars/larisa.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд"}, {"key": "19", "label": "19", "title": "Час эльфийского суда"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "36", "label": "36", "title": "Руины Малестии"}, {"key": "44", "label": "44", "title": "Королевская охота"}, {"key": "50", "label": "50", "title": "Крыса корабельная"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лариса и Пэлиас: в чашу взяли её кровь\">9<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лариса и Пэлиас: в чашу взяли её кровь<\/b> На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу познания смерти<\/a> взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические. <span class=\"note\">Подкаст по #19 · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 ↗<\/a> · <a href=\"#qa19-29\">к записи<\/a><\/span><\/span>"}, {"name": "Дварф из «Кровавого поплавка»", "actor": "", "actor_url": null, "race": "", "role": "пират с «Чёрного змея»", "fate": "погиб (убит Урсом)", "id": null, "url": null, "img": null, "other": []}, {"name": "Билл Гномыч", "actor": "", "actor_url": null, "race": "", "role": "45-летний гном-юнга «Чёрного змея»", "fate": "погиб (убит Урсом)", "id": "Билл Гномыч", "url": "/c/bill-gnomych/", "img": "img/chars/bill-gnomych.webp", "other": []}, {"name": "Писчек", "actor": "", "actor_url": null, "race": "", "role": "полурослик-«слуга» барона по приказу Властона", "fate": "погиб (им выбили дверь); из останков вылез бес", "id": "Писчек", "url": "/c/pischek/", "img": "img/chars/pischek.webp", "other": []}, {"name": "Бес", "actor": "", "actor_url": null, "race": "", "role": "демон на службе Властона, страж ловушки", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Шкипер «Чёрного змея»", "actor": "", "actor_url": null, "race": "", "role": "пират, завхоз трюма", "fate": "погиб (убит Сфинктерионом)", "id": null, "url": null, "img": null, "other": []}, {"name": "Капитан галеона", "actor": "", "actor_url": null, "race": "", "role": "обстрелял «Чёрного змея»", "fate": "неизвестно", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Каюта капитана «Чёрного змея»: рысь, ключ и злодейский план\">8<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Каюта капитана «Чёрного змея»: рысь, ключ и злодейский план<\/b> В <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске на корабль можно было пробраться через корму по тайной лестнице для куртизанок в каюту капитана. Там был бой с рысью, которая спала на капитанской кровати, и лежал ключ от темницы <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>. Капитан уехал покупать новый корабль, чтобы расстрелять этот; по голодающим матросам (всё мясо шло рыси), отсутствию пороха и рваным парусам герои могли бы догадаться о ловушке. Поскольку каюту пропустили, план капитана пришлось объяснять зрителям иллюстрациями. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2851\" target=\"_blank\" rel=\"noopener\">0:47:31 ↗<\/a> · <a href=\"#qa18-12\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "Служба в столичной страже и сорванное покушение на короля (упомянуто во вступлении)", "dir": "out", "color": "#C8423B"}, {"key": "08", "label": "8", "title": "Покушение на короля", "note_html": "Предыдущие события ветви <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>; побег из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a>, откуда же Урс", "dir": "out", "color": "#C8423B"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "Продолжение ветви; гибель <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "15", "label": "15", "title": "Возвращение в Вёрджинвальд", "note_html": "Освобождение <a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальда<\/a> — цель, заданная в финале", "dir": "out", "color": "#C8423B"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\"", "note_html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> (<a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a>), спутник <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Мы портовые девицы… мы не к несчастью, мы к удовольствию» — <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>.", "«Отец и сын Лёвенхарты наконец-то вместе. Всё, как и задумал лорд. Корабль — ваша могила» — бес.", "«Овсянка» — барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, играя в города с <a class=\"ref\" href=\"/c/pischek/\">Писчеком<\/a>.", "«Там возле таверны стоит мужик, который делает любые вещи больше» — <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>-<a class=\"ref\" href=\"/c/gnomych/\">Гномыч<\/a> стражникам."], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/gnilaya-gavan/\">Гнилая Гавань<\/a> (пиратский город), таверна «Кровавый поплавок», пиратский трёхпалубный корабль «Чёрный змей» (уничтожен), огромный галеон.<\/li>\n<li><a class=\"ref\" href=\"/place/vyordzhinvald/\">Вёрджинвальд<\/a> (оккупирован <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>), партизанский отряд Урса.<\/li>\n<li>Фракции: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> и его демоны; пираты Гнилой Гавани; королевская гвардия.<\/li>\n<li>Железная маска барона; два зелья лечения; способности барона «Золотой язык» и «Тактик».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>11<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>11<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>1<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>2<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa16-24\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Урс, скорее всего, вернётся<\/b><\/div><p><a class=\"ref\" href=\"/p/garik-harlamov/\">Гарик Харламов<\/a> хочет снова сниматься, и авторы считают, что <a class=\"ref\" href=\"/c/urs/\">Урс<\/a> ещё появится в выпусках.<\/p><blockquote>«постоянно пишу Гарику, постоянно хочет, ему очень нравится проект, я думаю, что будет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-24\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4793\" target=\"_blank\" rel=\"noopener\">1:19:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Гнилая Гавань — пиратская республика<\/b><\/div><p>Гнилую <a class=\"ref\" href=\"/place/gnilaya-gavan/\">Гавань<\/a> придумали при подготовке выпуска <a href=\"/ep/09/\" title=\"Человек в железной маске\">9<\/a> как независимый город — пиратскую республику под управлением совета пиратских капитанов. Авторы не исключают морского приключения за пиратов, но с возможностью выбрать добро. Прозвучала идея персонажа-дворянина-белоручки, который ушёл в «белые пираты».<\/p><blockquote>«мы вообще придумали, что это город независимый, управляемый советом пиратских капитанов… пиратская республика»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-32\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=6207\" target=\"_blank\" rel=\"noopener\">1:43:27 в видео ↗<\/a> · о выпуске <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa16-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Кукушкин: Эдвард «перешёл грань» в первом появлении<\/b><\/div><p>В телефонном разговоре <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> сказал, что его неадекватных персонажей придумывают Шатохин и Селезнёв. Он признал, что барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> при первом появлении перешёл грань того, что мог себе позволить, хотя и был в стрессе после пыток, голода и железной маски.<\/p><blockquote>«я вышел чуть-чуть, перешёл грань того, что этот персонаж мог себе позволить… но он был в стрессовой ситуации»<\/blockquote><p class=\"note\">Кукушкин · <a href=\"/pod/qa16/#qa16-34\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=7661\" target=\"_blank\" rel=\"noopener\">2:07:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-23\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Знали ли игроки сюжет заранее: Канделакис и письмо Цисгендия<\/b><\/div><p>Сюжет игрокам заранее не рассказывают. В выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">7<\/a> <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> узнал в <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакисе<\/a> отца, потому что это было прописано в персонаже. Враждебность <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> к <a class=\"ref\" href=\"/c/cisgender/\">Игристому<\/a> (Поперечному) в выпуске <a href=\"/ep/14/\" title=\"Янус доставка\">14<\/a> была чистым наитием. Письмо гвардии в инвентаре Игристого заметил <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> (<a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a>), рассудив, что просто так такое в карточку не вписывают.<\/p><blockquote>«зачем это прописывать в инвентаре, типа ну просто так это не прописывается»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa17/#qa17-23\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=6149\" target=\"_blank\" rel=\"noopener\">1:42:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa18-1\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>SQWOZBAB попал в 9-й выпуск вместо Ильича<\/b><\/div><p><a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a> рассказал, что его позвали просто посмотреть игру, но в <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске должен был играть Ильич из Little Big, который заболел и не приехал. Марата посадили вместо него, на карточке персонажа заклеили лицо Ильича — так появился <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>.<\/p><blockquote>«должен был Ильич из Little Big участвовать, и он не приехал… заклеили его лицо на карточке»<\/blockquote><p class=\"note\">SQWOZBAB · <a href=\"/pod/qa18/#qa18-1\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=150\" target=\"_blank\" rel=\"noopener\">0:02:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa18-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Часть песен Чрездевица вырезали<\/b><\/div><p>Выяснилось, что несколько песен, которые <a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a> исполнял за <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевица<\/a>, были вырезаны на монтаже, потому что не подходили по смыслу.<\/p><blockquote>«несколько песен… их вырезали, потому что они не подходили»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-4\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=1338\" target=\"_blank\" rel=\"noopener\">0:22:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a>, <a href=\"/ep/15/\" title=\"Возвращение в Вёрджинвальд\">#15<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-8\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Фигурку Урса сделают, когда персонаж «наберёт объём»<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/p/garik-harlamov/\">Гарику Харламову<\/a> не дарят фигурку его персонажа, ответили, что фигурка <a class=\"ref\" href=\"/c/urs/\">Урса<\/a> появится, как только у персонажа добавится объёма.<\/p><blockquote>«как только добавится объём у этого персонажа, сразу появится и фигурка»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-8\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2333\" target=\"_blank\" rel=\"noopener\">0:38:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-12\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Каюта капитана «Чёрного змея»: рысь, ключ и злодейский план<\/b><\/div><p>В <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске на корабль можно было пробраться через корму по тайной лестнице для куртизанок в каюту капитана. Там был бой с рысью, которая спала на капитанской кровати, и лежал ключ от темницы <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>. Капитан уехал покупать новый корабль, чтобы расстрелять этот; по голодающим матросам (всё мясо шло рыси), отсутствию пороха и рваным парусам герои могли бы догадаться о ловушке. Поскольку каюту пропустили, план капитана пришлось объяснять зрителям иллюстрациями.<\/p><blockquote>«капитан же уехал по сюжету, он поехал покупать новый корабль, чтобы разбомбить этот… нам потом пришлось это в иллюстрациях рисовать»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-12\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2851\" target=\"_blank\" rel=\"noopener\">0:47:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa19-29\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Лариса и Пэлиас: в чашу взяли её кровь<\/b><\/div><p>На вопрос, что было у <a class=\"ref\" href=\"/c/krysa-larisa/\">Ларисы<\/a> с <a class=\"ref\" href=\"/c/pelias/\">Пэлиасом<\/a>, <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> намекнул, что в <a class=\"ref\" href=\"/a/chasha-poznaniya-smerti/\">чашу познания смерти<\/a> взяли именно кровь Ларисы как «кровь любовника»; телесной связи, по словам ведущих, быть не могло, а отношения — скорее платонические.<\/p><blockquote>«раскрыть: это её кровь взяли в чашу познания смерти»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa19/#qa19-29\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=5283\" target=\"_blank\" rel=\"noopener\">1:28:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/19/\" title=\"Час эльфийского суда\">#19<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa20-16\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>В 9-м выпуске забыли спасброски Пэлиаса<\/b><\/div><p>Авторы признали, что в <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске забыли про спасброски от смерти <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> на корабле и поэтому сделали за него последний спасбросок в финале — его бросил <a class=\"ref\" href=\"/p/garik-harlamov/\">Харламов<\/a>, и всё закончилось хорошо.<\/p><blockquote>«мы просто забыли про них в девятом выпуске, забыли про них на корабле, и поэтому делали последний спасбросок за Пэлиаса в финале»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-16\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1535\" target=\"_blank\" rel=\"noopener\">0:25:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-30\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Правило «слышит один — слышат все» и «мигрирующие» колёса<\/b><\/div><p>С первых тестовых игр в шоу действует правило: что слышит один игрок, слышат все, если мастер не скажет обратного (как в <a href=\"/ep/09/\" title=\"Человек в железной маске\">9-м<\/a> выпуске, где <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварду<\/a> указали, что он не знает о приходе сына). Колёса рикши на самом деле лежали не на кухне, а в предбаннике за стеной; когда <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> вслух предположил, что они на кухне, их «переместили» — авторы называют это мигрирующими вещами.<\/p><blockquote>«колёса были в предбаннике, не в кухне… они мигрирующие»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep20.md колёса найдены «на кухне» — по сценарию они лежали в предбаннике за кухней и были перенесены на кухню по ходу игры.<\/p><p class=\"note\"><a href=\"/pod/qa20/#qa20-30\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=3596\" target=\"_blank\" rel=\"noopener\">0:59:56 в видео ↗<\/a> · о выпуске <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a>, <a href=\"/ep/09/\" title=\"Человек в железной маске\">#9<\/a><\/p><\/article><\/section>", "chars": {"Урс": {"name": "Урс", "img": "img/chars/urs.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A3%D1%80%D1%81", "summary": "У́рс (полное имя – У́рс Тауки́то 28) – медведолюд, верный друг и советник барона Эдварда по природе.", "infobox": {"Пол": "Мужской", "Раса": "Медведолюд", "Тип": "Игровой", "Игрок": "Гарик Харламов"}, "actors": ["Гарик Харламов"], "kind": "pc", "dead": false, "race": "Медведолюд", "portraits": [{"ep": "9", "thumb": "img/portraits/29072596b12b5c6d.webp"}, {"ep": "5", "thumb": "img/portraits/443a7cab4a0cd6a0.webp"}], "url": "/c/urs/", "eps": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "09", "label": "9", "title": "Человек в железной м
