<script>window.EPD = {"key": "09", "label": "9", "title": "Человек в железной маске", "date": "2022-03-24", "minutes": 103, "duration": 6159.0, "video_id": "l9reQH01D-k", "branch": "Сфинктерион", "branch_color": "#C8423B", "place": "Пиратский город Гнилая Гавань: таверна «Кровавый поплавок» и корабль «Чёрный змей»", "short_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> с медведолюдом Урсом и бардом <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a> проникают на пиратский корабль «Чёрный змей» в Гнилой Гавани, чтобы спасти барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда Лёвенхарта<\/a>, закованного <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> в железную маску. Чрездевиц переодевается убитым юнгой-гномом и провозит друзей в бочках, стравливая пиратов между собой. Эдвард тем временем запугивает своего «слугу» <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a> дьяволом и выбирается из клетки. После боя в пороховом трюме выясняется, что всё было ловушкой Властона: появляется бес, а корабль расстреливает галеон. Герои взрывом пробивают борт и спасаются, «Чёрный змей» взрывается.", "summary_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> узнают, что отец Сфинктериона, барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>, не казнён, а закован <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a> в железную маску и передан пиратам в Гнилой Гавани. Вместе с медведолюдом Урсом и бардом-полуорком <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a> они проникают на пиратский корабль «Чёрный змей» (Чрездевиц переодет юнгой-гномом, остальные спрятаны в бочках из-под рома). Параллельно Эдвард в клетке на нижней палубе выбивает ключи у странного «слуги» <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a>, угрожая самоубийством и «дьяволом». Герои пробиваются через трюм, воссоединяются с бароном, но оказывается, что всё это ловушка Властона: из останков Писчека вылезает бес, а корабль расстреливает другой галеон. Отряд пробивает борт взрывом, «Чёрный змей» взрывается, барон (голый, в маске) и едва живой Пэлиас спасены.", "outcome_html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард<\/a> освобождён, все герои выжили, «Чёрный змей» уничтожен. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> обрёл союзников (Урс, <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>) для освобождения Вирджинвальда.", "world_html": ["<a class=\"ref\" href=\"/c/baron-edvard/\">Барон Эдвард Лёвенхарт<\/a> на свободе (всё ещё в железной маске)", "Подтверждено сотрудничество <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с демонами: бес устроил ловушку на Лёвенхартов", "Пиратский корабль «Чёрный змей» уничтожен в Гнилой Гавани", "Сформирован отряд <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>: <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a>, Урс, <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a>"], "scenes": [{"t": "0:00:23", "sec": 23, "html": "Вступление: после побега из Фогельнеста <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> и <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> служили в столичной страже, сорвали покушение на короля и отправились на запад. Представление гостей (<a class=\"ref\" href=\"/p/garik-harlamov/\">Харламов<\/a>, <a class=\"ref\" href=\"/p/sqwozbab/\">SQWOZBAB<\/a>, <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> «появится позже»)."}, {"t": "0:03:31", "sec": 211, "html": "Завязка: Вирджинвальд захвачен <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>; барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард Лёвенхарт<\/a> жив, закован в железную маску и увезён в Гнилую Гавань на корабль «Чёрный змей», который скоро отплывёт. <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> теперь в личной гвардии короля; весть пришла от медведолюда Урса (создал партизанский отряд в Вирджинвальде после побега с каторги)."}, {"t": "0:08:53", "sec": 533, "html": "Уличная терраса таверны «Кровавый поплавок» напротив пирса. Дварф из пиратской команды спорит на монету, что медведь говорит, и подначивает Урса."}, {"t": "0:11:00", "sec": 660, "html": "Потасовка: Урс хватает дварфа за голову; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> промахивается клинком; <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> блефует, что они тоже пираты («на подводной лодке»), затем — что они «портовые девицы». В итоге Урс раздавливает дварфу череп, с трупа выпадает золотая монета; собутыльники в ужасе молчат."}, {"t": "0:19:19", "sec": 1159, "html": "С корабля выбегает юнга за ромом — «гномыч». Выясняется, что это 45-летний гном <a class=\"ref\" href=\"/c/bill-gnomych/\">Билл Гномыч<\/a>; он сообщает, что пленник — на третьей (нижней) палубе. Урс превращает ветку можжевельника в дубинку и убивает его."}, {"t": "0:23:28", "sec": 1408, "html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> с помощью набора для маскировки становится двойником <a class=\"ref\" href=\"/c/gnomych/\">Гномыча<\/a> (только огромным)."}, {"t": "0:24:31", "sec": 1471, "html": "Параллельная сцена (флешбек и темница): <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> по пути в лесах Вирджинвальда (реклама доставки). Затем — барон <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в клетке на третьей палубе; к нему приставлен «слуга» полурослик <a class=\"ref\" href=\"/c/pischek/\">Писчек<\/a> по приказу лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>."}, {"t": "0:30:46", "sec": 1846, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> «проверяет на ложь» <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a> пальцем, затем пытается удержать его сквозь решётку; Писчек колет барона маникюрными ножницами и отбегает. Игра в «города» ни к чему не приводит."}, {"t": "0:37:03", "sec": 2223, "html": "<a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> и Урс лезут в бочки (Урс — в иллюзорную большую, созданную <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевицем<\/a>), <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> втискивается в тесную бочку «как Ума Турман»."}, {"t": "0:39:07", "sec": 2347, "html": "«Капитанский ром»: <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>-<a class=\"ref\" href=\"/c/gnomych/\">Гномыч<\/a> проходит по трапу, запугивает стражу и отправляет её к таверне к «мужику, который делает любые вещи больше» (после траты монеты — успех). На палубе он сталкивает пиратов между собой, наврав, что двое с мачты велели везти не ром, а боржоми (критический успех) — на палубе начинается резня."}, {"t": "0:45:21", "sec": 2721, "html": "<a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> применяет способности «Золотой язык» и «Тактик»: понимает, что <a class=\"ref\" href=\"/c/pischek/\">Писчек<\/a> до ужаса боится дьявола. Эдвард изображает одержимость, режет на груди пентаграмму осколком тарелки и грозит убить себя и прислать за Писчеком дьявола (получает монету за ход) — Писчек отдаёт ключи; барон ломает ему руку и выходит из клетки."}, {"t": "0:54:47", "sec": 3287, "html": "<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> сталкивает тележку с бочками вниз — она падает сквозь люк на третью палубу, друзья получают урон. На второй палубе (кают-компания) он дразнит пиратов иллюзорными бутылками рома, получает 15 урона и прыгает вниз на Урса; Урс лечит его."}, {"t": "0:59:00", "sec": 3540, "html": "Трюм с порохом: шкипер (щитовод) и четверо матросов. «Корпоратив»: Урс достаёт из «природного кармана» клок волос и брелок. Бой: <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> круговым ударом разрубает пирата; <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> критически промахивается и ранит себя в ногу; <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> «твоя мамка на второй палубе» добивает раненого; Пэлиас падает без сознания."}, {"t": "1:08:26", "sec": 4106, "html": "Урс гасит свечи, достаёт грязную медицинскую сумку. <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в запертой комнате хочет поджечь пороховой корабль, но Урс/<a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> уговаривают его дождаться помощи. Эдвард тараном из <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a> выбивает дверь (Писчек погибает)."}, {"t": "1:14:43", "sec": 4483, "html": "Бой в темноте: <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a> иллюзией голоса шкипера приказывает сдаться (крит, но шкипер тут же отменяет приказ); Урс набрасывает бочку на двух пиратов; <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> с «утаённой» монетой перебрасывает и убивает пирата из мушкета; <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> хватает шкипера и перерезает ему горло."}, {"t": "1:25:08", "sec": 5108, "html": "Урс стабилизирует <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> (19 на медицину). <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> порывается застрелить Урса за «оскорбление»; сын уговаривает его. В ящиках — два зелья лечения."}, {"t": "1:28:17", "sec": 5297, "html": "Из потолка сползает бес, на котором висят клочья тела <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a>: «Отец и сын Лёвенхарты наконец вместе — всё, как задумал лорд. Корабль — ваша могила». <a class=\"ref\" href=\"/c/baron-edvard/\">Эдвард<\/a> в запале разрывает на себе кольчугу."}, {"t": "1:31:27", "sec": 5487, "html": "Залп десятка пушек с левого борта: «Чёрный змей» расстреливает огромный галеон, вода заливает третью палубу. <a class=\"ref\" href=\"/c/pelias/\">Пэлиас<\/a> снова без сознания. Отряд бежит на вторую палубу, бес преследует <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>."}, {"t": "1:36:43", "sec": 5803, "html": "Урс взрывает бочки у борта — в корпусе дыра с видом на вечернюю Гнилую Гавань. Все выпрыгивают на пирс; демон вцепляется в <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>, но тот выскальзывает из разорванной кольчуги и бежит голым с пентаграммой на груди."}, {"t": "1:39:52", "sec": 5992, "html": "«Чёрный змей» взрывается. Урс на последнем броске (ровно 8) спасает <a class=\"ref\" href=\"/c/pelias/\">Пэлиаса<\/a> от смерти. Пять бонусных монет — 50 000 руб. в детский фонд («Подари жизнь»)."}, {"t": "1:41:59", "sec": 6119, "html": "Финал: «<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> приобрёл новых союзников в борьбе за возвращение Вирджинвальда»."}], "key_events": [{"t": "0:03:31", "sec": 211}, {"t": "0:18:17", "sec": 1097}, {"t": "0:23:28", "sec": 1408}, {"t": "0:41:10", "sec": 2470}, {"t": "0:55:49", "sec": 3349}, {"t": "1:02:05", "sec": 3725}, {"t": "1:12:38", "sec": 4358}, {"t": "1:28:17", "sec": 5297}, {"t": "1:31:27", "sec": 5487}, {"t": "1:39:52", "sec": 5992}], "coins": {"ep": "09", "events": [{"t": "0:18:17", "kind": "earn", "who": "Урс", "actor": "Харламов", "to": null, "reason": "разорвал дварфа пополам, и из его руки на стол выпала золотая монета", "result": null, "sec": 1097, "who_url": "/c/urs/", "reason_html": "разорвал дварфа пополам, и из его руки на стол выпала золотая монета"}, {"t": "0:34:57", "kind": "spend", "who": "Эдвард Лёвенхарт", "actor": "Кукушкин", "to": null, "reason": "потратил монету, пытаясь схватить вторую руку слуги Писчека во время допроса", "result": "несмотря на монету получил 2 урона маникюрными ножницами и упустил хватку", "sec": 2097, "who_url": "/c/baron-edvard/", "reason_html": "потратил монету, пытаясь схватить вторую руку слуги <a class=\"ref\" href=\"/c/pischek/\">Писчека<\/a> во время допроса"}, {"t": "0:41:10", "kind": "spend", "who": "Через девиц", "actor": "SQWOZBAB", "to": null, "reason": "потратил монету на переброс проверки харизмы/запугивания пиратов под видом силача-гномыча", "result": "переброс дал 17, пираты бросили оружие и разбежались", "sec": 2470, "who_url": null, "rea
