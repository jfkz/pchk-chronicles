<script>window.EPD = {"anim": false, "key": "43", "label": "43", "title": "Груз Кристиночки", "date": "2025-10-30", "minutes": 117, "duration": 7020.0, "video_id": "pBKAMk_J0qw", "branch": "Янус и дракон Гиммилут", "branch_color": "#B8901C", "place": "Гнилая Гавань и таверна-бордель «Налево от сосны» на старом тракте к Кёнигпону", "short_html": "<a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> с мужьями и охраной ищет пропавший груз из двух тысяч кукол «зубастых уродцев».", "summary_html": "После гибели эльфа <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> в бою с драконом Гимелом его лавку всякой всячины в столице унаследовала сестра Кристина («<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>»), которая чуть не разорилась и вложила последние деньги в 2000 модных кукол «зубастые уродцы». Кучер Допс с грузом пропал, и Кристина с двумя мужьями (сатиром <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочником<\/a> и тёмным эльфом Глам'Уром) и двумя охранниками (полуросликом <a class=\"ref\" href=\"/c/fiduk/\">Федуком<\/a> и бесом Мишей) отправляется в Гнилую Гавань. Там герои убивают бандита Ози, захватившего лавку купца Ливая, спасают Ливая и выходят на след Допса в придорожном борделе «Налево от сосны». Выясняется, что бордель захвачен демоническим грибом Сыроегой, которая одурманивает людей спорами и начиняет кукол заразными капсулами — диверсия адских сил против королевства. Героям с помощью великанши Рапунцель и фена «Дайсон» удаётся иссушить демоницу; половину груза спасают, заражённую сжигают, а Дудочник решает остаться в борделе куртизанкой Жанетт.", "outcome_html": "Демоническая диверсия с заражёнными куклами сорвана, Сыроега уничтожена, лавка <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a> спасена половиной груза. Все герои выжили; <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> ушёл из семьи и остался в борделе.", "world_html": ["Уничтожен демонический гриб Сыроега, заражавший людей в Гнилой Гавани и на старом тракте", "Сорвана адская диверсия: заражённые куклы не попали в столицу", "Лавка Ливая в Гнилой Гавани сгорела", "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> владеет душой купца Ливая", "В королевстве запрещены бесы; <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> живёт легально по «паспорту хорошей твари»"], "scenes": [{"t": "0:01:26", "sec": 86, "html": "Предыстория: <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> спас сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> из вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>, но друзья предали его (<a class=\"ref\" href=\"/c/miratorg/\">Мироторг<\/a> перешёл к дракону Гимелу, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> и <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> сбежали с Кристиной); сам эльф погиб в бою с драконом."}, {"t": "0:04:10", "sec": 250, "html": "<a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> едва не разорила лавку, заложила её и закупила в Гнилой Гавани у купца Ливая 2000 кукол «зубастые уродцы» (продаются в 10 раз дороже). Кучер Допс забрал товар, обещал быть через 2 недели — и пропал больше чем на месяц."}, {"t": "0:05:50", "sec": 350, "html": "Представление героев: <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> — первый муж <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a> (помирились после спасения от дракона, «традиционный полиаморный брак»); <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> — второй муж, чтит матриархат тёмных эльфов (получает обещанную на подкасте монету); <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> — полурослик-моряк, проспавший пьяным сожжение своего корабля демонами и подвиг своего отряда, ушедший героем на пенсию в 23 года; <a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> — после уничтожения тела для духа Тёмного Властелина живёт в столице, получил «паспорт хорошей твари» в МФЦ (записался «рыболом»), охраняет Кристину по контракту за 20 лет её жизни."}, {"t": "0:11:58", "sec": 718, "html": "Прибытие в Гнилую Гавань у таверны «Кровавый поплавок». Компас поиска <a class=\"ref\" href=\"/c/fiduk/\">Федука<\/a> указывает на кукол. <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> роется в ящиках «секонд-хенда» и находит йога-панталоны для жены."}, {"t": "0:15:04", "sec": 904, "html": "<a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> запугивает однорукого нищего: тот рассказывает о «заражённых», которых поймал некий Ози и показывает за деньги (заражение укусом или царапиной). <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> устраивает тотализатор, Дудочник «гуманно» душит нищего; толпа требует добить, но Глам'Ур убеждает её отказаться от кровавых боёв и возвращает ставки. <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> реанимирует нищего — тот оказывается двуруким мошенником и сбегает с монетами."}, {"t": "0:24:52", "sec": 1492, "html": "Танцовщица в таверне сообщает: купец Ливай проиграл свою лавку в карты бандиту Ози. У лавки — громилы и клетка с заражёнными под покрывалом. <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> тревожится, что <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> ожесточился; тот пытается уговорить её переписать бизнес на него."}, {"t": "0:29:39", "sec": 1779, "html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> становится невидимым, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> проводит всех внутрь, выдав себя за «отца Ози — Кози». Внутри Ози с татуировкой на пальцах обыскивает стены, рядом его жена <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a> и попугай. Ливай, проигравший и себя, сидит в клетке с кляпом. <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> замечает отходящую половицу."}, {"t": "0:36:53", "sec": 2213, "html": "Драка: <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> берёт <a class=\"ref\" href=\"/c/alyona/\">Алёну<\/a> в захват с «розочкой» у горла, бес колет Ози ядовитым хвостом, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> с Глам'Уром убивают громилу, Федук опутывает ворвавшихся громил парусиной и затем бьёт ими… самой Алёной; Дудочник раскалывает Ози череп копытами. Алёна ранит Федука и сбегает."}, {"t": "0:53:00", "sec": 3180, "html": "Бес поджигает лавку огненным снарядом, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> случайно раздувает пламя. Бес заключает с Ливаем контракт на его душу в обмен на спасение и вскрывает клетку кинжалом из адской стали; Дудочник выносит <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> через окно. Под половицей тайник Ливая: 100 золотых и зелья (лечения, противоядие, 2 зелья лечения болезней); у Ози — ключ и магический свиток. Лавка взрывается; видно заражённых с грибами на лицах."}, {"t": "1:01:32", "sec": 3692, "html": "Ливай рассказывает: Допс поехал в столицу <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> по старому тракту и наверняка застрял в «местечке, куда все заезжают» — таверне-борделе «Налево от сосны». <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> там завсегдатай."}, {"t": "1:03:37", "sec": 3817, "html": "У двухэтажного особняка, поросшего мхом, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> находит давно стоящую пустую телегу «Грузоперевозки Допса»; конь рассказывает, что хозяин не выходит около месяца («меня кормили 30 раз»)."}, {"t": "1:05:36", "sec": 3936, "html": "Бес-ворона залетает в окно второго этажа к трёхметровой великанше Рапунцель, хозяйке заведения: её волосы спутаны и мокры, а от фена «Дайсон» раскалывается голова. Разоблачив говорящего ворона, она прогоняет его."}, {"t": "1:10:59", "sec": 4259, "html": "На входе охрана с мутными глазами и грязной по колено обувью отбирает оружие; <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочника<\/a>, ударившего охранника «за <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>», не пускают. Он гримируется под знакомую куртизанку <a class=\"ref\" href=\"/c/kristal/\">Кристал<\/a>, у которой выходной, и проходит внутрь. Внутри сыро, как в хамаме, зал освещён светящимися грибами. Остальные снимают VIP-комнату."}, {"t": "1:19:00", "sec": 4740, "html": "«<a class=\"ref\" href=\"/c/kristal/\">Кристал<\/a>»-<a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> выведывает у одурманенной «подруги»: Допса надо удерживать на втором этаже в комнате №2, хозяйка не выходит из-за волос, фен лежит в ванной. Компас <a class=\"ref\" href=\"/c/fiduk/\">Федука<\/a> показывает кукол в бане и в вонючем туалете."}, {"t": "1:26:48", "sec": 5208, "html": "Герои поднимаются на поросший грибами второй этаж, вталкивают громилу в комнату №2 и убивают его; мицелий тянется к трупу — голову отрубают. У настоящей <a class=\"ref\" href=\"/c/kristal/\">Кристал<\/a> из платья вынимают иглы. Допс одурманен, считает, что заехал на день; зелье лечения болезней возвращает ему рассудок."}, {"t": "1:32:52", "sec": 5572, "html": "<a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> под видом парикмахера-«противника фенов» проникает к Рапунцель, усыпляет её внимание «морской байкой» про цингу, а невидимый бес вливает ей зелье лечения болезней. Очнувшись, она сушит волосы — грибы в комнате гибнут. В ванной найдена инструкция к фену (3 заряда, горячий ветер сбивает с ног и мешает дальнобойным атакам)."}, {"t": "1:38:45", "sec": 5925, "html": "Рапунцель ведёт героев через кухню в погреб («они идут к маме?» — спрашивает повар). Маски из майки, пропитанные ромом, защищают от спор. В пещере под погребом заражённые мужчины вспарывают кукол из ящиков Допса и вкладывают в них пузыри с веществом."}, {"t": "1:41:39", "sec": 6099, "html": "Хозяйка пещеры — Сыроега («мама»), демонический гриб из ада в женском облике, захватывающий умы грешников. Она предлагает отдать груз, если герои снимут маски и станут её слугами."}, {"t": "1:45:28", "sec": 6328, "html": "Бой: фен блокирует её магию; <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> принимает удар ложноножки на себя, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> наносит 72 урона критическим градом шипов, бес поджигает ром огненным снарядом, Рапунцель бьёт булавой, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> оскорбляет её («молочница»), но теряет сознание. Глам'Ур подхватывает фен последним зарядом и иссушает Сыроегу до стручка; Федук его съедает."}, {"t": "1:52:15", "sec": 6735, "html": "Заражённые приходят в себя. Половина кукол заражена капсулами — их сжигают, незаражённую половину <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> забирает, чтобы спасти лавку брата. <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> дарит ей йога-панталоны."}, {"t": "1:54:40", "sec": 6880, "html": "Финал: <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> объявляет, что нашёл своё место, и остаётся в борделе куртизанкой под именем Жанетт; <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> поддерживает («женщина — это не пол, а состояние души»). Герои получают 6 золотых, 3 монеты — в благотворительный фонд."}], "key_events": [{"t": "0:04:10", "sec": 250}, {"t": "0:15:04", "sec": 904}, {"t": "0:36:53", "sec": 2213}, {"t": "0:56:26", "sec": 3386}, {"t": "1:01:32", "sec": 3692}, {"t": "1:14:14", "sec": 4454}, {"t": "1:31:01", "sec": 5461}, {"t": "1:37:04", "sec": 5824}, {"t": "1:41:39", "sec": 6099}, {"t": "1:52:15", "sec": 6735}, {"t": "1:54:40", "sec": 6880}], "coins": {"ep": "43", "events": [{"t": "0:08:24", "kind": "other", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "монета, обещанная Глам'Уру ещё на другом ролике/подкасте (кроссовер), выдана в начале эпизода", "result": null, "sec": 504, "who_url": "/c/glamur/", "reason_html": "монета, обещанная Глам'Уру ещё на другом ролике/подкасте (кроссовер), выдана в начале эпизода"}, {"t": "0:17:07", "kind": "loot", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "в шутку кинул нищему-калеке золотую монету", "result": null, "sec": 1027, "who_url": "/c/glamur/", "reason_html": "в шутку кинул нищему-калеке золотую монету"}, {"t": "0:19:12", "kind": "loot", "who": "Сатир Дудочник", "actor": "Илья Сатир", "to": null, "reason": "собрал со ставок зевак на подпольный кулачный бой с нищим две золотые монеты (мошенническая схема)", "result": null, "sec": 1152, "who_url": "/c/satir-dudochnik/", "reason_html": "собрал со ставок зевак на подпольный кулачный бой с нищим две золотые монеты (мошенническая схема)"}, {"t": "0:23:51", "kind": "earn", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "тронул зрителя речью о негуманности боёв на деньги — тот отдал ему свои две золотые монеты", "result": "успешная проверка Вдохновение/Харизма — 21", "sec": 1431, "who_url": "/c/glamur/", "reason_html": "тронул зрителя речью о негуманности боёв на деньги — тот отдал ему свои две золотые монеты"}, {"t": "0:42:19", "kind": "earn", "who": "Федук", "actor": "BRB", "to": null, "reason": "вместе с Глам'Уром прикончил громилу командной атакой, несмотря на неодобрение Кристиночки", "result": null, "sec": 2539, "who_url": "/c/fiduk/", "reason_html": "вместе с Глам'Уром прикончил громилу командной атакой, несмотря на неодобрение <a class=\"ref\" href=\"/c/kristina/\">Кристиночки<\/a>"}, {"t": "0:53:16", "kind": "spend", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "переброс атаки при поджоге лавки с громилами", "result": "критическая удача", "sec": 3196, "who_url": "/c/bes-misha/", "reason_html": "переброс атаки при поджоге лавки с громилами"}, {"t": "0:55:56", "kind": "spend", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "переброс проверки Ловкости — взлом клетки самодельными отмычками из погнутых очков", "result": "не получилось вскрыть вовремя, спасать пленника пришлось Бесу Мише", "sec": 3356, "who_url": "/c/glamur/", "reason_html": "переброс проверки Ловкости — взлом клетки самодельными отмычками из погнутых очков"}, {"t": "0:58:39", "kind": "earn", "who": "Сатир Дудочник", "actor": "Илья Сатир", "to": null, "reason": "героически вытащил задыхающуюся от дыма Кристиночку вместо того, чтобы искать добычу в горящей лавке", "result": null, "sec": 3519, "who_url": "/c/satir-dudochnik/", "reason_html": "героически вытащил задыхающуюся от дыма <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a> вместо того, чтобы искать добычу в горящей лавке"}, {"t": "0:59:20", "kind": "loot", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "нашёл тайник Ливая под половицей — 2000 кукол-уродцев, 100 золотых монет и зелья", "result": null, "sec": 3560, "who_url": "/c/bes-misha/", "reason_html": "нашёл тайник Ливая под половицей — 2000 кукол-уродцев, 100 золотых монет и зелья"}, {"t": "1:00:48", "kind": "loot", "who": "Сатир Дудочник", "actor": "Илья Сатир", "to": null, "reason": "обыскал труп Ози при побеге через окно — две золотые монеты, ключ от клетки и магический свиток", "result": null, "sec": 3648, "who_url": "/c/satir-dudochnik/", "reason_html": "обыскал труп Ози при побеге через окно — две золотые монеты, ключ от клетки и магический свиток"}, {"t": "1:10:56", "kind": "earn", "who": "Федук", "actor": "BRB", "to": null, "reason": "меткое замечание — в таверну и так пускают всех, незачем было гримироваться", "result": null, "sec": 4256, "who_url": "/c/fiduk/", "reason_html": "меткое замечание — в таверну и так пускают всех, незачем было гримироваться"}, {"t": "1:15:59", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "разменяли золотую монету на пять серебряных, чтобы снять VIP-комнату в таверне", "result": null, "sec": 4559, "who_url": null, "reason_html": "разменяли золотую монету на пять серебряных, чтобы снять VIP-комнату в таверне"}, {"t": "1:41:29", "kind": "earn", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "самодельная маска из ткани и хрома спасла его от грибных спор при входе в подземную пещеру", "result": null, "sec": 6089, "who_url": "/c/glamur/", "reason_html": "самодельная маска из ткани и хрома спасла его от грибных спор при входе в подземную пещеру"}], "totals": [{"who": "Глам'Ур", "actor": "Руслан Усачев", "earned": 4, "spent": 1, "img": "img/chars/glam-ur.webp", "who_url": "/c/glamur/", "actor_url": "/p/ruslan-usachev/"}, {"who": "Федук", "actor": "BRB", "earned": 2, "spent": 0, "img": null, "who_url": "/c/fiduk/", "actor_url": "/p/brb/"}, {"who": "Бес Миша", "actor": "Гудков", "earned": 0, "spent": 1, "img": "img/chars/misha.webp", "who_url": "/c/bes-misha/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сатир Дудочник", "actor": "Илья Сатир", "earned": 1, "spent": 0, "img": "img/chars/satir-dudochnik.webp", "who_url": "/c/satir-dudochnik/", "actor_url": "/p/satir/"}], "notes": "Много монет в этом выпуске — внутриигровые деньги (ставки на бой нищего, тайник Ливая на 100 золотых, обыск трупа Ози, размен на серебро), они отмечены как loot и не входят в totals. В конце выпуска на столе было 6 монет плюс докинутые 3 = 9 монет (90 000 руб на благотворительность) — это общий подсчёт, не привязанный к конкретному персонажу."}, "cast": [{"name": "Сатир Дудочник", "actor": "Сатир", "actor_url": "/p/satir/", "race": "сатир, бард", "role": "", "fate": "выжил; остался в борделе куртизанкой Жанетт", "id": "Дудочник", "url": "/c/satir-dudochnik/", "img": "img/chars/satir-dudochnik.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Глам'Ур", "actor": "Руслан Усачев", "actor_url": "/p/ruslan-usachev/", "race": "тёмный эльф, охотник", "role": "", "fate": "выжил", "id": "Гламур", "url": "/c/glamur/", "img": "img/chars/glam-ur.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}]}, {"name": "Федук", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "полурослик, моряк-драчун", "role": "", "fate": "выжил", "id": "Федук", "url": "/c/fiduk/", "img": null, "other": [{"key": "37", "label": "37", "title": "Добровольцы"}]}, {"name": "Бес Миша", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "бес (инфернал)", "role": "", "fate": "выжил", "id": "Миша", "url": "/c/bes-misha/", "img": "img/chars/misha.webp", "other": [{"key": "17", "label": "17", "title": "Демонизация"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "35", "label": "35", "title": "Второй Шанс"}]}], "npcs": [{"name": "Кристина", "actor": "", "actor_url": null, "race": "", "role": "эльфийка, сестра Дододиса, хозяйка лавки всякой всячины", "fate": "выжила, спасла половину груза", "id": "Кристина", "url": "/c/kristina/", "img": "img/chars/kristina.webp", "other": [{"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}]}, {"name": "Дододис", "actor": "", "actor_url": null, "race": "", "role": "эльф, прежний владелец лавки", "fate": "погиб до событий выпуска (бой с драконом Гимелом)", "id": "Янус", "url": "/c/yanus/", "img": "img/chars/dododis.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "18", "label": "18", "title": "Охота на младенца"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}]}, {"name": "Допс", "actor": "", "actor_url": null, "race": "", "role": "кучер-перевозчик", "fate": "спасён, исцелён от грибного морока", "id": null, "url": null, "img": null, "other": []}, {"name": "Ливай", "actor": "", "actor_url": null, "race": "", "role": "купец Гнилой Гавани, проиграл лавку и себя", "fate": "спасён, продал душу бесу Мише", "id": null, "url": null, "img": null, "other": []}, {"name": "Ози", "actor": "", "actor_url": null, "race": "", "role": "бандит, владелец лавки Ливая и клетки с заражёнными", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Алёна", "actor": "", "actor_url": null, "race": "", "role": "жена Ози", "fate": "сбежала", "id": "Алёна", "url": "/c/alyona/", "img": null, "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}]}, {"name": "Рапунцель", "actor": "", "actor_url": null, "race": "", "role": "трёхметровая великанша, хозяйка борделя «Налево от сосны»", "fate": "исцелена, выжила", "id": null, "url": null, "img": null, "other": []}, {"name": "Кристал", "actor": "", "actor_url": null, "race": "", "role": "куртизанка, удерживала Допса", "fate": "выжила", "id": "Кристал", "url": "/c/kristal/", "img": null, "other": [{"key": "25", "label": "25", "title": "Остров соблазна"}]}, {"name": "Сыроега", "actor": "", "actor_url": null, "race": "", "role": "демонический гриб из ада («мама»)", "fate": "погибла (иссушена)", "id": null, "url": null, "img": null, "other": []}, {"name": "Однорукий нищий", "actor": "", "actor_url": null, "race": "", "role": "мошенник в порту", "fate": "сбежал", "id": null, "url": null, "img": null, "other": []}, {"name": "Попугай Ози", "actor": "", "actor_url": null, "race": "", "role": "говорящий попугай", "fate": "забран Глам'Уром", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "Путешествие к <a class=\"ref\" href=\"/place/nergal/\">Нергалу<\/a>: гибель <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a>, дракон Гимел, предательство <a class=\"ref\" href=\"/c/miratorg/\">Мироторга<\/a>, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> и <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> с <a class=\"ref\" href=\"/c/kristina/\">Кристиной<\/a>", "dir": "out", "color": "#B8901C"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> уничтожил тело для духа Тёмного Властелина", "dir": "out", "color": "#C8423B"}, {"key": "37", "label": "37", "title": "Добровольцы", "note_html": "<a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> и отряд добровольцев, уничтоживший демоническое оружие", "dir": "out", "color": "#3E9A5E"}, {"key": "39", "label": "39", "title": "Кунисская пленница", "note_html": "Упомянута сестра Эльфдодиса <a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>", "dir": "back", "color": "#B8901C"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Запрет бесов и «паспорт хорошей твари»", "dir": "out", "color": "#B03A7A"}, {"key": "51", "label": "51", "title": "Точка невозврата", "note_html": "Вероятная отсылка: сатир <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> и история его жены со «вторым мужем»", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Это подземелье Чикен Карри. От гондона до подвига всего пять ходов».", "«Он же не женщину бьёт, он женщиной бьёт».", "«Ты женщина, я козёл. Всё как в нормальных русских семьях».", "«Выкинь эту штуку. Убей грибную суку».", "«Женщина — это не пол, это состояние души»."], "places_html": "<ul>\n<li>Столица <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> — лавка всякой всячины; пиратский город <a class=\"ref\" href=\"/place/gnilaya-gavan/\">Гнилая Гавань<\/a> (таверна «Кровавый поплавок», лавка Ливая — сгорела); старый тракт; таверна-бордель «Налево от сосны» (особняк в лесу за сосной, погреб и грибная пещера); вулкан <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a> (предыстория).<\/li>\n<li>Фракции: демонические силы (Сыроега), пираты и бандиты Гнилой Гавани, громилы Ози.<\/li>\n<li>Артефакты и предметы: куклы «зубастые уродцы» (2000 шт., половина сожжена); компас поиска <a class=\"ref\" href=\"/c/fiduk/\">Федука<\/a> (ищет в радиусе 300 м); фен «Дайсон» (3 заряда обжигающего ветра); зелья лечения болезней (вылечивают грибное заражение); кинжал из адской стали; «паспорт хорошей твари»; магический свиток; йога-панталоны; ядовитый хвост беса.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>25<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>25<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>4<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>5<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>6<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>10<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa32-33\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><span class=\"tag\">возможно, шутка<\/span><b>Лавка Дододиса, возможно, достанется Кристине<\/b><\/div><p>Авторы мельком сказали, что после гибели <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> его лавка всякой всячины достанется <a class=\"ref\" href=\"/c/kristina/\">Кристине<\/a>.<\/p><blockquote>«А ей достанется лавка Додиса»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-33\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8777\" target=\"_blank\" rel=\"noopener\">2:26:17 в видео ↗<\/a> · о выпуске <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa40-5\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Удобный стул Кости Пушкина и новые стулья с 43-го выпуска<\/b><\/div><p><a class=\"ref\" href=\"/p/kostya-pushkin/\">Костя Пушкин<\/a> сидел на офисном стуле, потому что после выпуска 16 отказался сидеть на «корытах» за игровым столом. С 43-го выпуска за столом стоят новые, более мягкие стулья со спинкой; их кусочек показали в рекламной интеграции выпуска 40.<\/p><blockquote>«Начиная с сорок третьего выпуска… Впервые вы увидите эти стулья.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa40/#qa40-5\">Подкаст по #40<\/a> · <a href=\"https://youtu.be/xeMzbeaWtQg?t=1585\" target=\"_blank\" rel=\"noopener\">0:26:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Нападки на мастера чистили в монтаже; ругань Усачева вырезали<\/b><\/div><p>Авторы рассказали, что в первом выпуске с <a class=\"ref\" href=\"/p/aleksandra-bortich/\">Бортич<\/a> многое вычистили, зная, как зрители относятся к нападкам на мастера; поэтому мастер и сидит в рубке, вдали от стола. В выпуске 42 ничего не вырезали — атмосфера была дружеской. А в выпуске с <a class=\"ref\" href=\"/p/ruslan-usachev/\">Русланом Усачевым<\/a> тот всерьёз посылал Бреганова, и это пришлось вырезать.<\/p><blockquote>«Это не выпуск с Русланом Усачевым, где он посылал Бреганова, и это всё пришлось вырезать в итоге из выпуска.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-2\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=781\" target=\"_blank\" rel=\"noopener\">0:13:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-6\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>В выпуске 43 застряли на первой локации<\/b><\/div><p>В выпуске 43 (с <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатиром<\/a> и <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачевым<\/a>) мастера задумали три локации, но игроки около пяти часов провели в первой.<\/p><blockquote>«Во время игры у нас было задумано… сколько мы 5 часов сидели в первой локации: локация раз, локация два, локация три.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-6\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=2125\" target=\"_blank\" rel=\"noopener\">0:35:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa41-42-28\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезанная сцена с крабом Крэбсом<\/b><\/div><p>Селезнёв вырезал из выпуска 42 сцену, где <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> уговаривает своего напарника, краба Крэбса, вместе с таксой <a class=\"ref\" href=\"/c/zhanuariya/\">Женуарии<\/a> сходить на озеро Аземпик, — она не двигала сюжет; в подкасте её показали. Ранее так же вырезали жабу <a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачева<\/a>, а в выпуске 43 под угрозой вырезки попугай.<\/p><blockquote>«Вадик это вырезал. Он сказал: «А нахрена? Это никак не двигает сюжет»<\/blockquote><p class=\"note\"><a href=\"/pod/qa41-42/#qa41-42-28\">Подкаст по #41 и #42<\/a> · <a href=\"https://youtu.be/CeOY3-RoBxM?t=5450\" target=\"_blank\" rel=\"noopener\">1:30:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/42/\" title=\"Чудная Долина\">#42<\/a>, <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Героев в последний момент отодвинули от лавки Ливая<\/b><\/div><p>Изначально выпуск должен был начинаться прямо у лавки Ливая, но авторы в последний момент перенесли героев в порт Гнилой Гавани, чтобы они сами искали лавку. Из-за этого съёмка затянулась примерно на 8 часов.<\/p><blockquote>«Но мы в последний момент решили, короче, вас отодвинуть.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-1\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=450\" target=\"_blank\" rel=\"noopener\">0:07:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Однорукого нищего сделали мошенником задним числом<\/b><\/div><p>Нищий задумывался настоящим одноруким калекой. После того как <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> и <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> устроили его избиение с тотализатором, авторы решили «легализовать» сцену и придумали, что он мошенник, прятавший вторую руку.<\/p><blockquote>«И мы придумали, что он, короче, не настоящий инвалид.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-2\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=605\" target=\"_blank\" rel=\"noopener\">0:10:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-3\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезан армрестлинг Федука в «Кровавом поплавке»<\/b><\/div><p>Уже после победы над Ози <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> зашёл в таверну «Кровавый поплавок», выиграл у тавернщика в армрестлинг и получил монету. Сцену вырезали вместе с выдачей монеты.<\/p><blockquote>«Ты зашёл с тавернщиком, вступил в поединок в армрестлинг, победил его, забрал монету и вышел.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-3\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=665\" target=\"_blank\" rel=\"noopener\">0:11:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-4\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Вырезанная локация: лесная засада Робина Гульфа<\/b><\/div><p>По дороге в «Налево от сосны» героев ждала засада разбойника Робина Гульфа (прообраз Робина Гуда), грабившего контрабандистов на старом тракте. Он хвастался сотнями бойцов, но из-за грибной эпидемии у него осталось человека четыре, включая монаха. Сцену вырезали ещё на съёмке ради времени.<\/p><blockquote>«Робин Гульф говорит о том, что у меня в отряде сотни бойцов... А на самом деле у него в отряде осталось четыре человека.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa43-44/#qa43-44-4\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=727\" target=\"_blank\" rel=\"noopener\">0:12:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-5\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>В лесу была ловушка со спорами — подсказка про маски<\/b><\/div><p>В лесной локации было споровое облако-ловушка, такое же, как на входе в пещеру Сыроеги. Там герои должны были получить подсказку надеть маски; без вырезанной сцены они додумались до масок сами.<\/p><blockquote>«По идее вот эти маски, вот эту подсказку вы должны были получить в лесу при столкновении с разбойниками.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-5\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=784\" target=\"_blank\" rel=\"noopener\">0:13:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-6\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Мужья всерьёз думали убить Кристину<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> и Сатир с самого начала обсуждали, не убить ли <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> первым же действием, и в эпизоде возвращались к этой идее. Не решились, опасаясь, что развалится сюжет. Контракт о переходе лавки к <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочнику<\/a> был частью этого замысла.<\/p><blockquote>«И мы начали разгонять, что мы можем просто первым же действием её убить.»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa43-44/#qa43-44-6\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=912\" target=\"_blank\" rel=\"noopener\">0:15:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-7\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Кристиночку хотели отдать Гудкову<\/b><\/div><p>Авторы обсуждали, чтобы <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> играл не мастер, а <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a>. Отказались, чтобы она оставалась милым пассивным наблюдателем и не превратилась в персонажа, выясняющего отношения с мужьями, как в выпуске 32.<\/p><blockquote>«Мы думали о том, чтобы Кристиночка была не NPC, а всё-таки дать её одному из игроков за столом. — Гудку.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-7\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=1108\" target=\"_blank\" rel=\"noopener\">0:18:28 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-8\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Арка Глам&#x27;Ура: матриархат как культ<\/b><\/div><p><a class=\"ref\" href=\"/p/ruslan-usachev/\">Усачев<\/a> заранее задумал развитие Глам'Ура: эльф осознаёт, что матриархат, в котором он вырос, — это культ, и что женщина может ошибаться. В финале он хотел произнести об этом речь перед боем с Сыроегой, но <a class=\"ref\" href=\"/c/satir-dudochnik/\">Сатир<\/a> перебил его атакой; его вспышку злости вырезали.<\/p><blockquote>«Мне бы хотелось развить его к тому, что он осознаёт, что вот этот матриархат — это по сути культ, в котором он был выращен.»<\/blockquote><p class=\"note\">Усачев · <a href=\"/pod/qa43-44/#qa43-44-8\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=1360\" target=\"_blank\" rel=\"noopener\">0:22:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-9\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>План Сыроеги: эпидемия через игрушки в столице<\/b><\/div><p>Сыроега обосновалась в борделе, где останавливаются купцы и контрабандисты, и через очарованных узнавала, кто что везёт. Ценный груз она не крала, а начиняла спорами, чтобы его довезли до столицы: когда ребёнок дёрнет за ниточку и уродец скажет «Мама!», началась бы эпидемия. Это была диверсия демонов в тылу, в обход застывшего фронта (как в выпуске 37).<\/p><blockquote>«Когда Кристина их продаст, они разлетятся по рукам, потянут за ниточку, чтобы зубастый уродец сказал: «Мама!» И начнётся эпидемия.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-9\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=1783\" target=\"_blank\" rel=\"noopener\">0:29:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/37/\" title=\"Добровольцы\">#37<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa43-44-10\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Сыроега не родня Гибилонычу<\/b><\/div><p>На вопрос, не мать ли Сыроега <a class=\"ref\" href=\"/c/gebeloma/\">Гибилонычу<\/a>, авторы ответили, что это существа разного вида: Гибилоныч — маленький гриболюд, а Сыроега — адский грибной демон.<\/p><blockquote>«Они вообще разного вида, хоть они и грибные.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-10\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=1844\" target=\"_blank\" rel=\"noopener\">0:30:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a>, <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa43-44-11\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Первую диверсию — заражённые одеяла — сорвал Робин Гульф<\/b><\/div><p>До кукол демоны пытались провезти заражённые одеяла, и именно этот груз перехватили разбойники Робина Гульфа. Одеялами заразили и людей в клетке у лавки Ози. Герои об этом так и не узнали.<\/p><blockquote>«Первую диверсию сорвал Робин Гульф и его разбойники, когда они перехватили груз одеял.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-11\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=1965\" target=\"_blank\" rel=\"noopener\">0:32:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-12\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Бой с Ози был необязательным<\/b><\/div><p>Ози необязательно было убивать: Ливая, проигравшего самого себя, можно было выиграть в карты или выкупить, а Ози был простым торговцем и вымогателем.<\/p><blockquote>«Можно было его в карты выиграть, можно было что угодно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-12\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2215\" target=\"_blank\" rel=\"noopener\">0:36:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa43-44-13\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Дан Балан в борделе «Налево от сосны» — пасхалка<\/b><\/div><p>Художница Лиза нарисовала <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> в таверне по мотивам предыстории Дины, а у входа поставили повозку «Красного и Красного». По версии авторов, вампир налаживал поставки для своего бизнеса; он не дышит, поэтому споры на него не действуют. Часть гостей не была очарована — например, купец, с которым говорил <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a>, не заходил в туалет.<\/p><blockquote>«Он вампир, он не дышит, он не чувствовал запаха. И то, что там происходило, не самое странное, что Дан Балан видел.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-13\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2279\" target=\"_blank\" rel=\"noopener\">0:37:59 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-14\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Купец в борделе — «купец-пупец» из рекламных интеграций<\/b><\/div><p>Купец, с которым <a class=\"ref\" href=\"/c/fiduk/\">Федук<\/a> поговорил в борделе, — персонаж рекламных интеграций (впервые появлялся в интеграции про Отряд Солнца, в «Барсуке»). Его встречу с героем <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> авторы вставили как кроссовер. Демонам он был неинтересен, потому что не вёз ценного груза.<\/p><blockquote>«Это вот как раз-таки был купец из интеграции. У него ещё имени нету.»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa43-44/#qa43-44-14\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2342\" target=\"_blank\" rel=\"noopener\">0:39:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-15\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Два вида спор Сыроеги<\/b><\/div><p>У Сыроеги два вида спор. Споры очарования (спасбросок Мудрости, сложность 18) действуют 24 часа: жертва не замечает, что очарована, но Сыроега в любой момент может ей приказать, например сделать живым щитом; от многократного повторения за полгода-год очарование становится постоянным. Таких людей выдают мутные глаза. Споры заражения за три дня превращают человека в грибного зомби, по сути мертвеца; ими начинили кукол и одеяла. Если бы герои зашли в туалет борделя, их накрыло бы спорами очарования.<\/p><blockquote>«Есть споры очарования, которыми она держала под контролем всю таверну... А есть споры заражения, которые делают из людей в течение трёх дней зомби.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa43-44/#qa43-44-15\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2455\" target=\"_blank\" rel=\"noopener\">0:40:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa43-44-16\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Прообраз Сыроеги — демон Зуггтмой из D&amp;D<\/b><\/div><p>Зрители нашли прообраз Сыроеги в бестиарии D&amp;D — демоницу грибов Зуггтмой, чьи очарованные не подозревают о своём состоянии. Авторы сознательно не дали ей всевидения, как у Страда: связь с телами у неё была только через мицелий.<\/p><blockquote>«Есть референс реальный в бестиарии. Зуггтмой, по-моему, называется.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-16\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2748\" target=\"_blank\" rel=\"noopener\">0:45:48 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa43-44-17\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезана сцена с девушкой, связанной мицелием с Сыроегой<\/b><\/div><p>В первой комнате на втором этаже героев ждала девушка в трансе, к голове которой тянулся мицелий: через неё Сыроега получала информацию. Сцену вырезали, потому что мастер слишком легко её раскрыл.<\/p><blockquote>«Мы вырезали первое ваше столкновение, когда одна из девочек связывалась с Сыроегой.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-17\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2873\" target=\"_blank\" rel=\"noopener\">0:47:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa43-44-18\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Без фена Сыроегу победить было невозможно<\/b><\/div><p>Сыроега могла призывать грибы и заражённых; фен сразу убил двух заражённых и блокировал её. Без фена героев ждала верная смерть, поэтому авторы всеми силами подталкивали к нему игроков.<\/p><blockquote>«Её без фена, в принципе, победить невозможно было.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa43-44/#qa43-44-18\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=2937\" target=\"_blank\" rel=\"noopener\">0:48:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-19\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Если бы приняли предложение Сыроеги<\/b><\/div><p>Согласись герои стать слугами Сыроеги, они увезли бы заражённый груз, и следующим было бы приключение за грибных персонажей, заражающих города. Если бы просто забрали груз и уехали, Сыроега погналась бы за ними, телепортируясь по мицелию в заранее прописанные точки.<\/p><blockquote>«Мы бы сделали ещё и приключение про грибных персонажей, которые бы пытались заражать других людей в городах.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-19\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=3065\" target=\"_blank\" rel=\"noopener\">0:51:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa43-44-20\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Робин Гульф мог стать союзником<\/b><\/div><p>Герои могли подружиться с разбойниками Робина Гульфа, доказав, что они не контрабандисты, а при заражении монах из его отряда мог бы их вылечить.<\/p><blockquote>«Если б вы заразились, то монах Робина Гульфа мог бы вас вылечить.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa43-44/#qa43-44-20\">Подкаст по #43 и #44<\/a> · <a href=\"https://youtu.be/trPN7O0uNR0?t=3189\" target=\"_blank\" rel=\"noopener\">0:53:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/43/\" title=\"Груз Кристиночки\">#43<\/a><\/p><\/article><\/section>", "chars": {"Гламур": {"name": "Глам'Ур", "img": "img/chars/glam-ur.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%93%D0%BB%D0%B0%D0%BC'%D0%A3%D1%80", "summary": "Глам'Ур – тёмный эльф (дроу), охотник. Жених эльфийки Кристины.Основное оружие – Длинный лук, Рапира", "infobox": {"Пол": "Мужской", "Раса": "Дроу", "Тип": "Игровой", "Игрок": "Руслан Усачев"}, "actors": ["Руслан Усачев"], "kind": "pc", "dead": false, "race": "Дроу", "portraits": [], "url": "/c/glamur/", "eps": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}]}, "Янус": {"name": "Янус (Дододис)", "img": "img/chars/dododis.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%BE%D0%B4%D0%BE%D0%B4%D0%B8%D1%81", "summary": "Додо́дис — высший эльф-торговец, владелец «Лавки всякой всячины», брат эльфийки Кристины и хозяин Золотой Маски Януса.", "infobox": {"Пол": "Мужской", "Раса": "Эльф", "Тип": "Игровой", "Игрок": "Александр Гудков", "На вики": "Додод
