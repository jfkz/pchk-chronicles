<script>window.EPD = {"anim": false, "key": "43", "label": "43", "title": "Груз Кристиночки", "date": "2025-10-30", "minutes": 117, "duration": 7020.0, "video_id": "pBKAMk_J0qw", "branch": "Янус и дракон Гимелут", "branch_color": "#B8901C", "place": "Гнилая Гавань и таверна-бордель «Налево от сосны» на старом тракте к Кёнигпону", "short_html": "<a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> с мужьями и охраной ищет пропавший груз из двух тысяч кукол «зубастых уродцев».", "summary_html": "После гибели эльфа <a class=\"ref\" href=\"/c/yanus/\">Дододиса<\/a> в бою с драконом Гимелом его лавку всякой всячины в столице унаследовала сестра Кристина («<a class=\"ref\" href=\"/c/kristina/\">Кристиночка<\/a>»), которая чуть не разорилась и вложила последние деньги в 2000 модных кукол «зубастые уродцы». Кучер Допс с грузом пропал, и Кристина с двумя мужьями (сатиром <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочником<\/a> и тёмным эльфом Глам'Уром) и двумя охранниками (полуросликом <a class=\"ref\" href=\"/c/fiduk/\">Фидуком<\/a> и бесом Мишей) отправляется в Гнилую Гавань. Там герои убивают бандита Ози, захватившего лавку купца Ливая, спасают Ливая и выходят на след Допса в придорожном борделе «Налево от сосны». Выясняется, что бордель захвачен демоническим грибом Сыроегой, которая одурманивает людей спорами и начиняет кукол заразными капсулами — диверсия адских сил против королевства. Героям с помощью великанши Рапунцель и фена «Дайсон» удаётся иссушить демоницу; половину груза спасают, заражённую сжигают, а Дудочник решает остаться в борделе куртизанкой Жанетт.", "outcome_html": "Демоническая диверсия с заражёнными куклами сорвана, Сыроега уничтожена, лавка <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a> спасена половиной груза. Все герои выжили; <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> ушёл из семьи и остался в борделе.", "world_html": ["Уничтожен демонический гриб Сыроега, заражавший людей в Гнилой Гавани и на старом тракте", "Сорвана адская диверсия: заражённые куклы не попали в столицу", "Лавка Ливая в Гнилой Гавани сгорела", "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> владеет душой купца Ливая", "В королевстве запрещены бесы; <a class=\"ref\" href=\"/c/bes-misha/\">Миша<\/a> живёт легально по «паспорту хорошей твари»"], "scenes": [{"t": "0:01:26", "sec": 86, "html": "Предыстория: <a class=\"ref\" href=\"/c/yanus/\">Дододис<\/a> спас сестру <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> из вулкана <a class=\"ref\" href=\"/place/nergal/\">Нергал<\/a>, но друзья предали его (<a class=\"ref\" href=\"/c/miratorg/\">Мироторг<\/a> перешёл к дракону Гимелу, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> и <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> сбежали с Кристиной); сам эльф погиб в бою с драконом."}, {"t": "0:04:10", "sec": 250, "html": "<a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> едва не разорила лавку, заложила её и закупила в Гнилой Гавани у купца Ливая 2000 кукол «зубастые уродцы» (продаются в 10 раз дороже). Кучер Допс забрал товар, обещал быть через 2 недели — и пропал больше чем на месяц."}, {"t": "0:05:50", "sec": 350, "html": "Представление героев: <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> — первый муж <a class=\"ref\" href=\"/c/kristina/\">Кристины<\/a> (помирились после спасения от дракона, «традиционный полиаморный брак»); <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> — второй муж, чтит матриархат тёмных эльфов (получает обещанную на подкасте монету); <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a> — полурослик-моряк, проспавший пьяным сожжение своего корабля демонами и подвиг своего отряда, ушедший героем на пенсию в 23 года; <a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> — после уничтожения тела для духа Тёмного Властелина живёт в столице, получил «паспорт хорошей твари» в МФЦ (записался «рыболом»), охраняет Кристину по контракту за 20 лет её жизни."}, {"t": "0:11:58", "sec": 718, "html": "Прибытие в Гнилую Гавань у таверны «Кровавый поплавок». Компас поиска <a class=\"ref\" href=\"/c/fiduk/\">Фидука<\/a> указывает на кукол. <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> роется в ящиках «секонд-хенда» и находит йога-панталоны для жены."}, {"t": "0:15:04", "sec": 904, "html": "<a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> запугивает однорукого нищего: тот рассказывает о «заражённых», которых поймал некий Ози и показывает за деньги (заражение укусом или царапиной). <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> устраивает тотализатор, Дудочник «гуманно» душит нищего; толпа требует добить, но Глам'Ур убеждает её отказаться от кровавых боёв и возвращает ставки. <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a> реанимирует нищего — тот оказывается двуруким мошенником и сбегает с монетами."}, {"t": "0:24:52", "sec": 1492, "html": "Танцовщица в таверне сообщает: купец Ливай проиграл свою лавку в карты бандиту Ози. У лавки — громилы и клетка с заражёнными под покрывалом. <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> тревожится, что <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> ожесточился; тот пытается уговорить её переписать бизнес на него."}, {"t": "0:29:39", "sec": 1779, "html": "<a class=\"ref\" href=\"/c/bes-misha/\">Бес Миша<\/a> становится невидимым, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> проводит всех внутрь, выдав себя за «отца Ози — Кози». Внутри Ози с татуировкой на пальцах обыскивает стены, рядом его жена <a class=\"ref\" href=\"/c/alyona/\">Алёна<\/a> и попугай. Ливай, проигравший и себя, сидит в клетке с кляпом. <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> замечает отходящую половицу."}, {"t": "0:36:53", "sec": 2213, "html": "Драка: <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a> берёт <a class=\"ref\" href=\"/c/alyona/\">Алёну<\/a> в захват с «розочкой» у горла, бес колет Ози ядовитым хвостом, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> с Глам'Уром убивают громилу, Фидук опутывает ворвавшихся громил парусиной и затем бьёт ими… самой Алёной; Дудочник раскалывает Ози череп копытами. Алёна ранит Фидука и сбегает."}, {"t": "0:53:00", "sec": 3180, "html": "Бес поджигает лавку огненным снарядом, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> случайно раздувает пламя. Бес заключает с Ливаем контракт на его душу в обмен на спасение и вскрывает клетку кинжалом из адской стали; Дудочник выносит <a class=\"ref\" href=\"/c/kristina/\">Кристину<\/a> через окно. Под половицей тайник Ливая: 100 золотых и зелья (лечения, противоядие, 2 зелья лечения болезней); у Ози — ключ и магический свиток. Лавка взрывается; видно заражённых с грибами на лицах."}, {"t": "1:01:32", "sec": 3692, "html": "Ливай рассказывает: Допс поехал в столицу <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a> по старому тракту и наверняка застрял в «местечке, куда все заезжают» — таверне-борделе «Налево от сосны». <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> там завсегдатай."}, {"t": "1:03:37", "sec": 3817, "html": "У двухэтажного особняка, поросшего мхом, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> находит давно стоящую пустую телегу «Грузоперевозки Допса»; конь рассказывает, что хозяин не выходит около месяца («меня кормили 30 раз»)."}, {"t": "1:05:36", "sec": 3936, "html": "Бес-ворона залетает в окно второго этажа к трёхметровой великанше Рапунцель, хозяйке заведения: её волосы спутаны и мокры, а от фена «Дайсон» раскалывается голова. Разоблачив говорящего ворона, она прогоняет его."}, {"t": "1:10:59", "sec": 4259, "html": "На входе охрана с мутными глазами и грязной по колено обувью отбирает оружие; <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочника<\/a>, ударившего охранника «за <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a>», не пускают. Он гримируется под знакомую куртизанку <a class=\"ref\" href=\"/c/kristal/\">Кристал<\/a>, у которой выходной, и проходит внутрь. Внутри сыро, как в хамаме, зал освещён светящимися грибами. Остальные снимают VIP-комнату."}, {"t": "1:19:00", "sec": 4740, "html": "«<a class=\"ref\" href=\"/c/kristal/\">Кристал<\/a>»-<a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> выведывает у одурманенной «подруги»: Допса надо удерживать на втором этаже в комнате №2, хозяйка не выходит из-за волос, фен лежит в ванной. Компас <a class=\"ref\" href=\"/c/fiduk/\">Фидука<\/a> показывает кукол в бане и в вонючем туалете."}, {"t": "1:26:48", "sec": 5208, "html": "Герои поднимаются на поросший грибами второй этаж, вталкивают громилу в комнату №2 и убивают его; мицелий тянется к трупу — голову отрубают. У настоящей <a class=\"ref\" href=\"/c/kristal/\">Кристал<\/a> из платья вынимают иглы. Допс одурманен, считает, что заехал на день; зелье лечения болезней возвращает ему рассудок."}, {"t": "1:32:52", "sec": 5572, "html": "<a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a> под видом парикмахера-«противника фенов» проникает к Рапунцель, усыпляет её внимание «морской байкой» про цингу, а невидимый бес вливает ей зелье лечения болезней. Очнувшись, она сушит волосы — грибы в комнате гибнут. В ванной найдена инструкция к фену (3 заряда, горячий ветер сбивает с ног и мешает дальнобойным атакам)."}, {"t": "1:38:45", "sec": 5925, "html": "Рапунцель ведёт героев через кухню в погреб («они идут к маме?» — спрашивает повар). Маски из майки, пропитанные ромом, защищают от спор. В пещере под погребом заражённые мужчины вспарывают кукол из ящиков Допса и вкладывают в них пузыри с веществом."}, {"t": "1:41:39", "sec": 6099, "html": "Хозяйка пещеры — Сыроега («мама»), демонический гриб из ада в женском облике, захватывающий умы грешников. Она предлагает отдать груз, если герои снимут маски и станут её слугами."}, {"t": "1:45:28", "sec": 6328, "html": "Бой: фен блокирует её магию; <a class=\"ref\" href=\"/c/fiduk/\">Фидук<\/a> принимает удар ложноножки на себя, <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> наносит 72 урона критическим градом шипов, бес поджигает ром огненным снарядом, Рапунцель бьёт булавой, <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> оскорбляет её («молочница»), но теряет сознание. Глам'Ур подхватывает фен последним зарядом и иссушает Сыроегу до стручка; Фидук его съедает."}, {"t": "1:52:15", "sec": 6735, "html": "Заражённые приходят в себя. Половина кукол заражена капсулами — их сжигают, незаражённую половину <a class=\"ref\" href=\"/c/kristina/\">Кристина<\/a> забирает, чтобы спасти лавку брата. <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> дарит ей йога-панталоны."}, {"t": "1:54:40", "sec": 6880, "html": "Финал: <a class=\"ref\" href=\"/c/satir-dudochnik/\">Дудочник<\/a> объявляет, что нашёл своё место, и остаётся в борделе куртизанкой под именем Жанетт; <a class=\"ref\" href=\"/c/glamur/\">Глам'Ур<\/a> поддерживает («женщина — это не пол, а состояние души»). Герои получают 6 золотых, 3 монеты — в благотворительный фонд."}], "key_events": [{"t": "0:04:10", "sec": 250}, {"t": "0:15:04", "sec": 904}, {"t": "0:36:53", "sec": 2213}, {"t": "0:56:26", "sec": 3386}, {"t": "1:01:32", "sec": 3692}, {"t": "1:14:14", "sec": 4454}, {"t": "1:31:01", "sec": 5461}, {"t": "1:37:04", "sec": 5824}, {"t": "1:41:39", "sec": 6099}, {"t": "1:52:15", "sec": 6735}, {"t": "1:54:40", "sec": 6880}], "coins": {"ep": "43", "events": [{"t": "0:08:24", "kind": "other", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "монета, обещанная Глам'Уру ещё на другом ролике/подкасте (кроссовер), выдана в начале эпизода", "result": null, "sec": 504, "who_url": "/c/glamur/", "reason_html": "монета, обещанная Глам'Уру ещё на другом ролике/подкасте (кроссовер), выдана в начале эпизода"}, {"t": "0:17:07", "kind": "loot", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "в шутку кинул нищему-калеке золотую монету", "result": null, "sec": 1027, "who_url": "/c/glamur/", "reason_html": "в шутку кинул нищему-калеке золотую монету"}, {"t": "0:19:12", "kind": "loot", "who": "Сатир Дудочник", "actor": "Илья Сатир", "to": null, "reason": "собрал со ставок зевак на подпольный кулачный бой с нищим две золотые монеты (мошенническая схема)", "result": null, "sec": 1152, "who_url": "/c/satir-dudochnik/", "reason_html": "собрал со ставок зевак на подпольный кулачный бой с нищим две золотые монеты (мошенническая схема)"}, {"t": "0:23:51", "kind": "earn", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "тронул зрителя речью о негуманности боёв на деньги — тот отдал ему свои две золотые монеты", "result": "успешная проверка Вдохновение/Харизма — 21", "sec": 1431, "who_url": "/c/glamur/", "reason_html": "тронул зрителя речью о негуманности боёв на деньги — тот отдал ему свои две золотые монеты"}, {"t": "0:42:19", "kind": "earn", "who": "Фидук", "actor": "BRB", "to": null, "reason": "вместе с Глам'Уром прикончил громилу командной атакой, несмотря на неодобрение Кристиночки", "result": null, "sec": 2539, "who_url": "/c/fiduk/", "reason_html": "вместе с Глам'Уром прикончил громилу командной атакой, несмотря на неодобрение <a class=\"ref\" href=\"/c/kristina/\">Кристиночки<\/a>"}, {"t": "0:53:16", "kind": "spend", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "переброс атаки при поджоге лавки с громилами", "result": "критическая удача", "sec": 3196, "who_url": "/c/bes-misha/", "reason_html": "переброс атаки при поджоге лавки с громилами"}, {"t": "0:55:56", "kind": "spend", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "переброс проверки Ловкости — взлом клетки самодельными отмычками из погнутых очков", "result": "не получилось вскрыть вовремя, спасать пленника пришлось Бесу Мише", "sec": 3356, "who_url": "/c/glamur/", "reason_html": "переброс проверки Ловкости — взлом клетки самодельными отмычками из погнутых очков"}, {"t": "0:58:39", "kind": "earn", "who": "Сатир Дудочник", "actor": "Илья Сатир", "to": null, "reason": "героически вытащил задыхающуюся от дыма Кристиночку вместо того, чтобы искать добычу в горящей лавке", "result": null, "sec": 3519, "who_url": "/c/satir-dudochnik/", "reason_html": "героически вытащил задыхающуюся от дыма <a class=\"ref\" href=\"/c/kristina/\">Кристиночку<\/a> вместо того, чтобы искать добычу в горящей лавке"}, {"t": "0:59:20", "kind": "loot", "who": "Бес Миша", "actor": "Гудков", "to": null, "reason": "нашёл тайник Ливая под половицей — 2000 кукол-уродцев, 100 золотых монет и зелья", "result": null, "sec": 3560, "who_url": "/c/bes-misha/", "reason_html": "нашёл тайник Ливая под половицей — 2000 кукол-уродцев, 100 золотых монет и зелья"}, {"t": "1:00:48", "kind": "loot", "who": "Сатир Дудочник", "actor": "Илья Сатир", "to": null, "reason": "обыскал труп Ози при побеге через окно — две золотые монеты, ключ от клетки и магический свиток", "result": null, "sec": 3648, "who_url": "/c/satir-dudochnik/", "reason_html": "обыскал труп Ози при побеге через окно — две золотые монеты, ключ от клетки и магический свиток"}, {"t": "1:10:56", "kind": "earn", "who": "Фидук", "actor": "BRB", "to": null, "reason": "меткое замечание — в таверну и так пускают всех, незачем было гримироваться", "result": null, "sec": 4256, "who_url": "/c/fiduk/", "reason_html": "меткое замечание — в таверну и так пускают всех, незачем было гримироваться"}, {"t": "1:15:59", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "разменяли золотую монету на пять серебряных, чтобы снять VIP-комнату в таверне", "result": null, "sec": 4559, "who_url": null, "reason_html": "разменяли золотую монету на пять серебряных, чтобы снять VIP-комнату в таверне"}, {"t": "1:41:29", "kind": "earn", "who": "Глам'Ур", "actor": "Руслан Усачев", "to": null, "reason": "самодельная маска из ткани и хрома спасла его от грибных спор при входе в подземную пещеру", "result": null, "sec": 6089, "who_url": "/c/glamur/", "reason_html": "самодельная маска из ткани и хрома спасла его от грибных спор при входе в подземную пещеру"}], "totals": [{"who": "Глам'Ур", "actor": "Руслан Усачев", "earned": 4, "spent": 1, "img": "img/chars/glam-ur.webp", "who_url": "/c/glamur/", "actor_url": "/p/ruslan-usachev/"}, {"who": "Фидук", "actor": "BRB", "earned": 2, "spent": 0, "img": null, "who_url": "/c/fiduk/", "actor_url": "/p/brb/"}, {"who": "Бес Миша", "actor": "Гудков", "earned": 0, "spent": 1, "img": "img/chars/misha.webp", "who_url": "/c/bes-misha/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Сатир Дудочник", "actor": "Илья Сатир", "earned": 1, "spent": 0, "img": "img/chars/satir-dudochnik.webp", "who_url": "/c/satir-dudochnik/", "actor_url": "/p/satir/"}], "notes": "Много монет в этом выпуске — внутриигровые деньги (ставки на бой нищего, тайник Ливая на 100 золотых, обыск трупа Ози, размен на серебро), они отмечены как loot и не входят в totals. В конце выпуска на столе было 6 монет плюс докинутые 3 = 9 монет (90 000 руб на благотворительность) — это общий подсчёт, не привязанный к конкретному персонажу."}, "cast": [{"name": "Сатир Дудочник", "actor": "Сатир", "actor_url": "/p/satir/", "race": "сатир, бард", "role": "", "fate": "выжил; остался в борделе куртизанкой Жанетт", "id": "Дудочник", "url": "/c/satir-dudochnik/", "img": "img/chars/satir-dudochnik.webp", "other": [{"key": "01", "label": "1", "title": "Башня Колдуна"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Глам'Ур", "actor": "Руслан Усачев", "actor_url": "/p/ruslan-usachev/", "race": "тёмный эльф, охотник", "role": "", "fate": "выжил", "id": "Гламур", "url": "/c/glamur/", "img": "img/chars/glam-ur.webp", "other": [{"key": "32", "label": "32", "title": "Путешествие к Нергалу"}]}, {"name": "Фидук", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "полурослик, моряк-драчун", "role": "", "fate": "выжил", "id": "Фидук", "url": "/c/fiduk/", "img": null, "other": [{"key": "37", "label": "37", "title": "Добровольцы"}]}, {"name": "Бес Миша", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "бес (инфернал)"
