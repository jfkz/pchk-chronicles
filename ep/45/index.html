<script>window.EPD = {"key": "45", "label": "45", "title": "Реинкарнации Лёши", "date": "2025-12-28", "minutes": 117, "duration": 7029.0, "video_id": "E4Eb1lWFAOs", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Особняк дворфа-ювелира Латука Эсмеральдо во время новогоднего бала", "short_html": "Пять реинкарнаций души Избранного чада Лёши пробуждаются в его четырёхлетнем теле в плену у дворфа-ювелира Латука Эсмеральдо, который хочет обменять мальчика у демонов Чёрного Геленбурга на снятие проклятия со своего сына Бадьяна. Реинкарнации по очереди управляют телом, крадут ключ у няни Фриды, пробиваются через охрану во время новогоднего бала и убеждают Латука выступить против демона. Вызванный демон Джанна уничтожает реинкарнацию <a class=\"ref\" href=\"/c/chiharik/\">Чихарика<\/a> и проникает в разум Лёши, но остальные реинкарнации убивают его святым ударом. Проклятие с Бадьяна снято, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> спасён.", "summary_html": "Пять реинкарнаций души Избранного чада Лёши пробуждаются в его четырёхлетнем теле в особняке дворфа-ювелира Латука Эсмеральдо, где мальчика держат в плену. Латук заключил сделку с демонами Чёрного Геленбурга: они снимут проклятие с его сына Бадьяна (семилетний мальчик превратился в дряхлого старика) в обмен на Избранное дитя. Реинкарнации по очереди управляют телом: крадут ключ у няни Фриды, пробиваются через охрану и кухню во время новогоднего бала и уговаривают Латука выступить против демона. Вызванный красным углем демон Джанна, бывший «воображаемый друг» Бадьяна, убивает реинкарнацию <a class=\"ref\" href=\"/c/chiharik/\">Чихарика<\/a> и проникает в разум Лёши, но остальные реинкарнации уничтожают его в воспоминании Лёши о родителях. Проклятие с Бадьяна снято, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> спасён.", "outcome_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> спасён, демон Джанна уничтожен без возможности вернуться в ад, проклятие Бадьяна снято. Реинкарнация <a class=\"ref\" href=\"/c/chiharik/\">Чихарика<\/a> погибла навсегда.", "world_html": ["Избранное дитя <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> умеет разделять душу на реинкарнации, что защищает его разум от демонов-контролёров", "Демон Джанна из Чёрного Геленбурга уничтожен окончательно", "Сделка дворфа-ювелира Латука Эсмеральдо с демонами сорвана", "Демоны Геленбурга по-прежнему охотятся за Лёшей"], "scenes": [{"t": "0:01:10", "sec": 70, "html": "Предыстория: <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> родился проклятым в Зелёном Мосту, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пенисов<\/a> снял проклятие; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> узнала о божественном происхождении сына; служители храма Солнца считают его Избранным, демоны пытаются похитить его как сосуд для Тёмного Властелина. Лёша научился пророчествам, а затем — призывать реинкарнации своей души."}, {"t": "0:04:18", "sec": 258, "html": "Правила: пять реинкарнаций в одном теле, контроль над телом передаётся; в бою ребёнок получает «негативные эффекты» (синяк, ссадина, плач), после 4 попаданий миссия провалена; урон принимает реинкарнация, управляющая телом."}, {"t": "0:05:23", "sec": 323, "html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> приходит в себя в библиотеке особняка (следы сажи из закрытой двери; стражники ищут сбежавшего «мальца» и боятся гнева Латука). На ребёнка нападает латник с секирой. <a class=\"ref\" href=\"/c/pimpariel/\">Пимпариэль<\/a> магической рукой находит тайный проход за стеллажом, <a class=\"ref\" href=\"/c/puchok/\">Пучок<\/a> закрывает его за собой."}, {"t": "0:18:03", "sec": 1083, "html": "Странная детская: игрушки с дворфийскими рунами, взрослая кровать, ёлка, огромный подгузник. В тумбе — письмо матери Бадьяну Эсмеральдо «вскрыть в 14 лет» (мать, видимо, погибла). <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> наступает в подгузник, лечит ссадину; <a class=\"ref\" href=\"/c/chiharik/\">Чихарик<\/a> снимает с ёлки гирлянду как удавку."}, {"t": "0:24:18", "sec": 1458, "html": "Из шкафа выходит Бадьян — 7-летний мальчик в теле дряхлого голого старика; он дружит с Лёшей («мы оба проклятые»). Рассказывает: папа — ювелир Латук Эсмеральдо, няня — Фрида, раньше к нему приходил друг Джанна, в которого родители не верили; мама — Мальва Эсмеральдо; в подвале есть папина лодочка. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> находит три тайных хода."}, {"t": "0:34:57", "sec": 2097, "html": "Входит няня Фрида (пожилая дворфиха) с едой, подгузником и зельем. Удавка <a class=\"ref\" href=\"/c/chiharik/\">Чихарика<\/a> не срабатывает (она подставила подгузник). Фрида узнаёт: это «тот самый ребёнок, которого нужно обменять на здоровье Бадьяна». Чихарик ногой крадёт у неё из кармана универсальный ключ."}, {"t": "0:40:11", "sec": 2411, "html": "<a class=\"ref\" href=\"/c/puchok/\">Пучок<\/a> очаровывает Фриду: Лёшу поймали в ювелирной лавке Латука («новогодний подарок»); Латуку написали, что отдать нужно именно его; снять проклятие Бадьяна обещал «гость» (демон); внизу идёт новогодний бал. Пучок душит Фриду до потери сознания."}, {"t": "0:45:27", "sec": 2727, "html": "Трофейная комната с ловушкой на оружии: <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> ветром запускает сигнализацию. Реинкарнации прячутся в диване; стражники уводят Бадьяна. <a class=\"ref\" href=\"/c/chiharik/\">Чихарик<\/a> в облике крысы попадается; «говорящая крыса» обещает стражнику исполнить три желания, выманивая сведения (младенец сбежал из оплавленной клетки в подвале). Влагомир туманным шагом телепортирует тело обратно в детскую."}, {"t": "0:58:11", "sec": 3491, "html": "Бой со стражником у очнувшейся Фриды: <a class=\"ref\" href=\"/c/puchok/\">Пучок<\/a> в ярости избивает его, <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> добивает шипастой дубиной. Напуганная Фрида («ты демон!») даёт карту поместья и, поддавшись убеждению, соглашается проводить их вниз («Фрида Фригида, у меня самой никогда не было детей»). У стражника — топор, арбалет, святая вода. Выясняется, что проклятие снимается договором с демоном или его смертью. В подарочной коробке «маме <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>» — позолоченный браслет-кошка из лавки Латука."}, {"t": "1:10:50", "sec": 4250, "html": "Очарованный слуга объясняет: особняк без света (дворфы видят в темноте). С лестницы виден бальный зал (около 30 гостей, Латук). <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> захлопывает ветром двери, <a class=\"ref\" href=\"/c/puchok/\">Пучок<\/a> вырубает официанта, реинкарнации врываются на кухню."}, {"t": "1:16:08", "sec": 4568, "html": "Бой на кухне с двумя дворфами-охранниками: <a class=\"ref\" href=\"/c/puchok/\">Пучок<\/a> рубит топором, <a class=\"ref\" href=\"/c/chiharik/\">Чихарик<\/a> убивает одного ножом в глаз, <a class=\"ref\" href=\"/c/pimpariel/\">Пимпариэль<\/a> ранит второго кислотой, Пучок и Чихарик добивают. <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> получил ещё ранения, <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> лечит. Под бой курантов в бальном зале наступает Новый год."}, {"t": "1:27:44", "sec": 5264, "html": "В погребе <a class=\"ref\" href=\"/c/puchok/\">Пучок<\/a> оглушает слугу. В котельной — Латук с начальником стражи Хвощом собирается бросить в печь красный уголь для вызова демона. <a class=\"ref\" href=\"/c/pimpariel/\">Пимпариэль<\/a> выхватывает уголь магической рукой, <a class=\"ref\" href=\"/c/vlagomir/\">Влагомир<\/a> призывает двух огненнокрылых львов."}, {"t": "1:31:53", "sec": 5513, "html": "Латук признаётся: Бадьяна проклял демон, который жил рядом с сыном; Латук связался с демонами Чёрного Геленбурга, они обещали снять проклятие в обмен на Избранное дитя, которого он искал год. <a class=\"ref\" href=\"/c/donki-horni/\">Донки Хорни<\/a> убеждает его выступить против демона вместе (со второй попытки за монету)."}, {"t": "1:37:08", "sec": 5828, "html": "<a class=\"ref\" href=\"/c/donki-horni/\">Донки Хорни<\/a> освящает оружие; Латук бросает уголь в печь, из огненного вихря выходит демон Джанна в красном плаще. Донки Хорни наносит 36 урона карой света, <a class=\"ref\" href=\"/c/chiharik/\">Чихарик<\/a> — освящённым ножом, но Джанна двумя ударами когтей уничтожает реинкарнацию Чихарика навсегда. Джанна уговаривает Латука не нарушать договор и проникает в разум Лёши."}, {"t": "1:42:18", "sec": 6138, "html": "Внутри сознания — уютная комната-воспоминание: молодая девушка в очках (<a class=\"ref\" href=\"/c/sofiya/\">София<\/a>) и лысый полурослик (<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>) склонились над спящим Лёшей. Джанна ожидал найти беззащитного ребёнка и потрясён, что Избранное дитя умеет разделять душу; призывает бесов-импов."}, {"t": "1:44:26", "sec": 6266, "html": "Бой в разуме: пылевой вихрь <a class=\"ref\" href=\"/c/vlagomir/\">Влагомира<\/a>, молния <a class=\"ref\" href=\"/c/pimpariel/\">Пимпариэля<\/a> (26 урона, два беса сгорели), яростная атака Пучка (44 урона), удар копьём <a class=\"ref\" href=\"/c/donki-horni/\">Донки Хорни<\/a> с последней карой света — Джанна повержен. Поскольку последний удар был святым, демон не может вернуться в ад и распадается красным пеплом."}, {"t": "1:54:00", "sec": 6840, "html": "Бадьян снова становится маленьким мальчиком. <a class=\"ref\" href=\"/c/donki-horni/\">Донки Хорни<\/a> выпрашивает у Латука монеты (10 монет — 100 000 руб. в детский благотворительный фонд)."}], "key_events": [{"t": "0:05:23", "sec": 323}, {"t": "0:24:18", "sec": 1458}, {"t": "0:34:57", "sec": 2097}, {"t": "0:58:11", "sec": 3491}, {"t": "1:16:08", "sec": 4568}, {"t": "1:31:53", "sec": 5513}, {"t": "1:38:10", "sec": 5890}, {"t": "1:42:18", "sec": 6138}, {"t": "1:52:58", "sec": 6778}, {"t": "1:54:00", "sec": 6840}], "coins": {"ep": "45", "events": [{"t": "0:22:15", "kind": "earn", "who": "Чихарик", "actor": "Ваня Дмитриенко", "to": null, "reason": "находчиво снял гирлянду с ёлки, чтобы сделать из неё удушающее оружие", "result": null, "sec": 1335, "who_url": "/c/chiharik/", "reason_html":
