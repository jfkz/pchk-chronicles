<script>window.EPD = {"anim": false, "key": "04", "label": "4", "title": "Дворец Лорда Властона", "date": "2021-04-29", "minutes": 69, "duration": 4123.0, "video_id": "6sZbmjT1NxU", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Замок лорда Властона близ Геленбурга (на скалистом обрыве у моря)", "short_html": "Отряд <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> проникает на бал в замок лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, чтобы уничтожить древний кувшин, сделавший его тираном.", "summary_html": "Раньше лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> был справедливым правителем <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, но однажды нашёл в море древний кувшин и переменился: отгородился от народа в замке, а люди голодают. Отряд добровольцев <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> решает уничтожить амфору, которая якобы подчинила волю лорда. Во время бала герои проникают в замок: трое проходят по приглашениям, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> лезет через канализацию. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> соблазняет и убивает вельможу <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> в кабинете Властона, герои находят план тайника и разгадывают пароль «твёрдый знак». В подземном винном хранилище одна из двух амфор оказывается мимиком, а настоящую разбивают. Но появившийся Властон заявляет, что кувшин ни при чём: «Я никогда не стану прежним слабым лордом». Он сбрасывает героев через люк в бездну, и выпуск заканчивается клиффхэнгером.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Кальянная и секретный проход в тюрьме дворца\">5<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Кальянная и секретный проход в тюрьме дворца<\/b> Во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (вып. 4) были подготовлены кальянная и секретный проход в тюрьме, которую герои посетили, но прохода не нашли. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2590\" target=\"_blank\" rel=\"noopener\">0:43:10 ↗<\/a> · <a href=\"#qa18-10\">к записи<\/a><\/span><\/span>", "outcome_html": "Амфора уничтожена, но тирания <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> была его собственным выбором. Герои провалились в люк-ловушку под замком, их судьба остаётся открытой.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Провал в ад в выпуске 04 был задуман заранее\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Провал в ад в выпуске 04 был задуман заранее<\/b> Катсцена с провалом героев в бездну в конце выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">04<\/a> была задумана заранее как связка со следующим выпуском (адский поезд), чем бы ни кончилось приключение. <span class=\"note\">Подкаст по #21 · <a href=\"https://youtu.be/75PDShLb2xc?t=5710\" target=\"_blank\" rel=\"noopener\">1:35:10 ↗<\/a> · <a href=\"#qa21-41\">к записи<\/a><\/span><\/span>", "world_html": ["Первое появление лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> и замка Властона", "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> — тиран по собственной воле, амфора им не управляла", "Подтверждена дружба <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с колдуном <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a>", "У <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> есть жена и юная фаворитка <a class=\"ref\" href=\"/c/irina-tvyordaya/\">Ирэна Твёрдая<\/a>"], "scenes": [{"t": "0:00:05", "sec": 5, "html": "В таверне бард поёт балладу о подвигах «геройской четвёрки» из прошлых выпусков: колдун (#01), новогодний демон (#02), тролль (#03)."}, {"t": "0:04:42", "sec": 282, "html": "Завязка: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> был справедливым правителем <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Купаясь в море, он нашёл древний кувшин, построил замок вдали от города, народ нищает и голодает. Ходят слухи, что лордом управляет кувшин. Герои — отряд добровольцев, которые хотят уничтожить артефакт."}, {"t": "0:05:20", "sec": 320, "html": "Герои. <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> — гном из <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурга<\/a>, недавно с друзьями убивший демона; в таверне <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> познакомился с эльфийкой, матерью своего друга, и она позвала его в отряд. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> год назад уже пытался уничтожить амфору и добыл схему замка, но попался и был отправлен на пожизненную каторгу; недавно сбежал. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> — скрытый медиум (читает мысли, телекинез), прикрывается мастерской по ремонту карет; разорён налогами и собрал отряд. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> — благородная эльфийка-воровка, мать двух сыновей, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: BRB о Пахоме: обманщик, обиженный на налоги\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>BRB о Пахоме: обманщик, обиженный на налоги<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> назвал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> «крысятником» с особым навыком обмана, не слишком добрым по своей природе, и противопоставил его прямолинейному воину <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>. Мотив Пахома из выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> «закошмарил» налогами его каретную мастерскую, и он решил пробраться во дворец. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=2740\" target=\"_blank\" rel=\"noopener\">0:45:40 ↗<\/a> · <a href=\"#qa17-9\">к записи<\/a><\/span><\/span>"}, {"t": "0:08:07", "sec": 487, "html": "Отряд прячется в дворцовом саду у главных ворот, у них есть карта <a class=\"ref\" href=\"/c/volodimir/\">Володимира<\/a>. Идёт приём у лорда, гостей проверяет охрана. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> замечает трёх патрульных и двух дворян, которые предаются утехам у фонтана."}, {"t": "0:11:06", "sec": 666, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> незаметно крадёт одежду этих дворян с двумя приглашениями (монета), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> находит монету на дне фонтана. План: <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и Пахом идут как вельможи, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> в женском платье изображает придворную музыкантшу, а Володимир с вещами лезет через сточную трубу."}, {"t": "0:15:42", "sec": 942, "html": "В очереди придворные дамы сплетничают, что лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> ходит на бал с новой пассией, Ириной Твёрдой, при живой жене. Стражник с подозрением смотрит на Динь-Диня, но <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> с песней-вдохновением <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> убеждает его пропустить «подарок лорду».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранная Севстания во дворце Властона\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранная Севстания во дворце Властона<\/b> Авторы до сих пор жалеют, что в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-м<\/a> выпуске герои не зашли к жене <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>: она ревновала мужа к любовнице, с которой тот выходил к людям, сидела запертой в спальне и могла слить пароли и помочь проникнуть в замок. Её лицо намеренно не показали, поэтому позже Севстанию смогла сыграть Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a> (вып. 11). <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep04.md <a class=\"ref\" href=\"/c/stanislava/\">Жена Властона<\/a> описана лишь как автор гневной записки «по лору, вероятно, Севстания» — авторы подтвердили, что это Севстания, запертая и ревнующая, которая могла помочь героям.<\/span> <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2525\" target=\"_blank\" rel=\"noopener\">0:42:05 ↗<\/a> · <a href=\"#qa18-9\">к записи<\/a><\/span><\/span>"}, {"t": "0:18:25", "sec": 1105, "html": "Рекламная вставка: «умная камера Яндекса» переводит свиток с инфернального («Во имя Баала, пусть мир погрузится в Бездну…»).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Инфернальный язык — это английский\">8<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Инфернальный язык — это английский<\/b> Демоны говорили на английском — импровизация мастера: нужен был непонятный язык, который понимает <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Чебатков<\/a>. Это также отсылка к рекламе из выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>, где инфернальным тоже был английский. Бреганов действительно говорил по-английски, звук не переписывали. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=655\" target=\"_blank\" rel=\"noopener\">0:10:55 ↗<\/a> · <a href=\"#qa46-3\">к записи<\/a><\/span><\/span>"}, {"t": "0:19:58", "sec": 1198, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> в канализации надевает поверх своей одежды одежду товарищей и находит «говняную» монету. Он вылезает в комнату 5 — мусорную, где живёт разумный желатиновый куб Кисель, которого заточили перерабатывать кухонные отходы. Володимир представляется «Блины».<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кубы тянутся к солнцу, как мотыльки на огонь\">7<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кубы тянутся к солнцу, как мотыльки на огонь<\/b> Когда в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a> появился желатиновый куб Кисель, мечтавший о солнце, авторы ещё не придумали, что солнечный свет его сожжёт. Механику «мотылька, летящего на огонь» ввели позже, потому что тему любви кубов к солнцу много обыгрывали. Отсюда кислотные кубы в <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a>, которые любят солнце, но боятся его. <span class=\"note\">Подкаст по #36 · <a href=\"https://youtu.be/oEqxCRDdITw?t=1906\" target=\"_blank\" rel=\"noopener\">0:31:46 ↗<\/a> · <a href=\"#qa36-12\">к записи<\/a><\/span><\/span>"}, {"t": "0:26:35", "sec": 1595, "html": "Шуткой про «романахов» <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> смешит Киселя, и тот отрыгивает записки. Среди них письмо женским почерком: «<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>! Если ты будешь на приёме со своей мерзкой малолетней крысой, я устрою скандал!» Володимир имитирует голос Киселя, заманивает шеф-повара, душит его удавкой, скармливает кубу и надевает поварскую форму. Обещание вывести Киселя «к солнышку» он не выполняет.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Откуда Пахом знал повара Властона\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Откуда Пахом знал повара Властона<\/b> Готовясь проникнуть во <a class=\"ref\" href=\"/place/dvorec-vlastona/\">дворец<\/a> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (выпуск <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> изучал персонал. К тому же повар лорда — знаменитость с несколькими ресторанами в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. По правилам шоу то, что видит или слышит один герой, знают и остальные, если мастер не скажет обратного. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=3964\" target=\"_blank\" rel=\"noopener\">1:06:04 ↗<\/a> · <a href=\"#qa17-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранная Севстания во дворце Властона\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранная Севстания во дворце Властона<\/b> Авторы до сих пор жалеют, что в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-м<\/a> выпуске герои не зашли к жене <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>: она ревновала мужа к любовнице, с которой тот выходил к людям, сидела запертой в спальне и могла слить пароли и помочь проникнуть в замок. Её лицо намеренно не показали, поэтому позже Севстанию смогла сыграть Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a> (вып. 11). <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep04.md <a class=\"ref\" href=\"/c/stanislava/\">Жена Властона<\/a> описана лишь как автор гневной записки «по лору, вероятно, Севстания» — авторы подтвердили, что это Севстания, запертая и ревнующая, которая могла помочь героям.<\/span> <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2525\" target=\"_blank\" rel=\"noopener\">0:42:05 ↗<\/a> · <a href=\"#qa18-9\">к записи<\/a><\/span><\/span>"}, {"t": "0:32:20", "sec": 1940, "html": "Главный зал: фуршет, оркестр, входит лорд в парике с юной спутницей. К <a class=\"ref\" href=\"/c/zhanna/\">Жанне<\/a> подходит низкорослый лысый вельможа с моноклем и в орденах, <a class=\"ref\" href=\"/c/shalim/\">Шалим<\/a>. С песней <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> Жанна его соблазняет (критический успех). Шалим проводит её, «мужа» Пахома и «сестру» Динь-Диня мимо охраны в кабинет лорда."}, {"t": "0:37:07", "sec": 2227, "html": "Кабинет <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>: роскошь, картины о его жизни, над столом большой портрет лорда с колдуном <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a>. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> находит в камине недогоревшую записку «Не забудь твёрдый знак» и монету, а также царапины у картины.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: «Дворец Лорда Властона» трижды тестировали до съёмок\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>«Дворец Лорда Властона» трижды тестировали до съёмок<\/b> Приключение выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a> до съёмок трижды прогоняли на тестовых группах, и каждый раз оно проходило совершенно по-разному. Во дворце была «фишка»: если знать пароль, сразу понятно, где находится цель. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1307\" target=\"_blank\" rel=\"noopener\">0:21:47 ↗<\/a> · <a href=\"#qa16-6\">к записи<\/a><\/span><\/span>"}, {"t": "0:39:59", "sec": 2399, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> на кухне под видом шеф-повара <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a> запихивает теннисный мяч в картошку для лорда и отпугивает заподозрившего его официанта.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Откуда Пахом знал повара Властона\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Откуда Пахом знал повара Властона<\/b> Готовясь проникнуть во <a class=\"ref\" href=\"/place/dvorec-vlastona/\">дворец<\/a> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (выпуск <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> изучал персонал. К тому же повар лорда — знаменитость с несколькими ресторанами в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. По правилам шоу то, что видит или слышит один герой, знают и остальные, если мастер не скажет обратного. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=3964\" target=\"_blank\" rel=\"noopener\">1:06:04 ↗<\/a> · <a href=\"#qa17-12\">к записи<\/a><\/span><\/span>"}, {"t": "0:44:10", "sec": 2650, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> отвлекает <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> фокусами занимает его, <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> находит за картиной сейф. Жанна скрытым клинком бьёт Шалима в пах двойным уроном и отрезает ему голову «за женщин <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>». Пахом осуждает «неоправданную жестокость». Труп прячут под кровать, Жанна вскрывает сейф: там две монеты и план бани с плитами-буквами и рычагом."}, {"t": "0:51:11", "sec": 3071, "html": "<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> маскируется под маленького <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a>, и отряд выходит мимо стражи. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> находит комнату 8 — нерабочую баню с сухим бассейном, аквариумом с зубастыми рыбами, латунным рычагом и плитами с буквами."}, {"t": "0:53:00", "sec": 3180, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> порывается поговорить с лордом и громко окликает его, оркестр смолкает. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> парализующей иглой (со второй попытки, на монете) обездвиживает её. Лорд, решив, что женщина упала от страха перед ним, смеётся, Пахом отшучивается."}, {"t": "0:56:55", "sec": 3415, "html": "Отряд собирается в бане. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> встаёт на плиту «Ъ» и дёргает рычаг. Аквариум поднимается, под ним открывается винтовая лестница. Бесчувственную <a class=\"ref\" href=\"/c/zhanna/\">Жанну<\/a> спускают вниз с привязанной светящейся лютней.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: «Дворец Лорда Властона» трижды тестировали до съёмок\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>«Дворец Лорда Властона» трижды тестировали до съёмок<\/b> Приключение выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a> до съёмок трижды прогоняли на тестовых группах, и каждый раз оно проходило совершенно по-разному. Во дворце была «фишка»: если знать пароль, сразу понятно, где находится цель. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1307\" target=\"_blank\" rel=\"noopener\">0:21:47 ↗<\/a> · <a href=\"#qa16-6\">к записи<\/a><\/span><\/span>"}, {"t": "0:59:38", "sec": 3578, "html": "Подземное хранилище элитных вин, на пьедесталах две одинаковые амфоры. Очнувшаяся <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> хватает правую, и та оказывается мимиком: ложноножка тянет её в пасть. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> бьёт кинжалами (срабатывает удача полурослика), <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> усыпляет мимика заклинанием сна."}, {"t": "1:03:40", "sec": 3820, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> хватает вторую, настоящую амфору. Тёмная энергия рвётся в её разум, она сопротивляется, но бежит к лорду. Товарищ кошкой на верёвке опутывает ей ноги, Жанна падает, и амфора разбивается, выпуская лучи синей энергии. Среди осколков лежат три монеты. «Победа!»"}, {"t": "1:05:40", "sec": 3940, "html": "В хранилище спускается лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> с гвардейцами: «Очередная деревенщина, поверившая в миф, что мной управляет ваза. Здесь власть — я, я закон. Я никогда не стану прежним слабым лордом». Он дёргает бутылку-рычаг, и герои проваливаются в темноту («но это уже совсем другое приключение»).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Провал в ад в выпуске 04 был задуман заранее\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Провал в ад в выпуске 04 был задуман заранее<\/b> Катсцена с провалом героев в бездну в конце выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">04<\/a> была задумана заранее как связка со следующим выпуском (адский поезд), чем бы ни кончилось приключение. <span class=\"note\">Подкаст по #21 · <a href=\"https://youtu.be/75PDShLb2xc?t=5710\" target=\"_blank\" rel=\"noopener\">1:35:10 ↗<\/a> · <a href=\"#qa21-41\">к записи<\/a><\/span><\/span>"}, {"t": "1:06:47", "sec": 4007, "html": "Эпилог: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> хватает картофелину с теннисным мячом со словами «А сейчас я возьму её на вдохе». Итог: 8 монет, то есть 80 000 руб. в приют для кошек «Муркоша»."}], "key_events": [{"t": "0:04:42", "sec": 282}, {"t": "0:11:06", "sec": 666}, {"t": "0:22:55", "sec": 1375}, {"t": "0:29:00", "sec": 1740}, {"t": "0:34:04", "sec": 2044}, {"t": "0:37:07", "sec": 2227}, {"t": "0:47:10", "sec": 2830}, {"t": "0:54:34", "sec": 3274}, {"t": "0:59:38", "sec": 3578}, {"t": "1:01:16", "sec": 3676}, {"t": "1:04:42", "sec": 3882}, {"t": "1:05:40", "sec": 3940}], "coins": {"ep": "04", "events": [{"t": "0:12:14", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "получил монету за удачную скрытную кражу дворянской одежды и находку приглашений", "result": null, "sec": 734, "who_url": "/c/volodimir/", "reason_html": "получил монету за удачную скрытную кражу дворянской одежды и находку приглашений"}, {"t": "0:12:58", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "нашёл золотую монету на дне фонтана во дворце", "result": null, "sec": 778, "who_url": "/c/medium-pahom/", "reason_html": "нашёл золотую монету на дне фонтана во дворце"}, {"t": "0:21:08", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "нашёл (по проверке внимательности) золотую монету в грязи сточной трубы", "result": "судя по дальнейшей реплике («закрываю монета... в пизду»), монету, похоже, комично обронил/захлопнул дверью — возможно, поэтому она не попала в итоговый подсчёт", "sec": 1268, "who_url": "/c/volodimir/", "reason_html": "нашёл (по проверке внимательности) золотую монету в грязи сточной трубы"}, {"t": "0:38:47", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "в кабинете лорда нашла записку и золотую монету в камине (успешная проверка внимательности)", "result": null, "sec": 2327, "who_url": "/c/zhanna/", "reason_html": "в кабинете лорда нашла записку и золотую монету в камине (успешная проверка внимательности)"}, {"t": "0:50:39", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "взломала сейф лорда и нашла в нём две золотые монеты и пергамент с планом бани", "result": null, "sec": 3039, "who_url": "/c/zhanna/", "reason_html": "взломала сейф лорда и нашла в нём две золотые монеты и пергамент с планом бани"}, {"t": "0:55:07", "kind": "give", "who": "Жанна", "actor": "Кукушкин", "to": "Пахом", "reason": "отдала свою монету Пахому, чтобы он мог перебросить неудачную атаку парализующей иглой", "result": null, "sec": 3307, "who_url": "/c/zhanna/", "reason_html": "отдала свою монету <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a>, чтобы он мог перебросить неудачную атаку парализующей иглой"}, {"t": "0:55:18", "kind": "spend", "who": "Пахом", "actor": "BRB", "to": null, "reason": "потратил полученную от Жанны монету на переброс атаки парализующей иглой", "result": "попал, но иглой случайно поразил союзницу Жанну, парализовав её вместо цели", "sec": 3318, "who_url": "/c/medium-pahom/", "reason_html": "потратил полученную от <a class=\"ref\" href=\"/c/zhanna/\">Жанны<\/a> монету на переброс атаки парализующей иглой"}, {"t": "1:05:23", "kind": "earn", "who": null, "actor": null, "to": nul : "27", "title": "Достучаться до небес"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: BRB о Пахоме: обманщик, обиженный на налоги\">2<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>BRB о Пахоме: обманщик, обиженный на налоги<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> назвал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> «крысятником» с особым навыком обмана, не слишком добрым по своей природе, и противопоставил его прямолинейному воину <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>. Мотив Пахома из выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> «закошмарил» налогами его каретную мастерскую, и он решил пробраться во дворец. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=2740\" target=\"_blank\" rel=\"noopener\">0:45:40 ↗<\/a> · <a href=\"#qa17-9\">к записи<\/a><\/span><\/span>"}, {"name": "Жанна", "actor": "Никита Кукушкин", "actor_url": "/p/nikita-kukushkin/", "race": "эльфийка, благородная воровка-убийца", "role": "", "fate": "пропала (провалилась в люк-ловушку)", "id": "Жанна", "url": "/c/zhanna/", "img": "img/chars/zhanna.webp", "other": [{"key": "06", "label": "6", "title": "Адский поезд"}]}, {"name": "Володимир", "actor": "Илья Соболев", "actor_url": "/p/ilya-sobolev/", "race": "полурослик, головорез, беглый каторжник", "role": "", "fate": "пропал (провалился в люк-ловушку)", "id": "Володимир", "url": "/c/volodimir/", "img": "img/chars/volodimir.webp", "other": [{"key": "06", "label": "6", "title": "Адский поезд"}]}, {"name": "Динь-Динь", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "лесной гном, бард", "role": "", "fate": "пропал (провалился в люк-ловушку)", "id": "Динь-Динь", "url": "/c/din-din/", "img": "img/chars/din-din.webp", "other": [{"key": "02", "label": "2", "title": "Новогоднее <span class=\"ptype\">Дополнение<\/span> <b>Кубы тянутся к солнцу, как мотыльки на огонь<\/b> Когда в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a> появился желатиновый куб Кисель, мечтавший о солнце, авторы ещё не придумали, что солнечный свет его сожжёт. Механику «мотылька, летящего на огонь» ввели позже, потому что тему любви кубов к солнцу много обыгрывали. Отсюда кислотные кубы в <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a>, которые любят солнце, но боятся его. <span class=\"note\">Подкаст по #36 · <a href=\"https://youtu.be/oEqxCRDdITw?t=1906\" target=\"_blank\" rel=\"noopener\">0:31:46 ↗<\/a> · <a href=\"#qa36-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Кисель не обязан Брэндону жизнью — он благодарен за освобождение\">10<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Кисель не обязан Брэндону жизнью — он благодарен за освобождение<\/b> Формулировка «куб задолжал жизнь» неточна. Кисель — тот самый куб из мусорной комнаты (<a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-й<\/a> выпуск, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> — «Блины»), из которого в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку с контрактом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Когда <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> вернулся из ада, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный властелин<\/a> устроил во дворце место для <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала Асмодея<\/a> и выпустил Киселя из мусорной комнаты. Он единственный проявил к кубу участие, не смог лишь показать ему солнце, поэтому Кисель ему благодарен. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В summaries/ep51.md (п. 12 и список NPC) Кисель назван «обязанным хозяину жизнью»; по словам авторов, он не обязан жизнью, а благодарен Тёмному <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">властелину<\/a> за то, что тот выпустил его из мусорной комнаты и проявил к нему заботу.<\/span> <span class=\"note\">Подкаст по #51 и #52 · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7138\" target=\"_blank\" rel=\"noopener\">1:58:58 ↗<\/a> · <a href=\"#qa51-52-45\">к записи<\/a><\/span><\/span>"}, {"name": "Юджин", "actor": "", "actor_url": null, "race": "", "role": "шеф-повар замка", "fate": "погиб (задушен Володимиром, скормлен Киселю)", "id": "Юджин", "url": "/c/yudzhin/", "img": "img/chars/yudzhin.webp", "other": [{"key": "06", "label": "6", "title": "Адский поезд"}, {"key": "17", "label": "17", "title": "Демонизация"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Откуда Пахом знал повара Властона\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Откуда Пахом знал повара Властона<\/b> Готовясь проникнуть во <a class=\"ref\" href=\"/place/dvorec-vlastona/\">дворец<\/a> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (выпуск <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> изучал персонал. К тому же повар лорда — знаменитость с несколькими ресторанами в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. По правилам шоу то, что видит или слышит один герой, знают и остальные, если мастер не скажет обратного. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=3964\" target=\"_blank\" rel=\"noopener\">1:06:04 ↗<\/a> · <a href=\"#qa17-12\">к записи<\/a><\/span><\/span>"}, {"name": "Ирэна Твёрдая", "actor": "", "actor_url": null, "race": "", "role": "юная фаворитка Властона", "fate": "выжила", "id": "Ирэна Твёрдая", "url": "/c/irina-tvyordaya/", "img": "img/chars/irena-tvyordaya.webp", "other": [{"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}]}, {"name": "Жена Властона", "actor": "", "actor_url": null, "race": "", "role": "автор гневной записки (по лору Севстания)", "fate": "неизвестно", "id": "Станислава", "url": "/c/stanislava/", "img": "img/chars/sevstaniya.webp", "other": [{"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Несыгранная Севстания во дворце Властона\">4<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Несыгранная Севстания во дворце Властона<\/b> Авторы до сих пор жалеют, что в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-м<\/a> выпуске герои не зашли к жене <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>: она ревновала мужа к любовнице, с которой тот выходил к людям, сидела запертой в спальне и могла слить пароли и помочь проникнуть в замок. Её лицо намеренно не показали, поэтому позже Севстанию смогла сыграть Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a> (вып. 11). <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep04.md <a class=\"ref\" href=\"/c/stanislava/\">Жена Властона<\/a> описана лишь как автор гневной записки «по лору, вероятно, Севстания» — авторы подтвердили, что это Севстания, запертая и ревнующая, которая могла помочь героям.<\/span> <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2525\" target=\"_blank\" rel=\"noopener\">0:42:05 ↗<\/a> · <a href=\"#qa18-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b> Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку. <span class=\"note\">Подкаст по #49 · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 ↗<\/a> · <a href=\"#qa49-5\">к записи<\/a><\/span><\/span>"}, {"name": "Мимик", "actor": "", "actor_url": null, "race": "", "role": "монстр в облике амфоры", "fate": "усыплён", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "01", "label": "1", "title": "Башня колдуна", "note_html": "Портрет <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с колдуном <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a>; <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> — мать <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "02", "label": "2", "title": "Новогоднее приключение", "note_html": "<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> вспоминает убийство демона в <a class=\"ref\" href=\"/place/kaltenburg/\">Кальтенбурге<\/a>; <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> — мать <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>", "dir": "out", "color": "#7D8A84"}, {"key": "03", "label": "3", "title": "Пещера кобольдов", "note_html": "Вступительная баллада пересказывает победу над троллем", "dir": "out", "color": "#7D8A84"}, {"key": "06", "label": "6", "title": "Адский поезд", "note_html": "Продолжение ветви <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>: адский поезд, где погибнет <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "note_html": "Мать <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> — эльфийка <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>; здесь появляется отец", "dir": "back", "color": "#2F84C8"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "Уничтожение амфоры во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> разбил амфору во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Очередная деревенщина, поверившая в миф, что мной управляет ваза. Я закон. Я никогда не стану прежним слабым лордом». (<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>)", "«Как игрок я тебя поддерживаю, но как эльфийка, благородная воровка, я ему отрезаю голову». (<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a>/<a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a>)", "«<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>! Если ты будешь на приёме со своей мерзкой малолетней крысой, я устрою скандал!» (записка жены)", "«Как называется плохое вино? Говняное вино». (сквозная шутка выпуска)", "«Я не Блины, я <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a>!» (Володимир — Киселю)"], "places_html": "<ul>\n<li><a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a>, замок лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> вдали от города на скалистом обрыве у моря: сад с фонтаном, канализация, мусорная комната Киселя, кухня, главный зал, кабинет лорда (сейф за картиной), баня №8 с аквариумом-лифтом, подземное винное хранилище, люк-ловушка.<\/li>\n<li>Гвардия лорда.<\/li>\n<li>Артефакты: древняя амфора (кувшин из моря, разбита; внутри была синяя энергия), амфора-мимик, план тайника, пароль «Ъ», светящаяся лютня, парализующие иглы <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>, награды <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> (украдены), «умная камера Яндекса».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>10<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>10<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>1<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>2<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>2<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa16-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Дворец Лорда Властона» трижды тестировали до съёмок<\/b><\/div><p>Приключение выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a> до съёмок трижды прогоняли на тестовых группах, и каждый раз оно проходило совершенно по-разному. Во дворце была «фишка»: если знать пароль, сразу понятно, где находится цель.<\/p><blockquote>«мы играли четвёртое приключение три раза, Дворец Властона, три раза до того, как выйти на съёмки»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-6\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1307\" target=\"_blank\" rel=\"noopener\">0:21:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>BRB о Пахоме: обманщик, обиженный на налоги<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> назвал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> «крысятником» с особым навыком обмана, не слишком добрым по своей природе, и противопоставил его прямолинейному воину <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериону<\/a>. Мотив Пахома из выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> «закошмарил» налогами его каретную мастерскую, и он решил пробраться во дворец.<\/p><blockquote>«у Пахома в особых навыках обман… Пахом классный персонаж для крысятничества, и я этим пользуюсь»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa17/#qa17-9\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=2740\" target=\"_blank\" rel=\"noopener\">0:45:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a>, <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa17-12\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Откуда Пахом знал повара Властона<\/b><\/div><p>Готовясь проникнуть во <a class=\"ref\" href=\"/place/dvorec-vlastona/\">дворец<\/a> <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (выпуск <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> изучал персонал. К тому же повар лорда — знаменитость с несколькими ресторанами в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. По правилам шоу то, что видит или слышит один герой, знают и остальные, если мастер не скажет обратного.<\/p><blockquote>«он готовился, изучал сотрудников, персонал дворца… повар именитый, лорда все его знают, у него несколько ресторанов в Геленбурге»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-12\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=3964\" target=\"_blank\" rel=\"noopener\">1:06:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-9\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Несыгранная Севстания во дворце Властона<\/b><\/div><p>Авторы до сих пор жалеют, что в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-м<\/a> выпуске герои не зашли к жене <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> <a class=\"ref\" href=\"/c/stanislava/\">Севстании<\/a>: она ревновала мужа к любовнице, с которой тот выходил к людям, сидела запертой в спальне и могла слить пароли и помочь проникнуть в замок. Её лицо намеренно не показали, поэтому позже Севстанию смогла сыграть Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a> (вып. 11).<\/p><blockquote>«я до сих пор горю по поводу того, что вы не зашли к Севстании во дворце и не поговорили с ней»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep04.md <a class=\"ref\" href=\"/c/stanislava/\">Жена Властона<\/a> описана лишь как автор гневной записки «по лору, вероятно, Севстания» — авторы подтвердили, что это Севстания, запертая и ревнующая, которая могла помочь героям.<\/p><p class=\"note\"><a href=\"/pod/qa18/#qa18-9\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2525\" target=\"_blank\" rel=\"noopener\">0:42:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-10\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Кальянная и секретный проход в тюрьме дворца<\/b><\/div><p>Во дворце <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> (вып. 4) были подготовлены кальянная и секретный проход в тюрьме, которую герои посетили, но прохода не нашли.<\/p><blockquote>«там ещё было очень много прикольного контента: кальянная была, и ещё в тюрьму, в которую вы зашли, но не нашли секретного прохода»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-10\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2590\" target=\"_blank\" rel=\"noopener\">0:43:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa21-41\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Провал в ад в выпуске 04 был задуман заранее<\/b><\/div><p>Катсцена с провалом героев в бездну в конце выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">04<\/a> была задумана заранее как связка со следующим выпуском (адский поезд), чем бы ни кончилось приключение.<\/p><blockquote>«катсцена была с проваливанием в ад — это просто у нас было так задумано, чисто связь со следующим выпуском»<\/blockquote><p class=\"note\"><a href=\"/pod/qa21/#qa21-41\">Подкаст по #21<\/a> · <a href=\"https://youtu.be/75PDShLb2xc?t=5710\" target=\"_blank\" rel=\"noopener\">1:35:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/06/\" title=\"Адский поезд\">#6<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa36-12\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кубы тянутся к солнцу, как мотыльки на огонь<\/b><\/div><p>Когда в <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a> появился желатиновый куб Кисель, мечтавший о солнце, авторы ещё не придумали, что солнечный свет его сожжёт. Механику «мотылька, летящего на огонь» ввели позже, потому что тему любви кубов к солнцу много обыгрывали. Отсюда кислотные кубы в <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a>, которые любят солнце, но боятся его.<\/p><blockquote>«тогда у нас не было этой идеи, что вдруг там, если куб выйдет на солнечный свет, то он сгорит... мы придумали у него механику как вот с мотыльками, летящими на костёр»<\/blockquote><p class=\"note\"><a href=\"/pod/qa36/#qa36-12\">Подкаст по #36<\/a> · <a href=\"https://youtu.be/oEqxCRDdITw?t=1906\" target=\"_blank\" rel=\"noopener\">0:31:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/36/\" title=\"Руины Малестии\">#36<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa46-3\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Инфернальный язык — это английский<\/b><\/div><p>Демоны говорили на английском — импровизация мастера: нужен был непонятный язык, который понимает <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Чебатков<\/a>. Это также отсылка к рекламе из выпуска <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4<\/a>, где инфернальным тоже был английский. Бреганов действительно говорил по-английски, звук не переписывали.<\/p><blockquote>«Это абсолютно точная импровизация, потому что просто надо было поговорить на каком-то непонятном языке, но который понимал Чебатков.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-3\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=655\" target=\"_blank\" rel=\"noopener\">0:10:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa49-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>NPC, которых позже отдавали игрокам: Севстания, Бьянка, Гомункул<\/b><\/div><p>Авторы напомнили, что не раз отдавали игрокам персонажей, заявленных как NPC. <a class=\"ref\" href=\"/c/stanislava/\">Севстанию<\/a>, бывшую жену лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, в вып. 4 только назвали по имени, а в вып. 11 её получила Юля <a class=\"ref\" href=\"/p/miheeva/\">Михеева<\/a>. <a class=\"ref\" href=\"/c/byanka-sosunesku/\">Бьянку Сосунеску<\/a> сыграла <a class=\"ref\" href=\"/p/ekaterina-varnava/\">Екатерина Варнава<\/a>. Гоблина из вып. 39 отдали <a class=\"ref\" href=\"/p/frame-tamer/\">Frame Tamer<\/a>, а Гомункула из вып. 46 тоже отдали игроку.<\/p><blockquote>«мы не раз использовали персонажей, которые у нас были заявлены в выпусках как NPC, потом мы отдавали их игрокам»<\/blockquote><p class=\"note\"><a href=\"/pod/qa49/#qa49-5\">Подкаст по #49<\/a> · <a href=\"https://youtu.be/bwomt79OKM4?t=782\" target=\"_blank\" rel=\"noopener\">0:13:02 в видео ↗<\/a> · о выпуске <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/11/\" title=\"Оазис Шиш Кебаб\">#11<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/46/\" title=\"Операция &quot;Гром в аду&quot;\">#46<\/a>, <a href=\"/ep/52/\" title=\"Накопитель Любви\">#52<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa51-52-45\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Кисель не обязан Брэндону жизнью — он благодарен за освобождение<\/b><\/div><p>Формулировка «куб задолжал жизнь» неточна. Кисель — тот самый куб из мусорной комнаты (<a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">4-й<\/a> выпуск, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> — «Блины»), из которого в <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">21-м<\/a> выпуске <a class=\"ref\" href=\"/c/krysa-larisa/\">Лариса<\/a> достала шкатулку с контрактом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. Когда <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> вернулся из ада, <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Тёмный властелин<\/a> устроил во дворце место для <a class=\"ref\" href=\"/a/zerkalo-asmodeya/\">зеркала Асмодея<\/a> и выпустил Киселя из мусорной комнаты. Он единственный проявил к кубу участие, не смог лишь показать ему солнце, поэтому Кисель ему благодарен.<\/p><blockquote>«Смысл в формулировке. Он не задолжал жизнь Брэндону.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В summaries/ep51.md (п. 12 и список NPC) Кисель назван «обязанным хозяину жизнью»; по словам авторов, он не обязан жизнью, а благодарен Тёмному <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">властелину<\/a> за то, что тот выпустил его из мусорной комнаты и проявил к нему заботу.<\/p><p class=\"note\"><a href=\"/pod/qa51-52/#qa51-52-45\">Подкаст по #51 и #52<\/a> · <a href=\"https://youtu.be/0XDSOSjs7f4?t=7138\" target=\"_blank\" rel=\"noopener\">1:58:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/51/\" title=\"Точка невозврата\">#51<\/a>, <a href=\"/ep/04/\" title=\"Дворец Лорда Властона\">#4<\/a>, <a href=\"/ep/21a/\" title=\"Часть 1 Судьба Властона\">#21a<\/a><\/p><\/article><\/section>", "chars": {"Володимир": {"name": "Володимир", "img": "img/chars/volodimir.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%BE%D0%BB%D0%BE%D0%B4%D0%B8%D0%BC%D0%B8%D1%80", "summary": "Володимир – полурослик-головорез из Геленбурга. Несмотря на криминальное прошлое, Володимир был неравнодушным жителем своего города, поэтому, когда правитель Лорд Властон отстранился от народа и люди стали нищать и голодать, полурослик отправился во дворец Лорда.", "infobox": {"Пол": "Мужской", "Раса": "Полурослик", "Тип": "Игровой", "Игрок": "Илья Соболев"}, "actors": ["Илья Соболев"], "kind": "pc", "dead": true, "race": "Полурослик", "portraits": [{"ep": "6", "thumb": "img/portraits/f1887e38c117574f.webp"}, {"ep": "4", "thumb": "img/portraits/bd424a6e02968f0e.webp"}], "url": "/c/volodimir/", "eps": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "06", "label": "6", "title": "Адский поезд"}]}, "Станислава": {"name": "Севстания", "img": "img/chars/sevstaniya.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D0%B5%D0%B2%D1%81%D1%82%D0%B0%D0%BD%D0%B8%D1%8F", "summary": "Севста́ния — 50-летняя волшебница, бывшая жена Лорда Властона.", "infobox": {"Пол": "Женский", "Раса": "Человек", "Тип": "Игровой", "Игрок": "Алла Михеева"}, "actors": ["Михеева"], "kind": "pc", "dead": false, "race": "Человек", "portraits": [], "url": "/c/stanislava/", "eps": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург"}]}, "Пахом": {"name": "Медиум Пахом", "img": "img/chars/pahom.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9F%D0%B0%D1%85%D0%BE%D0%BC", "summary": "Пахóм
