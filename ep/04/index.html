<script>window.EPD = {"key": "04", "label": "4", "title": "Дворец лорда Властона", "date": "2021-04-29", "minutes": 69, "duration": 4123.0, "video_id": "6sZbmjT1NxU", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Замок лорда Властона близ Геленбурга (на скалистом обрыве у моря)", "short_html": "<a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a>, когда-то справедливый правитель Геленбурга, стал тираном после того, как нашёл в море древний кувшин. Отряд <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> проникает в его замок во время бала: одни по украденным приглашениям, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> через канализацию. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> соблазняет и убивает вельможу <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> в кабинете лорда, герои находят план тайника и пароль «твёрдый знак». В винном хранилище они обезвреживают мимика и разбивают настоящую амфору. Но Властон объявляет, что ваза им никогда не управляла, и сбрасывает героев в люк.", "summary_html": "Раньше лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> был справедливым правителем Геленбурга, но однажды нашёл в море древний кувшин и переменился: отгородился от народа в замке, а люди голодают. Отряд добровольцев <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> решает уничтожить амфору, которая якобы подчинила волю лорда. Во время бала герои проникают в замок: трое проходят по приглашениям, <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> лезет через канализацию. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> соблазняет и убивает вельможу <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a> в кабинете Властона, герои находят план тайника и разгадывают пароль «твёрдый знак». В подземном винном хранилище одна из двух амфор оказывается мимиком, а настоящую разбивают. Но появившийся Властон заявляет, что кувшин ни при чём: «Я никогда не стану прежним слабым лордом». Он сбрасывает героев через люк в бездну, и выпуск заканчивается клиффхэнгером.", "outcome_html": "Амфора уничтожена, но тирания <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> была его собственным выбором. Герои провалились в люк-ловушку под замком, их судьба остаётся открытой.", "world_html": ["Первое появление лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>, Геленбурга и замка Властона", "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> — тиран по собственной воле, амфора им не управляла", "Подтверждена дружба <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> с колдуном <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a>", "У <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> есть жена и юная фаворитка <a class=\"ref\" href=\"/c/irina-tvyordaya/\">Ирина Твёрдая<\/a>"], "scenes": [{"t": "0:00:05", "sec": 5, "html": "В таверне бард поёт балладу о подвигах «геройской четвёрки» из прошлых выпусков: колдун (#01), новогодний демон (#02), тролль (#03)."}, {"t": "0:04:28", "sec": 268, "html": "Завязка: лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> был справедливым правителем Геленбурга. Купаясь в море, он нашёл древний кувшин, построил замок вдали от города, народ нищает и голодает. Ходят слухи, что лордом управляет кувшин. Герои — отряд добровольцев, которые хотят уничтожить артефакт."}, {"t": "0:05:00", "sec": 300, "html": "Герои. <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> — гном из Кальтенбруна, недавно с друзьями убивший демона; в таверне Геленбурга познакомился с эльфийкой, матерью своего друга, и она позвала его в отряд. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> год назад уже пытался уничтожить амфору и добыл схему замка, но попался и был отправлен на пожизненную каторгу; недавно сбежал. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> — скрытый медиум (читает мысли, телекинез), прикрывается мастерской по ремонту карет; разорён налогами и собрал отряд. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> — благородная эльфийка-воровка, мать двух сыновей, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>."}, {"t": "0:07:40", "sec": 460, "html": "Отряд прячется в дворцовом саду у главных ворот, у них есть карта <a class=\"ref\" href=\"/c/volodimir/\">Володимира<\/a>. Идёт приём у лорда, гостей проверяет охрана. <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> замечает трёх патрульных и двух дворян, которые предаются утехам у фонтана."}, {"t": "0:10:52", "sec": 652, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> незаметно крадёт одежду этих дворян с двумя приглашениями (монета), <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> находит монету на дне фонтана. План: <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> и Пахом идут как вельможи, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> в женском платье изображает придворную музыкантшу, а Володимир с вещами лезет через сточную трубу."}, {"t": "0:15:03", "sec": 903, "html": "В очереди придворные дамы сплетничают, что лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> ходит на бал с новой пассией, Ириной Твёрдой, при живой жене. Стражник с подозрением смотрит на Динь-Диня, но <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> с песней-вдохновением <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> убеждает его пропустить «подарок лорду»."}, {"t": "0:18:11", "sec": 1091, "html": "Рекламная вставка: «умная камера Яндекса» переводит свиток с инфернального («Во имя Баала, пусть мир погрузится в Бездну…»)."}, {"t": "0:19:18", "sec": 1158, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> в канализации надевает поверх своей одежды одежду товарищей и находит «говняную» монету. Он вылезает в комнату 5 — мусорную, где живёт разумный желатиновый куб Кисель, которого заточили перерабатывать кухонные отходы. Володимир представляется «Блины»."}, {"t": "0:26:35", "sec": 1595, "html": "Шуткой про «романахов» <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> смешит Киселя, и тот отрыгивает записки. Среди них письмо женским почерком: «<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>! Если ты будешь на приёме со своей мерзкой малолетней крысой, я устрою скандал!» Володимир имитирует голос Киселя, заманивает шеф-повара, душит его удавкой, скармливает кубу и надевает поварскую форму. Обещание вывести Киселя «к солнышку» он не выполняет."}, {"t": "0:31:49", "sec": 1909, "html": "Главный зал: фуршет, оркестр, входит лорд в парике с юной спутницей. К <a class=\"ref\" href=\"/c/zhanna/\">Жанне<\/a> подходит низкорослый лысый вельможа с моноклем и в орденах, <a class=\"ref\" href=\"/c/shalim/\">Шалим<\/a>. С песней <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> Жанна его соблазняет (критический успех). Шалим проводит её, «мужа» Пахома и «сестру» Динь-Диня мимо охраны в кабинет лорда."}, {"t": "0:37:07", "sec": 2227, "html": "Кабинет <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>: роскошь, картины о его жизни, над столом большой портрет лорда с колдуном <a class=\"ref\" href=\"/c/koldun-filipp/\">Филиппом<\/a>. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> находит в камине недогоревшую записку «Не забудь твёрдый знак» и монету, а также царапины у картины."}, {"t": "0:39:17", "sec": 2357, "html": "<a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> на кухне под видом шеф-повара <a class=\"ref\" href=\"/c/yudzhin/\">Юджина<\/a> запихивает теннисный мяч в картошку для лорда и отпугивает заподозрившего его официанта."}, {"t": "0:43:26", "sec": 2606, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> отвлекает <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a>, <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> фокусами занимает его, <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> находит за картиной сейф. Жанна скрытым клинком бьёт Шалима в пах двойным уроном и отрезает ему голову «за женщин Геленбурга». Пахом осуждает «неоправданную жестокость». Труп прячут под кровать, Жанна вскрывает сейф: там две монеты и план бани с плитами-буквами и рычагом."}, {"t": "0:50:53", "sec": 3053, "html": "<a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> маскируется под маленького <a class=\"ref\" href=\"/c/shalim/\">Шалима<\/a>, и отряд выходит мимо стражи. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> находит комнату 8 — нерабочую баню с сухим бассейном, аквариумом с зубастыми рыбами, латунным рычагом и плитами с буквами."}, {"t": "0:53:00", "sec": 3180, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> порывается поговорить с лордом и громко окликает его, оркестр смолкает. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> парализующей иглой (со второй попытки, на монете) обездвиживает её. Лорд, решив, что женщина упала от страха перед ним, смеётся, Пахом отшучивается."}, {"t": "0:56:07", "sec": 3367, "html": "Отряд собирается в бане. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> встаёт на плиту «Ъ» и дёргает рычаг. Аквариум поднимается, под ним открывается винтовая лестница. Бесчувственную <a class=\"ref\" href=\"/c/zhanna/\">Жанну<\/a> спускают вниз с привязанной светящейся лютней."}, {"t": "0:59:20", "sec": 3560, "html": "Подземное хранилище элитных вин, на пьедесталах две одинаковые амфоры. Очнувшаяся <a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> хватает правую, и та оказывается мимиком: ложноножка тянет её в пасть. <a class=\"ref\" href=\"/c/volodimir/\">Володимир<\/a> бьёт кинжалами (срабатывает удача полурослика), <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> усыпляет мимика заклинанием сна."}, {"t": "1:03:31", "sec": 3811, "html": "<a class=\"ref\" href=\"/c/zhanna/\">Жанна<\/a> хватает вторую, настоящую амфору. Тёмная энергия рвётся в её разум, она сопротивляется, но бежит к лорду. Товарищ кошкой на верёвке опутывает ей ноги, Жанна падает, и амфора разбивается, выпуская лучи синей энергии. Среди осколков лежат три монеты. «Победа!»"}, {"t": "1:05:36", "sec": 3936, "html": "В хранилище спускается лорд <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> с гвардейцами: «Очередная деревенщина, поверившая в миф, что мной управляет ваза. Здесь власть — я, я закон. Я никогда не стану прежним слабым лордом». Он дёргает бутылку-рычаг, и герои проваливаются в темноту («но это уже совсем другое приключение»)."}, {"t": "1:06:40", "sec": 4000, "html": "Эпилог: <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> хватает картофелину с теннисным мячом со словами «А сейчас я возьму её на вдохе». Итог: 8 монет, то есть 80 000 руб. в приют для кошек «Муркоша»."}], "key_events": [{"t": "0:04:28", "sec": 268}, {"t": "0:10:52", "sec": 652}, {"t": "0:22:26", "sec": 1346}, {"t": "0:28:44", "sec": 1724}, {"t": "0:33:56", "sec": 2036}, {"t": "0:37:07", "sec": 2227}, {"t": "0:47:41", "sec": 2861}, {"t": "0:54:02", "sec": 3242}, {"t": "0:59:20", "sec": 3560}, {"t": "1:01:26", "sec": 3686}, {"t": "1:04:33", "sec": 3873}, {"t": "1:05:36", "sec": 3936}], "coins": {"ep": "04", "events": [{"t": "0:11:14", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "получил монету за удачную скрытную кражу дворянской одежды и находку приглашений", "result": null, "sec": 674, "who_url": "/c/volodimir/", "reason_html": "получил монету за удачную скрытную кражу дворянской одежды и находку приглашений"}, {"t": "0:12:59", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "нашёл золотую монету на дне фонтана во дворце", "result": null, "sec": 779, "who_url": "/c/medium-pahom/", "reason_html": "нашёл золотую монету на дне фонтана во дворце"}, {"t": "0:20:20", "kind": "earn", "who": "Володимир", "actor": "Соболев", "to": null, "reason": "нашёл (по проверке внимательности) золотую монету в грязи сточной трубы", "result": "судя по дальнейшей реплике («закрываю монета... в пизду»), монету, похоже, комично обронил/захлопнул дверью — возможно, поэтому она не попала в итоговый подсчёт", "sec": 1220, "who_url": "/c/volodimir/", "reason_html": "нашёл (по проверке внимательности) золотую монету в грязи сточной трубы"}, {"t": "0:38:14", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "в кабинете лорда нашла записку и золотую монету в камине (успешная проверка внимательности)", "result": null, "sec": 2294, "who_url": "/c/zhanna/", "reason_html": "в кабинете лорда нашла записку и золотую монету в камине (успешная проверка внимательности)"}, {"t": "0:49:48", "kind": "earn", "who": "Жанна", "actor": "Кукушкин", "to": null, "reason": "взломала сейф лорда и нашла в нём две золотые монеты и пергамент с планом бани", "result": null, "sec": 2988, "who_url": "/c/zhanna/", "reason_html": "взломала сейф лорда и нашла в нём две золотые монеты и пергамент с планом бани"}, {"t": "0:55:00", "kind": "give", "who": "Жанна", "actor": "Кукушкин", "to": "Пахом", "reason": "отдала свою монету Пахому, чтобы он мог перебросить неудачную атаку парализующей иглой", "result": null, "sec": 3300, "who_url": "/c/zhanna/", "reason_html": "отдала свою монету <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a>, чтобы он мог перебросить неудачную атаку парализующей иглой"}, {"t": "0:55:05", "kind": "spend", "who": "Пахом", "actor": "BRB", "to": null, "reason": "потратил полученную от Жанны монету на переброс атаки парализующей иглой", "result": "попал, но иглой случайно поразил союзницу Жанну, парализовав её вместо цели", "sec": 3305, "who_url": "/c/medium-pahom/", "reason_html": "потратил полученную от <a class=\"ref\" href=\"/c/zhanna/\">Жанны<\/a> монету на переброс атаки парализующей иглой"}, {"t": "1:04:33", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "среди осколков разбитой амфоры отряд нашёл три золотые монеты", "result": null, "sec": 3873, "who_url": null, "reason_html": "среди осколков разбитой амфоры отряд нашёл три золотые монеты"}], "totals": [{"who": "Володимир", "actor": "Соболев", "earned": 2, "spent": 0, "img": "img/chars/volodimir.webp", "who_url": "/c/volodimir/", "actor_url": "/p/ilya-sobolev/"
