<script>window.EPD = {"anim": false, "key": "48", "label": "48", "title": "Ночь в музее", "date": "2026-04-25", "minutes": 108, "duration": 6478.0, "video_id": "7n2zGP-Dy0g", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Восточный квартал Кёнигпона: музей анатомических редкостей Монплезир и крипта под ним", "short_html": "После падения высшего вампирского совета <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> стал главой вампиров столицы, и вампиры просят его защитить первородного вампира Ержана Жестокого, которого инквизиция хочет уничтожить вместе с музеем Монплезир; гибель прародителя убила бы всех его потомков. Отряд проходит сквозь протестующих и оцепление, убивает семью протестующего и с помощью очарованного крановщика проламывает стену музея. Крипту открывает кровь <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>, которую Дан Балан получил через дьяблери, а <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> медальоном Хадисы пробуждает Ержана. Священный огонь верховного жреца убивает всех, кроме Дана Балана и Ержана, а самоуничтожение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> стирает квартал.", "summary_html": "После уничтожения высшего вампирского совета <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> стал фактическим главой вампиров столицы. Королевская инквизиция узнаёт, что под музеем анатомических редкостей Монплезир спрятан саркофаг первородного вампира Ержана Жестокого, чья гибель уничтожит всех его потомков, и готовится снести музей на рассвете. Отряд Дана Балана прорывается сквозь протестующих и оцепление, устраивает резню в соседней квартире, с помощью очарованного крановщика и стенобитного шара проламывает стену и открывает крипту кровью <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>, которую Дан Балан получил через дьяблери. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> оказывается реинкарнацией/потомком возлюбленной Ержана Хадисы и пробуждает его, но священный огонь верховного жреца убивает всех, кроме Дана Балана и Ержана, а самоуничтожение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> стирает квартал вместе с музеем.", "outcome_html": "Первородный вампир Ержан спасён, а с ним и сотни его потомков; из героев выжил только <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб окончательно.", "world_html": ["Первородный вампир Ержан Жестокий пробуждён", "Королевская инквизиция начала массовое истребление нечисти", "Взрыв <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> уничтожил квартал с музеем Монплезир", "Убит верховный жрец инквизиции (по эпилогу)", "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> признан главой столичных вампиров"], "scenes": [{"t": "0:00:03", "sec": 3, "html": "Бусти-заставка Дана Балана «из нового клеёного канадского гроба»."}, {"t": "0:01:41", "sec": 101, "html": "Пролог: клан Балан, приговорённый советом к смерти за милосердие, перебил высший совет; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб и возродился в более мощном облике; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> совершил дьяблери над главой совета <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимиром Винокусом<\/a> (вырвал позвоночник и высосал костный мозг) и поднялся на вершину вампирской иерархии столицы."}, {"t": "0:04:33", "sec": 273, "html": "Завязка: совет из 13 упырей правил вампирами <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> веками; воспользовавшись его падением, королевская инквизиция нашла в особняке в столице гробницу первородного вампира. Уничтожение прародителя убьёт всех его потомков — вампиры просят защиты у Дана Балана."}, {"t": "0:06:00", "sec": 360, "html": "Представление героев: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (тяготится «бременем власти» над всеми столичными кровососами; не знает, не потомок ли он сам); <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (кованый рыцарь; по указу короля клан получил «паспорта хорошей твари», но за ними последовало истребление нечисти инквизицией); <a class=\"ref\" href=\"/c/vladislav/\">Владислав<\/a> (вампир, веками выдававший себя за врача и ставший настоящим врачом; Дан Балан — его пациент-ипохондрик); <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> (почти 200-летняя вампирша, бывшая уборщица, обращённая владельцем музея, чтобы вечно быть его смотрительницей; знает о крипте с мощами Ержана Жестокого); <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егор Невампирский<\/a> (неудачник, пытался ограбить музей, был пойман Кровожадиной и влюбился в неё, стал фамильяром)."}, {"t": "0:16:20", "sec": 980, "html": "Особняк Монплезир на востоке столицы окружён: протестующие против сноса («Руки прочь от музея»), стража, инквизиция, кран со стенобитным шаром. Бросок очков крови."}, {"t": "0:19:18", "sec": 1158, "html": "Проницательность показывает, что кучерявый протестующий Густав темнит. <a class=\"ref\" href=\"/c/vladislav/\">Владислав<\/a> «диагностирует» ему инсульт, уводит за угол и выпивает досуха; тело заворачивают в пальто как «экспонат». У трупа находят ключ от квартиры и кусачки по металлу."}, {"t": "0:27:07", "sec": 1627, "html": "Девушки-протестующие подозревают врача; <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> разгоняет толпу ультразвуком, толпа её избивает."}, {"t": "0:32:02", "sec": 1922, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и Егор в форме охранника убеждают стражу, что толпа готовит штурм; стражники разгоняют демонстрантов — но Егора заковывают в кандалы и уводят к инквизитору."}, {"t": "0:35:50", "sec": 2150, "html": "<a class=\"ref\" href=\"/c/vladislav/\">Владислав<\/a> «роковым мужчиной» завораживает толпу лекцией о скрининге, остальные выкрикивают «Затоптали!» — толпа верит, что Густава затоптали, и указывает его дом рядом с музеем."}, {"t": "0:41:55", "sec": 2515, "html": "Квартира Густава: жена Ольма и тёща прячутся. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (не вампир, ему не нужно приглашение) угрожает мечом, затем выдаёт себя за ночного продавца ножей — вампиров приглашают войти. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> выведывает у Ольмы: инквизиторы брали у них простыню, музей снесут на рассвете, внутри засели «монстры»; потом убивает её, Вампирбек убивает тёщу электрическим разрядом."}, {"t": "0:54:25", "sec": 3265, "html": "Егора допрашивает инквизитор в красной мантии: святой амулет на него не реагирует, Егор проваливает обман, признаётся в любви к вампирше; чтобы избежать сожжения, «отрекается» и обещает привести инквизиторов к ней. На столе в палатке — книга «Вампирские анналы» и план здания; во дворе под простынёй лежит тело."}, {"t": "1:04:34", "sec": 3874, "html": "Сигналы фонариком; <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> из окна «сексуальным кашлем» и доминацией подчиняет крановщика — тот бьёт шаром по северо-западному углу музея."}, {"t": "1:11:03", "sec": 4263, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> и <a class=\"ref\" href=\"/c/vladislav/\">Владислав<\/a> летучими мышами (крит скрытности, дымовая шашка Бека) влетают в пролом. Крановщик размазывает шаром инквизитора."}, {"t": "1:12:47", "sec": 4367, "html": "Егор, уведённый «к вампирше» за угол, остаётся один на один с инквизитором: кусает его, горит от священного огня, отрывает дверную ручку, рвёт кандалы, отбивает цеп и шокером на дубинке вырубает инквизитора."}, {"t": "1:21:48", "sec": 4908, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> из окна огнемётом поджигает палатку и главного инквизитора; горящий крановщик по последнему приказу <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> добивает этого инквизитора шаром и сгорает сам. Ракета Бека ранит инквизитора на крыше. Под простынёй — инквизитор с укусом на шее. Обветшавший портал обрушивается на Бека (19 урона), но он выбирается."}, {"t": "1:27:35", "sec": 5255, "html": "Внутри музея (формалин, трёхглазые черепа, сросшиеся эмбрионы) пятеро столичных вампиров охраняют крипту: её открывает только кровь потомка Ержана на золотом ключе, один вампир уже сгорел, пытаясь. Раньше крипту открывал <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> признаётся, что выпил Винокуса."}, {"t": "1:31:20", "sec": 5480, "html": "До рассвета 10 минут. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> режет руку и поворачивает ключ — он не потомок Ержана, но кровь <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> открывает проход к саркофагу."}, {"t": "1:33:38", "sec": 5618, "html": "Пещера с мраморным саркофагом (барельеф: вампир и женщина, укрытые каменной простынёй, надпись «ЕРЖАН»). <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> прикладывает ладонь к ящику «Вскрыть в чрезвычайной ситуации», отряд решает головоломку из костей — внутри свиток телепортации на восемь существ."}, {"t": "1:36:40", "sec": 5800, "html": "В саркофаге — трёхметровое крылатое чудовище с медальоном-половинкой крыла летучей мыши. Инквизиторы спускаются; огненный луч <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> рассеивает контрзаклинанием верховный жрец в белом; ракеты Бека обрушивают потолок, заваливая проход."}, {"t": "1:39:12", "sec": 5952, "html": "У <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> — вторая половина медальона («кулон прабабушки Хадисы»). Она ложится в саркофаг, медальоны сливаются, и Ержан пробуждается: «Хадиса, ты вернулась». Он хочет сожрать живого Егора, но Кровожадина торопит его."}, {"t": "1:41:22", "sec": 6082, "html": "Инквизиторы пробивают завал, внутрь тянет утренним светом; верховный жрец обрушивает священный огонь. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> открывает телепорт слишком поздно."}, {"t": "1:44:00", "sec": 6240, "html": "Из портала в зал с камином выходят только <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> и Ержан — с пеплом <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> на руках. <a class=\"ref\" href=\"/c/vladislav/\">Владислав<\/a>, Егор и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> лежат в гробнице под прицелом инквизиторов; Дан Балан не успевает никого спасти. Самоуничтожение Вампирбека взрывом стирает большую часть квартала вместе с музеем."}, {"t": "1:46:22", "sec": 6382, "html": "5 монет = 50 000 руб. на благотворительность. Эпилог: сотни рядовых упырей спасены, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб во второй и, видимо, последний раз; открытые вопросы — реакция короны на убийство верховного жреца и месть Ержана за гибель возлюбленной."}], "key_events": [{"t": "0:19:18", "sec": 1158}, {"t": "0:32:02", "sec": 1922}, {"t": "0:41:55", "sec": 2515}, {"t": "0:54:25", "sec": 3265}, {"t": "1:07:20", "sec": 4040}, {"t": "1:12:47", "sec": 4367}, {"t": "1:31:20", "sec": 5480}, {"t": "1:39:12", "sec": 5952}, {"t": "1:43:18", "sec": 6198}, {"t": "1:44:00", "sec": 6240}], "coins": {"ep": "48", "events": [{"t": "0:30:54", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "получил монету от мастера за остроумное замечание о строительных нормах (СНиП) — звуковая волна от ультразвука не долетела до окон домов", "result": null, "sec": 1854, "who_url": "/c/vampir-bek/", "reason_html": "получил монету от мастера за остроумное замечание о строительных нормах (СНиП) — звуковая волна от ультразвука не долетела до окон домов"}, {"t": "0:46:32", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "внутриигровая цена товара в уличной сценке: ножи продают по одной монете (не игровая механика)", "result": null, "sec": 2792, "who_url": null, "reason_html": "внутриигровая цена товара в уличной сценке: ножи продают по одной монете (не игровая механика)"}, {"t": "0:53:45", "kind": "loot", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "находит золотую монету, обыскивая будуар убитой бабушки (внутриигровой лут)", "result": null, "sec": 3225, "who_url": "/c/vampir-bek/", "reason_html": "находит золотую монету, обыскивая будуар убитой бабушки (внутриигровой лут)"}, {"t": "0:53:58", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "получил монету от мастера за мрачно-комичный отыгрыш обыска дома и расправы над семьёй", "result": null, "sec": 3238, "who_url": "/c/vampir-bek/", "reason_html": "получил монету от мастера за мрачно-комичный отыгрыш обыска дома и расправы над семьёй"}, {"t": "1:02:14", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки убеждения/харизмы перед инквизитором, изображающим его «отца»", "result": "переброс удался, инквизитор впечатлён (овации)", "sec": 3734, "who_url": "/c/vampir-bek/", "reason_html": "потратил монету на переброс проверки убеждения/харизмы перед инквизитором, изображающим его «отца»"}, {"t": "1:02:37", "kind": "give", "who": null, "actor": null, "to": "Вампирбек", "reason": "кто-то из товарищей по команде отдал свою золотую монету Вампиру Беку для ещё одного переброса", "result": null, "sec": 3757, "who_url": null, "reason_html": "кто-то из товарищей по команде отдал свою золотую монету Вампиру Беку для ещё одного переброса"}, {"t": "1:02:44", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "потратил полученную монету на повторный переброс проверки перед инквизитором", "result": "выпал другой результат (11 в сумме), инквизитор почти поверил, но с условием", "sec": 3764, "who_url": "/c/vampir-bek/", "reason_html": "потратил полученную монету на повторный переброс проверки перед инквизитором"}, {"t": "1:08:15", "kind": "other", "who": null, "actor": null, "to": null, "reason": "шуточная реплика «монета геймастеру» после удачной сцены обольщения стражника (не награда игроку)", "result": null, "sec": 4095, "who_url": null, "reason_html": "шуточная реплика «монета геймастеру» после удачной сцены обольщения стражника (не награда игроку)"}, {"t": "1:29:28", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "получена монета от мастера за интересную, но неверную версию о родственнице прародителя Ержана («Ержановна»); кто именно из игроков высказал версию, из фрагмента неясно", "result": null, "sec": 5368, "who_url": null, "reason_html": "получена монета от мастера за интересную, но неверную версию о родственнице прародителя Ержана («Ержановна»); кто именно из игроков высказал версию, из фрагмента неясно"}, {"t": "1:42:00", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "потратил монету на переброс спасброска ловкости при уязвимости к огню (вспышка/пламя у крипты)", "result": "переброс успешен — спасся от урона", "sec": 6120, "who_url": "/c/vampir-bek/", "reason_html": "потратил монету на переброс спасброска ловкости при уязвимости к огню (вспышка/пламя у крипты)"}, {"t": "1:46:21", "kind": "other", "who": "Егор Невампирский", "actor": "Егор Свирский", "to": null, "reason": "финальный благотворительный бросок кубика в конце выпуска (обычных монет у партии к этому моменту не осталось)", "result": "выпало значение, дающее пять золотых монет (50 000 руб.) на благотворительность", "sec": 6381, "who_url": "/c/egor-nevampirskiy/", "reason_html": "финальный благотворительный бросок кубика в конце выпуска (обычных монет у партии к этому моменту не осталось)"}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 2, "spent": 3, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}], "notes": "Почти вся монетная активность выпуска сосредоточена на Вампире Беке (BRB): он дважды получает монету от мастера (за шутку про СНиП и за отыгрыш обыска дома) и трижды тратит монеты на переброски, причём одну из потраченных монет ему перед этим отдал кто-то из товарищей (кто именно — из фрагмента не ясно). Отдельно отмечены не относящиеся к игровой механике «лутовые» монеты (найденная в будуаре золотая монета, цена ножей в уличной сценке) и особая благотворительная монета в финале, определяющая сумму эфирного пожертвования (5 золотых монет = 50 000 руб.); также была шуточная фраза «монета геймастеру», не являющаяся реальной наградой."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, глава клана Балан", "role": "", "fate": "выжил", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}]}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "кованый рыцарь-автоматон", "role": "", "fate": "погиб (самоуничтожение)", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая Фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}]}, {"name": "Владислав", "actor": "Евгений Чебатков", "actor_url": "/p/evgeniy-chebatkov/", "race": "вампир, врач", "role": "", "fate": "погиб", "id": "Владислав", "url": "/c/vladislav/", "img": null, "other": []}, {"name": "Кровожадина", "actor": "Динара Курбанова", "actor_url": "/p/dinara-kurbanova/", "race": "вампирша, смотрительница музея", "role": "", "fate": "погибла", "id": "Кровожадина", "url": "/c/krovozhadina/", "img": null, "other": []}, {"name": "Егор Невампирский", "actor": "Егор Свирский", "actor_url": "/p/egor-svirskiy/", "race": "человек, фамильяр-охранник", "role": "", "fate": "погиб", "id": "Егор Невампирский", "url": "/c/egor-nevampirskiy/", "img": null, "other": []}], "npcs": [{"name": "Ержан Жестокий", "actor": "", "actor_url": null, "race": "", "role": "первородный вампир-прародитель", "fate": "пробуждён, выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Хадиса", "actor": "", "actor_url": null, "race": "", "role": "древняя возлюбленная Ержана, прабабушка/прежнее воплощение Кровожадины", "fate": "умерла давно", "id": null, "url": null, "img": null, "other": []}, {"name": "Владимир Винокус", "actor": "", "actor_url": null, "race": "", "role": "покойный глава высшего вампирского совета", "fate": "погиб ранее", "id": "Винокус", "url": "/c/vladimir-vinokus/", "img": "img/chars/vladimir-vinokus.webp", "other": [{"key": "40", "label": "40", "title": "Паспорт хорошей твари"}]}, {"name": "Густав", "actor": "", "actor_url": null, "race": "", "role": "протестующий у музея", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Ольма", "actor": "", "actor_url": null, "race": "", "role": "жена Густава", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Мать Ольмы", "actor": "", "actor_url": null, "race": "", "role": "тёща Густава", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Крановщик", "actor": "", "actor_url": null, я<\/a> (восточный квартал), особняк/музей анатомических редкостей Монплезир и крипта под ним; квартира Густава; зал с камином, куда вёл телепорт.<\/li>\n<li>Фракции: клан Балан; столичные вампиры; бывший высший вампирский совет (13 упырей); королевская инквизиция; городская стража; протестующие «защитники музея».<\/li>\n<li>Артефакты: золотой ключ крипты (открывается кровью потомка); «Вампирские анналы» (книга инквизиции); ящик «Вскрыть в чрезвычайной ситуации» с головоломкой из костей; свиток телепортации на 8 существ; медальон из двух половин-крыльев летучей мыши; кольцо героизма <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a>; паспорт хорошей твари; стенобитный кран.<\/li>\n<\/ul>", "chars": {"Егор Невампирский": {"name": "Егор Невампирский", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Егор Свирский"], "kind": "pc", "dead": true, "race": "человек, фамильяр-охранник", "portraits": [], "url": "/c/egor-nevampirskiy/", "eps": [{"key": "48", "label": "48", "title": "Ночь в музее"}]}, "Владислав": {"name": "Владислав", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Евгений Чебатков"], "kind": "pc", "dead": true, "race": "вампир, врач", "portraits": [], "url": "/c/vladislav/", "eps": [{"key": "48", "label": "48", "title": "Ночь в музее"}]}, "Кровожадина": {"name": "Кровожадина", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": ["Динара Курбанова"], "kind": "pc", "dead": true, "race": "вампирша, смотрительница музея", "portraits": [], "url": "/c/krovozhadina/", "eps": [{"key": "48", "label": "48", "title": "Ночь в музее"}]}, "Вампир Бек": {"name": "Вампирбек", "img": "img/chars/vampirbek.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%B0%D0%BC%D0%BF%D0%B8%D1%80%D0%B1%D0%B5%D0%BA", "summary": "Вампирбе́к — вампир из клана Балан, рикша из города Кёнигпон.", "infobox": {"Пол": "Мужской", "Раса": "Вампир", "Тип": "Игровой", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big
