<script>window.EPD = {"anim": false, "key": "48", "label": "48", "title": "Ночь в музее", "date": "2026-04-25", "minutes": 108, "duration": 6478.0, "video_id": "7n2zGP-Dy0g", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Восточный квартал Кёнигпона: музей анатомических редкостей Монплезир и крипта под ним", "short_html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> должен защитить первородного вампира Ержана, которого инквизиция хочет уничтожить вместе с музеем.", "summary_html": "После уничтожения высшего вампирского совета <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> стал фактическим главой вампиров столицы. Королевская инквизиция узнаёт, что под музеем анатомических редкостей Монплезир спрятан саркофаг первородного вампира Ержана Жестокого, чья гибель уничтожит всех его потомков, и готовится снести музей на рассвете. Отряд Дана Балана прорывается сквозь протестующих и оцепление, устраивает резню в соседней квартире, с помощью очарованного крановщика и стенобитного шара проламывает стену и открывает крипту кровью <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>, которую Дан Балан получил через дьяблери. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> оказывается реинкарнацией/потомком возлюбленной Ержана Хадисы и пробуждает его, но священный огонь верховного жреца убивает всех, кроме Дана Балана и Ержана, а самоуничтожение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> стирает квартал вместе с музеем.<button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Кровожадина — не реинкарнация Хадисы и не родственница Ержана\">20<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Кровожадина — не реинкарнация Хадисы и не родственница Ержана<\/b> Хадиса не была ни женой, ни родственницей Ержана: у неё была своя смертная семья, а к Ержану она ходила, чтобы его успокаивать, — скорее странная любовница («как в «Красавице и чудовище»»). <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> — потомок её смертной семьи по крови, а не реинкарнация, как в «Дракуле». Владелец музея, потомок Ержана, увидев её, обратил её без спроса, чтобы она навсегда была привязана к музею и в случае необходимости могла успокоить Ержана. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep48.md называет <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> «реинкарнацией/потомком» Хадисы. Правильно: она кровный потомок смертной семьи Хадисы, не реинкарнация; с Ержаном не в родстве. Обратил её владелец музея — потомок Ержана, чтобы она могла успокоить прародителя.<\/span> <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3464\" target=\"_blank\" rel=\"noopener\">0:57:44 ↗<\/a> · <a href=\"#qa48-18\">к записи<\/a><\/span><\/span>", "outcome_html": "Первородный вампир Ержан спасён, а с ним и сотни его потомков; из героев выжил только <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб окончательно.", "world_html": ["Первородный вампир Ержан Жестокий пробуждён", "Королевская инквизиция начала массовое истребление нечисти<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Происхождение королевской инквизиции и почему удар пришёлся по вампирам\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Происхождение королевской инквизиции и почему удар пришёлся по вампирам<\/b> Королевская инквизиция создана в начале демонического нашествия, чтобы на фоне кризиса веры объединить жрецов против нечисти — «внутреннего врага». Её создали по инициативе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>, но действует она самостоятельно, как «НКВД», с широкими полномочиями и злоупотреблениями. Авторы сравнили её с испанской инквизицией, преследовавшей крещёных мавров и евреев, так же как инквизиция ПЧК преследует обладателей <a class=\"ref\" href=\"/a/pasport-horoshey-tvari/\">паспорта хорошей твари<\/a>. Вампиров сочли самой опасной нечистью после того, как выяснилось, что вампиром был глава тайной канцелярии <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>; из «Вампирских анналов» инквизиторы поняли, что одним ударом могут уничтожить сотни столичных вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 ↗<\/a> · <a href=\"#qa48-20\">к записи<\/a><\/span><\/span>", "Взрыв <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> уничтожил квартал с музеем Монплезир", "Убит верховный жрец инквизиции (по эпилогу)<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Последствия: гибель верховного жреца, конфликт с государством и, возможно, с богами\">22<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Последствия: гибель верховного жреца, конфликт с государством и, возможно, с богами<\/b> Взрыв <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> уничтожил квартал и убил верховного жреца инквизиции. Последует расследование, вину, скорее всего, возложат на нечисть и выберут нового верховного жреца, а Дана Балана ждёт серьёзнейший конфликт с государством. Жрецов инквизиции, по-видимому, питают небесные боги, поэтому, воюя с инквизицией, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> может пойти и против богов. Неясно и то, кого король сочтёт выгоднее — вампира или инквизицию. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4289\" target=\"_blank\" rel=\"noopener\">1:11:29 ↗<\/a> · <a href=\"#qa48-21\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Новый верховный жрец будет слабее Рюха\">34<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Новый верховный жрец будет слабее Рюха<\/b> Вместо погибшего Рюха Милосердного выберут нового верховного жреца со своими силами, тоже мощного, ведь его питают боги, но не такого сильного, как Рюх. Авторы напомнили, что другого верховного жреца, <a class=\"ref\" href=\"/c/gudi-blagochestivyy/\">Гуди<\/a> Благочестивого, герои встречали в «Судьбе <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>». <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6895\" target=\"_blank\" rel=\"noopener\">1:54:55 ↗<\/a> · <a href=\"#qa48-33\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> признан главой столичных вампиров<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Дан Балан пойдёт к королю, а не за властью\">24<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Дан Балан пойдёт к королю, а не за властью<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, попытается рассказать правду королю и встроиться в общество: власти он не хочет. В отличие от <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, Дан Балан не стремится к господству и тяготится свалившимся на него бременем власти. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4794\" target=\"_blank\" rel=\"noopener\">1:19:54 ↗<\/a> · <a href=\"#qa48-23\">к записи<\/a><\/span><\/span>"], "scenes": [{"t": "0:00:03", "sec": 3, "html": "Бусти-заставка Дана Балана «из нового клеёного канадского гроба»."}, {"t": "0:01:41", "sec": 101, "html": "Пролог: клан Балан, приговорённый советом к смерти за милосердие, перебил высший совет; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб и возродился в более мощном облике; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> совершил дьяблери над главой совета <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимиром Винокусом<\/a> (вырвал позвоночник и высосал костный мозг) и поднялся на вершину вампирской иерархии столицы.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новые силы Дана Балана после дьяблери над Винокусом — одну забыли\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новые силы Дана Балана после дьяблери над Винокусом — одну забыли<\/b> На вопрос, почему <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> слабо прокачался после поглощения <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, авторы перечислили новые способности. Устойчивость высшего вампира: за одно очко крови проваленный спасбросок становится успешным — про неё забыли и игрок, и авторы. Также огненный шар, газообразная форма (так когда-то сбежал <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>) и вдвое больше здоровья — то есть силы самого Винокуса. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2509\" target=\"_blank\" rel=\"noopener\">0:41:49 ↗<\/a> · <a href=\"#qa48-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:04:33", "sec": 273, "html": "Завязка: совет из 13 упырей правил вампирами <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a> веками; воспользовавшись его падением, королевская инквизиция нашла в особняке в столице гробницу первородного вампира. Уничтожение прародителя убьёт всех его потомков — вампиры просят защиты у Дана Балана.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ержана сдали оборотни, работающие на инквизицию\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ержана сдали оборотни, работающие на инквизицию<\/b> В соседнем переулке ждали оборотни, сотрудничающие с инквизицией: они выследили прародителя и выкрали для Рюха книгу «Вампирские анналы». Встретив их, герои узнали бы, что оборотни ждут прихода верховного жреца за платой. Через них можно было и договориться. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3340\" target=\"_blank\" rel=\"noopener\">0:55:40 ↗<\/a> · <a href=\"#qa48-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Происхождение королевской инквизиции и почему удар пришёлся по вампирам\">21<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Происхождение королевской инквизиции и почему удар пришёлся по вампирам<\/b> Королевская инквизиция создана в начале демонического нашествия, чтобы на фоне кризиса веры объединить жрецов против нечисти — «внутреннего врага». Её создали по инициативе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>, но действует она самостоятельно, как «НКВД», с широкими полномочиями и злоупотреблениями. Авторы сравнили её с испанской инквизицией, преследовавшей крещёных мавров и евреев, так же как инквизиция ПЧК преследует обладателей <a class=\"ref\" href=\"/a/pasport-horoshey-tvari/\">паспорта хорошей твари<\/a>. Вампиров сочли самой опасной нечистью после того, как выяснилось, что вампиром был глава тайной канцелярии <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>; из «Вампирских анналов» инквизиторы поняли, что одним ударом могут уничтожить сотни столичных вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 ↗<\/a> · <a href=\"#qa48-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции\">32<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b> Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-31\">к записи<\/a><\/span><\/span>"}, {"t": "0:06:00", "sec": 360, "html": "Представление героев: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (тяготится «бременем власти» над всеми столичными кровососами; не знает, не потомок ли он сам); <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (кованый рыцарь; по указу короля клан получил «паспорта хорошей твари», но за ними последовало истребление нечисти инквизицией); <a class=\"ref\" href=\"/c/vladislav/\">Бладислав<\/a> (вампир, веками выдававший себя за врача и ставший настоящим врачом; Дан Балан — его пациент-ипохондрик); <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> (почти 200-летняя вампирша, бывшая уборщица, обращённая владельцем музея, чтобы вечно быть его смотрительницей; знает о крипте с мощами Ержана Жестокого); <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егор Невампирский<\/a> (неудачник, пытался ограбить музей, был пойман Кровожадиной и влюбился в неё, стал фамильяром).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кольцо героизма Кровожадины — от ауры ужаса Ержана\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кольцо героизма Кровожадины — от ауры ужаса Ержана<\/b> Высший вампир, обративший <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> (в подкасте — «Флореан Клыкану»), знал историю Ержана, поэтому оставил её при музее и дал ей перстень героизма: при пробуждении от Ержана исходит аура ужаса, и кольцо гарантировало, что она не испугается. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-30\">к записи<\/a><\/span><\/span>"}, {"t": "0:16:20", "sec": 980, "html": "Особняк Монплезир на востоке столицы окружён: протестующие против сноса («Руки прочь от музея»), стража, инквизиция, кран со стенобитным шаром. Бросок очков крови.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Расстановка у музея: инквизиция ждала утра, протестующие были союзниками\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Расстановка у музея: инквизиция ждала утра, протестующие были союзниками<\/b> Инквизиция узнала о древнем вампире, оцепила музей забором, подогнала кран и ждала рассвета, потому что внутри забаррикадировались вампиры. Ночью инквизиторы пытались прорваться: одного из них укусили и убили, и тело оставили под простынёй для будущего воскрешения. Протестующие, жители соседних домов, ничего не знали о вампире и защищали здание как архитектурную ценность, то есть фактически были союзниками героев. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=981\" target=\"_blank\" rel=\"noopener\">0:16:21 ↗<\/a> · <a href=\"#qa48-2\">к записи<\/a><\/span><\/span>"}, {"t": "0:19:18", "sec": 1158, "html": "Проницательность показывает, что кучерявый протестующий Густав темнит. <a class=\"ref\" href=\"/c/vladislav/\">Бладислав<\/a> «диагностирует» ему инсульт, уводит за угол и выпивает досуха; тело заворачивают в пальто как «экспонат». У трупа находят ключ от квартиры и кусачки по металлу.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Что на самом деле задумал Густав и зачем нужны были протестующие\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Что на самом деле задумал Густав и зачем нужны были протестующие<\/b> Протестующий Густав врал, что протест мирный: на деле он собирался пробраться на территорию и перекусить кусачками трос стенобитного шара, чтобы музей не смогли снести. Протестующие давали подсказки: шар можно обезвредить, а через квартиру Густава (ключ был у него) можно тихо попасть к музею. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1296\" target=\"_blank\" rel=\"noopener\">0:21:36 ↗<\/a> · <a href=\"#qa48-3\">к записи<\/a><\/span><\/span>"}, {"t": "0:27:07", "sec": 1627, "html": "Девушки-протестующие подозревают врача; <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> разгоняет толпу ультразвуком, толпа её избивает."}, {"t": "0:32:02", "sec": 1922, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> и Егор в форме охранника убеждают стражу, что толпа готовит штурм; стражники разгоняют демонстрантов — но Егора заковывают в кандалы и уводят к инквизитору."}, {"t": "0:35:50", "sec": 2150, "html": "<a class=\"ref\" href=\"/c/vladislav/\">Бладислав<\/a> «роковым мужчиной» завораживает толпу лекцией о скрининге, остальные выкрикивают «Затоптали!» — толпа верит, что Густава затоптали, и указывает его дом рядом с музеем.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Протестующих можно было поднять на штурм музея\">28<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Протестующих можно было поднять на штурм музея<\/b> Авторы подтвердили, что толпу можно было подбить на штурм музея: это был один из задуманных способов проникнуть внутрь или как минимум неплохой отвлекающий манёвр. Им самим больше понравился путь, который выбрали игроки, — через квартиру Густава. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6391\" target=\"_blank\" rel=\"noopener\">1:46:31 ↗<\/a> · <a href=\"#qa48-27\">к записи<\/a><\/span><\/span>"}, {"t": "0:41:55", "sec": 2515, "html": "Квартира Густава: жена Ольма и тёща прячутся. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (не вампир, ему не нужно приглашение) угрожает мечом, затем выдаёт себя за ночного продавца ножей — вампиров приглашают войти. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> выведывает у Ольмы: инквизиторы брали у них простыню, музей снесут на рассвете, внутри засели «монстры»; потом убивает её, Вампирбек убивает тёщу электрическим разрядом.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Из сцены в квартире Густава вырезали шутку\">6<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Из сцены в квартире Густава вырезали шутку<\/b> Зрители заметили, что в сцене в квартире Густава чего-то не хватает: авторы подтвердили, что вырезали оттуда шутку («жених приехал»). Саму сцену, где героини приносят в дом труп мужа и убивают жену и тёщу, авторы назвали невероятно злодейской. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1621\" target=\"_blank\" rel=\"noopener\">0:27:01 ↗<\/a> · <a href=\"#qa48-4\">к записи<\/a><\/span><\/span>"}, {"t": "0:54:25", "sec": 3265, "html": "Егора допрашивает инквизитор в красной мантии: святой амулет на него не реагирует, Егор проваливает обман, признаётся в любви к вампирше; чтобы избежать сожжения, «отрекается» и обещает привести инквизиторов к ней. На столе в палатке — книга «Вампирские анналы» и план здания; во дворе под простынёй лежит тело.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ержана сдали оборотни, работающие на инквизицию\">18<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ержана сдали оборотни, работающие на инквизицию<\/b> В соседнем переулке ждали оборотни, сотрудничающие с инквизицией: они выследили прародителя и выкрали для Рюха книгу «Вампирские анналы». Встретив их, герои узнали бы, что оборотни ждут прихода верховного жреца за платой. Через них можно было и договориться. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3340\" target=\"_blank\" rel=\"noopener\">0:55:40 ↗<\/a> · <a href=\"#qa48-16\">к записи<\/a><\/span><\/span>"}, {"t": "1:04:34", "sec": 3874, "html": "Сигналы фонариком; <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> из окна «сексуальным кашлем» и доминацией подчиняет крановщика — тот бьёт шаром по северо-западному углу музея.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Концовку Бреганов вёл в спешке — очень хотел в туалет\">35<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Концовку Бреганов вёл в спешке — очень хотел в туалет<\/b> Отрыжка крановщика при словах «Здравствуй, красавица» — это Бреганов, пивший лимонад. Финал приключения он вёл на последнем издыхании, потому что очень хотел в туалет (об этом говорили и в подкасте к <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">47-му<\/a> выпуску). Шатохин вырезал момент, где мастер кричит игрокам: «Так спасайте уже!» и торопит их телепортироваться. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6960\" target=\"_blank\" rel=\"noopener\">1:56:00 ↗<\/a> · <a href=\"#qa48-34\">к записи<\/a><\/span><\/span>"}, {"t": "1:11:03", "sec": 4263, "html": "<a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> и <a class=\"ref\" href=\"/c/vladislav/\">Бладислав<\/a> летучими мышами (крит скрытности, дымовая шашка Бека) влетают в пролом. Крановщик размазывает шаром инквизитора."}, {"t": "1:12:47", "sec": 4367, "html": "Егор, уведённый «к вампирше» за угол, остаётся один на один с инквизитором: кусает его, горит от священного огня, отрывает дверную ручку, рвёт кандалы, отбивает цеп и шокером на дубинке вырубает инквизитора.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Инквизиторы бывают разного ранга\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Инквизиторы бывают разного ранга<\/b> Игроки решили, что инквизиторы слабы: их легко давили шаром, а <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егор<\/a> полчаса бился с одним на равных. Поэтому смертельный священный огонь в финале стал для них неожиданностью. Авторы пояснили, что Егор дрался с рядовым инквизитором, а верховный жрец — совсем другой уровень; о его приходе можно было узнать от оборотней. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=5439\" target=\"_blank\" rel=\"noopener\">1:30:39 ↗<\/a> · <a href=\"#qa48-25\">к записи<\/a><\/span><\/span>"}, {"t": "1:21:48", "sec": 4908, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> из окна огнемётом поджигает палатку и главного инквизитора; горящий крановщик по последнему приказу <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> добивает этого инквизитора шаром и сгорает сам. Ракета Бека ранит инквизитора на крыше. Под простынёй — инквизитор с укусом на шее. Обветшавший портал обрушивается на Бека (19 урона), но он выбирается.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Расстановка у музея: инквизиция ждала утра, протестующие были союзниками\">4<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Расстановка у музея: инквизиция ждала утра, протестующие были союзниками<\/b> Инквизиция узнала о древнем вампире, оцепила музей забором, подогнала кран и ждала рассвета, потому что внутри забаррикадировались вампиры. Ночью инквизиторы пытались прорваться: одного из них укусили и убили, и тело оставили под простынёй для будущего воскрешения. Протестующие, жители соседних домов, ничего не знали о вампире и защищали здание как архитектурную ценность, то есть фактически были союзниками героев. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=981\" target=\"_blank\" rel=\"noopener\">0:16:21 ↗<\/a> · <a href=\"#qa48-2\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Альтернативное прохождение: убить Ержана самому и договориться с инквизицией\">17<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Альтернативное прохождение: убить Ержана самому и договориться с инквизицией<\/b> Одним из вариантов было самому убить Ержана и договориться с верховным жрецом. Инквизитор под простынёй ждал Рюха: у того есть свитки воскрешения, и он может вернуть погибших вампиров к жизни людьми. Такую сделку жрец предложил бы, если бы герои попали в безвыходное положение, например в обмен на жизнь Егора. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> не потомок Ержана и не погиб бы, но его смерть убила бы часть вампиров столицы, включая <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a>. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3149\" target=\"_blank\" rel=\"noopener\">0:52:29 ↗<\/a> · <a href=\"#qa48-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Что было в сожжённых «Вампирских анналах»\">19<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Что было в сожжённых «Вампирских анналах»<\/b> <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сжёг книгу вместе с палаткой, и её так и не прочли. В ней говорилось, что в гробницу можно попасть только с ключом, окроплённым кровью потомка. Там был портрет Хадисы, похожей на <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a>: только она могла обуздать безумие Ержана, а после её смерти он стал ещё более жестоким и лёг в вечный сон. Восстановить содержание книги теперь может только сам Ержан. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3402\" target=\"_blank\" rel=\"noopener\">0:56:42 ↗<\/a> · <a href=\"#qa48-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Кран не сгорел — сгорели только крановщик и будка\">30<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Кран не сгорел — сгорели только крановщик и будка<\/b> Зрители спрашивали, как сгоревший кран смог пробить стену. Авторы ответили, что огненные болты попали в крановщика, а не в кран: чтобы уничтожить машину, её нужно сделать целью атаки. Горела будка, сам железный кран остался цел, а управление у средневекового крана простое, так что инквизиторы могли управлять им и сами. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6517\" target=\"_blank\" rel=\"noopener\">1:48:37 ↗<\/a> · <a href=\"#qa48-29\">к записи<\/a><\/span><\/span>"}, {"t": "1:27:35", "sec": 5255, "html": "Внутри музея (формалин, трёхглазые черепа, сросшиеся эмбрионы) пятеро столичных вампиров охраняют крипту: её открывает только кровь потомка Ержана на золотом ключе, один вампир уже сгорел, пытаясь. Раньше крипту открывал <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> признаётся, что выпил Винокуса.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Крипту можно было пробить силой, но с отражением урона\">33<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Крипту можно было пробить силой, но с отражением урона<\/b> На вопрос, зачем вскрывать крипту, куда инквизиция не могла попасть, авторы ответили, что камень всё равно можно было пробить дробящим оружием. У него 100 ХП, но каждый удар возвращает урон атакующему. Справиться мог разве что сильнейший — верховный жрец; не сделали бы это сегодня, сделали бы завтра. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6833\" target=\"_blank\" rel=\"noopener\">1:53:53 ↗<\/a> · <a href=\"#qa48-32\">к записи<\/a><\/span><\/span>"}, {"t": "1:31:20", "sec": 5480, "html": "До рассвета 10 минут. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> режет руку и поворачивает ключ — он не потомок Ержана, но кровь <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a> открывает проход к саркофагу.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиров-прародителей в мире не больше четырёх\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиров-прародителей в мире не больше четырёх<\/b> Проверку, не потомок ли <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> Ержана, делали на d4, поэтому авторы решили, что во всём мире ПЧК (не только в <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>) не больше четырёх вампиров-прародителей, и Ержан один из них. Чей потомок сам Дан Балан, пока держится в тайне. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2764\" target=\"_blank\" rel=\"noopener\">0:46:04 ↗<\/a> · <a href=\"#qa48-12\">к записи<\/a><\/span><\/span>"}, {"t": "1:33:38", "sec": 5618, "html": "Пещера с мраморным саркофагом (барельеф: вампир и женщина, укрытые каменной простынёй, надпись «ЕРЖАН»). <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> прикладывает ладонь к ящику «Вскрыть в чрезвычайной ситуации», отряд решает головоломку из костей — внутри свиток телепортации на восемь существ.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Без свитка телепортации пришлось бы прорываться с боем вместе с Ержаном\">9<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Без свитка телепортации пришлось бы прорываться с боем вместе с Ержаном<\/b> Из крипты под музеем не было выхода, а наверху наступило смертельное для вампиров утро. Свиток эвакуации в ящике можно было потерять: если не решить головоломку из костей за минуту, свиток сгорает. Тогда героям пришлось бы пробиваться с боем, опираясь на пробуждённого Ержана. Свиток одноразовый и после использования сгорает. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2195\" target=\"_blank\" rel=\"noopener\">0:36:35 ↗<\/a> · <a href=\"#qa48-7\">к записи<\/a><\/span><\/span>"}, {"t": "1:36:40", "sec": 5800, "html": "В саркофаге — трёхметровое крылатое чудовище с медальоном-половинкой крыла летучей мыши. Инквизиторы спускаются; огненный луч <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> рассеивает контрзаклинанием верховный жрец в белом; ракеты Бека обрушивают потолок, заваливая проход.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»<\/b> Жреца в белом, сжёгшего отряд, авторы назвали Рюхом Благочестивым (позже в подкасте — Рюхом Милосердным). Герои уже встречали его в выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">44<\/a>: он сопровождал короля на соколиной охоте. Бой с ним и инквизиторами, часть которых тоже жрецы, изначально был трудным. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep48.md упоминает его только как «Верховный жрец (в белом)», а в ep44.md он «Верховный жрец — сокольничий на охоте». Это один персонаж; в подкасте его назвали Рюхом (Благочестивым/Милосердным).<\/span> <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2321\" target=\"_blank\" rel=\"noopener\">0:38:41 ↗<\/a> · <a href=\"#qa48-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему жрец без броска отменил огненный луч Кровожадины\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему жрец без броска отменил огненный луч Кровожадины<\/b> Контрзаклинание без проверок отменяет любое заклинание до третьего уровня включительно, а <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> использовала заклинание третьего уровня. На заклинание четвёртого уровня (за четыре очка крови) пришлось бы делать бросок, но таких у неё не было: самым сильным был огненный шар. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2384\" target=\"_blank\" rel=\"noopener\">0:39:44 ↗<\/a> · <a href=\"#qa48-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Откуда у жреца контрзаклинание и огненный шар\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Откуда у жреца контрзаклинание и огненный шар<\/b> На претензию, что у жрецов не бывает контрзаклинания, мастер ответил: оно доступно с доменом магии, а огненный шар даёт второй домен — света. Главное же, монстры и NPC в ПЧК строятся не по правилам для персонажей: им можно дать что угодно, например логово во весь город с особыми действиями. Контрзаклинание впервые применили в шоу, чтобы показать игрокам, что их сильнейшее заклинание не всегда срабатывает. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6265\" target=\"_blank\" rel=\"noopener\">1:44:25 ↗<\/a> · <a href=\"#qa48-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:39:12", "sec": 5952, "html": "У <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> — вторая половина медальона («кулон прабабушки Хадисы»). Она ложится в саркофаг, медальоны сливаются, и Ержан пробуждается: «Хадиса, ты вернулась». Он хочет сожрать живого Егора, но Кровожадина торопит его.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ловушка пробуждения: игроки обошли её, не заметив\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ловушка пробуждения: игроки обошли её, не заметив<\/b> Ержана можно разбудить любым способом, но после долгого сна он просыпается в гневе, нападает на всех и мгновенно высосал бы <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егора<\/a>. Успокоить его можно было только жертвами, например у фабрики крови из выпуска <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a>. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> разбудила его медальоном, а женщины из рода Хадисы обладают способностью его успокаивать, поэтому ловушка не сработала. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2955\" target=\"_blank\" rel=\"noopener\">0:49:15 ↗<\/a> · <a href=\"#qa48-14\">к записи<\/a><\/span><\/span>"}, {"t": "1:41:22", "sec": 6082, "html": "Инквизиторы пробивают завал, внутрь тянет утренним светом; верховный жрец обрушивает священный огонь. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> открывает телепорт слишком поздно.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Инквизиторы бывают разного ранга\">26<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Инквизиторы бывают разного ранга<\/b> Игроки решили, что инквизиторы слабы: их легко давили шаром, а <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егор<\/a> полчаса бился с одним на равных. Поэтому смертельный священный огонь в финале стал для них неожиданностью. Авторы пояснили, что Егор дрался с рядовым инквизитором, а верховный жрец — совсем другой уровень; о его приходе можно было узнать от оборотней. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=5439\" target=\"_blank\" rel=\"noopener\">1:30:39 ↗<\/a> · <a href=\"#qa48-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Концовку Бреганов вёл в спешке — очень хотел в туалет\">35<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Концовку Бреганов вёл в спешке — очень хотел в туалет<\/b> Отрыжка крановщика при словах «Здравствуй, красавица» — это Бреганов, пивший лимонад. Финал приключения он вёл на последнем издыхании, потому что очень хотел в туалет (об этом говорили и в подкасте к <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">47-му<\/a> выпуску). Шатохин вырезал момент, где мастер кричит игрокам: «Так спасайте уже!» и торопит их телепортироваться. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6960\" target=\"_blank\" rel=\"noopener\">1:56:00 ↗<\/a> · <a href=\"#qa48-34\">к записи<\/a><\/span><\/span>"}, {"t": "1:44:00", "sec": 6240, "html": "Из портала в зал с камином выходят только <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> и Ержан — с пеплом <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> на руках. <a class=\"ref\" href=\"/c/vladislav/\">Бладислав<\/a>, Егор и <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> лежат в гробнице под прицелом инквизиторов; Дан Балан не успевает никого спасти. Самоуничтожение Вампирбека взрывом стирает большую часть квартала вместе с музеем.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека<\/b> В финале мастер разрешил Дану Балану вытащить через портал одного из товарищей, но <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> по совету <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> не спас никого. Спасение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> было самым рискованным: он был в режиме самоуничтожения, и при проваленной проверке Интеллекта взрыв убил бы прародителя и самого Дана. Авторы трактовали выбор как развитие персонажа: став «вампирским доном», <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> пожертвовал близкими ради главной задачи — спасти Ержана и с ним сотни вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=471\" target=\"_blank\" rel=\"noopener\">0:07:51 ↗<\/a> · <a href=\"#qa48-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Для воскрешения Кровожадины «крючка» не оставлено\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Для воскрешения Кровожадины «крючка» не оставлено<\/b> У Ержана на руках остался пепел <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a>, как когда-то собирали останки <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы пояснили, что воскресить можно кого угодно, но обычно для этого оставляют сюжетный «крючок» вроде собранного с этой целью пепла, а о Кровожадине такого сказано не было. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1875\" target=\"_blank\" rel=\"noopener\">0:31:15 ↗<\/a> · <a href=\"#qa48-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Механика самоуничтожения Вампирбека\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Механика самоуничтожения Вампирбека<\/b> Когда здоровье <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> падает до шести, запускается самоуничтожение: в его следующий ход происходит взрыв на 7d6 (спасбросок Ловкости вдвое снижает урон). Остановить его может союзник проверкой Интеллекта Сл 10, как в выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">28<\/a>. Радиус взрыва и то, что Вампирбек не может обезвредить себя сам, в карточке не указаны намеренно, чтобы оставить мастеру свободу. При спасении многое зависело бы от того, кто ходит раньше: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> или Вампирбек. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4480\" target=\"_blank\" rel=\"noopener\">1:14:40 ↗<\/a> · <a href=\"#qa48-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Телепорт вёл в гостиную Владимира Винокуса\">29<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Телепорт вёл в гостиную Владимира Винокуса<\/b> Свиток экстренной эвакуации перенёс <a class=\"ref\" href=\"/c/dan-balan/\">Дана Балана<\/a> и Ержана в гостиную покойного <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>. Почему там уютно, горит камин и лежат ковры, будто дом обитаем, авторы пообещали раскрыть в следующих выпусках. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6454\" target=\"_blank\" rel=\"noopener\">1:47:34 ↗<\/a> · <a href=\"#qa48-28\">к записи<\/a><\/span><\/span>"}, {"t": "1:46:22", "sec": 6382, "html": "5 монет = 50 000 руб. на благотворительность. Эпилог: сотни рядовых упырей спасены, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> погиб во второй и, видимо, последний раз; открытые вопросы — реакция короны на убийство верховного жреца и месть Ержана за гибель возлюбленной.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Последствия: гибель верховного жреца, конфликт с государством и, возможно, с богами\">22<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Последствия: гибель верховного жреца, конфликт с государством и, возможно, с богами<\/b> Взрыв <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> уничтожил квартал и убил верховного жреца инквизиции. Последует расследование, вину, скорее всего, возложат на нечисть и выберут нового верховного жреца, а Дана Балана ждёт серьёзнейший конфликт с государством. Жрецов инквизиции, по-видимому, питают небесные боги, поэтому, воюя с инквизицией, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> может пойти и против богов. Неясно и то, кого король сочтёт выгоднее — вампира или инквизицию. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4289\" target=\"_blank\" rel=\"noopener\">1:11:29 ↗<\/a> · <a href=\"#qa48-21\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:19:18", "sec": 1158}, {"t": "0:32:02", "sec": 1922}, {"t": "0:41:55", "sec": 2515}, {"t": "0:54:25", "sec": 3265}, {"t": "1:07:20", "sec": 4040}, {"t": "1:12:47", "sec": 4367}, {"t": "1:31:20", "sec": 5480}, {"t": "1:39:12", "sec": 5952}, {"t": "1:43:18", "sec": 6198}, {"t": "1:44:00", "sec": 6240}], "coins": {"ep": "48", "events": [{"t": "0:30:54", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "получил монету от мастера за остроумное замечание о строительных нормах (СНиП) — звуковая волна от ультразвука не долетела до окон домов", "result": null, "sec": 1854, "who_url": "/c/vampir-bek/", "reason_html": "получил монету от мастера за остроумное замечание о строительных нормах (СНиП) — звуковая волна от ультразвука не долетела до окон домов"}, {"t": "0:46:32", "kind": "loot", "who": null, "actor": null, "to": null, "reason": "внутриигровая цена товара в уличной сценке: ножи продают по одной монете (не игровая механика)", "result": null, "sec": 2792, "who_url": null, "reason_html": "внутриигровая цена товара в уличной сценке: ножи продают по одной монете (не игровая механика)"}, {"t": "0:53:45", "kind": "loot", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "находит золотую монету, обыскивая будуар убитой бабушки (внутриигровой лут)", "result": null, "sec": 3225, "who_url": "/c/vampir-bek/", "reason_html": "находит золотую монету, обыскивая будуар убитой бабушки (внутриигровой лут)"}, {"t": "0:53:58", "kind": "earn", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "получил монету от мастера за мрачно-комичный отыгрыш обыска дома и расправы над семьёй", "result": null, "sec": 3238, "who_url": "/c/vampir-bek/", "reason_html": "получил монету от мастера за мрачно-комичный отыгрыш обыска дома и расправы над семьёй"}, {"t": "1:02:14", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "потратил монету на переброс проверки убеждения/харизмы перед инквизитором, изображающим его «отца»", "result": "переброс удался, инквизитор впечатлён (овации)", "sec": 3734, "who_url": "/c/vampir-bek/", "reason_html": "потратил монету на переброс проверки убеждения/харизмы перед инквизитором, изображающим его «отца»"}, {"t": "1:02:37", "kind": "give", "who": null, "actor": null, "to": "Вампирбек", "reason": "кто-то из товарищей по команде отдал свою золотую монету Вампиру Беку для ещё одного переброса", "result": null, "sec": 3757, "who_url": null, "reason_html": "кто-то из товарищей по команде отдал свою золотую монету Вампиру Беку для ещё одного переброса"}, {"t": "1:02:44", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "потратил полученную монету на повторный переброс проверки перед инквизитором", "result": "выпал другой результат (11 в сумме), инквизитор почти поверил, но с условием", "sec": 3764, "who_url": "/c/vampir-bek/", "reason_html": "потратил полученную монету на повторный переброс проверки перед инквизитором"}, {"t": "1:08:15", "kind": "other", "who": null, "actor": null, "to": null, "reason": "шуточная реплика «монета геймастеру» после удачной сцены обольщения стражника (не награда игроку)", "result": null, "sec": 4095, "who_url": null, "reason_html": "шуточная реплика «монета геймастеру» после удачной сцены обольщения стражника (не награда игроку)"}, {"t": "1:29:28", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "получена монета от мастера за интересную, но неверную версию о родственнице прародителя Ержана («Ержановна»); кто именно из игроков высказал версию, из фрагмента неясно", "result": null, "sec": 5368, "who_url": null, "reason_html": "получена монета от мастера за интересную, но неверную версию о родственнице прародителя Ержана («Ержановна»); кто именно из игроков высказал версию, из фрагмента неясно"}, {"t": "1:42:00", "kind": "spend", "who": "Вампирбек", "actor": "BRB", "to": null, "reason": "потратил монету на переброс спасброска ловкости при уязвимости к огню (вспышка/пламя у крипты)", "result": "переброс успешен — спасся от урона", "sec": 6120, "who_url": "/c/vampir-bek/", "reason_html": "потратил монету на переброс спасброска ловкости при уязвимости к огню (вспышка/пламя у крипты)"}, {"t": "1:46:21", "kind": "other", "who": "Егор Невампирский", "actor": "Егор Свирский", "to": null, "reason": "финальный благотворительный бросок кубика в конце выпуска (обычных монет у партии к этому моменту не осталось)", "result": "выпало значение, дающее пять золотых монет (50 000 руб.) на благотворительность", "sec": 6381, "who_url": "/c/egor-nevampirskiy/", "reason_html": "финальный благотворительный бросок кубика в конце выпуска (обычных монет у партии к этому моменту не осталось)"}], "totals": [{"who": "Вампирбек", "actor": "BRB", "earned": 2, "spent": 3, "img": "img/chars/vampirbek.webp", "who_url": "/c/vampir-bek/", "actor_url": "/p/brb/"}], "notes": "Почти вся монетная активность выпуска сосредоточена на Вампире Беке (BRB): он дважды получает монету от мастера (за шутку про СНиП и за отыгрыш обыска дома) и трижды тратит монеты на переброски, причём одну из потраченных монет ему перед этим отдал кто-то из товарищей (кто именно — из фрагмента не ясно). Отдельно отмечены не относящиеся к игровой механике «лутовые» монеты (найденная в будуаре золотая монета, цена ножей в уличной сценке) и особая благотворительная монета в финале, определяющая сумму эфирного пожертвования (5 золотых монет = 50 000 руб.); также была шуточная фраза «монета геймастеру», не являющаяся реальной наградой."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, глава клана Балан", "role": "", "fate": "выжил", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека<\/b> В финале мастер разрешил Дану Балану вытащить через портал одного из товарищей, но <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> по совету <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> не спас никого. Спасение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> было самым рискованным: он был в режиме самоуничтожения, и при проваленной проверке Интеллекта взрыв убил бы прародителя и самого Дана. Авторы трактовали выбор как развитие персонажа: став «вампирским доном», <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> пожертвовал близкими ради главной задачи — спасти Ержана и с ним сотни вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=471\" target=\"_blank\" rel=\"noopener\">0:07:51 ↗<\/a> · <a href=\"#qa48-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Новые силы Дана Балана после дьяблери над Винокусом — одну забыли\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Новые силы Дана Балана после дьяблери над Винокусом — одну забыли<\/b> На вопрос, почему <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> слабо прокачался после поглощения <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, авторы перечислили новые способности. Устойчивость высшего вампира: за одно очко крови проваленный спасбросок становится успешным — про неё забыли и игрок, и авторы. Также огненный шар, газообразная форма (так когда-то сбежал <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>) и вдвое больше здоровья — то есть силы самого Винокуса. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2509\" target=\"_blank\" rel=\"noopener\">0:41:49 ↗<\/a> · <a href=\"#qa48-10\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампиров-прародителей в мире не больше четырёх\">14<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампиров-прародителей в мире не больше четырёх<\/b> Проверку, не потомок ли <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> Ержана, делали на d4, поэтому авторы решили, что во всём мире ПЧК (не только в <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>) не больше четырёх вампиров-прародителей, и Ержан один из них. Чей потомок сам Дан Балан, пока держится в тайне. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2764\" target=\"_blank\" rel=\"noopener\">0:46:04 ↗<\/a> · <a href=\"#qa48-12\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Дан Балан пойдёт к королю, а не за властью\">24<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Дан Балан пойдёт к королю, а не за властью<\/b> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, попытается рассказать правду королю и встроиться в общество: власти он не хочет. В отличие от <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, Дан Балан не стремится к господству и тяготится свалившимся на него бременем власти. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4794\" target=\"_blank\" rel=\"noopener\">1:19:54 ↗<\/a> · <a href=\"#qa48-23\">к записи<\/a><\/span><\/span>"}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "кованый рыцарь-автоматон", "role": "", "fate": "погиб (самоуничтожение)", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека<\/b> В финале мастер разрешил Дану Балану вытащить через портал одного из товарищей, но <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> по совету <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> не спас никого. Спасение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> было самым рискованным: он был в режиме самоуничтожения, и при проваленной проверке Интеллекта взрыв убил бы прародителя и самого Дана. Авторы трактовали выбор как развитие персонажа: став «вампирским доном», <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> пожертвовал близкими ради главной задачи — спасти Ержана и с ним сотни вампиров. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=471\" target=\"_blank\" rel=\"noopener\">0:07:51 ↗<\/a> · <a href=\"#qa48-1\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Вампирбека тяжело рисовать — художница поблагодарила за его смерть\">8<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Вампирбека тяжело рисовать — художница поблагодарила за его смерть<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что это первый выпуск, где он знал все способности <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, и сразу погиб. Художница Катя Гандрабура написала ему «спасибо, что убил»: автоматона было очень сложно рисовать (как и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> со Щитом). По ощущению BRB, после возрождения Вампирбек был несчастен, став бездушной машиной. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1938\" target=\"_blank\" rel=\"noopener\">0:32:18 ↗<\/a> · <a href=\"#qa48-6\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Механика самоуничтожения Вампирбека\">23<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Механика самоуничтожения Вампирбека<\/b> Когда здоровье <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> падает до шести, запускается самоуничтожение: в его следующий ход происходит взрыв на 7d6 (спасбросок Ловкости вдвое снижает урон). Остановить его может союзник проверкой Интеллекта Сл 10, как в выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">28<\/a>. Радиус взрыва и то, что Вампирбек не может обезвредить себя сам, в карточке не указаны намеренно, чтобы оставить мастеру свободу. При спасении многое зависело бы от того, кто ходит раньше: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> или Вампирбек. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4480\" target=\"_blank\" rel=\"noopener\">1:14:40 ↗<\/a> · <a href=\"#qa48-22\">к записи<\/a><\/span><\/span>"}, {"name": "Бладислав", "actor": "Евгений Чебатков", "actor_url": "/p/evgeniy-chebatkov/", "race": "вампир, врач", "role": "", "fate": "погиб", "id": "Бладислав", "url": "/c/vladislav/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Чебатков вернётся в вампирской ветке\">1<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Чебатков вернётся в вампирской ветке<\/b> Авторы анонсировали, что через выпуск <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a> снова придёт в шоу, но с другим персонажем в вампирской ветке. <span class=\"note\">Подкаст по #46 · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4456\" target=\"_blank\" rel=\"noopener\">1:14:16 ↗<\/a> · <a href=\"#qa46-27\">к записи<\/a><\/span><\/span>"}, {"name": "Кровожадина", "actor": "Динара Курбанова", "actor_url": "/p/dinara-kurbanova/", "race": "вампирша, смотрительница музея", "role": "", "fate": "погибла", "id": "Кровожадина", "url": "/c/krovozhadina/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Для воскрешения Кровожадины «крючка» не оставлено\">7<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Для воскрешения Кровожадины «крючка» не оставлено<\/b> У Ержана на руках остался пепел <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a>, как когда-то собирали останки <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы пояснили, что воскресить можно кого угодно, но обычно для этого оставляют сюжетный «крючок» вроде собранного с этой целью пепла, а о Кровожадине такого сказано не было. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1875\" target=\"_blank\" rel=\"noopener\">0:31:15 ↗<\/a> · <a href=\"#qa48-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Кровожадина — не реинкарнация Хадисы и не родственница Ержана\">20<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Кровожадина — не реинкарнация Хадисы и не родственница Ержана<\/b> Хадиса не была ни женой, ни родственницей Ержана: у неё была своя смертная семья, а к Ержану она ходила, чтобы его успокаивать, — скорее странная любовница («как в «Красавице и чудовище»»). <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> — потомок её смертной семьи по крови, а не реинкарнация, как в «Дракуле». Владелец музея, потомок Ержана, увидев её, обратил её без спроса, чтобы она навсегда была привязана к музею и в случае необходимости могла успокоить Ержана. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep48.md называет <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> «реинкарнацией/потомком» Хадисы. Правильно: она кровный потомок смертной семьи Хадисы, не реинкарнация; с Ержаном не в родстве. Обратил её владелец музея — потомок Ержана, чтобы она могла успокоить прародителя.<\/span> <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3464\" target=\"_blank\" rel=\"noopener\">0:57:44 ↗<\/a> · <a href=\"#qa48-18\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Как появилась Кровожадина\">25<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Как появилась Кровожадина<\/b> <a class=\"ref\" href=\"/p/dinara-kurbanova/\">Динаре Курбановой<\/a> показали персонажа за два дня до съёмок; пожеланий она не высказывала, но больше всего хотела попасть именно в вампирскую ветку. Имя она придумала сама: «Дина» от Динары, «кровожадная» и «жадина». Медальон-половинку крыла летучей мыши, точно как в карточке, она купила на маркетплейсе. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4864\" target=\"_blank\" rel=\"noopener\">1:21:04 ↗<\/a> · <a href=\"#qa48-24\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кольцо героизма Кровожадины — от ауры ужаса Ержана\">31<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кольцо героизма Кровожадины — от ауры ужаса Ержана<\/b> Высший вампир, обративший <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> (в подкасте — «Флореан Клыкану»), знал историю Ержана, поэтому оставил её при музее и дал ей перстень героизма: при пробуждении от Ержана исходит аура ужаса, и кольцо гарантировало, что она не испугается. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-30\">к записи<\/a><\/span><\/span>"}, {"name": "Егор Невампирский", "actor": "Егор Свирский", "actor_url": "/p/egor-svirskiy/", "race": "человек, фамильяр-охранник", "role": "", "fate": "погиб", "id": "Егор Невампирский", "url": "/c/egor-nevampirskiy/", "img": null, "other": []}], "npcs": [{"name": "Ержан Жестокий", "actor": "", "actor_url": null, "race": "", "role": "первородный вампир-прародитель", "fate": "пробуждён, выжил", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Ержан слишком силён для игрового персонажа\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Ержан слишком силён для игрового персонажа<\/b> <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> предложили сыграть Ержаном, но авторы против: у него около 200 ХП, мощная броня и атаки, аура ужаса, летает вдвое быстрее, чем бегает, — он доминировал бы над отрядом. Обсуждались идеи «Ержан против <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>» и месть Ержана инквизиторам за гибель возлюбленной: те достаточно сильны, чтобы его завалить. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2638\" target=\"_blank\" rel=\"noopener\">0:43:58 ↗<\/a> · <a href=\"#qa48-11\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: История Ержана: любовь к смертной и добровольный сон\">15<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>История Ержана: любовь к смертной и добровольный сон<\/b> Ержан всегда был чудовищем. Однажды он полюбил смертную женщину, но она не хотела вечной жизни, и он не стал обращать её силой. Хадиса дожила до седин и умерла, а Ержан потерял вкус к жизни и велел приближённым положить его в гроб спать до конца времён: убить себя он не мог, иначе погибла бы вся его ветвь. Его несколько раз будили, чтобы он благословил новый совет, последний раз больше ста лет назад. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2827\" target=\"_blank\" rel=\"noopener\">0:47:07 ↗<\/a> · <a href=\"#qa48-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Ловушка пробуждения: игроки обошли её, не заметив\">16<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Ловушка пробуждения: игроки обошли её, не заметив<\/b> Ержана можно разбудить любым способом, но после долгого сна он просыпается в гневе, нападает на всех и мгновенно высосал бы <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егора<\/a>. Успокоить его можно было только жертвами, например у фабрики крови из выпуска <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a>. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> разбудила его медальоном, а женщины из рода Хадисы обладают способностью его успокаивать, поэтому ловушка не сработала. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2955\" target=\"_blank\" rel=\"noopener\">0:49:15 ↗<\/a> · <a href=\"#qa48-14\">к записи<\/a><\/span><\/span>"}, {"name": "Хадиса", "actor": "", "actor_url": null, "race": "", "role": "древняя возлюбленная Ержана, прабабушка/прежнее воплощение Кровожадины", "fate": "умерла давно", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: История Ержана: любовь к смертной и добровольный сон\">15<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>История Ержана: любовь к смертной и добровольный сон<\/b> Ержан всегда был чудовищем. Однажды он полюбил смертную женщину, но она не хотела вечной жизни, и он не стал обращать её силой. Хадиса дожила до седин и умерла, а Ержан потерял вкус к жизни и велел приближённым положить его в гроб спать до конца времён: убить себя он не мог, иначе погибла бы вся его ветвь. Его несколько раз будили, чтобы он благословил новый совет, последний раз больше ста лет назад. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2827\" target=\"_blank\" rel=\"noopener\">0:47:07 ↗<\/a> · <a href=\"#qa48-13\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Что было в сожжённых «Вампирских анналах»\">19<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Что было в сожжённых «Вампирских анналах»<\/b> <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сжёг книгу вместе с палаткой, и её так и не прочли. В ней говорилось, что в гробницу можно попасть только с ключом, окроплённым кровью потомка. Там был портрет Хадисы, похожей на <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a>: только она могла обуздать безумие Ержана, а после её смерти он стал ещё более жестоким и лёг в вечный сон. Восстановить содержание книги теперь может только сам Ержан. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3402\" target=\"_blank\" rel=\"noopener\">0:56:42 ↗<\/a> · <a href=\"#qa48-17\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-correction\" aria-expanded=\"false\" title=\"Исправление: Кровожадина — не реинкарнация Хадисы и не родственница Ержана\">20<\/button><span class=\"fnb t-correction\" hidden><span class=\"ptype\">Исправление<\/span> <b>Кровожадина — не реинкарнация Хадисы и не родственница Ержана<\/b> Хадиса не была ни женой, ни родственницей Ержана: у неё была своя смертная семья, а к Ержану она ходила, чтобы его успокаивать, — скорее странная любовница («как в «Красавице и чудовище»»). <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> — потомок её смертной семьи по крови, а не реинкарнация, как в «Дракуле». Владелец музея, потомок Ержана, увидев её, обратил её без спроса, чтобы она навсегда была привязана к музею и в случае необходимости могла успокоить Ержана. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep48.md называет <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> «реинкарнацией/потомком» Хадисы. Правильно: она кровный потомок смертной семьи Хадисы, не реинкарнация; с Ержаном не в родстве. Обратил её владелец музея — потомок Ержана, чтобы она могла успокоить прародителя.<\/span> <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3464\" target=\"_blank\" rel=\"noopener\">0:57:44 ↗<\/a> · <a href=\"#qa48-18\">к записи<\/a><\/span><\/span>"}, {"name": "Владимир Винокус", "actor": "", "actor_url": null, "race": "", "role": "покойный глава высшего вампирского совета", "fate": "погиб ранее", "id": "Винокус", "url": "/c/vladimir-vinokus/", "img": "img/chars/vladimir-vinokus.webp", "other": [{"key": "40", "label": "40", "title": "Паспорт хорошей твари"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Телепорт вёл в гостиную Владимира Винокуса\">29<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Телепорт вёл в гостиную Владимира Винокуса<\/b> Свиток экстренной эвакуации перенёс <a class=\"ref\" href=\"/c/dan-balan/\">Дана Балана<\/a> и Ержана в гостиную покойного <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>. Почему там уютно, горит камин и лежат ковры, будто дом обитаем, авторы пообещали раскрыть в следующих выпусках. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6454\" target=\"_blank\" rel=\"noopener\">1:47:34 ↗<\/a> · <a href=\"#qa48-28\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции\">32<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b> Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 ↗<\/a> · <a href=\"#qa48-31\">к записи<\/a><\/span><\/span>"}, {"name": "Густав", "actor": "", "actor_url": null, "race": "", "role": "протестующий у музея", "fate": "погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Что на самом деле задумал Густав и зачем нужны были протестующие\">5<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Что на самом деле задумал Густав и зачем нужны были протестующие<\/b> Протестующий Густав врал, что протест мирный: на деле он собирался пробраться на территорию и перекусить кусачками трос стенобитного шара, чтобы музей не смогли снести. Протестующие давали подсказки: шар можно обезвредить, а через квартиру Густава (ключ был у него) можно тихо попасть к музею. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1296\" target=\"_blank\" rel=\"noopener\">0:21:36 ↗<\/a> · <a href=\"#qa48-3\">к записи<\/a><\/span><\/span>"}, {"name": "Ольма", "actor": "", "actor_url": null, "race": "", "role": "жена Густава", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Мать Ольмы", "actor": "", "actor_url": null, "race": "", "role": "тёща Густава", "fate": "погибла", "id": null, "url": null, "img": null, "other": []}, {"name": "Крановщик", "actor": "", "actor_url": null, "race": "", "role": "рабочий, очарованный Кровожадиной", "fate": "погиб", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Кран не сгорел — сгорели только крановщик и будка\">30<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Кран не сгорел — сгорели только крановщик и будка<\/b> Зрители спрашивали, как сгоревший кран смог пробить стену. Авторы ответили, что огненные болты попали в крановщика, а не в кран: чтобы уничтожить машину, её нужно сделать целью атаки. Горела будка, сам железный кран остался цел, а управление у средневекового крана простое, так что инквизиторы могли управлять им и сами. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6517\" target=\"_blank\" rel=\"noopener\">1:48:37 ↗<\/a> · <a href=\"#qa48-29\">к записи<\/a><\/span><\/span>"}, {"name": "Главный инквизитор", "actor": "", "actor_url": null, "race": "", "role": "инквизитор в красной мантии", "fate": "погиб", "id": null, "url": null, "img": null, "other": []}, {"name": "Инквизитор-«брат»", "actor": "", "actor_url": null, "race": "", "role": "конвоир Егора", "fate": "оглушён", "id": null, "url": null, "img": null, "other": []}, {"name": "Верховный жрец инквизиции", "actor": "", "actor_url": null, "race": "", "role": "глава операции, маг", "fate": "погиб (по эпилогу)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»<\/b> Жреца в белом, сжёгшего отряд, авторы назвали Рюхом Благочестивым (позже в подкасте — Рюхом Милосердным). Герои уже встречали его в выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">44<\/a>: он сопровождал короля на соколиной охоте. Бой с ним и инквизиторами, часть которых тоже жрецы, изначально был трудным. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> summaries/ep48.md упоминает его только как «Верховный жрец (в белом)», а в ep44.md он «Верховный жрец — сокольничий на охоте». Это один персонаж; в подкасте его назвали Рюхом (Благочестивым/Милосердным).<\/span> <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2321\" target=\"_blank\" rel=\"noopener\">0:38:41 ↗<\/a> · <a href=\"#qa48-8\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Альтернативное прохождение: убить Ержана самому и договориться с инквизицией\">17<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Альтернативное прохождение: убить Ержана самому и договориться с инквизицией<\/b> Одним из вариантов было самому убить Ержана и договориться с верховным жрецом. Инквизитор под простынёй ждал Рюха: у того есть свитки воскрешения, и он может вернуть погибших вампиров к жизни людьми. Такую сделку жрец предложил бы, если бы герои попали в безвыходное положение, например в обмен на жизнь Егора. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> не потомок Ержана и не погиб бы, но его смерть убила бы часть вампиров столицы, включая <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a>. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3149\" target=\"_blank\" rel=\"noopener\">0:52:29 ↗<\/a> · <a href=\"#qa48-15\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Откуда у жреца контрзаклинание и огненный шар\">27<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Откуда у жреца контрзаклинание и огненный шар<\/b> На претензию, что у жрецов не бывает контрзаклинания, мастер ответил: оно доступно с доменом магии, а огненный шар даёт второй домен — света. Главное же, монстры и NPC в ПЧК строятся не по правилам для персонажей: им можно дать что угодно, например логово во весь город с особыми действиями. Контрзаклинание впервые применили в шоу, чтобы показать игрокам, что их сильнейшее заклинание не всегда срабатывает. <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6265\" target=\"_blank\" rel=\"noopener\">1:44:25 ↗<\/a> · <a href=\"#qa48-26\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Новый верховный жрец будет слабее Рюха\">34<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Новый верховный жрец будет слабее Рюха<\/b> Вместо погибшего Рюха Милосердного выберут нового верховного жреца со своими силами, тоже мощного, ведь его питают боги, но не такого сильного, как Рюх. Авторы напомнили, что другого верховного жреца, <a class=\"ref\" href=\"/c/gudi-blagochestivyy/\">Гуди<\/a> Благочестивого, герои встречали в «Судьбе <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>». <span class=\"note\">Подкаст по #48 · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6895\" target=\"_blank\" rel=\"noopener\">1:54:55 ↗<\/a> · <a href=\"#qa48-33\">к записи<\/a><\/span><\/span>"}], "links": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "note_html": "Начало вампирской ветви клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>", "dir": "out", "color": "#B03A7A"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "note_html": "Вампирская ветвь", "dir": "out", "color": "#B03A7A"}, {"key": "20", "label": "20", "title": "Вампирское возмездие", "note_html": "Вампирская ветвь", "dir": "out", "color": "#B03A7A"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари", "note_html": "Указ о паспорте хорошей твари; <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> выпил <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>", "dir": "out", "color": "#B03A7A"}], "quotes_html": ["«Мозг Егора Свирского, заключённый в тело Егора Свирского».", "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a>: «Смотрите, мы ножи продаём… только сегодня со скидкой 50%».", "<a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a>: «Я всегда хотела быть комиком, но мне больше нравится убивать».", "Ержан: «Хадиса, ты вернулась?» — «Милый, меньше болтовни. Ты как всегда душный».", "Инквизитор: «Если тебе не хватает тепла, брат, держи его сполна»."], "places_html": "<ul>\n<li>Места: столица <a class=\"ref\" href=\"/place/poniya/\">Пония<\/a> (восточный квартал), особняк/музей анатомических редкостей Монплезир и крипта под ним; квартира Густава; зал с камином, куда вёл телепорт.<\/li>\n<li>Фракции: клан Балан; столичные вампиры; бывший высший вампирский совет (13 упырей); королевская инквизиция; городская стража; протестующие «защитники музея».<\/li>\n<li>Артефакты: золотой ключ крипты (открывается кровью потомка); «Вампирские анналы» (книга инквизиции); ящик «Вскрыть в чрезвычайной ситуации» с головоломкой из костей; свиток телепортации на 8 существ; медальон из двух половин-крыльев летучей мыши; кольцо героизма <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a>; паспорт хорошей твари; стенобитный кран.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>35<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>35<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>9<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>12<\/small><\/button><button class=\"chip ptf t-correction\" data-t=\"correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>8<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>5<\/small><\/button><\/div><article class=\"pnote t-plan\" id=\"qa46-27\" data-type=\"plan\"><div class=\"pn
