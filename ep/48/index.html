-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Чебатков вернётся в вампирской ветке<\/b><\/div><p>Авторы анонсировали, что через выпуск <a class=\"ref\" href=\"/p/evgeniy-chebatkov/\">Евгений Чебатков<\/a> снова придёт в шоу, но с другим персонажем в вампирской ветке.<\/p><blockquote>«Через один выпуск Вадженя Чебатков будет снова в гостях, но с другим персонажем... Вампирская, да?»<\/blockquote><p class=\"note\"><a href=\"/pod/qa46/#qa46-27\">Подкаст по #46<\/a> · <a href=\"https://youtu.be/xPwlOtp8FsI?t=4456\" target=\"_blank\" rel=\"noopener\">1:14:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa47-9\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Таймер совпал с реальным временем съёмки; в тот же день сняли выпуск 48<\/b><\/div><p>Выпуск сняли примерно за 4,5 часа: полчаса на представление, а дальше ровно каждый час закрывалось одно деление четырёхчасового таймера. Это одна из самых коротких и динамичных съёмок. В тот же день сняли и следующий, вампирский выпуск, тоже примерно за 4,5 часа.<\/p><blockquote>«Мы вообще в тот день сняли два выпуска: ваш и следующий, который будет вампирский, и оба сняли примерно за 4,5 часа.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa47/#qa47-9\">Подкаст по #47<\/a> · <a href=\"https://youtu.be/2JwxVTbvp8c?t=2945\" target=\"_blank\" rel=\"noopener\">0:49:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">#47<\/a>, <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-1\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Дан Балан никого не спас и чем рисковало спасение Вампирбека<\/b><\/div><p>В финале мастер разрешил Дану Балану вытащить через портал одного из товарищей, но <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> по совету <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a> не спас никого. Спасение <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> было самым рискованным: он был в режиме самоуничтожения, и при проваленной проверке Интеллекта взрыв убил бы прародителя и самого Дана. Авторы трактовали выбор как развитие персонажа: став «вампирским доном», <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> пожертвовал близкими ради главной задачи — спасти Ержана и с ним сотни вампиров.<\/p><blockquote>«Задача была спасти древнего вампира для того, чтобы спасти сотни вампиров других. В сущности, Дан Балан выполнил эту миссию.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-1\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=471\" target=\"_blank\" rel=\"noopener\">0:07:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-2\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Расстановка у музея: инквизиция ждала утра, протестующие были союзниками<\/b><\/div><p>Инквизиция узнала о древнем вампире, оцепила музей забором, подогнала кран и ждала рассвета, потому что внутри забаррикадировались вампиры. Ночью инквизиторы пытались прорваться: одного из них укусили и убили, и тело оставили под простынёй для будущего воскрешения. Протестующие, жители соседних домов, ничего не знали о вампире и защищали здание как архитектурную ценность, то есть фактически были союзниками героев.<\/p><blockquote>«Ночью получили укус, одного убитого оставили на будущее воскрешение. И решили: давайте утром при свете снесём, и солнечные лучи нам помогут.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-2\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=981\" target=\"_blank\" rel=\"noopener\">0:16:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-3\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Что на самом деле задумал Густав и зачем нужны были протестующие<\/b><\/div><p>Протестующий Густав врал, что протест мирный: на деле он собирался пробраться на территорию и перекусить кусачками трос стенобитного шара, чтобы музей не смогли снести. Протестующие давали подсказки: шар можно обезвредить, а через квартиру Густава (ключ был у него) можно тихо попасть к музею.<\/p><blockquote>«Они хотели проникнуть на территорию музея с этими кусачками, которые были у него в кармане, и отрезать шар стенобитный.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-3\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1296\" target=\"_blank\" rel=\"noopener\">0:21:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa48-4\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Из сцены в квартире Густава вырезали шутку<\/b><\/div><p>Зрители заметили, что в сцене в квартире Густава чего-то не хватает: авторы подтвердили, что вырезали оттуда шутку («жених приехал»). Саму сцену, где героини приносят в дом труп мужа и убивают жену и тёщу, авторы назвали невероятно злодейской.<\/p><blockquote>«Такая шутка, ребят, была её вырезать. Мы её вырезали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-4\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1621\" target=\"_blank\" rel=\"noopener\">0:27:01 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-5\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Для воскрешения Кровожадины «крючка» не оставлено<\/b><\/div><p>У Ержана на руках остался пепел <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадины<\/a>, как когда-то собирали останки <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>. Авторы пояснили, что воскресить можно кого угодно, но обычно для этого оставляют сюжетный «крючок» вроде собранного с этой целью пепла, а о Кровожадине такого сказано не было.<\/p><blockquote>«Можно найти кучу вариантов воскресить любого персонажа. Но мы всегда, когда есть крючок на следующий выпуск… По поводу Кровожадины такого сказано не было.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-5\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1875\" target=\"_blank\" rel=\"noopener\">0:31:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa48-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вампирбека тяжело рисовать — художница поблагодарила за его смерть<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> рассказал, что это первый выпуск, где он знал все способности <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a>, и сразу погиб. Художница Катя Гандрабура написала ему «спасибо, что убил»: автоматона было очень сложно рисовать (как и <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> со Щитом). По ощущению BRB, после возрождения Вампирбек был несчастен, став бездушной машиной.<\/p><blockquote>«Мне написала эсэмэску наша художница Катя Гандрабура: «Спасибо, что убил». … Мы задолбались его рисовать.»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa48/#qa48-6\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=1938\" target=\"_blank\" rel=\"noopener\">0:32:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-7\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Без свитка телепортации пришлось бы прорываться с боем вместе с Ержаном<\/b><\/div><p>Из крипты под музеем не было выхода, а наверху наступило смертельное для вампиров утро. Свиток эвакуации в ящике можно было потерять: если не решить головоломку из костей за минуту, свиток сгорает. Тогда героям пришлось бы пробиваться с боем, опираясь на пробуждённого Ержана. Свиток одноразовый и после использования сгорает.<\/p><blockquote>«Если вы не разгадываете загадку за минуту… он сгорает, и это нормально. Тогда вам надо думать уже, как выбираться.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-7\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2195\" target=\"_blank\" rel=\"noopener\">0:36:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-8\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Верховный жрец инквизиции — Рюх, знакомый по «Королевской охоте»<\/b><\/div><p>Жреца в белом, сжёгшего отряд, авторы назвали Рюхом Благочестивым (позже в подкасте — Рюхом Милосердным). Герои уже встречали его в выпуске <a href=\"/ep/44/\" title=\"Королевская охота\">44<\/a>: он сопровождал короля на соколиной охоте. Бой с ним и инквизиторами, часть которых тоже жрецы, изначально был трудным.<\/p><blockquote>«Верховный жрец, которого зовут Рюх Благочестивый. Как игроки, вы его встречали в другом приключении, «Королевская охота», номер 44.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep48.md упоминает его только как «Верховный жрец (в белом)», а в ep44.md он «Верховный жрец — сокольничий на охоте». Это один персонаж; в подкасте его назвали Рюхом (Благочестивым/Милосердным).<\/p><p class=\"note\"><a href=\"/pod/qa48/#qa48-8\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2321\" target=\"_blank\" rel=\"noopener\">0:38:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/44/\" title=\"Королевская охота\">#44<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-9\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему жрец без броска отменил огненный луч Кровожадины<\/b><\/div><p>Контрзаклинание без проверок отменяет любое заклинание до третьего уровня включительно, а <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> использовала заклинание третьего уровня. На заклинание четвёртого уровня (за четыре очка крови) пришлось бы делать бросок, но таких у неё не было: самым сильным был огненный шар.<\/p><blockquote>«Ты использовал заклинание третьего уровня, а контрзаклинание без проверок останавливает любые заклинания не выше третьего уровня включительно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-9\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2384\" target=\"_blank\" rel=\"noopener\">0:39:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Новые силы Дана Балана после дьяблери над Винокусом — одну забыли<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> слабо прокачался после поглощения <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокуса<\/a>, авторы перечислили новые способности. Устойчивость высшего вампира: за одно очко крови проваленный спасбросок становится успешным — про неё забыли и игрок, и авторы. Также огненный шар, газообразная форма (так когда-то сбежал <a class=\"ref\" href=\"/c/gryaznis-domogaytis/\">Грязнис Домогайтис<\/a>) и вдвое больше здоровья — то есть силы самого Винокуса.<\/p><blockquote>«У тебя из новых была устойчивость высшего вампира… — Да, мы тоже, честно, про это забыли, поэтому не подсказали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-10\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2509\" target=\"_blank\" rel=\"noopener\">0:41:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-11\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Ержан слишком силён для игрового персонажа<\/b><\/div><p><a class=\"ref\" href=\"/p/brb/\">BRB<\/a> предложили сыграть Ержаном, но авторы против: у него около 200 ХП, мощная броня и атаки, аура ужаса, летает вдвое быстрее, чем бегает, — он доминировал бы над отрядом. Обсуждались идеи «Ержан против <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>» и месть Ержана инквизиторам за гибель возлюбленной: те достаточно сильны, чтобы его завалить.<\/p><blockquote>«Ержан, огорчённый смертью своей возлюбленной, пусть её реинкарнации некой, хочет начать уничтожение инквизиторов.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-11\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2638\" target=\"_blank\" rel=\"noopener\">0:43:58 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-12\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампиров-прародителей в мире не больше четырёх<\/b><\/div><p>Проверку, не потомок ли <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> Ержана, делали на d4, поэтому авторы решили, что во всём мире ПЧК (не только в <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>) не больше четырёх вампиров-прародителей, и Ержан один из них. Чей потомок сам Дан Балан, пока держится в тайне.<\/p><blockquote>«Поскольку кубик D4, мы будем считать, что этих вампиров-прародителей по всему миру Подземелий не больше четырёх. Одним из них является Ержан.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-12\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2764\" target=\"_blank\" rel=\"noopener\">0:46:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-13\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>История Ержана: любовь к смертной и добровольный сон<\/b><\/div><p>Ержан всегда был чудовищем. Однажды он полюбил смертную женщину, но она не хотела вечной жизни, и он не стал обращать её силой. Хадиса дожила до седин и умерла, а Ержан потерял вкус к жизни и велел приближённым положить его в гроб спать до конца времён: убить себя он не мог, иначе погибла бы вся его ветвь. Его несколько раз будили, чтобы он благословил новый совет, последний раз больше ста лет назад.<\/p><blockquote>«Он сказал: «Положите меня в гроб, я буду спать до конца времён». … Его будили, по нашей легенде, чтобы он благословил новый совет.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-13\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2827\" target=\"_blank\" rel=\"noopener\">0:47:07 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-14\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Ловушка пробуждения: игроки обошли её, не заметив<\/b><\/div><p>Ержана можно разбудить любым способом, но после долгого сна он просыпается в гневе, нападает на всех и мгновенно высосал бы <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егора<\/a>. Успокоить его можно было только жертвами, например у фабрики крови из выпуска <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">26<\/a>. <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> разбудила его медальоном, а женщины из рода Хадисы обладают способностью его успокаивать, поэтому ловушка не сработала.<\/p><blockquote>«Все из рода вот этой Динары, Хадиса и прочие женщины-потомки, только они могут его успокаивать.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-14\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=2955\" target=\"_blank\" rel=\"noopener\">0:49:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-15\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Альтернативное прохождение: убить Ержана самому и договориться с инквизицией<\/b><\/div><p>Одним из вариантов было самому убить Ержана и договориться с верховным жрецом. Инквизитор под простынёй ждал Рюха: у того есть свитки воскрешения, и он может вернуть погибших вампиров к жизни людьми. Такую сделку жрец предложил бы, если бы герои попали в безвыходное положение, например в обмен на жизнь Егора. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> не потомок Ержана и не погиб бы, но его смерть убила бы часть вампиров столицы, включая <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a>.<\/p><blockquote>«Одним из возможностей пройти это приключение было просто самому убить Ержана. Ты мог убить Ержана, ты мог договориться со жрецом.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-15\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3149\" target=\"_blank\" rel=\"noopener\">0:52:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-16\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ержана сдали оборотни, работающие на инквизицию<\/b><\/div><p>В соседнем переулке ждали оборотни, сотрудничающие с инквизицией: они выследили прародителя и выкрали для Рюха книгу «Вампирские анналы». Встретив их, герои узнали бы, что оборотни ждут прихода верховного жреца за платой. Через них можно было и договориться.<\/p><blockquote>«Были оборотни, которые уже работают с инквизицией и которые как раз и выследили и узнали, где находится вампир-прародитель.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-16\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3340\" target=\"_blank\" rel=\"noopener\">0:55:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-17\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Что было в сожжённых «Вампирских анналах»<\/b><\/div><p><a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> сжёг книгу вместе с палаткой, и её так и не прочли. В ней говорилось, что в гробницу можно попасть только с ключом, окроплённым кровью потомка. Там был портрет Хадисы, похожей на <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a>: только она могла обуздать безумие Ержана, а после её смерти он стал ещё более жестоким и лёг в вечный сон. Восстановить содержание книги теперь может только сам Ержан.<\/p><blockquote>«В книге встречается портрет женщины, похожий на персонажа Динары. Её зовут Хадиса. Это возлюбленная Ержана Жестокого. Только она могла обуздать безумие древнего.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-17\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3402\" target=\"_blank\" rel=\"noopener\">0:56:42 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-correction\" id=\"qa48-18\" data-type=\"correction\"><div class=\"pn-h\"><sup class=fnn>20<\/sup><span class=\"ptype t-correction\" title=\"верная версия факта, названного в выпуске неверно\">Исправление<\/span><b>Кровожадина — не реинкарнация Хадисы и не родственница Ержана<\/b><\/div><p>Хадиса не была ни женой, ни родственницей Ержана: у неё была своя смертная семья, а к Ержану она ходила, чтобы его успокаивать, — скорее странная любовница («как в «Красавице и чудовище»»). <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадина<\/a> — потомок её смертной семьи по крови, а не реинкарнация, как в «Дракуле». Владелец музея, потомок Ержана, увидев её, обратил её без спроса, чтобы она навсегда была привязана к музею и в случае необходимости могла успокоить Ержана.<\/p><blockquote>«Они с Ержаном не родственники. Она потомок смертной части. … Только здесь всё идёт просто по крови.»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> summaries/ep48.md называет <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> «реинкарнацией/потомком» Хадисы. Правильно: она кровный потомок смертной семьи Хадисы, не реинкарнация; с Ержаном не в родстве. Обратил её владелец музея — потомок Ержана, чтобы она могла успокоить прародителя.<\/p><p class=\"note\"><a href=\"/pod/qa48/#qa48-18\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3464\" target=\"_blank\" rel=\"noopener\">0:57:44 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>21<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Происхождение королевской инквизиции и почему удар пришёлся по вампирам<\/b><\/div><p>Королевская инквизиция создана в начале демонического нашествия, чтобы на фоне кризиса веры объединить жрецов против нечисти — «внутреннего врага». Её создали по инициативе <a class=\"ref\" href=\"/c/korol-poni-v/\">Пония V<\/a>, но действует она самостоятельно, как «НКВД», с широкими полномочиями и злоупотреблениями. Авторы сравнили её с испанской инквизицией, преследовавшей крещёных мавров и евреев, так же как инквизиция ПЧК преследует обладателей <a class=\"ref\" href=\"/a/pasport-horoshey-tvari/\">паспорта хорошей твари<\/a>. Вампиров сочли самой опасной нечистью после того, как выяснилось, что вампиром был глава тайной канцелярии <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a>; из «Вампирских анналов» инквизиторы поняли, что одним ударом могут уничтожить сотни столичных вампиров.<\/p><blockquote>«Королевская инквизиция как организация была создана в момент, когда началось демоническое нашествие, потому что кризис веры требовал консолидации жрецов для борьбы с нечистью.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-20\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-21\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>22<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Последствия: гибель верховного жреца, конфликт с государством и, возможно, с богами<\/b><\/div><p>Взрыв <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> уничтожил квартал и убил верховного жреца инквизиции. Последует расследование, вину, скорее всего, возложат на нечисть и выберут нового верховного жреца, а Дана Балана ждёт серьёзнейший конфликт с государством. Жрецов инквизиции, по-видимому, питают небесные боги, поэтому, воюя с инквизицией, <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> может пойти и против богов. Неясно и то, кого король сочтёт выгоднее — вампира или инквизицию.<\/p><blockquote>«Это ведёт к серьёзнейшему конфликту с государством. И Дану Балану серьёзно надо об этом задуматься.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-21\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4289\" target=\"_blank\" rel=\"noopener\">1:11:29 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>23<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Механика самоуничтожения Вампирбека<\/b><\/div><p>Когда здоровье <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбека<\/a> падает до шести, запускается самоуничтожение: в его следующий ход происходит взрыв на 7d6 (спасбросок Ловкости вдвое снижает урон). Остановить его может союзник проверкой Интеллекта Сл 10, как в выпуске <a href=\"/ep/28a/\" title=\"Часть 1 Чёрное небо вампиров\">28<\/a>. Радиус взрыва и то, что Вампирбек не может обезвредить себя сам, в карточке не указаны намеренно, чтобы оставить мастеру свободу. При спасении многое зависело бы от того, кто ходит раньше: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> или Вампирбек.<\/p><blockquote>«Если твоё здоровье опускается до шести, запускается процесс самоуничтожения… Чтобы остановить самоуничтожение, нужно пройти проверку Интеллекта 10.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-22\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4480\" target=\"_blank\" rel=\"noopener\">1:14:40 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/28b/\" title=\"Часть 2 Чёрное небо вампиров\">#28b<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-23\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>24<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Дан Балан пойдёт к королю, а не за властью<\/b><\/div><p><a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> сказал, что <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a>, скорее всего, попытается рассказать правду королю и встроиться в общество: власти он не хочет. В отличие от <a class=\"ref\" href=\"/c/drakon-gimelut/\">Гиммилута<\/a>, Дан Балан не стремится к господству и тяготится свалившимся на него бременем власти.<\/p><blockquote>«Дан Балан не стремится к мировому господству. Это не Гиммилут.»<\/blockquote><p class=\"note\">Гудков · <a href=\"/pod/qa48/#qa48-23\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4794\" target=\"_blank\" rel=\"noopener\">1:19:54 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa48-24\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>25<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Как появилась Кровожадина<\/b><\/div><p><a class=\"ref\" href=\"/p/dinara-kurbanova/\">Динаре Курбановой<\/a> показали персонажа за два дня до съёмок; пожеланий она не высказывала, но больше всего хотела попасть именно в вампирскую ветку. Имя она придумала сама: «Дина» от Динары, «кровожадная» и «жадина». Медальон-половинку крыла летучей мыши, точно как в карточке, она купила на маркетплейсе.<\/p><blockquote>«Кровожадина — это и про то, что она Дина, типа Динара, и про то, что она кровожадная, и про то, что она жадина.»<\/blockquote><p class=\"note\">Курбанова · <a href=\"/pod/qa48/#qa48-24\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=4864\" target=\"_blank\" rel=\"noopener\">1:21:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-25\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>26<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Инквизиторы бывают разного ранга<\/b><\/div><p>Игроки решили, что инквизиторы слабы: их легко давили шаром, а <a class=\"ref\" href=\"/c/egor-nevampirskiy/\">Егор<\/a> полчаса бился с одним на равных. Поэтому смертельный священный огонь в финале стал для них неожиданностью. Авторы пояснили, что Егор дрался с рядовым инквизитором, а верховный жрец — совсем другой уровень; о его приходе можно было узнать от оборотней.<\/p><blockquote>«Инквизиторы, видишь, тоже разноранговые существуют. Он дрался с рядовым по большому счёту. Это не одно и то же, что драться с верховным жрецом.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-25\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=5439\" target=\"_blank\" rel=\"noopener\">1:30:39 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>27<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Откуда у жреца контрзаклинание и огненный шар<\/b><\/div><p>На претензию, что у жрецов не бывает контрзаклинания, мастер ответил: оно доступно с доменом магии, а огненный шар даёт второй домен — света. Главное же, монстры и NPC в ПЧК строятся не по правилам для персонажей: им можно дать что угодно, например логово во весь город с особыми действиями. Контрзаклинание впервые применили в шоу, чтобы показать игрокам, что их сильнейшее заклинание не всегда срабатывает.<\/p><blockquote>«Монстры и персонажи — это асинхронные сущности. Они генерятся по разным правилам.»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa48/#qa48-26\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6265\" target=\"_blank\" rel=\"noopener\">1:44:25 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-27\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>28<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Протестующих можно было поднять на штурм музея<\/b><\/div><p>Авторы подтвердили, что толпу можно было подбить на штурм музея: это был один из задуманных способов проникнуть внутрь или как минимум неплохой отвлекающий манёвр. Им самим больше понравился путь, который выбрали игроки, — через квартиру Густава.<\/p><blockquote>«Определённый бунт протестующих — это как минимум неплохой отвлекающий манёвр.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-27\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6391\" target=\"_blank\" rel=\"noopener\">1:46:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-28\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>29<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Телепорт вёл в гостиную Владимира Винокуса<\/b><\/div><p>Свиток экстренной эвакуации перенёс <a class=\"ref\" href=\"/c/dan-balan/\">Дана Балана<\/a> и Ержана в гостиную покойного <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Владимира Винокуса<\/a>. Почему там уютно, горит камин и лежат ковры, будто дом обитаем, авторы пообещали раскрыть в следующих выпусках.<\/p><blockquote>«Для экстренного отхода… в гостиную этого Владимира Винокуса. А почему там уютно горит камин… вы узнаете в следующих выпусках.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-28\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6454\" target=\"_blank\" rel=\"noopener\">1:47:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-29\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>30<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Кран не сгорел — сгорели только крановщик и будка<\/b><\/div><p>Зрители спрашивали, как сгоревший кран смог пробить стену. Авторы ответили, что огненные болты попали в крановщика, а не в кран: чтобы уничтожить машину, её нужно сделать целью атаки. Горела будка, сам железный кран остался цел, а управление у средневекового крана простое, так что инквизиторы могли управлять им и сами.<\/p><blockquote>«Чтобы уничтожить машину, надо сделать целью своей атаки машину. Если ты делаешь целью атаки водителя, то ты убиваешь водителя.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-29\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6517\" target=\"_blank\" rel=\"noopener\">1:48:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-30\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>31<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кольцо героизма Кровожадины — от ауры ужаса Ержана<\/b><\/div><p>Высший вампир, обративший <a class=\"ref\" href=\"/c/krovozhadina/\">Кровожадину<\/a> (в подкасте — «Флореан Клыкану»), знал историю Ержана, поэтому оставил её при музее и дал ей перстень героизма: при пробуждении от Ержана исходит аура ужаса, и кольцо гарантировало, что она не испугается.<\/p><blockquote>«Знал ли историю Ержана высший вампир, который укусил Кровожадину? Да, он знал эту историю… и дал ей перстень героизма.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-30\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa48-31\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>32<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Как вампирский совет и Четвёртая фабрика существовали под носом инквизиции<\/b><\/div><p>Инквизиция появилась недавно, а вампиры с самого начала управляли тайной канцелярией: её глава <a class=\"ref\" href=\"/c/vladimir-vinokus/\">Винокус<\/a> легко прятал от инквизиторов фабрику крови и мог сдавать им неугодных вампиров. Свою роль играли коррупция и интриги.<\/p><blockquote>«Было легко прятать от инквизиторов какую-то фабрику, учитывая, что он был главой тайной канцелярии.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-31\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6706\" target=\"_blank\" rel=\"noopener\">1:51:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/26/\" title=\"Четвёртая фабрика\">#26<\/a>, <a href=\"/ep/40/\" title=\"Паспорт хорошей твари\">#40<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa48-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>33<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Крипту можно было пробить силой, но с отражением урона<\/b><\/div><p>На вопрос, зачем вскрывать крипту, куда инквизиция не могла попасть, авторы ответили, что камень всё равно можно было пробить дробящим оружием. У него 100 ХП, но каждый удар возвращает урон атакующему. Справиться мог разве что сильнейший — верховный жрец; не сделали бы это сегодня, сделали бы завтра.<\/p><blockquote>«У него 100 ХП, тебе надо набить 100 ХП дробящим оружием, но каждый раз тебе урон этот возвращается.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-32\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6833\" target=\"_blank\" rel=\"noopener\">1:53:53 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa48-33\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>34<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Новый верховный жрец будет слабее Рюха<\/b><\/div><p>Вместо погибшего Рюха Милосердного выберут нового верховного жреца со своими силами, тоже мощного, ведь его питают боги, но не такого сильного, как Рюх. Авторы напомнили, что другого верховного жреца, <a class=\"ref\" href=\"/c/gudi-blagochestivyy/\">Гуди<\/a> Благочестивого, герои встречали в «Судьбе <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>».<\/p><blockquote>«Будет ещё один верховный жрец, у него будут собственные силы… он будет мощный 100%. Его боги же питают.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-33\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6895\" target=\"_blank\" rel=\"noopener\">1:54:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a>, <a href=\"/ep/21b/\" title=\"Часть 2 Судьба Властона\">#21b<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa48-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>35<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Концовку Бреганов вёл в спешке — очень хотел в туалет<\/b><\/div><p>Отрыжка крановщика при словах «Здравствуй, красавица» — это Бреганов, пивший лимонад. Финал приключения он вёл на последнем издыхании, потому что очень хотел в туалет (об этом говорили и в подкасте к <a href=\"/ep/47/\" title=\"Вокзал грешных душ\">47-му<\/a> выпуску). Шатохин вырезал момент, где мастер кричит игрокам: «Так спасайте уже!» и торопит их телепортироваться.<\/p><blockquote>«Это было вырезано из выпуска лично мной… Саня орёт: «Так спасайте уже!»<\/blockquote><p class=\"note\"><a href=\"/pod/qa48/#qa48-34\">Подкаст по #48<\/a> · <a href=\"https://youtu.be/9Z9IioxZGkk?t=6960\" target=\"_blank\" rel=\"noopener\">1:56:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/48/\" title=\"Ночь в музее\">#48<\/a><\/p><\/article><\/section>", "chars": {"Вампир Бек": {"name": "Вампирбек", "img": "img/chars/vampirbek.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%92%D0%B0%D0%BC%D0%BF%D0%B8%D1%80%D0%B1%D0%B5%D0%BA", "summary": "Вампирбе́к — вампир из клана Балан, рикша из города Кёнигпон.", "infobox": {"Пол": "Мужской", "Раса": "Вампир", "Тип": "Игровой", "Игрок": "Big Russian Boss"}, "actors": ["BRB (Big Russian Boss)"], "kind": "pc", "dead": true, "race": "Вампир", "portraits": [{"ep": "26", "thumb": "img/portraits/72dec7af01bdef1f.webp"}, {"ep": "23", "thumb": "img/portraits/04e2921226758e2a.webp"}, {"ep": "20", "thumb": "img/portraits/3a8ea11b15ebd411.webp"}, {"ep": "16", "thumb": "img/portraits/4f4a19de35cefce6.webp"}, {"ep": "12", "thumb": "img/portraits/a5133131b4fc25c5.webp"}], "url": "/c/vampir-bek/", "eps": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23",
