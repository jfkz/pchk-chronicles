<script>window.EPD = {"anim": false, "key": "18", "label": "18", "title": "Охота на младенца", "date": "2023-05-19", "minutes": 109, "duration": 6536.0, "video_id": "QuhF09e9E_E", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Столица королевства (Кёнигпон): дом Софии, МФЦ королевских прошений, площадь Солнца, солярий «Ясен Красен» и тайный храм Солнца", "short_html": "Головорезы контрабандиста <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> врываются в дом <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, но их спасают беглые служители культа Солнца — паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a>, ищущие Избранное чадо Лёшу. Пробившись через МФЦ (жрец сжигает очередь) к бывшему жрецу Загорию, герои через солярий «Ясен Красен» спускаются в тайный храм Солнца. Загорий оказывается демоном Манучаром, открывает портал для демонов <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> и похищает Лёшу. Кряхтун и София убивают демона и возвращают ребёнка, но храм осквернён.", "summary_html": "Контрабандист <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> мстит за сорванную поставку эльфийской соли: его головорезы врываются в дом <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> в столице. Их спасают паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> — беглые служители запрещённого в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> культа Солнца, которые по пророчеству ищут младенца Лёшу, избранного победить Лорда тьмы. Чтобы найти тайный столичный храм Солнца, герои пробиваются через МФЦ королевских прошений (жрец сжигает всю очередь) к бывшему жрецу Загорию, а затем через площадь Солнца и солярий «Ясен Красен» спускаются в храм. Загорий оказывается демоном Манучаром: он открывает портал из Геленбурга, демоны врываются в храм и он похищает Лёшу, но Кряхтун и София убивают демона и возвращают ребёнка. Храм осквернён.", "outcome_html": "Все герои выжили, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> спасён, Манучар убит. Столичный храм Солнца осквернён и больше не может укрыть ребёнка.", "world_html": ["Тайный храм Солнца в столице осквернён, бог Солнца не получает от него энергии", "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> через демона Манучара охотится за Лёшей", "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> объявил розыск <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>", "<a class=\"ref\" href=\"/c/paladin-krihta/\">Паладин Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> примкнули к семье Лёши"], "scenes": [{"t": "0:03:09", "sec": 189, "html": "Вступление: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> родила здорового ребёнка благодаря ритуалу (вып. 13); семья переехала в столицу, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> связался с контрабандистами, с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> ездил за эльфийской солью, гоблин <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> раскусил агента-гвардейца <a class=\"ref\" href=\"/c/cisgender/\">Цисгендия<\/a> (вып. 14). Юлиан вернулся один, пообещав заменить Лёше отца; груз не доставлен — <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> не прощает."}, {"t": "0:06:51", "sec": 411, "html": "Бедный дом в переулке столицы: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> вяжет носок, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> играет с Лёшей. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> бросил семью и «скорее всего погиб»; мать-паучиха уехала лечиться, боясь съесть внука."}, {"t": "0:09:41", "sec": 581, "html": "«Доставка для <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> Пенисова»: четверо головорезов <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> выбивают дверь — приказ убить. Юлиан с ребёнком на руках получает раны, у <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> критический провал — секира улетает в окно."}, {"t": "0:16:29", "sec": 989, "html": "В дом врываются паладин и жрец Солнца. Жрец бьёт «огненными ладонями» по всем (задевая <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>), пытается устроить молитву посреди боя. Юлиан насмерть бьёт двоих кулаками, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> стреляет камнем «из дробовика», жрец разбивает голову третьему булавой."}, {"t": "0:27:05", "sec": 1625, "html": "Паладин вызывает последнего головореза на дуэль, выдерживает удары и запугивает его — критический успех: тот закалывается собственным мечом."}, {"t": "0:30:26", "sec": 1826, "html": "Представление: паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> бежали из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> после осквернения храма Солнца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>; пророчество: род Пенисовых победит Лорда тьмы, Лёшу надо спрятать в тайном храме. Доктрина Солнца: уничтожать зло, защищать слабых, чтить торговые отношения и жертвовать храму. Задача — найти столичный храм Солнца; дорогу знает бывший жрец Загорий, работающий в МФЦ королевских прошений, окно №3."}, {"t": "0:39:14", "sec": 2354, "html": "МФЦ: у окна №4 полуэльф Дракес из микрокредитной организации «Дам Ванна» (?) навязывает кредит «2 монеты, вечером сами спишутся». Жрец безуспешно пытается играть в карты на деньги с посетителями. Талон Ж87 при табло Ж40."}, {"t": "0:46:21", "sec": 2781, "html": "Сотрудница МФЦ зовёт полуорка <a class=\"ref\" href=\"/c/klark/\">Кларка<\/a> — он торгует талонами без очереди. Паладин рубит табло — никто не помнит номеров, начинается «живая очередь». <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> на крюке-кошке влетает в защитное поле окна и получает 25 психического урона."}, {"t": "0:53:01", "sec": 3181, "html": "<a class=\"ref\" href=\"/c/klark/\">Кларк<\/a> за монету ведёт <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> к окну №3; жрец «святой зачисткой» сжигает огненными ладонями всю очередь (и подпаливает Софию), охранник сбегает от запугивания. В пепле находят монету. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> флиртует с сотрудницей Марго, пережившей огонь."}, {"t": "0:58:58", "sec": 3538, "html": "Загорий — дварф за защитным полем, радостно встречает «братьев». Признаётся, что изгнан из храма за пьянство и кражу пожертвований, просится с ними; храм спрятан под солярием «Ясен Красен» на площади Солнца. Загорий даёт монету; жрец тайком берёт микрокредит у Дракеса (2 монеты)."}, {"t": "1:06:43", "sec": 4003, "html": "Площадь Солнца: петушиные бои, наёмники <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> ходят с фотороботами <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Паладин пытается выпустить петухов, дерётся с торговцем кадилом, тот зовёт наёмников."}, {"t": "1:11:25", "sec": 4285, "html": "Жрец и паладин разыгрывают «изгнание беса» из паладина перед наёмниками и толпой; после переброса за монету — критический успех, наёмники выстраиваются под «божественный огонь» — жрец сжигает их. Из пепла — 2 монеты, с напуганной толпы собраны «пожертвования» (1 монета)."}, {"t": "1:20:24", "sec": 4824, "html": "Солярий «Ясен Красен»: знак Солнца открывает барельеф-лифт в храм. Лифт показывает «перегруз вины» — пройти можно лишь рядом с чистым существом. Выясняется, что Загорий пытался попасть вниз с помощью младенца; все кладут руки на Лёшу и спускаются."}, {"t": "1:27:56", "sec": 5276, "html": "В лифте списывается микрокредит — 3 монеты (с «комиссией за оформление»); паладин возмущён."}, {"t": "1:30:58", "sec": 5458, "html": "Подземный храм Солнца: жрецы ведут бухгалтерию, арка-портал в храм Солнца <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> «не работает». Жрецы узнают Загория — он считался мёртвым. Тот разбивает чёрный фиал: скверна растекается, портал вспыхивает зелёным, из него лезут демоны; их лидер: «Молодец, Манучар… <a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> ждёт, хватай ребёнка»."}, {"t": "1:33:33", "sec": 5613, "html": "Загорий сдирает кожу — это демон Манучар. В силовом состязании (несмотря на Ярость отца и все переброски за монеты) он вырывает Лёшу у <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и неторопливо идёт к порталу."}, {"t": "1:38:14", "sec": 5894, "html": "Паладин вызывает Манучара на дуэль и бьёт «Карой Света» (27 урона); демон когтями выжигает ему часть лица и хвостом ранит — у паладина 1 хит. Жрец бьёт булавой, смоченной святой водой."}, {"t": "1:44:01", "sec": 6241, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> «материнским инстинктом» пылающим серпом отрубает Манучару голову (дарит её Лёше как погремушку) и забирает ребёнка. Жрецы закрывают портал, демоны отступают."}, {"t": "1:46:54", "sec": 6414, "html": "Храм осквернён: бог Солнца больше не получает отсюда энергии — храм нужно очистить или уходить с младенцем в другое место. В хламе находят 5 монет — 50 000 руб. в фонд «Метафора»."}], "key_events": [{"t": "0:09:41", "sec": 581}, {"t": "0:16:29", "sec": 989}, {"t": "0:30:26", "sec": 1826}, {"t": "0:53:01", "sec": 3181}, {"t": "1:11:25", "sec": 4285}, {"t": "1:20:24", "sec": 4824}, {"t": "1:30:58", "sec": 5458}, {"t": "1:33:33", "sec": 5613}, {"t": "1:44:01", "sec": 6241}, {"t": "1:46:54", "sec": 6414}], "coins": {"ep": "18", "events": [{"t": "0:29:47", "kind": "earn", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "критический успех запугивания с преимуществом: гвардеец в ужасе сам заколол себя мечом, хотя Святостой к нему пальцем не притронулся", "result": "мастер выдал золотую монету", "sec": 1787, "who_url": "/c/svetostoy/", "reason_html": "критический успех запугивания с преимуществом: гвардеец в ужасе сам заколол себя мечом, хотя <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> к нему пальцем не притронулся"}, {"t": "0:48:45", "kind": "spend", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "заплатил монету полуорку Кларку за талончик (жетон), чтобы обойти очередь в МФЦ", "result": "получил талончик G-41", "sec": 2925, "who_url": "/c/svetostoy/", "reason_html": "заплатил монету полуорку <a class=\"ref\" href=\"/c/klark/\">Кларку<\/a> за талончик (жетон), чтобы обойти очередь в МФЦ"}, {"t": "0:52:56", "kind": "spend", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "отдал монету Кларку, чтобы тот помог найти жреца Загория", "result": "Кларк соглашается провести к окну №3", "sec": 3176, "who_url": "/c/svetostoy/", "reason_html": "отдал монету <a class=\"ref\" href=\"/c/klark/\">Кларку<\/a>, чтобы тот помог найти жреца Загория"}, {"t": "0:56:28", "kind": "other", "who": null, "actor": null, "to": null, "reason": "после того как Святостой сжёг очередь заживо, партия обыскала пепел сгоревших людей и нашла ту самую золотую монету, что ранее отдали орку", "result": "монета найдена и возвращена в общий запас", "sec": 3388, "who_url": null, "reason_html": "после того как <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> сжёг очередь заживо, партия обыскала пепел сгоревших людей и нашла ту самую золотую монету, что ранее отдали орку"}, {"t": "1:03:57", "kind": "other", "who": null, "actor": null, "to": null, "reason": "бывший жрец Загорий отдаёт партии свою последнюю золотую монету (билет в солярий на 10 использований), чтобы его взяли с собой", "result": "монета получена", "sec": 3837, "who_url": null, "reason_html": "бывший жрец Загорий отдаёт партии свою последнюю золотую монету (билет в солярий на 10 использований), чтобы его взяли с собой"}, {"t": "1:04:45", "kind": "other", "who": "Кряхтун", "actor": "Паль", "to": null, "reason": "партии не хватало денег на солярий, и Кряхтун (по чьим поддельным документам оформлен договор) берёт микрокредит у ростовщика Кларка на две золотые монеты", "result": "получили кредит в две монеты, надпись «поздравляем, вы получили кредит»", "sec": 3885, "who_url": "/c/paladin-krihta/", "reason_html": "партии не хватало денег на солярий, и <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> (по чьим поддельным документам оформлен договор) берёт микрокредит у ростовщика <a class=\"ref\" href=\"/c/klark/\">Кларка<\/a> на две золотые монеты"}, {"t": "1:16:40", "kind": "spend", "who": "Кряхтун", "actor": "Паль", "to": null, "reason": "потратил монету, чтобы перебросить проверку обмана (притворялся одержимым демоном перед охранниками)", "result": "критический успех, обман сработал", "sec": 4600, "who_url": "/c/paladin-krihta/", "reason_html": "потратил монету, чтобы перебросить проверку обмана (притворялся одержимым демоном перед охранниками)"}, {"t": "1:18:36", "kind": "earn", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "награда мастера за яркий отыгрыш и удачный бросок внимания (19) во время ритуала «сожжения неверных» в МФЦ", "result": "выдано две золотые монеты", "sec": 4716, "who_url": "/c/svetostoy/", "reason_html": "награда мастера за яркий отыгрыш и удачный бросок внимания (19) во время ритуала «сожжения неверных» в МФЦ"}, {"t": "1:19:50", "kind": "earn", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "успешное запугивание толпы на площади с требованием «пожертвований» — награда за отыгрыш святоши-вымогателя", "result": "выдана золотая монета (в самом ящике для пожертвований при этом остаются мелкие серебряные/медные монеты — это не мех. монета)", "sec": 4790, "who_url": "/c/svetostoy/", "reason_html": "успешное запугивание толпы на площади с требованием «пожертвований» — награда за отыгрыш святоши-вымогателя"}, {"t": "1:28:08", "kind": "spend", "who": "Кряхтун", "actor": "Паль", "to": null, "reason": "в лифте храма пришло время расплатиться по микрокредиту у ростовщика: 2 монеты долга + 1 монета комиссии за оформление", "result": "отдали три золотые монеты, несмотря на протесты по поводу нечестных условий", "sec": 5288, "who_url": "/c/paladin-krihta/", "reason_html": "в лифте храма пришло время расплатиться по микрокредиту у ростовщика: 2 монеты долга + 1 монета комиссии за оформление"}, {"t": "1:34:53", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "первая попытка перебросить спасбросок (с преимуществом от способности «Ярость отца»), чтобы не дать демону Манучару выхватить ребёнка", "result": "оба кубика с преимуществом мимо (11 и 12), ребёнка забирает Манучар", "sec": 5693, "who_url": "/c/yulian/", "reason_html": "первая попытка перебросить спасбросок (с преимуществом от способности «Ярость отца»), чтобы не дать демону Манучару выхватить ребёнка"}, {"t": "1:35:51", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "ещё две монеты подряд потрачены на новые переброски того же броска за ребёнка (мастер уточняет: «осталась последняя монета»)", "result": "тоже без толку, но игроки успокаивают себя, что ещё заработают", "sec": 5751, "who_url": "/c/yulian/", "reason_html": "ещё две монеты подряд потрачены на новые переброски того же броска за ребёнка (мастер уточняет: «осталась последняя монета»)"}, {"t": "1:45:31", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "потратил последнюю (уже четвёртую в этом бою) монету, чтобы перебросить урон 1к4 от подожжённого серпа и выбить число побольше", "result": "выпало 8, но не засчиталось — демоны не боятся огня, шутка о том, что монету потратили впустую", "sec": 6331, "who_url": "/c/yulian/", "reason_html": "потратил последнюю (уже четвёртую в этом бою) монету, чтобы перебросить урон 1к4 от подожжённого серпа и выбить число побольше"}, {"t": "1:47:52", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальная награда мастера всей партии за успешное завершение приключения", "result": "выдано пять золотых монет, все решили отправить их в благотворительный фонд «Мета» (50 000 руб. по курсу 10 000 руб./монета)", "sec": 6472, "who_url": null, "reason_html": "финальная награда мастера всей партии за успешное завершение приключения"}], "totals": [{"who": "София", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sofiya.webp", "who_url": "/c/sofiya/", "actor_url": "/p/brb/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 0, "spent": 4, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Кряхтун", "actor": "Паль", "earned": 2, "spent": 4, "img": "img/chars/kryahtun.webp", "who_url": "/c/paladin-krihta/", "actor_url": "/p/aleksandr-pal/"}, {"who": "Святостой", "actor": "Лапенко", "earned": 4, "spent": 2, "img": "img/chars/svyatostoj.webp", "who_url": "/c/svetostoy/", "actor_url": "/p/lapenko/"}], "notes": "В этом выпуске игровая монета и внутриигровое золото буквально одна и та же валюта (мастер прямо это оговаривает), поэтому почти все находки и траты золота в мире (кредит у ростовщика, взятки, пожертвования) реально списываются/начисляются как игровые монеты — исключение сделано только для мелких серебряных/медных монет из ящика для пожертвований. Финальные 5 монет партия не оставила себе, а пожертвовала в благотворительный фонд."}, "cast": [{"name": "София", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, дочь семьи каннибалов, магия наделения силой", "role": "", "fate": "выжила", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ё
