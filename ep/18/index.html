<script>window.EPD = {"anim": false, "key": "18", "label": "18", "title": "Охота на младенца", "date": "2023-05-19", "minutes": 109, "duration": 6536.0, "video_id": "QuhF09e9E_E", "branch": "Эрик, София и Лёша", "branch_color": "#2F84C8", "place": "Столица королевства (Кёнигпон): дом Софии, МФЦ королевских прошений, площадь Солнца, солярий «Ясен Красен» и тайный храм Солнца", "short_html": "Служители культа Солнца спасают <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> от головорезов <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и ищут Избранное чадо Лёшу.", "summary_html": "Контрабандист <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> мстит за сорванную поставку эльфийской соли: его головорезы врываются в дом <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> в столице. Их спасают паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> — беглые служители запрещённого в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> культа Солнца, которые по пророчеству ищут младенца Лёшу, избранного победить Лорда тьмы. Чтобы найти тайный столичный храм Солнца, герои пробиваются через МФЦ королевских прошений (жрец сжигает всю очередь) к бывшему жрецу Загорию, а затем через площадь Солнца и солярий «Ясен Красен» спускаются в храм. Загорий оказывается демоном Манучаром: он открывает портал из Геленбурга, демоны врываются в храм и он похищает Лёшу, но Кряхтун и София убивают демона и возвращают ребёнка. Храм осквернён.", "outcome_html": "Все герои выжили, <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> спасён, Манучар убит. Столичный храм Солнца осквернён и больше не может укрыть ребёнка.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Путь в храм был не напрасен\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Путь в храм был не напрасен<\/b> Герои получили в осквернённом храме временное убежище от наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и узнали, что за ними охотятся ещё и демонические силы, от которых храм пока не защищает. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4070\" target=\"_blank\" rel=\"noopener\">1:07:50 ↗<\/a> · <a href=\"#qa18-23\">к записи<\/a><\/span><\/span>", "world_html": ["Тайный храм Солнца в столице осквернён, бог Солнца не получает от него энергии<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как очистить храм Солнца: механики пока нет\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как очистить храм Солнца: механики пока нет<\/b> Конкретной механики очищения нет: вероятно, понадобятся тяжёлые ритуалы и молитвы богу Солнца, чтобы вернуть связь с божественной энергией. Домен бога Солнца и космология мира пока не утверждены. Очистить именно этот храм, скорее всего, несложно: его осквернил лишь один фиал, создавший временную связь с осквернённым <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, где находятся демоны и войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4152\" target=\"_blank\" rel=\"noopener\">1:09:12 ↗<\/a> · <a href=\"#qa18-24\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> через демона Манучара охотится за Лёшей<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Путь в храм был не напрасен\">12<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Путь в храм был не напрасен<\/b> Герои получили в осквернённом храме временное убежище от наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и узнали, что за ними охотятся ещё и демонические силы, от которых храм пока не защищает. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4070\" target=\"_blank\" rel=\"noopener\">1:07:50 ↗<\/a> · <a href=\"#qa18-23\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> объявил розыск <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Янус — лидер гильдии контрабандистов, может носить любую личину\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Янус — лидер гильдии контрабандистов, может носить любую личину<\/b> Господин <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> всегда действует чужими руками; найти его или добиться встречи — отдельный квест. Он лидер гильдии контрабандистов (аналог гильдии воров) и может скрываться под любой личиной — даже быть одним из игроков. Если бы героям не удалось скрыться в храме Солнца, он предстал бы перед ними в одном из следующих выпусков. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3415\" target=\"_blank\" rel=\"noopener\">0:56:55 ↗<\/a> · <a href=\"#qa18-17\">к записи<\/a><\/span><\/span>", "<a class=\"ref\" href=\"/c/paladin-krihta/\">Паладин Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> примкнули к семье Лёши"], "scenes": [{"t": "0:03:09", "sec": 189, "html": "Вступление: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> родила здорового ребёнка благодаря ритуалу (вып. 13); семья переехала в столицу, <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> связался с контрабандистами, с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> ездил за эльфийской солью, гоблин <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> раскусил агента-гвардейца <a class=\"ref\" href=\"/c/cisgender/\">Цисгендия<\/a> (вып. 14). Юлиан вернулся один, пообещав заменить Лёше отца; груз не доставлен — <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> не прощает."}, {"t": "0:06:51", "sec": 411, "html": "Бедный дом в переулке столицы: <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> вяжет носок, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> играет с Лёшей. <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> бросил семью и «скорее всего погиб»; мать-паучиха уехала лечиться, боясь съесть внука.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Судьбу Эрика Пэнисова отдали Гудкову и BRB\">19<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Судьбу Эрика Пэнисова отдали Гудкову и BRB<\/b> Судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> висела с <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, его последнего появления. Его хотели вернуть в <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, но <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> не приехал на съёмку. Авторы решили, что судьбу Эрика должны решить два игрока, которые были с ним с первого приключения: персонаж <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был заинтересован, чтобы Эрик выжил, персонаж <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> — чтобы погиб. Показывать это в игре, а не объявлять гибель за кадром, решили сознательно. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3827\" target=\"_blank\" rel=\"noopener\">1:03:47 ↗<\/a> · <a href=\"#qa35-6\">к записи<\/a><\/span><\/span>"}, {"t": "0:09:41", "sec": 581, "html": "«Доставка для <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> Пэнисова»: четверо головорезов <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> выбивают дверь — приказ убить. Юлиан с ребёнком на руках получает раны, у <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> критический провал — секира улетает в окно.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Юлиан Пэнисов» — ошибка головореза, а не мастера\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Юлиан Пэнисов» — ошибка головореза, а не мастера<\/b> Головорезы <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> назвали <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> Пэнисовым, потому что контрабандисты знали фамилию <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и сочли Юлиана его братом. Это не опечатка: так думает персонаж, не обладающий всей информацией. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3070\" target=\"_blank\" rel=\"noopener\">0:51:10 ↗<\/a> · <a href=\"#qa18-14\">к записи<\/a><\/span><\/span>"}, {"t": "0:16:29", "sec": 989, "html": "В дом врываются паладин и жрец Солнца. Жрец бьёт «огненными ладонями» по всем (задевая <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>), пытается устроить молитву посреди боя. Юлиан насмерть бьёт двоих кулаками, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> стреляет камнем «из дробовика», жрец разбивает голову третьему булавой."}, {"t": "0:27:05", "sec": 1625, "html": "Паладин вызывает последнего головореза на дуэль, выдерживает удары и запугивает его — критический успех: тот закалывается собственным мечом."}, {"t": "0:30:26", "sec": 1826, "html": "Представление: паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> бежали из <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> после осквернения храма Солнца <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>; пророчество: род Пэнисовых победит Лорда тьмы, Лёшу надо спрятать в тайном храме. Доктрина Солнца: уничтожать зло, защищать слабых, чтить торговые отношения и жертвовать храму. Задача — найти столичный храм Солнца; дорогу знает бывший жрец Загорий, работающий в МФЦ королевских прошений, окно №3.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Легенда храма Солнца: государственная религия Геленбурга\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Легенда храма Солнца: государственная религия Геленбурга<\/b> Поклонение богу Солнца было государственной религией южных земель — <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> («Город Солнца», от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>). <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> отрёкся от этой религии, присягнул тёмным силам, и все храмы Солнца в Геленбурге были осквернены. Столичный храм на площади Солнца в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a> — филиал, который ради маскировки убрал упоминание Солнца и назвался солярием «Ясен Красен»; возможно, есть и другие тайные ячейки. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3188\" target=\"_blank\" rel=\"noopener\">0:53:08 ↗<\/a> · <a href=\"#qa18-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span>"}, {"t": "0:39:14", "sec": 2354, "html": "МФЦ: у окна №4 полуэльф Дракис из микрокредитной организации «Дам Ванна» (?) навязывает кредит «2 монеты, вечером сами спишутся». Жрец безуспешно пытается играть в карты на деньги с посетителями. Талон Ж87 при табло Ж40.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Трансакцио усыпили клофелинщицы, у него был пропуск наверх\">18<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Трансакцио усыпили клофелинщицы, у него был пропуск наверх<\/b> Трансакцио — владелец кредитной организации «Дам вам нал» (из вып. 18). Его не было на собрании: в номер 2 сначала стучались <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, и там был слышен лишь шорох. На самом деле клофелинщицы усыпили его, а у него можно было взять пропуск на третий этаж. <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4823\" target=\"_blank\" rel=\"noopener\">1:20:23 ↗<\/a> · <a href=\"#qa29-24\">к записи<\/a><\/span><\/span>"}, {"t": "0:46:21", "sec": 2781, "html": "Сотрудница МФЦ зовёт полуорка <a class=\"ref\" href=\"/c/klark/\">Кларка<\/a> — он торгует талонами без очереди. Паладин рубит табло — никто не помнит номеров, начинается «живая очередь». <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> на крюке-кошке влетает в защитное поле окна и получает 25 психического урона.<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Чёрный ход в МФЦ с контрабандистами\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Чёрный ход в МФЦ с контрабандистами<\/b> В МФЦ королевских прошений был альтернативный путь: обойти охранника и через чёрный ход попасть к окну <a class=\"ref\" href=\"/c/zagoriy-manuchar/\">Загория<\/a> без магического барьера. У чёрного входа находились контрабандисты, подменявшие питьевую воду в МФЦ, — с ними был бы довольно лёгкий бой. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3043\" target=\"_blank\" rel=\"noopener\">0:50:43 ↗<\/a> · <a href=\"#qa18-13\">к записи<\/a><\/span><\/span>"}, {"t": "0:53:01", "sec": 3181, "html": "<a class=\"ref\" href=\"/c/klark/\">Кларк<\/a> за монету ведёт <a class=\"ref\" href=\"/c/sofiya/\">Софию<\/a> к окну №3; жрец «святой зачисткой» сжигает огненными ладонями всю очередь (и подпаливает Софию), охранник сбегает от запугивания. В пепле находят монету. <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> флиртует с сотрудницей Марго, пережившей огонь.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Мастер о флирте NPC: персонажи — функции\">14<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Мастер о флирте NPC: персонажи — функции<\/b> Мастер, играющий 23 года, объяснил, что не ассоциирует себя с NPC: флирт <a class=\"ref\" href=\"/c/margo/\">Марго<\/a> с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> — функция, подсвечивающая героев и их взаимодействие с миром, естественная реакция на броски харизмы. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4521\" target=\"_blank\" rel=\"noopener\">1:15:21 ↗<\/a> · <a href=\"#qa18-25\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Святостой отыграл фанатика — и церковь признала грех\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Святостой отыграл фанатика — и церковь признала грех<\/b> Авторы признались, что не ожидали от <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> сжигания людей: персонаж по лору должен служить добру. Его поведение объяснили фанатизмом ради святой цели и желанием новичка «пощупать пределы»; при этом сама церковь засвидетельствовала у него «перегруз вины» — а грехи в этой религии очищаются деньгами. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4661\" target=\"_blank\" rel=\"noopener\">1:17:41 ↗<\/a> · <a href=\"#qa18-26\">к записи<\/a><\/span><\/span>"}, {"t": "0:58:58", "sec": 3538, "html": "Загорий — дварф за защитным полем, радостно встречает «братьев». Признаётся, что изгнан из храма за пьянство и кражу пожертвований, просится с ними; храм спрятан под солярием «Ясен Красен» на площади Солнца. Загорий даёт монету; жрец тайком берёт микрокредит у Дракиса (2 монеты)."}, {"t": "1:06:43", "sec": 4003, "html": "Площадь Солнца: петушиные бои, наёмники <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> ходят с фотороботами <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>. Паладин пытается выпустить петухов, дерётся с торговцем кадилом, тот зовёт наёмников."}, {"t": "1:11:25", "sec": 4285, "html": "Жрец и паладин разыгрывают «изгнание беса» из паладина перед наёмниками и толпой; после переброса за монету — критический успех, наёмники выстраиваются под «божественный огонь» — жрец сжигает их. Из пепла — 2 монеты, с напуганной толпы собраны «пожертвования» (1 монета).<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Тифлинг среди сожжённых наёмников остался на иллюстрации\">9<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Тифлинг среди сожжённых наёмников остался на иллюстрации<\/b> Художники нарисовали среди контрабандистов на площади тифлинга; так как у тифлингов сопротивление огню и он мог выжить после огненных ладоней, его попросили заменить на полуорчиху, но в монтаже тифлинг, похоже, остался. «Демон в одежде» у сауны — тоже тифлинг, мирная раса, а не демон или бес. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3587\" target=\"_blank\" rel=\"noopener\">0:59:47 ↗<\/a> · <a href=\"#qa18-20\">к записи<\/a><\/span><\/span>"}, {"t": "1:20:24", "sec": 4824, "html": "Солярий «Ясен Красен»: знак Солнца открывает барельеф-лифт в храм. Лифт показывает «перегруз вины» — пройти можно лишь рядом с чистым существом. Выясняется, что Загорий пытался попасть вниз с помощью младенца; все кладут руки на Лёшу и спускаются.<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Легенда храма Солнца: государственная религия Геленбурга\">5<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Легенда храма Солнца: государственная религия Геленбурга<\/b> Поклонение богу Солнца было государственной религией южных земель — <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> («Город Солнца», от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>). <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> отрёкся от этой религии, присягнул тёмным силам, и все храмы Солнца в Геленбурге были осквернены. Столичный храм на площади Солнца в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a> — филиал, который ради маскировки убрал упоминание Солнца и назвался солярием «Ясен Красен»; возможно, есть и другие тайные ячейки. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3188\" target=\"_blank\" rel=\"noopener\">0:53:08 ↗<\/a> · <a href=\"#qa18-16\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Тифлинг среди сожжённых наёмников остался на иллюстрации\">9<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Тифлинг среди сожжённых наёмников остался на иллюстрации<\/b> Художники нарисовали среди контрабандистов на площади тифлинга; так как у тифлингов сопротивление огню и он мог выжить после огненных ладоней, его попросили заменить на полуорчиху, но в монтаже тифлинг, похоже, остался. «Демон в одежде» у сауны — тоже тифлинг, мирная раса, а не демон или бес. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3587\" target=\"_blank\" rel=\"noopener\">0:59:47 ↗<\/a> · <a href=\"#qa18-20\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лифт «перегруз вины» — задуманная головоломка-последствие\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лифт «перегруз вины» — задуманная головоломка-последствие<\/b> Лифт в храм был заложен как головоломка: чем больше плохих поступков совершит группа (а жрец и паладин могли их останавливать или совершать), тем труднее спуститься. Это и было последствием убийств в МФЦ и на площади; авторы не ожидали, что <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> начнёт сжигать людей. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3973\" target=\"_blank\" rel=\"noopener\">1:06:13 ↗<\/a> · <a href=\"#qa18-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Святостой отыграл фанатика — и церковь признала грех\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Святостой отыграл фанатика — и церковь признала грех<\/b> Авторы признались, что не ожидали от <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> сжигания людей: персонаж по лору должен служить добру. Его поведение объяснили фанатизмом ради святой цели и желанием новичка «пощупать пределы»; при этом сама церковь засвидетельствовала у него «перегруз вины» — а грехи в этой религии очищаются деньгами. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4661\" target=\"_blank\" rel=\"noopener\">1:17:41 ↗<\/a> · <a href=\"#qa18-26\">к записи<\/a><\/span><\/span>"}, {"t": "1:27:56", "sec": 5276, "html": "В лифте списывается микрокредит — 3 монеты (с «комиссией за оформление»); паладин возмущён."}, {"t": "1:30:58", "sec": 5458, "html": "Подземный храм Солнца: жрецы ведут бухгалтерию, арка-портал в храм Солнца <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> «не работает». Жрецы узнают Загория — он считался мёртвым. Тот разбивает чёрный фиал: скверна растекается, портал вспыхивает зелёным, из него лезут демоны; их лидер: «Молодец, Манучар… <a class=\"ref\" href=\"/c/lord-vlaston/\">Лорд Властон<\/a> ждёт, хватай ребёнка».<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: Художники преувеличили число демонов и гиганта в портале\">8<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>Художники преувеличили число демонов и гиганта в портале<\/b> На вопрос о многочисленных демонах и гиганте в портале авторы ответили, что художники «чуть-чуть усилили» картину, чтобы демоны выглядели страшно. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3498\" target=\"_blank\" rel=\"noopener\">0:58:18 ↗<\/a> · <a href=\"#qa18-19\">к записи<\/a><\/span><\/span>"}, {"t": "1:33:33", "sec": 5613, "html": "Загорий сдирает кожу — это демон Манучар. В силовом состязании (несмотря на Ярость отца и все переброски за монеты) он вырывает Лёшу у <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> и неторопливо идёт к порталу."}, {"t": "1:38:14", "sec": 5894, "html": "Паладин вызывает Манучара на дуэль и бьёт «Карой Света» (27 урона); демон когтями выжигает ему часть лица и хвостом ранит — у паладина 1 хит. Жрец бьёт булавой, смоченной святой водой.<button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: Ожог Кряхтуна из выпуска 18 убрали: паладин выздоровел\">16<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>Ожог Кряхтуна из выпуска 18 убрали: паладин выздоровел<\/b> Шрам от ожога из выпуска <a href=\"/ep/18/\" title=\"Охота на младенца\">18<\/a> художники рисовали, но выходило некрасиво даже в уменьшенном варианте. Авторы решили, что паладин света должен иметь идеальный образ, и постановили, что <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> вылечился. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6651\" target=\"_blank\" rel=\"noopener\">1:50:51 ↗<\/a> · <a href=\"#qa22-25\">к записи<\/a><\/span><\/span>"}, {"t": "1:44:01", "sec": 6241, "html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a> «материнским инстинктом» пылающим серпом отрубает Манучару голову (дарит её Лёше как погремушку) и забирает ребёнка. Жрецы закрывают портал, демоны отступают.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему демоны отступили после смерти Манучара\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему демоны отступили после смерти Манучара<\/b> Силы жрецов и демонов в храме были равны; именно <a class=\"ref\" href=\"/c/zagoriy-manuchar/\">Манучар<\/a> увеличивал число демонов и усиливал их. Авторы решили, что если герои его победят, воодушевлённые жрецы загонят бесов обратно в портал — «лёгкая ничья», а не победа жрецов; разыгрывать бой NPC с NPC сочли плохой практикой. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3669\" target=\"_blank\" rel=\"noopener\">1:01:09 ↗<\/a> · <a href=\"#qa18-21\">к записи<\/a><\/span><\/span>"}, {"t": "1:46:54", "sec": 6414, "html": "Храм осквернён: бог Солнца больше не получает отсюда энергии — храм нужно очистить или уходить с младенцем в другое место. В хламе находят 5 монет — 50 000 руб. в фонд «Метафора».<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Как очистить храм Солнца: механики пока нет\">13<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Как очистить храм Солнца: механики пока нет<\/b> Конкретной механики очищения нет: вероятно, понадобятся тяжёлые ритуалы и молитвы богу Солнца, чтобы вернуть связь с божественной энергией. Домен бога Солнца и космология мира пока не утверждены. Очистить именно этот храм, скорее всего, несложно: его осквернил лишь один фиал, создавший временную связь с осквернённым <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, где находятся демоны и войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4152\" target=\"_blank\" rel=\"noopener\">1:09:12 ↗<\/a> · <a href=\"#qa18-24\">к записи<\/a><\/span><\/span>"}], "key_events": [{"t": "0:09:41", "sec": 581}, {"t": "0:16:29", "sec": 989}, {"t": "0:30:26", "sec": 1826}, {"t": "0:53:01", "sec": 3181}, {"t": "1:11:25", "sec": 4285}, {"t": "1:20:24", "sec": 4824}, {"t": "1:30:58", "sec": 5458}, {"t": "1:33:33", "sec": 5613}, {"t": "1:44:01", "sec": 6241}, {"t": "1:46:54", "sec": 6414}], "coins": {"ep": "18", "events": [{"t": "0:29:47", "kind": "earn", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "критический успех запугивания с преимуществом: гвардеец в ужасе сам заколол себя мечом, хотя Святостой к нему пальцем не притронулся", "result": "мастер выдал золотую монету", "sec": 1787, "who_url": "/c/svetostoy/", "reason_html": "критический успех запугивания с преимуществом: гвардеец в ужасе сам заколол себя мечом, хотя <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> к нему пальцем не притронулся"}, {"t": "0:48:45", "kind": "spend", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "заплатил монету полуорку Кларку за талончик (жетон), чтобы обойти очередь в МФЦ", "result": "получил талончик G-41", "sec": 2925, "who_url": "/c/svetostoy/", "reason_html": "заплатил монету полуорку <a class=\"ref\" href=\"/c/klark/\">Кларку<\/a> за талончик (жетон), чтобы обойти очередь в МФЦ"}, {"t": "0:52:56", "kind": "spend", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "отдал монету Кларку, чтобы тот помог найти жреца Загория", "result": "Кларк соглашается провести к окну №3", "sec": 3176, "who_url": "/c/svetostoy/", "reason_html": "отдал монету <a class=\"ref\" href=\"/c/klark/\">Кларку<\/a>, чтобы тот помог найти жреца Загория"}, {"t": "0:56:28", "kind": "other", "who": null, "actor": null, "to": null, "reason": "после того как Святостой сжёг очередь заживо, партия обыскала пепел сгоревших людей и нашла ту самую золотую монету, что ранее отдали орку", "result": "монета найдена и возвращена в общий запас", "sec": 3388, "who_url": null, "reason_html": "после того как <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> сжёг очередь заживо, партия обыскала пепел сгоревших людей и нашла ту самую золотую монету, что ранее отдали орку"}, {"t": "1:03:57", "kind": "other", "who": null, "actor": null, "to": null, "reason": "бывший жрец Загорий отдаёт партии свою последнюю золотую монету (билет в солярий на 10 использований), чтобы его взяли с собой", "result": "монета получена", "sec": 3837, "who_url": null, "reason_html": "бывший жрец Загорий отдаёт партии свою последнюю золотую монету (билет в солярий на 10 использований), чтобы его взяли с собой"}, {"t": "1:04:45", "kind": "other", "who": "Кряхтун", "actor": "Паль", "to": null, "reason": "партии не хватало денег на солярий, и Кряхтун (по чьим поддельным документам оформлен договор) берёт микрокредит у ростовщика Кларка на две золотые монеты", "result": "получили кредит в две монеты, надпись «поздравляем, вы получили кредит»", "sec": 3885, "who_url": "/c/paladin-krihta/", "reason_html": "партии не хватало денег на солярий, и <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> (по чьим поддельным документам оформлен договор) берёт микрокредит у ростовщика <a class=\"ref\" href=\"/c/klark/\">Кларка<\/a> на две золотые монеты"}, {"t": "1:16:40", "kind": "spend", "who": "Кряхтун", "actor": "Паль", "to": null, "reason": "потратил монету, чтобы перебросить проверку обмана (притворялся одержимым демоном перед охранниками)", "result": "критический успех, обман сработал", "sec": 4600, "who_url": "/c/paladin-krihta/", "reason_html": "потратил монету, чтобы перебросить проверку обмана (притворялся одержимым демоном перед охранниками)"}, {"t": "1:18:36", "kind": "earn", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "награда мастера за яркий отыгрыш и удачный бросок внимания (19) во время ритуала «сожжения неверных» в МФЦ", "result": "выдано две золотые монеты", "sec": 4716, "who_url": "/c/svetostoy/", "reason_html": "награда мастера за яркий отыгрыш и удачный бросок внимания (19) во время ритуала «сожжения неверных» в МФЦ"}, {"t": "1:19:50", "kind": "earn", "who": "Святостой", "actor": "Лапенко", "to": null, "reason": "успешное запугивание толпы на площади с требованием «пожертвований» — награда за отыгрыш святоши-вымогателя", "result": "выдана золотая монета (в самом ящике для пожертвований при этом остаются мелкие серебряные/медные монеты — это не мех. монета)", "sec": 4790, "who_url": "/c/svetostoy/", "reason_html": "успешное запугивание толпы на площади с требованием «пожертвований» — награда за отыгрыш святоши-вымогателя"}, {"t": "1:28:08", "kind": "spend", "who": "Кряхтун", "actor": "Паль", "to": null, "reason": "в лифте храма пришло время расплатиться по микрокредиту у ростовщика: 2 монеты долга + 1 монета комиссии за оформление", "result": "отдали три золотые монеты, несмотря на протесты по поводу нечестных условий", "sec": 5288, "who_url": "/c/paladin-krihta/", "reason_html": "в лифте храма пришло время расплатиться по микрокредиту у ростовщика: 2 монеты долга + 1 монета комиссии за оформление"}, {"t": "1:34:53", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "первая попытка перебросить спасбросок (с преимуществом от способности «Ярость отца»), чтобы не дать демону Манучару выхватить ребёнка", "result": "оба кубика с преимуществом мимо (11 и 12), ребёнка забирает Манучар", "sec": 5693, "who_url": "/c/yulian/", "reason_html": "первая попытка перебросить спасбросок (с преимуществом от способности «Ярость отца»), чтобы не дать демону Манучару выхватить ребёнка"}, {"t": "1:35:51", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "ещё две монеты подряд потрачены на новые переброски того же броска за ребёнка (мастер уточняет: «осталась последняя монета»)", "result": "тоже без толку, но игроки успокаивают себя, что ещё заработают", "sec": 5751, "who_url": "/c/yulian/", "reason_html": "ещё две монеты подряд потрачены на новые переброски того же броска за ребёнка (мастер уточняет: «осталась последняя монета»)"}, {"t": "1:45:31", "kind": "spend", "who": "Юлиан", "actor": "Гудков", "to": null, "reason": "потратил последнюю (уже четвёртую в этом бою) монету, чтобы перебросить урон 1к4 от подожжённого серпа и выбить число побольше", "result": "выпало 8, но не засчиталось — демоны не боятся огня, шутка о том, что монету потратили впустую", "sec": 6331, "who_url": "/c/yulian/", "reason_html": "потратил последнюю (уже четвёртую в этом бою) монету, чтобы перебросить урон 1к4 от подожжённого серпа и выбить число побольше"}, {"t": "1:47:52", "kind": "other", "who": null, "actor": null, "to": null, "reason": "финальная награда мастера всей партии за успешное завершение приключения", "result": "выдано пять золотых монет, все решили отправить их в благотворительный фонд «Мета» (50 000 руб. по курсу 10 000 руб./монета)", "sec": 6472, "who_url": null, "reason_html": "финальная награда мастера всей партии за успешное завершение приключения"}], "totals": [{"who": "София", "actor": "BRB", "earned": 0, "spent": 0, "img": "img/chars/sofiya.webp", "who_url": "/c/sofiya/", "actor_url": "/p/brb/"}, {"who": "Юлиан", "actor": "Гудков", "earned": 0, "spent": 4, "img": "img/chars/yulian.webp", "who_url": "/c/yulian/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Кряхтун", "actor": "Паль", "earned": 2, "spent": 4, "img": "img/chars/kryahtun.webp", "who_url": "/c/paladin-krihta/", "actor_url": "/p/aleksandr-pal/"}, {"who": "Святостой", "actor": "Лапенко", "earned": 4, "spent": 2, "img": "img/chars/svyatostoj.webp", "who_url": "/c/svetostoy/", "actor_url": "/p/lapenko/"}], "notes": "В этом выпуске игровая монета и внутриигровое золото буквально одна и та же валюта (мастер прямо это оговаривает), поэтому почти все находки и траты золота в мире (кредит у ростовщика, взятки, пожертвования) реально списываются/начисляются как игровые монеты — исключение сделано только для мелких серебряных/медных монет из ящика для пожертвований. Финальные 5 монет партия не оставила себе, а пожертвовала в благотворительный фонд."}, "cast": [{"name": "София", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, дочь семьи каннибалов, магия наделения силой", "role": "", "fate": "выжила", "id": "София", "url": "/c/sofiya/", "img": "img/chars/sofiya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Фамилия семьи каннибалов — Лектор\">4<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Фамилия семьи каннибалов — Лектор<\/b> Ответили, что у каннибалов фамилия Лектор (при аль", "actor_url": "/p/aleksandr-pal/", "race": "человек, светлый паладин бога Солнца", "role": "", "fate": "выжил (тяжело ранен)", "id": "Крихта", "url": "/c/paladin-krihta/", "img": "img/chars/kryahtun.webp", "other": [{"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "30", "label": "30", "title": "Ультиматум Сфинктериона"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка"}, {"key": "37", "label": "37", "title": "Добровольцы"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гостей-актёров брифуют относиться к персонажу как к прожитой жизни\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гостей-актёров брифуют относиться к персонажу как к прожитой жизни<\/b> Авторы рассказали, что Паля и <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> на брифинге просили не относиться к персонажам легкомысленно и представить, что <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> жили до этого десятки лет и их жизнь продолжится после выпуска. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2110\" target=\"_blank\" rel=\"noopener\">0:35:10 ↗<\/a> · <a href=\"#qa18-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-retcon\" aria-expanded=\"false\" title=\"Реткон: Ожог Кряхтуна из выпуска 18 убрали: паладин выздоровел\">16<\/button><span class=\"fnb t-retcon\" hidden><span class=\"ptype\">Реткон<\/span> <b>Ожог Кряхтуна из выпуска 18 убрали: паладин выздоровел<\/b> Шрам от ожога из выпуска <a href=\"/ep/18/\" title=\"Охота на младенца\">18<\/a> художники рисовали, но выходило некрасиво даже в уменьшенном варианте. Авторы решили, что паладин света должен иметь идеальный образ, и постановили, что <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> вылечился. <span class=\"note\">Подкаст по #22 · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6651\" target=\"_blank\" rel=\"noopener\">1:50:51 ↗<\/a> · <a href=\"#qa22-25\">к записи<\/a><\/span><\/span>"}, {"name": "Святостой", "actor": "Лапенко", "actor_url": "/p/lapenko/", "race": "человек, светлый жрец бога Солнца", "role": "", "fate": "выжил", "id": "Святостой", "url": "/c/svetostoy/", "img": "img/chars/svyatostoj.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Гостей-актёров брифуют относиться к персонажу как к прожитой жизни\">1<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Гостей-актёров брифуют относиться к персонажу как к прожитой жизни<\/b> Авторы рассказали, что Паля и <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> на брифинге просили не относиться к персонажам легкомысленно и представить, что <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> жили до этого десятки лет и их жизнь продолжится после выпуска. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2110\" target=\"_blank\" rel=\"noopener\">0:35:10 ↗<\/a> · <a href=\"#qa18-5\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Лифт «перегруз вины» — задуманная головоломка-последствие\">11<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Лифт «перегруз вины» — задуманная головоломка-последствие<\/b> Лифт в храм был заложен как головоломка: чем больше плохих поступков совершит группа (а жрец и паладин могли их останавливать или совершать), тем труднее спуститься. Это и было последствием убийств в МФЦ и на площади; авторы не ожидали, что <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> начнёт сжигать людей. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3973\" target=\"_blank\" rel=\"noopener\">1:06:13 ↗<\/a> · <a href=\"#qa18-22\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Святостой отыграл фанатика — и церковь признала грех\">15<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Святостой отыграл фанатика — и церковь признала грех<\/b> Авторы признались, что не ожидали от <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> сжигания людей: персонаж по лору должен служить добру. Его поведение объяснили фанатизмом ради святой цели и желанием новичка «пощупать пределы»; при этом сама церковь засвидетельствовала у него «перегруз вины» — а грехи в этой религии очищаются деньгами. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4661\" target=\"_blank\" rel=\"noopener\">1:17:41 ↗<\/a> · <a href=\"#qa18-26\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Лёша", "actor": "", "actor_url": null, "race": "", "role": "младенец, Избранное чадо по пророчеству Солнца", "fate": "похищен и спасён", "id": "Лёша", "url": "/c/lyosha/", "img": "img/chars/lyosha-penisov.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ"}, {"key": "53", "label": "53", "title": "В поисках Лёши"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span>"}, {"name": "Янус", "actor": "", "actor_url": null, "race": "", "role": "могущественный контрабандист, объявил охоту на семью", "fate": "упоминается", "id": "Янус", "url": "/c/yanus/", "img": "img/chars/dododis.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на короля"}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\""}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу"}, {"key": "43", "label": "43", "title": "Груз Кристиночки"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Янус — лидер гильдии контрабандистов, может носить любую личину\">6<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Янус — лидер гильдии контрабандистов, может носить любую личину<\/b> Господин <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> всегда действует чужими руками; найти его или добиться встречи — отдельный квест. Он лидер гильдии контрабандистов (аналог гильдии воров) и может скрываться под любой личиной — даже быть одним из игроков. Если бы героям не удалось скрыться в храме Солнца, он предстал бы перед ними в одном из следующих выпусков. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3415\" target=\"_blank\" rel=\"noopener\">0:56:55 ↗<\/a> · <a href=\"#qa18-17\">к записи<\/a><\/span><\/span>"}, {"name": "Головорезы Януса", "actor": "", "actor_url": null, "race": "", "role": "убийцы, посланные в дом Софии", "fate": "погибли", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: «Юлиан Пэнисов» — ошибка головореза, а не мастера\">3<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>«Юлиан Пэнисов» — ошибка головореза, а не мастера<\/b> Головорезы <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> назвали <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> Пэнисовым, потому что контрабандисты знали фамилию <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и сочли Юлиана его братом. Это не опечатка: так думает персонаж, не обладающий всей информацией. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3070\" target=\"_blank\" rel=\"noopener\">0:51:10 ↗<\/a> · <a href=\"#qa18-14\">к записи<\/a><\/span><\/span>"}, {"name": "Дракис", "actor": "", "actor_url": null, "race": "", "role": "полуэльф-микрокредитор («Дам Ванна»)", "fate": "выжил", "id": null, "url": null, "img": null, "other": []}, {"name": "Кларк", "actor": "", "actor_url": null, "race": "", "role": "полуорк, торговец талонами в МФЦ", "fate": "выжил", "id": "Кларк", "url": "/c/klark/", "img": "img/chars/klark.webp", "other": []}, {"name": "Марго", "actor": "", "actor_url": null, "race": "", "role": "сотрудница МФЦ, пассия Юлиана", "fate": "выжила", "id": "Марго", "url": "/c/margo/", "img": "img/chars/margo.webp", "other": [{"key": "40", "label": "40", "title": "Паспорт хорошей твари"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Мастер о флирте NPC: персонажи — функции\">14<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Мастер о флирте NPC: персонажи — функции<\/b> Мастер, играющий 23 года, объяснил, что не ассоциирует себя с NPC: флирт <a class=\"ref\" href=\"/c/margo/\">Марго<\/a> с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> — функция, подсвечивающая героев и их взаимодействие с миром, естественная реакция на броски харизмы. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4521\" target=\"_blank\" rel=\"noopener\">1:15:21 ↗<\/a> · <a href=\"#qa18-25\">к записи<\/a><\/span><\/span>"}, {"name": "Загорий / Манучар", "actor": "", "actor_url": null, "race": "", "role": "дварф-бывший жрец Солнца, на деле демон на службе Властона", "fate": "погиб", "id": "Манучар", "url": "/c/zagoriy-manuchar/", "img": "img/chars/zagorij-manuchar.webp", "other": [], "fn_html": "<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Почему демоны отступили после смерти Манучара\">10<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Почему демоны отступили после смерти Манучара<\/b> Силы жрецов и демонов в храме были равны; именно <a class=\"ref\" href=\"/c/zagoriy-manuchar/\">Манучар<\/a> увеличивал число демонов и усиливал их. Авторы решили, что если герои его победят, воодушевлённые жрецы загонят бесов обратно в портал — «лёгкая ничья», а не победа жрецов; разыгрывать бой NPC с NPC сочли плохой практикой. <span class=\"note\">Подкаст по #18 · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3669\" target=\"_blank\" rel=\"noopener\">1:01:09 ↗<\/a> · <a href=\"#qa18-21\">к записи<\/a><\/span><\/span>"}, {"name": "Эрик Пэнисов", "actor": "", "actor_url": null, "race": "", "role": "муж Софии, бросил семью", "fate": "неизвестно", "id": "Эрик", "url": "/c/erik-penisov/", "img": "img/chars/erik-penisov.webp", "other": [{"key": "01", "label": "1", "title": "Башня колдуна"}, {"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "35", "label": "35", "title": "Второй Шанс"}], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода\">17<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b> Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений». <span class=\"note\">Подкаст по #27 · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 ↗<\/a> · <a href=\"#qa27-32\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Судьбу Эрика Пэнисова отдали Гудкову и BRB\">19<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Судьбу Эрика Пэнисова отдали Гудкову и BRB<\/b> Судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> висела с <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, его последнего появления. Его хотели вернуть в <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, но <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> не приехал на съёмку. Авторы решили, что судьбу Эрика должны решить два игрока, которые были с ним с первого приключения: персонаж <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был заинтересован, чтобы Эрик выжил, персонаж <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> — чтобы погиб. Показывать это в игре, а не объявлять гибель за кадром, решили сознательно. <span class=\"note\">Подкаст по #35 · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3827\" target=\"_blank\" rel=\"noopener\">1:03:47 ↗<\/a> · <a href=\"#qa35-6\">к записи<\/a><\/span><\/span>"}, {"name": "Мать-паучиха", "actor": "", "actor_url": null, "race": "", "role": "мать Софии и Юлиана", "fate": "уехала лечиться", "id": "Жануария", "url": "/c/zhanuariya/", "img": "img/chars/zhenuariya.webp", "other": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\""}, {"key": "13", "label": "13", "title": "Проклятые роды"}, {"key": "14", "label": "14", "title": "Янус доставка"}, {"key": "22", "label": "22", "title": "Отряд Солнца"}, {"key": "42", "label": "42", "title": "Чудная Долина"}]}], "links": [{"key": "07", "label": "7", "title": "Ночь в таверне \"Кайф\"", "note_html": "Семья каннибалов из таверны «Кайф»", "dir": "out", "color": "#2F84C8"}, {"key": "13", "label": "13", "title": "Проклятые роды", "note_html": "Проклятые роды <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и рождение Лёши", "dir": "out", "color": "#2F84C8"}, {"key": "14", "label": "14", "title": "Янус доставка", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> у <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, эльфийская соль, гоблин <a class=\"ref\" href=\"/c/biktor/\">Биктор<\/a> и гвардеец <a class=\"ref\" href=\"/c/cisgender/\">Цисгендий<\/a>", "dir": "out", "color": "#2F84C8"}, {"key": "22", "label": "22", "title": "Отряд Солнца", "note_html": "Жрец <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> и избранный ребёнок упоминаются снова", "dir": "out", "color": "#2F84C8"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "Легенда об избранном от божественного семени; <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "29", "label": "29", "title": "Отель \"Глубокий канал\"", "note_html": "младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>", "dir": "back", "color": "#2F84C8"}, {"key": "32", "label": "32", "title": "Путешествие к Нергалу", "note_html": "<a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> охотился на Избранное чадо по заказу демонов", "dir": "back", "color": "#B8901C"}, {"key": "34", "label": "34", "title": "Пропавшая ёлочка", "note_html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> в ветви <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>", "dir": "back", "color": "#2F84C8"}, {"key": "35", "label": "35", "title": "Второй Шанс", "note_html": "<a class=\"ref\" href=\"/c/erik-penisov/\">Эрик<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — Избранное чадо", "dir": "back", "color": "#C8423B"}, {"key": "37", "label": "37", "title": "Добровольцы", "note_html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>, его сестра <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> (Паль) — персонажи ветви <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика Пэнисова<\/a>", "dir": "back", "color": "#3E9A5E"}, {"key": "42", "label": "42", "title": "Чудная Долина", "note_html": "Младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — правнук <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>", "dir": "back", "color": "#7C5CD6"}, {"key": "45", "label": "45", "title": "Реинкарнации Лёши", "note_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — проклятый младенец из Зелёного Моста, Избранное дитя; <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> и <a class=\"ref\" href=\"/c/erik-penisov/\">Эрик Пэнисов<\/a>", "dir": "back", "color": "#2F84C8"}, {"key": "47", "label": "47", "title": "Вокзал грешных душ", "note_html": "<a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и его семья каннибалов обратились к свету из-за племянника Лёши", "dir": "back", "color": "#3E9A5E"}, {"key": "52", "label": "52", "title": "Накопитель Любви", "note_html": "<a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> (Избранное чадо) назван потомком <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a>", "dir": "back", "color": "#C8423B"}, {"key": "53", "label": "53", "title": "В поисках Лёши", "note_html": "<a class=\"ref\" href=\"/c/sofiya/\">София<\/a>, <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и младенец <a class=\"ref\" href=\"/c/lyosha/\">Лёша<\/a> — Избранное чадо", "dir": "back", "color": "#2F84C8"}], "quotes_html": ["«Я хоть и тупой, но знаю, что спать с сестрой нехорошо» — <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a>", "«Жил без страха и умер без страха — просто в МФЦ» — о сожжённой очереди", "«Поздравляем, вы получили кредит» — надпись в воздухе", "«Любой, кто посмотрит это приключение, научится не брать микрокредиты» — паладин <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a>"], "places_html": "<ul>\n<li>Столица королевства (<a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпон<\/a>): дом <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a> и <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a>, МФЦ королевских прошений (окна №3, 4, 7), площадь Солнца (петушиные бои), солярий «Ясен Красен», тайный подземный храм Солнца.<\/li>\n<li>Храм Солнца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> (осквернён <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>; связан аркой-порталом со столичным).<\/li>\n<li>Фракции: культ бога Солнца (запрещён в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>), организация контрабандиста <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>, микрокредитная контора «Дам Ванна», демоны <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<\/li>\n<li>Артефакты: священный символ Солнца, бурдюк святой воды на 10 л, ящик для пожертвований, «Кара Света», чёрный фиал скверны, арка-портал, пылающий серп <a class=\"ref\" href=\"/c/sofiya/\">Софии<\/a>, магический «божественный договор».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>19<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>19<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>4<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>6<\/small><\/button><button class=\"chip ptf t-retcon\" data-t=\"retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон <small>1<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>2<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>2<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa18-5\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Гостей-актёров брифуют относиться к персонажу как к прожитой жизни<\/b><\/div><p>Авторы рассказали, что Паля и <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> на брифинге просили не относиться к персонажам легкомысленно и представить, что <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> и <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> жили до этого десятки лет и их жизнь продолжится после выпуска.<\/p><blockquote>«Представьте, что вы до этого десятки лет уже жили этими персонажами… и после этого ваша жизнь продолжится»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-5\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=2110\" target=\"_blank\" rel=\"noopener\">0:35:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-13\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Чёрный ход в МФЦ с контрабандистами<\/b><\/div><p>В МФЦ королевских прошений был альтернативный путь: обойти охранника и через чёрный ход попасть к окну <a class=\"ref\" href=\"/c/zagoriy-manuchar/\">Загория<\/a> без магического барьера. У чёрного входа находились контрабандисты, подменявшие питьевую воду в МФЦ, — с ними был бы довольно лёгкий бой.<\/p><blockquote>«у чёрного входа находились эти контрабандисты, которые меняли питьевую воду в МФЦ»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-13\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3043\" target=\"_blank\" rel=\"noopener\">0:50:43 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa18-14\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>«Юлиан Пэнисов» — ошибка головореза, а не мастера<\/b><\/div><p>Головорезы <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> назвали <a class=\"ref\" href=\"/c/yulian/\">Юлиана<\/a> Пэнисовым, потому что контрабандисты знали фамилию <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и сочли Юлиана его братом. Это не опечатка: так думает персонаж, не обладающий всей информацией.<\/p><blockquote>«фильтруй источник: это не мастер говорит, это говорит головорез, который не обладает всей информацией»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-14\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3070\" target=\"_blank\" rel=\"noopener\">0:51:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa18-15\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Фамилия семьи каннибалов — Лектор<\/b><\/div><p>Ответили, что у каннибалов фамилия Лектор (придумали игроки): Юлиан — <a class=\"ref\" href=\"/c/yulian/\">Юлиан Лектор<\/a>, <a class=\"ref\" href=\"/c/sofiya/\">София<\/a> — урождённая Лектор; после брака с <a class=\"ref\" href=\"/c/erik-penisov/\">Эриком<\/a> обсуждали шутливо двойную фамилию.<\/p><blockquote>«Юлиан Лектор остался, а София… в девичестве Лектор»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-15\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3132\" target=\"_blank\" rel=\"noopener\">0:52:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa18-16\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Легенда храма Солнца: государственная религия Геленбурга<\/b><\/div><p>Поклонение богу Солнца было государственной религией южных земель — <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a> («Город Солнца», от <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>). <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> отрёкся от этой религии, присягнул тёмным силам, и все храмы Солнца в Геленбурге были осквернены. Столичный храм на площади Солнца в <a class=\"ref\" href=\"/place/kyonigpon/\">Кёнигпоне<\/a> — филиал, который ради маскировки убрал упоминание Солнца и назвался солярием «Ясен Красен»; возможно, есть и другие тайные ячейки.<\/p><blockquote>«Геленбург — это Город Солнца, от слова Гелиос и бург… все храмы Солнца в Геленбурге были осквернены»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-16\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3188\" target=\"_blank\" rel=\"noopener\">0:53:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa18-17\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Янус — лидер гильдии контрабандистов, может носить любую личину<\/b><\/div><p>Господин <a class=\"ref\" href=\"/c/yanus/\">Янус<\/a> всегда действует чужими руками; найти его или добиться встречи — отдельный квест. Он лидер гильдии контрабандистов (аналог гильдии воров) и может скрываться под любой личиной — даже быть одним из игроков. Если бы героям не удалось скрыться в храме Солнца, он предстал бы перед ними в одном из следующих выпусков.<\/p><blockquote>«у господина Януса может быть любая личина, это может быть любой человек, даже игрок»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-17\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3415\" target=\"_blank\" rel=\"noopener\">0:56:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa18-18\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Вырезана шутка BRB про булаву в МФЦ<\/b><\/div><p>Подтвердили, что в момент, когда <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> размозжил булавой голову головорезу, <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> пошутил про «булаву в МФЦ», но шутку вырезали на монтаже.<\/p><p class=\"note\"><a href=\"/pod/qa18/#qa18-18\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3454\" target=\"_blank\" rel=\"noopener\">0:57:34 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa18-19\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Художники преувеличили число демонов и гиганта в портале<\/b><\/div><p>На вопрос о многочисленных демонах и гиганте в портале авторы ответили, что художники «чуть-чуть усилили» картину, чтобы демоны выглядели страшно.<\/p><blockquote>«это на самом деле художники… чуть-чуть усилили»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-19\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3498\" target=\"_blank\" rel=\"noopener\">0:58:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa18-20\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Тифлинг среди сожжённых наёмников остался на иллюстрации<\/b><\/div><p>Художники нарисовали среди контрабандистов на площади тифлинга; так как у тифлингов сопротивление огню и он мог выжить после огненных ладоней, его попросили заменить на полуорчиху, но в монтаже тифлинг, похоже, остался. «Демон в одежде» у сауны — тоже тифлинг, мирная раса, а не демон или бес.<\/p><blockquote>«это не демон, это тифлинг… это одна из рас, она мирная, это не бес, не демон, не дьявол»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-20\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3587\" target=\"_blank\" rel=\"noopener\">0:59:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa18-21\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему демоны отступили после смерти Манучара<\/b><\/div><p>Силы жрецов и демонов в храме были равны; именно <a class=\"ref\" href=\"/c/zagoriy-manuchar/\">Манучар<\/a> увеличивал число демонов и усиливал их. Авторы решили, что если герои его победят, воодушевлённые жрецы загонят бесов обратно в портал — «лёгкая ничья», а не победа жрецов; разыгрывать бой NPC с NPC сочли плохой практикой.<\/p><blockquote>«лишь Манучар усиливал там, увеличивал количество демонов и делал их сильнее… это такая лёгкая ничья»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-21\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3669\" target=\"_blank\" rel=\"noopener\">1:01:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa18-22\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Лифт «перегруз вины» — задуманная головоломка-последствие<\/b><\/div><p>Лифт в храм был заложен как головоломка: чем больше плохих поступков совершит группа (а жрец и паладин могли их останавливать или совершать), тем труднее спуститься. Это и было последствием убийств в МФЦ и на площади; авторы не ожидали, что <a class=\"ref\" href=\"/c/svetostoy/\">Святостой<\/a> <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> начнёт сжигать людей.<\/p><blockquote>«чем больше группа совершит плохих поступков, тем меньше шансов у них нормально спуститься по этому лифту»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-22\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=3973\" target=\"_blank\" rel=\"noopener\">1:06:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa18-23\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>12<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Путь в храм был не напрасен<\/b><\/div><p>Герои получили в осквернённом храме временное убежище от наёмников <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a> и узнали, что за ними охотятся ещё и демонические силы, от которых храм пока не защищает.<\/p><blockquote>«как минимум они узнали, что за ними охотятся не только наёмники Януса, но и демонические силы»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-23\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4070\" target=\"_blank\" rel=\"noopener\">1:07:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa18-24\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>13<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Как очистить храм Солнца: механики пока нет<\/b><\/div><p>Конкретной механики очищения нет: вероятно, понадобятся тяжёлые ритуалы и молитвы богу Солнца, чтобы вернуть связь с божественной энергией. Домен бога Солнца и космология мира пока не утверждены. Очистить именно этот храм, скорее всего, несложно: его осквернил лишь один фиал, создавший временную связь с осквернённым <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургом<\/a>, где находятся демоны и войска <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a>.<\/p><blockquote>«он был всего лишь одним фиалом осквернён… этот эффект тоже довольно-таки временный»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-24\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4152\" target=\"_blank\" rel=\"noopener\">1:09:12 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa18-25\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>14<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Мастер о флирте NPC: персонажи — функции<\/b><\/div><p>Мастер, играющий 23 года, объяснил, что не ассоциирует себя с NPC: флирт <a class=\"ref\" href=\"/c/margo/\">Марго<\/a> с <a class=\"ref\" href=\"/c/yulian/\">Юлианом<\/a> — функция, подсвечивающая героев и их взаимодействие с миром, естественная реакция на броски харизмы.<\/p><blockquote>«эти персонажи — функции, они по сути нужны для того, чтобы подсвечивать наших героев»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa18/#qa18-25\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4521\" target=\"_blank\" rel=\"noopener\">1:15:21 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa18-26\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>15<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Святостой отыграл фанатика — и церковь признала грех<\/b><\/div><p>Авторы признались, что не ожидали от <a class=\"ref\" href=\"/p/lapenko/\">Лапенко<\/a> сжигания людей: персонаж по лору должен служить добру. Его поведение объяснили фанатизмом ради святой цели и желанием новичка «пощупать пределы»; при этом сама церковь засвидетельствовала у него «перегруз вины» — а грехи в этой религии очищаются деньгами.<\/p><blockquote>«он отыграл фанатика… но сама церковь его признала, что у него перегруз вины»<\/blockquote><p class=\"note\"><a href=\"/pod/qa18/#qa18-26\">Подкаст по #18<\/a> · <a href=\"https://youtu.be/-VEe7wxuhJ4?t=4661\" target=\"_blank\" rel=\"noopener\">1:17:41 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-retcon\" id=\"qa22-25\" data-type=\"retcon\"><div class=\"pn-h\"><sup class=fnn>16<\/sup><span class=\"ptype t-retcon\" title=\"задним числом меняет показанное в выпуске\">Реткон<\/span><b>Ожог Кряхтуна из выпуска 18 убрали: паладин выздоровел<\/b><\/div><p>Шрам от ожога из выпуска <a href=\"/ep/18/\" title=\"Охота на младенца\">18<\/a> художники рисовали, но выходило некрасиво даже в уменьшенном варианте. Авторы решили, что паладин света должен иметь идеальный образ, и постановили, что <a class=\"ref\" href=\"/c/paladin-krihta/\">Кряхтун<\/a> вылечился.<\/p><blockquote>«паладин света в идеальной броне… у него не должно быть изъянов… поэтому мы решили, что он вылечил его»<\/blockquote><p class=\"note\">автор Шатохин · <a href=\"/pod/qa22/#qa22-25\">Подкаст по #22<\/a> · <a href=\"https://youtu.be/IaSsYIq1eWA?t=6651\" target=\"_blank\" rel=\"noopener\">1:50:51 в видео ↗<\/a> · о выпуске <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, <a href=\"/ep/22/\" title=\"Отряд Солнца\">#22<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa27-32\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>17<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Ребёнок Брэндона — Канделакис Пэнисов; божественная кровь у всего рода<\/b><\/div><p>Авторы объяснили генеалогию. Сын <a class=\"ref\" href=\"/c/brendon-tyomnyy-vlastelin/\">Брэндона<\/a> от полурослицы — <a class=\"ref\" href=\"/c/kandelakis-penisov/\">Канделакис Пэнисов<\/a>, отец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> и <a class=\"ref\" href=\"/c/savl/\">Савла<\/a>, которому дали «позорную бедняцкую» фамилию. Связь придумали задним числом, отталкиваясь от фамилии, которую <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> дал Эрику в первом выпуске. Божественность есть у Канделакиса, Эрика, Савла, <a class=\"ref\" href=\"/c/lyuciy-palin/\">Люция<\/a> и <a class=\"ref\" href=\"/c/lyosha/\">Лёши<\/a>, но проявляется не у всех. Канделакис о ней не знал, Лёше говорили о силе, но он её не чувствовал, а Эрик ощущал в себе нераскрытый «божественный гений».<\/p><blockquote>«Тем ребёнком был Канделакис, которому дали… отвратительную фамилию Пэнисов. Мы это придумали: вот эту связь того, что Кукушкин придумал в первом выпуске, мы сейчас связали.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa27/#qa27-32\">Подкаст по #27<\/a> · <a href=\"https://youtu.be/ZdYnf3jKbeo?t=6975\" target=\"_blank\" rel=\"noopener\">1:56:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a>, <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a>, <a href=\"/ep/07/\" title=\"Ночь в таверне &quot;Кайф&quot;\">#7<\/a>, <a href=\"/ep/13/\" title=\"Проклятые роды\">#13<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa29-24\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>18<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Трансакцио усыпили клофелинщицы, у него был пропуск наверх<\/b><\/div><p>Трансакцио — владелец кредитной организации «Дам вам нал» (из вып. 18). Его не было на собрании: в номер 2 сначала стучались <a class=\"ref\" href=\"/c/yulian/\">Юлиан<\/a> и <a class=\"ref\" href=\"/c/cherezdevic/\">Чрездевиц<\/a>, и там был слышен лишь шорох. На самом деле клофелинщицы усыпили его, а у него можно было взять пропуск на третий этаж.<\/p><blockquote>«Там, на самом деле, были клофелинщицы, которые его усыпили. И у него можно было пропуск на третий этаж получить.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-24\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4823\" target=\"_blank\" rel=\"noopener\">1:20:23 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa35-6\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>19<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Судьбу Эрика Пэнисова отдали Гудкову и BRB<\/b><\/div><p>Судьба <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a> висела с <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, его последнего появления. Его хотели вернуть в <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, но <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Никита Кукушкин<\/a> не приехал на съёмку. Авторы решили, что судьбу Эрика должны решить два игрока, которые были с ним с первого приключения: персонаж <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> был заинтересован, чтобы Эрик выжил, персонаж <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> — чтобы погиб. Показывать это в игре, а не объявлять гибель за кадром, решили сознательно.<\/p><blockquote>«мы решили, что судьбу Эрика должны решить Александр Гудков и Big Russian Boss»<\/blockquote><p class=\"note\"><a href=\"/pod/qa35/#qa35-6\">Подкаст по #35<\/a> · <a href=\"https://youtu.be/U6j9pGd-3ao?t=3827\" target=\"_blank\" rel=\"noopener\">1:03:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/35/\" title=\"Второй Шанс\">#35<\/a>, <a href=\"/ep/14/\" title=\"Янус доставка\">#14<\/a>, <a href=\"/ep/18/\" title=\"Охота на младенца\">#18<\/a>, <a href=\"/ep/01/\" title=\"Башня колдуна\">#1<\/a><\/p><\/article><\/section>", "chars": {"Святостой": {"name": "Святостой", "img": "img/chars/svyatostoj.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%A1%D0%B2%D1%8F%D1%82%D0%BE%D1%81%D1%82%D0%BE%D0%B9", "summary": "Святосто́й — светлый жрец Храма Солнца, сборщик пожертвований.", "infobox": {"Пол": "Мужской", "Раса": "Человек", "Тип": "Игровой", "Игрок": "Антон Лапенко"}, "actors": ["Лапенко"], "kind": "pc", "dead": false, "race": "Человек", "portraits": [], "url": "/c/svetostoy/", "eps": [{"key": "18", "label": "18", "title": "Охота на младенца"}]}, "Эрик": {"name": "Эрик Пэнисов", "img": "img/chars/erik-penisov.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%AD%D1%80%D0%B8%D0%BA_%D0%9F%D1%8D%D0%BD%D0%B8%D1%81%D0%BE%D0%B2", "summary": "Э́рик Пэ́нисов — полурослик, плут, один из главных героев вселенной игры «Подземелья Чикен Карри».", "infobox": {"Пол": "Мужской", "Раса": "Полуросл
