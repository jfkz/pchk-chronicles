<script>window.EPD = {"anim": false, "key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "date": "2022-10-11", "minutes": 107, "duration": 6400.0, "video_id": "ock_d9eoaqI", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Столица королевства: ритуальное бюро «Последний путь», кузница Артемиса Свона, театр «2Т»", "short_html": "У клана вампиров <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> крадут гробы, а по городу рыщет охотник Бесагон.", "summary_html": "При новом короле вампиры столицы тихо встроились в общество, но в городе появился охотник Бесагон, который убивает только вампиров. У клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> крадут гробы; без них вампиры ослабнут и погибнут. Идя по следу через ритуальное бюро «Последний путь», вампиры обнаруживают, что Бесагон подставил их, убив управляющего-оборотня. Им удаётся заключить союз с оборотнями и офицером <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, выйти через кузнеца <a class=\"ref\" href=\"/c/artemis-svon/\">Артемиса Свона<\/a> на режиссёра театра «2Т» <a class=\"ref\" href=\"/c/maykl-kou/\">Майкла Коу<\/a>. Он и есть Бесагон, а силу ему даёт орден. Гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> отбирает орден, Дан Балан убивает Бесагона, гробы возвращены, а Кукан Яку обращают в вампира.", "outcome_html": "Бесагон убит, гробы клана возвращены, орден почётного режиссёра у <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал вампиром, но укушен крысой-оборотнем.", "world_html": ["Охотник на вампиров Бесагон (<a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a>) убит", "Заключён союз вампиров клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> с оборотнями и стражей столицы", "Орден почётного режиссёра (сила Бесагона) перешёл к вампирам", "Гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> обращён в вампира и укушен крысой-оборотнем"], "scenes": [{"t": "0:03:52", "sec": 232, "html": "Завязка: вампиры веками были гонимы, но при новом короле работают в ночных тавернах и лавках столицы. Появился Бесагон, его портреты печатают в газетах. Ночью, пока вампиры были на оргии, у них украли гробы, на стене оставив знак — перечёркнутые клыки. Каждый вампир бросает начальный запас «очков крови» (1 очко — жертва выживает, 2 — погибает).<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Вампирам нужны свои гробы с родной землёй\">4<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Вампирам нужны свои гробы с родной землёй<\/b> Вампиры приехали в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> со своими гробами. Если те сгорели вместе с поместьем, им придётся тяжело, но не смертельно: их прародители родом из Мёртвых топей, а родная земля помогает. В гробу лежит земля, и над ним нужно провести ритуал, чтобы он давал силы. Поэтому в выпуске 12 вампиры искали именно свои гробы, а не брали любые в похоронном бюро. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4655\" target=\"_blank\" rel=\"noopener\">1:17:35 ↗<\/a> · <a href=\"#qa16-23\">к записи<\/a><\/span><\/span>"}, {"t": "0:04:40", "sec": 280, "html": "Представление: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (стал вампиром слишком поздно, в теле старика; обратил троих и возглавляет группу), Антон (жиголо, пьёт женскую кровь), <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> (скромница, ставшая вампиршей, пьёт мужскую кровь в борделе «Барсук»), <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> (рикша, быстрее лошади), гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> (после побега из <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнеста<\/a> — уборщик в зале для оргий, служит вампирам в надежде на обращение)."}, {"t": "0:10:53", "sec": 653, "html": "Рамочный рекламный скетч: престарелый вампир в «восточных пустошах» пересказывает эту историю своему фамильяру (повторяется по ходу выпуска).<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Влад Сосунеску родился из рекламного скетча Кукушкина\">9<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Влад Сосунеску родился из рекламного скетча Кукушкина<\/b> Персонажи из рекламных вставок — часть лора. <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> впервые появился в рекламной интеграции: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> за 15 минут так проработал его речь и идеологию, что авторы решили ввести его в выпуск. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4510\" target=\"_blank\" rel=\"noopener\">1:15:10 ↗<\/a> · <a href=\"#qa20-34\">к записи<\/a><\/span><\/span>"}, {"t": "0:15:16", "sec": 916, "html": "Ночная улица, рикша с наклейкой «Хулиган». <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> запугивает влюблённую парочку, та указывает на ворота ритуального бюро «Последний путь» прямо за спинами героев. Антон пьёт кровь девушки наполовину (крит). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> гонится за парнем с вилкой, промахивается и застревает клыками в двери; <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> хватает парня, Дан Балан высасывает его досуха."}, {"t": "0:27:41", "sec": 1661, "html": "Девушка рассказывает о Бесагоне (странный костюм с рожками, неуловим, убивает только вампиров) и погибает — <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> вскрывает ей шею для Антона."}, {"t": "0:31:55", "sec": 1915, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> встревает в ограбление прохожего тремя хулиганами: раздевается догола, прыгает одному на лицо и приводит его к вампирам, но <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> дважды проваливает укус, и хулиган убегает."}, {"t": "0:37:03", "sec": 2223, "html": "У бюро: сквозь стены видно двоих — один чистит гробы, другой мочится. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> летучей мышью залетает во двор, его замечают. Гробовщики оказываются оборотнями: у вампиров с ними перемирие, но свидетели видели, что гробы увезла гробовозка «Последнего пути». Оборотни прогоняют Бека."}, {"t": "0:45:11", "sec": 2711, "html": "Антон летучей мышью проникает через единственное окно в кабинет управляющего: оборотень <a class=\"ref\" href=\"/c/persi/\">Перси<\/a> мёртв, в затылке — серебряный арбалетный болт, на стене кровью: «Вампиры правят!». На столе — заявление офицеру <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> о пропаже гробовозки. На болте клеймо «Дизайнерская ковка <a class=\"ref\" href=\"/c/artemis-svon/\">Артемис Свон<\/a>» (лебедь). Вампиров подставили.<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Знак адского вокзала — перевёрнутая «М» метро; у Бесагона была перечёркнутая V\">5<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Знак адского вокзала — перевёрнутая «М» метро; у Бесагона была перечёркнутая V<\/b> Знак подземного вокзала в выпуске 17 — перевёрнутая буква «М» метро с рожками, ведь вокзал для адских поездов — пародия на метро. Зрители увидели в нём букву W. По той же причине в выпуске 12 Бесагон рисует на стене перечёркнутые клыки: в тестовой версии там была перечёркнутая буква V («вампиры»), и Шатохина долго уговаривали её убрать. <span class=\"note\">Подкаст по #17 · <a href=\"https://youtu.be/VSlj32pAvNU?t=3436\" target=\"_blank\" rel=\"noopener\">0:57:16 ↗<\/a> · <a href=\"#qa17-10\">к записи<\/a><\/span><\/span>"}, {"t": "0:47:56", "sec": 2876, "html": "Дом напротив: <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> просится внутрь, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> призывает «рой» из двух крыс (Маринка и Анжелка) — хозяин-тиран в панике приглашает всех в дом. В газете — портрет Бесагона (с усами); слух: Бесагон раньше служил вампирам и теперь их ненавидит."}, {"t": "0:53:11", "sec": 3191, "html": "В кабинет врываются стражники и оборотни («Они убили <a class=\"ref\" href=\"/c/persi/\">Перси<\/a>! Вампиры объявили войну!»). Антон паучьим лазаньем уходит по потолку, по пути забирает золотую монету из чужого гроба и улетает. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> выбрасывает труп в окно и сам выпрыгивает, получив удар когтей. Мёртвых есть нельзя."}, {"t": "1:00:10", "sec": 3610, "html": "Забитая жена хозяина видела, как ночью кто-то по верёвке залез в окно бюро, — это был Бесагон. Найдены серебряная стрела с клеймом Свона и бирка костюмерной театра «2Т» в куче мусора, куда он упал."}, {"t": "1:04:30", "sec": 3870, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> говорит с трупом <a class=\"ref\" href=\"/c/persi/\">Перси<\/a>: убийца — Бесагон, который раньше не трогал оборотней. Пароль для доверия: «Скажи <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, что Мария его недостойна»."}, {"t": "1:06:54", "sec": 4014, "html": "Вампиры идут к оборотням с миром; убеждение с критом — офицер стражи <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> (с золотым значком) соглашается на союз против Бесагона. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> дерзит, и Альбо, превратившись в крысу-оборотня, кусает его. Оборотни берут след по бирке театра, вампиры едут к кузнецу.<button type=\"button\" class=\"fn t-error\" aria-expanded=\"false\" title=\"Ошибка: В 12-м выпуске союзниками были только волки, крыс дорисовали художницы\">7<\/button><span class=\"fnb t-error\" hidden><span class=\"ptype\">Ошибка<\/span> <b>В 12-м выпуске союзниками были только волки, крыс дорисовали художницы<\/b> Вспоминая союз с оборотнями в 12-м выпуске, ведущие уточнили, что с героями были только волки, а крыс на иллюстрации добавили художницы. <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1988\" target=\"_blank\" rel=\"noopener\">0:33:08 ↗<\/a> · <a href=\"#qa20-19\">к записи<\/a><\/span><\/span>"}, {"t": "1:13:43", "sec": 4423, "html": "Кузница <a class=\"ref\" href=\"/c/artemis-svon/\">Артемиса Свона<\/a>: <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> будит кузнеца байкой о богатых иностранцах, и тот приглашает вампиров. Поцелуй страсти <a class=\"ref\" href=\"/c/adelaida/\">Иделаиды<\/a> очаровывает его: стрелы заказал режиссёр театра «2Т» <a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a>. Кузнец дарит Иделаиде серебряный меч в виде языка пламени и золотую монету.<button type=\"button\" class=\"fn t-clarification\" aria-expanded=\"false\" title=\"Уточнение: Правило приглашения: вампиры свободно входят в общественные места\">1<\/button><span class=\"fnb t-clarification\" hidden><span class=\"ptype\">Уточнение<\/span> <b>Правило приглашения: вампиры свободно входят в общественные места<\/b> По правилам шоу вампиры входят в общественные места (таверны) без приглашения, а в жилые помещения — нет. Поэтому в таверне «Весёлый утопец» герои не смогли войти в комнату трактирщика, защищённую барьером: хозяин, который мог их пригласить, был уже убит. На вопрос, почему в выпуске 12 понадобилось приглашение в кузницу, авторы отшутились. <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1597\" target=\"_blank\" rel=\"noopener\">0:26:37 ↗<\/a> · <a href=\"#qa16-7\">к записи<\/a><\/span><\/span>"}, {"t": "1:20:45", "sec": 4845, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> пытается разбудить кузнеца, схватив «за самое дорогое», и выхватить меч; вампиры досуха выпивают Кукан Яку, «чтобы обратить». Голосованием его стабилизируют как человека, ему врут, что он уже вампир («инкубационный период две недели»). Кузнец вонзает <a class=\"ref\" href=\"/c/adelaida/\">Иделаиде<\/a> в спину осиновый кол; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампирбек<\/a> приказом валит его, кузнеца выпивают, кол вынимают — Иделаида восстанавливается."}, {"t": "1:29:03", "sec": 5343, "html": "Театр «2Т»: репетиция пьесы, где актёры в вампирских костюмах стоят в украденных гробах, а «оборотни» с деревянными кольями выпрыгивают из гробовозки. Между рядами разорванные трупы оборотней-союзников. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> блефует «патриотической проверкой театров» и «пятой колонной»."}, {"t": "1:33:22", "sec": 5602, "html": "«Роковая женщина» <a class=\"ref\" href=\"/c/adelaida/\">Иделаиды<\/a> завораживает всех, Антон бежит с мечом, но Коу замечает его: «Сила Бесагона!» — орден облачает его в доспех. После перебросов монетами Антон наносит критический удар на 25 урона, но орден полностью регенерирует Бесагона; актёры с кольями встают на его защиту."}, {"t": "1:38:03", "sec": 5883, "html": "Бесагон убивает только вампиров, и живого гнома не трогает. <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> изображает фаната, выпрашивает «что-нибудь на память» и срывает орден (успех после монеты). Бесагон превращается в беспомощного старика: «Я был таким же фамильяром, как ты, — они никогда не сделают тебя вампиром»."}, {"t": "1:41:37", "sec": 6097, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> отдаёт орден «деду» <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a>, тот насаживает Бесагона на меч. Орден почётного режиссёра у вампиров. Бек допрашивает труп, гробы забирают."}, {"t": "1:44:33", "sec": 6273, "html": "Кукан Яку обращают по-настоящему (выпить кровь и дать свою), он просыпается вампиром. 8 монет — 80 000 руб. в фонд «Вместе поможем детям». Финал: «как повлияет на Кукан Яку укус крысы-оборотня?»"}], "key_events": [{"t": "0:03:52", "sec": 232}, {"t": "0:45:11", "sec": 2711}, {"t": "0:53:11", "sec": 3191}, {"t": "1:01:15", "sec": 3675}, {"t": "1:04:30", "sec": 3870}, {"t": "1:09:20", "sec": 4160}, {"t": "1:17:55", "sec": 4675}, {"t": "1:22:00", "sec": 4920}, {"t": "1:34:27", "sec": 5667}, {"t": "1:39:40", "sec": 5980}, {"t": "1:42:02", "sec": 6122}], "coins": {"ep": "12", "events": [{"t": "0:27:20", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "получил монету за шутку/лор о том, что вампиров нужно приглашать в дом, разговаривая с уцелевшей девушкой", "result": null, "sec": 1640, "who_url": "/c/anton/", "reason_html": "получил монету за шутку/лор о том, что вампиров нужно приглашать в дом, разговаривая с уцелевшей девушкой"}, {"t": "0:32:54", "kind": "loot", "who": "Кукан Яка", "actor": "Кукояка", "to": null, "reason": "попытался отобрать у уличного грабителя его последнюю золотую монету (внутриигровые деньги NPC)", "result": "не получилось — монету перехватил другой уличный бандит", "sec": 1974, "who_url": "/c/kukanyaka/", "reason_html": "попытался отобрать у уличного грабителя его последнюю золотую монету (внутриигровые деньги NPC)"}, {"t": "0:57:27", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "успешно схватил золотую монету из чужого гроба (акробатика 15) во время побега от стражи, монету зачли в общий счёт", "result": null, "sec": 3447, "who_url": "/c/anton/", "reason_html": "успешно схватил золотую монету из чужого гроба (акробатика 15) во время побега от стражи, монету зачли в общий счёт"}, {"t": "0:59:49", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "получил монету за хорошее знание вампирского лора (нельзя есть мертвецов для восстановления здоровья)", "result": null, "sec": 3589, "who_url": "/c/anton/", "reason_html": "получил монету за хорошее знание вампирского лора (нельзя есть мертвецов для восстановления здоровья)"}, {"t": "1:03:52", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "получил монету за лор-факт про оборотней (обращение работает не через укус, а через родство)", "result": null, "sec": 3832, "who_url": null, "reason_html": "получил монету за лор-факт про оборотней (обращение работает не через укус, а через родство)"}, {"t": "1:19:43", "kind": "earn", "who": "Иделаида", "actor": "Галич", "to": null, "reason": "получила монету за успешное обольщение кузнеца ради информации", "result": null, "sec": 4783, "who_url": "/c/adelaida/", "reason_html": "получила монету за успешное обольщение кузнеца ради информации"}, {"t": "1:34:50", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "потратил монету на переброс атаки против Бесагона после критического провала", "result": null, "sec": 5690, "who_url": "/c/anton/", "reason_html": "потратил монету на переброс атаки против Бесагона после критического провала"}, {"t": "1:35:28", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "потратил вторую монету на ещё один переброс той же атаки", "result": "в итоге критический успех, двойной урон (25 урона), Бесагон серьёзно ранен", "sec": 5728, "who_url": "/c/anton/", "reason_html": "потратил вторую монету на ещё один переброс той же атаки"}, {"t": "1:40:01", "kind": "spend", "who": "Кукан Яка", "actor": "Кукояка", "to": null, "reason": "потратил монету на переброс проверки ловкости рук (с помехой), чтобы сорвать орден с груди режиссёра", "result": "переброс дал успех — орден сорван", "sec": 6001, "who_url": "/c/kukanyaka/", "reason_html": "потратил монету на переброс проверки ловкости рук (с помехой), чтобы сорвать орден с груди режиссёра"}, {"t": "1:43:26", "kind": "earn", "who": "Кукан Яка", "actor": "Кукояка", "to": null, "reason": "получил монету за успешный трюк с орденом и финальную сцену с дедом", "result": null, "sec": 6206, "who_url": "/c/kukanyaka/", "reason_html": "получил монету за успешный трюк с орденом и финальную сцену с дедом"}, {"t": "1:45:12", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "итоговый бонусный бросок d6 на дополнительные монеты за прохождение приключения", "result": "в сумме заработано 8 золотых монет (80 000 руб.), переданы в фонд «Вместе поможем детям»", "sec": 6312, "who_url": null, "reason_html": "итоговый бонусный бросок d6 на дополнительные монеты за прохождение приключения"}], "totals": [{"who": "Антон", "actor": "Шастун", "earned": 3, "spent": 2, "img": "img/chars/anton.webp", "who_url": "/c/anton/", "actor_url": "/p/anton-shastun/"}, {"who": "Иделаида", "actor": "Галич", "earned": 1, "spent": 0, "img": "img/chars/idelaida.webp", "who_url": "/c/adelaida/", "actor_url": "/p/galich/"}, {"who": "Кукан Яка", "actor": "Кукояка", "earned": 1, "spent": 1, "img": "img/chars/kukan-yaka.webp", "who_url": "/c/kukanyaka/", "actor_url": "/p/denis-kukoyaka/"}], "notes": "Вампирская тема: часть монет выдаётся за знание \"лора\" о вампирах и оборотнях. Итоговый выигрыш — 8 золотых монет (80 000 руб.), отправлены в благотворительный фонд «Вместе поможем детям»."}, "cast": [{"name": "Дан Балан", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "вампир, старший вампир клана (дряхлый старик, ночной охранник)", "role": "", "fate": "выжил", "id": "Дан Балан", "url": "/c/dan-balan/", "img": "img/chars/dan-balan.webp", "other": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Вампирбек", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "вампир, рикша", "role": "", "fate": "выжил", "id": "Вампир Бек", "url": "/c/vampir-bek/", "img": "img/chars/vampirbek.webp", "other": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}, {"key": "33", "label": "33", "title": "Зверь Фест"}, {"key": "40", "label": "40", "title": "Паспорт хорошей твари"}, {"key": "48", "label": "48", "title": "Ночь в музее"}]}, {"name": "Антон", "actor": "Антон Шастун", "actor_url": "/p/anton-shastun/", "race": "вампир, жиголо", "role": "", "fate": "выжил", "id": "Антон", "url": "/c/anton/", "img": "img/chars/anton.webp", "other": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}, {"key": "28a", "label": "28a", "title": "Часть 1 Чёрное небо вампиров"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров"}]}, {"name": "Иделаида", "actor": "Галич", "actor_url": "/p/galich/", "race": "вампирша, администратор борделя «Барсук»", "role": "", "fate": "выжила", "id": "Аделаида", "url": "/c/adelaida/", "img": "img/chars/idelaida.webp", "other": [{"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "20", "label": "20", "title": "Вампирское возмездие"}]}, {"name": "Кукан Яка", "actor": "Денис Кукояка", "actor_url": "/p/denis-kukoyaka/", "race": "речной гном, фамильяр вампиров", "role": "", "fate": "выжил, обращён в вампира (укушен крысой-оборотнем)", "id": "Куканяка", "url": "/c/kukanyaka/", "img": "img/chars/kukan-yaka.webp", "other": [{"key": "05", "label": "5", "title": "Шахты Фогельнест"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика"}], "fn_html": "<button type=\"button\" class=\"fn t-backstage\" aria-expanded=\"false\" title=\"Закулисье: Речные гномы родились из оговорки в «Шахтах Фогельнест»\">11<\/button><span class=\"fnb t-backstage\" hidden><span class=\"ptype\">Закулисье<\/span> <b>Речные гномы родились из оговорки в «Шахтах Фогельнест»<\/b> Речных гномов изначально не существовало: они появились из оговорки в #5, когда участникам за час до съёмки велели придумать имена, и гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал то ли «ручным», то ли «речным». Потом «ручной гном» стал фамильяром вампиров, а речные гномы — изгнанными из дома горными гномами, которые грабят суда на реке. <span class=\"note\">Подкаст по #32 · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8791\" target=\"_blank\" rel=\"noopener\">2:26:31 ↗<\/a> · <a href=\"#qa32-34\">к записи<\/a><\/span><\/span>"}], "npcs": [{"name": "Майкл Коу / Бесагон", "actor": "", "actor_url": null, "race": "", "role": "режиссёр театра «2Т», охотник на вампиров, бывший фамильяр", "fate": "погиб (убит Дан Баланом)", "id": null, "url": null, "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-plan\" aria-expanded=\"false\" title=\"Задел: Вампирская ветка ведёт к дестабилизации столицы\">2<\/button><span class=\"fnb t-plan\" hidden><span class=\"ptype\">Задел<\/span> <b>Вампирская ветка ведёт к дестабилизации столицы<\/b> Сюжет каждого выпуска пишут после того, как известен итог предыдущего, но общий вектор у ветвей есть. Ещё в выпуске 12 обсуждали, почему столицу до сих пор не захватили и почему выгодно стравить вампиров с оборотнями. Глобальной задачей Бесагона была дестабилизация столицы. Действие будет всё больше переноситься в столицу, и для неё заказали карту. <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> связан с «зоной разлома», на тех же землях находится и <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a>; «всё связано, даже если кажется, что не связано». <span class=\"note\">Подкаст по #16 · <a href=\"https://youtu.be/xh1YWZp0zQE?t=2746\" target=\"_blank\" rel=\"noopener\">0:45:46 ↗<\/a> · <a href=\"#qa16-9\">к записи<\/a><\/span><\/span><button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Бесагон — фамильяр, получивший силу от Властона\">8<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Бесагон — фамильяр, получивший силу от Властона<\/b> <a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a> (Бесагон) не был вампиром: он был тщеславным фамильяром, мечтавшим о бессмертии, но понял, что хозяин никогда его не обратит. Тогда он договорился с лордом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>, который дал ему инфернальный значок и задание. Фамильяры помнили его как одного из немногих, кто добился бессмертия, и боготворили — отсюда портрет в доме <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>. <span class=\"pn-fix\"><b>Расходится с конспектом:<\/b> В ep12.md сказано лишь, что силу Бесагону даёт орден; авторы уточнили, что орден (инфернальный значок) Бесагон получил от лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> по договору.<\/span> <span class=\"note\">Подкаст по #20 · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2118\" target=\"_blank\" rel=\"noopener\">0:35:18 ↗<\/a> · <a href=\"#qa20-20\">к записи<\/a><\/span><\/span>"}, {"name": "Альбо", "actor": "", "actor_url": null, "race": "", "role": "офицер городской стражи, крыса-оборотень", "fate": "выжил, союзник вампиров", "id": "Альбо", "url": "/c/albu/", "img": "img/chars/al-bo.webp", "other": [{"key": "08", "label": "8", "title": "Покушение на короля"}]}, {"name": "Перси", "actor": "", "actor_url": null, "race": "", "role": "управляющий ритуальным бюро «Последний путь», оборотень", "fate": "погиб (убит Бесагоном)", "id": "Перси", "url": "/c/persi/", "img": null, "other": [], "fn_html": "<button type=\"button\" class=\"fn t-addition\" aria-expanded=\"false\" title=\"Дополнение: Кто был на собрании преступной верхушки\">10<\/button><span class=\"fnb t-addition\" hidden><span class=\"ptype\">Дополнение<\/span> <b>Кто был на собрании преступной верхушки<\/b> Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12). <span class=\"note\">Подкаст по #29 · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 ↗<\/a> · <a href=\"#qa29-21\">к записи<\/a><\/span><\/span>"}, {"name": "Артемис Свон", "actor": "", "actor_url": null, "race": "", "role": "кузнец, ковал серебряные стрелы для театра", "fate": "погиб", "id": "Артемис Свон", "url": "/c/artemis-svon/", "img": "img/chars/artemis-svon.webp", "other": []}, {"name": "Оборотни-гробовщики", "actor": "", "actor_url": null, "race": "", "role": "работники ритуального бюро", "fate": "часть погибла в театре", "id": null, "url": null, "img": null, "other": []}, {"name": "Хозяин дома напротив и его жена", "actor": "", "actor_url": null, "race": "", "role": "свидетели", "fate": "выжили", "id": null, "url": null, "img": null, "other": []}, {"name": "Парочка на улице", "actor": "", "actor_url": null, "race": "", "role": "жертвы вампиров", "fate": "погибли", "id": null, "url": null, "img": null, "other": []}], "links": [{"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — беглец из каторжного лагеря <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "08", "label": "8", "title": "Покушение на короля", "note_html": "<a class=\"ref\" href=\"/c/albu/\">Альбо<\/a> позже — оборотень, офицер стражи в вампирской ветви", "dir": "back", "color": "#C8423B"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "Во вступлении пересказаны события <a class=\"ref\" href=\"/place/hram-yumora/\">Храма Юмора<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "11", "label": "11", "title": "Оазис Шиш Кебаб", "note_html": "Рекламный тизер вампиров; во вступлении — гибель барона <a class=\"ref\" href=\"/c/baron-edvard/\">Эдварда<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "16", "label": "16", "title": "Вампиры Мёртвых топей", "note_html": "Продолжение вампирской ветви в Мёртвых топях", "dir": "out", "color": "#B03A7A"}, {"key": "20", "label": "20", "title": "Вампирское возмездие", "note_html": "Продолжение вампирской ветви", "dir": "out", "color": "#B03A7A"}, {"key": "23", "label": "23", "title": "Пробуждение Сосунеску", "note_html": "Уничтожение Бесагона", "dir": "back", "color": "#B03A7A"}, {"key": "26", "label": "26", "title": "Четвёртая фабрика", "note_html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> — бывший фамильяр, стал гибридом; Бесагон", "dir": "back", "color": "#B03A7A"}, {"key": "28b", "label": "28b", "title": "Часть 2 Чёрное небо вампиров", "note_html": "меч Бесагона", "dir": "back", "color": "#B03A7A"}, {"key": "33", "label": "33", "title": "Зверь Фест", "note_html": "Меч Бесагона", "dir": "back", "color": "#B03A7A"}, {"key": "48", "label": "48", "title": "Ночь в музее", "note_html": "Начало вампирской ветви клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>", "dir": "back", "color": "#B03A7A"}], "quotes_html": ["«Я дед, а ты будешь на вилку надет» — <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> подсказывает <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a>.", "«Скажи <a class=\"ref\" href=\"/c/albu/\">Альбо<\/a>, что Мария его недостойна» — мёртвый <a class=\"ref\" href=\"/c/persi/\">Перси<\/a>.", "«Сила Бесагона!» — <a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a>.", "«Я был таким же фамильяром, как ты. Они никогда не сделали бы тебя вампиром» — Бесагон Кукан Яке.", "«Ты тупой, я через две недели уже буду вампиром» — <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a>."], "places_html": "<ul>\n<li>Столица королевства: улицы, ритуальное бюро «Последний путь», дом напротив, кузница «Дизайнерская ковка <a class=\"ref\" href=\"/c/artemis-svon/\">Артемис Свон<\/a>», театр «2Т», бордель «Барсук», алкогольная лавка.<\/li>\n<li>Фракции: клан вампиров <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>; оборотни (гробовщики, городская стража); актёры театра «2Т» (подручные Бесагона).<\/li>\n<li>Артефакты: вампирские гробы (без родной земли вампиры слабеют), орден почётного режиссёра (даёт силу и регенерацию Бесагона, «бессмертие»), серебряный меч в форме языка пламени, серебряные болты и стрелы с клеймом-лебедем, гробовозка, рикша «Хулиган». Механика «очков крови».<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>11<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Справка из подкастов <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>: ответы мастера, авторов и игроков. Подкасты дополняют и уточняют, но не заменяют выпуски — канон здесь то, что прозвучало в выпуске. Номера — сноски в тексте выше. Собрано из автосубтитров, сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>11<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>3<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>2<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>1<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>1<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>4<\/small><\/button><\/div><article class=\"pnote t-clarification\" id=\"qa16-7\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>1<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Правило приглашения: вампиры свободно входят в общественные места<\/b><\/div><p>По правилам шоу вампиры входят в общественные места (таверны) без приглашения, а в жилые помещения — нет. Поэтому в таверне «Весёлый утопец» герои не смогли войти в комнату трактирщика, защищённую барьером: хозяин, который мог их пригласить, был уже убит. На вопрос, почему в выпуске 12 понадобилось приглашение в кузницу, авторы отшутились.<\/p><blockquote>«в общественные места вампиры могут заходить без приглашения, в жилые помещения заходить без приглашения не могут»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-7\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=1597\" target=\"_blank\" rel=\"noopener\">0:26:37 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa16-9\" data-type=\"plan\"><div class=\"pn-h\"><sup class=fnn>2<\/sup><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Вампирская ветка ведёт к дестабилизации столицы<\/b><\/div><p>Сюжет каждого выпуска пишут после того, как известен итог предыдущего, но общий вектор у ветвей есть. Ещё в выпуске 12 обсуждали, почему столицу до сих пор не захватили и почему выгодно стравить вампиров с оборотнями. Глобальной задачей Бесагона была дестабилизация столицы. Действие будет всё больше переноситься в столицу, и для неё заказали карту. <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> связан с «зоной разлома», на тех же землях находится и <a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a>; «всё связано, даже если кажется, что не связано».<\/p><blockquote>«глобальная задача была в двенадцатом выпуске у того же Бесагона — дестабилизировать ситуацию в столице»<\/blockquote><p class=\"note\"><a href=\"/pod/qa16/#qa16-9\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=2746\" target=\"_blank\" rel=\"noopener\">0:45:46 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa16-10\" data-type=\"clarification\"><div class=\"pn-h\"><sup class=fnn>3<\/sup><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><span class=\"tag\">возможно, шутка<\/span><b>Почему Иделаида и Антон не поехали к графу<\/b><\/div><p>На вопрос, почему <a class=\"ref\" href=\"/c/adelaida/\">Иделаида<\/a> и Антон не поехали к <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Владу Сосунеску<\/a>, авторы прямо не ответили. Прозвучали версии, что граф их не пригласил или что они с ним незнакомы, хотя <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудков<\/a> заметил, что они «кровь его крови».<\/p><p class=\"note\"><a href=\"/pod/qa16/#qa16-10\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=3008\" target=\"_blank\" rel=\"noopener\">0:50:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa16-23\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>4<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Вампирам нужны свои гробы с родной землёй<\/b><\/div><p>Вампиры приехали в <a class=\"ref\" href=\"/place/myortvye-topi/\">Мёртвые топи<\/a> со своими гробами. Если те сгорели вместе с поместьем, им придётся тяжело, но не смертельно: их прародители родом из Мёртвых топей, а родная земля помогает. В гробу лежит земля, и над ним нужно провести ритуал, чтобы он давал силы. Поэтому в выпуске 12 вампиры искали именно свои гробы, а не брали любые в похоронном бюро.<\/p><blockquote>«надо провести ритуал, чтобы этот гроб стал давать тебе силы… поэтому в двенадцатом выпуске вы побежали искать свои гробы»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa16/#qa16-23\">Подкаст по #16<\/a> · <a href=\"https://youtu.be/xh1YWZp0zQE?t=4655\" target=\"_blank\" rel=\"noopener\">1:17:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa17-10\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>5<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Знак адского вокзала — перевёрнутая «М» метро; у Бесагона была перечёркнутая V<\/b><\/div><p>Знак подземного вокзала в выпуске 17 — перевёрнутая буква «М» метро с рожками, ведь вокзал для адских поездов — пародия на метро. Зрители увидели в нём букву W. По той же причине в выпуске 12 Бесагон рисует на стене перечёркнутые клыки: в тестовой версии там была перечёркнутая буква V («вампиры»), и Шатохина долго уговаривали её убрать.<\/p><blockquote>«это просто перевёрнутый знак метро… в изначальной версии… у нас было там перечёркнутая буква V»<\/blockquote><p class=\"note\"><a href=\"/pod/qa17/#qa17-10\">Подкаст по #17<\/a> · <a href=\"https://youtu.be/VSlj32pAvNU?t=3436\" target=\"_blank\" rel=\"noopener\">0:57:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/17/\" title=\"Демонизация\">#17<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa19-2\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>6<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Панические атаки Кукояки на съёмках были настоящими<\/b><\/div><p>Авторы подтвердили, что у <a class=\"ref\" href=\"/p/denis-kukoyaka/\">Дениса Кукояки<\/a> на съёмках 5-го и 12-го выпусков действительно случались панические атаки (он убегал и возвращался), и только потом с этим связали рекламу психологического сервиса.<\/p><blockquote>«он когда приходил на пятый выпуск, у него случались панические атаки, он убегал, прибегал, мы не знали, что происходит»<\/blockquote><p class=\"note\"><a href=\"/pod/qa19/#qa19-2\">Подкаст по #19<\/a> · <a href=\"https://youtu.be/vBKoxuAzseM?t=571\" target=\"_blank\" rel=\"noopener\">0:09:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa20-19\" data-type=\"error\"><div class=\"pn-h\"><sup class=fnn>7<\/sup><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><span class=\"tag\">возможно, шутка<\/span><b>В 12-м выпуске союзниками были только волки, крыс дорисовали художницы<\/b><\/div><p>Вспоминая союз с оборотнями в 12-м выпуске, ведущие уточнили, что с героями были только волки, а крыс на иллюстрации добавили художницы.<\/p><blockquote>«только волки были, а крысы — это да, нарисовали художницы»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-19\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=1988\" target=\"_blank\" rel=\"noopener\">0:33:08 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa20-20\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>8<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Бесагон — фамильяр, получивший силу от Властона<\/b><\/div><p><a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a> (Бесагон) не был вампиром: он был тщеславным фамильяром, мечтавшим о бессмертии, но понял, что хозяин никогда его не обратит. Тогда он договорился с лордом <a class=\"ref\" href=\"/c/lord-vlaston/\">Властоном<\/a>, который дал ему инфернальный значок и задание. Фамильяры помнили его как одного из немногих, кто добился бессмертия, и боготворили — отсюда портрет в доме <a class=\"ref\" href=\"/c/genrih/\">Генриха<\/a>.<\/p><blockquote>«он понял, что его хозяин никогда не сделает его вампиром, он ушёл, договорился с лордом Властоном, инфернальный значок дал ему»<\/blockquote><p class=\"pn-fix\"><b>Расходится с конспектом выпуска:<\/b> В ep12.md сказано лишь, что силу Бесагону даёт орден; авторы уточнили, что орден (инфернальный значок) Бесагон получил от лорда <a class=\"ref\" href=\"/c/lord-vlaston/\">Властона<\/a> по договору.<\/p><p class=\"note\"><a href=\"/pod/qa20/#qa20-20\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=2118\" target=\"_blank\" rel=\"noopener\">0:35:18 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa20-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>9<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Влад Сосунеску родился из рекламного скетча Кукушкина<\/b><\/div><p>Персонажи из рекламных вставок — часть лора. <a class=\"ref\" href=\"/c/graf-vlad-sosunesku/\">Граф Влад Сосунеску<\/a> впервые появился в рекламной интеграции: <a class=\"ref\" href=\"/p/nikita-kukushkin/\">Кукушкин<\/a> за 15 минут так проработал его речь и идеологию, что авторы решили ввести его в выпуск.<\/p><blockquote>«у нас был в интеграции этот граф Влад Сосунеску… он настолько продумал себе этого персонажа»<\/blockquote><p class=\"note\"><a href=\"/pod/qa20/#qa20-34\">Подкаст по #20<\/a> · <a href=\"https://youtu.be/G4qb0pQjnR4?t=4510\" target=\"_blank\" rel=\"noopener\">1:15:10 в видео ↗<\/a> · о выпуске <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/16/\" title=\"Вампиры Мёртвых топей\">#16<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa29-21\" data-type=\"addition\"><div class=\"pn-h\"><sup class=fnn>10<\/sup><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Кто был на собрании преступной верхушки<\/b><\/div><p>Из сценария назвали участников собрания: головорезы-контрабандисты <a class=\"ref\" href=\"/c/yanus/\">Януса<\/a>; эльфийка <a class=\"ref\" href=\"/c/diana/\">Диана<\/a> Арбис, владелица острова Лесбия, состоявшая в клубе мечников и Ордене контрабандистов (вып. 8); мясник <a class=\"ref\" href=\"/c/kaban/\">Кабан<\/a>, владелец крупнейшей мясной фабрики столицы (зачарован); Робин Маран, владелец проката катамаранов в южном порту и таверны «Рыба-пила» (вып. 20), — краденое, контрабанда, подпольное казино и ставки; фальшивомонетчик господин Зуб; браконьер Джек Куклочёт, способный достать любое редкое животное; Антонио Гарбаджи (вывоз мусора); глава оборотней ритуального бюро «Последний путь» Ганс Стинки, сменивший убитого Бесагоном прежнего главу (вып. 12).<\/p><blockquote>«Это были те же люди, что в списке на заселение? — Нет, там ещё часть людей была дополнительно.»<\/blockquote><p class=\"note\"><a href=\"/pod/qa29/#qa29-21\">Подкаст по #29<\/a> · <a href=\"https://youtu.be/ISgEZBjxvG4?t=4633\" target=\"_blank\" rel=\"noopener\">1:17:13 в видео ↗<\/a> · о выпуске <a href=\"/ep/29/\" title=\"Отель &quot;Глубокий канал&quot;\">#29<\/a>, <a href=\"/ep/08/\" title=\"Покушение на короля\">#8<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/20/\" title=\"Вампирское возмездие\">#20<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa32-34\" data-type=\"backstage\"><div class=\"pn-h\"><sup class=fnn>11<\/sup><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Речные гномы родились из оговорки в «Шахтах Фогельнест»<\/b><\/div><p>Речных гномов изначально не существовало: они появились из оговорки в #5, когда участникам за час до съёмки велели придумать имена, и гном <a class=\"ref\" href=\"/c/kukanyaka/\">Кукан Яка<\/a> стал то ли «ручным», то ли «речным». Потом «ручной гном» стал фамильяром вампиров, а речные гномы — изгнанными из дома горными гномами, которые грабят суда на реке.<\/p><blockquote>«мы ещё поняли, откуда взялся речной, которых никогда не существовало. Были горные гномы»<\/blockquote><p class=\"note\"><a href=\"/pod/qa32/#qa32-34\">Подкаст по #32<\/a> · <a href=\"https://youtu.be/SdpeDKQeFQM?t=8791\" target=\"_blank\" rel=\"noopener\">2:26:31 в видео ↗<\/a> · о выпуске <a href=\"/ep/05/\" title=\"Шахты Фогельнест\">#5<\/a>, <a href=\"/ep/12/\" title=\"Бесагон - истребитель вампиров\">#12<\/a>, <a href=\"/ep/32/\" title=\"Путешествие к Нергалу\">#32<\/a><\/p><\/article><\/section>", "chars": {"Перси": {"name": "Перси", "img": null, "wiki_url": null, "summary": "", "infobox": {}, "actors": [], "kind": "npc", "dead": true, "race": "", "portraits": [], "url": "/c/persi/", "eps": [{"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров"}]}, "Дан Балан": {"name": "Дан Балан", "img": "img/chars/dan-balan.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%94%D0%B0%D0%BD_%D0%91%D0%B0%D0%BB%D0%B0%D0%BD", "summary": "Дан Бала́н — старый вампир из Мёртвых топей, патриарх вампирского клана Балан, ночной охранник круглосуточной алкогольной лавки «Красное&Красное» в Кёнигпоне.", "infobox": {"Пол": "Мужской", "Раса": "Вампир", "Тип": "Игровой", "Игрок": "Александр Гудков"}, "actors": ["Александр Гудков"], "kind
