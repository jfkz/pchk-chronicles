<script>window.EPD = {"key": "12", "label": "12", "title": "Бесагон - истребитель вампиров", "date": "2022-10-11", "minutes": 107, "duration": 6400.0, "video_id": "ock_d9eoaqI", "branch": "Вампиры Дан Балана", "branch_color": "#B03A7A", "place": "Столица королевства: ритуальное бюро «Последний путь», кузница Артемиса Свона, театр «2Т»", "short_html": "У клана вампиров <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>, тихо живущего в столице при новом короле, крадут гробы, а в городе орудует охотник Бесогон. По следу через ритуальное бюро «Последний путь» вампиры выясняют, что Бесогон подставил их, убив управляющего-оборотня. Им удаётся заключить союз с оборотнями и офицером <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, выйти через кузнеца <a class=\"ref\" href=\"/c/artemis-svon/\">Артемиса Свона<\/a> на режиссёра театра «2Т» <a class=\"ref\" href=\"/c/maykl-kou/\">Майкла Коу<\/a>. Коу оказывается Бесогоном, силу которому даёт орден. Гном-фамильяр <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> срывает орден, Дан Балан убивает Бесогона, гробы возвращены, Куканяку обращают в вампира.", "summary_html": "При новом короле вампиры столицы тихо встроились в общество, но в городе появился охотник Бесогон, который убивает только вампиров. У клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> крадут гробы; без них вампиры ослабнут и погибнут. Идя по следу через ритуальное бюро «Последний путь», вампиры обнаруживают, что Бесогон подставил их, убив управляющего-оборотня. Им удаётся заключить союз с оборотнями и офицером <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, выйти через кузнеца <a class=\"ref\" href=\"/c/artemis-svon/\">Артемиса Свона<\/a> на режиссёра театра «2Т» <a class=\"ref\" href=\"/c/maykl-kou/\">Майкла Коу<\/a>. Он и есть Бесогон, а силу ему даёт орден. Гном <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> отбирает орден, Дан Балан убивает Бесогона, гробы возвращены, а Куканяку обращают в вампира.", "outcome_html": "Бесогон убит, гробы клана возвращены, орден почётного режиссёра у <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a>. <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> стал вампиром, но укушен крысой-оборотнем.", "world_html": ["Охотник на вампиров Бесогон (<a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a>) убит", "Заключён союз вампиров клана <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балана<\/a> с оборотнями и стражей столицы", "Орден почётного режиссёра (сила Бесогона) перешёл к вампирам", "Гном <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> обращён в вампира и укушен крысой-оборотнем"], "scenes": [{"t": "0:03:19", "sec": 199, "html": "Завязка: вампиры веками были гонимы, но при новом короле работают в ночных тавернах и лавках столицы. Появился Бесогон, его портреты печатают в газетах. Ночью, пока вампиры были на оргии, у них украли гробы, на стене оставив знак — перечёркнутые клыки. Каждый вампир бросает начальный запас «очков крови» (1 очко — жертва выживает, 2 — погибает)."}, {"t": "0:04:22", "sec": 262, "html": "Представление: <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> (стал вампиром слишком поздно, в теле старика; обратил троих и возглавляет группу), Антон (жиголо, пьёт женскую кровь), <a class=\"ref\" href=\"/c/adelaida/\">Аделаида<\/a> (скромница, ставшая вампиршей, пьёт мужскую кровь в борделе «Барсук»), <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> (рикша, быстрее лошади), гном <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> (после побега из Фогельнеста — уборщик в зале для оргий, служит вампирам в надежде на обращение)."}, {"t": "0:10:56", "sec": 656, "html": "Рамочный рекламный скетч: престарелый вампир в «восточных пустошах» пересказывает эту историю своему фамильяру (повторяется по ходу выпуска)."}, {"t": "0:15:16", "sec": 916, "html": "Ночная улица, рикша с наклейкой «Хулиган». <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> запугивает влюблённую парочку, та указывает на ворота ритуального бюро «Последний путь» прямо за спинами героев. Антон пьёт кровь девушки наполовину (крит). <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> гонится за парнем с вилкой, промахивается и застревает клыками в двери; <a class=\"ref\" href=\"/c/adelaida/\">Аделаида<\/a> хватает парня, Дан Балан высасывает его досуха."}, {"t": "0:26:58", "sec": 1618, "html": "Девушка рассказывает о Бесогоне (странный костюм с рожками, неуловим, убивает только вампиров) и погибает — <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> вскрывает ей шею для Антона."}, {"t": "0:32:30", "sec": 1950, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> встревает в ограбление прохожего тремя хулиганами: раздевается догола, прыгает одному на лицо и приводит его к вампирам, но <a class=\"ref\" href=\"/c/adelaida/\">Аделаида<\/a> дважды проваливает укус, и хулиган убегает."}, {"t": "0:36:51", "sec": 2211, "html": "У бюро: сквозь стены видно двоих — один чистит гробы, другой мочится. <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> летучей мышью залетает во двор, его замечают. Гробовщики оказываются оборотнями: у вампиров с ними перемирие, но свидетели видели, что гробы увезла гробовозка «Последнего пути». Оборотни прогоняют Бека."}, {"t": "0:44:18", "sec": 2658, "html": "Антон летучей мышью проникает через единственное окно в кабинет управляющего: оборотень <a class=\"ref\" href=\"/c/persi/\">Перси<\/a> мёртв, в затылке — серебряный арбалетный болт, на стене кровью: «Вампиры правят!». На столе — заявление офицеру <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> о пропаже гробовозки. На болте клеймо «Дизайнерская ковка <a class=\"ref\" href=\"/c/artemis-svon/\">Артемис Свон<\/a>» (лебедь). Вампиров подставили."}, {"t": "0:47:33", "sec": 2853, "html": "Дом напротив: <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> просится внутрь, <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> призывает «рой» из двух крыс (Маринка и Анжелка) — хозяин-тиран в панике приглашает всех в дом. В газете — портрет Бесогона (с усами); слух: Бесогон раньше служил вампирам и теперь их ненавидит."}, {"t": "0:53:59", "sec": 3239, "html": "В кабинет врываются стражники и оборотни («Они убили <a class=\"ref\" href=\"/c/persi/\">Перси<\/a>! Вампиры объявили войну!»). Антон паучьим лазаньем уходит по потолку, по пути забирает золотую монету из чужого гроба и улетает. <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балан<\/a> выбрасывает труп в окно и сам выпрыгивает, получив удар когтей. Мёртвых есть нельзя."}, {"t": "1:00:26", "sec": 3626, "html": "Забитая жена хозяина видела, как ночью кто-то по верёвке залез в окно бюро, — это был Бесогон. Найдены серебряная стрела с клеймом Свона и бирка костюмерной театра «2Т» в куче мусора, куда он упал."}, {"t": "1:03:40", "sec": 3820, "html": "<a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> говорит с трупом <a class=\"ref\" href=\"/c/persi/\">Перси<\/a>: убийца — Бесогон, который раньше не трогал оборотней. Пароль для доверия: «Скажи <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a>, что Мария его недостойна»."}, {"t": "1:06:50", "sec": 4010, "html": "Вампиры идут к оборотням с миром; убеждение с критом — офицер стражи <a class=\"ref\" href=\"/c/albu/\">Альбу<\/a> (с золотым значком) соглашается на союз против Бесогона. <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> дерзит, и Альбу, превратившись в крысу-оборотня, кусает его. Оборотни берут след по бирке театра, вампиры едут к кузнецу."}, {"t": "1:13:14", "sec": 4394, "html": "Кузница <a class=\"ref\" href=\"/c/artemis-svon/\">Артемиса Свона<\/a>: <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> будит кузнеца байкой о богатых иностранцах, и тот приглашает вампиров. Поцелуй страсти <a class=\"ref\" href=\"/c/adelaida/\">Аделаиды<\/a> очаровывает его: стрелы заказал режиссёр театра «2Т» <a class=\"ref\" href=\"/c/maykl-kou/\">Майкл Коу<\/a>. Кузнец дарит Аделаиде серебряный меч в виде языка пламени и золотую монету."}, {"t": "1:20:48", "sec": 4848, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> пытается разбудить кузнеца, схватив «за самое дорогое», и выхватить меч; вампиры досуха выпивают Куканяку, «чтобы обратить». Голосованием его стабилизируют как человека, ему врут, что он уже вампир («инкубационный период две недели»). Кузнец вонзает <a class=\"ref\" href=\"/c/adelaida/\">Аделаиде<\/a> в спину осиновый кол; <a class=\"ref\" href=\"/c/vampir-bek/\">Вампир Бек<\/a> приказом валит его, кузнеца выпивают, кол вынимают — Аделаида восстанавливается."}, {"t": "1:28:18", "sec": 5298, "html": "Театр «2Т»: репетиция пьесы, где актёры в вампирских костюмах стоят в украденных гробах, а «оборотни» с деревянными кольями выпрыгивают из гробовозки. Между рядами разорванные трупы оборотней-союзников. <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> блефует «патриотической проверкой театров» и «пятой колонной»."}, {"t": "1:31:31", "sec": 5491, "html": "«Роковая женщина» <a class=\"ref\" href=\"/c/adelaida/\">Аделаиды<\/a> завораживает всех, Антон бежит с мечом, но Коу замечает его: «Сила Бесогона!» — орден облачает его в доспех. После перебросов монетами Антон наносит критический удар на 25 урона, но орден полностью регенерирует Бесогона; актёры с кольями встают на его защиту."}, {"t": "1:38:01", "sec": 5881, "html": "Бесогон убивает только вампиров, и живого гнома не трогает. <a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> изображает фаната, выпрашивает «что-нибудь на память» и срывает орден (успех после монеты). Бесогон превращается в беспомощного старика: «Я был таким же фамильяром, как ты, — они никогда не сделают тебя вампиром»."}, {"t": "1:41:14", "sec": 6074, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяка<\/a> отдаёт орден «деду» <a class=\"ref\" href=\"/c/dan-balan/\">Дан Балану<\/a>, тот насаживает Бесогона на меч. Орден почётного режиссёра у вампиров. Бек допрашивает труп, гробы забирают."}, {"t": "1:44:32", "sec": 6272, "html": "<a class=\"ref\" href=\"/c/kukanyaka/\">Куканяку<\/a> обращают по-настоящему (выпить кровь и дать свою), он просыпается вампиром. 8 монет — 80 000 руб. в фонд «Вместе поможем детям». Финал: «как повлияет на Куканяку укус крысы-оборотня?»"}], "key_events": [{"t": "0:03:19", "sec": 199}, {"t": "0:44:18", "sec": 2658}, {"t": "0:53:59", "sec": 3239}, {"t": "1:01:30", "sec": 3690}, {"t": "1:03:40", "sec": 3820}, {"t": "1:08:59", "sec": 4139}, {"t": "1:18:36", "sec": 4716}, {"t": "1:26:08", "sec": 5168}, {"t": "1:33:40", "sec": 5620}, {"t": "1:40:11", "sec": 6011}, {"t": "1:42:18", "sec": 6138}], "coins": {"ep": "12", "events": [{"t": "0:26:58", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "получил монету за шутку/лор о том, что вампиров нужно приглашать в дом, разговаривая с уцелевшей девушкой", "result": null, "sec": 1618, "who_url": "/c/anton/", "reason_html": "получил монету за шутку/лор о том, что вампиров нужно приглашать в дом, разговаривая с уцелевшей девушкой"}, {"t": "0:32:30", "kind": "loot", "who": "Куканяка", "actor": "Кукояка", "to": null, "reason": "попытался отобрать у уличного грабителя его последнюю золотую монету (внутриигровые деньги NPC)", "result": "не получилось — монету перехватил другой уличный бандит", "sec": 1950, "who_url": "/c/kukanyaka/", "reason_html": "попытался отобрать у уличного грабителя его последнюю золотую монету (внутриигровые деньги NPC)"}, {"t": "0:57:14", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "успешно схватил золотую монету из чужого гроба (акробатика 15) во время побега от стражи, монету зачли в общий счёт", "result": null, "sec": 3434, "who_url": "/c/anton/", "reason_html": "успешно схватил золотую монету из чужого гроба (акробатика 15) во время побега от стражи, монету зачли в общий счёт"}, {"t": "0:59:22", "kind": "earn", "who": "Антон", "actor": "Шастун", "to": null, "reason": "получил монету за хорошее знание вампирского лора (нельзя есть мертвецов для восстановления здоровья)", "result": null, "sec": 3562, "who_url": "/c/anton/", "reason_html": "получил монету за хорошее знание вампирского лора (нельзя есть мертвецов для восстановления здоровья)"}, {"t": "1:03:40", "kind": "earn", "who": null, "actor": null, "to": null, "reason": "получил монету за лор-факт про оборотней (обращение работает не через укус, а через родство)", "result": null, "sec": 3820, "who_url": null, "reason_html": "получил монету за лор-факт про оборотней (обращение работает не через укус, а через родство)"}, {"t": "1:19:41", "kind": "earn", "who": "Аделаида", "actor": "Галич", "to": null, "reason": "получила монету за успешное обольщение кузнеца ради информации", "result": null, "sec": 4781, "who_url": "/c/adelaida/", "reason_html": "получила монету за успешное обольщение кузнеца ради информации"}, {"t": "1:34:46", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "потратил монету на переброс атаки против Бесогона после критического провала", "result": null, "sec": 5686, "who_url": "/c/anton/", "reason_html": "потратил монету на переброс атаки против Бесогона после критического провала"}, {"t": "1:35:20", "kind": "spend", "who": "Антон", "actor": "Шастун", "to": null, "reason": "потратил вторую монету на ещё один переброс той же атаки", "result": "в итоге критический успех, двойной урон (25 урона), Бесогон серьёзно ранен", "sec": 5720, "who_url": "/c/anton/", "reason_html": "потратил вторую монету на ещё один переброс той же атаки"}, {"t": "1:39:08", "kind": "spend", "who": "Куканяка", "actor": "Кукояка", "to": null, "reason": "потратил монету на переброс проверки ловкости рук (с помехой), чтобы сорвать орден с груди режиссёра", "result": "переброс дал успех — орден сорван", "sec": 5948, "who_url": "/c/kukanyaka/", "reason_html": "потратил монету на переброс проверки ловкости рук (с помехой), чтобы сорвать орден с груди режиссёра"}, {"t": "1:43:26", "kind": "earn", "who": "Куканяка", "actor": "Кукояка", "to": null, "reason": "получил монету за успешный трюк с орденом и финальную сцену с дедом", "res
