<script>window.EPD = {"anim": false, "key": "31", "label": "31", "title": "Культ Кракена", "date": "2024-10-26", "minutes": 117, "duration": 7025.0, "video_id": "VtE9ZAhF03E", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Остров Соблазна, движущийся к Чёрному Геленбургу; внутренности кракена", "short_html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> возвращается на захваченный демонами остров Соблазна, который порабощённый кракен тащит к Чёрному <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургу<\/a>.", "summary_html": "После гибели <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> на небесах (#27) <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> возвращается через портал на <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров Соблазна<\/a> — теперь его захватили демоны и тащит к Чёрному <a class=\"ref\" href=\"/place/gelenburg/\">Геленбургу<\/a> порабощённый кракен, чтобы Тёмный властелин (<a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a>) смог воспользоваться порталом в небесный мир. Вместе с грифоном <a class=\"ref\" href=\"/c/grifon-andrey/\">Андреем<\/a>, освобождённым русалом <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерионом<\/a>, призванным колокольчиком ангелом <a class=\"ref\" href=\"/c/angelin/\">Ангелином<\/a> и феей <a class=\"ref\" href=\"/c/milfeya/\">Милфеей<\/a> Талала узнаёт от старейшины русалов, что кракену скормили паразита, проникает внутрь кракена и находит в его мозгу источник морока — своего погибшего брата Динь-Диня, ставшего демоническим существом. Ангелин подписывает демонический контракт и становится падшим ангелом; Талала с помощью <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a> освобождает душу брата, убив его мечом. Освобождённый кракен громит демонов, а Талала, наконец подчинив себе говорящий меч, уничтожает кристалл портала.", "outcome_html": "Портал уничтожен, демоны на острове перебиты, кракен свободен. <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a> окончательно погиб, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> стал падшим ангелом и при смерти.", "world_html": ["Портал в небесный мир на <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Острове Соблазна<\/a> уничтожен — <a class=\"ref\" href=\"/c/lord-vlaston/\">Властон<\/a> лишился пути на небеса", "<a class=\"ref\" href=\"/c/kraken-vk/\">Кракен ВК<\/a> освобождён от демонического паразита и враждебен демонам", "Душа Динь-Диня освобождена из ада", "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> стал падшим ангелом на службе демонической армии", "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> подчинила меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>»"], "scenes": [{"t": "0:01:14", "sec": 74, "html": "Пересказ: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> через портал на <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Острове Соблазна<\/a> попали на небеса; боги (кроме бога Солнца <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>) отказались помогать людям; верховная богиня <a class=\"ref\" href=\"/c/venera/\">Венера<\/a> хотела убить героев, Пахом ценой жизни вернул Талалу к порталу."}, {"t": "0:03:56", "sec": 236, "html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> несёт дары <a class=\"ref\" href=\"/c/gelius/\">Гелиоса<\/a>: золотой меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>», магическую скрижаль для связи с богом («телефончик») и колокольчик призыва боевого ангела. Из портала вместе с ней вышел только грифон <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> — бывший скакун Гелиоса, уступившего верховную власть дочери."}, {"t": "0:07:42", "sec": 462, "html": "<a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров Соблазна<\/a> разорён демонами и движется: его тянет огромный кракен, щупальца которого прибиты к земле сваями из дьявольской стали, — курс на дым Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>. Цель героев — уничтожить портал в небесный мир, пока он не попал в цитадель демонов."}, {"t": "0:08:30", "sec": 510, "html": "На месте бывшего святилища богини Давы демоны приносят в жертву островитян и русалов на кровавой пентаграмме; погибает знакомый <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> Мои. Талала (владеет всеми языками) понимает: души жертв уходят в кракена."}, {"t": "0:11:50", "sec": 710, "html": "Бой с роем адских куриц и демонами. [0:14:03] Меч «<a class=\"ref\" href=\"/a/kara-geliosa/\">Кара Гелиоса<\/a>» оказывается говорящим (бывшая душа паладина) и сексистом: он не признаёт «девчонку» и не даёт ей бонусов."}, {"t": "0:16:56", "sec": 1016, "html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> разбивает клетку и освобождает русала <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутериона<\/a>, который мечтает спасти своего бога-кракена. [0:20:27] Его горн призыва проваливается и привлекает крылатых демонов."}, {"t": "0:21:19", "sec": 1279, "html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> звонит в колокольчик — является боевой ангел <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a>; он зачаровывает куриц, <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> уводит воздушный рой; [0:27:48] из портала появляются валькирии («Хватайте воровку!»), Андрей стравливает их с демонами, демоны сковывают портал адскими цепями."}, {"t": "0:31:19", "sec": 1879, "html": "Фея <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> прячет героев в лесу: её часть острова откололась; снять морок с кракена может только старейшина русалов <a class=\"ref\" href=\"/c/klak-klak/\">Клак-Клак<\/a>, дед <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутериона<\/a>."}, {"t": "0:33:44", "sec": 2024, "html": "<a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> договаривается с акулами, пожирающими тела жертв, дарит их вожаку жемчужину дружбы и узнаёт, что деда подвесили у бассейна в доме."}, {"t": "0:38:12", "sec": 2292, "html": "Бой у бассейна: деда спасают, <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> критом пронзает беса трезубцем, <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> собирает выбитые зубы старика. [0:51:04] При бегстве <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрея<\/a> преследуют крылатые демоны — их утаскивают под воду акулы-«братья»."}, {"t": "0:55:12", "sec": 3312, "html": "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> лечит деда и всех, раздав почти всё своё здоровье. [1:00:35] <a class=\"ref\" href=\"/c/klak-klak/\">Клак-Клак<\/a> (под чарами <a class=\"ref\" href=\"/c/milfeya/\">Милфеи<\/a>) рассказывает: русалы, мечтая избавиться от туристов и Давы, поверили демонам; ритуальным барабаном призвали кракена, а бесы скормили ему паразита, поработившего бога. Нужно проникнуть внутрь кракена и уничтожить паразита."}, {"t": "1:04:05", "sec": 3845, "html": "<a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> вспоминает: ритуальный барабан русалов успокаивает кракена, пока звучит. Краб-напарник Крэпс, обидевшись на слово «шаха», за беляш выдаёт, что барабан на восточном пляже у лобного места."}, {"t": "1:06:53", "sec": 4013, "html": "Музыкальная вставка — песня «<a class=\"ref\" href=\"/c/gnomka-talala/\">Гномка Талала<\/a>»."}, {"t": "1:12:52", "sec": 4372, "html": "На пляже пьющие демоны используют барабан как стол; меч переводит: «осталось немного до <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, портал окажется на месте». <a class=\"ref\" href=\"/c/milfeya/\">Милфея<\/a> желанием создаёт бутылку, <a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> наполняет её святой водой — демоны выпивают её и гибнут. Герои забирают барабан и схему кракена (план демонов по проникновению)."}, {"t": "1:18:22", "sec": 4702, "html": "Проникновение через клюв: поток воды уносит <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> в желудочную кислоту (−29 HP, без сознания); <a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> вытаскивает его, <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> лечит словом."}, {"t": "1:23:22", "sec": 5002, "html": "В черепной коробке под мозгом — пентаграмма и существо в коконе, абсолютное зло с искрой света. Голос кажется <a class=\"ref\" href=\"/c/gnomka-talala/\">Талале<\/a> знакомым. Кракен в ярости пробивает себе глаз щупальцем; <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> бьёт в барабан."}, {"t": "1:29:36", "sec": 5376, "html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> переругивает меч и заставляет его подчиниться: «Слушаюсь и повинуюсь, моя госпожа» — у неё появляется Сила +7. <a class=\"ref\" href=\"/a/svyataya-voda/\">Святая вода<\/a> <a class=\"ref\" href=\"/c/milfeya/\">Милфеи<\/a> раскрывает кокон — внутри гном в шутовской шляпе: брат Талалы <a class=\"ref\" href=\"/c/din-din/\">Динь-Динь<\/a>."}, {"t": "1:36:50", "sec": 5810, "html": "<a class=\"ref\" href=\"/c/angelin/\">Ангелин<\/a> пытается увести Динь-Диня «ангельским паспортом», но в итоге сам присягает демонической армии за «5 рублей жизни» — становится падшим ангелом (кожа-магма, костяные крылья, чёрный меч). <a class=\"ref\" href=\"/c/bulbatarion/\">Бульбутерион<\/a> протыкает его трезубцем; Ангелин при смерти, его душу забирает ад."}, {"t": "1:40:16", "sec": 6016, "html": "Щупальце ломает <a class=\"ref\" href=\"/c/milfeya/\">Милфею<\/a>, грифон тоже на нуле. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> связывается через скрижаль с <a class=\"ref\" href=\"/c/gelius/\">Гелиосом<\/a>: тот не может спасти <a class=\"ref\" href=\"/c/angelin/\">Ангелина<\/a> (душа принадлежит аду), но распутывает Динь-Диня божественной силой."}, {"t": "1:44:16", "sec": 6256, "html": "<a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> пронзает брата мечом, освобождая его душу («Спасибо, сестра»); морок с кракена снят."}, {"t": "1:45:37", "sec": 6337, "html": "<a class=\"ref\" href=\"/c/kraken-vk/\">Кракен ВК<\/a> (<a class=\"ref\" href=\"/p/ilya-sobolev/\">Илья Соболев<\/a>) освобождён; с травмой мозга и в ярости, он хочет жертв, но барабан и уговоры сдерживают его. Он отрывает щупальца от свай (одно — с корнем) и, вспомнив голос погибшей матери, сотнями уничтожает демонов."}, {"t": "1:53:52", "sec": 6832, "html": "<a class=\"ref\" href=\"/c/grifon-andrey/\">Андрей<\/a> высаживает <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a> у портала; меч признаёт её королевой, и она одним ударом разрушает кристалл портала — вспышка божественной энергии уничтожает демонов на острове. 60 000 руб. отправлены на благотворительность."}], "key_events": [{"t": "0:07:42", "sec": 462}, {"t": "0:14:46", "sec": 886}, {"t": "0:16:56", "sec": 1016}, {"t": "0:38:12", "sec": 2292}, {"t": "1:00:58", "sec": 3658}, {"t": "1:12:52", "sec": 4372}, {"t": "1:29:36", "sec": 5376}, {"t": "1:36:50", "sec": 5810}, {"t": "1:44:16", "sec": 6256}, {"t": "1:52:13", "sec": 6733}, {"t": "1:55:14", "sec": 6914}], "coins": {"ep": "31", "events": [{"t": "0:28:38", "kind": "earn", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "находчиво увёл отряд демонов на валькирий вместо Талалы", "result": null, "sec": 1718, "who_url": "/c/grifon-andrey/", "reason_html": "находчиво увёл отряд демонов на валькирий вместо <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>"}, {"t": "0:32:38", "kind": "earn", "who": "Милфея", "actor": "Александра Бортич", "to": null, "reason": "в шутку выпросила монетку «за ожидание» опоздавшего актёра, пришедшего в шлёпках", "result": null, "sec": 1958, "who_url": "/c/milfeya/", "reason_html": "в шутку выпросила монетку «за ожидание» опоздавшего актёра, пришедшего в шлёпках"}, {"t": "0:36:11", "kind": "earn", "who": "Бульбутерион", "actor": "Слава Копейкин", "to": null, "reason": "отдал акуле свою самую ценную вещь — жемчужину дружбы, — чтобы узнать, где держат деда", "result": null, "sec": 2171, "who_url": "/c/bulbatarion/", "reason_html": "отдал акуле свою самую ценную вещь — жемчужину дружбы, — чтобы узнать, где держат деда"}, {"t": "0:43:55", "kind": "earn", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "в уме быстро сложил и вычел урон, посчитав остаток здоровья", "result": null, "sec": 2635, "who_url": "/c/angelin/", "reason_html": "в уме быстро сложил и вычел урон, посчитав остаток здоровья"}, {"t": "0:46:04", "kind": "earn", "who": "Грифон Андрей", "actor": "BRB", "to": null, "reason": "эмоциональная подначка Талалы фразой «хватит парить мозги», чтобы та взялась за меч", "result": null, "sec": 2764, "who_url": "/c/grifon-andrey/", "reason_html": "эмоциональная подначка <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> фразой «хватит парить мозги», чтобы та взялась за меч"}, {"t": "0:47:22", "kind": "spend", "who": "Талала", "actor": "Александр Гудков", "to": null, "reason": "потратила монету на переброс проверки, чтобы разумный меч подчинился", "result": "переброс не помог, поднять меч не получилось", "sec": 2842, "who_url": "/c/gnomka-talala/", "reason_html": "потратила монету на переброс проверки, чтобы разумный меч подчинился"}, {"t": "0:48:43", "kind": "spend", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "потратил монету на переброс атаки мечом", "result": null, "sec": 2923, "who_url": "/c/angelin/", "reason_html": "потратил монету на переброс атаки мечом"}, {"t": "0:58:20", "kind": "earn", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "за щедрость — отдал всё своё здоровье, чтобы вылечить деда и союзников", "result": null, "sec": 3500, "who_url": "/c/angelin/", "reason_html": "за щедрость — отдал всё своё здоровье, чтобы вылечить деда и союзников"}, {"t": "1:11:47", "kind": "spend", "who": "Ангелин", "actor": "Гоген Солнцев", "to": null, "reason": "монету забрали в наказание за подлизывание крабу, из-за чего краб получил атаку с преимуществом", "result": "краб вцепился в нос, 3 урона", "sec": 4307, "who_url": "/c/angelin/", "reason_html": "монету забрали в наказание за подлизывание крабу, из-за чего краб получил атаку с  "who_url": "/c/bulbatarion/", "reason_html": "потратил монету на переброс атаки трезубцем по одержимому демоном <a class=\"ref\" href=\"/c/angelin/\">Ангелину<\/a>"}, {"t": "1:56:05", "kind": "other", "who": null, "actor": null, "to": null, "reason": "в конце игры оставшиеся 2 монеты конвертировали в благотворительный взнос броском d6 (выпало 4) — итог 60 000 руб.", "result": null, "sec": 6965, "who_url": null, "reason_html": "в конце игры оставшиеся 2 монеты конвертировали в благотворительный взнос броском d6 (выпало 4) — итог 60 000 руб."}], "totals": [{"who": "Талала", "actor": "Александр Гудков", "earned": 1, "spent": 2, "img": "img/chars/talala.webp", "who_url": "/c/gnomka-talala/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Грифон Андрей", "actor": "BRB", "earned": 2, "spent": 0, "img": "img/chars/andrej.webp", "who_url": "/c/grifon-andrey/", "actor_url": "/p/brb/"}, {"who": "Бульбутерион", "actor": "Слава Копейкин", "earned": 1, "spent": 1, "img": "img/chars/bul-buterion.webp", "who_url": "/c/bulbatarion/", "actor_url": "/p/slava-kopeykin/"}, {"who": "Ангелин", "actor": "Гоген Солнцев", "earned": 2, "spent": 4, "img": "img/chars/angelin.webp", "who_url": "/c/angelin/", "actor_url": "/p/gogen-solncev/"}, {"who": "Милфея", "actor": "Александра Бортич", "earned": 1, "spent": 0, "img": "img/chars/milfeya.webp", "who_url": "/c/milfeya/", "actor_url": "/p/aleksandra-bortich/"}], "notes": "Бульбутерион собирал зубы демонов для отложенного обмена на золотую монету «после боя», но сама сделка в кадре не показана, поэтому в события не включена. В финале серии непотраченные монеты (2 шт.) конвертировали в благотворительный взнос через бросок d6."}, "cast": [{"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, бардесса; носитель меча «Кара Гелиоса»", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {
