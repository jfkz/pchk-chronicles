<script>window.EPD = {"anim": false, "key": "25", "label": "25", "title": "Остров соблазна", "date": "2024-03-18", "minutes": 109, "duration": 6527.0, "video_id": "ngYbqdzpTsQ", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Остров соблазна — курортный остров в море у берегов Понии", "short_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> ищет на острове Соблазна инженера <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a>, чтобы открыть портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>.", "summary_html": "Через год после #17 у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> всё ещё хранится большой кристалл телепортации. Он хочет открыть с его помощью портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> и призвать ангелов против демонов Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>, но кристалл нестабилен, и нужен инженер <a class=\"ref\" href=\"/c/kasper/\">Каспер<\/a> с курортного острова Соблазна. Островом правит «хозяйка» <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>: падшая богиня родовых схваток и крепких ногтей, которая объявила себя верховной богиней. Она питается любовью островитян, а нарушителей превращает в животных и скармливает остальным на празднике новолуния. Герои расколдовывают Каспера и его друзей, разоблачают Даву перед толпой и заталкивают кристалл ей в горло. Божественная сущность стабилизирует кристалл, и Дава становится порталом в Небесный мир.", "outcome_html": "<a class=\"ref\" href=\"/c/dava/\">Дава<\/a> погибла, превратившись в портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>; пленники острова свободны. Все герои живы.", "world_html": ["Открыт портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> — боги могут вступить в войну с демонами", "Большой кристалл телепортации израсходован (стабилизирован богиней)", "Власть Давы над островом Соблазна пала", "Подтверждено: в Небесном мире положение богов зависит от любви смертных"], "scenes": [{"t": "0:00:03–0:01:08", "sec": null, "html": "Предыстория: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл телепортации, но <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> исполнил адский контракт, и <a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> стал цитаделью Тёмного Властелина. Прошёл год."}, {"t": "0:04:25", "sec": 265, "html": "Задача от мастера: призвать через кристалл ангелов, а для этого перенастроить его руками изобретателя <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> с острова Соблазна, райского места, куда бегут от проблем жители <a class=\"ref\" href=\"/place/poniya/\">Понии<\/a>. Отряд приплыл на шхуне."}, {"t": "0:05:22–0:10:40", "sec": null, "html": "Герои представляются. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> признаёт, что предотвратить апокалипсис не удалось; малый кристалл в ладони тянет из него жизнь, и лечение не помогает. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> после гибели брата Динь-Диня и друга <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> пила и хотела покончить с собой, но её спасла коуч <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a>. Лосик родом из геленбургской семьи тюремщиков и основала школу духовных практик «Космическая воронка». Её брат <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> служил тюремщиком в <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнесте<\/a>, пережил там трагедию, отказался от насилия и уехал к сестре. Их престарелые родители остались в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>."}, {"t": "0:10:40–0:13:53", "sec": null, "html": "У пирса отряд встречают улыбчивые островитяне. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> гадает на Таро и вытягивает «Дьявола» и «Башню». <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> оставляют в трюме с пятью матросами, на мачте сажают опоссума-«камеру»."}, {"t": "0:13:53–0:20:19", "sec": null, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> спускается первым. Хозяйка острова <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> передаёт гостей помощнику Мую. Правила острова: нельзя убивать и воровать, всегда улыбаться, почитать Даву, не рыгать. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> очаровывает Муя, и тот рассказывает, что <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> «застукали на запретном пляже» и он пропал. Сегодня ночью — праздник новолуния."}, {"t": "0:22:27–0:26:44", "sec": null, "html": "<a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> флиртуют с Муем. У Талалы критический успех: Муй проговаривается, что запретный пляж на западе и его охраняют русалы."}, {"t": "0:27:46–0:33:10", "sec": null, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> ныряет за борт, его перехватывает синекожий русал <a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a> (бирка «охрана острова, № 1227») и дарит жемчужину, «символ дружбы». Русалы ходят по суше на руках."}, {"t": "0:34:13–0:42:48", "sec": null, "html": "У кухни <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> усыпляет повара песней, и русалы выносят ей первое предупреждение. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> с помощью монеты-переброса насылает на русалов понос, и те прыгают в море. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> забирает у спящего повара золотую монету."}, {"t": "0:40:39–0:44:58", "sec": null, "html": "В запертом сарае находят дневник <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> и привязанного кабана. <a class=\"ref\" href=\"/c/kaban/\">Кабана<\/a> отпускают, он бежит на запад. В дневнике Каспер пишет, что стал фаворитом Давы, за что Муй на него косится, что был в святилище и понял «секрет Давы». Дальше страницы вырваны."}, {"t": "0:43:51–0:53:22", "sec": null, "html": "У святилища на скале <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> «парализует» одну служительницу натальной картой. Невидимый слуга <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> Игорь выходит из-под контроля и нападает на вторую девушку, Людочку. Талала лжёт русалам и получает второе предупреждение. Лосик очаровывает русала «космической воронкой», целует его (у него раздвоенный язык), и русалы уходят. Людочку уводят с собой."}, {"t": "0:52:29–1:03:17", "sec": null, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> идёт на виллу Давы. Островитянин <a class=\"ref\" href=\"/c/kil/\">Киль<\/a> по приказу Муя стрижёт газон зубами. В спальне лежит рукописная «История одной прекрасной богини», где небесные боги названы «бесполезными крылатыми червями». Под матрасом — страница дневника <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a>: <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> — падшая богиня из Небесного мира; нарушителя Кики после третьего предупреждения она превратила в козла, и его съели на празднике (шкура лежит у камина). Пшен забирает страницу и шкуру и откупается от русала <a class=\"ref\" href=\"/c/dulk/\">Дулька<\/a> (брата <a class=\"ref\" href=\"/c/bulk/\">Булька<\/a>) той самой жемчужиной, передав её изо рта в рот."}, {"t": "1:03:17–1:06:31", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> идёт по следам кабана к запретному пляжу, обманывает русала иллюзией кабана на обрыве и убегает в пещеру."}, {"t": "1:06:31–1:11:54", "sec": null, "html": "На вершине скалы стоят пагода и статуя четырёхрукой женщины с подписью «<a class=\"ref\" href=\"/c/dava/\">Дава<\/a>, верховная богиня острова Соблазна». Там же лежит «Книга превращений и развращений»: чтобы вернуть животному человеческий облик, его нужно трижды кувыркнуть назад. Людочка рассказывает, что на ритуалах Дава вырастает от любви островитян. Под свежей штукатуркой находят настоящую надпись: «Дава, богиня родовых схваток и крепких ногтей»."}, {"t": "1:11:54–1:15:02", "sec": null, "html": "<a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> «рассчитывает Людочке кармическую задачу», и та соглашается стать пророком и открыть острову правду о Даве."}, {"t": "1:16:06–1:18:16", "sec": null, "html": "На лобном месте <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> с Килем находят «секретик» с ещё одной страницей дневника. <a class=\"ref\" href=\"/c/kasper/\">Каспер<\/a> спрятал превращённых друзей, Элли, <a class=\"ref\" href=\"/c/bertu/\">Берту<\/a> и Пуха, в пещере на запретном пляже: <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> обратила их в животных за подготовку побега. Островитяне раз в месяц едят превращённых соседей. На скамейке вырезано «Дава, тебя никто не любит» с подписью Каспера."}, {"t": "1:18:16–1:25:47", "sec": null, "html": "Появляется <a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a>, съевший что-то после поноса. Он проглатывает страницу, <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> оглушает его дубиной «Вика», забирает грязный горн и жемчужину, вспарывает брюхо осколком зеркала, попадает в сердце и убивает русала."}, {"t": "1:25:47–1:32:16", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> обрушивает вход в пещеру алмазным молотом. Внутри он находит кабана, оленя и жабу с человеческими ногами и голубя с человеческой головой, это Пух. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> сообщает ему способ превращения, и Пахом кувырками расколдовывает всех: <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a>, Пуха, Элли и <a class=\"ref\" href=\"/c/bertu/\">Берту<\/a>."}, {"t": "1:32:16–1:34:23", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> телепортирует всех в трюм к большому кристаллу. <a class=\"ref\" href=\"/c/kasper/\">Каспер<\/a> объясняет, что демоны перебрасывали этими кристаллами целые армии. Стабилизировать кристалл можно в святилище бога или демона (светлое откроет <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>, демоническое — ад) либо поместив его внутрь божества: богиня, возможно, погибнет, но её сущность откроет портал."}, {"t": "1:34:23–1:40:50", "sec": null, "html": "На закате к святилищу поднимается праздничная процессия, и появляется <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>. От песен островитян она растёт, у неё появляются ещё две руки. Она признаётся: на Небесах всё решает любовь, ей надоело быть «третьесортной богиней родов и ноготочков», и она сама сделала себя верховным божеством, а животных создаёт, потому что только они любят беззаветно. Дава превращает <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a> в зайца, но та откувыркивается обратно. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> и Талала обращаются к толпе, Людочка их поддерживает. Люди в замешательстве, богиня уменьшается и в ярости бьёт героинь."}, {"t": "1:40:50–1:46:13", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с четырьмя голыми расколдованными и кристаллом телепортируется в святилище. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> вызывает у Давы «тотальный зевок», Пахом телекинезом загоняет кристалл ей в рот, и тот застревает в горле. Лосик волшебной рукой касается кристалла: «Большой кристалл, открой большой портал». Даву сминает в мерцающую точку, из которой возникает портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>."}, {"t": "1:47:19", "sec": 6439, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> с козлиной шкурой бежит к толпе, но та уже кричит «не любим её». Монеты — 70 000 ₽ на благотворительность. Финал: «Придут ли боги на помощь людям и вступят ли в войну с демонами — в новых выпусках»."}], "key_events": [{"t": "0:04:25", "sec": 265}, {"t": "0:15:10", "sec": 910}, {"t": "0:41:10", "sec": 2470}, {"t": "0:56:47", "sec": 3407}, {"t": "1:08:27", "sec": 4107}, {"t": "1:11:14", "sec": 4274}, {"t": "1:24:18", "sec": 5058}, {"t": "1:30:55", "sec": 5455}, {"t": "1:33:38", "sec": 5618}, {"t": "1:37:16", "sec": 5836}, {"t": "1:45:28", "sec": 6328}], "coins": {"ep": "25", "events": [{"t": "0:20:29", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Вежливо и этично расспросил Каспера про пропавшего человека вместо давления — очаровал его как друга.", "result": null, "sec": 1229, "who_url": "/c/medium-pahom/", "reason_html": "Вежливо и этично расспросил <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> про пропавшего человека вместо давления — очаровал его как друга."}, {"t": "0:21:01", "kind": "spend", "who": "Талала", "actor": "Гудков", "to": null, "reason": "Потратил монету за право называть нового встреченного персонажа «Муй» до конца выпуска.", "result": null, "sec": 1261, "who_url": "/c/gnomka-talala/", "reason_html": "Потратил монету за право называть нового встреченного персонажа «Муй» до конца выпуска."}, {"t": "0:25:16", "kind": "earn", "who": "Талала", "actor": "Гудков", "to": null, "reason": "За талантливое представление команды пришедшим на пляж местным жителям.", "result": null, "sec": 1516, "who_url": "/c/gnomka-talala/", "reason_html": "За талантливое представление команды пришедшим на пляж местным жителям."}, {"t": "0:29:45", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Использовал способность «Громогласный приказ» на стража-русала и отдал мирный приказ «Пропусти» вместо угрозы его жизни.", "result": null, "sec": 1785, "who_url": "/c/medium-pahom/", "reason_html": "Использовал способность «Громогласный приказ» на стража-русала и отдал мирный приказ «Пропусти» вместо угрозы его жизни."}, {"t": "0:38:24", "kind": "spend", "who": "Лосик", "actor": "Олеся Иванченко", "to": null, "reason": "Потратила две монеты подряд (на доп. кубик и на полный переброс), чтобы наложить заклинание «понос» на стаю русалов.", "result": "В итоге критическая удача — русалы обделались и разбежались.", "sec": 2304, "who_url": "/c/losik/", "reason_html": "Потратила две монеты подряд (на доп. кубик и на полный переброс), чтобы наложить заклинание «понос» на стаю русалов."}, {"t": "0:39:45", "kind": "earn", "who": "Лосик", "actor": "Олеся Иванченко", "to": null, "reason": "Заклинание сработало — комичный план с русалами удался.", "result": null, "sec": 2385, "who_url": "/c/losik/", "reason_html": "Заклинание сработало — комичный план с русалами удался."}, {"t": "0:40:17", "kind": "loot", "who": "Пахом", "actor": "BRB", "to": null, "reason": "При обыске кухни нашёл золотую монету в кармане спящего повара.", "result": null, "sec": 2417, "who_url": "/c/medium-pahom/", "reason_html": "При обыске кухни нашёл золотую монету в кармане спящего повара."}, {"t": "0:56:27", "kind": "spend", "who": "Пшен", "actor": "Дмитрий Журавлёв", "to": null, "reason": "Потратил монету на переброс проверки внимания при осмотре спальни богини Давы (дневник на кровати).", "result": null, "sec": 3387, "who_url": "/c/pshen/", "reason_html": "Потратил монету на переброс проверки внимания при осмотре спальни богини Давы (дневник на кровати)."}, {"t": "1:14:31", "kind": "earn", "who": "Лосик", "actor": "Олеся Иванченко", "to": null, "reason": "Успешно обманула (с преимуществом) жительницу острова, убедив её раскрыть правду о богине Даве — сильная речь.", "result": null, "sec": 4471, "who_url": "/c/losik/", "reason_html": "Успешно обманула (с преимуществом) жительницу острова, убедив её раскрыть правду о богине Даве — сильная речь."}, {"t": "1:28:40", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Задал разумный вопрос о том, что услышанное за игровым столом становится общим знанием персонажей — мастер согласился.", "result": null, "sec": 5320, "who_url": "/c/medium-pahom/", "reason_html": "Задал разумный вопрос о том, что услышанное за игровым столом становится общим знанием персонажей — мастер согласился."}], "totals": [{"who": "Пахом", "actor": "BRB", "earned": 3, "spent": 0, "img": "img/chars/pahom.webp", "who_url": "/c/medium-pahom/", "actor_url": "/p/brb/"}, {"who": "Талала", "actor": "Гудков", "earned": 1, "spent": 1, "img": "img/chars/talala.webp", "who_url": "/c/gnomka-talala/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Лосик", "actor": "Олеся Иванченко", "earned": 2, "spent": 2, "img": "img/chars/losik.webp", "who_url": "/c/losik/", "actor_url": "/p/olesya-ivanchenko/"}, {"who": "Пшен", "actor": "Дмитрий Журавлёв", "earned": 0, "spent": 1, "img": "img/chars/pshen.webp", "who_url": "/c/pshen/", "actor_url": "/p/dmitriy-zhuravlyov/"}], "notes": "В конце выпуска — традиционный бросок d6 для благотворительного фонда, не учтён как игровое событие. Найденная в кармане повара монета (0:39:35) — это внутриигровой лут, а не награда за отыгрыш, поэтому отмечена как loot."}, "cast": [{"name": "Пахом", "actor": "BRB (Big Russian Boss)", "actor_url": "/p/brb/", "race": "человек, медиум", "role": "", "fate": "выжил", "id": "Пахом", "url": "/c/medium-pahom/", "img": "img/chars/pahom.webp", "other": [{"key": "04", "label": "4", "title": "Дворец Лорда Властона"}, {"key": "06", "label": "6", "title": "Адский поезд"}, {"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "17", "label": "17", "title": "Демонизация"}, {"key": "21a", "label": "21a", "title": "Часть 1 Судьба Властона"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}]}, {"name": "Талала", "actor": "Александр Гудков", "actor_url": "/p/aleksandr-gudkov/", "race": "гномка, бард", "role": "", "fate": "выжила", "id": "Талала", "url": "/c/gnomka-talala/", "img": "img/chars/talala.webp", "other": [{"key": "10", "label": "10", "title": "Храм Юмора"}, {"key": "27", "label": "27", "title": "Достучаться до небес"}, {"key": "31", "label": "31", "title": "Культ Кракена"}, {"key": "38", "label": "38", "title": "Возлюбленная"}, {"key": "42", "label": "42", "title": "Чудная Долина"}, {"key": "51", "label": "51", "title": "Точка невозврата"}]}, {"name": "Лосик", "actor": "Олеся Иванченко", "actor_url": "/p/olesya-ivanchenko/", "race": "человек, волшебница-астролог", "role": "", "fate": "выжила", "id": "Лосик", "url": "/c/losik/", "img": "img/chars/losik.webp", "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}]}, {"name": "Пшен", "actor": "Дмитрий Журавлёв", "actor_url": "/p/dmitriy-zhuravlyov/", "race": "человек, воин (бывший тюремщик)", "role": "", "fate": "выжил", "id": "Пшен", "url": "/c/pshen/", "img": "img/chars/pshen.webp", "other": []}], "npcs": [{"name": "Дава", "actor": "", "actor_url": null, "race": "", "role": "хозяйка острова, падшая богиня родовых схваток и крепких ногтей, самопровозглашённая верховная богиня", "fate": "погибла — кристалл превратил её в портал в Небесный мир", "id": "Дава", "url": "/c/dava/", "img": "img/chars/dava.webp", "other": []}, {"name": "Муй", "actor": "", "actor_url": null, "race": "", "role": "помощник Давы, устроитель праздников", "fate": "выжил", "id": "Муй", "url": "/c/moi/", "img": null, "other": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key": "31", "label": "31", "title": "Культ Кракена"}]}, {"name": "Каспер", "actor": "", "actor_url": null, "race": "", "role": "изобретатель из Геленбурга, превращён в кабана", "fate": "расколдован", "id": "Каспер", "url": "/c/kasper/", "img": "img/chars/kasper.webp", "other": []}, {"name": "Пух", "actor": "", "actor_url": null, "race": "", "role": "друг Каспера, превращён в голубя", "fate": "расколдован", "id": "Пух", "url": "/c/puh/", "img": null, "other": []}, {"name": "Элли", "actor": "", "actor_url": null, "race": "", "role": "подруга Каспера, превращена в жабу", "fate": "расколдована", "id": "Элли", "url": "/c/elli/", "img": "img/chars/elli.webp", "other": []}, {"name": "Берту", "actor": "", "actor_url": null, "race": "", "role": "друг Каспера, превращён в оленя", "fate": "расколдован", "id": "Берту", "url": "/c/bertu/", "img": null, "other": []}, {"name": "Кики", "actor": "", "actor_url": null, "race": "", "role": "островитянин, превращён в козла", "fate": "погиб, съеден на празднике новолуния", "id": null, "url": null, "img": null, "other": []}, {"name": "Бульк", "actor": "", "actor_url": null, "race": "", "role": "русал-охранник № 1227", "fate": "погиб, убит Пшеном", "id": "Бульк", "url": "/c/bulk/", "img": "img/chars/bul-k.webp", "other": []}, {"name": "Дульк", "actor": "", "actor_url": null, "race": "", "role": "русал-охранник, брат Булька", "fate": "выжил", "id": "Дульк", "url": "/c/dulk/", "img": "img/chars/dul-k.webp", "other": []}, {"name": "Киль", "actor": "", "actor_url": null, "race": "", "role": "островитянин, друг Каспера", "fate": "выжил", "id": "Киль", "url": "/c/kil/", "img": "img/chars/kil.webp", "other": []}, {"name": "Людочка", "actor": "", "actor_url": null, "race": "", "role": "служительница святилища, стала «пророком» против Давы", "fate": "выжила", "id": null, "url": null, "img": null, "other": []}, {"name": "Игорь", "actor": "", "actor_url": null, "race": "", "role": "невидимый слуга Талалы", "fate": "развеян", "id": "Игорь", "url": "/c/igor/", "img": null, "other": []}], "links": [{"key": "05", "label": "5", "title": "Шахты Фогельнест", "note_html": "<a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a> — трагедия, в которой погибли сослуживцы <a class=\"ref\" href=\"/c/pshen/\">Пшена<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "06", "label": "6", "title": "Адский поезд", "note_html": "Гибель Динь-Диня, брата <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a>", "dir": "out", "color": "#7C5CD6"}, {"key": "10", "label": "10", "title": "Храм Юмора", "note_html": "<a class=\"ref\" href=\"/place/hram-yumora/\">Храм Юмора<\/a>: <a class=\"ref\" href=\"/c/savl/\">Савл<\/a> (брат-близнец <a class=\"ref\" href=\"/c/erik-penisov/\">Эрика<\/a>) был там вместе с <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалой<\/a>, здесь назван её погибшим другом", "dir": "out", "color": "#7C5CD6"}, {"key": "17", "label": "17", "title": "Демонизация", "note_html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл (Адского вокзала)", "dir": "out", "color": "#7C5CD6"}, {"key": "21b", "label": "21b", "title": "Часть 2 Судьба Властона", "note_html": "<a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> исполнил адский контракт", "dir": "out", "color": "#C8423B"}, {"key": "24", "label": "24", "title": "Чёрный Геленбург", "note_html": "<a class=\"ref\" href=\"/place/gelenburg/\">Геленбург<\/a> — цитадель Тёмного Властелина после предательства <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "Портал в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> открыт на острове Соблазна", "dir": "back", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "<a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров соблазна<\/a>, богиня <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>, портал", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Правило первое: отринь дурное естество. Нельзя убийство, нельзя воровство». — «С этим у нас будут проблемы».", "«Я приняла свои травмы, полюбила себя как женщину, научилась дышать маткой» — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>.", "«Мне надоело быть третьесортной богиней родов и ноготочков. Я заслуживаю большего» — <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>.", "«Большой кристалл, открой большой портал» — <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a>.", "«Скажите, что любите меня!» — «Иди на… не любим»."], "places_html": "<ul>\n<li>Места: остров Соблазна (пирс, пляж с баром, кухня, вилла Давы с бассейном, лобное место, запретный пляж с пещерой, святилище-пагода на скале); <a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a> (упоминается); каторжный лагерь <a class=\"ref\" href=\"/place/fogelnest/\">Фогельнест<\/a> (упоминается).<\/li>\n<li>Фракции: островитяне — поклонники Давы; русалы-охранники; <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> и его пантеон (боги как «крылатые черви» в книге Давы); демоны Тёмного Властелина.<\/li>\n<li>Артефакты: <b>большой кристалл телепортации<\/b> (стабилизирован богиней и стал порталом в <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a>); малый кристалл в ладони <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>; «Книга превращений и развращений»; дневник <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> (с вырванными страницами); «История одной прекрасной богини»; четырёхрукая статуя Давы; жемчужина дружбы русалов; грязный горн; козлиная шкура Кики; «стул развращения» Каспера; алмазный молот Пахома (призванное оружие); дубина <a class=\"ref\" href=\"/c/pshen/\">Пшена<\/a> «Вика»; осколок зеркала.<\/li>\n<\/ul>", "pod_html": "<section class=\"ep-sec\" id=\"pod\"><h2>Из подкастов <small>29<\/small><\/h2><p class=\"note\" style=\"margin:0 0 10px\">Ответы мастера, авторов и игроков в подкастах <a href=\"/pod/\">«Ответы на вопросы по ПЧК»<\/a>. Собраны из автосубтитров — сверяйтесь с видео по таймкоду.<\/p><div class=\"ptfilter\"><button class=\"chip ptf on\" data-t=\"\">Все <small>29<\/small><\/button><button class=\"chip ptf t-addition\" data-t=\"addition\" title=\"новый факт, которого не было в выпуске\">Дополнение <small>3<\/small><\/button><button class=\"chip ptf t-clarification\" data-t=\"clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение <small>9<\/small><\/button><button class=\"chip ptf t-error\" data-t=\"error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка <small>3<\/small><\/button><button class=\"chip ptf t-plan\" data-t=\"plan\" title=\"планы, намёки, несыгранные ветки\">Задел <small>3<\/small><\/button><button class=\"chip ptf t-backstage\" data-t=\"backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье <small>11<\/small><\/button><\/div><article class=\"pnote t-backstage\" id=\"qa25-1\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Олеся Иванченко приехала заранее разобраться в правилах<\/b><\/div><p>Мотор был утренний. <a class=\"ref\" href=\"/p/olesya-ivanchenko/\">Олеся Иванченко<\/a> попросила приехать на пару часов раньше, чтобы мастер отдельно объяснил ей механику игры. Позже выяснилось, что натальную карту, главный приём <a class=\"ref\" href=\"/c/losik/\">Лосика<\/a>, мастер придумал вместе с ней.<\/p><blockquote>«она попросила, можно ли приехать заранее, чтобы ей более подробно объяснили саму механику игры»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-1\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=326\" target=\"_blank\" rel=\"noopener\">0:05:26 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-2\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Жемчужина дружбы — импровизация мастера, извинение перед Пшеном<\/b><\/div><p>Сцена, где <a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a> передаёт жемчужину изо рта, была импровизацией Бреганова. По сути он так извинился перед <a class=\"ref\" href=\"/p/dmitriy-zhuravlyov/\">Журавлёвым<\/a> за то, что не давал <a class=\"ref\" href=\"/c/pshen/\">Пшену<\/a> играть. То, что жемчужина — символ дружбы, придумали уже по ходу игры. Позже Пшен откупился ею от второго русала, <a class=\"ref\" href=\"/c/dulk/\">Дулька<\/a>.<\/p><blockquote>«если вот метагеймово, это было извинение мастера за то, что он не дал тебе сыграть»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-2\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=660\" target=\"_blank\" rel=\"noopener\">0:11:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-3\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем Бульк дал Пшену жемчужину<\/b><\/div><p><a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a> хотел расположить гостей не только к себе, но и к острову в целом. Отряд с самого начала был насторожен: <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> вытянула на Таро «Дьявола» и «Башню». Подарок должен был их расслабить. Мастер упомянул, что у русалов есть своё подводное царство со своими обычаями; в выпуске его лишь слегка анонсировали.<\/p><blockquote>«расположить не только к себе, но вообще в принципе к острову, поскольку ребята очень подозрительно относились»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-3\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=724\" target=\"_blank\" rel=\"noopener\">0:12:04 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-4\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Под водой Пшена окружила целая стая русалов — вырезано<\/b><\/div><p><a class=\"ref\" href=\"/p/dmitriy-zhuravlyov/\">Журавлёв<\/a> рассказал, что, когда <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> нырнул, на карту выставили много русалов, а не одного. В монтаж это не вошло. Он решил, что жемчужина — пропуск или средство дышать под водой и что его утащат в подводную «канцелярию».<\/p><blockquote>«когда прыгнул в воду, это не показано в выпуске, но там появилось туча тритонов этих, не один»<\/blockquote><p class=\"note\">Журавлёв · <a href=\"/pod/qa25/#qa25-4\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=845\" target=\"_blank\" rel=\"noopener\">0:14:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-5\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Пшен убил Булька<\/b><\/div><p>По словам <a class=\"ref\" href=\"/p/dmitriy-zhuravlyov/\">Журавлёва<\/a>, <a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a> повёл себя враждебно и стал отбирать страницу дневника. <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> испугался, что русал позовёт подмогу и обстановка на острове пойдёт вразнос, а тогда миссию было бы не выполнить. Драться в этом выпуске он не собирался, это была вынужденная мера.<\/p><blockquote>«пшен убил русала на лобном месте потому что он начал враждебно себя вести»<\/blockquote><p class=\"note\">Журавлёв · <a href=\"/pod/qa25/#qa25-5\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=971\" target=\"_blank\" rel=\"noopener\">0:16:11 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-7\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Выпуски 25 и 24 снимали в один день; BRB берёг силы для Падшего рыцаря<\/b><\/div><p>«<a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров соблазна<\/a>» сняли утром (мотор в 12), а «<a class=\"ref\" href=\"/place/chyornyy-gelenburg/\">Чёрный Геленбург<\/a>» — вечером того же дня (в 6). Утром <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> узнал, что в вечернем выпуске у <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a> будет скрытая мотивация (предательство), и в 25-м намеренно экономил силы. Отсюда его отстранённость.<\/p><blockquote>«когда мне сказали с утра, что у меня будет скрытая мотивация, я хотел очень хорошо отыграть второй выпуск, и первый я был пассивный»<\/blockquote><p class=\"note\">BRB · <a href=\"/pod/qa25/#qa25-7\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1667\" target=\"_blank\" rel=\"noopener\">0:27:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-8\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Пляжный эпизод» должен был идти до крупного выпуска, но выпуски переставили<\/b><\/div><p>Авторы назвали выпуск 25 «пляжным эпизодом» в духе аниме: спокойная серия, где снижают накал и дают развиться линиям персонажей перед крупными событиями. Но выпуски переставили местами, и пляжный вышел после «Чёрного <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурга<\/a>».<\/p><blockquote>«только у нас, видишь, из-за того что мы переставили выпуски местами»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-8\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1770\" target=\"_blank\" rel=\"noopener\">0:29:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-9\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>В анимации — пасхалка на «Аватар: Легенда об Аанге»<\/b><\/div><p>Художница рассказала, что во время работы над выпуском 25 пересматривала мультсериал «Аватар: Легенда об Аанге» и вписала в одну из сцен анимации много его персонажей.<\/p><blockquote>«решила куда-нибудь вписать кого-то из персонажей, вписала очень много кого в ту сцену»<\/blockquote><p class=\"note\">художница · <a href=\"/pod/qa25/#qa25-9\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=1835\" target=\"_blank\" rel=\"noopener\">0:30:35 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-10\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Откуда имя Пшен и другие варианты Журавлёва<\/b><\/div><p>Имя <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> <a class=\"ref\" href=\"/p/dmitriy-zhuravlyov/\">Журавлёв<\/a> придумал сам: он из деревни, любит народное творчество и шутил про своё «пшеничное», русское деревенское лицо. Среди запасных вариантов были персонаж с французским акцентом и «Густав Цикорий». Из монтажа вырезали шутку <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> о сходстве Журавлёва с президентом Польши.<\/p><blockquote>«пшен — это вроде и фантазийное имя, и относится ко мне как-то»<\/blockquote><p class=\"note\">Журавлёв · <a href=\"/pod/qa25/#qa25-10\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=2175\" target=\"_blank\" rel=\"noopener\">0:36:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-11\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему Пшен не пришёл на финальную битву<\/b><\/div><p><a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> надолго отделился от группы и минуты четыре ждал своего хода. <a class=\"ref\" href=\"/p/dmitriy-zhuravlyov/\">Журавлёв<\/a> понял, что основному действию уже не поможет, и в шутку остался на пляже с трупом <a class=\"ref\" href=\"/c/bulk/\">Булька<\/a>, решив прибежать с «доказательствами», когда всё будет кончено.<\/p><blockquote>«я понял, что я никак уже там не помогаю, и сразу же придумал прикол, что я прибегу с доказательством»<\/blockquote><p class=\"note\">Журавлёв · <a href=\"/pod/qa25/#qa25-11\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=2285\" target=\"_blank\" rel=\"noopener\">0:38:05 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa25-12\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Пшен мог стать мужем Талалы — бардом; хотел быть оборотнем или вампиром<\/b><\/div><p><a class=\"ref\" href=\"/p/dmitriy-zhuravlyov/\">Журавлёв<\/a> ждал, что ему дадут барда, но бард в выпуске уже был — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a>. Обсуждали вариант, где он играл бы мужа Талалы и они вдвоём выступали бы как бардовский дуэт. Сам он хотел бы сыграть оборотня или вампира. Простого воина-человека авторы дают тем, в чьей игре уверены.<\/p><blockquote>«у нас должна была быть вот линия: если бы я стал... был бы её муж, и они вдвоём играют»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-12\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=2463\" target=\"_blank\" rel=\"noopener\">0:41:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-13\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Правило «не рыгать» придумали под игрока, который обязательно рыгнёт<\/b><\/div><p>Настоящая причина запрета была проще зрительских версий: за столом был игрок, который не удержится от отрыжки, если ему её запретить, и он рыгнул через полсекунды после объявления правила. Внутри мира это объяснили так: остров создала богиня-женщина, а женщины не любят, когда рядом рыгают. Версию, что в отрыжке чувствовался бы запах человечины, авторы отвергли: островитяне ели мясо животных.<\/p><blockquote>«у нас есть один игрок за столом, который умеет и любит рыгать... если ему сказать не рыгать, то он обязательно рыгнёт»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-13\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=2763\" target=\"_blank\" rel=\"noopener\">0:46:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-14\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Почему от песни Талалы уснул повар, но не русал<\/b><\/div><p>Песня работала как заклинание «Сон»: бросают 5d8, сумму тратят на хиты существ в радиусе, начиная с самого слабого. Выпавшего хватило на повара, но не на русала с большим запасом здоровья. Это заклинание использовали в первых выпусках, потом отказались от него из-за сложной механики и вернули только спустя двадцать с лишним выпусков.<\/p><blockquote>«засыпает только один из них»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-14\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=2955\" target=\"_blank\" rel=\"noopener\">0:49:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa25-15\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Кристалл не нанёс Пахому урон — авторы сознательно забыли<\/b><\/div><p>На первой телепортации мастер дал <a class=\"ref\" href=\"/c/medium-pahom/\">Пахому<\/a> урон от кристалла, но в монтаже его вырезали: <a class=\"ref\" href=\"/p/brb/\">BRB<\/a> вспомнил правило, что первое перемещение бесплатное. На втором переносе, в финальной схватке, бросок к4 урона Пахому не дали. Иначе <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> следующей атакой положила бы всех, и в живых остался бы один <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a>.<\/p><blockquote>«просто мы решили ему этот бросок к4 урона не давать... они бы все просто там полегли»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-15\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3405\" target=\"_blank\" rel=\"noopener\">0:56:45 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-16\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Если отрубить Пахому кисть с кристаллом, болезнь пройдёт<\/b><\/div><p>Авторы подтвердили: отсечь руку с кристаллом было бы сильным ходом. <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> продолжил бы работать, а весь негативный эффект с <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> спал бы, и кисть можно было бы носить с собой. Отрубать нужно именно ту руку, в которую врос кристалл.<\/p><blockquote>«это был бы реально крутой ход с отсечением руки, тогда бы у него вся эта болезнь прошла»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-16\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3537\" target=\"_blank\" rel=\"noopener\">0:58:57 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa25-17\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Природа кристалла: нейтральный, но заряжен тёмной энергией<\/b><\/div><p><a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> сам по себе нейтрален. Он был настроен на тёмную энергию и поэтому тянет силы из носителя. Его можно перенастроить, что герои и сделали на острове Соблазна.<\/p><blockquote>«кристалл, судя по всему, имеет свойства нейтральные, но поскольку он был заряжен... плюс его можно перенастроить»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-17\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3570\" target=\"_blank\" rel=\"noopener\">0:59:30 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-18\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Где были Муй и Дава и вырезанный диалог Пшена с Муем<\/b><\/div><p>Муй организовывал праздник и почти всё время проводил на пляже, готовя процессию и жертвенное мясо. <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>, как богиня, ходила где хотела по своим делам. Из монтажа вырезали долгий диалог Муя с <a class=\"ref\" href=\"/c/pshen/\">Пшеном<\/a> по пути на лобное место. Претензий к героям у Муя не было: его очаровали все, кроме нырнувшего Пшена.<\/p><blockquote>«муй находится на организации праздника... большую часть времени он проводил чисто на пляже»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-18\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3600\" target=\"_blank\" rel=\"noopener\">1:00:00 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-19\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Надпись «Дава, тебя никто не любит» вырезал Муй, чтобы подставить Каспера<\/b><\/div><p>Надпись на скамейке с подписью <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> сделал не Каспер, а Муй. Каспер был фаворитом Давы, и Муй, её правая рука, хотел занять его место, поэтому подстроил Касперу очередное нарушение. Ни один герой в здравом уме такого бы не написал.<\/p><blockquote>«никто не знал, что на самом деле это Муй написал «Дава, тебя никто не любит»<\/blockquote><p class=\"pn-fix\"><b>Поправка к нашему конспекту:<\/b> В summaries/ep25.md надпись на скамейке «<a class=\"ref\" href=\"/c/dava/\">Дава<\/a>, тебя никто не любит» приписана <a class=\"ref\" href=\"/c/kasper/\">Касперу<\/a> (с его подписью). На деле её вырезал Муй, подставляя Каспера.<\/p><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-19\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3736\" target=\"_blank\" rel=\"noopener\">1:02:16 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa25-20\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Зачем Дава объявила пляж запретным<\/b><\/div><p>Запрет был психологическим приёмом Давы. Запретное вызывает желание, и так она проверяла, насколько островитяне её любят и склонны ли нарушать её законы: на запретный пляж ходили только неблагонадёжные. Друзей <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> в пещере спрятали уже потом.<\/p><blockquote>«если объявить что-то запретным, это вызывает желание, и объявив пляж запретным, Дава могла проверить, насколько люди её любят»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-20\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3770\" target=\"_blank\" rel=\"noopener\">1:02:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-21\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Имена Муй, Киль и Пух — клички знакомых с Перекопа; Киль на самом деле Шкиль<\/b><\/div><p>Имена NPC выпуска взяли из кличек «перекопских пацанов», знакомых одного из авторов: Лёха Муй, Шкиль (вратарь хоккейной команды) и Пух. В сценарии стояло «Шкиль», но мастер пропустил первую букву и в эфире произнёс «<a class=\"ref\" href=\"/c/kil/\">Киль<\/a>».<\/p><blockquote>«был у нас чел Муй, был у нас Киль, а Шкиль... Саня не прочитал первую букву»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-21\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3802\" target=\"_blank\" rel=\"noopener\">1:03:22 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa25-22\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>«Чушпан» — нарочная отсылка к «Слову пацана»<\/b><\/div><p>Выпуск сняли в ноябре 2023 года, в разгар популярности сериала «Слово пацана». Слово «чушпан» в устах русалов ввели специально, чтобы запечатлеть этот момент и чтобы зрителям было неловко за русалов.<\/p><blockquote>«мы снимали этот выпуск, насколько я помню, в ноябре 2023 года»<\/blockquote><p class=\"note\"><a href=\"/pod/qa25/#qa25-22\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3909\" target=\"_blank\" rel=\"noopener\">1:05:09 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa25-23\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Система наказаний острова Соблазна<\/b><\/div><p>На острове было три ступени наказания. После первого нарушения провинившегося называют «чушпаном» и вешают ему колокольчик на нос. После второго его отправляют к столбам наказаний на физическую кару, например «пытку дельфином». После третьего человека превращают в животное, а островитяне уверены, что его просто изгнали. Столбы наказаний — одна из двух локаций острова, где герои так и не побывали.<\/p><blockquote>«первое наказание — тебя называют чушпан и вешают колокольчик на нос... второе — тебя отправляют на столбы для наказаний»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-23\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=3975\" target=\"_blank\" rel=\"noopener\">1:06:15 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa25-24\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Талала вдохновила Пшена, хотя была далеко<\/b><\/div><p><a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> была в святилище, а <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> на пляже, и вдохновлять его песней она не могла. Мастер признал допущение: не хотелось обрывать <a class=\"ref\" href=\"/p/aleksandr-gudkov/\">Гудкова<\/a> на хорошей песне, к тому же он принципиально старается не отвечать игрокам «нет».<\/p><blockquote>«обрывать его на моменте, когда он даёт классную песню, не хочется»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-24\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4070\" target=\"_blank\" rel=\"noopener\">1:07:50 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-error\" id=\"qa25-25\" data-type=\"error\"><div class=\"pn-h\"><span class=\"ptype t-error\" title=\"признанный ляп: правила, броски, монтаж, рисунок, нестыковка\">Ошибка<\/span><b>Понос русалам: «малые фокусы» сработали как массовое заклинание<\/b><\/div><p><a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> наслала понос на всех русалов заговором «маленькие фокусы», хотя это малое заклинание на одну цель. Мастер признал, что по правилам так нельзя, но применил рулинг: Лосик долго убеждала, ей назначили высокую сложность (20), и она выбросила критический успех.<\/p><blockquote>«да, это было не по правилам, но есть такое понятие как рулинг»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-25\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4116\" target=\"_blank\" rel=\"noopener\">1:08:36 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa25-26\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Остров можно было обойти на корабле — старт выбрал мастер<\/b><\/div><p>Причаливать к главному пирсу было не обязательно: можно было проплыть вокруг острова. Авторы просто выбрали стартовую точку. Приключение могло начаться в море со столкновения или даже в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a> с выбора яхты.<\/p><blockquote>«мы могли вообще это приключение в море начать, у вас первое какое-нибудь столкновение могло быть в море»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-26\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4247\" target=\"_blank\" rel=\"noopener\">1:10:47 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><article class=\"pnote t-addition\" id=\"qa25-27\" data-type=\"addition\"><div class=\"pn-h\"><span class=\"ptype t-addition\" title=\"новый факт, которого не было в выпуске\">Дополнение<\/span><b>Почему демоны не прошли в рай через кристалл: в Небесный мир пускает только божественная кровь<\/b><\/div><p>Демоны входят в святые места светлого божества, только осквернив их, поэтому и осквернили храм Солнца в <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>. В <a class=\"ref\" href=\"/place/nebesnyy-mir/\">Небесный мир<\/a> демона не пустит тот же барьер. Если осквернить храм и поместить туда кристалл, тот уже не перенесёт в Небесный мир: не будет божественной эссенции. Переноситься туда могут только боги и носители божественной крови, остальным нужны особые обстоятельства. Об этом обещаны будущие приключения.<\/p><blockquote>«только боги могут переноситься в Небесный мир. Если у тебя есть божественная кровь, то тогда ты можешь переноситься»<\/blockquote><p class=\"note\">мастер Бреганов · <a href=\"/pod/qa25/#qa25-27\">Подкаст по #25<\/a> · <a href=\"https://youtu.be/MK8Z0iFU42A?t=4309\" target=\"_blank\" rel=\"noopener\">1:11:49 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/24/\" title=\"Чёрный Геленбург\">#24<\/a>, <a href=\"/ep/27/\" title=\"Достучаться до небес\">#27<\/a><\/p><\/article><article class=\"pnote t-plan\" id=\"qa31-6\" data-type=\"plan\"><div class=\"pn-h\"><span class=\"ptype t-plan\" title=\"планы, намёки, несыгранные ветки\">Задел<\/span><b>Лосик и Пшен живы, их следующая миссия связана с Чёрным Геленбургом<\/b><\/div><p><a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> и <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> покинули <a class=\"ref\" href=\"/place/ostrov-soblazna/\">Остров соблазна<\/a> до захвата демонами. Их цель — освободить родителей, застрявших в Чёрном <a class=\"ref\" href=\"/place/gelenburg/\">Геленбурге<\/a>, и если герои вернутся, их приключение, скорее всего, будет связано с этим.<\/p><blockquote>«у лосика и пшена задача была не остаться на острове соблазна, освободить своих родителей, которые застряли в Чёрном Геленбурге»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-6\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=812\" target=\"_blank\" rel=\"noopener\">0:13:32 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-clarification\" id=\"qa31-25\" data-type=\"clarification\"><div class=\"pn-h\"><span class=\"ptype t-clarification\" title=\"проясняет неясное или спорное в выпуске\">Уточнение<\/span><b>Портал оказался привязан к острову<\/b><\/div><p>Портал, открытый через богиню Даву, связан со священным местом на острове, поэтому демоны утащили остров целиком, а не вырезали кусок скалы. Авторы признали, что можно спорить, обязан ли портал быть так привязан, но дьяволы-практики «дёрнули остров», и эмпирически оказалось, что так он и работает.<\/p><blockquote>«теоретик, а дьяволы практики: они дёрнули остров и поехали»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-25\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=3963\" target=\"_blank\" rel=\"noopener\">1:06:03 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a>, <a href=\"/ep/31/\" title=\"Культ Кракена\">#31<\/a><\/p><\/article><article class=\"pnote t-backstage\" id=\"qa31-30\" data-type=\"backstage\"><div class=\"pn-h\"><span class=\"ptype t-backstage\" title=\"как готовили и снимали, решения мастера\">Закулисье<\/span><b>Метагейм в «Острове соблазна»: Пахому запретили слышать подсказку<\/b><\/div><p>В #25 <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> не слышал, как <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> узнали способ расколдовать животных, и мастер запретил передавать ему это напрямую. Игроки вспомнили заклинание «Послание» и передали информацию через него, что мастер засчитал.<\/p><blockquote>«мы поставили как бы запрет, и они вспомнили про заклинание, вот, послание»<\/blockquote><p class=\"note\"><a href=\"/pod/qa31/#qa31-30\">Подкаст по #31<\/a> · <a href=\"https://youtu.be/gPaDLkZfWao?t=5395\" target=\"_blank\" rel=\"noopener\">1:29:55 в видео ↗<\/a> · о выпуске <a href=\"/ep/25/\" title=\"Остров соблазна\">#25<\/a><\/p><\/article><\/section>", "chars": {"Лосик": {"name": "Лосик", "img": "img/chars/losik.webp", "wiki_url": "https://pck.fandom.com/ru/wiki/%D0%9B%D0%BE%D1%81%D0%B8%D0%BA", "summary": "Лосик - гадалка, волшебница, сестра Пшена", "infobox": {"Пол": "женский", "Раса": "Человек", "Тип": "Игровой", "Игрок": "Олеся Иванченко"}, "actors": ["Олеся Иванченко"], "kind": "pc", "dead": false, "race": "Человек", "portraits": [{"ep": "25", "thumb": "img/portraits/0f5d9bad95253a68.webp"}], "url": "/c/losik/", "eps": [{"key": "24", "label": "24", "title": "Чёрный Геленбург"}, {"key
