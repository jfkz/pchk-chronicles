<script>window.EPD = {"key": "25", "label": "25", "title": "Остров Соблазна", "date": "2024-03-18", "minutes": 109, "duration": 6527.0, "video_id": "ngYbqdzpTsQ", "branch": "Пахом и Талала", "branch_color": "#7C5CD6", "place": "Остров Соблазна — курортный остров в море у берегов Понии", "short_html": "Через год после кражи большого кристалла телепортации <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> отправляется на остров Соблазна искать инженера <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a>, чтобы открыть портал в Небесный мир и призвать ангелов против демонов Чёрного Геленбурга. Островом правит <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> — падшая богиня родовых схваток и ногтей, которая питается любовью островитян, а нарушителей превращает в животных и скармливает остальным. Герои находят дневник Каспера, расколдовывают его и друзей тремя кувырками назад и разоблачают Даву перед толпой. Пахом заталкивает кристалл ей в горло, и божественная сущность стабилизирует его, превращая Даву в портал в Небесный мир.", "summary_html": "Через год после #17 у <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a> всё ещё хранится большой кристалл телепортации. Он хочет открыть с его помощью портал в Небесный мир и призвать ангелов против демонов Чёрного Геленбурга, но кристалл нестабилен, и нужен инженер <a class=\"ref\" href=\"/c/kasper/\">Каспер<\/a> с курортного острова Соблазна. Островом правит «хозяйка» <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>: падшая богиня родовых схваток и крепких ногтей, которая объявила себя верховной богиней. Она питается любовью островитян, а нарушителей превращает в животных и скармливает остальным на празднике новолуния. Герои расколдовывают Каспера и его друзей, разоблачают Даву перед толпой и заталкивают кристалл ей в горло. Божественная сущность стабилизирует кристалл, и Дава становится порталом в Небесный мир.", "outcome_html": "<a class=\"ref\" href=\"/c/dava/\">Дава<\/a> погибла, превратившись в портал в Небесный мир; пленники острова свободны. Все герои живы.", "world_html": ["Открыт портал в Небесный мир — боги могут вступить в войну с демонами", "Большой кристалл телепортации израсходован (стабилизирован богиней)", "Власть Давы над островом Соблазна пала", "Подтверждено: в Небесном мире положение богов зависит от любви смертных"], "scenes": [{"t": "0:00:03–0:01:08", "sec": null, "html": "Предыстория: <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> украл большой кристалл телепортации, но <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктерион<\/a> исполнил адский контракт, и Геленбург стал цитаделью Тёмного Властелина. Прошёл год."}, {"t": "0:04:19", "sec": 259, "html": "Задача от мастера: призвать через кристалл ангелов, а для этого перенастроить его руками изобретателя <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> с острова Соблазна, райского места, куда бегут от проблем жители Понии. Отряд приплыл на шхуне."}, {"t": "0:05:22–0:10:40", "sec": null, "html": "Герои представляются. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> признаёт, что предотвратить апокалипсис не удалось; малый кристалл в ладони тянет из него жизнь, и лечение не помогает. <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> после гибели брата Динь-Диня и друга <a class=\"ref\" href=\"/c/savl/\">Савла<\/a> пила и хотела покончить с собой, но её спасла коуч <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a>. Лосик родом из геленбургской семьи тюремщиков и основала школу духовных практик «Космическая воронка». Её брат <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> служил тюремщиком в Фогельнесте, пережил там трагедию, отказался от насилия и уехал к сестре. Их престарелые родители остались в Чёрном Геленбурге."}, {"t": "0:10:40–0:13:53", "sec": null, "html": "У пирса отряд встречают улыбчивые островитяне. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> гадает на Таро и вытягивает «Дьявола» и «Башню». <a class=\"ref\" href=\"/c/kristal/\">Кристалл<\/a> оставляют в трюме с пятью матросами, на мачте сажают опоссума-«камеру»."}, {"t": "0:13:53–0:20:19", "sec": null, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> спускается первым. Хозяйка острова <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> передаёт гостей помощнику Мою (на деле его зовут Муй). Правила острова: нельзя убивать и воровать, всегда улыбаться, почитать Даву, не рыгать. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> очаровывает Моя, и тот рассказывает, что <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> «застукали на запретном пляже» и он пропал. Сегодня ночью — праздник новолуния."}, {"t": "0:22:27–0:26:44", "sec": null, "html": "<a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> и <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> флиртуют с Моем. У Талалы критический успех: Мой проговаривается, что запретный пляж на западе и его охраняют русалы."}, {"t": "0:27:46–0:33:10", "sec": null, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> ныряет за борт, его перехватывает синекожий русал <a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a> (бирка «охрана острова, № 1227») и дарит жемчужину, «символ дружбы». Русалы ходят по суше на руках."}, {"t": "0:34:13–0:42:48", "sec": null, "html": "У кухни <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a> усыпляет повара песней, и русалы выносят ей первое предупреждение. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> с помощью монеты-переброса насылает на русалов понос, и те прыгают в море. <a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> забирает у спящего повара золотую монету."}, {"t": "0:40:39–0:44:58", "sec": null, "html": "В запертом сарае находят дневник <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> и привязанного кабана. <a class=\"ref\" href=\"/c/kaban/\">Кабана<\/a> отпускают, он бежит на запад. В дневнике Каспер пишет, что стал фаворитом Давы, за что Мой на него косится, что был в святилище и понял «секрет Давы». Дальше страницы вырваны."}, {"t": "0:43:51–0:53:22", "sec": null, "html": "У святилища на скале <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> «парализует» одну служительницу натальной картой. Невидимый слуга <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалы<\/a> Игорь выходит из-под контроля и нападает на вторую девушку, Людочку. Талала лжёт русалам и получает второе предупреждение. Лосик очаровывает русала «космической воронкой», целует его (у него раздвоенный язык), и русалы уходят. Людочку уводят с собой."}, {"t": "0:52:29–1:03:17", "sec": null, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> идёт на виллу Давы. Островитянин <a class=\"ref\" href=\"/c/kil/\">Киль<\/a> по приказу Моя стрижёт газон зубами. В спальне лежит рукописная «История одной прекрасной богини», где небесные боги названы «бесполезными крылатыми червями». Под матрасом — страница дневника <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a>: <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> — падшая богиня из Небесного мира; нарушителя Кики после третьего предупреждения она превратила в козла, и его съели на празднике (шкура лежит у камина). Пшен забирает страницу и шкуру и откупается от русала <a class=\"ref\" href=\"/c/dulk/\">Дулька<\/a> (брата <a class=\"ref\" href=\"/c/bulk/\">Булька<\/a>) той самой жемчужиной, передав её изо рта в рот."}, {"t": "1:03:17–1:06:31", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> идёт по следам кабана к запретному пляжу, обманывает русала иллюзией кабана на обрыве и убегает в пещеру."}, {"t": "1:06:31–1:11:54", "sec": null, "html": "На вершине скалы стоят пагода и статуя четырёхрукой женщины с подписью «<a class=\"ref\" href=\"/c/dava/\">Дава<\/a>, верховная богиня острова Соблазна». Там же лежит «Книга превращений и развращений»: чтобы вернуть животному человеческий облик, его нужно трижды кувыркнуть назад. Людочка рассказывает, что на ритуалах Дава вырастает от любви островитян. Под свежей штукатуркой находят настоящую надпись: «Дава, богиня родовых схваток и крепких ногтей»."}, {"t": "1:11:54–1:15:02", "sec": null, "html": "<a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> «рассчитывает Людочке кармическую задачу», и та соглашается стать пророком и открыть острову правду о Даве."}, {"t": "1:16:06–1:18:16", "sec": null, "html": "На лобном месте <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> с Килем находят «секретик» с ещё одной страницей дневника. <a class=\"ref\" href=\"/c/kasper/\">Каспер<\/a> спрятал превращённых друзей, Элли, <a class=\"ref\" href=\"/c/bertu/\">Берту<\/a> и Пуха, в пещере на запретном пляже: <a class=\"ref\" href=\"/c/dava/\">Дава<\/a> обратила их в животных за подготовку побега. Островитяне раз в месяц едят превращённых соседей. На скамейке вырезано «Дава, тебя никто не любит» с подписью Каспера."}, {"t": "1:18:16–1:25:47", "sec": null, "html": "Появляется <a class=\"ref\" href=\"/c/bulk/\">Бульк<\/a>, съевший что-то после поноса. Он проглатывает страницу, <a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> оглушает его дубиной «Вика», забирает грязный горн и жемчужину, вспарывает брюхо осколком зеркала, попадает в сердце и убивает русала."}, {"t": "1:25:47–1:32:16", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> обрушивает вход в пещеру алмазным молотом. Внутри он находит кабана, оленя и жабу с человеческими ногами и голубя с человеческой головой, это Пух. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> сообщает ему способ превращения, и Пахом кувырками расколдовывает всех: <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a>, Пуха, Элли и <a class=\"ref\" href=\"/c/bertu/\">Берту<\/a>."}, {"t": "1:32:16–1:34:23", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> телепортирует всех в трюм к большому кристаллу. <a class=\"ref\" href=\"/c/kasper/\">Каспер<\/a> объясняет, что демоны перебрасывали этими кристаллами целые армии. Стабилизировать кристалл можно в святилище бога или демона (светлое откроет Небесный мир, демоническое — ад) либо поместив его внутрь божества: богиня, возможно, погибнет, но её сущность откроет портал."}, {"t": "1:34:23–1:40:50", "sec": null, "html": "На закате к святилищу поднимается праздничная процессия, и появляется <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>. От песен островитян она растёт, у неё появляются ещё две руки. Она признаётся: на Небесах всё решает любовь, ей надоело быть «третьесортной богиней родов и ноготочков», и она сама сделала себя верховным божеством, а животных создаёт, потому что только они любят беззаветно. Дава превращает <a class=\"ref\" href=\"/c/gnomka-talala/\">Талалу<\/a> в зайца, но та откувыркивается обратно. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> и Талала обращаются к толпе, Людочка их поддерживает. Люди в замешательстве, богиня уменьшается и в ярости бьёт героинь."}, {"t": "1:40:50–1:46:13", "sec": null, "html": "<a class=\"ref\" href=\"/c/medium-pahom/\">Пахом<\/a> с четырьмя голыми расколдованными и кристаллом телепортируется в святилище. <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a> вызывает у Давы «тотальный зевок», Пахом телекинезом загоняет кристалл ей в рот, и тот застревает в горле. Лосик волшебной рукой касается кристалла: «Большой кристалл, открой большой портал». Даву сминает в мерцающую точку, из которой возникает портал в Небесный мир."}, {"t": "1:47:22", "sec": 6442, "html": "<a class=\"ref\" href=\"/c/pshen/\">Пшен<\/a> с козлиной шкурой бежит к толпе, но та уже кричит «не любим её». Монеты — 70 000 ₽ на благотворительность. Финал: «Придут ли боги на помощь людям и вступят ли в войну с демонами — в новых выпусках»."}], "key_events": [{"t": "0:04:19", "sec": 259}, {"t": "0:15:00", "sec": 900}, {"t": "0:41:44", "sec": 2504}, {"t": "0:56:51", "sec": 3411}, {"t": "1:08:42", "sec": 4122}, {"t": "1:10:51", "sec": 4251}, {"t": "1:24:41", "sec": 5081}, {"t": "1:31:08", "sec": 5468}, {"t": "1:32:16", "sec": 5536}, {"t": "1:37:34", "sec": 5854}, {"t": "1:46:13", "sec": 6373}], "coins": {"ep": "25", "events": [{"t": "0:20:19", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Вежливо и этично расспросил Каспера про пропавшего человека вместо давления — очаровал его как друга.", "result": null, "sec": 1219, "who_url": "/c/medium-pahom/", "reason_html": "Вежливо и этично расспросил <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> про пропавшего человека вместо давления — очаровал его как друга."}, {"t": "0:20:19", "kind": "spend", "who": "Талала", "actor": "Гудков", "to": null, "reason": "Потратил монету за право называть нового встреченного персонажа «Мой» до конца выпуска.", "result": null, "sec": 1219, "who_url": "/c/gnomka-talala/", "reason_html": "Потратил монету за право называть нового встреченного персонажа «Мой» до конца выпуска."}, {"t": "0:24:33", "kind": "earn", "who": "Талала", "actor": "Гудков", "to": null, "reason": "За талантливое представление команды пришедшим на пляж местным жителям.", "result": null, "sec": 1473, "who_url": "/c/gnomka-talala/", "reason_html": "За талантливое представление команды пришедшим на пляж местным жителям."}, {"t": "0:28:53", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Использовал способность «Громогласный приказ» на стража-русала и отдал мирный приказ «Пропусти» вместо угрозы его жизни.", "result": null, "sec": 1733, "who_url": "/c/medium-pahom/", "reason_html": "Использовал способность «Громогласный приказ» на стража-русала и отдал мирный приказ «Пропусти» вместо угрозы его жизни."}, {"t": "0:37:27", "kind": "spend", "who": "Лосик", "actor": "Олеся Иванченко", "to": null, "reason": "Потратила две монеты подряд (на доп. кубик и на полный переброс), чтобы наложить заклинание «понос» на стаю русалов.", "result": "В итоге критическая удача — русалы обделались и разбежались.", "sec": 2247, "who_url": "/c/losik/", "reason_html": "Потратила две монеты подряд (на доп. кубик и на полный переброс), чтобы наложить заклинание «понос» на стаю русалов."}, {"t": "0:39:35", "kind": "earn", "who": "Лосик", "actor": "Олеся Иванченко", "to": null, "reason": "Заклинание сработало — комичный план с русалами удался.", "result": null, "sec": 2375, "who_url": "/c/losik/", "reason_html": "Заклинание сработало — комичный план с русалами удался."}, {"t": "0:39:35", "kind": "loot", "who": "Пахом", "actor": "BRB", "to": null, "reason": "При обыске кухни нашёл золотую монету в кармане спящего повара.", "result": null, "sec": 2375, "who_url": "/c/medium-pahom/", "reason_html": "При обыске кухни нашёл золотую монету в кармане спящего повара."}, {"t": "0:55:39", "kind": "spend", "who": "Пшен", "actor": "Дмитрий Журавлёв", "to": null, "reason": "Потратил монету на переброс проверки внимания при осмотре спальни богини Давы (дневник на кровати).", "result": null, "sec": 3339, "who_url": "/c/pshen/", "reason_html": "Потратил монету на переброс проверки внимания при осмотре спальни богини Давы (дневник на кровати)."}, {"t": "1:13:59", "kind": "earn", "who": "Лосик", "actor": "Олеся Иванченко", "to": null, "reason": "Успешно обманула (с преимуществом) жительницу острова, убедив её раскрыть правду о богине Даве — сильная речь.", "result": null, "sec": 4439, "who_url": "/c/losik/", "reason_html": "Успешно обманула (с преимуществом) жительницу острова, убедив её раскрыть правду о богине Даве — сильная речь."}, {"t": "1:27:56", "kind": "earn", "who": "Пахом", "actor": "BRB", "to": null, "reason": "Задал разумный вопрос о том, что услышанное за игровым столом становится общим знанием персонажей — мастер согласился.", "result": null, "sec": 5276, "who_url": "/c/medium-pahom/", "reason_html": "Задал разумный вопрос о том, что услышанное за игровым столом становится общим знанием персонажей — мастер согласился."}], "totals": [{"who": "Пахом", "actor": "BRB", "earned": 3, "spent": 0, "img": "img/chars/pahom.webp", "who_url": "/c/medium-pahom/", "actor_url": "/p/brb/"}, {"who": "Талала", "actor": "Гудков", "earned": 1, "spent": 1, "img": "img/chars/talala.webp", "who_url": "/c/gnomka-talala/", "actor_url": "/p/aleksandr-gudkov/"}, {"who": "Лосик", "actor": "Олеся Иванченко", "earned": 2, "spent": 2, "img": " "24", "title": "Чёрный Геленбург", "note_html": "Геленбург — цитадель Тёмного Властелина после предательства <a class=\"ref\" href=\"/c/sfinkterion/\">Сфинктериона<\/a>", "dir": "out", "color": "#C8423B"}, {"key": "27", "label": "27", "title": "Достучаться до небес", "note_html": "Портал в Небесный мир открыт на острове Соблазна", "dir": "back", "color": "#7C5CD6"}, {"key": "31", "label": "31", "title": "Культ Кракена", "note_html": "Остров Соблазна, богиня <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>, портал", "dir": "back", "color": "#7C5CD6"}], "quotes_html": ["«Правило первое: отринь дурное естество. Нельзя убийство, нельзя воровство». — «С этим у нас будут проблемы».", "«Я приняла свои травмы, полюбила себя как женщину, научилась дышать маткой» — <a class=\"ref\" href=\"/c/gnomka-talala/\">Талала<\/a>.", "«Мне надоело быть третьесортной богиней родов и ноготочков. Я заслуживаю большего» — <a class=\"ref\" href=\"/c/dava/\">Дава<\/a>.", "«Большой кристалл, открой большой портал» — <a class=\"ref\" href=\"/c/losik/\">Лосик<\/a>.", "«Скажите, что любите меня!» — «Иди на… не любим»."], "places_html": "<ul>\n<li>Места: остров Соблазна (пирс, пляж с баром, кухня, вилла Давы с бассейном, лобное место, запретный пляж с пещерой, святилище-пагода на скале); Чёрный Геленбург (упоминается); каторжный лагерь Фогельнест (упоминается).<\/li>\n<li>Фракции: островитяне — поклонники Давы; русалы-охранники; Небесный мир и его пантеон (боги как «крылатые черви» в книге Давы); демоны Тёмного Властелина.<\/li>\n<li>Артефакты: <b>большой кристалл телепортации<\/b> (стабилизирован богиней и стал порталом в Небесный мир); малый кристалл в ладони <a class=\"ref\" href=\"/c/medium-pahom/\">Пахома<\/a>; «Книга превращений и развращений»; дневник <a class=\"ref\" href=\"/c/kasper/\">Каспера<\/a> (с вырванными страницами); «История одной прекрасной богини»; четырёхрукая статуя Давы; жемчужина дружбы русалов; грязный горн; козлиная шкура Кики; «стул развращения» Каспера; алмазный молот Пахом
